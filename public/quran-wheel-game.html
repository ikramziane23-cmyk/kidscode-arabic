۪ىٰۖ","قَالُواْ يَٰمُوس۪ىٰٓ إِمَّآ أَن تُلْقِيَ وَإِمَّآ أَن نَّكُونَ أَوَّلَ مَنَ اَلْق۪ىٰۖ","قَالَ بَلَ اَلْقُواْۖ فَإِذَا حِبَالُهُمْ وَعِصِيُّهُمْ يُخَيَّلُ إِلَيْهِ مِن سِحْرِهِمُۥٓ أَنَّهَا تَسْع۪ىٰۖ","فَأَوْجَسَ فِے نَفْسِهِۦ خِيفَةٗ مُّوس۪ىٰۖ","قُلْنَا لَا تَخَفِ اِنَّكَ أَنتَ اَ۬لَاعْل۪ىٰۖ","وَأَلْقِ مَا فِے يَمِينِكَ تَلَقَّفْ مَا صَنَعُوٓاْۖ إِنَّمَا صَنَعُواْ كَيْدُ سَٰحِرٖۖ وَلَا يُفْلِحُ اُ۬لسَّاحِرُ حَيْثُ أَت۪ىٰۖ","فَأُلْقِيَ اَ۬لسَّحَرَةُ سُجَّداٗۖ قَالُوٓاْ ءَامَنَّا بِرَبِّ هَٰرُونَ وَمُوس۪ىٰۖ","قَالَ ءَاٰ۬مَنتُمْ لَهُۥ قَبْلَ أَنَ اٰذَنَ لَكُمُۥٓ إِنَّهُۥ لَكَبِيرُكُمُ اُ۬لذِے عَلَّمَكُمُ اُ۬لسِّحْرَۖ فَلَأُقَطِّعَنَّ أَيْدِيَكُمْ وَأَرْجُلَكُم مِّنْ خِلَٰفٖ وَلَأُصَلِّبَنَّكُمْ فِے جُذُوعِ اِ۬لنَّخْلِ وَلَتَعْلَمُنَّ أَيُّنَآ أَشَدُّ عَذَاباٗ وَأَبْق۪ىٰۖ","۞ قَالُواْ لَن نُّوثِرَكَ عَلَىٰ مَا جَآءَنَا مِنَ اَ۬لْبَيِّنَٰتِ وَالذِے فَطَرَنَاۖ فَاقْضِ مَآ أَنتَ قَاضٍۖ اِنَّمَا تَقْضِے هَٰذِهِ اِ۬لْحَيَوٰةَ اَ۬لدُّنْي۪آۖ","إِنَّآ ءَامَنَّا بِرَبِّنَا لِيَغْفِرَ لَنَا خَطَٰيٰ۪نَا وَمَآ أَكْرَهْتَنَا عَلَيْهِ مِنَ اَ۬لسِّحْرِۖ وَاللَّهُ خَيْرٞ وَأَبْق۪ىٰٓۖ","إِنَّهُۥ مَنْ يَّاتِ رَبَّهُۥ مُجْرِماٗ فَإِنَّ لَهُۥ جَهَنَّمَ لَا يَمُوتُ فِيهَا وَلَا يَحْي۪ىٰۖ","وَمَنْ يَّاتِهِۦ مُومِناٗ قَدْ عَمِلَ اَ۬لصَّٰلِحَٰتِ فَأُوْلَٰٓئِكَ لَهُمُ اُ۬لدَّرَجَٰتُ اُ۬لْعُل۪ىٰۖ","جَنَّٰتُ عَدْنٖ تَجْرِے مِن تَحْتِهَا اَ۬لَانْهَٰرُ خَٰلِدِينَ فِيهَاۖ وَذَٰلِكَ جَزَآءُ مَن تَزَكّ۪ىٰۖ","وَلَقَدَ اَوْحَيْنَآ إِلَىٰ مُوس۪ىٰٓ أَنِ اِ۪سْرِ بِعِبَادِے فَاضْرِبْ لَهُمْ طَرِيقاٗ فِے اِ۬لْبَحْرِ يَبَساٗ لَّا تَخَٰفُ دَرَكاٗ وَلَا تَخْش۪ىٰۖ","فَأَتْبَعَهُمْ فِرْعَوْنُ بِجُنُودِهِۦ فَغَشِيَهُم مِّنَ اَ۬لْيَمِّ مَا غَشِيَهُمْۖ وَأَضَلَّ فِرْعَوْنُ قَوْمَهُۥ وَمَا هَد۪ىٰۖ","يَٰبَنِےٓ إِسْرَآءِيلَ قَدَ اَنجَيْنَٰكُم مِّنْ عَدُوِّكُمْ وَوَٰعَدْنَٰكُمْ جَانِبَ اَ۬لطُّورِ اِ۬لَايْمَنَ وَنَزَّلْنَا عَلَيْكُمُ اُ۬لْمَنَّ وَالسَّلْو۪ىٰۖ","كُلُواْ مِن طَيِّبَٰتِ مَا رَزَقْنَٰكُمْ وَلَا تَطْغَوْاْ فِيهِ فَيَحِلَّ عَلَيْكُمْ غَضَبِےۖ وَمَنْ يَّحْلِلْ عَلَيْهِ غَضَبِے فَقَدْ هَو۪ىٰۖ","وَإِنِّے لَغَفَّارٞ لِّمَن تَابَ وَءَامَنَ وَعَمِلَ صَٰلِحاٗ ثُمَّ اَ۪هْتَد۪ىٰۖ","۞ وَمَآ أَعْجَلَكَ عَن قَوْمِكَ يَٰمُوس۪ىٰۖ","قَالَ هُمُۥٓ أُوْلَآءِ عَلَىٰٓ أَثَرِے وَعَجِلْتُ إِلَيْكَ رَبِّ لِتَرْض۪ىٰۖ","قَالَ فَإِنَّا قَدْ فَتَنَّا قَوْمَكَ مِنۢ بَعْدِكَ وَأَضَلَّهُمُ اُ۬لسَّامِرِيُّۖ","فَرَجَعَ مُوس۪ىٰٓ إِلَىٰ قَوْمِهِۦ غَضْبَٰنَ أَسِفاٗۖ قَالَ يَٰقَوْمِ أَلَمْ يَعِدْكُمْ رَبُّكُمْ وَعْداً حَسَناًۖ","اَفَطَالَ عَلَيْكُمُ اُ۬لْعَهْدُ أَمَ اَرَدتُّمُۥٓ أَنْ يَّحِلَّ عَلَيْكُمْ غَضَبٞ مِّن رَّبِّكُمْ فَأَخْلَفْتُم مَّوْعِدِےۖ","قَالُواْ مَآ أَخْلَفْنَا مَوْعِدَكَ بِمَلْكِنَا وَلَٰكِنَّا حُمِّلْنَآ أَوْزَاراٗ مِّن زِينَةِ اِ۬لْقَوْمِ فَقَذَفْنَٰهَا فَكَذَٰلِكَ أَلْقَى اَ۬لسَّامِرِيُّۖ  فَأَخْرَجَ لَهُمْ عِجْلاٗ جَسَداٗ لَّهُۥ خُوَارٞ فَقَالُواْ هَٰذَآ إِلَٰهُكُمْ وَإِلَٰهُ مُوس۪ىٰ فَنَسِيَۖ","أَفَلَا يَرَوْنَ أَلَّا يَرْجِعُ إِلَيْهِمْ قَوْلاٗ","وَلَا يَمْلِكُ لَهُمْ ضَرّاٗ وَلَا نَفْعاٗۖ","وَلَقَدْ قَالَ لَهُمْ هَٰرُونُ مِن قَبْلُ يَٰقَوْمِ إِنَّمَا فُتِنتُم بِهِۦۖ وَإِنَّ رَبَّكُمُ اُ۬لرَّحْمَٰنُ فَاتَّبِعُونِے وَأَطِيعُوٓاْ أَمْرِےۖ","قَالُواْ لَن نَّبْرَحَ عَلَيْهِ عَٰكِفِينَ حَتَّىٰ يَرْجِعَ إِلَيْنَا مُوس۪ىٰۖ","قَالَ يَٰهَٰرُونُ مَا مَنَعَكَ إِذْ رَأَيْتَهُمْ ضَلُّوٓاْ أَلَّا تَتَّبِعَنِۦٓ أَفَعَصَيْتَ أَمْرِےۖ","قَالَ يَبْنَؤُمَّ لَا تَاخُذْ بِلِحْيَتِے وَلَا بِرَأْسِيَ إِنِّے خَشِيتُ أَن تَقُولَ فَرَّقْتَ بَيْنَ بَنِےٓ إِسْرَآءِيلَ وَلَمْ تَرْقُبْ قَوْلِےۖ","قَالَ فَمَا خَطْبُكَ يَٰسَٰمِرِيُّۖ","قَالَ بَصُرْتُ بِمَا لَمْ يَبْصُرُواْ بِهِۦ فَقَبَضْتُ قَبْضَةٗ مِّنَ اَثَرِ اِ۬لرَّسُولِ فَنَبَذْتُهَا وَكَذَٰلِكَ سَوَّلَتْ لِے نَفْسِےۖ","۞ قَالَ فَاذْهَبْ فَإِنَّ لَكَ فِے اِ۬لْحَيَوٰةِ أَن تَقُولَ لَا مِسَاسَۖ وَإِنَّ لَكَ مَوْعِداٗ لَّن تُخْلَفَهُۥۖ وَانظُرِ اِلَىٰٓ إِلَٰهِكَ اَ۬لذِے ظَلْتَ عَلَيْهِ عَاكِفاٗ لَّنُحَرِّقَنَّهُۥ ثُمَّ لَنَنسِفَنَّهُۥ فِے اِ۬لْيَمِّ نَسْفاًۖ","اِنَّمَآ إِلَٰهُكُمُ اُ۬للَّهُ اُ۬لذِے لَآ إِلَٰهَ إِلَّا هُوَۖ وَسِعَ كُلَّ شَےْءٍ عِلْماٗۖ","كَذَٰلِكَ نَقُصُّ عَلَيْكَ مِنَ اَنۢبَآءِ مَا قَدْ سَبَقَۖ وَقَدَ اٰتَيْنَٰكَ مِن لَّدُنَّا ذِكْراٗۖ","مَّنَ اَعْرَضَ عَنْهُ فَإِنَّهُۥ يَحْمِلُ يَوْمَ اَ۬لْقِيَٰمَةِ وِزْراً","خَٰلِدِينَ فِيهِۖ وَسَآءَ لَهُمْ يَوْمَ اَ۬لْقِيَٰمَةِ حِمْلاٗۖ","يَوْمَ يُنفَخُ فِے اِ۬لصُّورِ وَنَحْشُرُ اُ۬لْمُجْرِمِينَ يَوْمَئِذٖ زُرْقاٗ","يَتَخَٰفَتُونَ بَيْنَهُمُۥٓ إِن لَّبِثْتُمُۥٓ إِلَّا عَشْراٗۖ","نَّحْنُ أَعْلَمُ بِمَا يَقُولُونَ إِذْ يَقُولُ أَمْثَلُهُمْ طَرِيقَةً اِن لَّبِثْتُمُۥٓ إِلَّا يَوْماٗۖ","وَيَسْـَٔلُونَكَ عَنِ اِ۬لْجِبَالِ فَقُلْ يَنسِفُهَا رَبِّے نَسْفاٗ","فَيَذَرُهَا قَاعاٗ صَفْصَفاٗ لَّا تَر۪ىٰ فِيهَا عِوَجاٗ وَلَآ أَمْتاٗۖ","يَوْمَئِذٖ يَتَّبِعُونَ اَ۬لدَّاعِيَ لَا عِوَجَ لَهُۥۖ وَخَشَعَتِ اِ۬لَاصْوَاتُ لِلرَّحْمَٰنِ فَلَا تَسْمَعُ إِلَّا هَمْساٗۖ","يَوْمَئِذٖ لَّا تَنفَعُ اُ۬لشَفَٰعَةُ إِلَّا مَنَ اَذِنَ لَهُ اُ۬لرَّحْمَٰنُ وَرَضِيَ لَهُۥ قَوْلاٗۖ","يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ وَلَا يُحِيطُونَ بِهِۦ عِلْماٗۖ","۞ وَعَنَتِ اِ۬لْوُجُوهُ لِلْحَيِّ اِ۬لْقَيُّومِۖ وَقَدْ خَابَ مَنْ حَمَلَ ظُلْماٗۖ","وَمَنْ يَّعْمَلْ مِنَ اَ۬لصَّٰلِحَٰتِ وَهُوَ مُومِنٞ فَلَا يَخَافُ ظُلْماٗ وَلَا هَضْماٗۖ","وَكَذَٰلِكَ أَنزَلْنَٰهُ قُرْءَاناً عَرَبِيّاٗ وَصَرَّفْنَا فِيهِ مِنَ اَ۬لْوَعِيدِ لَعَلَّهُمْ يَتَّقُونَ أَوْ يُحْدِثُ لَهُمْ ذِكْراٗۖ","فَتَعَٰلَى اَ۬للَّهُ اُ۬لْمَلِكُ اُ۬لْحَقُّۖ وَلَا تَعْجَلْ بِالْقُرْءَانِ مِن قَبْلِ أَنْ يُّقْض۪ىٰٓ إِلَيْكَ وَحْيُهُۥۖ وَقُل رَّبِّ زِدْنِے عِلْماٗۖ","وَلَقَدْ عَهِدْنَآ إِلَىٰٓ ءَادَمَ مِن قَبْلُ فَنَسِيَ وَلَمْ نَجِدْ لَهُۥ عَزْماٗۖ","وَإِذْ قُلْنَا لِلْمَلَٰٓئِكَةِ اِ۟سْجُدُواْ لِأٓدَمَ فَسَجَدُوٓاْۖ إِلَّآ إِبْلِيسَ أَب۪ىٰۖ","فَقُلْنَا يَٰٓـَٔادَمُ إِنَّ هَٰذَا عَدُوّٞ لَّكَ وَلِزَوْجِكَ فَلَا يُخْرِجَنَّكُمَا مِنَ اَ۬لْجَنَّةِ فَتَشْق۪ىٰٓۖ","إِنَّ لَكَ أَلَّا تَجُوعَ فِيهَا وَلَا تَعْر۪ىٰۖ","وَإِنَّكَ لَا تَظْمَؤُاْ فِيهَا وَلَا تَضْح۪ىٰۖ","فَوَسْوَسَ إِلَيْهِ اِ۬لشَّيْطَٰنُۖ قَالَ يَٰٓـَٔادَمُ هَلَ اَدُلُّكَ عَلَىٰ شَجَرَةِ اِ۬لْخُلْدِ وَمُلْكٖ لَّا يَبْل۪ىٰۖ","فَأَكَلَا مِنْهَا فَبَدَتْ لَهُمَا سَوْءَٰتُهُمَا وَطَفِقَا يَخْصِفَٰنِ عَلَيْهِمَا مِنْ وَّرَقِ اِ۬لْجَنَّةِۖ وَعَص۪ىٰٓ ءَادَمُ رَبَّهُۥ فَغَو۪ىٰۖ","ثُمَّ اَ۪جْتَبٰ۪هُ رَبُّهُۥ فَتَابَ عَلَيْهِ وَهَد۪ىٰۖ","قَالَ اَ۪هْبِطَا مِنْهَا جَمِيعاَۢۖ بَعْضُكُمْ لِبَعْضٍ عَدُوّٞۖ فَإِمَّا يَاتِيَنَّكُم مِّنِّے هُدىٗ","فَمَنِ اِ۪تَّبَعَ هُد۪ايَ فَلَا يَضِلُّ وَلَا يَشْق۪ىٰۖ","وَمَنَ اَعْرَضَ عَن ذِكْرِے فَإِنَّ لَهُۥ مَعِيشَةٗ ضَنكاٗ وَنَحْشُرُهُۥ يَوْمَ اَ۬لْقِيَٰمَةِ أَعْم۪ىٰۖ","قَالَ رَبِّ لِمَ حَشَرْتَنِيَ أَعْم۪ىٰ وَقَدْ كُنتُ بَصِيراٗۖ","۞ قَالَ كَذَٰلِكَ أَتَتْكَ ءَايَٰتُنَا فَنَسِيتَهَاۖ وَكَذَٰلِكَ اَ۬لْيَوْمَ تُنس۪ىٰۖ","وَكَذَٰلِكَ نَجْزِے مَنَ اَسْرَفَ وَلَمْ يُومِنۢ بِـَٔايَٰتِ رَبِّهِۦۖ وَلَعَذَابُ اُ۬لَاخِرَةِ أَشَدُّ وَأَبْق۪ىٰٓۖ","أَفَلَمْ يَهْدِ لَهُمْ كَمَ اَهْلَكْنَا قَبْلَهُم مِّنَ اَ۬لْقُرُونِ يَمْشُونَ فِے مَسَٰكِنِهِمُۥٓۖ إِنَّ فِے ذَٰلِكَ لَأٓيَٰتٖ لِّأُوْلِے اِ۬لنُّه۪ىٰۖ","وَلَوْلَا كَلِمَةٞ سَبَقَتْ مِن رَّبِّكَ لَكَانَ لِزَاماٗ وَأَجَلٞ مُّسَمّىٗۖ","فَاصْبِرْ عَلَىٰ مَا يَقُولُونَۖ وَسَبِّحْ بِحَمْدِ رَبِّكَ قَبْلَ طُلُوعِ اِ۬لشَّمْسِ وَقَبْلَ غُرُوبِهَاۖ وَمِنَ اٰنَآءِےْ اِ۬ليْلِ فَسَبِّحْ وَأَطْرَافَ اَ۬لنَّه۪ارِ لَعَلَّكَ تَرْض۪ىٰۖ","وَلَا تَمُدَّنَّ عَيْنَيْكَ إِلَىٰ مَا مَتَّعْنَا بِهِۦٓ أَزْوَٰجاٗ مِّنْهُمْ زَهْرَةَ اَ۬لْحَيَوٰةِ اِ۬لدُّنْي۪ا","لِنَفْتِنَهُمْ فِيهِۖ وَرِزْقُ رَبِّكَ خَيْرٞ وَأَبْق۪ىٰۖ","وَامُرَ اَهْلَكَ بِالصَّلَوٰةِ وَاصْطَبِرْ عَلَيْهَاۖ لَا نَسْـَٔلُكَ رِزْقاٗۖ نَّحْنُ نَرْزُقُكَۖ وَالْعَٰقِبَةُ لِلتَّقْو۪ىٰۖ","وَقَالُواْ لَوْلَا يَاتِينَا بِـَٔايَةٖ مِّن رَّبِّهِۦٓۖ أَوَلَمْ تَاتِهِم بَيِّنَةُ مَا فِے اِ۬لصُّحُفِ اِ۬لُاول۪ىٰۖ","وَلَوَ اَنَّآ أَهْلَكْنَٰهُم بِعَذَابٖ مِّن قَبْلِهِۦ لَقَالُواْ رَبَّنَا لَوْلَآ أَرْسَلْتَ إِلَيْنَا رَسُولاٗ فَنَتَّبِعَ ءَايَٰتِكَ مِن قَبْلِ أَن نَّذِلَّ وَنَخْز۪ىٰۖ","قُلْ كُلّٞ مُّتَرَبِّصٞ فَتَرَبَّصُواْۖ فَسَتَعْلَمُونَ مَنَ اَصْحَٰبُ اُ۬لصِّرَٰطِ اِ۬لسَّوِيِّ وَمَنِ اِ۪هْتَدَىۖ"]],["الأنبياء",["اَ۪قْتَرَبَ لِلنَّاسِ حِسَابُهُمْ وَهُمْ فِے غَفْلَةٖ مُّعْرِضُونَۖ","مَا يَاتِيهِم مِّن ذِكْرٖ مِّن رَّبِّهِم مُّحْدَثٍ اِلَّا اَ۪سْتَمَعُوهُ وَهُمْ يَلْعَبُونَ","لَٰهِيَةٗ قُلُوبُهُمْۖ وَأَسَرُّواْ اُ۬لنَّجْوَى اَ۬لذِينَ ظَلَمُواْ هَلْ هَٰذَآ إِلَّا بَشَرٞ مِّثْلُكُمُۥٓۖ أَفَتَاتُونَ اَ۬لسِّحْرَ وَأَنتُمْ تُبْصِرُونَۖ","قُل رَّبِّے يَعْلَمُ اُ۬لْقَوْلَ فِے اِ۬لسَّمَآءِ وَالَارْضِۖ وَهُوَ اَ۬لسَّمِيعُ اُ۬لْعَلِيمُۖ","بَلْ قَالُوٓاْ أَضْغَٰثُ أَحْلَٰمِۢ بَلِ اِ۪فْتَر۪يٰهُ بَلْ هُوَ شَاعِرٞۖ فَلْيَاتِنَا بِـَٔايَةٖ كَمَآ أُرْسِلَ اَ۬لَاوَّلُونَۖ","مَآ ءَامَنَتْ قَبْلَهُم مِّن قَرْيَةٍ اَهْلَكْنَٰهَآۖ أَفَهُمْ يُومِنُونَۖ","وَمَآ أَرْسَلْنَا قَبْلَكَ إِلَّا رِجَالاٗ يُوح۪ىٰٓ إِلَيْهِمْ فَسْـَٔلُوٓاْ أَهْلَ اَ۬لذِّكْرِ إِن كُنتُمْ لَا تَعْلَمُونَۖ","وَمَا جَعَلْنَٰهُمْ جَسَداٗ لَّا يَاكُلُونَ اَ۬لطَّعَامَۖ وَمَا كَانُواْ خَٰلِدِينَۖ","ثُمَّ صَدَقْنَٰهُمُ اُ۬لْوَعْدَ فَأَنجَيْنَٰهُمْ وَمَن نَّشَآءُ وَأَهْلَكْنَا اَ۬لْمُسْرِفِينَۖ","لَقَدَ اَنزَلْنَآ إِلَيْكُمْ كِتَٰباٗ فِيهِ ذِكْرُكُمُۥٓۖ أَفَلَا تَعْقِلُونَۖ","وَكَمْ قَصَمْنَا مِن قَرْيَةٖ كَانَت ظَّالِمَةٗ وَأَنشَأْنَا بَعْدَهَا قَوْماً اٰخَرِينَۖ","فَلَمَّآ أَحَسُّواْ بَأْسَنَآ إِذَا هُم مِّنْهَا يَرْكُضُونَۖ","لَا تَرْكُضُواْ وَارْجِعُوٓاْ إِلَىٰ مَآ أُتْرِفْتُمْ فِيهِ وَمَسَٰكِنِكُمْ لَعَلَّكُمْ تُسْـَٔلُونَۖ","قَالُواْ يَٰوَيْلَنَآ إِنَّا كُنَّا ظَٰلِمِينَۖ","۞ فَمَا زَالَت تِّلْكَ دَعْو۪يٰهُمْ حَتَّىٰ جَعَلْنَٰهُمْ حَصِيداً خَٰمِدِينَۖ","وَمَا خَلَقْنَا اَ۬لسَّمَآءَ وَالَارْضَ وَمَا بَيْنَهُمَا لَٰعِبِينَۖ","لَوَ اَرَدْنَآ أَن نَّتَّخِذَ لَهْواٗ لَّاتَّخَذْنَٰهُ مِن لَّدُنَّآۖ إِن كُنَّا فَٰعِلِينَۖ","بَلْ نَقْذِفُ بِالْحَقِّ عَلَى اَ۬لْبَٰطِلِ فَيَدْمَغُهُۥ فَإِذَا هُوَ زَاهِقٞۖ وَلَكُمُ اُ۬لْوَيْلُ مِمَّا تَصِفُونَۖ","وَلَهُۥ مَن فِے اِ۬لسَّمَٰوَٰتِ وَالَارْضِۖ وَمَنْ عِندَهُۥ لَا يَسْتَكْبِرُونَ عَنْ عِبَادَتِهِۦ وَلَا يَسْتَحْسِرُونَۖ","يُسَبِّحُونَ اَ۬ليْلَ وَالنَّهَارَ لَا يَفْتُرُونَۖ","أَمِ اِ۪تَّخَذُوٓاْ ءَالِهَةٗ مِّنَ اَ۬لَارْضِ هُمْ يُنشِرُونَۖ","لَوْ كَانَ فِيهِمَآ ءَالِهَةٌ اِلَّا اَ۬للَّهُ لَفَسَدَتَاۖ فَسُبْحَٰنَ اَ۬للَّهِ رَبِّ اِ۬لْعَرْشِ عَمَّا يَصِفُونَۖ","لَا يُسْـَٔلُ عَمَّا يَفْعَلُۖ وَهُمْ يُسْـَٔلُونَۖ","أَمِ اِ۪تَّخَذُواْ مِن دُونِهِۦٓ ءَالِهَةٗۖ قُلْ هَاتُواْ بُرْهَٰنَكُمْۖ هَٰذَا ذِكْرُ مَن مَّعِے وَذِكْرُ مَن قَبْلِےۖ بَلَ اَكْثَرُهُمْ لَا يَعْلَمُونَ اَ۬لْحَقَّ فَهُم مُّعْرِضُونَۖ","وَمَآ أَرْسَلْنَا مِن قَبْلِكَ مِن رَّسُولٍ اِلَّا يُوح۪ىٰٓ إِلَيْهِ أَنَّهُۥ لَآ إِلَٰهَ إِلَّآ أَنَا فَاعْبُدُونِۖ","وَقَالُواْ اُ۪تَّخَذَ اَ۬لرَّحْمَٰنُ وَلَداٗۖ سُبْحَٰنَهُۥۖ بَلْ عِبَادٞ مُّكْرَمُونَۖ","لَا يَسْبِقُونَهُۥ بِالْقَوْلِ وَهُم بِأَمْرِهِۦ يَعْمَلُونَۖ","يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْۖ وَلَا يَشْفَعُونَ إِلَّا لِمَنِ اِ۪رْتَض۪ىٰ وَهُم مِّنْ خَشْيَتِهِۦ مُشْفِقُونَۖ","وَمَنْ يَّقُلْ مِنْهُمُۥٓ إِنِّيَ إِلَٰهٞ مِّن دُونِهِۦ فَذَٰلِكَ نَجْزِيهِ جَهَنَّمَۖ كَذَٰلِكَ نَجْزِے اِ۬لظَّٰلِمِينَۖ","۞ أَوَلَمْ يَرَ اَ۬لذِينَ كَفَرُوٓاْ أَنَّ اَ۬لسَّمَٰوَٰتِ وَالَارْضَ كَانَتَا رَتْقاٗ فَفَتَقْنَٰهُمَاۖ وَجَعَلْنَا مِنَ اَ۬لْمَآءِ كُلَّ شَےْءٍ حَيٍّۖ اَفَلَا يُومِنُونَۖ","وَجَعَلْنَا فِے اِ۬لَارْضِ رَوَٰسِيَ أَن تَمِيدَ بِهِمْۖ وَجَعَلْنَا فِيهَا فِجَاجاٗ سُبُلاٗ لَّعَلَّهُمْ يَهْتَدُونَۖ","وَجَعَلْنَا اَ۬لسَّمَآءَ سَقْفاٗ مَّحْفُوظاٗۖ وَهُمْ عَنَ اٰيَٰتِهَا مُعْرِضُونَۖ","وَهُوَ اَ۬لذِے خَلَقَ اَ۬ليْلَ وَالنَّهَارَ وَالشَّمْسَ وَالْقَمَرَۖ كُلّٞ فِے فَلَكٖ يَسْبَحُونَۖ","وَمَا جَعَلْنَا لِبَشَرٖ مِّن قَبْلِكَ اَ۬لْخُلْدَۖ أَفَإِيْن مِّتَّ فَهُمُ اُ۬لْخَٰلِدُونَۖ","كُلُّ نَفْسٖ ذَآئِقَةُ اُ۬لْمَوْتِۖ وَنَبْلُوكُم بِالشَّرِّ وَالْخَيْرِ فِتْنَةٗۖ وَإِلَيْنَا تُرْجَعُونَۖ","وَإِذَا ر۪ء۪اكَ اَ۬لذِينَ كَفَرُوٓاْ إِنْ يَّتَّخِذُونَكَ إِلَّا هُزُؤاًۖ اَهَٰذَا اَ۬لذِے يَذْكُرُ ءَالِهَتَكُمْ وَهُم بِذِكْرِ اِ۬لرَّحْمَٰنِ هُمْ كَٰفِرُونَۖ","خُلِقَ اَ۬لِانسَٰنُ مِنْ عَجَلٖۖ سَأُوْرِيكُمُۥٓ ءَايَٰتِے فَلَا تَسْتَعْجِلُونِۖ","وَيَقُولُونَ مَت۪ىٰ هَٰذَا اَ۬لْوَعْدُ إِن كُنتُمْ صَٰدِقِينَۖ","لَوْ يَعْلَمُ اُ۬لذِينَ كَفَرُواْ حِينَ لَا يَكُفُّونَ عَنْ وُّجُوهِهِمُ اُ۬لنَّارَ وَلَا عَن ظُهُورِهِمْ وَلَا هُمْ يُنصَرُونَۖ","بَلْ تَاتِيهِم بَغْتَةٗ فَتَبْهَتُهُمْ فَلَا يَسْتَطِيعُونَ رَدَّهَا وَلَا هُمْ يُنظَرُونَۖ","وَلَقَدُ اُ۟سْتُهْزِۓَ بِرُسُلٖ مِّن قَبْلِكَ فَحَاقَ بِالذِينَ سَخِرُواْ مِنْهُم مَّا كَانُواْ بِهِۦ يَسْتَهْزِءُونَۖ","۞ قُلْ مَنْ يَّكْلَؤُكُم بِاليْلِ وَالنَّه۪ارِ مِنَ اَ۬لرَّحْمَٰنِۖ بَلْ هُمْ عَن ذِكْرِ رَبِّهِم مُّعْرِضُونَۖ","أَمْ لَهُمُۥٓ ءَالِهَةٞ تَمْنَعُهُم مِّن دُونِنَاۖ لَا يَسْتَطِيعُونَ نَصْرَ أَنفُسِهِمْ وَلَا هُم مِّنَّا يُصْحَبُونَۖ","بَلْ مَتَّعْنَا هَٰٓؤُلَآءِ وَءَابَآءَهُمْ حَتَّىٰ طَالَ عَلَيْهِمُ اُ۬لْعُمُرُۖ أَفَلَا يَرَوْنَ أَنَّا نَاتِے اِ۬لَارْضَ نَنقُصُهَا مِنَ اَطْرَافِهَآۖ أَفَهُمُ اُ۬لْغَٰلِبُونَۖ","قُلِ اِنَّمَآ أُنذِرُكُم بِالْوَحْيِۖ وَلَا يَسْمَعُ اُ۬لصُّمُّ اُ۬لدُّعَآءَ ا۪ذَا مَا يُنذَرُونَۖ","وَلَئِن مَّسَّتْهُمْ نَفْحَةٞ مِّنْ عَذَابِ رَبِّكَ لَيَقُولُنَّ يَٰوَيْلَنَآ إِنَّا كُنَّا ظَٰلِمِينَۖ","وَنَضَعُ اُ۬لْمَوَٰزِينَ اَ۬لْقِسْطَ لِيَوْمِ اِ۬لْقِيَٰمَةِ فَلَا تُظْلَمُ نَفْسٞ شَئْاٗۖ وَإِن كَانَ مِثْقَالُ حَبَّةٖ مِّنْ خَرْدَلٍ اَتَيْنَا بِهَا وَكَف۪ىٰ بِنَا حَٰسِبِينَۖ","وَلَقَدَ اٰتَيْنَا مُوس۪ىٰ وَهَٰرُونَ اَ۬لْفُرْقَانَ وَضِيَآءٗ وَذِكْراٗ لِّلْمُتَّقِينَ","اَ۬لذِينَ يَخْشَوْنَ رَبَّهُم بِالْغَيْبِ وَهُم مِّنَ اَ۬لسَّاعَةِ مُشْفِقُونَۖ","وَهَٰذَا ذِكْرٞ مُّبَٰرَكٌ اَنزَلْنَٰهُۖ أَفَأَنتُمْ لَهُۥ مُنكِرُونَۖ","۞ وَلَقَدَ اٰتَيْنَآ إِبْرَٰهِيمَ رُشْدَهُۥ مِن قَبْلُ وَكُنَّا بِهِۦ عَٰلِمِينَۖ","إِذْ قَالَ لِأَبِيهِ وَقَوْمِهِۦ مَا هَٰذِهِ اِ۬لتَّمَاثِيلُ اُ۬لتِےٓ أَنتُمْ لَهَا عَٰكِفُونَۖ","قَالُواْ وَجَدْنَآ ءَابَآءَنَا لَهَا عَٰبِدِينَۖ","قَالَ لَقَدْ كُنتُمُۥٓ أَنتُمْ وَءَابَآؤُكُمْ فِے ضَلَٰلٖ مُّبِينٖۖ","قَالُوٓاْ أَجِئْتَنَا بِالْحَقِّ أَمَ اَنتَ مِنَ اَ۬للَّٰعِبِينَۖ","قَالَ بَل رَّبُّكُمْ رَبُّ اُ۬لسَّمَٰوَٰتِ وَالَارْضِ اِ۬لذِے فَطَرَهُنَّۖ وَأَنَا عَلَىٰ ذَٰلِكُم مِّنَ اَ۬لشَّٰهِدِينَۖ","وَتَاللَّهِ لَأَكِيدَنَّ أَصْنَٰمَكُم بَعْدَ أَن تُوَلُّواْ مُدْبِرِينَۖ","فَجَعَلَهُمْ جُذَٰذاً اِلَّا كَبِيراٗ لَّهُمْ لَعَلَّهُمُۥٓ إِلَيْهِ يَرْجِعُونَۖ","قَالُواْ مَن فَعَلَ هَٰذَا بِـَٔالِهَتِنَآ إِنَّهُۥ لَمِنَ اَ۬لظَّٰلِمِينَۖ","قَالُواْ سَمِعْنَا فَتىٗ يَذْكُرُهُمْ يُقَالُ لَهُۥٓ إِبْرَٰهِيمُۖ","قَالُواْ فَاتُواْ بِهِۦ عَلَىٰٓ أَعْيُنِ اِ۬لنَّاسِ لَعَلَّهُمْ يَشْهَدُونَۖ","قَالُوٓاْ ءَآنتَ فَعَلْتَ هَٰذَا بِـَٔالِهَتِنَا يَٰٓإِبْرَٰهِيمُۖ","قَالَ بَلْ فَعَلَهُۥ كَبِيرُهُمْ هَٰذَا فَسْـَٔلُوهُمُۥٓ إِن كَانُواْ يَنطِقُونَۖ","فَرَجَعُوٓاْ إِلَىٰٓ أَنفُسِهِمْ فَقَالُوٓاْ إِنَّكُمُۥٓ أَنتُمُ اُ۬لظَّٰلِمُونَۖ","ثُمَّ نُكِسُواْ عَلَىٰ رُءُوسِهِمْۖ لَقَدْ عَلِمْتَ مَا هَٰٓؤُلَآءِ يَنطِقُونَۖ","قَالَ أَفَتَعْبُدُونَ مِن دُونِ اِ۬للَّهِ مَا لَا يَنفَعُكُمْ شَئْاٗ وَلَا يَضُرُّكُمُۥٓۖ أُفّٖ لَّكُمْ وَلِمَا تَعْبُدُونَ مِن دُونِ اِ۬للَّهِۖ أَفَلَا تَعْقِلُونَۖ","قَالُواْ حَرِّقُوهُ وَانصُرُوٓاْ ءَالِهَتَكُمُۥٓ إِن كُنتُمْ فَٰعِلِينَۖ","قُلْنَا يَٰنَارُ كُونِے بَرْداٗ وَسَلَٰماً عَلَىٰٓ إِبْرَٰهِيمَۖ","وَأَرَادُواْ بِهِۦ كَيْداٗ فَجَعَلْنَٰهُمُ اُ۬لَاخْسَرِينَۖ","وَنَجَّيْنَٰهُ وَلُوطاً اِلَى اَ۬لَارْضِ اِ۬لتِے بَٰرَكْنَا فِيهَا لِلْعَٰلَمِينَۖ","وَوَهَبْنَا لَهُۥٓ إِسْحَٰقَۖ وَيَعْقُوبَ نَافِلَةٗۖ وَكُلّاٗ جَعَلْنَا صَٰلِحِينَۖ","۞ وَجَعَلْنَٰهُمُۥٓ أَئِمَّةٗ يَهْدُونَ بِأَمْرِنَاۖ وَأَوْحَيْنَآ إِلَيْهِمْ فِعْلَ اَ۬لْخَيْرَٰتِ وَإِقَامَ اَ۬لصَّلَوٰةِ وَإِيتَآءَ اَ۬لزَّكَوٰةِۖ وَكَانُواْ لَنَا عَٰبِدِينَۖ","وَلُوطاً اٰتَيْنَٰهُ حُكْماٗ وَعِلْماٗۖ وَنَجَّيْنَٰهُ مِنَ اَ۬لْقَرْيَةِ اِ۬لتِے كَانَت تَّعْمَلُ اُ۬لْخَبَٰٓئِثَۖ إِنَّهُمْ كَانُواْ قَوْمَ سَوْءٖ فَٰسِقِينَۖ","وَأَدْخَلْنَٰهُ فِے رَحْمَتِنَآۖ إِنَّهُۥ مِنَ اَ۬لصَّٰلِحِينَۖ","وَنُوحاً اِذْ نَاد۪ىٰ مِن قَبْلُ فَاسْتَجَبْنَا لَهُۥ فَنَجَّيْنَٰهُ وَأَهْلَهُۥ مِنَ اَ۬لْكَرْبِ اِ۬لْعَظِيمِۖ","وَنَصَرْنَٰهُ مِنَ اَ۬لْقَوْمِ اِ۬لذِينَ كَذَّبُواْ بِـَٔايَٰتِنَآۖ إِنَّهُمْ كَانُواْ قَوْمَ سَوْءٖ فَأَغْرَقْنَٰهُمُۥٓ أَجْمَعِينَۖ","وَدَاوُۥدَ وَسُلَيْمَٰنَ إِذْ يَحْكُمَٰنِ فِے اِ۬لْحَرْثِ إِذْ نَفَشَتْ فِيهِ غَنَمُ اُ۬لْقَوْمِۖ وَكُنَّا لِحُكْمِهِمْ شَٰهِدِينَۖ","فَفَهَّمْنَٰهَا سُلَيْمَٰنَۖ وَكُلّاً اٰتَيْنَا حُكْماٗ وَعِلْماٗۖ وَسَخَّرْنَا مَعَ دَاوُۥدَ اَ۬لْجِبَالَ يُسَبِّحْنَ وَالطَّيْرَۖ وَكُنَّا فَٰعِلِينَۖ","وَعَلَّمْنَٰهُ صَنْعَةَ لَبُوسٖ لَّكُمْ لِيُحْصِنَكُم مِّنۢ بَأْسِكُمْۖ فَهَلَ اَنتُمْ شَٰكِرُونَۖ","وَلِسُلَيْمَٰنَ اَ۬لرِّيحَ عَاصِفَةٗ تَجْرِے بِأَمْرِهِۦٓ إِلَى اَ۬لَارْضِ اِ۬لتِے بَٰرَكْنَا فِيهَاۖ وَكُنَّا بِكُلِّ شَےْءٍ عَٰلِمِينَۖ","وَمِنَ اَ۬لشَّيَٰطِينِ مَنْ يَّغُوصُونَ لَهُۥ وَيَعْمَلُونَ عَمَلاٗ دُونَ ذَٰلِكَۖ وَكُنَّا لَهُمْ حَٰفِظِينَۖ","وَأَيُّوبَ إِذْ نَاد۪ىٰ رَبَّهُۥٓ أَنِّے مَسَّنِيَ اَ۬لضُّرُّ وَأَنتَ أَرْحَمُ اُ۬لرَّٰحِمِينَۖ","فَاسْتَجَبْنَا لَهُۥ فَكَشَفْنَا مَا بِهِۦ مِن ضُرّٖۖ وَءَاتَيْنَٰهُ أَهْلَهُۥ وَمِثْلَهُم مَّعَهُمْ رَحْمَةٗ مِّنْ عِندِنَا وَذِكْر۪ىٰ لِلْعَٰبِدِينَۖ","وَإِسْمَٰعِيلَ وَإِدْرِيسَ وَذَا اَ۬لْكِفْلِۖ كُلّٞ مِّنَ اَ۬لصَّٰبِرِينَۖ","وَأَدْخَلْنَٰهُمْ فِے رَحْمَتِنَآۖ إِنَّهُم مِّنَ اَ۬لصَّٰلِحِينَۖ","۞ وَذَا اَ۬لنُّونِ إِذ ذَّهَبَ مُغَٰضِباٗ فَظَنَّ أَن لَّن نَّقْدِرَ عَلَيْهِ فَنَاد۪ىٰ فِے اِ۬لظُّلُمَٰتِ أَن لَّآ إِلَٰهَ إِلَّآ أَنتَ سُبْحَٰنَكَ إِنِّے كُنتُ مِنَ اَ۬لظَّٰلِمِينَۖ","فَاسْتَجَبْنَا لَهُۥ وَنَجَّيْنَٰهُ مِنَ اَ۬لْغَمِّۖ وَكَذَٰلِكَ نُۨجِے اِ۬لْمُومِنِينَۖ","وَزَكَرِيَّآءَ ا۪ذْ نَاد۪ىٰ رَبَّهُۥ رَبِّ لَا تَذَرْنِے فَرْداٗ وَأَنتَ خَيْرُ اُ۬لْوَٰرِثِينَۖ","فَاسْتَجَبْنَا لَهُۥ وَوَهَبْنَا لَهُۥ يَحْي۪ىٰ وَأَصْلَحْنَا لَهُۥ زَوْجَهُۥٓۖ إِنَّهُمْ كَانُواْ يُسَٰرِعُونَ فِے اِ۬لْخَيْرَٰتِ وَيَدْعُونَنَا رَغَباٗ وَرَهَباٗ وَكَانُواْ لَنَا خَٰشِعِينَۖ","وَالتِےٓ أَحْصَنَتْ فَرْجَهَا فَنَفَخْنَا فِيهَا مِن رُّوحِنَا وَجَعَلْنَٰهَا وَابْنَهَآ ءَايَةٗ لِّلْعَٰلَمِينَۖ","إِنَّ هَٰذِهِۦٓ أُمَّتُكُمُۥٓ أُمَّةٗ وَٰحِدَةٗۖ وَأَنَا رَبُّكُمْ فَاعْبُدُونِۖ","وَتَقَطَّعُوٓاْ أَمْرَهُم بَيْنَهُمْۖ كُلٌّ اِلَيْنَا رَٰجِعُونَۖ","فَمَنْ يَّعْمَلْ مِنَ اَ۬لصَّٰلِحَٰتِ وَهُوَ مُومِنٞ فَلَا كُفْرَانَ لِسَعْيِهِۦۖ وَإِنَّا لَهُۥ كَٰتِبُونَۖ","وَحَرَٰمٌ عَلَىٰ قَرْيَةٍ اَهْلَكْنَٰهَآ أَنَّهُمْ لَا يَرْجِعُونَۖ","حَتَّىٰٓ إِذَا فُتِحَتْ يَاجُوجُ وَمَاجُوجُ وَهُم مِّن كُلِّ حَدَبٖ يَنسِلُونَ","وَاقْتَرَبَ اَ۬لْوَعْدُ اُ۬لْحَقُّ فَإِذَا هِيَ شَٰخِصَةٌ اَبْصَٰرُ اُ۬لذِينَ كَفَرُواْ يَٰوَيْلَنَا قَدْ كُنَّا فِے غَفْلَةٖ مِّنْ هَٰذَا بَلْ كُنَّا ظَٰلِمِينَۖ","إِنَّكُمْ وَمَا تَعْبُدُونَ مِن دُونِ اِ۬للَّهِ حَصَبُ جَهَنَّمَ أَنتُمْ لَهَا وَٰرِدُونَۖ","لَوْ كَانَ هَٰٓؤُلَآءِ اَ۟لِهَةٗ مَّا وَرَدُوهَاۖ وَكُلّٞ فِيهَا خَٰلِدُونَۖ","لَهُمْ فِيهَا زَفِيرٞ وَهُمْ فِيهَا لَا يَسْمَعُونَۖ","۞ إِنَّ اَ۬لذِينَ سَبَقَتْ لَهُم مِّنَّا اَ۬لْحُسْن۪ىٰٓ أُوْلَٰٓئِكَ عَنْهَا مُبْعَدُونَۖ","لَا يَسْمَعُونَ حَسِيسَهَا وَهُمْ فِے مَا اَ۪شْتَهَتَ اَنفُسُهُمْ خَٰلِدُونَۖ","لَا يَحْزُنُهُمُ اُ۬لْفَزَعُ اُ۬لَاكْبَرُۖ وَتَتَلَقّ۪يٰهُمُ اُ۬لْمَلَٰٓئِكَةُ هَٰذَا يَوْمُكُمُ اُ۬لذِے كُنتُمْ تُوعَدُونَۖ","يَوْمَ نَطْوِے اِ۬لسَّمَآءَ كَطَيِّ اِ۬لسِّجِلِّ لِلْكِتَٰبِۖ كَمَا بَدَأْنَآ أَوَّلَ خَلْقٖ نُّعِيدُهُۥۖ وَعْداً عَلَيْنَآۖ إِنَّا كُنَّا فَٰعِلِينَۖ","وَلَقَدْ كَتَبْنَا فِے اِ۬لزَّبُورِ مِنۢ بَعْدِ اِ۬لذِّكْرِ أَنَّ اَ۬لَارْضَ يَرِثُهَا عِبَادِيَ اَ۬لصَّٰلِحُونَۖ","إِنَّ فِے هَٰذَا لَبَلَٰغاٗ لِّقَوْمٍ عَٰبِدِينَۖ","وَمَآ أَرْسَلْنَٰكَ إِلَّا رَحْمَةٗ لِّلْعَٰلَمِينَۖ","قُلِ اِنَّمَا يُوح۪ىٰٓ إِلَيَّ أَنَّمَآ إِلَٰهُكُمُۥٓ إِلَٰهٞ وَٰحِدٞۖ فَهَلَ اَنتُم مُّسْلِمُونَۖ","فَإِن تَوَلَّوْاْ فَقُلَ اٰذَنتُكُمْ عَلَىٰ سَوَآءٖۖ وَإِنَ اَدْرِےٓ أَقَرِيبٌ اَم بَعِيدٞ مَّا تُوعَدُونَۖ","إِنَّهُۥ يَعْلَمُ اُ۬لْجَهْرَ مِنَ اَ۬لْقَوْلِ وَيَعْلَمُ مَا تَكْتُمُونَۖ","وَإِنَ اَدْرِے لَعَلَّهُۥ فِتْنَةٞ لَّكُمْ وَمَتَٰعٌ اِلَىٰ حِينٖۖ","قُل رَّبِّ اِ۟حْكُم بِالْحَقِّۖ وَرَبُّنَا اَ۬لرَّحْمَٰنُ اُ۬لْمُسْتَعَانُ عَلَىٰ مَا تَصِفُونَۖ"]],["الحج",["يَٰٓأَيُّهَا اَ۬لنَّاسُ اُ۪تَّقُواْ رَبَّكُمُۥٓۖ إِنَّ زَلْزَلَةَ اَ۬لسَّاعَةِ شَےْءٌ عَظِيمٞۖ","يَوْمَ تَرَوْنَهَا تَذْهَلُ كُلُّ مُرْضِعَةٍ عَمَّآ أَرْضَعَتْ وَتَضَعُ كُلُّ ذَاتِ حَمْلٍ حَمْلَهَا وَتَرَى اَ۬لنَّاسَ سُكَٰر۪ىٰ وَمَا هُم بِسُكَٰر۪ىٰ وَلَٰكِنَّ عَذَابَ اَ۬للَّهِ شَدِيدٞۖ","وَمِنَ اَ۬لنَّاسِ مَنْ يُّجَٰدِلُ فِے اِ۬للَّهِ بِغَيْرِ عِلْمٖ وَيَتَّبِعُ كُلَّ شَيْطَٰنٖ مَّرِيدٖ","كُتِبَ عَلَيْهِ أَنَّهُۥ مَن تَوَلّ۪اهُ فَأَنَّهُۥ يُضِلُّهُۥ وَيَهْدِيهِ إِلَىٰ عَذَابِ اِ۬لسَّعِيرِۖ","يَٰٓأَيُّهَا اَ۬لنَّاسُ إِن كُنتُمْ فِے رَيْبٖ مِّنَ اَ۬لْبَعْثِ فَإِنَّا خَلَقْنَٰكُم مِّن تُرَابٖ ثُمَّ مِن نُّطْفَةٖ ثُمَّ مِنْ عَلَقَةٖ ثُمَّ مِن مُّضْغَةٖ مُّخَلَّقَةٖ وَغَيْرِ مُخَلَّقَةٖ لِّنُبَيِّنَ لَكُمْۖ وَنُقِرُّ فِے اِ۬لَارْحَامِ مَا نَشَآءُ اِ۪لَىٰٓ أَجَلٖ مُّسَمّىٗۖ ثُمَّ نُخْرِجُكُمْ طِفْلاٗ ثُمَّ لِتَبْلُغُوٓاْ أَشُدَّكُمْۖ وَمِنكُم مَّنْ يُّتَوَفّ۪ىٰ وَمِنكُم مَّنْ يُّرَدُّ إِلَىٰٓ أَرْذَلِ اِ۬لْعُمُرِ لِكَيْلَا يَعْلَمَ مِنۢ بَعْدِ عِلْمٖ شَئْاٗۖ وَتَرَى اَ۬لَارْضَ هَامِدَةٗ فَإِذَآ أَنزَلْنَا عَلَيْهَا اَ۬لْمَآءَ اَ۪هْتَزَّتْ وَرَبَتْ وَأَنۢبَتَتْ مِن كُلِّ زَوْجِۢ بَهِيجٖۖ","ذَٰلِكَ بِأَنَّ اَ۬للَّهَ هُوَ اَ۬لْحَقُّ وَأَنَّهُۥ يُحْيِ اِ۬لْمَوْت۪ىٰ وَأَنَّهُۥ عَلَىٰ كُلِّ شَےْءٖ قَدِيرٞ","وَأَنَّ اَ۬لسَّاعَةَ ءَاتِيَةٞ لَّا رَيْبَ فِيهَا وَأَنَّ اَ۬للَّهَ يَبْعَثُ مَن فِے اِ۬لْقُبُورِۖ","وَمِنَ اَ۬لنَّاسِ مَنْ يُّجَٰدِلُ فِے اِ۬للَّهِ بِغَيْرِ عِلْمٖ وَلَا هُدىٗ وَلَا كِتَٰبٖ مُّنِيرٖ","ثَانِيَ عِطْفِهِۦ لِيُضِلَّ عَن سَبِيلِ اِ۬للَّهِۖ لَهُۥ فِے اِ۬لدُّنْي۪ا خِزْيٞۖ وَنُذِيقُهُۥ يَوْمَ اَ۬لْقِيَٰمَةِ عَذَابَ اَ۬لْحَرِيقِۖ","ذَٰلِكَ بِمَا قَدَّمَتْ يَدَٰكَ وَأَنَّ اَ۬للَّهَ لَيْسَ بِظَلَّٰمٖ لِّلْعَبِيدِۖ","۞ وَمِنَ اَ۬لنَّاسِ مَنْ يَّعْبُدُ اُ۬للَّهَ عَلَىٰ حَرْفٖ فَإِنَ اَصَابَهُۥ خَيْرٌ اِ۪طْمَأَنَّ بِهِۦ وَإِنَ اَصَابَتْهُ فِتْنَةٌ اِ۪نقَلَبَ عَلَىٰ وَجْهِهِۦ خَسِرَ اَ۬لدُّنْي۪ا وَالَاخِرَةَۖ ذَٰلِكَ هُوَ اَ۬لْخُسْرَانُ اُ۬لْمُبِينُۖ","يَدْعُواْ مِن دُونِ اِ۬للَّهِ مَا لَا يَضُرُّهُۥ وَمَا لَا يَنفَعُهُۥۖ ذَٰلِكَ هُوَ اَ۬لضَّلَٰلُ اُ۬لْبَعِيدُۖ","يَدْعُواْۖ لَمَن ضَرُّهُۥٓ أَقْرَبُ مِن نَّفْعِهِۦ لَبِيسَ اَ۬لْمَوْل۪ىٰ وَلَبِيسَ اَ۬لْعَشِيرُۖ","إِنَّ اَ۬للَّهَ يُدْخِلُ اُ۬لذِينَ ءَامَنُواْ وَعَمِلُواْ اُ۬لصَّٰلِحَٰتِ جَنَّٰتٖ تَجْرِے مِن تَحْتِهَا اَ۬لَانْهَٰرُۖ إِنَّ اَ۬للَّهَ يَفْعَلُ مَا يُرِيدُۖ","مَن كَانَ يَظُنُّ أَن لَّنْ يَّنصُرَهُ اُ۬للَّهُ فِے اِ۬لدُّنْي۪ا وَالَاخِرَةِ فَلْيَمْدُدْ بِسَبَبٍ اِلَى اَ۬لسَّمَآءِ ثُمَّ لِيَقْطَعْ فَلْيَنظُرْ هَلْ يُذْهِبَنَّ كَيْدُهُۥ مَا يَغِيظُۖ","وَكَذَٰلِكَ أَنزَلْنَٰهُ ءَايَٰتِۢ بَيِّنَٰتٖۖ وَأَنَّ اَ۬للَّهَ يَهْدِے مَنْ يُّرِيدُۖ","إِنَّ اَ۬لذِينَ ءَامَنُواْ وَالذِينَ هَادُواْ وَالصَّٰبِينَ وَالنَّصَٰر۪ىٰ وَالْمَجُوسَ وَالذِينَ أَشْرَكُوٓاْ إِنَّ اَ۬للَّهَ يَفْصِلُ بَيْنَهُمْ يَوْمَ اَ۬لْقِيَٰمَةِۖ إِنَّ اَ۬للَّهَ عَلَىٰ كُلِّ شَےْءٖ شَهِيدٌۖ","اَلَمْ تَرَ أَنَّ اَ۬للَّهَ يَسْجُدُ لَهُۥ مَن فِے اِ۬لسَّمَٰوَٰتِ وَمَن فِے اِ۬لَارْضِ وَالشَّمْسُ وَالْقَمَرُ وَالنُّجُومُ وَالْجِبَالُ وَالشَّجَرُ وَالدَّوَآبُّ وَكَثِيرٞ مِّنَ اَ۬لنَّاسِۖ وَكَثِيرٌ حَقَّ عَلَيْهِ اِ۬لْعَذَابُۖ وَمَنْ يُّهِنِ اِ۬للَّهُ فَمَا لَهُۥ مِن مُّكْرِمٍۖ اِنَّ اَ۬للَّهَ يَفْعَلُ مَا يَشَآءُۖ۩","۞ هَٰذَٰنِ خَصْمَٰنِ اِ۪خْتَصَمُواْ فِے رَبِّهِمْۖ فَالذِينَ كَفَرُواْ قُطِّعَتْ لَهُمْ ثِيَابٞ مِّن نّ۪ارٖ يُصَبُّ مِن فَوْقِ رُءُوسِهِمُ اُ۬لْحَمِيمُ يُصْهَرُ بِهِۦ مَا فِے بُطُونِهِمْ وَالْجُلُودُۖ وَلَهُم مَّقَٰمِعُ مِنْ حَدِيدٖۖ","كُلَّمَآ أَرَادُوٓاْ أَنْ يَّخْرُجُواْ مِنْهَا مِنْ غَمٍّ ا۟عِيدُواْ فِيهَاۖ وَذُوقُواْ عَذَابَ اَ۬لْحَرِيقِۖ","إِنَّ اَ۬للَّهَ يُدْخِلُ اُ۬لذِينَ ءَامَنُواْ وَعَمِلُواْ اُ۬لصَّٰلِحَٰتِ جَنَّٰتٖ تَجْرِے مِن تَحْتِهَا اَ۬لَانْهَٰرُ يُحَلَّوْنَ فِيهَا مِنَ اَسَاوِرَ مِن ذَهَبٖ وَلُؤْلُؤاٗۖ وَلِبَاسُهُمْ فِيهَا حَرِيرٞۖ","وَهُدُوٓاْ إِلَى اَ۬لطَّيِّبِ مِنَ اَ۬لْقَوْلِۖ وَهُدُوٓاْ إِلَىٰ صِرَٰطِ اِ۬لْحَمِيدِۖ","إِنَّ اَ۬لذِينَ كَفَرُواْ وَيَصُدُّونَ عَن سَبِيلِ اِ۬للَّهِ وَالْمَسْجِدِ اِ۬لْحَرَامِ اِ۬لذِے جَعَلْنَٰهُ لِلنَّاسِ سَوَآءٌ اِ۬لْعَٰكِفُ فِيهِ وَالْبَادِۦۖ وَمَنْ يُّرِدْ فِيهِ بِإِلْحَادِۢ بِظُلْمٖ نُّذِقْهُ مِنْ عَذَابٍ اَلِيمٖۖ","وَإِذْ بَوَّأْنَا لِإِبْرَٰهِيمَ مَكَانَ اَ۬لْبَيْتِ أَن لَّا تُشْرِكْ بِے شَئْاٗۖ وَطَهِّرْ بَيْتِيَ لِلطَّآئِفِينَ وَالْقَآئِمِينَ وَالرُّكَّعِ اِ۬لسُّجُودِۖ","وَأَذِّن فِے اِ۬لنَّاسِ بِالْحَجِّ يَاتُوكَ رِجَالاٗ وَعَلَىٰ كُلِّ ضَامِرٖ يَاتِينَ مِن كُلِّ فَجٍّ عَمِيقٖ","لِّيَشْهَدُواْ مَنَٰفِعَ لَهُمْ وَيَذْكُرُواْ اُ۪سْمَ اَ۬للَّهِ فِےٓ أَيَّامٖ مَّعْلُومَٰتٍ عَلَىٰ مَا رَزَقَهُم مِّنۢ بَهِيمَةِ اِ۬لَانْعَٰمِۖ فَكُلُواْ مِنْهَا وَأَطْعِمُواْ اُ۬لْبَآئِسَ اَ۬لْفَقِيرَۖ","ثُمَّ لِيَقْضُواْ تَفَثَهُمْ وَلْيُوفُواْ نُذُورَهُمْ وَلْيَطَّوَّفُواْ بِالْبَيْتِ اِ۬لْعَتِيقِۖ","۞ ذَٰلِكَۖ وَمَنْ يُّعَظِّمْ حُرُمَٰتِ اِ۬للَّهِ فَهُوَ خَيْرٞ لَّهُۥ عِندَ رَبِّهِۦۖ وَأُحِلَّتْ لَكُمُ اُ۬لَانْعَٰمُ إِلَّا مَا يُتْل۪ىٰ عَلَيْكُمْۖ فَاجْتَنِبُواْ اُ۬لرِّجْسَ مِنَ اَ۬لَاوْثَٰنِ وَاجْتَنِبُواْ قَوْلَ اَ۬لزُّورِ","حُنَفَآءَ لِلهِ غَيْرَ مُشْرِكِينَ بِهِۦۖ وَمَنْ يُّشْرِكْ بِاللَّهِ فَكَأَنَّمَا خَرَّ مِنَ اَ۬لسَّمَآءِ فَتَخَطَّفُهُ اُ۬لطَّيْرُ أَوْ تَهْوِے بِهِ اِ۬لرِّيحُ فِے مَكَانٖ سَحِيقٖۖ","ذَٰلِكَۖ وَمَنْ يُّعَظِّمْ شَعَٰٓئِرَ اَ۬للَّهِ فَإِنَّهَا مِن تَقْوَى اَ۬لْقُلُوبِۖ","لَكُمْ فِيهَا مَنَٰفِعُ إِلَىٰٓ أَجَلٖ مُّسَمّىٗ ثُمَّ مَحِلُّهَآ إِلَى اَ۬لْبَيْتِ اِ۬لْعَتِيقِۖ","وَلِكُلِّ أُمَّةٖ جَعَلْنَا مَنسَكاٗ لِّيَذْكُرُواْ اُ۪سْمَ اَ۬للَّهِ عَلَىٰ مَا رَزَقَهُم مِّنۢ بَهِيمَةِ اِ۬لَانْعَٰمِۖ فَإِلَٰهُكُمُۥٓ إِلَٰهٞ وَٰحِدٞۖ فَلَهُۥٓ أَسْلِمُواْۖ وَبَشِّرِ اِ۬لْمُخْبِتِينَ","اَ۬لذِينَ إِذَا ذُكِرَ اَ۬للَّهُ وَجِلَتْ قُلُوبُهُمْ وَالصَّٰبِرِينَ عَلَىٰ مَآ أَصَابَهُمْ وَالْمُقِيمِے اِ۬لصَّلَوٰةِ وَمِمَّا رَزَقْنَٰهُمْ يُنفِقُونَۖ","وَالْبُدْنَ جَعَلْنَٰهَا لَكُم مِّن شَعَٰٓئِرِ اِ۬للَّهِ لَكُمْ فِيهَا خَيْرٞۖ فَاذْكُرُواْ اُ۪سْمَ اَ۬للَّهِ عَلَيْهَا صَوَآفَّۖ فَإِذَا وَجَبَتْ جُنُوبُهَا فَكُلُواْ مِنْهَا وَأَطْعِمُواْ اُ۬لْقَانِعَ وَالْمُعْتَرَّۖ كَذَٰلِكَ سَخَّرْنَٰهَا لَكُمْ لَعَلَّكُمْ تَشْكُرُونَۖ","لَنْ يَّنَالَ اَ۬للَّهَ لُحُومُهَا وَلَا دِمَآؤُهَا وَلَٰكِنْ يَّنَالُهُ اُ۬لتَّقْو۪ىٰ مِنكُمْۖ كَذَٰلِكَ سَخَّرَهَا لَكُمْ لِتُكَبِّرُواْ اُ۬للَّهَ عَلَىٰ مَا هَد۪يٰكُمْۖ وَبَشِّرِ اِ۬لْمُحْسِنِينَۖ","۞ إِنَّ اَ۬للَّهَ يُدَٰفِعُ عَنِ اِ۬لذِينَ ءَامَنُوٓاْۖ إِنَّ اَ۬للَّهَ لَا يُحِبُّ كُلَّ خَوَّانٖ كَفُورٍۖ","ا۟ذِنَ لِلذِينَ يُقَٰتَلُونَ بِأَنَّهُمْ ظُلِمُواْۖ وَإِنَّ اَ۬للَّهَ عَلَىٰ نَصْرِهِمْ لَقَدِيرٌۖ","اِ۬لذِينَ أُخْرِجُواْ مِن دِيٰ۪رِهِم بِغَيْرِ حَقٍّ اِلَّآ أَنْ يَّقُولُواْ رَبُّنَا اَ۬للَّهُۖ وَلَوْلَا دِفَٰعُ اُ۬للَّهِ اِ۬لنَّاسَ بَعْضَهُم بِبَعْضٖ لَّهُدِمَتْ صَوَٰمِعُ وَبِيَعٞ وَصَلَوَٰتٞ وَمَسَٰجِدُ يُذْكَرُ فِيهَا اَ۪سْمُ اُ۬للَّهِ كَثِيراٗۖ وَلَيَنصُرَنَّ اَ۬للَّهُ مَنْ يَّنصُرُهُۥٓۖ إِنَّ اَ۬للَّهَ لَقَوِيٌّ عَزِيزٌۖ","اِ۬لذِينَ إِن مَّكَّنَّٰهُمْ فِے اِ۬لَارْضِ أَقَامُواْ اُ۬لصَّلَوٰةَ وَءَاتَوُاْ اُ۬لزَّكَوٰةَ وَأَمَرُواْ بِالْمَعْرُوفِ وَنَهَوْاْ عَنِ اِ۬لْمُنكَرِۖ وَلِلهِ عَٰقِبَةُ اُ۬لُامُورِۖ","وَإِنْ يُّكَذِّبُوكَ فَقَدْ كَذَّبَتْ قَبْلَهُمْ قَوْمُ نُوحٖ وَعَادٞ وَثَمُودُ","وَقَوْمُ إِبْرَٰهِيمَ وَقَوْمُ لُوطٖ","وَأَصْحَٰبُ مَدْيَنَۖ وَكُذِّبَ مُوس۪ىٰۖ فَأَمْلَيْتُ لِلْكٰ۪فِرِينَ ثُمَّ أَخَذتُّهُمْۖ فَكَيْفَ كَانَ نَكِيرِۦۖ","فَكَأَيِّن مِّن قَرْيَةٍ اَهْلَكْنَٰهَا وَهِيَ ظَالِمَةٞ فَهِيَ خَاوِيَةٌ عَلَىٰ عُرُوشِهَا وَبِيرٖ مُّعَطَّلَةٖ وَقَصْرٖ مَّشِيدٍۖ","اَفَلَمْ يَسِيرُواْ فِے اِ۬لَارْضِ فَتَكُونَ لَهُمْ قُلُوبٞ يَعْقِلُونَ بِهَآ أَوَ اٰذَانٞ يَسْمَعُونَ بِهَاۖ فَإِنَّهَا لَا تَعْمَى اَ۬لَابْصَٰرُ وَلَٰكِن تَعْمَى اَ۬لْقُلُوبُ اُ۬لتِے فِے اِ۬لصُّدُورِۖ","وَيَسْتَعْجِلُونَكَ بِالْعَذَابِۖ وَلَنْ يُّخْلِفَ اَ۬للَّهُ وَعْدَهُۥۖ وَإِنَّ يَوْماً عِندَ رَبِّكَ كَأَلْفِ سَنَةٖ مِّمَّا تَعُدُّونَۖ","وَكَأَيِّن مِّن قَرْيَةٍ اَمْلَيْتُ لَهَا وَهِيَ ظَالِمَةٞ ثُمَّ أَخَذتُّهَاۖ وَإِلَيَّ اَ۬لْمَصِيرُۖ","۞ قُلْ يَٰٓأَيُّهَا اَ۬لنَّاسُ إِنَّمَآ أَنَا لَكُمْ نَذِيرٞ مُّبِينٞۖ","فَالذِينَ ءَامَنُواْ وَعَمِلُواْ اُ۬لصَّٰلِحَٰتِ لَهُم مَّغْفِرَةٞ وَرِزْقٞ كَرِيمٞۖ","وَالذِينَ سَعَوْاْ فِےٓ ءَايَٰتِنَا مُعَٰجِزِينَ أُوْلَٰٓئِكَ أَصْحَٰبُ اُ۬لْجَحِيمِۖ","وَمَآ أَرْسَلْنَا مِن قَبْلِكَ مِن رَّسُولٖ وَلَا نَبِےٓءٍ اِلَّآ إِذَا تَمَنّ۪ىٰٓ أَلْقَى اَ۬لشَّيْطَٰنُ فِےٓ أُمْنِيَّتِهِۦ فَيَنسَخُ اُ۬للَّهُ مَا يُلْقِے اِ۬لشَّيْطَٰنُ ثُمَّ يُحْكِمُ اُ۬للَّهُ ءَايَٰتِهِۦ وَاللَّهُ عَلِيمٌ حَكِيمٞ","لِّيَجْعَلَ مَا يُلْقِے اِ۬لشَّيْطَٰنُ فِتْنَةٗ لِّلذِينَ فِے قُلُوبِهِم مَّرَضٞ وَالْقَاسِيَةِ قُلُوبُهُمْۖ وَإِنَّ اَ۬لظَّٰلِمِينَ لَفِے شِقَاقِۢ بَعِيدٖۖ","وَلِيَعْلَمَ اَ۬لذِينَ أُوتُواْ اُ۬لْعِلْمَ أَنَّهُ اُ۬لْحَقُّ مِن رَّبِّكَ فَيُومِنُواْ بِهِۦ فَتُخْبِتَ لَهُۥ قُلُوبُهُمْۖ وَإِنَّ اَ۬للَّهَ لَهَادِ اِ۬لذِينَ ءَامَنُوٓاْ إِلَىٰ صِرَٰطٖ مُّسْتَقِيمٖۖ","وَلَا يَزَالُ اُ۬لذِينَ كَفَرُواْ فِے مِرْيَةٖ مِّنْهُ حَتَّىٰ تَاتِيَهُمُ اُ۬لسَّاعَةُ بَغْتَةً اَوْ يَاتِيَهُمْ عَذَابُ يَوْمٍ عَقِيمٍۖ","اِ۬لْمُلْكُ يَوْمَئِذٖ لِّلهِۖ يَحْكُمُ بَيْنَهُمْۖ فَالذِينَ ءَامَنُواْ وَعَمِلُواْ اُ۬لصَّٰلِحَٰتِ فِے جَنَّٰتِ اِ۬لنَّعِيمِۖ","وَالذِينَ كَفَرُواْ وَكَذَّبُواْ بِـَٔايَٰتِنَا فَأُوْلَٰٓئِكَ لَهُمْ عَذَابٞ مُّهِينٞۖ","وَالذِينَ هَاجَرُواْ فِے سَبِيلِ اِ۬للَّهِ ثُمَّ قُتِلُوٓاْ أَوْ مَاتُواْ لَيَرْزُقَنَّهُمُ اُ۬للَّهُ رِزْقاً حَسَناٗۖ وَإِنَّ اَ۬للَّهَ لَهُوَ خَيْرُ اُ۬لرَّٰزِقِينَۖ","لَيُدْخِلَنَّهُم مَّدْخَلاٗ يَرْضَوْنَهُۥۖ وَإِنَّ اَ۬للَّهَ لَعَلِيمٌ حَلِيمٞۖ","۞ ذَٰلِكَۖ وَمَنْ عَاقَبَ بِمِثْلِ مَا عُوقِبَ بِهِۦ ثُمَّ بُغِيَ عَلَيْهِ لَيَنصُرَنَّهُ اُ۬للَّهُۖ إِنَّ اَ۬للَّهَ لَعَفُوٌّ غَفُورٞۖ","ذَٰلِكَ بِأَنَّ اَ۬للَّهَ يُولِجُ اُ۬ليْلَ فِے اِ۬لنَّه۪ارِ وَيُولِجُ اُ۬لنَّهَارَ فِے اِ۬ليْلِ وَأَنَّ اَ۬للَّهَ سَمِيعُۢ بَصِيرٞۖ","ذَٰلِكَ بِأَنَّ اَ۬للَّهَ هُوَ اَ۬لْحَقُّ وَأَنَّ مَا تَدْعُونَ مِن دُونِهِۦ هُوَ اَ۬لْبَٰطِلُ وَأَنَّ اَ۬للَّهَ هُوَ اَ۬لْعَلِيُّ اُ۬لْكَبِيرُۖ","أَلَمْ تَرَ أَنَّ اَ۬للَّهَ أَنزَلَ مِنَ اَ۬لسَّمَآءِ مَآءٗ فَتُصْبِحُ اُ۬لَارْضُ مُخْضَرَّةًۖ اِنَّ اَ۬للَّهَ لَطِيفٌ خَبِيرٞۖ","لَّهُۥ مَا فِے اِ۬لسَّمَٰوَٰتِ وَمَا فِے اِ۬لَارْضِۖ وَإِنَّ اَ۬للَّهَ لَهُوَ اَ۬لْغَنِيُّ اُ۬لْحَمِيدُۖ","أَلَمْ تَرَ أَنَّ اَ۬للَّهَ سَخَّرَ لَكُم مَّا فِے اِ۬لَارْضِ وَالْفُلْكَ تَجْرِے فِے اِ۬لْبَحْرِ بِأَمْرِهِۖۦ وَيُمْسِكُ اُ۬لسَّمَآءَ ان تَقَعَ عَلَى اَ۬لَارْضِ إِلَّا بِإِذْنِهِۦٓۖ إِنَّ اَ۬للَّهَ بِالنَّاسِ لَرَءُوفٞ رَّحِيمٞۖ","وَهُوَ اَ۬لذِےٓ أَحْي۪اكُمْ ثُمَّ يُمِيتُكُمْۖ ثُمَّ يُحْيِيكُمُۥٓۖ إِنَّ اَ۬لِانسَٰنَ لَكَفُورٞۖ","لِّكُلِّ أُمَّةٖ جَعَلْنَا مَنسَكاً هُمْ نَاسِكُوهُۖ فَلَا يُنَٰزِعُنَّكَ فِے اِ۬لَامْرِۖ وَادْعُ إِلَىٰ رَبِّكَۖ إِنَّكَ لَعَلَىٰ هُدىٗ مُّسْتَقِيمٖۖ","وَإِن جَٰدَلُوكَ فَقُلِ اِ۬للَّهُ أَعْلَمُ بِمَا تَعْمَلُونَۖ","اَ۬للَّهُ يَحْكُمُ بَيْنَكُمْ يَوْمَ اَ۬لْقِيَٰمَةِ فِيمَا كُنتُمْ فِيهِ تَخْتَلِفُونَۖ","أَلَمْ تَعْلَمَ اَنَّ اَ۬للَّهَ يَعْلَمُ مَا فِے اِ۬لسَّمَآءِ وَالَارْضِۖ إِنَّ ذَٰلِكَ فِے كِتَٰبٍۖ اِنَّ ذَٰلِكَ عَلَى اَ۬للَّهِ يَسِيرٞۖ","وَيَعْبُدُونَ مِن دُونِ اِ۬للَّهِ مَا لَمْ يُنَزِّلْ بِهِۦ سُلْطَٰناٗ وَمَا لَيْسَ لَهُم بِهِۦ عِلْمٞۖ وَمَا لِلظَّٰلِمِينَ مِن نَّصِيرٖۖ","۞ وَإِذَا تُتْل۪ىٰ عَلَيْهِمُۥٓ ءَايَٰتُنَا بَيِّنَٰتٖ تَعْرِفُ فِے وُجُوهِ اِ۬لذِينَ كَفَرُواْ اُ۬لْمُنكَرَ يَكَادُونَ يَسْطُونَ بِالذِينَ يَتْلُونَ عَلَيْهِمُۥٓ ءَايَٰتِنَاۖ قُلَ اَفَأُنَبِّئُكُم بِشَرّٖ مِّن ذَٰلِكُمُۖ اُ۬لنَّارُ وَعَدَهَا اَ۬للَّهُ اُ۬لذِينَ كَفَرُواْۖ وَبِيسَ اَ۬لْمَصِيرُۖ","يَٰٓأَيُّهَا اَ۬لنَّاسُ ضُرِبَ مَثَلٞ فَاسْتَمِعُواْ لَهُۥٓۖ إِنَّ اَ۬لذِينَ تَدْعُونَ مِن دُونِ اِ۬للَّهِ لَنْ يَّخْلُقُواْ ذُبَاباٗ وَلَوِ اِ۪جْتَمَعُواْ لَهُۥۖ وَإِنْ يَّسْلُبْهُمُ اُ۬لذُّبَابُ شَئْاٗ لَّا يَسْتَنقِذُوهُ مِنْهُۖ ضَعُفَ اَ۬لطَّالِبُ وَالْمَطْلُوبُۖ","مَا قَدَرُواْ اُ۬للَّهَ حَقَّ قَدْرِهِۦٓۖ إِنَّ اَ۬للَّهَ لَقَوِيٌّ عَزِيزٌۖ","اِ۬للَّهُ يَصْطَفِے مِنَ اَ۬لْمَلَٰٓئِكَةِ رُسُلاٗ وَمِنَ اَ۬لنَّاسِۖ إِنَّ اَ۬للَّهَ سَمِيعُۢ بَصِيرٞۖ","يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْۖ وَإِلَى اَ۬للَّهِ تُرْجَعُ اُ۬لُامُورُۖ","يَٰٓأَيُّهَا اَ۬لذِينَ ءَامَنُواْ اُ۪رْكَعُواْ وَاسْجُدُواْ وَاعْبُدُواْ رَبَّكُمْ وَافْعَلُواْ اُ۬لْخَيْرَ لَعَلَّكُمْ تُفْلِحُونَۖ","وَجَٰهِدُواْ فِے اِ۬للَّهِ حَقَّ جِهَادِهِۦۖ هُوَ اَ۪جْتَب۪يٰكُمْۖ وَمَا جَعَلَ عَلَيْكُمْ فِے اِ۬لدِّينِ مِنْ حَرَجٖۖ مِّلَّةَ أَبِيكُمُۥٓ إِبْرَٰهِيمَۖ هُوَ سَمّ۪يٰكُمُ اُ۬لْمُسْلِمِينَ مِن قَبْلُ وَفِے هَٰذَا لِيَكُونَ اَ۬لرَّسُولُ شَهِيداً عَلَيْكُمْ وَتَكُونُواْ شُهَدَآءَ عَلَى اَ۬لنَّاسِۖ فَأَقِيمُواْ اُ۬لصَّلَوٰةَ وَءَاتُواْ اُ۬لزَّكَوٰةَۖ وَاعْتَصِمُواْ بِاللَّهِۖ هُوَ مَوْل۪يٰكُمْۖ فَنِعْمَ اَ۬لْمَوْل۪ىٰۖ وَنِعْمَ اَ۬لنَّصِيرُۖ"]],["المؤمنون",["قَدَ اَفْلَحَ اَ۬لْمُومِنُونَۖ","اَ۬لذِينَ هُمْ فِے صَلَاتِهِمْ خَٰشِعُونَۖ","وَالذِينَ هُمْ عَنِ اِ۬للَّغْوِ مُعْرِضُونَۖ","وَالذِينَ هُمْ لِلزَّكَوٰةِ فَٰعِلُونَۖ","وَالذِينَ هُمْ لِفُرُوجِهِمْ حَٰفِظُونَ","إِلَّا عَلَىٰٓ أَزْوَٰجِهِمُۥٓ أَوْ مَا مَلَكَتَ اَيْمَٰنُهُمْ فَإِنَّهُمْ غَيْرُ مَلُومِينَۖ","فَمَنِ اِ۪بْتَغ۪ىٰ وَرَآءَ ذَٰلِكَ فَأُوْلَٰٓئِكَ هُمُ اُ۬لْعَادُونَۖ","وَالذِينَ هُمْ لِأَمَٰنَٰتِهِمْ وَعَهْدِهِمْ رَٰعُونَۖ","وَالذِينَ هُمْ عَلَىٰ صَلَوَٰتِهِمْ يُحَافِظُونَ","أُوْلَٰٓئِكَ هُمُ اُ۬لْوَٰرِثُونَ","اَ۬لذِينَ يَرِثُونَ اَ۬لْفِرْدَوْسَۖ هُمْ فِيهَا خَٰلِدُونَۖ","وَلَقَدْ خَلَقْنَا اَ۬لِانسَٰنَ مِن سُلَٰلَةٖ مِّن طِينٖۖ","ثُمَّ جَعَلْنَٰهُ نُطْفَةٗ فِے قَر۪ارٖ مَّكِينٖۖ","ثُمَّ خَلَقْنَا اَ۬لنُّطْفَةَ عَلَقَةٗ فَخَلَقْنَا اَ۬لْعَلَقَةَ مُضْغَةٗ فَخَلَقْنَا اَ۬لْمُضْغَةَ عِظَٰماٗ فَكَسَوْنَا اَ۬لْعِظَٰمَ لَحْماٗ ثُمَّ أَنشَأْنَٰهُ خَلْقاً اٰخَرَۖ فَتَبَٰرَكَ اَ۬للَّهُ أَحْسَنُ اُ۬لْخَٰلِقِينَۖ","ثُمَّ إِنَّكُم بَعْدَ ذَٰلِكَ لَمَيِّتُونَۖ","ثُمَّ إِنَّكُمْ يَوْمَ اَ۬لْقِيَٰمَةِ تُبْعَثُونَۖ","وَلَقَدْ خَلَقْنَا فَوْقَكُمْ سَبْعَ طَرَآئِقَۖ وَمَا كُنَّا عَنِ اِ۬لْخَلْقِ غَٰفِلِينَۖ","وَأَنزَلْنَا مِنَ اَ۬لسَّمَآءِ مَآءَۢ بِقَدَرٖ فَأَسْكَنَّٰهُ فِے اِ۬لَارْضِۖ وَإِنَّا عَلَىٰ ذَهَابِۢ بِهِۦ لَقَٰدِرُونَۖ","فَأَنشَأْنَا لَكُم بِهِۦ جَنَّٰتٖ مِّن نَّخِيلٖ وَأَعْنَٰبٖ لَّكُمْ فِيهَا فَوَٰكِهُ كَثِيرَةٞ وَمِنْهَا تَاكُلُونَ","وَشَجَرَةٗ تَخْرُجُ مِن طُورِ سِينَآءَ تَنۢبُتُ بِالدُّهْنِ وَصِبْغٖ لِّلَاكِلِينَۖ","وَإِنَّ لَكُمْ فِے اِ۬لَانْعَٰمِ لَعِبْرَةٗۖ نَّسْقِيكُم مِّمَّا فِے بُطُونِهَاۖ وَلَكُمْ فِيهَا مَنَٰفِعُ كَثِيرَةٞ وَمِنْهَا تَاكُلُونَ","وَعَلَيْهَا وَعَلَى اَ۬لْفُلْكِ تُحْمَلُونَۖ","وَلَقَدَ اَرْسَلْنَا نُوحاً اِلَىٰ قَوْمِهِۦ فَقَالَ يَٰقَوْمِ اِ۟عْبُدُواْ اُ۬للَّهَ مَا لَكُم مِّنِ اِلَٰهٍ غَيْرُهُۥٓۖ أَفَلَا تَتَّقُونَۖ","۞ فَقَالَ اَ۬لْمَلَؤُاْ اُ۬لذِينَ كَفَرُواْ مِن قَوْمِهِۦ مَا هَٰذَآ إِلَّا بَشَرٞ مِّثْلُكُمْ يُرِيدُ أَنْ يَّتَفَضَّلَ عَلَيْكُمْ وَلَوْ شَآءَ اَ۬للَّهُ لَأَنزَلَ مَلَٰٓئِكَةٗ مَّا سَمِعْنَا بِهَٰذَا فِےٓ ءَابَآئِنَا اَ۬لَاوَّلِينَ","إِنْ هُوَ إِلَّا رَجُلُۢ بِهِۦ جِنَّةٞ فَتَرَبَّصُواْ بِهِۦ حَتَّىٰ حِينٖۖ","قَالَ رَبِّ اِ۟نصُرْنِے بِمَا كَذَّبُونِۖ","فَأَوْحَيْنَآ إِلَيْهِ أَنِ اِ۪صْنَعِ اِ۬لْفُلْكَ بِأَعْيُنِنَا وَوَحْيِنَاۖ فَإِذَا جَآءَ امْرُنَا وَفَارَ اَ۬لتَّنُّورُ فَاسْلُكْ فِيهَا مِن كُلِّ زَوْجَيْنِ اِ۪ثْنَيْنِ وَأَهْلَكَ إِلَّا مَن سَبَقَ عَلَيْهِ اِ۬لْقَوْلُ مِنْهُمْۖ وَلَا تُخَٰطِبْنِے فِے اِ۬لذِينَ ظَلَمُوٓاْ إِنَّهُم مُّغْرَقُونَۖ","فَإِذَا اَ۪سْتَوَيْتَ أَنتَ وَمَن مَّعَكَ عَلَى اَ۬لْفُلْكِ فَقُلِ اِ۬لْحَمْدُ لِلهِ اِ۬لذِے نَجّ۪يٰنَا مِنَ اَ۬لْقَوْمِ اِ۬لظَّٰلِمِينَۖ","وَقُل رَّبِّ أَنزِلْنِے مُنزَلاٗ مُّبَٰرَكاٗ وَأَنتَ خَيْرُ اُ۬لْمُنزِلِينَۖ","إِنَّ فِے ذَٰلِكَ لَأٓيَٰتٖۖ وَإِن كُنَّا لَمُبْتَلِينَۖ","ثُمَّ أَنشَأْنَا مِنۢ بَعْدِهِمْ قَرْناً اٰخَرِينَ","فَأَرْسَلْنَا فِيهِمْ رَسُولاٗ مِّنْهُمُۥٓ أَنُ اُ۟عْبُدُواْ اُ۬للَّهَ مَا لَكُم مِّنِ اِلَٰهٍ غَيْرُهُۥٓۖ أَفَلَا تَتَّقُونَۖ","وَقَالَ اَ۬لْمَلَأُ مِن قَوْمِهِ اِ۬لذِينَ كَفَرُواْ وَكَذَّبُواْ بِلِقَآءِ اِ۬لَاخِرَةِ وَأَتْرَفْنَٰهُمْ فِے اِ۬لْحَيَوٰةِ اِ۬لدُّنْي۪ا مَا هَٰذَآ إِلَّا بَشَرٞ مِّثْلُكُمْ يَاكُلُ مِمَّا تَاكُلُونَ مِنْهُ وَيَشْرَبُ مِمَّا تَشْرَبُونَ","وَلَئِنَ اَطَعْتُم بَشَراٗ مِّثْلَكُمُۥٓ إِنَّكُمُۥٓ إِذاٗ لَّخَٰسِرُونَ","أَيَعِدُكُمُۥٓ أَنَّكُمُۥٓ إِذَا مِتُّمْ وَكُنتُمْ تُرَاباٗ وَعِظَٰماً اَنَّكُم مُّخْرَجُونَ","هَيْهَاتَ هَيْهَاتَ لِمَا تُوعَدُونَ","إِنْ هِيَ إِلَّا حَيَاتُنَا اَ۬لدُّنْي۪ا نَمُوتُ وَنَحْي۪ا وَمَا نَحْنُ بِمَبْعُوثِينَ","إِنْ هُوَ إِلَّا رَجُلٌ اِ۪فْتَر۪ىٰ عَلَى اَ۬للَّهِ كَذِباٗ وَمَا نَحْنُ لَهُۥ بِمُومِنِينَۖ","۞ قَالَ رَبِّ اِ۟نصُرْنِے بِمَا كَذَّبُونِۖ","قَالَ عَمَّا قَلِيلٖ لَّيُصْبِحُنَّ نَٰدِمِينَۖ","فَأَخَذَتْهُمُ اُ۬لصَّيْحَةُ بِالْحَقِّ فَجَعَلْنَٰهُمْ غُثَآءٗۖ فَبُعْداٗ لِّلْقَوْمِ اِ۬لظَّٰلِمِينَۖ","ثُمَّ أَنشَأْنَا مِنۢ بَعْدِهِمْ قُرُوناً اٰخَرِينَۖ","مَا تَسْبِقُ مِنُ ا۟مَّةٍ اَجَلَهَا وَمَا يَسْتَٰخِرُونَۖ","ثُمَّ أَرْسَلْنَا رُسُلَنَا تَتْر۪اۖ كُلَّ مَا جَآءَ اُ۟مَّةٗ رَّسُولُهَا كَذَّبُوهُۖ فَأَتْبَعْنَا بَعْضَهُم بَعْضاٗ وَجَعَلْنَٰهُمُۥٓ أَحَادِيثَۖ فَبُعْداٗ لِّقَوْمٖ لَّا يُومِنُونَۖ","ثُمَّ أَرْسَلْنَا مُوس۪ىٰ وَأَخَاهُ هَٰرُونَ","بِـَٔايَٰتِنَا وَسُلْطَٰنٖ مُّبِينٍ","اِلَىٰ فِرْعَوْنَ وَمَلَإِيْهِۦ فَاسْتَكْبَرُواْ وَكَانُواْ قَوْماً عَالِينَۖ","فَقَالُوٓاْ أَنُومِنُ لِبَشَرَيْنِ مِثْلِنَا وَقَوْمُهُمَا لَنَا عَٰبِدُونَۖ","فَكَذَّبُوهُمَا فَكَانُواْ مِنَ اَ۬لْمُهْلَكِينَۖ","وَلَقَدَ اٰتَيْنَا مُوسَى اَ۬لْكِتَٰبَ لَعَلَّهُمْ يَهْتَدُونَۖ","وَجَعَلْنَا اَ۪بْنَ مَرْيَمَ وَأُمَّهُۥٓ ءَايَةٗۖ وَءَاوَيْنَٰهُمَآ إِلَىٰ رُبْوَةٖ ذَاتِ قَر۪ارٖ وَمَعِينٖۖ","يَٰٓأَيُّهَا اَ۬لرُّسُلُ كُلُواْ مِنَ اَ۬لطَّيِّبَٰتِ وَاعْمَلُواْ صَٰلِحاًۖ اِنِّے بِمَا تَعْمَلُونَ عَلِيمٞۖ","وَأَنَّ هَٰذِهِۦٓ أُمَّتُكُمُۥٓ أُمَّةٗ وَٰحِدَةٗۖ وَأَنَا رَبُّكُمْ فَاتَّقُونِۖ","فَتَقَطَّعُوٓاْ أَمْرَهُم بَيْنَهُمْ زُبُراٗۖ كُلُّ حِزْبِۢ بِمَا لَدَيْهِمْ فَرِحُونَۖ","فَذَرْهُمْ فِے غَمْرَتِهِمْ حَتَّىٰ حِينٍۖ","اَيَحْسِبُونَ أَنَّمَا نُمِدُّهُم بِهِۦ مِن مَّالٖ وَبَنِينَ","نُسَارِعُ لَهُمْ فِے اِ۬لْخَيْرَٰتِۖ بَل لَّا يَشْعُرُونَۖ","۞ إِنَّ اَ۬لذِينَ هُم مِّنْ خَشْيَةِ رَبِّهِم مُّشْفِقُونَ","وَالذِينَ هُم بِـَٔايَٰتِ رَبِّهِمْ يُومِنُونَ","وَالذِينَ هُم بِرَبِّهِمْ لَا يُشْرِكُونَ","وَالذِينَ يُوتُونَ مَآ ءَاتَواْ وَّقُلُوبُهُمْ وَجِلَةٌ اَنَّهُمُۥٓ إِلَىٰ رَبِّهِمْ رَٰجِعُونَ","أُوْلَٰٓئِكَ يُسَٰرِعُونَ فِے اِ۬لْخَيْرَٰتِۖ وَهُمْ لَهَا سَٰبِقُونَۖ","وَلَا نُكَلِّفُ نَفْساً اِلَّا وُسْعَهَاۖ وَلَدَيْنَا كِتَٰبٞ يَنطِقُ بِالْحَقِّ وَهُمْ لَا يُظْلَمُونَۖ","بَلْ قُلُوبُهُمْ فِے غَمْرَةٖ مِّنْ هَٰذَاۖ وَلَهُمُۥٓ أَعْمَٰلٞ مِّن دُونِ ذَٰلِكَۖ هُمْ لَهَا عَٰمِلُونَۖ","حَتَّىٰٓ إِذَآ أَخَذْنَا مُتْرَفِيهِم بِالْعَذَابِ إِذَا هُمْ يَجْـَٔرُونَۖ","لَا تَجْـَٔرُواْ اُ۬لْيَوْمَۖ إِنَّكُم مِّنَّا لَا تُنصَرُونَۖ","قَدْ كَانَتَ اٰيَٰتِے تُتْل۪ىٰ عَلَيْكُمْ فَكُنتُمْ عَلَىٰٓ أَعْقَٰبِكُمْ تَنكِصُونَ","مُسْتَكْبِرِينَ بِهِۦۖ سَٰمِراٗ تُهْجِرُونَۖ","أَفَلَمْ يَدَّبَّرُواْ اُ۬لْقَوْلَ أَمْ جَآءَهُم مَّا لَمْ يَاتِ ءَابَآءَهُمُ اُ۬لَاوَّلِينَۖ","أَمْ لَمْ يَعْرِفُواْ رَسُولَهُمْ فَهُمْ لَهُۥ مُنكِرُونَۖ","أَمْ يَقُولُونَ بِهِۦ جِنَّةُۢۖ بَلْ جَآءَهُم بِالْحَقِّۖ وَأَكْثَرُهُمْ لِلْحَقِّ كَٰرِهُونَۖ","وَلَوِ اِ۪تَّبَعَ اَ۬لْحَقُّ أَهْوَآءَهُمْ لَفَسَدَتِ اِ۬لسَّمَٰوَٰتُ وَالَارْضُ وَمَن فِيهِنَّۖ بَلَ اَتَيْنَٰهُم بِذِكْرِهِمْۖ فَهُمْ عَن ذِكْرِهِم مُّعْرِضُونَۖ","أَمْ تَسْـَٔلُهُمْ خَرْجاٗۖ فَخَرَاجُ رَبِّكَ خَيْرٞۖ وَهُوَ خَيْرُ اُ۬لرَّٰزِقِينَۖ","وَإِنَّكَ لَتَدْعُوهُمُۥٓ إِلَىٰ صِرَٰطٖ مُّسْتَقِيمٖۖ","وَإِنَّ اَ۬لذِينَ لَا يُومِنُونَ بِالَاخِرَةِ عَنِ اِ۬لصِّرَٰطِ لَنَٰكِبُونَۖ","۞ وَلَوْ رَحِمْنَٰهُمْ وَكَشَفْنَا مَا بِهِم مِّن ضُرّٖ لَّلَجُّواْ فِے طُغْيَٰنِهِمْ يَعْمَهُونَۖ","وَلَقَدَ اَخَذْنَٰهُم بِالْعَذَابِ فَمَا اَ۪سْتَكَانُواْ لِرَبِّهِمْ وَمَا يَتَضَرَّعُونَۖ","حَتَّىٰٓ إِذَا فَتَحْنَا عَلَيْهِم بَاباٗ ذَا عَذَابٖ شَدِيدٍ اِذَا هُمْ فِيهِ مُبْلِسُونَۖ","وَهُوَ اَ۬لذِےٓ أَنشَأَ لَكُمُ اُ۬لسَّمْعَ وَالَابْصَٰرَ وَالَافْـِٕدَةَۖ قَلِيلاٗ مَّا تَشْكُرُونَۖ","وَهُوَ اَ۬لذِے ذَرَأَكُمْ فِے اِ۬لَارْضِ وَإِلَيْهِ تُحْشَرُونَۖ","وَهُوَ اَ۬لذِے يُحْيِۦ وَيُمِيتُۖ وَلَهُ اُ۪خْتِلَٰفُ اُ۬ليْلِ وَالنَّه۪ارِۖ أَفَلَا تَعْقِلُونَۖ","بَلْ قَالُواْ مِثْلَ مَا قَالَ اَ۬لَاوَّلُونَ","قَالُوٓاْ أَ۟ذَا مِتْنَا وَكُنَّا تُرَاباٗ وَعِظَٰماً اِنَّا لَمَبْعُوثُونَۖ","لَقَدْ وُعِدْنَا نَحْنُ وَءَابَآؤُنَا هَٰذَا مِن قَبْلُۖ إِنْ هَٰذَآ إِلَّآ أَسَٰطِيرُ اُ۬لَاوَّلِينَۖ","قُل لِّمَنِ اِ۬لَارْضُ وَمَن فِيهَآ إِن كُنتُمْ تَعْلَمُونَ","سَيَقُولُونَ لِلهِۖ قُلَ اَفَلَا تَذَّكَّرُونَۖ","قُلْ مَن رَّبُّ اُ۬لسَّمَٰوَٰتِ اِ۬لسَّبْعِ وَرَبُّ اُ۬لْعَرْشِ اِ۬لْعَظِيمِۖ","سَيَقُولُونَ لِلهِۖ قُلَ اَفَلَا تَتَّقُونَۖ","قُلْ مَنۢ بِيَدِهِۦ مَلَكُوتُ كُلِّ شَےْءٖ وَهُوَ يُجِيرُ وَلَا يُجَارُ عَلَيْهِ إِن كُنتُمْ تَعْلَمُونَ","سَيَقُولُونَ لِلهِۖ قُلْ فَأَنّ۪ىٰ تُسْحَرُونَۖ","بَلَ اَتَيْنَٰهُم بِالْحَقِّۖ وَإِنَّهُمْ لَكَٰذِبُونَۖ","مَا اَ۪تَّخَذَ اَ۬للَّهُ مِنْ وَّلَدٖۖ وَمَا كَانَ مَعَهُۥ مِنِ اِلَٰهٍۖ اِذاٗ لَّذَهَبَ كُلُّ إِلَٰهِۢ بِمَا خَلَقَ وَلَعَلَا بَعْضُهُمْ عَلَىٰ بَعْضٖۖ سُبْحَٰنَ اَ۬للَّهِ عَمَّا يَصِفُونَۖ","عَٰلِمُ اُ۬لْغَيْبِ وَالشَّهَٰدَةِۖ فَتَعَٰل۪ىٰ عَمَّا يُشْرِكُونَۖ","۞ قُل رَّبِّ إِمَّا تُرِيَنِّے مَا يُوعَدُونَ","رَبِّ فَلَا تَجْعَلْنِے فِے اِ۬لْقَوْمِ اِ۬لظَّٰلِمِينَۖ","وَإِنَّا عَلَىٰٓ أَن نُّرِيَكَ مَا نَعِدُهُمْ لَقَٰدِرُونَۖ","اَ۪دْفَعْ بِالتِے هِيَ أَحْسَنُ اُ۬لسَّيِّئَةَۖ نَحْنُ أَعْلَمُ بِمَا يَصِفُونَۖ","وَقُل رَّبِّ أَعُوذُ بِكَ مِنْ هَمَزَٰتِ اِ۬لشَّيَٰطِينِ","وَأَعُوذُ بِكَ رَبِّ أَنْ يَّحْضُرُونِۖ","حَتَّىٰٓ إِذَا جَآءَ احَدَهُمُ اُ۬لْمَوْتُ قَالَ رَبِّ اِ۪رْجِعُونِ","لَعَلِّيَ أَعْمَلُ صَٰلِحاٗ فِيمَا تَرَكْتُ كَلَّآۖ إِنَّهَا كَلِمَةٌ هُوَ قَآئِلُهَاۖ وَمِنْ وَّرَآئِهِم بَرْزَخٌ اِلَىٰ يَوْمِ يُبْعَثُونَۖ","فَإِذَا نُفِخَ فِے اِ۬لصُّورِ فَلَآ أَنسَابَ بَيْنَهُمْ يَوْمَئِذٖ وَلَا يَتَسَآءَلُونَۖ","فَمَن ثَقُلَتْ مَوَٰزِينُهُۥ فَأُوْلَٰٓئِكَ هُمُ اُ۬لْمُفْلِحُونَۖ","وَمَنْ خَفَّتْ مَوَٰزِينُهُۥ فَأُوْلَٰٓئِكَ اَ۬لذِينَ خَسِرُوٓاْ أَنفُسَهُمْ فِے جَهَنَّمَ خَٰلِدُونَ","تَلْفَحُ وُجُوهَهُمُ اُ۬لنَّارُ وَهُمْ فِيهَا كَٰلِحُونَۖ","أَلَمْ تَكُنَ اٰيَٰتِے تُتْل۪ىٰ عَلَيْكُمْ فَكُنتُم بِهَا تُكَذِّبُونَۖ","قَالُواْ رَبَّنَا غَلَبَتْ عَلَيْنَا شِقْوَتُنَا وَكُنَّا قَوْماٗ ضَآلِّينَۖ","رَبَّنَآ أَخْرِجْنَا مِنْهَا فَإِنْ عُدْنَا فَإِنَّا ظَٰلِمُونَۖ","قَالَ اَ۪خْسَـُٔواْ فِيهَا وَلَا تُكَلِّمُونِۖ","إِنَّهُۥ كَانَ فَرِيقٞ مِّنْ عِبَادِے يَقُولُونَ رَبَّنَآ ءَامَنَّا فَاغْفِرْ لَنَا وَارْحَمْنَا وَأَنتَ خَيْرُ اُ۬لرَّٰحِمِينَ","فَاتَّخَذتُّمُوهُمْ سُخْرِيّاً حَتَّىٰٓ أَنسَوْكُمْ ذِكْرِے وَكُنتُم مِّنْهُمْ تَضْحَكُونَۖ","إِنِّے جَزَيْتُهُمُ اُ۬لْيَوْمَ بِمَا صَبَرُوٓاْ أَنَّهُمْ هُمُ اُ۬لْفَآئِزُونَۖ","قَالَ كَمْ لَبِثْتُمْ فِے اِ۬لَارْضِ عَدَدَ سِنِينَۖ","قَالُواْ لَبِثْنَا يَوْماً اَوْ بَعْضَ يَوْمٖۖ فَسْـَٔلِ اِ۬لْعَآدِّينَۖ","قَالَ إِن لَّبِثْتُمُۥٓ إِلَّا قَلِيلاٗ لَّوَ اَنَّكُمْ كُنتُمْ تَعْلَمُونَۖ","۞ أَفَحَسِبْتُمُۥٓ أَنَّمَا خَلَقْنَٰكُمْ عَبَثاٗ وَأَنَّكُمُۥٓ إِلَيْنَا لَا تُرْجَعُونَۖ","فَتَعَٰلَى اَ۬للَّهُ اُ۬لْمَلِكُ اُ۬لْحَقُّۖ لَآ إِلَٰهَ إِلَّا هُوَۖ رَبُّ اُ۬لْعَرْشِ اِ۬لْكَرِيمِۖ","وَمَنْ يَّدْعُ مَعَ اَ۬للَّهِ إِلَٰهاً اٰخَرَ لَا بُرْهَٰنَ لَهُۥ بِهِۦ فَإِنَّمَا حِسَابُهُۥ عِندَ رَبِّهِۦٓۖ إِنَّهُۥ لَا يُفْلِحُ اُ۬لْكَٰفِرُونَۖ","وَقُل رَّبِّ اِ۪غْفِرْ وَارْحَمْ وَأَنتَ خَيْرُ اُ۬لرَّٰحِمِينَۖ"]],["النور",["سُورَةٌ اَنزَلْنَٰهَا وَفَرَضْنَٰهَا وَأَنزَلْنَا فِيهَآ ءَايَٰتِۢ بَيِّنَٰتٖ لَّعَلَّكُمْ تَذَّكَّرُونَۖ","اَ۬لزَّانِيَةُ وَالزَّانِے فَاجْلِدُواْ كُلَّ وَٰحِدٖ مِّنْهُمَا مِاْئَةَ جَلْدَةٖۖ وَلَا تَاخُذْكُم بِهِمَا رَأْفَةٞ فِے دِينِ اِ۬للَّهِ إِن كُنتُمْ تُومِنُونَ بِاللَّهِ وَالْيَوْمِ اِ۬لَاخِرِۖ وَلْيَشْهَدْ عَذَابَهُمَا طَآئِفَةٞ مِّنَ اَ۬لْمُومِنِينَۖ","اَ۬لزَّانِے لَا يَنكِحُ إِلَّا زَانِيَةً اَوْ مُشْرِكَةٗۖ وَالزَّانِيَةُ لَا يَنكِحُهَآ إِلَّا زَانٍ اَوْ مُشْرِكٞۖ وَحُرِّمَ ذَٰلِكَ عَلَى اَ۬لْمُومِنِينَۖ","وَالذِينَ يَرْمُونَ اَ۬لْمُحْصَنَٰتِ ثُمَّ لَمْ يَاتُواْ بِأَرْبَعَةِ شُهَدَآءَ فَاجْلِدُوهُمْ ثَمَٰنِينَ جَلْدَةٗۖ وَلَا تَقْبَلُواْ لَهُمْ شَهَٰدَةً اَبَداٗ وَأُوْلَٰٓئِكَ هُمُ اُ۬لْفَٰسِقُونَ","إِلَّا اَ۬لذِينَ تَابُواْ مِنۢ بَعْدِ ذَٰلِكَ وَأَصْلَحُواْ فَإِنَّ اَ۬للَّهَ غَفُورٞ رَّحِيمٞۖ","وَالذِينَ يَرْمُونَ أَزْوَٰجَهُمْ وَلَمْ يَكُن لَّهُمْ شُهَدَآءُ اِ۪لَّآ أَنفُسُهُمْ فَشَهَٰدَةُ أَحَدِهِمُۥٓ أَرْبَعَ شَهَٰدَٰتِۢ بِاللَّهِ إِنَّهُۥ لَمِنَ اَ۬لصَّٰدِقِينَ","وَالْخَٰمِسَةُ أَن لَّعْنَتُ اُ۬للَّهِ عَلَيْهِ إِن كَانَ مِنَ اَ۬لْكَٰذِبِينَۖ","وَيَدْرَؤُاْ عَنْهَا اَ۬لْعَذَابَ أَن تَشْهَدَ أَرْبَعَ شَهَٰدَٰتِۢ بِاللَّهِ إِنَّهُۥ لَمِنَ اَ۬لْكَٰذِبِينَ","وَالْخَٰمِسَةُ أَنْ غَضِبَ اَ۬للَّهُ عَلَيْهَآ إِن كَانَ مِنَ اَ۬لصَّٰدِقِينَۖ","وَلَوْلَا فَضْلُ اُ۬للَّهِ عَلَيْكُمْ وَرَحْمَتُهُۥ وَأَنَّ اَ۬للَّهَ تَوَّابٌ حَكِيمٌۖ","۞ اِنَّ اَ۬لذِينَ جَآءُو بِالِافْكِ عُصْبَةٞ مِّنكُمْ لَا تَحْسِبُوهُ شَرّاٗ لَّكُمۖ بَلْ هُوَ خَيْرٞ لَّكُمْۖ لِكُلِّ اِ۪مْرِےٕٖ مِّنْهُم مَّا اَ۪كْتَسَبَ مِنَ اَ۬لِاثْمِۖ وَالذِے تَوَلّ۪ىٰ كِبْرَهُۥ مِنْهُمْ لَهُۥ عَذَابٌ عَظِيمٞۖ","لَّوْلَآ إِذْ سَمِعْتُمُوهُ ظَنَّ اَ۬لْمُومِنُونَ وَالْمُومِنَٰتُ بِأَنفُسِهِمْ خَيْراٗ وَقَالُواْ هَٰذَآ إِفْكٞ مُّبِينٞۖ","لَّوْلَا جَآءُو عَلَيْهِ بِأَرْبَعَةِ شُهَدَآءَۖ فَإِذْ لَمْ يَاتُواْ بِالشُّهَدَآءِ فَأُوْلَٰٓئِكَ عِندَ اَ۬للَّهِ هُمُ اُ۬لْكَٰذِبُونَۖ","وَلَوْلَا فَضْلُ اُ۬للَّهِ عَلَيْكُمْ وَرَحْمَتُهُۥ فِے اِ۬لدُّنْي۪ا وَالَاخِرَةِ لَمَسَّكُمْ فِے مَآ أَفَضْتُمْ فِيهِ عَذَابٌ عَظِيمٌ","اِذْ تَلَقَّوْنَهُۥ بِأَلْسِنَتِكُمْ وَتَقُولُونَ بِأَفْوَاهِكُم مَّا لَيْسَ لَكُم بِهِۦ عِلْمٞ وَتَحْسِبُونَهُۥ هَيِّناٗ وَهُوَ عِندَ اَ۬للَّهِ عَظِيمٞۖ","وَلَوْلَآ إِذْ سَمِعْتُمُوهُ قُلْتُم مَّا يَكُونُ لَنَآ أَن نَّتَكَلَّمَ بِهَٰذَا سُبْحَٰنَكَ هَٰذَا بُهْتَٰنٌ عَظِيمٞۖ","يَعِظُكُمُ اُ۬للَّهُ أَن تَعُودُواْ لِمِثْلِهِۦٓ أَبَداً اِن كُنتُم مُّومِنِينَۖ","وَيُبَيِّنُ اُ۬للَّهُ لَكُمُ اُ۬لَايَٰتِۖ وَاللَّهُ عَلِيمٌ حَكِيمٌۖ","اِنَّ اَ۬لذِينَ يُحِبُّونَ أَن تَشِيعَ اَ۬لْفَٰحِشَةُ فِے اِ۬لذِينَ ءَامَنُواْ لَهُمْ عَذَابٌ اَلِيمٞ فِے اِ۬لدُّنْي۪ا وَالَاخِرَةِۖ وَاللَّهُ يَعْلَمُۖ وَأَنتُمْ لَا تَعْلَمُونَۖ","وَلَوْلَا فَضْلُ اُ۬للَّهِ عَلَيْكُمْ وَرَحْمَتُهُۥ وَأَنَّ اَ۬للَّهَ رَءُوفٞ رَّحِيمٞۖ","۞ يَٰٓأَيُّهَا اَ۬لذِينَ ءَامَنُواْ لَا تَتَّبِعُواْ خُطْوَٰتِ اِ۬لشَّيْطَٰنِۖ وَمَنْ يَّتَّبِعْ خُطْوَٰتِ اِ۬لشَّيْطَٰنِ فَإِنَّهُۥ يَامُرُ بِالْفَحْشَآءِ وَالْمُنكَرِۖ وَلَوْلَا فَضْلُ اُ۬للَّهِ عَلَيْكُمْ وَرَحْمَتُهُۥ مَا زَكَىٰ مِنكُم مِّنَ اَحَدٍ اَبَداٗۖ وَلَٰكِنَّ اَ۬للَّهَ يُزَكِّے مَنْ يَّشَآءُۖ وَاللَّهُ سَمِيعٌ عَلِيمٞۖ","وَلَا يَاتَلِ أُوْلُواْ اُ۬لْفَضْلِ مِنكُمْ وَالسَّعَةِ أَنْ يُّوتُوٓاْ أُوْلِے اِ۬لْقُرْب۪ىٰ وَالْمَسَٰكِينَ وَالْمُهَٰجِرِينَ فِے سَبِيلِ اِ۬للَّهِۖ وَلْيَعْفُواْ وَلْيَصْفَحُوٓاْۖ أَلَا تُحِبُّونَ أَنْ يَّغْفِرَ اَ۬للَّهُ لَكُمْۖ وَاللَّهُ غَفُورٞ رَّحِيمٌۖ","اِنَّ اَ۬لذِينَ يَرْمُونَ اَ۬لْمُحْصَنَٰتِ اِ۬لْغَٰفِلَٰتِ اِ۬لْمُومِنَٰتِ لُعِنُواْ فِے اِ۬لدُّنْي۪ا وَالَاخِرَةِ وَلَهُمْ عَذَابٌ عَظِيمٞ","يَوْمَ تَشْهَدُ عَلَيْهِمُۥٓ أَلْسِنَتُهُمْ وَأَيْدِيهِمْ وَأَرْجُلُهُم بِمَا كَانُواْ يَعْمَلُونَۖ","يَوْمَئِذٖ يُوَفِّيهِمُ اُ۬للَّهُ دِينَهُمُ اُ۬لْحَقَّۖ وَيَعْلَمُونَ أَنَّ اَ۬للَّهَ هُوَ اَ۬لْحَقُّ اُ۬لْمُبِينُۖ","اُ۬لْخَبِيثَٰتُ لِلْخَبِيثِينَ وَالْخَبِيثُونَ لِلْخَبِيثَٰتِۖ وَالطَّيِّبَٰتُ لِلطَّيِّبِينَ وَالطَّيِّبُونَ لِلطَّيِّبَٰتِۖ أُوْلَٰٓئِكَ مُبَرَّءُونَ مِمَّا يَقُولُونَۖ لَهُم مَّغْفِرَةٞ وَرِزْقٞ كَرِيمٞۖ","يَٰٓأَيُّهَا اَ۬لذِينَ ءَامَنُواْ لَا تَدْخُلُواْ بُيُوتاً غَيْرَ بُيُوتِكُمْ حَتَّىٰ تَسْتَانِسُواْ وَتُسَلِّمُواْ عَلَىٰٓ أَهْلِهَاۖ ذَٰلِكُمْ خَيْرٞ لَّكُمْ لَعَلَّكُمْ تَذَّكَّرُونَۖ","فَإِن لَّمْ تَجِدُواْ فِيهَآ أَحَداٗ فَلَا تَدْخُلُوهَا حَتَّىٰ يُوذَنَ لَكُمْۖ وَإِن قِيلَ لَكُمُ اُ۪رْجِعُواْ فَارْجِعُواْ هُوَ أَزْك۪ىٰ لَكُمْۖ وَاللَّهُ بِمَا تَعْمَلُونَ عَلِيمٞۖ","لَّيْسَ عَلَيْكُمْ جُنَاحٌ اَن تَدْخُلُواْ بُيُوتاً غَيْرَ مَسْكُونَةٖ فِيهَا مَتَٰعٞ لَّكُمْۖ وَاللَّهُ يَعْلَمُ مَا تُبْدُونَ وَمَا تَكْتُمُونَۖ","۞ قُل لِّلْمُومِنِينَ يَغُضُّواْ مِنَ اَبْصٰ۪رِهِمْ وَيَحْفَظُواْ فُرُوجَهُمْ ذَٰلِكَ أَزْك۪ىٰ لَهُمُۥٓۖ إِنَّ اَ۬للَّهَ خَبِيرُۢ بِمَا يَصْنَعُونَۖ","وَقُل لِّلْمُومِنَٰتِ يَغْضُضْنَ مِنَ اَبْصٰ۪رِهِنَّ وَيَحْفَظْنَ فُرُوجَهُنَّۖ وَلَا يُبْدِينَ زِينَتَهُنَّ إِلَّا مَا ظَهَرَ مِنْهَاۖ وَلْيَضْرِبْنَ بِخُمُرِهِنَّ عَلَىٰ جُيُوبِهِنَّۖ وَلَا يُبْدِينَ زِينَتَهُنَّ إِلَّا لِبُعُولَتِهِنَّ أَوَ اٰبَآئِهِنَّ أَوَ اٰبَآءِ بُعُولَتِهِنَّ أَوَ اَبْنَآئِهِنَّ أَوَ اَبْنَآءِ بُعُولَتِهِنَّ أَوِ اِخْوَٰنِهِنَّ أَوْ بَنِےٓ إِخْوَٰنِهِنَّ أَوْ بَنِےٓ أَخَوَٰتِهِنَّ أَوْ نِسَآئِهِنَّ أَوْ مَا مَلَكَتَ اَيْمَٰنُهُنَّ أَوِ اِ۬لتَّٰبِعِينَ غَيْرِ أُوْلِے اِ۬لِارْبَةِ مِنَ اَ۬لرِّجَالِ أَوِ اِ۬لطِّفْلِ اِ۬لذِينَ لَمْ يَظْهَرُواْ عَلَىٰ عَوْرَٰتِ اِ۬لنِّسَآءِۖ وَلَا يَضْرِبْنَ بِأَرْجُلِهِنَّ لِيُعْلَمَ مَا يُخْفِينَ مِن زِينَتِهِنَّۖ وَتُوبُوٓاْ إِلَى اَ۬للَّهِ جَمِيعاً اَيُّهَ اَ۬لْمُومِنُونَ لَعَلَّكُمْ تُفْلِحُونَۖ","وَأَنكِحُواْ اُ۬لَايَٰم۪ىٰ مِنكُمْ وَالصَّٰلِحِينَ مِنْ عِبَادِكُمْ وَإِمَآئِكُمُۥٓۖ إِنْ يَّكُونُواْ فُقَرَآءَ يُغْنِهِمُ اُ۬للَّهُ مِن فَضْلِهِۦۖ وَاللَّهُ وَٰسِعٌ عَلِيمٞۖ","وَلْيَسْتَعْفِفِ اِ۬لذِينَ لَا يَجِدُونَ نِكَاحاً حَتَّىٰ يُغْنِيَهُمُ اُ۬للَّهُ مِن فَضْلِهِۦۖ وَالذِينَ يَبْتَغُونَ اَ۬لْكِتَٰبَ مِمَّا مَلَكَتَ اَيْمَٰنُكُمْ فَكَاتِبُوهُمُۥٓ إِنْ عَلِمْتُمْ فِيهِمْ خَيْراٗۖ وَءَاتُوهُم مِّن مَّالِ اِ۬للَّهِ اِ۬لذِےٓ ءَات۪يٰكُمْۖ وَلَا تُكْرِهُواْ فَتَيَٰتِكُمْ عَلَى اَ۬لْبِغَآءِ انَ اَرَدْنَ تَحَصُّناٗ لِّتَبْتَغُواْ عَرَضَ اَ۬لْحَيَوٰةِ اِ۬لدُّنْي۪اۖ وَمَنْ يُّكْرِههُّنَّ فَإِنَّ اَ۬للَّهَ مِنۢ بَعْدِ إِكْرَٰهِهِنَّ غَفُورٞ رَّحِيمٞۖ","وَلَقَدَ اَنزَلْنَآ إِلَيْكُمُۥٓ ءَايَٰتٖ مُّبَيَّنَٰتٖ وَمَثَلاٗ مِّنَ اَ۬لذِينَ خَلَوْاْ مِن قَبْلِكُمْ وَمَوْعِظَةٗ لِّلْمُتَّقِينَۖ","۞ اَ۬للَّهُ نُورُ اُ۬لسَّمَٰوَٰتِ وَالَارْضِۖ مَثَلُ نُورِهِۦ كَمِشْكَوٰةٖ فِيهَا مِصْبَاحٌۖ اِ۬لْمِصْبَاحُ فِے زُجَاجَةٍۖ اِ۬لزُّجَاجَةُ كَأَنَّهَا كَوْكَبٞ دُرِّيّٞ يُوقَدُ مِن شَجَرَةٖ مُّبَٰرَكَةٖ زَيْتُونَةٖ لَّا شَرْقِيَّةٖ وَلَا غَرْبِيَّةٖ يَكَادُ زَيْتُهَا يُضِےٓءُ وَلَوْ لَمْ تَمْسَسْهُ نَارٞۖ نُّورٌ عَلَىٰ نُورٖۖ يَهْدِے اِ۬للَّهُ لِنُورِهِۦ مَنْ يَّشَآءُۖ وَيَضْرِبُ اُ۬للَّهُ اُ۬لَامْثَٰلَ لِلنَّاسِۖ وَاللَّهُ بِكُلِّ شَےْءٍ عَلِيمٞۖ","فِے بُيُوتٍ اَذِنَ اَ۬للَّهُ أَن تُرْفَعَ وَيُذْكَرَ فِيهَا اَ۪سْمُهُۥ يُسَبِّحُ لَهُۥ فِيهَا بِالْغُدُوِّ وَالَاصَالِ  رِجَالٞ لَّا تُلْهِيهِمْ تِجَٰرَةٞ وَلَا بَيْعٌ عَن ذِكْرِ اِ۬للَّهِ وَإِقَامِ اِ۬لصَّلَوٰةِ وَإِيتَآءِ اِ۬لزَّكَوٰةِۖ يَخَافُونَ يَوْماٗ تَتَقَلَّبُ فِيهِ اِ۬لْقُلُوبُ وَالَابْصَٰرُ","لِيَجْزِيَهُمُ اُ۬للَّهُ أَحْسَنَ مَا عَمِلُواْ وَيَزِيدَهُم مِّن فَضْلِهِۦۖ وَاللَّهُ يَرْزُقُ مَنْ يَّشَآءُ بِغَيْرِ حِسَابٖۖ","وَالذِينَ كَفَرُوٓاْ أَعْمَٰلُهُمْ كَسَرَابِۢ بِقِيعَةٖ يَحْسِبُهُ اُ۬لظَّمْـَٔانُ مَآءً حَتَّىٰٓ إِذَا جَآءَهُۥ لَمْ يَجِدْهُ شَئْاٗ وَوَجَدَ اَ۬للَّهَ عِندَهُۥ فَوَفّ۪يٰهُ حِسَابَهُۥۖ وَاللَّهُ سَرِيعُ اُ۬لْحِسَابِۖ","أَوْ كَظُلُمَٰتٖ فِے بَحْرٖ لُّجِّيّٖ يَغْش۪يٰهُ مَوْجٞ مِّن فَوْقِهِۦ مَوْجٞ مِّن فَوْقِهِۦ سَحَابٞۖ ظُلُمَٰتُۢ بَعْضُهَا فَوْقَ بَعْضٍۖ اِذَآ أَخْرَجَ يَدَهُۥ لَمْ يَكَدْ يَر۪يٰهَاۖ وَمَن لَّمْ يَجْعَلِ اِ۬للَّهُ لَهُۥ نُوراٗ فَمَا لَهُۥ مِن نُّورٍۖ","اَلَمْ تَرَ أَنَّ اَ۬للَّهَ يُسَبِّحُ لَهُۥ مَن فِے اِ۬لسَّمَٰوَٰتِ وَالَارْضِ وَالطَّيْرُ صَٰٓفَّٰتٖۖ كُلّٞ قَدْ عَلِمَ صَلَاتَهُۥ وَتَسْبِيحَهُۥۖ وَاللَّهُ عَلِيمُۢ بِمَا يَفْعَلُونَۖ","وَلِلهِ مُلْكُ اُ۬لسَّمَٰوَٰتِ وَالَارْضِۖ وَإِلَى اَ۬للَّهِ اِ۬لْمَصِيرُۖ","۞ أَلَمْ تَرَ أَنَّ اَ۬للَّهَ يُزْجِے سَحَاباٗ ثُمَّ يُوَ۬لِّفُ بَيْنَهُۥ ثُمَّ يَجْعَلُهُۥ رُكَاماٗ فَتَرَى اَ۬لْوَدْقَ يَخْرُجُ مِنْ خِلَٰلِهِۖۦ وَيُنَزِّلُ مِنَ اَ۬لسَّمَآءِ مِن جِبَالٖ فِيهَا مِنۢ بَرَدٖ فَيُصِيبُ بِهِۦ مَنْ يَّشَآءُ وَيَصْرِفُهُۥ عَن مَّنْ يَّشَآءُۖ يَكَادُ سَنَا بَرْقِهِۦ يَذْهَبُ بِالَابْصٰ۪رِۖ  يُقَلِّبُ اُ۬للَّهُ اُ۬ليْلَ وَالنَّهَارَۖ إِنَّ فِے ذَٰلِكَ لَعِبْرَةٗ لِّأُوْلِے اِ۬لَابْصٰ۪رِۖ","وَاللَّهُ خَلَقَ كُلَّ دَآبَّةٖ مِّن مَّآءٖۖ فَمِنْهُم مَّنْ يَّمْشِے عَلَىٰ بَطْنِهِۦۖ وَمِنْهُم مَّنْ يَّمْشِے عَلَىٰ رِجْلَيْنِۖ وَمِنْهُم مَّنْ يَّمْشِے عَلَىٰٓ أَرْبَعٖۖ يَخْلُقُ اُ۬للَّهُ مَا يَشَآءُۖ اِ۪نَّ اَ۬للَّهَ عَلَىٰ كُلِّ شَےْءٖ قَدِيرٞۖ","لَّقَدَ اَنزَلْنَآ ءَايَٰتٖ مُّبَيَّنَٰتٖۖ وَاللَّهُ يَهْدِے مَنْ يَّشَآءُ اِ۪لَىٰ صِرَٰطٖ مُّسْتَقِيمٖۖ","وَيَقُولُونَ ءَامَنَّا بِاللَّهِ وَبِالرَّسُولِ وَأَطَعْنَا ثُمَّ يَتَوَلّ۪ىٰ فَرِيقٞ مِّنْهُم مِّنۢ بَعْدِ ذَٰلِكَۖ وَمَآ أُوْلَٰٓئِكَ بِالْمُومِنِينَۖ","وَإِذَا دُعُوٓاْ إِلَى اَ۬للَّهِ وَرَسُولِهِۦ لِيَحْكُمَ بَيْنَهُمُۥٓ إِذَا فَرِيقٞ مِّنْهُم مُّعْرِضُونَۖ","وَإِنْ يَّكُن لَّهُمُ اُ۬لْحَقُّ يَاتُوٓاْ إِلَيْهِ مُذْعِنِينَۖ","أَفِے قُلُوبِهِم مَّرَضٌ اَمِ اِ۪رْتَابُوٓاْ أَمْ يَخَافُونَ أَنْ يَّحِيفَ اَ۬للَّهُ عَلَيْهِمْ وَرَسُولُهُۥۖ بَلُ ا۟وْلَٰٓئِكَ هُمُ اُ۬لظَّٰلِمُونَۖ","إِنَّمَا كَانَ قَوْلَ اَ۬لْمُومِنِينَ إِذَا دُعُوٓاْ إِلَى اَ۬للَّهِ وَرَسُولِهِۦ لِيَحْكُمَ بَيْنَهُمُۥٓ أَنْ يَّقُولُواْ سَمِعْنَا وَأَطَعْنَاۖ وَأُوْلَٰٓئِكَ هُمُ اُ۬لْمُفْلِحُونَۖ","وَمَنْ يُّطِعِ اِ۬للَّهَ وَرَسُولَهُۥ وَيَخْشَ اَ۬للَّهَ وَيَتَّقِهِۦ فَأُوْلَٰٓئِكَ هُمُ اُ۬لْفَآئِزُونَۖ","۞ وَأَقْسَمُواْ بِاللَّهِ جَهْدَ أَيْمَٰنِهِمْ لَئِنَ اَمَرْتَهُمْ لَيَخْرُجُنَّۖ قُل لَّا تُقْسِمُواْۖ طَاعَةٞ مَّعْرُوفَةٌۖ اِنَّ اَ۬للَّهَ خَبِيرُۢ بِمَا تَعْمَلُونَۖ","قُلَ اَطِيعُواْ اُ۬للَّهَ وَأَطِيعُواْ اُ۬لرَّسُولَۖ فَإِن تَوَلَّوْاْ فَإِنَّمَا عَلَيْهِ مَا حُمِّلَ وَعَلَيْكُم مَّا حُمِّلْتُمْۖ وَإِن تُطِيعُوهُ تَهْتَدُواْۖ وَمَا عَلَى اَ۬لرَّسُولِ إِلَّا اَ۬لْبَلَٰغُ اُ۬لْمُبِينُۖ","وَعَدَ اَ۬للَّهُ اُ۬لذِينَ ءَامَنُواْ مِنكُمْ وَعَمِلُواْ اُ۬لصَّٰلِحَٰتِ لَيَسْتَخْلِفَنَّهُمْ فِے اِ۬لَارْضِ كَمَا اَ۪سْتَخْلَفَ اَ۬لذِينَ مِن قَبْلِهِمْ وَلَيُمَكِّنَنَّ لَهُمْ دِينَهُمُ اُ۬لذِے اِ۪رْتَض۪ىٰ لَهُمْ وَلَيُبَدِّلَنَّهُم مِّنۢ بَعْدِ خَوْفِهِمُۥٓ أَمْناٗۖ يَعْبُدُونَنِے لَا يُشْرِكُونَ بِے شَئْاٗۖ وَمَن كَفَرَ بَعْدَ ذَٰلِكَ فَأُوْلَٰٓئِكَ هُمُ اُ۬لْفَٰسِقُونَۖ","وَأَقِيمُواْ اُ۬لصَّلَوٰةَ وَءَاتُواْ اُ۬لزَّكَوٰةَۖ وَأَطِيعُواْ اُ۬لرَّسُولَ لَعَلَّكُمْ تُرْحَمُونَۖ","لَا تَحْسِبَنَّ اَ۬لذِينَ كَفَرُواْ مُعْجِزِينَ فِے اِ۬لَارْضِۖ وَمَأْو۪يٰهُمُ اُ۬لنَّارُۖ وَلَبِيسَ اَ۬لْمَصِيرُۖ","يَٰٓأَيُّهَا اَ۬لذِينَ ءَامَنُواْ لِيَسْتَٰذِنكُمُ اُ۬لذِينَ مَلَكَتَ اَيْمَٰنُكُمْ وَالذِينَ لَمْ يَبْلُغُواْ اُ۬لْحُلُمَ مِنكُمْ ثَلَٰثَ مَرَّٰتٖ مِّن قَبْلِ صَلَوٰةِ اِ۬لْفَجْرِ وَحِينَ تَضَعُونَ ثِيَابَكُم مِّنَ اَ۬لظَّهِيرَةِ وَمِنۢ بَعْدِ صَلَوٰةِ اِ۬لْعِشَآءِۖ ثَلَٰثُ عَوْرَٰتٖ لَّكُمْۖ لَيْسَ عَلَيْكُمْ وَلَا عَلَيْهِمْ جُنَاحُۢ بَعْدَهُنَّۖ طَوَّٰفُونَ عَلَيْكُمۖ بَعْضُكُمْ عَلَىٰ بَعْضٖۖ كَذَٰلِكَ يُبَيِّنُ اُ۬للَّهُ لَكُمُ اُ۬لَايَٰتِۖ وَاللَّهُ عَلِيمٌ حَكِيمٞۖ","وَإِذَا بَلَغَ اَ۬لَاطْفَٰلُ مِنكُمُ اُ۬لْحُلُمَ فَلْيَسْتَٰذِنُواْ كَمَا اَ۪سْتَٰذَنَ اَ۬لذِينَ مِن قَبْلِهِمْۖ كَذَٰلِكَ يُبَيِّنُ اُ۬للَّهُ لَكُمُۥٓ ءَايَٰتِهِۦۖ وَاللَّهُ عَلِيمٌ حَكِيمٞۖ","۞ وَالْقَوَٰعِدُ مِنَ اَ۬لنِّسَآءِ اِ۬لتِے لَا يَرْجُونَ نِكَاحاٗ فَلَيْسَ عَلَيْهِنَّ جُنَاحٌ اَنْ يَّضَعْنَ ثِيَابَهُنَّ غَيْرَ مُتَبَرِّجَٰتِۢ بِزِينَةٖۖ وَأَنْ يَّسْتَعْفِفْنَ خَيْرٞ لَّهُنَّۖ وَاللَّهُ سَمِيعٌ عَلِيمٞۖ","لَّيْسَ عَلَى اَ۬لَاعْم۪ىٰ حَرَجٞ وَلَا عَلَى اَ۬لَاعْرَجِ حَرَجٞ وَلَا عَلَى اَ۬لْمَرِيضِ حَرَجٞ وَلَا عَلَىٰٓ أَنفُسِكُمُۥٓ أَن تَاكُلُواْ مِنۢ بُيُوتِكُمُۥٓ أَوْ بُيُوتِ ءَابَآئِكُمُۥٓ أَوْ بُيُوتِ أُمَّهَٰتِكُمُۥٓ أَوْ بُيُوتِ إِخْوَٰنِكُمُۥٓ أَوْ بُيُوتِ أَخَوَٰتِكُمُۥٓ أَوْ بُيُوتِ أَعْمَٰمِكُمُۥٓ أَوْ بُيُوتِ عَمَّٰتِكُمُۥٓ أَوْ بُيُوتِ أَخْوَٰلِكُمُۥٓ أَوْ بُيُوتِ خَٰلَٰتِكُمُۥٓ أَوْ مَا مَلَكْتُم مَّفَاتِحَهُۥٓ أَوْ صَدِيقِكُمْۖ لَيْسَ عَلَيْكُمْ جُنَاحٌ اَن تَاكُلُواْ جَمِيعاً اَوَ اَشْتَاتاٗۖ فَإِذَا دَخَلْتُم بُيُوتاٗ فَسَلِّمُواْ عَلَىٰٓ أَنفُسِكُمْ تَحِيَّةٗ مِّنْ عِندِ اِ۬للَّهِ مُبَٰرَكَةٗ طَيِّبَةٗۖ كَذَٰلِكَ يُبَيِّنُ اُ۬للَّهُ لَكُمُ اُ۬لَايَٰتِ لَعَلَّكُمْ تَعْقِلُونَۖ","إِنَّمَا اَ۬لْمُومِنُونَ اَ۬لذِينَ ءَامَنُواْ بِاللَّهِ وَرَسُولِهِۦ وَإِذَا كَانُواْ مَعَهُۥ عَلَىٰٓ أَمْرٖ جَامِعٖ لَّمْ يَذْهَبُواْ حَتَّىٰ يَسْتَٰذِنُوهُۖ إِنَّ اَ۬لذِينَ يَسْتَٰذِنُونَكَ أُوْلَٰٓئِكَ اَ۬لذِينَ يُومِنُونَ بِاللَّهِ وَرَسُولِهِۦۖ فَإِذَا اَ۪سْتَٰذَنُوكَ لِبَعْضِ شَأْنِهِمْ فَاذَن لِّمَن شِئْتَ مِنْهُمْ وَاسْتَغْفِرْ لَهُمُ اُ۬للَّهَۖ إِنَّ اَ۬للَّهَ غَفُورٞ رَّحِيمٞۖ","۞ لَّا تَجْعَلُواْ دُعَآءَ اَ۬لرَّسُولِ بَيْنَكُمْ كَدُعَآءِ بَعْضِكُم بَعْضاٗۖ قَدْ يَعْلَمُ اُ۬للَّهُ اُ۬لذِينَ يَتَسَلَّلُونَ مِنكُمْ لِوَاذاٗۖ فَلْيَحْذَرِ اِ۬لذِينَ يُخَالِفُونَ عَنَ اَمْرِهِۦٓ أَن تُصِيبَهُمْ فِتْنَةٌ اَوْ يُصِيبَهُمْ عَذَابٌ اَلِيمٌۖ","اَلَآ إِنَّ لِلهِ مَا فِے اِ۬لسَّمَٰوَٰتِ وَالَارْضِۖ قَدْ يَعْلَمُ مَآ أَنتُمْ عَلَيْهِۖ وَيَوْمَ يُرْجَعُونَ إِلَيْهِ فَيُنَبِّئُهُم بِمَا عَمِلُواْۖ وَاللَّهُ بِكُلِّ شَےْءٍ عَلِيمٞۖ"]],["الفرقان",["تَبَٰرَكَ اَ۬لذِے نَزَّلَ اَ۬لْفُرْقَانَ عَلَىٰ عَبْدِهِۦ لِيَكُونَ لِلْعَٰلَمِينَ نَذِيراًۖ","اِ۬لذِے لَهُۥ مُلْكُ اُ۬لسَّمَٰوَٰتِ وَالَارْضِ وَلَمْ يَتَّخِذْ وَلَداٗ وَلَمْ يَكُن لَّهُۥ شَرِيكٞ فِے اِ۬لْمُلْكِۖ وَخَلَقَ كُلَّ شَےْءٖ فَقَدَّرَهُۥ تَقْدِيراٗۖ","وَاتَّخَذُواْ مِن دُونِهِۦٓ ءَالِهَةٗ لَّا يَخْلُقُونَ شَئْاٗ وَهُمْ يُخْلَقُونَ وَلَا يَمْلِكُونَ لِأَنفُسِهِمْ ضَرّاٗ وَلَا نَفْعاٗ وَلَا يَمْلِكُونَ مَوْتاٗ وَلَا حَيَوٰةٗ وَلَا نُشُوراٗۖ","وَقَالَ اَ۬لذِينَ كَفَرُوٓاْ إِنْ هَٰذَآ إِلَّآ إِفْكٌ اِ۪فْتَر۪يٰهُ وَأَعَانَهُۥ عَلَيْهِ قَوْمٌ اٰخَرُونَۖ فَقَدْ جَآءُو ظُلْماٗ وَزُوراٗ","وَقَالُوٓاْ أَسَٰطِيرُ اُ۬لَاوَّلِينَ اَ۪كْتَتَبَهَا فَهِيَ تُمْل۪ىٰ عَلَيْهِ بُكْرَةٗ وَأَصِيلاٗۖ","قُلَ اَنزَلَهُ اُ۬لذِے يَعْلَمُ اُ۬لسِّرَّ فِے اِ۬لسَّمَٰوَٰتِ وَالَارْضِۖ إِنَّهُۥ كَانَ غَفُوراٗ رَّحِيماٗۖ","وَقَالُواْ مَالِ هَٰذَا اَ۬لرَّسُولِ يَاكُلُ اُ۬لطَّعَامَ وَيَمْشِے فِے اِ۬لَاسْوَاقِ لَوْلَآ أُنزِلَ إِلَيْهِ مَلَكٞ فَيَكُونَ مَعَهُۥ نَذِيراً","اَوْ يُلْق۪ىٰٓ إِلَيْهِ كَنزٌ اَوْ تَكُونُ لَهُۥ جَنَّةٞ يَاكُلُ مِنْهَاۖ وَقَالَ اَ۬لظَّٰلِمُونَ إِن تَتَّبِعُونَ إِلَّا رَجُلاٗ مَّسْحُوراًۖ","اُ۟نظُرْ كَيْفَ ضَرَبُواْ لَكَ اَ۬لَامْثَٰلَ فَضَلُّواْ فَلَا يَسْتَطِيعُونَ سَبِيلاٗۖ","۞ تَبَٰرَكَ اَ۬لذِےٓ إِن شَآءَ جَعَلَ لَكَ خَيْراٗ مِّن ذَٰلِكَ جَنَّٰتٖ تَجْرِے مِن تَحْتِهَا اَ۬لَانْهَٰرُ وَيَجْعَل لَّكَ قُصُوراَۢۖ","بَلْ كَذَّبُواْ بِالسَّاعَةِۖ وَأَعْتَدْنَا لِمَن كَذَّبَ بِالسَّاعَةِ سَعِيراً","اِذَا رَأَتْهُم مِّن مَّكَانِۢ بَعِيدٖ سَمِعُواْ لَهَا تَغَيُّظاٗ وَزَفِيراٗۖ","وَإِذَآ أُلْقُواْ مِنْهَا مَكَاناٗ ضَيِّقاٗ مُّقَرَّنِينَ دَعَوْاْ هُنَالِكَ ثُبُوراٗۖ","لَّا تَدْعُواْ اُ۬لْيَوْمَ ثُبُوراٗ وَٰحِداٗ وَادْعُواْ ثُبُوراٗ كَثِيراٗۖ","قُلَ اَذَٰلِكَ خَيْرٌ اَمْ جَنَّةُ اُ۬لْخُلْدِ اِ۬لتِے وُعِدَ اَ۬لْمُتَّقُونَۖ كَانَتْ لَهُمْ جَزَآءٗ وَمَصِيراٗۖ","لَّهُمْ فِيهَا مَا يَشَآءُونَ خَٰلِدِينَۖ كَانَ عَلَىٰ رَبِّكَ وَعْداٗ مَّسْـُٔولاٗۖ","وَيَوْمَ نَحْشُرُهُمْ وَمَا يَعْبُدُونَ مِن دُونِ اِ۬للَّهِ فَيَقُولُ ءَآنتُمُۥٓ أَضْلَلْتُمْ عِبَادِے هَٰٓؤُلَآءِ اَ۬مْ هُمْ ضَلُّواْ اُ۬لسَّبِيلَۖ","قَالُواْ سُبْحَٰنَكَ مَا كَانَ يَنۢبَغِے لَنَآ أَن نَّتَّخِذَ مِن دُونِكَ مِنَ اَوْلِيَآءَۖ وَلَٰكِن مَّتَّعْتَهُمْ وَءَابَآءَهُمْ حَتَّىٰ نَسُواْ اُ۬لذِّكْرَ وَكَانُواْ قَوْماَۢ بُوراٗۖ","فَقَدْ كَذَّبُوكُم بِمَا تَقُولُونَ فَمَا يَسْتَطِيعُونَ صَرْفاٗ وَلَا نَصْراٗۖ وَمَنْ يَّظْلِم مِّنكُمْ نُذِقْهُ عَذَاباٗ كَبِيراٗۖ","وَمَآ أَرْسَلْنَا قَبْلَكَ مِنَ اَ۬لْمُرْسَلِينَ إِلَّآ إِنَّهُمْ لَيَاكُلُونَ اَ۬لطَّعَامَ وَيَمْشُونَ فِے اِ۬لَاسْوَاقِۖ وَجَعَلْنَا بَعْضَكُمْ لِبَعْضٖ فِتْنَةًۖ اَتَصْبِرُونَۖ وَكَانَ رَبُّكَ بَصِيراٗۖ","۞ وَقَالَ اَ۬لذِينَ لَا يَرْجُونَ لِقَآءَنَا لَوْلَآ أُنزِلَ عَلَيْنَا اَ۬لْمَلَٰٓئِكَةُ أَوْ نَر۪ىٰ رَبَّنَاۖ لَقَدِ اِ۪سْتَكْبَرُواْ فِےٓ أَنفُسِهِمْ وَعَتَوْ عُتُوّاٗ كَبِيراٗۖ","يَوْمَ يَرَوْنَ اَ۬لْمَلَٰٓئِكَةَ لَا بُشْر۪ىٰ يَوْمَئِذٖ لِّلْمُجْرِمِينَۖ وَيَقُولُونَ حِجْراٗۖ مَّحْجُوراٗۖ","وَقَدِمْنَآ إِلَىٰ مَا عَمِلُواْ مِنْ عَمَلٖ فَجَعَلْنَٰهُ هَبَآءٗ مَّنثُوراًۖ","اَصْحَٰبُ اُ۬لْجَنَّةِ يَوْمَئِذٍ خَيْرٞ مُّسْتَقَرّاٗ وَأَحْسَنُ مَقِيلاٗۖ","وَيَوْمَ تَشَّقَّقُ اُ۬لسَّمَآءُ بِالْغَمَٰمِ وَنُزِّلَ اَ۬لْمَلَٰٓئِكَةُ تَنزِيلاًۖ","اِ۬لْمُلْكُ يَوْمَئِذٍ اِ۬لْحَقُّ لِلرَّحْمَٰنِۖ وَكَانَ يَوْماً عَلَى اَ۬لْكٰ۪فِرِينَ عَسِيراٗۖ","وَيَوْمَ يَعَضُّ اُ۬لظَّالِمُ عَلَىٰ يَدَيْهِ يَقُولُ يَٰلَيْتَنِے اِ۪تَّخَذتُّ مَعَ اَ۬لرَّسُولِ سَبِيلاٗ","يَٰوَيْلَت۪ىٰ لَيْتَنِے لَمَ اَتَّخِذْ فُلَٰناً خَلِيلاٗ","لَّقَدَ اَضَلَّنِے عَنِ اِ۬لذِّكْرِ بَعْدَ إِذْ جَآءَنِےۖ وَكَانَ اَ۬لشَّيْطَٰنُ لِلِانسَٰنِ خَذُولاٗۖ","وَقَالَ اَ۬لرَّسُولُ يَٰرَبِّ إِنَّ قَوْمِيَ اَ۪تَّخَذُواْ هَٰذَا اَ۬لْقُرْءَانَ مَهْجُوراٗۖ","وَكَذَٰلِكَ جَعَلْنَا لِكُلِّ نَبِےٓءٍ عَدُوّاٗ مِّنَ اَ۬لْمُجْرِمِينَۖ وَكَف۪ىٰ بِرَبِّكَ هَادِياٗ وَنَصِيراٗۖ","وَقَالَ اَ۬لذِينَ كَفَرُواْ لَوْلَا نُزِّلَ عَلَيْهِ اِ۬لْقُرْءَانُ جُمْلَةٗ وَٰحِدَةٗۖ كَذَٰلِكَ لِنُثَبِّتَ بِهِۦ فُؤَادَكَۖ وَرَتَّلْنَٰهُ تَرْتِيلاٗۖ","وَلَا يَاتُونَكَ بِمَثَلٍ اِلَّا جِئْنَٰكَ بِالْحَقِّ وَأَحْسَنَ تَفْسِيراًۖ","اِ۬لذِينَ يُحْشَرُونَ عَلَىٰ وُجُوهِهِمُۥٓ إِلَىٰ جَهَنَّمَ أُوْلَٰٓئِكَ شَرّٞ مَّكَاناٗ وَأَضَلُّ سَبِيلاٗۖ","۞ وَلَقَدَ اٰتَيْنَا مُوسَى اَ۬لْكِتَٰبَ وَجَعَلْنَا مَعَهُۥٓ أَخَاهُ هَٰرُونَ وَزِيراٗۖ","فَقُلْنَا اَ۪ذْهَبَآ إِلَى اَ۬لْقَوْمِ اِ۬لذِينَ كَذَّبُواْ بِـَٔايَٰتِنَاۖ فَدَمَّرْنَٰهُمْ تَدْمِيراٗۖ","وَقَوْمَ نُوحٖ لَّمَّا كَذَّبُواْ اُ۬لرُّسُلَ أَغْرَقْنَٰهُمْ وَجَعَلْنَٰهُمْ لِلنَّاسِ ءَايَةٗۖ وَأَعْتَدْنَا لِلظَّٰلِمِينَ عَذَاباً اَلِيماٗۖ","وَعَاداٗ وَثَمُوداٗ وَأَصْحَٰبَ اَ۬لرَّسِّ وَقُرُوناَۢ بَيْنَ ذَٰلِكَ كَثِيراٗۖ","وَكُلّاٗ ضَرَبْنَا لَهُ اُ۬لَامْثَٰلَۖ وَكُلّاٗ تَبَّرْنَا تَتْبِيراٗۖ","وَلَقَدَ اَتَوْاْ عَلَى اَ۬لْقَرْيَةِ اِ۬لتِےٓ أُمْطِرَتْ مَطَرَ اَ۬لسَّوْءِۖ اَ۬فَلَمْ يَكُونُواْ يَرَوْنَهَاۖ بَلْ كَانُواْ لَا يَرْجُونَ نُشُوراٗۖ","وَإِذَا رَأَوْكَ إِنْ يَّتَّخِذُونَكَ إِلَّا هُزُؤاًۖ اَهَٰذَا اَ۬لذِے بَعَثَ اَ۬للَّهُ رَسُولاً","اِن كَادَ لَيُضِلُّنَا عَنَ اٰلِهَتِنَا لَوْلَآ أَن صَبَرْنَا عَلَيْهَاۖ وَسَوْفَ يَعْلَمُونَ حِينَ يَرَوْنَ اَ۬لْعَذَابَ مَنَ اَضَلُّ سَبِيلاًۖ","اَرَٰٓيْتَ مَنِ اِ۪تَّخَذَ إِلَٰهَهُۥ هَو۪يٰهُ أَفَأَنتَ تَكُونُ عَلَيْهِ وَكِيلاًۖ","اَمْ تَحْسِبُ أَنَّ أَكْثَرَهُمْ يَسْمَعُونَ أَوْ يَعْقِلُونَۖ إِنْ هُمُۥٓ إِلَّا كَالَانْعَٰمِ بَلْ هُمُۥٓ أَضَلُّ سَبِيلاًۖ","۞ اَلَمْ تَرَ إِلَىٰ رَبِّكَ كَيْفَ مَدَّ اَ۬لظِّلَّۖ وَلَوْ شَآءَ لَجَعَلَهُۥ سَاكِناٗۖ ثُمَّ جَعَلْنَا اَ۬لشَّمْسَ عَلَيْهِ دَلِيلاٗ","ثُمَّ قَبَضْنَٰهُ إِلَيْنَا قَبْضاٗ يَسِيراٗۖ","وَهُوَ اَ۬لذِے جَعَلَ لَكُمُ اُ۬ليْلَ لِبَاساٗ وَالنَّوْمَ سُبَاتاٗ وَجَعَلَ اَ۬لنَّهَارَ نُشُوراٗۖ","وَهُوَ اَ۬لذِےٓ أَرْسَلَ اَ۬لرِّيَٰحَ نُشُراَۢ بَيْنَ يَدَےْ رَحْمَتِهِۦۖ وَأَنزَلْنَا مِنَ اَ۬لسَّمَآءِ مَآءٗ طَهُوراٗ","لِّنُحْـِۧيَ بِهِۦ بَلْدَةٗ مَّيْتاٗ وَنُسْقِيَهُۥ مِمَّا خَلَقْنَآ أَنْعَٰماٗ وَأَنَاسِيَّ كَثِيراٗۖ","وَلَقَدْ صَرَّفْنَٰهُ بَيْنَهُمْ لِيَذَّكَّرُواْ فَأَب۪ىٰٓ أَكْثَرُ اُ۬لنَّاسِ إِلَّا كُفُوراٗۖ","وَلَوْ شِئْنَا لَبَعَثْنَا فِے كُلِّ قَرْيَةٖ نَّذِيراٗۖ","فَلَا تُطِعِ اِ۬لْكٰ۪فِرِينَۖ وَجَٰهِدْهُم بِهِۦ جِهَاداٗ كَبِيراٗۖ","وَهُوَ اَ۬لذِے مَرَجَ اَ۬لْبَحْرَيْنِ هَٰذَا عَذْبٞ فُرَاتٞ وَهَٰذَا مِلْحٌ ا۟جَاجٞۖ وَجَعَلَ بَيْنَهُمَا بَرْزَخاٗ وَحِجْراٗ مَّحْجُوراٗۖ","وَهُوَ اَ۬لذِے خَلَقَ مِنَ اَ۬لْمَآءِ بَشَراٗ فَجَعَلَهُۥ نَسَباٗ وَصِهْراٗۖ وَكَانَ رَبُّكَ قَدِيراٗۖ","وَيَعْبُدُونَ مِن دُونِ اِ۬للَّهِ مَا لَا يَنفَعُهُمْ وَلَا يَضُرُّهُمْۖ وَكَانَ اَ۬لْكَافِرُ عَلَىٰ رَبِّهِۦ ظَهِيراٗۖ","وَمَآ أَرْسَلْنَٰكَ إِلَّا مُبَشِّراٗ وَنَذِيراٗۖ","قُلْ مَآ أَسْـَٔلُكُمْ عَلَيْهِ مِنَ اَجْرٍ اِلَّا مَن شَآءَ انْ يَّتَّخِذَ إِلَىٰ رَبِّهِۦ سَبِيلاٗۖ","وَتَوَكَّلْ عَلَى اَ۬لْحَيِّ اِ۬لذِے لَا يَمُوتُۖ وَسَبِّحْ بِحَمْدِهِۦۖ وَكَف۪ىٰ بِهِۦ بِذُنُوبِ عِبَادِهِۦ خَبِيراًۖ","اِ۬لذِے خَلَقَ اَ۬لسَّمَٰوَٰتِ وَالَارْضَ وَمَا بَيْنَهُمَا فِے سِتَّةِ أَيَّامٖ ثُمَّ اَ۪سْتَو۪ىٰ عَلَى اَ۬لْعَرْشِۖ اِ۬لرَّحْمَٰنُۖ فَسْـَٔلْ بِهِۦ خَبِيراٗۖ","وَإِذَا قِيلَ لَهُمُ اُ۟سْجُدُواْ لِلرَّحْمَٰنِ قَالُواْ وَمَا اَ۬لرَّحْمَٰنُۖ أَنَسْجُدُ لِمَا تَامُرُنَا وَزَادَهُمْ نُفُوراٗۖ۩","۞ تَبَٰرَكَ اَ۬لذِے جَعَلَ فِے اِ۬لسَّمَآءِ بُرُوجاٗ وَجَعَلَ فِيهَا سِرَٰجاٗ وَقَمَراٗ مُّنِيراٗۖ","وَهُوَ اَ۬لذِے جَعَلَ اَ۬ليْلَ وَالنَّهَارَ خِلْفَةٗ لِّمَنَ اَرَادَ أَنْ يَّذَّكَّرَ أَوَ اَرَادَ شُكُوراٗۖ","وَعِبَادُ اُ۬لرَّحْمَٰنِ اِ۬لذِينَ يَمْشُونَ عَلَى اَ۬لَارْضِ هَوْناٗ وَإِذَا خَاطَبَهُمُ اُ۬لْجَٰهِلُونَ قَالُواْ سَلَٰماٗۖ","وَالذِينَ يَبِيتُونَ لِرَبِّهِمْ سُجَّداٗ وَقِيَٰماٗۖ","وَالذِينَ يَقُولُونَ رَبَّنَا اَ۪صْرِفْ عَنَّا عَذَابَ جَهَنَّمَ إِنَّ عَذَابَهَا كَانَ غَرَاماًۖ","اِنَّهَا سَآءَتْ مُسْتَقَرّاٗ وَمُقَاماٗۖ","وَالذِينَ إِذَآ أَنفَقُواْ لَمْ يُسْرِفُواْ وَلَمْ يُقْتِرُواْ وَكَانَ بَيْنَ ذَٰلِكَ قَوَاماٗۖ","وَالذِينَ لَا يَدْعُونَ مَعَ اَ۬للَّهِ إِلَٰهاً اٰخَرَ وَلَا يَقْتُلُونَ اَ۬لنَّفْسَ اَ۬لتِے حَرَّمَ اَ۬للَّهُ إِلَّا بِالْحَقِّ وَلَا يَزْنُونَۖ وَمَنْ يَّفْعَلْ ذَٰلِكَ يَلْقَ أَثَاماٗ","يُضَٰعَفْ لَهُ اُ۬لْعَذَابُ يَوْمَ اَ۬لْقِيَٰمَةِ وَيَخْلُدْ فِيهِ مُهَاناً","اِلَّا مَن تَابَ وَءَامَنَ وَعَمِلَ عَمَلاٗ صَٰلِحاٗ فَأُوْلَٰٓئِكَ يُبَدِّلُ اُ۬للَّهُ سَيِّـَٔاتِهِمْ حَسَنَٰتٖۖ وَكَانَ اَ۬للَّهُ غَفُوراٗ رَّحِيماٗۖ","وَمَن تَابَ وَعَمِلَ صَٰلِحاٗ فَإِنَّهُۥ يَتُوبُ إِلَى اَ۬للَّهِ مَتَاباٗۖ","وَالذِينَ لَا يَشْهَدُونَ اَ۬لزُّورَ وَإِذَا مَرُّواْ بِاللَّغْوِ مَرُّواْ كِرَاماٗۖ","وَالذِينَ إِذَا ذُكِّرُواْ بِـَٔايَٰتِ رَبِّهِمْ لَمْ يَخِرُّواْ عَلَيْهَا صُمّاٗ وَعُمْيَاناٗۖ","وَالذِينَ يَقُولُونَ رَبَّنَا هَبْ لَنَا مِنَ اَزْوَٰجِنَا وَذُرِّيَّٰتِنَا قُرَّةَ أَعْيُنٖ وَاجْعَلْنَا لِلْمُتَّقِينَ إِمَاماًۖ","ا۟وْلَٰٓئِكَ يُجْزَوْنَ اَ۬لْغُرْفَةَ بِمَا صَبَرُواْ وَيُلَقَّوْنَ فِيهَا تَحِيَّةٗ وَسَلَٰماً","خَٰلِدِينَ فِيهَاۖ حَسُنَتْ مُسْتَقَرّاٗ وَمُقَاماٗۖ","قُلْ مَا يَعْبَؤُاْ بِكُمْ رَبِّے لَوْلَا دُعَآؤُكُمْۖ فَقَدْ كَذَّبْتُمْ فَسَوْفَ يَكُونُ لِزَاماٗۖ"]],["الشعراء",["طَسِٓمِّٓۖ تِلْكَ ءَايَٰتُ اُ۬لْكِتَٰبِ اِ۬لْمُبِينِۖ","لَعَلَّكَ بَٰخِعٞ نَّفْسَكَ أَلَّا يَكُونُواْ مُومِنِينَۖ","إِن نَّشَأْ نُنَزِّلْ عَلَيْهِم مِّنَ اَ۬لسَّمَآءِ اَ۟يَةٗ فَظَلَّتَ اَعْنَٰقُهُمْ لَهَا خَٰضِعِينَۖ","وَمَا يَاتِيهِم مِّن ذِكْرٖ مِّنَ اَ۬لرَّحْمَٰنِ مُحْدَثٍ اِلَّا كَانُواْ عَنْهُ مُعْرِضِينَۖ","فَقَدْ كَذَّبُواْ فَسَيَاتِيهِمُۥٓ أَنۢبَٰٓؤُاْ مَا كَانُواْ بِهِۦ يَسْتَهْزِءُونَۖ","أَوَلَمْ يَرَوِاْ اِلَى اَ۬لَارْضِ كَمَ اَنۢبَتْنَا فِيهَا مِن كُلِّ زَوْجٖ كَرِيمٍۖ","اِنَّ فِے ذَٰلِكَ لَأٓيَةٗۖ وَمَا كَانَ أَكْثَرُهُم مُّومِنِينَۖ","وَإِنَّ رَبَّكَ لَهُوَ اَ۬لْعَزِيزُ اُ۬لرَّحِيمُۖ","وَإِذْ نَاد۪ىٰ رَبُّكَ مُوس۪ىٰٓ أَنِ اِ۪يتِ اِ۬لْقَوْمَ اَ۬لظَّٰلِمِينَ","قَوْمَ فِرْعَوْنَۖ أَلَا يَتَّقُونَۖ","قَالَ رَبِّ إِنِّيَ أَخَافُ أَنْ يُّكَذِّبُونِ","وَيَضِيقُ صَدْرِے وَلَا يَنطَلِقُ لِسَانِے فَأَرْسِلِ اِلَىٰ هَٰرُونَ","وَلَهُمْ عَلَيَّ ذَنۢبٞ فَأَخَافُ أَنْ يَّقْتُلُونِۖ","قَالَ كَلَّاۖ فَاذْهَبَا بِـَٔايَٰتِنَآ إِنَّا مَعَكُم مُّسْتَمِعُونَۖ","فَاتِيَا فِرْعَوْنَ فَقُولَآ إِنَّا رَسُولُ رَبِّ اِ۬لْعَٰلَمِينَ","أَنَ اَرْسِلْ مَعَنَا بَنِےٓ إِسْرَآءِيلَۖ","قَالَ أَلَمْ نُرَبِّكَ فِينَا وَلِيداٗ وَلَبِثْتَ فِينَا مِنْ عُمُرِكَ سِنِينَ","وَفَعَلْتَ فَعْلَتَكَ اَ۬لتِے فَعَلْتَ وَأَنتَ مِنَ اَ۬لْكٰ۪فِرِينَۖ","قَالَ فَعَلْتُهَآ إِذاٗ وَأَنَا مِنَ اَ۬لضَّآلِّينَۖ","فَفَرَرْتُ مِنكُمْ لَمَّا خِفْتُكُمْ فَوَهَبَ لِے رَبِّے حُكْماٗ وَجَعَلَنِے مِنَ اَ۬لْمُرْسَلِينَۖ","وَتِلْكَ نِعْمَةٞ تَمُنُّهَا عَلَيَّ أَنْ عَبَّدتَّ بَنِےٓ إِسْرَآءِيلَۖ","قَالَ فِرْعَوْنُ وَمَا رَبُّ اُ۬لْعَٰلَمِينَۖ","قَالَ رَبُّ اُ۬لسَّمَٰوَٰتِ وَالَارْضِ وَمَا بَيْنَهُمَآ إِن كُنتُم مُّوقِنِينَۖ","۞ قَالَ لِمَنْ حَوْلَهُۥٓ أَلَا تَسْتَمِعُونَۖ","قَالَ رَبُّكُمْ وَرَبُّ ءَابَآئِكُمُ اُ۬لَاوَّلِينَۖ","قَالَ إِنَّ رَسُولَكُمُ اُ۬لذِےٓ أُرْسِلَ إِلَيْكُمْ لَمَجْنُونٞۖ","قَالَ رَبُّ اُ۬لْمَشْرِقِ وَالْمَغْرِبِ وَمَا بَيْنَهُمَآ إِن كُنتُمْ تَعْقِلُونَۖ","قَالَ لَئِنِ اِ۪تَّخَذتَّ إِلَٰهاً غَيْرِے لَأَجْعَلَنَّكَ مِنَ اَ۬لْمَسْجُونِينَۖ","قَالَ أَوَلَوْ جِئْتُكَ بِشَےْءٖ مُّبِينٖۖ","قَالَ فَاتِ بِهِۦٓ إِن كُنتَ مِنَ اَ۬لصَّٰدِقِينَۖ","فَأَلْق۪ىٰ عَصَاهُ فَإِذَا هِيَ ثُعْبَانٞ مُّبِينٞ","وَنَزَعَ يَدَهُۥ فَإِذَا هِيَ بَيْضَآءُ لِلنَّٰظِرِينَۖ","قَالَ لِلْمَلَإِ حَوْلَهُۥٓ إِنَّ هَٰذَا لَسَٰحِرٌ عَلِيمٞ","يُرِيدُ أَنْ يُّخْرِجَكُم مِّنَ اَرْضِكُم بِسِحْرِهِۦ فَمَاذَا تَامُرُونَۖ","قَالُوٓاْ أَرْجِهِۦ وَأَخَاهُ وَابْعَثْ فِے اِ۬لْمَدَآئِنِ حَٰشِرِينَ","يَاتُوكَ بِكُلِّ سَحّ۪ارٍ عَلِيمٖۖ","فَجُمِعَ اَ۬لسَّحَرَةُ لِمِيقَٰتِ يَوْمٖ مَّعْلُومٖۖ","وَقِيلَ لِلنَّاسِ هَلَ اَنتُم مُّجْتَمِعُونَ","لَعَلَّنَا نَتَّبِعُ اُ۬لسَّحَرَةَ إِن كَانُواْ هُمُ اُ۬لْغَٰلِبِينَۖ","فَلَمَّا جَآءَ اَ۬لسَّحَرَةُ قَالُواْ لِفِرْعَوْنَ أَئِنَّ لَنَا لَأَجْراً اِن كُنَّا نَحْنُ اُ۬لْغَٰلِبِينَۖ","قَالَ نَعَمْ وَإِنَّكُمُۥٓ إِذاٗ لَّمِنَ اَ۬لْمُقَرَّبِينَۖ","قَالَ لَهُم مُّوس۪ىٰٓ أَلْقُواْ مَآ أَنتُم مُّلْقُونَۖ","فَأَلْقَوْاْ حِبَالَهُمْ وَعِصِيَّهُمْ وَقَالُواْ بِعِزَّةِ فِرْعَوْنَ إِنَّا لَنَحْنُ اُ۬لْغَٰلِبُونَۖ","فَأَلْق۪ىٰ مُوس۪ىٰ عَصَاهُ فَإِذَا هِيَ تَلَقَّفُ مَا يَافِكُونَۖ","فَأُلْقِيَ اَ۬لسَّحَرَةُ سَٰجِدِينَۖ","قَالُوٓاْ ءَامَنَّا بِرَبِّ اِ۬لْعَٰلَمِينَۖ","رَبِّ مُوس۪ىٰ وَهَٰرُونَۖ","قَالَ ءَاٰ۬مَنتُمْ لَهُۥ قَبْلَ أَنَ اٰذَنَ لَكُمُۥٓ إِنَّهُۥ لَكَبِيرُكُمُ اُ۬لذِے عَلَّمَكُمُ اُ۬لسِّحْرَۖ فَلَسَوْفَ تَعْلَمُونَۖ","لَأُقَطِّعَنَّ أَيْدِيَكُمْ وَأَرْجُلَكُم مِّنْ خِلَٰفٖ وَلَأُصَلِّبَنَّكُمُۥٓ أَجْمَعِينَۖ","۞ قَالُواْ لَا ضَيْرَۖ إِنَّآ إِلَىٰ رَبِّنَا مُنقَلِبُونَۖ","إِنَّا نَطْمَعُ أَنْ يَّغْفِرَ لَنَا رَبُّنَا خَطَٰيٰ۪نَآ أَن كُنَّآ أَوَّلَ اَ۬لْمُومِنِينَۖ","وَأَوْحَيْنَآ إِلَىٰ مُوس۪ىٰٓ أَنِ اِ۪سْرِ بِعِبَادِيَ إِنَّكُم مُّتَّبَعُونَۖ","فَأَرْسَلَ فِرْعَوْنُ فِے اِ۬لْمَدَآئِنِ حَٰشِرِينَۖ","إِنَّ هَٰٓؤُلَآءِ لَشِرْذِمَةٞ قَلِيلُونَ","وَإِنَّهُمْ لَنَا لَغَآئِظُونَ","وَإِنَّا لَجَمِيعٌ حَذِرُونَۖ","فَأَخْرَجْنَٰهُم مِّن جَنَّٰتٖ وَعُيُونٖ","وَكُنُوزٖ وَمَقَامٖ كَرِيمٖۖ","كَذَٰلِكَۖ وَأَوْرَثْنَٰهَا بَنِےٓ إِسْرَآءِيلَ","فَأَتْبَعُوهُم مُّشْرِقِينَۖ","فَلَمَّا تَرَٰٓءَا اَ۬لْجَمْعَٰنِ قَالَ أَصْحَٰبُ مُوس۪ىٰٓ إِنَّا لَمُدْرَكُونَۖ","قَالَ كَلَّآۖ إِنَّ مَعِے رَبِّے سَيَهْدِينِۖ","فَأَوْحَيْنَآ إِلَىٰ مُوس۪ىٰٓ أَنِ اِ۪ضْرِب بِّعَصَاكَ اَ۬لْبَحْرَ فَانفَلَقَ فَكَانَ كُلُّ فِرْقٖ كَالطَّوْدِ اِ۬لْعَظِيمِۖ","وَأَزْلَفْنَا ثَمَّ اَ۬لَاخَرِينَۖ","وَأَنجَيْنَا مُوس۪ىٰ وَمَن مَّعَهُۥٓ أَجْمَعِينَ","ثُمَّ أَغْرَقْنَا اَ۬لَاخَرِينَۖ","إِنَّ فِے ذَٰلِكَ لَأٓيَةٗۖ وَمَا كَانَ أَكْثَرُهُم مُّومِنِينَۖ","وَإِنَّ رَبَّكَ لَهُوَ اَ۬لْعَزِيزُ اُ۬لرَّحِيمُۖ","وَاتْلُ عَلَيْهِمْ نَبَأَ ا۪بْرَٰهِيمَ","إِذْ قَالَ لِأَبِيهِ وَقَوْمِهِۦ مَا تَعْبُدُونَۖ","قَالُواْ نَعْبُدُ أَصْنَاماٗ فَنَظَلُّ لَهَا عَٰكِفِينَۖ","قَالَ هَلْ يَسْمَعُونَكُمُۥٓ إِذْ تَدْعُونَ","أَوْ يَنفَعُونَكُمُۥٓ أَوْ يَضُرُّونَۖ","قَالُواْ بَلْ وَجَدْنَآ ءَابَآءَنَا كَذَٰلِكَ يَفْعَلُونَۖ","قَالَ أَفَرَٰٓيْتُم مَّا كُنتُمْ تَعْبُدُونَ","أَنتُمْ وَءَابَآؤُكُمُ اُ۬لَاقْدَمُونَ","فَإِنَّهُمْ عَدُوّٞ لِّيَۖ إِلَّا رَبَّ اَ۬لْعَٰلَمِينَ","اَ۬لذِے خَلَقَنِے فَهُوَ يَهْدِينِۖ","وَالذِے هُوَ يُطْعِمُنِے وَيَسْقِينِ","وَإِذَا مَرِضْتُ فَهُوَ يَشْفِينِۖ","وَالذِے يُمِيتُنِے ثُمَّ يُحْيِينِۖ","۞ وَالذِےٓ أَطْمَعُ أَنْ يَّغْفِرَ لِے خَطِيَٓٔتِے يَوْمَ اَ۬لدِّينِۖ","رَبِّ هَبْ لِے حُكْماٗ وَأَلْحِقْنِے بِالصَّٰلِحِينَۖ","وَاجْعَل لِّے لِسَانَ صِدْقٖ فِے اِ۬لَاخِرِينَۖ","وَاجْعَلْنِے مِنْ وَّرَثَةِ جَنَّةِ اِ۬لنَّعِيمِۖ","وَاغْفِرْ لِأَبِيَ إِنَّهُۥ كَانَ مِنَ اَ۬لضَّآلِّينَۖ","وَلَا تُخْزِنِے يَوْمَ يُبْعَثُونَ","يَوْمَ لَا يَنفَعُ مَالٞ وَلَا بَنُونَ","إِلَّا مَنَ اَتَى اَ۬للَّهَ بِقَلْبٖ سَلِيمٖۖ","وَأُزْلِفَتِ اِ۬لْجَنَّةُ لِلْمُتَّقِينَۖ","وَبُرِّزَتِ اِ۬لْجَحِيمُ لِلْغَاوِينَۖ","وَقِيلَ لَهُمُۥٓ أَيْنَ مَا كُنتُمْ تَعْبُدُونَ","مِن دُونِ اِ۬للَّهِۖ هَلْ يَنصُرُونَكُمُۥٓ أَوْ يَنتَصِرُونَۖ","فَكُبْكِبُواْ فِيهَا هُمْ وَالْغَاوُۥنَ","وَجُنُودُ إِبْلِيسَ أَجْمَعُونَۖ","قَالُواْ وَهُمْ فِيهَا يَخْتَصِمُونَ","تَاللَّهِ إِن كُنَّا لَفِے ضَلَٰلٖ مُّبِينٍ","اِذْ نُسَوِّيكُم بِرَبِّ اِ۬لْعَٰلَمِينَۖ","وَمَآ أَضَلَّنَآ إِلَّا اَ۬لْمُجْرِمُونَۖ","فَمَا لَنَا مِن شَٰفِعِينَ","وَلَا صَدِيقٍ حَمِيمٖۖ","فَلَوَ اَنَّ لَنَا كَرَّةٗ فَنَكُونَ مِنَ اَ۬لْمُومِنِينَۖ","إِنَّ فِے ذَٰلِكَ لَأٓيَةٗۖ وَمَا كَانَ أَكْثَرُهُم مُّومِنِينَۖ","وَإِنَّ رَبَّكَ لَهُوَ اَ۬لْعَزِيزُ اُ۬لرَّحِيمُۖ","كَذَّبَتْ قَوْمُ نُوحٍ اِ۬لْمُرْسَلِينَ","إِذْ قَالَ لَهُمُۥٓ أَخُوهُمْ نُوحٌ اَلَا تَتَّقُونَ","إِنِّے لَكُمْ رَسُولٌ اَمِينٞۖ","فَاتَّقُواْ اُ۬للَّهَ وَأَطِيعُونِۖ","وَمَآ أَسْـَٔلُكُمْ عَلَيْهِ مِنَ اَجْرٍۖ اِنَ اَجْرِيَ إِلَّا عَلَىٰ رَبِّ اِ۬لْعَٰلَمِينَۖ","فَاتَّقُواْ اُ۬للَّهَ وَأَطِيعُونِۖ","۞ قَالُوٓاْ أَنُومِنُ لَكَ وَاتَّبَعَكَ اَ۬لَارْذَلُونَۖ","قَالَ وَمَا عِلْمِے بِمَا كَانُواْ يَعْمَلُونَۖ","إِنْ حِسَابُهُمُۥٓ إِلَّا عَلَىٰ رَبِّے لَوْ تَشْعُرُونَۖ","وَمَآ أَنَا بِطَارِدِ اِ۬لْمُومِنِينَ","إِنَ اَنَا إِلَّا نَذِيرٞ مُّبِينٞۖ","قَالُواْ لَئِن لَّمْ تَنتَهِ يَٰنُوحُ لَتَكُونَنَّ مِنَ اَ۬لْمَرْجُومِينَۖ","قَالَ رَبِّ إِنَّ قَوْمِے كَذَّبُونِ","فَافْتَحْ بَيْنِے وَبَيْنَهُمْ فَتْحاٗ وَنَجِّنِے وَمَن مَّعِيَ مِنَ اَ۬لْمُومِنِينَۖ","فَأَنجَيْنَٰهُ وَمَن مَّعَهُۥ فِے اِ۬لْفُلْكِ اِ۬لْمَشْحُونِۖ","ثُمَّ أَغْرَقْنَا بَعْدُ اُ۬لْبَاقِينَۖ","إِنَّ فِے ذَٰلِكَ لَأٓيَةٗۖ وَمَا كَانَ أَكْثَرُهُم مُّومِنِينَۖ","وَإِنَّ رَبَّكَ لَهُوَ اَ۬لْعَزِيزُ اُ۬لرَّحِيمُۖ","كَذَّبَتْ عَادٌ اِ۬لْمُرْسَلِينَ","إِذْ قَالَ لَهُمُۥٓ أَخُوهُمْ هُودٌ اَلَا تَتَّقُونَ","إِنِّے لَكُمْ رَسُولٌ اَمِينٞۖ","فَاتَّقُواْ اُ۬للَّهَ وَأَطِيعُونِۖ","وَمَآ أَسْـَٔلُكُمْ عَلَيْهِ مِنَ اَجْرٍۖ اِنَ اَجْرِيَ إِلَّا عَلَىٰ رَبِّ اِ۬لْعَٰلَمِينَۖ","أَتَبْنُونَ بِكُلِّ رِيعٍ اٰيَةٗ تَعْبَثُونَ","وَتَتَّخِذُونَ مَصَانِعَ لَعَلَّكُمْ تَخْلُدُونَ","وَإِذَا بَطَشْتُم بَطَشْتُمْ جَبّ۪ارِينَۖ","فَاتَّقُواْ اُ۬للَّهَ وَأَطِيعُونِۖ","وَاتَّقُواْ اُ۬لذِےٓ أَمَدَّكُم بِمَا تَعْلَمُونَ","أَمَدَّكُم بِأَنْعَٰمٖ وَبَنِينَ","وَجَنَّٰتٖ وَعُيُونٍۖ","اِنِّيَ أَخَافُ عَلَيْكُمْ عَذَابَ يَوْمٍ عَظِيمٖۖ","قَالُواْ سَوَآءٌ عَلَيْنَآ أَوَعَظْتَ أَمْ لَمْ تَكُن مِّنَ اَ۬لْوَٰعِظِينَ","إِنْ هَٰذَآ إِلَّا خُلُقُ اُ۬لَاوَّلِينَ","وَمَا نَحْنُ بِمُعَذَّبِينَۖ","فَكَذَّبُوهُ فَأَهْلَكْنَٰهُمُۥٓۖ إِنَّ فِے ذَٰلِكَ لَأٓيَةٗۖ وَمَا كَانَ أَكْثَرُهُم مُّومِنِينَۖ","وَإِنَّ رَبَّكَ لَهُوَ اَ۬لْعَزِيزُ اُ۬لرَّحِيمُۖ","كَذَّبَتْ ثَمُودُ اُ۬لْمُرْسَلِينَ","إِذْ قَالَ لَهُمُۥٓ أَخُوهُمْ صَٰلِحٌ اَلَا تَتَّقُونَ","إِنِّے لَكُمْ رَسُولٌ اَمِينٞۖ","فَاتَّقُواْ اُ۬للَّهَ وَأَطِيعُونِۖ","وَمَآ أَسْـَٔلُكُمْ عَلَيْهِ مِنَ اَجْرٍۖ اِنَ اَجْرِيَ إِلَّا عَلَىٰ رَبِّ اِ۬لْعَٰلَمِينَۖ","۞ أَتُتْرَكُونَ فِے مَا هَٰهُنَآ ءَامِنِينَ","فِے جَنَّٰتٖ وَعُيُونٖ","وَزُرُوعٖ وَنَخْلٖ طَلْعُهَا هَضِيمٞ","وَتَنْحِتُونَ مِنَ اَ۬لْجِبَالِ بُيُوتاٗ فَرِهِينَۖ","فَاتَّقُواْ اُ۬للَّهَ وَأَطِيعُونِۖ","وَلَا تُطِيعُوٓاْ أَمْرَ اَ۬لْمُسْرِفِينَ","اَ۬لذِينَ يُفْسِدُونَ فِے اِ۬لَارْضِ وَلَا يُصْلِحُونَۖ","قَالُوٓاْ إِنَّمَآ أَنتَ مِنَ اَ۬لْمُسَحَّرِينَ","مَآ أَنتَ إِلَّا بَشَرٞ مِّثْلُنَا فَاتِ بِـَٔايَةٍ اِن كُنتَ مِنَ اَ۬لصَّٰدِقِينَۖ","قَالَ هَٰذِهِۦ نَاقَةٞ لَّهَا شِرْبٞۖ وَلَكُمْ شِرْبُ يَوْمٖ مَّعْلُومٖۖ","وَلَا تَمَسُّوهَا بِسُوٓءٖ فَيَاخُذَكُمْ عَذَابُ يَوْمٍ عَظِيمٖۖ","فَعَقَرُوهَا فَأَصْبَحُواْ نَٰدِمِينَ","فَأَخَذَهُمُ اُ۬لْعَذَابُۖ إِنَّ فِے ذَٰلِكَ لَأٓيَةٗۖ وَمَا كَانَ أَكْثَرُهُم مُّومِنِينَۖ","وَإِنَّ رَبَّكَ لَهُوَ اَ۬لْعَزِيزُ اُ۬لرَّحِيمُۖ","كَذَّبَتْ قَوْمُ لُوطٍ اِ۬لْمُرْسَلِينَ","إِذْ قَالَ لَهُمُۥٓ أَخُوهُمْ لُوطٌ اَلَا تَتَّقُونَ","إِنِّے لَكُمْ رَسُولٌ اَمِينٞۖ","فَاتَّقُواْ اُ۬للَّهَ وَأَطِيعُونِۖ","وَمَآ أَسْـَٔلُكُمْ عَلَيْهِ مِنَ اَجْرٍۖ اِنَ اَجْرِيَ إِلَّا عَلَىٰ رَبِّ اِ۬لْعَٰلَمِينَۖ","أَتَاتُونَ اَ۬لذُّكْرَانَ مِنَ اَ۬لْعَٰلَمِينَ","وَتَذَرُونَ مَا خَلَقَ لَكُمْ رَبُّكُم مِّنَ اَزْوَٰجِكُمۖ بَلَ اَنتُمْ قَوْمٌ عَادُونَۖ","قَالُواْ لَئِن لَّمْ تَنتَهِ يَٰلُوطُ لَتَكُونَنَّ مِنَ اَ۬لْمُخْرَجِينَۖ","قَالَ إِنِّے لِعَمَلِكُم مِّنَ اَ۬لْقَالِينَۖ","رَبِّ نَجِّنِے وَأَهْلِے مِمَّا يَعْمَلُونَۖ","فَنَجَّيْنَٰهُ وَأَهْلَهُۥٓ أَجْمَعِينَ","إِلَّا عَجُوزاٗ فِے اِ۬لْغَٰبِرِينَ","ثُمَّ دَمَّرْنَا اَ۬لَاخَرِينَۖ","وَأَمْطَرْنَا عَلَيْهِم مَّطَراٗۖ فَسَآءَ مَطَرُ اُ۬لْمُنذَرِينَۖ","إِنَّ فِے ذَٰلِكَ لَأٓيَةٗۖ وَمَا كَانَ أَكْثَرُهُم مُّومِنِينَۖ","وَإِنَّ رَبَّكَ لَهُوَ اَ۬لْعَزِيزُ اُ۬لرَّحِيمُۖ","كَذَّبَ أَصْحَٰبُ لَيْكَةَ اَ۬لْمُرْسَلِينَ","إِذْ قَالَ لَهُمْ شُعَيْبٌ اَلَا تَتَّقُونَ","إِنِّے لَكُمْ رَسُولٌ اَمِينٞۖ","فَاتَّقُواْ اُ۬للَّهَ وَأَطِيعُونِۖ","وَمَآ أَسْـَٔلُكُمْ عَلَيْهِ مِنَ اَجْرٍۖ اِنَ اَجْرِيَ إِلَّا عَلَىٰ رَبِّ اِ۬لْعَٰلَمِينَۖ","۞ أَوْفُواْ اُ۬لْكَيْلَۖ وَلَا تَكُونُواْ مِنَ اَ۬لْمُخْسِرِينَۖ","وَزِنُواْ بِالْقُسْطَاسِ اِ۬لْمُسْتَقِيمِۖ","وَلَا تَبْخَسُواْ اُ۬لنَّاسَ أَشْيَآءَهُمْۖ وَلَا تَعْثَوْاْ فِے اِ۬لَارْضِ مُفْسِدِينَۖ","وَاتَّقُواْ اُ۬لذِے خَلَقَكُمْ وَالْجِبِلَّةَ اَ۬لَاوَّلِينَۖ","قَالُوٓاْ إِنَّمَآ أَنتَ مِنَ اَ۬لْمُسَحَّرِينَ","وَمَآ أَنتَ إِلَّا بَشَرٞ مِّثْلُنَا وَإِن نَّظُنُّكَ لَمِنَ اَ۬لْكَٰذِبِينَ","فَأَسْقِطْ عَلَيْنَا كِسْفاٗ مِّنَ اَ۬لسَّمَآءِ ان كُنتَ مِنَ اَ۬لصَّٰدِقِينَۖ","قَالَ رَبِّيَ أَعْلَمُ بِمَا تَعْمَلُونَۖ","فَكَذَّبُوهُ فَأَخَذَهُمْ عَذَابُ يَوْمِ اِ۬لظُّلَّةِۖ إِنَّهُۥ كَانَ عَذَابَ يَوْمٍ عَظِيمٍۖ","اِنَّ فِے ذَٰلِكَ لَأٓيَةٗۖ وَمَا كَانَ أَكْثَرُهُم مُّومِنِينَۖ","وَإِنَّ رَبَّكَ لَهُوَ اَ۬لْعَزِيزُ اُ۬لرَّحِيمُۖ","وَإِنَّهُۥ لَتَنزِيلُ رَبِّ اِ۬لْعَٰلَمِينَۖ","نَزَلَ بِهِ اِ۬لرُّوحُ اُ۬لَامِينُ","عَلَىٰ قَلْبِكَ لِتَكُونَ مِنَ اَ۬لْمُنذِرِينَ","بِلِسَانٍ عَرَبِيّٖ مُّبِينٖۖ","وَإِنَّهُۥ لَفِے زُبُرِ اِ۬لَاوَّلِينَۖ","أَوَلَمْ يَكُن لَّهُمُۥٓ ءَايَةً اَنْ يَّعْلَمَهُۥ عُلَمَٰٓؤُاْ بَنِےٓ إِسْرَآءِيلَۖ","وَلَوْ نَزَّلْنَٰهُ عَلَىٰ بَعْضِ اِ۬لَاعْجَمِينَ","فَقَرَأَهُۥ عَلَيْهِم مَّا كَانُواْ بِهِۦ مُومِنِينَۖ","كَذَٰلِكَ سَلَكْنَٰهُ فِے قُلُوبِ اِ۬لْمُجْرِمِينَ","لَا يُومِنُونَ بِهِۦ حَتَّىٰ يَرَوُاْ اُ۬لْعَذَابَ اَ۬لَالِيمَ","فَيَاتِيَهُم بَغْتَةٗ وَهُمْ لَا يَشْعُرُونَ","فَيَقُولُواْ هَلْ نَحْنُ مُنظَرُونَۖ","أَفَبِعَذَابِنَا يَسْتَعْجِلُونَۖ","أَفَرَٰٓيْتَ إِن مَّتَّعْنَٰهُمْ سِنِينَ","ثُمَّ جَآءَهُم مَّا كَانُواْ يُوعَدُونَ","مَآ أَغْن۪ىٰ عَنْهُم مَّا كَانُواْ يُمَتَّعُونَۖ","وَمَآ أَهْلَكْنَا مِن قَرْيَةٍ اِلَّا لَهَا مُنذِرُونَ","ذِكْر۪ىٰۖ وَمَا كُنَّا ظَٰلِمِينَۖ","۞ وَمَا تَنَزَّلَتْ بِهِ اِ۬لشَّيَٰطِينُ وَمَا يَنۢبَغِے لَهُمْ وَمَا يَسْتَطِيعُونَۖ","إِنَّهُمْ عَنِ اِ۬لسَّمْعِ لَمَعْزُولُونَۖ","فَلَا تَدْعُ مَعَ اَ۬للَّهِ إِلَٰهاً اٰخَرَ فَتَكُونَ مِنَ اَ۬لْمُعَذَّبِينَۖ","وَأَنذِرْ عَشِيرَتَكَ اَ۬لَاقْرَبِينَ","وَاخْفِضْ جَنَاحَكَ لِمَنِ اِ۪تَّبَعَكَ مِنَ اَ۬لْمُومِنِينَۖ","فَإِنْ عَصَوْكَ فَقُلِ اِنِّے بَرِےٓءٞ مِّمَّا تَعْمَلُونَۖ","فَتَوَكَّلْ عَلَى اَ۬لْعَزِيزِ اِ۬لرَّحِيمِ","اِ۬لذِے يَر۪يٰكَ حِينَ تَقُومُ","وَتَقَلُّبَكَ فِے اِ۬لسَّٰجِدِينَۖ","إِنَّهُۥ هُوَ اَ۬لسَّمِيعُ اُ۬لْعَلِيمُۖ","هَلُ ا۟نَبِّئُكُمْ عَلَىٰ مَن تَنَزَّلُ اُ۬لشَّيَٰطِينُ","تَنَزَّلُ عَلَىٰ كُلِّ أَفَّاكٍ اَثِيمٖ","يُلْقُونَ اَ۬لسَّمْعَ وَأَكْثَرُهُمْ كَٰذِبُونَۖ","وَالشُّعَرَآءُ يَتْبَعُهُمُ اُ۬لْغَاوُۥنَۖ","أَلَمْ تَرَ أَنَّهُمْ فِے كُلِّ وَادٖ يَهِيمُونَ","وَأَنَّهُمْ يَقُولُونَ مَا لَا يَفْعَلُونَۖ","إِلَّا اَ۬لذِينَ ءَامَنُواْ وَعَمِلُواْ اُ۬لصَّٰلِحَٰتِ وَذَكَرُواْ اُ۬للَّهَ كَثِيراٗ وَانتَصَرُواْ مِنۢ بَعْدِ مَا ظُلِمُواْۖ وَسَيَعْلَمُ اُ۬لذِينَ ظَلَمُوٓاْ أَيَّ مُنقَلَبٖ يَنقَلِبُونَۖ"]],["النمل",["طَسِٓۖ تِلْكَ ءَايَٰتُ اُ۬لْقُرْءَانِ وَكِتَابٖ مُّبِينٍۖ","هُدىٗ وَبُشْر۪ىٰ لِلْمُومِنِينَ","اَ۬لذِينَ يُقِيمُونَ اَ۬لصَّلَوٰةَ وَيُوتُونَ اَ۬لزَّكَوٰةَ وَهُم بِالَاخِرَةِ هُمْ يُوقِنُونَۖ","إِنَّ اَ۬لذِينَ لَا يُومِنُونَ بِالَاخِرَةِ زَيَّنَّا لَهُمُۥٓ أَعْمَٰلَهُمْ فَهُمْ يَعْمَهُونَۖ","أُوْلَٰٓئِكَ اَ۬لذِينَ لَهُمْ سُوٓءُ اُ۬لْعَذَابِ وَهُمْ فِے اِ۬لَاخِرَةِ هُمُ اُ۬لَاخْسَرُونَۖ","۞ وَإِنَّكَ لَتُلَقَّى اَ۬لْقُرْءَانَ مِن لَّدُنْ حَكِيمٍ عَلِيمٍۖ","اِذْ قَالَ مُوس۪ىٰ لِأَهْلِهِۦٓ إِنِّيَ ءَانَسْتُ نَاراٗ سَـَٔاتِيكُم مِّنْهَا بِخَبَرٍ اَوَ اٰتِيكُم بِشِهَابِ قَبَسٖ لَّعَلَّكُمْ تَصْطَلُونَۖ","فَلَمَّا جَآءَهَا نُودِيَ أَنۢ بُورِكَ مَن فِے اِ۬لنّ۪ارِ وَمَنْ حَوْلَهَاۖ وَسُبْحَٰنَ اَ۬للَّهِ رَبِّ اِ۬لْعَٰلَمِينَۖ","يَٰمُوس۪ىٰٓ إِنَّهُۥٓ أَنَا اَ۬للَّهُ اُ۬لْعَزِيزُ اُ۬لْحَكِيمُ","وَأَلْقِ عَصَاكَۖ فَلَمَّا ر۪ء۪اهَا تَهْتَزُّ كَأَنَّهَا جَآنّٞ وَلّ۪ىٰ مُدْبِراٗ وَلَمْ يُعَقِّبْۖ يَٰمُوس۪ىٰ لَا تَخَفِۖ اِنِّے لَا يَخَافُ لَدَيَّ اَ۬لْمُرْسَلُونَۖ","إِلَّا مَن ظَلَمَ ثُمَّ بَدَّلَ حُسْناَۢ بَعْدَ سُوٓءٖ فَإِنِّے غَفُورٞ رَّحِيمٞۖ","وَأَدْخِلْ يَدَكَ فِے جَيْبِكَ تَخْرُجْ بَيْضَآءَ مِنْ غَيْرِ سُوٓءٖۖ فِے تِسْعِ ءَايَٰتٍ اِلَىٰ فِرْعَوْنَ وَقَوْمِهِۦٓۖ إِنَّهُمْ كَانُواْ قَوْماٗ فَٰسِقِينَۖ","فَلَمَّا جَآءَتْهُمُۥٓ ءَايَٰتُنَا مُبْصِرَةٗ قَالُواْ هَٰذَا سِحْرٞ مُّبِينٞۖ","وَجَحَدُواْ بِهَا وَاسْتَيْقَنَتْهَآ أَنفُسُهُمْ ظُلْماٗ وَعُلُوّاٗۖ فَانظُرْ كَيْفَ كَانَ عَٰقِبَةُ اُ۬لْمُفْسِدِينَۖ","وَلَقَدَ اٰتَيْنَا دَاوُۥدَ وَسُلَيْمَٰنَ عِلْماٗ وَقَالَا اَ۬لْحَمْدُ لِلهِ اِ۬لذِے فَضَّلَنَا عَلَىٰ كَثِيرٖ مِّنْ عِبَادِهِ اِ۬لْمُومِنِينَۖ","وَوَرِثَ سُلَيْمَٰنُ دَاوُۥدَ وَقَالَ يَٰٓأَيُّهَا اَ۬لنَّاسُ عُلِّمْنَا مَنطِقَ اَ۬لطَّيْرِ وَأُوتِينَا مِن كُلِّ شَےْءٍۖ اِنَّ هَٰذَا لَهُوَ اَ۬لْفَضْلُ اُ۬لْمُبِينُۖ","۞ وَحُشِرَ لِسُلَيْمَٰنَ جُنُودُهُۥ مِنَ اَ۬لْجِنِّ وَالِانسِ وَالطَّيْرِ فَهُمْ يُوزَعُونَۖ","حَتَّىٰٓ إِذَآ أَتَوْاْ عَلَىٰ وَادِ اِ۬لنَّمْلِ قَالَتْ نَمْلَةٞ يَٰٓأَيُّهَا اَ۬لنَّمْلُ اُ۟دْخُلُواْ مَسَٰكِنَكُمْ لَا يَحْطِمَنَّكُمْ سُلَيْمَٰنُ وَجُنُودُهُۥ وَهُمْ لَا يَشْعُرُونَۖ","فَتَبَسَّمَ ضَاحِكاٗ مِّن قَوْلِهَا وَقَالَ رَبِّ أَوْزِعْنِيَ أَنَ اَشْكُرَ نِعْمَتَكَ اَ۬لتِےٓ أَنْعَمْتَ عَلَيَّ وَعَلَىٰ وَٰلِدَيَّ وَأَنَ اَعْمَلَ صَٰلِحاٗ تَرْض۪يٰهُ وَأَدْخِلْنِے بِرَحْمَتِكَ فِے عِبَادِكَ اَ۬لصَّٰلِحِينَۖ","وَتَفَقَّدَ اَ۬لطَّيْرَ فَقَالَ مَا لِے لَآ أَرَى اَ۬لْهُدْهُدَ أَمْ كَانَ مِنَ اَ۬لْغَآئِبِينَۖ","لَأُعَذِّبَنَّهُۥ عَذَاباٗ شَدِيداً اَوْ لَأَاْذْبَحَنَّهُۥٓ أَوْ لَيَاتِيَنِّے بِسُلْطَٰنٖ مُّبِينٖۖ","فَمَكُثَ غَيْرَ بَعِيدٖۖ فَقَالَ أَحَطْتُّ بِمَا لَمْ تُحِطْ بِهِۦ وَجِئْتُكَ مِن سَبَإِۢ بِنَبَإٖ يَقِينٍۖ","اِنِّے وَجَدتُّ اُ۪مْرَأَةٗ تَمْلِكُهُمْ وَأُوتِيَتْ مِن كُلِّ شَےْءٖۖ وَلَهَا عَرْشٌ عَظِيمٞۖ","وَجَدتُّهَا وَقَوْمَهَا يَسْجُدُونَ لِلشَّمْسِ مِن دُونِ اِ۬للَّهِ وَزَيَّنَ لَهُمُ اُ۬لشَّيْطَٰنُ أَعْمَٰلَهُمْ فَصَدَّهُمْ عَنِ اِ۬لسَّبِيلِ فَهُمْ لَا يَهْتَدُونَ","أَلَّا يَسْجُدُواْ لِلهِ اِ۬لذِے يُخْرِجُ اُ۬لْخَبْءَ فِے اِ۬لسَّمَٰوَٰتِ وَالَارْضِ وَيَعْلَمُ مَا يُخْفُونَ وَمَا يُعْلِنُونَۖ","اَ۬للَّهُ لَآ إِلَٰهَ إِلَّا هُوَ رَبُّ اُ۬لْعَرْشِ اِ۬لْعَظِيمِۖ۩","۞ قَالَ سَنَنظُرُ أَصَدَقْتَ أَمْ كُنتَ مِنَ اَ۬لْكَٰذِبِينَۖ","اَ۪ذْهَب بِّكِتَٰبِے هَٰذَا فَأَلْقِهِۦٓ إِلَيْهِمْ ثُمَّ تَوَلَّ عَنْهُمْ فَانظُرْ مَاذَا يَرْجِعُونَۖ","قَالَتْ يَٰٓأَيُّهَا اَ۬لْمَلَؤُاْ اِ۪نِّيَ أُلْقِيَ إِلَيَّ كِتَٰبٞ كَرِيمٌ","اِنَّهُۥ مِن سُلَيْمَٰنَ وَإِنَّهُۥ بِسْمِ اِ۬للَّهِ اِ۬لرَّحْمَٰنِ اِ۬لرَّحِيمِ","أَلَّا تَعْلُواْ عَلَيَّ وَاتُونِے مُسْلِمِينَۖ","قَالَتْ يَٰٓأَيُّهَا اَ۬لْمَلَؤُاْ اَ۬فْتُونِے فِےٓ أَمْرِے مَا كُنتُ قَاطِعَةً اَمْراً حَتَّىٰ تَشْهَدُونِۖ","قَالُواْ نَحْنُ أُوْلُواْ قُوَّةٖ وَأُوْلُواْ بَأْسٖ شَدِيدٖ","وَالَامْرُ إِلَيْكِ فَانظُرِے مَاذَا تَامُرِينَۖ","قَالَتِ اِنَّ اَ۬لْمُلُوكَ إِذَا دَخَلُواْ قَرْيَةً اَفْسَدُوهَا وَجَعَلُوٓاْ أَعِزَّةَ أَهْلِهَآ أَذِلَّةٗۖ وَكَذَٰلِكَ يَفْعَلُونَۖ","وَإِنِّے مُرْسِلَةٌ اِلَيْهِم بِهَدِيَّةٖ فَنَٰظِرَةُۢ بِمَ يَرْجِعُ اُ۬لْمُرْسَلُونَۖ","فَلَمَّا جَآءَ سُلَيْمَٰنَ قَالَ أَتُمِدُّونَنِۦ بِمَالٖ فَمَآ ءَات۪يٰنِۦَ اَ۬للَّهُ خَيْرٞ مِّمَّآ ءَات۪يٰكُم بَلَ اَنتُم بِهَدِيَّتِكُمْ تَفْرَحُونَۖ","اَ۪رْجِعِ اِلَيْهِمْ فَلَنَاتِيَنَّهُم بِجُنُودٖ لَّا قِبَلَ لَهُم بِهَا وَلَنُخْرِجَنَّهُم مِّنْهَآ أَذِلَّةٗ وَهُمْ صَٰغِرُونَۖ","قَالَ يَٰٓأَيُّهَا اَ۬لْمَلَؤُاْ اَ۬يُّكُمْ يَاتِينِے بِعَرْشِهَا قَبْلَ أَنْ يَّاتُونِے مُسْلِمِينَۖ","قَالَ عِفْرِيتٞ مِّنَ اَ۬لْجِنِّ أَنَآ ءَاتِيكَ بِهِۦ قَبْلَ أَن تَقُومَ مِن مَّقَامِكَ وَإِنِّے عَلَيْهِ لَقَوِيٌّ اَمِينٞۖ","قَالَ اَ۬لذِے عِندَهُۥ عِلْمٞ مِّنَ اَ۬لْكِتَٰبِ أَنَآ ءَاتِيكَ بِهِۦ قَبْلَ أَنْ يَّرْتَدَّ إِلَيْكَ طَرْفُكَۖ فَلَمَّا ر۪ء۪اهُ مُسْتَقِرّاً عِندَهُۥ قَالَ هَٰذَا مِن فَضْلِ رَبِّے لِيَبْلُوَن
