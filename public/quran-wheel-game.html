ِيَ ءَآشْكُرُ أَمَ اَكْفُرُۖ وَمَن شَكَرَ فَإِنَّمَا يَشْكُرُ لِنَفْسِهِۦۖ وَمَن كَفَرَ فَإِنَّ رَبِّے غَنِيّٞ كَرِيمٞۖ","۞ قَالَ نَكِّرُواْ لَهَا عَرْشَهَا نَنظُرَ اَتَهْتَدِےٓ أَمْ تَكُونُ مِنَ اَ۬لذِينَ لَا يَهْتَدُونَۖ","فَلَمَّا جَآءَتْ قِيلَ أَهَٰكَذَا عَرْشُكِ قَالَتْ كَأَنَّهُۥ هُوَۖ وَأُوتِينَا اَ۬لْعِلْمَ مِن قَبْلِهَا وَكُنَّا مُسْلِمِينَۖ","وَصَدَّهَا مَا كَانَت تَّعْبُدُ مِن دُونِ اِ۬للَّهِۖ إِنَّهَا كَانَتْ مِن قَوْمٖ كٰ۪فِرِينَۖ","قِيلَ لَهَا اَ۟دْخُلِے اِ۬لصَّرْحَۖ فَلَمَّا رَأَتْهُ حَسِبَتْهُ لُجَّةٗ وَكَشَفَتْ عَن سَاقَيْهَاۖ قَالَ إِنَّهُۥ صَرْحٞ مُّمَرَّدٞ مِّن قَوَارِيرَۖ","قَالَتْ رَبِّ إِنِّے ظَلَمْتُ نَفْسِے وَأَسْلَمْتُ مَعَ سُلَيْمَٰنَ لِلهِ رَبِّ اِ۬لْعَٰلَمِينَۖ","وَلَقَدَ اَرْسَلْنَآ إِلَىٰ ثَمُودَ أَخَاهُمْ صَٰلِحاً اَنُ اُ۟عْبُدُواْ اُ۬للَّهَ فَإِذَا هُمْ فَرِيقَٰنِ يَخْتَصِمُونَۖ","قَالَ يَٰقَوْمِ لِمَ تَسْتَعْجِلُونَ بِالسَّيِّئَةِ قَبْلَ اَ۬لْحَسَنَةِ لَوْلَا تَسْتَغْفِرُونَ اَ۬للَّهَ لَعَلَّكُمْ تُرْحَمُونَۖ","قَالُواْ اُ۪طَّيَّرْنَا بِكَ وَبِمَن مَّعَكَۖ قَالَ طَٰٓئِرُكُمْ عِندَ اَ۬للَّهِۖ بَلَ اَنتُمْ قَوْمٞ تُفْتَنُونَۖ","وَكَانَ فِے اِ۬لْمَدِينَةِ تِسْعَةُ رَهْطٖ يُفْسِدُونَ فِے اِ۬لَارْضِ وَلَا يُصْلِحُونَۖ","قَالُواْ تَقَاسَمُواْ بِاللَّهِ لَنُبَيِّتَنَّهُۥ وَأَهْلَهُۥ ثُمَّ لَنَقُولَنَّ لِوَلِيِّهِۦ مَا شَهِدْنَا مُهْلَكَ أَهْلِهِۦ وَإِنَّا لَصَٰدِقُونَۖ","وَمَكَرُواْ مَكْراٗ وَمَكَرْنَا مَكْراٗ وَهُمْ لَا يَشْعُرُونَۖ","فَانظُرْ كَيْفَ كَانَ عَٰقِبَةُ مَكْرِهِمُۥٓۖ إِنَّا دَمَّرْنَٰهُمْ وَقَوْمَهُمُۥٓ أَجْمَعِينَۖ","فَتِلْكَ بُيُوتُهُمْ خَاوِيَةَۢ بِمَا ظَلَمُوٓاْۖ إِنَّ فِے ذَٰلِكَ لَأٓيَةٗ لِّقَوْمٖ يَعْلَمُونَۖ","وَأَنجَيْنَا اَ۬لذِينَ ءَامَنُواْ وَكَانُواْ يَتَّقُونَۖ","وَلُوطاً اِذْ قَالَ لِقَوْمِهِۦٓ أَتَاتُونَ اَ۬لْفَٰحِشَةَ وَأَنتُمْ تُبْصِرُونَۖ","أَئِنَّكُمْ لَتَاتُونَ اَ۬لرِّجَالَ شَهْوَةٗ مِّن دُونِ اِ۬لنِّسَآءِۖ بَلَ اَنتُمْ قَوْمٞ تَجْهَلُونَۖ","۞ فَمَا كَانَ جَوَابَ قَوْمِهِۦٓ إِلَّآ أَن قَالُوٓاْ أَخْرِجُوٓاْ ءَالَ لُوطٖ مِّن قَرْيَتِكُمُۥٓۖ إِنَّهُمُۥٓ أُنَاسٞ يَتَطَهَّرُونَۖ","فَأَنجَيْنَٰهُ وَأَهْلَهُۥٓ إِلَّا اَ۪مْرَأَتَهُۥ قَدَّرْنَٰهَا مِنَ اَ۬لْغَٰبِرِينَۖ","وَأَمْطَرْنَا عَلَيْهِم مَّطَراٗۖ فَسَآءَ مَطَرُ اُ۬لْمُنذَرِينَۖ","قُلِ اِ۬لْحَمْدُ لِلهِ وَسَلَٰمٌ عَلَىٰ عِبَادِهِ اِ۬لذِينَ اَ۪صْطَف۪ىٰٓۖ ءَآللَّهُ خَيْرٌ اَمَّا تُشْرِكُونَۖ","أَمَّنْ خَلَقَ اَ۬لسَّمَٰوَٰتِ وَالَارْضَ وَأَنزَلَ لَكُم مِّنَ اَ۬لسَّمَآءِ مَآءٗ فَأَنۢبَتْنَا بِهِۦ حَدَآئِقَ ذَاتَ بَهْجَةٖۖ مَّا كَانَ لَكُمُۥٓ أَن تُنۢبِتُواْ شَجَرَهَآۖ أَ۟لَٰهٞ مَّعَ اَ۬للَّهِۖ بَلْ هُمْ قَوْمٞ يَعْدِلُونَۖ","أَمَّن جَعَلَ اَ۬لَارْضَ قَرَاراٗ وَجَعَلَ خِلَٰلَهَآ أَنْهَٰراٗ وَجَعَلَ لَهَا رَوَٰسِيَ وَجَعَلَ بَيْنَ اَ۬لْبَحْرَيْنِ حَاجِزاًۖ اَ۟لَٰهٞ مَّعَ اَ۬للَّهِۖ بَلَ اَكْثَرُهُمْ لَا يَعْلَمُونَۖ","أَمَّنْ يُّجِيبُ اُ۬لْمُضْطَرَّ إِذَا دَعَاهُ وَيَكْشِفُ اُ۬لسُّوٓءَ وَيَجْعَلُكُمْ خُلَفَآءَ اَ۬لَارْضِۖ أَ۟لَٰهٞ مَّعَ اَ۬للَّهِۖ قَلِيلاٗ مَّا تَذَّكَّرُونَۖ","أَمَّنْ يَّهْدِيكُمْ فِے ظُلُمَٰتِ اِ۬لْبَرِّ وَالْبَحْرِ وَمَنْ يُّرْسِلُ اُ۬لرِّيَٰحَ نُشُراَۢ بَيْنَ يَدَےْ رَحْمَتِهِۦٓۖ أَ۟لَٰهٞ مَّعَ اَ۬للَّهِۖ تَعَٰلَى اَ۬للَّهُ عَمَّا يُشْرِكُونَۖ","أَمَّنْ يَّبْدَؤُاْ اُ۬لْخَلْقَ ثُمَّ يُعِيدُهُۥ وَمَنْ يَّرْزُقُكُم مِّنَ اَ۬لسَّمَآءِ وَالَارْضِۖ أَ۟لَٰهٞ مَّعَ اَ۬للَّهِۖ قُلْ هَاتُواْ بُرهَٰنَكُمُۥٓ إِن كُنتُمْ صَٰدِقِينَۖ","قُل لَّا يَعْلَمُ مَن فِے اِ۬لسَّمَٰوَٰتِ وَالَارْضِ اِ۬لْغَيْبَ إِلَّا اَ۬للَّهُۖ وَمَا يَشْعُرُونَ أَيَّانَ يُبْعَثُونَۖ","۞ بَلِ اِ۪دَّٰرَكَ عِلْمُهُمْ فِے اِ۬لَاخِرَةِۖ بَلْ هُمْ فِے شَكّٖ مِّنْهَا بَلْ هُم مِّنْهَا عَمُونَۖ","وَقَالَ اَ۬لذِينَ كَفَرُوٓاْ إِذَا كُنَّا تُرَٰباٗ وَءَابَآؤُنَآ أَئِنَّا لَمُخْرَجُونَۖ","لَقَدْ وُعِدْنَا هَٰذَا نَحْنُ وَءَابَآؤُنَا مِن قَبْلُۖ إِنْ هَٰذَآ إِلَّآ أَسَٰطِيرُ اُ۬لَاوَّلِينَۖ","قُلْ سِيرُواْ فِے اِ۬لَارْضِ فَانظُرُواْ كَيْفَ كَانَ عَٰقِبَةُ اُ۬لْمُجْرِمِينَۖ","وَلَا تَحْزَنْ عَلَيْهِمْ وَلَا تَكُن فِے ضَيْقٖ مِّمَّا يَمْكُرُونَۖ","وَيَقُولُونَ مَت۪ىٰ هَٰذَا اَ۬لْوَعْدُ إِن كُنتُمْ صَٰدِقِينَۖ","قُلْ عَس۪ىٰٓ أَنْ يَّكُونَ رَدِفَ لَكُم بَعْضُ اُ۬لذِے تَسْتَعْجِلُونَۖ","وَإِنَّ رَبَّكَ لَذُو فَضْلٍ عَلَى اَ۬لنَّاسِۖ وَلَٰكِنَّ أَكْثَرَهُمْ لَا يَشْكُرُونَۖ","وَإِنَّ رَبَّكَ لَيَعْلَمُ مَا تُكِنُّ صُدُورُهُمْ وَمَا يُعْلِنُونَۖ","وَمَا مِنْ غَآئِبَةٖ فِے اِ۬لسَّمَآءِ وَالَارْضِ إِلَّا فِے كِتَٰبٖ مُّبِينٍۖ","اِنَّ هَٰذَا اَ۬لْقُرْءَانَ يَقُصُّ عَلَىٰ بَنِےٓ إِسْرَآءِيلَ أَكْثَرَ اَ۬لذِے هُمْ فِيهِ يَخْتَلِفُونَۖ","وَإِنَّهُۥ لَهُدىٗ وَرَحْمَةٞ لِّلْمُومِنِينَۖ","إِنَّ رَبَّكَ يَقْضِے بَيْنَهُم بِحُكْمِهِۦۖ وَهُوَ اَ۬لْعَزِيزُ اُ۬لْعَلِيمُۖ","فَتَوَكَّلْ عَلَى اَ۬للَّهِۖ إِنَّكَ عَلَى اَ۬لْحَقِّ اِ۬لْمُبِينِۖ","إِنَّكَ لَا تُسْمِعُ اُ۬لْمَوْت۪ىٰ وَلَا تُسْمِعُ اُ۬لصُّمَّ اَ۬لدُّعَآءَ ا۪ذَا وَلَّوْاْ مُدْبِرِينَۖ","وَمَآ أَنتَ بِهَٰدِے اِ۬لْعُمْيِ عَن ضَلَٰلَتِهِمُۥٓۖ إِن تُسْمِعُ إِلَّا مَنْ يُّومِنُ بِـَٔايَٰتِنَا فَهُم مُّسْلِمُونَۖ","۞ وَإِذَا وَقَعَ اَ۬لْقَوْلُ عَلَيْهِمُۥٓ أَخْرَجْنَا لَهُمْ دَآبَّةٗ مِّنَ اَ۬لَارْضِ تُكَلِّمُهُمُۥٓۖ إِنَّ اَ۬لنَّاسَ كَانُواْ بِـَٔايَٰتِنَا لَا يُوقِنُونَۖ","وَيَوْمَ نَحْشُرُ مِن كُلِّ أُمَّةٖ فَوْجاٗ مِّمَّنْ يُّكَذِّبُ بِـَٔايَٰتِنَا فَهُمْ يُوزَعُونَۖ","حَتَّىٰٓ إِذَا جَآءُو قَالَ أَكَذَّبْتُم بِـَٔايَٰتِے وَلَمْ تُحِيطُواْ بِهَا عِلْماًۖ اَمَّاذَا كُنتُمْ تَعْمَلُونَۖ","وَوَقَعَ اَ۬لْقَوْلُ عَلَيْهِم بِمَا ظَلَمُواْ فَهُمْ لَا يَنطِقُونَۖ","أَلَمْ يَرَوَاْ اَنَّا جَعَلْنَا اَ۬ليْلَ لِيَسْكُنُواْ فِيهِ وَالنَّهَارَ مُبْصِراًۖ اِنَّ فِے ذَٰلِكَ لَأٓيَٰتٖ لِّقَوْمٖ يُومِنُونَۖ","وَيَوْمَ يُنفَخُ فِے اِ۬لصُّورِ فَفَزِعَ مَن فِے اِ۬لسَّمَٰوَٰتِ وَمَن فِے اِ۬لَارْضِ إِلَّا مَن شَآءَ اَ۬للَّهُۖ وَكُلٌّ اٰتُوهُ دَٰخِرِينَۖ","وَتَرَى اَ۬لْجِبَالَ تَحْسِبُهَا جَامِدَةٗ وَهِيَ تَمُرُّ مَرَّ اَ۬لسَّحَابِۖ صُنْعَ اَ۬للَّهِ اِ۬لذِےٓ أَتْقَنَ كُلَّ شَےْءٍۖ اِنَّهُۥ خَبِيرُۢ بِمَا تَفْعَلُونَۖ","مَن جَآءَ بِالْحَسَنَةِ فَلَهُۥ خَيْرٞ مِّنْهَا وَهُم مِّن فَزَعِ يَوْمَئِذٍ اٰمِنُونَۖ","وَمَن جَآءَ بِالسَّيِّئَةِ فَكُبَّتْ وُجُوهُهُمْ فِے اِ۬لنّ۪ارِۖ هَلْ تُجْزَوْنَ إِلَّا مَا كُنتُمْ تَعْمَلُونَۖ","إِنَّمَآ أُمِرْتُ أَنَ اَعْبُدَ رَبَّ هَٰذِهِ اِ۬لْبَلْدَةِ اِ۬لذِے حَرَّمَهَا وَلَهُۥ كُلُّ شَےْءٖۖ وَأُمِرْتُ أَنَ اَكُونَ مِنَ اَ۬لْمُسْلِمِينَ","وَأَنَ اَتْلُوَاْ اَ۬لْقُرْءَانَۖ فَمَنِ اِ۪هْتَد۪ىٰ فَإِنَّمَا يَهْتَدِے لِنَفْسِهِۦۖ وَمَن ضَلَّ فَقُلِ اِنَّمَآ أَنَا مِنَ اَ۬لْمُنذِرِينَۖ","وَقُلِ اِ۬لْحَمْدُ لِلهِ سَيُرِيكُمُۥٓ ءَايَٰتِهِۦ فَتَعْرِفُونَهَاۖ وَمَا رَبُّكَ بِغَٰفِلٍ عَمَّا تَعْمَلُونَۖ"]],["القصص",["طَسِٓمِّٓۖ تِلْكَ ءَايَٰتُ اُ۬لْكِتَٰبِ اِ۬لْمُبِينِۖ","نَتْلُواْ عَلَيْكَ مِن نَّبَإِ مُوس۪ىٰ وَفِرْعَوْنَ بِالْحَقِّ لِقَوْمٖ يُومِنُونَۖ","إِنَّ فِرْعَوْنَ عَلَا فِے اِ۬لَارْضِ وَجَعَلَ أَهْلَهَا شِيَعاٗ يَسْتَضْعِفُ طَآئِفَةٗ مِّنْهُمْ يُذَبِّحُ أَبْنَآءَهُمْ وَيَسْتَحْيِۦ نِسَآءَهُمُۥٓۖ إِنَّهُۥ كَانَ مِنَ اَ۬لْمُفْسِدِينَۖ","وَنُرِيدُ أَن نَّمُنَّ عَلَى اَ۬لذِينَ اَ۟سْتُضْعِفُواْ فِے اِ۬لَارْضِ وَنَجْعَلَهُمُۥٓ أَئِمَّةٗ وَنَجْعَلَهُمُ اُ۬لْوَٰرِثِينَ","وَنُمَكِّنَ لَهُمْ فِے اِ۬لَارْضِ وَنُرِيَ فِرْعَوْنَ وَهَامَٰنَ وَجُنُودَهُمَا مِنْهُم مَّا كَانُواْ يَحْذَرُونَۖ","وَأَوْحَيْنَآ إِلَىٰٓ أُمِّ مُوس۪ىٰٓ أَنَ اَرْضِعِيهِ فَإِذَا خِفْتِ عَلَيْهِ فَأَلْقِيهِ فِے اِ۬لْيَمِّ وَلَا تَخَافِے وَلَا تَحْزَنِےٓۖ إِنَّا رَآدُّوهُ إِلَيْكِ وَجَاعِلُوهُ مِنَ اَ۬لْمُرْسَلِينَۖ","فَالْتَقَطَهُۥٓ ءَالُ فِرْعَوْنَ لِيَكُونَ لَهُمْ عَدُوّاٗ وَحَزَناًۖ اِنَّ فِرْعَوْنَ وَهَامَٰنَ وَجُنُودَهُمَا كَانُواْ خَٰطِـِٕينَۖ","وَقَالَتِ اِ۪مْرَأَتُ فِرْعَوْنَ قُرَّتُ عَيْنٖ لِّے وَلَكَ لَا تَقْتُلُوهُۖ عَس۪ىٰٓ أَنْ يَّنفَعَنَآ أَوْ نَتَّخِذَهُۥ وَلَداٗ وَهُمْ لَا يَشْعُرُونَۖ","وَأَصْبَحَ فُؤَادُ أُمِّ مُوس۪ىٰ فَٰرِغاً اِن كَٰدَتْ لَتُبْدِے بِهِۦ لَوْلَآ أَن رَّبَطْنَا عَلَىٰ قَلْبِهَا لِتَكُونَ مِنَ اَ۬لْمُومِنِينَۖ","وَقَالَتْ لِأُخْتِهِۦ قُصِّيهِ فَبَصُرَتْ بِهِۦ عَن جُنُبٖ وَهُمْ لَا يَشْعُرُونَۖ","۞ وَحَرَّمْنَا عَلَيْهِ اِ۬لْمَرَاضِعَ مِن قَبْلُ فَقَالَتْ هَلَ اَدُلُّكُمْ عَلَىٰٓ أَهْلِ بَيْتٖ يَكْفُلُونَهُۥ لَكُمْ وَهُمْ لَهُۥ نَٰصِحُونَۖ","فَرَدَدْنَٰهُ إِلَىٰٓ أُمِّهِۦ كَےْ تَقَرَّ عَيْنُهَا وَلَا تَحْزَنَ وَلِتَعْلَمَ أَنَّ وَعْدَ اَ۬للَّهِ حَقّٞۖ وَلَٰكِنَّ أَكْثَرَهُمْ لَا يَعْلَمُونَۖ","وَلَمَّا بَلَغَ أَشُدَّهُۥ وَاسْتَو۪ىٰٓ ءَاتَيْنَٰهُ حُكْماٗ وَعِلْماٗۖ وَكَذَٰلِكَ نَجْزِے اِ۬لْمُحْسِنِينَۖ","وَدَخَلَ اَ۬لْمَدِينَةَ عَلَىٰ حِينِ غَفْلَةٖ مِّنَ اَهْلِهَا فَوَجَدَ فِيهَا رَجُلَيْنِ يَقْتَتِلَٰنِ هَٰذَا مِن شِيعَتِهِۦ وَهَٰذَا مِنْ عَدُوِّهِۦۖ فَاسْتَغَٰثَهُ اُ۬لذِے مِن شِيعَتِهِۦ عَلَى اَ۬لذِے مِنْ عَدُوِّهِۦ فَوَكَزَهُۥ مُوس۪ىٰ فَقَض۪ىٰ عَلَيْهِۖ قَالَ هَٰذَا مِنْ عَمَلِ اِ۬لشَّيْطَٰنِۖ إِنَّهُۥ عَدُوّٞ مُّضِلّٞ مُّبِينٞۖ","قَالَ رَبِّ إِنِّے ظَلَمْتُ نَفْسِے فَاغْفِرْ لِےۖ فَغَفَرَ لَهُۥٓۖ إِنَّهُۥ هُوَ اَ۬لْغَفُورُ اُ۬لرَّحِيمُۖ","قَالَ رَبِّ بِمَآ أَنْعَمْتَ عَلَيَّ فَلَنَ اَكُونَ ظَهِيراٗ لِّلْمُجْرِمِينَۖ","فَأَصْبَحَ فِے اِ۬لْمَدِينَةِ خَآئِفاٗ يَتَرَقَّبُ فَإِذَا اَ۬لذِے اِ۪سْتَنصَرَهُۥ بِالَامْسِ يَسْتَصْرِخُهُۥۖ قَالَ لَهُۥ مُوس۪ىٰٓ إِنَّكَ لَغَوِيّٞ مُّبِينٞۖ","فَلَمَّآ أَنَ اَرَادَ أَنْ يَّبْطِشَ بِالذِے هُوَ عَدُوّٞ لَّهُمَا قَالَ يَٰمُوس۪ىٰٓ أَتُرِيدُ أَن تَقْتُلَنِے كَمَا قَتَلْتَ نَفْساَۢ بِالَامْسِۖ إِن تُرِيدُ إِلَّآ أَن تَكُونَ جَبَّاراٗ فِے اِ۬لَارْضِ وَمَا تُرِيدُ أَن تَكُونَ مِنَ اَ۬لْمُصْلِحِينَۖ","وَجَآءَ رَجُلٞ مِّنَ اَقْصَا اَ۬لْمَدِينَةِ يَسْع۪ىٰۖ قَالَ يَٰمُوس۪ىٰٓ إِنَّ اَ۬لْمَلَأَ يَاتَمِرُونَ بِكَ لِيَقْتُلُوكَ فَاخْرُجِ اِنِّے لَكَ مِنَ اَ۬لنَّٰصِحِينَۖ","فَخَرَجَ مِنْهَا خَآئِفاٗ يَتَرَقَّبُۖ قَالَ رَبِّ نَجِّنِے مِنَ اَ۬لْقَوْمِ اِ۬لظَّٰلِمِينَۖ","۞ وَلَمَّا تَوَجَّهَ تِلْقَآءَ مَدْيَنَ قَالَ عَس۪ىٰ رَبِّيَ أَنْ يَّهْدِيَنِے سَوَآءَ اَ۬لسَّبِيلِۖ","وَلَمَّا وَرَدَ مَآءَ مَدْيَنَ وَجَدَ عَلَيْهِ أُمَّةٗ مِّنَ اَ۬لنَّاسِ يَسْقُونَ","وَوَجَدَ مِن دُونِهِمُ اُ۪مْرَأَتَيْنِ تَذُودَٰنِۖ قَالَ مَا خَطْبُكُمَاۖ قَالَتَا لَا نَسْقِے حَتَّىٰ يُصْدِرَ اَ۬لرِّعَآءُ وَأَبُونَا شَيْخٞ كَبِيرٞۖ","فَسَق۪ىٰ لَهُمَا ثُمَّ تَوَلّ۪ىٰٓ إِلَى اَ۬لظِّلِّ فَقَالَ رَبِّ إِنِّے لِمَآ أَنزَلْتَ إِلَيَّ مِنْ خَيْرٖ فَقِيرٞۖ","فَجَآءَتْهُ إِحْد۪يٰهُمَا تَمْشِے عَلَى اَ۪سْتِحْيَآءٖۖ قَالَتِ اِنَّ أَبِے يَدْعُوكَ لِيَجْزِيَكَ أَجْرَ مَا سَقَيْتَ لَنَاۖ فَلَمَّا جَآءَهُۥ وَقَصَّ عَلَيْهِ اِ۬لْقَصَصَ قَالَ لَا تَخَفْ نَجَوْتَ مِنَ اَ۬لْقَوْمِ اِ۬لظَّٰلِمِينَۖ","قَالَتِ اِحْد۪يٰهُمَا يَٰٓأَبَتِ اِ۪سْتَٰجِرْهُۖ إِنَّ خَيْرَ مَنِ اِ۪سْتَٰجَرْتَ اَ۬لْقَوِيُّ اُ۬لَامِينُۖ","قَالَ إِنِّيَ أُرِيدُ أَنُ ا۟نكِحَكَ إِحْدَى اَ۪بْنَتَيَّ هَٰتَيْنِ عَلَىٰٓ أَن تَاجُرَنِے ثَمَٰنِيَ حِجَجٖۖ فَإِنَ اَتْمَمْتَ عَشْراٗ فَمِنْ عِندِكَۖ وَمَآ أُرِيدُ أَنَ اَشُقَّ عَلَيْكَۖ سَتَجِدُنِيَ إِن شَآءَ اَ۬للَّهُ مِنَ اَ۬لصَّٰلِحِينَۖ","قَالَ ذَٰلِكَ بَيْنِے وَبَيْنَكَۖ أَيَّمَا اَ۬لَاجَلَيْنِ قَضَيْتُ فَلَا عُدْوَٰنَ عَلَيَّۖ وَاللَّهُ عَلَىٰ مَا نَقُولُ وَكِيلٞۖ","۞ فَلَمَّا قَض۪ىٰ مُوسَى اَ۬لَاجَلَ وَسَارَ بِأَهْلِهِۦٓ ءَانَسَ مِن جَانِبِ اِ۬لطُّورِ نَاراٗۖ قَالَ لِأَهْلِهِ اِ۟مْكُثُوٓاْ إِنِّيَ ءَانَسْتُ نَاراٗ لَّعَلِّيَ ءَاتِيكُم مِّنْهَا بِخَبَرٍ اَوْ جِذْوَةٖ مِّنَ اَ۬لنّ۪ارِ لَعَلَّكُمْ تَصْطَلُونَۖ","فَلَمَّآ أَت۪يٰهَا نُودِيَ مِن شَٰطِےِٕ اِ۬لْوَادِ اِ۬لَايْمَنِ فِے اِ۬لْبُقْعَةِ اِ۬لْمُبَٰرَكَةِ مِنَ اَ۬لشَّجَرَةِ أَنْ يَّٰمُوس۪ىٰٓ إِنِّيَ أَنَا اَ۬للَّهُ رَبُّ اُ۬لْعَٰلَمِينَ","وَأَنَ اَلْقِ عَصَاكَۖ فَلَمَّا ر۪ء۪اهَا تَهْتَزُّ كَأَنَّهَا جَآنّٞ وَلّ۪ىٰ مُدْبِراٗ وَلَمْ يُعَقِّبْۖ يَٰمُوس۪ىٰٓ أَقْبِلْ وَلَا تَخَفِۖ اِنَّكَ مِنَ اَ۬لَامِنِينَۖ","اَ۟سْلُكْ يَدَكَ فِے جَيْبِكَ تَخْرُجْ بَيْضَآءَ مِنْ غَيْرِ سُوٓءٖۖ وَاضْمُمِ اِلَيْكَ جَنَاحَكَ مِنَ اَ۬لرَّهَبِۖ فَذَٰنِكَ بُرْهَٰنَٰنِ مِن رَّبِّكَ إِلَىٰ فِرْعَوْنَ وَمَلَإِيْهِۦٓۖ إِنَّهُمْ كَانُواْ قَوْماٗ فَٰسِقِينَۖ","قَالَ رَبِّ إِنِّے قَتَلْتُ مِنْهُمْ نَفْساٗ فَأَخَافُ أَنْ يَّقْتُلُونِ","وَأَخِے هَٰرُونُ هُوَ أَفْصَحُ مِنِّے لِسَاناٗ فَأَرْسِلْهُ مَعِے رِداٗ يُصَدِّقْنِےٓۖ إِنِّيَ أَخَافُ أَنْ يُّكَذِّبُونِۦۖ","قَالَ سَنَشُدُّ عَضُدَكَ بِأَخِيكَ وَنَجْعَلُ لَكُمَا سُلْطَٰناٗ فَلَا يَصِلُونَ إِلَيْكُمَا بِـَٔايَٰتِنَآۖ أَنتُمَا وَمَنِ اِ۪تَّبَعَكُمَا اَ۬لْغَٰلِبُونَۖ","فَلَمَّا جَآءَهُم مُّوس۪ىٰ بِـَٔايَٰتِنَا بَيِّنَٰتٖ قَالُواْ مَا هَٰذَآ إِلَّا سِحْرٞ مُّفْتَرىٗ وَمَا سَمِعْنَا بِهَٰذَا فِےٓ ءَابَآئِنَا اَ۬لَاوَّلِينَۖ","وَقَالَ مُوس۪ىٰ رَبِّيَ أَعْلَمُ بِمَن جَآءَ بِالْهُد۪ىٰ مِنْ عِندِهِۦ وَمَن تَكُونُ لَهُۥ عَٰقِبَةُ اُ۬لدّ۪ارِۖ إِنَّهُۥ لَا يُفْلِحُ اُ۬لظَّٰلِمُونَۖ","وَقَالَ فِرْعَوْنُ يَٰٓأَيُّهَا اَ۬لْمَلَأُ مَا عَلِمْتُ لَكُم مِّنِ اِلَٰهٍ غَيْرِے فَأَوْقِدْ لِے يَٰهَامَٰنُ عَلَى اَ۬لطِّينِ فَاجْعَل لِّے صَرْحاٗ لَّعَلِّيَ أَطَّلِعُ إِلَىٰٓ إِلَٰهِ مُوس۪ىٰ وَإِنِّے لَأَظُنُّهُۥ مِنَ اَ۬لْكَٰذِبِينَۖ","۞ وَاسْتَكْبَرَ هُوَ وَجُنُودُهُۥ فِے اِ۬لَارْضِ بِغَيْرِ اِ۬لْحَقِّ وَظَنُّوٓاْ أَنَّهُمُۥٓ إِلَيْنَا لَا يَرْجِعُونَۖ","فَأَخَذْنَٰهُ وَجُنُودَهُۥ فَنَبَذْنَٰهُمْ فِے اِ۬لْيَمِّۖ فَانظُرْ كَيْفَ كَانَ عَٰقِبَةُ اُ۬لظَّٰلِمِينَۖ","وَجَعَلْنَٰهُمُۥٓ أَئِمَّةٗ يَدْعُونَ إِلَى اَ۬لنّ۪ارِۖ وَيَوْمَ اَ۬لْقِيَٰمَةِ لَا يُنصَرُونَۖ","وَأَتْبَعْنَٰهُمْ فِے هَٰذِهِ اِ۬لدُّنْي۪ا لَعْنَةٗۖ وَيَوْمَ اَ۬لْقِيَٰمَةِ هُم مِّنَ اَ۬لْمَقْبُوحِينَۖ","وَلَقَدَ اٰتَيْنَا مُوسَى اَ۬لْكِتَٰبَ مِنۢ بَعْدِ مَآ أَهْلَكْنَا اَ۬لْقُرُونَ اَ۬لُاول۪ىٰ بَصَآئِرَ لِلنَّاسِ وَهُدىٗ وَرَحْمَةٗ لَّعَلَّهُمْ يَتَذَكَّرُونَۖ","وَمَا كُنتَ بِجَانِبِ اِ۬لْغَرْبِيِّ إِذْ قَضَيْنَآ إِلَىٰ مُوسَى اَ۬لَامْرَۖ وَمَا كُنتَ مِنَ اَ۬لشَّٰهِدِينَۖ","وَلَٰكِنَّآ أَنشَأْنَا قُرُوناٗ فَتَطَاوَلَ عَلَيْهِمُ اُ۬لْعُمُرُۖ وَمَا كُنتَ ثَاوِياٗ فِےٓ أَهْلِ مَدْيَنَ تَتْلُواْ عَلَيْهِمُۥٓ ءَايَٰتِنَاۖ وَلَٰكِنَّا كُنَّا مُرْسِلِينَۖ","وَمَا كُنتَ بِجَانِبِ اِ۬لطُّورِ إِذْ نَادَيْنَاۖ وَلَٰكِن رَّحْمَةٗ مِّن رَّبِّكَ لِتُنذِرَ قَوْماٗ مَّآ أَت۪يٰهُم مِّن نَّذِيرٖ مِّن قَبْلِكَ لَعَلَّهُمْ يَتَذَكَّرُونَۖ","وَلَوْلَآ أَن تُصِيبَهُم مُّصِيبَةُۢ بِمَا قَدَّمَتَ اَيْدِيهِمْ فَيَقُولُواْ رَبَّنَا لَوْلَآ أَرْسَلْتَ إِلَيْنَا رَسُولاٗ فَنَتَّبِعَ ءَايَٰتِكَ وَنَكُونَ مِنَ اَ۬لْمُومِنِينَۖ","فَلَمَّا جَآءَهُمُ اُ۬لْحَقُّ مِنْ عِندِنَا قَالُواْ لَوْلَآ أُوتِيَ مِثْلَ مَآ أُوتِيَ مُوس۪ىٰٓۖ أَوَلَمْ يَكْفُرُواْ بِمَآ أُوتِيَ مُوس۪ىٰ مِن قَبْلُۖ قَالُواْ سَٰحِرَٰنِ تَظَٰهَرَاۖ وَقَالُوٓاْ إِنَّا بِكُلّٖ كَٰفِرُونَۖ","قُلْ فَاتُواْ بِكِتَٰبٖ مِّنْ عِندِ اِ۬للَّهِ هُوَ أَهْد۪ىٰ مِنْهُمَآ أَتَّبِعْهُ إِن كُنتُمْ صَٰدِقِينَۖ","فَإِن لَّمْ يَسْتَجِيبُواْ لَكَ فَاعْلَمَ اَنَّمَا يَتَّبِعُونَ أَهْوَآءَهُمْۖ وَمَنَ اَضَلُّ مِمَّنِ اِ۪تَّبَعَ هَو۪يٰهُ بِغَيْرِ هُدىٗ مِّنَ اَ۬للَّهِۖ إِنَّ اَ۬للَّهَ لَا يَهْدِے اِ۬لْقَوْمَ اَ۬لظَّٰلِمِينَۖ","۞ وَلَقَدْ وَصَّلْنَا لَهُمُ اُ۬لْقَوْلَ لَعَلَّهُمْ يَتَذَكَّرُونَۖ","اَ۬لذِينَ ءَاتَيْنَٰهُمُ اُ۬لْكِتَٰبَ مِن قَبْلِهِۦ هُم بِهِۦ يُومِنُونَۖ","وَإِذَا يُتْل۪ىٰ عَلَيْهِمْ قَالُوٓاْ ءَامَنَّا بِهِۦٓ إِنَّهُ اُ۬لْحَقُّ مِن رَّبِّنَآ إِنَّا كُنَّا مِن قَبْلِهِۦ مُسْلِمِينَۖ","أُوْلَٰٓئِكَ يُوتَوْنَ أَجْرَهُم مَّرَّتَيْنِ بِمَا صَبَرُواْ وَيَدْرَءُونَ بِالْحَسَنَةِ اِ۬لسَّيِّئَةَ وَمِمَّا رَزَقْنَٰهُمْ يُنفِقُونَۖ","وَإِذَا سَمِعُواْ اُ۬للَّغْوَ أَعْرَضُواْ عَنْهُ وَقَالُواْ لَنَآ أَعْمَٰلُنَا وَلَكُمُۥٓ أَعْمَٰلُكُمْ سَلَٰمٌ عَلَيْكُمْ لَا نَبْتَغِے اِ۬لْجَٰهِلِينَۖ","إِنَّكَ لَا تَهْدِے مَنَ اَحْبَبْتَۖ وَلَٰكِنَّ اَ۬للَّهَ يَهْدِے مَنْ يَّشَآءُۖ وَهُوَ أَعْلَمُ بِالْمُهْتَدِينَۖ","وَقَالُوٓاْ إِن نَّتَّبِعِ اِ۬لْهُد۪ىٰ مَعَكَ نُتَخَطَّفْ مِنَ اَرْضِنَآۖ أَوَلَمْ نُمَكِّن لَّهُمْ حَرَماً اٰمِناٗ تُجْب۪ىٰٓ إِلَيْهِ ثَمَرَٰتُ كُلِّ شَےْءٖ رِّزْقاٗ مِّن لَّدُنَّاۖ وَلَٰكِنَّ أَكْثَرَهُمْ لَا يَعْلَمُونَۖ","وَكَمَ اَهْلَكْنَا مِن قَرْيَةِۢ بَطِرَتْ مَعِيشَتَهَاۖ فَتِلْكَ مَسَٰكِنُهُمْ لَمْ تُسْكَن مِّنۢ بَعْدِهِمُۥٓ إِلَّا قَلِيلاٗ وَكُنَّا نَحْنُ اُ۬لْوَٰرِثِينَۖ","وَمَا كَانَ رَبُّكَ مُهْلِكَ اَ۬لْقُر۪ىٰ حَتَّىٰ يَبْعَثَ فِےٓ أُمِّهَا رَسُولاٗ يَتْلُواْ عَلَيْهِمُۥٓ ءَايَٰتِنَاۖ وَمَا كُنَّا مُهْلِكِے اِ۬لْقُر۪ىٰٓ إِلَّا وَأَهْلُهَا ظَٰلِمُونَۖ","وَمَآ أُوتِيتُم مِّن شَےْءٖ فَمَتَٰعُ اُ۬لْحَيَوٰةِ اِ۬لدُّنْي۪ا وَزِينَتُهَاۖ وَمَا عِندَ اَ۬للَّهِ خَيْرٞ وَأَبْق۪ىٰٓۖ أَفَلَا تَعْقِلُونَۖ","أَفَمَنْ وَّعَدْنَٰهُ وَعْداً حَسَناٗ فَهُوَ لَٰقِيهِ كَمَن مَّتَّعْنَٰهُ مَتَٰعَ اَ۬لْحَيَوٰةِ اِ۬لدُّنْي۪ا ثُمَّ هُوَ يَوْمَ اَ۬لْقِيَٰمَةِ مِنَ اَ۬لْمُحْضَرِينَۖ","وَيَوْمَ يُنَادِيهِمْ فَيَقُولُ أَيْنَ شُرَكَآءِيَ اَ۬لذِينَ كُنتُمْ تَزْعُمُونَۖ","۞ قَالَ اَ۬لذِينَ حَقَّ عَلَيْهِمُ اُ۬لْقَوْلُ رَبَّنَا هَٰٓؤُلَآءِ اِ۬لذِينَ أَغْوَيْنَآ أَغْوَيْنَٰهُمْ كَمَا غَوَيْنَاۖ تَبَرَّأْنَآ إِلَيْكَۖ مَا كَانُوٓاْ إِيَّانَا يَعْبُدُونَۖ","وَقِيلَ اَ۟دْعُواْ شُرَكَآءَكُمْ فَدَعَوْهُمْ فَلَمْ يَسْتَجِيبُواْ لَهُمْ وَرَأَوُاْ اُ۬لْعَذَابَ لَوَ اَنَّهُمْ كَانُواْ يَهْتَدُونَۖ","وَيَوْمَ يُنَادِيهِمْ فَيَقُولُ مَاذَآ أَجَبْتُمُ اُ۬لْمُرْسَلِينَۖ","فَعَمِيَتْ عَلَيْهِمُ اُ۬لَانۢبَآءُ يَوْمَئِذٖ فَهُمْ لَا يَتَسَآءَلُونَۖ","فَأَمَّا مَن تَابَ وَءَامَنَ وَعَمِلَ صَٰلِحاٗ فَعَس۪ىٰٓ أَنْ يَّكُونَ مِنَ اَ۬لْمُفْلِحِينَۖ","وَرَبُّكَ يَخْلُقُ مَا يَشَآءُ وَيَخْتَارُۖ مَا كَانَ لَهُمُ اُ۬لْخِيَرَةُۖ سُبْحَٰنَ اَ۬للَّهِ وَتَعَٰل۪ىٰ عَمَّا يُشْرِكُونَۖ","وَرَبُّكَ يَعْلَمُ مَا تُكِنُّ صُدُورُهُمْ وَمَا يُعْلِنُونَۖ","وَهُوَ اَ۬للَّهُ لَآ إِلَٰهَ إِلَّا هُوَۖ لَهُ اُ۬لْحَمْدُ فِے اِ۬لُاول۪ىٰ وَالَاخِرَةِۖ وَلَهُ اُ۬لْحُكْمُۖ وَإِلَيْهِ تُرْجَعُونَۖ","قُلَ اَرَٰٓيْتُمُۥٓ إِن جَعَلَ اَ۬للَّهُ عَلَيْكُمُ اُ۬ليْلَ سَرْمَداً اِلَىٰ يَوْمِ اِ۬لْقِيَٰمَةِ مَنِ اِلَٰهٌ غَيْرُ اُ۬للَّهِ يَاتِيكُم بِضِيَآءٍۖ اَفَلَا تَسْمَعُونَۖ","قُلَ اَرَٰٓيْتُمُۥٓ إِن جَعَلَ اَ۬للَّهُ عَلَيْكُمُ اُ۬لنَّهَارَ سَرْمَداً اِلَىٰ يَوْمِ اِ۬لْقِيَٰمَةِ مَنِ اِلَٰهٌ غَيْرُ اُ۬للَّهِ يَاتِيكُم بِلَيْلٖ تَسْكُنُونَ فِيهِۖ أَفَلَا تُبْصِرُونَۖ","وَمِن رَّحْمَتِهِۦ جَعَلَ لَكُمُ اُ۬ليْلَ وَالنَّهَارَ لِتَسْكُنُواْ فِيهِ وَلِتَبْتَغُواْ مِن فَضْلِهِۦ وَلَعَلَّكُمْ تَشْكُرُونَۖ","وَيَوْمَ يُنَادِيهِمْ فَيَقُولُ أَيْنَ شُرَكَآءِيَ اَ۬لذِينَ كُنتُمْ تَزْعُمُونَۖ","وَنَزَعْنَا مِن كُلِّ أُمَّةٖ شَهِيداٗ فَقُلْنَا هَاتُواْ بُرْهَٰنَكُمْ فَعَلِمُوٓاْ أَنَّ اَ۬لْحَقَّ لِلهِ وَضَلَّ عَنْهُم مَّا كَانُواْ يَفْتَرُونَۖ","۞ إِنَّ قَارُونَ كَانَ مِن قَوْمِ مُوس۪ىٰ فَبَغ۪ىٰ عَلَيْهِمْۖ وَءَاتَيْنَٰهُ مِنَ اَ۬لْكُنُوزِ مَآ إِنَّ مَفَاتِحَهُۥ لَتَنُوٓأُ بِالْعُصْبَةِ أُوْلِے اِ۬لْقُوَّةِۖ إِذْ قَالَ لَهُۥ قَوْمُهُۥ لَا تَفْرَحِ اِنَّ اَ۬للَّهَ لَا يُحِبُّ اُ۬لْفَرِحِينَۖ","وَابْتَغِ فِيمَآ ءَات۪يٰكَ اَ۬للَّهُ اُ۬لدَّارَ اَ۬لَاخِرَةَۖ وَلَا تَنسَ نَصِيبَكَ مِنَ اَ۬لدُّنْي۪اۖ وَأَحْسِن كَمَآ أَحْسَنَ اَ۬للَّهُ إِلَيْكَۖ وَلَا تَبْغِ اِ۬لْفَسَادَ فِے اِ۬لَارْضِۖ إِنَّ اَ۬للَّهَ لَا يُحِبُّ اُ۬لْمُفْسِدِينَۖ","قَالَ إِنَّمَآ أُوتِيتُهُۥ عَلَىٰ عِلْمٍ عِندِيَۖ أَوَلَمْ يَعْلَمَ اَنَّ اَ۬للَّهَ قَدَ اَهْلَكَ مِن قَبْلِهِۦ مِنَ اَ۬لْقُرُونِ مَنْ هُوَ أَشَدُّ مِنْهُ قُوَّةٗ وَأَكْثَرُ جَمْعاٗۖ وَلَا يُسْـَٔلُ عَن ذُنُوبِهِمُ اُ۬لْمُجْرِمُونَۖ","فَخَرَجَ عَلَىٰ قَوْمِهِۦ فِے زِينَتِهِۦۖ قَالَ اَ۬لذِينَ يُرِيدُونَ اَ۬لْحَيَوٰةَ اَ۬لدُّنْي۪ا يَٰلَيْتَ لَنَا مِثْلَ مَآ أُوتِيَ قَارُونُ إِنَّهُۥ لَذُو حَظٍّ عَظِيمٖۖ","وَقَالَ اَ۬لذِينَ أُوتُواْ اُ۬لْعِلْمَ وَيْلَكُمْ ثَوَابُ اُ۬للَّهِ خَيْرٞ لِّمَنَ اٰمَنَ وَعَمِلَ صَٰلِحاٗۖ وَلَا يُلَقّ۪يٰهَآ إِلَّا اَ۬لصَّٰبِرُونَۖ","فَخَسَفْنَا بِهِۦ وَبِد۪ارِهِ اِ۬لَارْضَۖ فَمَا كَانَ لَهُۥ مِن فِئَةٖ يَنصُرُونَهُۥ مِن دُونِ اِ۬للَّهِۖ وَمَا كَانَ مِنَ اَ۬لْمُنتَصِرِينَۖ","وَأَصْبَحَ اَ۬لذِينَ تَمَنَّوْاْ مَكَانَهُۥ بِالَامْسِ يَقُولُونَ وَيْكَأَنَّ اَ۬للَّهَ يَبْسُطُ اُ۬لرِّزْقَ لِمَنْ يَّشَآءُ مِنْ عِبَادِهِۦ وَيَقْدِرُۖ لَوْلَآ أَن مَّنَّ اَ۬للَّهُ عَلَيْنَا لَخُسِفَ بِنَاۖ وَيْكَأَنَّهُۥ لَا يُفْلِحُ اُ۬لْكَٰفِرُونَۖ","۞ تِلْكَ اَ۬لدَّارُ اُ۬لَاخِرَةُ نَجْعَلُهَا لِلذِينَ لَا يُرِيدُونَ عُلُوّاٗ فِے اِ۬لَارْضِ وَلَا فَسَاداٗۖ وَالْعَٰقِبَةُ لِلْمُتَّقِينَۖ","مَن جَآءَ بِالْحَسَنَةِ فَلَهُۥ خَيْرٞ مِّنْهَاۖ وَمَن جَآءَ بِالسَّيِّئَةِ فَلَا يُجْزَى اَ۬لذِينَ عَمِلُواْ اُ۬لسَّيِّـَٔاتِ إِلَّا مَا كَانُواْ يَعْمَلُونَۖ","إِنَّ اَ۬لذِے فَرَضَ عَلَيْكَ اَ۬لْقُرْءَانَ لَرَآدُّكَ إِلَىٰ مَعَادٖۖ قُل رَّبِّيَ أَعْلَمُ مَن جَآءَ بِالْهُد۪ىٰ وَمَنْ هُوَ فِے ضَلَٰلٖ مُّبِينٖۖ","وَمَا كُنتَ تَرْجُوٓاْ أَنْ يُّلْق۪ىٰٓ إِلَيْكَ اَ۬لْكِتَٰبُ إِلَّا رَحْمَةٗ مِّن رَّبِّكَۖ فَلَا تَكُونَنَّ ظَهِيراٗ لِّلْكٰ۪فِرِينَۖ","وَلَا يَصُدُّنَّكَ عَنَ اٰيَٰتِ اِ۬للَّهِ بَعْدَ إِذُ ا۟نزِلَتِ اِلَيْكَۖ وَادْعُ إِلَىٰ رَبِّكَۖ وَلَا تَكُونَنَّ مِنَ اَ۬لْمُشْرِكِينَۖ","وَلَا تَدْعُ مَعَ اَ۬للَّهِ إِلَٰهاً اٰخَرَۖ لَآ إِلَٰهَ إِلَّا هُوَۖ كُلُّ شَےْءٍ هَالِكٌ اِلَّا وَجْهَهُۥۖ لَهُ اُ۬لْحُكْمُۖ وَإِلَيْهِ تُرْجَعُونَۖ"]],["العنكبوت",["أَلَٓمِّٓۖ اَحَسِبَ اَ۬لنَّاسُ أَنْ يُّتْرَكُوٓاْ أَنْ يَّقُولُوٓاْ ءَامَنَّا وَهُمْ لَا يُفْتَنُونَۖ","وَلَقَدْ فَتَنَّا اَ۬لذِينَ مِن قَبْلِهِمْۖ فَلَيَعْلَمَنَّ اَ۬للَّهُ اُ۬لذِينَ صَدَقُواْ وَلَيَعْلَمَنَّ اَ۬لْكَٰذِبِينَۖ","أَمْ حَسِبَ اَ۬لذِينَ يَعْمَلُونَ اَ۬لسَّيِّـَٔاتِ أَنْ يَّسْبِقُونَاۖ سَآءَ مَا يَحْكُمُونَۖ","مَن كَانَ يَرْجُواْ لِقَآءَ اَ۬للَّهِ فَإِنَّ أَجَلَ اَ۬للَّهِ لَأٓتٖۖ وَهُوَ اَ۬لسَّمِيعُ اُ۬لْعَلِيمُۖ","وَمَن جَٰهَدَ فَإِنَّمَا يُجَٰهِدُ لِنَفْسِهِۦٓۖ إِنَّ اَ۬للَّهَ لَغَنِيٌّ عَنِ اِ۬لْعَٰلَمِينَۖ","وَالذِينَ ءَامَنُواْ وَعَمِلُواْ اُ۬لصَّٰلِحَٰتِ لَنُكَفِّرَنَّ عَنْهُمْ سَيِّـَٔاتِهِمْ وَلَنَجْزِيَنَّهُمُۥٓ أَحْسَنَ اَ۬لذِے كَانُواْ يَعْمَلُونَۖ","۞ وَوَصَّيْنَا اَ۬لِانسَٰنَ بِوَٰلِدَيْهِ حُسْناٗۖ وَإِن جَٰهَدَٰكَ لِتُشْرِكَ بِے مَا لَيْسَ لَكَ بِهِۦ عِلْمٞ فَلَا تُطِعْهُمَآۖ إِلَيَّ مَرْجِعُكُمْ فَأُنَبِّئُكُم بِمَا كُنتُمْ تَعْمَلُونَۖ","وَالذِينَ ءَامَنُواْ وَعَمِلُواْ اُ۬لصَّٰلِحَٰتِ لَنُدْخِلَنَّهُمْ فِے اِ۬لصَّٰلِحِينَۖ","وَمِنَ اَ۬لنَّاسِ مَنْ يَّقُولُ ءَامَنَّا بِاللَّهِ فَإِذَآ أُوذِيَ فِے اِ۬للَّهِ جَعَلَ فِتْنَةَ اَ۬لنَّاسِ كَعَذَابِ اِ۬للَّهِۖ وَلَئِن جَآءَ نَصْرٞ مِّن رَّبِّكَ لَيَقُولُنَّ إِنَّا كُنَّا مَعَكُمُۥٓۖ أَوَلَيْسَ اَ۬للَّهُ بِأَعْلَمَ بِمَا فِے صُدُورِ اِ۬لْعَٰلَمِينَۖ","وَلَيَعْلَمَنَّ اَ۬للَّهُ اُ۬لذِينَ ءَامَنُواْ وَلَيَعْلَمَنَّ اَ۬لْمُنَٰفِقِينَۖ","وَقَالَ اَ۬لذِينَ كَفَرُواْ لِلذِينَ ءَامَنُواْ اُ۪تَّبِعُواْ سَبِيلَنَا وَلْنَحْمِلْ خَطَٰيٰ۪كُمْۖ وَمَا هُم بِحَٰمِلِينَ مِنْ خَطَٰيٰ۪هُم مِّن شَےْءٍۖ اِنَّهُمْ لَكَٰذِبُونَۖ","وَلَيَحْمِلُنَّ أَثْقَالَهُمْ وَأَثْقَالاٗ مَّعَ أَثْقَالِهِمْۖ وَلَيُسْـَٔلُنَّ يَوْمَ اَ۬لْقِيَٰمَةِ عَمَّا كَانُواْ يَفْتَرُونَۖ","وَلَقَدَ اَرْسَلْنَا نُوحاً اِلَىٰ قَوْمِهِۦ فَلَبِثَ فِيهِمُۥٓ أَلْفَ سَنَةٍ اِلَّا خَمْسِينَ عَاماٗ فَأَخَذَهُمُ اُ۬لطُّوفَانُ وَهُمْ ظَٰلِمُونَۖ","فَأَنجَيْنَٰهُ وَأَصْحَٰبَ اَ۬لسَّفِينَةِۖ وَجَعَلْنَٰهَآ ءَايَةٗ لِّلْعَٰلَمِينَۖ","وَإِبْرَٰهِيمَ إِذْ قَالَ لِقَوْمِهِ اِ۟عْبُدُواْ اُ۬للَّهَ وَاتَّقُوهُۖ ذَٰلِكُمْ خَيْرٞ لَّكُمُۥٓ إِن كُنتُمْ تَعْلَمُونَۖ","۞ إِنَّمَا تَعْبُدُونَ مِن دُونِ اِ۬للَّهِ أَوْثَٰناٗ وَتَخْلُقُونَ إِفْكاًۖ اِنَّ اَ۬لذِينَ تَعْبُدُونَ مِن دُونِ اِ۬للَّهِ لَا يَمْلِكُونَ لَكُمْ رِزْقاٗۖ فَابْتَغُواْ عِندَ اَ۬للَّهِ اِ۬لرِّزْقَۖ وَاعْبُدُوهُۖ وَاشْكُرُواْ لَهُۥٓۖ إِلَيْهِ تُرْجَعُونَۖ","وَإِن تُكَذِّبُواْ فَقَدْ كَذَّبَ أُمَمٞ مِّن قَبْلِكُمْۖ وَمَا عَلَى اَ۬لرَّسُولِ إِلَّا اَ۬لْبَلَٰغُ اُ۬لْمُبِينُۖ","أَوَلَمْ يَرَوْاْ كَيْفَ يُبْدِۓُ اُ۬للَّهُ اُ۬لْخَلْقَۖ ثُمَّ يُعِيدُهُۥٓۖ إِنَّ ذَٰلِكَ عَلَى اَ۬للَّهِ يَسِيرٞۖ","قُلْ سِيرُواْ فِے اِ۬لَارْضِ فَانظُرُواْ كَيْفَ بَدَأَ اَ۬لْخَلْقَۖ ثُمَّ اَ۬للَّهُ يُنشِۓُ اُ۬لنَّشْأَةَ اَ۬لَاخِرَةَۖ إِنَّ اَ۬للَّهَ عَلَىٰ كُلِّ شَےْءٖ قَدِيرٞۖ","يُعَذِّبُ مَنْ يَّشَآءُ وَيَرْحَمُ مَنْ يَّشَآءُۖ وَإِلَيْهِ تُقْلَبُونَۖ","وَمَآ أَنتُم بِمُعْجِزِينَ فِے اِ۬لَارْضِ وَلَا فِے اِ۬لسَّمَآءِۖ وَمَا لَكُم مِّن دُونِ اِ۬للَّهِ مِنْ وَّلِيّٖ وَلَا نَصِيرٖۖ","وَالذِينَ كَفَرُواْ بِـَٔايَٰتِ اِ۬للَّهِ وَلِقَآئِهِۦٓ أُوْلَٰٓئِكَ يَئِسُواْ مِن رَّحْمَتِےۖ وَأُوْلَٰٓئِكَ لَهُمْ عَذَابٌ اَلِيمٞۖ","فَمَا كَانَ جَوَابَ قَوْمِهِۦٓ إِلَّآ أَن قَالُواْ اُ۟قْتُلُوهُ أَوْ حَرِّقُوهُۖ فَأَنج۪يٰهُ اُ۬للَّهُ مِنَ اَ۬لنّ۪ارِۖ إِنَّ فِے ذَٰلِكَ لَأٓيَٰتٖ لِّقَوْمٖ يُومِنُونَۖ","وَقَالَ إِنَّمَا اَ۪تَّخَذتُّم مِّن دُونِ اِ۬للَّهِ أَوْثَٰناٗ مَّوَدَّةَۢ بَيْنَكُمْ فِے اِ۬لْحَيَوٰةِ اِ۬لدُّنْي۪اۖ ثُمَّ يَوْمَ اَ۬لْقِيَٰمَةِ يَكْفُرُ بَعْضُكُم بِبَعْضٖ وَيَلْعَنُ بَعْضُكُم بَعْضاٗۖ وَمَأْو۪يٰكُمُ اُ۬لنَّارُ وَمَا لَكُم مِّن نَّٰصِرِينَۖ","۞ فَـَٔامَنَ لَهُۥ لُوطٞۖ وَقَالَ إِنِّے مُهَاجِرٌ اِلَىٰ رَبِّيَۖ إِنَّهُۥ هُوَ اَ۬لْعَزِيزُ اُ۬لْحَكِيمُۖ","وَوَهَبْنَا لَهُۥٓ إِسْحَٰقَ وَيَعْقُوبَۖ وَجَعَلْنَا فِے ذُرِّيَّتِهِ اِ۬لنُّبُوٓءَةَ وَالْكِتَٰبَۖ وَءَاتَيْنَٰهُ أَجْرَهُۥ فِے اِ۬لدُّنْي۪اۖ وَإِنَّهُۥ فِے اِ۬لَاخِرَةِ لَمِنَ اَ۬لصَّٰلِحِينَۖ","وَلُوطاً اِذْ قَالَ لِقَوْمِهِۦٓ إِنَّكُمْ لَتَاتُونَ اَ۬لْفَٰحِشَةَ مَا سَبَقَكُم بِهَا مِنَ اَحَدٖ مِّنَ اَ۬لْعَٰلَمِينَ","أَئِنَّكُمْ لَتَاتُونَ اَ۬لرِّجَالَ وَتَقْطَعُونَ اَ۬لسَّبِيلَ","وَتَاتُونَ فِے نَادِيكُمُ اُ۬لْمُنكَرَۖ فَمَا كَانَ جَوَابَ قَوْمِهِۦٓ إِلَّآ أَن قَالُواْ اُ۪يتِنَا بِعَذَابِ اِ۬للَّهِ إِن كُنتَ مِنَ اَ۬لصَّٰدِقِينَۖ","قَالَ رَبِّ اِ۟نصُرْنِے عَلَى اَ۬لْقَوْمِ اِ۬لْمُفْسِدِينَۖ","وَلَمَّا جَآءَتْ رُسُلُنَآ إِبْرَٰهِيمَ بِالْبُشْر۪ىٰ قَالُوٓاْ إِنَّا مُهْلِكُوٓاْ أَهْلِ هَٰذِهِ اِ۬لْقَرْيَةِ إِنَّ أَهْلَهَا كَانُواْ ظَٰلِمِينَۖ","قَالَ إِنَّ فِيهَا لُوطاٗۖ قَالُواْ نَحْنُ أَعْلَمُ بِمَن فِيهَاۖ لَنُنَجِّيَنَّهُۥ وَأَهْلَهُۥٓ إِلَّا اَ۪مْرَأَتَهُۥ كَانَتْ مِنَ اَ۬لْغَٰبِرِينَۖ","وَلَمَّآ أَن جَآءَتْ رُسُلُنَا لُوطاٗ س۬ےٓءَ بِهِمْ وَضَاقَ بِهِمْ ذَرْعاٗۖ وَقَالُواْ لَا تَخَفْ وَلَا تَحْزَنِ اِنَّا مُنَجُّوكَ وَأَهْلَكَ إِلَّا اَ۪مْرَأَتَكَ كَانَتْ مِنَ اَ۬لْغَٰبِرِينَۖ","إِنَّا مُنزِلُونَ عَلَىٰٓ أَهْلِ هَٰذِهِ اِ۬لْقَرْيَةِ رِجْزاٗ مِّنَ اَ۬لسَّمَآءِ بِمَا كَانُواْ يَفْسُقُونَۖ","وَلَقَد تَّرَكْنَا مِنْهَآ ءَايَةَۢ بَيِّنَةٗ لِّقَوْمٖ يَعْقِلُونَۖ","۞ وَإِلَىٰ مَدْيَنَ أَخَاهُمْ شُعَيْباٗ فَقَالَ يَٰقَوْمِ اِ۟عْبُدُواْ اُ۬للَّهَ وَارْجُواْ اُ۬لْيَوْمَ اَ۬لَاخِرَ وَلَا تَعْثَوْاْ فِے اِ۬لَارْضِ مُفْسِدِينَۖ","فَكَذَّبُوهُ فَأَخَذَتْهُمُ اُ۬لرَّجْفَةُ فَأَصْبَحُواْ فِے د۪ارِهِمْ جَٰثِمِينَۖ","وَعَاداٗ وَثَمُوداٗ وَقَد تَّبَيَّنَ لَكُم مِّن مَّسَٰكِنِهِمْ وَزَيَّنَ لَهُمُ اُ۬لشَّيْطَٰنُ أَعْمَٰلَهُمْ فَصَدَّهُمْ عَنِ اِ۬لسَّبِيلِ وَكَانُواْ مُسْتَبْصِرِينَۖ","وَقَارُونَ وَفِرْعَوْنَ وَهَامَٰنَۖ وَلَقَدْ جَآءَهُم مُّوس۪ىٰ بِالْبَيِّنَٰتِ فَاسْتَكْبَرُواْ فِے اِ۬لَارْضِ وَمَا كَانُواْ سَٰبِقِينَۖ","فَكُلّاً اَخَذْنَا بِذَنۢبِهِۦۖ فَمِنْهُم مَّنَ اَرْسَلْنَا عَلَيْهِ حَاصِباٗۖ وَمِنْهُم مَّنَ اَخَذَتْهُ اُ۬لصَّيْحَةُۖ وَمِنْهُم مَّنْ خَسَفْنَا بِهِ اِ۬لَارْضَۖ وَمِنْهُم مَّنَ اَغْرَقْنَاۖ وَمَا كَانَ اَ۬للَّهُ لِيَظْلِمَهُمْۖ وَلَٰكِن كَانُوٓاْ أَنفُسَهُمْ يَظْلِمُونَۖ","مَثَلُ اُ۬لذِينَ اَ۪تَّخَذُواْ مِن دُونِ اِ۬للَّهِ أَوْلِيَآءَ كَمَثَلِ اِ۬لْعَنكَبُوتِ اِ۪تَّخَذَتْ بَيْتاٗۖ وَإِنَّ أَوْهَنَ اَ۬لْبُيُوتِ لَبَيْتُ اُ۬لْعَنكَبُوتِ لَوْ كَانُواْ يَعْلَمُونَۖ","إِنَّ اَ۬للَّهَ يَعْلَمُ مَا تَدْعُونَ مِن دُونِهِۦ مِن شَےْءٖۖ وَهُوَ اَ۬لْعَزِيزُ اُ۬لْحَكِيمُۖ","وَتِلْكَ اَ۬لَامْثَٰلُ نَضْرِبُهَا لِلنَّاسِۖ وَمَا يَعْقِلُهَآ إِلَّا اَ۬لْعَٰلِمُونَۖ","خَلَقَ اَ۬للَّهُ اُ۬لسَّمَٰوَٰتِ وَالَارْضَ بِالْحَقِّۖ إِنَّ فِے ذَٰلِكَ لَأٓيَةٗ لِّلْمُومِنِينَۖ","اَ۟تْلُ مَآ أُوحِيَ إِلَيْكَ مِنَ اَ۬لْكِتَٰبِ وَأَقِمِ اِ۬لصَّلَوٰةَۖ إِنَّ اَ۬لصَّلَوٰةَ تَنْه۪ىٰ عَنِ اِ۬لْفَحْشَآءِ وَالْمُنكَرِۖ وَلَذِكْرُ اُ۬للَّهِ أَكْبَرُۖ وَاللَّهُ يَعْلَمُ مَا تَصْنَعُونَۖ","۞ وَلَا تُجَٰدِلُوٓاْ أَهْلَ اَ۬لْكِتَٰبِ إِلَّا بِالتِے هِيَ أَحْسَنُۖ إِلَّا اَ۬لذِينَ ظَلَمُواْ مِنْهُمْۖ وَقُولُوٓاْ ءَامَنَّا بِالذِےٓ أُنزِلَ إِلَيْنَا وَأُنزِلَ إِلَيْكُمْ وَإِلَٰهُنَا وَإِلَٰهُكُمْ وَٰحِدٞ وَنَحْنُ لَهُۥ مُسْلِمُونَۖ","وَكَذَٰلِكَ أَنزَلْنَآ إِلَيْكَ اَ۬لْكِتَٰبَۖ فَالذِينَ ءَاتَيْنَٰهُمُ اُ۬لْكِتَٰبَ يُومِنُونَ بِهِۦ وَمِنْ هَٰٓؤُلَآءِ مَنْ يُّومِنُ بِهِۦۖ وَمَا يَجْحَدُ بِـَٔايَٰتِنَآ إِلَّا اَ۬لْكَٰفِرُونَۖ","وَمَا كُنتَ تَتْلُواْ مِن قَبْلِهِۦ مِن كِتَٰبٖ وَلَا تَخُطُّهُۥ بِيَمِينِكَۖ إِذاٗ لَّارْتَابَ اَ۬لْمُبْطِلُونَۖ","بَلْ هُوَ ءَايَٰتُۢ بَيِّنَٰتٞ فِے صُدُورِ اِ۬لذِينَ أُوتُواْ اُ۬لْعِلْمَۖ وَمَا يَجْحَدُ بِـَٔايَٰتِنَآ إِلَّا اَ۬لظَّٰلِمُونَۖ","وَقَالُواْ لَوْلَآ أُنزِلَ عَلَيْهِ ءَايَٰتٞ مِّن رَّبِّهِۦۖ قُلِ اِنَّمَا اَ۬لَايَٰتُ عِندَ اَ۬للَّهِ وَإِنَّمَآ أَنَا نَذِيرٞ مُّبِينٌۖ","اَوَلَمْ يَكْفِهِمُۥٓ أَنَّآ أَنزَلْنَا عَلَيْكَ اَ۬لْكِتَٰبَ يُتْل۪ىٰ عَلَيْهِمُۥٓۖ إِنَّ فِے ذَٰلِكَ لَرَحْمَةٗ وَذِكْر۪ىٰ لِقَوْمٖ يُومِنُونَۖ","قُلْ كَف۪ىٰ بِاللَّهِ بَيْنِے وَبَيْنَكُمْ شَهِيداٗۖ يَعْلَمُ مَا فِے اِ۬لسَّمَٰوَٰتِ وَالَارْضِۖ وَالذِينَ ءَامَنُواْ بِالْبَٰطِلِ وَكَفَرُواْ بِاللَّهِ أُوْلَٰٓئِكَ هُمُ اُ۬لْخَٰسِرُونَۖ","وَيَسْتَعْجِلُونَكَ بِالْعَذَابِۖ وَلَوْلَآ أَجَلٞ مُّسَمّىٗ لَّجَآءَهُمُ اُ۬لْعَذَابُ وَلَيَاتِيَنَّهُم بَغْتَةٗ وَهُمْ لَا يَشْعُرُونَۖ","يَسْتَعْجِلُونَكَ بِالْعَذَابِۖ وَإِنَّ جَهَنَّمَ لَمُحِيطَةُۢ بِالْكٰ۪فِرِينَۖ","يَوْمَ يَغْش۪يٰهُمُ اُ۬لْعَذَابُ مِن فَوْقِهِمْ وَمِن تَحْتِ أَرْجُلِهِمْ وَيَقُولُ ذُوقُواْ مَا كُنتُمْ تَعْمَلُونَۖ","يَٰعِبَادِيَ اَ۬لذِينَ ءَامَنُوٓاْ إِنَّ أَرْضِے وَٰسِعَةٞ فَإِيَّٰيَ فَاعْبُدُونِۖ","كُلُّ نَفْسٖ ذَآئِقَةُ اُ۬لْمَوْتِۖ ثُمَّ إِلَيْنَا تُرْجَعُونَۖ","وَالذِينَ ءَامَنُواْ وَعَمِلُواْ اُ۬لصَّٰلِحَٰتِ لَنُبَوِّئَنَّهُم مِّنَ اَ۬لْجَنَّةِ غُرَفاٗ تَجْرِے مِن تَحْتِهَا اَ۬لَانْهَٰرُ خَٰلِدِينَ فِيهَاۖ نِعْمَ أَجْرُ اُ۬لْعَٰمِلِينَۖ","اَ۬لذِينَ صَبَرُواْ وَعَلَىٰ رَبِّهِمْ يَتَوَكَّلُونَۖ","۞ وَكَأَيِّن مِّن دَآبَّةٖ لَّا تَحْمِلُ رِزْقَهَا اَ۬للَّهُ يَرْزُقُهَا وَإِيَّاكُمْۖ وَهُوَ اَ۬لسَّمِيعُ اُ۬لْعَلِيمُۖ","وَلَئِن سَأَلْتَهُم مَّنْ خَلَقَ اَ۬لسَّمَٰوَٰتِ وَالَارْضَ وَسَخَّرَ اَ۬لشَّمْسَ وَالْقَمَرَ لَيَقُولُنَّ اَ۬للَّهُۖ فَأَنّ۪ىٰ يُوفَكُونَۖ","اَ۬للَّهُ يَبْسُطُ اُ۬لرِّزْقَ لِمَنْ يَّشَآءُ مِنْ عِبَادِهِۦ وَيَقْدِرُ لَهُۥٓۖ إِنَّ اَ۬للَّهَ بِكُلِّ شَےْءٍ عَلِيمٞۖ","وَلَئِن سَأَلْتَهُم مَّن نَّزَّلَ مِنَ اَ۬لسَّمَآءِ مَآءٗ فَأَحْي۪ا بِهِ اِ۬لَارْضَ مِنۢ بَعْدِ مَوْتِهَا لَيَقُولُنَّ اَ۬للَّهُۖ قُلِ اِ۬لْحَمْدُ لِلهِۖ بَلَ اَكْثَرُهُمْ لَا يَعْقِلُونَۖ","وَمَا هَٰذِهِ اِ۬لْحَيَوٰةُ اُ۬لدُّنْي۪آ إِلَّا لَهْوٞ وَلَعِبٞۖ وَإِنَّ اَ۬لدَّارَ اَ۬لَاخِرَةَ لَهِيَ اَ۬لْحَيَوَانُ لَوْ كَانُواْ يَعْلَمُونَۖ","فَإِذَا رَكِبُواْ فِے اِ۬لْفُلْكِ دَعَوُاْ اُ۬للَّهَ مُخْلِصِينَ لَهُ اُ۬لدِّينَۖ فَلَمَّا نَجّ۪يٰهُمُۥٓ إِلَى اَ۬لْبَرِّ إِذَا هُمْ يُشْرِكُونَ","لِيَكْفُرُواْ بِمَآ ءَاتَيْنَٰهُمْۖ وَلِيَتَمَتَّعُواْ فَسَوْفَ يَعْلَمُونَۖ","أَوَلَمْ يَرَوَاْ اَنَّا جَعَلْنَا حَرَماً اٰمِناٗ وَيُتَخَطَّفُ اُ۬لنَّاسُ مِنْ حَوْلِهِمُۥٓۖ أَفَبِالْبَٰطِلِ يُومِنُونَ وَبِنِعْمَةِ اِ۬للَّهِ يَكْفُرُونَۖ","وَمَنَ اَظْلَمُ مِمَّنِ اِ۪فْتَر۪ىٰ عَلَى اَ۬للَّهِ كَذِباً اَوْ كَذَّبَ بِالْحَقِّ لَمَّا جَآءَهُۥٓۖ أَلَيْسَ فِے جَهَنَّمَ مَثْوىٗ لِّلْكٰ۪فِرِينَۖ","وَالذِينَ جَٰهَدُواْ فِينَا لَنَهْدِيَنَّهُمْ سُبُلَنَاۖ وَإِنَّ اَ۬للَّهَ لَمَعَ اَ۬لْمُحْسِنِينَۖ"]],["الروم",["أَلَٓمِّٓۖ غُلِبَتِ اِ۬لرُّومُ فِےٓ أَدْنَى اَ۬لَارْضِ وَهُم مِّنۢ بَعْدِ غَلَبِهِمْ سَيَغْلِبُونَ","فِے بِضْعِ سِنِينَۖ","لِلهِ اِ۬لَامْرُ مِن قَبْلُ وَمِنۢ بَعْدُۖ وَيَوْمَئِذٖ يَفْرَحُ اُ۬لْمُومِنُونَ","بِنَصْرِ اِ۬للَّهِۖ يَنصُرُ مَنْ يَّشَآءُۖ وَهُوَ اَ۬لْعَزِيزُ اُ۬لرَّحِيمُۖ","وَعْدَ اَ۬للَّهِ لَا يُخْلِفُ اُ۬للَّهُ وَعْدَهُۥۖ وَلَٰكِنَّ أَكْثَرَ اَ۬لنَّاسِ لَا يَعْلَمُونَۖ","يَعْلَمُونَ ظَٰهِراٗ مِّنَ اَ۬لْحَيَوٰةِ اِ۬لدُّنْي۪ا وَهُمْ عَنِ اِ۬لَاخِرَةِ هُمْ غَٰفِلُونَۖ","أَوَلَمْ يَتَفَكَّرُواْ فِےٓ أَنفُسِهِمۖ مَّا خَلَقَ اَ۬للَّهُ اُ۬لسَّمَٰوَٰتِ وَالَارْضَ وَمَا بَيْنَهُمَآ إِلَّا بِالْحَقِّ وَأَجَلٖ مُّسَمّىٗۖ وَإِنَّ كَثِيراٗ مِّنَ اَ۬لنَّاسِ بِلِقَآءِ رَبِّهِمْ لَكَٰفِرُونَۖ","۞ أَوَلَمْ يَسِيرُواْ فِے اِ۬لَارْضِ فَيَنظُرُواْ كَيْفَ كَانَ عَٰقِبَةُ اُ۬لذِينَ مِن قَبْلِهِمْ كَانُوٓاْ أَشَدَّ مِنْهُمْ قُوَّةٗ وَأَثَارُواْ اُ۬لَارْضَۖ وَعَمَرُوهَآ أَكْثَرَ مِمَّا عَمَرُوهَا وَجَآءَتْهُمْ رُسُلُهُم بِالْبَيِّنَٰتِۖ فَمَا كَانَ اَ۬للَّهُ لِيَظْلِمَهُمْۖ وَلَٰكِن كَانُوٓاْ أَنفُسَهُمْ يَظْلِمُونَۖ","ثُمَّ كَانَ عَٰقِبَةُ اُ۬لذِينَ أَسَٰٓـُٔواْ اُ۬لسُّوٓأ۪ىٰٓ أَن كَذَّبُواْ بِـَٔايَٰتِ اِ۬للَّهِ وَكَانُواْ بِهَا يَسْتَهْزِءُونَۖ","اَ۬للَّهُ يَبْدَؤُاْ اُ۬لْخَلْقَ ثُمَّ يُعِيدُهُۥ ثُمَّ إِلَيْهِ تُرْجَعُونَۖ","وَيَوْمَ تَقُومُ اُ۬لسَّاعَةُ يُبْلِسُ اُ۬لْمُجْرِمُونَ","وَلَمْ يَكُن لَّهُم مِّن شُرَكَآئِهِمْ شُفَعَٰٓؤُاْ وَكَانُواْ بِشُرَكَآئِهِمْ كٰ۪فِرِينَۖ","وَيَوْمَ تَقُومُ اُ۬لسَّاعَةُ يَوْمَئِذٖ يَتَفَرَّقُونَۖ","فَأَمَّا اَ۬لذِينَ ءَامَنُواْ وَعَمِلُواْ اُ۬لصَّٰلِحَٰتِ فَهُمْ فِے رَوْضَةٖ يُحْبَرُونَۖ","وَأَمَّا اَ۬لذِينَ كَفَرُواْ وَكَذَّبُواْ بِـَٔايَٰتِنَا وَلِقَآءِ اِ۬لَاخِرَةِ فَأُوْلَٰٓئِكَ فِے اِ۬لْعَذَابِ مُحْضَرُونَۖ","فَسُبْحَٰنَ اَ۬للَّهِ حِينَ تُمْسُونَ وَحِينَ تُصْبِحُونَ","وَلَهُ اُ۬لْحَمْدُ فِے اِ۬لسَّمَٰوَٰتِ وَالَارْضِ وَعَشِيّاٗ وَحِينَ تُظْهِرُونَۖ","يُخْرِجُ اُ۬لْحَيَّ مِنَ اَ۬لْمَيِّتِ وَيُخْرِجُ اُ۬لْمَيِّتَ مِنَ اَ۬لْحَيِّ وَيُحْيِ اِ۬لَارْضَ بَعْدَ مَوْتِهَاۖ وَكَذَٰلِكَ تُخْرَجُونَۖ","وَمِنَ اٰيَٰتِهِۦٓ أَنْ خَلَقَكُم مِّن تُرَابٖ ثُمَّ إِذَآ أَنتُم بَشَرٞ تَنتَشِرُونَۖ","وَمِنَ اٰيَٰتِهِۦٓ أَنْ خَلَقَ لَكُم مِّنَ اَنفُسِكُمُۥٓ أَزْوَٰجاٗ لِّتَسْكُنُوٓاْ إِلَيْهَا وَجَعَلَ بَيْنَكُم مَّوَدَّةٗ وَرَحْمَةًۖ اِنَّ فِے ذَٰلِكَ لَأٓيَٰتٖ لِّقَوْمٖ يَتَفَكَّرُونَۖ","۞ وَمِنَ اٰيَٰتِهِۦ خَلْقُ اُ۬لسَّمَٰوَٰتِ وَالَارْضِ وَاخْتِلَٰفُ أَلْسِنَتِكُمْ وَأَلْوَٰنِكُمُۥٓۖ إِنَّ فِے ذَٰلِكَ لَأٓيَٰتٖ لِّلْعَٰلَمِينَۖ","وَمِنَ اٰيَٰتِهِۦ مَنَامُكُم بِاليْلِ وَالنَّه۪ارِ وَابْتِغَآؤُكُم مِّن فَضْلِهِۦٓۖ إِنَّ فِے ذَٰلِكَ لَأٓيَٰتٖ لِّقَوْمٖ يَسْمَعُونَۖ","وَمِنَ اٰيَٰتِهِۦ يُرِيكُمُ اُ۬لْبَرْقَ خَوْفاٗ وَطَمَعاٗ وَيُنَزِّلُ مِنَ اَ۬لسَّمَآءِ مَآءٗ فَيُحْيِۦ بِهِ اِ۬لَارْضَ بَعْدَ مَوْتِهَآۖ إِنَّ فِے ذَٰلِكَ لَأٓيَٰتٖ لِّقَوْمٖ يَعْقِلُونَۖ","وَمِنَ اٰيَٰتِهِۦٓ أَن تَقُومَ اَ۬لسَّمَآءُ وَالَارْضُ بِأَمْرِهِۦۖ ثُمَّ إِذَا دَعَاكُمْ دَعْوَةٗ مِّنَ اَ۬لَارْضِ إِذَآ أَنتُمْ تَخْرُجُونَۖ","وَلَهُۥ مَن فِے اِ۬لسَّمَٰوَٰتِ وَالَارْضِۖ كُلّٞ لَّهُۥ قَٰنِتُونَۖ","وَهُوَ اَ۬لذِے يَبْدَؤُاْ اُ۬لْخَلْقَ ثُمَّ يُعِيدُهُۥ وَهُوَ أَهْوَنُ عَلَيْهِۖ وَلَهُ اُ۬لْمَثَلُ اُ۬لَاعْل۪ىٰ فِے اِ۬لسَّمَٰوَٰتِ وَالَارْضِۖ وَهُوَ اَ۬لْعَزِيزُ اُ۬لْحَكِيمُۖ","ضَرَبَ لَكُم مَّثَلاٗ مِّنَ اَنفُسِكُمْ هَل لَّكُم مِّن مَّا مَلَكَتَ اَيْمَٰنُكُم مِّن شُرَكَآءَ فِے مَا رَزَقْنَٰكُمْ فَأَنتُمْ فِيهِ سَوَآءٞ تَخَافُونَهُمْ كَخِيفَتِكُمُۥٓ أَنفُسَكُمْۖ كَذَٰلِكَ نُفَصِّلُ اُ۬لَايَٰتِ لِقَوْمٖ يَعْقِلُونَۖ","بَلِ اِ۪تَّبَعَ اَ۬لذِينَ ظَلَمُوٓاْ أَهْوَآءَهُم بِغَيْرِ عِلْمٖۖ فَمَنْ يَّهْدِے مَنَ اَضَلَّ اَ۬للَّهُۖ وَمَا لَهُم مِّن نَّٰصِرِينَۖ","۞ فَأَقِمْ وَجْهَكَ لِلدِّينِ حَنِيفاٗ فِطْرَتَ اَ۬للَّهِ اِ۬لتِے فَطَرَ اَ۬لنَّاسَ عَلَيْهَا لَا تَبْدِيلَ لِخَلْقِ اِ۬للَّهِ ذَٰلِكَ اَ۬لدِّينُ اُ۬لْقَيِّمُ وَلَٰكِنَّ أَكْثَرَ اَ۬لنَّاسِ لَا يَعْلَمُونَ","مُنِيبِينَ إِلَيْهِ وَاتَّقُوهُ وَأَقِيمُواْ اُ۬لصَّلَوٰةَ وَلَا تَكُونُواْ مِنَ اَ۬لْمُشْرِكِينَ","مِنَ اَ۬لذِينَ فَرَّقُواْ دِينَهُمْ وَكَانُواْ شِيَعاٗۖ كُلُّ حِزْبِۢ بِمَا لَدَيْهِمْ فَرِحُونَۖ","وَإِذَا مَسَّ اَ۬لنَّاسَ ضُرّٞ دَعَوْاْ رَبَّهُم مُّنِيبِينَ إِلَيْهِۖ ثُمَّ إِذَآ أَذَاقَهُم مِّنْهُ رَحْمَةً اِذَا فَرِيقٞ مِّنْهُم بِرَبِّهِمْ يُشْرِكُونَۖ","لِيَكْفُرُواْ بِمَآ ءَاتَيْنَٰهُمْۖ فَتَمَتَّعُواْ فَسَوْفَ تَعْلَمُونَۖ","أَمَ اَنزَلْنَا عَلَيْهِمْ سُلْطَٰناٗ فَهُوَ يَتَكَلَّمُ بِمَا كَانُواْ بِهِۦ يُشْرِكُونَۖ","وَإِذَآ أَذَقْنَا اَ۬لنَّاسَ رَحْمَةٗ فَرِحُواْ بِهَاۖ وَإِن تُصِبْهُمْ سَيِّئَةُۢ بِمَا قَدَّمَتَ اَيْدِيهِمُۥٓ إِذَا هُمْ يَقْنَطُونَۖ","أَوَلَمْ يَرَوَاْ اَنَّ اَ۬للَّهَ يَبْسُطُ اُ۬لرِّزْقَ لِمَنْ يَّشَآءُ وَيَقْدِرُۖ إِنَّ فِے ذَٰلِكَ لَأٓيَٰتٖ لِّقَوْمٖ يُومِنُونَۖ","فَـَٔاتِ ذَا اَ۬لْقُرْب۪ىٰ حَقَّهُۥ وَالْمِسْكِينَ وَابْنَ اَ۬لسَّبِيلِۖ ذَٰلِكَ خَيْرٞ لِّلذِينَ يُرِيدُونَ وَجْهَ اَ۬للَّهِۖ وَأُوْلَٰٓئِكَ هُمُ اُ۬لْمُفْلِحُونَۖ","وَمَآ ءَاتَيْتُم مِّن رِّباٗ لِّتُرْبُواْ فِےٓ أَمْوَٰلِ اِ۬لنَّاسِ فَلَا يَرْبُواْ عِندَ اَ۬للَّهِۖ وَمَآ ءَاتَيْتُم مِّن زَكَوٰةٖ تُرِيدُونَ وَجْهَ اَ۬للَّهِ فَأُوْلَٰٓئِكَ هُمُ اُ۬لْمُضْعِفُونَۖ","اَ۬للَّهُ اُ۬لذِے خَلَقَكُمْ ثُمَّ رَزَقَكُمْ ثُمَّ يُمِيتُكُمْ ثُمَّ يُحْيِيكُمْۖ هَلْ مِن شُرَكَآئِكُم مَّنْ يَّفْعَلُ مِن ذَٰلِكُم مِّن شَےْءٖۖ سُبْحَٰنَهُۥ وَتَعَٰل۪ىٰ عَمَّا يُشْرِكُونَۖ","۞ ظَهَرَ اَ۬لْفَسَادُ فِے اِ۬لْبَرِّ وَالْبَحْرِ بِمَا كَسَبَتَ اَيْدِے اِ۬لنَّاسِ لِيُذِيقَهُم بَعْضَ اَ۬لذِے عَمِلُواْ لَعَلَّهُمْ يَرْجِعُونَۖ","قُلْ سِيرُواْ فِے اِ۬لَارْضِ فَانظُرُواْ كَيْفَ كَانَ عَٰقِبَةُ اُ۬لذِينَ مِن قَبْلُۖ كَانَ أَكْثَرُهُم مُّشْرِكِينَۖ","فَأَقِمْ وَجْهَكَ لِلدِّينِ اِ۬لْقَيِّمِ مِن قَبْلِ أَنْ يَّاتِيَ يَوْمٞ لَّا مَرَدَّ لَهُۥ مِنَ اَ۬للَّهِۖ يَوْمَئِذٖ يَصَّدَّعُونَۖ","مَن كَفَرَ فَعَلَيْهِ كُفْرُهُۥۖ وَمَنْ عَمِلَ صَٰلِحاٗ فَلِأَنفُسِهِمْ يَمْهَدُونَ","لِيَجْزِيَ اَ۬لذِينَ ءَامَنُواْ وَعَمِلُواْ اُ۬لصَّٰلِحَٰتِ مِن فَضْلِهِۦٓۖ إِنَّهُۥ لَا يُحِبُّ اُ۬لْكٰ۪فِرِينَۖ","وَمِنَ اٰيَٰتِهِۦٓ أَنْ يُّرْسِلَ اَ۬لرِّيَاحَ مُبَشِّرَٰتٖ وَلِيُذِيقَكُم مِّن رَّحْمَتِهِۦ وَلِتَجْرِيَ اَ۬لْفُلْكُ بِأَمْرِهِۦ وَلِتَبْتَغُواْ مِن فَضْلِهِۦ وَلَعَلَّكُمْ تَشْكُرُونَۖ","وَلَقَدَ اَرْسَلْنَا مِن قَبْلِكَ رُسُلاً اِلَىٰ قَوْمِهِمْ فَجَآءُوهُم بِالْبَيِّنَٰتِ فَانتَقَمْنَا مِنَ اَ۬لذِينَ أَجْرَمُواْۖ وَكَانَ حَقّاً عَلَيْنَا نَصْرُ اُ۬لْمُومِنِينَۖ","اَ۬للَّهُ اُ۬لذِے يُرْسِلُ اُ۬لرِّيَٰحَ فَتُثِيرُ سَحَاباٗ فَيَبْسُطُهُۥ فِے اِ۬لسَّمَآءِ كَيْفَ يَشَآءُ وَيَجْعَلُهُۥ كِسَفاٗ فَتَرَى اَ۬لْوَدْقَ يَخْرُجُ مِنْ خِلَٰلِهِۦۖ فَإِذَآ أَصَابَ بِهِۦ مَنْ يَّشَآءُ مِنْ عِبَادِهِۦٓ إِذَا هُمْ يَسْتَبْشِرُونَۖ","وَإِن كَانُواْ مِن قَبْلِ أَنْ يُّنَزَّلَ عَلَيْهِم مِّن قَبْلِهِۦ لَمُبْلِسِينَۖ","فَانظُرِ اِلَىٰٓ أَثَرِ رَحْمَتِ اِ۬للَّهِ كَيْفَ يُحْيِ اِ۬لَارْضَ بَعْدَ مَوْتِهَآۖ إِنَّ ذَٰلِكَ لَمُحْيِ اِ۬لْمَوْت۪ىٰۖ وَهُوَ عَلَىٰ كُلِّ شَےْءٖ قَدِيرٞۖ","وَلَئِنَ اَرْسَلْنَا رِيحاٗ فَرَأَوْهُ مُصْفَرّاٗ لَّظَلُّواْ مِنۢ بَعْدِهِۦ يَكْفُرُونَۖ","فَإِنَّكَ لَا تُسْمِعُ اُ۬لْمَوْت۪ىٰ وَلَا تُسْمِعُ اُ۬لصُّمَّ اَ۬لدُّعَآءَ ا۪ذَا وَلَّوْاْ مُدْبِرِينَۖ","وَمَآ أَنتَ بِهَٰدِ اِ۬لْعُمْيِ عَن ضَلَٰلَتِهِمُۥٓۖ إِن تُسْمِعُ إِلَّا مَنْ يُّومِنُ بِـَٔايَٰتِنَا فَهُم مُّسْلِمُونَۖ","۞ اَ۬للَّهُ اُ۬لذِے خَلَقَكُم مِّن ضُعْفٖ ثُمَّ جَعَلَ مِنۢ بَعْدِ ضُعْفٖ قُوَّةٗ ثُمَّ جَعَلَ مِنۢ بَعْدِ قُوَّةٖ ضُعْفاٗ وَشَيْبَةٗۖ يَخْلُقُ مَا يَشَآءُۖ وَهُوَ اَ۬لْعَلِيمُ اُ۬لْقَدِيرُۖ","وَيَوْمَ تَقُومُ اُ۬لسَّاعَةُ يُقْسِمُ اُ۬لْمُجْرِمُونَ مَا لَبِثُواْ غَيْرَ سَاعَةٖۖ كَذَٰلِكَ كَانُواْ يُوفَكُونَۖ","وَقَالَ اَ۬لذِينَ أُوتُواْ اُ۬لْعِلْمَ وَالِايمَٰنَ لَقَدْ لَبِثْتُمْ فِے كِتَٰبِ اِ۬للَّهِ إِلَىٰ يَوْمِ اِ۬لْبَعْثِۖ فَهَٰذَا يَوْمُ اُ۬لْبَعْثِ وَلَٰكِنَّكُمْ كُنتُمْ لَا تَعْلَمُونَۖ","فَيَوْمَئِذٖ لَّا تَنفَعُ اُ۬لذِينَ ظَلَمُواْ مَعْذِرَتُهُمْ وَلَا هُمْ يُسْتَعْتَبُونَۖ","وَلَقَد ضَّرَبْنَا لِلنَّاسِ فِے هَٰذَا اَ۬لْقُرْءَانِ مِن كُلِّ مَثَلٖۖ وَلَئِن جِئْتَهُم بِـَٔايَةٖ لَّيَقُولَنَّ اَ۬لذِينَ كَفَرُوٓاْ إِنَ اَنتُمُۥٓ إِلَّا مُبْطِلُونَۖ","كَذَٰلِكَ يَطْبَعُ اُ۬للَّهُ عَلَىٰ قُلُوبِ اِ۬لذِينَ لَا يَعْلَمُونَۖ","فَاصْبِرِۖ اِنَّ وَعْدَ اَ۬للَّهِ حَقّٞۖ وَلَا يَسْتَخِفَّنَّكَ اَ۬لذِينَ لَا يُوقِنُونَۖ"]],["لقمان",["أَلَٓمِّٓۖ تِلْكَ ءَايَٰتُ اُ۬لْكِتَٰبِ اِ۬لْحَكِيمِ","هُدىٗ وَرَحْمَةٗ لِّلْمُحْسِنِينَ","اَ۬لذِينَ يُقِيمُونَ اَ۬لصَّلَوٰةَ وَيُوتُونَ اَ۬لزَّكَوٰةَ وَهُم بِالَاخِرَةِ هُمْ يُوقِنُونَۖ","أُوْلَٰٓئِكَ عَلَىٰ هُدىٗ مِّن رَّبِّهِمْۖ وَأُوْلَٰٓئِكَ هُمُ اُ۬لْمُفْلِحُونَۖ","وَمِنَ اَ۬لنَّاسِ مَنْ يَّشْتَرِے لَهْوَ اَ۬لْحَدِيثِ لِيُضِلَّ عَن سَبِيلِ اِ۬للَّهِ بِغَيْرِ عِلْمٖ وَيَتَّخِذُهَا هُزُؤاًۖ ا۟وْلَٰٓئِكَ لَهُمْ عَذَابٞ مُّهِينٞۖ","وَإِذَا تُتْل۪ىٰ عَلَيْهِ ءَايَٰتُنَا وَلّ۪ىٰ مُسْتَكْبِراٗ كَأَن لَّمْ يَسْمَعْهَا كَأَنَّ فِےٓ أُذْنَيْهِ وَقْراٗۖ فَبَشِّرْهُ بِعَذَابٍ اَلِيمٍۖ","اِنَّ اَ۬لذِينَ ءَامَنُواْ وَعَمِلُواْ اُ۬لصَّٰلِحَٰتِ لَهُمْ جَنَّٰتُ اُ۬لنَّعِيمِ","خَٰلِدِينَ فِيهَاۖ وَعْدَ اَ۬للَّهِ حَقّاٗۖ وَهُوَ اَ۬لْعَزِيزُ اُ۬لْحَكِيمُۖ","خَلَقَ اَ۬لسَّمَٰوَٰتِ بِغَيْرِ عَمَدٖۖ تَرَوْنَهَاۖ وَأَلْق۪ىٰ فِے اِ۬لَارْضِ رَوَٰسِيَ أَن تَمِيدَ بِكُمْ وَبَثَّ فِيهَا مِن كُلِّ دَآبَّةٖۖ وَأَنزَلْنَا مِنَ اَ۬لسَّمَآءِ مَآءٗ فَأَنۢبَتْنَا فِيهَا مِن كُلِّ زَوْجٖ كَرِيمٍۖ","۞ هَٰذَا خَلْقُ اُ۬للَّهِۖ فَأَرُونِے مَاذَا خَلَقَ اَ۬لذِينَ مِن دُونِهِۦۖ بَلِ اِ۬لظَّٰلِمُونَ فِے ضَلَٰلٖ مُّبِينٖۖ","وَلَقَدَ اٰتَيْنَا لُقْمَٰنَ اَ۬لْحِكْمَةَ أَنُ اُ۟شْكُرْ لِلهِۖ وَمَنْ يَّشْكُرْ فَإِنَّمَا يَشْكُرُ لِنَفْسِهِۦۖ وَمَن كَفَرَ فَإِنَّ اَ۬للَّهَ غَنِيٌّ حَمِيدٞۖ","وَإِذْ قَالَ لُقْمَٰنُ لِابْنِهِۦ وَهُوَ يَعِظُهُۥ يَٰبُنَيِّ لَا تُشْرِكْ بِاللَّهِۖ إِنَّ اَ۬لشِّرْكَ لَظُلْمٌ عَظِيمٞۖ","وَوَصَّيْنَا اَ۬لِانسَٰنَ بِوَٰلِدَيْهِۖ حَمَلَتْهُ أُمُّهُۥ وَهْناً عَلَىٰ وَهْنٖۖ وَفِصَٰلُهُۥ فِے عَامَيْنِۖ أَنُ اُ۟شْكُرْ لِے وَلِوَٰلِدَيْكَۖ إِلَيَّ اَ۬لْمَصِيرُۖ","وَإِن جَٰهَدَٰكَ عَلَىٰٓ أَن تُشْرِكَ بِے مَا لَيْسَ لَكَ بِهِۦ عِلْمٞ فَلَا تُطِعْهُمَاۖ وَصَاحِبْهُمَا فِے اِ۬لدُّنْي۪ا مَعْرُوفاٗۖ وَاتَّبِعْ سَبِيلَ مَنَ اَنَابَ إِلَيَّۖ ثُمَّ إِلَيَّ مَرْجِعُكُمْ فَأُنَبِّئُكُم بِمَا كُنتُمْ تَعْمَلُونَۖ","يَٰبُنَيِّ إِنَّهَآ إِن تَكُ مِثْقَالُ حَبَّةٖ مِّنْ خَرْدَلٖ فَتَكُن فِے صَخْرَةٍ اَوْ فِے اِ۬لسَّمَٰوَٰتِ أَوْ فِے اِ۬لَارْضِ يَاتِ بِهَا اَ۬للَّهُۖ إِنَّ اَ۬للَّهَ لَطِيفٌ خَبِيرٞۖ","يَٰبُنَيِّ أَقِمِ اِ۬لصَّلَوٰةَۖ وَامُرْ بِالْمَعْرُوفِۖ وَانْهَ عَنِ اِ۬لْمُنكَرِۖ وَاصْبِرْ عَلَىٰ مَآ أَصَابَكَۖ إِنَّ ذَٰلِكَ مِنْ عَزْمِ اِ۬لُامُورِۖ","وَلَا تُصَٰعِرْ خَدَّكَ لِلنَّاسِۖ وَلَا تَمْشِ فِے اِ۬لَارْضِ مَرَحاًۖ اِنَّ اَ۬للَّهَ لَا يُحِبُّ كُلَّ مُخْتَالٖ فَخُورٖۖ","وَاقْصِدْ فِے مَشْيِكَۖ وَاغْضُضْ مِن صَوْتِكَۖ إِنَّ أَنكَرَ اَ۬لَاصْوَٰتِ لَصَوْتُ اُ۬لْحَمِيرِۖ","أَلَمْ تَرَوَاْ اَنَّ اَ۬للَّهَ سَخَّرَ لَكُم مَّا فِے اِ۬لسَّمَٰوَٰتِ وَمَا فِے اِ۬لَارْضِ وَأَسْبَغَ عَلَيْكُمْ نِعَمَهُۥ ظَٰهِرَةٗ وَبَاطِنَةٗۖ وَمِنَ اَ۬لنَّاسِ مَنْ يُّجَٰدِلُ فِے اِ۬للَّهِ بِغَيْرِ عِلْمٖ وَلَا هُدىٗ وَلَا كِتَٰبٖ مُّنِيرٖۖ","وَإِذَا قِيلَ لَهُمُ اُ۪تَّبِعُواْ مَآ أَنزَلَ اَ۬للَّهُ قَالُواْ بَلْ نَتَّبِعُ مَا وَجَدْنَا عَلَيْهِ ءَابَآءَنَآۖ أَوَلَوْ كَانَ اَ۬لشَّيْطَٰنُ يَدْعُوهُمُۥٓ إِلَىٰ عَذَابِ اِ۬لسَّعِيرِۖ","۞ وَمَنْ يُّسْلِمْ وَجْهَهُۥٓ إِلَى اَ۬للَّهِ وَهُوَ مُحْسِنٞ فَقَدِ اِ۪سْتَمْسَكَ بِالْعُرْوَةِ اِ۬لْوُثْق۪ىٰۖ وَإِلَى اَ۬للَّهِ عَٰقِبَةُ اُ۬لُامُورِۖ","وَمَن كَفَرَ فَلَا يُحْزِنكَ كُفْرُهُۥٓۖ إِلَيْنَا مَرْجِعُهُمْ فَنُنَبِّئُهُم بِمَا عَمِلُوٓاْۖ إِنَّ اَ۬للَّهَ عَلِيمُۢ بِذَاتِ اِ۬لصُّدُورِۖ","نُمَتِّعُهُمْ قَلِيلاٗ ثُمَّ نَضْطَرُّهُمُۥٓ إِلَىٰ عَذَابٍ غَلِيظٖۖ","وَلَئِن سَأَلْتَهُم مَّنْ خَلَقَ اَ۬لسَّمَٰوَٰتِ وَالَارْضَ لَيَقُولُنَّ اَ۬للَّهُۖ قُلِ اِ۬لْحَمْدُ لِلهِۖ بَلَ اَكْثَرُهُمْ لَا يَعْلَمُونَۖ","لِلهِ مَا فِے اِ۬لسَّمَٰوَٰتِ وَالَارْضِۖ إِنَّ اَ۬للَّهَ هُوَ اَ۬لْغَنِيُّ اُ۬لْحَمِيدُۖ","وَلَوَ اَنَّمَا فِے اِ۬لَارْضِ مِن شَجَرَةٍ اَقْلَٰمٞ وَالْبَحْرُ يَمُدُّهُۥ مِنۢ بَعْدِهِۦ سَبْعَةُ أَبْحُرٖ مَّا نَفِدَتْ كَلِمَٰتُ اُ۬للَّهِۖ إِنَّ اَ۬للَّهَ عَزِيزٌ حَكِيمٞۖ","مَّا خَلْقُكُمْ وَلَا بَعْثُكُمُۥٓ إِلَّا كَنَفْسٖ وَٰحِدَةٍۖ اِنَّ اَ۬للَّهَ سَمِيعُۢ بَصِيرٌۖ","اَلَمْ تَرَ أَنَّ اَ۬للَّهَ يُولِجُ اُ۬ليْلَ فِے اِ۬لنَّه۪ارِ وَيُولِجُ اُ۬لنَّهَارَ فِے اِ۬ليْلِ وَسَخَّرَ اَ۬لشَّمْسَ وَالْقَمَرَ كُلّٞ يَجْرِےٓ إِلَىٰٓ أَجَلٖ مُّسَمّىٗ وَأَنَّ اَ۬للَّهَ بِمَا تَعْمَلُونَ خَبِيرٞۖ","ذَٰلِكَ بِأَنَّ اَ۬للَّهَ هُوَ اَ۬لْحَقُّ وَأَنَّ مَا تَدْعُونَ مِن دُونِهِ اِ۬لْبَٰطِلُ وَأَنَّ اَ۬للَّهَ هُوَ اَ۬لْعَلِيُّ اُ۬لْكَبِيرُۖ","أَلَمْ تَرَ أَنَّ اَ۬لْفُلْكَ تَجْرِے فِے اِ۬لْبَحْرِ بِنِعْمَتِ اِ۬للَّهِ لِيُرِيَكُم مِّنَ اٰيَٰتِهِۦٓۖ إِنَّ فِے ذَٰلِكَ لَأٓيَٰتٖ لِّكُلِّ صَبّ۪ارٖ شَكُورٖۖ","وَإِذَا غَشِيَهُم مَّوْجٞ كَالظُّلَلِ دَعَوُاْ اُ۬للَّهَ مُخْلِصِينَ لَهُ اُ۬لدِّينَۖ فَلَمَّا نَجّ۪يٰهُمُۥٓ إِلَى اَ۬لْبَرِّ فَمِنْهُم مُّقْتَصِدٞۖ وَمَا يَجْحَدُ بِـَٔايَٰتِنَآ إِلَّا كُلُّ خَتّ۪ارٖ كَفُورٖۖ","۞ يَٰٓأَيُّهَا اَ۬لنَّاسُ اُ۪تَّقُواْ رَبَّكُمْ وَاخْشَوْاْ يَوْماٗ لَّا يَجْزِے وَالِدٌ عَنْ وَّلَدِهِۦ وَلَا مَوْلُودٌ هُوَ جَازٍ عَنْ وَّالِدِهِۦ شَئْاًۖ اِنَّ وَعْدَ اَ۬للَّهِ حَقّٞۖ فَلَا تَغُرَّنَّكُمُ اُ۬لْحَيَوٰةُ اُ۬لدُّنْي۪اۖ وَلَا يَغُرَّنَّكُم بِاللَّهِ اِ۬لْغَرُورُۖ","إِنَّ اَ۬للَّهَ عِندَهُۥ عِلْمُ اُ۬لسَّاعَةِۖ وَيُنَزِّلُ اُ۬لْغَيْثَۖ وَيَعْلَمُ مَا فِے اِ۬لَارْحَامِۖ وَمَا تَدْرِے نَفْسٞ مَّاذَا تَكْسِبُ غَداٗۖ وَمَا تَدْرِے نَفْسُۢ بِأَيِّ أَرْضٖ تَمُوتُۖ إِنَّ اَ۬للَّهَ عَلِيمٌ خَبِيرٌۖ"]],["السجدة",["اَلَٓمِّٓۖ تَنزِيلُ اُ۬لْكِتَٰبِ لَا رَيْبَ فِيهِ مِن رَّبِّ اِ۬لْعَٰلَمِينَۖ","أَمْ يَقُولُونَ اَ۪فْتَر۪يٰهُۖ بَلْ هُوَ اَ۬لْحَقُّ مِن رَّبِّكَ لِتُنذِرَ قَوْماٗ مَّآ أَت۪يٰهُم مِّن نَّذِيرٖ مِّن قَبْلِكَ لَعَلَّهُمْ يَهْتَدُونَۖ","اَ۬للَّهُ اُ۬لذِے خَلَقَ اَ۬لسَّمَٰوَٰتِ وَالَارْضَ وَمَا بَيْنَهُمَا فِے سِتَّةِ أَيَّامٖ ثُمَّ اَ۪سْتَو۪ىٰ عَلَى اَ۬لْعَرْشِۖ مَا لَكُم مِّن دُونِهِۦ مِنْ وَّلِيّٖ وَلَا شَفِيعٍۖ اَفَلَا تَتَذَكَّرُونَۖ","يُدَبِّرُ اُ۬لَامْرَ مِنَ اَ۬لسَّمَآءِ الَى اَ۬لَارْضِ ثُمَّ يَعْرُجُ إِلَيْهِ فِے يَوْمٖ كَانَ مِقْدَارُهُۥٓ أَلْفَ سَنَةٖ مِّمَّا تَعُدُّونَۖ","ذَٰلِكَ عَٰلِمُ اُ۬لْغَيْبِ وَالشَّهَٰدَةِ اِ۬لْعَزِيزُ اُ۬لرَّحِيمُۖ","اُ۬لذِےٓ أَحْسَنَ كُلَّ شَےْءٍ خَلَقَهُۥ وَبَدَأَ خَلْقَ اَ۬لِانسَٰنِ مِن طِينٖۖ","ثُمَّ جَعَلَ نَسْلَهُۥ مِن سُلَٰلَةٖ مِّن مَّآءٖ مَّهِينٖۖ","ثُمَّ سَوّ۪يٰهُ وَنَفَخَ فِيهِ مِن رُّوحِهِۦۖ وَجَعَلَ لَكُمُ اُ۬لسَّمْعَ وَالَابْصَٰرَ وَالَافْـِٕدَةَۖ قَلِيلاٗ مَّا تَشْكُرُونَۖ","وَقَالُوٓاْ أَ۟ذَا ضَلَلْنَا فِے اِ۬لَارْضِ إِنَّا لَفِے خَلْقٖ جَدِيدِۢۖ","بَلْ هُم بِلِقَآءِ رَبِّهِمْ كَٰفِرُونَۖ","۞ قُلْ يَتَوَفّ۪يٰكُم مَّلَكُ اُ۬لْمَوْتِ اِ۬لذِے وُكِّلَ بِكُمْ ثُمَّ إِلَىٰ رَبِّكُمْ تُرْجَعُونَۖ","وَلَوْ تَر۪ىٰٓ إِذِ اِ۬لْمُجْرِمُونَ نَاكِسُواْ رُءُوسِهِمْ عِندَ رَبِّهِمْ رَبَّنَآ أَبْصَرْنَا وَسَمِعْنَا فَارْجِعْنَا نَعْمَلْ صَٰلِحاً اِنَّا مُوقِنُونَۖ","وَلَوْ شِئْنَا لَأٓتَيْنَا كُلَّ نَفْسٍ هُد۪يٰهَاۖ وَلَٰكِنْ حَقَّ اَ۬لْقَوْلُ مِنِّے لَأَمْلَأَنَّ جَهَنَّمَ مِنَ اَ۬لْجِنَّةِ وَالنَّاسِ أَجْمَعِينَۖ","فَذُوقُواْ بِمَا نَسِيتُمْ لِقَآءَ يَوْمِكُمْ هَٰذَآ إِنَّا نَسِينَٰكُمْۖ وَذُوقُواْ عَذَابَ اَ۬لْخُلْدِ بِمَا كُنتُمْ تَعْمَلُونَۖ","إِنَّمَا يُومِنُ بِـَٔايَٰتِنَا اَ۬لذِينَ إِذَا ذُكِّرُواْ بِهَا خَرُّواْ سُجَّداٗ وَسَبَّحُواْ بِحَمْدِ رَبِّهِمْ وَهُمْ لَا يَسْتَكْبِرُونَۖ۩","تَتَجَاف۪ىٰ جُنُوبُهُمْ عَنِ اِ۬لْمَضَاجِعِ يَدْعُونَ رَبَّهُمْ خَوْفاٗ وَطَمَعاٗ وَمِمَّا رَزَقْنَٰهُمْ يُنفِقُونَۖ","فَلَا تَعْلَمُ نَفْسٞ مَّآ أُخْفِيَ لَهُم مِّن قُرَّةِ أَعْيُنٖ جَزَآءَۢ بِمَا كَانُواْ يَعْمَلُونَۖ","أَفَمَن كَانَ مُومِناٗ كَمَن كَانَ فَاسِقاٗۖ لَّا يَسْتَوُۥنَۖ","أَمَّا اَ۬لذِينَ ءَامَنُواْ وَعَمِلُواْ اُ۬لصَّٰلِحَٰتِ فَلَهُمْ جَنَّٰتُ اُ۬لْمَأْو۪ىٰ نُزُلاَۢ بِمَا كَانُواْ يَعْمَلُونَۖ","وَأَمَّا اَ۬لذِينَ فَسَقُواْ فَمَأْو۪يٰهُمُ اُ۬لنَّارُۖ كُلَّمَآ أَرَادُوٓاْ أَنْ يَّخْرُجُواْ مِنْهَآ أُعِيدُواْ فِيهَا وَقِيلَ لَهُمْ ذُوقُواْ عَذَابَ اَ۬لنّ۪ارِ اِ۬لذِے كُنتُم بِهِۦ تُكَذِّبُونَۖ","۞ وَلَنُذِيقَنَّهُم مِّنَ اَ۬لْعَذَابِ اِ۬لَادْن۪ىٰ دُونَ اَ۬لْعَذَابِ اِ۬لَاكْبَرِ لَعَلَّهُمْ يَرْجِعُونَۖ","وَمَنَ اَظْلَمُ مِمَّن ذُكِّرَ بِـَٔايَٰتِ رَبِّهِۦ ثُمَّ أَعْرَضَ عَنْهَآۖ إِنَّا مِنَ اَ۬لْمُجْرِمِينَ مُنتَقِمُونَۖ","وَلَقَدَ اٰتَيْنَا مُوسَى اَ۬لْكِتَٰبَۖ فَلَا تَكُن فِے مِرْيَةٖ مِّن لِّقَآئِهِۦۖ وَجَعَلْنَٰهُ هُدىٗ لِّبَنِےٓ إِسْرَآءِيلَۖ","وَجَعَلْنَا مِنْهُمُۥٓ أَئِمَّةٗ يَهْدُونَ بِأَمْرِنَا لَمَّا صَبَرُواْۖ وَكَانُواْ بِـَٔايَٰتِنَا يُوقِنُونَۖ","إِنَّ رَبَّكَ هُوَ يَفْصِلُ بَيْنَهُمْ يَوْمَ اَ۬لْقِيَٰمَةِ فِيمَا كَانُواْ فِيهِ يَخْتَلِفُونَۖ","أَوَلَمْ يَهْدِ لَهُمْ كَمَ اَهْلَكْنَا مِن قَبْلِهِم مِّنَ اَ۬لْقُرُونِ يَمْشُونَ فِے مَسَٰكِنِهِمُۥٓۖ إِنَّ فِے ذَٰلِكَ لَأٓيَٰتٍۖ اَفَلَا يَسْمَعُونَۖ","أَوَلَمْ يَرَوَاْ اَنَّا نَسُوقُ اُ۬لْمَآءَ ا۪لَى اَ۬لَارْضِ اِ۬لْجُرُزِ فَنُخْرِجُ بِهِۦ زَرْعاٗ تَاكُلُ مِنْهُ أَنْعَٰمُهُمْ وَأَنفُسُهُمُۥٓۖ أَفَلَا يُبْصِرُونَۖ","وَيَقُولُونَ مَت۪ىٰ هَٰذَا اَ۬لْفَتْحُ إِن كُنتُمْ صَٰدِقِينَۖ","قُلْ يَوْمَ اَ۬لْفَتْحِ لَا يَنفَعُ اُ۬لذِينَ كَفَرُوٓاْ إِيمَٰنُهُمْ وَلَا هُمْ يُنظَرُونَۖ","فَأَعْرِضْ عَنْهُمْ وَانتَظِرِۖ اِنَّهُم مُّنتَظِرُونَۖ"]],["الأحزاب",["يَٰٓأَيُّهَا‏ اَ۬لنَّبِےٓءُ اُ۪تَّقِ اِ۬للَّهَۖ وَلَا تُطِعِ اِ۬لْكٰ۪فِرِينَ وَالْمُنَٰفِقِينَۖ إِنَّ اَ۬للَّهَ كَانَ عَلِيماً حَكِيماٗۖ","وَاتَّبِعْ مَا يُوح۪ىٰٓ إِلَيْكَ مِن رَّبِّكَۖ إِنَّ اَ۬للَّهَ كَانَ بِمَا تَعْمَلُونَ خَبِيراٗۖ","وَتَوَكَّلْ عَلَى اَ۬للَّهِۖ وَكَف۪ىٰ بِاللَّهِ وَكِيلاٗۖ","مَّا جَعَلَ اَ۬للَّهُ لِرَجُلٖ مِّن قَلْبَيْنِ فِے جَوْفِهِۦۖ وَمَا جَعَلَ أَزْوَٰجَكُمُ اُ۬ل۪ےْ تَظَّهَّرُونَ مِنْهُنَّ أُمَّهَٰتِكُمْۖ وَمَا جَعَلَ أَدْعِيَآءَكُمُۥٓ أَبْنَآءَكُمْۖ ذَٰلِكُمْ قَوْلُكُم بِأَفْوَٰهِكُمْۖ وَاللَّهُ يَقُولُ اُ۬لْحَقَّۖ وَهُوَ يَهْدِے اِ۬لسَّبِيلَۖ","اَ۟دْعُوهُمْ لِأٓبَآئِهِمْ هُوَ أَقْسَطُ عِندَ اَ۬للَّهِۖ فَإِن لَّمْ تَعْلَمُوٓاْ ءَابَآءَهُمْ فَإِخْوَٰنُكُمْ فِے اِ۬لدِّينِ وَمَوَٰلِيكُمْۖ وَلَيْسَ عَلَيْكُمْ جُنَاحٞ فِيمَآ أَخْطَأْتُم بِهِۦۖ وَلَٰكِن مَّا تَعَمَّدَتْ قُلُوبُكُمْۖ وَكَانَ اَ۬للَّهُ غَفُوراٗ رَّحِيماًۖ","اِ۬لنَّبِےٓءُ اَ۬وْل۪ىٰ بِالْمُومِنِينَ مِنَ اَنفُسِهِمْۖ وَأَزْوَٰجُهُۥٓ أُمَّهَٰتُهُمْۖ وَأُوْلُواْ اُ۬لَارْحَامِ بَعْضُهُمُۥٓ أَوْل۪ىٰ بِبَعْضٖ فِے كِتَٰبِ اِ۬للَّهِ مِنَ اَ۬لْمُومِنِينَ وَالْمُهَٰجِرِينَ إِلَّآ أَن تَفْعَلُوٓاْ إِلَىٰٓ أَوْلِيَآئِكُم مَّعْرُوفاٗۖ كَانَ ذَٰلِكَ فِے اِ۬لْكِتَٰبِ مَسْطُوراٗۖ","وَإِذَ اَخَذْنَا مِنَ اَ۬لنَّبِيٓـِٕۧنَ مِيثَٰقَهُمْ وَمِنكَ وَمِن نُّوحٖ وَإِبْرَٰهِيمَ وَمُوس۪ىٰ وَعِيسَى اَ۪بْنِ مَرْيَمَۖ وَأَخَذْنَا مِنْهُم مِّيثَٰقاً غَلِيظاٗ","لِّيَسْـَٔلَ اَ۬لصَّٰدِقِينَ عَن صِدْقِهِمْۖ وَأَعَدَّ لِلْكٰ۪فِرِينَ عَذَاباً اَلِيماٗۖ","۞ يَٰٓأَيُّهَا اَ۬لذِينَ ءَامَنُواْ اُ۟ذْكُرُواْ نِعْمَةَ اَ۬للَّهِ عَلَيْكُمُۥٓ إِذْ جَآءَتْكُمْ جُنُودٞ فَأَرْسَلْنَا عَلَيْهِمْ رِيحاٗ وَجُنُوداٗ لَّمْ تَرَوْهَاۖ وَكَانَ اَ۬للَّهُ بِمَا تَعْمَلُونَ بَصِيراًۖ","اِذْ جَآءُوكُم مِّن فَوْقِكُمْ وَمِنَ اَسْفَلَ مِنكُمْۖ وَإِذْ زَاغَتِ اِ۬لَابْصَٰرُ وَبَلَغَتِ اِ۬لْقُلُوبُ اُ۬لْحَنَاجِرَ وَتَظُنُّونَ بِاللَّهِ اِ۬لظُّنُونَاۖ","هُنَالِكَ اَ۟بْتُلِيَ اَ۬لْمُومِنُونَ وَزُلْزِلُواْ زِلْزَالاٗ شَدِيداٗۖ","وَإِذْ يَقُولُ اُ۬لْمُنَٰفِقُونَ وَالذِينَ فِے قُلُوبِهِم مَّرَضٞ مَّا وَعَدَنَا اَ۬للَّهُ وَرَسُولُهُۥٓ إِلَّا غُرُوراٗۖ","وَإِذْ قَالَت طَّآئِفَةٞ مِّنْهُمْ يَٰٓأَهْلَ يَثْرِبَ لَا مَقَامَ لَكُمْ فَارْجِعُواْۖ وَيَسْتَٰذِنُ فَرِيقٞ مِّنْهُمُ اُ۬لنَّبِےٓءَ يَقُولُونَ إِنَّ بُيُوتَنَا عَوْرَةٞ وَمَا هِيَ بِعَوْرَةٍۖ اِنْ يُّرِيدُونَ إِلَّا فِرَاراٗۖ","وَلَوْ دُخِلَتْ عَلَيْهِم مِّنَ اَقْط۪ارِهَا ثُمَّ سُئِلُواْ اُ۬لْفِتْنَةَ لَأَتَوْهَا وَمَا تَلَبَّثُواْ بِهَآ إِلَّا يَسِيراٗۖ","وَلَقَدْ كَانُواْ عَٰهَدُواْ اُ۬للَّهَ مِن قَبْلُ لَا يُوَلُّونَ اَ۬لَادْبَٰرَۖ وَكَانَ عَهْدُ اُ۬للَّهِ مَسْـُٔولاٗۖ","قُل لَّنْ يَّنفَعَكُمُ اُ۬لْفِرَارُ إِن فَرَرْتُم مِّنَ اَ۬لْمَوْتِ أَوِ اِ۬لْقَتْلِۖ وَإِذاٗ لَّا تُمَتَّعُونَ إِلَّا قَلِيلاٗۖ","قُلْ مَن ذَا اَ۬لذِے يَعْصِمُكُم مِّنَ اَ۬للَّهِ إِنَ اَرَادَ بِكُمْ سُوٓءاً اَوَ اَرَادَ بِكُمْ رَحْمَةٗۖ وَلَا يَجِدُونَ لَهُم مِّن دُونِ اِ۬للَّهِ وَلِيّاٗ وَلَا نَصِيراٗۖ","۞ قَدْ يَعْلَمُ اُ۬للَّهُ اُ۬لْمُعَوِّقِينَ مِنكُمْ وَالْقَآئِلِينَ لِإِخْوَٰنِهِمْ هَلُمَّ إِلَيْنَا وَلَا يَاتُونَ اَ۬لْبَأْسَ إِلَّا قَلِيلاً","اَشِحَّةً عَلَيْكُمْۖ فَإِذَا جَآءَ اَ۬لْخَوْفُ رَأَيْتَهُمْ يَنظُرُونَ إِلَيْكَ تَدُورُ أَعْيُنُهُمْ كَالذِے يُغْش۪ىٰ عَلَيْهِ مِنَ اَ۬لْمَوْتِۖ فَإِذَا ذَهَبَ اَ۬لْخَوْفُ سَلَقُوكُم بِأَلْسِنَةٍ حِدَادٍ اَشِحَّةً عَلَى اَ۬لْخَيْرِۖ أُوْلَٰٓئِكَ لَمْ يُومِنُواْ فَأَحْبَطَ اَ۬للَّهُ أَعْمَٰلَهُمْۖ وَكَانَ ذَٰلِكَ عَلَى اَ۬للَّهِ يَسِيراٗۖ","يَحْسِبُونَ اَ۬لَاحْزَابَ لَمْ يَذْهَبُواْۖ وَإِنْ يَّاتِ اِ۬لَاحْزَابُ يَوَدُّواْ لَوَ اَنَّهُم بَادُونَ فِے اِ۬لَاعْرَابِۖ يَسْـَٔلُونَ عَنَ اَنۢبَآئِكُمْ وَلَوْ كَانُواْ فِيكُم مَّا قَٰتَلُوٓاْ إِلَّا قَلِيلاٗۖ","لَّقَدْ كَانَ لَكُمْ فِے رَسُولِ اِ۬للَّهِ إِسْوَةٌ حَسَنَةٞ لِّمَن كَانَ يَرْجُواْ اُ۬للَّهَ وَالْيَوْمَ اَ۬لَاخِرَ وَذَكَرَ اَ۬للَّهَ كَثِيراٗۖ","وَلَمَّا رَءَا اَ۬لْمُومِنُونَ اَ۬لَاحْزَابَ قَالُواْ هَٰذَا مَا وَعَدَنَا اَ۬للَّهُ وَرَسُولُهُۥ وَصَدَقَ اَ۬للَّهُ وَرَسُولُهُۥۖ وَمَا زَادَهُمُۥٓ إِلَّآ إِيمَٰناٗ وَتَسْلِيماٗۖ","مِّنَ اَ۬لْمُومِنِينَ رِجَالٞ صَدَقُواْ مَا عَٰهَدُواْ اُ۬للَّهَ عَلَيْهِۖ فَمِنْهُم مَّن قَض۪ىٰ نَحْبَهُۥ وَمِنْهُم مَّنْ يَّنتَظِرُۖ وَمَا بَدَّلُواْ تَبْدِيلاٗ","لِّيَجْزِيَ اَ۬للَّهُ اُ۬لصَّٰدِقِينَ بِصِدْقِهِمْ وَيُعَذِّبَ اَ۬لْمُنَٰفِقِينَ إِن شَآءَ اوْ يَتُوبَ عَلَيْهِمُۥٓۖ إِنَّ اَ۬للَّهَ كَانَ غَفُوراٗ رَّحِيماٗۖ","۞ وَرَدَّ اَ۬للَّهُ اُ۬لذِينَ كَفَرُواْ بِغَيْظِهِمْ لَمْ يَنَالُواْ خَيْراٗۖ وَكَفَى اَ۬للَّهُ اُ۬لْمُومِنِينَ اَ۬لْقِتَالَۖ وَكَانَ اَ۬للَّهُ قَوِيّاً عَزِيزاٗۖ","وَأَنزَلَ اَ۬لذِينَ ظَٰهَرُوهُم مِّنَ اَهْلِ اِ۬لْكِتَٰبِ مِن صَيَاصِيهِمْ وَقَذَفَ فِے قُلُوبِهِمُ اُ۬لرُّعْبَۖ فَرِيقاٗ تَقْتُلُونَ وَتَاسِرُونَ فَرِيقاٗۖ","وَأَوْرَثَكُمُۥٓ أَرْضَهُمْ وَدِيَٰرَهُمْ وَأَمْوَٰلَهُمْ وَأَرْضاٗ لَّمْ تَطَـُٔوهَاۖ وَكَانَ اَ۬للَّهُ عَلَىٰ كُلِّ شَےْءٖ قَدِيراٗۖ","يَٰٓأَيُّهَا‏ اَ۬لنَّبِےٓءُ قُل لِّأَزْوَٰجِكَ إِن كُنتُنَّ تُرِدْنَ اَ۬لْحَيَوٰةَ اَ۬لدُّنْي۪ا وَزِينَتَهَا فَتَعَالَيْنَ أُمَتِّعْكُنَّ وَأُسَرِّحْكُنَّ سَرَاحاٗ جَمِيلاٗۖ","وَإِن كُنتُنَّ تُرِدْنَ اَ۬للَّهَ وَرَسُولَهُۥ وَالدَّارَ اَ۬لَاخِرَةَ فَإِنَّ اَ۬للَّهَ أَعَدَّ لِلْمُحْسِنَٰتِ مِنكُنَّ أَجْراً عَظِيماٗۖ","يَٰنِسَآءَ اَ۬لنَّبِےٓءِ مَنْ يَّاتِ مِنكُنَّ بِفَٰحِشَةٖ مُّبَيِّنَةٖ يُضَٰعَفْ لَهَا اَ۬لْعَذَابُ ضِعْفَيْنِۖ وَكَانَ ذَٰلِكَ عَلَى اَ۬للَّهِ يَسِيراٗۖ","۞ وَمَنْ يَّقْنُتْ مِنكُنَّ لِلهِ وَرَسُولِهِۦ وَتَعْمَلْ صَٰلِحاٗ نُّوتِهَآ أَجْرَهَا مَرَّتَيْنِ وَأَعْتَدْنَا لَهَا رِزْقاٗ كَرِيماٗۖ","يَٰنِسَآءَ اَ۬لنَّبِےٓءِ لَسْتُنَّ كَأَحَدٖ مِّنَ اَ۬لنِّسَآءِ انِ اِ۪تَّقَيْتُنَّۖ فَلَا تَخْضَعْنَ بِالْقَوْلِ فَيَطْمَعَ اَ۬لذِے فِے قَلْبِهِۦ مَرَضٞ وَقُلْنَ قَوْلاٗ مَّعْرُوفاٗ","وَقَرْنَ فِے بُيُوتِكُنَّۖ وَلَا تَبَرَّجْنَ تَبَرُّجَ اَ۬لْجَٰهِلِيَّةِ اِ۬لُاول۪ىٰۖ وَأَقِمْنَ اَ۬لصَّلَوٰةَ وَءَاتِينَ اَ۬لزَّكَوٰةَۖ وَأَطِعْنَ اَ۬للَّهَ وَرَسُولَهُۥٓۖ إِنَّمَا يُرِيدُ اُ۬للَّهُ لِيُذْهِبَ عَنكُمُ اُ۬لرِّجْسَ أَهْلَ اَ۬لْبَيْتِ وَيُطَهِّرَكُمْ تَطْهِيراٗۖ","وَاذْكُرْنَ مَا يُتْل۪ىٰ فِے بُيُوتِكُنَّ مِنَ اٰيَٰتِ اِ۬للَّهِ وَالْحِكْمَةِۖ إِنَّ اَ۬للَّهَ كَانَ لَطِيفاً خَبِيراًۖ","اِنَّ اَ۬لْمُسْلِمِينَ وَالْمُسْلِمَٰتِ وَالْمُومِنِينَ وَالْمُومِنَٰتِ وَالْقَٰنِتِينَ وَالْقَٰنِتَٰتِ وَالصَّٰدِقِينَ وَالصَّٰدِقَٰتِ وَالصَّٰبِرِينَ وَالصَّٰبِرَٰتِ وَالْخَٰشِعِينَ وَالْخَٰشِعَٰتِ وَالْمُتَصَدِّقِينَ وَالْمُتَصَدِّقَٰتِ وَالصَّٰٓئِمِينَ وَالصَّٰٓئِمَٰتِ وَالْحَٰفِظِينَ فُرُوجَهُمْ وَالْحَٰفِظَٰتِ وَالذَّٰكِرِينَ اَ۬للَّهَ كَثِيراٗ وَالذَّٰكِرَٰتِ أَعَدَّ اَ۬للَّهُ لَهُم مَّغْفِرَةٗ وَأَجْراً عَظِيماٗۖ","وَمَا كَانَ لِمُومِنٖ وَلَا مُومِنَةٍ اِذَا قَضَى اَ۬للَّهُ وَرَسُولُهُۥٓ أَمْراً اَن تَكُونَ لَهُمُ اُ۬لْخِيَرَةُ مِنَ اَمْرِهِمْۖ وَمَنْ يَّعْصِ اِ۬للَّهَ وَرَسُولَهُۥ فَقَد ضَّلَّ ضَلَٰلاٗ مُّبِيناٗۖ","وَإِذْ تَقُولُ لِلذِےٓ أَنْعَمَ اَ۬للَّهُ عَلَيْهِ وَأَنْعَمْتَ عَلَيْهِ أَمْسِكْ عَلَيْكَ زَوْجَكَ وَاتَّقِ اِ۬للَّهَ وَتُخْفِے فِے نَفْسِكَ مَا اَ۬للَّهُ مُبْدِيهِ وَتَخْشَى اَ۬لنَّاسَ وَاَ۬للَّهُ أَحَقُّ أَن تَخْش۪يٰهُۖ ۞ فَلَمَّا قَض۪ىٰ زَيْدٞ مِّنْهَا وَطَراٗ زَوَّجْنَٰكَهَا لِكَےْ لَا يَكُونَ عَلَى اَ۬لْمُومِنِينَ حَرَجٞ فِےٓ أَزْوَٰجِ أَدْعِيَآئِهِمُۥٓ إِذَا قَضَوْاْ مِنْهُنَّ وَطَراٗۖ وَكَانَ أَمْرُ اُ۬للَّهِ مَفْعُولاٗۖ","مَّا كَانَ عَلَى اَ۬لنَّبِےٓءِ مِنْ حَرَجٖ فِيمَا فَرَضَ اَ۬للَّهُ لَهُۥۖ سُنَّةَ اَ۬للَّهِ فِے اِ۬لذِينَ خَلَوْاْ مِن قَبْلُۖ وَكَانَ أَمْرُ اُ۬للَّهِ قَدَراٗ مَّقْدُوراًۖ","اِ۬لذِينَ يُبَلِّغُونَ رِسَٰلَٰتِ اِ۬للَّهِ وَيَخْشَوْنَهُۥ وَلَا يَخْشَوْنَ أَحَداً اِلَّا اَ۬للَّهَۖ وَكَف۪ىٰ بِاللَّهِ حَسِيباٗۖ","مَّا كَانَ مُحَمَّدٌ اَبَآ أَحَدٖ مِّن رِّجَالِكُمْۖ وَلَٰكِن رَّسُولَ اَ۬للَّهِ وَخَاتِمَ اَ۬لنَّبِيٓـِٕۧنَۖ وَكَانَ اَ۬للَّهُ بِكُلِّ شَےْءٍ عَلِيماٗۖ","يَٰٓأَيُّهَا اَ۬لذِينَ ءَامَنُواْ اُ۟ذْكُرُواْ اُ۬للَّهَ ذِكْراٗ كَثِيراٗ","وَسَبِّحُوهُ بُكْرَةٗ وَأَصِيلاًۖ","هُوَ اَ۬لذِے يُصَلِّے عَلَيْكُمْ وَمَلَٰٓئِكَتُهُۥ لِيُخْرِجَكُم مِّنَ اَ۬لظُّلُمَٰتِ إِلَى اَ۬لنُّورِۖ وَكَانَ بِالْمُومِنِينَ رَحِيماٗۖ","تَحِيَّتُهُمْ يَوْمَ يَلْقَوْنَهُۥ سَلَٰمٞۖ وَأَعَدَّ لَهُمُۥٓ أَجْراٗ كَرِيماٗۖ","يَٰٓأَيُّهَا اَ۬لنَّبِےٓءُ اِ۪نَّآ أَرْسَلْنَٰكَ شَٰهِداٗ وَمُبَشِّراٗ وَنَذِيراٗ","وَدَاعِياً اِلَى اَ۬للَّهِ بِإِذْنِهِۦ وَسِرَاجاٗ مُّنِيراٗۖ","وَبَشِّرِ اِ۬لْمُومِنِينَ بِأَنَّ لَهُم مِّنَ اَ۬للَّهِ فَضْلاٗ كَبِيراٗۖ","وَلَا تُطِعِ اِ۬لْكٰ۪فِرِينَ وَالْمُنَٰفِقِينَۖ وَدَعَ اَذ۪يٰهُمْۖ وَتَوَكَّلْ عَلَى اَ۬للَّهِۖ وَكَف۪ىٰ بِاللَّهِ وَكِيلاٗۖ","۞ يَٰٓأَيُّهَا اَ۬لذِينَ ءَامَنُوٓاْ إِذَا نَكَحْتُمُ اُ۬لْمُومِنَٰتِ ثُمَّ طَلَّقْتُمُوهُنَّ مِن قَبْلِ أَن تَمَسُّوهُنَّ فَمَا لَكُمْ عَلَيْهِنَّ مِنْ عِدَّةٖ تَعْتَدُّونَهَاۖ فَمَتِّعُوهُنَّ وَسَرِّحُوهُنَّ سَرَاحاٗ جَمِيلاٗۖ","يَٰٓأَيُّهَا‏ اَ۬لنَّبِےٓءُ اِ۪نَّآ أَحْلَلْنَا لَكَ أَزْوَٰجَكَ اَ۬لتِےٓ ءَاتَيْتَ أُجُورَهُنَّ وَمَا مَلَكَتْ يَمِينُكَ مِمَّآ أَفَآءَ اَ۬للَّهُ عَلَيْكَ وَبَنَاتِ عَمِّكَ وَبَنَاتِ عَمَّٰتِكَ وَبَنَاتِ خَالِكَ وَبَنَاتِ خَٰلَٰتِكَ اَ۬لتِے هَاجَرْنَ مَعَكَ وَامْرَأَةٗ مُّومِنَةً اِنْ وَّهَبَتْ نَفْسَهَا لِلنَّبِےٓءِ انَ اَرَادَ‏ اَ۬لنَّبِےٓءُ اَ۬نْ يَّسْتَنكِحَهَاۖ خَالِصَةٗ لَّكَ مِن دُونِ اِ۬لْمُومِنِينَۖ قَدْ عَلِمْنَا مَا فَرَضْنَا عَلَيْهِمْ فِےٓ أَزْوَٰجِهِمْ وَمَا مَلَكَتَ اَيْمَٰنُهُمْ لِكَيْلَا يَكُونَ عَلَيْكَ حَرَجٞۖ وَكَانَ اَ۬للَّهُ غَفُوراٗ رَّحِيماٗۖ","تُرْجِے مَن تَشَآءُ مِنْهُنَّ وَتُـْٔوِےٓ إِلَيْكَ مَن تَشَآءُۖ وَمَنِ اِ۪بْتَغَيْتَ مِمَّنْ عَزَلْتَ فَلَا جُنَاحَ عَلَيْكَۖ ذَٰلِكَ أَدْن۪ىٰٓ أَن تَقَرَّ أَعْيُنُهُنَّ وَلَا يَحْزَنَّ وَيَرْضَيْنَ بِمَآ ءَاتَيْتَهُنَّ كُلُّهُنَّۖ وَاللَّهُ يَعْلَمُ مَا فِے قُلُوبِكُمْۖ وَكَانَ اَ۬للَّهُ عَلِيماً حَلِيماٗۖ","لَّا يَحِلُّ لَكَ اَ۬لنِّسَآءُ مِنۢ بَعْدُ وَلَآ أَن تَبَدَّلَ بِهِنَّ مِنَ اَزْوَٰجٖ وَلَوَ اَعْجَبَكَ حُسْنُهُنَّ إِلَّا مَا مَلَكَتْ يَمِينُكَۖ وَكَانَ اَ۬للَّهُ عَلَىٰ كُلِّ شَےْءٖ رَّقِيباٗۖ","۞ يَٰٓأَيُّهَا اَ۬لذِينَ ءَامَنُواْ لَا تَدْخُلُواْ بُيُوتَ اَ۬لنَّبِےٓءِ الَّآ أَنْ يُّوذَنَ لَكُمُۥٓ إِلَىٰ طَعَامٍ غَيْرَ نَٰظِرِينَ إِن۪يٰهُۖ وَلَٰكِنِ اِذَا دُعِيتُمْ فَادْخُلُواْ فَإِذَا طَعِمْتُمْ فَانتَشِرُواْ وَلَا مُسْتَٰنِسِينَ لِحَدِيثٍۖ اِنَّ ذَٰلِكُمْ كَانَ يُوذِے اِ۬لنَّبِےٓءَ فَيَسْتَحْيِۦ مِنكُمْۖ وَاللَّهُ لَا يَسْتَحْيِۦ مِنَ اَ۬لْحَقِّۖ وَإِذَا سَأَلْتُمُوهُنَّ مَتَٰعاٗ فَسْـَٔلُوهُنَّ مِنْ وَّرَآءِ حِجَابٖۖ ذَٰلِكُمُۥٓ أَطْهَرُ لِقُلُوبِكُمْ وَقُلُوبِهِنَّۖ وَمَا كَانَ لَكُمُۥٓ أَن تُوذُواْ رَسُولَ اَ۬للَّهِ وَلَآ أَن تَنكِحُوٓاْ أَزْوَٰجَهُۥ مِنۢ بَعْدِهِۦٓ أَبَداًۖ اِنَّ ذَٰلِكُمْ كَانَ عِندَ اَ۬للَّهِ عَظِيماًۖ","اِن تُبْدُواْ شَئْاً اَوْ تُخْفُوهُ فَإِنَّ اَ۬للَّهَ كَانَ بِكُلِّ شَےْءٍ عَلِيماٗۖ","لَّا جُنَاحَ عَلَيْهِنَّ فِےٓ ءَابَآئِهِنَّ وَلَآ أَبْنَآئِهِنَّ وَلَآ إِخْوَٰنِهِنَّ وَلَآ أَبْنَآءِ اخْوَٰنِهِنَّ وَلَآ أَبْنَآءِ اَ۬خَوَٰتِهِنَّ وَلَا نِسَآئِهِنَّ وَلَا مَا مَلَكَتَ اَيْمَٰنُهُنَّۖ وَاتَّقِينَ اَ۬للَّهَۖ إِنَّ اَ۬للَّهَ كَانَ عَلَىٰ كُلِّ شَےْءٖ شَهِيداًۖ","اِنَّ اَ۬للَّهَ وَمَلَٰٓئِكَتَهُۥ يُصَلُّونَ عَلَى اَ۬لنَّبِےٓءِۖ يَٰٓأَيُّهَا اَ۬لذِينَ ءَامَنُواْ صَلُّواْ عَلَيْهِ وَسَلِّمُواْ تَسْلِيماًۖ","اِنَّ اَ۬لذِينَ يُوذُونَ اَ۬للَّهَ وَرَسُولَهُۥ لَعَنَهُمُ اُ۬للَّهُ فِے اِ۬لدُّنْي۪ا وَالَاخِرَةِ وَأَعَدَّ لَهُمْ عَذَاباٗ مُّهِيناٗۖ","وَالذِينَ يُوذُونَ اَ۬لْمُومِنِينَ وَالْمُومِنَٰتِ بِغَيْرِ مَا اَ۪كْتَسَبُواْ فَقَدِ اِ۪حْتَمَلُواْ بُهْتَٰناٗ وَإِثْماٗ مُّبِيناٗۖ","يَٰٓأَيُّهَا‏ اَ۬لنَّبِےٓءُ قُل لِّأَزْوَٰجِكَ وَبَنَاتِكَ وَنِسَآءِ اِ۬لْمُومِنِينَ يُدْنِينَ عَلَيْهِنَّ مِن جَلَٰبِيبِهِنَّۖ ذَٰلِكَ أَدْن۪ىٰٓ أَنْ يُّعْرَفْنَ فَلَا يُوذَيْنَۖ وَكَانَ اَ۬للَّهُ غَفُوراٗ رَّحِيماٗۖ","۞ لَّئِن لَّمْ يَنتَهِ اِ۬لْمُنَٰفِقُونَ وَالذِينَ فِے قُلُوبِهِم مَّرَضٞ وَالْمُرْجِفُونَ فِے اِ۬لْمَدِينَةِ لَنُغْرِيَنَّكَ بِهِمْ ثُمَّ لَا يُجَاوِرُونَكَ فِيهَآ إِلَّا قَلِيلاٗ","مَّلْعُونِينَۖ أَيْنَمَا ثُقِفُوٓاْ أُخِذُواْ وَقُتِّلُواْ تَقْتِيلاٗۖ","سُنَّةَ اَ۬للَّهِ فِے اِ۬لذِينَ خَلَوْاْ مِن قَبْلُۖ وَلَن تَجِدَ لِسُنَّةِ اِ۬للَّهِ تَبْدِيلاٗۖ","يَسْـَٔلُكَ اَ۬لنَّاسُ عَنِ اِ۬لسَّاعَةِۖ قُلِ اِنَّمَا عِلْمُهَا عِندَ اَ۬للَّهِۖ وَمَا يُدْرِيكَۖ لَعَلَّ اَ۬لسَّاعَةَ تَكُونُ قَرِيباًۖ","اِنَّ اَ۬للَّهَ لَعَنَ اَ۬لْكٰ۪فِرِينَ وَأَعَدَّ لَهُمْ سَعِيراً","خَٰلِدِينَ فِيهَآ أَبَداٗ لَّا يَجِدُونَ وَلِيّاٗ وَلَا نَصِيراٗۖ","يَوْمَ تُقَلَّبُ وُجُوهُهُمْ فِے اِ۬لنّ۪ارِ يَقُولُونَ يَٰلَيْتَنَآ أَطَعْنَا اَ۬للَّهَ وَأَطَعْنَا اَ۬لرَّسُولَاۖ","وَقَالُواْ رَبَّنَآ إِنَّآ أَطَعْنَا سَادَتَنَا وَكُبَرَآءَنَا فَأَضَلُّونَا اَ۬لسَّبِيلَاۖ","رَبَّنَآ ءَاتِهِمْ ضِعْفَيْنِ مِنَ اَ۬لْعَذَابِ وَالْعَنْهُمْ لَعْناٗ كَثِيراٗۖ","يَٰٓأَيُّهَا اَ۬لذِينَ ءَامَنُواْ لَا تَكُونُواْ كَالذِينَ ءَاذَوْاْ مُوس۪ىٰ فَبَرَّأَهُ اُ۬للَّهُ مِمَّا قَالُواْۖ وَكَانَ عِندَ اَ۬للَّهِ وَجِيهاٗۖ","يَٰٓأَيُّهَا اَ۬لذِينَ ءَامَنُواْ اُ۪تَّقُواْ اُ۬للَّهَ وَقُولُواْ قَوْلاٗ سَدِيداٗ","يُصْلِحْ لَكُمُۥٓ أَعْمَٰلَكُمْ وَيَغْفِرْ لَكُمْ ذُنُوبَكُمْۖ وَمَنْ يُّطِعِ اِ۬للَّهَ وَرَسُولَهُۥ فَقَدْ فَازَ فَوْزاً عَظِيماًۖ","اِنَّا عَرَضْنَا اَ۬لَامَانَةَ عَلَى اَ۬لسَّمَٰوَٰتِ وَالَارْضِ وَالْجِبَالِ فَأَبَيْنَ أَنْ يَّحْمِلْنَهَا وأَشْفَقْنَ مِنْهَاۖ وَحَمَلَهَا اَ۬لِانسَٰنُ إِنَّهُۥ كَانَ ظَلُوماٗ جَهُولاٗ","لِّيُعَذِّبَ اَ۬للَّهُ اُ۬لْمُنَٰفِقِينَ وَالْمُنَٰفِقَٰتِ وَالْمُشْرِكِينَ وَالْمُشْرِكَٰتِ وَيَتُوبَ اَ۬للَّهُ عَلَى اَ۬لْمُومِنِينَ وَالْمُومِنَٰتِۖ وَكَانَ اَ۬للَّهُ غَفُوراٗ رَّحِيماًۖ"]],["سبأ",["اِ۬لْحَمْدُ لِلهِ اِ۬لذِے لَهُۥ مَا فِے اِ۬لسَّمَٰوَٰتِ وَمَا فِے اِ۬لَارْضِۖ وَلَهُ اُ۬لْحَمْدُ فِے اِ۬لَاخِرَةِۖ وَهُوَ اَ۬لْحَكِيمُ اُ۬لْخَبِيرُۖ","يَعْلَمُ مَا يَلِجُ فِے اِ۬لَارْضِ وَمَا يَخْرُجُ مِنْهَا وَمَا يَنزِلُ مِنَ اَ۬لسَّمَآءِ وَمَا يَعْرُجُ فِيهَاۖ وَهُوَ اَ۬لرَّحِيمُ اُ۬لْغَفُورُۖ","وَقَالَ اَ۬لذِينَ كَفَرُواْ لَا تَاتِينَا اَ۬لسَّاعَةُۖ قُلْ بَل۪ىٰ وَرَبِّے لَتَاتِيَنَّكُمْۖ عَٰلِمُ اُ۬لْغَيْبِ لَا يَعْزُبُ عَنْهُ مِثْقَالُ ذَرَّةٖ فِے اِ۬لسَّمَٰوَٰتِ وَلَا فِے اِ۬لَارْضِۖ وَلَآ أَصْغَرُ مِن ذَٰلِكَ وَلَآ أَكْبَرُ إِلَّا فِے كِتَٰبٖ مُّبِينٖ","لِّيَجْزِيَ اَ۬لذِينَ ءَامَنُواْ وَعَمِلُواْ اُ۬لصَّٰلِحَٰتِۖ أُوْلَٰٓئِكَ لَهُم مَّغْفِرَةٞ وَرِزْقٞ كَرِيمٞۖ","وَالذِينَ سَعَوْ فِےٓ ءَايَٰتِنَا مُعَٰجِزِينَ أُوْلَٰٓئِكَ لَهُمْ عَذَابٞ مِّن رِّجْزٍ اَلِيمٖۖ","وَيَرَى اَ۬لذِينَ أُوتُواْ اُ۬لْعِلْمَ اَ۬لذِےٓ أُنزِلَ إِلَيْكَ مِن رَّبِّكَ هُوَ اَ۬لْحَقَّ وَيَهْدِےٓ إِلَىٰ صِرَٰطِ اِ۬لْعَزِيزِ اِ۬لْحَمِيدِۖ","وَقَالَ اَ۬لذِينَ كَفَرُواْ هَلْ نَدُلُّكُمْ عَلَىٰ رَجُلٖ يُنَبِّئُكُمُۥٓ إِذَا مُزِّقْتُمْ كُلَّ مُمَزَّقٍ اِنَّكُمْ لَفِے خَلْقٖ جَدِيدٍۖ","اَفْتَر۪ىٰ عَلَى اَ۬للَّهِ كَذِباً اَم بِهِۦ جِنَّةُۢۖ بَلِ اِ۬لذِينَ لَا يُومِنُونَ بِالَاخِرَةِ فِے اِ۬لْعَذَابِ وَالضَّلَٰلِ اِ۬لْبَعِيدِۖ","أَفَلَمْ يَرَوِاْ اِلَىٰ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُم مِّنَ اَ۬لسَّمَآءِ وَالَارْضِۖ إِن نَّشَأْ نَخْسِفْ بِهِمُ اُ۬لَارْضَ أَوْ نُسْقِطْ عَلَيْهِمْ كِسْفاٗ مِّنَ اَ۬لسَّمَآءِۖ انَّ فِے ذَٰلِكَ لَأٓيَةٗ لِّكُلِّ عَبْدٖ مُّنِيبٖۖ","۞ وَلَقَدَ اٰتَيْنَا دَاوُۥدَ مِنَّا فَضْلاٗ يَٰجِبَالُ أَوِّبِے مَعَهُۥ وَالطَّيْرَۖ وَأَلَنَّا لَهُ اُ۬لْحَدِيدَ","أَنِ اِ۪عْمَلْ سَٰبِغَٰتٖ وَقَدِّرْ فِے اِ۬لسَّرْدِۖ وَاعْمَلُواْ صَٰلِحاًۖ اِنِّے بِمَا تَعْمَلُونَ بَصِيرٞۖ","وَلِسُلَيْمَٰنَ اَ۬لرِّيحَ غُدُوُّهَا شَهْرٞ وَرَوَاحُهَا شَهْرٞۖ وَأَسَلْنَا لَهُۥ عَيْنَ اَ۬لْقِطْرِۖ وَمِنَ اَ۬لْجِنِّ مَنْ يَّعْمَلُ بَيْنَ يَدَيْهِ بِإِذْنِ رَبِّهِۦۖ وَمَنْ يَّزِغْ مِنْهُمْ عَنَ اَمْرِنَا نُذِقْهُ مِنْ عَذَابِ اِ۬لسَّعِيرِۖ","يَعْمَلُونَ لَهُۥ مَا يَشَآءُ مِن مَّحَٰرِيبَ وَتَمَٰثِيلَ وَجِفَانٖ كَالْجَوَابِۦ وَقُدُورٖ رَّاسِيَٰتٍۖ اِ۪عْمَلُوٓاْ ءَالَ دَاوُۥدَۖ شُكْراٗۖ وَقَلِيلٞ مِّنْ عِبَادِيَ اَ۬لشَّكُورُۖ","فَلَمَّا قَضَيْنَا عَلَيْهِ اِ۬لْمَوْتَ مَا دَلَّهُمْ عَلَىٰ مَوْتِهِۦٓ إِلَّا دَآبَّةُ اُ۬لَارْضِ تَاكُلُ مِنسَاتَهُۥۖ فَلَمَّا خَرَّ تَبَيَّنَتِ اِ۬لْجِنُّ أَن لَّوْ كَانُواْ يَعْلَمُونَ اَ۬لْغَيْبَ مَا لَبِثُواْ فِے اِ۬لْعَذَابِ اِ۬لْمُهِينِۖ","لَقَدْ كَانَ لِسَبَإٖ فِے مَسَٰكِنِهِمُۥٓ ءَايَةٞۖ جَنَّتَٰنِ عَنْ يَّمِينٖ وَشِمَالٖۖ كُلُواْ مِن رِّزْقِ رَبِّكُمْ وَاشْكُرُواْ لَهُۥۖ بَلْدَةٞ طَيِّبَةٞ وَرَبٌّ غَفُورٞۖ","فَأَعْرَضُواْ فَأَرْسَلْنَا عَلَيْهِمْ سَيْلَ اَ۬لْعَرِمِۖ وَبَدَّلْنَٰهُم بِجَنَّتَيْهِمْ جَنَّتَيْنِ ذَوَاتَيُ ا۟كْلٍ خَمْطٖ وَأَثْلٖ وَشَےْءٖ مِّن سِدْرٖ قَلِيلٖۖ","ذَٰلِكَ جَزَيْنَٰهُم بِمَا كَفَرُواْۖ وَهَلْ يُجَٰز۪ىٰٓ إِلَّا اَ۬لْكَفُورُۖ","۞ وَجَعَلْنَا بَيْنَهُمْ وَبَيْنَ اَ۬لْقُرَى اَ۬لتِے بَٰرَكْنَا فِيهَا قُرىٗ ظَٰهِرَةٗ وَقَدَّرْنَا فِيهَا اَ۬لسَّيْرَۖ سِيرُواْ فِيهَا لَيَالِيَ وَأَيَّاماً اٰمِنِينَۖ","فَقَالُواْ رَبَّنَا بَٰعِدْ بَيْنَ أَسْف۪ارِنَا وَظَلَمُوٓاْ أَنفُسَهُمْ فَجَعَلْنَٰهُمُۥٓ أَحَادِيثَ وَمَزَّقْنَٰهُمْ كُلَّ مُمَزَّقٍۖ اِنَّ فِے ذَٰلِكَ لَأٓيَٰتٖ لِّكُلِّ صَبّ۪ارٖ شَكُورٖۖ","وَلَقَدْ صَدَقَ عَلَيْهِمُۥٓ إِبْلِيسُ ظَنَّهُۥ فَاتَّبَعُوهُ إِلَّا فَرِيقاٗ مِّنَ اَ۬لْمُومِنِينَۖ","وَمَا كَانَ لَهُۥ عَلَيْهِم مِّن سُلْطَٰنٍ اِلَّا لِنَعْلَمَ مَنْ يُّومِنُ بِالَاخِرَةِ مِمَّنْ هُوَ مِنْهَا فِے شَكّٖۖ وَرَبُّكَ عَلَىٰ كُلِّ شَےْءٍ حَفِيظٞۖ","قُلُ اُ۟دْعُواْ اُ۬لذِينَ زَعَمْتُم مِّن دُونِ اِ۬للَّهِۖ لَا يَمْلِكُونَ مِثْقَالَ ذَرَّةٖ فِے اِ۬لسَّمَٰوَٰتِ وَلَا فِے اِ۬لَارْضِۖ وَمَا لَهُمْ فِيهِمَا مِن شِرْكٖۖ وَمَا لَهُۥ مِنْهُم مِّن ظَهِيرٖۖ","وَلَا تَنفَعُ اُ۬لشَفَٰعَةُ عِندَهُۥٓ إِلَّا لِمَنَ اَذِنَ لَهُۥۖ حَتَّىٰٓ إِذَا فُزِّعَ عَن قُلُوبِهِمْ قَالُواْ مَاذَا قَالَ رَبُّكُمْ قَالُواْ اُ۬لْحَقَّۖ وَهُوَ اَ۬لْعَلِيُّ اُ۬لْكَبِيرُۖ","۞ قُلْ مَنْ يَّرْزُقُكُم مِّنَ اَ۬لسَّمَٰوَٰتِ وَالَارْضِ قُلِ اِ۬للَّهُۖ وَإِنَّآ أَوِ اِيَّاكُمْ لَعَلَىٰ هُدىً اَوْ فِے ضَلَٰلٖ مُّبِينٖۖ","قُل لَّا تُسْـَٔلُونَ عَمَّآ أَجْرَمْنَا وَلَا نُسْـَٔلُ عَمَّا تَعْمَلُونَۖ","قُلْ يَجْمَعُ بَيْنَنَا رَبُّنَا ثُمَّ يَفْتَحُ بَيْنَنَا بِالْحَقِّۖ وَهُوَ اَ۬لْفَتَّاحُ اُ۬لْعَلِيمُۖ","قُلَ اَرُونِيَ اَ۬لذِينَ أَلْحَقْتُم بِهِۦ شُرَكَآءَ كَلَّاۖ بَلْ هُوَ اَ۬للَّهُ اُ۬لْعَزِيزُ اُ۬لْحَكِيمُۖ","وَمَآ أَرْسَلْنَٰكَ إِلَّا كَآفَّةٗ لِّلنَّاسِ بَشِيراٗ وَنَذِيراٗۖ وَلَٰكِنَّ أَكْثَرَ اَ۬لنَّاسِ لَا يَعْلَمُونَۖ","وَيَقُولُونَ مَت۪ىٰ هَٰذَا اَ۬لْوَعْدُ إِن كُنتُمْ صَٰدِقِينَۖ","قُل لَّكُم مِّيعَادُ يَوْمٖ لَّا تَسْتَٰخِرُونَ عَنْهُ سَاعَةٗ وَلَا تَسْتَقْدِمُونَۖ","وَقَالَ اَ۬لذِينَ كَفَرُواْ لَن نُّومِنَ بِهَٰذَا اَ۬لْقُرْءَانِ وَلَا بِالذِے بَيْنَ يَدَيْهِۖ وَلَوْ تَر۪ىٰٓ إِذِ اِ۬لظَّٰلِمُونَ مَوْقُوفُونَ عِندَ رَبِّهِمْ يَرْجِعُ بَعْضُهُمُۥٓ إِلَىٰ بَعْضٍ اِ۬لْقَوْلَۖ يَقُولُ اُ۬لذِينَ اَ۟سْتُضْعِفُواْ لِلذِينَ اَ۪سْتَكْبَرُواْ لَوْلَآ أَنتُمْ لَكُنَّا مُومِنِينَۖ","قَالَ اَ۬لذِينَ اَ۪سْتَكْبَرُواْ لِلذِينَ اَ۟سْتُضْعِفُوٓاْ أَنَحْنُ صَدَدْنَٰكُمْ عَنِ اِ۬لْهُد۪ىٰ بَعْدَ إِذْ جَآءَكُم بَلْ كُنتُم مُّجْرِمِينَۖ","وَقَالَ اَ۬لذِينَ اَ۟سْتُضْعِفُواْ لِلذِينَ اَ۪سْتَكْبَرُواْ بَلْ مَكْرُ اُ۬ليْلِ وَالنَّه۪ارِ إِذْ تَامُرُونَنَآ أَن نَّكْفُرَ بِاللَّهِ وَنَجْعَلَ لَهُۥٓ أَندَاداٗۖ وَأَسَرُّواْ اُ۬لنَّدَامَةَ لَمَّا رَأَوُاْ اُ۬لْعَذَابَۖ وَجَعَلْنَا اَ۬لَاغْلَٰلَ فِےٓ أَعْنَاقِ اِ۬لذِينَ كَفَرُواْۖ هَلْ يُجْزَوْنَ إِلَّا مَا كَانُواْ يَعْمَلُونَۖ","وَمَآ أَرْسَلْنَا فِے قَرْيَةٖ مِّن نَّذِيرٍ اِلَّا قَالَ مُتْرَفُوهَآ إِنَّا بِمَآ أُرْسِلْتُم بِهِۦ كَٰفِرُونَۖ","وَقَالُواْ نَحْنُ أَكْثَرُ أَمْوَٰلاٗ وَأَوْلَٰداٗ وَمَا نَحْنُ بِمُعَذَّبِينَۖ","قُلِ اِنَّ رَبِّے يَبْسُطُ اُ۬لرِّزْقَ لِمَنْ يَّشَآءُ وَيَقْدِرُۖ وَلَٰكِنَّ أَكْثَرَ اَ۬لنَّاسِ لَا يَعْلَمُونَۖ","۞ وَمَآ أَمْوَٰلُكُمْ وَلَآ أَوْلَٰدُكُم بِالتِے تُقَرِّبُكُمْ عِندَنَا زُلْف۪ىٰٓ إِلَّا مَنَ اٰمَنَ وَعَمِلَ صَٰلِحاٗ فَأُوْلَٰٓئِكَ لَهُمْ جَزَآءُ اُ۬لضِّعْفِ بِمَا عَمِلُواْ وَهُمْ فِے اِ۬لْغُرُفَٰتِ ءَامِنُونَۖ","وَالذِينَ يَسْعَوْنَ فِےٓ ءَايَٰتِنَا مُعَٰجِزِينَ أُوْلَٰٓئِكَ فِے اِ۬لْعَذَابِ مُحْضَرُونَۖ","قُلِ اِنَّ رَبِّے يَبْسُطُ اُ۬لرِّزْقَ لِمَنْ يَّشَآءُ مِنْ عِبَادِهِۦ وَيَقْدِرُ لَهُۥۖ وَمَآ أَنفَقْتُم مِّن شَےْءٖ فَهُوَ يُخْلِفُهُۥۖ وَهُوَ خَيْرُ اُ۬لرَّٰزِقِينَۖ","وَيَوْمَ نَحْشُرُهُمْ جَمِيعاٗ ثُمَّ نَقُولُ لِلْمَلَٰٓئِكَةِ أَهَٰٓؤُلَآءِ ايَّاكُمْ كَانُواْ يَعْبُدُونَۖ","قَالُواْ سُبْحَٰنَكَ أَنتَ وَلِيُّنَا مِن دُونِهِمۖ بَلْ كَانُواْ يَعْبُدُونَ اَ۬لْجِنَّۖ أَكْثَرُهُم بِهِم مُّومِنُونَۖ","فَالْيَوْمَ لَا يَمْلِكُ بَعْضُكُمْ لِبَعْضٖ نَّفْعاٗ وَلَا ضَرّاٗ وَنَقُولُ لِلذِينَ ظَلَمُواْ ذُوقُواْ عَذَابَ اَ۬لنّ۪ارِ اِ۬لتِے كُنتُم بِهَا تُكَذِّبُونَۖ","وَإِذَا تُتْل۪ىٰ عَلَيْهِمُۥٓ ءَايَٰتُنَا بَيِّنَٰتٖ قَالُواْ مَا هَٰذَآ إِلَّا رَجُلٞ يُرِيدُ أَنْ يَّصُدَّكُمْ عَمَّا كَانَ يَعْبُدُ ءَابَآؤُكُمْ وَقَالُواْ مَا هَٰذَآ إِلَّآ إِفْكٞ مُّفْتَرىٗۖ وَقَالَ اَ۬لذِينَ كَفَرُواْ لِلْحَقِّ لَمَّا جَآءَهُمُۥٓ إِنْ هَٰذَآ إِلَّا سِحْرٞ مُّبِينٞۖ","وَمَآ ءَاتَيْنَٰهُم مِّن كُتُبٖ يَدْرُسُونَهَاۖ وَمَآ أَرْسَلْنَآ إِلَيْهِمْ قَبْلَكَ مِن نَّذِيرٖۖ","وَكَذَّبَ اَ۬لذِينَ مِن قَبْلِهِمْ وَمَا بَلَغُواْ مِعْشَارَ مَآ ءَاتَيْنَٰهُمْۖ فَكَذَّبُواْ رُسُلِےۖ فَكَيْفَ كَانَ نَكِيرِۦۖ","۞ قُلِ اِنَّمَآ أَعِظُكُم بِوَٰحِدَةٍۖ اَن تَقُومُواْ لِلهِ مَثْن۪ىٰ وَفُرَٰد۪ىٰ ثُمَّ تَتَفَكَّرُواْۖ مَا بِصَٰحِبِكُم مِّن جِنَّةٍۖ اِنْ هُوَ إِلَّا نَذِيرٞ لَّكُم بَيْنَ يَدَےْ عَذَابٖ شَدِيدٖۖ","قُلْ مَا سَأَلْتُكُم مِّنَ اَجْرٖ فَهُوَ لَكُمُۥٓۖ إِنَ اَجْرِيَ إِلَّا عَلَى اَ۬للَّهِۖ وَهُوَ عَلَىٰ كُلِّ شَےْءٖ شَهِيدٞۖ","قُلِ اِنَّ رَبِّے يَقْذِفُ بِالْحَقِّۖ عَلَّٰمُ اُ۬لْغُيُوبِۖ","قُلْ جَآءَ اَ۬لْحَقُّ وَمَا يُبْدِۓُ اُ۬لْبَٰطِلُ وَمَا يُعِيدُۖ","قُلِ اِن ضَلَلْتُ فَإِنَّمَآ أَضِلُّ عَلَىٰ نَفْسِے وَإِنِ اِ۪هْتَدَيْتُ فَبِمَا يُوحِےٓ إِلَيَّ رَبِّيَۖ إِنَّهُۥ سَمِيعٞ قَرِيبٞۖ","وَلَوْ تَر۪ىٰٓ إِذْ فَزِعُواْ فَلَا فَوْتَ وَأُخِذُواْ مِن مَّكَانٖ قَرِيبٖۖ","وَقَالُوٓاْ ءَامَنَّا بِهِۦۖ وَأَنّ۪ىٰ لَهُمُ اُ۬لتَّنَاوُشُ مِن مَّكَانِۢ بَعِيدٖ","وَقَدْ كَفَرُواْ بِهِۦ مِن قَبْلُۖ وَيَقْذِفُونَ بِالْغَيْبِ مِن مَّكَانِۢ بَعِيدٖۖ","وَحِيلَ بَيْنَهُمْ وَبَيْنَ مَا يَشْتَهُونَ كَمَا فُعِلَ بِأَشْيَاعِهِم مِّن قَبْلُ إِنَّهُمْ كَانُواْ فِے شَكّٖ مُّرِيبٍۖ"]],["فاطر",["اِ۬لْحَمْدُ لِلهِ فَاطِرِ اِ۬لسَّمَٰوَٰتِ وَالَارْضِ جَاعِلِ اِ۬لْمَلَٰٓئِكَةِ رُسُلاً ا۟وْلِےٓ أَجْنِحَةٖ مَّثْن۪ىٰ وَثُلَٰثَ وَرُبَٰعَۖ يَزِيدُ فِے اِ۬لْخَلْقِ مَا يَشَآءُۖ اِ۪نَّ اَ۬للَّهَ عَلَىٰ كُلِّ شَےْءٖ قَدِيرٞۖ","مَّا يَفْتَحِ اِ۬للَّهُ لِلنَّاسِ مِن رَّحْمَةٖ فَلَا مُمْسِكَ لَهَاۖ وَمَا يُمْسِكْ فَلَا مُرْسِلَ لَهُۥ مِنۢ بَعْدِهِۦۖ وَهُوَ اَ۬لْعَزِيزُ اُ۬لْحَكِيمُۖ","يَٰٓأَيُّهَا اَ۬لنَّاسُ اُ۟ذْكُرُواْ نِعْمَتَ اَ۬للَّهِ عَلَيْكُمْۖ هَلْ مِنْ خَٰلِقٍ غَيْرُ اُ۬للَّهِ يَرْزُقُكُم مِّنَ اَ۬لسَّمَآءِ وَالَارْضِۖ لَآ إِلَٰهَ إِلَّا هُوَۖ فَأَنّ۪ىٰ تُوفَكُونَۖ","وَإِنْ يُّكَذِّبُوكَ فَقَدْ كُذِّبَتْ رُسُلٞ مِّن قَبْلِكَۖ وَإِلَى اَ۬للَّهِ تُرْجَعُ اُ۬لُامُورُۖ","يَٰٓأَيُّهَا اَ۬لنَّاسُ إِنَّ وَعْدَ اَ۬للَّهِ حَقّٞۖ فَلَا تَغُرَّنَّكُمُ اُ۬لْحَيَوٰةُ اُ۬لدُّنْي۪اۖ وَلَا يَغُرَّنَّكُم بِاللَّهِ اِ۬لْغَرُورُۖ","إِنَّ اَ۬لشَّيْطَٰنَ لَكُمْ عَدُوّٞ فَاتَّخِذُوهُ عَدُوّاًۖ اِنَّمَا يَدْعُواْ حِزْبَهُۥ لِيَكُونُواْ مِنَ اَصْحَٰبِ اِ۬لسَّعِيرِۖ","اِ۬لذِينَ كَفَرُواْ لَهُمْ عَذَابٞ شَدِيدٞۖ وَالذِينَ ءَامَنُواْ وَعَمِلُواْ اُ۬لصَّٰلِحَٰتِ لَهُم مَّغْفِرَةٞ وَأَجْرٞ كَبِيرٌۖ","۞ اَفَمَن زُيِّنَ لَهُۥ سُوٓءُ عَمَلِهِۦ فَر۪ء۪اهُ حَسَناٗۖ فَإِنَّ اَ۬للَّهَ يُضِلُّ مَنْ يَّشَآءُ وَيَهْدِے مَنْ يَّشَآءُۖ فَلَا تَذْهَبْ نَفْسُكَ عَلَيْهِمْ حَسَرَٰتٍۖ اِنَّ اَ۬للَّهَ عَلِيمُۢ بِمَا يَصْنَعُونَۖ","وَاللَّهُ اُ۬لذِےٓ أَرْسَلَ اَ۬لرِّيَٰحَ فَتُثِيرُ سَحَاباٗ فَسُقْنَٰهُ إِلَىٰ بَلَدٖ مَّيِّتٖ فَأَحْيَيْنَا بِهِ اِ۬لَارْضَ بَعْدَ مَوْتِهَاۖ كَذَٰلِكَ اَ۬لنُّشُورُۖ","مَن كَانَ يُرِيدُ اُ۬لْعِزَّةَ فَلِلهِ اِ۬لْعِزَّةُ جَمِيعاًۖ اِلَيْهِ يَصْعَدُ اُ۬لْكَلِمُ اُ۬لطَّيِّبُۖ وَالْعَمَلُ اُ۬لصَّٰلِحُ يَرْفَعُهُۥۖ وَالذِينَ يَمْكُرُونَ اَ۬لسَّيِّـَٔاتِ لَهُمْ عَذَابٞ شَدِيدٞۖ وَمَكْرُ أُوْلَٰٓئِكَ هُوَ يَبُورُۖ","وَاللَّهُ خَلَقَكُم مِّن تُرَابٖ ثُمَّ مِن نُّطْفَةٖ ثُمَّ جَعَلَكُمُۥٓ أَزْوَٰجاٗۖ وَمَا تَحْمِلُ مِنُ ا۟نث۪ىٰ وَلَا تَضَعُ إِلَّا بِعِلْمِهِۦۖ وَمَا يُعَمَّرُ مِن مُّعَمَّرٖ وَلَا يُنقَصُ مِنْ عُمُرِهِۦٓ إِلَّا فِے كِتَٰبٍۖ اِنَّ ذَٰلِكَ عَلَى اَ۬للَّهِ يَسِيرٞۖ","وَمَا يَسْتَوِے اِ۬لْبَحْرَٰنِۖ هَٰذَا عَذْبٞ فُرَاتٞ سَآئِغٞ شَرَابُهُۥ وَهَٰذَا مِلْحٌ ا۟جَاجٞۖ وَمِن كُلّٖ تَاكُلُونَ لَحْماٗ طَرِيّاٗ وَتَسْتَخْرِجُونَ حِلْيَةٗ تَلْبَسُونَهَاۖ وَتَرَى اَ۬لْفُلْكَ فِيهِ مَوَاخِرَ لِتَبْتَغُواْ مِن فَضْلِهِۦ وَلَعَلَّكُمْ تَشْكُرُونَۖ","يُولِجُ اُ۬ليْلَ فِے اِ۬لنَّه۪ارِ وَيُولِجُ اُ۬لنَّهَارَ فِے اِ۬ليْلِۖ وَسَخَّرَ اَ۬لشَّمْسَ وَالْقَمَرَۖ كُلّٞ يَجْرِے لِأَجَلٖ مُّسَمّىٗۖ ذَٰلِكُمُ اُ۬للَّهُ رَبُّكُمْ لَهُ اُ۬لْمُلْكُۖ وَالذِينَ تَدْعُونَ مِن دُونِهِۦ مَا يَمْلِكُونَ مِن قِطْمِيرٍۖ","اِن تَدْعُوهُمْ لَا يَسْمَعُواْ دُعَآءَكُمْ وَلَوْ سَمِعُواْ مَا اَ۪سْتَجَابُواْ لَكُمْۖ وَيَوْمَ اَ۬لْقِيَٰمَةِ يَكْفُرُونَ بِشِرْكِكُمْۖ وَلَا يُنَبِّئُكَ مِثْلُ خَبِيرٖۖ","۞ يَٰٓأَيُّهَا اَ۬لنَّاسُ أَنتُمُ اُ۬لْفُقَرَآءُ اِ۪لَى اَ۬للَّهِۖ وَاللَّهُ هُوَ اَ۬لْغَنِيُّ اُ۬لْحَمِيدُۖ","إِنْ يَّشَأْ يُذْهِبْكُمْ وَيَاتِ بِخَلْقٖ جَدِيدٖۖ","وَمَا ذَٰلِكَ عَلَى اَ۬للَّهِ بِعَزِيزٖۖ","وَلَا تَزِرُ وَازِرَةٞ وِزْرَ أُخْر۪ىٰۖ وَإِن تَدْعُ مُثْقَلَةٌ اِلَىٰ حِمْلِهَا لَا يُحْمَلْ مِنْهُ شَےْءٞ وَلَوْ كَانَ ذَا قُرْب۪ىٰٓۖ إِنَّمَا تُنذِرُ اُ۬لذِينَ يَخْشَوْنَ رَبَّهُم بِالْغَيْبِ وَأَقَامُواْ اُ۬لصَّلَوٰةَۖ وَمَن تَزَكّ۪ىٰ فَإِنَّمَا يَتَزَكّ۪ىٰ لِنَفْسِهِۦۖ وَإِلَى اَ۬للَّهِ اِ۬لْمَصِيرُۖ","وَمَا يَسْتَوِے اِ۬لَاعْم۪ىٰ وَالْبَصِيرُ","وَلَا اَ۬لظُّلُمَٰتُ وَلَا اَ۬لنُّورُ","وَلَا اَ۬لظِّلُّ وَلَا اَ۬لْحَرُورُۖ","وَمَا يَسْتَوِے اِ۬لَاحْيَآءُ وَلَا اَ۬لَامْوَٰتُۖ إِنَّ اَ۬للَّهَ يُسْمِعُ مَنْ يَّشَآءُۖ وَمَآ أَنتَ بِمُسْمِعٖ مَّن فِے اِ۬لْقُبُورِۖ","إِنَ اَنتَ إِلَّا نَذِيرٌۖ","اِنَّآ أَرْسَلْنَٰكَ بِالْحَقِّ بَشِيراٗ وَنَذِيراٗۖ وَإِن مِّنُ ا۟مَّةٍ اِلَّا خَلَا فِيهَا نَذِيرٞۖ","وَإِنْ يُّكَذِّبُوكَ فَقَدْ كَذَّبَ اَ۬لذِينَ مِن قَبْلِهِمْ جَآءَتْهُمْ رُسُلُهُم بِالْبَيِّنَٰتِ وَبِالزُّبُرِ وَبِالْكِتَٰبِ اِ۬لْمُنِيرِ","ثُمَّ أَخَذتُّ اُ۬لذِينَ كَفَرُواْۖ فَكَيْفَ كَانَ نَكِيرِۦٓۖ","أَلَمْ تَرَ أَنَّ اَ۬للَّهَ أَنزَلَ مِنَ اَ۬لسَّمَآءِ مَآءٗ فَأَخْرَجْنَا بِهِۦ ثَمَرَٰتٖ مُّخْتَلِفاً اَلْوَٰنُهَاۖ وَمِنَ اَ۬لْجِبَالِ جُدَدُۢ بِيضٞ وَحُمْرٞ مُّخْتَلِفٌ اَلْوَٰنُهَا وَغَرَابِيبُ سُودٞۖ","وَمِنَ اَ۬لنَّاسِ وَالدَّوَآبِّ وَالَانْعَٰمِ مُخْتَلِفٌ اَلْوَٰنُهُۥ كَذَٰلِكَۖ إِنَّمَا يَخْشَى اَ۬للَّهَ مِنْ عِبَادِهِ اِ۬لْعُلَمَٰٓؤُاْۖ اِ۪نَّ اَ۬للَّهَ عَزِيزٌ غَفُورٌۖ","اِنَّ اَ۬لذِينَ يَتْلُونَ كِتَٰبَ اَ۬للَّهِ وَأَقَامُواْ اُ۬لصَّلَوٰةَ وَأَنفَقُواْ مِمَّا رَزَقْنَٰهُمْ سِرّاٗ وَعَلَٰنِيَةٗ يَرْجُونَ تِجَٰرَةٗ لَّن تَبُورَ","لِيُوَفِّيَهُمُۥٓ أُجُورَهُمْ وَيَزِيدَهُم مِّن فَضْلِهِۦٓۖ إِنَّهُۥ غَفُورٞ شَكُورٞۖ","۞ وَالذِےٓ أَوْحَيْنَآ إِلَيْكَ مِنَ اَ۬لْكِتَٰبِ هُوَ اَ۬لْحَقُّ مُصَدِّقاٗ لِّمَا بَيْنَ يَدَيْهِۖ إِنَّ اَ۬للَّهَ بِعِبَادِهِۦ لَخَبِيرُۢ بَصِيرٞۖ","ثُمَّ أَوْرَثْنَا اَ۬لْكِتَٰبَ اَ۬لذِينَ اَ۪صْطَفَيْنَا مِنْ عِبَادِنَاۖ فَمِنْهُمْ ظَالِمٞ لِّنَفْسِهِۦۖ وَمِنْهُم مُّقْتَصِدٞۖ وَمِنْهُمْ سَابِقُۢ بِالْخَيْرَٰتِ بِإِذْنِ اِ۬للَّهِۖ ذَٰلِكَ هُوَ اَ۬لْفَضْلُ اُ۬لْكَبِيرُۖ","جَنَّٰتُ عَدْنٖ يَدْخُلُونَهَا يُحَلَّوْنَ فِيهَا مِنَ اَسَاوِرَ مِن ذَهَبٖ وَلُؤْلُؤاٗۖ وَلِبَاسُهُمْ فِيهَا حَرِيرٞۖ","وَقَالُواْ اُ۬لْحَمْدُ لِلهِ اِ۬لذِےٓ أَذْهَبَ عَنَّا اَ۬لْحَزَنَ إِنَّ رَبَّنَا لَغَفُورٞ شَكُورٌۖ","اِ۬لذِےٓ أَحَلَّنَا دَارَ اَ۬لْمُقَامَةِ مِن فَضْلِهِۦ لَا يَمَسُّنَا فِيهَا نَصَبٞ وَلَا يَمَسُّنَا فِيهَا لُغُوبٞۖ","وَالذِينَ كَفَرُواْ لَهُمْ نَارُ جَهَنَّمَ لَا يُقْض۪ىٰ عَلَيْهِمْ فَيَمُوتُواْ وَلَا يُخَفَّفُ عَنْهُم مِّنْ عَذَابِهَاۖ كَذَٰلِكَ نَجْزِے كُلَّ كَفُورٖۖ","وَهُمْ يَصْطَرِخُونَ فِيهَا رَبَّنَآ أَخْرِجْنَا نَعْمَلْ صَٰلِحاً غَيْرَ اَ۬لذِے كُنَّا نَعْمَلُۖ أَوَلَمْ نُعَمِّرْكُم مَّا يَتَذَكَّرُ فِيهِ مَن تَذَكَّرَ وَجَآءَكُمُ اُ۬لنَّذِيرُۖ فَذُوقُواْۖ فَمَا لِلظَّٰلِمِينَ مِن نَّصِيرٍۖ","اِنَّ اَ۬للَّهَ عَٰلِمُ غَيْبِ اِ۬لسَّمَٰوَٰتِ وَالَارْضِۖ إِنَّهُۥ عَلِيمُۢ بِذَاتِ اِ۬لصُّدُورِۖ","هُوَ اَ۬لذِے جَعَلَكُمْ خَلَٰٓئِفَ فِے اِ۬لَارْضِۖ فَمَن كَفَرَ فَعَلَيْهِ كُفْرُهُۥۖ وَلَا يَزِيدُ اُ۬لْكٰ۪فِرِينَ كُفْرُهُمْ عِندَ رَبِّهِمُۥٓ إِلَّا مَقْتاٗۖ وَلَا يَزِيدُ اُ۬لْكٰ۪فِرِينَ كُفْرُهُمُۥٓ إِلَّا خَسَاراٗۖ","قُلَ اَرَٰٓيْتُمْ شُرَكَآءَكُمُ اُ۬لذِينَ تَدْعُونَ مِن دُونِ اِ۬للَّهِ أَرُونِے مَاذَا خَلَقُواْ مِنَ اَ۬لَارْضِ أَمْ لَهُمْ شِرْكٞ فِے اِ۬لسَّمَٰوَٰتِۖ أَمَ اٰتَيْنَٰهُمْ كِتَٰباٗ فَهُمْ عَلَىٰ بَيِّنَٰتٖ مِّنْهُۖ بَلِ اِنْ يَّعِدُ اُ۬لظَّٰلِمُونَ بَعْضُهُم بَعْضاً اِلَّا غُرُوراًۖ","۞ اِنَّ اَ۬للَّهَ يُمْسِكُ اُ۬لسَّمَٰوَٰتِ وَالَارْضَ أَن تَزُولَاۖ وَلَئِن زَالَتَآ إِنَ اَمْسَكَهُمَا مِنَ اَحَدٖ مِّنۢ بَعْدِهِۦٓۖ إِنَّهُۥ كَانَ حَلِيماً غَفُوراٗۖ","وَأَقْسَمُواْ بِاللَّهِ جَهْدَ أَيْمَٰنِهِمْ لَئِن جَآءَهُمْ نَذِيرٞ لَّيَكُونُنَّ أَهْد۪ىٰ مِنِ اِحْدَى اَ۬لُامَمِۖ فَلَمَّا جَآءَهُمْ نَذِيرٞ مَّا زَادَهُمُۥٓ إِلَّا نُفُوراًۖ","اِ۪سْتِكْبَاراٗ فِے اِ۬لَارْضِ وَمَكْرَ اَ۬لسَّيِّےِٕۖ وَلَا يَحِيقُ اُ۬لْمَكْرُ اُ۬لسَّيِّۓُ اِ۪لَّا بِأَهْلِهِۦۖ فَهَلْ يَنظُرُونَ إِلَّا سُنَّتَ اَ۬لَاوَّلِينَۖ فَلَن تَجِدَ لِسُنَّتِ اِ۬للَّهِ تَبْدِيلاٗۖ","وَلَن تَجِدَ لِسُنَّتِ اِ۬للَّهِ تَحْوِيلاًۖ","اَوَلَمْ يَسِيرُواْ فِے اِ۬لَارْضِ فَيَنظُرُواْ كَيْفَ كَانَ عَٰقِبَةُ اُ۬لذِينَ مِن قَبْلِهِمْ وَكَانُوٓاْ أَشَدَّ مِنْهُمْ قُوَّةٗۖ وَمَا كَانَ اَ۬للَّهُ لِيُعْجِزَهُۥ مِن شَےْءٖ فِے اِ۬لسَّمَٰوَٰتِ وَلَا فِے اِ۬لَارْضِۖ إِنَّهُۥ كَانَ عَلِيماٗ قَدِيراٗۖ","وَلَوْ يُوَ۬اخِذُ اُ۬للَّهُ اُ۬لنَّاسَ بِمَا كَسَبُواْ مَا تَرَكَ عَلَىٰ ظَهْرِهَا مِن دَآبَّةٖۖ وَلَٰكِنْ يُّوَ۬خِّرُهُمُۥٓ إِلَىٰٓ أَجَلٖ مُّسَمّىٗۖ فَإِذَا جَآءَ اجَلُهُمْ فَإِنَّ اَ۬للَّهَ كَانَ بِعِبَادِهِۦ بَصِيراٗۖ"]],["يس",["يَسِٓۖ وَالْقُرْءَانِ اِ۬لْحَكِيمِ","إِنَّكَ لَمِنَ اَ۬لْمُرْسَلِينَ","عَلَىٰ صِرَٰطٖ مُّسْتَقِيمٖۖ","تَنزِيلُ اُ۬لْعَزِيزِ اِ۬لرَّحِيمِ","لِتُنذِرَ قَوْماٗ مَّآ أُنذِرَ ءَابَآؤُهُمْ فَهُمْ غَٰفِلُونَۖ","۞ لَقَدْ حَقَّ اَ۬لْقَوْلُ عَلَىٰٓ أَكْثَرِهِمْ فَهُمْ لَا يُومِنُونَۖ","إِنَّا جَعَلْنَا فِےٓ أَعْنَٰقِهِمُۥٓ أَغْلَٰلاٗ فَهِيَ إِلَى اَ۬لَاذْقَانِ فَهُم مُّقْمَحُونَۖ","وَجَعَلْنَا مِنۢ بَيْنِ أَيْدِيهِمْ سُدّاٗ وَمِنْ خَلْفِهِمْ سُدّاٗ فَأَغْشَيْنَٰهُمْ فَهُمْ لَا يُبْصِرُونَۖ","وَسَوَآءٌ عَلَيْهِمُۥٓ ءَآنذَرْتَهُمُۥٓ أَمْ لَمْ تُنذِرْهُمْ لَا يُومِنُونَۖ","إِنَّمَا تُنذِرُ مَنِ اِ۪تَّبَعَ اَ۬لذِّكْرَ وَخَشِيَ اَ۬لرَّحْمَٰنَ بِالْغَيْبِ فَبَشِّرْهُ بِمَغْفِرَةٖ وَأَجْرٖ كَرِيمٍۖ","اِنَّا نَحْنُ نُحْيِ اِ۬لْمَوْت۪ىٰ وَنَكْتُبُ مَا قَدَّمُواْ وَءَاثَٰرَهُمْۖ وَكُلَّ شَےْءٍ اَحْصَيْنَٰهُ فِےٓ إِمَامٖ مُّبِينٖۖ","وَاضْرِبْ لَهُم مَّثَلاً اَصْحَٰبَ اَ۬لْقَرْيَةِ إِذْ جَآءَهَا اَ۬لْمُرْسَلُونَ","إِذَ اَرْسَلْنَآ إِلَيْهِمُ اُ۪ثْنَيْنِ فَكَذَّبُوهُمَا فَعَزَّزْنَا بِثَالِثٖ فَقَالُوٓاْ إِنَّآ إِلَيْكُم مُّرْسَلُونَۖ","قَالُواْ مَآ أَنتُمُۥٓ إِلَّا بَشَرٞ مِّثْلُنَا وَمَآ أَنزَلَ اَ۬لرَّحْمَٰنُ مِن شَےْءٍ اِنَ اَنتُمُۥٓ إِلَّا تَكْذِبُونَۖ","قَالُواْ رَبُّنَا يَعْلَمُ إِنَّآ إِلَيْكُمْ لَمُرْسَلُونَ","وَمَا عَلَيْنَآ إِلَّا اَ۬لْبَلَٰغُ اُ۬لْمُبِينُۖ","قَالُوٓاْ إِنَّا تَطَيَّرْنَا بِكُمْ لَئِن لَّمْ تَنتَهُواْ لَنَرْجُمَنَّكُمْ وَلَيَمَسَّنَّكُم مِّنَّا عَذَابٌ اَلِيمٞۖ","قَالُواْ طَٰٓئِرُكُم مَّعَكُمُۥٓ أَئِن ذُكِّرْتُمۖ بَلَ اَنتُمْ قَوْمٞ مُّسْرِفُونَۖ","وَجَآءَ مِنَ اَقْصَا اَ۬لْمَدِينَةِ رَجُلٞ يَسْع۪ىٰۖ قَالَ يَٰقَوْمِ اِ۪تَّبِعُواْ اُ۬لْمُرْسَلِينَ","اَ۪تَّبِعُواْ مَن لَّا يَسْـَٔلُكُمُۥٓ أَجْراٗ وَهُم مُّهْتَدُونَۖ","وَمَا لِيَ لَآ أَعْبُدُ اُ۬لذِے فَطَرَنِے وَإِلَيْهِ تُرْجَعُونَۖ","ءَآتَّخِذُ مِن دُونِهِۦٓ ءَالِهَةً اِنْ يُّرِدْنِ اِ۬لرَّحْمَٰنُ بِضُرّٖ لَّا تُغْنِ عَنِّے شَفَٰعَتُهُمْ شَئْاٗ وَلَا يُنقِذُونِۦٓۖ","إِنِّيَ إِذاٗ لَّفِے ضَلَٰلٖ مُّبِينٍۖ","اِنِّيَ ءَامَنتُ بِرَبِّكُمْ فَاسْمَعُونِۖ","قِيلَ اَ۟دْخُلِ اِ۬لْجَنَّةَۖ قَالَ يَٰلَيْتَ قَوْمِے يَعْلَمُونَ","بِمَا غَفَرَ لِے رَبِّے وَجَعَلَنِے مِنَ اَ۬لْمُكْرَمِينَۖ","۞ وَمَآ أَنزَلْنَا عَلَىٰ قَوْمِهِۦ مِنۢ بَعْدِهِۦ مِن جُندٖ مِّنَ اَ۬لسَّمَآءِ وَمَا كُنَّا مُنزِلِينَۖ","إِن كَانَتِ اِلَّا صَيْحَةٗ وَٰحِدَةٗ فَإِذَا هُمْ خَٰمِدُونَۖ","يَٰحَسْرَةً عَلَى اَ۬لْعِبَادِۖ مَا يَاتِيهِم مِّن رَّسُولٍ اِلَّا كَانُواْ بِهِۦ يَسْتَهْزِءُونَۖ","أَلَمْ يَرَوْاْ كَمَ اَهْلَكْنَا قَبْلَهُم مِّنَ اَ۬لْقُرُونِ أَنَّهُمُۥٓ إِلَيْهِمْ لَا يَرْجِعُونَۖ","وَإِن كُلّٞ لَّمَا جَمِيعٞ لَّدَيْنَا مُحْضَرُونَۖ","وَءَايَةٞ لَّهُمُ اُ۬لَارْضُ اُ۬لْمَيِّتَةُ أَحْيَيْنَٰهَا وَأَخْرَجْنَا مِنْهَا حَبّاٗ فَمِنْهُ يَاكُلُونَۖ","وَجَعَلْنَا فِيهَا جَنَّٰتٖ مِّن نَّخِيلٖ وَأَعْنَٰبٖ وَفَجَّرْنَا فِيهَا مِنَ اَ۬لْعُيُونِ","لِيَاكُلُواْ مِن ثَمَرِهِۦ وَمَا عَمِلَتْهُ أَيْدِيهِمُۥٓۖ أَفَلَا يَشْكُرُونَۖ","سُبْحَٰنَ اَ۬لذِے خَلَقَ اَ۬لَازْوَٰجَ كُلَّهَا مِمَّا تُنۢبِتُ اُ۬لَارْضُ وَمِنَ اَنفُسِهِمْ وَمِمَّا لَا يَعْلَمُونَۖ","وَءَايَةٞ لَّهُمُ اُ۬ليْلُ نَسْلَخُ مِنْهُ اُ۬لنَّهَارَ فَإِذَا هُم مُّظْلِمُونَۖ","وَالشَّمْسُ تَجْرِے لِمُسْتَقَرّٖ لَّهَاۖ ذَٰلِكَ تَقْدِيرُ اُ۬لْعَزِيزِ اِ۬لْعَلِيمِۖ","وَالْقَمَرُ قَدَّرْنَٰهُ مَنَازِلَ حَتَّىٰ عَادَ كَالْعُرْجُونِ اِ۬لْقَدِيمِۖ","لَا اَ۬لشَّمْسُ يَنۢبَغِے لَهَآ أَن تُدْرِكَ اَ۬لْقَمَرَ وَلَا اَ۬ليْلُ سَابِقُ اُ۬لنَّه۪ارِۖ وَكُلّٞ فِے فَلَكٖ يَسْبَحُونَۖ","وَءَايَةٞ لَّهُمُۥٓ أَنَّا حَمَلْنَا ذُرِّيَّٰتِهِمْ فِے اِ۬لْفُلْكِ اِ۬لْمَشْحُونِ","وَخَلَقْنَا لَهُم مِّن مِّثْلِهِۦ مَا يَرْكَبُونَۖ","وَإِن نَّشَأْ نُغْرِقْهُمْ فَلَا صَرِيخَ لَهُمْ وَلَا هُمْ يُنقَذُونَ","إِلَّا رَحْمَةٗ مِّنَّا وَمَتَٰعاً اِلَىٰ حِينٖۖ","وَإِذَا قِيلَ لَهُمُ اُ۪تَّقُواْ مَا بَيْنَ أَيْدِيكُمْ وَمَا خَلْفَكُمْ لَعَلَّكُمْ تُرْحَمُونَۖ","۞ وَمَا تَاتِيهِم مِّنَ اٰيَةٖ مِّنَ اٰيَٰتِ رَبِّهِمُۥٓ إِلَّا كَانُواْ عَنْهَا مُعْرِضِينَۖ","وَإِذَا قِيلَ لَهُمُۥٓ أَنفِقُواْ مِمَّا رَزَقَكُمُ اُ۬للَّهُ قَالَ اَ۬لذِينَ كَفَرُواْ لِلذِينَ ءَامَنُوٓاْ أَنُطْعِمُ مَن لَّوْ يَشَآءُ اُ۬للَّهُ أَطْعَمَهُۥٓ إِنَ اَنتُمُۥٓ إِلَّا فِے ضَلَٰلٖ مُّبِينٖۖ","وَيَقُولُونَ مَت۪ىٰ هَٰذَا اَ۬لْوَعْدُ إِن كُنتُمْ صَٰدِقِينَۖ","مَا يَنظُرُونَ إِلَّا صَيْحَةٗ وَٰحِدَةٗ تَاخُذُهُمْ وَهُمْ يَخَصِّمُونَۖ","فَلَا يَسْتَطِيعُونَ تَوْصِيَةٗ وَلَآ إِلَىٰٓ أَهْلِهِمْ يَرْجِعُونَۖ","وَنُفِخَ فِے اِ۬لصُّورِ فَإِذَا هُم مِّنَ اَ۬لَاجْدَاثِ إِلَىٰ رَبِّهِمْ يَنسِلُونَۖ","قَالُواْ يَٰوَيْلَنَا مَنۢ بَعَثَنَا مِن مَّرْقَدِنَاۖ هَٰذَا مَا وَعَدَ اَ۬لرَّحْمَٰنُ وَصَدَقَ اَ۬لْمُرْسَلُونَۖ","إِن كَانَتِ اِلَّا صَيْحَةٗ وَٰحِدَةٗ فَإِذَا هُمْ جَمِيعٞ لَّدَيْنَا مُحْضَرُونَۖ","فَالْيَوْمَ لَا تُظْلَمُ نَفْسٞ شَئْاٗ وَلَا تُجْزَوْنَ إِلَّا مَا كُنتُمْ تَعْمَلُونَۖ","إِنَّ أَصْحَٰبَ اَ۬لْجَنَّةِ اِ۬لْيَوْمَ فِے شُغْلٖ فَٰكِهُونَ","هُمْ وَأَزْوَٰجُهُمْ فِے ظِلَٰلٍ عَلَى اَ۬لَارَآئِكِ مُتَّكِـُٔونَۖ","لَهُمْ فِيهَا فَٰكِهَةٞۖ وَلَهُم مَّا يَدَّعُونَ","سَلَٰمٞۖ قَوْلاٗ مِّن رَّبّٖ رَّحِيمٖۖ","وَامْتَٰزُواْ اُ۬لْيَوْمَ أَيُّهَا اَ۬لْمُجْرِمُونَۖ","۞ أَلَمَ اَعْهَدِ اِلَيْكُمْ يَٰبَنِےٓ ءَادَمَ أَن لَّا تَعْبُدُواْ اُ۬لشَّيْطَٰنَ إِنَّهُۥ لَكُمْ عَدُوّٞ مُّبِينٞ","وَأَنُ اُ۟عْبُدُونِےۖ هَٰذَا صِرَٰطٞ مُّسْتَقِيمٞۖ","وَلَقَدَ اَضَلَّ مِنكُمْ جِبِلّاٗ كَثِيراًۖ اَفَلَمْ تَكُونُواْ تَعْقِلُونَۖ","هَٰذِهِۦ جَهَنَّمُ اُ۬لتِے كُنتُمْ تُوعَدُونَ","اَ۪صْلَوْهَا اَ۬لْيَوْمَ بِمَا كُنتُمْ تَكْفُرُونَۖ","اَ۬لْيَوْمَ نَخْتِمُ عَلَىٰٓ أَفْوَٰهِهِمْ وَتُكَلِّمُنَآ أَيْدِيهِمْ وَتَشْهَدُ أَرْجُلُهُم بِمَا كَانُواْ يَكْسِبُونَۖ","وَلَوْ نَشَآءُ لَطَمَسْنَا عَلَىٰٓ أَعْيُنِهِمْ فَاسْتَبَقُواْ اُ۬لصِّرَٰطَ فَأَنّ۪ىٰ يُبْصِرُونَۖ","وَلَوْ نَشَآءُ لَمَسَخْنَٰهُمْ عَلَىٰ مَكَانَتِهِمْ فَمَا اَ۪سْتَطَٰعُواْ مُضِيّاٗ وَلَا يَرْجِعُونَۖ","وَمَن نُّعَمِّرْهُ نَنكُسْهُ فِے اِ۬لْخَلْقِۖ أَفَلَا تَعْقِلُونَۖ","وَمَا عَلَّمْنَٰهُ اُ۬لشِّعْرَ وَمَا يَنۢبَغِے لَهُۥٓۖ إِنْ هُوَ إِلَّا ذِكْرٞ وَقُرْءَانٞ مُّبِينٞ","لِّتُنذِرَ مَن كَانَ حَيّاٗ وَيَحِقَّ اَ۬لْقَوْلُ عَلَى اَ۬لْكٰ۪فِرِينَۖ","أَوَلَمْ يَرَوَاْ اَنَّا خَلَقْنَا لَهُم مِّمَّا عَمِلَتَ اَيْدِينَآ أَنْعَٰماٗ فَهُمْ لَهَا مَٰلِكُونَۖ","وَذَلَّلْنَٰهَا لَهُمْ فَمِنْهَا رَكُوبُهُمْ وَمِنْهَا يَاكُلُونَۖ","وَلَهُمْ فِيهَا مَنَٰفِعُ وَمَشَارِبُۖ أَفَلَا يَشْكُرُونَۖ","وَاتَّخَذُواْ مِن دُونِ اِ۬للَّهِ ءَالِهَةٗ لَّعَلَّهُمْ يُنصَرُونَ","لَا يَسْتَطِيعُونَ نَصْرَهُمْ وَهُمْ لَهُمْ جُندٞ مُّحْضَرُونَۖ","فَلَا يُحْزِنكَ قَوْلُهُمُۥٓۖ إِنَّا نَعْلَمُ مَا يُسِرُّونَ وَمَا يُعْلِنُونَۖ","أَوَلَمْ يَرَ اَ
