تُوقِدُونَ عَلَيْهِ فِے اِ۬لنّ۪ارِ اِ۪بْتِغَآءَ حِلْيَةٍ اَوْ مَتَٰعٖ زَبَدٞ مِّثْلُهُۥۖ كَذَٰلِكَ يَضْرِبُ اُ۬للَّهُ اُ۬لْحَقَّ وَالْبَٰطِلَۖ فَأَمَّا اَ۬لزَّبَدُ فَيَذْهَبُ جُفَآءٗۖ وَأَمَّا مَا يَنفَعُ اُ۬لنَّاسَ فَيَمْكُثُ فِے اِ۬لَارْضِۖ كَذَٰلِكَ يَضْرِبُ اُ۬للَّهُ اُ۬لَامْثَالَۖ","لِلذِينَ اَ۪سْتَجَابُواْ لِرَبِّهِمُ اُ۬لْحُسْن۪ىٰۖ وَالذِينَ لَمْ يَسْتَجِيبُواْ لَهُۥ لَوَ اَنَّ لَهُم مَّا فِے اِ۬لَارْضِ جَمِيعاٗ وَمِثْلَهُۥ مَعَهُۥ لَافْتَدَوْاْ بِهِۦٓۖ أُوْلَٰٓئِكَ لَهُمْ سُوٓءُ اُ۬لْحِسَابِۖ وَمَأْو۪يٰهُمْ جَهَنَّمُۖ وَبِيسَ اَ۬لْمِهَادُۖ","۞ أَفَمَنْ يَّعْلَمُ أَنَّمَآ أُنزِلَ إِلَيْكَ مِن رَّبِّكَ اَ۬لْحَقُّ كَمَنْ هُوَ أَعْم۪ىٰٓۖ إِنَّمَا يَتَذَكَّرُ أُوْلُواْ اُ۬لَالْبَٰبِ","اِ۬لذِينَ يُوفُونَ بِعَهْدِ اِ۬للَّهِ وَلَا يَنقُضُونَ اَ۬لْمِيثَٰقَ","وَالذِينَ يَصِلُونَ مَآ أَمَرَ اَ۬للَّهُ بِهِۦٓ أَنْ يُّوصَلَ وَيَخْشَوْنَ رَبَّهُمْ وَيَخَافُونَ سُوٓءَ اَ۬لْحِسَابِ","وَالذِينَ صَبَرُواْ اُ۪بْتِغَآءَ وَجْهِ رَبِّهِمْ وَأَقَامُواْ اُ۬لصَّلَوٰةَ وَأَنفَقُواْ مِمَّا رَزَقْنَٰهُمْ سِرّاٗ وَعَلَٰنِيَةٗ وَيَدْرَءُونَ بِالْحَسَنَةِ اِ۬لسَّيِّئَةَۖ أُوْلَٰٓئِكَ لَهُمْ عُقْبَى اَ۬لدّ۪ارِۖ","جَنَّٰتُ عَدْنٖ يَدْخُلُونَهَا وَمَن صَلَحَ مِنَ اٰبَآئِهِمْ وَأَزْوَٰجِهِمْ وَذُرِّيَّٰتِهِمْۖ وَالْمَلَٰٓئِكَةُ يَدْخُلُونَ عَلَيْهِم مِّن كُلِّ بَابٖۖ سَلَٰمٌ عَلَيْكُم بِمَا صَبَرْتُمْۖ فَنِعْمَ عُقْبَى اَ۬لدّ۪ارِۖ","وَالذِينَ يَنقُضُونَ عَهْدَ اَ۬للَّهِ مِنۢ بَعْدِ مِيثَٰقِهِۦ وَيَقْطَعُونَ مَآ أَمَرَ اَ۬للَّهُ بِهِۦٓ أَنْ يُّوصَلَ وَيُفْسِدُونَ فِے اِ۬لَارْضِ أُوْلَٰٓئِكَ لَهُمُ اُ۬للَّعْنَةُ وَلَهُمْ سُوٓءُ اُ۬لدّ۪ارِۖ","اِ۬للَّهُ يَبْسُطُ اُ۬لرِّزْقَ لِمَنْ يَّشَآءُ وَيَقْدِرُۖ وَفَرِحُواْ بِالْحَيَوٰةِ اِ۬لدُّنْي۪اۖ وَمَا اَ۬لْحَيَوٰةُ اُ۬لدُّنْي۪ا فِے اِ۬لَاخِرَةِ إِلَّا مَتَٰعٞۖ","وَيَقُولُ اُ۬لذِينَ كَفَرُواْ لَوْلَآ أُنزِلَ عَلَيْهِ ءَايَةٞ مِّن رَّبِّهِۦۖ قُلِ اِنَّ اَ۬للَّهَ يُضِلُّ مَنْ يَّشَآءُ وَيَهْدِےٓ إِلَيْهِ مَنَ اَنَابَۖ","اَ۬لذِينَ ءَامَنُواْ وَتَطْمَئِنُّ قُلُوبُهُم بِذِكْرِ اِ۬للَّهِۖ أَلَا بِذِكْرِ اِ۬للَّهِ تَطْمَئِنُّ اُ۬لْقُلُوبُۖ","اُ۬لذِينَ ءَامَنُواْ وَعَمِلُواْ اُ۬لصَّٰلِحَٰتِ طُوب۪ىٰ لَهُمْ وَحُسْنُ مَـَٔابٖۖ","۞ كَذَٰلِكَ أَرْسَلْنَٰكَ فِےٓ أُمَّةٖ قَدْ خَلَتْ مِن قَبْلِهَآ أُمَمٞ لِّتَتْلُوَاْ عَلَيْهِمُ اُ۬لذِےٓ أَوْحَيْنَآ إِلَيْكَ وَهُمْ يَكْفُرُونَ بِالرَّحْمَٰنِۖ قُلْ هُوَ رَبِّےۖ لَآ إِلَٰهَ إِلَّا هُوَۖ عَلَيْهِ تَوَكَّلْتُۖ وَإِلَيْهِ مَتَابِۖ","وَلَوَ اَنَّ قُرْءَاناٗ سُيِّرَتْ بِهِ اِ۬لْجِبَالُ أَوْ قُطِّعَتْ بِهِ اِ۬لَارْضُ أَوْ كُلِّمَ بِهِ اِ۬لْمَوْت۪ىٰۖ بَل لِّلهِ اِ۬لَامْرُ جَمِيعاًۖ اَفَلَمْ يَاْيْـَٔسِ اِ۬لذِينَ ءَامَنُوٓاْ أَن لَّوْ يَشَآءُ اُ۬للَّهُ لَهَدَى اَ۬لنَّاسَ جَمِيعاٗۖ وَلَا يَزَالُ اُ۬لذِينَ كَفَرُواْ تُصِيبُهُم بِمَا صَنَعُواْ قَارِعَةٌ اَوْ تَحُلُّ قَرِيباٗ مِّن د۪ارِهِمْ حَتَّىٰ يَاتِيَ وَعْدُ اُ۬للَّهِۖ إِنَّ اَ۬للَّهَ لَا يُخْلِفُ اُ۬لْمِيعَادَۖ","وَلَقَدُ اُ۟سْتُهْزِۓَ بِرُسُلٖ مِّن قَبْلِكَ فَأَمْلَيْتُ لِلذِينَ كَفَرُواْ ثُمَّ أَخَذتُّهُمْۖ فَكَيْفَ كَانَ عِقَابِۖ","أَفَمَنْ هُوَ قَآئِمٌ عَلَىٰ كُلِّ نَفْسِۢ بِمَا كَسَبَتْۖ وَجَعَلُواْ لِلهِ شُرَكَآءَ قُلْ سَمُّوهُمُۥٓۖ أَمْ تُنَبِّـُٔونَهُۥ بِمَا لَا يَعْلَمُ فِے اِ۬لَارْضِ أَم بِظَٰهِرٖ مِّنَ اَ۬لْقَوْلِۖ بَلْ زُيِّنَ لِلذِينَ كَفَرُواْ مَكْرُهُمْ وَصَدُّواْ عَنِ اِ۬لسَّبِيلِۖ وَمَنْ يُّضْلِلِ اِ۬للَّهُ فَمَا لَهُۥ مِنْ هَادٖۖ","لَّهُمْ عَذَابٞ فِے اِ۬لْحَيَوٰةِ اِ۬لدُّنْي۪اۖ وَلَعَذَابُ اُ۬لَاخِرَةِ أَشَقُّۖ وَمَا لَهُم مِّنَ اَ۬للَّهِ مِنْ وَّاقٖۖ","۞ مَّثَلُ اُ۬لْجَنَّةِ اِ۬لتِے وُعِدَ اَ۬لْمُتَّقُونَ تَجْرِے مِن تَحْتِهَا اَ۬لَانْهَٰرُ أُكْلُهَا دَآئِمٞ وَظِلُّهَاۖ تِلْكَ عُقْبَى اَ۬لذِينَ اَ۪تَّقَواْۖ وَّعُقْبَى اَ۬لْكٰ۪فِرِينَ اَ۬لنَّارُۖ","وَالذِينَ ءَاتَيْنَٰهُمُ اُ۬لْكِتَٰبَ يَفْرَحُونَ بِمَآ أُنزِلَ إِلَيْكَۖ وَمِنَ اَ۬لَاحْزَابِ مَنْ يُّنكِرُ بَعْضَهُۥۖ قُلِ اِنَّمَآ أُمِرْتُ أَنَ اَعْبُدَ اَ۬للَّهَ وَلَآ أُشْرِكَ بِهِۦٓۖ إِلَيْهِ أَدْعُواْۖ وَإِلَيْهِ مَـَٔابِۖ","وَكَذَٰلِكَ أَنزَلْنَٰهُ حُكْماً عَرَبِيّاٗۖ وَلَئِنِ اِ۪تَّبَعْتَ أَهْوَآءَهُم بَعْدَ مَا جَآءَكَ مِنَ اَ۬لْعِلْمِ مَا لَكَ مِنَ اَ۬للَّهِ مِنْ وَّلِيّٖ وَلَا وَاقٖۖ","وَلَقَدَ اَرْسَلْنَا رُسُلاٗ مِّن قَبْلِكَ وَجَعَلْنَا لَهُمُۥٓ أَزْوَٰجاٗ وَذُرِّيَّةٗۖ وَمَا كَانَ لِرَسُولٍ اَنْ يَّاتِيَ بِـَٔايَةٍ اِلَّا بِإِذْنِ اِ۬للَّهِۖ لِكُلِّ أَجَلٖ كِتَابٞۖ","يَمْحُواْ اُ۬للَّهُ مَا يَشَآءُ وَيُثَبِّتُۖ وَعِندَهُۥٓ أُمُّ اُ۬لْكِتَٰبِۖ","وَإِن مَّا نُرِيَنَّكَ بَعْضَ اَ۬لذِے نَعِدُهُمُۥٓ أَوْ نَتَوَفَّيَنَّكَ فَإِنَّمَا عَلَيْكَ اَ۬لْبَلَٰغُ وَعَلَيْنَا اَ۬لْحِسَابُۖ","أَوَلَمْ يَرَوَاْ اَنَّا نَاتِے اِ۬لَارْضَ نَنقُصُهَا مِنَ اَطْرَافِهَاۖ وَاللَّهُ يَحْكُمُ لَا مُعَقِّبَ لِحُكْمِهِۦۖ وَهُوَ سَرِيعُ اُ۬لْحِسَابِۖ","وَقَدْ مَكَرَ اَ۬لذِينَ مِن قَبْلِهِمْ فَلِلهِ اِ۬لْمَكْرُ جَمِيعاٗۖ يَعْلَمُ مَا تَكْسِبُ كُلُّ نَفْسٖۖ وَسَيَعْلَمُ اُ۬لْكَٰفِرُ لِمَنْ عُقْبَى اَ۬لدّ۪ارِۖ","وَيَقُولُ اُ۬لذِينَ كَفَرُواْ لَسْتَ مُرْسَلاٗۖ قُلْ كَف۪ىٰ بِاللَّهِ شَهِيداَۢ بَيْنِے وَبَيْنَكُمْ وَمَنْ عِندَهُۥ عِلْمُ اُ۬لْكِتَٰبِۖ"]],["إبراهيم",["أَلَٓر۪ۖ كِتَٰبٌ اَنزَلْنَٰهُ إِلَيْكَ لِتُخْرِجَ اَ۬لنَّاسَ مِنَ اَ۬لظُّلُمَٰتِ إِلَى اَ۬لنُّورِ","بِإِذْنِ رَبِّهِمُۥٓ إِلَىٰ صِرَٰطِ اِ۬لْعَزِيزِ اِ۬لْحَمِيدِۖ","اِ۬للَّهُ اُ۬لذِے لَهُۥ مَا فِے اِ۬لسَّمَٰوَٰتِ وَمَا فِے اِ۬لَارْضِۖ وَوَيْلٞ لِّلْكٰ۪فِرِينَ مِنْ عَذَابٖ شَدِيدٍۖ","اِ۬لذِينَ يَسْتَحِبُّونَ اَ۬لْحَيَوٰةَ اَ۬لدُّنْي۪ا عَلَى اَ۬لَاخِرَةِ وَيَصُدُّونَ عَن سَبِيلِ اِ۬للَّهِ وَيَبْغُونَهَا عِوَجاً ا۟وْلَٰٓئِكَ فِے ضَلَٰلِۢ بَعِيدٖۖ","وَمَآ أَرْسَلْنَا مِن رَّسُولٍ اِلَّا بِلِسَانِ قَوْمِهِۦ لِيُبَيِّنَ لَهُمْۖ فَيُضِلُّ اُ۬للَّهُ مَنْ يَّشَآءُ وَيَهْدِے مَنْ يَّشَآءُۖ وَهُوَ اَ۬لْعَزِيزُ اُ۬لْحَكِيمُۖ","وَلَقَدَ اَرْسَلْنَا مُوس۪ىٰ بِـَٔايَٰتِنَآ أَنَ اَخْرِجْ قَوْمَكَ مِنَ اَ۬لظُّلُمَٰتِ إِلَى اَ۬لنُّورِ","وَذَكِّرْهُم بِأَييَّٰمِ اِ۬للَّهِۖ إِنَّ فِے ذَٰلِكَ لَأٓيَٰتٖ لِّكُلِّ صَبّ۪ارٖ شَكُورٖۖ","وَإِذْ قَالَ مُوس۪ىٰ لِقَوْمِهِ اِ۟ذْكُرُواْ نِعْمَةَ اَ۬للَّهِ عَلَيْكُمُۥٓ إِذَ اَنج۪يٰكُم مِّنَ اٰلِ فِرْعَوْنَ يَسُومُونَكُمْ سُوٓءَ اَ۬لْعَذَابِ وَيُذَبِّحُونَ أَبْنَآءَكُمْ وَيَسْتَحْيُونَ نِسَآءَكُمْۖ وَفِے ذَٰلِكُم بَلَآءٞ مِّن رَّبِّكُمْ عَظِيمٞۖ","وَإِذْ تَأَذَّنَ رَبُّكُمْ لَئِن شَكَرْتُمْ لَأَزِيدَنَّكُمْ وَلَئِن كَفَرْتُمُۥٓ إِنَّ عَذَابِے لَشَدِيدٞۖ","وَقَالَ مُوس۪ىٰٓ إِن تَكْفُرُوٓاْ أَنتُمْ وَمَن فِے اِ۬لَارْضِ جَمِيعاٗ فَإِنَّ اَ۬للَّهَ لَغَنِيٌّ حَمِيدٌۖ","اَلَمْ يَاتِكُمْ نَبَؤُاْ اُ۬لذِينَ مِن قَبْلِكُمْ قَوْمِ نُوحٖ وَعَادٖ وَثَمُودَ","وَالذِينَ مِنۢ بَعْدِهِمْۖ لَا يَعْلَمُهُمُۥٓ إِلَّا اَ۬للَّهُۖ جَآءَتْهُمْ رُسُلُهُم بِالْبَيِّنَٰتِ فَرَدُّوٓاْ أَيْدِيَهُمْ فِےٓ أَفْوَٰهِهِمْ وَقَالُوٓاْ إِنَّا كَفَرْنَا بِمَآ أُرْسِلْتُم بِهِۦ وَإِنَّا لَفِے شَكّٖ مِّمَّا تَدْعُونَنَآ إِلَيْهِ مُرِيبٖۖ","۞ قَالَتْ رُسُلُهُمُۥٓ أَفِے اِ۬للَّهِ شَكّٞ فَاطِرِ اِ۬لسَّمَٰوَٰتِ وَالَارْضِ يَدْعُوكُمْ لِيَغْفِرَ لَكُم مِّن ذُنُوبِكُمْ وَيُوَ۬خِّرَكُمُۥٓ إِلَىٰٓ أَجَلٖ مُّسَمّىٗۖ قَالُوٓاْ إِنَ اَنتُمُۥٓ إِلَّا بَشَرٞ مِّثْلُنَا تُرِيدُونَ أَن تَصُدُّونَا عَمَّا كَانَ يَعْبُدُ ءَابَآؤُنَا فَاتُونَا بِسُلْطَٰنٖ مُّبِينٖۖ","قَالَتْ لَهُمْ رُسُلُهُمُۥٓ إِن نَّحْنُ إِلَّا بَشَرٞ مِّثْلُكُمْ وَلَٰكِنَّ اَ۬للَّهَ يَمُنُّ عَلَىٰ مَنْ يَّشَآءُ مِنْ عِبَادِهِۦۖ وَمَا كَانَ لَنَآ أَن نَّاتِيَكُم بِسُلْطَٰنٍ اِلَّا بِإِذْنِ اِ۬للَّهِۖ وَعَلَى اَ۬للَّهِ فَلْيَتَوَكَّلِ اِ۬لْمُومِنُونَۖ","وَمَا لَنَآ أَلَّا نَتَوَكَّلَ عَلَى اَ۬للَّهِ وَقَدْ هَد۪يٰنَا سُبُلَنَاۖ وَلَنَصْبِرَنَّ عَلَىٰ مَآ ءَاذَيْتُمُونَاۖ وَعَلَى اَ۬للَّهِ فَلْيَتَوَكَّلِ اِ۬لْمُتَوَكِّلُونَۖ","وَقَالَ اَ۬لذِينَ كَفَرُواْ لِرُسُلِهِمْ لَنُخْرِجَنَّكُم مِّنَ اَرْضِنَآ أَوْ لَتَعُودُنَّ فِے مِلَّتِنَاۖ فَأَوْح۪ىٰٓ إِلَيْهِمْ رَبُّهُمْ لَنُهْلِكَنَّ اَ۬لظَّٰلِمِينَ","وَلَنُسْكِنَنَّكُمُ اُ۬لَارْضَ مِنۢ بَعْدِهِمْۖ ذَٰلِكَ لِمَنْ خَافَ مَقَامِے وَخَافَ وَعِيدِۖۦ","وَاسْتَفْتَحُواْۖ وَخَابَ كُلُّ جَبّ۪ارٍ عَنِيدٖ","مِّنْ وَّرَآئِهِۦ جَهَنَّمُ وَيُسْق۪ىٰ مِن مَّآءٖ صَدِيدٖ","يَتَجَرَّعُهُۥ وَلَا يَكَادُ يُسِيغُهُۥ وَيَاتِيهِ اِ۬لْمَوْتُ مِن كُلِّ مَكَانٖ وَمَا هُوَ بِمَيِّتٖ وَمِنْ وَّرَآئِهِۦ عَذَابٌ غَلِيظٞۖ","مَّثَلُ اُ۬لذِينَ كَفَرُواْ بِرَبِّهِمُۥٓۖ أَعْمَٰلُهُمْ كَرَمَادٍ اِ۪شْتَدَّتْ بِهِ اِ۬لرِّيَٰحُ فِے يَوْمٍ عَاصِفٖ لَّا يَقْدِرُونَ مِمَّا كَسَبُواْ عَلَىٰ شَےْءٖۖ ذَٰلِكَ هُوَ اَ۬لضَّلَٰلُ اُ۬لْبَعِيدُۖ","۞ أَلَمْ تَرَ أَنَّ اَ۬للَّهَ خَلَقَ اَ۬لسَّمَٰوَٰتِ وَالَارْضَ بِالْحَقِّۖ إِنْ يَّشَأْ يُذْهِبْكُمْ وَيَاتِ بِخَلْقٖ جَدِيدٖۖ وَمَا ذَٰلِكَ عَلَى اَ۬للَّهِ بِعَزِيزٖۖ","وَبَرَزُواْ لِلهِ جَمِيعاٗ فَقَالَ اَ۬لضُّعَفَٰٓؤُاْ لِلذِينَ اَ۪سْتَكْبَرُوٓاْ إِنَّا كُنَّا لَكُمْ تَبَعاٗ فَهَلَ اَنتُم مُّغْنُونَ عَنَّا مِنْ عَذَابِ اِ۬للَّهِ مِن شَےْءٖۖ قَالُواْ لَوْ هَد۪يٰنَا اَ۬للَّهُ لَهَدَيْنَٰكُمْۖ سَوَآءٌ عَلَيْنَآ أَجَزِعْنَآ أَمْ صَبَرْنَا مَا لَنَا مِن مَّحِيصٖۖ","وَقَالَ اَ۬لشَّيْطَٰنُ لَمَّا قُضِيَ اَ۬لَامْرُ إِنَّ اَ۬للَّهَ وَعَدَكُمْ وَعْدَ اَ۬لْحَقِّ وَوَعَدتُّكُمْ فَأَخْلَفْتُكُمْ وَمَا كَانَ لِے عَلَيْكُم مِّن سُلْطَٰنٍ اِلَّآ أَن دَعَوْتُكُمْ فَاسْتَجَبْتُمْ لِے فَلَا تَلُومُونِے وَلُومُوٓاْ أَنفُسَكُم مَّآ أَنَا بِمُصْرِخِكُمْ وَمَآ أَنتُم بِمُصْرِخِيَّ إِنِّے كَفَرْتُ بِمَآ أَشْرَكْتُمُونِ مِن قَبْلُۖ إِنَّ اَ۬لظَّٰلِمِينَ لَهُمْ عَذَابٌ اَلِيمٞۖ","وَأُدْخِلَ اَ۬لذِينَ ءَامَنُواْ وَعَمِلُواْ اُ۬لصَّٰلِحَٰتِ جَنَّٰتٖ تَجْرِے مِن تَحْتِهَا اَ۬لَانْهَٰرُ خَٰلِدِينَ فِيهَا بِإِذْنِ رَبِّهِمْۖ تَحِيَّتُهُمْ فِيهَا سَلَٰمٌۖ","اَلَمْ تَرَ كَيْفَ ضَرَبَ اَ۬للَّهُ مَثَلاٗ كَلِمَةٗ طَيِّبَةٗ كَشَجَرَةٖ طَيِّبَةٍ اَصْلُهَا ثَابِتٞ وَفَرْعُهَا فِے اِ۬لسَّمَآءِ","تُوتِےٓ أُكْلَهَا كُلَّ حِينِۢ بِإِذْنِ رَبِّهَاۖ وَيَضْرِبُ اُ۬للَّهُ اُ۬لَامْثَالَ لِلنَّاسِ لَعَلَّهُمْ يَتَذَكَّرُونَۖ","وَمَثَلُ كَلِمَةٍ خَبِيثَةٖ كَشَجَرَةٍ خَبِيثَةٍ اُ۟جْتُثَّتْ مِن فَوْقِ اِ۬لَارْضِ مَا لَهَا مِن قَر۪ارٖۖ","يُثَبِّتُ اُ۬للَّهُ اُ۬لذِينَ ءَامَنُواْ بِالْقَوْلِ اِ۬لثَّابِتِ فِے اِ۬لْحَيَوٰةِ اِ۬لدُّنْي۪ا وَفِے اِ۬لَاخِرَةِۖ وَيُضِلُّ اُ۬للَّهُ اُ۬لظَّٰلِمِينَۖ وَيَفْعَلُ اُ۬للَّهُ مَا يَشَآءُۖ","۞ اَ۬لَمْ تَرَ إِلَى اَ۬لذِينَ بَدَّلُواْ نِعْمَتَ اَ۬للَّهِ كُفْراٗ وَأَحَلُّواْ قَوْمَهُمْ دَارَ اَ۬لْبَو۪ارِ","جَهَنَّمَ يَصْلَوْنَهَاۖ وَبِيسَ اَ۬لْقَرَارُۖ","وَجَعَلُواْ لِلهِ أَندَاداٗ لِّيُضِلُّواْ عَن سَبِيلِهِۦۖ قُلْ تَمَتَّعُواْ فَإِنَّ مَصِيرَكُمُۥٓ إِلَى اَ۬لنّ۪ارِۖ","قُل لِّعِبَادِيَ اَ۬لذِينَ ءَامَنُواْ يُقِيمُواْ اُ۬لصَّلَوٰةَ وَيُنفِقُواْ مِمَّا رَزَقْنَٰهُمْ سِرّاٗ وَعَلَٰنِيَةٗ مِّن قَبْلِ أَنْ يَّاتِيَ يَوْمٞ لَّا بَيْعٞ فِيهِ وَلَا خِلَٰلٌۖ","اِ۬للَّهُ اُ۬لذِے خَلَقَ اَ۬لسَّمَٰوَٰتِ وَالَارْضَ وَأَنزَلَ مِنَ اَ۬لسَّمَآءِ مَآءٗ فَأَخْرَجَ بِهِۦ مِنَ اَ۬لثَّمَرَٰتِ رِزْقاٗ لَّكُمْۖ وَسَخَّرَ لَكُمُ اُ۬لْفُلْكَ لِتَجْرِيَ فِے اِ۬لْبَحْرِ بِأَمْرِهِۦۖ وَسَخَّرَ لَكُمُ اُ۬لَانْهَٰرَۖ","وَسَخَّرَ لَكُمُ اُ۬لشَّمْسَ وَالْقَمَرَ دَآئِبَيْنِۖ وَسَخَّرَ لَكُمُ اُ۬ليْلَ وَالنَّهَارَۖ","وَءَات۪يٰكُم مِّن كُلِّ مَا سَأَلْتُمُوهُۖ وَإِن تَعُدُّواْ نِعْمَتَ اَ۬للَّهِ لَا تُحْصُوهَآۖ إِنَّ اَ۬لِانسَٰنَ لَظَلُومٞ كَفَّارٞۖ","وَإِذْ قَالَ إِبْرَٰهِيمُ رَبِّ اِ۪جْعَلْ هَٰذَا اَ۬لْبَلَدَ ءَامِناٗ وَاجْنُبْنِے وَبَنِيَّ أَن نَّعْبُدَ اَ۬لَاصْنَامَۖ","رَبِّ إِنَّهُنَّ أَضْلَلْنَ كَثِيراٗ مِّنَ اَ۬لنَّاسِ فَمَن تَبِعَنِے فَإِنَّهُۥ مِنِّے وَمَنْ عَص۪انِے فَإِنَّكَ غَفُورٞ رَّحِيمٞۖ","رَّبَّنَآ إِنِّيَ أَسْكَنتُ مِن ذُرِّيَّتِے بِوَادٍ غَيْرِ ذِے زَرْعٍ عِندَ بَيْتِكَ اَ۬لْمُحَرَّمِۖ رَبَّنَا لِيُقِيمُواْ اُ۬لصَّلَوٰةَ فَاجْعَلَ اَفْـِٕدَةٗ مِّنَ اَ۬لنَّاسِ تَهْوِےٓ إِلَيْهِمْ وَارْزُقْهُم مِّنَ اَ۬لثَّمَرَٰتِ لَعَلَّهُمْ يَشْكُرُونَۖ","رَبَّنَآ إِنَّكَ تَعْلَمُ مَا نُخْفِے وَمَا نُعْلِنُۖ وَمَا يَخْف۪ىٰ عَلَى اَ۬للَّهِ مِن شَےْءٖ فِے اِ۬لَارْضِ وَلَا فِے اِ۬لسَّمَآءِۖ","۞ اِ۬لْحَمْدُ لِلهِ اِ۬لذِے وَهَبَ لِے عَلَى اَ۬لْكِبَرِ إِسْمَٰعِيلَ وَإِسْحَٰقَۖ إِنَّ رَبِّے لَسَمِيعُ اُ۬لدُّعَآءِۖ","رَبِّ اِ۪جْعَلْنِے مُقِيمَ اَ۬لصَّلَوٰةِ وَمِن ذُرِّيَّتِےۖ رَبَّنَا وَتَقَبَّلْ دُعَآءِۖۦ","رَبَّنَا اَ۪غْفِرْ لِے وَلِوَٰلِدَيَّ وَلِلْمُومِنِينَ يَوْمَ يَقُومُ اُ۬لْحِسَابُۖ","وَلَا تَحْسِبَنَّ اَ۬للَّهَ غَٰفِلاً عَمَّا يَعْمَلُ اُ۬لظَّٰلِمُونَۖ إِنَّمَا يُوَ۬خِّرُهُمْ لِيَوْمٖ تَشْخَصُ فِيهِ اِ۬لَابْصَٰرُ","مُهْطِعِينَ مُقْنِعِے رُءُوسِهِمْ لَا يَرْتَدُّ إِلَيْهِمْ طَرْفُهُمْ وَأَفْـِٕدَتُهُمْ هَوَآءٞۖ","وَأَنذِرِ اِ۬لنَّاسَ يَوْمَ يَاتِيهِمُ اُ۬لْعَذَابُ فَيَقُولُ اُ۬لذِينَ ظَلَمُواْ رَبَّنَآ أَخِّرْنَآ إِلَىٰٓ أَجَلٖ قَرِيبٖ نُّجِبْ دَعْوَتَكَ وَنَتَّبِعِ اِ۬لرُّسُلَۖ أَوَلَمْ تَكُونُوٓاْ أَقْسَمْتُم مِّن قَبْلُ مَا لَكُم مِّن زَوَالٖۖ","وَسَكَنتُمْ فِے مَسَٰكِنِ اِ۬لذِينَ ظَلَمُوٓاْ أَنفُسَهُمْ وَتَبَيَّنَ لَكُمْ كَيْفَ فَعَلْنَا بِهِمْ وَضَرَبْنَا لَكُمُ اُ۬لَامْثَالَۖ","وَقَدْ مَكَرُواْ مَكْرَهُمْۖ وَعِندَ اَ۬للَّهِ مَكْرُهُمْۖ وَإِن كَانَ مَكْرُهُمْ لِتَزُولَ مِنْهُ اُ۬لْجِبَالُۖ","فَلَا تَحْسِبَنَّ اَ۬للَّهَ مُخْلِفَ وَعْدِهِۦ رُسُلَهُۥٓۖ إِنَّ اَ۬للَّهَ عَزِيزٞ ذُو اُ۪نتِقَامٖۖ","يَوْمَ تُبَدَّلُ اُ۬لَارْضُ غَيْرَ اَ۬لَارْضِ وَالسَّمَٰوَٰتُۖ وَبَرَزُواْ لِلهِ اِ۬لْوَٰحِدِ اِ۬لْقَهّ۪ارِۖ","وَتَرَى اَ۬لْمُجْرِمِينَ يَوْمَئِذٖ مُّقَرَّنِينَ فِے اِ۬لَاصْفَادِ","سَرَابِيلُهُم مِّن قَطِرَانٖ وَتَغْش۪ىٰ وُجُوهَهُمُ اُ۬لنَّارُ","لِيَجْزِيَ اَ۬للَّهُ كُلَّ نَفْسٖ مَّا كَسَبَتِۖ اِنَّ اَ۬للَّهَ سَرِيعُ اُ۬لْحِسَابِۖ","هَٰذَا بَلَٰغٞ لِّلنَّاسِ وَلِيُنذَرُواْ بِهِۦ وَلِيَعْلَمُوٓاْ أَنَّمَا هُوَ إِلَٰهٞ وَٰحِدٞ وَلِيَذَّكَّرَ أُوْلُواْ اُ۬لَالْبَٰبِۖ"]],["الحجر",["أَلَٓر۪ۖ تِلْكَ ءَايَٰتُ اُ۬لْكِتَٰبِ وَقُرْءَانٖ مُّبِينٖۖ","رُّبَمَا يَوَدُّ اُ۬لذِينَ كَفَرُواْ لَوْ كَانُواْ مُسْلِمِينَۖ","ذَرْهُمْ يَاكُلُواْ وَيَتَمَتَّعُواْ وَيُلْهِهِمُ اُ۬لَامَلُۖ فَسَوْفَ يَعْلَمُونَۖ","وَمَآ أَهْلَكْنَا مِن قَرْيَةٍ اِلَّا وَلَهَا كِتَابٞ مَّعْلُومٞۖ","مَّا تَسْبِقُ مِنُ ا۟مَّةٍ اَجَلَهَا وَمَا يَسْتَٰخِرُونَۖ","وَقَالُواْ يَٰٓأَيُّهَا اَ۬لذِے نُزِّلَ عَلَيْهِ اِ۬لذِّكْرُ إِنَّكَ لَمَجْنُونٞ","لَّوْمَا تَاتِينَا بِالْمَلَٰٓئِكَةِ إِن كُنتَ مِنَ اَ۬لصَّٰدِقِينَۖ","مَا تَنَزَّلُ اُ۬لْمَلَٰٓئِكَةُ إِلَّا بِالْحَقِّۖ وَمَا كَانُوٓاْ إِذاٗ مُّنظَرِينَۖ","إِنَّا نَحْنُ نَزَّلْنَا اَ۬لذِّكْرَۖ وَإِنَّا لَهُۥ لَحَٰفِظُونَۖ","وَلَقَدَ اَرْسَلْنَا مِن قَبْلِكَ فِے شِيَعِ اِ۬لَاوَّلِينَۖ","وَمَا يَاتِيهِم مِّن رَّسُولٍ اِلَّا كَانُواْ بِهِۦ يَسْتَهْزِءُونَۖ","كَذَٰلِكَ نَسْلُكُهُۥ فِے قُلُوبِ اِ۬لْمُجْرِمِينَ","لَا يُومِنُونَ بِهِۦ وَقَدْ خَلَتْ سُنَّةُ اُ۬لَاوَّلِينَۖ","وَلَوْ فَتَحْنَا عَلَيْهِم بَاباٗ مِّنَ اَ۬لسَّمَآءِ فَظَلُّواْ فِيهِ يَعْرُجُونَ","لَقَالُوٓاْ إِنَّمَا سُكِّرَتَ اَبْصَٰرُنَا بَلْ نَحْنُ قَوْمٞ مَّسْحُورُونَۖ","وَلَقَدْ جَعَلْنَا فِے اِ۬لسَّمَآءِ بُرُوجاٗ وَزَيَّنَّٰهَا لِلنَّٰظِرِينَ","وَحَفِظْنَٰهَا مِن كُلِّ شَيْطَٰنٖ رَّجِيمٍ","اِلَّا مَنِ اِ۪سْتَرَقَ اَ۬لسَّمْعَ فَأَتْبَعَهُۥ شِهَابٞ مُّبِينٞۖ","وَالَارْضَ مَدَدْنَٰهَا وَأَلْقَيْنَا فِيهَا رَوَٰسِيَ وَأَنۢبَتْنَا فِيهَا مِن كُلِّ شَےْءٖ مَّوْزُونٖ","وَجَعَلْنَا لَكُمْ فِيهَا مَعَٰيِشَۖ وَمَن لَّسْتُمْ لَهُۥ بِرَٰزِقِينَۖ","وَإِن مِّن شَےْءٍ اِلَّا عِندَنَا خَزَآئِنُهُۥۖ وَمَا نُنَزِّلُهُۥٓ إِلَّا بِقَدَرٖ مَّعْلُومٖۖ","وَأَرْسَلْنَا اَ۬لرِّيَٰحَ لَوَٰقِحَ فَأَنزَلْنَا مِنَ اَ۬لسَّمَآءِ مَآءٗ فَأَسْقَيْنَٰكُمُوهُ وَمَآ أَنتُمْ لَهُۥ بِخَٰزِنِينَۖ","وَإِنَّا لَنَحْنُ نُحْيِۦ وَنُمِيتُ وَنَحْنُ اُ۬لْوَٰرِثُونَۖ","وَلَقَدْ عَلِمْنَا اَ۬لْمُسْتَقْدِمِينَ مِنكُمْ وَلَقَدْ عَلِمْنَا اَ۬لْمُسْتَٰخِرِينَۖ","وَإِنَّ رَبَّكَ هُوَ يَحْشُرُهُمُۥٓۖ إِنَّهُۥ حَكِيمٌ عَلِيمٞۖ","وَلَقَدْ خَلَقْنَا اَ۬لِانسَٰنَ مِن صَلْصَٰلٖ مِّنْ حَمَإٖ مَّسْنُونٖۖ","وَالْجَآنَّ خَلَقْنَٰهُ مِن قَبْلُ مِن نّ۪ارِ اِ۬لسَّمُومِۖ","وَإِذْ قَالَ رَبُّكَ لِلْمَلَٰٓئِكَةِ إِنِّے خَٰلِقُۢ بَشَراٗ مِّن صَلْصَٰلٖ مِّنْ حَمَإٖ مَّسْنُونٖ","فَإِذَا سَوَّيْتُهُۥ وَنَفَخْتُ فِيهِ مِن رُّوحِے فَقَعُواْ لَهُۥ سَٰجِدِينَۖ","فَسَجَدَ اَ۬لْمَلَٰٓئِكَةُ كُلُّهُمُۥٓ أَجْمَعُونَ","إِلَّآ إِبْلِيسَ أَب۪ىٰٓ أَنْ يَّكُونَ مَعَ اَ۬لسَّٰجِدِينَۖ","قَالَ يَٰٓإِبْلِيسُ مَا لَكَ أَلَّا تَكُونَ مَعَ اَ۬لسَّٰجِدِينَۖ","قَالَ لَمَ اَكُن لِّأَسْجُدَ لِبَشَرٍ خَلَقْتَهُۥ مِن صَلْصَٰلٖ مِّنْ حَمَإٖ مَّسْنُونٖۖ","قَالَ فَاخْرُجْ مِنْهَا فَإِنَّكَ رَجِيمٞ","وَإِنَّ عَلَيْكَ اَ۬للَّعْنَةَ إِلَىٰ يَوْمِ اِ۬لدِّينِۖ","قَالَ رَبِّ فَأَنظِرْنِےٓ إِلَىٰ يَوْمِ يُبْعَثُونَۖ","قَالَ فَإِنَّكَ مِنَ اَ۬لْمُنظَرِينَ","إِلَىٰ يَوْمِ اِ۬لْوَقْتِ اِ۬لْمَعْلُومِۖ","قَالَ رَبِّ بِمَآ أَغْوَيْتَنِے لَأُزَيِّنَنَّ لَهُمْ فِے اِ۬لَارْضِ وَلَأُغْوِيَنَّهُمُۥٓ أَجْمَعِينَ","إِلَّا عِبَادَكَ مِنْهُمُ اُ۬لْمُخْلَصِينَۖ","قَالَ هَٰذَا صِرَٰطٌ عَلَيَّ مُسْتَقِيمٌۖ","اِنَّ عِبَادِے لَيْسَ لَكَ عَلَيْهِمْ سُلْطَٰنٌ اِلَّا مَنِ اِ۪تَّبَعَكَ مِنَ اَ۬لْغَاوِينَۖ","وَإِنَّ جَهَنَّمَ لَمَوْعِدُهُمُۥٓ أَجْمَعِينَ","لَهَا سَبْعَةُ أَبْوَٰبٖۖ لِّكُلِّ بَابٖ مِّنْهُمْ جُزْءٞ مَّقْسُومٌۖ","اِنَّ اَ۬لْمُتَّقِينَ فِے جَنَّٰتٖ وَعُيُونٍ","اُ۟دْخُلُوهَا بِسَلَٰمٍ اٰمِنِينَۖ","وَنَزَعْنَا مَا فِے صُدُورِهِم مِّنْ غِلٍّۖ اِخْوَٰناً عَلَىٰ سُرُرٖ مُّتَقَٰبِلِينَۖ","لَا يَمَسُّهُمْ فِيهَا نَصَبٞۖ وَمَا هُم مِّنْهَا بِمُخْرَجِينَۖ","۞ نَبِّۓْ عِبَادِيَ أَنِّيَ أَنَا اَ۬لْغَفُورُ اُ۬لرَّحِيمُ","وَأَنَّ عَذَابِے هُوَ اَ۬لْعَذَابُ اُ۬لَالِيمُۖ","وَنَبِّئْهُمْ عَن ضَيْفِ إِبْرَٰهِيمَ","إِذْ دَخَلُواْ عَلَيْهِ فَقَالُواْ سَلَٰماٗۖ قَالَ إِنَّا مِنكُمْ وَجِلُونَۖ","قَالُواْ لَا تَوْجَلِ اِنَّا نُبَشِّرُكَ بِغُلَٰمٍ عَلِيمٖۖ","قَالَ أَبَشَّرْتُمُونِے عَلَىٰٓ أَن مَّسَّنِيَ اَ۬لْكِبَرُ فَبِمَ تُبَشِّرُونِۖ","قَالُواْ بَشَّرْنَٰكَ بِالْحَقِّ فَلَا تَكُن مِّنَ اَ۬لْقَٰنِطِينَۖ","قَالَ وَمَنْ يَّقْنَطُ مِن رَّحْمَةِ رَبِّهِۦٓ إِلَّا اَ۬لضَّآلُّونَۖ","قَالَ فَمَا خَطْبُكُمُۥٓ أَيُّهَا اَ۬لْمُرْسَلُونَۖ","قَالُوٓاْ إِنَّآ أُرْسِلْنَآ إِلَىٰ قَوْمٖ مُّجْرِمِينَ","إِلَّآ ءَالَ لُوطٍۖ اِنَّا لَمُنَجُّوهُمُۥٓ أَجْمَعِينَ","إِلَّا اَ۪مْرَأَتَهُۥ قَدَّرْنَآ إِنَّهَا لَمِنَ اَ۬لْغَٰبِرِينَۖ","فَلَمَّا جَآءَ ا۟لَ لُوطٍ اِ۬لْمُرْسَلُونَ","قَالَ إِنَّكُمْ قَوْمٞ مُّنكَرُونَۖ","قَالُواْ بَلْ جِئْنَٰكَ بِمَا كَانُواْ فِيهِ يَمْتَرُونَ","وَأَتَيْنَٰكَ بِالْحَقِّ وَإِنَّا لَصَٰدِقُونَۖ","فَاسْرِ بِأَهْلِكَ بِقِطْعٖ مِّنَ اَ۬ليْلِ وَاتَّبِعَ اَدْبَٰرَهُمْ وَلَا يَلْتَفِتْ مِنكُمُۥٓ أَحَدٞ وَامْضُواْ حَيْثُ تُومَرُونَۖ","وَقَضَيْنَآ إِلَيْهِ ذَٰلِكَ اَ۬لَامْرَ أَنَّ دَابِرَ هَٰٓؤُلَآءِ مَقْطُوعٞ مُّصْبِحِينَۖ","وَجَآءَ اهْلُ اُ۬لْمَدِينَةِ يَسْتَبْشِرُونَۖ","قَالَ إِنَّ هَٰٓؤُلَآءِ ضَيْفِے فَلَا تَفْضَحُونِۖ","وَاتَّقُواْ اُ۬للَّهَ وَلَا تُخْزُونِۖ","قَالُوٓاْ أَوَلَمْ نَنْهَكَ عَنِ اِ۬لْعَٰلَمِينَۖ","قَالَ هَٰٓؤُلَآءِ بَنَاتِيَ إِن كُنتُمْ فَٰعِلِينَۖ","لَعَمْرُكَ إِنَّهُمْ لَفِے سَكْرَتِهِمْ يَعْمَهُونَۖ","فَأَخَذَتْهُمُ اُ۬لصَّيْحَةُ مُشْرِقِينَ","فَجَعَلْنَا عَٰلِيَهَا سَافِلَهَا وَأَمْطَرْنَا عَلَيْهِمْ حِجَارَةٗ مِّن سِجِّيلٍۖ","اِنَّ فِے ذَٰلِكَ لَأٓيَٰتٖ لِّلْمُتَوَسِّمِينَۖ","وَإِنَّهَا لَبِسَبِيلٖ مُّقِيمٍۖ","اِنَّ فِے ذَٰلِكَ لَأٓيَةٗ لِّلْمُومِنِينَۖ","۞ وَإِن كَانَ أَصْحَٰبُ اُ۬لَايْكَةِ لَظَٰلِمِينَۖ","فَانتَقَمْنَا مِنْهُمْۖ وَإِنَّهُمَا لَبِإِمَامٖ مُّبِينٖۖ","وَلَقَدْ كَذَّبَ أَصْحَٰبُ اُ۬لْحِجْرِ اِ۬لْمُرْسَلِينَۖ","وَءَاتَيْنَٰهُمُۥٓ ءَايَٰتِنَا فَكَانُواْ عَنْهَا مُعْرِضِينَۖ","وَكَانُواْ يَنْحِتُونَ مِنَ اَ۬لْجِبَالِ بُيُوتاً اٰمِنِينَۖ","فَأَخَذَتْهُمُ اُ۬لصَّيْحَةُ مُصْبِحِينَۖ","فَمَآ أَغْن۪ىٰ عَنْهُم مَّا كَانُواْ يَكْسِبُونَۖ","وَمَا خَلَقْنَا اَ۬لسَّمَٰوَٰتِ وَالَارْضَ وَمَا بَيْنَهُمَآ إِلَّا بِالْحَقِّۖ وَإِنَّ اَ۬لسَّاعَةَ لَأٓتِيَةٞۖ فَاصْفَحِ اِ۬لصَّفْحَ اَ۬لْجَمِيلَۖ","إِنَّ رَبَّكَ هُوَ اَ۬لْخَلَّٰقُ اُ۬لْعَلِيمُۖ","وَلَقَدَ اٰتَيْنَٰكَ سَبْعاٗ مِّنَ اَ۬لْمَثَانِے وَالْقُرْءَانَ اَ۬لْعَظِيمَۖ","لَا تَمُدَّنَّ عَيْنَيْكَ إِلَىٰ مَا مَتَّعْنَا بِهِۦٓ أَزْوَٰجاٗ مِّنْهُمْۖ وَلَا تَحْزَنْ عَلَيْهِمْۖ وَاخْفِضْ جَنَاحَكَ لِلْمُومِنِينَۖ","وَقُلِ اِنِّيَ أَنَا اَ۬لنَّذِيرُ اُ۬لْمُبِينُ","كَمَآ أَنزَلْنَا عَلَى اَ۬لْمُقْتَسِمِينَ","اَ۬لذِينَ جَعَلُواْ اُ۬لْقُرْءَانَ عِضِينَۖ","فَوَرَبِّكَ لَنَسْـَٔلَنَّهُمُۥٓ أَجْمَعِينَ","عَمَّا كَانُواْ يَعْمَلُونَۖ","فَاصْدَعْ بِمَا تُومَرُۖ وَأَعْرِضْ عَنِ اِ۬لْمُشْرِكِينَۖ","إِنَّا كَفَيْنَٰكَ اَ۬لْمُسْتَهْزِءِينَ","اَ۬لذِينَ يَجْعَلُونَ مَعَ اَ۬للَّهِ إِلَٰهاً اٰخَرَۖ فَسَوْفَ يَعْلَمُونَۖ","وَلَقَدْ نَعْلَمُ أَنَّكَ يَضِيقُ صَدْرُكَ بِمَا يَقُولُونَۖ","فَسَبِّحْ بِحَمْدِ رَبِّكَ وَكُن مِّنَ اَ۬لسَّٰجِدِينَۖ","وَاعْبُدْ رَبَّكَ حَتَّىٰ يَاتِيَكَ اَ۬لْيَقِينُۖ"]],["النحل",["أَت۪ىٰٓ أَمْرُ اُ۬للَّهِ فَلَا تَسْتَعْجِلُوهُۖ سُبْحَٰنَهُۥ وَتَعَٰل۪ىٰ عَمَّا يُشْرِكُونَۖ","يُنَزِّلُ اُ۬لْمَلَٰٓئِكَةَ بِالرُّوحِ مِنَ اَمْرِهِۦ عَلَىٰ مَنْ يَّشَآءُ مِنْ عِبَادِهِۦٓ أَنَ اَنْذِرُوٓاْ أَنَّهُۥ لَآ إِلَٰهَ إِلَّآ أَنَا فَاتَّقُونِۖ","خَلَقَ اَ۬لسَّمَٰوَٰتِ وَالَارْضَ بِالْحَقِّۖ تَعَٰل۪ىٰ عَمَّا يُشْرِكُونَۖ","خَلَقَ اَ۬لِانسَٰنَ مِن نُّطْفَةٖ فَإِذَا هُوَ خَصِيمٞ مُّبِينٞۖ","وَالَانْعَٰمَ خَلَقَهَاۖ لَكُمْ فِيهَا دِفْءٞ وَمَنَٰفِعُ وَمِنْهَا تَاكُلُونَۖ","وَلَكُمْ فِيهَا جَمَالٌ حِينَ تُرِيحُونَ وَحِينَ تَسْرَحُونَۖ","وَتَحْمِلُ أَثْقَالَكُمُۥٓ إِلَىٰ بَلَدٖ لَّمْ تَكُونُواْ بَٰلِغِيهِ إِلَّا بِشِقِّ اِ۬لَانفُسِۖ إِنَّ رَبَّكُمْ لَرَءُوفٞ رَّحِيمٞۖ","وَالْخَيْلَ وَالْبِغَالَ وَالْحَمِيرَ لِتَرْكَبُوهَا وَزِينَةٗۖ وَيَخْلُقُ مَا لَا تَعْلَمُونَۖ","وَعَلَى اَ۬للَّهِ قَصْدُ اُ۬لسَّبِيلِ وَمِنْهَا جَآئِرٞۖ وَلَوْ شَآءَ لَهَد۪يٰكُمُۥٓ أَجْمَعِينَۖ","هُوَ اَ۬لذِےٓ أَنزَلَ مِنَ اَ۬لسَّمَآءِ مَآءٗ لَّكُم مِّنْهُ شَرَابٞ وَمِنْهُ شَجَرٞ فِيهِ تُسِيمُونَۖ","يُنۢبِتُ لَكُم بِهِ اِ۬لزَّرْعَ وَالزَّيْتُونَ وَالنَّخِيلَ وَالَاعْنَٰبَ وَمِن كُلِّ اِ۬لثَّمَرَٰتِۖ إِنَّ فِے ذَٰلِكَ لَأٓيَةٗ لِّقَوْمٖ يَتَفَكَّرُونَۖ","وَسَخَّرَ لَكُمُ اُ۬ليْلَ وَالنَّهَارَ وَالشَّمْسَ وَالْقَمَرَ وَالنُّجُومَ مُسَخَّرَٰتِۢ بِأَمْرِهِۦٓۖ إِنَّ فِے ذَٰلِكَ لَأٓيَٰتٖ لِّقَوْمٖ يَعْقِلُونَۖ","وَمَا ذَرَأَ لَكُمْ فِے اِ۬لَارْضِ مُخْتَلِفاً اَلْوَٰنُهُۥٓۖ إِنَّ فِے ذَٰلِكَ لَأٓيَةٗ لِّقَوْمٖ يَذَّكَّرُونَۖ","وَهُوَ اَ۬لذِے سَخَّرَ اَ۬لْبَحْرَ لِتَاكُلُواْ مِنْهُ لَحْماٗ طَرِيّاٗ وَتَسْتَخْرِجُواْ مِنْهُ حِلْيَةٗ تَلْبَسُونَهَاۖ وَتَرَى اَ۬لْفُلْكَ مَوَاخِرَ فِيهِ وَلِتَبْتَغُواْ مِن فَضْلِهِۦ وَلَعَلَّكُمْ تَشْكُرُونَۖ","۞ وَأَلْق۪ىٰ فِے اِ۬لَارْضِ رَوَٰسِيَ أَن تَمِيدَ بِكُمْ وَأَنْهَٰراٗ وَسُبُلاٗ لَّعَلَّكُمْ تَهْتَدُونَ","وَعَلَٰمَٰتٖۖ وَبِالنَّجْمِ هُمْ يَهْتَدُونَۖ","أَفَمَنْ يَّخْلُقُ كَمَن لَّا يَخْلُقُۖ أَفَلَا تَذَّكَّرُونَۖ","وَإِن تَعُدُّواْ نِعْمَةَ اَ۬للَّهِ لَا تُحْصُوهَآۖ إِنَّ اَ۬للَّهَ لَغَفُورٞ رَّحِيمٞۖ","وَاللَّهُ يَعْلَمُ مَا تُسِرُّونَ وَمَا تُعْلِنُونَۖ","وَالذِينَ تَدْعُونَ مِن دُونِ اِ۬للَّهِ لَا يَخْلُقُونَ شَئْاٗ وَهُمْ يُخْلَقُونَۖ","أَمْوَٰتٌ غَيْرُ أَحْيَآءٖۖ وَمَا يَشْعُرُونَ أَيَّانَ يُبْعَثُونَۖ","إِلَٰهُكُمُۥٓ إِلَٰهٞ وَٰحِدٞۖ فَالذِينَ لَا يُومِنُونَ بِالَاخِرَةِ قُلُوبُهُم مُّنكِرَةٞ وَهُم مُّسْتَكْبِرُونَۖ","لَا جَرَمَ أَنَّ اَ۬للَّهَ يَعْلَمُ مَا يُسِرُّونَ وَمَا يُعْلِنُونَۖ إِنَّهُۥ لَا يُحِبُّ اُ۬لْمُسْتَكْبِرِينَۖ","وَإِذَا قِيلَ لَهُم مَّاذَآ أَنزَلَ رَبُّكُمْ قَالُوٓاْ أَسَٰطِيرُ اُ۬لَاوَّلِينَ","لِيَحْمِلُوٓاْ أَوْزَارَهُمْ كَامِلَةٗ يَوْمَ اَ۬لْقِيَٰمَةِ وَمِنَ اَوْز۪ارِ اِ۬لذِينَ يُضِلُّونَهُم بِغَيْرِ عِلْمٍۖ اَلَا سَآءَ مَا يَزِرُونَۖ","قَدْ مَكَرَ اَ۬لذِينَ مِن قَبْلِهِمْ فَأَتَى اَ۬للَّهُ بُنْيَٰنَهُم مِّنَ اَ۬لْقَوَاعِدِ فَخَرَّ عَلَيْهِمُ اُ۬لسَّقْفُ مِن فَوْقِهِمْ وَأَت۪يٰهُمُ اُ۬لْعَذَابُ مِنْ حَيْثُ لَا يَشْعُرُونَۖ","ثُمَّ يَوْمَ اَ۬لْقِيَٰمَةِ يُخْزِيهِمْ وَيَقُولُ أَيْنَ شُرَكَآءِيَ اَ۬لذِينَ كُنتُمْ تُشَٰٓقُّونِ فِيهِمْۖ قَالَ اَ۬لذِينَ أُوتُواْ اُ۬لْعِلْمَ إِنَّ اَ۬لْخِزْيَ اَ۬لْيَوْمَ وَالسُّوٓءَ عَلَى اَ۬لْكٰ۪فِرِينَ","اَ۬لذِينَ تَتَوَفّ۪يٰهُمُ اُ۬لْمَلَٰٓئِكَةُ ظَالِمِےٓ أَنفُسِهِمْۖ فَأَلْقَوُاْ اُ۬لسَّلَمَ مَا كُنَّا نَعْمَلُ مِن سُوٓءِۢ بَل۪ىٰٓۖ إِنَّ اَ۬للَّهَ عَلِيمُۢ بِمَا كُنتُمْ تَعْمَلُونَۖ","فَادْخُلُوٓاْ أَبْوَٰبَ جَهَنَّمَ خَٰلِدِينَ فِيهَاۖ فَلَبِيسَ مَثْوَى اَ۬لْمُتَكَبِّرِينَۖ","۞ وَقِيلَ لِلذِينَ اَ۪تَّقَوْاْ مَاذَآ أَنزَلَ رَبُّكُمْ قَالُواْ خَيْراٗۖ لِّلذِينَ أَحْسَنُواْ فِے هَٰذِهِ اِ۬لدُّنْي۪ا حَسَنَةٞۖ وَلَدَارُ اُ۬لَاخِرَةِ خَيْرٞۖ وَلَنِعْمَ دَارُ اُ۬لْمُتَّقِينَۖ","جَنَّٰتُ عَدْنٖ يَدْخُلُونَهَا تَجْرِے مِن تَحْتِهَا اَ۬لَانْهَٰرُ لَهُمْ فِيهَا مَا يَشَآءُونَۖ كَذَٰلِكَ يَجْزِے اِ۬للَّهُ اُ۬لْمُتَّقِينَ","اَ۬لذِينَ تَتَوَفّ۪يٰهُمُ اُ۬لْمَلَٰٓئِكَةُ طَيِّبِينَۖ يَقُولُونَ سَلَٰمٌ عَلَيْكُمُ اُ۟دْخُلُواْ اُ۬لْجَنَّةَ بِمَا كُنتُمْ تَعْمَلُونَۖ","هَلْ يَنظُرُونَ إِلَّآ أَن تَاتِيَهُمُ اُ۬لْمَلَٰٓئِكَةُ أَوْ يَاتِيَ أَمْرُ رَبِّكَۖ كَذَٰلِكَ فَعَلَ اَ۬لذِينَ مِن قَبْلِهِمْۖ وَمَا ظَلَمَهُمُ اُ۬للَّهُۖ وَلَٰكِن كَانُوٓاْ أَنفُسَهُمْ يَظْلِمُونَۖ","فَأَصَابَهُمْ سَيِّـَٔاتُ مَا عَمِلُواْۖ وَحَاقَ بِهِم مَّا كَانُواْ بِهِۦ يَسْتَهْزِءُونَۖ","وَقَالَ اَ۬لذِينَ أَشْرَكُواْ لَوْ شَآءَ اَ۬للَّهُ مَا عَبَدْنَا مِن دُونِهِۦ مِن شَےْءٖ نَّحْنُ وَلَآ ءَابَآؤُنَا وَلَا حَرَّمْنَا مِن دُونِهِۦ مِن شَےْءٖۖ كَذَٰلِكَ فَعَلَ اَ۬لذِينَ مِن قَبْلِهِمْۖ فَهَلْ عَلَى اَ۬لرُّسُلِ إِلَّا اَ۬لْبَلَٰغُ اُ۬لْمُبِينُۖ","وَلَقَدْ بَعَثْنَا فِے كُلِّ أُمَّةٖ رَّسُولاً اَنُ اُ۟عْبُدُواْ اُ۬للَّهَ وَاجْتَنِبُواْ اُ۬لطَّٰغُوتَۖ فَمِنْهُم مَّنْ هَدَى اَ۬للَّهُۖ وَمِنْهُم مَّنْ حَقَّتْ عَلَيْهِ اِ۬لضَّلَٰلَةُۖ فَسِيرُواْ فِے اِ۬لَارْضِ فَانظُرُواْ كَيْفَ كَانَ عَٰقِبَةُ اُ۬لْمُكَذِّبِينَۖ","إِن تَحْرِصْ عَلَىٰ هُد۪يٰهُمْ فَإِنَّ اَ۬للَّهَ لَا يُهْد۪ىٰ مَنْ يُّضِلُّۖ وَمَا لَهُم مِّن نَّٰصِرِينَۖ","۞ وَأَقْسَمُواْ بِاللَّهِ جَهْدَ أَيْمَٰنِهِمْ لَا يَبْعَثُ اُ۬للَّهُ مَنْ يَّمُوتُۖ بَل۪ىٰ وَعْداً عَلَيْهِ حَقّاٗ وَلَٰكِنَّ أَكْثَرَ اَ۬لنَّاسِ لَا يَعْلَمُونَ","لِيُبَيِّنَ لَهُمُ اُ۬لذِے يَخْتَلِفُونَ فِيهِ وَلِيَعْلَمَ اَ۬لذِينَ كَفَرُوٓاْ أَنَّهُمْ كَانُواْ كَٰذِبِينَۖ","إِنَّمَا قَوْلُنَا لِشَےْءٍ اِذَآ أَرَدْنَٰهُ أَن نَّقُولَ لَهُۥ كُنۖ فَيَكُونُۖ","وَالذِينَ هَاجَرُواْ فِے اِ۬للَّهِ مِنۢ بَعْدِ مَا ظُلِمُواْ لَنُبَوِّئَنَّهُمْ فِے اِ۬لدُّنْي۪ا حَسَنَةٗۖ وَلَأَجْرُ اُ۬لَاخِرَةِ أَكْبَرُ لَوْ كَانُواْ يَعْلَمُونَۖ","اَ۬لذِينَ صَبَرُواْ وَعَلَىٰ رَبِّهِمْ يَتَوَكَّلُونَۖ","وَمَآ أَرْسَلْنَا مِن قَبْلِكَ إِلَّا رِجَالاٗ يُوح۪ىٰٓ إِلَيْهِمْ فَسْـَٔلُوٓاْ أَهْلَ اَ۬لذِّكْرِ إِن كُنتُمْ لَا تَعْلَمُونَ","بِالْبَيِّنَٰتِ وَالزُّبُرِۖ وَأَنزَلْنَآ إِلَيْكَ اَ۬لذِّكْرَ لِتُبَيِّنَ لِلنَّاسِ مَا نُزِّلَ إِلَيْهِمْ وَلَعَلَّهُمْ يَتَفَكَّرُونَۖ","أَفَأَمِنَ اَ۬لذِينَ مَكَرُواْ اُ۬لسَّيِّـَٔاتِ أَنْ يَّخْسِفَ اَ۬للَّهُ بِهِمُ اُ۬لَارْضَ أَوْ يَاتِيَهُمُ اُ۬لْعَذَابُ مِنْ حَيْثُ لَا يَشْعُرُونَ","أَوْ يَاخُذَهُمْ فِے تَقَلُّبِهِمْ فَمَا هُم بِمُعْجِزِينَ","أَوْ يَاخُذَهُمْ عَلَىٰ تَخَوُّفٖۖ فَإِنَّ رَبَّكُمْ لَرَءُوفٞ رَّحِيمٌۖ","اَوَلَمْ يَرَوِاْ اِلَىٰ مَا خَلَقَ اَ۬للَّهُ مِن شَےْءٖ يَتَفَيَّؤُاْ ظِلَٰلُهُۥ عَنِ اِ۬لْيَمِينِ وَالشَّمَآئِلِ سُجَّداٗ لِّلهِ وَهُمْ دَٰخِرُونَۖ","وَلِلهِ يَسْجُدُ مَا فِے اِ۬لسَّمَٰوَٰتِ وَمَا فِے اِ۬لَارْضِ مِن دَآبَّةٖ وَالْمَلَٰٓئِكَةُ وَهُمْ لَا يَسْتَكْبِرُونَ","يَخَافُونَ رَبَّهُم مِّن فَوْقِهِمْ وَيَفْعَلُونَ مَا يُومَرُونَۖ۩","۞ وَقَالَ اَ۬للَّهُ لَا تَتَّخِذُوٓاْ إِلَٰهَيْنِ اِ۪ثْنَيْنِۖ إِنَّمَا هُوَ إِلَٰهٞ وَٰحِدٞۖ فَإِيَّٰيَ فَارْهَبُونِۖ","وَلَهُۥ مَا فِے اِ۬لسَّمَٰوَٰتِ وَالَارْضِۖ وَلَهُ اُ۬لدِّينُ وَاصِباًۖ اَفَغَيْرَ اَ۬للَّهِ تَتَّقُونَۖ","وَمَا بِكُم مِّن نِّعْمَةٖ فَمِنَ اَ۬للَّهِۖ ثُمَّ إِذَا مَسَّكُمُ اُ۬لضُّرُّ فَإِلَيْهِ تَجْـَٔرُونَۖ","ثُمَّ إِذَا كَشَفَ اَ۬لضُّرَّ عَنكُمُۥٓ إِذَا فَرِيقٞ مِّنكُم بِرَبِّهِمْ يُشْرِكُونَ","لِيَكْفُرُواْ بِمَآ ءَاتَيْنَٰهُمْۖ فَتَمَتَّعُواْۖ فَسَوْفَ تَعْلَمُونَۖ","وَيَجْعَلُونَ لِمَا لَا يَعْلَمُونَ نَصِيباٗ مِّمَّا رَزَقْنَٰهُمْۖ تَاللَّهِ لَتُسْـَٔلُنَّ عَمَّا كُنتُمْ تَفْتَرُونَۖ","وَيَجْعَلُونَ لِلهِ اِ۬لْبَنَٰتِ سُبْحَٰنَهُۥۖ وَلَهُم مَّا يَشْتَهُونَۖ","وَإِذَا بُشِّرَ أَحَدُهُم بِالُانث۪ىٰ ظَلَّ وَجْهُهُۥ مُسْوَدّاٗ وَهُوَ كَظِيمٞ","يَتَوَٰر۪ىٰ مِنَ اَ۬لْقَوْمِ مِن سُوٓءِ مَا بُشِّرَ بِهِۦٓۖ أَيُمْسِكُهُۥ عَلَىٰ هُونٍ اَمْ يَدُسُّهُۥ فِے اِ۬لتُّرَابِۖ أَلَا سَآءَ مَا يَحْكُمُونَۖ","لِلذِينَ لَا يُومِنُونَ بِالَاخِرَةِ مَثَلُ اُ۬لسَّوْءِۖ وَلِلهِ اِ۬لْمَثَلُ اُ۬لَاعْل۪ىٰۖ وَهُوَ اَ۬لْعَزِيزُ اُ۬لْحَكِيمُۖ","وَلَوْ يُوَ۬اخِذُ اُ۬للَّهُ اُ۬لنَّاسَ بِظُلْمِهِم مَّا تَرَكَ عَلَيْهَا مِن دَآبَّةٖۖ وَلَٰكِنْ يُّوَ۬خِّرُهُمُۥٓ إِلَىٰٓ أَجَلٖ مُّسَمّىٗۖ فَإِذَا جَآءَ اجَلُهُمْ لَا يَسْتَٰخِرُونَ سَاعَةٗۖ وَلَا يَسْتَقْدِمُونَۖ","وَيَجْعَلُونَ لِلهِ مَا يَكْرَهُونَۖ وَتَصِفُ أَلْسِنَتُهُمُ اُ۬لْكَذِبَ أَنَّ لَهُمُ اُ۬لْحُسْن۪ىٰۖ لَا جَرَمَ أَنَّ لَهُمُ اُ۬لنَّارَ وَأَنَّهُم مُّفْرِطُونَۖ","۞ تَاللَّهِ لَقَدَ اَرْسَلْنَآ إِلَىٰٓ أُمَمٖ مِّن قَبْلِكَ فَزَيَّنَ لَهُمُ اُ۬لشَّيْطَٰنُ أَعْمَٰلَهُمْ فَهُوَ وَلِيُّهُمُ اُ۬لْيَوْمَۖ وَلَهُمْ عَذَابٌ اَلِيمٞۖ","وَمَآ أَنزَلْنَا عَلَيْكَ اَ۬لْكِتَٰبَ إِلَّا لِتُبَيِّنَ لَهُمُ اُ۬لذِے اِ۪خْتَلَفُواْ فِيهِ وَهُدىٗ وَرَحْمَةٗ لِّقَوْمٖ يُومِنُونَۖ","وَاللَّهُ أَنزَلَ مِنَ اَ۬لسَّمَآءِ مَآءٗ فَأَحْي۪ا بِهِ اِ۬لَارْضَ بَعْدَ مَوْتِهَآۖ إِنَّ فِے ذَٰلِكَ لَأٓيَةٗ لِّقَوْمٖ يَسْمَعُونَۖ","وَإِنَّ لَكُمْ فِے اِ۬لَانْعَٰمِ لَعِبْرَةٗۖ نَّسْقِيكُم مِّمَّا فِے بُطُونِهِۦ مِنۢ بَيْنِ فَرْثٖ وَدَمٖ لَّبَناً خَالِصاٗ سَآئِغاٗ لِّلشَّٰرِبِينَ","وَمِن ثَمَرَٰتِ اِ۬لنَّخِيلِ وَالَاعْنَٰبِ تَتَّخِذُونَ مِنْهُ سَكَراٗ وَرِزْقاً حَسَناًۖ اِنَّ فِے ذَٰلِكَ لَأٓيَةٗ لِّقَوْمٖ يَعْقِلُونَۖ","وَأَوْح۪ىٰ رَبُّكَ إِلَى اَ۬لنَّحْلِ أَنِ اِ۪تَّخِذِے مِنَ اَ۬لْجِبَالِ بُيُوتاٗ وَمِنَ اَ۬لشَّجَرِ وَمِمَّا يَعْرِشُونَ","ثُمَّ كُلِے مِن كُلِّ اِ۬لثَّمَرَٰتِ فَاسْلُكِے سُبُلَ رَبِّكِ ذُلُلاٗۖ يَخْرُجُ مِنۢ بُطُونِهَا شَرَابٞ مُّخْتَلِفٌ اَلْوَٰنُهُۥ فِيهِ شِفَآءٞ لِّلنَّاسِۖ إِنَّ فِے ذَٰلِكَ لَأٓيَةٗ لِّقَوْمٖ يَتَفَكَّرُونَۖ","وَاللَّهُ خَلَقَكُمْ ثُمَّ يَتَوَفّ۪يٰكُمْۖ وَمِنكُم مَّنْ يُّرَدُّ إِلَىٰٓ أَرْذَلِ اِ۬لْعُمُرِ لِكَےْ لَا يَعْلَمَ بَعْدَ عِلْمٖ شَئْاًۖ اِنَّ اَ۬للَّهَ عَلِيمٞ قَدِيرٞۖ","۞ وَاللَّهُ فَضَّلَ بَعْضَكُمْ عَلَىٰ بَعْضٖ فِے اِ۬لرِّزْقِۖ فَمَا اَ۬لذِينَ فُضِّلُواْ بِرَآدِّے رِزْقِهِمْ عَلَىٰ مَا مَلَكَتَ اَيْمَٰنُهُمْ فَهُمْ فِيهِ سَوَآءٌۖ اَفَبِنِعْمَةِ اِ۬للَّهِ يَجْحَدُونَۖ","وَاللَّهُ جَعَلَ لَكُم مِّنَ اَنفُسِكُمُۥٓ أَزْوَٰجاٗ وَجَعَلَ لَكُم مِّنَ اَزْوَٰجِكُم بَنِينَ وَحَفَدَةٗۖ وَرَزَقَكُم مِّنَ اَ۬لطَّيِّبَٰتِۖ أَفَبِالْبَٰطِلِ يُومِنُونَ وَبِنِعْمَتِ اِ۬للَّهِ هُمْ يَكْفُرُونَۖ","وَيَعْبُدُونَ مِن دُونِ اِ۬للَّهِ مَا لَا يَمْلِكُ لَهُمْ رِزْقاٗ مِّنَ اَ۬لسَّمَٰوَٰتِ وَالَارْضِ شَئْاٗ وَلَا يَسْتَطِيعُونَۖ","فَلَا تَضْرِبُواْ لِلهِ اِ۬لَامْثَالَۖ إِنَّ اَ۬للَّهَ يَعْلَمُۖ وَأَنتُمْ لَا تَعْلَمُونَۖ","ضَرَبَ اَ۬للَّهُ مَثَلاً عَبْداٗ مَّمْلُوكاٗ لَّا يَقْدِرُ عَلَىٰ شَےْءٖ وَمَن رَّزَقْنَٰهُ مِنَّا رِزْقاً حَسَناٗ فَهُوَ يُنفِقُ مِنْهُ سِرّاٗ وَجَهْراً هَلْ يَسْتَوُۥنَۖ اَ۬لْحَمْدُ لِلهِۖ بَلَ اَكْثَرُهُمْ لَا يَعْلَمُونَۖ","وَضَرَبَ اَ۬للَّهُ مَثَلاٗ رَّجُلَيْنِ أَحَدُهُمَآ أَبْكَمُ لَا يَقْدِرُ عَلَىٰ شَےْءٖ وَهُوَ كَلٌّ عَلَىٰ مَوْل۪يٰهُ أَيْنَمَا يُوَجِّههُّ لَا يَاتِ بِخَيْرٍ هَلْ يَسْتَوِے هُوَ وَمَنْ يَّامُرُ بِالْعَدْلِ وَهُوَ عَلَىٰ صِرَٰطٖ مُّسْتَقِيمٖۖ","وَلِلهِ غَيْبُ اُ۬لسَّمَٰوَٰتِ وَالَارْضِۖ وَمَآ أَمْرُ اُ۬لسَّاعَةِ إِلَّا كَلَمْحِ اِ۬لْبَصَرِ أَوْ هُوَ أَقْرَبُۖ إِنَّ اَ۬للَّهَ عَلَىٰ كُلِّ شَےْءٖ قَدِيرٞۖ","وَاللَّهُ أَخْرَجَكُم مِّنۢ بُطُونِ أُمَّهَٰتِكُمْ لَا تَعْلَمُونَ شَئْاٗۖ وَجَعَلَ لَكُمُ اُ۬لسَّمْعَ وَالَابْصَٰرَ وَالَافْـِٕدَةَ لَعَلَّكُمْ تَشْكُرُونَۖ","۞ أَلَمْ يَرَوِاْ اِلَى اَ۬لطَّيْرِ مُسَخَّرَٰتٖ فِے جَوِّ اِ۬لسَّمَآءِ مَا يُمْسِكُهُنَّ إِلَّا اَ۬للَّهُۖ إِنَّ فِے ذَٰلِكَ لَأٓيَٰتٖ لِّقَوْمٖ يُومِنُونَۖ","وَاللَّهُ جَعَلَ لَكُم مِّنۢ بُيُوتِكُمْ سَكَناٗ وَجَعَلَ لَكُم مِّن جُلُودِ اِ۬لَانْعَٰمِ بُيُوتاٗ تَسْتَخِفُّونَهَا يَوْمَ ظَعَنِكُمْ وَيَوْمَ إِقَامَتِكُمْۖ وَمِنَ اَصْوَافِهَا وَأَوْب۪ارِهَا وَأَشْع۪ارِهَآ أَثَٰثاٗ وَمَتَٰعاً اِلَىٰ حِينٖۖ","وَاللَّهُ جَعَلَ لَكُم مِّمَّا خَلَقَ ظِلَٰلاٗ وَجَعَلَ لَكُم مِّنَ اَ۬لْجِبَالِ أَكْنَٰناٗ وَجَعَلَ لَكُمْ سَرَٰبِيلَ تَقِيكُمُ اُ۬لْحَرَّ وَسَرَٰبِيلَ تَقِيكُم بَأْسَكُمْۖ كَذَٰلِكَ يُتِمُّ نِعْمَتَهُۥ عَلَيْكُمْ لَعَلَّكُمْ تُسْلِمُونَۖ","فَإِن تَوَلَّوْاْ فَإِنَّمَا عَلَيْكَ اَ۬لْبَلَٰغُ اُ۬لْمُبِينُۖ","يَعْرِفُونَ نِعْمَتَ اَ۬للَّهِ ثُمَّ يُنكِرُونَهَاۖ وَأَكْثَرُهُمُ اُ۬لْكَٰفِرُونَۖ","وَيَوْمَ نَبْعَثُ مِن كُلِّ أُمَّةٖ شَهِيداٗ ثُمَّ لَا يُوذَنُ لِلذِينَ كَفَرُواْ وَلَا هُمْ يُسْتَعْتَبُونَۖ","وَإِذَا رَءَا اَ۬لذِينَ ظَلَمُواْ اُ۬لْعَذَابَ فَلَا يُخَفَّفُ عَنْهُمْ وَلَا هُمْ يُنظَرُونَۖ","وَإِذَا رَءَا اَ۬لذِينَ أَشْرَكُواْ شُرَكَآءَهُمْ قَالُواْ رَبَّنَا هَٰٓؤُلَآءِ شُرَكَآؤُنَا اَ۬لذِينَ كُنَّا نَدْعُواْ مِن دُونِكَۖ فَأَلْقَوِاْ اِلَيْهِمُ اُ۬لْقَوْلَ إِنَّكُمْ لَكَٰذِبُونَۖ","وَأَلْقَوِاْ اِلَى اَ۬للَّهِ يَوْمَئِذٍ اِ۬لسَّلَمَۖ وَضَلَّ عَنْهُم مَّا كَانُواْ يَفْتَرُونَۖ","اَ۬لذِينَ كَفَرُواْ وَصَدُّواْ عَن سَبِيلِ اِ۬للَّهِ زِدْنَٰهُمْ عَذَاباٗ فَوْقَ اَ۬لْعَذَابِ بِمَا كَانُواْ يُفْسِدُونَۖ","وَيَوْمَ نَبْعَثُ فِے كُلِّ أُمَّةٖ شَهِيداً عَلَيْهِم مِّنَ اَنفُسِهِمْ وَجِئْنَا بِكَ شَهِيداً عَلَىٰ هَٰٓؤُلَآءِۖ وَنَزَّلْنَا عَلَيْكَ اَ۬لْكِتَٰبَ تِبْيَٰناٗ لِّكُلِّ شَےْءٖ وَهُدىٗ وَرَحْمَةٗ وَبُشْر۪ىٰ لِلْمُسْلِمِينَۖ","۞ إِنَّ اَ۬للَّهَ يَامُرُ بِالْعَدْلِ وَالِاحْسَٰنِ وَإِيتَآءِےْ ذِے اِ۬لْقُرْب۪ىٰۖ وَيَنْه۪ىٰ عَنِ اِ۬لْفَحْشَآءِ وَالْمُنكَرِ وَالْبَغْيِۖ يَعِظُكُمْ لَعَلَّكُمْ تَذَّكَّرُونَۖ","وَأَوْفُواْ بِعَهْدِ اِ۬للَّهِ إِذَا عَٰهَدتُّمْۖ وَلَا تَنقُضُواْ اُ۬لَايْمَٰنَ بَعْدَ تَوْكِيدِهَا وَقَدْ جَعَلْتُمُ اُ۬للَّهَ عَلَيْكُمْ كَفِيلاًۖ اِنَّ اَ۬للَّهَ يَعْلَمُ مَا تَفْعَلُونَۖ","وَلَا تَكُونُواْ كَالتِے نَقَضَتْ غَزْلَهَا مِنۢ بَعْدِ قُوَّةٍ اَنكَٰثاٗ تَتَّخِذُونَ أَيْمَٰنَكُمْ دَخَلاَۢ بَيْنَكُمُۥٓ أَن تَكُونَ أُمَّةٌ هِيَ أَرْب۪ىٰ مِنُ ا۟مَّةٍۖ اِنَّمَا يَبْلُوكُمُ اُ۬للَّهُ بِهِۦۖ وَلَيُبَيِّنَنَّ لَكُمْ يَوْمَ اَ۬لْقِيَٰمَةِ مَا كُنتُمْ فِيهِ تَخْتَلِفُونَۖ","وَلَوْ شَآءَ اَ۬للَّهُ لَجَعَلَكُمُۥٓ أُمَّةٗ وَٰحِدَةٗۖ وَلَٰكِنْ يُّضِلُّ مَنْ يَّشَآءُ وَيَهْدِے مَنْ يَّشَآءُۖ وَلَتُسْـَٔلُنَّ عَمَّا كُنتُمْ تَعْمَلُونَۖ","وَلَا تَتَّخِذُوٓاْ أَيْمَٰنَكُمْ دَخَلاَۢ بَيْنَكُمْ فَتَزِلَّ قَدَمُۢ بَعْدَ ثُبُوتِهَا وَتَذُوقُواْ اُ۬لسُّوٓءَ بِمَا صَدَدتُّمْ عَن سَبِيلِ اِ۬للَّهِ وَلَكُمْ عَذَابٌ عَظِيمٞۖ","وَلَا تَشْتَرُواْ بِعَهْدِ اِ۬للَّهِ ثَمَناٗ قَلِيلاًۖ اِنَّمَا عِندَ اَ۬للَّهِ هُوَ خَيْرٞ لَّكُمُۥٓ إِن كُنتُمْ تَعْلَمُونَۖ","مَا عِندَكُمْ يَنفَدُۖ وَمَا عِندَ اَ۬للَّهِ بَاقٖۖ وَلَيَجْزِيَنَّ اَ۬لذِينَ صَبَرُوٓاْ أَجْرَهُم بِأَحْسَنِ مَا كَانُواْ يَعْمَلُونَۖ","مَنْ عَمِلَ صَٰلِحاٗ مِّن ذَكَرٍ اَوُ ا۟نث۪ىٰ وَهُوَ مُومِنٞ فَلَنُحْيِيَنَّهُۥ حَيَوٰةٗ طَيِّبَةٗ وَلَنَجْزِيَنَّهُمُۥٓ أَجْرَهُم بِأَحْسَنِ مَا كَانُواْ يَعْمَلُونَۖ","۞ فَإِذَا قَرَأْتَ اَ۬لْقُرْءَانَ فَاسْتَعِذْ بِاللَّهِ مِنَ اَ۬لشَّيْطَٰنِ اِ۬لرَّجِيمِۖ","إِنَّهُۥ لَيْسَ لَهُۥ سُلْطَٰنٌ عَلَى اَ۬لذِينَ ءَامَنُواْ وَعَلَىٰ رَبِّهِمْ يَتَوَكَّلُونَۖ","إِنَّمَا سُلْطَٰنُهُۥ عَلَى اَ۬لذِينَ يَتَوَلَّوْنَهُۥ وَالذِينَ هُم بِهِۦ مُشْرِكُونَۖ","وَإِذَا بَدَّلْنَآ ءَايَةٗ مَّكَانَ ءَايَةٖ وَاللَّهُ أَعْلَمُ بِمَا يُنَزِّلُ قَالُوٓاْ إِنَّمَآ أَنتَ مُفْتَرِۢۖ بَلَ اَكْثَرُهُمْ لَا يَعْلَمُونَۖ","قُلْ نَزَّلَهُۥ رُوحُ اُ۬لْقُدُسِ مِن رَّبِّكَ بِالْحَقِّ لِيُثَبِّتَ اَ۬لذِينَ ءَامَنُواْ وَهُدىٗ وَبُشْر۪ىٰ لِلْمُسْلِمِينَۖ","وَلَقَدْ نَعْلَمُ أَنَّهُمْ يَقُولُونَ إِنَّمَا يُعَلِّمُهُۥ بَشَرٞۖ لِّسَانُ اُ۬لذِے يُلْحِدُونَ إِلَيْهِ أَعْجَمِيّٞ وَهَٰذَا لِسَانٌ عَرَبِيّٞ مُّبِينٌۖ","اِنَّ اَ۬لذِينَ لَا يُومِنُونَ بِـَٔايَٰتِ اِ۬للَّهِ لَا يَهْدِيهِمُ اُ۬للَّهُۖ وَلَهُمْ عَذَابٌ اَلِيمٌۖ","اِنَّمَا يَفْتَرِے اِ۬لْكَذِبَ اَ۬لذِينَ لَا يُومِنُونَ بِـَٔايَٰتِ اِ۬للَّهِۖ وَأُوْلَٰٓئِكَ هُمُ اُ۬لْكَٰذِبُونَۖ","مَن كَفَرَ بِاللَّهِ مِنۢ بَعْدِ إِيمَٰنِهِۦٓ إِلَّا مَنُ ا۟كْرِهَ وَقَلْبُهُۥ مُطْمَئِنُّۢ بِالِايمَٰنِۖ وَلَٰكِن مَّن شَرَحَ بِالْكُفْرِ صَدْراٗ فَعَلَيْهِمْ غَضَبٞ مِّنَ اَ۬للَّهِۖ وَلَهُمْ عَذَابٌ عَظِيمٞۖ","ذَٰلِكَ بِأَنَّهُمُ اُ۪سْتَحَبُّواْ اُ۬لْحَيَوٰةَ اَ۬لدُّنْي۪ا عَلَى اَ۬لَاخِرَةِ وَأَنَّ اَ۬للَّهَ لَا يَهْدِے اِ۬لْقَوْمَ اَ۬لْكٰ۪فِرِينَۖ","أُوْلَٰٓئِكَ اَ۬لذِينَ طَبَعَ اَ۬للَّهُ عَلَىٰ قُلُوبِهِمْ وَسَمْعِهِمْ وَأَبْصٰ۪رِهِمْۖ وَأُوْلَٰٓئِكَ هُمُ اُ۬لْغَٰفِلُونَۖ","لَا جَرَمَ أَنَّهُمْ فِے اِ۬لَاخِرَةِ هُمُ اُ۬لْخَٰسِرُونَۖ","ثُمَّ إِنَّ رَبَّكَ لِلذِينَ هَاجَرُواْ مِنۢ بَعْدِ مَا فُتِنُواْ ثُمَّ جَٰهَدُواْ وَصَبَرُوٓاْ إِنَّ رَبَّكَ مِنۢ بَعْدِهَا لَغَفُورٞ رَّحِيمٞۖ","۞ يَوْمَ تَاتِے كُلُّ نَفْسٖ تُجَٰدِلُ عَن نَّفْسِهَا وَتُوَفّ۪ىٰ كُلُّ نَفْسٖ مَّا عَمِلَتْ وَهُمْ لَا يُظْلَمُونَۖ","وَضَرَبَ اَ۬للَّهُ مَثَلاٗ قَرْيَةٗ كَانَتَ اٰمِنَةٗ مُّطْمَئِنَّةٗ يَاتِيهَا رِزْقُهَا رَغَداٗ مِّن كُلِّ مَكَانٖ فَكَفَرَتْ بِأَنْعُمِ اِ۬للَّهِ فَأَذَاقَهَا اَ۬للَّهُ لِبَاسَ اَ۬لْجُوعِ وَالْخَوْفِ بِمَا كَانُواْ يَصْنَعُونَۖ","وَلَقَدْ جَآءَهُمْ رَسُولٞ مِّنْهُمْ فَكَذَّبُوهُ فَأَخَذَهُمُ اُ۬لْعَذَابُ وَهُمْ ظَٰلِمُونَۖ","فَكُلُواْ مِمَّا رَزَقَكُمُ اُ۬للَّهُ حَلَٰلاٗ طَيِّباٗۖ وَاشْكُرُواْ نِعْمَتَ اَ۬للَّهِ إِن كُنتُمُۥٓ إِيَّاهُ تَعْبُدُونَۖ","إِنَّمَا حَرَّمَ عَلَيْكُمُ اُ۬لْمَيْتَةَ وَالدَّمَ وَلَحْمَ اَ۬لْخِنزِيرِ وَمَآ أُهِلَّ لِغَيْرِ اِ۬للَّهِ بِهِۦۖ فَمَنُ اُ۟ضْطُرَّ غَيْرَ بَاغٖ وَلَا عَادٖ فَإِنَّ اَ۬للَّهَ غَفُورٞ رَّحِيمٞۖ","وَلَا تَقُولُواْ لِمَا تَصِفُ أَلْسِنَتُكُمُ اُ۬لْكَذِبَ هَٰذَا حَلَٰلٞ وَهَٰذَا حَرَامٞ لِّتَفْتَرُواْ عَلَى اَ۬للَّهِ اِ۬لْكَذِبَۖ إِنَّ اَ۬لذِينَ يَفْتَرُونَ عَلَى اَ۬للَّهِ اِ۬لْكَذِبَ لَا يُفْلِحُونَۖ","مَتَٰعٞ قَلِيلٞۖ وَلَهُمْ عَذَابٌ اَلِيمٞۖ","وَعَلَى اَ۬لذِينَ هَادُواْ حَرَّمْنَا مَا قَصَصْنَا عَلَيْكَ مِن قَبْلُۖ وَمَا ظَلَمْنَٰهُمْۖ وَلَٰكِن كَانُوٓاْ أَنفُسَهُمْ يَظْلِمُونَۖ","ثُمَّ إِنَّ رَبَّكَ لِلذِينَ عَمِلُواْ اُ۬لسُّوٓءَ بِجَهَٰلَةٖ ثُمَّ تَابُواْ مِنۢ بَعْدِ ذَٰلِكَ وَأَصْلَحُوٓاْ إِنَّ رَبَّكَ مِنۢ بَعْدِهَا لَغَفُورٞ رَّحِيمٌۖ","۞ اِنَّ إِبْرَٰهِيمَ كَانَ أُمَّةٗ قَانِتاٗ لِّلهِ حَنِيفاٗ وَلَمْ يَكُ مِنَ اَ۬لْمُشْرِكِينَۖ","شَاكِراٗ لِّأَنْعُمِهِۖ اِ۪جْتَب۪يٰهُ وَهَد۪يٰهُ إِلَىٰ صِرَٰطٖ مُّسْتَقِيمٖۖ","وَءَاتَيْنَٰهُ فِے اِ۬لدُّنْي۪ا حَسَنَةٗۖ وَإِنَّهُۥ فِے اِ۬لَاخِرَةِ لَمِنَ اَ۬لصَّٰلِحِينَۖ","ثُمَّ أَوْحَيْنَآ إِلَيْكَ أَنِ اِ۪تَّبِعْ مِلَّةَ إِبْرَٰهِيمَ حَنِيفاٗۖ وَمَا كَانَ مِنَ اَ۬لْمُشْرِكِينَۖ","إِنَّمَا جُعِلَ اَ۬لسَّبْتُ عَلَى اَ۬لذِينَ اَ۪خْتَلَفُواْ فِيهِۖ وَإِنَّ رَبَّكَ لَيَحْكُمُ بَيْنَهُمْ يَوْمَ اَ۬لْقِيَٰمَةِ فِيمَا كَانُواْ فِيهِ يَخْتَلِفُونَۖ","اَ۟دْعُ إِلَىٰ سَبِيلِ رَبِّكَ بِالْحِكْمَةِ وَالْمَوْعِظَةِ اِ۬لْحَسَنَةِ وَجَٰدِلْهُم بِالتِے هِيَ أَحْسَنُۖ إِنَّ رَبَّكَ هُوَ أَعْلَمُ بِمَن ضَلَّ عَن سَبِيلِهِۖۦ وَهُوَ أَعْلَمُ بِالْمُهْتَدِينَۖ","وَإِنْ عَاقَبْتُمْ فَعَاقِبُواْ بِمِثْلِ مَا عُوقِبْتُم بِهِۦۖ وَلَئِن صَبَرْتُمْ لَهُوَ خَيْرٞ لِّلصَّٰبِرِينَۖ","وَاصْبِرْۖ وَمَا صَبْرُكَ إِلَّا بِاللَّهِۖ وَلَا تَحْزَنْ عَلَيْهِمْ وَلَا تَكُ فِے ضَيْقٖ مِّمَّا يَمْكُرُونَۖ","إِنَّ اَ۬للَّهَ مَعَ اَ۬لذِينَ اَ۪تَّقَواْ وَّالذِينَ هُم مُّحْسِنُونَۖ"]],["الإسراء",["سُبْحَٰنَ اَ۬لذِےٓ أَسْر۪ىٰ بِعَبْدِهِۦ لَيْلاٗ مِّنَ اَ۬لْمَسْجِدِ اِ۬لْحَرَامِ إِلَى اَ۬لْمَسْجِدِ اِ۬لَاقْصَا اَ۬لذِے بَٰرَكْنَا حَوْلَهُۥ لِنُرِيَهُۥ مِنَ اٰيَٰتِنَآۖ إِنَّهُۥ هُوَ اَ۬لسَّمِيعُ اُ۬لْبَصِيرُۖ","وَءَاتَيْنَا مُوسَى اَ۬لْكِتَٰبَ وَجَعَلْنَٰهُ هُدىٗ لِّبَنِےٓ إِسْرَآءِيلَ أَلَّا تَتَّخِذُواْ مِن دُونِے وَكِيلاٗ","ذُرِّيَّةَ مَنْ حَمَلْنَا مَعَ نُوحٍۖ اِنَّهُۥ كَانَ عَبْداٗ شَكُوراٗۖ","وَقَضَيْنَآ إِلَىٰ بَنِےٓ إِسْرَآءِيلَ فِے اِ۬لْكِتَٰبِ لَتُفْسِدُنَّ فِے اِ۬لَارْضِ مَرَّتَيْنِ وَلَتَعْلُنَّ عُلُوّاٗ كَبِيراٗۖ","فَإِذَا جَآءَ وَعْدُ أُول۪يٰهُمَا بَعَثْنَا عَلَيْكُمْ عِبَاداٗ لَّنَآ أُوْلِے بَأْسٖ شَدِيدٖ فَجَاسُواْ خِلَٰلَ اَ۬لدِّي۪ارِۖ وَكَانَ وَعْداٗ مَّفْعُولاٗۖ","ثُمَّ رَدَدْنَا لَكُمُ اُ۬لْكَرَّةَ عَلَيْهِمْ وَأَمْدَدْنَٰكُم بِأَمْوَٰلٖ وَبَنِينَ وَجَعَلْنَٰكُمُۥٓ أَكْثَرَ نَفِيراًۖ","اِنَ اَحْسَنتُمُۥٓ أَحْسَنتُمْ لِأَنفُسِكُمْۖ وَإِنَ اَسَأْتُمْ فَلَهَاۖ فَإِذَا جَآءَ وَعْدُ اُ۬لَاخِرَةِ لِيَسُـُٔواْ وُجُوهَكُمْ وَلِيَدْخُلُواْ اُ۬لْمَسْجِدَ كَمَا دَخَلُوهُ أَوَّلَ مَرَّةٖ وَلِيُتَبِّرُواْ مَا عَلَوْاْ تَتْبِيراًۖ","عَس۪ىٰ رَبُّكُمُۥٓ أَنْ يَّرْحَمَكُمْۖ وَإِنْ عُدتُّمْ عُدْنَاۖ وَجَعَلْنَا جَهَنَّمَ لِلْكٰ۪فِرِينَ حَصِيراًۖ","اِنَّ هَٰذَا اَ۬لْقُرْءَانَ يَهْدِے لِلتِے هِيَ أَقْوَمُ وَيُبَشِّرُ اُ۬لْمُومِنِينَ اَ۬لذِينَ يَعْمَلُونَ اَ۬لصَّٰلِحَٰتِ أَنَّ لَهُمُۥٓ أَجْراٗ كَبِيراٗ","وَأَنَّ اَ۬لذِينَ لَا يُومِنُونَ بِالَاخِرَةِ أَعْتَدْنَا لَهُمْ عَذَاباً اَلِيماٗۖ","۞ وَيَدْعُ اُ۬لِانسَٰنُ بِالشَّرِّ دُعَآءَهُۥ بِالْخَيْرِۖ وَكَانَ اَ۬لِانسَٰنُ عَجُولاٗۖ","وَجَعَلْنَا اَ۬ليْلَ وَالنَّهَارَ ءَايَتَيْنِ فَمَحَوْنَآ ءَايَةَ اَ۬ليْلِ وَجَعَلْنَآ ءَايَةَ اَ۬لنَّه۪ارِ مُبْصِرَةٗ لِّتَبْتَغُواْ فَضْلاٗ مِّن رَّبِّكُمْ وَلِتَعْلَمُواْ عَدَدَ اَ۬لسِّنِينَ وَالْحِسَابَۖ وَكُلَّ شَےْءٖ فَصَّلْنَٰهُ تَفْصِيلاٗۖ","وَكُلَّ إِنسَٰنٍ اَلْزَمْنَٰهُ طَٰٓئِرَهُۥ فِے عُنُقِهِۦ وَنُخْرِجُ لَهُۥ يَوْمَ اَ۬لْقِيَٰمَةِ كِتَٰباٗ يَلْق۪يٰهُ مَنشُوراًۖ","اِ۪قْرَأْ كِتَٰبَكَ كَف۪ىٰ بِنَفْسِكَ اَ۬لْيَوْمَ عَلَيْكَ حَسِيباٗۖ","مَّنِ اِ۪هْتَد۪ىٰ فَإِنَّمَا يَهْتَدِے لِنَفْسِهِۦۖ وَمَن ضَلَّ فَإِنَّمَا يَضِلُّ عَلَيْهَاۖ وَلَا تَزِرُ وَازِرَةٞ وِزْرَ أُخْر۪ىٰۖ وَمَا كُنَّا مُعَذِّبِينَ حَتَّىٰ نَبْعَثَ رَسُولاٗۖ","وَإِذَآ أَرَدْنَآ أَن نُّهْلِكَ قَرْيَةً اَمَرْنَا مُتْرَفِيهَا فَفَسَقُواْ فِيهَا فَحَقَّ عَلَيْهَا اَ۬لْقَوْلُ فَدَمَّرْنَٰهَا تَدْمِيراٗۖ","وَكَمَ اَهْلَكْنَا مِنَ اَ۬لْقُرُونِ مِنۢ بَعْدِ نُوحٖۖ وَكَف۪ىٰ بِرَبِّكَ بِذُنُوبِ عِبَادِهِۦ خَبِيراَۢ بَصِيراٗۖ","مَّن كَانَ يُرِيدُ اُ۬لْعَاجِلَةَ عَجَّلْنَا لَهُۥ فِيهَا مَا نَشَآءُ لِمَن نُّرِيدُ ثُمَّ جَعَلْنَا لَهُۥ جَهَنَّمَ يَصْلَيٰهَا مَذْمُوماٗ مَّدْحُوراٗۖ","وَمَنَ اَرَادَ اَ۬لَاخِرَةَ وَسَع۪ىٰ لَهَا سَعْيَهَا وَهُوَ مُومِنٞ فَأُوْلَٰٓئِكَ كَانَ سَعْيُهُم مَّشْكُوراٗۖ","كُلّاٗ نُّمِدُّۖ هَٰٓؤُلَآءِ وَهَٰٓؤُلَآءِ مِنْ عَطَآءِ رَبِّكَۖ وَمَا كَانَ عَطَآءُ رَبِّكَ مَحْظُوراًۖ","اُ۟نظُرْ كَيْفَ فَضَّلْنَا بَعْضَهُمْ عَلَىٰ بَعْضٖۖ وَلَلَاخِرَةُ أَكْبَرُ دَرَجَٰتٖ وَأَكْبَرُ تَفْضِيلاٗۖ","لَّا تَجْعَلْ مَعَ اَ۬للَّهِ إِلَٰهاً اٰخَرَ فَتَقْعُدَ مَذْمُوماٗ مَّخْذُولاٗۖ","۞ وَقَض۪ىٰ رَبُّكَ أَلَّا تَعْبُدُوٓاْ إِلَّآ إِيَّاهُۖ وَبِالْوَٰلِدَيْنِ إِحْسَٰناًۖ اِمَّا يَبْلُغَنَّ عِندَكَ اَ۬لْكِبَرَ أَحَدُهُمَآ أَوْ كِلَاهُمَا فَلَا تَقُل لَّهُمَآ أُفّٖ وَلَا تَنْهَرْهُمَاۖ وَقُل لَّهُمَا قَوْلاٗ كَرِيماٗۖ","وَاخْفِضْ لَهُمَا جَنَاحَ اَ۬لذُّلِّ مِنَ اَ۬لرَّحْمَةِۖ وَقُل رَّبِّ اِ۪رْحَمْهُمَا كَمَا رَبَّيَٰنِے صَغِيراٗۖ","رَّبُّكُمُۥٓ أَعْلَمُ بِمَا فِے نُفُوسِكُمُۥٓۖ إِن تَكُونُواْ صَٰلِحِينَ فَإِنَّهُۥ كَانَ لِلَاوَّٰبِينَ غَفُوراٗۖ","وَءَاتِ ذَا اَ۬لْقُرْب۪ىٰ حَقَّهُۥ وَالْمِسْكِينَ وَابْنَ اَ۬لسَّبِيلِۖ وَلَا تُبَذِّرْ تَبْذِيراًۖ","اِنَّ اَ۬لْمُبَذِّرِينَ كَانُوٓاْ إِخْوَٰنَ اَ۬لشَّيَٰطِينِۖ وَكَانَ اَ۬لشَّيْطَٰنُ لِرَبِّهِۦ كَفُوراٗۖ","وَإِمَّا تُعْرِضَنَّ عَنْهُمُ اُ۪بْتِغَآءَ رَحْمَةٖ مِّن رَّبِّكَ تَرْجُوهَا فَقُل لَّهُمْ قَوْلاٗ مَّيْسُوراٗۖ","وَلَا تَجْعَلْ يَدَكَ مَغْلُولَةً اِلَىٰ عُنُقِكَ وَلَا تَبْسُطْهَا كُلَّ اَ۬لْبَسْطِ فَتَقْعُدَ مَلُوماٗ مَّحْسُوراًۖ","اِنَّ رَبَّكَ يَبْسُطُ اُ۬لرِّزْقَ لِمَنْ يَّشَآءُ وَيَقْدِرُۖ إِنَّهُۥ كَانَ بِعِبَادِهِۦ خَبِيراَۢ بَصِيراٗۖ","وَلَا تَقْتُلُوٓاْ أَوْلَٰدَكُمْ خَشْيَةَ إِمْلَٰقٖۖ نَّحْنُ نَرْزُقُهُمْ وَإِيَّاكُمُۥٓۖ إِنَّ قَتْلَهُمْ كَانَ خِطْـٔاٗ كَبِيراٗۖ","وَلَا تَقْرَبُواْ اُ۬لزِّن۪ىٰٓ إِنَّهُۥ كَانَ فَٰحِشَةٗ وَسَآءَ سَبِيلاٗۖ","وَلَا تَقْتُلُواْ اُ۬لنَّفْسَ اَ۬لتِے حَرَّمَ اَ۬للَّهُ إِلَّا بِالْحَقِّۖ وَمَن قُتِلَ مَظْلُوماٗ فَقَدْ جَعَلْنَا لِوَلِيِّهِۦ سُلْطَٰناٗ فَلَا يُسْرِف فِّے اِ۬لْقَتْلِۖ إِنَّهُۥ كَانَ مَنصُوراٗۖ","وَلَا تَقْرَبُواْ مَالَ اَ۬لْيَتِيمِ إِلَّا بِالتِے هِيَ أَحْسَنُ حَتَّىٰ يَبْلُغَ أَشُدَّهُۥۖ وَأَوْفُواْ بِالْعَهْدِۖ إِنَّ اَ۬لْعَهْدَ كَانَ مَسْـُٔولاٗۖ","وَأَوْفُواْ اُ۬لْكَيْلَ إِذَا كِلْتُمْ وَزِنُواْ بِالْقُسْطَاسِ اِ۬لْمُسْتَقِيمِۖ ذَٰلِكَ خَيْرٞ وَأَحْسَنُ تَاوِيلاٗۖ","۞ وَلَا تَقْفُ مَا لَيْسَ لَكَ بِهِۦ عِلْمٌۖ اِنَّ اَ۬لسَّمْعَ وَالْبَصَرَ وَالْفُؤَادَ كُلُّ أُوْلَٰٓئِكَ كَانَ عَنْهُ مَسْـُٔولاٗۖ","وَلَا تَمْشِ فِے اِ۬لَارْضِ مَرَحاًۖ اِنَّكَ لَن تَخْرِقَ اَ۬لَارْضَ وَلَن تَبْلُغَ اَ۬لْجِبَالَ طُولاٗۖ","كُلُّ ذَٰلِكَ كَانَ سَيِّئَةً عِندَ رَبِّكَ مَكْرُوهاٗۖ","ذَٰلِكَ مِمَّآ أَوْح۪ىٰٓ إِلَيْكَ رَبُّكَ مِنَ اَ۬لْحِكْمَةِۖ وَلَا تَجْعَلْ مَعَ اَ۬للَّهِ إِلَٰهاً اٰخَرَ فَتُلْق۪ىٰ فِے جَهَنَّمَ مَلُوماٗ مَّدْحُوراًۖ","اَفَأَصْف۪يٰكُمْ رَبُّكُم بِالْبَنِينَ وَاتَّخَذَ مِنَ اَ۬لْمَلَٰٓئِكَةِ إِنَٰثاًۖ اِنَّكُمْ لَتَقُولُونَ قَوْلاً عَظِيماٗۖ","وَلَقَدْ صَرَّفْنَا فِے هَٰذَا اَ۬لْقُرْءَانِ لِيَذَّكَّرُواْ وَمَا يَزِيدُهُمُۥٓ إِلَّا نُفُوراٗۖ","قُل لَّوْ كَانَ مَعَهُۥٓ ءَالِهَةٞ كَمَا تَقُولُونَ إِذاٗ لَّابْتَغَوِاْ اِلَىٰ ذِے اِ۬لْعَرْشِ سَبِيلاٗۖ","سُبْحَٰنَهُۥ وَتَعَٰل۪ىٰ عَمَّا يَقُولُونَ عُلُوّاٗ كَبِيراٗۖ","يُسَبِّحُ لَهُ اُ۬لسَّمَٰوَٰتُ اُ۬لسَّبْعُ وَالَارْضُ وَمَن فِيهِنَّۖ وَإِن مِّن شَےْءٍ اِلَّا يُسَبِّحُ بِحَمْدِهِۦۖ وَلَٰكِن لَّا تَفْقَهُونَ تَسْبِيحَهُمُۥٓۖ إِنَّهُۥ كَانَ حَلِيماً غَفُوراٗۖ","وَإِذَا قَرَأْتَ اَ۬لْقُرْءَانَ جَعَلْنَا بَيْنَكَ وَبَيْنَ اَ۬لذِينَ لَا يُومِنُونَ بِالَاخِرَةِ حِجَاباٗ مَّسْتُوراٗۖ","وَجَعَلْنَا عَلَىٰ قُلُوبِهِمُۥٓ أَكِنَّةً اَنْ يَّفْقَهُوهُ وَفِےٓ ءَاذَانِهِمْ وَقْراٗۖ وَإِذَا ذَكَرْتَ رَبَّكَ فِے اِ۬لْقُرْءَانِ وَحْدَهُۥ وَلَّوْاْ عَلَىٰٓ أَدْبٰ۪رِهِمْ نُفُوراٗۖ","نَّحْنُ أَعْلَمُ بِمَا يَسْتَمِعُونَ بِهِۦٓ إِذْ يَسْتَمِعُونَ إِلَيْكَ وَإِذْ هُمْ نَجْو۪ىٰٓ إِذْ يَقُولُ اُ۬لظَّٰلِمُونَ إِن تَتَّبِعُونَ إِلَّا رَجُلاٗ مَّسْحُوراًۖ","اُ۟نظُرْ كَيْفَ ضَرَبُواْ لَكَ اَ۬لَامْثَالَ فَضَلُّواْۖ فَلَا يَسْتَطِيعُونَ سَبِيلاٗۖ","وَقَالُوٓاْ أَ۟ذَا كُنَّا عِظَٰماٗ وَرُفَٰتاً اِنَّا لَمَبْعُوثُونَ خَلْقاٗ جَدِيداٗۖ","۞ قُلْ كُونُواْ حِجَارَةً اَوْ حَدِيداً","اَوْ خَلْقاٗ مِّمَّا يَكْبُرُ فِے صُدُورِكُمْۖ فَسَيَقُولُونَ مَنْ يُّعِيدُنَاۖ قُلِ اِ۬لذِے فَطَرَكُمُۥٓ أَوَّلَ مَرَّةٖۖ فَسَيُنْغِضُونَ إِلَيْكَ رُءُوسَهُمْ وَيَقُولُونَ مَت۪ىٰ هُوَۖ قُلْ عَس۪ىٰٓ أَنْ يَّكُونَ قَرِيباٗۖ","يَوْمَ يَدْعُوكُمْ فَتَسْتَجِيبُونَ بِحَمْدِهِۦ وَتَظُنُّونَ إِن لَّبِثْتُمُۥٓ إِلَّا قَلِيلاٗۖ","وَقُل لِّعِبَادِے يَقُولُواْ اُ۬لتِے هِيَ أَحْسَنُۖ إِنَّ اَ۬لشَّيْطَٰنَ يَنزَغُ بَيْنَهُمُۥٓۖ إِنَّ اَ۬لشَّيْطَٰنَ كَانَ لِلِانسَٰنِ عَدُوّاٗ مُّبِيناٗۖ","رَّبُّكُمُۥٓ أَعْلَمُ بِكُمُۥٓۖ إِنْ يَّشَأْ يَرْحَمْكُمُۥٓ أَوِ اِنْ يَّشَأْ يُعَذِّبْكُمْۖ وَمَآ أَرْسَلْنَٰكَ عَلَيْهِمْ وَكِيلاٗۖ","وَرَبُّكَ أَعْلَمُ بِمَن فِے اِ۬لسَّمَٰوَٰتِ وَالَارْضِۖ وَلَقَدْ فَضَّلْنَا بَعْضَ اَ۬لنَّبِيٓـِٕۧنَ عَلَىٰ بَعْضٖ وَءَاتَيْنَا دَاوُۥدَ زَبُوراٗۖ","قُلُ اُ۟دْعُواْ اُ۬لذِينَ زَعَمْتُم مِّن دُونِهِۦ فَلَا يَمْلِكُونَ كَشْفَ اَ۬لضُّرِّ عَنكُمْ وَلَا تَحْوِيلاًۖ","ا۟وْلَٰٓئِكَ اَ۬لذِينَ يَدْعُونَ يَبْتَغُونَ إِلَىٰ رَبِّهِمُ اُ۬لْوَسِيلَةَ أَيُّهُمُۥٓ أَقْرَبُ وَيَرْجُونَ رَحْمَتَهُۥ وَيَخَافُونَ عَذَابَهُۥٓۖ إِنَّ عَذَابَ رَبِّكَ كَانَ مَحْذُوراٗۖ","وَإِن مِّن قَرْيَةٍ اِلَّا نَحْنُ مُهْلِكُوهَا قَبْلَ يَوْمِ اِ۬لْقِيَٰمَةِ أَوْ مُعَذِّبُوهَا عَذَاباٗ شَدِيداٗۖ كَانَ ذَٰلِكَ فِے اِ۬لْكِتَٰبِ مَسْطُوراٗۖ","وَمَا مَنَعَنَآ أَن نُّرْسِلَ بِالَايَٰتِ إِلَّآ أَن كَذَّبَ بِهَا اَ۬لَاوَّلُونَۖ وَءَاتَيْنَا ثَمُودَ اَ۬لنَّاقَةَ مُبْصِرَةٗ فَظَلَمُواْ بِهَاۖ وَمَا نُرْسِلُ بِالَايَٰتِ إِلَّا تَخْوِيفاٗۖ","وَإِذْ قُلْنَا لَكَ إِنَّ رَبَّكَ أَحَاطَ بِالنَّاسِۖ وَمَا جَعَلْنَا اَ۬لرُّءْيَا اَ۬لتِےٓ أَرَيْنَٰكَ إِلَّا فِتْنَةٗ لِّلنَّاسِ وَالشَّجَرَةَ اَ۬لْمَلْعُونَةَ فِے اِ۬لْقُرْءَانِۖ وَنُخَوِّفُهُمْ فَمَا يَزِيدُهُمُۥٓ إِلَّا طُغْيَٰناٗ كَبِيراٗۖ","۞ وَإِذْ قُلْنَا لِلْمَلَٰٓئِكَةِ اِ۟سْجُدُواْ لِأٓدَمَ فَسَجَدُوٓاْۖ إِلَّآ إِبْلِيسَ قَالَ ءَآسْجُدُ لِمَنْ خَلَقْتَ طِيناٗۖ","قَالَ أَرَٰٓيْتَكَ هَٰذَا اَ۬لذِے كَرَّمْتَ عَلَيَّ لَئِنَ اَخَّرْتَنِۦٓ إِلَىٰ يَوْمِ اِ۬لْقِيَٰمَةِ لَأَحْتَنِكَنَّ ذُرِّيَّتَهُۥٓ إِلَّا قَلِيلاٗۖ","قَالَ اَ۪ذْهَبْ فَمَن تَبِعَكَ مِنْهُمْ فَإِنَّ جَهَنَّمَ جَزَآؤُكُمْ جَزَآءٗ مَّوْفُوراٗۖ","وَاسْتَفْزِزْ مَنِ اِ۪سْتَطَعْتَ مِنْهُم بِصَوْتِكَ وَأَجْلِبْ عَلَيْهِم بِخَيْلِكَ وَرَجْلِكَ وَشَارِكْهُمْ فِے اِ۬لَامْوَٰلِ وَالَاوْلَٰدِ وَعِدْهُمْۖ وَمَا يَعِدُهُمُ اُ۬لشَّيْطَٰنُ إِلَّا غُرُوراًۖ","اِنَّ عِبَادِے لَيْسَ لَكَ عَلَيْهِمْ سُلْطَٰنٞۖ وَكَف۪ىٰ بِرَبِّكَ وَكِيلاٗۖ","رَّبُّكُمُ اُ۬لذِے يُزْجِے لَكُمُ اُ۬لْفُلْكَ فِے اِ۬لْبَحْرِ لِتَبْتَغُواْ مِن فَضْلِهِۦٓۖ إِنَّهُۥ كَانَ بِكُمْ رَحِيماٗۖ","وَإِذَا مَسَّكُمُ اُ۬لضُّرُّ فِے اِ۬لْبَحْرِ ضَلَّ مَن تَدْعُونَ إِلَّآ إِيَّاهُۖ فَلَمَّا نَجّ۪يٰكُمُۥٓ إِلَى اَ۬لْبَرِّ أَعْرَضْتُمْۖ وَكَانَ اَ۬لِانسَٰنُ كَفُوراًۖ","اَفَأَمِنتُمُۥٓ أَنْ يَّخْسِفَ بِكُمْ جَانِبَ اَ۬لْبَرِّ أَوْ يُرْسِلَ عَلَيْكُمْ حَاصِباٗ ثُمَّ لَا تَجِدُواْ لَكُمْ وَكِيلاً","اَمَ اَمِنتُمُۥٓ أَنْ يُّعِيدَكُمْ فِيهِ تَارَةً ا۟خْر۪ىٰ فَيُرْسِلَ عَلَيْكُمْ قَاصِفاٗ مِّنَ اَ۬لرِّيحِ فَيُغْرِقَكُم بِمَا كَفَرْتُمْ ثُمَّ لَا تَجِدُواْ لَكُمْ عَلَيْنَا بِهِۦ تَبِيعاٗۖ","۞ وَلَقَدْ كَرَّمْنَا بَنِےٓ ءَادَمَ وَحَمَلْنَٰهُمْ فِے اِ۬لْبَرِّ وَالْبَحْرِ وَرَزَقْنَٰهُم مِّنَ اَ۬لطَّيِّبَٰتِ وَفَضَّلْنَٰهُمْ عَلَىٰ كَثِيرٖ مِّمَّنْ خَلَقْنَا تَفْضِيلاٗۖ","يَوْمَ نَدْعُواْ كُلَّ أُنَاسِۢ بِإِمَٰمِهِمْۖ فَمَنُ ا۟وتِيَ كِتَٰبَهُۥ بِيَمِينِهِۦ فَأُوْلَٰٓئِكَ يَقْرَءُونَ كِتَٰبَهُمْ وَلَا يُظْلَمُونَ فَتِيلاٗۖ","وَمَن كَانَ فِے هَٰذِهِۦٓ أَعْم۪ىٰ فَهُوَ فِے اِ۬لَاخِرَةِ أَعْم۪ىٰ وَأَضَلُّ سَبِيلاٗۖ","وَإِن كَادُواْ لَيَفْتِنُونَكَ عَنِ اِ۬لذِےٓ أَوْحَيْنَآ إِلَيْكَ لِتَفْتَرِيَ عَلَيْنَا غَيْرَهُۥۖ وَإِذاٗ لَّاتَّخَذُوكَ خَلِيلاٗۖ","وَلَوْلَآ أَن ثَبَّتْنَٰكَ لَقَدْ كِدتَّ تَرْكَنُ إِلَيْهِمْ شَئْاٗ قَلِيلاًۖ","اِذاٗ لَّأَذَقْنَٰكَ ضِعْفَ اَ۬لْحَيَوٰةِ وَضِعْفَ اَ۬لْمَمَاتِ ثُمَّ لَا تَجِدُ لَكَ عَلَيْنَا نَصِيراٗۖ","وَإِن كَادُواْ لَيَسْتَفِزُّونَكَ مِنَ اَ۬لَارْضِ لِيُخْرِجُوكَ مِنْهَاۖ وَإِذاٗ لَّا يَلْبَثُونَ خَلْفَكَ إِلَّا قَلِيلاٗۖ","سُنَّةَ مَن قَدَ اَرْسَلْنَا قَبْلَكَ مِن رُّسُلِنَاۖ وَلَا تَجِدُ لِسُنَّتِنَا تَحْوِيلاًۖ","اَقِمِ اِ۬لصَّلَوٰةَ لِدُلُوكِ اِ۬لشَّمْسِ إِلَىٰ غَسَقِ اِ۬ليْلِ وَقُرْءَانَ اَ۬لْفَجْرِۖ إِنَّ قُرْءَانَ اَ۬لْفَجْرِ كَانَ مَشْهُوداٗۖ","وَمِنَ اَ۬ليْلِ فَتَهَجَّدْ بِهِۦ نَافِلَةٗ لَّكَ عَس۪ىٰٓ أَنْ يَّبْعَثَكَ رَبُّكَ مَقَاماٗ مَّحْمُوداٗۖ","وَقُل رَّبِّ أَدْخِلْنِے مُدْخَلَ صِدْقٖ وَأَخْرِجْنِے مُخْرَجَ صِدْقٖ وَاجْعَل لِّے مِن لَّدُنكَ سُلْطَٰناٗ نَّصِيراٗۖ","وَقُلْ جَآءَ اَ۬لْحَقُّ وَزَهَقَ اَ۬لْبَٰطِلُۖ إِنَّ اَ۬لْبَٰطِلَ كَانَ زَهُوقاٗۖ","وَنُنَزِّلُ مِنَ اَ۬لْقُرْءَانِ مَا هُوَ شِفَآءٞ وَرَحْمَةٞ لِّلْمُومِنِينَۖ وَلَا يَزِيدُ اُ۬لظَّٰلِمِينَ إِلَّا خَسَاراٗۖ","وَإِذَآ أَنْعَمْنَا عَلَى اَ۬لِانسَٰنِ أَعْرَضَ وَنَـ۪ٔا بِجَانِبِهِۦۖ وَإِذَا مَسَّهُ اُ۬لشَّرُّ كَانَ يَـُٔوساٗۖ","قُلْ كُلّٞ يَعْمَلُ عَلَىٰ شَاكِلَتِهِۦ فَرَبُّكُمُۥٓ أَعْلَمُ بِمَنْ هُوَ أَهْد۪ىٰ سَبِيلاٗۖ","۞ وَيَسْـَٔلُونَكَ عَنِ اِ۬لرُّوحِۖ قُلِ اِ۬لرُّوحُ مِنَ اَمْرِ رَبِّے وَمَآ أُوتِيتُم مِّنَ اَ۬لْعِلْمِ إِلَّا قَلِيلاٗۖ","وَلَئِن شِئْنَا لَنَذْهَبَنَّ بِالذِےٓ أَوْحَيْنَآ إِلَيْكَ ثُمَّ لَا تَجِدُ لَكَ بِهِۦ عَلَيْنَا وَكِيلاً","اِلَّا رَحْمَةٗ مِّن رَّبِّكَۖ إِنَّ فَضْلَهُۥ كَانَ عَلَيْكَ كَبِيراٗۖ","قُل لَّئِنِ اِ۪جْتَمَعَتِ اِ۬لِانسُ وَالْجِنُّ عَلَىٰٓ أَنْ يَّاتُواْ بِمِثْلِ هَٰذَا اَ۬لْقُرْءَانِ لَا يَاتُونَ بِمِثْلِهِۦ وَلَوْ كَانَ بَعْضُهُمْ لِبَعْضٖ ظَهِيراٗۖ","وَلَقَدْ صَرَّفْنَا لِلنَّاسِ فِے هَٰذَا اَ۬لْقُرْءَانِ مِن كُلِّ مَثَلٖ فَأَب۪ىٰٓ أَكْثَرُ اُ۬لنَّاسِ إِلَّا كُفُوراٗۖ","وَقَالُواْ لَن نُّومِنَ لَكَ حَتَّىٰ تُفَجِّرَ لَنَا مِنَ اَ۬لَارْضِ يَنۢبُوعاً","اَوْ تَكُونَ لَكَ جَنَّةٞ مِّن نَّخِيلٖ وَعِنَبٖ فَتُفَجِّرَ اَ۬لَانْهَٰرَ خِلَٰلَهَا تَفْجِيراً","اَوْ تُسْقِطَ اَ۬لسَّمَآءَ كَمَا زَعَمْتَ عَلَيْنَا كِسَفاً اَوْ تَاتِيَ بِاللَّهِ وَالْمَلَٰٓئِكَةِ قَبِيلاً","اَوْ يَكُونَ لَكَ بَيْتٞ مِّن زُخْرُفٍ اَوْ تَرْق۪ىٰ فِے اِ۬لسَّمَآءِ وَلَن نُّومِنَ لِرُقِيِّكَ حَتَّىٰ تُنَزِّلَ عَلَيْنَا كِتَٰباٗ نَّقْرَؤُهُۥۖ قُلْ سُبْحَٰنَ رَبِّے هَلْ كُنتُ إِلَّا بَشَراٗ رَّسُولاٗۖ","وَمَا مَنَعَ اَ۬لنَّاسَ أَنْ يُّومِنُوٓاْ إِذْ جَآءَهُمُ اُ۬لْهُد۪ىٰٓ إِلَّآ أَن قَالُوٓاْ أَبَعَثَ اَ۬للَّهُ بَشَراٗ رَّسُولاٗۖ","قُل لَّوْ كَانَ فِے اِ۬لَارْضِ مَلَٰٓئِكَةٞ يَمْشُونَ مُطْمَئِنِّينَ لَنَزَّلْنَا عَلَيْهِم مِّنَ اَ۬لسَّمَآءِ مَلَكاٗ رَّسُولاٗۖ","قُلْ كَف۪ىٰ بِاللَّهِ شَهِيداَۢ بَيْنِے وَبَيْنَكُمُۥٓۖ إِنَّهُۥ كَانَ بِعِبَادِهِۦ خَبِيراَۢ بَصِيراٗۖ","وَمَنْ يَّهْدِ اِ۬للَّهُ فَهُوَ اَ۬لْمُهْتَدِۦۖ وَمَنْ يُّضْلِلْ فَلَن تَجِدَ لَهُمُۥٓ أَوْلِيَآءَ مِن دُونِهِۦۖ وَنَحْشُرُهُمْ يَوْمَ اَ۬لْقِيَٰمَةِ عَلَىٰ وُجُوهِهِمْ عُمْياٗ وَبُكْماٗ وَصُمّاٗۖ مَّأْو۪يٰهُمْ جَهَنَّمُۖ كُلَّمَا خَبَتْ زِدْنَٰهُمْ سَعِيراٗۖ","ذَٰلِكَ جَزَآؤُهُم بِأَنَّهُمْ كَفَرُواْ بِـَٔايَٰتِنَا وَقَالُوٓاْ أَ۟ذَا كُنَّا عِظَٰماٗ وَرُفَٰتاً اِنَّا لَمَبْعُوثُونَ خَلْقاٗ جَدِيداًۖ","۞ اَوَلَمْ يَرَوَاْ اَنَّ اَ۬للَّهَ اَ۬لذِے خَلَقَ اَ۬لسَّمَٰوَٰتِ وَالَارْضَ قَادِرٌ عَلَىٰٓ أَنْ يَّخْلُقَ مِثْلَهُمْ وَجَعَلَ لَهُمُۥٓ أَجَلاٗ لَّا رَيْبَ فِيهِۖ فَأَبَى اَ۬لظَّٰلِمُونَ إِلَّا كُفُوراٗۖ","قُل لَّوَ اَنتُمْ تَمْلِكُونَ خَزَآئِنَ رَحْمَةِ رَبِّيَ إِذاٗ لَّأَمْسَكْتُمْ خَشْيَةَ اَ۬لِانفَاقِۖ وَكَانَ اَ۬لِانسَٰنُ قَتُوراٗۖ","وَلَقَدَ اٰتَيْنَا مُوس۪ىٰ تِسْعَ ءَايَٰتِۢ بَيِّنَٰتٖۖ فَسْـَٔلْ بَنِےٓ إِسْرَآءِيلَ إِذْ جَآءَهُمْ فَقَالَ لَهُۥ فِرْعَوْنُ إِنِّے لَأَظُنُّكَ يَٰمُوس۪ىٰ مَسْحُوراٗۖ","قَالَ لَقَدْ عَلِمْتَ مَآ أَنزَلَ هَٰٓؤُلَآءِ الَّا رَبُّ اُ۬لسَّمَٰوَٰتِ وَالَارْضِ بَصَآئِرَۖ وَإِنِّے لَأَظُنُّكَ يَٰفِرْعَوْنُ مَثْبُوراٗۖ","فَأَرَادَ أَنْ يَّسْتَفِزَّهُم مِّنَ اَ۬لَارْضِ فَأَغْرَقْنَٰهُ وَمَن مَّعَهُۥ جَمِيعاٗۖ","وَقُلْنَا مِنۢ بَعْدِهِۦ لِبَنِےٓ إِسْرَآءِيلَ اَ۟سْكُنُواْ اُ۬لَارْضَۖ فَإِذَا جَآءَ وَعْدُ اُ۬لَاخِرَةِ جِئْنَا بِكُمْ لَفِيفاٗۖ","وَبِالْحَقِّ أَنزَلْنَٰهُۖ وَبِالْحَقِّ نَزَلَۖ وَمَآ أَرْسَلْنَٰكَ إِلَّا مُبَشِّراٗ وَنَذِيراٗۖ","وَقُرْءَاناٗ فَرَقْنَٰهُ لِتَقْرَأَهُۥ عَلَى اَ۬لنَّاسِ عَلَىٰ مُكْثٖۖ وَنَزَّلْنَٰهُ تَنزِيلاٗۖ","قُلَ اٰمِنُواْ بِهِۦٓ أَوْ لَا تُومِنُوٓاْۖ إِنَّ اَ۬لذِينَ أُوتُواْ اُ۬لْعِلْمَ مِن قَبْلِهِۦٓ إِذَا يُتْل۪ىٰ عَلَيْهِمْ يَخِرُّونَ لِلَاذْقَانِ سُجَّداٗ وَيَقُولُونَ سُبْحَٰنَ رَبِّنَآ إِن كَانَ وَعْدُ رَبِّنَا لَمَفْعُولاٗۖ","وَيَخِرُّونَ لِلَاذْقَانِ يَبْكُونَ وَيَزِيدُهُمْ خُشُوعاٗۖ۩","قُلُ اُ۟دْعُواْ اُ۬للَّهَ أَوُ اُ۟دْعُواْ اُ۬لرَّحْمَٰنَۖ أَيّاٗ مَّا تَدْعُواْ فَلَهُ اُ۬لَاسْمَآءُ اُ۬لْحُسْن۪ىٰۖ وَلَا تَجْهَرْ بِصَلَاتِكَ وَلَا تُخَافِتْ بِهَا وَابْتَغِ بَيْنَ ذَٰلِكَ سَبِيلاٗۖ","وَقُلِ اِ۬لْحَمْدُ لِلهِ اِ۬لذِے لَمْ يَتَّخِذْ وَلَداٗ وَلَمْ يَكُن لَّهُۥ شَرِيكٞ فِے اِ۬لْمُلْكِ وَلَمْ يَكُن لَّهُۥ وَلِيّٞ مِّنَ اَ۬لذُّلِّۖ وَكَبِّرْهُ تَكْبِيراًۖ"]],["الكهف",["اِ۬لْحَمْدُ لِلهِ اِ۬لذِےٓ أَنزَلَ عَلَىٰ عَبْدِهِ اِ۬لْكِتَٰبَ وَلَمْ يَجْعَل لَّهُۥ عِوَجاٗۖ","قَيِّماٗ لِّيُنذِرَ بَأْساٗ شَدِيداٗ مِّن لَّدُنْهُ وَيُبَشِّرَ اَ۬لْمُومِنِينَ اَ۬لذِينَ يَعْمَلُونَ اَ۬لصَّٰلِحَٰتِ أَنَّ لَهُمُۥٓ أَجْراً حَسَناٗ","مَّٰكِثِينَ فِيهِ أَبَداٗ","وَيُنذِرَ اَ۬لذِينَ قَالُواْ اُ۪تَّخَذَ اَ۬للَّهُ وَلَداٗۖ","مَّا لَهُم بِهِۦ مِنْ عِلْمٖ وَلَا لِأٓبَآئِهِمْۖ كَبُرَتْ كَلِمَةٗ تَخْرُجُ مِنَ اَفْوَٰهِهِمُۥٓۖ إِنْ يَّقُولُونَ إِلَّا كَذِباٗۖ","فَلَعَلَّكَ بَٰخِعٞ نَّفْسَكَ عَلَىٰٓ ءَاثٰ۪رِهِمُۥٓ إِن لَّمْ يُومِنُواْ بِهَٰذَا اَ۬لْحَدِيثِ أَسَفاًۖ","اِنَّا جَعَلْنَا مَا عَلَى اَ۬لَارْضِ زِينَةٗ لَّهَا لِنَبْلُوَهُمُۥٓ أَيُّهُمُۥٓ أَحْسَنُ عَمَلاٗۖ","وَإِنَّا لَجَٰعِلُونَ مَا عَلَيْهَا صَعِيداٗ جُرُزاًۖ","اَمْ حَسِبْتَ أَنَّ أَصْحَٰبَ اَ۬لْكَهْفِ وَالرَّقِيمِ كَانُواْ مِنَ اٰيَٰتِنَا عَجَباًۖ","اِذَ اَوَى اَ۬لْفِتْيَةُ إِلَى اَ۬لْكَهْفِ فَقَالُواْ رَبَّنَآ ءَاتِنَا مِن لَّدُنكَ رَحْمَةٗ وَهَيِّۓْ لَنَا مِنَ اَمْرِنَا رَشَداٗۖ","فَضَرَبْنَا عَلَىٰٓ ءَاذَانِهِمْ فِے اِ۬لْكَهْفِ سِنِينَ عَدَداٗ","ثُمَّ بَعَثْنَٰهُمْ لِنَعْلَمَ أَيُّ اُ۬لْحِزْبَيْنِ أَحْص۪ىٰ لِمَا لَبِثُوٓاْ أَمَداٗۖ","نَّحْنُ نَقُصُّ عَلَيْكَ نَبَأَهُم بِالْحَقِّۖ إِنَّهُمْ فِتْيَةٌ اٰمَنُواْ بِرَبِّهِمْ وَزِدْنَٰهُمْ هُدىٗۖ","وَرَبَطْنَا عَلَىٰ قُلُوبِهِمُۥٓ إِذْ قَامُواْ فَقَالُواْ رَبُّنَا رَبُّ اُ۬لسَّمَٰوَٰتِ وَالَارْضِ لَن نَّدْعُوَاْ مِن دُونِهِۦٓ إِلَٰهاٗ لَّقَدْ قُلْنَآ إِذاٗ شَطَطاًۖ","هَٰٓؤُلَآءِ قَوْمُنَا اَ۪تَّخَذُواْ مِن دُونِهِۦٓ ءَالِهَةٗ لَّوْلَا يَاتُونَ عَلَيْهِم بِسُلْطَٰنِۢ بَيِّنٖۖ فَمَنَ اَظْلَمُ مِمَّنِ اِ۪فْتَر۪ىٰ عَلَى اَ۬للَّهِ كَذِباٗۖ","وَإِذِ اِ۪عْتَزَلْتُمُوهُمْ وَمَا يَعْبُدُونَ إِلَّا اَ۬للَّهَ فَأْوُۥٓاْ إِلَى اَ۬لْكَهْفِ يَنشُرْ لَكُمْ رَبُّكُم مِّن رَّحْمَتِهِۦ وَيُهَيِّۓْ لَكُم مِّنَ اَمْرِكُم مَّرْفِقاٗۖ","۞ وَتَرَى اَ۬لشَّمْسَ إِذَا طَلَعَت تَّزَّٰوَرُ عَن كَهْفِهِمْ ذَاتَ اَ۬لْيَمِينِ وَإِذَا غَرَبَت تَّقْرِضُهُمْ ذَاتَ اَ۬لشِّمَالِ وَهُمْ فِے فَجْوَةٖ مِّنْهُۖ ذَٰلِكَ مِنَ اٰيَٰتِ اِ۬للَّهِۖ مَنْ يَّهْدِ اِ۬للَّهُ فَهُوَ اَ۬لْمُهْتَدِۦۖ وَمَنْ يُّضْلِلْ فَلَن تَجِدَ لَهُۥ وَلِيّاٗ مُّرْشِداٗۖ","وَتَحْسِبُهُمُۥٓ أَيْقَاظاٗ وَهُمْ رُقُودٞۖ وَنُقَلِّبُهُمْ ذَاتَ اَ۬لْيَمِينِ وَذَاتَ اَ۬لشِّمَالِ وَكَلْبُهُم بَٰسِطٞ ذِرَاعَيْهِ بِالْوَصِيدِۖ لَوِ اِ۪طَّلَعْتَ عَلَيْهِمْ لَوَلَّيْتَ مِنْهُمْ فِرَاراٗ وَلَمُلِّئْتَ مِنْهُمْ رُعْباٗۖ","وَكَذَٰلِكَ بَعَثْنَٰهُمْ لِيَتَسَآءَلُواْ بَيْنَهُمْۖ قَالَ قَآئِلٞ مِّنْهُمْ كَمْ لَبِثْتُمْۖ قَالُواْ لَبِثْنَا يَوْماً اَوْ بَعْضَ يَوْمٖۖ قَالُواْ رَبُّكُمُۥٓ أَعْلَمُ بِمَا لَبِثْتُمْ فَابْعَثُوٓاْ أَحَدَكُم بِوَرِقِكُمْ هَٰذِهِۦٓ إِلَى اَ۬لْمَدِينَةِ فَلْيَنظُرَ اَيُّهَآ أَزْك۪ىٰ طَعَاماٗ فَلْيَاتِكُم بِرِزْقٖ مِّنْهُ وَلْيَتَلَطَّفْۖ وَلَا يُشْعِرَنَّ بِكُمُۥٓ أَحَداًۖ","اِنَّهُمُۥٓ إِنْ يَّظْهَرُواْ عَلَيْكُمْ يَرْجُمُوكُمُۥٓ أَوْ يُعِيدُوكُمْ فِے مِلَّتِهِمْ وَلَن تُفْلِحُوٓاْ إِذاً اَبَداٗۖ","وَكَذَٰلِكَ أَعْثَرْنَا عَلَيْهِمْ لِيَعْلَمُوٓاْ أَنَّ وَعْدَ اَ۬للَّهِ حَقّٞ وَأَنَّ اَ۬لسَّاعَةَ لَا رَيْبَ فِيهَآۖ إِذْ يَتَنَٰزَعُونَ بَيْنَهُمُۥٓ أَمْرَهُمْ فَقَالُواْ اُ۪بْنُواْ عَلَيْهِم بُنْيَٰناٗۖ رَّبُّهُمُۥٓ أَعْلَمُ بِهِمْۖ قَالَ اَ۬لذِينَ غَلَبُواْ عَلَىٰٓ أَمْرِهِمْ لَنَتَّخِذَنَّ عَلَيْهِم مَّسْجِداٗۖ","سَيَقُولُونَ ثَلَٰثَةٞ رَّابِعُهُمْ كَلْبُهُمْۖ وَيَقُولُونَ خَمْسَةٞ سَادِسُهُمْ كَلْبُهُمْ رَجْماَۢ بِالْغَيْبِۖ وَيَقُولُونَ سَبْعَةٞۖ وَثَامِنُهُمْ كَلْبُهُمْۖ قُل رَّبِّيَ أَعْلَمُ بِعِدَّتِهِمۖ مَّا يَعْلَمُهُمُۥٓ إِلَّا قَلِيلٞۖ","۞ فَلَا تُمَارِ فِيهِمُۥٓ إِلَّا مِرَآءٗ ظَٰهِراٗ وَلَا تَسْتَفْتِ فِيهِم مِّنْهُمُۥٓ أَحَداٗۖ","وَلَا تَقُولَنَّ لِشَاْےْءٍ اِنِّے فَاعِلٞ ذَٰلِكَ غَداً اِلَّآ أَنْ يَّشَآءَ اَ۬للَّهُۖ وَاذْكُر رَّبَّكَ إِذَا نَسِيتَۖ وَقُلْ عَس۪ىٰٓ أَنْ يَّهْدِيَنِۦ رَبِّے لِأَقْرَبَ مِنْ هَٰذَا رَشَداٗۖ","وَلَبِثُواْ فِے كَهْفِهِمْ ثَلَٰثَ مِاْئَةٖ سِنِينَ وَازْدَادُواْ تِسْعاٗۖ","قُلِ اِ۬للَّهُ أَعْلَمُ بِمَا لَبِثُواْۖ لَهُۥ غَيْبُ اُ۬لسَّمَٰوَٰتِ وَالَارْضِۖ أَبْصِرْ بِهِۦ وَأَسْمِعْۖ مَا لَهُم مِّن دُونِهِۦ مِنْ وَّلِيّٖۖ وَلَا يُشْرِكُ فِے حُكْمِهِۦٓ أَحَداٗۖ","وَاتْلُ مَآ أُوحِيَ إِلَيْكَ مِن كِتَابِ رَبِّكَ لَا مُبَدِّلَ لِكَلِمَٰتِهِۖۦ وَلَن تَجِدَ مِن دُونِهِۦ مُلْتَحَداٗۖ","وَاصْبِرْ نَفْسَكَ مَعَ اَ۬لذِينَ يَدْعُونَ رَبَّهُم بِالْغَدَوٰةِ وَالْعَشِيِّ يُرِيدُونَ وَجْهَهُۥۖ وَلَا تَعْدُ عَيْنَٰكَ عَنْهُمْ تُرِيدُ زِينَةَ اَ۬لْحَيَوٰةِ اِ۬لدُّنْي۪اۖ وَلَا تُطِعْ مَنَ اَغْفَلْنَا قَلْبَهُۥ عَن ذِكْرِنَا وَاتَّبَعَ هَو۪يٰهُ وَكَانَ أَمْرُهُۥ فُرُطاٗۖ","وَقُلِ اِ۬لْحَقُّ مِن رَّبِّكُمْ فَمَن شَآءَ فَلْيُومِنْ وَّمَن شَآءَ فَلْيَكْفُرِۖ اِنَّآ أَعْتَدْنَا لِلظَّٰلِمِينَ نَاراً اَحَاطَ بِهِمْ سُرَادِقُهَاۖ وَإِنْ يَّسْتَغِيثُواْ يُغَاثُواْ بِمَآءٖ كَالْمُهْلِ يَشْوِے اِ۬لْوُجُوهَۖ بِيسَ اَ۬لشَّرَابُۖ وَسَآءَتْ مُرْتَفَقاًۖ","۞ اِنَّ اَ۬لذِينَ ءَامَنُواْ وَعَمِلُواْ اُ۬لصَّٰلِحَٰتِ إِنَّا لَا نُضِيعُ أَجْرَ مَنَ اَحْسَنَ عَمَلاًۖ","ا۟وْلَٰٓئِكَ لَهُمْ جَنَّٰتُ عَدْنٖ تَجْرِے مِن تَحْتِهِمُ اُ۬لَانْهَٰرُ يُحَلَّوْنَ فِيهَا مِنَ اَسَاوِرَ مِن ذَهَبٖ وَيَلْبَسُونَ ثِيَاباً خُضْراٗ مِّن سُندُسٖ وَإِسْتَبْرَقٖ مُّتَّكِـِٕينَ فِيهَا عَلَى اَ۬لَارَآئِكِۖ نِعْمَ اَ۬لثَّوَابُۖ وحَسُنَتْ مُرْتَفَقاٗۖ","وَاضْرِبْ لَهُم مَّثَلاٗ رَّجُلَيْنِ جَعَلْنَا لِأَحَدِهِمَا جَنَّتَيْنِ مِنَ اَعْنَٰبٖ وَحَفَفْنَٰهُمَا بِنَخْلٖ وَجَعَلْنَا بَيْنَهُمَا زَرْعاٗۖ","كِلْتَا اَ۬لْجَنَّتَيْنِ ءَاتَتُ ا۟كْلَهَا وَلَمْ تَظْلِم مِّنْهُ شَئْاٗۖ وَفَجَّرْنَا خِلَٰلَهُمَا نَهَراٗ","وَكَانَ لَهُۥ ثُمُرٞۖ فَقَالَ لِصَٰحِبِهِۦ وَهُوَ يُحَاوِرُهُۥٓ أَنَآ أَكْثَرُ مِنكَ مَالاٗ وَأَعَزُّ نَفَراٗۖ","وَدَخَلَ جَنَّتَهُۥ وَهُوَ ظَالِمٞ لِّنَفْسِهِۦۖ قَالَ مَآ أَظُنُّ أَن تَبِيدَ هَٰذِهِۦٓ أَبَداٗ وَمَآ أَظُنُّ اُ۬لسَّاعَةَ قَآئِمَةٗ وَلَئِن رُّدِدتُّ إِلَىٰ رَبِّے لَأَجِدَنَّ خَيْراٗ مِّنْهُمَا مُنقَلَباٗۖ","قَالَ لَهُۥ صَٰحِبُهُۥ وَهُوَ يُحَاوِرُهُۥٓ أَكَفَرْتَ بِالذِے خَلَقَكَ مِن تُرَابٖ ثُمَّ مِن نُّطْفَةٖ ثُمَّ سَوّ۪يٰكَ رَجُلاٗۖ","لَّٰكِنَّا هُوَ اَ۬للَّهُ رَبِّے وَلَآ أُشْرِكُ بِرَبِّيَ أَحَداٗۖ","وَلَوْلَآ إِذْ دَخَلْتَ جَنَّتَكَ قُلْتَ مَا شَآءَ اَ۬للَّهُ لَا قُوَّةَ إِلَّا بِاللَّهِۖ إِن تَرَنِ أَنَآ أَقَلَّ مِنكَ مَالاٗ وَوَلَداٗ","فَعَس۪ىٰ رَبِّيَ أَنْ يُّوتِيَنِۦ خَيْراٗ مِّن جَنَّتِكَ وَيُرْسِلَ عَلَيْهَا حُسْبَٰناٗ مِّنَ اَ۬لسَّمَآءِ فَتُصْبِحَ صَعِيداٗ زَلَقاً","اَوْ يُصْبِحَ مَآؤُهَا غَوْراٗ فَلَن تَسْتَطِيعَ لَهُۥ طَلَباٗۖ","۞ وَأُحِيطَ بِثُمُرِهِۦ فَأَصْبَحَ يُقَلِّبُ كَفَّيْهِ عَلَىٰ مَآ أَنفَقَ فِيهَا وَهِيَ خَاوِيَةٌ عَلَىٰ عُرُوشِهَا وَيَقُولُ يَٰلَيْتَنِے لَمُ ا۟شْرِكْ بِرَبِّيَ أَحَداٗۖ","وَلَمْ تَكُن لَّهُۥ فِئَةٞ يَنصُرُونَهُۥ مِن دُونِ اِ۬للَّهِۖ وَمَا كَانَ مُنتَصِراًۖ","هُنَالِكَ اَ۬لْوَلَٰيَةُ لِلهِ اِ۬لْحَقِّۖ هُوَ خَيْرٞ ثَوَاباٗ وَخَيْرٌ عُقُباٗۖ","وَاضْرِبْ لَهُم مَّثَلَ اَ۬لْحَيَوٰةِ اِ۬لدُّنْي۪ا كَمَآءٍ اَنزَلْنَٰهُ مِنَ اَ۬لسَّمَآءِ فَاخْتَلَطَ بِهِۦ نَبَاتُ اُ۬لَارْضِ فَأَصْبَحَ هَشِيماٗ تَذْرُوهُ اُ۬لرِّيَٰحُۖ وَكَانَ اَ۬للَّهُ عَلَىٰ كُلِّ شَےْءٖ مُّقْتَدِراًۖ","اِ۬لْمَالُ وَالْبَنُونَ زِينَةُ اُ۬لْحَيَوٰةِ اِ۬لدُّنْي۪اۖ وَالْبَٰقِيَٰتُ اُ۬لصَّٰلِحَٰتُ خَيْرٌ عِندَ رَبِّكَ ثَوَاباٗ وَخَيْرٌ اَمَلاٗۖ","وَيَوْمَ نُسَيِّرُ اُ۬لْجِبَالَ وَتَرَى اَ۬لَارْضَ بَارِزَةٗ وَحَشَرْنَٰهُمْ فَلَمْ نُغَادِرْ مِنْهُمُۥٓ أَحَداٗۖ","وَعُرِضُواْ عَلَىٰ رَبِّكَ صَفّاٗۖ لَّقَدْ جِئْتُمُونَا كَمَا خَلَقْنَٰكُمُۥٓ أَوَّلَ مَرَّةِۢۖ بَلْ زَعَمْتُمُۥٓ أَلَّن نَّجْعَلَ لَكُم مَّوْعِداٗۖ","وَوُضِعَ اَ۬لْكِتَٰبُ فَتَرَى اَ۬لْمُجْرِمِينَ مُشْفِقِينَ مِمَّا فِيهِۖ وَيَقُولُونَ يَٰوَيْلَتَنَا مَالِ هَٰذَا اَ۬لْكِتَٰبِ لَا يُغَادِرُ صَغِيرَةٗ وَلَا كَبِيرَةً اِلَّآ أَحْص۪يٰهَاۖ وَوَجَدُواْ مَا عَمِلُواْ حَاضِراٗۖ وَلَا يَظْلِمُ رَبُّكَ أَحَداٗۖ","۞ وَإِذْ قُلْنَا لِلْمَلَٰٓئِكَةِ اِ۟سْجُدُواْ لِأٓدَمَ فَسَجَدُوٓاْۖ إِلَّآ إِبْلِيسَ كَانَ مِنَ اَ۬لْجِنِّ فَفَسَقَ عَنَ اَمْرِ رَبِّهِۦٓۖ أَفَتَتَّخِذُونَهُۥ وَذُرِّيَّتَهُۥٓ أَوْلِيَآءَ مِن دُونِے وَهُمْ لَكُمْ عَدُوُّۢۖ بِيسَ لِلظَّٰلِمِينَ بَدَلاٗۖ","مَّآ أَشْهَدتُّهُمْ خَلْقَ اَ۬لسَّمَٰوَٰتِ وَالَارْضِ وَلَا خَلْقَ أَنفُسِهِمْ وَمَا كُنتُ مُتَّخِذَ اَ۬لْمُضِلِّينَ عَضُداٗۖ","وَيَوْمَ يَقُولُ نَادُواْ شُرَكَآءِيَ اَ۬لذِينَ زَعَمْتُمْ فَدَعَوْهُمْ فَلَمْ يَسْتَجِيبُواْ لَهُمْ وَجَعَلْنَا بَيْنَهُم مَّوْبِقاٗۖ","وَرَءَا اَ۬لْمُجْرِمُونَ اَ۬لنَّارَ فَظَنُّوٓاْ أَنَّهم مُّوَاقِعُوهَا وَلَمْ يَجِدُواْ عَنْهَا مَصْرِفاٗۖ","وَلَقَدْ صَرَّفْنَا فِے هَٰذَا اَ۬لْقُرْءَانِ لِلنَّاسِ مِن كُلِّ مَثَلٖۖ وَكَانَ اَ۬لِانسَٰنُ أَكْثَرَ شَےْءٖ جَدَلاٗۖ","وَمَا مَنَعَ اَ۬لنَّاسَ أَنْ يُّومِنُوٓاْ إِذْ جَآءَهُمُ اُ۬لْهُد۪ىٰ وَيَسْتَغْفِرُواْ رَبَّهُمُۥٓ إِلَّآ أَن تَاتِيَهُمْ سُنَّةُ اُ۬لَاوَّلِينَ أَوْ يَاتِيَهُمُ اُ۬لْعَذَابُ قِبَلاٗۖ","وَمَا نُرْسِلُ اُ۬لْمُرْسَلِينَ إِلَّا مُبَشِّرِينَ وَمُنذِرِينَۖ وَيُجَٰدِلُ اُ۬لذِينَ كَفَرُواْ بِالْبَٰطِلِ لِيُدْحِضُواْ بِهِ اِ۬لْحَقَّۖ وَاتَّخَذُوٓاْ ءَايَٰتِے وَمَآ أُنذِرُواْ هُزُؤاٗۖ","وَمَنَ اَظْلَمُ مِمَّن ذُكِّرَ بِـَٔايَٰتِ رَبِّهِۦ فَأَعْرَضَ عَنْهَا وَنَسِيَ مَا قَدَّمَتْ يَدَٰهُۖ إِنَّا جَعَلْنَا عَلَىٰ قُلُوبِهِمُۥٓ أَكِنَّةً اَنْ يَّفْقَهُوهُ وَفِےٓ ءَاذَانِهِمْ وَقْراٗۖ وَإِن تَدْعُهُمُۥٓ إِلَى اَ۬لْهُد۪ىٰ فَلَنْ يَّهْتَدُوٓاْ إِذاً اَبَداٗۖ","وَرَبُّكَ اَ۬لْغَفُورُ ذُو اُ۬لرَّحْمَةِۖ لَوْ يُوَ۬اخِذُهُم بِمَا كَسَبُواْ لَعَجَّلَ لَهُمُ اُ۬لْعَذَابَۖ بَل لَّهُم مَّوْعِدٞ لَّنْ يَّجِدُواْ مِن دُونِهِۦ مَوْئِلاٗۖ","۞ وَتِلْكَ اَ۬لْقُر۪ىٰٓ أَهْلَكْنَٰهُمْ لَمَّا ظَلَمُواْ وَجَعَلْنَا لِمُهْلَكِهِم مَّوْعِداٗۖ","وَإِذْ قَالَ مُوس۪ىٰ لِفَت۪يٰهُ لَآ أَبْرَحُ حَتَّىٰٓ أَبْلُغَ مَجْمَعَ اَ۬لْبَحْرَيْنِ أَوَ اَمْضِيَ حُقُباٗۖ","فَلَمَّا بَلَغَا مَجْمَعَ بَيْنِهِمَا نَسِيَا حُوتَهُمَا فَاتَّخَذَ سَبِيلَهُۥ فِے اِ۬لْبَحْرِ سَرَباٗۖ","فَلَمَّا جَاوَزَا قَالَ لِفَت۪يٰهُ ءَاتِنَا غَدَآءَنَا لَقَدْ لَقِينَا مِن سَفَرِنَا هَٰذَا نَصَباٗۖ","قَالَ أَرَٰٓيْتَ إِذَ اَوَيْنَآ إِلَى اَ۬لصَّخْرَةِ فَإِنِّے نَسِيتُ اُ۬لْحُوتَۖ وَمَآ أَنس۪يٰنِيهِ إِلَّا اَ۬لشَّيْطَٰنُ أَنَ اَذْكُرَهُۥۖ وَاتَّخَذَ سَبِيلَهُۥ فِے اِ۬لْبَحْرِۖ عَجَباٗۖ","قَالَ ذَٰلِكَ مَا كُنَّا نَبْغِۦۖ فَارْتَدَّا عَلَىٰٓ ءَاث۪ارِهِمَا قَصَصاٗ","فَوَجَدَا عَبْداٗ مِّنْ عِبَادِنَآ ءَاتَيْنَٰهُ رَحْمَةٗ مِّنْ عِندِنَا وَعَلَّمْنَٰهُ مِن لَّدُنَّا عِلْماٗۖ","قَالَ لَهُۥ مُوس۪ىٰ هَلَ اَتَّبِعُكَ عَلَىٰٓ أَن تُعَلِّمَنِۦ مِمَّا عُلِّمْتَ رُشْداٗۖ","قَالَ إِنَّكَ لَن تَسْتَطِيعَ مَعِے صَبْراٗۖ","وَكَيْفَ تَصْبِرُ عَلَىٰ مَا لَمْ تُحِطْ بِهِۦ خُبْراٗۖ","قَالَ سَتَجِدُنِيَ إِن شَآءَ اَ۬للَّهُ صَابِراٗۖ وَلَآ أَعْصِے لَكَ أَمْراٗۖ","قَالَ فَإِنِ اِ۪تَّبَعْتَنِے فَلَا تَسْـَٔلَنِّے عَن شَےْءٍ حَتَّىٰٓ أُحْدِثَ لَكَ مِنْهُ ذِكْراٗۖ","فَانطَلَقَا حَتَّىٰٓ إِذَا رَكِبَا فِے اِ۬لسَّفِينَةِ خَرَقَهَاۖ قَالَ أَخَرَقْتَهَا لِتُغْرِقَ أَهْلَهَا لَقَدْ جِئْتَ شَئْاً اِمْراٗۖ","قَالَ أَلَمَ اَقُلِ اِنَّكَ لَن تَسْتَطِيعَ مَعِے صَبْراٗۖ","قَالَ لَا تُوَ۬اخِذْنِے بِمَا نَسِيتُ وَلَا تُرْهِقْنِے مِنَ اَمْرِے عُسْراٗۖ","فَانطَلَقَا حَتَّىٰٓ إِذَا لَقِيَا غُلَٰماٗ فَقَتَلَهُۥ قَالَ أَقَتَلْتَ نَفْساٗ زَٰكِيَةَۢ بِغَيْرِ نَفْسٖ لَّقَدْ جِئْتَ شَئْاٗ نُّكُراٗۖ","۞ قَالَ أَلَمَ اَقُل لَّكَ إِنَّكَ لَن تَسْتَطِيعَ مَعِے صَبْراٗۖ","قَالَ إِن سَأَلْتُكَ عَن شَےْءِۢ بَعْدَهَا فَلَا تُصَٰحِبْنِے قَدْ بَلَغْتَ مِن لَّدُنِے عُذْراٗۖ","فَانطَلَقَا حَتَّىٰٓ إِذَآ أَتَيَآ أَهْلَ قَرْيَةٍ اِ۪سْتَطْعَمَآ أَهْلَهَا فَأَبَوَاْ اَنْ يُّضَيِّفُوهُمَا فَوَجَدَا فِيهَا جِدَاراٗ يُرِيدُ أَنْ يَّنقَضَّ فَأَقَامَهُۥۖ قَالَ لَوْ شِئْتَ لَتَّخَذتَّ عَلَيْهِ أَجْراٗۖ","قَالَ هَٰذَا فِرَاقُ بَيْنِے وَبَيْنِكَۖ سَأُنَبِّئُكَ بِتَاوِيلِ مَا لَمْ تَسْتَطِع عَّلَيْهِ صَبْراًۖ","اَمَّا اَ۬لسَّفِينَةُ فَكَانَتْ لِمَسَٰكِينَ يَعْمَلُونَ فِے اِ۬لْبَحْرِ فَأَرَدتُّ أَنَ اَعِيبَهَا وَكَانَ وَرَآءَهُم مَّلِكٞ يَاخُذُ كُلَّ سَفِينَةٍ غَصْباٗۖ","وَأَمَّا اَ۬لْغُلَٰمُ فَكَانَ أَبَوَٰهُ مُومِنَيْنِ فَخَشِينَآ أَنْ يُّرْهِقَهُمَا طُغْيَٰناٗ وَكُفْراٗۖ","فَأَرَدْنَآ أَنْ يُّبَدِّلَهُمَا رَبُّهُمَا خَيْراٗ مِّنْهُ زَكَوٰةٗ وَأَقْرَبَ رُحْماٗۖ","وَأَمَّا اَ۬لْجِدَارُ فَكَانَ لِغُلَٰمَيْنِ يَتِيمَيْنِ فِے اِ۬لْمَدِينَةِ وَكَانَ تَحْتَهُۥ كَنزٞ لَّهُمَاۖ وَكَانَ أَبُوهُمَا صَٰلِحاٗ فَأَرَادَ رَبُّكَ أَنْ يَّبْلُغَآ أَشُدَّهُمَا وَيَسْتَخْرِجَا كَنزَهُمَا رَحْمَةٗ مِّن رَّبِّكَۖ وَمَا فَعَلْتُهُۥ عَنَ اَمْرِےۖ ذَٰلِكَ تَاوِيلُ مَا لَمْ تَسْطِع عَّلَيْهِ صَبْراٗۖ","وَيَسْـَٔلُونَكَ عَن ذِے اِ۬لْقَرْنَيْنِۖ قُلْ سَأَتْلُواْ عَلَيْكُم مِّنْهُ ذِكْراًۖ","اِنَّا مَكَّنَّا لَهُۥ فِے اِ۬لَارْضِ وَءَاتَيْنَٰهُ مِن كُلِّ شَےْءٖ سَبَباٗ","فَاتَّبَعَ سَبَباً حَتَّىٰٓ إِذَا بَلَغَ مَغْرِبَ اَ۬لشَّمْسِ وَجَدَهَا تَغْرُبُ فِے عَيْنٍ حَمِئَةٖ وَوَجَدَ عِندَهَا قَوْماٗۖ قُلْنَا يَٰذَا اَ۬لْقَرْنَيْنِ إِمَّآ أَن تُعَذِّبَ وَإِمَّآ أَن تَتَّخِذَ فِيهِمْ حُسْناٗۖ","۞ قَالَ أَمَّا مَن ظَلَمَ فَسَوْفَ نُعَذِّبُهُۥ ثُمَّ يُرَدُّ إِلَىٰ رَبِّهِۦ فَيُعَذِّبُهُۥ عَذَاباٗ نُّكُراٗۖ","وَأَمَّا مَنَ اٰمَنَ وَعَمِلَ صَٰلِحاٗ فَلَهُۥ جَزَآءُ اُ۬لْحُسْن۪ىٰۖ وَسَنَقُولُ لَهُۥ مِنَ اَمْرِنَا يُسْراٗۖ","ثُمَّ اَ۪تَّبَعَ سَبَباً حَتَّىٰٓ إِذَا بَلَغَ مَطْلِعَ اَ۬لشَّمْسِ وَجَدَهَا تَطْلُعُ عَلَىٰ قَوْمٖ لَّمْ نَجْعَل لَّهُم مِّن دُونِهَا سِتْراٗ","كَذَٰلِكَۖ وَقَدَ اَحَطْنَا بِمَا لَدَيْهِ خُبْراٗۖ","ثُمَّ اَ۪تَّبَعَ سَبَباً حَتَّىٰٓ إِذَا بَلَغَ بَيْنَ اَ۬لسُّدَّيْنِ وَجَدَ مِن دُونِهِمَا قَوْماٗ لَّا يَكَادُونَ يَفْقَهُونَ قَوْلاٗۖ","قَالُواْ يَٰذَا اَ۬لْقَرْنَيْنِ إِنَّ يَاجُوجَ وَمَاجُوجَ مُفْسِدُونَ فِے اِ۬لَارْضِ فَهَلْ نَجْعَلُ لَكَ خَرْجاً عَلَىٰٓ أَن تَجْعَلَ بَيْنَنَا وَبَيْنَهُمْ سُدّاٗۖ","قَالَ مَا مَكَّنِّے فِيهِ رَبِّے خَيْرٞۖ فَأَعِينُونِے بِقُوَّةٍ اَجْعَلْ بَيْنَكُمْ وَبَيْنَهُمْ رَدْماًۖ","اٰتُونِے زُبَرَ اَ۬لْحَدِيدِۖ حَتَّىٰٓ إِذَا سَاو۪ىٰ بَيْنَ اَ۬لصَّدَفَيْنِ قَالَ اَ۟نفُخُواْۖ حَتَّىٰٓ إِذَا جَعَلَهُۥ نَاراٗ قَالَ ءَاتُونِےٓ أُفْرِغْ عَلَيْهِ قِطْراٗۖ","فَمَا اَ۪سْطَٰعُوٓاْ أَنْ يَّظْهَرُوهُ وَمَا اَ۪سْتَطَٰعُواْ لَهُۥ نَقْباٗۖ","قَالَ هَٰذَا رَحْمَةٞ مِّن رَّبِّےۖ فَإِذَا جَآءَ وَعْدُ رَبِّے جَعَلَهُۥ دَكّاٗ وَكَانَ وَعْدُ رَبِّے حَقّاٗۖ","وَتَرَكْنَا بَعْضَهُمْ يَوْمَئِذٖ يَمُوجُ فِے بَعْضٖۖ وَنُفِخَ فِے اِ۬لصُّورِ فَجَمَعْنَٰهُمْ جَمْعاٗۖ","وَعَرَضْنَا جَهَنَّمَ يَوْمَئِذٖ لِّلْكٰ۪فِرِينَ عَرْضاً","اِ۬لذِينَ كَانَتَ اَعْيُنُهُمْ فِے غِطَآءٍ عَن ذِكْرِے وَكَانُواْ لَا يَسْتَطِيعُونَ سَمْعاًۖ","۞ اَفَحَسِبَ اَ۬لذِينَ كَفَرُوٓاْ أَنْ يَّتَّخِذُواْ عِبَادِے مِن دُونِيَ أَوْلِيَآءَۖ ا۪نَّآ أَعْتَدْنَا جَهَنَّمَ لِلْكٰ۪فِرِينَ نُزُلاٗۖ","قُلْ هَلْ نُنَبِّئُكُم بِالَاخْسَرِينَ أَعْمَٰلاً اِ۬لذِينَ ضَلَّ سَعْيُهُمْ فِے اِ۬لْحَيَوٰةِ اِ۬لدُّنْي۪ا وَهُمْ يَحْسِبُونَ أَنَّهُمْ يُحْسِنُونَ صُنْعاًۖ","ا۟وْلَٰٓئِكَ اَ۬لذِينَ كَفَرُواْ بِـَٔايَٰتِ رَبِّهِمْ وَلِقَآئِهِۦ فَحَبِطَتَ اَعْمَٰلُهُمْ فَلَا نُقِيمُ لَهُمْ يَوْمَ اَ۬لْقِيَٰمَةِ وَزْناٗۖ","ذَٰلِكَ جَزَآؤُهُمْ جَهَنَّمُ بِمَا كَفَرُواْ وَاتَّخَذُوٓاْ ءَايَٰتِے وَرُسُلِے هُزُؤاًۖ","اِنَّ اَ۬لذِينَ ءَامَنُواْ وَعَمِلُواْ اُ۬لصَّٰلِحَٰتِ كَانَتْ لَهُمْ جَنَّٰتُ اُ۬لْفِرْدَوْسِ نُزُلاً","خَٰلِدِينَ فِيهَا لَا يَبْغُونَ عَنْهَا حِوَلۖاٗ","قُل لَّوْ كَانَ اَ۬لْبَحْرُ مِدَاداٗ لِّكَلِمَٰتِ رَبِّے لَنَفِدَ اَ۬لْبَحْرُ قَبْلَ أَن تَنفَدَ كَلِمَٰتُ رَبِّے وَلَوْ جِئْنَا بِمِثْلِهِۦ مَدَداٗۖ","قُلِ اِنَّمَآ أَنَا بَشَرٞ مِّثْلُكُمْ يُوح۪ىٰٓ إِلَيَّ أَنَّمَآ إِلَٰهُكُمُۥٓ إِلَٰهٞ وَٰحِدٞۖ فَمَن كَانَ يَرْجُواْ لِقَآءَ رَبِّهِۦ فَلْيَعْمَلْ عَمَلاٗ صَٰلِحاٗ وَلَا يُشْرِكْ بِعِبَادَةِ رَبِّهِۦٓ أَحَداٗۖ"]],["مريم",["كَٓه۪ي۪عَٓصَٓۖ ذِكْرُ رَحْمَتِ رَبِّكَ عَبْدَهُۥ زَكَرِيَّآءَ","ا۪ذْ نَاد۪ىٰ رَبَّهُۥ نِدَآءً خَفِيّاٗۖ","قَالَ رَبِّ إِنِّے وَهَنَ اَ۬لْعَظْمُ مِنِّے وَاشْتَعَلَ اَ۬لرَّأْسُ شَيْباٗ وَلَمَ اَكُنۢ بِدُعَآئِكَ رَبِّ شَقِيّاٗۖ","وَإِنِّے خِفْتُ اُ۬لْمَوَٰلِيَ مِنْ وَّرَآءِے وَكَانَتِ اِ۪مْرَأَتِے عَاقِراٗ فَهَبْ لِے مِن لَّدُنكَ وَلِيّاٗ","يَرِثُنِے وَيَرِثُ مِنَ اٰلِ يَعْقُوبَۖ وَاجْعَلْهُ رَبِّ رَضِيّاٗۖ","۞ يَٰزَكَرِيَّآءُ اِ۪نَّا نُبَشِّرُكَ بِغُلَٰمٍ اِ۪سْمُهُۥ يَحْي۪ىٰ لَمْ نَجْعَل لَّهُۥ مِن قَبْلُ سَمِيّاٗۖ","قَالَ رَبِّ أَنّ۪ىٰ يَكُونُ لِے غُلَٰمٞ وَكَانَتِ اِ۪مْرَأَتِے عَاقِراٗ وَقَدْ بَلَغْتُ مِنَ اَ۬لْكِبَرِ عُتِيّاٗۖ","قَالَ كَذَٰلِكَ قَالَ رَبُّكَ هُوَ عَلَيَّ هَيِّنٞ وَقَدْ خَلَقْتُكَ مِن قَبْلُ وَلَمْ تَكُ شَئْاٗۖ","قَالَ رَبِّ اِ۪جْعَل لِّيَ ءَايَةٗۖ قَالَ ءَايَتُكَ أَلَّا تُكَلِّمَ اَ۬لنَّاسَ ثَلَٰثَ لَيَالٖ سَوِيّاٗۖ","فَخَرَجَ عَلَىٰ قَوْمِهِۦ مِنَ اَ۬لْمِحْرَابِ فَأَوْح۪ىٰٓ إِلَيْهِمُۥٓ أَن سَبِّحُواْ بُكْرَةٗ وَعَشِيّاٗۖ","يَٰيَحْي۪ىٰ خُذِ اِ۬لْكِتَٰبَ بِقُوَّةٖۖ وَءَاتَيْنَٰهُ اُ۬لْحُكْمَ صَبِيّاٗۖ","وَحَنَاناٗ مِّن لَّدُنَّا وَزَكَوٰةٗۖ وَكَانَ تَقِيّاٗۖ","وَبَرّاَۢ بِوَٰلِدَيْهِ وَلَمْ يَكُن جَبَّاراً عَصِيّاٗۖ","وَسَلَٰمٌ عَلَيْهِ يَوْمَ وُلِدَ وَيَوْمَ يَمُوتُ وَيَوْمَ يُبْعَثُ حَيّاٗۖ","وَاذْكُرْ فِے اِ۬لْكِتَٰبِ مَرْيَمَ إِذِ اِ۪نتَبَذَتْ مِنَ اَهْلِهَا مَكَاناٗ شَرْقِيّاٗ","فَاتَّخَذَتْ مِن دُونِهِمْ حِجَاباٗۖ فَأَرْسَلْنَآ إِلَيْهَا رُوحَنَا فَتَمَثَّلَ لَهَا بَشَراٗ سَوِيّاٗۖ","قَالَتِ اِنِّيَ أَعُوذُ بِالرَّحْمَٰنِ مِنكَ إِن كُنتَ تَقِيّاٗۖ","قَالَ إِنَّمَآ أَنَا رَسُولُ رَبِّكِ لِاَهَبَ لَكِ غُلَٰماٗ زَكِيّاٗۖ","قَالَتَ اَنّ۪ىٰ يَكُونُ لِے غُلَٰمٞ وَلَمْ يَمْسَسْنِے بَشَرٞ وَلَمَ اَكُ بَغِيّاٗۖ","قَالَ كَذَٰلِكِ قَالَ رَبُّكِ هُوَ عَلَيَّ هَيِّنٞۖ وَلِنَجْعَلَهُۥٓ ءَايَةٗ لِّلنَّاسِ وَرَحْمَةٗ مِّنَّاۖ وَكَانَ أَمْراٗ مَّقْضِيّاٗۖ","۞ فَحَمَلَتْهُ فَانتَبَذَتْ بِهِۦ مَكَاناٗ قَصِيّاٗۖ","فَأَجَآءَهَا اَ۬لْمَخَاضُ إِلَىٰ جِذْعِ اِ۬لنَّخْلَةِ قَالَتْ يَٰلَيْتَنِے مِتُّ قَبْلَ هَٰذَا وَكُنتُ نِسْياٗ مَّنسِيّاٗۖ","فَنَاد۪يٰهَا مِن تَحْتِهَآ أَلَّا تَحْزَنِے قَدْ جَعَلَ رَبُّكِ تَحْتَكِ سَرِيّاٗۖ","وَهُزِّےٓ إِلَيْكِ بِجِذْعِ اِ۬لنَّخْلَةِ تَسَّٰقَطْ عَلَيْكِ رُطَباٗ جَنِيّاٗۖ","فَكُلِے وَاشْرَبِے وَقَرِّے عَيْناٗۖ فَإِمَّا تَرَيِنَّ مِنَ اَ۬لْبَشَرِ أَحَداٗ فَقُولِےٓ إِنِّے نَذَرْتُ لِلرَّحْمَٰنِ صَوْماٗ فَلَنُ ا۟كَلِّمَ اَ۬لْيَوْمَ إِنسِيّاٗۖ","فَأَتَتْ بِهِۦ قَوْمَهَا تَحْمِلُهُۥۖ قَالُواْ يَٰمَرْيَمُ لَقَدْ جِئْتِ شَئْاٗ فَرِيّاٗۖ","يَٰٓأُخْتَ هَٰرُونَ مَا كَانَ أَبُوكِ اِ۪مْرَأَ سَوْءٖ وَمَا كَانَتُ ا۟مُّكِ بَغِيّاٗۖ","فَأَشَارَتِ اِلَيْهِۖ قَالُواْ كَيْفَ نُكَلِّمُ مَن كَانَ فِے اِ۬لْمَهْدِ صَبِيّاٗۖ","قَالَ إِنِّے عَبْدُ اُ۬للَّهِ ءَات۪يٰنِيَ اَ۬لْكِتَٰبَ وَجَعَلَنِے نَبِيٓـٔاٗ","وَجَعَلَنِے مُبَٰرَكاً اَيْنَ مَا كُنتُ وَأَوْصٰ۪نِے بِالصَّلَوٰةِ وَالزَّكَوٰةِ مَا دُمْتُ حَيّاٗ","وَبَرّاَۢ بِوَٰلِدَتِےۖ وَلَمْ يَجْعَلْنِے جَبَّاراٗ شَقِيّاٗۖ","وَالسَّلَٰمُ عَلَيَّ يَوْمَ وُلِدتُّ وَيَوْمَ أَمُوتُ وَيَوْمَ أُبْعَثُ حَيّاٗۖ","ذَٰلِكَ عِيسَى اَ۪بْنُ مَرْيَمَۖ قَوْلُ اُ۬لْحَقِّ اِ۬لذِے فِيهِ يَمْتَرُونَۖ","مَا كَانَ لِلهِ أَنْ يَّتَّخِذَ مِنْ وَّلَدٖۖ سُبْحَٰنَهُۥٓۖ إِذَا قَض۪ىٰٓ أَمْراٗ فَإِنَّمَا يَقُولُ لَهُۥ كُنۖ فَيَكُونُۖ","وَأَنَّ اَ۬للَّهَ رَبِّے وَرَبُّكُمْ فَاعْبُدُوهُۖ هَٰذَا صِرَٰطٞ مُّسْتَقِيمٞۖ","فَاخْتَلَفَ اَ۬لَاحْزَابُ مِنۢ بَيْنِهِمْۖ فَوَيْلٞ لِّلذِينَ كَفَرُواْ مِن مَّشْهَدِ يَوْمٍ عَظِيمٍۖ","اَسْمِعْ بِهِمْ وَأَبْصِرْ يَوْمَ يَاتُونَنَاۖ لَٰكِنِ اِ۬لظَّٰلِمُونَ اَ۬لْيَوْمَ فِے ضَلَٰلٖ مُّبِينٖۖ","وَأَنذِرْهُمْ يَوْمَ اَ۬لْحَسْرَةِ إِذْ قُضِيَ اَ۬لَامْرُ وَهُمْ فِے غَفْلَةٖ وَهُمْ لَا يُومِنُونَۖ","إِنَّا نَحْنُ نَرِثُ اُ۬لَارْضَ وَمَنْ عَلَيْهَاۖ وَإِلَيْنَا يُرْجَعُونَۖ","۞ وَاذْكُرْ فِے اِ۬لْكِتَٰبِ إِبْرَٰهِيمَ","إِنَّهُۥ كَانَ صِدِّيقاٗ نَّبِيٓـٔاً","اِذْ قَالَ لِأَبِيهِ يَٰٓأَبَتِ لِمَ تَعْبُدُ مَا لَا يَسْمَعُ وَلَا يُبْصِرُ وَلَا يُغْنِے عَنكَ شَئْاٗۖ","يَٰٓأَبَتِ إِنِّے قَدْ جَآءَنِے مِنَ اَ۬لْعِلْمِ مَا لَمْ يَاتِكَ فَاتَّبِعْنِےٓ أَهْدِكَ صِرَٰطاٗ سَوِيّاٗۖ","يَٰٓأَبَتِ لَا تَعْبُدِ اِ۬لشَّيْطَٰنَۖ إِنَّ اَ۬لشَّيْطَٰنَ كَانَ لِلرَّحْمَٰنِ عَصِيّاٗۖ","يَٰٓأَبَتِ إِنِّيَ أَخَافُ أَنْ يَّمَسَّكَ عَذَابٞ مِّنَ اَ۬لرَّحْمَٰنِ فَتَكُونَ لِلشَّيْطَٰنِ وَلِيّاٗۖ","قَالَ أَرَاغِبٌ اَنتَ عَنَ اٰلِهَتِےۖ يَٰٓإِبْرَٰهِيمُ لَئِن لَّمْ تَنتَهِ لَأَرْجُمَنَّكَ وَاهْجُرْنِے مَلِيّاٗۖ","قَالَ سَلَٰمٌ عَلَيْكَ سَأَسْتَغْفِرُ لَكَ رَبِّيَ إِنَّهُۥ كَانَ بِے حَفِيّاٗ","وَأَعْتَزِلُكُمْ وَمَا تَدْعُونَ مِن دُونِ اِ۬للَّهِ وَأَدْعُواْ رَبِّے عَس۪ىٰٓ أَلَّآ أَكُونَ بِدُعَآءِ رَبِّے شَقِيّاٗۖ","فَلَمَّا اَ۪عْتَزَلَهُمْ وَمَا يَعْبُدُونَ مِن دُونِ اِ۬للَّهِ وَهَبْنَا لَهُۥٓ إِسْحَٰقَ وَيَعْقُوبَۖ وَكُلّاٗ جَعَلْنَا نَبِيٓـٔاٗۖ","وَوَهَبْنَا لَهُم مِّن رَّحْمَتِنَا وَجَعَلْنَا لَهُمْ لِسَانَ صِدْقٍ عَلِيّاٗۖ","وَاذْكُرْ فِے اِ۬لْكِتَٰبِ مُوس۪ىٰٓ إِنَّهُۥ كَانَ مُخْلِصاٗ وَكَانَ رَسُولاٗ نَّبِيٓـٔاٗۖ","وَنَٰدَيْنَٰهُ مِن جَانِبِ اِ۬لطُّورِ اِ۬لَايْمَنِ وَقَرَّبْنَٰهُ نَجِيّاٗۖ","وَوَهَبْنَا لَهُۥ مِن رَّحْمَتِنَآ أَخَاهُ هَٰرُونَ نَبِيٓـٔاٗۖ","وَاذْكُرْ فِے اِ۬لْكِتَٰبِ إِسْمَٰعِيلَ إِنَّهُۥ كَانَ صَادِقَ اَ۬لْوَعْدِ وَكَانَ رَسُولاٗ نَّبِيٓـٔاٗ","وَكَانَ يَامُرُ أَهْلَهُۥ بِالصَّلَوٰةِ وَالزَّكَوٰةِۖ وَكَانَ عِندَ رَبِّهِۦ مَرْضِيّاٗۖ","وَاذْكُرْ فِے اِ۬لْكِتَٰبِ إِدْرِيسَ إِنَّهُۥ كَانَ صِدِّيقاٗ نَّبِيٓـٔاٗۖ","وَرَفَعْنَٰهُ مَكَاناً عَلِيّاًۖ","ا۟وْلَٰٓئِكَ اَ۬لذِينَ أَنْعَمَ اَ۬للَّهُ عَلَيْهِم مِّنَ اَ۬لنَّبِيٓـِٕۧنَ مِن ذُرِّيَّةِ ءَادَمَ وَمِمَّنْ حَمَلْنَا مَعَ نُوحٖ وَمِن ذُرِّيَّةِ إِبْرَٰهِيمَ وَإِسْرَآءِيلَ وَمِمَّنْ هَدَيْنَا وَاجْتَبَيْنَآۖ إِذَا تُتْل۪ىٰ عَلَيْهِمُۥٓ ءَايَٰتُ اُ۬لرَّحْمَٰنِ خَرُّواْ سُجَّداٗ وَبُكِيّاٗۖ۩","۞ فَخَلَفَ مِنۢ بَعْدِهِمْ خَلْفٌ اَضَاعُواْ اُ۬لصَّلَوٰةَ وَاتَّبَعُواْ اُ۬لشَّهَوَٰتِ فَسَوْفَ يَلْقَوْنَ غَيّاً","اِلَّا مَن تَابَ وَءَامَنَ وَعَمِلَ صَٰلِحاٗ فَأُوْلَٰٓئِكَ يَدْخُلُونَ اَ۬لْجَنَّةَ وَلَا يُظْلَمُونَ شَئْاٗ","جَنَّٰتِ عَدْنٍ اِ۬لتِے وَعَدَ اَ۬لرَّحْمَٰنُ عِبَادَهُۥ بِالْغَيْبِۖ إِنَّهُۥ كَانَ وَعْدُهُۥ مَاتِيّاٗۖ","لَّا يَسْمَعُونَ فِيهَا لَغْواًۖ اِلَّا سَلَٰماٗۖ وَلَهُمْ رِزْقُهُمْ فِيهَا بُكْرَةٗ وَعَشِيّاٗۖ","تِلْكَ اَ۬لْجَنَّةُ اُ۬لتِے نُورِثُ مِنْ عِبَادِنَا مَن كَانَ تَقِيّاٗۖ","وَمَا نَتَنَزَّلُ إِلَّا بِأَمْرِ رَبِّكَۖ لَهُۥ مَا بَيْنَ أَيْدِينَا وَمَا خَلْفَنَا وَمَا بَيْنَ ذَٰلِكَۖ وَمَا كَانَ رَبُّكَ نَسِيّاٗۖ","رَّبُّ اُ۬لسَّمَٰوَٰتِ وَالَارْضِ وَمَا بَيْنَهُمَا فَاعْبُدْهُ وَاصْطَبِرْ لِعِبَٰدَتِهِۦۖ هَلْ تَعْلَمُ لَهُۥ سَمِيّاٗۖ","وَيَقُولُ اُ۬لِانسَٰنُ أَ۟ذَا مَا مِتُّ لَسَوْفَ أُخْرَجُ حَيّاًۖ","اَوَلَا يَذْكُرُ اُ۬لِانسَٰنُ أَنَّا خَلَقْنَٰهُ مِن قَبْلُ وَلَمْ يَكُ شَئْاٗۖ","فَوَرَبِّكَ لَنَحْشُرَنَّهُمْ وَالشَّيَٰطِينَ ثُمَّ لَنُحْضِرَنَّهُمْ حَوْلَ جَهَنَّمَ جُثِيّاٗۖ","ثُمَّ لَنَنزِعَنَّ مِن كُلِّ شِيعَةٍ اَيُّهُمُۥٓ أَشَدُّ عَلَى اَ۬لرَّحْمَٰنِ عُتِيّاٗۖ","ثُمَّ لَنَحْنُ أَعْلَمُ بِالذِينَ هُمُۥٓ أَوْل۪ىٰ بِهَا صُلِيّاٗۖ","وَإِن مِّنكُمُۥٓ إِلَّا وَارِدُهَا كَانَ عَلَىٰ رَبِّكَ حَتْماٗ مَّقْضِيّاٗۖ","ثُمَّ نُنَجِّے اِ۬لذِينَ اَ۪تَّقَواْ وَّنَذَرُ اُ۬لظَّٰلِمِينَ فِيهَا جُثِيّاٗۖ","وَإِذَا تُتْل۪ىٰ عَلَيْهِمُۥٓ ءَايَٰتُنَا بَيِّنَٰتٖ قَالَ اَ۬لذِينَ كَفَرُواْ لِلذِينَ ءَامَنُوٓاْ أَيُّ اُ۬لْفَرِيقَيْنِ خَيْرٞ مَّقَاماٗ وَأَحْسَنُ نَدِيّاٗۖ","وَكَمَ اَهْلَكْنَا قَبْلَهُم مِّن قَرْنٍ هُمُۥٓ أَحْسَنُ أَثَٰثاٗ وَرِءْياٗۖ","۞ قُلْ مَن كَانَ فِے اِ۬لضَّلَٰلَةِ فَلْيَمْدُدْ لَهُ اُ۬لرَّحْمَٰنُ مَدّاًۖ","حَتَّىٰٓ إِذَا رَأَوْاْ مَا يُوعَدُونَ إِمَّا اَ۬لْعَذَابَ وَإِمَّا اَ۬لسَّاعَةَ فَسَيَعْلَمُونَ مَنْ هُوَ شَرّٞ مَّكَاناٗ وَأَضْعَفُ جُنداٗۖ","وَيَزِيدُ اُ۬للَّهُ اُ۬لذِينَ اَ۪هْتَدَوْاْ هُدىٗۖ وَالْبَٰقِيَٰتُ اُ۬لصَّٰلِحَٰتُ خَيْرٌ عِندَ رَبِّكَ ثَوَاباٗ وَخَيْرٞ مَّرَدّاًۖ","اَفَرَٰٓيْتَ اَ۬لذِے كَفَرَ بِـَٔايَٰتِنَا وَقَالَ لَأُوتَيَنَّ مَالاٗ وَوَلَداً","اَطَّلَعَ اَ۬لْغَيْبَ أَمِ اِ۪تَّخَذَ عِندَ اَ۬لرَّحْمَٰنِ عَهْداٗ","كَلَّاۖ سَنَكْتُبُ مَا يَقُولُ وَنَمُدُّ لَهُۥ مِنَ اَ۬لْعَذَابِ مَدّاٗۖ","وَنَرِثُهُۥ مَا يَقُولُ وَيَاتِينَا فَرْداٗۖ","وَاتَّخَذُواْ مِن دُونِ اِ۬للَّهِ ءَالِهَةٗ لِّيَكُونُواْ لَهُمْ عِزّاٗ","كَلَّاۖ سَيَكْفُرُونَ بِعِبَادَتِهِمْ وَيَكُونُونَ عَلَيْهِمْ ضِدّاًۖ","اَلَمْ تَرَ أَنَّآ أَرْسَلْنَا اَ۬لشَّيَٰطِينَ عَلَى اَ۬لْكٰ۪فِرِينَ تَؤُزُّهُمُۥٓ أَزّاٗۖ","فَلَا تَعْجَلْ عَلَيْهِمُۥٓۖ إِنَّمَا نَعُدُّ لَهُمْ عَدّاٗۖ","يَوْمَ نَحْشُرُ اُ۬لْمُتَّقِينَ إِلَى اَ۬لرَّحْمَٰنِ وَفْداٗ","وَنَسُوقُ اُ۬لْمُجْرِمِينَ إِلَىٰ جَهَنَّمَ وِرْداٗۖ","لَّا يَمْلِكُونَ اَ۬لشَفَٰعَةَ إِلَّا مَنِ اِ۪تَّخَذَ عِندَ اَ۬لرَّحْمَٰنِ عَهْداٗۖ","وَقَالُواْ اُ۪تَّخَذَ اَ۬لرَّحْمَٰنُ وَلَداٗۖ","لَّقَدْ جِئْتُمْ شَئْاً اِدّاٗ","يَكَادُ اُ۬لسَّمَٰوَٰتُ يَتَفَطَّرْنَ مِنْهُ وَتَنشَقُّ اُ۬لَارْضُ وَتَخِرُّ اُ۬لْجِبَالُ هَدّاً","اَن دَعَوْاْ لِلرَّحْمَٰنِ وَلَداٗۖ","وَمَا يَنۢبَغِے لِلرَّحْمَٰنِ أَنْ يَّتَّخِذَ وَلَداًۖ","اِن كُلُّ مَن فِے اِ۬لسَّمَٰوَٰتِ وَالَارْضِ إِلَّآ ءَاتِے اِ۬لرَّحْمَٰنِ عَبْداٗۖ","لَّقَدَ اَحْص۪يٰهُمْ وَعَدَّهُمْ عَدّاٗۖ","وَكُلُّهُمُۥٓ ءَاتِيهِ يَوْمَ اَ۬لْقِيَٰمَةِ فَرْداًۖ","اِنَّ اَ۬لذِينَ ءَامَنُواْ وَعَمِلُواْ اُ۬لصَّٰلِحَٰتِ سَيَجْعَلُ لَهُمُ اُ۬لرَّحْمَٰنُ وُدّاٗۖ","فَإِنَّمَا يَسَّرْنَٰهُ بِلِسَانِكَ لِتُبَشِّرَ بِهِ اِ۬لْمُتَّقِينَ وَتُنذِرَ بِهِۦ قَوْماٗ لُّدّاٗۖ","وَكَمَ اَهْلَكْنَا قَبْلَهُم مِّن قَرْنٍ هَلْ تُحِسُّ مِنْهُم مِّنَ اَحَدٍ اَوْ تَسْمَعُ لَهُمْ رِكْزاٗۖ"]],["طه",["طَه۪ۖ مَآ أَنزَلْنَا عَلَيْكَ اَ۬لْقُرْءَانَ لِتَشْق۪ىٰٓ","إِلَّا تَذْكِرَةٗ لِّمَنْ يَّخْش۪ىٰۖ","تَنزِيلاٗ مِّمَّنْ خَلَقَ اَ۬لَارْضَ وَالسَّمَٰوَٰتِ اِ۬لْعُلَىۖ","اَ۬لرَّحْمَٰنُ عَلَى اَ۬لْعَرْشِ اِ۪سْتَو۪ىٰۖ","لَهُۥ مَا فِے اِ۬لسَّمَٰوَٰتِ وَمَا فِے اِ۬لَارْضِ وَمَا بَيْنَهُمَا وَمَا تَحْتَ اَ۬لثَّر۪ىٰۖ","وَإِن تَجْهَرْ بِالْقَوْلِ فَإِنَّهُۥ يَعْلَمُ اُ۬لسِّرَّ وَأَخْفَىۖ","اَ۬للَّهُ لَآ إِلَٰهَ إِلَّا هُوَۖ لَهُ اُ۬لَاسْمَآءُ اُ۬لْحُسْن۪ىٰۖ","وَهَلَ اَت۪يٰكَ حَدِيثُ مُوس۪ىٰٓ","إِذْ ر۪ء۪ا نَاراٗ فَقَالَ لِأَهْلِهِ اِ۟مْكُثُوٓاْ إِنِّيَ ءَانَسْتُ نَاراٗ لَّعَلِّيَ ءَاتِيكُم مِّنْهَا بِقَبَسٍ اَوَ اَجِدُ عَلَى اَ۬لنّ۪ارِ هُدىٗۖ","فَلَمَّآ أَت۪يٰهَا نُودِيَ يَٰمُوس۪ىٰٓ","إِنِّيَ أَنَا رَبُّكَ فَاخْلَعْ نَعْلَيْكَ إِنَّكَ بِالْوَادِ اِ۬لْمُقَدَّسِ طُو۪ىٰۖ","وَأَنَا اَ۪خْتَرْتُكَ فَاسْتَمِعْ لِمَا يُوح۪ىٰٓ","إِنَّنِيَ أَنَا اَ۬للَّهُ لَآ إِلَٰهَ إِلَّآ أَنَا فَاعْبُدْنِے وَأَقِمِ اِ۬لصَّلَوٰةَ لِذِكْرِيَۖ","إِنَّ اَ۬لسَّاعَةَ ءَاتِيَةٌ اَكَادُ أُخْفِيهَا لِتُجْز۪ىٰ كُلُّ نَفْسِۢ بِمَا تَسْع۪ىٰۖ","فَلَا يَصُدَّنَّكَ عَنْهَا مَن لَّا يُومِنُ بِهَا وَاتَّبَعَ هَو۪يٰهُ فَتَرْد۪ىٰۖ","وَمَا تِلْكَ بِيَمِينِكَ يَٰمُوس۪ىٰۖ","قَالَ هِيَ عَصَايَ أَتَوَكَّؤُاْ عَلَيْهَا وَأَهُشُّ بِهَا عَلَىٰ غَنَمِے وَلِيَ فِيهَا مَـَٔارِبُ أُخْر۪ىٰۖ","قَالَ أَلْقِهَا يَٰمُوس۪ىٰۖ","فَأَلْق۪يٰهَا فَإِذَا هِيَ حَيَّةٞ تَسْع۪ىٰۖ","قَالَ خُذْهَا وَلَا تَخَفْ سَنُعِيدُهَا سِيرَتَهَا اَ۬لُاول۪ىٰۖ","وَاضْمُمْ يَدَكَ إِلَىٰ جَنَاحِكَ تَخْرُجْ بَيْضَآءَ مِنْ غَيْرِ سُوٓءٍ اٰيَةً ا۟خْر۪ىٰ","لِنُرِيَكَ مِنَ اٰيَٰتِنَا اَ۬لْكُبْرَىۖ","اَ۪ذْهَبِ اِلَىٰ فِرْعَوْنَ إِنَّهُۥ طَغ۪ىٰۖ","قَالَ رَبِّ اِ۪شْرَحْ لِے صَدْرِے","وَيَسِّرْ لِيَ أَمْرِے","وَاحْلُلْ عُقْدَةٗ مِّن لِّسَانِے","يَفْقَهُواْ قَوْلِے","وَاجْعَل لِّے وَزِيراٗ مِّنَ اَهْلِے","هَٰرُونَ أَخِےۖ","اِ۟شْدُدْ بِهِۦٓ أَزْرِے","وَأَشْرِكْهُ فِےٓ أَمْرِے","كَےْ نُسَبِّحَكَ كَثِيراٗ","وَنَذْكُرَكَ كَثِيراً","اِنَّكَ كُنتَ بِنَا بَصِيراٗۖ","۞ قَالَ قَدُ ا۟وتِيتَ سُؤْلَكَ يَٰمُوس۪ىٰۖ","وَلَقَدْ مَنَنَّا عَلَيْكَ مَرَّةً ا۟خْر۪ىٰٓ","إِذَ اَوْحَيْنَآ إِلَىٰٓ أُمِّكَ مَا يُوح۪ىٰٓ","أَنِ اِ۪قْذِفِيهِ فِے اِ۬لتَّابُوتِ فَاقْذِفِيهِ فِے اِ۬لْيَمِّۖ فَلْيُلْقِهِ اِ۬لْيَمُّ بِالسَّاحِلِ يَاخُذْهُ عَدُوّٞ لِّے وَعَدُوّٞ لَّهُۥۖ وَأَلْقَيْتُ عَلَيْكَ مَحَبَّةٗ مِّنِّے","وَلِتُصْنَعَ عَلَىٰ عَيْنِيَ","إِذْ تَمْشِےٓ أُخْتُكَ فَتَقُولُ هَلَ اَدُلُّكُمْ عَلَىٰ مَنْ يَّكْفُلُهُۥۖ فَرَجَعْنَٰكَ إِلَىٰٓ أُمِّكَ كَےْ تَقَرَّ عَيْنُهَا وَلَا تَحْزَنَۖ وَقَتَلْتَ نَفْساٗ فَنَجَّيْنَٰكَ مِنَ اَ۬لْغَمِّ وَفَتَنَّٰكَ فُتُوناٗۖ فَلَبِثْتَ سِنِينَ فِےٓ أَهْلِ مَدْيَنَ ثُمَّ جِئْتَ عَلَىٰ قَدَرٖ يَٰمُوس۪ىٰۖ","وَاصْطَنَعْتُكَ لِنَفْسِيَۖ اَ۪ذْهَبَ اَنتَ وَأَخُوكَ بِـَٔايَٰتِے وَلَا تَنِيَا فِے ذِكْرِيَۖ","اَ۪ذْهَبَآ إِلَىٰ فِرْعَوْنَ إِنَّهُۥ طَغ۪ىٰ","فَقُولَا لَهُۥ قَوْلاٗ لَّيِّناٗ لَّعَلَّهُۥ يَتَذَكَّرُ أَوْ يَخْش۪ىٰۖ","قَالَا رَبَّنَآ إِنَّنَا نَخَافُ أَنْ يَّفْرُطَ عَلَيْنَآ أَوَ اَنْ يَّطْغ۪ىٰۖ","قَالَ لَا تَخَافَآ إِنَّنِے مَعَكُمَآ أَسْمَعُ وَأَر۪ىٰۖ","فَاتِيَٰهُ فَقُولَآ إِنَّا رَسُولَا رَبِّكَ فَأَرْسِلْ مَعَنَا بَنِےٓ إِسْرَآءِيلَ وَلَا تُعَذِّبْهُمْ قَدْ جِئْنَٰكَ بِـَٔايَةٖ مِّن رَّبِّكَۖ وَالسَّلَٰمُ عَلَىٰ مَنِ اِ۪تَّبَعَ اَ۬لْهُد۪ىٰٓۖ","إِنَّا قَدُ ا۟وحِيَ إِلَيْنَآ أَنَّ اَ۬لْعَذَابَ عَلَىٰ مَن كَذَّبَ وَتَوَلّ۪ىٰۖ","قَالَ فَمَن رَّبُّكُمَا يَٰمُوس۪ىٰۖ","قَالَ رَبُّنَا اَ۬لذِےٓ أَعْط۪ىٰ كُلَّ شَےْءٍ خَلْقَهُۥ ثُمَّ هَد۪ىٰۖ","قَالَ فَمَا بَالُ اُ۬لْقُرُونِ اِ۬لُاول۪ىٰۖ","قَالَ عِلْمُهَا عِندَ رَبِّے فِے كِتَٰبٖۖ لَّا يَضِلُّ رَبِّے وَلَا يَنسَىۖ","اَ۬لذِے جَعَلَ لَكُمُ اُ۬لَارْضَ مِهَٰداٗ وَسَلَكَ لَكُمْ فِيهَا سُبُلاٗ وَأَنزَلَ مِنَ اَ۬لسَّمَآءِ مَآءٗۖ فَأَخْرَجْنَا بِهِۦٓ أَزْوَٰجاٗ مِّن نَّبَاتٖ شَتّ۪ىٰۖ","كُلُواْ وَارْعَوَاْ اَنْعَٰمَكُمُۥٓۖ إِنَّ فِے ذَٰلِكَ لَأٓيَٰتٖ لِّأُوْلِے اِ۬لنُّه۪ىٰۖ","۞ مِنْهَا خَلَقْنَٰكُمْ وَفِيهَا نُعِيدُكُمْ وَمِنْهَا نُخْرِجُكُمْ تَارَةً ا۟خْر۪ىٰۖ","وَلَقَدَ اَرَيْنَٰهُ ءَايَٰتِنَا كُلَّهَا فَكَذَّبَ وَأَب۪ىٰۖ","قَالَ أَجِئْتَنَا لِتُخْرِجَنَا مِنَ اَرْضِنَا بِسِحْرِكَ يَٰمُوس۪ىٰ","فَلَنَاتِيَنَّكَ بِسِحْرٖ مِّثْلِهِۦۖ فَاجْعَلْ بَيْنَنَا وَبَيْنَكَ مَوْعِداٗ لَّا نُخْلِفُهُۥ نَحْنُ وَلَآ أَنتَ مَكَاناٗ سِوىٗۖ","قَالَ مَوْعِدُكُمْ يَوْمُ اُ۬لزِّينَةِ وَأَنْ يُّحْشَرَ اَ۬لنَّاسُ ضُحىٗۖ","فَتَوَلّ۪ىٰ فِرْعَوْنُ فَجَمَعَ كَيْدَهُۥ ثُمَّ أَت۪ىٰۖ","قَالَ لَهُم مُّوس۪ىٰ وَيْلَكُمْ لَا تَفْتَرُواْ عَلَى اَ۬للَّهِ كَذِباٗ فَيَسْحَتَكُم بِعَذَابٖۖ وَقَدْ خَابَ مَنِ اِ۪فْتَر۪ىٰۖ","فَتَنَٰزَعُوٓاْ أَمْرَهُم بَيْنَهُمْ وَأَسَرُّواْ اُ۬لنَّجْو۪ىٰۖ","قَالُوٓاْ إِنَّ هَٰذَٰنِ لَسَٰحِرَٰنِ يُرِيدَٰنِ أَنْ يُّخْرِجَٰكُم مِّنَ اَرْضِكُم بِسِحْرِهِمَا وَيَذْهَبَا بِطَرِيقَتِكُمُ اُ۬لْمُثْل۪ىٰۖ","فَأَجْمِعُواْ كَيْدَكُمْ ثُمَّ اَ۪يتُواْ صَفّاٗۖ وَقَدَ اَفْلَحَ اَ۬لْيَوْمَ مَنِ اِ۪سْتَعْل
