:root{--cream:#FBF5E6;--cream2:#F4EAD0;--ink:#3a2d44;--gold:#C9A24B;--gold2:#E7D193;--rose:#B4577A;--ok:#2F8F5B;--bad:#C0475A;--card:#FFFDF7}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:"Segoe UI","Noto Naskh Arabic","Noto Sans Arabic",Tahoma,Arial,sans-serif;color:var(--ink);background:var(--cream);
background-image:radial-gradient(circle at 12% 8%,rgba(201,162,75,.16) 0 90px,transparent 91px),radial-gradient(circle at 92% 92%,rgba(180,87,122,.10) 0 130px,transparent 131px),radial-gradient(circle at 88% 14%,rgba(201,162,75,.10) 0 50px,transparent 51px);
line-height:1.7;overflow-x:hidden}
.orn{position:fixed;pointer-events:none;color:var(--gold);opacity:.35;font-size:34px;user-select:none}
.o1{top:14px;left:18px}.o2{top:60px;right:22px;font-size:22px}.o3{bottom:20px;left:30px;font-size:26px}.o4{bottom:50px;right:16px}
[hidden]{display:none!important}
main{max-width:980px;margin:0 auto;padding:14px 16px 40px;position:relative}
h1{margin:0;font-size:clamp(26px,6vw,40px);color:var(--rose)}
.card{background:var(--card);border:2px solid var(--gold2);border-radius:22px;box-shadow:0 8px 24px rgba(120,90,40,.12)}
button{font:inherit;cursor:pointer}
.btn{background:linear-gradient(180deg,#d9b863,var(--gold));color:#3b2a05;border:0;border-radius:999px;padding:13px 34px;font-size:20px;font-weight:700;box-shadow:0 5px 0 #a98530,0 8px 16px rgba(120,90,40,.25);transition:transform .1s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #a98530}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.alt{background:#fff;color:var(--rose);border:2px solid var(--gold2);box-shadow:none}
/* الترحيب */
#welcome{text-align:center;max-width:560px;margin:24px auto;padding:28px 22px}
#welcome .crest{font-size:54px;color:var(--gold)}
#welcome p{margin:8px 0}
.lvls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:18px 0}
.lvls label{cursor:pointer}
.lvls input{position:absolute;opacity:0}
.lvls span{display:block;padding:8px 18px;border-radius:999px;border:2px solid var(--gold2);background:#fff;font-weight:700}
.lvls input:checked+span{background:var(--rose);color:#fff;border-color:var(--rose)}
.lvls input:focus-visible+span{outline:3px solid #7A5BB5}
.note{font-size:14px;color:#6b5a74}
#srcOk{font-size:13px;color:var(--ok);min-height:20px}
#fatal{background:#fff1f1;border:2px solid var(--bad);color:#7a1f2e;border-radius:16px;padding:20px;max-width:560px;margin:30px auto;font-size:18px;text-align:center}
/* اللعبة */
.hud{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;margin:6px 0 10px}
.chip{background:var(--card);border:2px solid var(--gold2);border-radius:14px;padding:4px 14px;text-align:center;min-width:76px}
.chip b{display:block;font-size:22px;line-height:1.2}.chip small{font-size:12px;color:#6b5a74}
.chip.ok b{color:var(--ok)}.chip.bad b{color:var(--bad)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.bar .tag{font-size:14px;background:#fff;border:1.5px solid var(--gold2);border-radius:999px;padding:2px 12px}
.icon{background:#fff;border:2px solid var(--gold2);border-radius:50%;width:42px;height:42px;font-size:20px}
.stage{display:flex;flex-direction:column;align-items:center;gap:16px;margin-top:6px}
.wheelbox{overflow:hidden;position:relative;width:min(92vw,62vh,520px);aspect-ratio:1}
#wheel{pointer-events:none;width:100%;height:100%;display:block;transform-origin:50% 50%;filter:drop-shadow(0 10px 18px rgba(80,50,20,.28));will-change:transform}
#wheel text{font-family:inherit}
#wheel .seg.win{filter:brightness(1.08);stroke:#C9A24B;stroke-width:5}
#pointer{pointer-events:none;position:absolute;top:0;left:50%;width:44px;height:58px;margin-left:-22px;z-index:3;transform-origin:50% 12%;filter:drop-shadow(0 3px 3px rgba(0,0,0,.3))}
#pointer.flick{animation:flick .12s ease-out}
@keyframes flick{0%{transform:rotate(0)}40%{transform:rotate(-14deg)}100%{transform:rotate(0)}}
/* النوافذ */
.modal{position:fixed;inset:0;background:rgba(58,45,68,.55);display:none;align-items:center;justify-content:center;padding:12px;z-index:20;overflow:auto}
.modal.show{display:flex}
.qcard{width:100%;max-width:640px;max-height:96vh;overflow:auto;padding:18px 18px 20px;animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
.qhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
#qSec{padding:4px 14px;border-radius:999px;font-weight:700}
.lv{font-size:13px;padding:2px 10px;border-radius:999px;border:1.5px solid var(--gold2);background:#fff}
.lv.e{color:#2F8F5B}.lv.m{color:#A8801C}.lv.a{color:#B4577A}
#qPts{margin-inline-start:auto;font-weight:700;color:var(--gold)}
.ask{margin:6px 0;font-size:19px;font-weight:700}
.verse{font-family:"UthmanicWarsh","Amiri Quran",serif;font-size:clamp(24px,5.4vw,31px);line-height:2.25;text-align:center;background:#fff;border:1.5px solid var(--gold2);border-radius:14px;padding:8px 12px;margin:8px 0}
.verse.sm{font-size:clamp(20px,4.6vw,25px);line-height:2.1}
.verse .hl{background:#F9E5A0;border-radius:6px;padding:0 3px}.verse .hl2{background:#C2EBDD;border-radius:6px;padding:0 3px}
.dots{color:var(--gold)}
.q{font-family:"UthmanicWarsh","Amiri Quran",serif;font-size:1.25em}
.ordlist{display:grid;gap:6px}.ordrow{display:flex;gap:10px;align-items:center}.ordrow b{flex:none;width:30px;height:30px;border-radius:50%;background:var(--rose);color:#fff;display:grid;place-items:center}
.ordrow .verse{flex:1;margin:0}
#qOpts{display:grid;gap:9px;margin-top:10px}
.opt{display:flex;align-items:center;gap:10px;text-align:start;background:#fff;border:2px solid var(--gold2);border-radius:14px;padding:10px 12px;font-size:18px;color:var(--ink);transition:background .15s,transform .1s}
.opt:hover:not(:disabled){background:#FFF6DA}
.opt:active:not(:disabled){transform:scale(.99)}
.ol{flex:none;width:32px;height:32px;border-radius:50%;background:var(--cream2);display:grid;place-items:center;font-weight:700;color:var(--rose)}
.ot{flex:1}
.opt.qopt .ot{font-family:"UthmanicWarsh","Amiri Quran",serif;font-size:clamp(21px,4.8vw,27px);line-height:2.1}
.opt.right{background:#DDF3E4;border-color:var(--ok)}.opt.wrong{background:#FBE1E5;border-color:var(--bad)}
.opt:disabled{cursor:default;color:var(--ink)}
.fb{margin-top:12px;padding:12px 14px;border-radius:14px}
.fb.good{background:#E6F6EB;border:2px solid var(--ok)}.fb.bad{background:#FDEBEE;border:2px solid var(--bad)}
#fbMsg{font-size:20px;font-weight:700}#fbMsg small{color:var(--gold)}
.tick{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;color:#fff;background:var(--ok);margin-inline-end:6px}
.fb.bad .tick{background:var(--bad)}
#fbExp{margin-top:6px;font-size:16px}
#qNext{margin:14px auto 0;display:block}
/* النتيجة */
.rcard{max-width:460px;width:100%;padding:28px 22px;text-align:center;animation:pop .3s ease-out}
.rcard .big{font-size:56px}
.stats{display:flex;gap:10px;justify-content:center;margin:14px 0}
.rbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.confetti{position:fixed;top:-20px;z-index:40;pointer-events:none;animation-name:fall;animation-timing-function:linear;animation-fill-mode:forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--rot))}}
@media (max-width:480px){.btn{font-size:18px;padding:12px 26px}.chip{min-width:64px;padding:3px 8px}.ask{font-size:17px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<span class="orn o1" aria-hidden="true">☪</span><span class="orn o2" aria-hidden="true">✦</span><span class="orn o3" aria-hidden="true">✧</span><span class="orn o4" aria-hidden="true">☾</span>
<main>
<div id="fatal" hidden role="alert"></div>

<section id="welcome" class="card">
  <div class="crest" aria-hidden="true">☪</div>
  <h1>العجلة القرآنية</h1>
  <p>أديري العجلة، واختبري معلوماتك في القرآن الكريم وأحكام التجويد.</p>
  <p class="note">النص القرآني برواية <b>ورش عن نافع</b>، وأحكام التجويد المسؤول عنها هي أحكام رواية ورش.</p>
  <div class="lvls" role="radiogroup" aria-label="اختيار المستوى">
    <label><input type="radio" name="lvl" value="e"><span>سهل</span></label>
    <label><input type="radio" name="lvl" value="m"><span>متوسط</span></label>
    <label><input type="radio" name="lvl" value="a"><span>متقدم</span></label>
    <label><input type="radio" name="lvl" value="x" checked><span>متنوع</span></label>
  </div>
  <button id="startBtn" class="btn" type="button">ابدئي اللعب</button>
  <p id="srcOk"></p>
  <p class="note">الجولة ١٠ أسئلة. يُنصح بمراجعة المحتوى مع مقرئة مجازة برواية ورش.</p>
</section>

<section id="game" hidden>
  <div class="bar">
    <button id="homeBtn" class="icon" type="button" aria-label="الرئيسية">⌂</button>
    <span class="tag" id="lvlTag"></span>
    <button id="snd" class="icon" type="button" aria-pressed="true" aria-label="كتم الصوت">🔊</button>
  </div>
  <div class="hud">
    <div class="chip"><b id="hPts">٠</b><small>النقاط</small></div>
    <div class="chip ok"><b id="hOk">٠</b><small>صحيحة</small></div>
    <div class="chip bad"><b id="hBad">٠</b><small>خاطئة</small></div>
    <div class="chip"><b id="hN">١ / ١٠</b><small>السؤال</small></div>
  </div>
  <div class="stage">
    <div class="wheelbox">
      <svg id="pointer" viewBox="0 0 44 58" aria-hidden="true"><path d="M22 56 L5 20 A19 19 0 1 1 39 20 Z" fill="#B4577A" stroke="#fff" stroke-width="3"/><circle cx="22" cy="18" r="6" fill="#fff"/></svg>
      <svg id="wheel" viewBox="-14 -14 428 428" role="img" aria-label="عجلة الأقسام"></svg>
    </div>
    <button id="spinBtn" class="btn" type="button">أديري العجلة</button>
  </div>
</section>
</main>

<div id="qmodal" class="modal" role="dialog" aria-modal="true" aria-label="السؤال">
  <div id="qCard" class="qcard card">
    <div class="qhead"><span id="qSec"></span><span id="qLvl" class="lv"></span><span id="qPts"></span></div>
    <div id="qBody"></div>
    <div id="qOpts"></div>
    <div id="qFb" class="fb" hidden><div id="fbMsg"></div><div id="fbExp"></div></div>
    <button id="qNext" class="btn" type="button" hidden>السؤال التالي ←</button>
  </div>
</div>

<div id="results" class="modal" role="dialog" aria-modal="true" aria-label="النتيجة">
  <div class="rcard card">
    <div class="big" aria-hidden="true">🌙✨</div>
    <h1 id="rTitle" style="font-size:28px"></h1>
    <p id="rMsg"></p>
    <div class="stats">
      <div class="chip"><b id="rPts">٠</b><small>النقاط</small></div>
      <div class="chip ok"><b id="rOk">٠</b><small>صحيحة</small></div>
      <div class="chip bad"><b id="rBad">٠</b><small>خاطئة</small></div>
    </div>
    <div class="rbtns"><button id="again" class="btn" type="button">لعب مرة أخرى</button><button id="toHome" class="btn alt" type="button">الرئيسية</button></div>
  </div>
</div>

<script type="application/json" id="quran-data">[["الفاتحة",["اِ۬لْحَمْدُ لِلهِ رَبِّ اِ۬لْعَٰلَمِينَ","اَ۬لرَّحْمَٰنِ اِ۬لرَّحِيمِ","مَلِكِ يَوْمِ اِ۬لدِّينِۖ","إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُۖ","اُ۪هْدِنَا اَ۬لصِّرَٰطَ اَ۬لْمُسْتَقِيمَ","صِرَٰطَ اَ۬لذِينَ أَنْعَمْتَ عَلَيْهِمْ","غَيْرِ اِ۬لْمَغْضُوبِ عَلَيْهِمْ وَلَا اَ۬لضَّآلِّينَۖ"]],["البقرة",["أَلَٓمِّٓۖ ذَٰلِكَ اَ۬لْكِتَٰبُ لَا رَيْبَۖ فِيهِ هُدىٗ لِّلْمُتَّقِينَ","اَ۬لذِينَ يُومِنُونَ بِالْغَيْبِ وَيُقِيمُونَ اَ۬لصَّلَوٰةَ وَمِمَّا رَزَقْنَٰهُمْ يُنفِقُونَۖ","وَالذِينَ يُومِنُونَ بِمَآ أُنزِلَ إِلَيْكَ وَمَآ أُنزِلَ مِن قَبْلِكَ وَبِالَاخِرَةِ هُمْ يُوقِنُونَ","أُوْلَٰٓئِكَ عَلَىٰ هُدىٗ مِّن رَّبِّهِمْۖ وَأُوْلَٰٓئِكَ هُمُ اُ۬لْمُفْلِحُونَۖ","إِنَّ اَ۬لذِينَ كَفَرُواْ سَوَآءٌ عَلَيْهِمُۥٓ ءَآنذَرْتَهُمُۥٓ أَمْ لَمْ تُنذِرْهُمْ لَا يُومِنُونَۖ","خَتَمَ اَ۬للَّهُ عَلَىٰ قُلُوبِهِمْ وَعَلَىٰ سَمْعِهِمْۖ وَعَلَىٰٓ أَبْصٰ۪رِهِمْ غِشَٰوَةٞۖ وَلَهُمْ عَذَابٌ عَظِيمٞۖ","وَمِنَ اَ۬لنَّاسِ مَنْ يَّقُولُ ءَامَنَّا بِاللَّهِ وَبِالْيَوْمِ اِ۬لَاخِرِ وَمَا هُم بِمُومِنِينَۖ","يُخَٰدِعُونَ اَ۬للَّهَ وَالذِينَ ءَامَنُواْۖ وَمَا يُخَٰدِعُونَ إِلَّآ أَنفُسَهُمْ وَمَا يَشْعُرُونَۖ","فِے قُلُوبِهِم مَّرَضٞۖ فَزَادَهُمُ اُ۬للَّهُ مَرَضاٗۖ وَلَهُمْ عَذَابٌ اَلِيمُۢ بِمَا كَانُواْ يُكَذِّبُونَۖ","وَإِذَا قِيلَ لَهُمْ لَا تُفْسِدُواْ فِے اِ۬لَارْضِ قَالُوٓاْ إِنَّمَا نَحْنُ مُصْلِحُونَۖ","أَلَآ إِنَّهُمْ هُمُ اُ۬لْمُفْسِدُونَ وَلَٰكِن لَّا يَشْعُرُونَۖ","وَإِذَا قِيلَ لَهُمُۥٓ ءَامِنُواْ كَمَآ ءَامَنَ اَ۬لنَّاسُ قَالُوٓاْ أَنُومِنُ كَمَآ ءَامَنَ اَ۬لسُّفَهَآءُۖ اَ۬لَآ إِنَّهُمْ هُمُ اُ۬لسُّفَهَآءُ وَلَٰكِن لَّا يَعْلَمُونَۖ","وَإِذَا لَقُواْ اُ۬لذِينَ ءَامَنُواْ قَالُوٓاْ ءَامَنَّاۖ وَإِذَا خَلَوِاْ اِلَىٰ شَيَٰطِينِهِمْ قَالُوٓاْ إِنَّا مَعَكُمُۥٓ إِنَّمَا نَحْنُ مُسْتَهْزِءُونَۖ","اَ۬للَّهُ يَسْتَهْزِۓُ بِهِمْ وَيَمُدُّهُمْ فِے طُغْيَٰنِهِمْ يَعْمَهُونَۖ","أُوْلَٰٓئِكَ اَ۬لذِينَ اَ۪شْتَرَوُاْ اُ۬لضَّلَٰلَةَ بِالْهُد۪ىٰ فَمَا رَبِحَت تِّجَٰرَتُهُمْ وَمَا كَانُواْ مُهْتَدِينَۖ","۞ مَثَلُهُمْ كَمَثَلِ اِ۬لذِے اِ۪سْتَوْقَدَ نَاراٗ فَلَمَّآ أَضَآءَتْ مَا حَوْلَهُۥۖ ذَهَبَ اَ۬للَّهُ بِنُورِهِمْ وَتَرَكَهُمْ فِے ظُلُمَٰتٖ لَّا يُبْصِرُونَۖ","صُمُّۢ بُكْمٌ عُمْيٞ فَهُمْ لَا يَرْجِعُونَۖ","أَوْ كَصَيِّبٖ مِّنَ اَ۬لسَّمَآءِ فِيهِ ظُلُمَٰتٞ وَرَعْدٞ وَبَرْقٞۖ يَجْعَلُونَ أَصَٰبِعَهُمْ فِےٓ ءَاذَانِهِم مِّنَ اَ۬لصَّوَٰعِقِ حَذَرَ اَ۬لْمَوْتِۖ وَاللَّهُ مُحِيطُۢ بِالْكٰ۪فِرِينَۖ","يَكَادُ اُ۬لْبَرْقُ يَخْطَفُ أَبْصَٰرَهُمْۖ كُلَّمَآ أَضَآءَ لَهُم مَّشَوْاْ فِيهِۖ وَإِذَآ أَظْلَمَ عَلَيْهِمْ قَامُواْۖ وَلَوْ شَآءَ اَ۬للَّهُ لَذَهَبَ بِسَمْعِهِمْ وَأَبْصٰ۪رِهِمُۥٓۖ إِنَّ اَ۬للَّهَ عَلَىٰ كُلِّ شَےْءٖ قَدِيرٞۖ","يَٰٓأَيُّهَا اَ۬لنَّاسُ اُ۟عْبُدُواْ رَبَّكُمُ اُ۬لذِے خَلَقَكُمْ وَالذِينَ مِن قَبْلِكُمْ لَعَلَّكُمْ تَتَّقُونَۖ","اَ۬لذِے جَعَلَ لَكُمُ اُ۬لَارْضَ فِرَٰشاٗ وَالسَّمَآءَ بِنَآءٗ وَأَنزَلَ مِنَ اَ۬لسَّمَآءِ مَآءٗ فَأَخْرَجَ بِهِۦ مِنَ اَ۬لثَّمَرَٰتِ رِزْقاٗ لَّكُمْۖ فَلَا تَجْعَلُواْ لِلهِ أَندَاداٗ وَأَنتُمْ تَعْلَمُونَۖ","وَإِن كُنتُمْ فِے رَيْبٖ مِّمَّا نَزَّلْنَا عَلَىٰ عَبْدِنَا فَاتُواْ بِسُورَةٖ مِّن مِّثْلِهِۦۖ وَادْعُواْ شُهَدَآءَكُم مِّن دُونِ اِ۬للَّهِ إِن كُنتُمْ صَٰدِقِينَۖ","فَإِن لَّمْ تَفْعَلُواْ وَلَن تَفْعَلُواْ فَاتَّقُواْ اُ۬لنَّارَ اَ۬لتِے وَقُودُهَا اَ۬لنَّاسُ وَالْحِجَارَةُۖ أُعِدَّتْ لِلْكٰ۪فِرِينَۖ","وَبَشِّرِ اِ۬لذِينَ ءَامَنُواْ وَعَمِلُواْ اُ۬لصَّٰلِحَٰتِ أَنَّ لَهُمْ جَنَّٰتٖ تَجْرِے مِن تَحْتِهَا اَ۬لَانْهَٰرُۖ كُلَّمَا رُزِقُواْ مِنْهَا مِن ثَمَرَةٖ رِّزْقاٗ قَالُواْ هَٰذَا اَ۬لذِے رُزِقْنَا مِن قَبْلُۖ وَأُتُواْ بِهِۦ مُتَشَٰبِهاٗۖ وَلَهُمْ فِيهَآ أَزْوَٰجٞ مُّطَهَّرَةٞۖ وَهُمْ فِيهَا خَٰلِدُونَۖ","۞ إِنَّ اَ۬للَّهَ لَا يَسْتَحْيِۦٓ أَنْ يَّضْرِبَ مَثَلاٗ مَّا بَعُوضَةٗ فَمَا فَوْقَهَاۖ فَأَمَّا اَ۬لذِينَ ءَامَنُواْ فَيَعْلَمُونَ أَنَّهُ اُ۬لْحَقُّ مِن رَّبِّهِمْۖ وَأَمَّا اَ۬لذِينَ كَفَرُواْ فَيَقُولُونَ مَاذَآ أَرَادَ اَ۬للَّهُ بِهَٰذَا مَثَلاٗۖ يُضِلُّ بِهِۦ كَثِيراٗ وَيَهْدِے بِهِۦ كَثِيراٗۖ وَمَا يُضِلُّ بِهِۦٓ إِلَّا اَ۬لْفَٰسِقِينَ","اَ۬لذِينَ يَنقُضُونَ عَهْدَ اَ۬للَّهِ مِنۢ بَعْدِ مِيثَٰقِهِۦ وَيَقْطَعُونَ مَآ أَمَرَ اَ۬للَّهُ بِهِۦٓ أَنْ يُّوصَلَ وَيُفْسِدُونَ فِے اِ۬لَارْضِۖ أُوْلَٰٓئِكَ هُمُ اُ۬لْخَٰسِرُونَۖ","كَيْفَ تَكْفُرُونَ بِاللَّهِ وَكُنتُمُۥٓ أَمْوَٰتاٗ فَأَحْي۪اكُمْ ثُمَّ يُمِيتُكُمْۖ ثُمَّ يُحْيِيكُمْ ثُمَّ إِلَيْهِ تُرْجَعُونَۖ","هُوَ اَ۬لذِے خَلَقَ لَكُم مَّا فِے اِ۬لَارْضِ جَمِيعاٗۖ ثُمَّ اَ۪سْتَو۪ىٰٓ إِلَى اَ۬لسَّمَآءِ فَسَوّ۪يٰهُنَّ سَبْعَ سَمَٰوَٰتٖۖ وَهُوَ بِكُلِّ شَےْءٍ عَلِيمٞۖ","وَإِذْ قَالَ رَبُّكَ لِلْمَلَٰٓئِكَةِ إِنِّے جَاعِلٞ فِے اِ۬لَارْضِ خَلِيفَةٗۖ قَالُوٓاْ أَتَجْعَلُ فِيهَا مَنْ يُّفْسِدُ فِيهَا وَيَسْفِكُ اُ۬لدِّمَآءَ وَنَحْنُ نُسَبِّحُ بِحَمْدِكَ وَنُقَدِّسُ لَكَۖ قَالَ إِنِّيَ أَعْلَمُ مَا لَا تَعْلَمُونَۖ","وَعَلَّمَ ءَادَمَ اَ۬لَاسْمَآءَ كُلَّهَا ثُمَّ عَرَضَهُمْ عَلَى اَ۬لْمَلَٰٓئِكَةِ فَقَالَ أَنۢبِـُٔونِے بِأَسْمَآءِ هَٰٓؤُلَآءِ ان كُنتُمْ صَٰدِقِينَۖ","قَالُواْ سُبْحَٰنَكَ لَا عِلْمَ لَنَآ إِلَّا مَا عَلَّمْتَنَآ إِنَّكَ أَنتَ اَ۬لْعَلِيمُ اُ۬لْحَكِيمُۖ","قَالَ يَٰٓـَٔادَمُ أَنۢبِئْهُم بِأَسْمَآئِهِمْۖ فَلَمَّآ أَنۢبَأَهُم بِأَسْمَآئِهِمْ قَالَ أَلَمَ اَقُل لَّكُمُۥٓ إِنِّيَ أَعْلَمُ غَيْبَ اَ۬لسَّمَٰوَٰتِ وَالَارْضِ وَأَعْلَمُ مَا تُبْدُونَ وَمَا كُنتُمْ تَكْتُمُونَۖ","۞ وَإِذْ قُلْنَا لِلْمَلَٰٓئِكَةِ اِ۟سْجُدُواْ لِأٓدَمَ فَسَجَدُوٓاْۖ إِلَّآ إِبْلِيسَ أَب۪ىٰ وَاسْتَكْبَرَ وَكَانَ مِنَ اَ۬لْكٰ۪فِرِينَۖ","وَقُلْنَا يَٰٓـَٔادَمُ اُ۟سْكُنَ اَنتَ وَزَوْجُكَ اَ۬لْجَنَّةَ وَكُلَا مِنْهَا رَغَداً حَيْثُ شِئْتُمَاۖ وَلَا تَقْرَبَا هَٰذِهِ اِ۬لشَّجَرَةَ فَتَكُونَا مِنَ اَ۬لظَّٰلِمِينَۖ","فَأَزَلَّهُمَا اَ۬لشَّيْطَٰنُ عَنْهَا فَأَخْرَجَهُمَا مِمَّا كَانَا فِيهِۖ وَقُلْنَا اَ۪هْبِطُواْۖ بَعْضُكُمْ لِبَعْضٍ عَدُوّٞۖ وَلَكُمْ فِے اِ۬لَارْضِ مُسْتَقَرّٞ وَمَتَٰعٌ اِلَىٰ حِينٖۖ","فَتَلَقّ۪ىٰٓ ءَادَمُ مِن رَّبِّهِۦ كَلِمَٰتٖ فَتَابَ عَلَيْهِۖ إِنَّهُۥ هُوَ اَ۬لتَّوَّابُ اُ۬لرَّحِيمُۖ","قُلْنَا اَ۪هْبِطُواْ مِنْهَا جَمِيعاٗۖ فَإِمَّا يَاتِيَنَّكُم مِّنِّے هُدىٗ فَمَن تَبِعَ هُد۪ايَ فَلَا خَوْفٌ عَلَيْهِمْ وَلَا هُمْ يَحْزَنُونَۖ","وَالذِينَ كَفَرُواْ وَكَذَّبُواْ بِـَٔايَٰتِنَآ أُوْلَٰٓئِكَ أَصْحَٰبُ اُ۬لنّ۪ارِ هُمْ فِيهَا خَٰلِدُونَۖ","يَٰبَنِےٓ إِسْرَآءِيلَ اَ۟ذْكُرُواْ نِعْمَتِيَ اَ۬لتِےٓ أَنْعَمْتُ عَلَيْكُمْ وَأَوْفُواْ بِعَهْدِےٓ أُوفِ بِعَهْدِكُمْ وَإِيَّٰيَ فَارْهَبُونِۖ","وَءَامِنُواْ بِمَآ أَنزَلْتُ مُصَدِّقاٗ لِّمَا مَعَكُمْ وَلَا تَكُونُوٓاْ أَوَّلَ كَافِرِۢ بِهِۦۖ وَلَا تَشْتَرُواْ بِـَٔايَٰتِے ثَمَناٗ قَلِيلاٗ وَإِيَّٰيَ فَاتَّقُونِۖ","۞ وَلَا تَلْبِسُواْ اُ۬لْحَقَّ بِالْبَٰطِلِ وَتَكْتُمُواْ اُ۬لْحَقَّ وَأَنتُمْ تَعْلَمُونَۖ","وَأَقِيمُواْ اُ۬لصَّلَوٰةَ وَءَاتُواْ اُ۬لزَّكَوٰةَۖ وَارْكَعُواْ مَعَ اَ۬لرَّٰكِعِينَۖ","أَتَامُرُونَ اَ۬لنَّاسَ بِالْبِرِّ وَتَنسَوْنَ أَنفُسَكُمْ وَأَنتُمْ تَتْلُونَ اَ۬لْكِتَٰبَۖ أَفَلَا تَعْقِلُونَۖ","وَاسْتَعِينُواْ بِالصَّبْرِ وَالصَّلَوٰةِۖ وَإِنَّهَا لَكَبِيرَةٌ اِلَّا عَلَى اَ۬لْخَٰشِعِينَ","اَ۬لذِينَ يَظُنُّونَ أَنَّهُم مُّلَٰقُواْ رَبِّهِمْ وَأَنَّهُمُۥٓ إِلَيْهِ رَٰجِعُونَۖ","يَٰبَنِےٓ إِسْرَآءِيلَ اَ۟ذْكُرُواْ نِعْمَتِيَ اَ۬لتِےٓ أَنْعَمْتُ عَلَيْكُمْ وَأَنِّے فَضَّلْتُكُمْ عَلَى اَ۬لْعَٰلَمِينَۖ","وَاتَّقُواْ يَوْماٗ لَّا تَجْزِے نَفْسٌ عَن نَّفْسٖ شَئْاٗ وَلَا يُقْبَلُ مِنْهَا شَفَٰعَةٞ وَلَا يُوخَذُ مِنْهَا عَدْلٞ وَلَا هُمْ يُنصَرُونَۖ","وَإِذْ نَجَّيْنَٰكُم مِّنَ اٰلِ فِرْعَوْنَ يَسُومُونَكُمْ سُوٓءَ اَ۬لْعَذَابِ يُذَبِّحُونَ أَبْنَآءَكُمْ وَيَسْتَحْيُونَ نِسَآءَكُمْۖ وَفِے ذَٰلِكُم بَلَآءٞ مِّن رَّبِّكُمْ عَظِيمٞۖ","وَإِذْ فَرَقْنَا بِكُمُ اُ۬لْبَحْرَ فَأَنجَيْنَٰكُمْ وَأَغْرَقْنَآ ءَالَ فِرْعَوْنَ وَأَنتُمْ تَنظُرُونَۖ","وَإِذْ وَٰعَدْنَا مُوس۪ىٰٓ أَرْبَعِينَ لَيْلَةٗ ثُمَّ اَ۪تَّخَذتُّمُ اُ۬لْعِجْلَ مِنۢ بَعْدِهِۦ وَأَنتُمْ ظَٰلِمُونَۖ","ثُمَّ عَفَوْنَا عَنكُم مِّنۢ بَعْدِ ذَٰلِكَ لَعَلَّكُمْ تَشْكُرُونَۖ","وَإِذَ اٰتَيْنَا مُوسَى اَ۬لْكِتَٰبَۖ وَالْفُرْقَانَ لَعَلَّكُمْ تَهْتَدُونَۖ","۞ وَإِذْ قَالَ مُوس۪ىٰ لِقَوْمِهِۦ يَٰقَوْمِ إِنَّكُمْ ظَلَمْتُمُۥٓ أَنفُسَكُم بِاتِّخَاذِكُمُ اُ۬لْعِجْلَ فَتُوبُوٓاْ إِلَىٰ بَارِئِكُمْ فَاقْتُلُوٓاْ أَنفُسَكُمْۖ ذَٰلِكُمْ خَيْرٞ لَّكُمْ عِندَ بَارِئِكُمْۖ فَتَابَ عَلَيْكُمُۥٓۖ إِنَّهُۥ هُوَ اَ۬لتَّوَّابُ اُ۬لرَّحِيمُۖ","وَإِذْ قُلْتُمْ يَٰمُوس۪ىٰ لَن نُّومِنَ لَكَ حَتَّىٰ نَرَى اَ۬للَّهَ جَهْرَةٗ فَأَخَذَتْكُمُ اُ۬لصَّٰعِقَةُ وَأَنتُمْ تَنظُرُونَۖ","ثُمَّ بَعَثْنَٰكُم مِّنۢ بَعْدِ مَوْتِكُمْ لَعَلَّكُمْ تَشْكُرُونَۖ","وَظَلَّلْنَا عَلَيْكُمُ اُ۬لْغَمَٰمَ وَأَنزَلْنَا عَلَيْكُمُ اُ۬لْمَنَّ وَالسَّلْو۪ىٰۖ كُلُواْ مِن طَيِّبَٰتِ مَا رَزَقْنَٰكُمْۖ وَمَا ظَلَمُونَاۖ وَلَٰكِن كَانُوٓاْ أَنفُسَهُمْ يَظْلِمُونَۖ","وَإِذْ قُلْنَا اَ۟دْخُلُواْ هَٰذِهِ اِ۬لْقَرْيَةَ فَكُلُواْ مِنْهَا حَيْثُ شِئْتُمْ رَغَداٗ وَادْخُلُواْ اُ۬لْبَابَ سُجَّداٗ وَقُولُواْ حِطَّةٞ يُغْفَرْ لَكُمْ خَطَٰيٰ۪كُمْۖ وَسَنَزِيدُ اُ۬لْمُحْسِنِينَۖ","فَبَدَّلَ اَ۬لذِينَ ظَلَمُواْ قَوْلاً غَيْرَ اَ۬لذِے قِيلَ لَهُمْ فَأَنزَلْنَا عَلَى اَ۬لذِينَ ظَلَمُواْ رِجْزاٗ مِّنَ اَ۬لسَّمَآءِ بِمَا كَانُواْ يَفْسُقُونَۖ","۞ وَإِذِ اِ۪سْتَسْق۪ىٰ مُوس۪ىٰ لِقَوْمِهِۦ فَقُلْنَا اَ۪ضْرِب بِّعَصَاكَ اَ۬لْحَجَرَۖ فَانفَجَرَتْ مِنْهُ اُ۪ثْنَتَا عَشْرَةَ عَيْناٗۖ قَدْ عَلِمَ كُلُّ أُنَاسٖ مَّشْرَبَهُمْۖ كُلُواْ وَاشْرَبُواْ مِن رِّزْقِ اِ۬للَّهِۖ وَلَا تَعْثَوْاْ فِے اِ۬لَارْضِ مُفْسِدِينَۖ","وَإِذْ قُلْتُمْ يَٰمُوس۪ىٰ لَن نَّصْبِرَ عَلَىٰ طَعَامٖ وَٰحِدٖ فَادْعُ لَنَا رَبَّكَ يُخْرِجْ لَنَا مِمَّا تُنۢبِتُ اُ۬لَارْضُ مِنۢ بَقْلِهَا وَقِثَّآئِهَا وَفُومِهَا وَعَدَسِهَا وَبَصَلِهَاۖ قَالَ أَتَسْتَبْدِلُونَ اَ۬لذِے هُوَ أَدْن۪ىٰ بِالذِے هُوَ خَيْرٌۖ اِ۪هْبِطُواْ مِصْراٗ فَإِنَّ لَكُم مَّا سَأَلْتُمْۖ وَضُرِبَتْ عَلَيْهِمُ اُ۬لذِّلَّةُ وَالْمَسْكَنَةُ وَبَآءُو بِغَضَبٖ مِّنَ اَ۬للَّهِۖ ذَٰلِكَ بِأَنَّهُمْ كَانُواْ يَكْفُرُونَ بِـَٔايَٰتِ اِ۬للَّهِ وَيَقْتُلُونَ اَ۬لنَّبِيٓـِٕۧنَ بِغَيْرِ اِ۬لْحَقِّۖ ذَٰلِكَ بِمَا عَصَواْ وَّكَانُواْ يَعْتَدُونَۖ","إِنَّ اَ۬لذِينَ ءَامَنُواْ وَالذِينَ هَادُواْ وَالنَّصَٰر۪ىٰ وَالصَّٰبِينَ مَنَ اٰمَنَ بِاللَّهِ وَالْيَوْمِ اِ۬لَاخِرِ وَعَمِلَ صَٰلِحاٗ فَلَهُمُۥٓ أَجْرُهُمْ عِندَ رَبِّهِمْ وَلَا خَوْفٌ عَلَيْهِمْ وَلَا هُمْ يَحْزَنُونَۖ","وَإِذَ اَخَذْنَا مِيثَٰقَكُمْ وَرَفَعْنَا فَوْقَكُمُ اُ۬لطُّورَۖ خُذُواْ مَآ ءَاتَيْنَٰكُم بِقُوَّةٖ وَاذْكُرُواْ مَا فِيهِ لَعَلَّكُمْ تَتَّقُونَۖ","ثُمَّ تَوَلَّيْتُم مِّنۢ بَعْدِ ذَٰلِكَۖ فَلَوْلَا فَضْلُ اُ۬للَّهِ عَلَيْكُمْ وَرَحْمَتُهُۥ لَكُنتُم مِّنَ اَ۬لْخَٰسِرِينَۖ","وَلَقَدْ عَلِمْتُمُ اُ۬لذِينَ اَ۪عْتَدَوْاْ مِنكُمْ فِے اِ۬لسَّبْتِ فَقُلْنَا لَهُمْ كُونُواْ قِرَدَةً خَٰسِـِٕينَۖ","فَجَعَلْنَٰهَا نَكَٰلاٗ لِّمَا بَيْنَ يَدَيْهَا وَمَا خَلْفَهَا وَمَوْعِظَةٗ لِّلْمُتَّقِينَۖ","۞ وَإِذْ قَالَ مُوس۪ىٰ لِقَوْمِهِۦٓ إِنَّ اَ۬للَّهَ يَامُرُكُمُۥٓ أَن تَذْبَحُواْ بَقَرَةٗۖ قَالُوٓاْ أَتَتَّخِذُنَا هُزُؤاٗۖ قَالَ أَعُوذُ بِاللَّهِ أَنَ اَكُونَ مِنَ اَ۬لْجَٰهِلِينَۖ","قَالُواْ اُ۟دْعُ لَنَا رَبَّكَ يُبَيِّن لَّنَا مَا هِيَۖ قَالَ إِنَّهُۥ يَقُولُ إِنَّهَا بَقَرَةٞ لَّا فَارِضٞ وَلَا بِكْرٌۖ عَوَانُۢ بَيْنَ ذَٰلِكَۖ فَافْعَلُواْ مَا تُومَرُونَۖ","قَالُواْ اُ۟دْعُ لَنَا رَبَّكَ يُبَيِّن لَّنَا مَا لَوْنُهَاۖ قَالَ إِنَّهُۥ يَقُولُ إِنَّهَا بَقَرَةٞ صَفْرَآءُ فَاقِعٞ لَّوْنُهَاۖ تَسُرُّ اُ۬لنَّٰظِرِينَۖ","قَالُواْ اُ۟دْعُ لَنَا رَبَّكَ يُبَيِّن لَّنَا مَا هِيَ إِنَّ اَ۬لْبَقَرَ تَشَٰبَهَ عَلَيْنَا وَإِنَّآ إِن شَآءَ اَ۬للَّهُ لَمُهْتَدُونَۖ","قَالَ إِنَّهُۥ يَقُولُ إِنَّهَا بَقَرَةٞ لَّا ذَلُولٞ تُثِيرُ اُ۬لَارْضَ وَلَا تَسْقِے اِ۬لْحَرْثَۖ مُسَلَّمَةٞ لَّا شِيَةَ فِيهَاۖ قَالُواْ اُ۬لَٰنَ جِئْتَ بِالْحَقِّۖ فَذَبَحُوهَا وَمَا كَادُواْ يَفْعَلُونَۖ","وَإِذْ قَتَلْتُمْ نَفْساٗ فَادَّٰرَٰٔتُمْ فِيهَاۖ وَاللَّهُ مُخْرِجٞ مَّا كُنتُمْ تَكْتُمُونَۖ","فَقُلْنَا اَ۪ضْرِبُوهُ بِبَعْضِهَاۖ كَذَٰلِكَ يُحْيِ اِ۬للَّهُ اُ۬لْمَوْت۪ىٰ وَيُرِيكُمُۥٓ ءَايَٰتِهِۦ لَعَلَّكُمْ تَعْقِلُونَۖ","ثُمَّ قَسَتْ قُلُوبُكُم مِّنۢ بَعْدِ ذَٰلِكَ فَهِيَ كَالْحِجَارَةِ أَوَ اَشَدُّ قَسْوَةٗۖ وَإِنَّ مِنَ اَ۬لْحِجَارَةِ لَمَا يَتَفَجَّرُ مِنْهُ اُ۬لَانْهَٰرُۖ وَإِنَّ مِنْهَا لَمَا يَشَّقَّقُ فَيَخْرُجُ مِنْهُ اُ۬لْمَآءُۖ وَإِنَّ مِنْهَا لَمَا يَهْبِطُ مِنْ خَشْيَةِ اِ۬للَّهِۖ وَمَا اَ۬للَّهُ بِغَٰفِلٍ عَمَّا تَعْمَلُونَۖ","أَفَتَطْمَعُونَ أَنْ يُّومِنُواْ لَكُمْ وَقَدْ كَانَ فَرِيقٞ مِّنْهُمْ يَسْمَعُونَ كَلَٰمَ اَ۬للَّهِ ثُمَّ يُحَرِّفُونَهُۥ مِنۢ بَعْدِ مَا عَقَلُوهُ وَهُمْ يَعْلَمُونَۖ","۞ وَإِذَا لَقُواْ اُ۬لذِينَ ءَامَنُواْ قَالُوٓاْ ءَامَنَّاۖ وَإِذَا خَلَا بَعْضُهُمُۥٓ إِلَىٰ بَعْضٖ قَالُوٓاْ أَتُحَدِّثُونَهُم بِمَا فَتَحَ اَ۬للَّهُ عَلَيْكُمْ لِيُحَآجُّوكُم بِهِۦ عِندَ رَبِّكُمُۥٓۖ أَفَلَا تَعْقِلُونَۖ","أَوَلَا يَعْلَمُونَ أَنَّ اَ۬للَّهَ يَعْلَمُ مَا يُسِرُّونَ وَمَا يُعْلِنُونَۖ","وَمِنْهُمُۥٓ أُمِّيُّونَ لَا يَعْلَمُونَ اَ۬لْكِتَٰبَ إِلَّآ أَمَانِيَّۖ وَإِنْ هُمُۥٓ إِلَّا يَظُنُّونَۖ","فَوَيْلٞ لِّلذِينَ يَكْتُبُونَ اَ۬لْكِتَٰبَ بِأَيْدِيهِمْ ثُمَّ يَقُولُونَ هَٰذَا مِنْ عِندِ اِ۬للَّهِ لِيَشْتَرُواْ بِهِۦ ثَمَناٗ قَلِيلاٗۖ فَوَيْلٞ لَّهُم مِّمَّا كَتَبَتَ اَيْدِيهِمْۖ وَوَيْلٞ لَّهُم مِّمَّا يَكْسِبُونَۖ","وَقَالُواْ لَن تَمَسَّنَا اَ۬لنَّارُ إِلَّآ أَيَّاماٗ مَّعْدُودَةٗۖ قُلَ اَتَّخَذتُّمْ عِندَ اَ۬للَّهِ عَهْداٗ فَلَنْ يُّخْلِفَ اَ۬للَّهُ عَهْدَهُۥٓۖ أَمْ تَقُولُونَ عَلَى اَ۬للَّهِ مَا لَا تَعْلَمُونَۖ","بَل۪ىٰ مَن كَسَبَ سَيِّئَةٗ وَأَحَٰطَتْ بِهِۦ خَطِيٓـَٰٔتُهُۥ فَأُوْلَٰٓئِكَ أَصْحَٰبُ اُ۬لنّ۪ارِ هُمْ فِيهَا خَٰلِدُونَۖ","وَالذِينَ ءَامَنُواْ وَعَمِلُواْ اُ۬لصَّٰلِحَٰتِ أُوْلَٰٓئِكَ أَصْحَٰبُ اُ۬لْجَنَّةِ هُمْ فِيهَا خَٰلِدُونَۖ","وَإِذَ اَخَذْنَا مِيثَٰقَ بَنِےٓ إِسْرَآءِيلَ لَا تَعْبُدُونَ إِلَّا اَ۬للَّهَۖ وَبِالْوَٰلِدَيْنِ إِحْسَٰناٗ وَذِے اِ۬لْقُرْب۪ىٰ وَالْيَتَٰم۪ىٰ وَالْمَسَٰكِينِۖ وَقُولُواْ لِلنَّاسِ حُسْناٗۖ وَأَقِيمُواْ اُ۬لصَّلَوٰةَ وَءَاتُواْ اُ۬لزَّكَوٰةَۖ ثُمَّ تَوَلَّيْتُمُۥٓ إِلَّا قَلِيلاٗ مِّنكُمْ وَأَنتُم مُّعْرِضُونَۖ","وَإِذَ اَخَذْنَا مِيثَٰقَكُمْ لَا تَسْفِكُونَ دِمَآءَكُمْ وَلَا تُخْرِجُونَ أَنفُسَكُم مِّن دِيٰ۪رِكُمْ ثُمَّ أَقْرَرْتُمْ وَأَنتُمْ تَشْهَدُونَۖ","ثُمَّ أَنتُمْ هَٰٓؤُلَآءِ تَقْتُلُونَ أَنفُسَكُمْ وَتُخْرِجُونَ فَرِيقاٗ مِّنكُم مِّن دِيٰ۪رِهِمْ تَظَّٰهَرُونَ عَلَيْهِم بِالِاثْمِ وَالْعُدْوَٰنِۖ ۞ وَإِنْ يَّاتُوكُمُۥٓ أُسَٰر۪ىٰ تُفَٰدُوهُمْ وَهُوَ مُحَرَّمٌ عَلَيْكُمُۥٓ إِخْرَاجُهُمُۥٓۖ أَفَتُومِنُونَ بِبَعْضِ اِ۬لْكِتَٰبِ وَتَكْفُرُونَ بِبَعْضٖۖ فَمَا جَزَآءُ مَنْ يَّفْعَلُ ذَٰلِكَ مِنكُمُۥٓ إِلَّا خِزْيٞ فِے اِ۬لْحَيَوٰةِ اِ۬لدُّنْي۪اۖ وَيَوْمَ اَ۬لْقِيَٰمَةِ يُرَدُّونَ إِلَىٰٓ أَشَدِّ اِ۬لْعَذَابِۖ وَمَا اَ۬للَّهُ بِغَٰفِلٍ عَمَّا يَعْمَلُونَۖ","أُوْلَٰٓئِكَ اَ۬لذِينَ اَ۪شْتَرَوُاْ اُ۬لْحَيَوٰةَ اَ۬لدُّنْي۪ا بِالَاخِرَةِ فَلَا يُخَفَّفُ عَنْهُمُ اُ۬لْعَذَابُ وَلَا هُمْ يُنصَرُونَۖ","وَلَقَدَ اٰتَيْنَا مُوسَى اَ۬لْكِتَٰبَ وَقَفَّيْنَا مِنۢ بَعْدِهِۦ بِالرُّسُلِۖ وَءَاتَيْنَا عِيسَى اَ۪بْنَ مَرْيَمَ اَ۬لْبَيِّنَٰتِ وَأَيَّدْنَٰهُ بِرُوحِ اِ۬لْقُدُسِۖ أَفَكُلَّمَا جَآءَكُمْ رَسُولُۢ بِمَا لَا تَهْو۪ىٰٓ أَنفُسُكُمُ اُ۪سْتَكْبَرْتُمْۖ فَفَرِيقاٗ كَذَّبْتُمْۖ وَفَرِيقاٗ تَقْتُلُونَۖ","وَقَالُواْ قُلُوبُنَا غُلْفُۢۖ بَل لَّعَنَهُمُ اُ۬للَّهُ بِكُفْرِهِمْ فَقَلِيلاٗ مَّا يُومِنُونَۖ","وَلَمَّا جَآءَهُمْ كِتَٰبٞ مِّنْ عِندِ اِ۬للَّهِ مُصَدِّقٞ لِّمَا مَعَهُمْ وَكَانُواْ مِن قَبْلُ يَسْتَفْتِحُونَ عَلَى اَ۬لذِينَ كَفَرُواْۖ فَلَمَّا جَآءَهُم مَّا عَرَفُواْ كَفَرُواْ بِهِۦۖ فَلَعْنَةُ اُ۬للَّهِ عَلَى اَ۬لْكٰ۪فِرِينَۖ","بِيسَمَا اَ۪شْتَرَوْاْ بِهِۦٓ أَنفُسَهُمُۥٓ أَنْ يَّكْفُرُواْ بِمَآ أَنزَلَ اَ۬للَّهُ بَغْياً اَنْ يُّنَزِّلَ اَ۬للَّهُ مِن فَضْلِهِۦ عَلَىٰ مَنْ يَّشَآءُ مِنْ عِبَادِهِۦۖ فَبَآءُو بِغَضَبٍ عَلَىٰ غَضَبٖۖ وَلِلْكٰ۪فِرِينَ عَذَابٞ مُّهِينٞۖ","وَإِذَا قِيلَ لَهُمُۥٓ ءَامِنُواْ بِمَآ أَنزَلَ اَ۬للَّهُ قَالُواْ نُومِنُ بِمَآ أُنزِلَ عَلَيْنَا وَيَكْفُرُونَ بِمَا وَرَآءَهُۥۖ وَهُوَ اَ۬لْحَقُّ مُصَدِّقاٗ لِّمَا مَعَهُمْۖ قُلْ فَلِمَ تَقْتُلُونَ أَنۢبِئَآءَ اَ۬للَّهِ مِن قَبْلُ إِن كُنتُم مُّومِنِينَۖ","۞ وَلَقَدْ جَآءَكُم مُّوس۪ىٰ بِالْبَيِّنَٰتِ ثُمَّ اَ۪تَّخَذتُّمُ اُ۬لْعِجْلَ مِنۢ بَعْدِهِۦ وَأَنتُمْ ظَٰلِمُونَۖ","وَإِذَ اَخَذْنَا مِيثَٰقَكُمْ وَرَفَعْنَا فَوْقَكُمُ اُ۬لطُّورَۖ خُذُواْ مَآ ءَاتَيْنَٰكُم بِقُوَّةٖ وَاسْمَعُواْۖ قَالُواْ سَمِعْنَا وَعَصَيْنَاۖ وَأُشْرِبُواْ فِے قُلُوبِهِمُ اُ۬لْعِجْلَ بِكُفْرِهِمْۖ قُلْ بِيسَمَا يَامُرُكُم بِهِۦٓ إِيمَٰنُكُمُۥٓ إِن كُنتُم مُّومِنِينَۖ","قُلِ اِن كَانَتْ لَكُمُ اُ۬لدَّارُ اُ۬لَاخِرَةُ عِندَ اَ۬للَّهِ خَالِصَةٗ مِّن دُونِ اِ۬لنَّاسِ فَتَمَنَّوُاْ اُ۬لْمَوْتَ إِن كُنتُمْ صَٰدِقِينَۖ","وَلَنْ يَّتَمَنَّوْهُ أَبَداَۢ بِمَا قَدَّمَتَ اَيْدِيهِمْۖ وَاللَّهُ عَلِيمُۢ بِالظَّٰلِمِينَۖ","وَلَتَجِدَنَّهُمُۥٓ أَحْرَصَ اَ۬لنَّاسِ عَلَىٰ حَيَوٰةٖۖ وَمِنَ اَ۬لذِينَ أَشْرَكُواْ يَوَدُّ أَحَدُهُمْ لَوْ يُعَمَّرُ أَلْفَ سَنَةٖۖ وَمَا هُوَ بِمُزَحْزِحِهِۦ مِنَ اَ۬لْعَذَابِ أَنْ يُّعَمَّرَۖ وَاللَّهُ بَصِيرُۢ بِمَا يَعْمَلُونَۖ","قُلْ مَن كَانَ عَدُوّاٗ لِّـجِبْرِيلَ فَإِنَّهُۥ نَزَّلَهُۥ عَلَىٰ قَلْبِكَ بِإِذْنِ اِ۬للَّهِ مُصَدِّقاٗ لِّمَا بَيْنَ يَدَيْهِ وَهُدىٗ وَبُشْر۪ىٰ لِلْمُومِنِينَۖ","مَن كَانَ عَدُوّاٗ لِّلهِ وَمَلَٰٓئِكَتِهِۦ وَرُسُلِهِۦ وَجِبْرِيلَ وَمِيكَٰٓئِلَ فَإِنَّ اَ۬للَّهَ عَدُوّٞ لِّلْكٰ۪فِرِينَۖ","وَلَقَدَ اَنزَلْنَآ إِلَيْكَ ءَايَٰتِۢ بَيِّنَٰتٖۖ وَمَا يَكْفُرُ بِهَآ إِلَّا اَ۬لْفَٰسِقُونَۖ","أَوَكُلَّمَا عَٰهَدُواْ عَهْداٗ نَّبَذَهُۥ فَرِيقٞ مِّنْهُمۖ بَلَ اَكْثَرُهُمْ لَا يُومِنُونَۖ","۞ وَلَمَّا جَآءَهُمْ رَسُولٞ مِّنْ عِندِ اِ۬للَّهِ مُصَدِّقٞ لِّمَا مَعَهُمْ نَبَذَ فَرِيقٞ مِّنَ اَ۬لذِينَ أُوتُواْ اُ۬لْكِتَٰبَ كِتَٰبَ اَ۬للَّهِ وَرَآءَ ظُهُورِهِمْ كَأَنَّهُمْ لَا يَعْلَمُونَۖ","وَاتَّبَعُواْ مَا تَتْلُواْ اُ۬لشَّيَٰطِينُ عَلَىٰ مُلْكِ سُلَيْمَٰنَۖ وَمَا كَفَرَ سُلَيْمَٰنُۖ وَلَٰكِنَّ اَ۬لشَّيَٰطِينَ كَفَرُواْ يُعَلِّمُونَ اَ۬لنَّاسَ اَ۬لسِّحْرَ وَمَآ أُنزِلَ عَلَى اَ۬لْمَلَكَيْنِ بِبَابِلَ هَارُوتَ وَمَارُوتَۖ وَمَا يُعَلِّمَٰنِ مِنَ اَحَدٍ حَتَّىٰ يَقُولَآ إِنَّمَا نَحْنُ فِتْنَةٞ فَلَا تَكْفُرْۖ فَيَتَعَلَّمُونَ مِنْهُمَا مَا يُفَرِّقُونَ بِهِۦ بَيْنَ اَ۬لْمَرْءِ وَزَوْجِهِۦۖ وَمَا هُم بِضَآرِّينَ بِهِۦ مِنَ اَحَدٍ اِلَّا بِإِذْنِ اِ۬للَّهِۖ وَيَتَعَلَّمُونَ مَا يَضُرُّهُمْ وَلَا يَنفَعُهُمْۖ وَلَقَدْ عَلِمُواْ لَمَنِ اِ۪شْتَر۪يٰهُ مَا لَهُۥ فِے اِ۬لَاخِرَةِ مِنْ خَلَٰقٖۖ وَلَبِيسَ مَا شَرَوْاْ بِهِۦٓ أَنفُسَهُمْ لَوْ كَانُواْ يَعْلَمُونَۖ","وَلَوَ اَنَّهُمُۥٓ ءَامَنُواْ وَاتَّقَوْاْ لَمَثُوبَةٞ مِّنْ عِندِ اِ۬للَّهِ خَيْرٞ لَّوْ كَانُواْ يَعْلَمُونَۖ","يَٰٓأَيُّهَا اَ۬لذِينَ ءَامَنُواْ لَا تَقُولُواْ رَٰعِنَا وَقُولُواْ اُ۟نظُرْنَا وَاسْمَعُواْۖ وَلِلْكٰ۪فِرِينَ عَذَابٌ اَلِيمٞۖ","مَّا يَوَدُّ اُ۬لذِينَ كَفَرُواْ مِنَ اَهْلِ اِ۬لْكِتَٰبِ وَلَا اَ۬لْمُشْرِكِينَ أَنْ يُّنَزَّلَ عَلَيْكُم مِّنْ خَيْرٖ مِّن رَّبِّكُمْۖ وَاللَّهُ يَخْتَصُّ بِرَحْمَتِهِۦ مَنْ يَّشَآءُۖ وَاللَّهُ ذُو اُ۬لْفَضْلِ اِ۬لْعَظِيمِۖ","۞ مَا نَنسَخْ مِنَ اٰيَةٍ اَوْ نُنسِهَا نَاتِ بِخَيْرٖ مِّنْهَآ أَوْ مِثْلِهَآۖ أَلَمْ تَعْلَمَ اَنَّ اَ۬للَّهَ عَلَىٰ كُلِّ شَےْءٖ قَدِيرٌۖ","اَلَمْ تَعْلَمَ اَنَّ اَ۬للَّهَ لَهُۥ مُلْكُ اُ۬لسَّمَٰوَٰتِ وَالَارْضِ وَمَا لَكُم مِّن دُونِ اِ۬للَّهِ مِنْ وَّلِيّٖ وَلَا نَصِيرٍۖ","اَمْ تُرِيدُونَ أَن تَسْـَٔلُواْ رَسُولَكُمْ كَمَا سُئِلَ مُوس۪ىٰ مِن قَبْلُۖ وَمَنْ يَّتَبَدَّلِ اِ۬لْكُفْرَ بِالِايمَٰنِ فَقَد ضَّلَّ سَوَآءَ اَ۬لسَّبِيلِۖ","وَدَّ كَثِيرٞ مِّنَ اَهْلِ اِ۬لْكِتَٰبِ لَوْ يَرُدُّونَكُم مِّنۢ بَعْدِ إِيمَٰنِكُمْ كُفَّاراًۖ حَسَداٗ مِّنْ عِندِ أَنفُسِهِم مِّنۢ بَعْدِ مَا تَبَيَّنَ لَهُمُ اُ۬لْحَقُّۖ فَاعْفُواْ وَاصْفَحُواْ حَتَّىٰ يَاتِيَ اَ۬للَّهُ بِأَمْرِهِۦٓۖ إِنَّ اَ۬للَّهَ عَلَىٰ كُلِّ شَےْءٖ قَدِيرٞۖ","وَأَقِيمُواْ اُ۬لصَّلَوٰةَ وَءَاتُواْ اُ۬لزَّكَوٰةَۖ وَمَا تُقَدِّمُواْ لِأَنفُسِكُم مِّنْ خَيْرٖ تَجِدُوهُ عِندَ اَ۬للَّهِۖ إِنَّ اَ۬للَّهَ بِمَا تَعْمَلُونَ بَصِيرٞۖ","وَقَالُواْ لَنْ يَّدْخُلَ اَ۬لْجَنَّةَ إِلَّا مَن كَانَ هُوداً اَوْ نَصَٰر۪ىٰۖ تِلْكَ أَمَانِيُّهُمْۖ قُلْ هَاتُواْ بُرْهَٰنَكُمُۥٓ إِن كُنتُمْ صَٰدِقِينَۖ","بَل۪ىٰ مَنَ اَسْلَمَ وَجْهَهُۥ لِلهِ وَهُوَ مُحْسِنٞ فَلَهُۥٓ أَجْرُهُۥ عِندَ رَبِّهِۦ وَلَا خَوْفٌ عَلَيْهِمْ وَلَا هُمْ يَحْزَنُونَۖ","وَقَالَتِ اِ۬لْيَهُودُ لَيْسَتِ اِ۬لنَّصَٰر۪ىٰ عَلَىٰ شَےْءٖ وَقَالَتِ اِ۬لنَّصَٰر۪ىٰ لَيْسَتِ اِ۬لْيَهُودُ عَلَىٰ شَےْءٖ وَهُمْ يَتْلُونَ اَ۬لْكِتَٰبَۖ كَذَٰلِكَ قَالَ اَ۬لذِينَ لَا يَعْلَمُونَ مِثْلَ قَوْلِهِمْۖ فَاللَّهُ يَحْكُمُ بَيْنَهُمْ يَوْمَ اَ۬لْقِيَٰمَةِ فِيمَا كَانُواْ فِيهِ يَخْتَلِفُونَۖ","۞ وَمَنَ اَظْلَمُ مِمَّن مَّنَعَ مَسَٰجِدَ اَ۬للَّهِ أَنْ يُّذْكَرَ فِيهَا اَ۪سْمُهُۥ وَسَع۪ىٰ فِے خَرَابِهَآۖ أُوْلَٰٓئِكَ مَا كَانَ لَهُمُۥٓ أَنْ يَّدْخُلُوهَآ إِلَّا خَآئِفِينَۖ لَهُمْ فِے اِ۬لدُّنْي۪ا خِزْيٞۖ وَلَهُمْ فِے اِ۬لَاخِرَةِ عَذَابٌ عَظِيمٞۖ","وَلِلهِ اِ۬لْمَشْرِقُ وَالْمَغْرِبُۖ فَأَيْنَمَا تُوَلُّواْ فَثَمَّ وَجْهُ اُ۬للَّهِۖ إِنَّ اَ۬للَّهَ وَٰسِعٌ عَلِيمٞۖ","وَقَالُواْ اُ۪تَّخَذَ اَ۬للَّهُ وَلَداٗۖ سُبْحَٰنَهُۥۖ بَل لَّهُۥ مَا فِے اِ۬لسَّمَٰوَٰتِ وَالَارْضِۖ كُلّٞ لَّهُۥ قَٰنِتُونَۖ","بَدِيعُ اُ۬لسَّمَٰوَٰتِ وَالَارْضِۖ وَإِذَا قَض۪ىٰٓ أَمْراٗ فَإِنَّمَا يَقُولُ لَهُۥ كُنۖ فَيَكُونُۖ","وَقَالَ اَ۬لذِينَ لَا يَعْلَمُونَ لَوْلَا يُكَلِّمُنَا اَ۬للَّهُ أَوْ تَاتِينَآ ءَايَةٞۖ كَذَٰلِكَ قَالَ اَ۬لذِينَ مِن قَبْلِهِم مِّثْلَ قَوْلِهِمْۖ تَشَٰبَهَتْ قُلُوبُهُمْۖ قَدْ بَيَّنَّا اَ۬لَايَٰتِ لِقَوْمٖ يُوقِنُونَۖ","إِنَّآ أَرْسَلْنَٰكَ بِالْحَقِّ بَشِيراٗ وَنَذِيراٗۖ وَلَا تَسْـَٔلْ عَنَ اَصْحَٰبِ اِ۬لْجَحِيمِۖ","وَلَن تَرْض۪ىٰ عَنكَ اَ۬لْيَهُودُ وَلَا اَ۬لنَّصَٰر۪ىٰ حَتَّىٰ تَتَّبِعَ مِلَّتَهُمْۖ قُلِ اِنَّ هُدَى اَ۬للَّهِ هُوَ اَ۬لْهُد۪ىٰۖ وَلَئِنِ اِ۪تَّبَعْتَ أَهْوَآءَهُم بَعْدَ اَ۬لذِے جَآءَكَ مِنَ اَ۬لْعِلْمِ مَا لَكَ مِنَ اَ۬للَّهِ مِنْ وَّلِيّٖ وَلَا نَصِيرٍۖ","اِ۬لذِينَ ءَاتَيْنَٰهُمُ اُ۬لْكِتَٰبَ يَتْلُونَهُۥ حَقَّ تِلَٰوَتِهِۦٓ أُوْلَٰٓئِكَ يُومِنُونَ بِهِۦۖ وَمَنْ يَّكْفُرْ بِهِۦ فَأُوْلَٰٓئِكَ هُمُ اُ۬لْخَٰسِرُونَۖ","يَٰبَنِےٓ إِسْرَآءِيلَ اَ۟ذْكُرُواْ نِعْمَتِيَ اَ۬لتِےٓ أَنْعَمْتُ عَلَيْكُمْ وَأَنِّے فَضَّلْتُكُمْ عَلَى اَ۬لْعَٰلَمِينَۖ","وَاتَّقُواْ يَوْماٗ لَّا تَجْزِے نَفْسٌ عَن نَّفْسٖ شَئْاٗ وَلَا يُقْبَلُ مِنْهَا عَدْلٞ وَلَا تَنفَعُهَا شَفَٰعَةٞ وَلَا هُمْ يُنصَرُونَۖ","۞ وَإِذِ اِ۪بْتَل۪ىٰٓ إِبْرَٰهِـيمَ رَبُّهُۥ بِكَلِمَٰتٖ فَأَتَمَّهُنَّۖ قَالَ إِنِّے جَاعِلُكَ لِلنَّاسِ إِمَاماٗۖ قَالَ وَمِن ذُرِّيَّتِےۖ قَالَ لَا يَنَالُ عَهْدِيَ اَ۬لظَّٰلِمِينَۖ","وَإِذْ جَعَلْنَا اَ۬لْبَيْتَ مَثَابَةٗ لِّلنَّاسِ وَأَمْناٗ وَاتَّخَذُواْ مِن مَّقَامِ إِبْرَٰهِيمَ مُصَلّىٗۖ وَعَهِدْنَآ إِلَىٰٓ إِبْرَٰهِيمَ وَإِسْمَٰعِيلَ أَن طَهِّرَا بَيْتِيَ لِلطَّآئِفِينَ وَالْعَٰكِفِينَ وَالرُّكَّعِ اِ۬لسُّجُودِۖ","وَإِذْ قَالَ إِبْرَٰهِيمُ رَبِّ اِ۪جْعَلْ هَٰذَا بَلَداً اٰمِناٗ وَارْزُقَ اَهْلَهُۥ مِنَ اَ۬لثَّمَرَٰتِ مَنَ اٰمَنَ مِنْهُم بِاللَّهِ وَالْيَوْمِ اِ۬لَاخِرِۖ قَالَ وَمَن كَفَرَ فَأُمَتِّعُهُۥ قَلِيلاٗ ثُمَّ أَضْطَرُّهُۥٓ إِلَىٰ عَذَابِ اِ۬لنّ۪ارِۖ وَبِيسَ اَ۬لْمَصِيرُۖ","وَإِذْ يَرْفَعُ إِبْرَٰهِيمُ اُ۬لْقَوَاعِدَ مِنَ اَ۬لْبَيْتِ وَإِسْمَٰعِيلُۖ رَبَّنَا تَقَبَّلْ مِنَّآ إِنَّكَ أَنتَ اَ۬لسَّمِيعُ اُ۬لْعَلِيمُۖ","رَبَّنَا وَاجْعَلْنَا مُسْلِمَيْنِ لَكَ وَمِن ذُرِّيَّتِنَآ أُمَّةٗ مُّسْلِمَةٗ لَّكَۖ وَأَرِنَا مَنَاسِكَنَاۖ وَتُبْ عَلَيْنَآۖ إِنَّكَ أَنتَ اَ۬لتَّوَّابُ اُ۬لرَّحِيمُۖ","رَبَّنَا وَابْعَثْ فِيهِمْ رَسُولاٗ مِّنْهُمْ يَتْلُواْ عَلَيْهِمُۥٓ ءَايَٰتِكَ وَيُعَلِّمُهُمُ اُ۬لْكِتَٰبَ وَالْحِكْمَةَ وَيُزَكِّيهِمُۥٓۖ إِنَّكَ أَنتَ اَ۬لْعَزِيزُ اُ۬لْحَكِيمُۖ","وَمَنْ يَّرْغَبُ عَن مِّلَّةِ إِبْرَٰهِيمَ إِلَّا مَن سَفِهَ نَفْسَهُۥۖ وَلَقَدِ اِ۪صْطَفَيْنَٰهُ فِے اِ۬لدُّنْي۪اۖ وَإِنَّهُۥ فِے اِ۬لَاخِرَةِ لَمِنَ اَ۬لصَّٰلِحِينَۖ","إِذْ قَالَ لَهُۥ رَبُّهُۥٓ أَسْلِمْۖ قَالَ أَسْلَمْتُ لِرَبِّ اِ۬لْعَٰلَمِينَۖ","وَأَوْص۪ىٰ بِهَآ إِبْرَٰهِيمُ بَنِيهِۖ وَيَعْقُوبُ يَٰبَنِيَّ إِنَّ اَ۬للَّهَ اَ۪صْطَف۪ىٰ لَكُمُ اُ۬لدِّينَ فَلَا تَمُوتُنَّ إِلَّا وَأَنتُم مُّسْلِمُونَۖ","۞ أَمْ كُنتُمْ شُهَدَآءَ ا۪ذْ حَضَرَ يَعْقُوبَ اَ۬لْمَوْتُ إِذْ قَالَ لِبَنِيهِ مَا تَعْبُدُونَ مِنۢ بَعْدِےۖ قَالُواْ نَعْبُدُ إِلَٰهَكَ وَإِلَٰهَ ءَابَآئِكَ إِبْرَٰهِيمَ وَإِسْمَٰعِيلَ وَإِسْحَٰقَ إِلَٰهاٗ وَٰحِداٗ وَنَحْنُ لَهُۥ مُسْلِمُونَۖ","تِلْكَ أُمَّةٞ قَدْ خَلَتْۖ لَهَا مَا كَسَبَتْۖ وَلَكُم مَّا كَسَبْتُمْۖ وَلَا تُسْـَٔلُونَ عَمَّا كَانُواْ يَعْمَلُونَۖ","وَقَالُواْ كُونُواْ هُوداً اَوْ نَصَٰر۪ىٰ تَهْتَدُواْۖ قُلْ بَلْ مِلَّةَ إِبْرَٰهِيمَ حَنِيفاٗۖ وَمَا كَانَ مِنَ اَ۬لْمُشْرِكِينَۖ","قُولُوٓاْ ءَامَنَّا بِاللَّهِ وَمَآ أُنزِلَ إِلَيْنَا وَمَآ أُنزِلَ إِلَىٰٓ إِبْرَٰهِيمَ وَإِسْمَٰعِيلَ وَإِسْحَٰقَ وَيَعْقُوبَ وَالَاسْبَاطِ وَمَآ أُوتِيَ مُوس۪ىٰ وَعِيس۪ىٰ وَمَآ أُوتِيَ اَ۬لنَّبِيٓـُٔونَ مِن رَّبِّهِمْ لَا نُفَرِّقُ بَيْنَ أَحَدٖ مِّنْهُمْ وَنَحْنُ لَهُۥ مُسْلِمُونَۖ","فَإِنَ اٰمَنُواْ بِمِثْلِ مَآ ءَامَنتُم بِهِۦ فَقَدِ اِ۪هْتَدَواْۖ وَّإِن تَوَلَّوْاْ فَإِنَّمَا هُمْ فِے شِقَاقٖۖ فَسَيَكْفِيكَهُمُ اُ۬للَّهُۖ وَهُوَ اَ۬لسَّمِيعُ اُ۬لْعَلِيمُۖ","صِبْغَةَ اَ۬للَّهِۖ وَمَنَ اَحْسَنُ مِنَ اَ۬للَّهِ صِبْغَةٗۖ وَنَحْنُ لَهُۥ عَٰبِدُونَۖ","قُلَ اَتُحَآجُّونَنَا فِے اِ۬للَّهِ وَهُوَ رَبُّنَا وَرَبُّكُمْ وَلَنَآ أَعْمَٰلُنَا وَلَكُمُۥٓ أَعْمَٰلُكُمْۖ وَنَحْنُ لَهُۥ مُخْلِصُونَۖ","أَمْ يَقُولُونَ إِنَّ إِبْرَٰهِيمَ وَإِسْمَٰعِيلَ وَإِسْحَٰقَ وَيَعْقُوبَ وَالَاسْبَاطَ كَانُواْ هُوداً اَوْ نَصَٰر۪ىٰۖ قُلَ آٰنتُمُۥٓ أَعْلَمُ أَمِ اِ۬للَّهُۖ وَمَنَ اَظْلَمُ مِمَّن كَتَمَ شَهَٰدَةً عِندَهُۥ مِنَ اَ۬للَّهِۖ وَمَا اَ۬للَّهُ بِغَٰفِلٍ عَمَّا تَعْمَلُونَۖ","تِلْكَ أُمَّةٞ قَدْ خَلَتْۖ لَهَا مَا كَسَبَتْۖ وَلَكُم مَّا كَسَبْتُمْۖ وَلَا تُسْـَٔلُونَ عَمَّا كَانُواْ يَعْمَلُونَۖ","۞ سَيَقُولُ اُ۬لسُّفَهَآءُ مِنَ اَ۬لنَّاسِ مَا وَلّ۪يٰهُمْ عَن قِبْلَتِهِمُ اُ۬لتِے كَانُواْ عَلَيْهَاۖ قُل لِّلهِ اِ۬لْمَشْرِقُ وَالْمَغْرِبُۖ يَهْدِے مَنْ يَّشَآءُ اِ۪لَىٰ صِرَٰطٖ مُّسْتَقِيمٖۖ","وَكَذَٰلِكَ جَعَلْنَٰكُمُۥٓ أُمَّةٗ وَسَطاٗۖ لِّتَكُونُواْ شُهَدَآءَ عَلَى اَ۬لنَّاسِ وَيَكُونَ اَ۬لرَّسُولُ عَلَيْكُمْ شَهِيداٗۖ وَمَا جَعَلْنَا اَ۬لْقِبْلَةَ اَ۬لتِے كُنتَ عَلَيْهَآ إِلَّا لِنَعْلَمَ مَنْ يَّتَّبِعُ اُ۬لرَّسُولَ مِمَّنْ يَّنقَلِبُ عَلَىٰ عَقِبَيْهِۖ وَإِن كَانَتْ لَكَبِيرَةً اِلَّا عَلَى اَ۬لذِينَ هَدَى اَ۬للَّهُۖ وَمَا كَانَ اَ۬للَّهُ لِيُضِيعَ إِيمَٰنَكُمُۥٓۖ إِنَّ اَ۬للَّهَ بِالنَّاسِ لَرَءُوفٞ رَّحِيمٞۖ","قَدْ نَر۪ىٰ تَقَلُّبَ وَجْهِكَ فِے اِ۬لسَّمَآءِ فَلَنُوَلِّيَنَّكَ قِبْلَةٗ تَرْض۪يٰهَاۖ فَوَلِّ وَجْهَكَ شَطْرَ اَ۬لْمَسْجِدِ اِ۬لْحَرَامِۖ وَحَيْثُ مَا كُنتُمْ فَوَلُّواْ وُجُوهَكُمْ شَطْرَهُۥۖ وَإِنَّ اَ۬لذِينَ أُوتُواْ اُ۬لْكِتَٰبَ لَيَعْلَمُونَ أَنَّهُ اُ۬لْحَقُّ مِن رَّبِّهِمْۖ وَمَا اَ۬للَّهُ بِغَٰفِلٍ عَمَّا يَعْمَلُونَۖ","وَلَئِنَ اَتَيْتَ اَ۬لذِينَ أُوتُواْ اُ۬لْكِتَٰبَ بِكُلِّ ءَايَةٖ مَّا تَبِعُواْ قِبْلَتَكَۖ وَمَآ أَنتَ بِتَابِعٖ قِبْلَتَهُمْۖ وَمَا بَعْضُهُم بِتَابِعٖ قِبْلَةَ بَعْضٖۖ وَلَئِنِ اِ۪تَّبَعْتَ أَهْوَآءَهُم مِّنۢ بَعْدِ مَا جَآءَكَ مِنَ اَ۬لْعِلْمِ إِنَّكَ إِذاٗ لَّمِنَ اَ۬لظَّٰلِمِينَۖ","اَ۬لذِينَ ءَاتَيْنَٰهُمُ اُ۬لْكِتَٰبَ يَعْرِفُونَهُۥ كَمَا يَعْرِفُونَ أَبْنَآءَهُمْۖ وَإِنَّ فَرِيقاٗ مِّنْهُمْ لَيَكْتُمُونَ اَ۬لْحَقَّ وَهُمْ يَعْلَمُونَۖ","اَ۬لْحَقُّ مِن رَّبِّكَۖ فَلَا تَكُونَنَّ مِنَ اَ۬لْمُمْتَرِينَۖ","۞ وَلِكُلّٖ وِجْهَةٌ هُوَ مُوَلِّيهَا فَاسْتَبِقُواْ اُ۬لْخَيْرَٰتِۖ أَيْنَ مَا تَكُونُواْ يَاتِ بِكُمُ اُ۬للَّهُ جَمِيعاًۖ اِنَّ اَ۬للَّهَ عَلَىٰ كُلِّ شَےْءٖ قَدِيرٞۖ","وَمِنْ حَيْثُ خَرَجْتَ فَوَلِّ وَجْهَكَ شَطْرَ اَ۬لْمَسْجِدِ اِ۬لْحَرَامِۖ وَإِنَّهُۥ لَلْحَقُّ مِن رَّبِّكَۖ وَمَا اَ۬للَّهُ بِغَٰفِلٍ عَمَّا تَعْمَلُونَۖ","وَمِنْ حَيْثُ خَرَجْتَ فَوَلِّ وَجْهَكَ شَطْرَ اَ۬لْمَسْجِدِ اِ۬لْحَرَامِۖ وَحَيْثُ مَا كُنتُمْ فَوَلُّواْ وُجُوهَكُمْ شَطْرَهُۥ لِيَ۬لَّا يَكُونَ لِلنَّاسِ عَلَيْكُمْ حُجَّةٌ اِلَّا اَ۬لذِينَ ظَلَمُواْ مِنْهُمْ فَلَا تَخْشَوْهُمْ وَاخْشَوْنِےۖ وَلِأُتِمَّ نِعْمَتِے عَلَيْكُمْ وَلَعَلَّكُمْ تَهْتَدُونَۖ","كَمَآ أَرْسَلْنَا فِيكُمْ رَسُولاٗ مِّنكُمْ يَتْلُواْ عَلَيْكُمُۥٓ ءَايَٰتِنَا وَيُزَكِّيكُمْ وَيُعَلِّمُكُمُ اُ۬لْكِتَٰبَ وَالْحِكْمَةَ وَيُعَلِّمُكُم مَّا لَمْ تَكُونُواْ تَعْلَمُونَ","فَاذْكُرُونِےٓ أَذْكُرْكُمْ وَاشْكُرُواْ لِے وَلَا تَكْفُرُونِۖ","يَٰٓأَيُّهَا اَ۬لذِينَ ءَامَنُواْ اُ۪سْتَعِينُواْ بِالصَّبْرِ وَالصَّلَوٰةِۖ إِنَّ اَ۬للَّهَ مَعَ اَ۬لصَّٰبِرِينَۖ","وَلَا تَقُولُواْ لِمَنْ يُّقْتَلُ فِے سَبِيلِ اِ۬للَّهِ أَمْوَٰتُۢۖ بَلَ اَحْيَآءٞۖ وَلَٰكِن لَّا تَشْعُرُونَۖ","وَلَنَبْلُوَنَّكُم بِشَےْءٖ مِّنَ اَ۬لْخَوْفِ وَالْجُوعِ وَنَقْصٖ مِّنَ اَ۬لَامْوَٰلِ وَالَانفُسِ وَالثَّمَرَٰتِۖ وَبَشِّرِ اِ۬لصَّٰبِرِينَ","اَ۬لذِينَ إِذَآ أَصَٰبَتْهُم مُّصِيبَةٞ قَالُوٓاْ إِنَّا لِلهِ وَإِنَّآ إِلَيْهِ رَٰجِعُونَۖ","أُوْلَٰٓئِكَ عَلَيْهِمْ صَلَوَٰتٞ مِّن رَّبِّهِمْ وَرَحْمَةٞۖ وَأُوْلَٰٓئِكَ هُمُ اُ۬لْمُهْتَدُونَۖ","۞ إِنَّ اَ۬لصَّفَا وَالْمَرْوَةَ مِن شَعَٰٓئِرِ اِ۬للَّهِۖ فَمَنْ حَجَّ اَ۬لْبَيْتَ أَوِ اِ۪عْتَمَرَ فَلَا جُنَاحَ عَلَيْهِ أَنْ يَّطَّوَّفَ بِهِمَاۖ وَمَن تَطَوَّعَ خَيْراٗ فَإِنَّ اَ۬للَّهَ شَاكِرٌ عَلِيمٌۖ","اِنَّ اَ۬لذِينَ يَكْتُمُونَ مَآ أَنزَلْنَا مِنَ اَ۬لْبَيِّنَٰتِ وَالْهُد۪ىٰ مِنۢ بَعْدِ مَا بَيَّنَّٰهُ لِلنَّاسِ فِے اِ۬لْكِتَٰبِ أُوْلَٰٓئِكَ يَلْعَنُهُمُ اُ۬للَّهُ وَيَلْعَنُهُمُ اُ۬للَّٰعِنُونَ","إِلَّا اَ۬لذِينَ تَابُواْ وَأَصْلَحُواْ وَبَيَّنُواْ فَأُوْلَٰٓئِكَ أَتُوبُ عَلَيْهِمْ وَأَنَا اَ۬لتَّوَّابُ اُ۬لرَّحِيمُۖ","إِنَّ اَ۬لذِينَ كَفَرُواْ وَمَاتُواْ وَهُمْ كُفَّارٌ ا۟وْلَٰٓئِكَ عَلَيْهِمْ لَعْنَةُ اُ۬للَّهِ وَالْمَلَٰٓئِكَةِ وَالنَّاسِ أَجْمَعِينَ","خَٰلِدِينَ فِيهَاۖ لَا يُخَفَّفُ عَنْهُمُ اُ۬لْعَذَابُ وَلَا هُمْ يُنظَرُونَۖ","وَإِلَٰهُكُمُۥٓ إِلَٰهٞ وَٰحِدٞۖ لَّآ إِلَٰهَ إِلَّا هُوَۖ اَ۬لرَّحْمَٰنُ اُ۬لرَّحِيمُۖ","إِنَّ فِے خَلْقِ اِ۬لسَّمَٰوَٰتِ وَالَارْضِ وَاخْتِلَٰفِ اِ۬ليْلِ وَالنَّه۪ارِ وَالْفُلْكِ اِ۬لتِے تَجْرِے فِے اِ۬لْبَحْرِ بِمَا يَنفَعُ اُ۬لنَّاسَ وَمَآ أَنزَلَ اَ۬للَّهُ مِنَ اَ۬لسَّمَآءِ مِن مَّآءٖ فَأَحْي۪ا بِهِ اِ۬لَارْضَ بَعْدَ مَوْتِهَا وَبَثَّ فِيهَا مِن كُلِّ دَآبَّةٖ وَتَصْرِيفِ اِ۬لرِّيَٰحِ وَالسَّحَابِ اِ۬لْمُسَخَّرِ بَيْنَ اَ۬لسَّمَآءِ وَالَارْضِ لَأٓيَٰتٖ لِّقَوْمٖ يَعْقِلُونَۖ","وَمِنَ اَ۬لنَّاسِ مَنْ يَّتَّخِذُ مِن دُونِ اِ۬للَّهِ أَندَاداٗ يُحِبُّونَهُمْ كَحُبِّ اِ۬للَّهِۖ وَالذِينَ ءَامَنُوٓاْ أَشَدُّ حُبّاٗ لِّلهِۖ وَلَوْ تَرَى اَ۬لذِينَ ظَلَمُوٓاْ إِذْ يَرَوْنَ اَ۬لْعَذَابَ أَنَّ اَ۬لْقُوَّةَ لِلهِ جَمِيعاٗ وَأَنَّ اَ۬للَّهَ شَدِيدُ اُ۬لْعَذَابِۖ","۞ إِذْ تَبَرَّأَ اَ۬لذِينَ اَ۟تُّبِعُواْ مِنَ اَ۬لذِينَ اَ۪تَّبَعُواْ وَرَأَوُاْ اُ۬لْعَذَابَ وَتَقَطَّعَتْ بِهِمُ اُ۬لَاسْبَٰبُۖ","وَقَالَ اَ۬لذِينَ اَ۪تَّبَعُواْ لَوَ اَنَّ لَنَا كَرَّةٗ فَنَتَبَرَّأَ مِنْهُمْ كَمَا تَبَرَّءُواْ مِنَّاۖ كَذَٰلِكَ يُرِيهِمُ اُ۬للَّهُ أَعْمَٰلَهُمْ حَسَرَٰتٍ عَلَيْهِمْۖ وَمَا هُم بِخَٰرِجِينَ مِنَ اَ۬لنّ۪ارِۖ","يَٰٓأَيُّهَا اَ۬لنَّاسُ كُلُواْ مِمَّا فِے اِ۬لَارْضِ حَلَٰلاٗ طَيِّباٗۖ وَلَا تَتَّبِعُواْ خُطْوَٰتِ اِ۬لشَّيْطَٰنِۖ إِنَّهُۥ لَكُمْ عَدُوّٞ مُّبِينٌۖ","اِنَّمَا يَامُرُكُم بِالسُّوٓءِ وَالْفَحْشَآءِ وَأَن تَقُولُواْ عَلَى اَ۬للَّهِ مَا لَا تَعْلَمُونَۖ","وَإِذَا قِيلَ لَهُمُ اُ۪تَّبِعُواْ مَآ أَنزَلَ اَ۬للَّهُ قَالُواْ بَلْ نَتَّبِعُ مَآ أَلْفَيْنَا عَلَيْهِ ءَابَآءَنَآۖ أَوَلَوْ كَانَ ءَابَآؤُهُمْ لَا يَعْقِلُونَ شَئْاٗ وَلَا يَهْتَدُونَۖ","وَمَثَلُ اُ۬لذِينَ كَفَرُواْ كَمَثَلِ اِ۬لذِے يَنْعِقُ بِمَا لَا يَسْمَعُ إِلَّا دُعَآءٗ وَنِدَآءٗۖ صُمُّۢ بُكْمٌ عُمْيٞ فَهُمْ لَا يَعْقِلُونَۖ","يَٰٓأَيُّهَا اَ۬لذِينَ ءَامَنُواْ كُلُواْ مِن طَيِّبَٰتِ مَا رَزَقْنَٰكُمْ وَاشْكُرُواْ لِلهِ إِن كُنتُمُۥٓ إِيَّاهُ تَعْبُدُونَۖ","إِنَّمَا حَرَّمَ عَلَيْكُمُ اُ۬لْمَيْتَةَ وَالدَّمَ وَلَحْمَ اَ۬لْخِنزِيرِ وَمَآ أُهِلَّ بِهِۦ لِغَيْرِ اِ۬للَّهِۖ فَمَنُ اُ۟ضْطُرَّ غَيْرَ بَاغٖ وَلَا عَادٖ فَلَآ إِثْمَ عَلَيْهِۖ إِنَّ اَ۬للَّهَ غَفُورٞ رَّحِيمٌۖ","اِنَّ اَ۬لذِينَ يَكْتُمُونَ مَآ أَنزَلَ اَ۬للَّهُ مِنَ اَ۬لْكِتَٰبِ وَيَشْتَرُونَ بِهِۦ ثَمَناٗ قَلِيلاً ا۟وْلَٰٓئِكَ مَا يَاكُلُونَ فِے بُطُونِهِمُۥٓ إِلَّا اَ۬لنَّارَ وَلَا يُكَلِّمُهُمُ اُ۬للَّهُ يَوْمَ اَ۬لْقِيَٰمَةِ وَلَا يُزَكِّيهِمْۖ وَلَهُمْ عَذَابٌ اَلِيمٌۖ","ا۟وْلَٰٓئِكَ اَ۬لذِينَ اَ۪شْتَرَوُاْ اُ۬لضَّلَٰلَةَ بِالْهُد۪ىٰ وَالْعَذَابَ بِالْمَغْفِرَةِ فَمَآ أَصْبَرَهُمْ عَلَى اَ۬لنّ۪ارِۖ","ذَٰلِكَ بِأَنَّ اَ۬للَّهَ نَزَّلَ اَ۬لْكِتَٰبَ بِالْحَقِّۖ وَإِنَّ اَ۬لذِينَ اَ۪خْتَلَفُواْ فِے اِ۬لْكِتَٰبِ لَفِے شِقَاقِۢ بَعِيدٖۖ","۞ لَّيْسَ اَ۬لْبِرُّ أَن تُوَلُّواْ وُجُوهَكُمْ قِبَلَ اَ۬لْمَشْرِقِ وَالْمَغْرِبِۖ وَلَٰكِنِ اِ۬لْبِرُّ مَنَ اٰمَنَ بِاللَّهِ وَالْيَوْمِ اِ۬لَاخِرِ وَالْمَلَٰٓئِكَةِ وَالْكِتَٰبِ وَالنَّبِيٓـِٕۧنَ وَءَاتَى اَ۬لْمَالَ عَلَىٰ حُبِّهِۦ ذَوِے اِ۬لْقُرْب۪ىٰ وَالْيَتَٰم۪ىٰ وَالْمَسَٰكِينَ وَابْنَ اَ۬لسَّبِيلِ وَالسَّآئِلِينَ وَفِے اِ۬لرِّقَابِ وَأَقَامَ اَ۬لصَّلَوٰةَ وَءَاتَى اَ۬لزَّكَوٰةَۖ وَالْمُوفُونَ بِعَهْدِهِمُۥٓ إِذَا عَٰهَدُواْۖ وَالصَّٰبِرِينَ فِے اِ۬لْبَأْسَآءِ وَالضَّرَّآءِ وَحِينَ اَ۬لْبَأْسِۖ أُوْلَٰٓئِكَ اَ۬لذِينَ صَدَقُواْۖ وَأُوْلَٰٓئِكَ هُمُ اُ۬لْمُتَّقُونَۖ","يَٰٓأَيُّهَا اَ۬لذِينَ ءَامَنُواْ كُتِبَ عَلَيْكُمُ اُ۬لْقِصَاصُ فِے اِ۬لْقَتْلَىۖ اَ۬لْحُرُّ بِالْحُرِّ وَالْعَبْدُ بِالْعَبْدِ وَالُانث۪ىٰ بِالُانث۪ىٰۖ فَمَنْ عُفِيَ لَهُۥ مِنَ اَخِيهِ شَےْءٞ فَاتِّبَاعُۢ بِالْمَعْرُوفِ وَأَدَآءٌ اِلَيْهِ بِإِحْسَٰنٖۖ ذَٰلِكَ تَخْفِيفٞ مِّن رَّبِّكُمْ وَرَحْمَةٞۖ فَمَنِ اِ۪عْتَد۪ىٰ بَعْدَ ذَٰلِكَ فَلَهُۥ عَذَابٌ اَلِيمٞۖ","وَلَكُمْ فِے اِ۬لْقِصَاصِ حَيَوٰةٞ يَٰٓأُوْلِے اِ۬لَالْبَٰبِ لَعَلَّكُمْ تَتَّقُونَۖ","كُتِبَ عَلَيْكُمُۥٓ إِذَا حَضَرَ أَحَدَكُمُ اُ۬لْمَوْتُ إِن تَرَكَ خَيْراًۖ اِ۬لْوَصِيَّةُ لِلْوَٰلِدَيْنِ وَالَاقْرَبِينَ بِالْمَعْرُوفِۖ حَقّاً عَلَى اَ۬لْمُتَّقِينَۖ","فَمَنۢ بَدَّلَهُۥ بَعْدَ مَا سَمِعَهُۥ فَإِنَّمَآ إِثْمُهُۥ عَلَى اَ۬لذِينَ يُبَدِّلُونَهُۥٓۖ إِنَّ اَ۬للَّهَ سَمِيعٌ عَلِيمٞۖ","فَمَنْ خَافَ مِن مُّوصٖ جَنَفاً اَوِ اِثْماٗ فَأَصْلَحَ بَيْنَهُمْ فَلَآ إِثْمَ عَلَيْهِۖ إِنَّ اَ۬للَّهَ غَفُورٞ رَّحِيمٞۖ","يَٰٓأَيُّهَا اَ۬لذِينَ ءَامَنُواْ كُتِبَ عَلَيْكُمُ اُ۬لصِّيَامُ كَمَا كُتِبَ عَلَى اَ۬لذِينَ مِن قَبْلِكُمْ لَعَلَّكُمْ تَتَّقُونَ","أَيَّاماٗ مَّعْدُودَٰتٖۖ فَمَن كَانَ مِنكُم مَّرِيضاً اَوْ عَلَىٰ سَفَرٖ فَعِدَّةٞ مِّنَ اَيَّامٍ ا۟خَرَۖ وَعَلَى اَ۬لذِينَ يُطِيقُونَهُۥ فِدْيَةُ طَعَامِ مَسَٰكِينَۖ فَمَن تَطَوَّعَ خَيْراٗ فَهُوَ خَيْرٞ لَّهُۥۖ وَأَن تَصُومُواْ خَيْرٞ لَّكُمُۥٓ إِن كُنتُمْ تَعْلَمُونَۖ","۞ شَهْرُ رَمَضَانَ اَ۬لذِےٓ أُنزِلَ فِيهِ اِ۬لْقُرْءَانُ هُدىٗ لِّلنَّاسِ وَبَيِّنَٰتٖ مِّنَ اَ۬لْهُد۪ىٰ وَالْفُرْقَانِۖ فَمَن شَهِدَ مِنكُمُ اُ۬لشَّهْرَ فَلْيَصُمْهُۖ وَمَن كَانَ مَرِيضاً اَوْ عَلَىٰ سَفَرٖ فَعِدَّةٞ مِّنَ اَيَّامٍ ا۟خَرَۖ يُرِيدُ اُ۬للَّهُ بِكُمُ اُ۬لْيُسْرَ وَلَا يُرِيدُ بِكُمُ اُ۬لْعُسْرَۖ وَلِتُكْمِلُواْ اُ۬لْعِدَّةَ وَلِتُكَبِّرُواْ اُ۬للَّهَ عَلَىٰ مَا هَد۪يٰكُمْ وَلَعَلَّكُمْ تَشْكُرُونَۖ","وَإِذَا سَأَلَكَ عِبَادِے عَنِّے فَإِنِّے قَرِيبٌۖ ا۟جِيبُ دَعْوَةَ اَ۬لدَّاعِۦٓ إِذَا دَعَانِۦۖ فَلْيَسْتَجِيبُواْ لِے وَلْيُومِنُواْ بِيَ لَعَلَّهُمْ يَرْشُدُونَۖ","أُحِلَّ لَكُمْ لَيْلَةَ اَ۬لصِّيَامِ اِ۬لرَّفَثُ إِلَىٰ نِسَآئِكُمْۖ هُنَّ لِبَاسٞ لَّكُمْ وَأَنتُمْ لِبَاسٞ لَّهُنَّۖ عَلِمَ اَ۬للَّهُ أَنَّكُمْ كُنتُمْ تَخْتَانُونَ أَنفُسَكُمْ فَتَابَ عَلَيْكُمْ وَعَفَا عَنكُمْۖ فَالَٰنَ بَٰشِرُوهُنَّۖ وَابْتَغُواْ مَا كَتَبَ اَ۬للَّهُ لَكُمْۖ وَكُلُواْ وَاشْرَبُواْ حَتَّىٰ يَتَبَيَّنَ لَكُمُ اُ۬لْخَيْطُ اُ۬لَابْيَضُ مِنَ اَ۬لْخَيْطِ اِ۬لَاسْوَدِ مِنَ اَ۬لْفَجْرِۖ ثُمَّ أَتِمُّواْ اُ۬لصِّيَامَ إِلَى اَ۬ليْلِۖ وَلَا تُبَٰشِرُوهُنَّ وَأَنتُمْ عَٰكِفُونَ فِے اِ۬لْمَسَٰجِدِۖ تِلْكَ حُدُودُ اُ۬للَّهِۖ فَلَا تَقْرَبُوهَاۖ كَذَٰلِكَ يُبَيِّنُ اُ۬للَّهُ ءَايَٰتِهِۦ لِلنَّاسِ لَعَلَّهُمْ يَتَّقُونَۖ","وَلَا تَاكُلُوٓاْ أَمْوَٰلَكُم بَيْنَكُم بِالْبَٰطِلِ وَتُدْلُواْ بِهَآ إِلَى اَ۬لْحُكَّامِ لِتَاكُلُواْ فَرِيقاٗ مِّنَ اَمْوَٰلِ اِ۬لنَّاسِ بِالِاثْمِ وَأَنتُمْ تَعْلَمُونَۖ","۞ يَسْـَٔلُونَكَ عَنِ اِ۬لَاهِلَّةِۖ قُلْ هِيَ مَوَٰقِيتُ لِلنَّاسِ وَالْحَجِّۖ وَلَيْسَ اَ۬لْبِرُّ بِأَن تَاتُواْ اُ۬لْبُيُوتَ مِن ظُهُورِهَاۖ وَلَٰكِنِ اِ۬لْبِرُّ مَنِ اِ۪تَّق۪ىٰۖ وَاتُواْ اُ۬لْبُيُوتَ مِنَ اَبْوَٰبِهَاۖ وَاتَّقُواْ اُ۬للَّهَ لَعَلَّكُمْ تُفْلِحُونَۖ","وَقَٰتِلُواْ فِے سَبِيلِ اِ۬للَّهِ اِ۬لذِينَ يُقَٰتِلُونَكُمْ وَلَا تَعْتَدُوٓاْۖ إِنَّ اَ۬للَّهَ لَا يُحِبُّ اُ۬لْمُعْتَدِينَۖ","وَاقْتُلُوهُمْ حَيْثُ ثَقِفْتُمُوهُمْ وَأَخْرِجُوهُم مِّنْ حَيْثُ أَخْرَجُوكُمْۖ وَالْفِتْنَةُ أَشَدُّ مِنَ اَ۬لْقَتْلِۖ وَلَا تُقَٰتِلُوهُمْ عِندَ اَ۬لْمَسْجِدِ اِ۬لْحَرَامِ حَتَّىٰ يُقَٰتِلُوكُمْ فِيهِۖ فَإِن قَٰتَلُوكُمْ فَاقْتُلُوهُمْۖ كَذَٰلِكَ جَزَآءُ اُ۬لْكٰ۪فِرِينَۖ","فَإِنِ اِ۪نتَهَوْاْ فَإِنَّ اَ۬للَّهَ غَفُورٞ رَّحِيمٞۖ","وَقَٰتِلُوهُمْ حَتَّىٰ لَا تَكُونَ فِتْنَةٞ وَيَكُونَ اَ۬لدِّينُ لِلهِۖ فَإِنِ اِ۪نتَهَوْاْ فَلَا عُدْوَٰنَ إِلَّا عَلَى اَ۬لظَّٰلِمِينَۖ","اَ۬لشَّهْرُ اُ۬لْحَرَامُ بِالشَّهْرِ اِ۬لْحَرَامِ وَالْحُرُمَٰتُ قِصَاصٞۖ فَمَنِ اِ۪عْتَد۪ىٰ عَلَيْكُمْ فَاعْتَدُواْ عَلَيْهِ بِمِثْلِ مَا اَ۪عْتَد۪ىٰ عَلَيْكُمْۖ وَاتَّقُواْ اُ۬للَّهَ وَاعْلَمُوٓاْ أَنَّ اَ۬للَّهَ مَعَ اَ۬لْمُتَّقِينَۖ","وَأَنفِقُواْ فِے سَبِيلِ اِ۬للَّهِ وَلَا تُلْقُواْ بِأَيْدِيكُمُۥٓ إِلَى اَ۬لتَّهْلُكَةِ وَأَحْسِنُوٓاْۖ إِنَّ اَ۬للَّهَ يُحِبُّ اُ۬لْمُحْسِنِينَۖ","وَأَتِمُّواْ اُ۬لْحَجَّ وَالْعُمْرَةَ لِلهِۖ فَإِنُ ا۟حْصِرْتُمْ فَمَا اَ۪سْتَيْسَرَ مِنَ اَ۬لْهَدْيِۖ وَلَا تَحْلِقُواْ رُءُوسَكُمْ حَتَّىٰ يَبْلُغَ اَ۬لْهَدْيُ مَحِلَّهُۥۖ فَمَن كَانَ مِنكُم مَّرِيضاً اَوْ بِهِۦٓ أَذىٗ مِّن رَّأْسِهِۦ فَفِدْيَةٞ مِّن صِيَامٍ اَوْ صَدَقَةٍ اَوْ نُسُكٖۖ فَإِذَآ أَمِنتُمْ فَمَن تَمَتَّعَ بِالْعُمْرَةِ إِلَى اَ۬لْحَجِّ فَمَا اَ۪سْتَيْسَرَ مِنَ اَ۬لْهَدْيِۖ ۞ فَمَن لَّمْ يَجِدْ فَصِيَامُ ثَلَٰثَةِ أَيَّامٖ فِے اِ۬لْحَجِّ وَسَبْعَةٍ اِذَا رَجَعْتُمْ تِلْكَ عَشَرَةٞ كَامِلَةٞۖ ذَٰلِكَ لِمَن لَّمْ يَكُنَ اَهْلُهُۥ حَاضِرِے اِ۬لْمَسْجِدِ اِ۬لْحَرَامِۖ وَاتَّقُواْ اُ۬للَّهَ وَاعْلَمُوٓاْ أَنَّ اَ۬للَّهَ شَدِيدُ اُ۬لْعِقَابِۖ","اِ۬لْحَجُّ أَشْهُرٞ مَّعْلُومَٰتٞۖ فَمَن فَرَضَ فِيهِنَّ اَ۬لْحَجَّ فَلَا رَفَثَ وَلَا فُسُوقَ وَلَا جِدَالَ فِے اِ۬لْحَجِّۖ وَمَا تَفْعَلُواْ مِنْ خَيْرٖ يَعْلَمْهُ اُ۬للَّهُۖ وَتَزَوَّدُواْۖ فَإِنَّ خَيْرَ اَ۬لزَّادِ اِ۬لتَّقْو۪ىٰۖ وَاتَّقُونِ يَٰٓأُوْلِے اِ۬لَالْبَٰبِۖ","لَيْسَ عَلَيْكُمْ جُنَاحٌ اَن تَبْتَغُواْ فَضْلاٗ مِّن رَّبِّكُمْۖ فَإِذَآ أَفَضْتُم مِّنْ عَرَفَٰتٖ فَاذْكُرُواْ اُ۬للَّهَ عِندَ اَ۬لْمَشْعَرِ اِ۬لْحَرَامِۖ وَاذْكُرُوهُ كَمَا هَد۪يٰكُمْ وَإِن كُنتُم مِّن قَبْلِهِۦ لَمِنَ اَ۬لضَّآلِّينَۖ","ثُمَّ أَفِيضُواْ مِنْ حَيْثُ أَفَاضَ اَ۬لنَّاسُۖ وَاسْتَغْفِرُواْ اُ۬للَّهَۖ إِنَّ اَ۬للَّهَ غَفُورٞ رَّحِيمٞۖ","فَإِذَا قَضَيْتُم مَّنَٰسِكَكُمْ فَاذْكُرُواْ اُ۬للَّهَ كَذِكْرِكُمُۥٓ ءَابَآءَكُمُۥٓ أَوَ اَشَدَّ ذِكْراٗۖ فَمِنَ اَ۬لنَّاسِ مَنْ يَّقُولُ رَبَّنَآ ءَاتِنَا فِے اِ۬لدُّنْي۪ا وَمَا لَهُۥ فِے اِ۬لَاخِرَةِ مِنْ خَلَٰقٖۖ وَمِنْهُم مَّنْ يَّقُولُ رَبَّنَآ ءَاتِنَا فِے اِ۬لدُّنْي۪ا حَسَنَةٗ وَفِے اِ۬لَاخِرَةِ حَسَنَةٗ وَقِنَا عَذَابَ اَ۬لنّ۪ارِۖ","أُوْلَٰٓئِكَ لَهُمْ نَصِيبٞ مِّمَّا كَسَبُواْۖ وَاللَّهُ سَرِيعُ اُ۬لْحِسَابِۖ","۞ وَاذْكُرُواْ اُ۬للَّهَ فِےٓ أَيَّامٖ مَّعْدُودَٰتٖۖ فَمَن تَعَجَّلَ فِے يَوْمَيْنِ فَلَآ إِثْمَ عَلَيْهِۖ وَمَن تَأَخَّرَ فَلَآ إِثْمَ عَلَيْهِ لِمَنِ اِ۪تَّق۪ىٰۖ وَاتَّقُواْ اُ۬للَّهَ وَاعْلَمُوٓاْ أَنَّكُمُۥٓ إِلَيْهِ تُحْشَرُونَۖ","وَمِنَ اَ۬لنَّاسِ مَنْ يُّعْجِبُكَ قَوْلُهُۥ فِے اِ۬لْحَيَوٰةِ اِ۬لدُّنْي۪ا وَيُشْهِدُ اُ۬للَّهَ عَلَىٰ مَا فِے قَلْبِهِۦ وَهُوَ أَلَدُّ اُ۬لْخِصَامِۖ","وَإِذَا تَوَلّ۪ىٰ سَع۪ىٰ فِے اِ۬لَارْضِ لِيُفْسِدَ فِيهَا وَيُهْلِكَ اَ۬لْحَرْثَ وَالنَّسْلَۖ وَاللَّهُ لَا يُحِبُّ اُ۬لْفَسَادَۖ","وَإِذَا قِيلَ لَهُ اُ۪تَّقِ اِ۬للَّهَ أَخَذَتْهُ اُ۬لْعِزَّةُ بِالِاثْمِ فَحَسْبُهُۥ جَهَنَّمُۖ وَلَبِيسَ اَ۬لْمِهَادُۖ","وَمِنَ اَ۬لنَّاسِ مَنْ يَّشْرِے نَفْسَهُ اُ۪بْتِغَآءَ مَرْضَاتِ اِ۬للَّهِۖ وَاللَّهُ رَءُوفُۢ بِالْعِبَادِۖ","يَٰٓأَيُّهَا اَ۬لذِينَ ءَامَنُواْ اُ۟دْخُلُواْ فِے اِ۬لسَّلْمِ كَآفَّةٗۖ وَلَا تَتَّبِعُواْ خُطْوَٰتِ اِ۬لشَّيْطَٰنِۖ إِنَّهُۥ لَكُمْ عَدُوّٞ مُّبِينٞۖ","فَإِن زَلَلْتُم مِّنۢ بَعْدِ مَا جَآءَتْكُمُ اُ۬لْبَيِّنَٰتُ فَاعْلَمُوٓاْ أَنَّ اَ۬للَّهَ عَزِيزٌ حَكِيمٌۖ","هَلْ يَنظُرُونَ إِلَّآ أَنْ يَّاتِيَهُمُ اُ۬للَّهُ فِے ظُلَلٖ مِّنَ اَ۬لْغَمَٰمِۖ وَالْمَلَٰٓئِكَةُ وَقُضِيَ اَ۬لَامْرُۖ وَإِلَى اَ۬للَّهِ تُرْجَعُ اُ۬لُامُورُۖ","سَلْ بَنِےٓ إِسْرَآءِيلَ كَمَ اٰتَيْنَٰهُم مِّنَ اٰيَةِۢ بَيِّنَةٖۖ وَمَنْ يُّبَدِّلْ نِعْمَةَ اَ۬للَّهِ مِنۢ بَعْدِ مَا جَآءَتْهُ فَإِنَّ اَ۬للَّهَ شَدِيدُ اُ۬لْعِقَابِۖ","زُيِّنَ لِلذِينَ كَفَرُواْ اُ۬لْحَيَوٰةُ اُ۬لدُّنْي۪ا وَيَسْخَرُونَ مِنَ اَ۬لذِينَ ءَامَنُواْۖ وَالذِينَ اَ۪تَّقَوْاْ فَوْقَهُمْ يَوْمَ اَ۬لْقِيَٰمَةِۖ وَاللَّهُ يَرْزُقُ مَنْ يَّشَآءُ بِغَيْرِ حِسَابٖۖ","۞ كَانَ اَ۬لنَّاسُ أُمَّةٗ وَٰحِدَةٗ فَبَعَثَ اَ۬للَّهُ اُ۬لنَّبِيٓـِٕۧنَ مُبَشِّرِينَ وَمُنذِرِينَ وَأَنزَلَ مَعَهُمُ اُ۬لْكِتَٰبَ بِالْحَقِّ لِيَحْكُمَ بَيْنَ اَ۬لنَّاسِ فِيمَا اَ۪خْتَلَفُواْ فِيهِۖ وَمَا اَ۪خْتَلَفَ فِيهِ إِلَّا اَ۬لذِينَ أُوتُوهُۖ مِنۢ بَعْدِ مَا جَآءَتْهُمُ اُ۬لْبَيِّنَٰتُ بَغْياَۢ بَيْنَهُمْۖ فَهَدَى اَ۬للَّهُ اُ۬لذِينَ ءَامَنُواْ لِمَا اَ۪خْتَلَفُواْ فِيهِ مِنَ اَ۬لْحَقِّ بِإِذْنِهِۦۖ وَاللَّهُ يَهْدِے مَنْ يَّشَآءُ اِ۪لَىٰ صِرَٰطٖ مُّسْتَقِيمٍۖ","اَمْ حَسِبْتُمُۥٓ أَن تَدْخُلُواْ اُ۬لْجَنَّةَ وَلَمَّا يَاتِكُم مَّثَلُ اُ۬لذِينَ خَلَوْاْ مِن قَبْلِكُم مَّسَّتْهُمُ اُ۬لْبَأْسَآءُ وَالضَّرَّآءُ وَزُلْزِلُواْ حَتَّىٰ يَقُولُ اُ۬لرَّسُولُ وَالذِينَ ءَامَنُواْ مَعَهُۥ مَت۪ىٰ نَصْرُ اُ۬للَّهِۖ أَلَآ إِنَّ نَصْرَ اَ۬للَّهِ قَرِيبٞۖ","يَسْـَٔلُونَكَ مَاذَا يُنفِقُونَۖ قُلْ مَآ أَنفَقْتُم مِّنْ خَيْرٖ فَلِلْوَٰلِدَيْنِ وَالَاقْرَبِينَ وَالْيَتَٰم۪ىٰ وَالْمَسَٰكِينِ وَابْنِ اِ۬لسَّبِيلِۖ وَمَا تَفْعَلُواْ مِنْ خَيْرٖ فَإِنَّ اَ۬للَّهَ بِهِۦ عَلِيمٞۖ","كُتِبَ عَلَيْكُمُ اُ۬لْقِتَالُ وَهُوَ كُرْهٞ لَّكُمْۖ وَعَس۪ىٰٓ أَن تَكْرَهُواْ شَئْاٗ وَهُوَ خَيْرٞ لَّكُمْۖ وَعَس۪ىٰٓ أَن تُحِبُّواْ شَئْاٗ وَهُوَ شَرّٞ لَّكُمْۖ وَاللَّهُ يَعْلَمُۖ وَأَنتُمْ لَا تَعْلَمُونَۖ","يَسْـَٔلُونَكَ عَنِ اِ۬لشَّهْرِ اِ۬لْحَرَامِ قِتَالٖ فِيهِۖ قُلْ قِتَالٞ فِيهِ كَبِيرٞۖ وَصَدٌّ عَن سَبِيلِ اِ۬للَّهِ وَكُفْرُۢ بِهِۦ وَالْمَسْجِدِ اِ۬لْحَرَامِ وَإِخْرَاجُ أَهْلِهِۦ مِنْهُ أَكْبَرُ عِندَ اَ۬للَّهِۖ وَالْفِتْنَةُ أَكْبَرُ مِنَ اَ۬لْقَتْلِۖ وَلَا يَزَالُونَ يُقَٰتِلُونَكُمْ حَتَّىٰ يَرُدُّوكُمْ عَن دِينِكُمُۥٓ إِنِ اِ۪سْتَطَٰعُواْۖ وَمَنْ يَّرْتَدِدْ مِنكُمْ عَن دِينِهِۦ فَيَمُتْ وَهُوَ كَافِرٞ فَأُوْلَٰٓئِكَ حَبِطَتَ اَعْمَٰلُهُمْ فِے اِ۬لدُّنْي۪ا وَالَاخِرَةِۖ وَأُوْلَٰٓئِكَ أَصْحَٰبُ اُ۬لنّ۪ارِ هُمْ فِيهَا خَٰلِدُونَۖ","إِنَّ اَ۬لذِينَ ءَامَنُواْ وَالذِينَ هَاجَرُواْ وَجَٰهَدُواْ فِے سَبِيلِ اِ۬للَّهِ أُوْلَٰٓئِكَ يَرْجُونَ رَحْمَتَ اَ۬للَّهِۖ وَاللَّهُ غَفُورٞ رَّحِيمٞۖ","۞ يَسْـَٔلُونَكَ عَنِ اِ۬لْخَمْرِ وَالْمَيْسِرِۖ قُلْ فِيهِمَآ إِثْمٞ كَبِيرٞ وَمَنَٰفِعُ لِلنَّاسِۖ وَإِثْمُهُمَآ أَكْبَرُ مِن نَّفْعِهِمَاۖ وَيَسْـَٔلُونَكَ مَاذَا يُنفِقُونَ قُلِ اِ۬لْعَفْوَۖ كَذَٰلِكَ يُبَيِّنُ اُ۬للَّهُ لَكُمُ اُ۬لَايَٰتِ لَعَلَّكُمْ تَتَفَكَّرُونَ","فِے اِ۬لدُّنْي۪ا وَالَاخِرَةِۖ وَيَسْـَٔلُونَكَ عَنِ اِ۬لْيَتَٰم۪ىٰ قُلِ اِصْلَٰحٞ لَّهُمْ خَيْرٞۖ وَإِن تُخَالِطُوهُمْ فَإِخْوَٰنُكُمْۖ وَاللَّهُ يَعْلَمُ اُ۬لْمُفْسِدَ مِنَ اَ۬لْمُصْلِحِۖ وَلَوْ شَآءَ اَ۬للَّهُ لَأَعْنَتَكُمُۥٓۖ إِنَّ اَ۬للَّهَ عَزِيزٌ حَكِيمٞۖ","وَلَا تَنكِحُواْ اُ۬لْمُشْرِكَٰتِ حَتَّىٰ يُومِنَّۖ وَلَأَمَةٞ مُّومِنَةٌ خَيْرٞ مِّن مُّشْرِكَةٖ وَلَوَ اَعْجَبَتْكُمْۖ وَلَا تُنكِحُواْ اُ۬لْمُشْرِكِينَ حَتَّىٰ يُومِنُواْۖ وَلَعَبْدٞ مُّومِنٌ خَيْرٞ مِّن مُّشْرِكٖ وَلَوَ اَعْجَبَكُمُۥٓۖ أُوْلَٰٓئِكَ يَدْعُونَ إِلَى اَ۬لنّ۪ارِۖ وَاللَّهُ يَدْعُوٓاْ إِلَى اَ۬لْجَنَّةِ وَالْمَغْفِرَةِ بِإِذْنِهِۦۖ وَيُبَيِّنُ ءَايَٰتِهِۦ لِلنَّاسِ لَعَلَّهُمْ يَتَذَكَّرُونَۖ","وَيَسْـَٔلُونَكَ عَنِ اِ۬لْمَحِيضِ قُلْ هُوَ أَذىٗۖ فَاعْتَزِلُواْ اُ۬لنِّسَآءَ فِے اِ۬لْمَحِيضِۖ وَلَا تَقْرَبُوهُنَّ حَتَّىٰ يَطْهُرْنَۖ فَإِذَا تَطَهَّرْنَ فَاتُوهُنَّ مِنْ حَيْثُ أَمَرَكُمُ اُ۬للَّهُۖ إِنَّ اَ۬للَّهَ يُحِبُّ اُ۬لتَّوَّٰبِينَ وَيُحِبُّ اُ۬لْمُتَطَهِّرِينَۖ","نِسَآؤُكُمْ حَرْثٞ لَّكُمْ فَاتُواْ حَرْثَكُمُۥٓ أَنّ۪ىٰ شِئْتُمْۖ وَقَدِّمُواْ لِأَنفُسِكُمْۖ وَاتَّقُواْ اُ۬للَّهَۖ وَاعْلَمُوٓاْ أَنَّكُم مُّلَٰقُوهُۖ وَبَشِّرِ اِ۬لْمُومِنِينَۖ","وَلَا تَجْعَلُواْ اُ۬للَّهَ عُرْضَةٗ لِّأَيْمَٰنِكُمُۥٓۖ أَن تَبَرُّواْ وَتَتَّقُواْ وَتُصْلِحُواْ بَيْنَ اَ۬لنَّاسِۖ وَاللَّهُ سَمِيعٌ عَلِيمٞۖ","لَّا يُوَ۬اخِذُكُمُ اُ۬للَّهُ بِاللَّغْوِ فِےٓ أَيْمَٰنِكُمْۖ وَلَٰكِنْ يُّوَ۬اخِذُكُم بِمَا كَسَبَتْ قُلُوبُكُمْۖ وَاللَّهُ غَفُورٌ حَلِيمٞۖ","لِّلذِينَ يُولُونَ مِن نِّسَآئِهِمْ تَرَبُّصُ أَرْبَعَةِ أَشْهُرٖۖ فَإِن فَآءُو فَإِنَّ اَ۬للَّهَ غَفُورٞ رَّحِيمٞۖ","وَإِنْ عَزَمُواْ اُ۬لطَّلَٰقَ فَإِنَّ اَ۬للَّهَ سَمِيعٌ عَلِيمٞۖ","۞ وَالْمُطَلَّقَٰتُ يَتَرَبَّصْنَ بِأَنفُسِهِنَّ ثَلَٰثَةَ قُرُوٓءٖۖ وَلَا يَحِلُّ لَهُنَّ أَنْ يَّكْتُمْنَ مَا خَلَقَ اَ۬للَّهُ فِےٓ أَرْحَامِهِنَّ إِن كُنَّ يُومِنَّ بِاللَّهِ وَالْيَوْمِ اِ۬لَاخِرِۖ وَبُعُولَتُهُنَّ أَحَقُّ بِرَدِّهِنَّ فِے ذَٰلِكَ إِنَ اَرَادُوٓاْ إِصْلَٰحاٗۖ وَلَهُنَّ مِثْلُ اُ۬لذِے عَلَيْهِنَّ بِالْمَعْرُوفِۖ وَلِلرِّجَالِ عَلَيْهِنَّ دَرَجَةٞۖ وَاللَّهُ عَزِيزٌ حَكِيمٌۖ","اِ۬لطَّلَٰقُ مَرَّتَٰنِۖ فَإِمْسَاكُۢ بِمَعْرُوفٍ اَوْ تَسْرِيحُۢ بِإِحْسَٰنٖۖ وَلَا يَحِلُّ لَكُمُۥٓ أَن تَاخُذُواْ مِمَّآ ءَاتَيْتُمُوهُنَّ شَئْاً اِلَّآ أَنْ يَّخَافَآ أَلَّا يُقِيمَا حُدُودَ اَ۬للَّهِۖ فَإِنْ خِفْتُمُۥٓ أَلَّا يُقِيمَا حُدُودَ اَ۬للَّهِ فَلَا جُنَاحَ عَلَيْهِمَا فِيمَا اَ۪فْتَدَتْ بِهِۦۖ تِلْكَ حُدُودُ اُ۬للَّهِۖ فَلَا تَعْتَدُوهَاۖ وَمَنْ يَّتَعَدَّ حُدُودَ اَ۬للَّهِ فَأُوْلَٰٓئِكَ هُمُ اُ۬لظَّٰلِمُونَۖ","فَإِن طَلَّقَهَا فَلَا تَحِلُّ لَهُۥ مِنۢ بَعْدُ حَتَّىٰ تَنكِحَ زَوْجاً غَيْرَهُۥۖ فَإِن طَلَّقَهَا فَلَا جُنَاحَ عَلَيْهِمَآ أَنْ يَّتَرَاجَعَآ إِن ظَنَّآ أَنْ يُّقِيمَا حُدُودَ اَ۬للَّهِۖ وَتِلْكَ حُدُودُ اُ۬للَّهِ يُبَيِّنُهَا لِقَوْمٖ يَعْلَمُونَۖ","وَإِذَا طَلَّقْتُمُ اُ۬لنِّسَآءَ فَبَلَغْنَ أَجَلَهُنَّ فَأَمْسِكُوهُنَّ بِمَعْرُوفٍ اَوْ سَرِّحُوهُنَّ بِمَعْرُوفٖۖ وَلَا تُمْسِكُوهُنَّ ضِرَاراٗ لِّتَعْتَدُواْۖ وَمَنْ يَّفْعَلْ ذَٰلِكَ فَقَد ظَّلَمَ نَفْسَهُۥۖ وَلَا تَتَّخِذُوٓاْ ءَايَٰتِ اِ۬للَّهِ هُزُؤاٗۖ وَاذْكُرُواْ نِعْمَتَ اَ۬للَّهِ عَلَيْكُمْ وَمَآ أَنزَلَ عَلَيْكُم مِّنَ اَ۬لْكِتَٰبِ وَالْحِكْمَةِ يَعِظُكُم بِهِۦۖ وَاتَّقُواْ اُ۬للَّهَۖ وَاعْلَمُوٓاْ أَنَّ اَ۬للَّهَ بِكُلِّ شَےْءٍ عَلِيمٞۖ","وَإِذَا طَلَّقْتُمُ اُ۬لنِّسَآءَ فَبَلَغْنَ أَجَلَهُنَّ فَلَا تَعْضُلُوهُنَّ أَنْ يَّنكِحْنَ أَزْوَٰجَهُنَّ إِذَا تَرَٰضَوْاْ بَيْنَهُم بِالْمَعْرُوفِۖ ذَٰلِكَ يُوعَظُ بِهِۦ مَن كَانَ مِنكُمْ يُومِنُ بِاللَّهِ وَالْيَوْمِ اِ۬لَاخِرِۖ ذَٰلِكُمُۥٓ أَزْك۪ىٰ لَكُمْ وَأَطْهَرُۖ وَاللَّهُ يَعْلَمُۖ وَأَنتُمْ لَا تَعْلَمُونَۖ","۞ وَالْوَٰلِدَٰتُ يُرْضِعْنَ أَوْلَٰدَهُنَّ حَوْلَيْنِ كَامِلَيْنِۖ لِمَنَ اَرَادَ أَنْ يُّتِمَّ اَ۬لرَّضَٰعَةَۖ وَعَلَى اَ۬لْمَوْلُودِ لَهُۥ رِزْقُهُنَّ وَكِسْوَتُهُنَّ بِالْمَعْرُوفِۖ لَا تُكَلَّفُ نَفْسٌ اِلَّا وُسْعَهَاۖ لَا تُضَآرَّ وَٰلِدَةُۢ بِوَلَدِهَا وَلَا مَوْلُودٞ لَّهُۥ بِوَلَدِهِۦۖ وَعَلَى اَ۬لْوَارِثِ مِثْلُ ذَٰلِكَۖ فَإِنَ اَرَادَا فِصَالاً عَن تَرَاضٖ مِّنْهُمَا وَتَشَاوُرٖ فَلَا جُنَاحَ عَلَيْهِمَاۖ وَإِنَ اَرَدتُّمُۥٓ أَن تَسْتَرْضِعُوٓاْ أَوْلَٰدَكُمْ فَلَا جُنَاحَ عَلَيْكُمُۥٓ إِذَا سَلَّمْتُم مَّآ ءَاتَيْتُم بِالْمَعْرُوفِۖ وَاتَّقُواْ اُ۬للَّهَۖ وَاعْلَمُوٓاْ أَنَّ اَ۬للَّهَ بِمَا تَعْمَلُونَ بَصِيرٞۖ","وَالذِينَ يُتَوَفَّوْنَ مِنكُمْ وَيَذَرُونَ أَزْوَٰجاٗ يَتَرَبَّصْنَ بِأَنفُسِهِنَّ أَرْبَعَةَ أَشْهُرٖ وَعَشْراٗۖ فَإِذَا بَلَغْنَ أَجَلَهُنَّ فَلَا جُنَاحَ عَلَيْكُمْ فِيمَا فَعَلْنَ فِےٓ أَنفُسِهِنَّ بِالْمَعْرُوفِۖ وَاللَّهُ بِمَا تَعْمَلُونَ خَبِيرٞۖ","وَلَا جُنَاحَ عَلَيْكُمْ فِيمَا عَرَّضْتُم بِهِۦ مِنْ خِطْبَةِ اِ۬لنِّسَآءِ اَ۬وَ اَكْنَنتُمْ فِےٓ أَنفُسِكُمْۖ عَلِمَ اَ۬للَّهُ أَنَّكُمْ سَتَذْكُرُونَهُنَّ وَلَٰكِن لَّا تُوَاعِدُوهُنَّ سِرّاًۖ اِلَّآ أَن تَقُولُواْ قَوْلاٗ مَّعْرُوفاٗۖ ۞ وَلَا تَعْزِمُواْ عُقْدَةَ اَ۬لنِّكَاحِ حَتَّىٰ يَبْلُغَ اَ۬لْكِتَٰبُ أَجَلَهُۥۖ وَاعْلَمُوٓاْ أَنَّ اَ۬للَّهَ يَعْلَمُ مَا فِےٓ أَنفُسِكُمْ فَاحْذَرُوهُۖ وَاعْلَمُوٓاْ أَنَّ اَ۬للَّهَ غَفُورٌ حَلِيمٞۖ","لَّا جُنَاحَ عَلَيْكُمُۥٓ إِن طَلَّقْتُمُ اُ۬لنِّسَآءَ مَا لَمْ تَمَسُّوهُنَّ أَوْ تَفْرِضُواْ لَهُنَّ فَرِيضَةٗۖ وَمَتِّعُوهُنَّ عَلَى اَ۬لْمُوسِعِ قَدْرُهُۥ وَعَلَى اَ۬لْمُقْتِرِ قَدْرُهُۥ مَتَٰعاَۢ بِالْمَعْرُوفِۖ حَقّاً عَلَى اَ۬لْمُحْسِنِينَۖ","وَإِن طَلَّقْتُمُوهُنَّ مِن قَبْلِ أَن تَمَسُّوهُنَّ وَقَدْ فَرَضْتُمْ لَهُنَّ فَرِيضَةٗ فَنِصْفُ مَا فَرَضْتُمُۥٓ إِلَّآ أَنْ يَّعْفُونَ أَوْ يَعْفُوَاْ اَ۬لذِے بِيَدِهِۦ عُقْدَةُ اُ۬لنِّكَاحِۖ وَأَن تَعْفُوٓاْ أَقْرَبُ لِلتَّقْو۪ىٰۖ وَلَا تَنسَوُاْ اُ۬لْفَضْلَ بَيْنَكُمُۥٓۖ إِنَّ اَ۬للَّهَ بِمَا تَعْمَلُونَ بَصِيرٌۖ","حَٰفِظُواْ عَلَى اَ۬لصَّلَوَٰتِ وَالصَّلَوٰةِ اِ۬لْوُسْط۪ىٰ وَقُومُواْ لِلهِ قَٰنِتِينَۖ","فَإِنْ خِفْتُمْ فَرِجَالاً اَوْ رُكْبَاناٗۖ فَإِذَآ أَمِنتُمْ فَاذْكُرُواْ اُ۬للَّهَ كَمَا عَلَّمَكُم مَّا لَمْ تَكُونُواْ تَعْلَمُونَۖ","وَالذِينَ يُتَوَفَّوْنَ مِنكُمْ وَيَذَرُونَ أَزْوَٰجاٗ وَصِيَّةٞ لِّأَزْوَٰجِهِم مَّتَٰعاً اِلَى اَ۬لْحَوْلِ غَيْرَ إِخْرَاجٖۖ فَإِنْ خَرَجْنَ فَلَا جُنَاحَ عَلَيْكُمْ فِے مَا فَعَلْنَ فِےٓ أَنفُسِهِنَّ مِن مَّعْرُوفٖۖ وَاللَّهُ عَزِيزٌ حَكِيمٞۖ","وَلِلْمُطَلَّقَٰتِ مَتَٰعُۢ بِالْمَعْرُوفِۖ حَقّاً عَلَى اَ۬لْمُتَّقِينَۖ","كَذَٰلِكَ يُبَيِّنُ اُ۬للَّهُ لَكُمُۥٓ ءَايَٰتِهِۦ لَعَلَّكُمْ تَعْقِلُونَۖ","۞ أَلَمْ تَرَ إِلَى اَ۬لذِينَ خَرَجُواْ مِن دِيٰ۪رِهِمْ وَهُمُۥٓ أُلُوفٌ حَذَرَ اَ۬لْمَوْتِ فَقَالَ لَهُمُ اُ۬للَّهُ مُوتُواْ ثُمَّ أَحْي۪اهُمُۥٓۖ إِنَّ اَ۬للَّهَ لَذُو فَضْلٍ عَلَى اَ۬لنَّاسِۖ وَلَٰكِنَّ أَكْثَرَ اَ۬لنَّاسِ لَا يَشْكُرُونَۖ","وَقَٰتِلُواْ فِے سَبِيلِ اِ۬للَّهِ وَاعْلَمُوٓاْ أَنَّ اَ۬للَّهَ سَمِيعٌ عَلِيمٞۖ","مَّن ذَا اَ۬لذِے يُقْرِضُ اُ۬للَّهَ قَرْضاً حَسَناٗ فَيُضَٰعِفُهُۥ لَهُۥٓ أَضْعَافاٗ كَثِيرَةٗۖ وَاللَّهُ يَقْبِضُ وَيَبْصُطُۖ وَإِلَيْهِ تُرْجَعُونَۖ","أَلَمْ تَرَ إِلَى اَ۬لْمَلَإِ مِنۢ بَنِےٓ إِسْرَآءِيلَ مِنۢ بَعْدِ مُوس۪ىٰٓ إِذْ قَالُواْ لِنَبِےٓءٖ لَّهُمُ اُ۪بْعَثْ لَنَا مَلِكاٗ نُّقَٰتِلْ فِے سَبِيلِ اِ۬للَّهِۖ قَالَ هَلْ عَسِيتُمُۥٓ إِن كُتِبَ عَلَيْكُمُ اُ۬لْقِتَالُ أَلَّا تُقَٰتِلُواْۖ قَالُواْ وَمَا لَنَآ أَلَّا نُقَٰتِلَ فِے سَبِيلِ اِ۬للَّهِ وَقَدُ ا۟خْرِجْنَا مِن دِيٰ۪رِنَا وَأَبْنَآئِنَاۖ فَلَمَّا كُتِبَ عَلَيْهِمُ اُ۬لْقِتَالُ تَوَلَّوِاْ اِلَّا قَلِيلاٗ مِّنْهُمْۖ وَاللَّهُ عَلِيمُۢ بِالظَّٰلِمِينَۖ","وَقَالَ لَهُمْ نَبِيٓـُٔهُمُۥٓ إِنَّ اَ۬للَّهَ قَدْ بَعَثَ لَكُمْ طَالُوتَ مَلِكاٗۖ قَالُوٓاْ أَنّ۪ىٰ يَكُونُ لَهُ اُ۬لْمُلْكُ عَلَيْنَا وَنَحْنُ أَحَقُّ بِالْمُلْكِ مِنْهُ وَلَمْ يُوتَ سَعَةٗ مِّنَ اَ۬لْمَالِۖ قَالَ إِنَّ اَ۬للَّهَ اَ۪صْطَف۪يٰهُ عَلَيْكُمْ وَزَادَهُۥ بَسْطَةٗ فِے اِ۬لْعِلْمِ وَالْجِسْمِۖ وَاللَّهُ يُوتِے مُلْكَهُۥ مَنْ يَّشَآءُۖ وَاللَّهُ وَٰسِعٌ عَلِيمٞۖ","۞ وَقَالَ لَهُمْ نَبِيٓـُٔهُمُۥٓ إِنَّ ءَايَةَ مُلْكِهِۦٓ أَنْ يَّاتِيَكُمُ اُ۬لتَّابُوتُ فِيهِ سَكِينَةٞ مِّن رَّبِّكُمْ وَبَقِيَّةٞ مِّمَّا تَرَكَ ءَالُ مُوس۪ىٰ وَءَالُ هَٰرُونَ تَحْمِلُهُ اُ۬لْمَلَٰٓئِكَةُۖ إِنَّ فِے ذَٰلِكَ لَأٓيَةٗ لَّكُمُۥٓ إِن كُنتُم مُّومِنِينَۖ","فَلَمَّا فَصَلَ طَالُوتُ بِالْجُنُودِ قَالَ إِنَّ اَ۬للَّهَ مُبْتَلِيكُم بِنَهَرٖ فَمَن شَرِبَ مِنْهُ فَلَيْسَ مِنِّے وَمَن لَّمْ يَطْعَمْهُ فَإِنَّهُۥ مِنِّيَ إِلَّا مَنِ اِ۪غْتَرَفَ غَرْفَةَۢ بِيَدِهِۦۖ فَشَرِبُواْ مِنْهُ إِلَّا قَلِيلاٗ مِّنْهُمْۖ فَلَمَّا جَاوَزَهُۥ هُوَ وَالذِينَ ءَامَنُواْ مَعَهُۥ قَالُواْ لَا طَاقَةَ لَنَا اَ۬لْيَوْمَ بِجَالُوتَ وَجُنُودِهِۦۖ قَالَ اَ۬لذِينَ يَظُنُّونَ أَنَّهُم مُّلَٰقُواْ اُ۬للَّهِ كَم مِّن فِئَةٖ قَلِيلَةٍ غَلَبَتْ فِئَةٗ كَثِيرَةَۢ بِإِذْنِ اِ۬للَّهِۖ وَاللَّهُ مَعَ اَ۬لصَّٰبِرِينَۖ","وَلَمَّا بَرَزُواْ لِجَالُوتَ وَجُنُودِهِۦ قَالُواْ رَبَّنَآ أَفْرِغْ عَلَيْنَا صَبْراٗ وَثَبِّتَ اَقْدَامَنَا وَانصُرْنَا عَلَى اَ۬لْقَوْمِ اِ۬لْكٰ۪فِرِينَ","فَهَزَمُوهُم بِإِذْنِ اِ۬للَّهِۖ وَقَتَلَ دَاوُۥدُ جَالُوتَ وَءَات۪يٰهُ اُ۬للَّهُ اُ۬لْمُلْكَ وَالْحِكْمَةَ وَعَلَّمَهُۥ مِمَّا يَشَآءُۖ وَلَوْلَا دِفَٰعُ اُ۬للَّهِ اِ۬لنَّاسَ بَعْضَهُم بِبَعْضٖ لَّفَسَدَتِ اِ۬لَارْضُۖ وَلَٰكِنَّ اَ۬للَّهَ ذُو فَضْلٍ عَلَى اَ۬لْعَٰلَمِينَۖ","تِلْكَ ءَايَٰتُ اُ۬للَّهِ نَتْلُوهَا عَلَيْكَ بِالْحَقِّۖ وَإِنَّكَ لَمِنَ اَ۬لْمُرْسَلِينَۖ","۞ تِلْكَ اَ۬لرُّسُلُۖ فَضَّلْنَا بَعْضَهُمْ عَلَىٰ بَعْضٖۖ مِّنْهُم مَّن كَلَّمَ اَ۬للَّهُۖ وَرَفَعَ بَعْضَهُمْ دَرَجَٰتٖۖ وَءَاتَيْنَا عِيسَى اَ۪بْنَ مَرْيَمَ اَ۬لْبَيِّنَٰتِ وَأَيَّدْنَٰهُ بِرُوحِ اِ۬لْقُدُسِۖ وَلَوْ شَآءَ اَ۬للَّهُ مَا اَ۪قْتَتَلَ اَ۬لذِينَ مِنۢ بَعْدِهِم مِّنۢ بَعْدِ مَا جَآءَتْهُمُ اُ۬لْبَيِّنَٰتُۖ وَلَٰكِنِ اِ۪خْتَلَفُواْۖ فَمِنْهُم مَّنَ اٰمَنَ وَمِنْهُم مَّن كَفَرَۖ وَلَوْ شَآءَ اَ۬للَّهُ مَا اَ۪قْتَتَلُواْۖ وَلَٰكِنَّ اَ۬للَّهَ يَفْعَلُ مَا يُرِيدُۖ","يَٰٓأَيُّهَا اَ۬لذِينَ ءَامَنُوٓاْ أَنفِقُواْ مِمَّا رَزَقْنَٰكُم مِّن قَبْلِ أَنْ يَّاتِيَ يَوْمٞ لَّا بَيْعٞ فِيهِ وَلَا خُلَّةٞ وَلَا شَفَٰعَةٞۖ وَالْكَٰفِرُونَ هُمُ اُ۬لظَّٰلِمُونَۖ","اَ۬للَّهُ لَآ إِلَٰهَ إِلَّا هُوَۖ اَ۬لْحَيُّ اُ۬لْقَيُّومُۖ","لَا تَاخُذُهُۥ سِنَةٞ وَلَا نَوْمٞۖ لَّهُۥ مَا فِے اِ۬لسَّمَٰوَٰتِ وَمَا فِے اِ۬لَارْضِۖ مَن ذَا اَ۬لذِے يَشْفَعُ عِندَهُۥٓ إِلَّا بِإِذْنِهِۦۖ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْۖ وَلَا يُحِيطُونَ بِشَےْءٖ مِّنْ عِلْمِهِۦٓ إِلَّا بِمَا شَآءَۖ وَسِعَ كُرْسِيُّهُ اُ۬لسَّمَٰوَٰتِ وَالَارْضَۖ وَلَا يَـُٔودُهُۥ حِفْظُهُمَاۖ وَهُوَ اَ۬لْعَلِيُّ اُ۬لْعَظِيمُۖ","لَآ إِكْرَاهَ فِے اِ۬لدِّينِۖ قَد تَّبَيَّنَ اَ۬لرُّشْدُ مِنَ اَ۬لْغَيِّۖ فَمَنْ يَّكْفُرْ بِالطَّٰغُوتِ وَيُومِنۢ بِاللَّهِ فَقَدِ اِ۪سْتَمْسَكَ بِالْعُرْوَةِ اِ۬لْوُثْق۪ىٰ لَا اَ۪نفِصَامَ لَهَاۖ وَاللَّهُ سَمِيعٌ عَلِيمٌۖ","اِ۬للَّهُ وَلِيُّ اُ۬لذِينَ ءَامَنُواْ يُخْرِجُهُم مِّنَ اَ۬لظُّلُمَٰتِ إِلَى اَ۬لنُّورِۖ وَالذِينَ كَفَرُوٓاْ أَوْلِيَآؤُهُمُ اُ۬لطَّٰغُوتُ يُخْرِجُونَهُم مِّنَ اَ۬لنُّورِ إِلَى اَ۬لظُّلُمَٰتِۖ أُوْلَٰٓئِكَ أَصْحَٰبُ اُ۬لنّ۪ارِ هُمْ فِيهَا خَٰلِدُونَۖ","۞ أَلَمْ تَرَ إِلَى اَ۬لذِے حَآجَّ إِبْرَٰهِيمَ فِے رَبِّهِۦٓ أَنَ اٰت۪يٰهُ اُ۬للَّهُ اُ۬لْمُلْكَ إِذْ قَالَ إِبْرَٰهِيمُ رَبِّيَ اَ۬لذِے يُحْيِۦ وَيُمِيتُۖ قَالَ أَنَآ أُحْيِۦ وَأُمِيتُۖ قَالَ إِبْرَٰهِيمُ فَإِنَّ اَ۬للَّهَ يَاتِے بِالشَّمْسِ مِنَ اَ۬لْمَشْرِقِ فَاتِ بِهَا مِنَ اَ۬لْمَغْرِبِ فَبُهِتَ اَ۬لذِے كَفَرَۖ وَاللَّهُ لَا يَهْدِے اِ۬لْقَوْمَ اَ۬لظَّٰلِمِينَۖ","أَوْ كَالذِے مَرَّ عَلَىٰ قَرْيَةٖ وَهِيَ خَاوِيَةٌ عَلَىٰ عُرُوشِهَاۖ قَالَ أَنّ۪ىٰ يُحْيِۦ هَٰذِهِ اِ۬للَّهُ بَعْدَ مَوْتِهَا فَأَمَاتَهُ اُ۬للَّهُ مِاْئَةَ عَامٖ ثُمَّ بَعَثَهُۥۖ قَالَ كَمْ لَبِثْتَۖ قَالَ لَبِثْتُ يَوْماً اَوْ بَعْضَ يَوْمٖۖ قَالَ بَل لَّبِثْتَ مِاْئَةَ عَامٖۖ فَانظُرِ اِلَىٰ طَعَامِكَ وَشَرَابِكَ لَمْ يَتَسَنَّهْۖ وَانظُرِ اِلَىٰ حِم۪ارِكَۖ وَلِنَجْعَلَكَ ءَايَةٗ لِّلنَّاسِۖ وَانظُرِ اِلَى اَ۬لْعِظَٰمِ كَيْفَ نُنشِرُهَا ثُمَّ نَكْسُوهَا لَحْماٗۖ فَلَمَّا تَبَيَّنَ لَهُۥ قَالَ أَعْلَمُ أَنَّ اَ۬للَّهَ عَلَىٰ كُلِّ شَےْءٖ قَدِيرٞۖ","وَإِذْ قَالَ إِبْرَٰهِيمُ رَبِّ أَرِنِے كَيْفَ تُحْيِ اِ۬لْمَوْت۪ىٰۖ قَالَ أَوَلَمْ تُومِنۖ قَالَ بَل۪ىٰ وَلَٰكِن لِّيَطْمَئِنَّ قَلْبِےۖ قَالَ فَخُذَ اَرْبَعَةٗ مِّنَ اَ۬لطَّيْرِ فَصُرْهُنَّ إِلَيْكَ ثُمَّ اَ۪جْعَلْ عَلَىٰ كُلِّ جَبَلٖ مِّنْهُنَّ جُزْءاٗ ثُمَّ اَ۟دْعُهُنَّ يَاتِينَكَ سَعْياٗۖ وَاعْلَمَ اَنَّ اَ۬للَّهَ عَزِيزٌ حَكِيمٞۖ","مَّثَلُ اُ۬لذِينَ يُنفِقُونَ أَمْوَٰلَهُمْ فِے سَبِيلِ اِ۬للَّهِ كَمَثَلِ حَبَّةٍ اَنۢبَتَتْ سَبْعَ سَنَابِلَۖ فِے كُلِّ سُنۢبُلَةٖ مِّاْئَةُ حَبَّةٖۖ وَاللَّهُ يُضَٰعِفُ لِمَنْ يَّشَآءُۖ وَاللَّهُ وَٰسِعٌ عَلِيمٌۖ","اِ۬لذِينَ يُنفِقُونَ أَمْوَٰلَهُمْ فِے سَبِيلِ اِ۬للَّهِ ثُمَّ لَا يُتْبِعُونَ مَآ أَنفَقُواْ مَنّاٗ وَلَآ أَذىٗ لَّهُمُۥٓ أَجْرُهُمْ عِندَ رَبِّهِمْ وَلَا خَوْفٌ عَلَيْهِمْ وَلَا هُمْ يَحْزَنُونَۖ","۞ قَوْلٞ مَّعْرُوفٞ وَمَغْفِرَةٌ خَيْرٞ مِّن صَدَقَةٖ يَتْبَعُهَآ أَذىٗۖ وَاللَّهُ غَنِيٌّ حَلِيمٞۖ","يَٰٓأَيُّهَا اَ۬لذِينَ ءَامَنُواْ لَا تُبْطِلُواْ صَدَقَٰتِكُم بِالْمَنِّ وَالَاذ۪ىٰ كَالذِے يُنفِقُ مَالَهُۥ رِئَآءَ اَ۬لنَّاسِ وَلَا يُومِنُ بِاللَّهِ وَالْيَوْمِ اِ۬لَاخِرِۖ فَمَثَلُهُۥ كَمَثَلِ صَفْوَانٍ عَلَيْهِ تُرَابٞ فَأَصَابَهُۥ وَابِلٞ فَتَرَكَهُۥ صَلْداٗۖ لَّا يَقْدِرُونَ عَلَىٰ شَےْءٖ مِّمَّا كَسَبُواْۖ وَاللَّهُ لَا يَهْدِے اِ۬لْقَوْمَ اَ۬لْكٰ۪فِرِينَۖ","وَمَثَلُ اُ۬لذِينَ يُنفِقُونَ أَمْوَٰلَهُمُ اُ۪بْتِغَآءَ مَرْضَاتِ اِ۬للَّهِ وَتَثْبِيتاٗ مِّنَ اَنفُسِهِمْ كَمَثَلِ جَنَّةِۢ بِرُبْوَةٍ اَصَابَهَا وَابِلٞ فَـَٔاتَتُ ا۟كْلَهَا ضِعْفَيْنِ فَإِن لَّمْ يُصِبْهَا وَابِلٞ فَطَلّٞۖ وَاللَّهُ بِمَا تَعْمَلُونَ بَصِيرٌۖ","اَيَوَدُّ أَحَدُكُمُۥٓ أَن تَكُونَ لَهُۥ جَنَّةٞ مِّن نَّخِيلٖ وَأَعْنَٰبٖ تَجْرِے مِن تَحْتِهَا اَ۬لَانْهَٰرُ لَهُۥ فِيهَا مِن كُلِّ اِ۬لثَّمَرَٰتِ وَأَصَابَهُ اُ۬لْكِبَرُ وَلَهُۥ ذُرِّيَّةٞ ضُعَفَآءُ فَأَصَابَهَآ إِعْصَارٞ فِيهِ نَارٞ فَاحْتَرَقَتْۖ كَذَٰلِكَ يُبَيِّنُ اُ۬للَّهُ لَكُمُ اُ۬لَايَٰتِ لَعَلَّكُمْ تَتَفَكَّرُونَۖ","۞ يَٰٓأَيُّهَا اَ۬لذِينَ ءَامَنُوٓاْ أَنفِقُواْ مِن طَيِّبَٰتِ مَا كَسَبْتُمْ وَمِمَّآ أَخْرَجْنَا لَكُم مِّنَ اَ۬لَارْضِۖ وَلَا تَيَمَّمُواْ اُ۬لْخَبِيثَ مِنْهُ تُنفِقُونَ وَلَسْتُم بِـَٔاخِذِيهِ إِلَّآ أَن تُغْمِضُواْ فِيهِۖ وَاعْلَمُوٓاْ أَنَّ اَ۬للَّهَ غَنِيٌّ حَمِيدٌۖ","اِ۬لشَّيْطَٰنُ يَعِدُكُمُ اُ۬لْفَقْرَ وَيَامُرُكُم بِالْفَحْشَآءِۖ وَاللَّهُ يَعِدُكُم مَّغْفِرَةٗ مِّنْهُ وَفَضْلاٗۖ وَاللَّهُ وَٰسِعٌ عَلِيمٞۖ","يُوتِے اِ۬لْحِكْمَةَ مَنْ يَّشَآءُۖ وَمَنْ يُّوتَ اَ۬لْحِكْمَةَ فَقَدُ ا۟وتِيَ خَيْراٗ كَثِيراٗۖ وَمَا يَذَّكَّرُ إِلَّآ أُوْلُواْ اُ۬لَالْبَٰبِۖ","وَمَآ أَنفَقْتُم مِّن نَّفَقَةٍ اَوْ نَذَرْتُم مِّن نَّذْرٖ فَإِنَّ اَ۬للَّهَ يَعْلَمُهُۥۖ وَمَا لِلظَّٰلِمِينَ مِنَ اَنص۪ارٍۖ","اِن تُبْدُواْ اُ۬لصَّدَقَٰتِ فَنِعِمَّا هِيَۖ وَإِن تُخْفُوهَا وَتُوتُوهَا اَ۬لْفُقَرَآءَ فَهُوَ خَيْرٞ لَّكُمْ وَنُكَفِّرْ عَنكُم مِّن سَيِّـَٔاتِكُمْۖ وَاللَّهُ بِمَا تَعْمَلُونَ خَبِيرٞۖ","۞ لَّيْسَ عَلَيْكَ هُد۪يٰهُمْۖ وَلَٰكِنَّ اَ۬للَّهَ يَهْدِے مَنْ يَّشَآءُۖ وَمَا تُنفِقُواْ مِنْ خَيْرٖ فَلِأَنفُسِكُمْۖ وَمَا تُنفِقُونَ إِلَّا اَ۪بْتِغَآءَ وَجْهِ اِ۬للَّهِۖ وَمَا تُنفِقُواْ مِنْ خَيْرٖ يُوَفَّ إِلَيْكُمْ وَأَنتُمْ لَا تُظْلَمُونَۖ","لِلْفُقَرَآءِ اِ۬لذِينَ أُحْصِرُواْ فِے سَبِيلِ اِ۬للَّهِ لَا يَسْتَطِيعُونَ ضَرْباٗ فِے اِ۬لَارْضِ يَحْسِبُهُمُ اُ۬لْجَاهِلُ أَغْنِيَآءَ مِنَ اَ۬لتَّعَفُّفِۖ تَعْرِفُهُم بِسِيمٰ۪هُمْ لَا يَسْـَٔلُونَ اَ۬لنَّاسَ إِلْحَافاٗۖ وَمَا تُنفِقُواْ مِنْ خَيْرٖ فَإِنَّ اَ۬للَّهَ بِهِۦ عَلِيمٌۖ","اِ۬لذِينَ يُنفِقُونَ أَمْوَٰلَهُم بِاليْلِ وَالنَّه۪ارِ سِرّاٗ وَعَلَٰنِيَةٗ فَلَهُمُۥٓ أَجْرُهُمْ عِندَ رَبِّهِمْ وَلَا خَوْفٌ عَلَيْهِمْ وَلَا هُمْ يَحْزَنُونَۖ","اَ۬لذِينَ يَاكُلُونَ اَ۬لرِّبَوٰاْ لَا يَقُومُونَ إِلَّا كَمَا يَقُومُ اُ۬لذِے يَتَخَبَّطُهُ اُ۬لشَّيْطَٰنُ مِنَ اَ۬لْمَسِّۖ ذَٰلِكَ بِأَنَّهُمْ قَالُوٓاْ إِنَّمَا اَ۬لْبَيْعُ مِثْلُ اُ۬لرِّبَوٰاْۖ وَأَحَلَّ اَ۬للَّهُ اُ۬لْبَيْعَ وَحَرَّمَ اَ۬لرِّبَوٰاْۖ فَمَن جَآءَهُۥ مَوْعِظَةٞ مِّن رَّبِّهِۦ فَانتَه۪ىٰ فَلَهُۥ مَا سَلَفَۖ وَأَمْرُهُۥٓ إِلَى اَ۬للَّهِۖ وَمَنْ عَادَ فَأُوْلَٰٓئِكَ أَصْحَٰبُ اُ۬لنّ۪ارِ هُمْ فِيهَا خَٰلِدُونَۖ","يَمْحَقُ اُ۬للَّهُ اُ۬لرِّبَوٰاْ وَيُرْبِے اِ۬لصَّدَقَٰتِۖ وَاللَّهُ لَا يُحِبُّ كُلَّ كَفّ۪ارٍ اَثِيمٍۖ","اِنَّ اَ۬لذِينَ ءَامَنُواْ وَعَمِلُواْ اُ۬لصَّٰلِحَٰتِ وَأَقَامُواْ اُ۬لصَّلَوٰةَ وَءَاتَوُاْ اُ۬لزَّكَوٰةَ لَهُمُۥٓ أَجْرُهُمْ عِندَ رَبِّهِمْ وَلَا خَوْفٌ عَلَيْهِمْ وَلَا هُمْ يَحْزَنُونَۖ","يَٰٓأَيُّهَا اَ۬لذِينَ ءَامَنُواْ اُ۪تَّقُواْ اُ۬للَّهَ وَذَرُواْ مَا بَقِيَ مِنَ اَ۬لرِّبَوٰٓاْ إِن كُنتُم مُّومِنِينَۖ","فَإِن لَّمْ تَفْعَلُواْ فَاذَنُواْ بِحَرْبٖ مِّنَ اَ۬للَّهِ وَرَسُولِهِۦۖ وَإِن تُبْتُمْ فَلَكُمْ رُءُوسُ أَمْوَٰلِكُمْ لَا تَظْلِمُونَ وَلَا تُظْلَمُونَۖ","۞ وَإِن كَانَ ذُو عُسْرَةٖ فَنَظِرَةٌ اِلَىٰ مَيْسُرَةٖۖ وَأَن تَصَّدَّقُواْ خَيْرٞ لَّكُمُۥٓ إِن كُنتُمْ تَعْلَمُونَۖ","وَاتَّقُواْ يَوْماٗ تُرْجَعُونَ فِيهِ إِلَى اَ۬للَّهِۖ ثُمَّ تُوَفّ۪ىٰ كُلُّ نَفْسٖ مَّا كَسَبَتْ وَهُمْ لَا يُظْلَمُونَۖ","يَٰٓأَيُّهَا اَ۬لذِينَ ءَامَنُوٓاْ إِذَا تَدَايَنتُم بِدَيْنٍ اِلَىٰٓ أَجَلٖ مُّسَمّىٗ فَاكْتُبُوهُۖ وَلْيَكْتُب بَّيْنَكُمْ كَاتِبُۢ بِالْعَدْلِۖ وَلَا يَابَ كَاتِبٌ اَنْ يَّكْتُبَۖ كَمَا عَلَّمَهُ اُ۬للَّهُ فَلْيَكْتُبْۖ وَلْيُمْلِلِ اِ۬لذِے عَلَيْهِ اِ۬لْحَقُّ وَلْيَتَّقِ اِ۬للَّهَ رَبَّهُۥ وَلَا يَبْخَسْ مِنْهُ شَئْاٗۖ فَإِن كَانَ اَ۬لذِے عَلَيْهِ اِ۬لْحَقُّ سَفِيهاً اَوْ ضَعِيفاً اَوْ لَا يَسْتَطِيعُ أَنْ يُّمِلَّ هُوَ فَلْيُمْلِلْ وَلِيُّهُۥ بِالْعَدْلِۖ وَاسْتَشْهِدُواْ شَهِيدَيْنِ مِن رِّجَالِكُمْۖ فَإِن لَّمْ يَكُونَا رَجُلَيْنِ فَرَجُلٞ وَامْرَأَتَٰنِ مِمَّن تَرْضَوْنَ مِنَ اَ۬لشُّهَدَآءِ اَ۬ن تَضِلَّ إِحْد۪يٰهُمَا فَتُذَكِّرَ إِحْد۪يٰهُمَا اَ۬لُاخْر۪ىٰۖ وَلَا يَابَ اَ۬لشُّهَدَآءُ اِ۪ذَا مَا دُعُواْۖ وَلَا تَسْـَٔمُوٓاْ أَن تَكْتُبُوهُ صَغِيراً اَوْ كَبِيراً اِلَىٰٓ أَجَلِهِۦۖ ذَٰلِكُمُۥٓ أَقْسَطُ عِندَ اَ۬للَّهِ وَأَقْوَمُ لِلشَّهَٰدَةِ وَأَدْن۪ىٰٓ أَلَّا تَرْتَابُوٓاْ إِلَّآ أَن تَكُونَ تِجَٰرَةٌ حَاضِرَةٞ تُدِيرُونَهَا بَيْنَكُمْ فَلَيْسَ عَلَيْكُمْ جُنَاحٌ اَلَّا تَكْتُبُوهَاۖ وَأَشْهِدُوٓاْ إِذَا تَبَايَعْتُمْۖ وَلَا يُضَآرَّ كَاتِبٞ وَلَا شَهِيدٞۖ وَإِن تَفْعَلُواْ فَإِنَّهُۥ فُسُوقُۢ بِكُمْۖ وَاتَّقُواْ اُ۬للَّهَۖ وَيُعَلِّمُكُمُ اُ۬للَّهُۖ وَاللَّهُ بِكُلِّ شَےْءٍ عَلِيمٞۖ","۞ وَإِن كُنتُمْ عَلَىٰ سَفَرٖ وَلَمْ تَجِدُواْ كَاتِباٗ فَرِهَٰنٞ مَّقْبُوضَةٞۖ فَإِنَ اَمِنَ بَعْضُكُم بَعْضاٗ فَلْيُوَ۬دِّ اِ۬لذِے اِ۟وتُمِنَ أَمَٰنَتَهُۥۖ وَلْيَتَّقِ اِ۬للَّهَ رَبَّهُۥۖ وَلَا تَكْتُمُواْ اُ۬لشَّهَٰدَةَۖ وَمَنْ يَّكْتُمْهَا فَإِنَّهُۥٓ ءَاثِمٞ قَلْبُهُۥۖ وَاللَّهُ بِمَا تَعْمَلُونَ عَلِيمٞۖ","لِّلهِ مَا فِے اِ۬لسَّمَٰوَٰتِ وَمَا فِے اِ۬لَارْضِۖ وَإِن تُبْدُواْ مَا فِےٓ أَنفُسِكُمُۥٓ أَوْ تُخْفُوهُ يُحَاسِبْكُم بِهِ اِ۬للَّهُ فَيَغْفِرْ لِمَنْ يَّشَآءُ وَيُعَذِّبْ مَنْ يَّشَآءُۖ وَاللَّهُ عَلَىٰ كُلِّ شَےْءٖ قَدِيرٌۖ","اٰمَنَ اَ۬لرَّسُولُ بِمَآ أُنزِلَ إِلَيْهِ مِن رَّبِّهِۦ وَالْمُومِنُونَۖ كُلٌّ اٰمَنَ بِاللَّهِ وَمَلَٰٓئِكَتِهِۦ وَكُتُبِهِۦ وَرُسُلِهِۦۖ لَا نُفَرِّقُ بَيْنَ أَحَدٖ مِّن رُّسُلِهِۦۖ وَقَالُواْ سَمِعْنَا وَأَطَعْنَاۖ غُفْرَانَكَ رَبَّنَاۖ وَإِلَيْكَ اَ۬لْمَصِيرُۖ","لَا يُكَلِّفُ اُ۬للَّهُ نَفْساً اِلَّا وُسْعَهَاۖ لَهَا مَا كَسَبَتْۖ وَعَلَيْهَا مَا اَ۪كْتَسَبَتْۖ رَبَّنَا لَا تُوَ۬اخِذْنَآ إِن نَّسِينَآ أَوَ اَخْطَأْنَاۖ رَبَّنَا وَلَا تَحْمِلْ عَلَيْنَآ إِصْراٗ كَمَا حَمَلْتَهُۥ عَلَى اَ۬لذِينَ مِن قَبْلِنَاۖ رَبَّنَا وَلَا تُحَمِّلْنَا مَا لَا طَاقَةَ لَنَا بِهِۦۖ وَاعْفُ عَنَّاۖ وَاغْفِرْ لَنَاۖ وَارْحَمْنَآۖ أَنتَ مَوْل۪يٰنَا فَانصُرْنَا عَلَى اَ۬لْقَوْمِ اِ۬لْكٰ۪فِرِينَۖ"]],["آل عمران",["أَلَٓمِّٓۖ اَ۬للَّهُ لَآ إِلَٰهَ إِلَّا هُوَۖ اَ۬لْحَيُّ اُ۬لْقَيُّومُ","نَزَّلَ عَلَيْكَ اَ۬لْكِتَٰبَ بِالْحَقِّ مُصَدِّقاٗ لِّمَا بَيْنَ يَدَيْهِۖ وَأَنزَلَ اَ۬لتَّوْر۪يٰةَ وَالِانجِيلَ","مِن قَبْلُ هُدىٗ لِّلنَّاسِ وَأَنزَلَ اَ۬لْفُرْقَانَۖ","إِنَّ اَ۬لذِينَ كَفَرُواْ بِـَٔايَٰتِ اِ۬للَّهِ لَهُمْ عَذَابٞ شَدِيدٞۖ وَاللَّهُ عَزِيزٞ ذُو اُ۪نتِقَامٍۖ","۞ اِنَّ اَ۬للَّهَ لَا يَخْف۪ىٰ عَلَيْهِ شَےْءٞ فِے اِ۬لَارْضِ وَلَا فِے اِ۬لسَّمَآءِۖ","هُوَ اَ۬لذِے يُصَوِّرُكُمْ فِے اِ۬لَارْحَامِ كَيْفَ يَشَآءُۖ لَآ إِلَٰهَ إِلَّا هُوَۖ اَ۬لْعَزِيزُ اُ۬لْحَكِيمُۖ","هُوَ اَ۬لذِےٓ أَنزَلَ عَلَيْكَ اَ۬لْكِتَٰبَ مِنْهُۖ ءَايَٰتٞ مُّحْكَمَٰتٌ هُنَّ أُمُّ اُ۬لْكِتَٰبِ وَأُخَرُ مُتَشَٰبِهَٰتٞۖ فَأَمَّا اَ۬لذِينَ فِے قُلُوبِهِمْ زَيْغٞ فَيَتَّبِعُونَ مَا تَشَٰبَهَ مِنْهُ اُ۪بْتِغَآءَ اَ۬لْفِتْنَةِ وَابْتِغَآءَ تَاوِيلِهِۦۖ وَمَا يَعْلَمُ تَاوِيلَهُۥٓ إِلَّا اَ۬للَّهُۖ وَالرَّٰسِخُونَ فِے اِ۬لْعِلْمِ يَقُولُونَ ءَامَنَّا بِهِۦ كُلّٞ مِّنْ عِندِ رَبِّنَاۖ وَمَا يَذَّكَّرُ إِلَّآ أُوْلُواْ اُ۬لَالْبَٰبِۖ","رَبَّنَا لَا تُزِغْ قُلُوبَنَا بَعْدَ إِذْ هَدَيْتَنَا وَهَبْ لَنَا مِن لَّدُنكَ رَحْمَةًۖ اِنَّكَ أَنتَ اَ۬لْوَهَّابُۖ","رَبَّنَآ إِنَّكَ جَامِعُ اُ۬لنَّاسِ لِيَوْمٖ لَّا رَيْبَ فِيهِۖ إِنَّ اَ۬للَّهَ لَا يُخْلِفُ اُ۬لْمِيعَادَۖ","إِنَّ اَ۬لذِينَ كَفَرُواْ لَن تُغْنِيَ عَنْهُمُۥٓ أَمْوَٰلُهُمْ وَلَآ أَوْلَٰدُهُم مِّنَ اَ۬للَّهِ شَئْاٗۖ وَأُوْلَٰٓئِكَ هُمْ وَقُودُ اُ۬لنّ۪ارِ","كَدَأْبِ ءَالِ فِرْعَوْنَۖ وَالذِينَ مِن قَبْلِهِمْ كَذَّبُواْ بِـَٔايَٰتِنَا فَأَخَذَهُمُ اُ۬للَّهُ بِذُنُوبِهِمْۖ وَاللَّهُ شَدِيدُ اُ۬لْعِقَابِۖ","قُل لِّلذِينَ كَفَرُواْ سَتُغْلَبُونَ وَتُحْشَرُونَ إِلَىٰ جَهَنَّمَۖ وَبِيسَ اَ۬لْمِهَادُۖ","قَدْ كَانَ لَكُمُۥٓ ءَايَةٞ فِے فِئَتَيْنِ اِ۪لْتَقَتَاۖ فِئَةٞ تُقَٰتِلُ فِے سَبِيلِ اِ۬للَّهِ وَأُخْر۪ىٰ كَافِرَةٞ تَرَوْنَهُم مِّثْلَيْهِمْ رَأْيَ اَ۬لْعَيْنِۖ وَاللَّهُ يُوَ۬يِّدُ بِنَصْرِهِۦ مَنْ يَّشَآءُۖ اِ۪نَّ فِے ذَٰلِكَ لَعِبْرَةٗ لِّأُوْلِے اِ۬لَابْصٰ۪رِۖ","زُيِّنَ لِلنَّاسِ حُبُّ اُ۬لشَّهَوَٰتِ مِنَ اَ۬لنِّسَآءِ وَالْبَنِينَ وَالْقَنَٰطِيرِ اِ۬لْمُقَنطَرَةِ مِنَ اَ۬لذَّهَبِ وَالْفِضَّةِ وَالْخَيْلِ اِ۬لْمُسَوَّمَةِ وَالَانْعَٰمِ وَالْحَرْثِۖ ذَٰلِكَ مَتَٰعُ اُ۬لْحَيَوٰةِ اِ۬لدُّنْي۪اۖ وَاللَّهُ عِندَهُۥ حُسْنُ اُ۬لْمَـَٔابِۖ","۞ قُلَ اَوْ۟نَبِّئُكُم بِخَيْرٖ مِّن ذَٰلِكُمْۖ لِلذِينَ اَ۪تَّقَوْاْ عِندَ رَبِّهِمْ جَنَّٰتٞ تَجْرِے مِن تَحْتِهَا اَ۬لَانْهَٰرُ خَٰلِدِينَ فِيهَا وَأَزْوَٰجٞ مُّطَهَّرَةٞ وَرِضْوَٰنٞ مِّنَ اَ۬للَّهِۖ وَاللَّهُ بَصِيرُۢ بِالْعِبَادِۖ","اِ۬لذِينَ يَقُولُونَ رَبَّنَآ إِنَّنَآ ءَامَنَّا فَاغْفِرْ لَنَا ذُنُوبَنَا وَقِنَا عَذَابَ اَ۬لنّ۪ارِۖ","اِ۬لصَّٰبِرِينَ وَالصَّٰدِقِينَ وَالْقَٰنِتِينَ وَالْمُنفِقِينَ وَالْمُسْتَغْفِرِينَ بِالَاسْح۪ارِۖ","شَهِدَ اَ۬للَّهُ أَنَّهُۥ لَآ إِلَٰهَ إِلَّا هُوَ وَالْمَلَٰٓئِكَةُ وَأُوْلُواْ اُ۬لْعِلْمِ قَآئِماَۢ بِالْقِسْطِۖ لَآ إِلَٰهَ إِلَّا هُوَۖ اَ۬لْعَزِيزُ اُ۬لْحَكِيمُۖ","إِنَّ اَ۬لدِّينَ عِندَ اَ۬للَّهِ اِ۬لِاسْلَٰمُۖ وَمَا اَ۪خْتَلَفَ اَ۬لذِينَ أُوتُواْ اُ۬لْكِتَٰبَ إِلَّا مِنۢ بَعْدِ مَا جَآءَهُمُ اُ۬لْعِلْمُۖ بَغْياَۢ بَيْنَهُمْۖ وَمَنْ يَّكْفُرْ بِـَٔايَٰتِ اِ۬للَّهِ فَإِنَّ اَ۬للَّهَ سَرِيعُ اُ۬لْحِسَابِۖ","فَإِنْ حَآجُّوكَ فَقُلَ اَسْلَمْتُ وَجْهِيَ لِلهِ وَمَنِ اِ۪تَّبَعَنِۦۖ وَقُل لِّلذِينَ أُوتُواْ اُ۬لْكِتَٰبَ وَالُامِّيِّۧنَ ءَآسْلَمْتُمْۖ فَإِنَ اَسْلَمُواْ فَقَدِ اِ۪هْتَدَواْۖ وَّإِن تَوَلَّوْاْ فَإِنَّمَا عَلَيْكَ اَ۬لْبَلَٰغُۖ وَاللَّهُ بَصِيرُۢ بِالْعِبَادِۖ","إِنَّ اَ۬لذِينَ يَكْفُرُونَ بِـَٔايَٰتِ اِ۬للَّهِ وَيَقْتُلُونَ اَ۬لنَّبِيٓـِٕۧنَ بِغَيْرِ حَقّٖ وَيَقْتُلُونَ اَ۬لذِينَ يَامُرُونَ بِالْقِسْطِ مِنَ اَ۬لنَّاسِ فَبَشِّرْهُم بِعَذَابٍ اَلِيمٍۖ","ا۟وْلَٰٓئِكَ اَ۬لذِينَ حَبِطَتَ اَعْمَٰلُهُمْ فِے اِ۬لدُّنْي۪ا وَالَاخِرَةِۖ وَمَا لَهُم مِّن نَّٰصِرِينَۖ","۞ أَلَمْ تَرَ إِلَى اَ۬لذِينَ أُوتُواْ نَصِيباٗ مِّنَ اَ۬لْكِتَٰبِ يُدْعَوْنَ إِلَىٰ كِتَٰبِ اِ۬للَّهِ لِيَحْكُمَ بَيْنَهُمْ ثُمَّ يَتَوَلّ۪ىٰ فَرِيقٞ مِّنْهُمْ وَهُم مُّعْرِضُونَۖ","ذَٰلِكَ بِأَنَّهُمْ قَالُواْ لَن تَمَسَّنَا اَ۬لنَّارُ إِلَّآ أَيَّاماٗ مَّعْدُودَٰتٖ وَغَرَّهُمْ فِے دِينِهِم مَّا كَانُواْ يَفْتَرُونَۖ","فَكَيْفَ إِذَا جَمَعْنَٰهُمْ لِيَوْمٖ لَّا رَيْبَ فِيهِ وَوُفِّيَتْ كُلُّ نَفْسٖ مَّا كَسَبَتْ وَهُمْ لَا يُظْلَمُونَۖ","قُلِ اِ۬للَّهُمَّ مَٰلِكَ اَ۬لْمُلْكِ تُوتِے اِ۬لْمُلْكَ مَن تَشَآءُ وَتَنزِعُ اُ۬لْمُلْكَ مِمَّن تَشَآءُ وَتُعِزُّ مَن تَشَآءُ وَتُذِلُّ مَن تَشَآءُ بِيَدِكَ اَ۬لْخَيْرُۖ إِنَّكَ عَلَىٰ كُلِّ شَےْءٖ قَدِيرٞۖ","تُولِجُ اُ۬ليْلَ فِے اِ۬لنَّه۪ارِ وَتُولِجُ اُ۬لنَّهَارَ فِے اِ۬ليْلِ وَتُخْرِجُ اُ۬لْحَيَّ مِنَ اَ۬لْمَيِّتِ وَتُخْرِجُ اُ۬لْمَيِّتَ مِنَ اَ۬لْحَيِّ وَتَرْزُقُ مَن تَشَآءُ بِغَيْرِ حِسَابٖۖ","لَّا يَتَّخِذِ اِ۬لْمُومِنُونَ اَ۬لْكٰ۪فِرِينَ أَوْلِيَآءَ مِن دُونِ اِ۬لْمُومِنِينَۖ وَمَنْ يَّفْعَلْ ذَٰلِكَ فَلَيْسَ مِنَ اَ۬للَّهِ فِے شَےْءٍ اِلَّآ أَن تَتَّقُواْ مِنْهُمْ تُق۪يٰةٗۖ وَيُحَذِّرُكُمُ اُ۬للَّهُ نَفْسَهُۥۖ وَإِلَى اَ۬للَّهِ اِ۬لْمَصِيرُۖ","قُلِ اِن تُخْفُواْ مَا فِے صُدُورِكُمُۥٓ أَوْ تُبْدُوهُ يَعْلَمْهُ اُ۬للَّهُۖ وَيَعْلَمُ مَا فِے اِ۬لسَّمَٰوَٰتِ وَمَا فِے اِ۬لَارْضِۖ وَاللَّهُ عَلَىٰ كُلِّ شَےْءٖ قَدِيرٞۖ","يَوْمَ تَجِدُ كُلُّ نَفْسٖ مَّا عَمِلَتْ مِنْ خَيْرٖ مُّحْضَراٗۖ وَمَا عَمِلَتْ مِن سُوٓءٖ تَوَدُّ لَوَ اَنَّ بَيْنَهَا وَبَيْنَهُۥٓ أَمَداَۢ بَعِيداٗۖ وَيُحَذِّرُكُمُ اُ۬للَّهُ نَفْسَهُۥۖ وَاللَّهُ رَءُوفُۢ بِالْعِبَادِۖ","قُلِ اِن كُنتُمْ تُحِبُّونَ اَ۬للَّهَ فَاتَّبِعُونِے يُحْبِبْكُمُ اُ۬للَّهُ وَيَغْفِرْ لَكُمْ ذُنُوبَكُمْۖ وَاللَّهُ غَفُورٞ رَّحِيمٞۖ","قُلَ اَطِيعُواْ اُ۬للَّهَ وَالرَّسُولَۖ فَإِن تَوَلَّوْاْ فَإِنَّ اَ۬للَّهَ لَا يُحِبُّ اُ۬لْكٰ۪فِرِينَۖ","۞ إِنَّ اَ۬للَّهَ اَ۪صْطَف۪ىٰٓ ءَادَمَ وَنُوحاٗ وَءَالَ إِبْرَٰهِيمَ وَءَالَ عِمْرَٰنَ عَلَى اَ۬لْعَٰلَمِينَ","ذُرِّيَّةَۢ بَعْضُهَا مِنۢ بَعْضٖۖ وَاللَّهُ سَمِيعٌ عَلِيمٌۖ","اِذْ قَالَتِ اِ۪مْرَأَتُ عِمْرَٰنَ رَبِّ إِنِّے نَذَرْتُ لَكَ مَا فِے بَطْنِے مُحَرَّراٗ فَتَقَبَّلْ مِنِّيَۖ إِنَّكَ أَنتَ اَ۬لسَّمِيعُ اُ۬لْعَلِيمُۖ","فَلَمَّا وَضَعَتْهَا قَالَتْ رَبِّ إِنِّے وَضَعْتُهَآ أُنث۪ىٰ وَاللَّهُ أَعْلَمُ بِمَا وَضَعَتْۖ وَلَيْسَ اَ۬لذَّكَرُ كَالُانث۪ىٰۖ وَإِنِّے سَمَّيْتُهَا مَرْيَمَۖ وَإِنِّيَ أُعِيذُهَا بِكَ وَذُرِّيَّتَهَا مِنَ اَ۬لشَّيْطَٰنِ اِ۬لرَّجِيمِۖ","فَتَقَبَّلَهَا رَبُّهَا بِقَبُولٍ حَسَنٖ وَأَنۢبَتَهَا نَبَاتاً حَسَناٗۖ وَكَفَلَهَا زَكَرِيَّآءُۖ كُلَّمَا دَخَلَ عَلَيْهَا زَكَرِيَّآءُ اُ۬لْمِحْرَابَ وَجَدَ عِندَهَا رِزْقاٗۖ قَالَ يَٰمَرْيَمُ أَنّ۪ىٰ لَكِ هَٰذَاۖ قَالَتْ هُوَ مِنْ عِندِ اِ۬للَّهِۖ إِنَّ اَ۬للَّهَ يَرْزُقُ مَنْ يَّشَآءُ بِغَيْرِ حِسَابٍۖ","هُنَالِكَ دَعَا زَكَرِيَّآءُ رَبَّهُۥۖ قَالَ رَبِّ هَبْ لِے مِن لَّدُنكَ ذُرِّيَّةٗ طَيِّبَةً اِنَّكَ سَمِيعُ اُ۬لدُّعَآءِۖ","فَنَادَتْهُ اُ۬لْمَلَٰٓئِكَةُ وَهُوَ قَآئِمٞ يُصَلِّے فِے اِ۬لْمِحْرَابِ أَنَّ اَ۬للَّهَ يُبَشِّرُكَ بِيَحْي۪ىٰ مُصَدِّقاَۢ بِكَلِمَةٖ مِّنَ اَ۬للَّهِ وَسَيِّداٗ وَحَصُوراٗ وَنَبِيٓـٔاٗ مِّنَ اَ۬لصَّٰلِحِينَۖ","قَالَ رَبِّ أَنّ۪ىٰ يَكُونُ لِے غُلَٰمٞ وَقَدْ بَلَغَنِيَ اَ۬لْكِبَرُ وَامْرَأَتِے عَاقِرٞۖ قَالَ كَذَٰلِكَۖ اَ۬للَّهُ يَفْعَلُ مَا يَشَآءُۖ","قَالَ رَبِّ اِ۪جْعَل لِّيَ ءَايَةٗۖ قَالَ ءَايَتُكَ أَلَّا تُكَلِّمَ اَ۬لنَّاسَ ثَلَٰثَةَ أَيَّامٍ اِلَّا رَمْزاٗۖ وَاذْكُر رَّبَّكَ كَثِيراٗ وَسَبِّحْ بِالْعَشِيِّ وَالِابْكٰ۪رِۖ","۞ وَإِذْ قَالَتِ اِ۬لْمَلَٰٓئِكَةُ يَٰمَرْيَمُ إِنَّ اَ۬للَّهَ اَ۪صْطَف۪يٰكِ وَطَهَّرَكِ وَاصْطَف۪يٰكِ عَلَىٰ نِسَآءِ اِ۬لْعَٰلَمِينَۖ","يَٰمَرْيَمُ اُ۟قْنُتِے لِرَبِّكِ وَاسْجُدِے وَارْكَعِے مَعَ اَ۬لرَّٰكِعِينَۖ","ذَٰلِكَ مِنَ اَنۢبَآءِ اِ۬لْغَيْبِ نُوحِيهِ إِلَيْكَۖ وَمَا كُنتَ لَدَيْهِمُۥٓ إِذْ يُلْقُونَ أَقْلَٰمَهُمُۥٓ أَيُّهُمْ يَكْفُلُ مَرْيَمَۖ وَمَا كُنتَ لَدَيْهِمُۥٓ إِذْ يَخْتَصِمُونَ","إِذْ قَالَتِ اِ۬لْمَلَٰٓئِكَةُ يَٰمَرْيَمُ إِنَّ اَ۬للَّهَ يُبَشِّرُكِ بِكَلِمَةٖ مِّنْهُۖ اُ۪سْمُهُ اُ۬لْمَسِيحُ عِيسَى اَ۪بْنُ مَرْيَمَ وَجِيهاٗ فِے اِ۬لدُّنْي۪ا وَالَاخِرَةِ وَمِنَ اَ۬لْمُقَرَّبِينَۖ","وَيُكَلِّمُ اُ۬لنَّاسَ فِے اِ۬لْمَهْدِ وَكَهْلاٗۖ وَمِنَ اَ۬لصَّٰلِحِينَۖ","قَالَتْ رَبِّ أَنّ۪ىٰ يَكُونُ لِے وَلَدٞ وَلَمْ يَمْسَسْنِے بَشَرٞۖ قَالَ كَذَٰلِكِۖ اِ۬للَّهُ يَخْلُقُ مَا يَشَآءُۖ اِ۪ذَا قَض۪ىٰٓ أَمْراٗ فَإِنَّمَا يَقُولُ لَهُۥ كُنۖ فَيَكُونُۖ","وَيُعَلِّمُهُ اُ۬لْكِتَٰبَ وَالْحِكْمَةَ وَالتَّوْر۪يٰةَ وَالِانجِيلَ وَرَسُولاً اِلَىٰ بَنِےٓ إِسْرَآءِيلَ أَنِّے قَدْ جِئْتُكُم بِـَٔايَةٖ مِّن رَّبِّكُمُۥٓۖ إِنِّيَ أَخْلُقُ لَكُم مِّنَ اَ۬لطِّينِ كَهَيْـَٔةِ اِ۬لطَّيْرِ فَأَنفُخُ فِيهِ فَيَكُونُ طَٰٓئِراَۢ بِإِذْنِ اِ۬للَّهِۖ وَأُبْرِۓُ اُ۬لَاكْمَهَ وَالَابْرَصَ وَأُحْيِ اِ۬لْمَوْت۪ىٰ بِإِذْنِ اِ۬للَّهِۖ وَأُنَبِّئُكُم بِمَا تَاكُلُونَ وَمَا تَدَّخِرُونَ فِے بُيُوتِكُمُۥٓۖ إِنَّ فِے ذَٰلِكَ لَأٓيَةٗ لَّكُمُۥٓ إِن كُنتُم مُّومِنِينَۖ","وَمُصَدِّقاٗ لِّمَا بَيْنَ يَدَيَّ مِنَ اَ۬لتَّوْر۪يٰةِ وَلِأُحِلَّ لَكُم بَعْضَ اَ۬لذِے حُرِّمَ عَلَيْكُمْۖ وَجِئْتُكُم بِـَٔايَةٖ مِّن رَّبِّكُمْۖ فَاتَّقُواْ اُ۬للَّهَ وَأَطِيعُونِۖ","إِنَّ اَ۬للَّهَ رَبِّے وَرَبُّكُمْ فَاعْبُدُوهُۖ هَٰذَا صِرَٰطٞ مُّسْتَقِيمٞۖ","۞ فَلَمَّآ أَحَسَّ عِيس۪ىٰ مِنْهُمُ اُ۬لْكُفْرَ قَالَ مَنَ اَنصَارِيَ إِلَى اَ۬للَّهِۖ قَالَ اَ۬لْحَوَارِيُّونَ نَحْنُ أَنصَارُ اُ۬للَّهِۖ ءَامَنَّا بِاللَّهِ وَاشْهَدْ بِأَنَّا مُسْلِمُونَۖ","رَبَّنَآ ءَامَنَّا بِمَآ أَنزَلْتَ وَاتَّبَعْنَا اَ۬لرَّسُولَ فَاكْتُبْنَا مَعَ اَ۬لشَّٰهِدِينَۖ","وَمَكَرُواْ وَمَكَرَ اَ۬للَّهُۖ وَاللَّهُ خَيْرُ اُ۬لْمَٰكِرِينَۖ","إِذْ قَالَ اَ۬للَّهُ يَٰعِيس۪ىٰٓ إِنِّے مُ
