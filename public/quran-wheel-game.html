۬لِانسَٰنُ أَنَّا خَلَقْنَٰهُ مِن نُّطْفَةٖ فَإِذَا هُوَ خَصِيمٞ مُّبِينٞۖ","وَضَرَبَ لَنَا مَثَلاٗ وَنَسِيَ خَلْقَهُۥۖ قَالَ مَنْ يُّحْيِ اِ۬لْعِظَٰمَ وَهِيَ رَمِيمٞۖ","قُلْ يُحْيِيهَا اَ۬لذِےٓ أَنشَأَهَآ أَوَّلَ مَرَّةٖ وَهُوَ بِكُلِّ خَلْقٍ عَلِيمٌۖ","۞ اِ۬لذِے جَعَلَ لَكُم مِّنَ اَ۬لشَّجَرِ اِ۬لَاخْضَرِ نَاراٗ فَإِذَآ أَنتُم مِّنْهُ تُوقِدُونَۖ","أَوَلَيْسَ اَ۬لذِے خَلَقَ اَ۬لسَّمَٰوَٰتِ وَالَارْضَ بِقَٰدِرٍ عَلَىٰٓ أَنْ يَّخْلُقَ مِثْلَهُمۖ بَل۪ىٰ وَهُوَ اَ۬لْخَلَّٰقُ اُ۬لْعَلِيمُۖ","إِنَّمَآ أَمْرُهُۥٓ إِذَآ أَرَادَ شَئْاً اَنْ يَّقُولَ لَهُۥ كُنۖ فَيَكُونُۖ","فَسُبْحَٰنَ اَ۬لذِے بِيَدِهِۦ مَلَكُوتُ كُلِّ شَےْءٖ وَإِلَيْهِ تُرْجَعُونَۖ"]],["الصافات",["وَالصَّٰٓفَّٰتِ صَفّاٗ","فَالزَّٰجِرَٰتِ زَجْراٗ","فَالتَّٰلِيَٰتِ ذِكْراً","اِنَّ إِلَٰهَكُمْ لَوَٰحِدٞۖ","رَّبُّ اُ۬لسَّمَٰوَٰتِ وَالَارْضِ وَمَا بَيْنَهُمَا وَرَبُّ اُ۬لْمَشَٰرِقِۖ","إِنَّا زَيَّنَّا اَ۬لسَّمَآءَ اَ۬لدُّنْي۪ا بِزِينَةِ اِ۬لْكَوَاكِبِۖ","وَحِفْظاٗ مِّن كُلِّ شَيْطَٰنٖ مَّارِدٖۖ","لَّا يَسْمَعُونَ إِلَى اَ۬لْمَلَإِ اِ۬لَاعْل۪ىٰ وَيُقْذَفُونَ مِن كُلِّ جَانِبٖۖ","دُحُوراٗۖ وَلَهُمْ عَذَابٞ وَاصِبٌ","اِلَّا مَنْ خَطِفَ اَ۬لْخَطْفَةَ فَأَتْبَعَهُۥ شِهَابٞ ثَاقِبٞۖ","فَاسْتَفْتِهِمُۥٓ أَهُمُۥٓ أَشَدُّ خَلْقاً اَم مَّنْ خَلَقْنَآۖ إِنَّا خَلَقْنَٰهُم مِّن طِينٖ لَّٰزِبِۢۖ","بَلْ عَجِبْتَ وَيَسْخَرُونَۖ","وَإِذَا ذُكِّرُواْ لَا يَذْكُرُونَۖ","وَإِذَا رَأَوَاْ اٰيَةٗ يَسْتَسْخِرُونَۖ","وَقَالُوٓاْ إِنْ هَٰذَآ إِلَّا سِحْرٞ مُّبِينٌ","اَ۟ذَا مِتْنَا وَكُنَّا تُرَاباٗ وَعِظَٰماً اِنَّا لَمَبْعُوثُونَ","أَوَ ءَابَآؤُنَا اَ۬لَاوَّلُونَۖ","قُلْ نَعَمْ وَأَنتُمْ دَٰخِرُونَۖ","فَإِنَّمَا هِيَ زَجْرَةٞ وَٰحِدَةٞ فَإِذَا هُمْ يَنظُرُونَۖ","وَقَالُواْ يَٰوَيْلَنَا هَٰذَا يَوْمُ اُ۬لدِّينِۖ","هَٰذَا يَوْمُ اُ۬لْفَصْلِ اِ۬لذِے كُنتُم بِهِۦ تُكَذِّبُونَۖ","۞ اَ۟حْشُرُواْ اُ۬لذِينَ ظَلَمُواْ وَأَزْوَٰجَهُمْ وَمَا كَانُواْ يَعْبُدُونَ","مِن دُونِ اِ۬للَّهِ فَاهْدُوهُمُۥٓ إِلَىٰ صِرَٰطِ اِ۬لْجَحِيمِۖ","وَقِفُوهُمُۥٓ إِنَّهُم مَّسْـُٔولُونَۖ","مَا لَكُمْ لَا تَنَاصَرُونَۖ","بَلْ هُمُ اُ۬لْيَوْمَ مُسْتَسْلِمُونَۖ","وَأَقْبَلَ بَعْضُهُمْ عَلَىٰ بَعْضٖ يَتَسَآءَلُونَۖ","قَالُوٓاْ إِنَّكُمْ كُنتُمْ تَاتُونَنَا عَنِ اِ۬لْيَمِينِۖ","قَالُواْ بَل لَّمْ تَكُونُواْ مُومِنِينَۖ","وَمَا كَانَ لَنَا عَلَيْكُم مِّن سُلْطَٰنِۢ بَلْ كُنتُمْ قَوْماٗ طَٰغِينَۖ","فَحَقَّ عَلَيْنَا قَوْلُ رَبِّنَآ إِنَّا لَذَآئِقُونَ","فَأَغْوَيْنَٰكُمُۥٓ إِنَّا كُنَّا غَٰوِينَۖ","فَإِنَّهُمْ يَوْمَئِذٖ فِے اِ۬لْعَذَابِ مُشْتَرِكُونَۖ","إِنَّا كَذَٰلِكَ نَفْعَلُ بِالْمُجْرِمِينَۖ","إِنَّهُمْ كَانُوٓاْ إِذَا قِيلَ لَهُمْ لَآ إِلَٰهَ إِلَّا اَ۬للَّهُ يَسْتَكْبِرُونَ","وَيَقُولُونَ أَئِنَّا لَتَارِكُوٓاْ ءَالِهَتِنَا لِشَاعِرٖ مَّجْنُونِۢۖ","بَلْ جَآءَ بِالْحَقِّ وَصَدَّقَ اَ۬لْمُرْسَلِينَۖ","إِنَّكُمْ لَذَآئِقُواْ اُ۬لْعَذَابِ اِ۬لَالِيمِۖ","وَمَا تُجْزَوْنَ إِلَّا مَا كُنتُمْ تَعْمَلُونَ","إِلَّا عِبَادَ اَ۬للَّهِ اِ۬لْمُخْلَصِينَۖ","أُوْلَٰٓئِكَ لَهُمْ رِزْقٞ مَّعْلُومٞ","فَوَٰكِهُۖ وَهُم مُّكْرَمُونَ","فِے جَنَّٰتِ اِ۬لنَّعِيمِ","عَلَىٰ سُرُرٖ مُّتَقَٰبِلِينَۖ","يُطَافُ عَلَيْهِم بِكَأْسٖ مِّن مَّعِينِۢ","بَيْضَآءَ لَذَّةٖ لِّلشَّٰرِبِينَ","لَا فِيهَا غَوْلٞ وَلَا هُمْ عَنْهَا يُنزَفُونَۖ","وَعِندَهُمْ قَٰصِرَٰتُ اُ۬لطَّرْفِ عِينٞ","كَأَنَّهُنَّ بَيْضٞ مَّكْنُونٞۖ","فَأَقْبَلَ بَعْضُهُمْ عَلَىٰ بَعْضٖ يَتَسَآءَلُونَۖ","۞ قَالَ قَآئِلٞ مِّنْهُمُۥٓ إِنِّے كَانَ لِے قَرِينٞ","يَقُولُ أَ۟نَّكَ لَمِنَ اَ۬لْمُصَدِّقِينَ","أَ۟ذَا مِتْنَا وَكُنَّا تُرَاباٗ وَعِظَٰماً اِنَّا لَمَدِينُونَۖ","قَالَ هَلَ اَنتُم مُّطَّلِعُونَ","فَاطَّلَعَ فَر۪ء۪اهُ فِے سَوَآءِ اِ۬لْجَحِيمِۖ","قَالَ تَاللَّهِ إِن كِدتَّ لَتُرْدِينِۦ","وَلَوْلَا نِعْمَةُ رَبِّے لَكُنتُ مِنَ اَ۬لْمُحْضَرِينَۖ","أَفَمَا نَحْنُ بِمَيِّتِينَ","إِلَّا مَوْتَتَنَا اَ۬لُاول۪ىٰ وَمَا نَحْنُ بِمُعَذَّبِينَۖ","إِنَّ هَٰذَا لَهُوَ اَ۬لْفَوْزُ اُ۬لْعَظِيمُۖ","لِمِثْلِ هَٰذَا فَلْيَعْمَلِ اِ۬لْعَٰمِلُونَۖ","أَذَٰلِكَ خَيْرٞ نُّزُلاً اَمْ شَجَرَةُ اُ۬لزَّقُّومِۖ","إِنَّا جَعَلْنَٰهَا فِتْنَةٗ لِّلظَّٰلِمِينَۖ","إِنَّهَا شَجَرَةٞ تَخْرُجُ فِےٓ أَصْلِ اِ۬لْجَحِيمِ","طَلْعُهَا كَأَنَّهُۥ رُءُوسُ اُ۬لشَّيَٰطِينِۖ","فَإِنَّهُمْ لَأٓكِلُونَ مِنْهَا فَمَالِـُٔونَ مِنْهَا اَ۬لْبُطُونَ","ثُمَّ إِنَّ لَهُمْ عَلَيْهَا لَشَوْباٗ مِّنْ حَمِيمٖۖ","ثُمَّ إِنَّ مَرْجِعَهُمْ لَإِلَى اَ۬لْجَحِيمِۖ","إِنَّهُمُۥٓ أَلْفَوَاْ اٰبَآءَهُمْ ضَآلِّينَ","فَهُمْ عَلَىٰٓ ءَاثٰ۪رِهِمْ يُهْرَعُونَۖ","وَلَقَد ضَّلَّ قَبْلَهُمُۥٓ أَكْثَرُ اُ۬لَاوَّلِينَۖ","وَلَقَدَ اَرْسَلْنَا فِيهِم مُّنذِرِينَۖ","فَانظُرْ كَيْفَ كَانَ عَٰقِبَةُ اُ۬لْمُنذَرِينَ","إِلَّا عِبَادَ اَ۬للَّهِ اِ۬لْمُخْلَصِينَۖ","وَلَقَدْ نَاد۪يٰنَا نُوحٞ فَلَنِعْمَ اَ۬لْمُجِيبُونَۖ","وَنَجَّيْنَٰهُ وَأَهْلَهُۥ مِنَ اَ۬لْكَرْبِ اِ۬لْعَظِيمِۖ","وَجَعَلْنَا ذُرِّيَّتَهُۥ هُمُ اُ۬لْبَاقِينَۖ","وَتَرَكْنَا عَلَيْهِ فِے اِ۬لَاخِرِينَۖ","سَلَٰمٌ عَلَىٰ نُوحٖ فِے اِ۬لْعَٰلَمِينَۖ","إِنَّا كَذَٰلِكَ نَجْزِے اِ۬لْمُحْسِنِينَۖ","إِنَّهُۥ مِنْ عِبَادِنَا اَ۬لْمُومِنِينَۖ","ثُمَّ أَغْرَقْنَا اَ۬لَاخَرِينَۖ","۞ وَإِنَّ مِن شِيعَتِهِۦ لَإِبْرَٰهِيمَ","إِذْ جَآءَ رَبَّهُۥ بِقَلْبٖ سَلِيمٍ","اِذْ قَالَ لِأَبِيهِ وَقَوْمِهِۦ مَاذَا تَعْبُدُونَۖ","أَئِفْكاً اٰلِهَةٗ دُونَ اَ۬للَّهِ تُرِيدُونَۖ","فَمَا ظَنُّكُم بِرَبِّ اِ۬لْعَٰلَمِينَۖ","فَنَظَرَ نَظْرَةٗ فِے اِ۬لنُّجُومِ","فَقَالَ إِنِّے سَقِيمٞ","فَتَوَلَّوْاْ عَنْهُ مُدْبِرِينَۖ","فَرَاغَ إِلَىٰٓ ءَالِهَتِهِمْ فَقَالَ أَلَا تَاكُلُونَ","مَا لَكُمْ لَا تَنطِقُونَۖ","فَرَاغَ عَلَيْهِمْ ضَرْباَۢ بِالْيَمِينِ","فَأَقْبَلُوٓاْ إِلَيْهِ يَزِفُّونَۖ","قَالَ أَتَعْبُدُونَ مَا تَنْحِتُونَ","وَاللَّهُ خَلَقَكُمْ وَمَا تَعْمَلُونَۖ","قَالُواْ اُ۪بْنُواْ لَهُۥ بُنْيَٰناٗ فَأَلْقُوهُ فِے اِ۬لْجَحِيمِ","فَأَرَادُواْ بِهِۦ كَيْداٗ فَجَعَلْنَٰهُمُ اُ۬لَاسْفَلِينَۖ","وَقَالَ إِنِّے ذَاهِبٌ اِلَىٰ رَبِّے سَيَهْدِينِۖ","رَبِّ هَبْ لِے مِنَ اَ۬لصَّٰلِحِينَۖ","فَبَشَّرْنَٰهُ بِغُلَٰمٍ حَلِيمٖۖ","فَلَمَّا بَلَغَ مَعَهُ اُ۬لسَّعْيَ قَالَ يَٰبُنَيِّ إِنِّيَ أَر۪ىٰ فِے اِ۬لْمَنَامِ أَنِّيَ أَذْبَحُكَ فَانظُرْ مَاذَا تَر۪ىٰۖ قَالَ يَٰٓأَبَتِ اِ۪فْعَلْ مَا تُومَرُۖ سَتَجِدُنِيَ إِن شَآءَ اَ۬للَّهُ مِنَ اَ۬لصَّٰبِرِينَۖ","فَلَمَّآ أَسْلَمَا وَتَلَّهُۥ لِلْجَبِينِ","وَنَٰدَيْنَٰهُ أَنْ يَّٰٓإِبْرَٰهِيمُ","قَدْ صَدَّقْتَ اَ۬لرُّءْي۪آۖ إِنَّا كَذَٰلِكَ نَجْزِے اِ۬لْمُحْسِنِينَۖ","إِنَّ هَٰذَا لَهُوَ اَ۬لْبَلَٰٓؤُاْ اُ۬لْمُبِينُۖ","وَفَدَيْنَٰهُ بِذِبْحٍ عَظِيمٖۖ","وَتَرَكْنَا عَلَيْهِ فِے اِ۬لَاخِرِينَۖ","سَلَٰمٌ عَلَىٰٓ إِبْرَٰهِيمَۖ","كَذَٰلِكَ نَجْزِے اِ۬لْمُحْسِنِينَۖ","إِنَّهُۥ مِنْ عِبَادِنَا اَ۬لْمُومِنِينَۖ","وَبَشَّرْنَٰهُ بِإِسْحَٰقَ نَبِيٓـٔاٗ مِّنَ اَ۬لصَّٰلِحِينَ","وَبَٰرَكْنَا عَلَيْهِ وَعَلَىٰٓ إِسْحَٰقَۖ وَمِن ذُرِّيَّتِهِمَا مُحْسِنٞ وَظَالِمٞ لِّنَفْسِهِۦ مُبِينٞۖ","۞ وَلَقَدْ مَنَنَّا عَلَىٰ مُوس۪ىٰ وَهَٰرُونَ","وَنَجَّيْنَٰهُمَا وَقَوْمَهُمَا مِنَ اَ۬لْكَرْبِ اِ۬لْعَظِيمِۖ","وَنَصَرْنَٰهُمْ فَكَانُواْ هُمُ اُ۬لْغَٰلِبِينَۖ","وَءَاتَيْنَٰهُمَا اَ۬لْكِتَٰبَ اَ۬لْمُسْتَبِينَۖ","وَهَدَيْنَٰهُمَا اَ۬لصِّرَٰطَ اَ۬لْمُسْتَقِيمَۖ","وَتَرَكْنَا عَلَيْهِمَا فِے اِ۬لَاخِرِينَۖ","سَلَٰمٌ عَلَىٰ مُوس۪ىٰ وَهَٰرُونَۖ","إِنَّا كَذَٰلِكَ نَجْزِے اِ۬لْمُحْسِنِينَۖ","إِنَّهُمَا مِنْ عِبَادِنَا اَ۬لْمُومِنِينَۖ","وَإِنَّ إِلْيَاسَ لَمِنَ اَ۬لْمُرْسَلِينَ","إِذْ قَالَ لِقَوْمِهِۦٓ أَلَا تَتَّقُونَ","أَتَدْعُونَ بَعْلاٗ وَتَذَرُونَ أَحْسَنَ اَ۬لْخَٰلِقِينَۖ","اَ۬للَّهُ رَبُّكُمْ وَرَبُّ ءَابَآئِكُمُ اُ۬لَاوَّلِينَۖ","فَكَذَّبُوهُ فَإِنَّهُمْ لَمُحْضَرُونَ","إِلَّا عِبَادَ اَ۬للَّهِ اِ۬لْمُخْلَصِينَۖ","وَتَرَكْنَا عَلَيْهِ فِے اِ۬لَاخِرِينَۖ","سَلَٰمٌ عَلَىٰٓ ءَالِ يَاسِينَۖ","إِنَّا كَذَٰلِكَ نَجْزِے اِ۬لْمُحْسِنِينَۖ","إِنَّهُۥ مِنْ عِبَادِنَا اَ۬لْمُومِنِينَۖ","وَإِنَّ لُوطاٗ لَّمِنَ اَ۬لْمُرْسَلِينَ","إِذْ نَجَّيْنَٰهُ وَأَهْلَهُۥٓ أَجْمَعِينَ","إِلَّا عَجُوزاٗ فِے اِ۬لْغَٰبِرِينَ","ثُمَّ دَمَّرْنَا اَ۬لَاخَرِينَۖ","وَإِنَّكُمْ لَتَمُرُّونَ عَلَيْهِم مُّصْبِحِينَ","وَبِاليْلِۖ أَفَلَا تَعْقِلُونَۖ","وَإِنَّ يُونُسَ لَمِنَ اَ۬لْمُرْسَلِينَ","إِذَ اَبَقَ إِلَى اَ۬لْفُلْكِ اِ۬لْمَشْحُونِ","فَسَاهَمَ فَكَانَ مِنَ اَ۬لْمُدْحَضِينَ","فَالْتَقَمَهُ اُ۬لْحُوتُ وَهُوَ مُلِيمٞۖ","فَلَوْلَآ أَنَّهُۥ كَانَ مِنَ اَ۬لْمُسَبِّحِينَ","لَلَبِثَ فِے بَطْنِهِۦٓ إِلَىٰ يَوْمِ يُبْعَثُونَۖ","۞ فَنَبَذْنَٰهُ بِالْعَرَآءِ وَهُوَ سَقِيمٞۖ","وَأَنۢبَتْنَا عَلَيْهِ شَجَرَةٗ مِّنْ يَّقْطِينٖۖ","وَأَرْسَلْنَٰهُ إِلَىٰ مِاْئَةِ أَلْفٍ اَوْ يَزِيدُونَۖ","فَـَٔامَنُواْ فَمَتَّعْنَٰهُمُۥٓ إِلَىٰ حِينٖۖ","فَاسْتَفْتِهِمُۥٓ أَلِرَبِّكَ اَ۬لْبَنَاتُ وَلَهُمُ اُ۬لْبَنُونَۖ","أَمْ خَلَقْنَا اَ۬لْمَلَٰٓئِكَةَ إِنَٰثاٗ وَهُمْ شَٰهِدُونَۖ","أَلَآ إِنَّهُم مِّنِ اِفْكِهِمْ لَيَقُولُونَ","وَلَدَ اَ۬للَّهُ وَإِنَّهُمْ لَكَٰذِبُونَۖ","أَصْطَفَى اَ۬لْبَنَاتِ عَلَى اَ۬لْبَنِينَۖ","مَا لَكُمْۖ كَيْفَ تَحْكُمُونَۖ","أَفَلَا تَذَّكَّرُونَۖ","أَمْ لَكُمْ سُلْطَٰنٞ مُّبِينٞ","فَاتُواْ بِكِتَٰبِكُمُۥٓ إِن كُنتُمْ صَٰدِقِينَۖ","وَجَعَلُواْ بَيْنَهُۥ وَبَيْنَ اَ۬لْجِنَّةِ نَسَباٗۖ وَلَقَدْ عَلِمَتِ اِ۬لْجِنَّةُ إِنَّهُمْ لَمُحْضَرُونَۖ","سُبْحَٰنَ اَ۬للَّهِ عَمَّا يَصِفُونَۖ","إِلَّا عِبَادَ اَ۬للَّهِ اِ۬لْمُخْلَصِينَۖ","فَإِنَّكُمْ وَمَا تَعْبُدُونَ","مَآ أَنتُمْ عَلَيْهِ بِفَٰتِنِينَ","إِلَّا مَنْ هُوَ صَالِ اِ۬لْجَحِيمِۖ","وَمَا مِنَّآ إِلَّا لَهُۥ مَقَامٞ مَّعْلُومٞۖ","وَإِنَّا لَنَحْنُ اُ۬لصَّآفُّونَ","وَإِنَّا لَنَحْنُ اُ۬لْمُسَبِّحُونَۖ","وَإِن كَانُواْ لَيَقُولُونَ","لَوَ اَنَّ عِندَنَا ذِكْراٗ مِّنَ اَ۬لَاوَّلِينَ","لَكُنَّا عِبَادَ اَ۬للَّهِ اِ۬لْمُخْلَصِينَۖ","فَكَفَرُواْ بِهِۦۖ فَسَوْفَ يَعْلَمُونَۖ","وَلَقَدْ سَبَقَتْ كَلِمَتُنَا لِعِبَادِنَا اَ۬لْمُرْسَلِينَ","إِنَّهُمْ لَهُمُ اُ۬لْمَنصُورُونَ","وَإِنَّ جُندَنَا لَهُمُ اُ۬لْغَٰلِبُونَۖ","فَتَوَلَّ عَنْهُمْ حَتَّىٰ حِينٖۖ","وَأَبْصِرْهُمْ فَسَوْفَ يُبْصِرُونَۖ","أَفَبِعَذَابِنَا يَسْتَعْجِلُونَۖ","فَإِذَا نَزَلَ بِسَاحَتِهِمْ فَسَآءَ صَبَاحُ اُ۬لْمُنذَرِينَۖ","وَتَوَلَّ عَنْهُمْ حَتَّىٰ حِينٖۖ","وَأَبْصِرْ فَسَوْفَ يُبْصِرُونَۖ","سُبْحَٰنَ رَبِّكَ رَبِّ اِ۬لْعِزَّةِ عَمَّا يَصِفُونَۖ","وَسَلَٰمٌ عَلَى اَ۬لْمُرْسَلِينَۖ","وَالْحَمْدُ لِلهِ رَبِّ اِ۬لْعَٰلَمِينَۖ"]],["ص",["صَٓۖ وَالْقُرْءَانِ ذِے اِ۬لذِّكْرِۖ بَلِ اِ۬لذِينَ كَفَرُواْ فِے عِزَّةٖ وَشِقَاقٖۖ","كَمَ اَهْلَكْنَا مِن قَبْلِهِم مِّن قَرْنٖ فَنَادَواْ وَّلَاتَ حِينَ مَنَاصٖۖ","وَعَجِبُوٓاْ أَن جَآءَهُم مُّنذِرٞ مِّنْهُمْۖ وَقَالَ اَ۬لْكَٰفِرُونَ هَٰذَا سَٰحِرٞ كَذَّابٌ","اَجَعَلَ اَ۬لَالِهَةَ إِلَٰهاٗ وَٰحِداً اِنَّ هَٰذَا لَشَےْءٌ عُجَابٞۖ","وَانطَلَقَ اَ۬لْمَلَأُ مِنْهُمُۥٓ أَنِ اِ۪مْشُواْ وَاصْبِرُواْ عَلَىٰٓ ءَالِهَتِكُمُۥٓ إِنَّ هَٰذَا لَشَےْءٞ يُرَادُ","مَا سَمِعْنَا بِهَٰذَا فِے اِ۬لْمِلَّةِ اِ۬لَاخِرَةِ إِنْ هَٰذَآ إِلَّا اَ۪خْتِلَٰقٌ","اَ۟نزِلَ عَلَيْهِ اِ۬لذِّكْرُ مِنۢ بَيْنِنَاۖ بَلْ هُمْ فِے شَكّٖ مِّن ذِكْرِے بَل لَّمَّا يَذُوقُواْ عَذَابِۖ","أَمْ عِندَهُمْ خَزَآئِنُ رَحْمَةِ رَبِّكَ اَ۬لْعَزِيزِ اِ۬لْوَهَّابِۖ","أَمْ لَهُم مُّلْكُ اُ۬لسَّمَٰوَٰتِ وَالَارْضِ وَمَا بَيْنَهُمَاۖ فَلْيَرْتَقُواْ فِے اِ۬لَاسْبَٰبِۖ","جُندٞ مَّا هُنَالِكَ مَهْزُومٞ مِّنَ اَ۬لَاحْزَابِۖ","كَذَّبَتْ قَبْلَهُمْ قَوْمُ نُوحٖ وَعَادٞ وَفِرْعَوْنُ ذُو اُ۬لَاوْتَادِ","وَثَمُودُ وَقَوْمُ لُوطٖ وَأَصْحَٰبُ لَيْكَةَۖ أُوْلَٰٓئِكَ اَ۬لَاحْزَابُۖ","إِن كُلٌّ اِلَّا كَذَّبَ اَ۬لرُّسُلَ فَحَقَّ عِقَابِۖ","وَمَا يَنظُرُ هَٰٓؤُلَآءِ الَّا صَيْحَةٗ وَٰحِدَةٗ مَّا لَهَا مِن فَوَاقٖۖ","وَقَالُواْ رَبَّنَا عَجِّل لَّنَا قِطَّنَا قَبْلَ يَوْمِ اِ۬لْحِسَابِۖ","اِ۪صْبِرْ عَلَىٰ مَا يَقُولُونَۖ وَاذْكُرْ عَبْدَنَا دَاوُۥدَ ذَا اَ۬لَايْدِۖ إِنَّهُۥٓ أَوَّابٌۖ","اِنَّا سَخَّرْنَا اَ۬لْجِبَالَ مَعَهُۥ يُسَبِّحْنَ بِالْعَشِيِّ وَالِاشْرَاقِ","وَالطَّيْرَ مَحْشُورَةٗۖ كُلّٞ لَّهُۥٓ أَوَّابٞۖ","وَشَدَدْنَا مُلْكَهُۥ وَءَاتَيْنَٰهُ اُ۬لْحِكْمَةَ وَفَصْلَ اَ۬لْخِطَابِۖ","۞ وَهَلَ اَت۪يٰكَ نَبَؤُاْ اُ۬لْخَصْمِ إِذْ تَسَوَّرُواْ اُ۬لْمِحْرَابَ","إِذْ دَخَلُواْ عَلَىٰ دَاوُۥدَ فَفَزِعَ مِنْهُمْ قَالُواْ لَا تَخَفْۖ خَصْمَٰنِ بَغ۪ىٰ بَعْضُنَا عَلَىٰ بَعْضٖ فَاحْكُم بَيْنَنَا بِالْحَقِّ وَلَا تُشْطِطْۖ وَاهْدِنَآ إِلَىٰ سَوَآءِ اِ۬لصِّرَٰطِۖ","إِنَّ هَٰذَآ أَخِے لَهُۥ تِسْعٞ وَتِسْعُونَ نَعْجَةٗ وَلِے نَعْجَةٞ وَٰحِدَةٞ فَقَالَ أَكْفِلْنِيهَا وَعَزَّنِے فِے اِ۬لْخِطَابِۖ","قَالَ لَقَد ظَّلَمَكَ بِسُؤَالِ نَعْجَتِكَ إِلَىٰ نِعَاجِهِۦۖ وَإِنَّ كَثِيراٗ مِّنَ اَ۬لْخُلَطَآءِ لَيَبْغِے بَعْضُهُمْ عَلَىٰ بَعْضٍ اِلَّا اَ۬لذِينَ ءَامَنُواْ وَعَمِلُواْ اُ۬لصَّٰلِحَٰتِۖ وَقَلِيلٞ مَّا هُمْۖ وَظَنَّ دَاوُۥدُ أَنَّمَا فَتَنَّٰهُ فَاسْتَغْفَرَ رَبَّهُۥ وَخَرَّ رَاكِعاٗ وَأَنَابَۖ۩","فَغَفَرْنَا لَهُۥ ذَٰلِكَۖ وَإِنَّ لَهُۥ عِندَنَا لَزُلْف۪ىٰ وَحُسْنَ مَـَٔابٖۖ","يَٰدَاوُۥدُ إِنَّا جَعَلْنَٰكَ خَلِيفَةٗ فِے اِ۬لَارْضِ فَاحْكُم بَيْنَ اَ۬لنَّاسِ بِالْحَقِّ وَلَا تَتَّبِعِ اِ۬لْهَو۪ىٰ فَيُضِلَّكَ عَن سَبِيلِ اِ۬للَّهِۖ إِنَّ اَ۬لذِينَ يَضِلُّونَ عَن سَبِيلِ اِ۬للَّهِ لَهُمْ عَذَابٞ شَدِيدُۢ بِمَا نَسُواْ يَوْمَ اَ۬لْحِسَابِۖ","وَمَا خَلَقْنَا اَ۬لسَّمَآءَ وَالَارْضَ وَمَا بَيْنَهُمَا بَٰطِلاٗۖ ذَٰلِكَ ظَنُّ اُ۬لذِينَ كَفَرُواْۖ فَوَيْلٞ لِّلذِينَ كَفَرُواْ مِنَ اَ۬لنّ۪ارِۖ","أَمْ نَجْعَلُ اُ۬لذِينَ ءَامَنُواْ وَعَمِلُواْ اُ۬لصَّٰلِحَٰتِ كَالْمُفْسِدِينَ فِے اِ۬لَارْضِۖ أَمْ نَجْعَلُ اُ۬لْمُتَّقِينَ كَالْفُجّ۪ارِۖ","كِتَٰبٌ اَنزَلْنَٰهُ إِلَيْكَ مُبَٰرَكٞ لِّيَدَّبَّرُوٓاْ ءَايَٰتِهِۦ وَلِيَتَذَكَّرَ أُوْلُواْ اُ۬لَالْبَٰبِۖ","وَوَهَبْنَا لِدَاوُۥدَ سُلَيْمَٰنَۖ نِعْمَ اَ۬لْعَبْدُۖ إِنَّهُۥٓ أَوَّابٌۖ","۞ اِذْ عُرِضَ عَلَيْهِ بِالْعَشِيِّ اِ۬لصَّٰفِنَٰتُ اُ۬لْجِيَادُ","فَقَالَ إِنِّيَ أَحْبَبْتُ حُبَّ اَ۬لْخَيْرِ عَن ذِكْرِ رَبِّے حَتَّىٰ تَوَارَتْ بِالْحِجَابِۖ","رُدُّوهَا عَلَيَّ فَطَفِقَ مَسْحاَۢ بِالسُّوقِ وَالَاعْنَاقِۖ","وَلَقَدْ فَتَنَّا سُلَيْمَٰنَ وَأَلْقَيْنَا عَلَىٰ كُرْسِيِّهِۦ جَسَداٗ ثُمَّ أَنَابَۖ","قَالَ رَبِّ اِ۪غْفِرْ لِے وَهَبْ لِے مُلْكاٗ لَّا يَنۢبَغِے لِأَحَدٖ مِّنۢ بَعْدِيَۖ إِنَّكَ أَنتَ اَ۬لْوَهَّابُۖ","فَسَخَّرْنَا لَهُ اُ۬لرِّيحَ تَجْرِے بِأَمْرِهِۦ رُخَآءً حَيْثُ أَصَابَ","وَالشَّيَٰطِينَ كُلَّ بَنَّآءٖ وَغَوَّاصٖ","وَءَاخَرِينَ مُقَرَّنِينَ فِے اِ۬لَاصْفَادِۖ","هَٰذَا عَطَآؤُنَا فَامْنُنَ اَوَ اَمْسِكْ بِغَيْرِ حِسَابٖۖ","وَإِنَّ لَهُۥ عِندَنَا لَزُلْف۪ىٰ وَحُسْنَ مَـَٔابٖۖ","وَاذْكُرْ عَبْدَنَآ أَيُّوبَ إِذْ نَاد۪ىٰ رَبَّهُۥٓ أَنِّے مَسَّنِيَ اَ۬لشَّيْطَٰنُ بِنُصْبٖ وَعَذَابٍۖ","اُ۟رْكُضْ بِرِجْلِكَۖ هَٰذَا مُغْتَسَلُۢ بَارِدٞ وَشَرَابٞۖ","وَوَهَبْنَا لَهُۥٓ أَهْلَهُۥ وَمِثْلَهُم مَّعَهُمْ رَحْمَةٗ مِّنَّا وَذِكْر۪ىٰ لِأُوْلِے اِ۬لَالْبَٰبِۖ","وَخُذْ بِيَدِكَ ضِغْثاٗ فَاضْرِب بِّهِۦ وَلَا تَحْنَثِۖ اِنَّا وَجَدْنَٰهُ صَابِراٗۖ نِّعْمَ اَ۬لْعَبْدُۖ إِنَّهُۥٓ أَوَّابٞۖ","وَاذْكُرْ عِبَٰدَنَآ إِبْرَٰهِيمَ وَإِسْحَٰقَ وَيَعْقُوبَ أُوْلِے اِ۬لَايْدِے وَالَابْصٰ۪رِۖ","إِنَّآ أَخْلَصْنَٰهُم بِخَالِصَةِ ذِكْرَى اَ۬لدّ۪ارِۖ","وَإِنَّهُمْ عِندَنَا لَمِنَ اَ۬لْمُصْطَفَيْنَ اَ۬لَاخْي۪ارِۖ","وَاذْكُرِ اِسْمَٰعِيلَ وَالْيَسَعَ وَذَا اَ۬لْكِفْلِۖ وَكُلّٞ مِّنَ اَ۬لَاخْي۪ارِۖ","هَٰذَا ذِكْرٞۖ وَإِنَّ لِلْمُتَّقِينَ لَحُسْنَ مَـَٔابٖ","جَنَّٰتِ عَدْنٖ مُّفَتَّحَةٗ لَّهُمُ اُ۬لَابْوَٰبُ","مُتَّكِـِٕينَ فِيهَا يَدْعُونَ فِيهَا بِفَٰكِهَةٖ كَثِيرَةٖ وَشَرَابٖۖ","۞ وَعِندَهُمْ قَٰصِرَٰتُ اُ۬لطَّرْفِ أَتْرَابٌۖ","هَٰذَا مَا تُوعَدُونَ لِيَوْمِ اِ۬لْحِسَابِۖ","إِنَّ هَٰذَا لَرِزْقُنَا مَا لَهُۥ مِن نَّفَادٍۖ","هَٰذَا وَإِنَّ لِلطَّٰغِينَ لَشَرَّ مَـَٔابٖ","جَهَنَّمَ يَصْلَوْنَهَاۖ فَبِيسَ اَ۬لْمِهَادُۖ","هَٰذَا فَلْيَذُوقُوهُ حَمِيمٞ وَغَسَاقٞ","وَءَاخَرُ مِن شَكْلِهِۦٓ أَزْوَٰجٌۖ","هَٰذَا فَوْجٞ مُّقْتَحِمٞ مَّعَكُمْۖ لَا مَرْحَباَۢ بِهِمُۥٓۖ إِنَّهُمْ صَالُواْ اُ۬لنّ۪ارِۖ","قَالُواْ بَلَ اَنتُمْ لَا مَرْحَباَۢ بِكُمُۥٓ أَنتُمْ قَدَّمْتُمُوهُ لَنَاۖ فَبِيسَ اَ۬لْقَرَارُۖ","قَالُواْ رَبَّنَا مَن قَدَّمَ لَنَا هَٰذَا فَزِدْهُ عَذَاباٗ ضِعْفاٗ فِے اِ۬لنّ۪ارِۖ","وَقَالُواْ مَا لَنَا لَا نَر۪ىٰ رِجَالاٗ كُنَّا نَعُدُّهُم مِّنَ اَ۬لَاشْر۪ارِۖ","أَتَّخَذْنَٰهُمْ سُخْرِيّاً اَمْ زَاغَتْ عَنْهُمُ اُ۬لَابْصَٰرُۖ","إِنَّ ذَٰلِكَ لَحَقّٞ تَخَاصُمُ أَهْلِ اِ۬لنّ۪ارِۖ","قُلِ اِنَّمَآ أَنَا مُنذِرٞۖ وَمَا مِنِ اِلَٰهٍ اِلَّا اَ۬للَّهُ اُ۬لْوَٰحِدُ اُ۬لْقَهَّارُۖ","رَبُّ اُ۬لسَّمَٰوَٰتِ وَالَارْضِ وَمَا بَيْنَهُمَاۖ اَ۬لْعَزِيزُ اُ۬لْغَفَّٰرُۖ","قُلْ هُوَ نَبَؤٌاْ عَظِيمٌ","اَنتُمْ عَنْهُ مُعْرِضُونَۖ","مَا كَانَ لِے مِنْ عِلْمِۢ بِالْمَلَإِ اِ۬لَاعْل۪ىٰٓ إِذْ يَخْتَصِمُونَۖ","إِنْ يُّوح۪ىٰٓ إِلَيَّ إِلَّآ أَنَّمَآ أَنَا نَذِيرٞ مُّبِينٌۖ","اِذْ قَالَ رَبُّكَ لِلْمَلَٰٓئِكَةِ إِنِّے خَٰلِقُۢ بَشَراٗ مِّن طِينٖ","فَإِذَا سَوَّيْتُهُۥ وَنَفَخْتُ فِيهِ مِن رُّوحِے فَقَعُواْ لَهُۥ سَٰجِدِينَۖ","فَسَجَدَ اَ۬لْمَلَٰٓئِكَةُ كُلُّهُمُۥٓ أَجْمَعُونَ","إِلَّآ إِبْلِيسَ اَ۪سْتَكْبَرَ وَكَانَ مِنَ اَ۬لْكٰ۪فِرِينَۖ","قَالَ يَٰٓإِبْلِيسُ مَا مَنَعَكَ أَن تَسْجُدَ لِمَا خَلَقْتُ بِيَدَيَّ أَسْتَكْبَرْتَ أَمْ كُنتَ مِنَ اَ۬لْعَالِينَۖ","قَالَ أَنَا خَيْرٞ مِّنْهُ خَلَقْتَنِے مِن نّ۪ارٖ وَخَلَقْتَهُۥ مِن طِينٖۖ","قَالَ فَاخْرُجْ مِنْهَا فَإِنَّكَ رَجِيمٞ","وَإِنَّ عَلَيْكَ لَعْنَتِيَ إِلَىٰ يَوْمِ اِ۬لدِّينِۖ","قَالَ رَبِّ فَأَنظِرْنِےٓ إِلَىٰ يَوْمِ يُبْعَثُونَۖ","قَالَ فَإِنَّكَ مِنَ اَ۬لْمُنظَرِينَ","إِلَىٰ يَوْمِ اِ۬لْوَقْتِ اِ۬لْمَعْلُومِۖ","قَالَ فَبِعِزَّتِكَ لَأُغْوِيَنَّهُمُۥٓ أَجْمَعِينَ","إِلَّا عِبَادَكَ مِنْهُمُ اُ۬لْمُخْلَصِينَۖ","۞ قَالَ فَالْحَقَّ وَالْحَقَّ أَقُولُۖ لَأَمْلَأَنَّ جَهَنَّمَ مِنكَ وَمِمَّن تَبِعَكَ مِنْهُمُۥٓ أَجْمَعِينَۖ","قُلْ مَآ أَسْـَٔلُكُمْ عَلَيْهِ مِنَ اَجْرٖ وَمَآ أَنَا مِنَ اَ۬لْمُتَكَلِّفِينَۖ","إِنْ هُوَ إِلَّا ذِكْرٞ لِّلْعَٰلَمِينَۖ","وَلَتَعْلَمُنَّ نَبَأَهُۥ بَعْدَ حِينٖۖ"]],["الزمر",["تَنزِيلُ اُ۬لْكِتَٰبِ مِنَ اَ۬للَّهِ اِ۬لْعَزِيزِ اِ۬لْحَكِيمِۖ","إِنَّآ أَنزَلْنَآ إِلَيْكَ اَ۬لْكِتَٰبَ بِالْحَقِّ فَاعْبُدِ اِ۬للَّهَ مُخْلِصاٗ لَّهُ اُ۬لدِّينَۖ","أَلَا لِلهِ اِ۬لدِّينُ اُ۬لْخَالِصُۖ وَالذِينَ اَ۪تَّخَذُواْ مِن دُونِهِۦٓ أَوْلِيَآءَ مَا نَعْبُدُهُمُۥٓ إِلَّا لِيُقَرِّبُونَآ إِلَى اَ۬للَّهِ زُلْف۪ىٰٓۖ إِنَّ اَ۬للَّهَ يَحْكُمُ بَيْنَهُمْ فِے مَا هُمْ فِيهِ يَخْتَلِفُونَۖ","إِنَّ اَ۬للَّهَ لَا يَهْدِے مَنْ هُوَ كَٰذِبٞ كَفَّارٞۖ","لَّوَ اَرَادَ اَ۬للَّهُ أَنْ يَّتَّخِذَ وَلَداٗ لَّاصْطَف۪ىٰ مِمَّا يَخْلُقُ مَا يَشَآءُۖ سُبْحَٰنَهُۥۖ هُوَ اَ۬للَّهُ اُ۬لْوَٰحِدُ اُ۬لْقَهَّارُۖ","خَلَقَ اَ۬لسَّمَٰوَٰتِ وَالَارْضَ بِالْحَقِّۖ يُكَوِّرُ اُ۬ليْلَ عَلَى اَ۬لنَّه۪ارِ وَيُكَوِّرُ اُ۬لنَّهَارَ عَلَى اَ۬ليْلِۖ وَسَخَّرَ اَ۬لشَّمْسَ وَالْقَمَرَۖ كُلّٞ يَجْرِے لِأَجَلٖ مُّسَمّىًۖ اَلَا هُوَ اَ۬لْعَزِيزُ اُ۬لْغَفَّٰرُۖ","خَلَقَكُم مِّن نَّفْسٖ وَٰحِدَةٖ ثُمَّ جَعَلَ مِنْهَا زَوْجَهَاۖ وَأَنزَلَ لَكُم مِّنَ اَ۬لَانْعَٰمِ ثَمَٰنِيَةَ أَزْوَٰجٖۖ يَخْلُقُكُمْ فِے بُطُونِ أُمَّهَٰتِكُمْ خَلْقاٗ مِّنۢ بَعْدِ خَلْقٖ فِے ظُلُمَٰتٖ ثَلَٰثٖۖ ذَٰلِكُمُ اُ۬للَّهُ رَبُّكُمْ لَهُ اُ۬لْمُلْكُۖ لَآ إِلَٰهَ إِلَّا هُوَۖ فَأَنّ۪ىٰ تُصْرَفُونَۖ","إِن تَكْفُرُواْ فَإِنَّ اَ۬للَّهَ غَنِيٌّ عَنكُمْۖ وَلَا يَرْض۪ىٰ لِعِبَادِهِ اِ۬لْكُفْرَۖ وَإِن تَشْكُرُواْ يَرْضَهُ لَكُمْۖ وَلَا تَزِرُ وَازِرَةٞ وِزْرَ أُخْر۪ىٰۖ ثُمَّ إِلَىٰ رَبِّكُم مَّرْجِعُكُمْ فَيُنَبِّئُكُم بِمَا كُنتُمْ تَعْمَلُونَۖ إِنَّهُۥ عَلِيمُۢ بِذَاتِ اِ۬لصُّدُورِۖ","۞ وَإِذَا مَسَّ اَ۬لِانسَٰنَ ضُرّٞ دَعَا رَبَّهُۥ مُنِيباً اِلَيْهِۖ ثُمَّ إِذَا خَوَّلَهُۥ نِعْمَةٗ مِّنْهُ نَسِيَ مَا كَانَ يَدْعُوٓاْ إِلَيْهِ مِن قَبْلُ وَجَعَلَ لِلهِ أَندَاداٗ لِّيُضِلَّ عَن سَبِيلِهِۦۖ قُلْ تَمَتَّعْ بِكُفْرِكَ قَلِيلاً اِنَّكَ مِنَ اَصْحَٰبِ اِ۬لنّ۪ارِۖ","أَمَنْ هُوَ قَٰنِتٌ اٰنَآءَ اَ۬ليْلِ سَاجِداٗ وَقَآئِماٗ يَحْذَرُ اُ۬لَاخِرَةَ وَيَرْجُواْ رَحْمَةَ رَبِّهِۦۖ قُلْ هَلْ يَسْتَوِے اِ۬لذِينَ يَعْلَمُونَ وَالذِينَ لَا يَعْلَمُونَۖ إِنَّمَا يَتَذَكَّرُ أُوْلُواْ اُ۬لَالْبَٰبِۖ","قُلْ يَٰعِبَادِ اِ۬لذِينَ ءَامَنُواْ اُ۪تَّقُواْ رَبَّكُمْۖ لِلذِينَ أَحْسَنُواْ فِے هَٰذِهِ اِ۬لدُّنْي۪ا حَسَنَةٞۖ وَأَرْضُ اُ۬للَّهِ وَٰسِعَةٌۖ اِنَّمَا يُوَفَّى اَ۬لصَّٰبِرُونَ أَجْرَهُم بِغَيْرِ حِسَابٖۖ","قُلِ اِنِّيَ أُمِرْتُ أَنَ اَعْبُدَ اَ۬للَّهَ مُخْلِصاٗ لَّهُ اُ۬لدِّينَ وَأُمِرْتُ لِأَنَ اَكُونَ أَوَّلَ اَ۬لْمُسْلِمِينَۖ","قُلِ اِنِّيَ أَخَافُ إِنْ عَصَيْتُ رَبِّے عَذَابَ يَوْمٍ عَظِيمٖۖ","قُلِ اِ۬للَّهَ أَعْبُدُ مُخْلِصاٗ لَّهُۥ دِينِےۖ فَاعْبُدُواْ مَا شِئْتُم مِّن دُونِهِۦۖ قُلِ اِنَّ اَ۬لْخَٰسِرِينَ اَ۬لذِينَ خَسِرُوٓاْ أَنفُسَهُمْ وَأَهْلِيهِمْ يَوْمَ اَ۬لْقِيَٰمَةِۖ أَلَا ذَٰلِكَ هُوَ اَ۬لْخُسْرَانُ اُ۬لْمُبِينُۖ","لَهُم مِّن فَوْقِهِمْ ظُلَلٞ مِّنَ اَ۬لنّ۪ارِ وَمِن تَحْتِهِمْ ظُلَلٞۖ ذَٰلِكَ يُخَوِّفُ اُ۬للَّهُ بِهِۦ عِبَادَهُۥۖ يَٰعِبَادِ فَاتَّقُونِۖ","وَالذِينَ اَ۪جْتَنَبُواْ اُ۬لطَّٰغُوتَ أَنْ يَّعْبُدُوهَا وَأَنَابُوٓاْ إِلَى اَ۬للَّهِ لَهُمُ اُ۬لْبُشْر۪ىٰۖ فَبَشِّرْ عِبَادِ","اِ۬لذِينَ يَسْتَمِعُونَ اَ۬لْقَوْلَ فَيَتَّبِعُونَ أَحْسَنَهُۥٓۖ أُوْلَٰٓئِكَ اَ۬لذِينَ هَد۪يٰهُمُ اُ۬للَّهُۖ وَأُوْلَٰٓئِكَ هُمُۥٓ أُوْلُواْ اُ۬لَالْبَٰبِۖ","أَفَمَنْ حَقَّ عَلَيْهِ كَلِمَةُ اُ۬لْعَذَابِ أَفَأَنتَ تُنقِذُ مَن فِے اِ۬لنّ۪ارِۖ","لَٰكِنِ اِ۬لذِينَ اَ۪تَّقَوْاْ رَبَّهُمْ لَهُمْ غُرَفٞ مِّن فَوْقِهَا غُرَفٞ مَّبْنِيَّةٞ تَجْرِے مِن تَحْتِهَا اَ۬لَانْهَٰرُۖ وَعْدَ اَ۬للَّهِۖ لَا يُخْلِفُ اُ۬للَّهُ اُ۬لْمِيعَادَۖ","۞ أَلَمْ تَرَ أَنَّ اَ۬للَّهَ أَنزَلَ مِنَ اَ۬لسَّمَآءِ مَآءٗ فَسَلَكَهُۥ يَنَٰبِيعَ فِے اِ۬لَارْضِ ثُمَّ يُخْرِجُ بِهِۦ زَرْعاٗ مُّخْتَلِفاً اَلْوَٰنُهُۥ ثُمَّ يَهِيجُ فَتَر۪يٰهُ مُصْفَرّاٗ ثُمَّ يَجْعَلُهُۥ حُطَٰماًۖ اِنَّ فِے ذَٰلِكَ لَذِكْر۪ىٰ لِأُوْلِے اِ۬لَالْبَٰبِۖ","أَفَمَن شَرَحَ اَ۬للَّهُ صَدْرَهُۥ لِلِاسْلَٰمِ فَهُوَ عَلَىٰ نُورٖ مِّن رَّبِّهِۦۖ فَوَيْلٞ لِّلْقَٰسِيَةِ قُلُوبُهُم مِّن ذِكْرِ اِ۬للَّهِۖ أُوْلَٰٓئِكَ فِے ضَلَٰلٖ مُّبِينٍۖ","اِ۬للَّهُ نَزَّلَ أَحْسَنَ اَ۬لْحَدِيثِ كِتَٰباٗ مُّتَشَٰبِهاٗ مَّثَانِيَۖ تَقْشَعِرُّ مِنْهُ جُلُودُ اُ۬لذِينَ يَخْشَوْنَ رَبَّهُمْ ثُمَّ تَلِينُ جُلُودُهُمْ وَقُلُوبُهُمُۥٓ إِلَىٰ ذِكْرِ اِ۬للَّهِۖ ذَٰلِكَ هُدَى اَ۬للَّهِ يَهْدِے بِهِۦ مَنْ يَّشَآءُۖ وَمَنْ يُّضْلِلِ اِ۬للَّهُ فَمَا لَهُۥ مِنْ هَادٍۖ","اَفَمَنْ يَّتَّقِے بِوَجْهِهِۦ سُوٓءَ اَ۬لْعَذَابِ يَوْمَ اَ۬لْقِيَٰمَةِۖ وَقِيلَ لِلظَّٰلِمِينَ ذُوقُواْ مَا كُنتُمْ تَكْسِبُونَۖ","كَذَّبَ اَ۬لذِينَ مِن قَبْلِهِمْ فَأَت۪يٰهُمُ اُ۬لْعَذَابُ مِنْ حَيْثُ لَا يَشْعُرُونَۖ","فَأَذَاقَهُمُ اُ۬للَّهُ اُ۬لْخِزْيَ فِے اِ۬لْحَيَوٰةِ اِ۬لدُّنْي۪اۖ وَلَعَذَابُ اُ۬لَاخِرَةِ أَكْبَرُ لَوْ كَانُواْ يَعْلَمُونَۖ","وَلَقَد ضَّرَبْنَا لِلنَّاسِ فِے هَٰذَا اَ۬لْقُرْءَانِ مِن كُلِّ مَثَلٖ لَّعَلَّهُمْ يَتَذَكَّرُونَ","قُرْءَاناً عَرَبِيّاً غَيْرَ ذِے عِوَجٖ لَّعَلَّهُمْ يَتَّقُونَۖ","ضَرَبَ اَ۬للَّهُ مَثَلاٗ رَّجُلاٗ فِيهِ شُرَكَآءُ مُتَشَٰكِسُونَ وَرَجُلاٗ سَلَماٗ لِّرَجُلٍۖ هَلْ يَسْتَوِيَٰنِ مَثَلاًۖ اِ۬لْحَمْدُ لِلهِۖ بَلَ اَكْثَرُهُمْ لَا يَعْلَمُونَۖ","إِنَّكَ مَيِّتٞ وَإِنَّهُم مَّيِّتُونَ","ثُمَّ إِنَّكُمْ يَوْمَ اَ۬لْقِيَٰمَةِ عِندَ رَبِّكُمْ تَخْتَصِمُونَۖ","۞ فَمَنَ اَظْلَمُ مِمَّن كَذَبَ عَلَى اَ۬للَّهِ وَكَذَّبَ بِالصِّدْقِ إِذْ جَآءَهُۥٓۖ أَلَيْسَ فِے جَهَنَّمَ مَثْوىٗ لِّلْكٰ۪فِرِينَۖ","وَالذِے جَآءَ بِالصِّدْقِ وَصَدَّقَ بِهِۦٓ أُوْلَٰٓئِكَ هُمُ اُ۬لْمُتَّقُونَۖ","لَهُم مَّا يَشَآءُونَ عِندَ رَبِّهِمْۖ ذَٰلِكَ جَزَٰٓؤُاْ اُ۬لْمُحْسِنِينَ","لِيُكَفِّرَ اَ۬للَّهُ عَنْهُمُۥٓ أَسْوَأَ اَ۬لذِے عَمِلُواْ وَيَجْزِيَهُمُۥٓ أَجْرَهُم بِأَحْسَنِ اِ۬لذِے كَانُواْ يَعْمَلُونَۖ","أَلَيْسَ اَ۬للَّهُ بِكَافٍ عَبْدَهُۥۖ وَيُخَوِّفُونَكَ بِالذِينَ مِن دُونِهِۦۖ وَمَنْ يُّضْلِلِ اِ۬للَّهُ فَمَا لَهُۥ مِنْ هَادٖۖ وَمَنْ يَّهْدِ اِ۬للَّهُ فَمَا لَهُۥ مِن مُّضِلٍّۖ اَلَيْسَ اَ۬للَّهُ بِعَزِيزٖ ذِے اِ۪نتِقَامٖۖ","وَلَئِن سَأَلْتَهُم مَّنْ خَلَقَ اَ۬لسَّمَٰوَٰتِ وَالَارْضَ لَيَقُولُنَّ اَ۬للَّهُۖ قُلَ اَفَرَٰٓيْتُم مَّا تَدْعُونَ مِن دُونِ اِ۬للَّهِ إِنَ اَرَادَنِيَ اَ۬للَّهُ بِضُرٍّ هَلْ هُنَّ كَٰشِفَٰتُ ضُرِّهِۦٓ أَوَ اَرَادَنِے بِرَحْمَةٍ هَلْ هُنَّ مُمْسِكَٰتُ رَحْمَتِهِۦۖ قُلْ حَسْبِيَ اَ۬للَّهُۖ عَلَيْهِ يَتَوَكَّلُ اُ۬لْمُتَوَكِّلُونَۖ","قُلْ يَٰقَوْمِ اِ۪عْمَلُواْ عَلَىٰ مَكَانَتِكُمُۥٓ إِنِّے عَٰمِلٞۖ فَسَوْفَ تَعْلَمُونَ مَنْ يَّاتِيهِ عَذَابٞ يُخْزِيهِ وَيَحِلُّ عَلَيْهِ عَذَابٞ مُّقِيمٌۖ","اِنَّآ أَنزَلْنَا عَلَيْكَ اَ۬لْكِتَٰبَ لِلنَّاسِ بِالْحَقِّۖ فَمَنِ اِ۪هْتَد۪ىٰ فَلِنَفْسِهِۦۖ وَمَن ضَلَّ فَإِنَّمَا يَضِلُّ عَلَيْهَاۖ وَمَآ أَنتَ عَلَيْهِم بِوَكِيلٍۖ","اِ۬للَّهُ يَتَوَفَّى اَ۬لَانفُسَ حِينَ مَوْتِهَا وَالتِے لَمْ تَمُتْ فِے مَنَامِهَاۖ فَيُمْسِكُ اُ۬لتِے قَض۪ىٰ عَلَيْهَا اَ۬لْمَوْتَ وَيُرْسِلُ اُ۬لُاخْر۪ىٰٓ إِلَىٰٓ أَجَلٖ مُّسَمّىًۖ اِنَّ فِے ذَٰلِكَ لَأٓيَٰتٖ لِّقَوْمٖ يَتَفَكَّرُونَۖ","۞ أَمِ اِ۪تَّخَذُواْ مِن دُونِ اِ۬للَّهِ شُفَعَآءَۖ قُلَ اَوَلَوْ كَانُواْ لَا يَمْلِكُونَ شَئْاٗ وَلَا يَعْقِلُونَۖ","قُل لِّلهِ اِ۬لشَّفَٰعَةُ جَمِيعاٗۖ لَّهُۥ مُلْكُ اُ۬لسَّمَٰوَٰتِ وَالَارْضِۖ ثُمَّ إِلَيْهِ تُرْجَعُونَۖ","وَإِذَا ذُكِرَ اَ۬للَّهُ وَحْدَهُ اُ۪شْمَأَزَّتْ قُلُوبُ اُ۬لذِينَ لَا يُومِنُونَ بِالَاخِرَةِۖ وَإِذَا ذُكِرَ اَ۬لذِينَ مِن دُونِهِۦٓ إِذَا هُمْ يَسْتَبْشِرُونَۖ","قُلِ اِ۬للَّهُمَّ فَاطِرَ اَ۬لسَّمَٰوَٰتِ وَالَارْضِ عَٰلِمَ اَ۬لْغَيْبِ وَالشَّهَٰدَةِ أَنتَ تَحْكُمُ بَيْنَ عِبَادِكَ فِے مَا كَانُواْ فِيهِ يَخْتَلِفُونَۖ","وَلَوَ اَنَّ لِلذِينَ ظَلَمُواْ مَا فِے اِ۬لَارْضِ جَمِيعاٗ وَمِثْلَهُۥ مَعَهُۥ لَافْتَدَوْاْ بِهِۦ مِن سُوٓءِ اِ۬لْعَذَابِ يَوْمَ اَ۬لْقِيَٰمَةِۖ وَبَدَا لَهُم مِّنَ اَ۬للَّهِ مَا لَمْ يَكُونُواْ يَحْتَسِبُونَۖ","وَبَدَا لَهُمْ سَيِّـَٔاتُ مَا كَسَبُواْۖ وَحَاقَ بِهِم مَّا كَانُواْ بِهِۦ يَسْتَهْزِءُونَۖ","فَإِذَا مَسَّ اَ۬لِانسَٰنَ ضُرّٞ دَعَانَا ثُمَّ إِذَا خَوَّلْنَٰهُ نِعْمَةٗ مِّنَّا قَالَ إِنَّمَآ أُوتِيتُهُۥ عَلَىٰ عِلْمِۢۖ بَلْ هِيَ فِتْنَةٞ وَلَٰكِنَّ أَكْثَرَهُمْ لَا يَعْلَمُونَۖ","قَدْ قَالَهَا اَ۬لذِينَ مِن قَبْلِهِمْ فَمَآ أَغْن۪ىٰ عَنْهُم مَّا كَانُواْ يَكْسِبُونَۖ","فَأَصَابَهُمْ سَيِّـَٔاتُ مَا كَسَبُواْۖ وَالذِينَ ظَلَمُواْ مِنْ هَٰٓؤُلَآءِ سَيُصِيبُهُمْ سَيِّـَٔاتُ مَا كَسَبُواْ وَمَا هُم بِمُعْجِزِينَۖ","أَوَلَمْ يَعْلَمُوٓاْ أَنَّ اَ۬للَّهَ يَبْسُطُ اُ۬لرِّزْقَ لِمَنْ يَّشَآءُ وَيَقْدِرُۖ إِنَّ فِے ذَٰلِكَ لَأٓيَٰتٖ لِّقَوْمٖ يُومِنُونَۖ","قُلْ يَٰعِبَادِيَ اَ۬لذِينَ أَسْرَفُواْ عَلَىٰٓ أَنفُسِهِمْ لَا تَقْنَطُواْ مِن رَّحْمَةِ اِ۬للَّهِۖ إِنَّ اَ۬للَّهَ يَغْفِرُ اُ۬لذُّنُوبَ جَمِيعاًۖ اِنَّهُۥ هُوَ اَ۬لْغَفُورُ اُ۬لرَّحِيمُۖ","۞ وَأَنِيبُوٓاْ إِلَىٰ رَبِّكُمْ وَأَسْلِمُواْ لَهُۥ مِن قَبْلِ أَنْ يَّاتِيَكُمُ اُ۬لْعَذَابُ ثُمَّ لَا تُنصَرُونَۖ","وَاتَّبِعُوٓاْ أَحْسَنَ مَآ أُنزِلَ إِلَيْكُم مِّن رَّبِّكُم مِّن قَبْلِ أَنْ يَّاتِيَكُمُ اُ۬لْعَذَابُ بَغْتَةٗ وَأَنتُمْ لَا تَشْعُرُونَ","أَن تَقُولَ نَفْسٞ يَٰحَسْرَت۪ىٰ عَلَىٰ مَا فَرَّطْتُّ فِے جَنۢبِ اِ۬للَّهِ وَإِن كُنتُ لَمِنَ اَ۬لسَّٰخِرِينَ","أَوْ تَقُولَ لَوَ اَنَّ اَ۬للَّهَ هَد۪يٰنِے لَكُنتُ مِنَ اَ۬لْمُتَّقِينَ","أَوْ تَقُولَ حِينَ تَرَى اَ۬لْعَذَابَ لَوَ اَنَّ لِے كَرَّةٗ فَأَكُونَ مِنَ اَ۬لْمُحْسِنِينَۖ","بَل۪ىٰ قَدْ جَآءَتْكَ ءَايَٰتِے فَكَذَّبْتَ بِهَا وَاسْتَكْبَرْتَ وَكُنتَ مِنَ اَ۬لْكٰ۪فِرِينَۖ","وَيَوْمَ اَ۬لْقِيَٰمَةِ تَرَى اَ۬لذِينَ كَذَبُواْ عَلَى اَ۬للَّهِ وُجُوهُهُم مُّسْوَدَّةٌۖ اَلَيْسَ فِے جَهَنَّمَ مَثْوىٗ لِّلْمُتَكَبِّرِينَۖ","وَيُنَجِّے اِ۬للَّهُ اُ۬لذِينَ اَ۪تَّقَوْاْ بِمَفَازَتِهِمْ لَا يَمَسُّهُمُ اُ۬لسُّوٓءُ وَلَا هُمْ يَحْزَنُونَۖ","اَ۬للَّهُ خَٰلِقُ كُلِّ شَےْءٖۖ وَهُوَ عَلَىٰ كُلِّ شَےْءٖ وَكِيلٞۖ","لَّهُۥ مَقَالِيدُ اُ۬لسَّمَٰوَٰتِ وَالَارْضِۖ وَالذِينَ كَفَرُواْ بِـَٔايَٰتِ اِ۬للَّهِ أُوْلَٰٓئِكَ هُمُ اُ۬لْخَٰسِرُونَۖ","قُلَ اَفَغَيْرَ اَ۬للَّهِ تَامُرُونِيَ أَعْبُدُ أَيُّهَا اَ۬لْجَٰهِلُونَۖ","وَلَقَدُ ا۟وحِيَ إِلَيْكَ وَإِلَى اَ۬لذِينَ مِن قَبْلِكَ لَئِنَ اَشْرَكْتَ لَيَحْبَطَنَّ عَمَلُكَ وَلَتَكُونَنَّ مِنَ اَ۬لْخَٰسِرِينَۖ","بَلِ اِ۬للَّهَ فَاعْبُدْ وَكُن مِّنَ اَ۬لشَّٰكِرِينَۖ","۞ وَمَا قَدَرُواْ اُ۬للَّهَ حَقَّ قَدْرِهِۦ وَالَارْضُ جَمِيعاٗ قَبْضَتُهُۥ يَوْمَ اَ۬لْقِيَٰمَةِ وَالسَّمَٰوَٰتُ مَطْوِيَّٰتُۢ بِيَمِينِهِۦۖ سُبْحَٰنَهُۥ وَتَعَٰل۪ىٰ عَمَّا يُشْرِكُونَۖ","وَنُفِخَ فِے اِ۬لصُّورِ فَصَعِقَ مَن فِے اِ۬لسَّمَٰوَٰتِ وَمَن فِے اِ۬لَارْضِ إِلَّا مَن شَآءَ اَ۬للَّهُۖ ثُمَّ نُفِخَ فِيهِ أُخْر۪ىٰ فَإِذَا هُمْ قِيَامٞ يَنظُرُونَۖ","وَأَشْرَقَتِ اِ۬لَارْضُ بِنُورِ رَبِّهَا وَوُضِعَ اَ۬لْكِتَٰبُ وَجِےٓءَ بِالنَّبِيٓـِٕۧنَ وَالشُّهَدَآءِ وَقُضِيَ بَيْنَهُم بِالْحَقِّ وَهُمْ لَا يُظْلَمُونَۖ","وَوُفِّيَتْ كُلُّ نَفْسٖ مَّا عَمِلَتْ وَهُوَ أَعْلَمُ بِمَا يَفْعَلُونَۖ","وَسِيقَ اَ۬لذِينَ كَفَرُوٓاْ إِلَىٰ جَهَنَّمَ زُمَراًۖ حَتَّىٰٓ إِذَا جَآءُوهَا فُتِّحَتَ اَبْوَٰبُهَا وَقَالَ لَهُمْ خَزَنَتُهَآ أَلَمْ يَاتِكُمْ رُسُلٞ مِّنكُمْ يَتْلُونَ عَلَيْكُمُۥٓ ءَايَٰتِ رَبِّكُمْ وَيُنذِرُونَكُمْ لِقَآءَ يَوْمِكُمْ هَٰذَاۖ قَالُواْ بَل۪ىٰ وَلَٰكِنْ حَقَّتْ كَلِمَةُ اُ۬لْعَذَابِ عَلَى اَ۬لْكٰ۪فِرِينَۖ","قِيلَ اَ۟دْخُلُوٓاْ أَبْوَٰبَ جَهَنَّمَ خَٰلِدِينَ فِيهَاۖ فَبِيسَ مَثْوَى اَ۬لْمُتَكَبِّرِينَۖ","وَسِيقَ اَ۬لذِينَ اَ۪تَّقَوْاْ رَبَّهُمُۥٓ إِلَى اَ۬لْجَنَّةِ زُمَراًۖ حَتَّىٰٓ إِذَا جَآءُوهَا وَفُتِّحَتَ اَبْوَٰبُهَا وَقَالَ لَهُمْ خَزَنَتُهَا سَلَٰمٌ عَلَيْكُمْ طِبْتُمْ فَادْخُلُوهَا خَٰلِدِينَۖ","وَقَالُواْ اُ۬لْحَمْدُ لِلهِ اِ۬لذِے صَدَقَنَا وَعْدَهُۥ وَأَوْرَثَنَا اَ۬لَارْضَ نَتَبَوَّأُ مِنَ اَ۬لْجَنَّةِ حَيْثُ نَشَآءُ فَنِعْمَ أَجْرُ اُ۬لْعَٰمِلِينَۖ","وَتَرَى اَ۬لْمَلَٰٓئِكَةَ حَآفِّينَ مِنْ حَوْلِ اِ۬لْعَرْشِ يُسَبِّحُونَ بِحَمْدِ رَبِّهِمْۖ وَقُضِيَ بَيْنَهُم بِالْحَقِّۖ وَقِيلَ اَ۬لْحَمْدُ لِلهِ رَبِّ اِ۬لْعَٰلَمِينَۖ"]],["غافر",["ح۪مِٓۖ تَنزِيلُ اُ۬لْكِتَٰبِ مِنَ اَ۬للَّهِ اِ۬لْعَزِيزِ اِ۬لْعَلِيمِ","غَافِرِ اِ۬لذَّنۢبِ وَقَابِلِ اِ۬لتَّوْبِ شَدِيدِ اِ۬لْعِقَابِ ذِے اِ۬لطَّوْلِۖ لَآ إِلَٰهَ إِلَّا هُوَۖ إِلَيْهِ اِ۬لْمَصِيرُۖ","مَا يُجَٰدِلُ فِےٓ ءَايَٰتِ اِ۬للَّهِ إِلَّا اَ۬لذِينَ كَفَرُواْۖ فَلَا يَغْرُرْكَ تَقَلُّبُهُمْ فِے اِ۬لْبِلَٰدِۖ","كَذَّبَتْ قَبْلَهُمْ قَوْمُ نُوحٖ وَالَاحْزَابُ مِنۢ بَعْدِهِمْۖ وَهَمَّتْ كُلُّ أُمَّةِۢ بِرَسُولِهِمْ لِيَاخُذُوهُۖ وَجَٰدَلُواْ بِالْبَٰطِلِ لِيُدْحِضُواْ بِهِ اِ۬لْحَقَّ فَأَخَذتُّهُمْۖ فَكَيْفَ كَانَ عِقَابِۖ","وَكَذَٰلِكَ حَقَّتْ كَلِمَٰتُ رَبِّكَ عَلَى اَ۬لذِينَ كَفَرُوٓاْ أَنَّهُمُۥٓ أَصْحَٰبُ اُ۬لنّ۪ارِۖ","اِ۬لذِينَ يَحْمِلُونَ اَ۬لْعَرْشَ وَمَنْ حَوْلَهُۥ يُسَبِّحُونَ بِحَمْدِ رَبِّهِمْ وَيُومِنُونَ بِهِۦ وَيَسْتَغْفِرُونَ لِلذِينَ ءَامَنُواْۖ رَبَّنَا وَسِعْتَ كُلَّ شَےْءٖ رَّحْمَةٗ وَعِلْماٗ فَاغْفِرْ لِلذِينَ تَابُواْ وَاتَّبَعُواْ سَبِيلَكَ وَقِهِمْ عَذَابَ اَ۬لْجَحِيمِۖ","رَبَّنَا وَأَدْخِلْهُمْ جَنَّٰتِ عَدْنٍ اِ۬لتِے وَعَدتَّهُمْ وَمَن صَلَحَ مِنَ اٰبَآئِهِمْ وَأَزْوَٰجِهِمْ وَذُرِّيَّٰتِهِمُۥٓۖ إِنَّكَ أَنتَ اَ۬لْعَزِيزُ اُ۬لْحَكِيمُۖ","وَقِهِمُ اُ۬لسَّيِّـَٔاتِۖ وَمَن تَقِ اِ۬لسَّيِّـَٔاتِ يَوْمَئِذٖ فَقَدْ رَحِمْتَهُۥۖ وَذَٰلِكَ هُوَ اَ۬لْفَوْزُ اُ۬لْعَظِيمُۖ","إِنَّ اَ۬لذِينَ كَفَرُواْ يُنَادَوْنَ لَمَقْتُ اُ۬للَّهِ أَكْبَرُ مِن مَّقْتِكُمُۥٓ أَنفُسَكُمُۥٓ إِذْ تُدْعَوْنَ إِلَى اَ۬لِايمَٰنِ فَتَكْفُرُونَۖ","۞ قَالُواْ رَبَّنَآ أَمَتَّنَا اَ۪ثْنَتَيْنِ وَأَحْيَيْتَنَا اَ۪ثْنَتَيْنِ فَاعْتَرَفْنَا بِذُنُوبِنَا فَهَلِ اِلَىٰ خُرُوجٖ مِّن سَبِيلٖۖ","ذَٰلِكُم بِأَنَّهُۥٓ إِذَا دُعِيَ اَ۬للَّهُ وَحْدَهُۥ كَفَرْتُمْ وَإِنْ يُّشْرَكْ بِهِۦ تُومِنُواْۖ فَالْحُكْمُ لِلهِ اِ۬لْعَلِيِّ اِ۬لْكَبِيرِۖ","هُوَ اَ۬لذِے يُرِيكُمُۥٓ ءَايَٰتِهِۦ وَيُنَزِّلُ لَكُم مِّنَ اَ۬لسَّمَآءِ رِزْقاٗۖ وَمَا يَتَذَكَّرُ إِلَّا مَنْ يُّنِيبُۖ","فَادْعُواْ اُ۬للَّهَ مُخْلِصِينَ لَهُ اُ۬لدِّينَ وَلَوْ كَرِهَ اَ۬لْكَٰفِرُونَۖ","رَفِيعُ اُ۬لدَّرَجَٰتِ ذُو اُ۬لْعَرْشِۖ يُلْقِے اِ۬لرُّوحَ مِنَ اَمْرِهِۦ عَلَىٰ مَنْ يَّشَآءُ مِنْ عِبَادِهِۦ لِيُنذِرَ يَوْمَ اَ۬لتَّلَٰقِۦ","يَوْمَ هُم بَٰرِزُونَۖ لَا يَخْف۪ىٰ عَلَى اَ۬للَّهِ مِنْهُمْ شَےْءٞۖ لِّمَنِ اِ۬لْمُلْكُ اُ۬لْيَوْمَۖ لِلهِ اِ۬لْوَٰحِدِ اِ۬لْقَهّ۪ارِۖ","اِ۬لْيَوْمَ تُجْز۪ىٰ كُلُّ نَفْسِۢ بِمَا كَسَبَتْۖ لَا ظُلْمَ اَ۬لْيَوْمَۖ إِنَّ اَ۬للَّهَ سَرِيعُ اُ۬لْحِسَابِۖ","وَأَنذِرْهُمْ يَوْمَ اَ۬لَازِفَةِ إِذِ اِ۬لْقُلُوبُ لَدَى اَ۬لْحَنَاجِرِ كَٰظِمِينَۖ","مَا لِلظَّٰلِمِينَ مِنْ حَمِيمٖ وَلَا شَفِيعٖ يُطَاعُۖ","يَعْلَمُ خَآئِنَةَ اَ۬لَاعْيُنِ وَمَا تُخْفِے اِ۬لصُّدُورُۖ","وَاللَّهُ يَقْضِے بِالْحَقِّۖ وَالذِينَ تَدْعُونَ مِن دُونِهِۦ لَا يَقْضُونَ بِشَےْءٍۖ اِنَّ اَ۬للَّهَ هُوَ اَ۬لسَّمِيعُ اُ۬لْبَصِيرُۖ","۞ أَوَلَمْ يَسِيرُواْ فِے اِ۬لَارْضِ فَيَنظُرُواْ كَيْفَ كَانَ عَٰقِبَةُ اُ۬لذِينَ كَانُواْ مِن قَبْلِهِمْۖ كَانُواْ هُمُۥٓ أَشَدَّ مِنْهُمْ قُوَّةٗ وَءَاثَاراٗ فِے اِ۬لَارْضِ فَأَخَذَهُمُ اُ۬للَّهُ بِذُنُوبِهِمْۖ وَمَا كَانَ لَهُم مِّنَ اَ۬للَّهِ مِنْ وَّاقٖۖ","ذَٰلِكَ بِأَنَّهُمْ كَانَت تَّاتِيهِمْ رُسُلُهُم بِالْبَيِّنَٰتِ فَكَفَرُواْ فَأَخَذَهُمُ اُ۬للَّهُۖ إِنَّهُۥ قَوِيّٞ شَدِيدُ اُ۬لْعِقَابِۖ","وَلَقَدَ اَرْسَلْنَا مُوس۪ىٰ بِـَٔايَٰتِنَا وَسُلْطَٰنٖ مُّبِينٍ","اِلَىٰ فِرْعَوْنَ وَهَامَٰنَ وَقَارُونَ فَقَالُواْ سَٰحِرٞ كَذَّابٞۖ","فَلَمَّا جَآءَهُم بِالْحَقِّ مِنْ عِندِنَا قَالُواْ اُ۟قْتُلُوٓاْ أَبْنَآءَ اَ۬لذِينَ ءَامَنُواْ مَعَهُۥ وَاسْتَحْيُواْ نِسَآءَهُمْۖ وَمَا كَيْدُ اُ۬لْكٰ۪فِرِينَ إِلَّا فِے ضَلَٰلٖۖ","وَقَالَ فِرْعَوْنُ ذَرُونِےٓ أَقْتُلْ مُوس۪ىٰ وَلْيَدْعُ رَبَّهُۥٓ إِنِّيَ أَخَافُ أَنْ يُّبَدِّلَ دِينَكُمْ وَأَنْ يُّظْهِرَ فِے اِ۬لَارْضِ اِ۬لْفَسَادَۖ","وَقَالَ مُوس۪ىٰٓ إِنِّے عُذْتُ بِرَبِّے وَرَبِّكُم مِّن كُلِّ مُتَكَبِّرٖ لَّا يُومِنُ بِيَوْمِ اِ۬لْحِسَابِۖ","وَقَالَ رَجُلٞ مُّومِنٞ مِّنَ اٰلِ فِرْعَوْنَ يَكْتُمُ إِيمَٰنَهُۥٓ أَتَقْتُلُونَ رَجُلاً اَنْ يَّقُولَ رَبِّيَ اَ۬للَّهُ وَقَدْ جَآءَكُم بِالْبَيِّنَٰتِ مِن رَّبِّكُمْ وَإِنْ يَّكُ كَٰذِباٗ فَعَلَيْهِ كَذِبُهُۥ وَإِنْ يَّكُ صَادِقاٗ يُصِبْكُم بَعْضُ اُ۬لذِے يَعِدُكُمُۥٓۖ إِنَّ اَ۬للَّهَ لَا يَهْدِے مَنْ هُوَ مُسْرِفٞ كَذَّابٞۖ","يَٰقَوْمِ لَكُمُ اُ۬لْمُلْكُ اُ۬لْيَوْمَ ظَٰهِرِينَ فِے اِ۬لَارْضِ فَمَنْ يَّنصُرُنَا مِنۢ بَأْسِ اِ۬للَّهِ إِن جَآءَنَاۖ قَالَ فِرْعَوْنُ مَآ أُرِيكُمُۥٓ إِلَّا مَآ أَر۪ىٰ وَمَآ أَهْدِيكُمُۥٓ إِلَّا سَبِيلَ اَ۬لرَّشَادِۖ","۞ وَقَالَ اَ۬لذِےٓ ءَامَنَ يَٰقَوْمِ إِنِّيَ أَخَافُ عَلَيْكُم مِّثْلَ يَوْمِ اِ۬لَاحْزَابِ","مِثْلَ دَأْبِ قَوْمِ نُوحٖ وَعَادٖ وَثَمُودَ وَالذِينَ مِنۢ بَعْدِهِمْۖ وَمَا اَ۬للَّهُ يُرِيدُ ظُلْماٗ لِّلْعِبَادِۖ","وَيَٰقَوْمِ إِنِّيَ أَخَافُ عَلَيْكُمْ يَوْمَ اَ۬لتَّنَادِۦ","يَوْمَ تُوَلُّونَ مُدْبِرِينَ مَا لَكُم مِّنَ اَ۬للَّهِ مِنْ عَٰصِمٖۖ وَمَنْ يُّضْلِلِ اِ۬للَّهُ فَمَا لَهُۥ مِنْ هَادٖۖ","وَلَقَدْ جَآءَكُمْ يُوسُفُ مِن قَبْلُ بِالْبَيِّنَٰتِ فَمَا زِلْتُمْ فِے شَكّٖ مِّمَّا جَآءَكُم بِهِۦ حَتَّىٰٓ إِذَا هَلَكَ قُلْتُمْ لَنْ يَّبْعَثَ اَ۬للَّهُ مِنۢ بَعْدِهِۦ رَسُولاٗۖ كَذَٰلِكَ يُضِلُّ اُ۬للَّهُ مَنْ هُوَ مُسْرِفٞ مُّرْتَابٌۖ","اِ۬لذِينَ يُجَٰدِلُونَ فِےٓ ءَايَٰتِ اِ۬للَّهِ بِغَيْرِ سُلْطَٰنٍ اَت۪يٰهُمْۖ كَبُرَ مَقْتاً عِندَ اَ۬للَّهِ وَعِندَ اَ۬لذِينَ ءَامَنُواْۖ كَذَٰلِكَ يَطْبَعُ اُ۬للَّهُ عَلَىٰ كُلِّ قَلْبِ مُتَكَبِّرٖ جَبّ۪ارٖۖ","وَقَالَ فِرْعَوْنُ يَٰهَامَٰنُ اُ۪بْنِ لِے صَرْحاٗ لَّعَلِّيَ أَبْلُغُ اُ۬لَاسْبَٰبَ","أَسْبَٰبَ اَ۬لسَّمَٰوَٰتِ فَأَطَّلِعُ إِلَىٰٓ إِلَٰهِ مُوس۪ىٰ وَإِنِّے لَأَظُنُّهُۥ كَٰذِباٗۖ وَكَذَٰلِكَ زُيِّنَ لِفِرْعَوْنَ سُوٓءُ عَمَلِهِۦ وَصَدَّ عَنِ اِ۬لسَّبِيلِۖ وَمَا كَيْدُ فِرْعَوْنَ إِلَّا فِے تَبَابٖۖ","وَقَالَ اَ۬لذِےٓ ءَامَنَ يَٰقَوْمِ اِ۪تَّبِعُونِ أَهْدِكُمْ سَبِيلَ اَ۬لرَّشَادِۖ","يَٰقَوْمِ إِنَّمَا هَٰذِهِ اِ۬لْحَيَوٰةُ اُ۬لدُّنْي۪ا مَتَٰعٞۖ وَإِنَّ اَ۬لَاخِرَةَ هِيَ دَارُ اُ۬لْقَر۪ارِۖ","مَنْ عَمِلَ سَيِّئَةٗ فَلَا يُجْز۪ىٰٓ إِلَّا مِثْلَهَاۖ وَمَنْ عَمِلَ صَٰلِحاٗ مِّن ذَكَرٍ اَوُ ا۟نث۪ىٰ وَهُوَ مُومِنٞ فَأُوْلَٰٓئِكَ يَدْخُلُونَ اَ۬لْجَنَّةَ يُرْزَقُونَ فِيهَا بِغَيْرِ حِسَابٖۖ","۞ وَيَٰقَوْمِ مَا لِيَ أَدْعُوكُمُۥٓ إِلَى اَ۬لنَّجَوٰةِ وَتَدْعُونَنِےٓ إِلَى اَ۬لنّ۪ارِۖ","تَدْعُونَنِے لِأَكْفُرَ بِاللَّهِ وَأُشْرِكَ بِهِۦ مَا لَيْسَ لِے بِهِۦ عِلْمٞ وَأَنَآ أَدْعُوكُمُۥٓ إِلَى اَ۬لْعَزِيزِ اِ۬لْغَفّٰ۪رِۖ","لَا جَرَمَ أَنَّمَا تَدْعُونَنِےٓ إِلَيْهِ لَيْسَ لَهُۥ دَعْوَةٞ فِے اِ۬لدُّنْي۪ا وَلَا فِے اِ۬لَاخِرَةِ وَأَنَّ مَرَدَّنَآ إِلَى اَ۬للَّهِ وَأَنَّ اَ۬لْمُسْرِفِينَ هُمُۥٓ أَصْحَٰبُ اُ۬لنّ۪ارِۖ","فَسَتَذْكُرُونَ مَآ أَقُولُ لَكُمْۖ وَأُفَوِّضُ أَمْرِيَ إِلَى اَ۬للَّهِۖ إِنَّ اَ۬للَّهَ بَصِيرُۢ بِالْعِبَادِۖ","فَوَق۪يٰهُ اُ۬للَّهُ سَيِّـَٔاتِ مَا مَكَرُواْۖ وَحَاقَ بِـَٔالِ فِرْعَوْنَ سُوٓءُ اُ۬لْعَذَابِۖ","اِ۬لنَّارُ يُعْرَضُونَ عَلَيْهَا غُدُوّاٗ وَعَشِيّاٗۖ وَيَوْمَ تَقُومُ اُ۬لسَّاعَةُ أَدْخِلُوٓاْ ءَالَ فِرْعَوْنَ أَشَدَّ اَ۬لْعَذَابِۖ","وَإِذْ يَتَحَآجُّونَ فِے اِ۬لنّ۪ارِ فَيَقُولُ اُ۬لضُّعَفَٰٓؤُاْ لِلذِينَ اَ۪سْتَكْبَرُوٓاْ إِنَّا كُنَّا لَكُمْ تَبَعاٗ فَهَلَ اَنتُم مُّغْنُونَ عَنَّا نَصِيباٗ مِّنَ اَ۬لنّ۪ارِۖ","قَالَ اَ۬لذِينَ اَ۪سْتَكْبَرُوٓاْ إِنَّا كُلّٞ فِيهَآ إِنَّ اَ۬للَّهَ قَدْ حَكَمَ بَيْنَ اَ۬لْعِبَادِۖ","وَقَالَ اَ۬لذِينَ فِے اِ۬لنّ۪ارِ لِخَزَنَةِ جَهَنَّمَ اَ۟دْعُواْ رَبَّكُمْ يُخَفِّفْ عَنَّا يَوْماٗ مِّنَ اَ۬لْعَذَابِۖ","قَالُوٓاْ أَوَلَمْ تَكُ تَاتِيكُمْ رُسُلُكُم بِالْبَيِّنَٰتِ قَالُواْ بَل۪ىٰ قَالُواْ فَادْعُواْۖ وَمَا دُعَٰٓؤُاْ اُ۬لْكٰ۪فِرِينَ إِلَّا فِے ضَلَٰلٍۖ","اِنَّا لَنَنصُرُ رُسُلَنَا وَالذِينَ ءَامَنُواْ فِے اِ۬لْحَيَوٰةِ اِ۬لدُّنْي۪ا وَيَوْمَ يَقُومُ اُ۬لَاشْهَٰدُ","يَوْمَ لَا يَنفَعُ اُ۬لظَّٰلِمِينَ مَعْذِرَتُهُمْ وَلَهُمُ اُ۬للَّعْنَةُ وَلَهُمْ سُوٓءُ اُ۬لدّ۪ارِۖ","۞ وَلَقَدَ اٰتَيْنَا مُوسَى اَ۬لْهُد۪ىٰ وَأَوْرَثْنَا بَنِےٓ إِسْرَآءِيلَ اَ۬لْكِتَٰبَ هُدىٗ وَذِكْر۪ىٰ لِأُوْلِے اِ۬لَالْبَٰبِۖ","فَاصْبِرِ اِنَّ وَعْدَ اَ۬للَّهِ حَقّٞۖ وَاسْتَغْفِرْ لِذَنۢبِكَ وَسَبِّحْ بِحَمْدِ رَبِّكَ بِالْعَشِيِّ وَالِابْكٰ۪رِۖ","إِنَّ اَ۬لذِينَ يُجَٰدِلُونَ فِےٓ ءَايَٰتِ اِ۬للَّهِ بِغَيْرِ سُلْطَٰنٍ اَت۪يٰهُمُۥٓ إِن فِے صُدُورِهِمُۥٓ إِلَّا كِبْرٞ مَّا هُم بِبَٰلِغِيهِۖ فَاسْتَعِذْ بِاللَّهِۖ إِنَّهُۥ هُوَ اَ۬لسَّمِيعُ اُ۬لْبَصِيرُۖ","لَخَلْقُ اُ۬لسَّمَٰوَٰتِ وَالَارْضِ أَكْبَرُ مِنْ خَلْقِ اِ۬لنَّاسِۖ وَلَٰكِنَّ أَكْثَرَ اَ۬لنَّاسِ لَا يَعْلَمُونَۖ","وَمَا يَسْتَوِے اِ۬لَاعْم۪ىٰ وَالْبَصِيرُ","وَالذِينَ ءَامَنُواْ وَعَمِلُواْ اُ۬لصَّٰلِحَٰتِ وَلَا اَ۬لْمُسِےٓءُۖ قَلِيلاٗ مَّا يَتَذَكَّرُونَۖ","إِنَّ اَ۬لسَّاعَةَ لَأٓتِيَةٞ لَّا رَيْبَ فِيهَاۖ وَلَٰكِنَّ أَكْثَرَ اَ۬لنَّاسِ لَا يُومِنُونَۖ","وَقَالَ رَبُّكُمُ اُ۟دْعُونِےٓ أَسْتَجِبْ لَكُمُۥٓۖ إِنَّ اَ۬لذِينَ يَسْتَكْبِرُونَ عَنْ عِبَادَتِے سَيَدْخُلُونَ جَهَنَّمَ دَاخِرِينَۖ","اَ۬للَّهُ اُ۬لذِے جَعَلَ لَكُمُ اُ۬ليْلَ لِتَسْكُنُواْ فِيهِ وَالنَّهَارَ مُبْصِراًۖ اِنَّ اَ۬للَّهَ لَذُو فَضْلٍ عَلَى اَ۬لنَّاسِۖ وَلَٰكِنَّ أَكْثَرَ اَ۬لنَّاسِ لَا يَشْكُرُونَۖ","ذَٰلِكُمُ اُ۬للَّهُ رَبُّكُمْۖ خَٰلِقُ كُلِّ شَےْءٖۖ لَّآ إِلَٰهَ إِلَّا هُوَۖ فَأَنّ۪ىٰ تُوفَكُونَۖ","كَذَٰلِكَ يُوفَكُ اُ۬لذِينَ كَانُواْ بِـَٔايَٰتِ اِ۬للَّهِ يَجْحَدُونَۖ","اَ۬للَّهُ اُ۬لذِے جَعَلَ لَكُمُ اُ۬لَارْضَ قَرَاراٗ وَالسَّمَآءَ بِنَآءٗ وَصَوَّرَكُمْ فَأَحْسَنَ صُوَرَكُمْ وَرَزَقَكُم مِّنَ اَ۬لطَّيِّبَٰتِۖ ذَٰلِكُمُ اُ۬للَّهُ رَبُّكُمْۖ فَتَبَٰرَكَ اَ۬للَّهُ رَبُّ اُ۬لْعَٰلَمِينَۖ","هُوَ اَ۬لْحَيُّۖ لَآ إِلَٰهَ إِلَّا هُوَۖ فَادْعُوهُ مُخْلِصِينَ لَهُ اُ۬لدِّينَۖ اَ۬لْحَمْدُ لِلهِ رَبِّ اِ۬لْعَٰلَمِينَۖ","۞ قُلِ اِنِّے نُهِيتُ أَنَ اَعْبُدَ اَ۬لذِينَ تَدْعُونَ مِن دُونِ اِ۬للَّهِ لَمَّا جَآءَنِيَ اَ۬لْبَيِّنَٰتُ مِن رَّبِّے وَأُمِرْتُ أَنُ ا۟سْلِمَ لِرَبِّ اِ۬لْعَٰلَمِينَۖ","هُوَ اَ۬لذِے خَلَقَكُم مِّن تُرَابٖ ثُمَّ مِن نُّطْفَةٖ ثُمَّ مِنْ عَلَقَةٖ ثُمَّ يُخْرِجُكُمْ طِفْلاٗ ثُمَّ لِتَبْلُغُوٓاْ أَشُدَّكُمْ ثُمَّ لِتَكُونُواْ شُيُوخاٗۖ وَمِنكُم مَّنْ يُّتَوَفّ۪ىٰ مِن قَبْلُ وَلِتَبْلُغُوٓاْ أَجَلاٗ مُّسَمّىٗ وَلَعَلَّكُمْ تَعْقِلُونَۖ","هُوَ اَ۬لذِے يُحْيِۦ وَيُمِيتُۖ فَإِذَا قَض۪ىٰٓ أَمْراٗ فَإِنَّمَا يَقُولُ لَهُۥ كُنۖ فَيَكُونُۖ","أَلَمْ تَرَ إِلَى اَ۬لذِينَ يُجَٰدِلُونَ فِےٓ ءَايَٰتِ اِ۬للَّهِ أَنّ۪ىٰ يُصْرَفُونَۖ","اَ۬لذِينَ كَذَّبُواْ بِالْكِتَٰبِ وَبِمَآ أَرْسَلْنَا بِهِۦ رُسُلَنَا فَسَوْفَ يَعْلَمُونَ","إِذِ اِ۬لَاغْلَٰلُ فِےٓ أَعْنَٰقِهِمْ وَالسَّلَٰسِلُۖ يُسْحَبُونَ","فِے اِ۬لْحَمِيمِ ثُمَّ فِے اِ۬لنّ۪ارِ يُسْجَرُونَۖ","ثُمَّ قِيلَ لَهُمُۥٓ أَيْنَ مَا كُنتُمْ تُشْرِكُونَ مِن دُونِ اِ۬للَّهِۖ قَالُواْ ضَلُّواْ عَنَّا بَل لَّمْ نَكُن نَّدْعُواْ مِن قَبْلُ شَئْاٗۖ كَذَٰلِكَ يُضِلُّ اُ۬للَّهُ اُ۬لْكٰ۪فِرِينَۖ","ذَٰلِكُم بِمَا كُنتُمْ تَفْرَحُونَ فِے اِ۬لَارْضِ بِغَيْرِ اِ۬لْحَقِّ وَبِمَا كُنتُمْ تَمْرَحُونَۖ","اَ۟دْخُلُوٓاْ أَبْوَٰبَ جَهَنَّمَ خَٰلِدِينَ فِيهَاۖ فَبِيسَ مَثْوَى اَ۬لْمُتَكَبِّرِينَۖ","فَاصْبِرِ اِنَّ وَعْدَ اَ۬للَّهِ حَقّٞۖ فَإِمَّا نُرِيَنَّكَ بَعْضَ اَ۬لذِے نَعِدُهُمُۥٓ أَوْ نَتَوَفَّيَنَّكَ فَإِلَيْنَا يُرْجَعُونَۖ","وَلَقَدَ اَرْسَلْنَا رُسُلاٗ مِّن قَبْلِكَ مِنْهُم مَّن قَصَصْنَا عَلَيْكَ وَمِنْهُم مَّن لَّمْ نَقْصُصْ عَلَيْكَۖ وَمَا كَانَ لِرَسُولٍ اَنْ يَّاتِيَ بِـَٔايَةٍ اِلَّا بِإِذْنِ اِ۬للَّهِۖ فَإِذَا جَآءَ امْرُ اُ۬للَّهِ قُضِيَ بِالْحَقِّ وَخَسِرَ هُنَالِكَ اَ۬لْمُبْطِلُونَۖ","۞ اَ۬للَّهُ اُ۬لذِے جَعَلَ لَكُمُ اُ۬لَانْعَٰمَ لِتَرْكَبُواْ مِنْهَا وَمِنْهَا تَاكُلُونَۖ","وَلَكُمْ فِيهَا مَنَٰفِعُۖ وَلِتَبْلُغُواْ عَلَيْهَا حَاجَةٗ فِے صُدُورِكُمْۖ وَعَلَيْهَا وَعَلَى اَ۬لْفُلْكِ تُحْمَلُونَۖ","وَيُرِيكُمُۥٓ ءَايَٰتِهِۦۖ فَأَيَّ ءَايَٰتِ اِ۬للَّهِ تُنكِرُونَۖ","أَفَلَمْ يَسِيرُواْ فِے اِ۬لَارْضِ فَيَنظُرُواْ كَيْفَ كَانَ عَٰقِبَةُ اُ۬لذِينَ مِن قَبْلِهِمْۖ كَانُوٓاْ أَكْثَرَ مِنْهُمْ وَأَشَدَّ قُوَّةٗ وَءَاثَاراٗ فِے اِ۬لَارْضِ فَمَآ أَغْن۪ىٰ عَنْهُم مَّا كَانُواْ يَكْسِبُونَۖ","فَلَمَّا جَآءَتْهُمْ رُسُلُهُم بِالْبَيِّنَٰتِ فَرِحُواْ بِمَا عِندَهُم مِّنَ اَ۬لْعِلْمِۖ وَحَاقَ بِهِم مَّا كَانُواْ بِهِۦ يَسْتَهْزِءُونَۖ","فَلَمَّا رَأَوْاْ بَأْسَنَا قَالُوٓاْ ءَامَنَّا بِاللَّهِ وَحْدَهُۥ وَكَفَرْنَا بِمَا كُنَّا بِهِۦ مُشْرِكِينَۖ","فَلَمْ يَكُ يَنفَعُهُمُۥٓ إِيمَٰنُهُمْ لَمَّا رَأَوْاْ بَأْسَنَاۖ سُنَّتَ اَ۬للَّهِ اِ۬لتِے قَدْ خَلَتْ فِے عِبَادِهِۦۖ وَخَسِرَ هُنَالِكَ اَ۬لْكَٰفِرُونَۖ"]],["فصلت",["ح۪مِٓۖ تَنزِيلٞ مِّنَ اَ۬لرَّحْمَٰنِ اِ۬لرَّحِيمِ","كِتَٰبٞ فُصِّلَتَ اٰيَٰتُهُۥ قُرْءَاناً عَرَبِيّاٗ لِّقَوْمٖ يَعْلَمُونَ","بَشِيراٗ وَنَذِيراٗۖ فَأَعْرَضَ أَكْثَرُهُمْ فَهُمْ لَا يَسْمَعُونَۖ","وَقَالُواْ قُلُوبُنَا فِےٓ أَكِنَّةٖ مِّمَّا تَدْعُونَآ إِلَيْهِ وَفِےٓ ءَاذَانِنَا وَقْرٞ وَمِنۢ بَيْنِنَا وَبَيْنِكَ حِجَابٞ فَاعْمَلِ اِنَّنَا عَٰمِلُونَۖ","قُلِ اِنَّمَآ أَنَا بَشَرٞ مِّثْلُكُمْ يُوح۪ىٰٓ إِلَيَّ أَنَّمَآ إِلَٰهُكُمُۥٓ إِلَٰهٞ وَٰحِدٞ فَاسْتَقِيمُوٓاْ إِلَيْهِ وَاسْتَغْفِرُوهُۖ وَوَيْلٞ لِّلْمُشْرِكِينَ","اَ۬لذِينَ لَا يُوتُونَ اَ۬لزَّكَوٰةَ وَهُم بِالَاخِرَةِ هُمْ كَٰفِرُونَۖ","إِنَّ اَ۬لذِينَ ءَامَنُواْ وَعَمِلُواْ اُ۬لصَّٰلِحَٰتِ لَهُمُۥٓ أَجْرٌ غَيْرُ مَمْنُونٖۖ","۞ قُلَ اَئِنَّكُمْ لَتَكْفُرُونَ بِالذِے خَلَقَ اَ۬لَارْضَ فِے يَوْمَيْنِ وَتَجْعَلُونَ لَهُۥٓ أَندَاداٗۖ ذَٰلِكَ رَبُّ اُ۬لْعَٰلَمِينَۖ","وَجَعَلَ فِيهَا رَوَٰسِيَ مِن فَوْقِهَا وَبَٰرَكَ فِيهَا وَقَدَّرَ فِيهَآ أَقْوَٰتَهَا فِےٓ أَرْبَعَةِ أَيَّامٖ سَوَآءٗ لِّلسَّآئِلِينَۖ","ثُمَّ اَ۪سْتَو۪ىٰٓ إِلَى اَ۬لسَّمَآءِ وَهِيَ دُخَانٞ فَقَالَ لَهَا وَلِلَارْضِ اِ۪يتِيَا طَوْعاً اَوْ كَرْهاٗۖ قَالَتَآ أَتَيْنَا طَآئِعِينَۖ","فَقَض۪يٰهُنَّ سَبْعَ سَمَٰوَاتٖ فِے يَوْمَيْنِ وَأَوْح۪ىٰ فِے كُلِّ سَمَآءٍ اَمْرَهَاۖ وَزَيَّنَّا اَ۬لسَّمَآءَ اَ۬لدُّنْي۪ا بِمَصَٰبِيحَۖ وَحِفْظاٗۖ ذَٰلِكَ تَقْدِيرُ اُ۬لْعَزِيزِ اِ۬لْعَلِيمِۖ","فَإِنَ اَعْرَضُواْ فَقُلَ اَنذَرْتُكُمْ صَٰعِقَةٗ مِّثْلَ صَٰعِقَةِ عَادٖ وَثَمُودَ","إِذْ جَآءَتْهُمُ اُ۬لرُّسُلُ مِنۢ بَيْنِ أَيْدِيهِمْ وَمِنْ خَلْفِهِمُۥٓ أَلَّا تَعْبُدُوٓاْ إِلَّا اَ۬للَّهَۖ قَالُواْ لَوْ شَآءَ رَبُّنَا لَأَنزَلَ مَلَٰٓئِكَةٗ فَإِنَّا بِمَآ أُرْسِلْتُم بِهِۦ كَٰفِرُونَۖ","فَأَمَّا عَادٞ فَاسْتَكْبَرُواْ فِے اِ۬لَارْضِ بِغَيْرِ اِ۬لْحَقِّ وَقَالُواْ مَنَ اَشَدُّ مِنَّا قُوَّةًۖ اَوَلَمْ يَرَوَاْ اَنَّ اَ۬للَّهَ اَ۬لذِے خَلَقَهُمْ هُوَ أَشَدُّ مِنْهُمْ قُوَّةٗۖ وَكَانُواْ بِـَٔايَٰتِنَا يَجْحَدُونَۖ","فَأَرْسَلْنَا عَلَيْهِمْ رِيحاٗ صَرْصَراٗ فِےٓ أَيَّامٖ نَّحْسَاتٖ لِّنُذِيقَهُمْ عَذَابَ اَ۬لْخِزْيِ فِے اِ۬لْحَيَوٰةِ اِ۬لدُّنْي۪اۖ وَلَعَذَابُ اُ۬لَاخِرَةِ أَخْز۪ىٰ وَهُمْ لَا يُنصَرُونَۖ","۞ وَأَمَّا ثَمُودُ فَهَدَيْنَٰهُمْ فَاسْتَحَبُّواْ اُ۬لْعَم۪ىٰ عَلَى اَ۬لْهُد۪ىٰ فَأَخَذَتْهُمْ صَٰعِقَةُ اُ۬لْعَذَابِ اِ۬لْهُونِ بِمَا كَانُواْ يَكْسِبُونَۖ","وَنَجَّيْنَا اَ۬لذِينَ ءَامَنُواْ وَكَانُواْ يَتَّقُونَۖ","وَيَوْمَ نَحْشُرُ أَعْدَآءَ اَ۬للَّهِ إِلَى اَ۬لنّ۪ارِ فَهُمْ يُوزَعُونَۖ","حَتَّىٰٓ إِذَا مَا جَآءُوهَا شَهِدَ عَلَيْهِمْ سَمْعُهُمْ وَأَبْصَٰرُهُمْ وَجُلُودُهُم بِمَا كَانُواْ يَعْمَلُونَۖ","وَقَالُواْ لِجُلُودِهِمْ لِمَ شَهِدتُّمْ عَلَيْنَاۖ قَالُوٓاْ أَنطَقَنَا اَ۬للَّهُ اُ۬لذِےٓ أَنطَقَ كُلَّ شَےْءٖۖ وَهُوَ خَلَقَكُمُۥٓ أَوَّلَ مَرَّةٖ وَإِلَيْهِ تُرْجَعُونَۖ","وَمَا كُنتُمْ تَسْتَتِرُونَ أَنْ يَّشْهَدَ عَلَيْكُمْ سَمْعُكُمْ وَلَآ أَبْصَٰرُكُمْ وَلَا جُلُودُكُمْۖ وَلَٰكِن ظَنَنتُمُۥٓ أَنَّ اَ۬للَّهَ لَا يَعْلَمُ كَثِيراٗ مِّمَّا تَعْمَلُونَۖ","وَذَٰلِكُمْ ظَنُّكُمُ اُ۬لذِے ظَنَنتُم بِرَبِّكُمُۥٓ أَرْد۪يٰكُمْ فَأَصْبَحْتُم مِّنَ اَ۬لْخَٰسِرِينَۖ","فَإِنْ يَّصْبِرُواْ فَالنَّارُ مَثْوىٗ لَّهُمْۖ وَإِنْ يَّسْتَعْتِبُواْ فَمَا هُم مِّنَ اَ۬لْمُعْتَبِينَۖ","۞ وَقَيَّضْنَا لَهُمْ قُرَنَآءَ فَزَيَّنُواْ لَهُم مَّا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْۖ وَحَقَّ عَلَيْهِمُ اُ۬لْقَوْلُ فِےٓ أُمَمٖ قَدْ خَلَتْ مِن قَبْلِهِم مِّنَ اَ۬لْجِنِّ وَالِانسِۖ إِنَّهُمْ كَانُواْ خَٰسِرِينَۖ","وَقَالَ اَ۬لذِينَ كَفَرُواْ لَا تَسْمَعُواْ لِهَٰذَا اَ۬لْقُرْءَانِ وَالْغَوْاْ فِيهِ لَعَلَّكُمْ تَغْلِبُونَۖ","فَلَنُذِيقَنَّ اَ۬لذِينَ كَفَرُواْ عَذَاباٗ شَدِيداٗ وَلَنَجْزِيَنَّهُمُۥٓ أَسْوَأَ اَ۬لذِے كَانُواْ يَعْمَلُونَۖ","ذَٰلِكَ جَزَآءُ اَ۬عْدَآءِ اِ۬للَّهِ اِ۬لنَّارُۖ لَهُمْ فِيهَا دَارُ اُ۬لْخُلْدِۖ جَزَآءَۢ بِمَا كَانُواْ بِـَٔايَٰتِنَا يَجْحَدُونَۖ","وَقَالَ اَ۬لذِينَ كَفَرُواْ رَبَّنَآ أَرِنَا اَ۬لذَيْنِ أَضَلَّٰنَا مِنَ اَ۬لْجِنِّ وَالِانسِ نَجْعَلْهُمَا تَحْتَ أَقْدَامِنَا لِيَكُونَا مِنَ اَ۬لَاسْفَلِينَۖ","إِنَّ اَ۬لذِينَ قَالُواْ رَبُّنَا اَ۬للَّهُ ثُمَّ اَ۪سْتَقَٰمُواْ تَتَنَزَّلُ عَلَيْهِمُ اُ۬لْمَلَٰٓئِكَةُ أَلَّا تَخَافُواْ وَلَا تَحْزَنُواْ وَأَبْشِرُواْ بِالْجَنَّةِ اِ۬لتِے كُنتُمْ تُوعَدُونَۖ","نَحْنُ أَوْلِيَآؤُكُمْ فِے اِ۬لْحَيَوٰةِ اِ۬لدُّنْي۪ا وَفِے اِ۬لَاخِرَةِۖ وَلَكُمْ فِيهَا مَا تَشْتَهِےٓ أَنفُسُكُمْ وَلَكُمْ فِيهَا مَا تَدَّعُونَ","نُزُلاٗ مِّنْ غَفُورٖ رَّحِيمٖۖ","وَمَنَ اَحْسَنُ قَوْلاٗ مِّمَّن دَعَآ إِلَى اَ۬للَّهِ وَعَمِلَ صَٰلِحاٗ وَقَالَ إِنَّنِے مِنَ اَ۬لْمُسْلِمِينَۖ","وَلَا تَسْتَوِے اِ۬لْحَسَنَةُ وَلَا اَ۬لسَّيِّئَةُۖ اُ۪دْفَعْ بِالتِے هِيَ أَحْسَنُ فَإِذَا اَ۬لذِے بَيْنَكَ وَبَيْنَهُۥ عَدَٰوَةٞ كَأَنَّهُۥ وَلِيٌّ حَمِيمٞۖ","وَمَا يُلَقّ۪يٰهَآ إِلَّا اَ۬لذِينَ صَبَرُواْۖ وَمَا يُلَقّ۪يٰهَآ إِلَّا ذُو حَظٍّ عَظِيمٖۖ","وَإِمَّا يَنزَغَنَّكَ مِنَ اَ۬لشَّيْطَٰنِ نَزْغٞ فَاسْتَعِذْ بِاللَّهِۖ إِنَّهُۥ هُوَ اَ۬لسَّمِيعُ اُ۬لْعَلِيمُۖ","وَمِنَ اٰيَٰتِهِ اِ۬ليْلُ وَالنَّهَارُ وَالشَّمْسُ وَالْقَمَرُۖ لَا تَسْجُدُواْ لِلشَّمْسِ وَلَا لِلْقَمَرِۖ وَاسْجُدُواْ لِلهِ اِ۬لذِے خَلَقَهُنَّ إِن كُنتُمُۥٓ إِيَّاهُ تَعْبُدُونَۖ۩","۞ فَإِنِ اِ۪سْتَكْبَرُواْ فَالذِينَ عِندَ رَبِّكَ يُسَبِّحُونَ لَهُۥ بِاليْلِ وَالنَّه۪ارِ وَهُمْ لَا يَسْـَٔمُونَۖ","وَمِنَ اٰيَٰتِهِۦٓ أَنَّكَ تَرَى اَ۬لَارْضَ خَٰشِعَةٗ فَإِذَآ أَنزَلْنَا عَلَيْهَا اَ۬لْمَآءَ اَ۪هْتَزَّتْ وَرَبَتِۖ اِنَّ اَ۬لذِےٓ أَحْي۪اهَا لَمُحْيِ اِ۬لْمَوْت۪ىٰٓۖ إِنَّهُۥ عَلَىٰ كُلِّ شَےْءٖ قَدِيرٌۖ","اِنَّ اَ۬لذِينَ يُلْحِدُونَ فِےٓ ءَايَٰتِنَا لَا يَخْفَوْنَ عَلَيْنَآۖ أَفَمَنْ يُّلْق۪ىٰ فِے اِ۬لنّ۪ارِ خَيْرٌ اَم مَّنْ يَّاتِےٓ ءَامِناٗ يَوْمَ اَ۬لْقِيَٰمَةِۖ اِ۪عْمَلُواْ مَا شِئْتُمُۥٓۖ إِنَّهُۥ بِمَا تَعْمَلُونَ بَصِيرٌۖ","اِنَّ اَ۬لذِينَ كَفَرُواْ بِالذِّكْرِ لَمَّا جَآءَهُمْ وَإِنَّهُۥ لَكِتَٰبٌ عَزِيزٞ","لَّا يَاتِيهِ اِ۬لْبَٰطِلُ مِنۢ بَيْنِ يَدَيْهِ وَلَا مِنْ خَلْفِهِۦۖ تَنزِيلٞ مِّنْ حَكِيمٍ حَمِيدٖۖ","مَّا يُقَالُ لَكَ إِلَّا مَا قَدْ قِيلَ لِلرُّسُلِ مِن قَبْلِكَۖ إِنَّ رَبَّكَ لَذُو مَغْفِرَةٖ وَذُو عِقَابٍ اَلِيمٖۖ","وَلَوْ جَعَلْنَٰهُ قُرْءَاناً اَعْجَمِيّاٗ لَّقَالُواْ لَوْلَا فُصِّلَتَ اٰيَٰتُهُۥٓۖ ءَآعْجَمِيّٞ وَعَرَبِيّٞۖ قُلْ هُوَ لِلذِينَ ءَامَنُواْ هُدىٗ وَشِفَآءٞۖ وَالذِينَ لَا يُومِنُونَ فِےٓ ءَاذَانِهِمْ وَقْرٞ وَهُوَ عَلَيْهِمْ عَمىًۖ ا۟وْلَٰٓئِكَ يُنَادَوْنَ مِن مَّكَانِۢ بَعِيدٖۖ","وَلَقَدَ اٰتَيْنَا مُوسَى اَ۬لْكِتَٰبَ فَاخْتُلِفَ فِيهِۖ وَلَوْلَا كَلِمَةٞ سَبَقَتْ مِن رَّبِّكَ لَقُضِيَ بَيْنَهُمْۖ وَإِنَّهُمْ لَفِے شَكّٖ مِّنْهُ مُرِيبٖۖ","مَّنْ عَمِلَ صَٰلِحاٗ فَلِنَفْسِهِۦۖ وَمَنَ اَسَآءَ فَعَلَيْهَاۖ وَمَا رَبُّكَ بِظَلَّٰمٖ لِّلْعَبِيدِۖ","۞ إِلَيْهِ يُرَدُّ عِلْمُ اُ۬لسَّاعَةِۖ وَمَا تَخْرُجُ مِن ثَمَرَٰتٖ مِّنَ اَكْمَامِهَا وَمَا تَحْمِلُ مِنُ ا۟نث۪ىٰ وَلَا تَضَعُ إِلَّا بِعِلْمِهِۦۖ وَيَوْمَ يُنَادِيهِمُۥٓ أَيْنَ شُرَكَآءِے قَالُوٓاْ ءَاذَنَّٰكَ مَا مِنَّا مِن شَهِيدٖۖ","وَضَلَّ عَنْهُم مَّا كَانُواْ يَدْعُونَ مِن قَبْلُ وَظَنُّواْۖ مَا لَهُم مِّن مَّحِيصٖۖ","لَّا يَسْـَٔمُ اُ۬لِانسَٰنُ مِن دُعَآءِ اِ۬لْخَيْرِۖ وَإِن مَّسَّهُ اُ۬لشَّرُّ فَيَـُٔوسٞ قَنُوطٞۖ","وَلَئِنَ اَذَقْنَٰهُ رَحْمَةٗ مِّنَّا مِنۢ بَعْدِ ضَرَّآءَ مَسَّتْهُ لَيَقُولَنَّ هَٰذَا لِے وَمَآ أَظُنُّ اُ۬لسَّاعَةَ قَآئِمَةٗ وَلَئِن رُّجِعْتُ إِلَىٰ رَبِّيَ إِنَّ لِے عِندَهُۥ لَلْحُسْن۪ىٰۖ فَلَنُنَبِّئَنَّ اَ۬لذِينَ كَفَرُواْ بِمَا عَمِلُواْ وَلَنُذِيقَنَّهُم مِّنْ عَذَابٍ غَلِيظٖۖ","وَإِذَآ أَنْعَمْنَا عَلَى اَ۬لِانسَٰنِ أَعْرَضَ وَنَـ۪ٔابِجَانِبِهِۦۖ وَإِذَا مَسَّهُ اُ۬لشَّرُّ فَذُو دُعَآءٍ عَرِيضٖۖ","قُلَ اَرَٰٓيْتُمُۥٓ إِن كَانَ مِنْ عِندِ اِ۬للَّهِ ثُمَّ كَفَرْتُم بِهِۦ مَنَ اَضَلُّ مِمَّنْ هُوَ فِے شِقَاقِۢ بَعِيدٖۖ","سَنُرِيهِمُۥٓ ءَايَٰتِنَا فِے اِ۬لَافَاقِ وَفِےٓ أَنفُسِهِمْ حَتَّىٰ يَتَبَيَّنَ لَهُمُۥٓ أَنَّهُ اُ۬لْحَقُّۖ أَوَلَمْ يَكْفِ بِرَبِّكَ أَنَّهُۥ عَلَىٰ كُلِّ شَےْءٖ شَهِيدٌۖ","اَلَآ إِنَّهُمْ فِے مِرْيَةٖ مِّن لِّقَآءِ رَبِّهِمُۥٓۖ أَلَآ إِنَّهُۥ بِكُلِّ شَےْءٖ مُّحِيطٌۖ"]],["الشورى",["ح۪مِٓ عَٓسِٓقَٓۖ كَذَٰلِكَ يُوحِےٓ إِلَيْكَ وَإِلَى اَ۬لذِينَ مِن قَبْلِكَ اَ۬للَّهُ اُ۬لْعَزِيزُ اُ۬لْحَكِيمُۖ","لَهُۥ مَا فِے اِ۬لسَّمَٰوَٰتِ وَمَا فِے اِ۬لَارْضِۖ وَهُوَ اَ۬لْعَلِيُّ اُ۬لْعَظِيمُۖ","۞ يَكَادُ اُ۬لسَّمَٰوَٰتُ يَتَفَطَّرْنَ مِن فَوْقِهِنَّۖ وَالْمَلَٰٓئِكَةُ يُسَبِّحُونَ بِحَمْدِ رَبِّهِمْ وَيَسْتَغْفِرُونَ لِمَن فِے اِ۬لَارْضِۖ أَلَآ إِنَّ اَ۬للَّهَ هُوَ اَ۬لْغَفُورُ اُ۬لرَّحِيمُۖ","وَالذِينَ اَ۪تَّخَذُواْ مِن دُونِهِۦٓ أَوْلِيَآءَ اَ۬للَّهُ حَفِيظٌ عَلَيْهِمْۖ وَمَآ أَنتَ عَلَيْهِم بِوَكِيلٖۖ","وَكَذَٰلِكَ أَوْحَيْنَآ إِلَيْكَ قُرْءَاناً عَرَبِيّاٗ لِّتُنذِرَ أُمَّ اَ۬لْقُر۪ىٰ وَمَنْ حَوْلَهَا وَتُنذِرَ يَوْمَ اَ۬لْجَمْعِ لَا رَيْبَ فِيهِۖ فَرِيقٞ فِے اِ۬لْجَنَّةِۖ وَفَرِيقٞ فِے اِ۬لسَّعِيرِۖ","وَلَوْ شَآءَ اَ۬للَّهُ لَجَعَلَهُمُۥٓ أُمَّةٗ وَٰحِدَةٗۖ وَلَٰكِنْ يُّدْخِلُ مَنْ يَّشَآءُ فِے رَحْمَتِهِۦۖ وَالظَّٰلِمُونَ مَا لَهُم مِّنْ وَّلِيّٖ وَلَا نَصِيرٍۖ","اَمِ اِ۪تَّخَذُواْ مِن دُونِهِۦٓ أَوْلِيَآءَۖ فَاللَّهُ هُوَ اَ۬لْوَلِيُّۖ وَهُوَ يُحْيِ اِ۬لْمَوْت۪ىٰۖ وَهُوَ عَلَىٰ كُلِّ شَےْءٖ قَدِيرٞۖ","وَمَا اَ۪خْتَلَفْتُمْ فِيهِ مِن شَےْءٖ فَحُكْمُهُۥٓ إِلَى اَ۬للَّهِۖ ذَٰلِكُمُ اُ۬للَّهُ رَبِّےۖ عَلَيْهِ تَوَكَّلْتُۖ وَإِلَيْهِ أُنِيبُۖ","فَاطِرُ اُ۬لسَّمَٰوَٰتِ وَالَارْضِ جَعَلَ لَكُم مِّنَ اَنفُسِكُمُۥٓ أَزْوَٰجاٗ وَمِنَ اَ۬لَانْعَٰمِ أَزْوَٰجاٗ يَذْرَؤُكُمْ فِيهِۖ لَيْسَ كَمِثْلِهِۦ شَےْءٞۖ وَهُوَ اَ۬لسَّمِيعُ اُ۬لْبَصِيرُۖ","لَهُۥ مَقَالِيدُ اُ۬لسَّمَٰوَٰتِ وَالَارْضِۖ يَبْسُطُ اُ۬لرِّزْقَ لِمَنْ يَّشَآءُ وَيَقْدِرُۖ إِنَّهُۥ بِكُلِّ شَےْءٍ عَلِيمٞۖ","۞ شَرَعَ لَكُم مِّنَ اَ۬لدِّينِ مَا وَصّ۪ىٰ بِهِۦ نُوحاٗ وَالذِےٓ أَوْحَيْنَآ إِلَيْكَ وَمَا وَصَّيْنَا بِهِۦٓ إِبْرَٰهِيمَ وَمُوس۪ىٰ وَعِيس۪ىٰٓ أَنَ اَقِيمُواْ اُ۬لدِّينَ وَلَا تَتَفَرَّقُواْ فِيهِۖ كَبُرَ عَلَى اَ۬لْمُشْرِكِينَ مَا تَدْعُوهُمُۥٓ إِلَيْهِۖ اِ۬للَّهُ يَجْتَبِےٓ إِلَيْهِ مَنْ يَّشَآءُ وَيَهْدِےٓ إِلَيْهِ مَنْ يُّنِيبُۖ","وَمَا تَفَرَّقُوٓاْ إِلَّا مِنۢ بَعْدِ مَا جَآءَهُمُ اُ۬لْعِلْمُۖ بَغْياَۢ بَيْنَهُمْۖ وَلَوْلَا كَلِمَةٞ سَبَقَتْ مِن رَّبِّكَ إِلَىٰٓ أَجَلٖ مُّسَمّىٗ لَّقُضِيَ بَيْنَهُمْۖ وَإِنَّ اَ۬لذِينَ أُورِثُواْ اُ۬لْكِتَٰبَ مِنۢ بَعْدِهِمْ لَفِے شَكّٖ مِّنْهُ مُرِيبٖۖ","فَلِذَٰلِكَ فَادْعُ وَاسْتَقِمْ كَمَآ أُمِرْتَ وَلَا تَتَّبِعَ اَهْوَآءَهُمْۖ وَقُلَ اٰمَنتُ بِمَآ أَنزَلَ اَ۬للَّهُ مِن كِتَٰبٖ وَأُمِرْتُ لِأَعْدِلَ بَيْنَكُمُۖ اُ۬للَّهُ رَبُّنَا وَرَبُّكُمْۖ لَنَآ أَعْمَٰلُنَا وَلَكُمُۥٓ أَعْمَٰلُكُمْۖ لَا حُجَّةَ بَيْنَنَا وَبَيْنَكُمُۖ اُ۬للَّهُ يَجْمَعُ بَيْنَنَاۖ وَإِلَيْهِ اِ۬لْمَصِيرُۖ","وَالذِينَ يُحَآجُّونَ فِے اِ۬للَّهِ مِنۢ بَعْدِ مَا اَ۟سْتُجِيبَ لَهُۥ حُجَّتُهُمْ دَاحِضَةٌ عِندَ رَبِّهِمْ وَعَلَيْهِمْ غَضَبٞۖ وَلَهُمْ عَذَابٞ شَدِيدٌۖ","اِ۬للَّهُ اُ۬لذِےٓ أَنزَلَ اَ۬لْكِتَٰبَ بِالْحَقِّ وَالْمِيزَانَۖ وَمَا يُدْرِيكَ لَعَلَّ اَ۬لسَّاعَةَ قَرِيبٞۖ","يَسْتَعْجِلُ بِهَا اَ۬لذِينَ لَا يُومِنُونَ بِهَاۖ وَالذِينَ ءَامَنُواْ مُشْفِقُونَ مِنْهَا وَيَعْلَمُونَ أَنَّهَا اَ۬لْحَقُّۖ أَلَآ إِنَّ اَ۬لذِينَ يُمَارُونَ فِے اِ۬لسَّاعَةِ لَفِے ضَلَٰلِۢ بَعِيدٍۖ","اِ۬للَّهُ لَطِيفُۢ بِعِبَادِهِۦۖ يَرْزُقُ مَنْ يَّشَآءُۖ وَهُوَ اَ۬لْقَوِيُّ اُ۬لْعَزِيزُۖ","۞ مَن كَانَ يُرِيدُ حَرْثَ اَ۬لَاخِرَةِ نَزِدْ لَهُۥ فِے حَرْثِهِۦۖ وَمَن كَانَ يُرِيدُ حَرْثَ اَ۬لدُّنْي۪ا نُوتِهِۦ مِنْهَاۖ وَمَا لَهُۥ فِے اِ۬لَاخِرَةِ مِن نَّصِيبٍۖ","اَمْ لَهُمْ شُرَكَٰٓؤُاْ شَرَعُواْ لَهُم مِّنَ اَ۬لدِّينِ مَا لَمْ يَاذَنۢ بِهِ اِ۬للَّهُۖ وَلَوْلَا كَلِمَةُ اُ۬لْفَصْلِ لَقُضِيَ بَيْنَهُمْۖ وَإِنَّ اَ۬لظَّٰلِمِينَ لَهُمْ عَذَابٌ اَلِيمٞۖ","تَرَى اَ۬لظَّٰلِمِينَ مُشْفِقِينَ مِمَّا كَسَبُواْ وَهُوَ وَاقِعُۢ بِهِمْۖ وَالذِينَ ءَامَنُواْ وَعَمِلُواْ اُ۬لصَّٰلِحَٰتِ فِے رَوْضَاتِ اِ۬لْجَنَّاتِۖ لَهُم مَّا يَشَآءُونَ عِندَ رَبِّهِمْۖ ذَٰلِكَ هُوَ اَ۬لْفَضْلُ اُ۬لْكَبِيرُۖ","ذَٰلِكَ اَ۬لذِے يُبَشِّرُ اُ۬للَّهُ عِبَادَهُ اُ۬لذِينَ ءَامَنُواْ وَعَمِلُواْ اُ۬لصَّٰلِحَٰتِۖ قُل لَّآ أَسْـَٔلُكُمْ عَلَيْهِ أَجْراً اِلَّا اَ۬لْمَوَدَّةَ فِے اِ۬لْقُرْب۪ىٰۖ وَمَنْ يَّقْتَرِفْ حَسَنَةٗ نَّزِدْ لَهُۥ فِيهَا حُسْناًۖ اِنَّ اَ۬للَّهَ غَفُورٞ شَكُورٌۖ","اَمْ يَقُولُونَ اَ۪فْتَر۪ىٰ عَلَى اَ۬للَّهِ كَذِباٗۖ فَإِنْ يَّشَإِ اِ۬للَّهُ يَخْتِمْ عَلَىٰ قَلْبِكَۖ وَيَمْحُ اُ۬للَّهُ اُ۬لْبَٰطِلَ وَيُحِقُّ اُ۬لْحَقَّ بِكَلِمَٰتِهِۦٓۖ إِنَّهُۥ عَلِيمُۢ بِذَاتِ اِ۬لصُّدُورِۖ","وَهُوَ اَ۬لذِے يَقْبَلُ اُ۬لتَّوْبَةَ عَنْ عِبَادِهِۦ وَيَعْفُواْ عَنِ اِ۬لسَّيِّـَٔاتِ وَيَعْلَمُ مَا يَفْعَلُونَۖ","وَيَسْتَجِيبُ اُ۬لذِينَ ءَامَنُواْ وَعَمِلُواْ اُ۬لصَّٰلِحَٰتِ وَيَزِيدُهُم مِّن فَضْلِهِۦۖ وَالْكَٰفِرُونَ لَهُمْ عَذَابٞ شَدِيدٞۖ","۞ وَلَوْ بَسَطَ اَ۬للَّهُ اُ۬لرِّزْقَ لِعِبَادِهِۦ لَبَغَوْاْ فِے اِ۬لَارْضِۖ وَلَٰكِنْ يُّنَزِّلُ بِقَدَرٖ مَّا يَشَآءُۖ اِ۪نَّهُۥ بِعِبَادِهِۦ خَبِيرُۢ بَصِيرٞۖ","وَهُوَ اَ۬لذِے يُنَزِّلُ اُ۬لْغَيْثَ مِنۢ بَعْدِ مَا قَنَطُواْ وَيَنشُرُ رَحْمَتَهُۥۖ وَهُوَ اَ۬لْوَلِيُّ اُ۬لْحَمِيدُۖ","وَمِنَ اٰيَٰتِهِۦ خَلْقُ اُ۬لسَّمَٰوَٰتِ وَالَارْضِ وَمَا بَثَّ فِيهِمَا مِن دَآبَّةٖۖ وَهُوَ عَلَىٰ جَمْعِهِمُۥٓ إِذَا يَشَآءُ قَدِيرٞۖ","وَمَآ أَصَٰبَكُم مِّن مُّصِيبَةِۢ بِمَا كَسَبَتَ اَيْدِيكُمْ وَيَعْفُواْ عَن كَثِيرٖۖ","وَمَآ أَنتُم بِمُعْجِزِينَ فِے اِ۬لَارْضِۖ وَمَا لَكُم مِّن دُونِ اِ۬للَّهِ مِنْ وَّلِيّٖ وَلَا نَصِيرٖۖ","وَمِنَ اٰيَٰتِهِ اِ۬لْجَوَارِۦ فِے اِ۬لْبَحْرِ كَالَاعْلَٰمِۖ إِنْ يَّشَأْ يُسْكِنِ اِ۬لرِّيَٰحَ فَيَظْلَلْنَ رَوَاكِدَ عَلَىٰ ظَهْرِهِۦٓ إِنَّ فِے ذَٰلِكَ لَأٓيَٰتٖ لِّكُلِّ صَبّ۪ارٖ شَكُورٍ","اَوْ يُوبِقْهُنَّ بِمَا كَسَبُواْ وَيَعْفُ عَن كَثِيرٖۖ","وَيَعْلَمُ اُ۬لذِينَ يُجَٰدِلُونَ فِےٓ ءَايَٰتِنَا مَا لَهُم مِّن مَّحِيصٖۖ","فَمَآ أُوتِيتُم مِّن شَےْءٖ فَمَتَٰعُ اُ۬لْحَيَوٰةِ اِ۬لدُّنْي۪اۖ وَمَا عِندَ اَ۬للَّهِ خَيْرٞ وَأَبْق۪ىٰ لِلذِينَ ءَامَنُواْ وَعَلَىٰ رَبِّهِمْ يَتَوَكَّلُونَۖ","وَالذِينَ يَجْتَنِبُونَ كَبَٰٓئِرَ اَ۬لِاثْمِ وَالْفَوَٰحِشَ وَإِذَا مَا غَضِبُواْ هُمْ يَغْفِرُونَۖ","وَالذِينَ اَ۪سْتَجَابُواْ لِرَبِّهِمْ وَأَقَامُواْ اُ۬لصَّلَوٰةَ وَأَمْرُهُمْ شُور۪ىٰ بَيْنَهُمْ وَمِمَّا رَزَقْنَٰهُمْ يُنفِقُونَۖ","وَالذِينَ إِذَآ أَصَابَهُمُ اُ۬لْبَغْيُ هُمْ يَنتَصِرُونَۖ","وَجَزَٰٓؤُاْ سَيِّئَةٖ سَيِّئَةٞ مِّثْلُهَاۖ فَمَنْ عَفَا وَأَصْلَحَ فَأَجْرُهُۥ عَلَى اَ۬للَّهِۖ إِنَّهُۥ لَا يُحِبُّ اُ۬لظَّٰلِمِينَۖ","وَلَمَنِ اِ۪نتَصَرَ بَعْدَ ظُلْمِهِۦ فَأُوْلَٰٓئِكَ مَا عَلَيْهِم مِّن سَبِيلٍۖ","۞ اِنَّمَا اَ۬لسَّبِيلُ عَلَى اَ۬لذِينَ يَظْلِمُونَ اَ۬لنَّاسَ وَيَبْغُونَ فِے اِ۬لَارْضِ بِغَيْرِ اِ۬لْحَقِّۖ أُوْلَٰٓئِكَ لَهُمْ عَذَابٌ اَلِيمٞۖ","وَلَمَن صَبَرَ وَغَفَرَ إِنَّ ذَٰلِكَ لَمِنْ عَزْمِ اِ۬لُامُورِۖ","وَمَنْ يُّضْلِلِ اِ۬للَّهُ فَمَا لَهُۥ مِنْ وَّلِيّٖ مِّنۢ بَعْدِهِۦۖ وَتَرَى اَ۬لظَّٰلِمِينَ لَمَّا رَأَوُاْ اُ۬لْعَذَابَ يَقُولُونَ هَلِ اِلَىٰ مَرَدّٖ مِّن سَبِيلٖۖ","وَتَر۪يٰهُمْ يُعْرَضُونَ عَلَيْهَا خَٰشِعِينَۖ مِنَ اَ۬لذُّلِّ يَنظُرُونَ مِن طَرْفٍ خَفِيّٖۖ وَقَالَ اَ۬لذِينَ ءَامَنُوٓاْ إِنَّ اَ۬لْخَٰسِرِينَ اَ۬لذِينَ خَسِرُوٓاْ أَنفُسَهُمْ وَأَهْلِيهِمْ يَوْمَ اَ۬لْقِيَٰمَةِۖ أَلَآ إِنَّ اَ۬لظَّٰلِمِينَ فِے عَذَابٖ مُّقِيمٖۖ","وَمَا كَانَ لَهُم مِّنَ اَوْلِيَآءَ يَنصُرُونَهُم مِّن دُونِ اِ۬للَّهِۖ وَمَنْ يُّضْلِلِ اِ۬للَّهُ فَمَا لَهُۥ مِن سَبِيلٍۖ","اِ۪سْتَجِيبُواْ لِرَبِّكُم مِّن قَبْلِ أَنْ يَّاتِيَ يَوْمٞ لَّا مَرَدَّ لَهُۥ مِنَ اَ۬للَّهِۖ مَا لَكُم مِّن مَّلْجَإٖ يَوْمَئِذٖۖ وَمَا لَكُم مِّن نَّكِيرٖۖ","فَإِنَ اَعْرَضُواْ فَمَآ أَرْسَلْنَٰكَ عَلَيْهِمْ حَفِيظاًۖ اِنْ عَلَيْكَ إِلَّا اَ۬لْبَلَٰغُۖ وَإِنَّآ إِذَآ أَذَقْنَا اَ۬لِانسَٰنَ مِنَّا رَحْمَةٗ فَرِحَ بِهَاۖ وَإِن تُصِبْهُمْ سَيِّئَةُۢ بِمَا قَدَّمَتَ اَيْدِيهِمْ فَإِنَّ اَ۬لِانسَٰنَ كَفُورٞۖ","لِّلهِ مُلْكُ اُ۬لسَّمَٰوَٰتِ وَالَارْضِۖ يَخْلُقُ مَا يَشَآءُۖ يَهَبُ لِمَنْ يَّشَآءُ اِ۪نَٰثاٗ وَيَهَبُ لِمَنْ يَّشَآءُ اُ۬لذُّكُورَ","أَوْ يُزَوِّجُهُمْ ذُكْرَاناٗ وَإِنَٰثاٗ وَيَجْعَلُ مَنْ يَّشَآءُ عَقِيماًۖ اِنَّهُۥ عَلِيمٞ قَدِيرٞۖ","۞ وَمَا كَانَ لِبَشَرٍ اَنْ يُّكَلِّمَهُ اُ۬للَّهُ إِلَّا وَحْياً اَوْ مِنْ وَّرَآءِےْ حِجَابٍ اَوْ يُرْسِلُ رَسُولاٗ فَيُوحِے بِإِذْنِهِۦ مَا يَشَآءُۖ اِ۪نَّهُۥ عَلِيٌّ حَكِيمٞۖ","وَكَذَٰلِكَ أَوْحَيْنَآ إِلَيْكَ رُوحاٗ مِّنَ اَمْرِنَاۖ مَا كُنتَ تَدْرِے مَا اَ۬لْكِتَٰبُ وَلَا اَ۬لِايمَٰنُۖ وَلَٰكِن جَعَلْنَٰهُ نُوراٗ نَّهْدِے بِهِۦ مَن نَّشَآءُ مِنْ عِبَادِنَاۖ وَإِنَّكَ لَتَهْدِےٓ إِلَىٰ صِرَٰطٖ مُّسْتَقِيمٖ","صِرَٰطِ اِ۬للَّهِ اِ۬لذِے لَهُۥ مَا فِے اِ۬لسَّمَٰوَٰتِ وَمَا فِے اِ۬لَارْضِۖ أَلَآ إِلَى اَ۬للَّهِ تَصِيرُ اُ۬لُامُورُۖ"]],["الزخرف",["ح۪مِٓۖ وَالْكِتَٰبِ اِ۬لْمُبِينِ","إِنَّا جَعَلْنَٰهُ قُرْءَٰناً عَرَبِيّاٗ لَّعَلَّكُمْ تَعْقِلُونَۖ","وَإِنَّهُۥ فِےٓ أُمِّ اِ۬لْكِتَٰبِ لَدَيْنَا لَعَلِيٌّ حَكِيمٌۖ","اَفَنَضْرِبُ عَنكُمُ اُ۬لذِّكْرَ صَفْحاً اِن كُنتُمْ قَوْماٗ مُّسْرِفِينَۖ","وَكَمَ اَرْسَلْنَا مِن نَّبِےٓءٖ فِے اِ۬لَاوَّلِينَۖ","وَمَا يَاتِيهِم مِّن نَّبِےٓءٍ اِلَّا كَانُواْ بِهِۦ يَسْتَهْزِءُونَۖ","فَأَهْلَكْنَآ أَشَدَّ مِنْهُم بَطْشاٗۖ وَمَض۪ىٰ مَثَلُ اُ۬لَاوَّلِينَۖ","وَلَئِن سَأَلْتَهُم مَّنْ خَلَقَ اَ۬لسَّمَٰوَٰتِ وَالَارْضَ لَيَقُولُنَّ خَلَقَهُنَّ اَ۬لْعَزِيزُ اُ۬لْعَلِيمُۖ","اُ۬لذِے جَعَلَ لَكُمُ اُ۬لَارْضَ مِهَٰداٗ وَجَعَلَ لَكُمْ فِيهَا سُبُلاٗ لَّعَلَّكُمْ تَهْتَدُونَۖ","۞ وَالذِے نَزَّلَ مِنَ اَ۬لسَّمَآءِ مَآءَۢ بِقَدَرٖ فَأَنشَرْنَا بِهِۦ بَلْدَةٗ مَّيْتاٗۖ كَذَٰلِكَ تُخْرَجُونَۖ","وَالذِے خَلَقَ اَ۬لَازْوَٰجَ كُلَّهَا وَجَعَلَ لَكُم مِّنَ اَ۬لْفُلْكِ وَالَانْعَٰمِ مَا تَرْكَبُونَ","لِتَسْتَوُۥاْ عَلَىٰ ظُهُورِهِۦ ثُمَّ تَذْكُرُواْ نِعْمَةَ رَبِّكُمُۥٓ إِذَا اَ۪سْتَوَيْتُمْ عَلَيْهِ وَتَقُولُواْ سُبْحَٰنَ اَ۬لذِے سَخَّرَ لَنَا هَٰذَا وَمَا كُنَّا لَهُۥ مُقْرِنِينَ","وَإِنَّآ إِلَىٰ رَبِّنَا لَمُنقَلِبُونَۖ","وَجَعَلُواْ لَهُۥ مِنْ عِبَادِهِۦ جُزْءاًۖ اِنَّ اَ۬لِانسَٰنَ لَكَفُورٞ مُّبِينٌۖ","اَمِ اِ۪تَّخَذَ مِمَّا يَخْلُقُ بَنَاتٖ وَأَصْف۪يٰكُم بِالْبَنِينَۖ","وَإِذَا بُشِّرَ أَحَدُهُم بِمَا ضَرَبَ لِلرَّحْمَٰنِ مَثَلاٗ ظَلَّ وَجْهُهُۥ مُسْوَدّاٗ وَهُوَ كَظِيمٌۖ","اَوَمَنْ يَّنشَؤُاْ فِے اِ۬لْحِلْيَةِ وَهُوَ فِے اِ۬لْخِصَامِ غَيْرُ مُبِينٖۖ","وَجَعَلُواْ اُ۬لْمَلَٰٓئِكَةَ اَ۬لذِينَ هُمْ عِندَ اَ۬لرَّحْمَٰنِ إِنَٰثاًۖ اَ۟شْهِدُواْ خَلْقَهُمْۖ سَتُكْتَبُ شَهَٰدَتُهُمْ وَيُسْـَٔلُونَۖ","وَقَالُواْ لَوْ شَآءَ اَ۬لرَّحْمَٰنُ مَا عَبَدْنَٰهُمۖ مَّا لَهُم بِذَٰلِكَ مِنْ عِلْمٍۖ اِنْ هُمُۥٓ إِلَّا يَخْرُصُونَۖ","أَمَ اٰتَيْنَٰهُمْ كِتَٰباٗ مِّن قَبْلِهِۦ فَهُم بِهِۦ مُسْتَمْسِكُونَۖ","بَلْ قَالُوٓاْ إِنَّا وَجَدْنَآ ءَابَآءَنَا عَلَىٰٓ أُمَّةٖ وَإِنَّا عَلَىٰٓ ءَاثٰ۪رِهِم مُّهْتَدُونَۖ","وَكَذَٰلِكَ مَآ أَرْسَلْنَا مِن قَبْلِكَ فِے قَرْيَةٖ مِّن نَّذِيرٍ اِلَّا قَالَ مُتْرَفُوهَآ إِنَّا وَجَدْنَآ ءَابَآءَنَا عَلَىٰٓ أُمَّةٖ وَإِنَّا عَلَىٰٓ ءَاثٰ۪رِهِم مُّقْتَدُونَۖ","۞ قُلَ اَوَلَوْ جِئْتُكُم بِأَهْد۪ىٰ مِمَّا وَجَدتُّمْ عَلَيْهِ ءَابَآءَكُمْۖ قَالُوٓاْ إِنَّا بِمَآ أُرْسِلْتُم بِهِۦ كَٰفِرُونَۖ","فَانتَقَمْنَا مِنْهُمْ فَانظُرْ كَيْفَ كَانَ عَٰقِبَةُ اُ۬لْمُكَذِّبِينَۖ","وَإِذْ قَالَ إِبْرَٰهِيمُ لِأَبِيهِ وَقَوْمِهِۦٓ إِنَّنِے بَرَآءٞ مِّمَّا تَعْبُدُونَ","إِلَّا اَ۬لذِے فَطَرَنِے فَإِنَّهُۥ سَيَهْدِينِۖ","وَجَعَلَهَا كَلِمَةَۢ بَاقِيَةٗ فِے عَقِبِهِۦ لَعَلَّهُمْ يَرْجِعُونَۖ","بَلْ مَتَّعْتُ هَٰٓؤُلَآءِ وَءَابَآءَهُمْ حَتَّىٰ جَآءَهُمُ اُ۬لْحَقُّ وَرَسُولٞ مُّبِينٞۖ","وَلَمَّا جَآءَهُمُ اُ۬لْحَقُّ قَالُواْ هَٰذَا سِحْرٞ وَإِنَّا بِهِۦ كَٰفِرُونَۖ","وَقَالُواْ لَوْلَا نُزِّلَ هَٰذَا اَ۬لْقُرْءَانُ عَلَىٰ رَجُلٖ مِّنَ اَ۬لْقَرْيَتَيْنِ عَظِيمٍۖ","اَهُمْ يَقْسِمُونَ رَحْمَتَ رَبِّكَۖ نَحْنُ قَسَمْنَا بَيْنَهُم مَّعِيشَتَهُمْ فِے اِ۬لْحَيَوٰةِ اِ۬لدُّنْي۪ا وَرَفَعْنَا بَعْضَهُمْ فَوْقَ بَعْضٖ دَرَجَٰتٖ لِّيَتَّخِذَ بَعْضُهُم بَعْضاٗ سُخْرِيّاٗۖ وَرَحْمَتُ رَبِّكَ خَيْرٞ مِّمَّا يَجْمَعُونَۖ","وَلَوْلَآ أَنْ يَّكُونَ اَ۬لنَّاسُ أُمَّةٗ وَٰحِدَةٗ لَّجَعَلْنَا لِمَنْ يَّكْفُرُ بِالرَّحْمَٰنِ لِبُيُوتِهِمْ سُقُفاٗ مِّن فِضَّةٖ وَمَعَارِجَ عَلَيْهَا يَظْهَرُونَ","وَلِبُيُوتِهِمُۥٓ أَبْوَٰباٗ وَسُرُراً عَلَيْهَا يَتَّكِـُٔونَ","وَزُخْرُفاٗۖ وَإِن كُلُّ ذَٰلِكَ لَمَا مَتَٰعُ اُ۬لْحَيَوٰةِ اِ۬لدُّنْي۪اۖ وَالَاخِرَةُ عِندَ رَبِّكَ لِلْمُتَّقِينَۖ","وَمَنْ يَّعْشُ عَن ذِكْرِ اِ۬لرَّحْمَٰنِ نُقَيِّضْ لَهُۥ شَيْطَٰناٗ فَهُوَ لَهُۥ قَرِينٞۖ","وَإِنَّهُمْ لَيَصُدُّونَهُمْ عَنِ اِ۬لسَّبِيلِ وَيَحْسِبُونَ أَنَّهُم مُّهْتَدُونَۖ","حَتَّىٰٓ إِذَا جَآءَٰنَا قَالَ يَٰلَيْتَ بَيْنِے وَبَيْنَكَ بُعْدَ اَ۬لْمَشْرِقَيْنِۖ فَبِيسَ اَ۬لْقَرِينُۖ","وَلَنْ يَّنفَعَكُمُ اُ۬لْيَوْمَ إِذ ظَّلَمْتُمُۥٓ أَنَّكُمْ فِے اِ۬لْعَذَابِ مُشْتَرِكُونَۖ","أَفَأَنتَ تُسْمِعُ اُ۬لصُّمَّ أَوْ تَهْدِے اِ۬لْعُمْيَ وَمَن كَانَ فِے ضَلَٰلٖ مُّبِينٖۖ","فَإِمَّا نَذْهَبَنَّ بِكَ فَإِنَّا مِنْهُم مُّنتَقِمُونَ","أَوْ نُرِيَنَّكَ اَ۬لذِے وَعَدْنَٰهُمْ فَإِنَّا عَلَيْهِم مُّقْتَدِرُونَۖ","۞ فَاسْتَمْسِكْ بِالذِےٓ أُوحِيَ إِلَيْكَۖ إِنَّكَ عَلَىٰ صِرَٰطٖ مُّسْتَقِيمٖۖ","وَإِنَّهُۥ لَذِكْرٞ لَّكَ وَلِقَوْمِكَۖ وَسَوْفَ تُسْـَٔلُونَۖ","وَسْـَٔلْ مَنَ اَرْسَلْنَا مِن قَبْلِكَ مِن رُّسُلِنَآۖ أَجَعَلْنَا مِن دُونِ اِ۬لرَّحْمَٰنِ ءَالِهَةٗ يُعْبَدُونَۖ","وَلَقَدَ اَرْسَلْنَا مُوس۪ىٰ بِـَٔايَٰتِنَآ إِلَىٰ فِرْعَوْنَ وَمَلَإِيْهِۦ فَقَالَ إِنِّے رَسُولُ رَبِّ اِ۬لْعَٰلَمِينَۖ","فَلَمَّا جَآءَهُم بِـَٔايَٰتِنَآ إِذَا هُم مِّنْهَا يَضْحَكُونَۖ","وَمَا نُرِيهِم مِّنَ اٰيَةٍ اِلَّا هِيَ أَكْبَرُ مِنُ ا۟خْتِهَاۖ وَأَخَذْنَٰهُم بِالْعَذَابِ لَعَلَّهُمْ يَرْجِعُونَۖ","وَقَالُواْ يَٰٓأَيُّهَ اَ۬لسَّاحِرُ اُ۟دْعُ لَنَا رَبَّكَ بِمَا عَهِدَ عِندَكَ إِنَّنَا لَمُهْتَدُونَۖ","فَلَمَّا كَشَفْنَا عَنْهُمُ اُ۬لْعَذَابَ إِذَا هُمْ يَنكُثُونَۖ","وَنَاد۪ىٰ فِرْعَوْنُ فِے قَوْمِهِۦ قَالَ يَٰقَوْمِ أَلَيْسَ لِے مُلْكُ مِصْرَ وَهَٰذِهِ اِ۬لَانْهَٰرُ تَجْرِے مِن تَحْتِيَۖ أَفَلَا تُبْصِرُونَۖ","أَمَ اَنَا خَيْرٞ مِّنْ هَٰذَا اَ۬لذِے هُوَ مَهِينٞ","وَلَا يَكَادُ يُبِينُۖ","فَلَوْلَآ أُلْقِيَ عَلَيْهِ أَسَٰوِرَةٞ مِّن ذَهَبٍ اَوْ جَآءَ مَعَهُ اُ۬لْمَلَٰٓئِكَةُ مُقْتَرِنِينَۖ","فَاسْتَخَفَّ قَوْمَهُۥ فَأَطَاعُوهُۖ إِنَّهُمْ كَانُواْ قَوْماٗ فَٰسِقِينَۖ","فَلَمَّآ ءَاسَفُونَا اَ۪نتَقَمْنَا مِنْهُمْ فَأَغْرَقْنَٰهُمُۥٓ أَجْمَعِينَ","فَجَعَلْنَٰهُمْ سَلَفاٗ وَمَثَلاٗ لِّلَاخِرِينَۖ","وَلَمَّا ضُرِبَ اَ۪بْنُ مَرْيَمَ مَثَلاً اِذَا قَوْمُكَ مِنْهُ يَصُدُّونَۖ","وَقَالُوٓاْ ءَاٰ۬لِهَتُنَا خَيْرٌ اَمْ هُوَۖ مَا ضَرَبُوهُ لَكَ إِلَّا جَدَلاَۖ بَلْ هُمْ قَوْمٌ خَصِمُونَۖ","إِنْ هُوَ إِلَّا عَبْدٌ اَنْعَمْنَا عَلَيْهِ وَجَعَلْنَٰهُ مَثَلاٗ لِّبَنِےٓ إِسْرَآءِيلَۖ","وَلَوْ نَشَآءُ لَجَعَلْنَا مِنكُم مَّلَٰٓئِكَةٗ فِے اِ۬لَارْضِ يَخْلُفُونَۖ","وَإِنَّهُۥ لَعِلْمٞ لِّلسَّاعَةِ فَلَا تَمْتَرُنَّ بِهَاۖ وَاتَّبِعُونِ هَٰذَا صِرَٰطٞ مُّسْتَقِيمٞۖ","وَلَا يَصُدَّنَّكُمُ اُ۬لشَّيْطَٰنُۖ إِنَّهُۥ لَكُمْ عَدُوّٞ مُّبِينٞۖ","۞ وَلَمَّا جَآءَ عِيس۪ىٰ بِالْبَيِّنَٰتِ قَالَ قَدْ جِئْتُكُم بِالْحِكْمَةِ وَلِأُبَيِّنَ لَكُم بَعْضَ اَ۬لذِے تَخْتَلِفُونَ فِيهِۖ فَاتَّقُواْ اُ۬للَّهَ وَأَطِيعُونِۖ","إِنَّ اَ۬للَّهَ هُوَ رَبِّے وَرَبُّكُمْ فَاعْبُدُوهُۖ هَٰذَا صِرَٰطٞ مُّسْتَقِيمٞۖ","فَاخْتَلَفَ اَ۬لَاحْزَابُ مِنۢ بَيْنِهِمْۖ فَوَيْلٞ لِّلذِينَ ظَلَمُواْ مِنْ عَذَابِ يَوْمٍۖ اَلِيمٍۖ","هَلْ يَنظُرُونَ إِلَّا اَ۬لسَّاعَةَ أَن تَاتِيَهُم بَغْتَةٗ وَهُمْ لَا يَشْعُرُونَۖ","اَ۬لَاخِلَّآءُ يَوْمَئِذِۢ بَعْضُهُمْ لِبَعْضٍ عَدُوٌّ اِلَّا اَ۬لْمُتَّقِينَۖ","يَٰعِبَادِے لَا خَوْفٌ عَلَيْكُمُ اُ۬لْيَوْمَ وَلَآ أَنتُمْ تَحْزَنُونَۖ","اَ۬لذِينَ ءَامَنُواْ بِـَٔايَٰتِنَا وَكَانُواْ مُسْلِمِينَ","اَ۟دْخُلُواْ اُ۬لْجَنَّةَ أَنتُمْ وَأَزْوَٰجُكُمْ تُحْبَرُونَۖ","يُطَافُ عَلَيْهِم بِصِحَافٖ مِّن ذَهَبٖ وَأَكْوَابٖۖ وَفِيهَا مَا تَشْتَهِيهِ اِ۬لَانفُسُ وَتَلَذُّ اُ۬لَاعْيُنُۖ وَأَنتُمْ فِيهَا خَٰلِدُونَۖ","وَتِلْكَ اَ۬لْجَنَّةُ اُ۬لتِےٓ أُورِثْتُمُوهَا بِمَا كُنتُمْ تَعْمَلُونَۖ","لَكُمْ فِيهَا فَٰكِهَةٞ كَثِيرَةٞ مِّنْهَا تَاكُلُونَۖ","إِنَّ اَ۬لْمُجْرِمِينَ فِے عَذَابِ جَهَنَّمَ خَٰلِدُونَۖ","لَا يُفَتَّرُ عَنْهُمْ وَهُمْ فِيهِ مُبْلِسُونَۖ","وَمَا ظَلَمْنَٰهُمْۖ وَلَٰكِن كَانُواْ هُمُ اُ۬لظَّٰلِمِينَۖ","وَنَادَوْاْ يَٰمَٰلِكُ لِيَقْضِ عَلَيْنَا رَبُّكَۖ قَالَ إِنَّكُم مَّٰكِثُونَۖ","لَقَدْ جِئْنَٰكُم بِالْحَقِّۖ وَلَٰكِنَّ أَكْثَرَكُمْ لِلْحَقِّ كَٰرِهُونَۖ","أَمَ اَبْرَمُوٓاْ أَمْراٗ فَإِنَّا مُبْرِمُونَۖ","أَمْ يَحْسِبُونَ أَنَّا لَا نَسْمَعُ سِرَّهُمْ وَنَجْو۪يٰهُم بَل۪ىٰۖ وَرُسُلُنَا لَدَيْهِمْ يَكْتُبُونَۖ","قُلِ اِن كَانَ لِلرَّحْمَٰنِ وَلَدٞۖ فَأَنَآ أَوَّلُ اُ۬لْعَٰبِدِينَۖ","سُبْحَٰنَ رَبِّ اِ۬لسَّمَٰوَٰتِ وَالَارْضِ رَبِّ اِ۬لْعَرْشِ عَمَّا يَصِفُونَۖ","فَذَرْهُمْ يَخُوضُواْ وَيَلْعَبُواْ حَتَّىٰ يُلَٰقُواْ يَوْمَهُمُ اُ۬لذِے يُوعَدُونَۖ","وَهُوَ اَ۬لذِے فِے اِ۬لسَّمَآءِ الَٰهٞ وَفِے اِ۬لَارْضِ إِلَٰهٞۖ وَهُوَ اَ۬لْحَكِيمُ اُ۬لْعَلِيمُۖ","۞ وَتَبَٰرَكَ اَ۬لذِے لَهُۥ مُلْكُ اُ۬لسَّمَٰوَٰتِ وَالَارْضِ وَمَا بَيْنَهُمَاۖ وَعِندَهُۥ عِلْمُ اُ۬لسَّاعَةِۖ وَإِلَيْهِ تُرْجَعُونَۖ","وَلَا يَمْلِكُ اُ۬لذِينَ يَدْعُونَ مِن دُونِهِ اِ۬لشَّفَٰعَةَ إِلَّا مَن شَهِدَ بِالْحَقِّ وَهُمْ يَعْلَمُونَۖ","وَلَئِن سَأَلْتَهُم مَّنْ خَلَقَهُمْ لَيَقُولُنَّ اَ۬للَّهُۖ فَأَنّ۪ىٰ يُوفَكُونَۖ","وَقِيلَهُۥ يَٰرَبِّ إِنَّ هَٰٓؤُلَآءِ قَوْمٞ لَّا يُومِنُونَۖ","فَاصْفَحْ عَنْهُمْ وَقُلْ سَلَٰمٞۖ فَسَوْفَ تَعْلَمُونَۖ"]],["الدخان",["ح۪مِٓۖ وَالْكِتَٰبِ اِ۬لْمُبِينِ","إِنَّآ أَنزَلْنَٰهُ فِے لَيْلَةٖ مُّبَٰرَكَةٍ اِنَّا كُنَّا مُنذِرِينَۖ","فِيهَا يُفْرَقُ كُلُّ أَمْرٍ حَكِيمٍ","اَمْراٗ مِّنْ عِندِنَآۖ إِنَّا كُنَّا مُرْسِلِينَ","رَحْمَةٗ مِّن رَّبِّكَۖ إِنَّهُۥ هُوَ اَ۬لسَّمِيعُ اُ۬لْعَلِيمُۖ","رَبُّ اُ۬لسَّمَٰوَٰتِ وَالَارْضِ وَمَا بَيْنَهُمَآ إِن كُنتُم مُّوقِنِينَۖ","لَآ إِلَٰهَ إِلَّا هُوَۖ يُحْيِۦ وَيُمِيتُۖ رَبُّكُمْ وَرَبُّ ءَابَآئِكُمُ اُ۬لَاوَّلِينَۖ","بَلْ هُمْ فِے شَكّٖ يَلْعَبُونَۖ","فَارْتَقِبْ يَوْمَ تَاتِے اِ۬لسَّمَآءُ بِدُخَانٖ مُّبِينٖ","يَغْشَى اَ۬لنَّاسَۖ هَٰذَا عَذَابٌ اَلِيمٞۖ","رَّبَّنَا اَ۪كْشِفْ عَنَّا اَ۬لْعَذَابَ إِنَّا مُومِنُونَۖ","أَنّ۪ىٰ لَهُمُ اُ۬لذِّكْر۪ىٰ وَقَدْ جَآءَهُمْ رَسُولٞ مُّبِينٞ","ثُمَّ تَوَلَّوْاْ عَنْهُ وَقَالُواْ مُعَلَّمٞ مَّجْنُونٌۖ","اِنَّا كَاشِفُواْ اُ۬لْعَذَابِ قَلِيلاًۖ اِنَّكُمْ عَآئِدُونَۖ","يَوْمَ نَبْطِشُ اُ۬لْبَطْشَةَ اَ۬لْكُبْر۪ىٰٓۖ إِنَّا مُنتَقِمُونَۖ","وَلَقَدْ فَتَنَّا قَبْلَهُمْ قَوْمَ فِرْعَوْنَ وَجَآءَهُمْ رَسُولٞ كَرِيمٌ","اَنَ اَدُّوٓاْ إِلَيَّ عِبَادَ اَ۬للَّهِ إِنِّے لَكُمْ رَسُولٌ اَمِينٞ","وَأَن لَّا تَعْلُواْ عَلَى اَ۬للَّهِ إِنِّيَ ءَاتِيكُم بِسُلْطَٰنٖ مُّبِينٖ","وَإِنِّے عُذْتُ بِرَبِّے وَرَبِّكُمُۥٓ أَن تَرْجُمُونِۦ","وَإِن لَّمْ تُومِنُواْ لِيَ فَاعْتَزِلُونِۦۖ","فَدَعَا رَبَّهُۥٓ أَنَّ هَٰٓؤُلَآءِ قَوْمٞ مُّجْرِمُونَۖ","فَاسْرِ بِعِبَادِے لَيْلاً اِنَّكُم مُّتَّبَعُونَ","وَاتْرُكِ اِ۬لْبَحْرَ رَهْواًۖ اِنَّهُمْ جُندٞ مُّغْرَقُونَۖ","۞ كَمْ تَرَكُواْ مِن جَنَّٰتٖ وَعُيُونٖ","وَزُرُوعٖ وَمَقَامٖ كَرِيمٖ","وَنَعْمَةٖ كَانُواْ فِيهَا فَٰكِهِينَۖ","كَذَٰلِكَۖ وَأَوْرَثْنَٰهَا قَوْماً اٰخَرِينَۖ","فَمَا بَكَتْ عَلَيْهِمُ اُ۬لسَّمَآءُ وَالَارْضُ وَمَا كَانُواْ مُنظَرِينَۖ","وَلَقَدْ نَجَّيْنَا بَنِےٓ إِسْرَآءِيلَ مِنَ اَ۬لْعَذَابِ اِ۬لْمُهِينِ","مِن فِرْعَوْنَۖ إِنَّهُۥ كَانَ عَالِياٗ مِّنَ اَ۬لْمُسْرِفِينَۖ","وَلَقَدِ اِ۪خْتَرْنَٰهُمْ عَلَىٰ عِلْمٍ عَلَى اَ۬لْعَٰلَمِينَ","وَءَاتَيْنَٰهُم مِّنَ اَ۬لَايَٰتِ مَا فِيهِ بَلَٰٓؤٞاْ مُّبِينٌۖ","اِنَّ هَٰٓؤُلَآءِ لَيَقُولُونَ إِنْ هِيَ إِلَّا مَوْتَتُنَا اَ۬لُاول۪ىٰ وَمَا نَحْنُ بِمُنشَرِينَ","فَاتُواْ بِـَٔابَآئِنَآ إِن كُنتُمْ صَٰدِقِينَۖ","أَهُمْ خَيْرٌ اَمْ قَوْمُ تُبَّعٖۖ وَالذِينَ مِن قَبْلِهِمُۥٓ أَهْلَكْنَٰهُمُۥٓۖ إِنَّهُمْ كَانُواْ مُجْرِمِينَۖ","وَمَا خَلَقْنَا اَ۬لسَّمَٰوَٰتِ وَالَارْضَ وَمَا بَيْنَهُمَا لَٰعِبِينَۖ","مَا خَلَقْنَٰهُمَآ إِلَّا بِالْحَقِّۖ وَلَٰكِنَّ أَكْثَرَهُمْ لَا يَعْلَمُونَۖ","إِنَّ يَوْمَ اَ۬لْفَصْلِ مِيقَٰتُهُمُۥٓ أَجْمَعِينَ","يَوْمَ لَا يُغْنِے مَوْلىً عَن مَّوْلىٗ شَئْاٗ وَلَا هُمْ يُنصَرُونَ","إِلَّا مَن رَّحِمَ اَ۬للَّهُۖ إِنَّهُۥ هُوَ اَ۬لْعَزِيزُ اُ۬لرَّحِيمُۖ","إِنَّ شَجَرَتَ اَ۬لزَّقُّومِ طَعَامُ اُ۬لَاثِيمِ","كَالْمُهْلِ تَغْلِے فِے اِ۬لْبُطُونِ","كَغَلْيِ اِ۬لْحَمِيمِۖ","خُذُوهُ فَاعْتُلُوهُ إِلَىٰ سَوَآءِ اِ۬لْجَحِيمِ","ثُمَّ صُبُّواْ فَوْقَ رَأْسِهِۦ مِنْ عَذَابِ اِ۬لْحَمِيمِ","ذُقِۖ اِنَّكَ أَنتَ اَ۬لْعَزِيزُ اُ۬لْكَرِيمُۖ","إِنَّ هَٰذَا مَا كُنتُم بِهِۦ تَمْتَرُونَۖ","إِنَّ اَ۬لْمُتَّقِينَ فِے مُقَامٍ اَمِينٖ","فِے جَنَّٰتٖ وَعُيُونٖ","يَلْبَسُونَ مِن سُندُسٖ وَإِسْتَبْرَقٖ مُّتَقَٰبِلِينَۖ","كَذَٰلِكَۖ وَزَوَّجْنَٰهُم بِحُورٍ عِينٖۖ","يَدْعُونَ فِيهَا بِكُلِّ فَٰكِهَةٍ اٰمِنِينَۖ","لَا يَذُوقُونَ فِيهَا اَ۬لْمَوْتَۖ إِلَّا اَ۬لْمَوْتَةَ اَ۬لُاول۪ىٰۖ وَوَق۪يٰهُمْ عَذَابَ اَ۬لْجَحِيمِ","فَضْلاٗ مِّن رَّبِّكَۖ ذَٰلِكَ هُوَ اَ۬لْفَوْزُ اُ۬لْعَظِيمُۖ","فَإِنَّمَا يَسَّرْنَٰهُ بِلِسَانِكَ لَعَلَّهُمْ يَتَذَكَّرُونَۖ","فَارْتَقِبِۖ اِنَّهُم مُّرْتَقِبُونَۖ"]],["الجاثية",["ح۪مِٓۖ تَنزِيلُ اُ۬لْكِتَٰبِ مِنَ اَ۬للَّهِ اِ۬لْعَزِيزِ اِ۬لْحَكِيمِۖ","إِنَّ فِے اِ۬لسَّمَٰوَٰتِ وَالَارْضِ لَأٓيَٰتٖ لِّلْمُومِنِينَۖ","وَفِے خَلْقِكُمْ وَمَا يَبُثُّ مِن دَآبَّةٍ اٰيَٰتٞ لِّقَوْمٖ يُوقِنُونَ","وَاخْتِلَٰفِ اِ۬ليْلِ وَالنَّه۪ارِ وَمَآ أَنزَلَ اَ۬للَّهُ مِنَ اَ۬لسَّمَآءِ مِن رِّزْقٖ فَأَحْي۪ا بِهِ اِ۬لَارْضَ بَعْدَ مَوْتِهَا وَتَصْرِيفِ اِ۬لرِّيَٰحِ ءَايَٰتٞ لِّقَوْمٖ يَعْقِلُونَۖ","تِلْكَ ءَايَٰتُ اُ۬للَّهِ نَتْلُوهَا عَلَيْكَ بِالْحَقِّۖ فَبِأَيِّ حَدِيثِۢ بَعْدَ اَ۬للَّهِ وَءَايَٰتِهِۦ يُومِنُونَۖ","وَيْلٞ لِّكُلِّ أَفَّاكٍ اَثِيمٖ","يَسْمَعُ ءَايَٰتِ اِ۬للَّهِ تُتْل۪ىٰ عَلَيْهِ ثُمَّ يُصِرُّ مُسْتَكْبِراٗ كَأَن لَّمْ يَسْمَعْهَاۖ فَبَشِّرْهُ بِعَذَابٍ اَلِيمٖۖ","وَإِذَا عَلِمَ مِنَ اٰيَٰتِنَا شَئْاً اِ۪تَّخَذَهَا هُزُؤاًۖ ا۟وْلَٰٓئِكَ لَهُمْ عَذَابٞ مُّهِينٞۖ","مِّنْ وَّرَآئِهِمْ جَهَنَّمُ وَلَا يُغْنِے عَنْهُم مَّا كَسَبُواْ شَئْاٗ وَلَا مَا اَ۪تَّخَذُواْ مِن دُونِ اِ۬للَّهِ أَوْلِيَآءَۖ وَلَهُمْ عَذَابٌ عَظِيمٌۖ","هَٰذَا هُدىٗۖ وَالذِينَ كَفَرُواْ بِـَٔايَٰتِ رَبِّهِمْ لَهُمْ عَذَابٞ مِّن رِّجْزٍ اَلِيمٍۖ","اِ۬للَّهُ اُ۬لذِے سَخَّرَ لَكُمُ اُ۬لْبَحْرَ لِتَجْرِيَ اَ۬لْفُلْكُ فِيهِ بِأَمْرِهِۦ وَلِتَبْتَغُواْ مِن فَضْلِهِۦ وَلَعَلَّكُمْ تَشْكُرُونَۖ","وَسَخَّرَ لَكُم مَّا فِے اِ۬لسَّمَٰوَٰتِ وَمَا فِے اِ۬لَارْضِ جَمِيعاٗ مِّنْهُۖ إِنَّ فِے ذَٰلِكَ لَأٓيَٰتٖ لِّقَوْمٖ يَتَفَكَّرُونَۖ","۞ قُل لِّلذِينَ ءَامَنُواْ يَغْفِرُواْ لِلذِينَ لَا يَرْجُونَ أَيَّامَ اَ۬للَّهِ لِيَجْزِيَ قَوْماَۢ بِمَا كَانُواْ يَكْسِبُونَۖ","مَنْ عَمِلَ صَٰلِحاٗ فَلِنَفْسِهِۦۖ وَمَنَ اَسَآءَ فَعَلَيْهَاۖ ثُمَّ إِلَىٰ رَبِّكُمْ تُرْجَعُونَۖ","وَلَقَدَ اٰتَيْنَا بَنِےٓ إِسْرَآءِيلَ اَ۬لْكِتَٰبَ وَالْحُكْمَ وَالنُّبُوٓءَةَ وَرَزَقْنَٰهُم مِّنَ اَ۬لطَّيِّبَٰتِ وَفَضَّلْنَٰهُمْ عَلَى اَ۬لْعَٰلَمِينَ","وَءَاتَيْنَٰهُم بَيِّنَٰتٖ مِّنَ اَ۬لَامْرِۖ فَمَا اَ۪خْتَلَفُوٓاْ إِلَّا مِنۢ بَعْدِ مَا جَآءَهُمُ اُ۬لْعِلْمُۖ بَغْياَۢ بَيْنَهُمُۥٓۖ إِنَّ رَبَّكَ يَقْضِے بَيْنَهُمْ يَوْمَ اَ۬لْقِيَٰمَةِ فِيمَا كَانُواْ فِيهِ يَخْتَلِفُونَۖ","ثُمَّ جَعَلْنَٰكَ عَلَىٰ شَرِيعَةٖ مِّنَ اَ۬لَامْرِ فَاتَّبِعْهَاۖ وَلَا تَتَّبِعَ اَهْوَآءَ اَ۬لذِينَ لَا يَعْلَمُونَۖ","إِنَّهُمْ لَنْ يُّغْنُواْ عَنكَ مِنَ اَ۬للَّهِ شَئْاٗۖ وَإِنَّ اَ۬لظَّٰلِمِينَ بَعْضُهُمُۥٓ أَوْلِيَآءُ بَعْضٖۖ وَاللَّهُ وَلِيُّ اُ۬لْمُتَّقِينَۖ","هَٰذَا بَصَٰٓئِرُ لِلنَّاسِ وَهُدىٗ وَرَحْمَةٞ لِّقَوْمٖ يُوقِنُونَۖ","أَمْ حَسِبَ اَ۬لذِينَ اَ۪جْتَرَحُواْ اُ۬لسَّيِّـَٔاتِ أَن نَّجْعَلَهُمْ كَالذِينَ ءَامَنُواْ وَعَمِلُواْ اُ۬لصَّٰلِحَٰتِ سَوَآءٞ مَّحْي۪اهُمْ وَمَمَاتُهُمْۖ سَآءَ مَا يَحْكُمُونَۖ","وَخَلَقَ اَ۬للَّهُ اُ۬لسَّمَٰوَٰتِ وَالَارْضَ بِالْحَقِّۖ وَلِتُجْز۪ىٰ كُلُّ نَفْسِۢ بِمَا كَسَبَتْ وَهُمْ لَا يُظْلَمُونَۖ","أَفَرَٰٓيْتَ مَنِ اِ۪تَّخَذَ إِلَٰهَهُۥ هَو۪يٰهُ وَأَضَلَّهُ اُ۬للَّهُ عَلَىٰ عِلْمٖ وَخَتَمَ عَلَىٰ سَمْعِهِۦ وَقَلْبِهِۦ وَجَعَلَ عَلَىٰ بَصَرِهِۦ غِشَٰوَةٗ فَمَنْ يَّهْدِيهِ مِنۢ بَعْدِ اِ۬للَّهِۖ أَفَلَا تَذَّكَّرُونَۖ","وَقَالُواْ مَا هِيَ إِلَّا حَيَاتُنَا اَ۬لدُّنْي۪ا نَمُوتُ وَنَحْي۪ا وَمَا يُهْلِكُنَآ إِلَّا اَ۬لدَّهْرُۖ وَمَا لَهُم بِذَٰلِكَ مِنْ عِلْمٍۖ اِنْ هُمُۥٓ إِلَّا يَظُنُّونَۖ","۞ وَإِذَا تُتْل۪ىٰ عَلَيْهِمُۥٓ ءَايَٰتُنَا بَيِّنَٰتٖ مَّا كَانَ حُجَّتَهُمُۥٓ إِلَّآ أَن قَالُواْ اُ۪يتُواْ بِـَٔابَآئِنَآ إِن كُنتُمْ صَٰدِقِينَۖ","قُلِ اِ۬للَّهُ يُحْيِيكُمْ ثُمَّ يُمِيتُكُمْ ثُمَّ يَجْمَعُكُمُۥٓ إِلَىٰ يَوْمِ اِ۬لْقِيَٰمَةِ لَا رَيْبَ فِيهِۖ وَلَٰكِنَّ أَكْثَرَ اَ۬لنَّاسِ لَا يَعْلَمُونَۖ","وَلِلهِ مُلْكُ اُ۬لسَّمَٰوَٰتِ وَالَارْضِۖ وَيَوْمَ تَقُومُ اُ۬لسَّاعَةُ يَوْمَئِذٖ يَخْسَرُ اُ۬لْمُبْطِلُونَۖ","وَتَر۪ىٰ كُلَّ أُمَّةٖ جَاثِيَةٗۖ كُلُّ أُمَّةٖ تُدْع۪ىٰٓ إِلَىٰ كِتَٰبِهَاۖ اَ۬لْيَوْمَ تُجْزَوْنَ مَا كُنتُمْ تَعْمَلُونَۖ","هَٰذَا كِتَٰبُنَا يَنطِقُ عَلَيْكُم بِالْحَقِّۖ إِنَّا كُنَّا نَسْتَنسِخُ مَا كُنتُمْ تَعْمَلُونَۖ","فَأَمَّا اَ۬لذِينَ ءَامَنُواْ وَعَمِلُواْ اُ۬لصَّٰلِحَٰتِ فَيُدْخِلُهُمْ رَبُّهُمْ فِے رَحْمَتِهِۦۖ ذَٰلِكَ هُوَ اَ۬لْفَوْزُ اُ۬لْمُبِينُۖ","وَأَمَّا اَ۬لذِينَ كَفَرُوٓاْ أَفَلَمْ تَكُنَ اٰيَٰتِے تُتْل۪ىٰ عَلَيْكُمْ فَاسْتَكْبَرْتُمْ وَكُنتُمْ قَوْماٗ مُّجْرِمِينَۖ","وَإِذَا قِيلَ إِنَّ وَعْدَ اَ۬للَّهِ حَقّٞ وَالسَّاعَةُ لَا رَيْبَ فِيهَا قُلْتُم مَّا نَدْرِے مَا اَ۬لسَّاعَةُ إِن نَّظُنُّ إِلَّا ظَنّاٗ وَمَا نَحْنُ بِمُسْتَيْقِنِينَۖ","وَبَدَا لَهُمْ سَيِّـَٔاتُ مَا عَمِلُواْۖ وَحَاقَ بِهِم مَّا كَانُواْ بِهِۦ يَسْتَهْزِءُونَۖ","وَقِيلَ اَ۬لْيَوْمَ نَنس۪يٰكُمْ كَمَا نَسِيتُمْ لِقَآءَ يَوْمِكُمْ هَٰذَا وَمَأْو۪يٰكُمُ اُ۬لنَّارُ وَمَا لَكُم مِّن نَّٰصِرِينَۖ","ذَٰلِكُم بِأَنَّكُمُ اُ۪تَّخَذتُّمُۥٓ ءَايَٰتِ اِ۬للَّهِ هُزُؤاٗ وَغَرَّتْكُمُ اُ۬لْحَيَوٰةُ اُ۬لدُّنْي۪اۖ فَالْيَوْمَ لَا يُخْرَجُونَ مِنْهَا وَلَا هُمْ يُسْتَعْتَبُونَۖ","فَلِلهِ اِ۬لْحَمْدُ رَبِّ اِ۬لسَّمَٰوَٰتِ وَرَبِّ اِ۬لَارْضِ رَبِّ اِ۬لْعَٰلَمِينَۖ","وَلَهُ اُ۬لْكِبْرِيَآءُ فِے اِ۬لسَّمَٰوَٰتِ وَالَارْضِۖ وَهُوَ اَ۬لْعَزِيزُ اُ۬لْحَكِيمُۖ"]],["الأحقاف",["ح۪مِٓۖ تَنزِيلُ اُ۬لْكِتَٰبِ مِنَ اَ۬للَّهِ اِ۬لْعَزِيزِ اِ۬لْحَكِيمِۖ","مَا خَلَقْنَا اَ۬لسَّمَٰوَٰتِ وَالَارْضَ وَمَا بَيْنَهُمَآ إِلَّا بِالْحَقِّ وَأَجَلٖ مُّسَمّىٗۖ وَالذِينَ كَفَرُواْ عَمَّآ أُنذِرُواْ مُعْرِضُونَۖ","قُلَ اَرَٰٓيْتُم مَّا تَدْعُونَ مِن دُونِ اِ۬للَّهِ أَرُونِے مَاذَا خَلَقُواْ مِنَ اَ۬لَارْضِ أَمْ لَهُمْ شِرْكٞ فِے اِ۬لسَّمَٰوَٰتِۖ اِ۪يتُونِے بِكِتَٰبٖ مِّن قَبْلِ هَٰذَآ أَوَ اَثَٰرَةٖ مِّنْ عِلْمٍ اِن كُنتُمْ صَٰدِقِينَۖ","وَمَنَ اَضَلُّ مِمَّنْ يَّدْعُواْ مِن دُونِ اِ۬للَّهِ مَن لَّا يَسْتَجِيبُ لَهُۥٓ إِلَىٰ يَوْمِ اِ۬لْقِيَٰمَةِ وَهُمْ عَن دُعَآئِهِمْ غَٰفِلُونَۖ","وَإِذَا حُشِرَ اَ۬لنَّاسُ كَانُواْ لَهُمُۥٓ أَعْدَآءٗ وَكَانُواْ بِعِبَادَتِهِمْ كٰ۪فِرِينَۖ","وَإِذَا تُتْل۪ىٰ عَلَيْهِمُۥٓ ءَايَٰتُنَا بَيِّنَٰتٖ قَالَ اَ۬لذِينَ كَفَرُواْ لِلْحَقِّ لَمَّا جَآءَهُمْ هَٰذَا سِحْرٞ مُّبِينٌۖ","اَمْ يَقُولُونَ اَ۪فْتَر۪يٰهُۖ قُلِ اِنِ اِ۪فْتَرَيْتُهُۥ فَلَا تَمْلِكُونَ لِے مِنَ اَ۬للَّهِ شَئْاًۖ هُوَ أَعْلَمُ بِمَا تُفِيضُونَ فِيهِۖ كَف۪ىٰ بِهِۦ شَهِيداَۢ بَيْنِے وَبَيْنَكُمْۖ وَهُوَ اَ۬لْغَفُورُ اُ۬لرَّحِيمُۖ","قُلْ مَا كُنتُ بِدْعاٗ مِّنَ اَ۬لرُّسُلِ وَمَآ أَدْرِے مَا يُفْعَلُ بِے وَلَا بِكُمُۥٓۖ إِنَ اَتَّبِعُ إِلَّا مَا يُوح۪ىٰٓ إِلَيَّۖ وَمَآ أَنَا إِلَّا نَذِيرٞ مُّبِينٞۖ","قُلَ اَرَٰٓيْتُمُۥٓ إِن كَانَ مِنْ عِندِ اِ۬للَّهِ وَكَفَرْتُم بِهِۦ وَشَهِدَ شَاهِدٞ مِّنۢ بَنِےٓ إِسْرَآءِيلَ عَلَىٰ مِثْلِهِۦ فَـَٔامَنَ وَاسْتَكْبَرْتُمُۥٓۖ إِنَّ اَ۬للَّهَ لَا يَهْدِے اِ۬لْقَوْمَ اَ۬لظَّٰلِمِينَۖ","وَقَالَ اَ۬لذِينَ كَفَرُواْ لِلذِينَ ءَامَنُواْ لَوْ كَانَ خَيْراٗ مَّا سَبَقُونَآ إِلَيْهِۖ وَإِذْ لَمْ يَهْتَدُواْ بِهِۦ فَسَيَقُولُونَ هَٰذَآ إِفْكٞ قَدِيمٞۖ","وَمِن قَبْلِهِۦ كِتَٰبُ مُوس۪ىٰٓ إِمَاماٗ وَرَحْمَةٗۖ وَهَٰذَا كِتَٰبٞ مُّصَدِّقٞ لِّسَاناً عَرَبِيّاٗ لِّتُنذِرَ اَ۬لذِينَ ظَلَمُواْ وَبُشْر۪ىٰ لِلْمُحْسِنِينَۖ","إِنَّ اَ۬لذِينَ قَالُواْ رَبُّنَا اَ۬للَّهُ ثُمَّ اَ۪سْتَقَٰمُواْ فَلَا خَوْفٌ عَلَيْهِمْ وَلَا هُمْ يَحْزَنُونَۖ","أُوْلَٰٓئِكَ أَصْحَٰبُ اُ۬لْجَنَّةِ خَٰلِدِينَ فِيهَاۖ جَزَآءَۢ بِمَا كَانُواْ يَعْمَلُونَۖ","۞ وَوَصَّيْنَا اَ۬لِانسَٰنَ بِوَٰلِدَيْهِ حُسْناًۖ حَمَلَتْهُ أُمُّهُۥ كَرْهاٗ وَوَضَعَتْهُ كَرْهاٗۖ وَحَمْلُهُۥ وَفِصَٰلُهُۥ ثَلَٰثُونَ شَهْراًۖ حَتَّىٰٓ إِذَا بَلَغَ أَشُدَّهُۥ وَبَلَغَ أَرْبَعِينَ سَنَةٗ قَالَ رَبِّ أَوْزِعْنِيَ أَنَ اَشْكُرَ نِعْمَتَكَ اَ۬لتِےٓ أَنْعَمْتَ عَلَيَّ وَعَلَىٰ وَٰلِدَيَّ وَأَنَ اَعْمَلَ صَٰلِحاٗ تَرْض۪يٰهُۖ وَأَصْلِحْ لِے فِے ذُرِّيَّتِےٓۖ إِنِّے تُبْتُ إِلَيْكَ وَإِنِّے مِنَ اَ۬لْمُسْلِمِينَۖ","أُوْلَٰٓئِكَ اَ۬لذِينَ يُتَقَبَّلُ عَنْهُمُۥٓ أَحْسَنُ مَا عَمِلُواْ وَيُتَجَاوَزُ عَن سَيِّـَٔاتِهِمْ فِےٓ أَصْحَٰبِ اِ۬لْجَنَّةِۖ وَعْدَ اَ۬لصِّدْقِ اِ۬لذِے كَانُواْ يُوعَدُونَۖ","وَالذِے قَالَ لِوَٰلِدَيْهِ أُفّٖ لَّكُمَآ أَتَعِدَٰنِنِيَ أَنُ ا۟خْرَجَ وَقَدْ خَلَتِ اِ۬لْقُرُونُ مِن قَبْلِے وَهُمَا يَسْتَغِيثَٰنِ اِ۬للَّهَ وَيْلَكَ ءَامِنِ اِنَّ وَعْدَ اَ۬للَّهِ حَقّٞ فَيَقُولُ مَا هَٰذَآ إِلَّآ أَسَٰطِيرُ اُ۬لَاوَّلِينَۖ","أُوْلَٰٓئِكَ اَ۬لذِينَ حَقَّ عَلَيْهِمُ اُ۬لْقَوْلُ فِےٓ أُمَمٖ قَدْ خَلَتْ مِن قَبْلِهِم مِّنَ اَ۬لْجِنِّ وَالِانسِۖ إِنَّهُمْ كَانُواْ خَٰسِرِينَۖ","وَلِكُلّٖ دَرَجَٰتٞ مِّمَّا عَمِلُواْۖ وَلِنُوَفِّيَهُمُۥٓ أَعْمَٰلَهُمْ وَهُمْ لَا يُظْلَمُونَۖ","وَيَوْمَ يُعْرَضُ اُ۬لذِينَ كَفَرُواْ عَلَى اَ۬لنّ۪ارِ أَذْهَبْتُمْ طَيِّبَٰتِكُمْ فِے حَيَاتِكُمُ اُ۬لدُّنْي۪ا وَاسْتَمْتَعْتُم بِهَاۖ فَالْيَوْمَ تُجْزَوْنَ عَذَابَ اَ۬لْهُونِ بِمَا كُنتُمْ تَسْتَكْبِرُونَ فِے اِ۬لَارْضِ بِغَيْرِ اِ۬لْحَقِّ وَبِمَا كُنتُمْ تَفْسُقُونَۖ","۞ وَاذْكُرَ اَخَا عَادٍ اِذَ اَنذَرَ قَوْمَهُۥ بِالَاحْقَافِ وَقَدْ خَلَتِ اِ۬لنُّذُرُ مِنۢ بَيْنِ يَدَيْهِ وَمِنْ خَلْفِهِۦٓ أَلَّا تَعْبُدُوٓاْ إِلَّا اَ۬للَّهَۖ إِنِّيَ أَخَافُ عَلَيْكُمْ عَذَابَ يَوْمٍ عَظِيمٖۖ","قَالُوٓاْ أَجِئْتَنَا لِتَافِكَنَا عَنَ اٰلِهَتِنَا فَاتِنَا بِمَا تَعِدُنَآ إِن كُنتَ مِنَ اَ۬لصَّٰدِقِينَۖ","قَالَ إِنَّمَا اَ۬لْعِلْمُ عِندَ اَ۬للَّهِ وَأُبَلِّغُكُم مَّآ أُرْسِلْتُ بِهِۦ وَلَٰكِنِّيَ أَر۪يٰكُمْ قَوْماٗ تَجْهَلُونَۖ","فَلَمَّا رَأَوْهُ عَارِضاٗ مُّسْتَقْبِلَ أَوْدِيَتِهِمْ قَالُواْ هَٰذَا عَارِضٞ مُّمْطِرُنَاۖ بَلْ هُوَ مَا اَ۪سْتَعْجَلْتُم بِهِۦۖ رِيحٞ فِيهَا عَذَابٌ اَلِيمٞۖ","تُدَمِّرُ كُلَّ شَےْءِۢ بِأَمْرِ رَبِّهَاۖ فَأَصْبَحُواْ لَا تَر۪ىٰٓ إِلَّا مَسَٰكِنَهُمْۖ كَذَٰلِكَ نَجْزِے اِ۬لْقَوْمَ اَ۬لْمُجْرِمِينَۖ","وَلَقَدْ مَكَّنَّٰهُمْ فِيمَآ إِن مَّكَّنَّٰكُمْ فِيهِ وَجَعَلْنَا لَهُمْ سَمْعاٗ وَأَبْصَٰراٗ وَأَفْـِٕدَةٗۖ فَمَآ أَغْن۪ىٰ عَنْهُمْ سَمْعُهُمْ وَلَآ أَبْصَٰرُهُمْ وَلَآ أَفْـِٕدَتُهُم مِّن شَےْءٍ اِذْ كَانُواْ يَجْحَدُونَ بِـَٔايَٰتِ اِ۬للَّهِۖ وَحَاقَ بِهِم مَّا كَانُواْ بِهِۦ يَسْتَهْزِءُونَۖ","وَلَقَدَ اَهْلَكْنَا مَا حَوْلَكُم مِّنَ اَ۬لْقُر۪ىٰ وَصَرَّفْنَا اَ۬لَايَٰتِ لَعَلَّهُمْ يَرْجِعُونَۖ","فَلَوْلَا نَصَرَهُمُ اُ۬لذِينَ اَ۪تَّخَذُواْ مِن دُونِ اِ۬للَّهِ قُرْبَاناً اٰلِهَةَۢۖ بَلْ ضَلُّواْ عَنْهُمْۖ وَذَٰلِكَ إِفْكُهُمْ وَمَا كَانُواْ يَفْتَرُونَۖ","وَإِذْ صَرَفْنَآ إِلَيْكَ نَفَراٗ مِّنَ اَ۬لْجِنِّ يَسْتَمِعُونَ اَ۬لْقُرْءَانَ فَلَمَّا حَضَرُوهُ قَالُوٓاْ أَنصِتُواْۖ فَلَمَّا قُضِيَ وَلَّوِاْ اِلَىٰ قَوْمِهِم مُّنذِرِينَۖ","قَالُواْ يَٰقَوْمَنَآ إِنَّا سَمِعْنَا كِتَٰباً ا۟نزِلَ مِنۢ بَعْدِ مُوس۪ىٰ مُصَدِّقاٗ لِّمَا بَيْنَ يَدَيْهِ يَهْدِےٓ إِلَى اَ۬لْحَقِّ وَإِلَىٰ طَرِيقٖ مُّسْتَقِيمٖۖ","يَٰقَوْمَنَآ أَجِيبُواْ دَاعِيَ اَ۬للَّهِ وَءَامِنُواْ بِهِۦ يَغْفِرْ لَكُم مِّن ذُنُوبِكُمْ وَيُجِرْكُم مِّنْ عَذَابٍ اَلِيمٖۖ","وَمَن لَّا يُجِبْ دَاعِيَ اَ۬للَّهِ فَلَيْسَ بِمُعْجِزٖ فِے اِ۬لَارْضِ وَلَيْسَ لَهُۥ مِن دُونِهِۦٓ أَوْلِيَآءُۖ اوْلَٰٓئِكَ فِے ضَلَٰلٖ مُّبِينٍۖ","۞ اَوَلَمْ يَرَوَاْ اَنَّ اَ۬للَّهَ اَ۬لذِے خَلَقَ اَ۬لسَّمَٰوَٰتِ وَالَارْضَ وَلَمْ يَعْيَ بِخَلْقِهِنَّ بِقَٰدِرٍ عَلَىٰٓ أَنْ يُّحْـِۧيَ اَ۬لْمَوْت۪ىٰ بَل۪ىٰٓۖ إِنَّهُۥ عَلَىٰ كُلِّ شَےْءٖ قَدِيرٞۖ","وَيَوْمَ يُعْرَضُ اُ۬لذِينَ كَفَرُواْ عَلَى اَ۬لنّ۪ارِ أَلَيْسَ هَٰذَا بِالْحَقِّۖ قَالُواْ بَل۪ىٰ وَرَبِّنَاۖ قَالَ فَذُوقُواْ اُ۬لْعَذَابَ بِمَا كُنتُمْ تَكْفُرُونَۖ","فَاصْبِرْ كَمَا صَبَرَ أُوْلُواْ اُ۬لْعَزْمِ مِنَ اَ۬لرُّسُلِ وَلَا تَسْتَعْجِلۖ لَّهُمْ كَأَنَّهُمْ يَوْمَ يَرَوْنَ مَا يُوعَدُونَ لَمْ يَلْبَثُوٓاْ إِلَّا سَاعَةٗ مِّن نَّه۪ارِۢ بَلَٰغٞۖ فَهَلْ يُهْلَكُ إِلَّا اَ۬لْقَوْمُ اُ۬لْفَٰسِقُونَۖ"]],["محمد",["اَ۬لذِينَ كَفَرُواْ وَصَدُّواْ عَن سَبِيلِ اِ۬للَّهِ أَضَلَّ أَعْمَٰلَهُمْۖ","وَالذِينَ ءَامَنُواْ وَعَمِلُواْ اُ۬لصَّٰلِحَٰتِ وَءَامَنُواْ بِمَا نُزِّلَ عَلَىٰ مُحَمَّدٖ وَهُوَ اَ۬لْحَقُّ مِن رَّبِّهِمْ كَفَّرَ عَنْهُمْ سَيِّـَٔاتِهِمْ وَأَصْلَحَ بَالَهُمْۖ","ذَٰلِكَ بِأَنَّ اَ۬لذِينَ كَفَرُواْ اُ۪تَّبَعُواْ اُ۬لْبَٰطِلَ وَأَنَّ اَ۬لذِينَ ءَامَنُواْ اُ۪تَّبَعُواْ اُ۬لْحَقَّ مِن رَّبِّهِمْۖ كَذَٰلِكَ يَضْرِبُ اُ۬للَّهُ لِلنَّاسِ أَمْثَٰلَهُمْۖ","فَإِذَا لَقِيتُمُ اُ۬لذِينَ كَفَرُواْ فَضَرْبَ اَ۬لرِّقَابِۖ حَتَّىٰٓ إِذَآ أَثْخَنتُمُوهُمْ فَشُدُّواْ اُ۬لْوَثَاقَۖ فَإِمَّا مَنّاَۢ بَعْدُ وَإِمَّا فِدَآءً حَتَّىٰ تَضَعَ اَ۬لْحَرْبُ أَوْزَارَهَاۖ","ذَٰلِكَ وَلَوْ يَشَآءُ اُ۬للَّهُ لَانتَصَرَ مِنْهُمْۖ وَلَٰكِن لِّيَبْلُوَاْ بَعْضَكُم بِبَعْضٖۖ وَالذِينَ قَٰتَلُواْ فِے سَبِيلِ اِ۬للَّهِ فَلَنْ يُّضِلَّ أَعْمَٰلَهُمْۖ","سَيَهْدِيهِمْ وَيُصْلِحُ بَالَهُمْ","وَيُدْخِلُهُمُ اُ۬لْجَنَّةَ عَرَّفَهَا لَهُمْۖ","يَٰٓأَيُّهَا اَ۬لذِينَ ءَامَنُوٓاْ إِن تَنصُرُواْ اُ۬للَّهَ يَنصُرْكُمْ وَيُثَبِّتَ اَقْدَامَكُمْۖ","وَالذِينَ كَفَرُواْ فَتَعْساٗ لَّهُمْ وَأَضَلَّ أَعْمَٰلَهُمْۖ","ذَٰلِكَ بِأَنَّهُمْ كَرِهُواْ مَآ أَنزَلَ اَ۬للَّهُ فَأَحْبَطَ أَعْمَٰلَهُمُۥٓۖ","۞ أَفَلَمْ يَسِيرُواْ فِے اِ۬لَارْضِ فَيَنظُرُواْ كَيْفَ كَانَ عَٰقِبَةُ اُ۬لذِينَ مِن قَبْلِهِمْ دَمَّرَ اَ۬للَّهُ عَلَيْهِمْۖ وَلِلْكٰ۪فِرِينَ أَمْثَٰلُهَاۖ","ذَٰلِكَ بِأَنَّ اَ۬للَّهَ مَوْلَى اَ۬لذِينَ ءَامَنُواْ وَأَنَّ اَ۬لْكٰ۪فِرِينَ لَا مَوْل۪ىٰ لَهُمُۥٓۖ","إِنَّ اَ۬للَّهَ يُدْخِلُ اُ۬لذِينَ ءَامَنُواْ وَعَمِلُواْ اُ۬لصَّٰلِحَٰتِ جَنَّٰتٖ تَجْرِے مِن تَحْتِهَا اَ۬لَانْهَٰرُۖ وَالذِينَ كَفَرُواْ يَتَمَتَّعُونَ وَيَاكُلُونَ كَمَا تَاكُلُ اُ۬لَانْعَٰمُ وَالنَّارُ مَثْوىٗ لَّهُمْۖ","وَكَأَيِّن مِّن قَرْيَةٍ هِيَ أَشَدُّ قُوَّةٗ مِّن قَرْيَتِكَ اَ۬لتِےٓ أَخْرَجَتْكَ أَهْلَكْنَٰهُمْ فَلَا نَاصِرَ لَهُمُۥٓۖ","أَفَمَن كَانَ عَلَىٰ بَيِّنَةٖ مِّن رَّبِّهِۦ كَمَن زُيِّنَ لَهُۥ سُوٓءُ عَمَلِهِۦ وَاتَّبَعُوٓاْ أَهْوَآءَهُمۖ","مَّثَلُ اُ۬لْجَنَّةِ اِ۬لتِے وُعِدَ اَ۬لْمُتَّقُونَ فِيهَآ أَنْهَٰرٞ مِّن مَّآءٍ غَيْرِ ءَاسِنٖ وَأَنْهَٰرٞ مِّن لَّبَنٖ لَّمْ يَتَغَيَّرْ طَعْمُهُۥ وَأَنْهَٰرٞ مِّنْ خَمْرٖ لَّذَّةٖ لِّلشَّٰرِبِينَ وَأَنْهَٰرٞ مِّنْ عَسَلٖ مُّصَفّىٗۖ وَلَهُمْ فِيهَا مِن كُلِّ اِ۬لثَّمَرَٰتِ وَمَغْفِرَةٞ مِّن رَّبِّهِمْ كَمَنْ هُوَ خَٰلِدٞ فِے اِ۬لنّ۪ارِ وَسُقُواْ مَآءً حَمِيماٗ فَقَطَّعَ أَمْعَآءَهُمْۖ","وَمِنْهُم مَّنْ يَّسْتَمِعُ إِلَيْكَ حَتَّىٰٓ إِذَا خَرَجُواْ مِنْ عِندِكَ قَالُواْ لِلذِينَ أُوتُواْ اُ۬لْعِلْمَ مَاذَا قَالَ ءَانِفاًۖ ا۟وْلَٰٓئِكَ اَ۬لذِينَ طَبَعَ اَ۬للَّهُ عَلَىٰ قُلُوبِهِمْ وَاتَّبَعُوٓاْ أَهْوَآءَهُمْۖ","وَالذِينَ اَ۪هْتَدَوْاْ زَادَهُمْ هُدىٗ وَءَات۪يٰهُمْ تَقْو۪يٰهُمْۖ","فَهَلْ يَنظُرُونَ إِلَّا اَ۬لسَّاعَةَ أَن تَاتِيَهُم بَغْتَةٗ فَقَدْ جَآءَ اشْرَاطُهَاۖ فَأَنّ۪ىٰ لَهُمُۥٓ إِذَا جَآءَتْهُمْ ذِكْر۪يٰهُمْۖ","فَاعْلَمَ اَنَّهُۥ لَآ إِلَٰهَ إِلَّا اَ۬للَّهُ وَاسْتَغْفِرْ لِذَنۢبِكَ وَلِلْمُومِنِينَ وَالْمُومِنَٰتِۖ وَاللَّهُ يَعْلَمُ مُتَقَلَّبَكُمْ وَمَثْو۪يٰكُمْۖ","۞ وَيَقُولُ اُ۬لذِينَ ءَامَنُواْ لَوْلَا نُزِّلَتْ سُورَةٞۖ فَإِذَآ أُنزِلَتْ سُورَةٞ مُّحْكَمَةٞ وَذُكِرَ فِيهَا اَ۬لْقِتَالُ رَأَيْتَ اَ۬لذِينَ فِے قُلُوبِهِم مَّرَضٞ يَنظُرُونَ إِلَيْكَ نَظَرَ اَ۬لْمَغْشِيِّ عَلَيْهِ مِنَ اَ
