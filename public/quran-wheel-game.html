تَوَفِّيكَ وَرَافِعُكَ إِلَيَّ وَمُطَهِّرُكَ مِنَ اَ۬لذِينَ كَفَرُواْۖ وَجَاعِلُ اُ۬لذِينَ اَ۪تَّبَعُوكَ فَوْقَ اَ۬لذِينَ كَفَرُوٓاْ إِلَىٰ يَوْمِ اِ۬لْقِيَٰمَةِۖ ثُمَّ إِلَيَّ مَرْجِعُكُمْ فَأَحْكُمُ بَيْنَكُمْ فِيمَا كُنتُمْ فِيهِ تَخْتَلِفُونَۖ","فَأَمَّا اَ۬لذِينَ كَفَرُواْ فَأُعَذِّبُهُمْ عَذَاباٗ شَدِيداٗ فِے اِ۬لدُّنْي۪ا وَالَاخِرَةِۖ وَمَا لَهُم مِّن نَّٰصِرِينَۖ","وَأَمَّا اَ۬لذِينَ ءَامَنُواْ وَعَمِلُواْ اُ۬لصَّٰلِحَٰتِ فَنُوَفِّيهِمُۥٓ أُجُورَهُمْۖ وَاللَّهُ لَا يُحِبُّ اُ۬لظَّٰلِمِينَۖ","ذَٰلِكَ نَتْلُوهُ عَلَيْكَ مِنَ اَ۬لَايَٰتِ وَالذِّكْرِ اِ۬لْحَكِيمِۖ","إِنَّ مَثَلَ عِيس۪ىٰ عِندَ اَ۬للَّهِ كَمَثَلِ ءَادَمَۖ خَلَقَهُۥ مِن تُرَابٖ ثُمَّ قَالَ لَهُۥ كُنۖ فَيَكُونُۖ","اُ۬لْحَقُّ مِن رَّبِّكَۖ فَلَا تَكُن مِّنَ اَ۬لْمُمْتَرِينَۖ","فَمَنْ حَآجَّكَ فِيهِ مِنۢ بَعْدِ مَا جَآءَكَ مِنَ اَ۬لْعِلْمِ فَقُلْ تَعَالَوْاْ نَدْعُ أَبْنَآءَنَا وَأَبْنَآءَكُمْ وَنِسَآءَنَا وَنِسَآءَكُمْ وَأَنفُسَنَا وَأَنفُسَكُمْ ثُمَّ نَبْتَهِلْ فنَجْعَل لَّعْنَتَ اَ۬للَّهِ عَلَى اَ۬لْكَٰذِبِينَۖ","إِنَّ هَٰذَا لَهُوَ اَ۬لْقَصَصُ اُ۬لْحَقُّۖ وَمَا مِنِ اِلَٰهٍ اِلَّا اَ۬للَّهُۖ وَإِنَّ اَ۬للَّهَ لَهُوَ اَ۬لْعَزِيزُ اُ۬لْحَكِيمُۖ","فَإِن تَوَلَّوْاْ فَإِنَّ اَ۬للَّهَ عَلِيمُۢ بِالْمُفْسِدِينَۖ","۞ قُلْ يَٰٓأَهْلَ اَ۬لْكِتَٰبِ تَعَالَوِاْ اِلَىٰ كَلِمَةٖ سَوَآءِۢ بَيْنَنَا وَبَيْنَكُمُۥٓ أَلَّا نَعْبُدَ إِلَّا اَ۬للَّهَ وَلَا نُشْرِكَ بِهِۦ شَئْاٗ وَلَا يَتَّخِذَ بَعْضُنَا بَعْضاً اَرْبَاباٗ مِّن دُونِ اِ۬للَّهِۖ فَإِن تَوَلَّوْاْ فَقُولُواْ اُ۪شْهَدُواْ بِأَنَّا مُسْلِمُونَۖ","يَٰٓأَهْلَ اَ۬لْكِتَٰبِ لِمَ تُحَآجُّونَ فِےٓ إِبْرَٰهِيمَۖ وَمَآ أُنزِلَتِ اِ۬لتَّوْر۪يٰةُ وَالِانجِيلُ إِلَّا مِنۢ بَعْدِهِۦٓۖ أَفَلَا تَعْقِلُونَۖ","هَآنتُمْ هَٰٓؤُلَآءِ حَٰجَجْتُمْ فِيمَا لَكُم بِهِۦ عِلْمٞ فَلِمَ تُحَآجُّونَ فِيمَا لَيْسَ لَكُم بِهِۦ عِلْمٞۖ وَاللَّهُ يَعْلَمُۖ وَأَنتُمْ لَا تَعْلَمُونَۖ","مَا كَانَ إِبْرَٰهِيمُ يَهُودِيّاٗ وَلَا نَصْرَانِيّاٗ وَلَٰكِن كَانَ حَنِيفاٗ مُّسْلِماٗۖ وَمَا كَانَ مِنَ اَ۬لْمُشْرِكِينَۖ","إِنَّ أَوْلَى اَ۬لنَّاسِ بِإِبْرَٰهِيمَ لَلذِينَ اَ۪تَّبَعُوهُ وَهَٰذَا اَ۬لنَّبِےٓءُ وَالذِينَ ءَامَنُواْۖ وَاللَّهُ وَلِيُّ اُ۬لْمُومِنِينَۖ","وَدَّت طَّآئِفَةٞ مِّنَ اَهْلِ اِ۬لْكِتَٰبِ لَوْ يُضِلُّونَكُمْۖ وَمَا يُضِلُّونَ إِلَّآ أَنفُسَهُمْ وَمَا يَشْعُرُونَۖ","يَٰٓأَهْلَ اَ۬لْكِتَٰبِ لِمَ تَكْفُرُونَ بِـَٔايَٰتِ اِ۬للَّهِ وَأَنتُمْ تَشْهَدُونَۖ","يَٰٓأَهْلَ اَ۬لْكِتَٰبِ لِمَ تَلْبِسُونَ اَ۬لْحَقَّ بِالْبَٰطِلِ وَتَكْتُمُونَ اَ۬لْحَقَّ وَأَنتُمْ تَعْلَمُونَۖ","وَقَالَت طَّآئِفَةٞ مِّنَ اَهْلِ اِ۬لْكِتَٰبِ ءَامِنُواْ بِالذِےٓ أُنزِلَ عَلَى اَ۬لذِينَ ءَامَنُواْ وَجْهَ اَ۬لنَّه۪ارِ وَاكْفُرُوٓاْ ءَاخِرَهُۥ لَعَلَّهُمْ يَرْجِعُونَۖ","وَلَا تُومِنُوٓاْ إِلَّا لِمَن تَبِعَ دِينَكُمْۖ قُلِ اِنَّ اَ۬لْهُد۪ىٰ هُدَى اَ۬للَّهِ أَنْ يُّوت۪ىٰٓ أَحَدٞ مِّثْلَ مَآ أُوتِيتُمُۥٓ أَوْ يُحَآجُّوكُمْ عِندَ رَبِّكُمْۖ قُلِ اِنَّ اَ۬لْفَضْلَ بِيَدِ اِ۬للَّهِۖ يُوتِيهِ مَنْ يَّشَآءُۖ وَاللَّهُ وَٰسِعٌ عَلِيمٞۖ","يَخْتَصُّ بِرَحْمَتِهِۦ مَنْ يَّشَآءُۖ وَاللَّهُ ذُو اُ۬لْفَضْلِ اِ۬لْعَظِيمِۖ","۞ وَمِنَ اَهْلِ اِ۬لْكِتَٰبِ مَنِ اِن تَامَنْهُ بِقِنط۪ارٖ يُوَ۬دِّهِۦٓ إِلَيْكَۖ وَمِنْهُم مَّنِ اِن تَامَنْهُ بِدِين۪ارٖ لَّا يُوَ۬دِّهِۦٓ إِلَيْكَ إِلَّا مَا دُمْتَ عَلَيْهِ قَآئِماٗۖ ذَٰلِكَ بِأَنَّهُمْ قَالُواْ لَيْسَ عَلَيْنَا فِے اِ۬لُامِّيِّۧنَ سَبِيلٞۖ وَيَقُولُونَ عَلَى اَ۬للَّهِ اِ۬لْكَذِبَ وَهُمْ يَعْلَمُونَۖ","بَل۪ىٰ مَنَ اَوْف۪ىٰ بِعَهْدِهِۦ وَاتَّق۪ىٰ فَإِنَّ اَ۬للَّهَ يُحِبُّ اُ۬لْمُتَّقِينَۖ","إِنَّ اَ۬لذِينَ يَشْتَرُونَ بِعَهْدِ اِ۬للَّهِ وَأَيْمَٰنِهِمْ ثَمَناٗ قَلِيلاً ا۟وْلَٰٓئِكَ لَا خَلَٰقَ لَهُمْ فِے اِ۬لَاخِرَةِ وَلَا يُكَلِّمُهُمُ اُ۬للَّهُ وَلَا يَنظُرُ إِلَيْهِمْ يَوْمَ اَ۬لْقِيَٰمَةِ وَلَا يُزَكِّيهِمْۖ وَلَهُمْ عَذَابٌ اَلِيمٞۖ","وَإِنَّ مِنْهُمْ لَفَرِيقاٗ يَلْوُۥنَ أَلْسِنَتَهُم بِالْكِتَٰبِ لِتَحْسِبُوهُ مِنَ اَ۬لْكِتَٰبِ وَمَا هُوَ مِنَ اَ۬لْكِتَٰبِۖ وَيَقُولُونَ هُوَ مِنْ عِندِ اِ۬للَّهِۖ وَمَا هُوَ مِنْ عِندِ اِ۬للَّهِۖ وَيَقُولُونَ عَلَى اَ۬للَّهِ اِ۬لْكَذِبَ وَهُمْ يَعْلَمُونَۖ","مَا كَانَ لِبَشَرٍ اَنْ يُّوتِيَهُ اُ۬للَّهُ اُ۬لْكِتَٰبَ وَالْحُكْمَ وَالنُّبُوٓءَةَ ثُمَّ يَقُولَ لِلنَّاسِ كُونُواْ عِبَاداٗ لِّے مِن دُونِ اِ۬للَّهِ وَلَٰكِن كُونُواْ رَبَّٰنِيِّۧنَ بِمَا كُنتُمْ تَعْلَمُونَ اَ۬لْكِتَٰبَ وَبِمَا كُنتُمْ تَدْرُسُونَۖ","وَلَا يَامُرُكُمُۥٓ أَن تَتَّخِذُواْ اُ۬لْمَلَٰٓئِكَةَ وَالنَّبِيٓـِٕۧنَ أَرْبَاباًۖ اَيَامُرُكُم بِالْكُفْرِ بَعْدَ إِذَ اَنتُم مُّسْلِمُونَۖ","وَإِذَ اَخَذَ اَ۬للَّهُ مِيثَٰقَ اَ۬لنَّبِيٓـِٕۧنَ لَمَآ ءَاتَيْنَٰكُم مِّن كِتَٰبٖ وَحِكْمَةٖ ثُمَّ جَآءَكُمْ رَسُولٞ مُّصَدِّقٞ لِّمَا مَعَكُمْ لَتُومِنُنَّ بِهِۦ وَلَتَنصُرُنَّهُۥۖ ۞ قَالَ ءَآقْرَرْتُمْ وَأَخَذتُّمْ عَلَىٰ ذَٰلِكُمُۥٓ إِصْرِےۖ قَالُوٓاْ أَقْرَرْنَاۖ قَالَ فَاشْهَدُواْ وَأَنَا مَعَكُم مِّنَ اَ۬لشَّٰهِدِينَۖ","فَمَن تَوَلّ۪ىٰ بَعْدَ ذَٰلِكَ فَأُوْلَٰٓئِكَ هُمُ اُ۬لْفَٰسِقُونَۖ","أَفَغَيْرَ دِينِ اِ۬للَّهِ تَبْغُونَ وَلَهُۥٓ أَسْلَمَ مَن فِے اِ۬لسَّمَٰوَٰتِ وَالَارْضِ طَوْعاٗ وَكَرْهاٗۖ وَإِلَيْهِ تُرْجَعُونَۖ","قُلَ اٰمَنَّا بِاللَّهِ وَمَآ أُنزِلَ عَلَيْنَا وَمَآ أُنزِلَ عَلَىٰٓ إِبْرَٰهِيمَ وَإِسْمَٰعِيلَ وَإِسْحَٰقَ وَيَعْقُوبَ وَالَاسْبَاطِ وَمَآ أُوتِيَ مُوس۪ىٰ وَعِيس۪ىٰ وَالنَّبِيٓـُٔونَ مِن رَّبِّهِمْ لَا نُفَرِّقُ بَيْنَ أَحَدٖ مِّنْهُمْ وَنَحْنُ لَهُۥ مُسْلِمُونَۖ","وَمَنْ يَّبْتَغِ غَيْرَ اَ۬لِاسْلَٰمِ دِيناٗ فَلَنْ يُّقْبَلَ مِنْهُۖ وَهُوَ فِے اِ۬لَاخِرَةِ مِنَ اَ۬لْخَٰسِرِينَۖ","كَيْفَ يَهْدِے اِ۬للَّهُ قَوْماٗ كَفَرُواْ بَعْدَ إِيمَٰنِهِمْ وَشَهِدُوٓاْ أَنَّ اَ۬لرَّسُولَ حَقّٞ وَجَآءَهُمُ اُ۬لْبَيِّنَٰتُۖ وَاللَّهُ لَا يَهْدِے اِ۬لْقَوْمَ اَ۬لظَّٰلِمِينَۖ","أُوْلَٰٓئِكَ جَزَآؤُهُمُۥٓ أَنَّ عَلَيْهِمْ لَعْنَةَ اَ۬للَّهِ وَالْمَلَٰٓئِكَةِ وَالنَّاسِ أَجْمَعِينَ","خَٰلِدِينَ فِيهَا لَا يُخَفَّفُ عَنْهُمُ اُ۬لْعَذَابُ وَلَا هُمْ يُنظَرُونَ","إِلَّا اَ۬لذِينَ تَابُواْ مِنۢ بَعْدِ ذَٰلِكَ وَأَصْلَحُواْ فَإِنَّ اَ۬للَّهَ غَفُورٞ رَّحِيمٌۖ","اِنَّ اَ۬لذِينَ كَفَرُواْ بَعْدَ إِيمَٰنِهِمْ ثُمَّ اَ۪زْدَادُواْ كُفْراٗ لَّن تُقْبَلَ تَوْبَتُهُمْۖ وَأُوْلَٰٓئِكَ هُمُ اُ۬لضَّآلُّونَۖ","إِنَّ اَ۬لذِينَ كَفَرُواْ وَمَاتُواْ وَهُمْ كُفَّارٞ فَلَنْ يُّقْبَلَ مِنَ اَحَدِهِم مِّلْءُ اُ۬لَارْضِ ذَهَباٗ وَلَوِ اِ۪فْتَد۪ىٰ بِهِۦٓۖ أُوْلَٰٓئِكَ لَهُمْ عَذَابٌ اَلِيمٞۖ وَمَا لَهُم مِّن نَّٰصِرِينَۖ","۞ لَن تَنَالُواْ اُ۬لْبِرَّ حَتَّىٰ تُنفِقُواْ مِمَّا تُحِبُّونَۖ","وَمَا تُنفِقُواْ مِن شَےْءٖ فَإِنَّ اَ۬للَّهَ بِهِۦ عَلِيمٞۖ","كُلُّ اُ۬لطَّعَامِ كَانَ حِلّاٗ لِّبَنِےٓ إِسْرَآءِيلَ إِلَّا مَا حَرَّمَ إِسْرَآءِيلُ عَلَىٰ نَفْسِهِۦ مِن قَبْلِ أَن تُنَزَّلَ اَ۬لتَّوْر۪يٰةُۖ قُلْ فَاتُواْ بِالتَّوْر۪يٰةِ فَاتْلُوهَآ إِن كُنتُمْ صَٰدِقِينَۖ","فَمَنِ اِ۪فْتَر۪ىٰ عَلَى اَ۬للَّهِ اِ۬لْكَذِبَ مِنۢ بَعْدِ ذَٰلِكَ فَأُوْلَٰٓئِكَ هُمُ اُ۬لظَّٰلِمُونَۖ","قُلْ صَدَقَ اَ۬للَّهُۖ فَاتَّبِعُواْ مِلَّةَ إِبْرَٰهِيمَ حَنِيفاٗۖ وَمَا كَانَ مِنَ اَ۬لْمُشْرِكِينَۖ","إِنَّ أَوَّلَ بَيْتٖ وُضِعَ لِلنَّاسِ لَلذِے بِبَكَّةَ مُبَٰرَكاٗ وَهُدىٗ لِّلْعَٰلَمِينَ","فِيهِ ءَايَٰتُۢ بَيِّنَٰتٞۖ مَّقَامُ إِبْرَٰهِيمَۖ وَمَن دَخَلَهُۥ كَانَ ءَامِناٗۖ وَلِلهِ عَلَى اَ۬لنَّاسِ حَجُّ اُ۬لْبَيْتِ مَنِ اِ۪سْتَطَاعَ إِلَيْهِ سَبِيلاٗۖ وَمَن كَفَرَ فَإِنَّ اَ۬للَّهَ غَنِيٌّ عَنِ اِ۬لْعَٰلَمِينَۖ","قُلْ يَٰٓأَهْلَ اَ۬لْكِتَٰبِ لِمَ تَكْفُرُونَ بِـَٔايَٰتِ اِ۬للَّهِ وَاللَّهُ شَهِيدٌ عَلَىٰ مَا تَعْمَلُونَۖ","قُلْ يَٰٓأَهْلَ اَ۬لْكِتَٰبِ لِمَ تَصُدُّونَ عَن سَبِيلِ اِ۬للَّهِ مَنَ اٰمَنَ تَبْغُونَهَا عِوَجاٗ وَأَنتُمْ شُهَدَآءُۖ وَمَا اَ۬للَّهُ بِغَٰفِلٍ عَمَّا تَعْمَلُونَۖ","يَٰٓأَيُّهَا اَ۬لذِينَ ءَامَنُوٓاْ إِن تُطِيعُواْ فَرِيقاٗ مِّنَ اَ۬لذِينَ أُوتُواْ اُ۬لْكِتَٰبَ يَرُدُّوكُم بَعْدَ إِيمَٰنِكُمْ كٰ۪فِرِينَۖ","وَكَيْفَ تَكْفُرُونَ وَأَنتُمْ تُتْل۪ىٰ عَلَيْكُمُۥٓ ءَايَٰتُ اُ۬للَّهِ وَفِيكُمْ رَسُولُهُۥۖ وَمَنْ يَّعْتَصِم بِاللَّهِ فَقَدْ هُدِيَ إِلَىٰ صِرَٰطٖ مُّسْتَقِيمٖۖ","يَٰٓأَيُّهَا اَ۬لذِينَ ءَامَنُواْ اُ۪تَّقُواْ اُ۬للَّهَ حَقَّ تُق۪اتِهِۦۖ وَلَا تَمُوتُنَّ إِلَّا وَأَنتُم مُّسْلِمُونَۖ","۞ وَاعْتَصِمُواْ بِحَبْلِ اِ۬للَّهِ جَمِيعاٗۖ وَلَا تَفَرَّقُواْۖ وَاذْكُرُواْ نِعْمَتَ اَ۬للَّهِ عَلَيْكُمُۥٓ إِذْ كُنتُمُۥٓ أَعْدَآءٗ فَأَلَّفَ بَيْنَ قُلُوبِكُمْ فَأَصْبَحْتُم بِنِعْمَتِهِۦٓ إِخْوَٰناٗۖ وَكُنتُمْ عَلَىٰ شَفَا حُفْرَةٖ مِّنَ اَ۬لنّ۪ارِ فَأَنقَذَكُم مِّنْهَاۖ كَذَٰلِكَ يُبَيِّنُ اُ۬للَّهُ لَكُمُۥٓ ءَايَٰتِهِۦ لَعَلَّكُمْ تَهْتَدُونَۖ","وَلْتَكُن مِّنكُمُۥٓ أُمَّةٞ يَدْعُونَ إِلَى اَ۬لْخَيْرِ وَيَامُرُونَ بِالْمَعْرُوفِ وَيَنْهَوْنَ عَنِ اِ۬لْمُنكَرِۖ وَأُوْلَٰٓئِكَ هُمُ اُ۬لْمُفْلِحُونَۖ","وَلَا تَكُونُواْ كَالذِينَ تَفَرَّقُواْ وَاخْتَلَفُواْ مِنۢ بَعْدِ مَا جَآءَهُمُ اُ۬لْبَيِّنَٰتُۖ وَأُوْلَٰٓئِكَ لَهُمْ عَذَابٌ عَظِيمٞ","يَوْمَ تَبْيَضُّ وُجُوهٞ وَتَسْوَدُّ وُجُوهٞۖ فَأَمَّا اَ۬لذِينَ اَ۪سْوَدَّتْ وُجُوهُهُمُۥٓ أَكَفَرْتُم بَعْدَ إِيمَٰنِكُمْ فَذُوقُواْ اُ۬لْعَذَابَ بِمَا كُنتُمْ تَكْفُرُونَۖ","وَأَمَّا اَ۬لذِينَ اَ۪بْيَضَّتْ وُجُوهُهُمْ فَفِے رَحْمَةِ اِ۬للَّهِۖ هُمْ فِيهَا خَٰلِدُونَۖ","تِلْكَ ءَايَٰتُ اُ۬للَّهِ نَتْلُوهَا عَلَيْكَ بِالْحَقِّۖ وَمَا اَ۬للَّهُ يُرِيدُ ظُلْماٗ لِّلْعَٰلَمِينَۖ","وَلِلهِ مَا فِے اِ۬لسَّمَٰوَٰتِ وَمَا فِے اِ۬لَارْضِۖ وَإِلَى اَ۬للَّهِ تُرْجَعُ اُ۬لُامُورُۖ","كُنتُمْ خَيْرَ أُمَّةٍ ا۟خْرِجَتْ لِلنَّاسِ تَامُرُونَ بِالْمَعْرُوفِ وَتَنْهَوْنَ عَنِ اِ۬لْمُنكَرِ وَتُومِنُونَ بِاللَّهِۖ وَلَوَ اٰمَنَ أَهْلُ اُ۬لْكِتَٰبِ لَكَانَ خَيْراٗ لَّهُمۖ مِّنْهُمُ اُ۬لْمُومِنُونَۖ وَأَكْثَرُهُمُ اُ۬لْفَٰسِقُونَۖ","لَنْ يَّضُرُّوكُمُۥٓۖ إِلَّآ أَذىٗۖ وَإِنْ يُّقَٰتِلُوكُمْ يُوَلُّوكُمُ اُ۬لَادْبَٰرَۖ ثُمَّ لَا يُنصَرُونَۖ","ضُرِبَتْ عَلَيْهِمُ اُ۬لذِّلَّةُ أَيْنَ مَا ثُقِفُوٓاْۖ إِلَّا بِحَبْلٖ مِّنَ اَ۬للَّهِ وَحَبْلٖ مِّنَ اَ۬لنَّاسِ وَبَآءُو بِغَضَبٖ مِّنَ اَ۬للَّهِۖ وَضُرِبَتْ عَلَيْهِمُ اُ۬لْمَسْكَنَةُۖ ذَٰلِكَ بِأَنَّهُمْ كَانُواْ يَكْفُرُونَ بِـَٔايَٰتِ اِ۬للَّهِ وَيَقْتُلُونَ اَ۬لَانۢبِئَآءَ بِغَيْرِ حَقّٖۖ ذَٰلِكَ بِمَا عَصَواْ وَّكَانُواْ يَعْتَدُونَۖ","۞ لَيْسُواْ سَوَآءٗۖ مِّنَ اَهْلِ اِ۬لْكِتَٰبِ أُمَّةٞ قَآئِمَةٞ يَتْلُونَ ءَايَٰتِ اِ۬للَّهِ ءَانَآءَ اَ۬ليْلِ وَهُمْ يَسْجُدُونَۖ","يُومِنُونَ بِاللَّهِ وَالْيَوْمِ اِ۬لَاخِرِ وَيَامُرُونَ بِالْمَعْرُوفِ وَيَنْهَوْنَ عَنِ اِ۬لْمُنكَرِ وَيُسَٰرِعُونَ فِے اِ۬لْخَيْرَٰتِۖ وَأُوْلَٰٓئِكَ مِنَ اَ۬لصَّٰلِحِينَۖ","وَمَا تَفْعَلُواْ مِنْ خَيْرٖ فَلَن تُكْفَرُوهُۖ وَاللَّهُ عَلِيمُۢ بِالْمُتَّقِينَۖ","إِنَّ اَ۬لذِينَ كَفَرُواْ لَن تُغْنِيَ عَنْهُمُۥٓ أَمْوَٰلُهُمْ وَلَآ أَوْلَٰدُهُم مِّنَ اَ۬للَّهِ شَئْاٗۖ وَأُوْلَٰٓئِكَ أَصْحَٰبُ اُ۬لنّ۪ارِ هُمْ فِيهَا خَٰلِدُونَۖ","مَثَلُ مَا يُنفِقُونَ فِے هَٰذِهِ اِ۬لْحَيَوٰةِ اِ۬لدُّنْي۪ا كَمَثَلِ رِيحٖ فِيهَا صِرٌّ اَصَابَتْ حَرْثَ قَوْمٖ ظَلَمُوٓاْ أَنفُسَهُمْ فَأَهْلَكَتْهُۖ وَمَا ظَلَمَهُمُ اُ۬للَّهُۖ وَلَٰكِنَ اَنفُسَهُمْ يَظْلِمُونَۖ","يَٰٓأَيُّهَا اَ۬لذِينَ ءَامَنُواْ لَا تَتَّخِذُواْ بِطَانَةٗ مِّن دُونِكُمْ لَا يَالُونَكُمْ خَبَالاٗ وَدُّواْ مَا عَنِتُّمْۖ قَدْ بَدَتِ اِ۬لْبَغْضَآءُ مِنَ اَفْوَٰهِهِمْ وَمَا تُخْفِے صُدُورُهُمُۥٓ أَكْبَرُۖ قَدْ بَيَّنَّا لَكُمُ اُ۬لَايَٰتِ إِن كُنتُمْ تَعْقِلُونَۖ","هَآنتُمُۥٓ أُوْلَآءِ تُحِبُّونَهُمْ وَلَا يُحِبُّونَكُمْ وَتُومِنُونَ بِالْكِتَٰبِ كُلِّهِۖۦ وَإِذَا لَقُوكُمْ قَالُوٓاْ ءَامَنَّاۖ وَإِذَا خَلَوْاْ عَضُّواْ عَلَيْكُمُ اُ۬لَانَامِلَ مِنَ اَ۬لْغَيْظِۖ قُلْ مُوتُواْ بِغَيْظِكُمُۥٓۖ إِنَّ اَ۬للَّهَ عَلِيمُۢ بِذَاتِ اِ۬لصُّدُورِۖ","إِن تَمْسَسْكُمْ حَسَنَةٞ تَسُؤْهُمْۖ وَإِن تُصِبْكُمْ سَيِّئَةٞ يَفْرَحُواْ بِهَاۖ وَإِن تَصْبِرُواْ وَتَتَّقُواْ لَا يَضِرْكُمْ كَيْدُهُمْ شَئْاًۖ اِنَّ اَ۬للَّهَ بِمَا يَعْمَلُونَ مُحِيطٞۖ","۞ وَإِذْ غَدَوْتَ مِنَ اَهْلِكَ تُبَوِّۓُ اُ۬لْمُومِنِينَ مَقَٰعِدَ لِلْقِتَالِۖ وَاللَّهُ سَمِيعٌ عَلِيمٌۖ","اِذْ هَمَّت طَّآئِفَتَٰنِ مِنكُمُۥٓ أَن تَفْشَلَا وَاللَّهُ وَلِيُّهُمَاۖ وَعَلَى اَ۬للَّهِ فَلْيَتَوَكَّلِ اِ۬لْمُومِنُونَۖ","وَلَقَدْ نَصَرَكُمُ اُ۬للَّهُ بِبَدْرٖ وَأَنتُمُۥٓ أَذِلَّةٞۖ فَاتَّقُواْ اُ۬للَّهَ لَعَلَّكُمْ تَشْكُرُونَۖ","إِذْ تَقُولُ لِلْمُومِنِينَ أَلَنْ يَّكْفِيَكُمُۥٓ أَنْ يُّمِدَّكُمْ رَبُّكُم بِثَلَٰثَةِ ءَالَٰفٖ مِّنَ اَ۬لْمَلَٰٓئِكَةِ مُنزَلِينَۖ","بَل۪ىٰٓ إِن تَصْبِرُواْ وَتَتَّقُواْ وَيَاتُوكُم مِّن فَوْرِهِمْ هَٰذَا يُمْدِدْكُمْ رَبُّكُم بِخَمْسَةِ ءَالَٰفٖ مِّنَ اَ۬لْمَلَٰٓئِكَةِ مُسَوَّمِينَۖ","وَمَا جَعَلَهُ اُ۬للَّهُ إِلَّا بُشْر۪ىٰ لَكُمْ وَلِتَطْمَئِنَّ قُلُوبُكُم بِهِۦۖ وَمَا اَ۬لنَّصْرُ إِلَّا مِنْ عِندِ اِ۬للَّهِ اِ۬لْعَزِيزِ اِ۬لْحَكِيمِ","لِيَقْطَعَ طَرَفاٗ مِّنَ اَ۬لذِينَ كَفَرُوٓاْ أَوْ يَكْبِتَهُمْ فَيَنقَلِبُواْ خَآئِبِينَ","لَيْسَ لَكَ مِنَ اَ۬لَامْرِ شَےْءٌ اَوْ يَتُوبَ عَلَيْهِمُۥٓ أَوْ يُعَذِّبَهُمْ فَإِنَّهُمْ ظَٰلِمُونَۖ","وَلِلهِ مَا فِے اِ۬لسَّمَٰوَٰتِ وَمَا فِے اِ۬لَارْضِۖ يَغْفِرُ لِمَنْ يَّشَآءُ وَيُعَذِّبُ مَنْ يَّشَآءُۖ وَاللَّهُ غَفُورٞ رَّحِيمٞۖ","يَٰٓأَيُّهَا اَ۬لذِينَ ءَامَنُواْ لَا تَاكُلُواْ اُ۬لرِّبَوٰٓاْ أَضْعَٰفاٗ مُّضَٰعَفَةٗۖ وَاتَّقُواْ اُ۬للَّهَ لَعَلَّكُمْ تُفْلِحُونَۖ","وَاتَّقُواْ اُ۬لنَّارَ اَ۬لتِےٓ أُعِدَّتْ لِلْكٰ۪فِرِينَۖ","وَأَطِيعُواْ اُ۬للَّهَ وَالرَّسُولَ لَعَلَّكُمْ تُرْحَمُونَۖ","۞ سَارِعُوٓاْ إِلَىٰ مَغْفِرَةٖ مِّن رَّبِّكُمْ وَجَنَّةٍ عَرْضُهَا اَ۬لسَّمَٰوَٰتُ وَالَارْضُ أُعِدَّتْ لِلْمُتَّقِينَ","اَ۬لذِينَ يُنفِقُونَ فِے اِ۬لسَّرَّآءِ وَالضَّرَّآءِ وَالْكَٰظِمِينَ اَ۬لْغَيْظَ وَالْعَافِينَ عَنِ اِ۬لنَّاسِۖ وَاللَّهُ يُحِبُّ اُ۬لْمُحْسِنِينَۖ","وَالذِينَ إِذَا فَعَلُواْ فَٰحِشَةً اَوْ ظَلَمُوٓاْ أَنفُسَهُمْ ذَكَرُواْ اُ۬للَّهَ فَاسْتَغْفَرُواْ لِذُنُوبِهِمْۖ وَمَنْ يَّغْفِرُ اُ۬لذُّنُوبَ إِلَّا اَ۬للَّهُۖ وَلَمْ يُصِرُّواْ عَلَىٰ مَا فَعَلُواْ وَهُمْ يَعْلَمُونَۖ","أُوْلَٰٓئِكَ جَزَآؤُهُم مَّغْفِرَةٞ مِّن رَّبِّهِمْ وَجَنَّٰتٞ تَجْرِے مِن تَحْتِهَا اَ۬لَانْهَٰرُ خَٰلِدِينَ فِيهَاۖ وَنِعْمَ أَجْرُ اُ۬لْعَٰمِلِينَۖ","قَدْ خَلَتْ مِن قَبْلِكُمْ سُنَنٞۖ فَسِيرُواْ فِے اِ۬لَارْضِ فَانظُرُواْ كَيْفَ كَانَ عَٰقِبَةُ اُ۬لْمُكَذِّبِينَۖ","هَٰذَا بَيَانٞ لِّلنَّاسِ وَهُدىٗ وَمَوْعِظَةٞ لِّلْمُتَّقِينَۖ","وَلَا تَهِنُواْ وَلَا تَحْزَنُواْ وَأَنتُمُ اُ۬لَاعْلَوْنَ إِن كُنتُم مُّومِنِينَۖ","إِنْ يَّمْسَسْكُمْ قَرْحٞ فَقَدْ مَسَّ اَ۬لْقَوْمَ قَرْحٞ مِّثْلُهُۥۖ وَتِلْكَ اَ۬لَايَّامُ نُدَاوِلُهَا بَيْنَ اَ۬لنَّاسِۖ وَلِيَعْلَمَ اَ۬للَّهُ اُ۬لذِينَ ءَامَنُواْ وَيَتَّخِذَ مِنكُمْ شُهَدَآءَۖ وَاللَّهُ لَا يُحِبُّ اُ۬لظَّٰلِمِينَۖ","وَلِيُمَحِّصَ اَ۬للَّهُ اُ۬لذِينَ ءَامَنُواْ وَيَمْحَقَ اَ۬لْكٰ۪فِرِينَۖ","أَمْ حَسِبْتُمُۥٓ أَن تَدْخُلُواْ اُ۬لْجَنَّةَ وَلَمَّا يَعْلَمِ اِ۬للَّهُ اُ۬لذِينَ جَٰهَدُواْ مِنكُمْ وَيَعْلَمَ اَ۬لصَّٰبِرِينَۖ","وَلَقَدْ كُنتُمْ تَمَنَّوْنَ اَ۬لْمَوْتَ مِن قَبْلِ أَن تَلْقَوْهُ فَقَدْ رَأَيْتُمُوهُ وَأَنتُمْ تَنظُرُونَۖ","۞ وَمَا مُحَمَّدٌ اِلَّا رَسُولٞ قَدْ خَلَتْ مِن قَبْلِهِ اِ۬لرُّسُلُۖ أَفَإِيْن مَّاتَ أَوْ قُتِلَ اَ۪نقَلَبْتُمْ عَلَىٰٓ أَعْقَٰبِكُمْۖ وَمَنْ يَّنقَلِبْ عَلَىٰ عَقِبَيْهِ فَلَنْ يَّضُرَّ اَ۬للَّهَ شَئْاٗۖ وَسَيَجْزِے اِ۬للَّهُ اُ۬لشَّٰكِرِينَۖ","وَمَا كَانَ لِنَفْسٍ اَن تَمُوتَ إِلَّا بِإِذْنِ اِ۬للَّهِۖ كِتَٰباٗ مُّوَ۬جَّلاٗۖ وَمَنْ يُّرِدْ ثَوَابَ اَ۬لدُّنْي۪ا نُوتِهِۦ مِنْهَاۖ وَمَنْ يُّرِدْ ثَوَابَ اَ۬لَاخِرَةِ نُوتِهِۦ مِنْهَاۖ وَسَنَجْزِے اِ۬لشَّٰكِرِينَۖ","وَكَأَيِّن مِّن نَّبِےٓءٖ قُتِلَۖ مَعَهُۥ رِبِّيُّونَ كَثِيرٞۖ فَمَا وَهَنُواْ لِمَآ أَصَابَهُمْ فِے سَبِيلِ اِ۬للَّهِ وَمَا ضَعُفُواْ وَمَا اَ۪سْتَكَانُواْۖ وَاللَّهُ يُحِبُّ اُ۬لصَّٰبِرِينَۖ","وَمَا كَانَ قَوْلَهُمُۥٓ إِلَّآ أَن قَالُواْ رَبَّنَا اَ۪غْفِرْ لَنَا ذُنُوبَنَا وَإِسْرَافَنَا فِےٓ أَمْرِنَا وَثَبِّتَ اَقْدَامَنَا وَانصُرْنَا عَلَى اَ۬لْقَوْمِ اِ۬لْكٰ۪فِرِينَۖ","فَـَٔات۪يٰهُمُ اُ۬للَّهُ ثَوَابَ اَ۬لدُّنْي۪ا وَحُسْنَ ثَوَابِ اِ۬لَاخِرَةِۖ وَاللَّهُ يُحِبُّ اُ۬لْمُحْسِنِينَۖ","يَٰٓأَيُّهَا اَ۬لذِينَ ءَامَنُوٓاْ إِن تُطِيعُواْ اُ۬لذِينَ كَفَرُواْ يَرُدُّوكُمْ عَلَىٰٓ أَعْقَٰبِكُمْ فَتَنقَلِبُواْ خَٰسِرِينَۖ","بَلِ اِ۬للَّهُ مَوْل۪يٰكُمْۖ وَهُوَ خَيْرُ اُ۬لنَّٰصِرِينَۖ","سَنُلْقِے فِے قُلُوبِ اِ۬لذِينَ كَفَرُواْ اُ۬لرُّعْبَ بِمَآ أَشْرَكُواْ بِاللَّهِ مَا لَمْ يُنَزِّلْ بِهِۦ سُلْطَٰناٗۖ وَمَأْو۪يٰهُمُ اُ۬لنَّارُۖ وَبِيسَ مَثْوَى اَ۬لظَّٰلِمِينَۖ","وَلَقَدْ صَدَقَكُمُ اُ۬للَّهُ وَعْدَهُۥٓ إِذْ تَحُسُّونَهُم بِإِذْنِهِۦۖ حَتَّىٰٓ إِذَا فَشِلْتُمْ وَتَنَٰزَعْتُمْ فِے اِ۬لَامْرِ وَعَصَيْتُم مِّنۢ بَعْدِ مَآ أَر۪يٰكُم مَّا تُحِبُّونَۖ مِنكُم مَّنْ يُّرِيدُ اُ۬لدُّنْي۪ا وَمِنكُم مَّنْ يُّرِيدُ اُ۬لَاخِرَةَۖ ثُمَّ صَرَفَكُمْ عَنْهُمْ لِيَبْتَلِيَكُمْۖ وَلَقَدْ عَفَا عَنكُمْۖ وَاللَّهُ ذُو فَضْلٍ عَلَى اَ۬لْمُومِنِينَۖ","۞ إِذْ تُصْعِدُونَ وَلَا تَلْوُۥنَ عَلَىٰٓ أَحَدٖ وَالرَّسُولُ يَدْعُوكُمْ فِےٓ أُخْر۪يٰكُمْ فَأَثَٰبَكُمْ غَمّاَۢ بِغَمّٖ لِّكَيْلَا تَحْزَنُواْ عَلَىٰ مَا فَاتَكُمْ وَلَا مَآ أَصَٰبَكُمْۖ وَاللَّهُ خَبِيرُۢ بِمَا تَعْمَلُونَۖ","ثُمَّ أَنزَلَ عَلَيْكُم مِّنۢ بَعْدِ اِ۬لْغَمِّ أَمَنَةٗ نُّعَاساٗ يَغْش۪ىٰ طَآئِفَةٗ مِّنكُمْۖ وَطَآئِفَةٞ قَدَ اَهَمَّتْهُمُۥٓ أَنفُسُهُمْ يَظُنُّونَ بِاللَّهِ غَيْرَ اَ۬لْحَقِّ ظَنَّ اَ۬لْجَٰهِلِيَّةِۖ يَقُولُونَ هَل لَّنَا مِنَ اَ۬لَامْرِ مِن شَےْءٖۖ قُلِ اِنَّ اَ۬لَامْرَ كُلَّهُۥ لِلهِۖ يُخْفُونَ فِےٓ أَنفُسِهِم مَّا لَا يُبْدُونَ لَكَۖ يَقُولُونَ لَوْ كَانَ لَنَا مِنَ اَ۬لَامْرِ شَےْءٞ مَّا قُتِلْنَا هَٰهُنَاۖ قُل لَّوْ كُنتُمْ فِے بُيُوتِكُمْ لَبَرَزَ اَ۬لذِينَ كُتِبَ عَلَيْهِمُ اُ۬لْقَتْلُ إِلَىٰ مَضَاجِعِهِمْ وَلِيَبْتَلِيَ اَ۬للَّهُ مَا فِے صُدُورِكُمْ وَلِيُمَحِّصَ مَا فِے قُلُوبِكُمْۖ وَاللَّهُ عَلِيمُۢ بِذَاتِ اِ۬لصُّدُورِۖ","إِنَّ اَ۬لذِينَ تَوَلَّوْاْ مِنكُمْ يَوْمَ اَ۪لْتَقَى اَ۬لْجَمْعَٰنِ إِنَّمَا اَ۪سْتَزَلَّهُمُ اُ۬لشَّيْطَٰنُ بِبَعْضِ مَا كَسَبُواْۖ وَلَقَدْ عَفَا اَ۬للَّهُ عَنْهُمُۥٓۖ إِنَّ اَ۬للَّهَ غَفُورٌ حَلِيمٞۖ","يَٰٓأَيُّهَا اَ۬لذِينَ ءَامَنُواْ لَا تَكُونُواْ كَالذِينَ كَفَرُواْ وَقَالُواْ لِإِخْوَٰنِهِمُۥٓ إِذَا ضَرَبُواْ فِے اِ۬لَارْضِ أَوْ كَانُواْ غُزّىٗ لَّوْ كَانُواْ عِندَنَا مَا مَاتُواْ وَمَا قُتِلُواْ لِيَجْعَلَ اَ۬للَّهُ ذَٰلِكَ حَسْرَةٗ فِے قُلُوبِهِمْۖ وَاللَّهُ يُحْيِۦ وَيُمِيتُۖ وَاللَّهُ بِمَا تَعْمَلُونَ بَصِيرٞۖ","وَلَئِن قُتِلْتُمْ فِے سَبِيلِ اِ۬للَّهِ أَوْ مِتُّمْ لَمَغْفِرَةٞ مِّنَ اَ۬للَّهِ وَرَحْمَةٌ خَيْرٞ مِّمَّا تَجْمَعُونَۖ","وَلَئِن مِّتُّمُۥٓ أَوْ قُتِلْتُمْ لَإِلَى اَ۬للَّهِ تُحْشَرُونَۖ","فَبِمَا رَحْمَةٖ مِّنَ اَ۬للَّهِ لِنتَ لَهُمْۖ وَلَوْ كُنتَ فَظّاً غَلِيظَ اَ۬لْقَلْبِ لَانفَضُّواْ مِنْ حَوْلِكَۖ فَاعْفُ عَنْهُمْ وَاسْتَغْفِرْ لَهُمْ وَشَاوِرْهُمْ فِے اِ۬لَامْرِۖ فَإِذَا عَزَمْتَ فَتَوَكَّلْ عَلَى اَ۬للَّهِۖ إِنَّ اَ۬للَّهَ يُحِبُّ اُ۬لْمُتَوَكِّلِينَۖ","۞ إِنْ يَّنصُرْكُمُ اُ۬للَّهُ فَلَا غَالِبَ لَكُمْۖ وَإِنْ يَّخْذُلْكُمْ فَمَن ذَا اَ۬لذِے يَنصُرُكُم مِّنۢ بَعْدِهِۦۖ وَعَلَى اَ۬للَّهِ فَلْيَتَوَكَّلِ اِ۬لْمُومِنُونَۖ","وَمَا كَانَ لِنَبِےٓءٍ اَنْ يُّغَلَّۖ وَمَنْ يَّغْلُلْ يَاتِ بِمَا غَلَّ يَوْمَ اَ۬لْقِيَٰمَةِۖ ثُمَّ تُوَفّ۪ىٰ كُلُّ نَفْسٖ مَّا كَسَبَتْ وَهُمْ لَا يُظْلَمُونَۖ","أَفَمَنِ اِ۪تَّبَعَ رِضْوَٰنَ اَ۬للَّهِ كَمَنۢ بَآءَ بِسَخَطٖ مِّنَ اَ۬للَّهِ وَمَأْو۪يٰهُ جَهَنَّمُۖ وَبِيسَ اَ۬لْمَصِيرُۖ","هُمْ دَرَجَٰتٌ عِندَ اَ۬للَّهِۖ وَاللَّهُ بَصِيرُۢ بِمَا يَعْمَلُونَۖ","لَقَدْ مَنَّ اَ۬للَّهُ عَلَى اَ۬لْمُومِنِينَ إِذْ بَعَثَ فِيهِمْ رَسُولاٗ مِّنَ اَنفُسِهِمْ يَتْلُواْ عَلَيْهِمُۥٓ ءَايَٰتِهِۦ وَيُزَكِّيهِمْ وَيُعَلِّمُهُمُ اُ۬لْكِتَٰبَ وَالْحِكْمَةَ وَإِن كَانُواْ مِن قَبْلُ لَفِے ضَلَٰلٖ مُّبِينٍۖ","اَوَلَمَّآ أَصَٰبَتْكُم مُّصِيبَةٞ قَدَ اَصَبْتُم مِّثْلَيْهَا قُلْتُمُۥٓ أَنّ۪ىٰ هَٰذَاۖ قُلْ هُوَ مِنْ عِندِ أَنفُسِكُمُۥٓۖ إِنَّ اَ۬للَّهَ عَلَىٰ كُلِّ شَےْءٖ قَدِيرٞۖ","وَمَآ أَصَٰبَكُمْ يَوْمَ اَ۪لْتَقَى اَ۬لْجَمْعَٰنِ فَبِإِذْنِ اِ۬للَّهِ وَلِيَعْلَمَ اَ۬لْمُومِنِينَ","وَلِيَعْلَمَ اَ۬لذِينَ نَافَقُواْۖ وَقِيلَ لَهُمْ تَعَالَوْاْ قَٰتِلُواْ فِے سَبِيلِ اِ۬للَّهِ أَوِ اِ۪دْفَعُواْۖ قَالُواْ لَوْ نَعْلَمُ قِتَالاٗ لَّاتَّبَعْنَٰكُمْۖ هُمْ لِلْكُفْرِ يَوْمَئِذٍ اَقْرَبُ مِنْهُمْ لِلِايمَٰنِۖ يَقُولُونَ بِأَفْوَٰهِهِم مَّا لَيْسَ فِے قُلُوبِهِمْۖ وَاللَّهُ أَعْلَمُ بِمَا يَكْتُمُونَۖ","اَ۬لذِينَ قَالُواْ لِإِخْوَٰنِهِمْ وَقَعَدُواْ لَوَ اَطَاعُونَا مَا قُتِلُواْۖ قُلْ فَادْرَءُواْ عَنَ اَنفُسِكُمُ اُ۬لْمَوْتَ إِن كُنتُمْ صَٰدِقِينَۖ","وَلَا تَحْسِبَنَّ اَ۬لذِينَ قُتِلُواْ فِے سَبِيلِ اِ۬للَّهِ أَمْوَٰتاَۢۖ بَلَ اَحْيَآءٌۖ عِندَ رَبِّهِمْ يُرْزَقُونَ","فَرِحِينَ بِمَآ ءَات۪يٰهُمُ اُ۬للَّهُ مِن فَضْلِهِۦ وَيَسْتَبْشِرُونَ بِالذِينَ لَمْ يَلْحَقُواْ بِهِم مِّنْ خَلْفِهِمُۥٓ أَلَّا خَوْفٌ عَلَيْهِمْ وَلَا هُمْ يَحْزَنُونَۖ","۞ يَسْتَبْشِرُونَ بِنِعْمَةٖ مِّنَ اَ۬للَّهِ وَفَضْلٖ وَأَنَّ اَ۬للَّهَ لَا يُضِيعُ أَجْرَ اَ۬لْمُومِنِينَ","اَ۬لذِينَ اَ۪سْتَجَابُواْ لِلهِ وَالرَّسُولِ مِنۢ بَعْدِ مَآ أَصَابَهُمُ اُ۬لْقَرْحُۖ لِلذِينَ أَحْسَنُواْ مِنْهُمْ وَاتَّقَوَاْ اَجْرٌ عَظِيمٌۖ","اِ۬لذِينَ قَالَ لَهُمُ اُ۬لنَّاسُ إِنَّ اَ۬لنَّاسَ قَدْ جَمَعُواْ لَكُمْ فَاخْشَوْهُمْ فَزَادَهُمُۥٓ إِيمَٰناٗۖ وَقَالُواْ حَسْبُنَا اَ۬للَّهُ وَنِعْمَ اَ۬لْوَكِيلُۖ","فَانقَلَبُواْ بِنِعْمَةٖ مِّنَ اَ۬للَّهِ وَفَضْلٖ لَّمْ يَمْسَسْهُمْ سُوٓءٞ وَاتَّبَعُواْ رِضْوَٰنَ اَ۬للَّهِۖ وَاللَّهُ ذُو فَضْلٍ عَظِيمٍۖ","اِنَّمَا ذَٰلِكُمُ اُ۬لشَّيْطَٰنُ يُخَوِّفُ أَوْلِيَآءَهُۥ فَلَا تَخَافُوهُمْۖ وَخَافُونِ إِن كُنتُم مُّومِنِينَۖ","وَلَا يُحْزِنكَ اَ۬لذِينَ يُسَٰرِعُونَ فِے اِ۬لْكُفْرِۖ إِنَّهُمْ لَنْ يَّضُرُّواْ اُ۬للَّهَ شَئْاٗۖ يُرِيدُ اُ۬للَّهُ أَلَّا يَجْعَلَ لَهُمْ حَظّاٗ فِے اِ۬لَاخِرَةِۖ وَلَهُمْ عَذَابٌ عَظِيمٌۖ","اِنَّ اَ۬لذِينَ اَ۪شْتَرَوُاْ اُ۬لْكُفْرَ بِالِايمَٰنِ لَنْ يَّضُرُّواْ اُ۬للَّهَ شَئْاٗۖ وَلَهُمْ عَذَابٌ اَلِيمٞۖ","وَلَا يَحْسِبَنَّ اَ۬لذِينَ كَفَرُوٓاْ أَنَّمَا نُمْلِے لَهُمْ خَيْرٞ لِّأَنفُسِهِمُۥٓۖ إِنَّمَا نُمْلِے لَهُمْ لِيَزْدَادُوٓاْ إِثْماٗۖ وَلَهُمْ عَذَابٞ مُّهِينٞۖ","مَّا كَانَ اَ۬للَّهُ لِيَذَرَ اَ۬لْمُومِنِينَ عَلَىٰ مَآ أَنتُمْ عَلَيْهِ حَتَّىٰ يَمِيزَ اَ۬لْخَبِيثَ مِنَ اَ۬لطَّيِّبِۖ وَمَا كَانَ اَ۬للَّهُ لِيُطْلِعَكُمْ عَلَى اَ۬لْغَيْبِۖ وَلَٰكِنَّ اَ۬للَّهَ يَجْتَبِے مِن رُّسُلِهِۦ مَنْ يَّشَآءُۖ فَـَٔامِنُواْ بِاللَّهِ وَرُسُلِهِۦۖ وَإِن تُومِنُواْ وَتَتَّقُواْ فَلَكُمُۥٓ أَجْرٌ عَظِيمٞۖ","وَلَا يَحْسِبَنَّ اَ۬لذِينَ يَبْخَلُونَ بِمَآ ءَات۪يٰهُمُ اُ۬للَّهُ مِن فَضْلِهِۦ هُوَ خَيْراٗ لَّهُمۖ بَلْ هُوَ شَرّٞ لَّهُمْۖ سَيُطَوَّقُونَ مَا بَخِلُواْ بِهِۦ يَوْمَ اَ۬لْقِيَٰمَةِۖ وَلِلهِ مِيرَٰثُ اُ۬لسَّمَٰوَٰتِ وَالَارْضِۖ وَاللَّهُ بِمَا تَعْمَلُونَ خَبِيرٞۖ","۞ لَّقَدْ سَمِعَ اَ۬للَّهُ قَوْلَ اَ۬لذِينَ قَالُوٓاْ إِنَّ اَ۬للَّهَ فَقِيرٞ وَنَحْنُ أَغْنِيَآءُۖ سَنَكْتُبُ مَا قَالُواْ وَقَتْلَهُمُ اُ۬لَانۢبِئَآءَ بِغَيْرِ حَقّٖ وَنَقُولُ ذُوقُواْ عَذَابَ اَ۬لْحَرِيقِۖ","ذَٰلِكَ بِمَا قَدَّمَتَ اَيْدِيكُمْ وَأَنَّ اَ۬للَّهَ لَيْسَ بِظَلَّٰمٖ لِّلْعَبِيدِۖ","اِ۬لذِينَ قَالُوٓاْ إِنَّ اَ۬للَّهَ عَهِدَ إِلَيْنَآ أَلَّا نُومِنَ لِرَسُولٍ حَتَّىٰ يَاتِيَنَا بِقُرْبَانٖ تَاكُلُهُ اُ۬لنَّارُۖ قُلْ قَدْ جَآءَكُمْ رُسُلٞ مِّن قَبْلِے بِالْبَيِّنَٰتِ وَبِالذِے قُلْتُمْ فَلِمَ قَتَلْتُمُوهُمُۥٓ إِن كُنتُمْ صَٰدِقِينَۖ","فَإِن كَذَّبُوكَ فَقَدْ كُذِّبَ رُسُلٞ مِّن قَبْلِكَ جَآءُو بِالْبَيِّنَٰتِ وَالزُّبُرِ وَالْكِتَٰبِ اِ۬لْمُنِيرِۖ","كُلُّ نَفْسٖ ذَآئِقَةُ اُ۬لْمَوْتِۖ وَإِنَّمَا تُوَفَّوْنَ أُجُورَكُمْ يَوْمَ اَ۬لْقِيَٰمَةِۖ فَمَن زُحْزِحَ عَنِ اِ۬لنّ۪ارِ وَأُدْخِلَ اَ۬لْجَنَّةَ فَقَدْ فَازَۖ وَمَا اَ۬لْحَيَوٰةُ اُ۬لدُّنْي۪آ إِلَّا مَتَٰعُ اُ۬لْغُرُورِۖ","۞ لَتُبْلَوُنَّ فِےٓ أَمْوَٰلِكُمْ وَأَنفُسِكُمْ وَلَتَسْمَعُنَّ مِنَ اَ۬لذِينَ أُوتُواْ اُ۬لْكِتَٰبَ مِن قَبْلِكُمْ وَمِنَ اَ۬لذِينَ أَشْرَكُوٓاْ أَذىٗ كَثِيراٗۖ وَإِن تَصْبِرُواْ وَتَتَّقُواْ فَإِنَّ ذَٰلِكَ مِنْ عَزْمِ اِ۬لُامُورِۖ","وَإِذَ اَخَذَ اَ۬للَّهُ مِيثَٰقَ اَ۬لذِينَ أُوتُواْ اُ۬لْكِتَٰبَ لَتُبَيِّنُنَّهُۥ لِلنَّاسِ وَلَا تَكْتُمُونَهُۥ فَنَبَذُوهُ وَرَآءَ ظُهُورِهِمْ وَاشْتَرَوْاْ بِهِۦ ثَمَناٗ قَلِيلاٗۖ فَبِيسَ مَا يَشْتَرُونَۖ","لَا يَحْسِبَنَّ اَ۬لذِينَ يَفْرَحُونَ بِمَآ أَتَواْ وَّيُحِبُّونَ أَنْ يُّحْمَدُواْ بِمَا لَمْ يَفْعَلُواْ فَلَا تَحْسِبَنَّهُم بِمَفَازَةٖ مِّنَ اَ۬لْعَذَابِۖ وَلَهُمْ عَذَابٌ اَلِيمٞۖ","وَلِلهِ مُلْكُ اُ۬لسَّمَٰوَٰتِ وَالَارْضِۖ وَاللَّهُ عَلَىٰ كُلِّ شَےْءٖ قَدِيرٌۖ","اِنَّ فِے خَلْقِ اِ۬لسَّمَٰوَٰتِ وَالَارْضِ وَاخْتِلَٰفِ اِ۬ليْلِ وَالنَّه۪ارِ لَأٓيَٰتٖ لِّأُوْلِے اِ۬لَالْبَٰبِ","اِ۬لذِينَ يَذْكُرُونَ اَ۬للَّهَ قِيَٰماٗ وَقُعُوداٗ وَعَلَىٰ جُنُوبِهِمْ وَيَتَفَكَّرُونَ فِے خَلْقِ اِ۬لسَّمَٰوَٰتِ وَالَارْضِۖ رَبَّنَا مَا خَلَقْتَ هَٰذَا بَٰطِلاٗ سُبْحَٰنَكَۖ فَقِنَا عَذَابَ اَ۬لنّ۪ارِۖ","رَبَّنَآ إِنَّكَ مَن تُدْخِلِ اِ۬لنَّارَ فَقَدَ اَخْزَيْتَهُۥۖ وَمَا لِلظَّٰلِمِينَ مِنَ اَنص۪ارٖۖ","رَّبَّنَآ إِنَّنَا سَمِعْنَا مُنَادِياٗ يُنَادِے لِلِايمَٰنِ أَنَ اٰمِنُواْ بِرَبِّكُمْ فَـَٔامَنَّاۖ رَبَّنَا فَاغْفِرْ لَنَا ذُنُوبَنَا وَكَفِّرْ عَنَّا سَيِّـَٔاتِنَا وَتَوَفَّنَا مَعَ اَ۬لَابْر۪ارِۖ","رَبَّنَا وَءَاتِنَا مَا وَعَدتَّنَا عَلَىٰ رُسُلِكَ وَلَا تُخْزِنَا يَوْمَ اَ۬لْقِيَٰمَةِۖ إِنَّكَ لَا تُخْلِفُ اُ۬لْمِيعَادَۖ","فَاسْتَجَابَ لَهُمْ رَبُّهُمُۥٓ أَنِّے لَآ أُضِيعُ عَمَلَ عَٰمِلٖ مِّنكُم مِّن ذَكَرٍ اَوُ ا۟نث۪ىٰۖ بَعْضُكُم مِّنۢ بَعْضٖۖ فَالذِينَ هَاجَرُواْ وَأُخْرِجُواْ مِن دِيٰ۪رِهِمْ وَأُوذُواْ فِے سَبِيلِے وَقَٰتَلُواْ وَقُتِلُواْ لَأُكَفِّرَنَّ عَنْهُمْ سَيِّـَٔاتِهِمْ وَلَأُدْخِلَنَّهُمْ جَنَّٰتٖ تَجْرِے مِن تَحْتِهَا اَ۬لَانْهَٰرُ ثَوَاباٗ مِّنْ عِندِ اِ۬للَّهِۖ وَاللَّهُ عِندَهُۥ حُسْنُ اُ۬لثَّوَابِۖ","۞ لَا يَغُرَّنَّكَ تَقَلُّبُ اُ۬لذِينَ كَفَرُواْ فِے اِ۬لْبِلَٰدِۖ","مَتَٰعٞ قَلِيلٞۖ ثُمَّ مَأْو۪يٰهُمْ جَهَنَّمُۖ وَبِيسَ اَ۬لْمِهَادُۖ","لَٰكِنِ اِ۬لذِينَ اَ۪تَّقَوْاْ رَبَّهُمْ لَهُمْ جَنَّٰتٞ تَجْرِے مِن تَحْتِهَا اَ۬لَانْهَٰرُ خَٰلِدِينَ فِيهَا نُزُلاٗ مِّنْ عِندِ اِ۬للَّهِۖ وَمَا عِندَ اَ۬للَّهِ خَيْرٞ لِّلَابْر۪ارِۖ","وَإِنَّ مِنَ اَهْلِ اِ۬لْكِتَٰبِ لَمَنْ يُّومِنُ بِاللَّهِ وَمَآ أُنزِلَ إِلَيْكُمْ وَمَآ أُنزِلَ إِلَيْهِمْ خَٰشِعِينَ لِلهِۖ لَا يَشْتَرُونَ بِـَٔايَٰتِ اِ۬للَّهِ ثَمَناٗ قَلِيلاًۖ ا۟وْلَٰٓئِكَ لَهُمُۥٓ أَجْرُهُمْ عِندَ رَبِّهِمُۥٓۖ إِنَّ اَ۬للَّهَ سَرِيعُ اُ۬لْحِسَابِۖ","يَٰٓأَيُّهَا اَ۬لذِينَ ءَامَنُواْ اُ۪صْبِرُواْ وَصَابِرُواْ وَرَابِطُواْ وَاتَّقُواْ اُ۬للَّهَ لَعَلَّكُمْ تُفْلِحُونَۖ"]],["النساء",["يَٰٓأَيُّهَا اَ۬لنَّاسُ اُ۪تَّقُواْ رَبَّكُمُ اُ۬لذِے خَلَقَكُم مِّن نَّفْسٖ وَٰحِدَةٖ وَخَلَقَ مِنْهَا زَوْجَهَا وَبَثَّ مِنْهُمَا رِجَالاٗ كَثِيراٗ وَنِسَآءٗۖ وَاتَّقُواْ اُ۬للَّهَ اَ۬لذِے تَسَّآءَلُونَ بِهِۦ وَالَارْحَامَۖ إِنَّ اَ۬للَّهَ كَانَ عَلَيْكُمْ رَقِيباٗۖ","وَءَاتُواْ اُ۬لْيَتَٰم۪ىٰٓ أَمْوَٰلَهُمْۖ وَلَا تَتَبَدَّلُواْ اُ۬لْخَبِيثَ بِالطَّيِّبِۖ وَلَا تَاكُلُوٓاْ أَمْوَٰلَهُمُۥٓ إِلَىٰٓ أَمْوَٰلِكُمُۥٓۖ إِنَّهُۥ كَانَ حُوباٗ كَبِيراٗۖ","وَإِنْ خِفْتُمُۥٓ أَلَّا تُقْسِطُواْ فِے اِ۬لْيَتَٰم۪ىٰ فَانكِحُواْ مَا طَابَ لَكُم مِّنَ اَ۬لنِّسَآءِ مَثْن۪ىٰ وَثُلَٰثَ وَرُبَٰعَۖ فَإِنْ خِفْتُمُۥٓ أَلَّا تَعْدِلُواْ فَوَٰحِدَةً اَوْ مَا مَلَكَتَ اَيْمَٰنُكُمْۖ ذَٰلِكَ أَدْن۪ىٰٓ أَلَّا تَعُولُواْۖ","وَءَاتُواْ اُ۬لنِّسَآءَ صَدُقَٰتِهِنَّ نِحْلَةٗۖ فَإِن طِبْنَ لَكُمْ عَن شَےْءٖ مِّنْهُ نَفْساٗ فَكُلُوهُۖ هَنِيٓـٔاٗ مَّرِيٓـٔاٗۖ","وَلَا تُوتُواْ اُ۬لسُّفَهَآءَ امْوَٰلَكُمُ اُ۬لتِے جَعَلَ اَ۬للَّهُ لَكُمْ قِيَماٗۖ وَارْزُقُوهُمْ فِيهَا وَاكْسُوهُمْ وَقُولُواْ لَهُمْ قَوْلاٗ مَّعْرُوفاٗۖ","۞ وَابْتَلُواْ اُ۬لْيَتَٰم۪ىٰ حَتَّىٰٓ إِذَا بَلَغُواْ اُ۬لنِّكَاحَ فَإِنَ اٰنَسْتُم مِّنْهُمْ رُشْداٗ فَادْفَعُوٓاْ إِلَيْهِمُۥٓ أَمْوَٰلَهُمْ وَلَا تَاكُلُوهَآ إِسْرَافاٗ وَبِدَاراً اَنْ يَّكْبَرُواْۖ وَمَن كَانَ غَنِيّاٗ فَلْيَسْتَعْفِفْۖ وَمَن كَانَ فَقِيراٗ فَلْيَاكُلْ بِالْمَعْرُوفِۖ فَإِذَا دَفَعْتُمُۥٓ إِلَيْهِمُۥٓ أَمْوَٰلَهُمْ فَأَشْهِدُواْ عَلَيْهِمْۖ وَكَف۪ىٰ بِاللَّهِ حَسِيباٗۖ","لِّلرِّجَالِ نَصِيبٞ مِّمَّا تَرَكَ اَ۬لْوَٰلِدَٰنِ وَالَاقْرَبُونَ وَلِلنِّسَآءِ نَصِيبٞ مِّمَّا تَرَكَ اَ۬لْوَٰلِدَٰنِ وَالَاقْرَبُونَ مِمَّا قَلَّ مِنْهُ أَوْ كَثُرَۖ نَصِيباٗ مَّفْرُوضاٗۖ","وَإِذَا حَضَرَ اَ۬لْقِسْمَةَ أُوْلُواْ اُ۬لْقُرْب۪ىٰ وَالْيَتَٰم۪ىٰ وَالْمَسَٰكِينُ فَارْزُقُوهُم مِّنْهُۖ وَقُولُواْ لَهُمْ قَوْلاٗ مَّعْرُوفاٗۖ","وَلْيَخْشَ اَ۬لذِينَ لَوْ تَرَكُواْ مِنْ خَلْفِهِمْ ذُرِّيَّةٗ ضِعَٰفاً خَافُواْ عَلَيْهِمْۖ فَلْيَتَّقُواْ اُ۬للَّهَ وَلْيَقُولُواْ قَوْلاٗ سَدِيداًۖ","اِنَّ اَ۬لذِينَ يَاكُلُونَ أَمْوَٰلَ اَ۬لْيَتَٰم۪ىٰ ظُلْماً اِنَّمَا يَاكُلُونَ فِے بُطُونِهِمْ نَاراٗۖ وَسَيَصْلَوْنَ سَعِيراٗۖ","۞ يُوصِيكُمُ اُ۬للَّهُ فِےٓ أَوْلَٰدِكُمْۖ لِلذَّكَرِ مِثْلُ حَظِّ اِ۬لُانثَيَيْنِۖ فَإِن كُنَّ نِسَآءٗ فَوْقَ اَ۪ثْنَتَيْنِ فَلَهُنَّ ثُلُثَا مَا تَرَكَۖ وَإِن كَانَتْ وَٰحِدَةٞ فَلَهَا اَ۬لنِّصْفُۖ وَلِأَبَوَيْهِ لِكُلِّ وَٰحِدٖ مِّنْهُمَا اَ۬لسُّدُسُ مِمَّا تَرَكَ إِن كَانَ لَهُۥ وَلَدٞۖ فَإِن لَّمْ يَكُن لَّهُۥ وَلَدٞ وَوَرِثَهُۥٓ أَبَوَٰهُ فَلِأُمِّهِ اِ۬لثُّلُثُۖ فَإِن كَانَ لَهُۥٓ إِخْوَةٞ فَلِأُمِّهِ اِ۬لسُّدُسُۖ مِنۢ بَعْدِ وَصِيَّةٖ يُوصِے بِهَآ أَوْ دَيْنٍۖ اٰبَآؤُكُمْ وَأَبْنَآؤُكُمْ لَا تَدْرُونَ أَيُّهُمُۥٓ أَقْرَبُ لَكُمْ نَفْعاٗۖ فَرِيضَةٗ مِّنَ اَ۬للَّهِۖ إِنَّ اَ۬للَّهَ كَانَ عَلِيماً حَكِيماٗۖ","وَلَكُمْ نِصْفُ مَا تَرَكَ أَزْوَٰجُكُمُۥٓ إِن لَّمْ يَكُن لَّهُنَّ وَلَدٞۖ فَإِن كَانَ لَهُنَّ وَلَدٞ فَلَكُمُ اُ۬لرُّبُعُ مِمَّا تَرَكْنَ مِنۢ بَعْدِ وَصِيَّةٖ يُوصِينَ بِهَآ أَوْ دَيْنٖۖ وَلَهُنَّ اَ۬لرُّبُعُ مِمَّا تَرَكْتُمُۥٓ إِن لَّمْ يَكُن لَّكُمْ وَلَدٞۖ فَإِن كَانَ لَكُمْ وَلَدٞ فَلَهُنَّ اَ۬لثُّمُنُ مِمَّا تَرَكْتُم مِّنۢ بَعْدِ وَصِيَّةٖ تُوصُونَ بِهَآ أَوْ دَيْنٖۖ وَإِن كَانَ رَجُلٞ يُورَثُ كَلَٰلَةً اَوِ اِ۪مْرَأَةٞ وَلَهُۥٓ أَخٌ اَوُ ا۟خْتٞ فَلِكُلِّ وَٰحِدٖ مِّنْهُمَا اَ۬لسُّدُسُۖ فَإِن كَانُوٓاْ أَكْثَرَ مِن ذَٰلِكَ فَهُمْ شُرَكَآءُ فِے اِ۬لثُّلُثِ مِنۢ بَعْدِ وَصِيَّةٖ يُوصِے بِهَآ أَوْ دَيْنٍ غَيْرَ مُضَآرّٖۖ وَصِيَّةٗ مِّنَ اَ۬للَّهِۖ وَاللَّهُ عَلِيمٌ حَلِيمٞۖ","۞ تِلْكَ حُدُودُ اُ۬للَّهِۖ وَمَنْ يُّطِعِ اِ۬للَّهَ وَرَسُولَهُۥ نُدْخِلْهُ جَنَّٰتٖ تَجْرِے مِن تَحْتِهَا اَ۬لَانْهَٰرُ خَٰلِدِينَ فِيهَاۖ وَذَٰلِكَ اَ۬لْفَوْزُ اُ۬لْعَظِيمُۖ","وَمَنْ يَّعْصِ اِ۬للَّهَ وَرَسُولَهُۥ وَيَتَعَدَّ حُدُودَهُۥ نُدْخِلْهُ نَاراً خَٰلِداٗ فِيهَاۖ وَلَهُۥ عَذَابٞ مُّهِينٞۖ","وَالتِے يَاتِينَ اَ۬لْفَٰحِشَةَ مِن نِّسَآئِكُمْ فَاسْتَشْهِدُواْ عَلَيْهِنَّ أَرْبَعَةٗ مِّنكُمْۖ فَإِن شَهِدُواْ فَأَمْسِكُوهُنَّ فِے اِ۬لْبُيُوتِ حَتَّىٰ يَتَوَفّ۪يٰهُنَّ اَ۬لْمَوْتُ أَوْ يَجْعَلَ اَ۬للَّهُ لَهُنَّ سَبِيلاٗۖ","وَالذَٰنِ يَاتِيَٰنِهَا مِنكُمْ فَـَٔاذُوهُمَاۖ فَإِن تَابَا وَأَصْلَحَا فَأَعْرِضُواْ عَنْهُمَآۖ إِنَّ اَ۬للَّهَ كَانَ تَوَّاباٗ رَّحِيماًۖ","اِنَّمَا اَ۬لتَّوْبَةُ عَلَى اَ۬للَّهِ لِلذِينَ يَعْمَلُونَ اَ۬لسُّوٓءَ بِجَهَٰلَةٖ ثُمَّ يَتُوبُونَ مِن قَرِيبٖۖ فَأُوْلَٰٓئِكَ يَتُوبُ اُ۬للَّهُ عَلَيْهِمْۖ وَكَانَ اَ۬للَّهُ عَلِيماً حَكِيماٗۖ","وَلَيْسَتِ اِ۬لتَّوْبَةُ لِلذِينَ يَعْمَلُونَ اَ۬لسَّيِّـَٔاتِ حَتَّىٰٓ إِذَا حَضَرَ أَحَدَهُمُ اُ۬لْمَوْتُ قَالَ إِنِّے تُبْتُ اُ۬لَٰـنَ وَلَا اَ۬لذِينَ يَمُوتُونَ وَهُمْ كُفَّارٌۖ ا۟وْلَٰٓئِكَ أَعْتَدْنَا لَهُمْ عَذَاباً اَلِيماٗۖ","يَٰٓأَيُّهَا اَ۬لذِينَ ءَامَنُواْ لَا يَحِلُّ لَكُمُۥٓ أَن تَرِثُوا اُ۬لنِّسَآءَ كَرْهاٗۖ وَلَا تَعْضُلُوهُنَّ لِتَذْهَبُواْ بِبَعْضِ مَآ ءَاتَيْتُمُوهُنَّ إِلَّآ أَنْ يَّاتِينَ بِفَٰحِشَةٖ مُّبَيِّنَةٖۖ ۞ وَعَاشِرُوهُنَّ بِالْمَعْرُوفِۖ فَإِن كَرِهْتُمُوهُنَّ فَعَس۪ىٰٓ أَن تَكْرَهُواْ شَئْاٗ وَيَجْعَلَ اَ۬للَّهُ فِيهِ خَيْراٗ كَثِيراٗۖ","وَإِنَ اَرَدتُّمُ اُ۪سْتِبْدَالَ زَوْجٖ مَّكَانَ زَوْجٖ وَءَاتَيْتُمُۥٓ إِحْد۪يٰهُنَّ قِنطَاراٗ فَلَا تَاخُذُواْ مِنْهُ شَئْاًۖ اَتَاخُذُونَهُۥ بُهْتَٰناٗ وَإِثْماٗ مُّبِيناٗۖ","وَكَيْفَ تَاخُذُونَهُۥ وَقَدَ اَفْض۪ىٰ بَعْضُكُمُۥٓ إِلَىٰ بَعْضٖ وَأَخَذْنَ مِنكُم مِّيثَٰقاً غَلِيظاٗۖ","وَلَا تَنكِحُواْ مَا نَكَحَ ءَابَآؤُكُم مِّنَ اَ۬لنِّسَآءِ الَّا مَا قَدْ سَلَفَۖ إِنَّهُۥ كَانَ فَٰحِشَةٗ وَمَقْتاٗۖ وَسَآءَ سَبِيلاًۖ","حُرِّمَتْ عَلَيْكُمُۥٓ أُمَّهَٰتُكُمْ وَبَنَاتُكُمْ وَأَخَوَٰتُكُمْ وَعَمَّٰتُكُمْ وَخَٰلَٰتُكُمْ وَبَنَاتُ اُ۬لَاخِ وَبَنَاتُ اُ۬لُاخْتِۖ وَأُمَّهَٰتُكُمُ اُ۬لتِےٓ أَرْضَعْنَكُمْ وَأَخَوَٰتُكُم مِّنَ اَ۬لرَّضَٰعَةِۖ وَأُمَّهَٰتُ نِسَآئِكُمْ وَرَبَٰٓئِبُكُمُ اُ۬لتِے فِے حُجُورِكُم مِّن نِّسَآئِكُمُ اُ۬لتِے دَخَلْتُم بِهِنَّۖ فَإِن لَّمْ تَكُونُواْ دَخَلْتُم بِهِنَّ فَلَا جُنَاحَ عَلَيْكُمْۖ وَحَلَٰٓئِلُ أَبْنَآئِكُمُ اُ۬لذِينَ مِنَ اَصْلَٰبِكُمْۖ وَأَن تَجْمَعُواْ بَيْنَ اَ۬لُاخْتَيْنِ إِلَّا مَا قَدْ سَلَفَۖ إِنَّ اَ۬للَّهَ كَانَ غَفُوراٗ رَّحِيماٗۖ","۞ وَالْمُحْصَنَٰتُ مِنَ اَ۬لنِّسَآءِ الَّا مَا مَلَكَتَ اَيْمَٰنُكُمْۖ كِتَٰبَ اَ۬للَّهِ عَلَيْكُمْۖ وَأَحَلَّ لَكُم مَّا وَرَآءَ ذَٰلِكُمُۥٓ أَن تَبْتَغُواْ بِأَمْوَٰلِكُم مُّحْصِنِينَ غَيْرَ مُسَٰفِحِينَۖ فَمَا اَ۪سْتَمْتَعْتُم بِهِۦ مِنْهُنَّ فَـَٔاتُوهُنَّ أُجُورَهُنَّ فَرِيضَةٗۖ وَلَا جُنَاحَ عَلَيْكُمْ فِيمَا تَرَٰضَيْتُم بِهِۦ مِنۢ بَعْدِ اِ۬لْفَرِيضَةِۖ إِنَّ اَ۬للَّهَ كَانَ عَلِيماً حَكِيماٗۖ","وَمَن لَّمْ يَسْتَطِعْ مِنكُمْ طَوْلاً اَنْ يَّنكِحَ اَ۬لْمُحْصَنَٰتِ اِ۬لْمُومِنَٰتِ فَمِن مَّا مَلَكَتَ اَيْمَٰنُكُم مِّن فَتَيَٰتِكُمُ اُ۬لْمُومِنَٰتِۖ وَاللَّهُ أَعْلَمُ بِإِيمَٰنِكُمۖ بَعْضُكُم مِّنۢ بَعْضٖۖ فَانكِحُوهُنَّ بِإِذْنِ أَهْلِهِنَّۖ وَءَاتُوهُنَّ أُجُورَهُنَّ بِالْمَعْرُوفِ مُحْصَنَٰتٍ غَيْرَ مُسَٰفِحَٰتٖ وَلَا مُتَّخِذَٰتِ أَخْدَانٖۖ فَإِذَآ أُحْصِنَّ فَإِنَ اَتَيْنَ بِفَٰحِشَةٖ فَعَلَيْهِنَّ نِصْفُ مَا عَلَى اَ۬لْمُحْصَنَٰتِ مِنَ اَ۬لْعَذَابِۖ ذَٰلِكَ لِمَنْ خَشِيَ اَ۬لْعَنَتَ مِنكُمْۖ وَأَن تَصْبِرُواْ خَيْرٞ لَّكُمْۖ وَاللَّهُ غَفُورٞ رَّحِيمٞۖ","يُرِيدُ اُ۬للَّهُ لِيُبَيِّنَ لَكُمْ وَيَهْدِيَكُمْ سُنَنَ اَ۬لذِينَ مِن قَبْلِكُمْ وَيَتُوبَ عَلَيْكُمْۖ وَاللَّهُ عَلِيمٌ حَكِيمٞۖ","وَاللَّهُ يُرِيدُ أَنْ يَّتُوبَ عَلَيْكُمْۖ وَيُرِيدُ اُ۬لذِينَ يَتَّبِعُونَ اَ۬لشَّهَوَٰتِ أَن تَمِيلُواْ مَيْلاً عَظِيماٗۖ","يُرِيدُ اُ۬للَّهُ أَنْ يُّخَفِّفَ عَنكُمْۖ وَخُلِقَ اَ۬لِانسَٰنُ ضَعِيفاٗۖ","۞ يَٰٓأَيُّهَا اَ۬لذِينَ ءَامَنُواْ لَا تَاكُلُوٓاْ أَمْوَٰلَكُم بَيْنَكُم بِالْبَٰطِلِۖ إِلَّآ أَن تَكُونَ تِجَٰرَةٌ عَن تَرَاضٖ مِّنكُمْۖ وَلَا تَقْتُلُوٓاْ أَنفُسَكُمُۥٓۖ إِنَّ اَ۬للَّهَ كَانَ بِكُمْ رَحِيماٗۖ","وَمَنْ يَّفْعَلْ ذَٰلِكَ عُدْوَٰناٗ وَظُلْماٗ فَسَوْفَ نُصْلِيهِ نَاراٗۖ وَكَانَ ذَٰلِكَ عَلَى اَ۬للَّهِ يَسِيراًۖ","اِن تَجْتَنِبُواْ كَبَآئِرَ مَا تُنْهَوْنَ عَنْهُ نُكَفِّرْ عَنكُمْ سَيِّـَٔاتِكُمْ وَنُدْخِلْكُم مَّدْخَلاٗ كَرِيماٗۖ","وَلَا تَتَمَنَّوْاْ مَا فَضَّلَ اَ۬للَّهُ بِهِۦ بَعْضَكُمْ عَلَىٰ بَعْضٖۖ لِّلرِّجَالِ نَصِيبٞ مِّمَّا اَ۪كْتَسَبُواْۖ وَلِلنِّسَآءِ نَصِيبٞ مِّمَّا اَ۪كْتَسَبْنَۖ وَسْـَٔلُواْ اُ۬للَّهَ مِن فَضْلِهِۦٓۖ إِنَّ اَ۬للَّهَ كَانَ بِكُلِّ شَےْءٍ عَلِيماٗۖ","وَلِكُلّٖ جَعَلْنَا مَوَٰلِيَ مِمَّا تَرَكَۖ اَ۬لْوَٰلِدَٰنِ وَالَاقْرَبُونَۖ وَالذِينَ عَٰقَدَتَ اَيْمَٰنُكُمْ فَـَٔاتُوهُمْ نَصِيبَهُمُۥٓۖ إِنَّ اَ۬للَّهَ كَانَ عَلَىٰ كُلِّ شَےْءٖ شَهِيداًۖ","اِ۬لرِّجَالُ قَوَّٰمُونَ عَلَى اَ۬لنِّسَآءِ بِمَا فَضَّلَ اَ۬للَّهُ بَعْضَهُمْ عَلَىٰ بَعْضٖ وَبِمَآ أَنفَقُواْ مِنَ اَمْوَٰلِهِمْۖ فَالصَّٰلِحَٰتُ قَٰنِتَٰتٌ حَٰفِظَٰتٞ لِّلْغَيْبِ بِمَا حَفِظَ اَ۬للَّهُۖ وَالتِے تَخَافُونَ نُشُوزَهُنَّ فَعِظُوهُنَّ وَاهْجُرُوهُنَّ فِے اِ۬لْمَضَاجِعِ وَاضْرِبُوهُنَّۖ فَإِنَ اَطَعْنَكُمْ فَلَا تَبْغُواْ عَلَيْهِنَّ سَبِيلاًۖ اِنَّ اَ۬للَّهَ كَانَ عَلِيّاٗ كَبِيراٗۖ","وَإِنْ خِفْتُمْ شِقَاقَ بَيْنِهِمَا فَابْعَثُواْ حَكَماٗ مِّنَ اَهْلِهِۦ وَحَكَماٗ مِّنَ اَهْلِهَآ إِنْ يُّرِيدَآ إِصْلَٰحاٗ يُوَفِّقِ اِ۬للَّهُ بَيْنَهُمَآۖ إِنَّ اَ۬للَّهَ كَانَ عَلِيماً خَبِيراٗۖ","۞ وَاعْبُدُواْ اُ۬للَّهَۖ وَلَا تُشْرِكُواْ بِهِۦ شَئْاٗۖ وَبِالْوَٰلِدَيْنِ إِحْسَٰناٗ وَبِذِے اِ۬لْقُرْب۪ىٰ وَالْيَتَٰم۪ىٰ وَالْمَسَٰكِينِ وَالْج۪ارِ ذِے اِ۬لْقُرْب۪ىٰ وَالْج۪ارِ اِ۬لْجُنُبِ وَالصَّٰحِبِ بِالْجَنۢبِ وَابْنِ اِ۬لسَّبِيلِ وَمَا مَلَكَتَ اَيْمَٰنُكُمُۥٓۖ إِنَّ اَ۬للَّهَ لَا يُحِبُّ مَن كَانَ مُخْتَالاٗ فَخُوراًۖ","اِ۬لذِينَ يَبْخَلُونَ وَيَامُرُونَ اَ۬لنَّاسَ بِالْبُخْلِ وَيَكْتُمُونَ مَآ ءَات۪يٰهُمُ اُ۬للَّهُ مِن فَضْلِهِۦۖ وَأَعْتَدْنَا لِلْكٰ۪فِرِينَ عَذَاباٗ مُّهِيناٗۖ","وَالذِينَ يُنفِقُونَ أَمْوَٰلَهُمْ رِئَآءَ اَ۬لنَّاسِ وَلَا يُومِنُونَ بِاللَّهِ وَلَا بِالْيَوْمِ اِ۬لَاخِرِۖ وَمَنْ يَّكُنِ اِ۬لشَّيْطَٰنُ لَهُۥ قَرِيناٗ فَسَآءَ قَرِيناٗۖ","وَمَاذَا عَلَيْهِمْ لَوَ اٰمَنُواْ بِاللَّهِ وَالْيَوْمِ اِ۬لَاخِرِ وَأَنفَقُواْ مِمَّا رَزَقَهُمُ اُ۬للَّهُۖ وَكَانَ اَ۬للَّهُ بِهِمْ عَلِيماًۖ","اِنَّ اَ۬للَّهَ لَا يَظْلِمُ مِثْقَالَ ذَرَّةٖۖ وَإِن تَكُ حَسَنَةٞ يُضَٰعِفْهَا وَيُوتِ مِن لَّدُنْهُ أَجْراً عَظِيماٗۖ","فَكَيْفَ إِذَا جِئْنَا مِن كُلِّ أُمَّةِۢ بِشَهِيدٖ وَجِئْنَا بِكَ عَلَىٰ هَٰٓؤُلَآءِ شَهِيداٗۖ","يَوْمَئِذٖ يَوَدُّ اُ۬لذِينَ كَفَرُواْ وَعَصَوُاْ اُ۬لرَّسُولَ لَوْ تَسَّوّ۪ىٰ بِهِمُ اُ۬لَارْضُ وَلَا يَكْتُمُونَ اَ۬للَّهَ حَدِيثاٗۖ","يَٰٓأَيُّهَا اَ۬لذِينَ ءَامَنُواْ لَا تَقْرَبُواْ اُ۬لصَّلَوٰةَ وَأَنتُمْ سُكَٰر۪ىٰ حَتَّىٰ تَعْلَمُواْ مَا تَقُولُونَ وَلَا جُنُباً اِلَّا عَابِرِے سَبِيلٍ حَتَّىٰ تَغْتَسِلُواْۖ وَإِن كُنتُم مَّرْض۪ىٰٓ أَوْ عَلَىٰ سَفَرٍ اَوْ جَآءَ احَدٞ مِّنكُم مِّنَ اَ۬لْغَآئِطِ أَوْ لَٰمَسْتُمُ اُ۬لنِّسَآءَ فَلَمْ تَجِدُواْ مَآءٗ فَتَيَمَّمُواْ صَعِيداٗ طَيِّباٗ فَامْسَحُواْ بِوُجُوهِكُمْ وَأَيْدِيكُمُۥٓۖ إِنَّ اَ۬للَّهَ كَانَ عَفُوّاً غَفُوراًۖ","اَلَمْ تَرَ إِلَى اَ۬لذِينَ أُوتُواْ نَصِيباٗ مِّنَ اَ۬لْكِتَٰبِ يَشْتَرُونَ اَ۬لضَّلَٰلَةَ وَيُرِيدُونَ أَن تَضِلُّواْ اُ۬لسَّبِيلَۖ  وَاللَّهُ أَعْلَمُ بِأَعْدَآئِكُمْۖ وَكَف۪ىٰ بِاللَّهِ وَلِيّاٗ وَكَف۪ىٰ بِاللَّهِ نَصِيراٗۖ","۞ مِّنَ اَ۬لذِينَ هَادُواْ يُحَرِّفُونَ اَ۬لْكَلِمَ عَن مَّوَاضِعِهِۦ وَيَقُولُونَ سَمِعْنَا وَعَصَيْنَا وَاسْمَعْ غَيْرَ مُسْمَعٖ وَرَٰعِنَا لَيّاَۢ بِأَلْسِنَتِهِمْ وَطَعْناٗ فِے اِ۬لدِّينِۖ وَلَوَ اَنَّهُمْ قَالُواْ سَمِعْنَا وَأَطَعْنَا وَاسْمَعْ وَانظُرْنَا لَكَانَ خَيْراٗ لَّهُمْ وَأَقْوَمَۖ وَلَٰكِن لَّعَنَهُمُ اُ۬للَّهُ بِكُفْرِهِمْ فَلَا يُومِنُونَ إِلَّا قَلِيلاٗۖ","يَٰٓأَيُّهَا اَ۬لذِينَ أُوتُواْ اُ۬لْكِتَٰبَ ءَامِنُواْ بِمَا نَزَّلْنَا مُصَدِّقاٗ لِّمَا مَعَكُم مِّن قَبْلِ أَن نَّطْمِسَ وُجُوهاٗ فَنَرُدَّهَا عَلَىٰٓ أَدْبٰ۪رِهَآ أَوْ نَلْعَنَهُمْ كَمَا لَعَنَّآ أَصْحَٰبَ اَ۬لسَّبْتِۖ وَكَانَ أَمْرُ اُ۬للَّهِ مَفْعُولۖاً","اِنَّ اَ۬للَّهَ لَا يَغْفِرُ أَنْ يُّشْرَكَ بِهِۦۖ وَيَغْفِرُ مَا دُونَ ذَٰلِكَ لِمَنْ يَّشَآءُۖ وَمَنْ يُّشْرِكْ بِاللَّهِ فَقَدِ اِ۪فْتَر۪ىٰٓ إِثْماً عَظِيماًۖ","اَلَمْ تَرَ إِلَى اَ۬لذِينَ يُزَكُّونَ أَنفُسَهُمۖ بَلِ اِ۬للَّهُ يُزَكِّے مَنْ يَّشَآءُۖ وَلَا يُظْلَمُونَ فَتِيلاًۖ","اُ۟نظُرْ كَيْفَ يَفْتَرُونَ عَلَى اَ۬للَّهِ اِ۬لْكَذِبَ وَكَف۪ىٰ بِهِۦٓ إِثْماٗ مُّبِيناًۖ","اَلَمْ تَرَ إِلَى اَ۬لذِينَ أُوتُواْ نَصِيباٗ مِّنَ اَ۬لْكِتَٰبِ يُومِنُونَ بِالْجِبْتِ وَالطَّٰغُوتِ وَيَقُولُونَ لِلذِينَ كَفَرُواْ هَٰٓؤُلَآءِ اَ۬هْد۪ىٰ مِنَ اَ۬لذِينَ ءَامَنُواْ سَبِيلاًۖ","ا۟وْلَٰٓئِكَ اَ۬لذِينَ لَعَنَهُمُ اُ۬للَّهُۖ وَمَنْ يَّلْعَنِ اِ۬للَّهُ فَلَن تَجِدَ لَهُۥ نَصِيراًۖ","اَمْ لَهُمْ نَصِيبٞ مِّنَ اَ۬لْمُلْكِ فَإِذاٗ لَّا يُوتُونَ اَ۬لنَّاسَ نَقِيراًۖ","اَمْ يَحْسُدُونَ اَ۬لنَّاسَ عَلَىٰ مَآ ءَات۪يٰهُمُ اُ۬للَّهُ مِن فَضْلِهِۦۖ فَقَدَ اٰتَيْنَآ ءَالَ إِبْرَٰهِيمَ اَ۬لْكِتَٰبَ وَالْحِكْمَةَ وَءَاتَيْنَٰهُم مُّلْكاً عَظِيماٗۖ","فَمِنْهُم مَّنَ اٰمَنَ بِهِۦ وَمِنْهُم مَّن صَدَّ عَنْهُۖ وَكَف۪ىٰ بِجَهَنَّمَ سَعِيراًۖ","اِنَّ اَ۬لذِينَ كَفَرُواْ بِـَٔايَٰتِنَا سَوْفَ نُصْلِيهِمْ نَاراٗۖ كُلَّمَا نَضِجَتْ جُلُودُهُم بَدَّلْنَٰهُمْ جُلُوداً غَيْرَهَا لِيَذُوقُواْ اُ۬لْعَذَابَۖ إِنَّ اَ۬للَّهَ كَانَ عَزِيزاً حَكِيماٗۖ","وَالذِينَ ءَامَنُواْ وَعَمِلُواْ اُ۬لصَّٰلِحَٰتِ سَنُدْخِلُهُمْ جَنَّٰتٖ تَجْرِے مِن تَحْتِهَا اَ۬لَانْهَٰرُ خَٰلِدِينَ فِيهَآ أَبَداٗۖ لَّهُمْ فِيهَآ أَزْوَٰجٞ مُّطَهَّرَةٞۖ وَنُدْخِلُهُمْ ظِلّاٗ ظَلِيلاًۖ","۞ اِنَّ اَ۬للَّهَ يَامُرُكُمُۥٓ أَن تُوَ۬دُّواْ اُ۬لَامَٰنَٰتِ إِلَىٰٓ أَهْلِهَا وَإِذَا حَكَمْتُم بَيْنَ اَ۬لنَّاسِ أَن تَحْكُمُواْ بِالْعَدْلِۖ إِنَّ اَ۬للَّهَ نِعِمَّا يَعِظُكُم بِهِۦٓۖ إِنَّ اَ۬للَّهَ كَانَ سَمِيعاَۢ بَصِيراٗۖ","يَٰٓأَيُّهَا اَ۬لذِينَ ءَامَنُوٓاْ أَطِيعُواْ اُ۬للَّهَ وَأَطِيعُواْ اُ۬لرَّسُولَ وَأُوْلِے اِ۬لَامْرِ مِنكُمْۖ فَإِن تَنَٰزَعْتُمْ فِے شَےْءٖ فَرُدُّوهُ إِلَى اَ۬للَّهِ وَالرَّسُولِ إِن كُنتُمْ تُومِنُونَ بِاللَّهِ وَالْيَوْمِ اِ۬لَاخِرِۖ ذَٰلِكَ خَيْرٞ وَأَحْسَنُ تَاوِيلاًۖ","اَلَمْ تَرَ إِلَى اَ۬لذِينَ يَزْعُمُونَ أَنَّهُمُۥٓ ءَامَنُواْ بِمَآ أُنزِلَ إِلَيْكَ وَمَآ أُنزِلَ مِن قَبْلِكَ يُرِيدُونَ أَنْ يَّتَحَاكَمُوٓاْ إِلَى اَ۬لطَّٰغُوتِ وَقَدُ ا۟مِرُوٓاْ أَنْ يَّكْفُرُواْ بِهِۦۖ وَيُرِيدُ اُ۬لشَّيْطَٰنُ أَنْ يُّضِلَّهُمْ ضَلَٰلاَۢ بَعِيداٗۖ","وَإِذَا قِيلَ لَهُمْ تَعَالَوِاْ اِلَىٰ مَآ أَنزَلَ اَ۬للَّهُ وَإِلَى اَ۬لرَّسُولِ رَأَيْتَ اَ۬لْمُنَٰفِقِينَ يَصُدُّونَ عَنكَ صُدُوداٗۖ","فَكَيْفَ إِذَآ أَصَٰبَتْهُم مُّصِيبَةُۢ بِمَا قَدَّمَتَ اَيْدِيهِمْ ثُمَّ جَآءُوكَ يَحْلِفُونَ بِاللَّهِ إِنَ اَرَدْنَآ إِلَّآ إِحْسَٰناٗ وَتَوْفِيقاًۖ","ا۟وْلَٰٓئِكَ اَ۬لذِينَ يَعْلَمُ اُ۬للَّهُ مَا فِے قُلُوبِهِمْ فَأَعْرِضْ عَنْهُمْ وَعِظْهُمْ وَقُل لَّهُمْ فِےٓ أَنفُسِهِمْ قَوْلاَۢ بَلِيغاٗۖ","وَمَآ أَرْسَلْنَا مِن رَّسُولٍ اِلَّا لِيُطَاعَ بِإِذْنِ اِ۬للَّهِۖ وَلَوَ اَنَّهُمُۥٓ إِذ ظَّلَمُوٓاْ أَنفُسَهُمْ جَآءُوكَ فَاسْتَغْفَرُواْ اُ۬للَّهَ وَاسْتَغْفَرَ لَهُمُ اُ۬لرَّسُولُ لَوَجَدُواْ اُ۬للَّهَ تَوَّاباٗ رَّحِيماٗۖ","۞ فَلَا وَرَبِّكَ لَا يُومِنُونَ حَتَّىٰ يُحَكِّمُوكَ فِيمَا شَجَرَ بَيْنَهُمْ ثُمَّ لَا يَجِدُواْ فِےٓ أَنفُسِهِمْ حَرَجاٗ مِّمَّا قَضَيْتَ وَيُسَلِّمُواْ تَسْلِيماٗۖ","وَلَوَ اَنَّا كَتَبْنَا عَلَيْهِمُۥٓ أَنُ اُ۟قْتُلُوٓاْ أَنفُسَكُمُۥٓ أَوُ اُ۟خْرُجُواْ مِن دِيٰ۪رِكُم مَّا فَعَلُوهُ إِلَّا قَلِيلٞ مِّنْهُمْۖ وَلَوَ اَنَّهُمْ فَعَلُواْ مَا يُوعَظُونَ بِهِۦ لَكَانَ خَيْراٗ لَّهُمْ وَأَشَدَّ تَثْبِيتاٗۖ","وَإِذاٗ لَّأٓتَيْنَٰهُم مِّن لَّدُنَّآ أَجْراً عَظِيماٗ","وَلَهَدَيْنَٰهُمْ صِرَٰطاٗ مُّسْتَقِيماٗۖ","وَمَنْ يُّطِعِ اِ۬للَّهَ وَالرَّسُولَ فَأُوْلَٰٓئِكَ مَعَ اَ۬لذِينَ أَنْعَمَ اَ۬للَّهُ عَلَيْهِم مِّنَ اَ۬لنَّبِيٓـِٕۧنَ وَالصِّدِّيقِينَ وَالشُّهَدَآءِ وَالصَّٰلِحِينَۖ وَحَسُنَ أُوْلَٰٓئِكَ رَفِيقاٗۖ","ذَٰلِكَ اَ۬لْفَضْلُ مِنَ اَ۬للَّهِۖ وَكَف۪ىٰ بِاللَّهِ عَلِيماٗۖ","يَٰٓأَيُّهَا اَ۬لذِينَ ءَامَنُواْ خُذُواْ حِذْرَكُمْ فَانفِرُواْ ثُبَاتٍ اَوِ اِ۪نفِرُواْ جَمِيعاٗۖ","وَإِنَّ مِنكُمْ لَمَن لَّيُبَطِّئَنَّۖ فَإِنَ اَصَٰبَتْكُم مُّصِيبَةٞ قَالَ قَدَ اَنْعَمَ اَ۬للَّهُ عَلَيَّ إِذْ لَمَ اَكُن مَّعَهُمْ شَهِيداٗۖ","وَلَئِنَ اَصَٰبَكُمْ فَضْلٞ مِّنَ اَ۬للَّهِ لَيَقُولَنَّ كَأَن لَّمْ يَكُنۢ بَيْنَكُمْ وَبَيْنَهُۥ مَوَدَّةٞ يَٰلَيْتَنِے كُنتُ مَعَهُمْ فَأَفُوزَ فَوْزاً عَظِيماٗۖ","۞ فَلْيُقَٰتِلْ فِے سَبِيلِ اِ۬للَّهِ اِ۬لذِينَ يَشْرُونَ اَ۬لْحَيَوٰةَ اَ۬لدُّنْي۪ا بِالَاخِرَةِۖ وَمَنْ يُّقَٰتِلْ فِے سَبِيلِ اِ۬للَّهِ فَيُقْتَلَ اَوْ يَغْلِبْ فَسَوْفَ نُوتِيهِ أَجْراً عَظِيماٗۖ","وَمَا لَكُمْ لَا تُقَٰتِلُونَ فِے سَبِيلِ اِ۬للَّهِ وَالْمُسْتَضْعَفِينَ مِنَ اَ۬لرِّجَالِ وَالنِّسَآءِ وَالْوِلْدَٰنِ اِ۬لذِينَ يَقُولُونَ رَبَّنَآ أَخْرِجْنَا مِنْ هَٰذِهِ اِ۬لْقَرْيَةِ اِ۬لظَّالِمِ أَهْلُهَا وَاجْعَل لَّنَا مِن لَّدُنكَ وَلِيّاٗ وَاجْعَل لَّنَا مِن لَّدُنكَ نَصِيراًۖ","اِ۬لذِينَ ءَامَنُواْ يُقَٰتِلُونَ فِے سَبِيلِ اِ۬للَّهِۖ وَالذِينَ كَفَرُواْ يُقَٰتِلُونَ فِے سَبِيلِ اِ۬لطَّٰغُوتِۖ فَقَٰتِلُوٓاْ أَوْلِيَآءَ اَ۬لشَّيْطَٰنِۖ إِنَّ كَيْدَ اَ۬لشَّيْطَٰنِ كَانَ ضَعِيفاًۖ","اَلَمْ تَرَ إِلَى اَ۬لذِينَ قِيلَ لَهُمْ كُفُّوٓاْ أَيْدِيَكُمْ وَأَقِيمُواْ اَ۬لصَّلَوٰةَ وَءَاتُواْ اُ۬لزَّكَوٰةَۖ فَلَمَّا كُتِبَ عَلَيْهِمُ اُ۬لْقِتَالُ إِذَا فَرِيقٞ مِّنْهُمْ يَخْشَوْنَ اَ۬لنَّاسَ كَخَشْيَةِ اِ۬للَّهِ أَوَ اَشَدَّ خَشْيَةٗۖ وَقَالُواْ رَبَّنَا لِمَ كَتَبْتَ عَلَيْنَا اَ۬لْقِتَالَ لَوْلَآ أَخَّرْتَنَآ إِلَىٰٓ أَجَلٖ قَرِيبٖۖ قُلْ مَتَٰعُ اُ۬لدُّنْي۪ا قَلِيلٞۖ وَالَاخِرَةُ خَيْرٞ لِّمَنِ اِ۪تَّق۪ىٰۖ وَلَا تُظْلَمُونَ فَتِيلاًۖ","اَيْنَمَا تَكُونُواْ يُدْرِككُّمُ اُ۬لْمَوْتُ وَلَوْ كُنتُمْ فِے بُرُوجٖ مُّشَيَّدَةٖۖ وَإِن تُصِبْهُمْ حَسَنَةٞ يَقُولُواْ هَٰذِهِۦ مِنْ عِندِ اِ۬للَّهِۖ وَإِن تُصِبْهُمْ سَيِّئَةٞ يَقُولُواْ هَٰذِهِۦ مِنْ عِندِكَۖ قُلْ كُلّٞ مِّنْ عِندِ اِ۬للَّهِۖ فَمَالِ هَٰٓؤُلَآءِ اِ۬لْقَوْمِ لَا يَكَادُونَ يَفْقَهُونَ حَدِيثاٗۖ","۞ مَّآ أَصَابَكَ مِنْ حَسَنَةٖ فَمِنَ اَ۬للَّهِۖ وَمَآ أَصَابَكَ مِن سَيِّئَةٖ فَمِن نَّفْسِكَۖ وَأَرْسَلْنَٰكَ لِلنَّاسِ رَسُولاٗۖ وَكَف۪ىٰ بِاللَّهِ شَهِيداٗۖ","مَّنْ يُّطِعِ اِ۬لرَّسُولَ فَقَدَ اَطَاعَ اَ۬للَّهَۖ وَمَن تَوَلّ۪ىٰ فَمَآ أَرْسَلْنَٰكَ عَلَيْهِمْ حَفِيظاٗۖ","وَيَقُولُونَ طَاعَةٞۖ فَإِذَا بَرَزُواْ مِنْ عِندِكَ بَيَّتَ طَآئِفَةٞ مِّنْهُمْ غَيْرَ اَ۬لذِے تَقُولُۖ وَاللَّهُ يَكْتُبُ مَا يُبَيِّتُونَۖ فَأَعْرِضْ عَنْهُمْ وَتَوَكَّلْ عَلَى اَ۬للَّهِۖ وَكَف۪ىٰ بِاللَّهِ وَكِيلاًۖ","اَفَلَا يَتَدَبَّرُونَ اَ۬لْقُرْءَانَۖ وَلَوْ كَانَ مِنْ عِندِ غَيْرِ اِ۬للَّهِ لَوَجَدُواْ فِيهِ اِ۪خْتِلَٰفاٗ كَثِيراٗۖ","وَإِذَا جَآءَهُمُۥٓ أَمْرٞ مِّنَ اَ۬لَامْنِ أَوِ اِ۬لْخَوْفِ أَذَاعُواْ بِهِۦۖ وَلَوْ رَدُّوهُ إِلَى اَ۬لرَّسُولِ وَإِلَىٰٓ أُوْلِے اِ۬لَامْرِ مِنْهُمْ لَعَلِمَهُ اُ۬لذِينَ يَسْتَنۢبِطُونَهُۥ مِنْهُمْۖ وَلَوْلَا فَضْلُ اُ۬للَّهِ عَلَيْكُمْ وَرَحْمَتُهُۥ لَاتَّبَعْتُمُ اُ۬لشَّيْطَٰنَ إِلَّا قَلِيلاٗۖ","فَقَٰتِلْ فِے سَبِيلِ اِ۬للَّهِۖ لَا تُكَلَّفُ إِلَّا نَفْسَكَۖ وَحَرِّضِ اِ۬لْمُومِنِينَۖ عَسَى اَ۬للَّهُ أَنْ يَّكُفَّ بَأْسَ اَ۬لذِينَ كَفَرُواْۖ وَاللَّهُ أَشَدُّ بَأْساٗ وَأَشَدُّ تَنكِيلاٗۖ","مَّنْ يَّشْفَعْ شَفَٰعَةً حَسَنَةٗ يَكُن لَّهُۥ نَصِيبٞ مِّنْهَاۖ وَمَنْ يَّشْفَعْ شَفَٰعَةٗ سَيِّئَةٗ يَكُن لَّهُۥ كِفْلٞ مِّنْهَاۖ وَكَانَ اَ۬للَّهُ عَلَىٰ كُلِّ شَےْءٖ مُّقِيتاٗۖ","وَإِذَا حُيِّيتُم بِتَحِيَّةٖ فَحَيُّواْ بِأَحْسَنَ مِنْهَآ أَوْ رُدُّوهَآۖ إِنَّ اَ۬للَّهَ كَانَ عَلَىٰ كُلِّ شَےْءٍ حَسِيباًۖ","۞ اِ۬للَّهُ لَآ إِلَٰهَ إِلَّا هُوَۖ لَيَجْمَعَنَّكُمُۥٓ إِلَىٰ يَوْمِ اِ۬لْقِيَٰمَةِ لَا رَيْبَ فِيهِۖ وَمَنَ اَصْدَقُ مِنَ اَ۬للَّهِ حَدِيثاٗۖ","فَمَا لَكُمْ فِے اِ۬لْمُنَٰفِقِينَ فِئَتَيْنِ وَاللَّهُ أَرْكَسَهُم بِمَا كَسَبُوٓاْۖ أَتُرِيدُونَ أَن تَهْدُواْ مَنَ اَضَلَّ اَ۬للَّهُۖ وَمَنْ يُّضْلِلِ اِ۬للَّهُ فَلَن تَجِدَ لَهُۥ سَبِيلاٗۖ","وَدُّواْ لَوْ تَكْفُرُونَ كَمَا كَفَرُواْ فَتَكُونُونَ سَوَآءٗۖ فَلَا تَتَّخِذُواْ مِنْهُمُۥٓ أَوْلِيَآءَ حَتَّىٰ يُهَاجِرُواْ فِے سَبِيلِ اِ۬للَّهِۖ فَإِن تَوَلَّوْاْ فَخُذُوهُمْ وَاقْتُلُوهُمْ حَيْثُ وَجَدتُّمُوهُمْ وَلَا تَتَّخِذُواْ مِنْهُمْ وَلِيّاٗ وَلَا نَصِيراً","اِلَّا اَ۬لذِينَ يَصِلُونَ إِلَىٰ قَوْمِۢ بَيْنَكُمْ وَبَيْنَهُم مِّيثَٰقٌ اَوْ جَآءُوكُمْۖ حَصِرَتْ صُدُورُهُمُۥٓ أَنْ يُّقَٰتِلُوكُمُۥٓ أَوْ يُقَٰتِلُواْ قَوْمَهُمْۖ وَلَوْ شَآءَ اَ۬للَّهُ لَسَلَّطَهُمْ عَلَيْكُمْ فَلَقَٰتَلُوكُمْۖ فَإِنِ اِ۪عْتَزَلُوكُمْ فَلَمْ يُقَٰتِلُوكُمْ وَأَلْقَوِاْ اِلَيْكُمُ اُ۬لسَّلَمَ فَمَا جَعَلَ اَ۬للَّهُ لَكُمْ عَلَيْهِمْ سَبِيلاٗۖ","سَتَجِدُونَ ءَاخَرِينَ يُرِيدُونَ أَنْ يَّامَنُوكُمْ وَيَامَنُواْ قَوْمَهُمْ كُلَّ مَا رُدُّوٓاْ إِلَى اَ۬لْفِتْنَةِ أُرْكِسُواْ فِيهَاۖ فَإِن لَّمْ يَعْتَزِلُوكُمْ وَيُلْقُوٓاْ إِلَيْكُمُ اُ۬لسَّلَمَ وَيَكُفُّوٓاْ أَيْدِيَهُمْ فَخُذُوهُمْ وَاقْتُلُوهُمْ حَيْثُ ثَقِفْتُمُوهُمْۖ وَأُوْلَٰٓئِكُمْ جَعَلْنَا لَكُمْ عَلَيْهِمْ سُلْطَٰناٗ مُّبِيناٗۖ","وَمَا كَانَ لِمُومِنٍ اَنْ يَّقْتُلَ مُومِناًۖ اِلَّا خَطَـٔاٗۖ وَمَن قَتَلَ مُومِناً خَطَـٔاٗ فَتَحْرِيرُ رَقَبَةٖ مُّومِنَةٖ وَدِيَةٞ مُّسَلَّمَةٌ اِلَىٰٓ أَهْلِهِۦٓ إِلَّآ أَنْ يَّصَّدَّقُواْۖ فَإِن كَانَ مِن قَوْمٍ عَدُوّٖ لَّكُمْ وَهُوَ مُومِنٞ فَتَحْرِيرُ رَقَبَةٖ مُّومِنَةٖۖ وَإِن كَانَ مِن قَوْمِۢ بَيْنَكُمْ وَبَيْنَهُم مِّيثَٰقٞ فَدِيَةٞ مُّسَلَّمَةٌ اِلَىٰٓ أَهْلِهِۦ وَتَحْرِيرُ رَقَبَةٖ مُّومِنَةٖۖ ۞ فَمَن لَّمْ يَجِدْ فَصِيَامُ شَهْرَيْنِ مُتَتَابِعَيْنِ تَوْبَةٗ مِّنَ اَ۬للَّهِۖ وَكَانَ اَ۬للَّهُ عَلِيماً حَكِيماٗۖ","وَمَنْ يَّقْتُلْ مُومِناٗ مُّتَعَمِّداٗ فَجَزَآؤُهُۥ جَهَنَّمُ خَٰلِداٗ فِيهَا وَغَضِبَ اَ۬للَّهُ عَلَيْهِ وَلَعَنَهُۥ وَأَعَدَّ لَهُۥ عَذَاباً عَظِيماٗۖ","يَٰٓأَيُّهَا اَ۬لذِينَ ءَامَنُوٓاْ إِذَا ضَرَبْتُمْ فِے سَبِيلِ اِ۬للَّهِ فَتَبَيَّنُواْۖ وَلَا تَقُولُواْ لِمَنَ اَلْق۪ىٰٓ إِلَيْكُمُ اُ۬لسَّلَمَ لَسْتَ مُومِناٗ تَبْتَغُونَ عَرَضَ اَ۬لْحَيَوٰةِ اِ۬لدُّنْي۪ا فَعِندَ اَ۬للَّهِ مَغَانِمُ كَثِيرَةٞۖ كَذَٰلِكَ كُنتُم مِّن قَبْلُ فَمَنَّ اَ۬للَّهُ عَلَيْكُمْۖ فَتَبَيَّنُوٓاْۖ إِنَّ اَ۬للَّهَ كَانَ بِمَا تَعْمَلُونَ خَبِيراٗۖ","لَّا يَسْتَوِے اِ۬لْقَٰعِدُونَ مِنَ اَ۬لْمُومِنِينَ غَيْرَ أُوْلِے اِ۬لضَّرَرِ وَالْمُجَٰهِدُونَ فِے سَبِيلِ اِ۬للَّهِ بِأَمْوَٰلِهِمْ وَأَنفُسِهِمْۖ فَضَّلَ اَ۬للَّهُ اُ۬لْمُجَٰهِدِينَ بِأَمْوَٰلِهِمْ وَأَنفُسِهِمْ عَلَى اَ۬لْقَٰعِدِينَ دَرَجَةٗۖ وَكُلّاٗ وَعَدَ اَ۬للَّهُ اُ۬لْحُسْن۪ىٰۖ وَفَضَّلَ اَ۬للَّهُ اُ۬لْمُجَٰهِدِينَ عَلَى اَ۬لْقَٰعِدِينَ أَجْراً عَظِيماٗ","دَرَجَٰتٖ مِّنْهُ وَمَغْفِرَةٗ وَرَحْمَةٗۖ وَكَانَ اَ۬للَّهُ غَفُوراٗ رَّحِيماًۖ","اِنَّ اَ۬لذِينَ تَوَفّ۪يٰهُمُ اُ۬لْمَلَٰٓئِكَةُ ظَالِمِےٓ أَنفُسِهِمْ قَالُواْ فِيمَ كُنتُمْۖ قَالُواْ كُنَّا مُسْتَضْعَفِينَ فِے اِ۬لَارْضِۖ قَالُوٓاْ أَلَمْ تَكُنَ اَرْضُ اُ۬للَّهِ وَٰسِعَةٗ فَتُهَاجِرُواْ فِيهَاۖ فَأُوْلَٰٓئِكَ مَأْو۪يٰهُمْ جَهَنَّمُ وَسَآءَتْ مَصِيراً","اِلَّا اَ۬لْمُسْتَضْعَفِينَ مِنَ اَ۬لرِّجَالِ وَالنِّسَآءِ وَالْوِلْدَٰنِ لَا يَسْتَطِيعُونَ حِيلَةٗ وَلَا يَهْتَدُونَ سَبِيلاٗۖ","فَأُوْلَٰٓئِكَ عَسَى اَ۬للَّهُ أَنْ يَّعْفُوَ عَنْهُمْۖ وَكَانَ اَ۬للَّهُ عَفُوّاً غَفُوراٗۖ","۞ وَمَنْ يُّهَاجِرْ فِے سَبِيلِ اِ۬للَّهِ يَجِدْ فِے اِ۬لَارْضِ مُرَٰغَماٗ كَثِيراٗ وَسَعَةٗۖ وَمَنْ يَّخْرُجْ مِنۢ بَيْتِهِۦ مُهَاجِراً اِلَى اَ۬للَّهِ وَرَسُولِهِۦ ثُمَّ يُدْرِكْهُ اُ۬لْمَوْتُ فَقَدْ وَقَعَ أَجْرُهُۥ عَلَى اَ۬للَّهِۖ وَكَانَ اَ۬للَّهُ غَفُوراٗ رَّحِيماٗۖ","وَإِذَا ضَرَبْتُمْ فِے اِ۬لَارْضِ فَلَيْسَ عَلَيْكُمْ جُنَاحٌ اَن تَقْصُرُواْ مِنَ اَ۬لصَّلَوٰةِ إِنْ خِفْتُمُۥٓ أَنْ يَّفْتِنَكُمُ اُ۬لذِينَ كَفَرُوٓاْۖ إِنَّ اَ۬لْكٰ۪فِرِينَ كَانُواْ لَكُمْ عَدُوّاٗ مُّبِيناٗۖ","وَإِذَا كُنتَ فِيهِمْ فَأَقَمْتَ لَهُمُ اُ۬لصَّلَوٰةَ فَلْتَقُمْ طَآئِفَةٞ مِّنْهُم مَّعَكَ وَلْيَاخُذُوٓاْ أَسْلِحَتَهُمْۖ فَإِذَا سَجَدُواْ فَلْيَكُونُواْ مِنْ وَّرَآئِكُمْۖ وَلْتَاتِ طَآئِفَةٌ ا۟خْر۪ىٰ لَمْ يُصَلُّواْ فَلْيُصَلُّواْ مَعَكَ وَلْيَاخُذُواْ حِذْرَهُمْ وَأَسْلِحَتَهُمْۖ وَدَّ اَ۬لذِينَ كَفَرُواْ لَوْ تَغْفُلُونَ عَنَ اَسْلِحَتِكُمْ وَأَمْتِعَتِكُمْ فَيَمِيلُونَ عَلَيْكُم مَّيْلَةٗ وَٰحِدَةٗۖ وَلَا جُنَاحَ عَلَيْكُمُۥٓ إِن كَانَ بِكُمُۥٓ أَذىٗ مِّن مَّطَرٍ اَوْ كُنتُم مَّرْض۪ىٰٓ أَن تَضَعُوٓاْ أَسْلِحَتَكُمْۖ وَخُذُواْ حِذْرَكُمُۥٓۖ إِنَّ اَ۬للَّهَ أَعَدَّ لِلْكٰ۪فِرِينَ عَذَاباٗ مُّهِيناٗۖ","فَإِذَا قَضَيْتُمُ اُ۬لصَّلَوٰةَ فَاذْكُرُواْ اُ۬للَّهَ قِيَٰماٗ وَقُعُوداٗ وَعَلَىٰ جُنُوبِكُمْۖ فَإِذَا اَ۪طْمَأْنَنتُمْ فَأَقِيمُواْ اُ۬لصَّلَوٰةَۖ إِنَّ اَ۬لصَّلَوٰةَ كَانَتْ عَلَى اَ۬لْمُومِنِينَ كِتَٰباٗ مَّوْقُوتاٗۖ","وَلَا تَهِنُواْ فِے اِ۪بْتِغَآءِ اِ۬لْقَوْمِۖ إِن تَكُونُواْ تَالَمُونَ فَإِنَّهُمْ يَالَمُونَ كَمَا تَالَمُونَ وَتَرْجُونَ مِنَ اَ۬للَّهِ مَا لَا يَرْجُونَۖ وَكَانَ اَ۬للَّهُ عَلِيماً حَكِيماًۖ","۞ اِنَّآ أَنزَلْنَآ إِلَيْكَ اَ۬لْكِتَٰبَ بِالْحَقِّ لِتَحْكُمَ بَيْنَ اَ۬لنَّاسِ بِمَآ أَر۪يٰكَ اَ۬للَّهُۖ وَلَا تَكُن لِّلْخَآئِنِينَ خَصِيماٗۖ","وَاسْتَغْفِرِ اِ۬للَّهَۖ إِنَّ اَ۬للَّهَ كَانَ غَفُوراٗ رَّحِيماٗۖ","وَلَا تُجَٰدِلْ عَنِ اِ۬لذِينَ يَخْتَانُونَ أَنفُسَهُمُۥٓۖ إِنَّ اَ۬للَّهَ لَا يُحِبُّ مَن كَانَ خَوَّاناً اَثِيماٗۖ","يَسْتَخْفُونَ مِنَ اَ۬لنَّاسِ وَلَا يَسْتَخْفُونَ مِنَ اَ۬للَّهِ وَهُوَ مَعَهُمُۥٓ إِذْ يُبَيِّتُونَ مَا لَا يَرْض۪ىٰ مِنَ اَ۬لْقَوْلِۖ وَكَانَ اَ۬للَّهُ بِمَا يَعْمَلُونَ مُحِيطاًۖ","هَآنتُمْ هَٰٓؤُلَآءِ جَٰدَلْتُمْ عَنْهُمْ فِے اِ۬لْحَيَوٰةِ اِ۬لدُّنْي۪ا فَمَنْ يُّجَٰدِلُ اُ۬للَّهَ عَنْهُمْ يَوْمَ اَ۬لْقِيَٰمَةِ أَم مَّنْ يَّكُونُ عَلَيْهِمْ وَكِيلاٗۖ","وَمَنْ يَّعْمَلْ سُوٓءاً اَوْ يَظْلِمْ نَفْسَهُۥ ثُمَّ يَسْتَغْفِرِ اِ۬للَّهَ يَجِدِ اِ۬للَّهَ غَفُوراٗ رَّحِيماٗۖ","وَمَنْ يَّكْسِبِ اِثْماٗ فَإِنَّمَا يَكْسِبُهُۥ عَلَىٰ نَفْسِهِۦۖ وَكَانَ اَ۬للَّهُ عَلِيماً حَكِيماٗۖ","وَمَنْ يَّكْسِبْ خَطِيٓـَٔةً اَوِ اِثْماٗ ثُمَّ يَرْمِ بِهِۦ بَرِيٓـٔاٗ فَقَدِ اِ۪حْتَمَلَ بُهْتَٰناٗ وَإِثْماٗ مُّبِيناٗۖ","وَلَوْلَا فَضْلُ اُ۬للَّهِ عَلَيْكَ وَرَحْمَتُهُۥ لَهَمَّت طَّآئِفَةٞ مِّنْهُمُۥٓ أَنْ يُّضِلُّوكَۖ وَمَا يُضِلُّونَ إِلَّآ أَنفُسَهُمْ وَمَا يَضُرُّونَكَ مِن شَےْءٖۖ وَأَنزَلَ اَ۬للَّهُ عَلَيْكَ اَ۬لْكِتَٰبَ وَالْحِكْمَةَ وَعَلَّمَكَ مَا لَمْ تَكُن تَعْلَمُۖ وَكَانَ فَضْلُ اُ۬للَّهِ عَلَيْكَ عَظِيماٗۖ","۞ لَّا خَيْرَ فِے كَثِيرٖ مِّن نَّجْو۪يٰهُمُۥٓ إِلَّا مَنَ اَمَرَ بِصَدَقَةٍ اَوْ مَعْرُوفٍ اَوِ اِصْلَٰحِۢ بَيْنَ اَ۬لنَّاسِۖ وَمَنْ يَّفْعَلْ ذَٰلِكَ اَ۪بْتِغَآءَ مَرْضَاتِ اِ۬للَّهِ فَسَوْفَ نُوتِيهِ أَجْراً عَظِيماٗۖ","وَمَنْ يُّشَاقِقِ اِ۬لرَّسُولَ مِنۢ بَعْدِ مَا تَبَيَّنَ لَهُ اُ۬لْهُد۪ىٰ وَيَتَّبِعْ غَيْرَ سَبِيلِ اِ۬لْمُومِنِينَ نُوَلِّهِۦ مَا تَوَلّ۪ىٰ وَنُصْلِهِۦ جَهَنَّمَۖ وَسَآءَتْ مَصِيراًۖ","اِنَّ اَ۬للَّهَ لَا يَغْفِرُ أَنْ يُّشْرَكَ بِهِۦ وَيَغْفِرُ مَا دُونَ ذَٰلِكَ لِمَنْ يَّشَآءُۖ وَمَنْ يُّشْرِكْ بِاللَّهِ فَقَد ضَّلَّ ضَلَٰلاَۢ بَعِيداًۖ","اِنْ يَّدْعُونَ مِن دُونِهِۦٓ إِلَّآ إِنَٰثاٗ وَإِنْ يَّدْعُونَ إِلَّا شَيْطَٰناٗ مَّرِيداٗ","لَّعَنَهُ اُ۬للَّهُۖ وَقَالَ لَأَتَّخِذَنَّ مِنْ عِبَادِكَ نَصِيباٗ مَّفْرُوضاٗ","وَلَأُضِلَّنَّهُمْ وَلَأُمَنِّيَنَّهُمْ وَلَأٓمُرَنَّهُمْ فَلَيُبَتِّكُنَّ ءَاذَانَ اَ۬لَانْعَٰمِ وَلَأٓمُرَنَّهُمْ فَلَيُغَيِّرُنَّ خَلْقَ اَ۬للَّهِۖ وَمَنْ يَّتَّخِذِ اِ۬لشَّيْطَٰنَ وَلِيّاٗ مِّن دُونِ اِ۬للَّهِ فَقَدْ خَسِرَ خُسْرَاناٗ مُّبِيناٗۖ","يَعِدُهُمْ وَيُمَنِّيهِمْۖ وَمَا يَعِدُهُمُ اُ۬لشَّيْطَٰنُ إِلَّا غُرُوراًۖ","ا۟وْلَٰٓئِكَ مَأْو۪يٰهُمْ جَهَنَّمُۖ وَلَا يَجِدُونَ عَنْهَا مَحِيصاٗۖ","وَالذِينَ ءَامَنُواْ وَعَمِلُواْ اُ۬لصَّٰلِحَٰتِ سَنُدْخِلُهُمْ جَنَّٰتٖ تَجْرِے مِن تَحْتِهَا اَ۬لَانْهَٰرُ خَٰلِدِينَ فِيهَآ أَبَداٗۖ وَعْدَ اَ۬للَّهِ حَقّاٗۖ وَمَنَ اَصْدَقُ مِنَ اَ۬للَّهِ قِيلاٗۖ","لَّيْسَ بِأَمَانِيِّكُمْ وَلَآ أَمَانِيِّ أَهْلِ اِ۬لْكِتَٰبِۖ مَنْ يَّعْمَلْ سُوٓءاٗ يُجْزَ بِهِۦ وَلَا يَجِدْ لَهُۥ مِن دُونِ اِ۬للَّهِ وَلِيّاٗ وَلَا نَصِيراٗۖ","۞ وَمَنْ يَّعْمَلْ مِنَ اَ۬لصَّٰلِحَٰتِ مِن ذَكَرٍ اَوُ ا۟نث۪ىٰ وَهُوَ مُومِنٞ فَأُوْلَٰٓئِكَ يَدْخُلُونَ اَ۬لْجَنَّةَ وَلَا يُظْلَمُونَ نَقِيراٗۖ","وَمَنَ اَحْسَنُ دِيناٗ مِّمَّنَ اَسْلَمَ وَجْهَهُۥ لِلهِ وَهُوَ مُحْسِنٞ وَاتَّبَعَ مِلَّةَ إِبْرَٰهِيمَ حَنِيفاٗۖ وَاتَّخَذَ اَ۬للَّهُ إِبْرَٰهِيمَ خَلِيلاٗۖ","وَلِلهِ مَا فِے اِ۬لسَّمَٰوَٰتِ وَمَا فِے اِ۬لَارْضِۖ وَكَانَ اَ۬للَّهُ بِكُلِّ شَےْءٖ مُّحِيطاٗۖ","وَيَسْتَفْتُونَكَ فِے اِ۬لنِّسَآءِۖ قُلِ اِ۬للَّهُ يُفْتِيكُمْ فِيهِنَّ وَمَا يُتْل۪ىٰ عَلَيْكُمْ فِے اِ۬لْكِتَٰبِ فِے يَتَٰمَى اَ۬لنِّسَآءِ اِ۬لتِے لَا تُوتُونَهُنَّ مَا كُتِبَ لَهُنَّ وَتَرْغَبُونَ أَن تَنكِحُوهُنَّ وَالْمُسْتَضْعَفِينَ مِنَ اَ۬لْوِلْدَٰنِ وَأَن تَقُومُواْ لِلْيَتَٰم۪ىٰ بِالْقِسْطِۖ وَمَا تَفْعَلُواْ مِنْ خَيْرٖ فَإِنَّ اَ۬للَّهَ كَانَ بِهِۦ عَلِيماٗۖ","وَإِنِ اِ۪مْرَأَةٌ خَافَتْ مِنۢ بَعْلِهَا نُشُوزاً اَوِ اِعْرَاضاٗ فَلَا جُنَاحَ عَلَيْهِمَآ أَنْ يَّصَّٰلَحَا بَيْنَهُمَا صُلْحاٗۖ وَالصُّلْحُ خَيْرٞۖ وَأُحْضِرَتِ اِ۬لَانفُسُ اُ۬لشُّحَّۖ وَإِن تُحْسِنُواْ وَتَتَّقُواْ فَإِنَّ اَ۬للَّهَ كَانَ بِمَا تَعْمَلُونَ خَبِيراٗۖ","وَلَن تَسْتَطِيعُوٓاْ أَن تَعْدِلُواْ بَيْنَ اَ۬لنِّسَآءِ وَلَوْ حَرَصْتُمْۖ فَلَا تَمِيلُواْ كُلَّ اَ۬لْمَيْلِ فَتَذَرُوهَا كَالْمُعَلَّقَةِۖ وَإِن تُصْلِحُواْ وَتَتَّقُواْ فَإِنَّ اَ۬للَّهَ كَانَ غَفُوراٗ رَّحِيماٗۖ","۞ وَإِنْ يَّتَفَرَّقَا يُغْنِ اِ۬للَّهُ كُلّاٗ مِّن سَعَتِهِۦۖ وَكَانَ اَ۬للَّهُ وَٰسِعاً حَكِيماٗۖ","وَلِلهِ مَا فِے اِ۬لسَّمَٰوَٰتِ وَمَا فِے اِ۬لَارْضِۖ وَلَقَدْ وَصَّيْنَا اَ۬لذِينَ أُوتُواْ اُ۬لْكِتَٰبَ مِن قَبْلِكُمْ وَإِيَّاكُمُۥٓ أَنِ اِ۪تَّقُواْ اُ۬للَّهَۖ وَإِن تَكْفُرُواْ فَإِنَّ لِلهِ مَا فِے اِ۬لسَّمَٰوَٰتِ وَمَا فِے اِ۬لَارْضِۖ وَكَانَ اَ۬للَّهُ غَنِيّاً حَمِيداٗۖ","وَلِلهِ مَا فِے اِ۬لسَّمَٰوَٰتِ وَمَا فِے اِ۬لَارْضِۖ وَكَف۪ىٰ بِاللَّهِ وَكِيلاًۖ","اِنْ يَّشَأْ يُذْهِبْكُمُۥٓ أَيُّهَا اَ۬لنَّاسُ وَيَاتِ بِـَٔاخَرِينَۖ وَكَانَ اَ۬للَّهُ عَلَىٰ ذَٰلِكَ قَدِيراٗۖ","مَّن كَانَ يُرِيدُ ثَوَابَ اَ۬لدُّنْي۪ا فَعِندَ اَ۬للَّهِ ثَوَابُ اُ۬لدُّنْي۪ا وَالَاخِرَةِۖ وَكَانَ اَ۬للَّهُ سَمِيعاَۢ بَصِيراٗۖ","يَٰٓأَيُّهَا اَ۬لذِينَ ءَامَنُواْ كُونُواْ قَوَّٰمِينَ بِالْقِسْطِ شُهَدَآءَ لِلهِ وَلَوْ عَلَىٰٓ أَنفُسِكُمُۥٓ أَوِ اِ۬لْوَٰلِدَيْنِ وَالَاقْرَبِينَۖ إِنْ يَّكُنْ غَنِيّاً اَوْ فَقِيراٗ فَاللَّهُ أَوْل۪ىٰ بِهِمَا فَلَا تَتَّبِعُواْ اُ۬لْهَو۪ىٰٓ أَن تَعْدِلُواْۖ وَإِن تَلْوُۥٓاْ أَوْ تُعْرِضُواْ فَإِنَّ اَ۬للَّهَ كَانَ بِمَا تَعْمَلُونَ خَبِيراٗۖ","يَٰٓأَيُّهَا اَ۬لذِينَ ءَامَنُوٓاْ ءَامِنُواْ بِاللَّهِ وَرَسُولِهِۦ وَالْكِتَٰبِ اِ۬لذِے نَزَّلَ عَلَىٰ رَسُولِهِۦ وَالْكِتَٰبِ اِ۬لذِےٓ أَنزَلَ مِن قَبْلُۖ وَمَنْ يَّكْفُرْ بِاللَّهِ وَمَلَٰٓئِكَتِهِۦ وَكُتُبِهِۦ وَرُسُلِهِۦ وَالْيَوْمِ اِ۬لَاخِرِ فَقَد ضَّلَّ ضَلَٰلاَۢ بَعِيداًۖ","اِنَّ اَ۬لذِينَ ءَامَنُواْ ثُمَّ كَفَرُواْ ثُمَّ ءَامَنُواْ ثُمَّ كَفَرُواْ ثُمَّ اَ۪زْدَادُواْ كُفْراٗ لَّمْ يَكُنِ اِ۬للَّهُ لِيَغْفِرَ لَهُمْ وَلَا لِيَهْدِيَهُمْ سَبِيلاَۢۖ","بَشِّرِ اِ۬لْمُنَٰفِقِينَ بِأَنَّ لَهُمْ عَذَاباً اَلِيماً","اِ۬لذِينَ يَتَّخِذُونَ اَ۬لْكٰ۪فِرِينَ أَوْلِيَآءَ مِن دُونِ اِ۬لْمُومِنِينَۖ أَيَبْتَغُونَ عِندَهُمُ اُ۬لْعِزَّةَ فَإِنَّ اَ۬لْعِزَّةَ لِلهِ جَمِيعاٗۖ","۞ وَقَدْ نُزِّلَ عَلَيْكُمْ فِے اِ۬لْكِتَٰبِ أَنِ اِذَا سَمِعْتُمُۥٓ ءَايَٰتِ اِ۬للَّهِ يُكْفَرُ بِهَا وَيُسْتَهْزَأُ بِهَا فَلَا تَقْعُدُواْ مَعَهُمْ حَتَّىٰ يَخُوضُواْ فِے حَدِيثٍ غَيْرِهِۦٓۖ إِنَّكُمُۥٓ إِذاٗ مِّثْلُهُمُۥٓۖ إِنَّ اَ۬للَّهَ جَامِعُ اُ۬لْمُنَٰفِقِينَ وَالْكٰ۪فِرِينَ فِے جَهَنَّمَ جَمِيعاً","اِ۬لذِينَ يَتَرَبَّصُونَ بِكُمْ فَإِن كَانَ لَكُمْ فَتْحٞ مِّنَ اَ۬للَّهِ قَالُوٓاْ أَلَمْ نَكُن مَّعَكُمْ وَإِن كَانَ لِلْكٰ۪فِرِينَ نَصِيبٞ قَالُوٓاْ أَلَمْ نَسْتَحْوِذْ عَلَيْكُمْ وَنَمْنَعْكُم مِّنَ اَ۬لْمُومِنِينَۖ فَاللَّهُ يَحْكُمُ بَيْنَكُمْ يَوْمَ اَ۬لْقِيَٰمَةِۖ وَلَنْ يَّجْعَلَ اَ۬للَّهُ لِلْكٰ۪فِرِينَ عَلَى اَ۬لْمُومِنِينَ سَبِيلاًۖ","اِنَّ اَ۬لْمُنَٰفِقِينَ يُخَٰدِعُونَ اَ۬للَّهَ وَهُوَ خَٰدِعُهُمْۖ وَإِذَا قَامُوٓاْ إِلَى اَ۬لصَّلَوٰةِ قَامُواْ كُسَال۪ىٰ يُرَآءُونَ اَ۬لنَّاسَ وَلَا يَذْكُرُونَ اَ۬للَّهَ إِلَّا قَلِيلاٗ","مُّذَبْذَبِينَ بَيْنَ ذَٰلِكَ لَآ إِلَىٰ هَٰٓؤُلَآءِ وَلَآ إِلَىٰ هَٰٓؤُلَآءِۖ وَمَنْ يُّضْلِلِ اِ۬للَّهُ فَلَن تَجِدَ لَهُۥ سَبِيلاٗۖ","يَٰٓأَيُّهَا اَ۬لذِينَ ءَامَنُواْ لَا تَتَّخِذُواْ اُ۬لْكٰ۪فِرِينَ أَوْلِيَآءَ مِن دُونِ اِ۬لْمُومِنِينَۖ أَتُرِيدُونَ أَن تَجْعَلُواْ لِلهِ عَلَيْكُمْ سُلْطَٰناٗ مُّبِيناًۖ","اِنَّ اَ۬لْمُنَٰفِقِينَ فِے اِ۬لدَّرَكِ اِ۬لَاسْفَلِ مِنَ اَ۬لنّ۪ارِ وَلَن تَجِدَ لَهُمْ نَصِيراًۖ","اِلَّا اَ۬لذِينَ تَابُواْ وَأَصْلَحُواْ وَاعْتَصَمُواْ بِاللَّهِ وَأَخْلَصُواْ دِينَهُمْ لِلهِ فَأُوْلَٰٓئِكَ مَعَ اَ۬لْمُومِنِينَۖ وَسَوْفَ يُوتِ اِ۬للَّهُ اُ۬لْمُومِنِينَ أَجْراً عَظِيماٗۖ","مَّا يَفْعَلُ اُ۬للَّهُ بِعَذَابِكُمُۥٓ إِن شَكَرْتُمْ وَءَامَنتُمْۖ وَكَانَ اَ۬للَّهُ شَاكِراً عَلِيماٗۖ","۞ لَّا يُحِبُّ اُ۬للَّهُ اُ۬لْجَهْرَ بِالسُّوٓءِ مِنَ اَ۬لْقَوْلِ إِلَّا مَن ظُلِمَۖ وَكَانَ اَ۬للَّهُ سَمِيعاً عَلِيماًۖ","اِن تُبْدُواْ خَيْراً اَوْ تُخْفُوهُ أَوْ تَعْفُواْ عَن سُوٓءٖ فَإِنَّ اَ۬للَّهَ كَانَ عَفُوّاٗ قَدِيراًۖ","اِنَّ اَ۬لذِينَ يَكْفُرُونَ بِاللَّهِ وَرُسُلِهِۦ وَيُرِيدُونَ أَنْ يُّفَرِّقُواْ بَيْنَ اَ۬للَّهِ وَرُسُلِهِۦ وَيَقُولُونَ نُومِنُ بِبَعْضٖ وَنَكْفُرُ بِبَعْضٖ وَيُرِيدُونَ أَنْ يَّتَّخِذُواْ بَيْنَ ذَٰلِكَ سَبِيلاً","ا۟وْلَٰٓئِكَ هُمُ اُ۬لْكَٰفِرُونَ حَقّاٗۖ وَأَعْتَدْنَا لِلْكٰ۪فِرِينَ عَذَاباٗ مُّهِيناٗۖ","وَالذِينَ ءَامَنُواْ بِاللَّهِ وَرُسُلِهِۦ وَلَمْ يُفَرِّقُواْ بَيْنَ أَحَدٖ مِّنْهُمُۥٓ أُوْلَٰٓئِكَ سَوْفَ نُوتِيهِمُۥٓ أُجُورَهُمْۖ وَكَانَ اَ۬للَّهُ غَفُوراٗ رَّحِيماٗۖ","يَسْـَٔلُكَ أَهْلُ اُ۬لْكِتَٰبِ أَن تُنَزِّلَ عَلَيْهِمْ كِتَٰباٗ مِّنَ اَ۬لسَّمَآءِۖ فَقَدْ سَأَلُواْ مُوس۪ىٰٓ أَكْبَرَ مِن ذَٰلِكَ فَقَالُوٓاْ أَرِنَا اَ۬للَّهَ جَهْرَةٗ فَأَخَذَتْهُمُ اُ۬لصَّٰعِقَةُ بِظُلْمِهِمْۖ ثُمَّ اَ۪تَّخَذُواْ اُ۬لْعِجْلَ مِنۢ بَعْدِ مَا جَآءَتْهُمُ اُ۬لْبَيِّنَٰتُ فَعَفَوْنَا عَن ذَٰلِكَۖ وَءَاتَيْنَا مُوس۪ىٰ سُلْطَٰناٗ مُّبِيناٗۖ","وَرَفَعْنَا فَوْقَهُمُ اُ۬لطُّورَ بِمِيثَٰقِهِمْۖ وَقُلْنَا لَهُمُ اُ۟دْخُلُواْ اُ۬لْبَابَ سُجَّداٗۖ وَقُلْنَا لَهُمْ لَا تَعَدُّواْ فِے اِ۬لسَّبْتِۖ وَأَخَذْنَا مِنْهُم مِّيثَٰقاً غَلِيظاٗۖ","فَبِمَا نَقْضِهِم مِّيثَٰقَهُمْ وَكُفْرِهِم بِـَٔايَٰتِ اِ۬للَّهِ وَقَتْلِهِمُ اُ۬لَانۢبِئَآءَ بِغَيْرِ حَقّٖ وَقَوْلِهِمْ قُلُوبُنَا غُلْفُۢ بَلْ طَبَعَ اَ۬للَّهُ عَلَيْهَا بِكُفْرِهِمْ فَلَا يُومِنُونَ إِلَّا قَلِيلاٗ","وَبِكُفْرِهِمْ وَقَوْلِهِمْ عَلَىٰ مَرْيَمَ بُهْتَٰناً عَظِيماٗ","وَقَوْلِهِمُۥٓ إِنَّا قَتَلْنَا اَ۬لْمَسِيحَ عِيسَى اَ۪بْنَ مَرْيَمَ رَسُولَ اَ۬للَّهِۖ ۞ وَمَا قَتَلُوهُ وَمَا صَلَبُوهُ وَلَٰكِن شُبِّهَ لَهُمْۖ وَإِنَّ اَ۬لذِينَ اَ۪خْتَلَفُواْ فِيهِ لَفِے شَكّٖ مِّنْهُۖ مَا لَهُم بِهِۦ مِنْ عِلْمٍۖ اِلَّا اَ۪تِّبَاعَ اَ۬لظَّنِّۖ وَمَا قَتَلُوهُ يَقِيناَۢۖ","بَل رَّفَعَهُ اُ۬للَّهُ إِلَيْهِۖ وَكَانَ اَ۬للَّهُ عَزِيزاً حَكِيماٗۖ","وَإِن مِّنَ اَهْلِ اِ۬لْكِتَٰبِ إِلَّا لَيُومِنَنَّ بِهِۦ قَبْلَ مَوْتِهِۦ وَيَوْمَ اَ۬لْقِيَٰمَةِ يَكُونُ عَلَيْهِمْ شَهِيداٗۖ","فَبِظُلْمٖ مِّنَ اَ۬لذِينَ هَادُواْ حَرَّمْنَا عَلَيْهِمْ طَيِّبَٰتٍ ا۟حِلَّتْ لَهُمْ وَبِصَدِّهِمْ عَن سَبِيلِ اِ۬للَّهِ كَثِيراٗ","وَأَخْذِهِمُ اُ۬لرِّبَوٰاْ وَقَدْ نُهُواْ عَنْهُ وَأَكْلِهِمُۥٓ أَمْوَٰلَ اَ۬لنَّاسِ بِالْبَٰطِلِۖ وَأَعْتَدْنَا لِلْكٰ۪فِرِينَ مِنْهُمْ عَذَاباً اَلِيماٗۖ","لَّٰكِنِ اِ۬لرَّٰسِخُونَ فِے اِ۬لْعِلْمِ مِنْهُمْ وَالْمُومِنُونَ يُومِنُونَ بِمَآ أُنزِلَ إِلَيْكَ وَمَآ أُنزِلَ مِن قَبْلِكَ وَالْمُقِيمِينَ اَ۬لصَّلَوٰةَۖ وَالْمُوتُونَ اَ۬لزَّكَوٰةَ وَالْمُومِنُونَ بِاللَّهِ وَالْيَوْمِ اِ۬لَاخِرِ أُوْلَٰٓئِكَ سَنُوتِيهِمُۥٓ أَجْراً عَظِيماًۖ","اِنَّآ أَوْحَيْنَآ إِلَيْكَ كَمَآ أَوْحَيْنَآ إِلَىٰ نُوحٖ وَالنَّبِيٓـِٕۧنَ مِنۢ بَعْدِهِۦۖ وَأَوْحَيْنَآ إِلَىٰٓ إِبْرَٰهِيمَ وَإِسْمَٰعِيلَ وَإِسْحَٰقَ وَيَعْقُوبَ وَالَاسْبَاطِ وَعِيس۪ىٰ وَأَيُّوبَ وَيُونُسَ وَهَٰرُونَ وَسُلَيْمَٰنَۖ وَءَاتَيْنَا دَاوُۥدَ زَبُوراٗۖ","وَرُسُلاٗ قَدْ قَصَصْنَٰهُمْ عَلَيْكَ مِن قَبْلُ وَرُسُلاٗ لَّمْ نَقْصُصْهُمْ عَلَيْكَۖ وَكَلَّمَ اَ۬للَّهُ مُوس۪ىٰ تَكْلِيماٗۖ","رُّسُلاٗ مُّبَشِّرِينَ وَمُنذِرِينَ لِيَ۬لَّا يَكُونَ لِلنَّاسِ عَلَى اَ۬للَّهِ حُجَّةُۢ بَعْدَ اَ۬لرُّسُلِۖ وَكَانَ اَ۬للَّهُ عَزِيزاً حَكِيماٗۖ","۞ لَّٰكِنِ اِ۬للَّهُ يَشْهَدُ بِمَآ أَنزَلَ إِلَيْكَۖ أَنزَلَهُۥ بِعِلْمِهِۦ وَالْمَلَٰٓئِكَةُ يَشْهَدُونَۖ وَكَف۪ىٰ بِاللَّهِ شَهِيداًۖ","اِنَّ اَ۬لذِينَ كَفَرُواْ وَصَدُّواْ عَن سَبِيلِ اِ۬للَّهِ قَد ضَّلُّواْ ضَلَٰلاَۢ بَعِيداًۖ","اِنَّ اَ۬لذِينَ كَفَرُواْ وَظَلَمُواْ لَمْ يَكُنِ اِ۬للَّهُ لِيَغْفِرَ لَهُمْ وَلَا لِيَهْدِيَهُمْ طَرِيقاً","اِلَّا طَرِيقَ جَهَنَّمَ خَٰلِدِينَ فِيهَآ أَبَداٗۖ وَكَانَ ذَٰلِكَ عَلَى اَ۬للَّهِ يَسِيراٗۖ","يَٰٓأَيُّهَا اَ۬لنَّاسُ قَدْ جَآءَكُمُ اُ۬لرَّسُولُ بِالْحَقِّ مِن رَّبِّكُمْ فَـَٔامِنُواْ خَيْراٗ لَّكُمْۖ وَإِن تَكْفُرُواْ فَإِنَّ لِلهِ مَا فِے اِ۬لسَّمَٰوَٰتِ وَالَارْضِۖ وَكَانَ اَ۬للَّهُ عَلِيماً حَكِيماٗۖ","يَٰٓأَهْلَ اَ۬لْكِتَٰبِ لَا تَغْلُواْ فِے دِينِكُمْ وَلَا تَقُولُواْ عَلَى اَ۬للَّهِ إِلَّا اَ۬لْحَقَّۖ إِنَّمَا اَ۬لْمَسِيحُ عِيسَى اَ۪بْنُ مَرْيَمَ رَسُولُ اُ۬للَّهِ وَكَلِمَتُهُۥٓۖ أَلْق۪يٰهَآ إِلَىٰ مَرْيَمَ وَرُوحٞ مِّنْهُۖ فَـَٔامِنُواْ بِاللَّهِ وَرُسُلِهِۦۖ وَلَا تَقُولُواْ ثَلَٰثَةٌۖ اِ۪نتَهُواْ خَيْراٗ لَّكُمُۥٓۖ إِنَّمَا اَ۬للَّهُ إِلَٰهٞ وَٰحِدٞۖ سُبْحَٰنَهُۥٓ أَنْ يَّكُونَ لَهُۥ وَلَدٞۖ لَّهُۥ مَا فِے اِ۬لسَّمَٰوَٰتِ وَمَا فِے اِ۬لَارْضِۖ وَكَف۪ىٰ بِاللَّهِ وَكِيلاٗۖ","لَّنْ يَّسْتَنكِفَ اَ۬لْمَسِيحُ أَنْ يَّكُونَ عَبْداٗ لِّلهِ وَلَا اَ۬لْمَلَٰٓئِكَةُ اُ۬لْمُقَرَّبُونَۖ وَمَنْ يَّسْتَنكِفْ عَنْ عِبَادَتِهِۦ وَيَسْتَكْبِرْ فَسَيَحْشُرُهُمُۥٓ إِلَيْهِ جَمِيعاٗۖ","فَأَمَّا اَ۬لذِينَ ءَامَنُواْ وَعَمِلُواْ اُ۬لصَّٰلِحَٰتِ فَيُوَفِّيهِمُۥٓ أُجُورَهُمْ وَيَزِيدُهُم مِّن فَضْلِهِۦۖ وَأَمَّا اَ۬لذِينَ اَ۪سْتَنكَفُواْ وَاسْتَكْبَرُواْ فَيُعَذِّبُهُمْ عَذَاباً اَلِيماٗ وَلَا يَجِدُونَ لَهُم مِّن دُونِ اِ۬للَّهِ وَلِيّاٗ وَلَا نَصِيراٗۖ","۞ يَٰٓأَيُّهَا اَ۬لنَّاسُ قَدْ جَآءَكُم بُرْهَٰنٞ مِّن رَّبِّكُمْ وَأَنزَلْنَآ إِلَيْكُمْ نُوراٗ مُّبِيناٗۖ","فَأَمَّا اَ۬لذِينَ ءَامَنُواْ بِاللَّهِ وَاعْتَصَمُواْ بِهِۦ فَسَيُدْخِلُهُمْ فِے رَحْمَةٖ مِّنْهُ وَفَضْلٖ وَيَهْدِيهِمُۥٓ إِلَيْهِ صِرَٰطاٗ مُّسْتَقِيماٗۖ","يَسْتَفْتُونَكَۖ قُلِ اِ۬للَّهُ يُفْتِيكُمْ فِے اِ۬لْكَلَٰلَةِۖ إِنِ اِ۪مْرُؤٌاْ هَلَكَ لَيْسَ لَهُۥ وَلَدٞ وَلَهُۥٓ أُخْتٞ فَلَهَا نِصْفُ مَا تَرَكَۖ وَهُوَ يَرِثُهَآ إِن لَّمْ يَكُن لَّهَا وَلَدٞۖ فَإِن كَانَتَا اَ۪ثْنَتَيْنِ فَلَهُمَا اَ۬لثُّلُثَٰنِ مِمَّا تَرَكَۖ وَإِن كَانُوٓاْ إِخْوَةٗ رِّجَالاٗ وَنِسَآءٗ فَلِلذَّكَرِ مِثْلُ حَظِّ اِ۬لُانثَيَيْنِۖ يُبَيِّنُ اُ۬للَّهُ لَكُمُۥٓ أَن تَضِلُّواْۖ وَاللَّهُ بِكُلِّ شَےْءٍ عَلِيمٞۖ"]],["المائدة",["يَٰٓأَيُّهَا اَ۬لذِينَ ءَامَنُوٓاْ أَوْفُواْ بِالْعُقُودِۖ","أُحِلَّتْ لَكُم بَهِيمَةُ اُ۬لَانْعَٰمِ إِلَّا مَا يُتْل۪ىٰ عَلَيْكُمْ غَيْرَ مُحِلِّے اِ۬لصَّيْدِ وَأَنتُمْ حُرُمٌۖ اِنَّ اَ۬للَّهَ يَحْكُمُ مَا يُرِيدُۖ","يَٰٓأَيُّهَا اَ۬لذِينَ ءَامَنُواْ لَا تُحِلُّواْ شَعَٰٓئِرَ اَ۬للَّهِ وَلَا اَ۬لشَّهْرَ اَ۬لْحَرَامَ وَلَا اَ۬لْهَدْيَ وَلَا اَ۬لْقَلَٰٓئِدَ وَلَآ ءَآمِّينَ اَ۬لْبَيْتَ اَ۬لْحَرَامَ يَبْتَغُونَ فَضْلاٗ مِّن رَّبِّهِمْ وَرِضْوَٰناٗۖ وَإِذَا حَلَلْتُمْ فَاصْطَادُواْۖ وَلَا يَجْرِمَنَّكُمْ شَنَـَٔانُ قَوْمٍ اَن صَدُّوكُمْ عَنِ اِ۬لْمَسْجِدِ اِ۬لْحَرَامِ أَن تَعْتَدُواْۖ وَتَعَاوَنُواْ عَلَى اَ۬لْبِرِّ وَالتَّقْو۪ىٰۖ وَلَا تَعَاوَنُواْ عَلَى اَ۬لِاثْمِ وَالْعُدْوَٰنِۖ وَاتَّقُواْ اُ۬للَّهَۖ إِنَّ اَ۬للَّهَ شَدِيدُ اُ۬لْعِقَابِۖ","۞ حُرِّمَتْ عَلَيْكُمُ اُ۬لْمَيْتَةُ وَالدَّمُ وَلَحْمُ اُ۬لْخِنزِيرِ وَمَآ أُهِلَّ لِغَيْرِ اِ۬للَّهِ بِهِۦ وَالْمُنْخَنِقَةُ وَالْمَوْقُوذَةُ وَالْمُتَرَدِّيَةُ وَالنَّطِيحَةُ وَمَآ أَكَلَ اَ۬لسَّبُعُ إِلَّا مَا ذَكَّيْتُمْ وَمَا ذُبِحَ عَلَى اَ۬لنُّصُبِ وَأَن تَسْتَقْسِمُواْ بِالَازْلَٰمِۖ ذَٰلِكُمْ فِسْقٌۖ اِ۬لْيَوْمَ يَئِسَ اَ۬لذِينَ كَفَرُواْ مِن دِينِكُمْۖ فَلَا تَخْشَوْهُمْ وَاخْشَوْنِۖ اِ۬لْيَوْمَ أَكْمَلْتُ لَكُمْ دِينَكُمْ وَأَتْمَمْتُ عَلَيْكُمْ نِعْمَتِے وَرَضِيتُ لَكُمُ اُ۬لِاسْلَٰمَ دِيناٗۖ فَمَنُ اُ۟ضْطُرَّ فِے مَخْمَصَةٍ غَيْرَ مُتَجَانِفٖ لِّإِثْمٖ فَإِنَّ اَ۬للَّهَ غَفُورٞ رَّحِيمٞۖ","يَسْـَٔلُونَكَ مَاذَآ أُحِلَّ لَهُمْۖ قُلُ ا۟حِلَّ لَكُمُ اُ۬لطَّيِّبَٰتُ وَمَا عَلَّمْتُم مِّنَ اَ۬لْجَوَارِحِ مُكَلِّبِينَ تُعَلِّمُونَهُنَّ مِمَّا عَلَّمَكُمُ اُ۬للَّهُۖ فَكُلُواْ مِمَّآ أَمْسَكْنَ عَلَيْكُمْ وَاذْكُرُواْ اُ۪سْمَ اَ۬للَّهِ عَلَيْهِۖ وَاتَّقُواْ اُ۬للَّهَۖ إِنَّ اَ۬للَّهَ سَرِيعُ اُ۬لْحِسَابِۖ","اِ۬لْيَوْمَ أُحِلَّ لَكُمُ اُ۬لطَّيِّبَٰتُ وَطَعَامُ اُ۬لذِينَ أُوتُواْ اُ۬لْكِتَٰبَ حِلّٞ لَّكُمْ وَطَعَامُكُمْ حِلّٞ لَّهُمْ وَالْمُحْصَنَٰتُ مِنَ اَ۬لْمُومِنَٰتِ وَالْمُحْصَنَٰتُ مِنَ اَ۬لذِينَ أُوتُواْ اُ۬لْكِتَٰبَ مِن قَبْلِكُمُۥٓ إِذَآ ءَاتَيْتُمُوهُنَّ أُجُورَهُنَّ مُحْصِنِينَ غَيْرَ مُسَٰفِحِينَ وَلَا مُتَّخِذِےٓ أَخْدَانٖۖ وَمَنْ يَّكْفُرْ بِالِايمَٰنِ فَقَدْ حَبِطَ عَمَلُهُۥ وَهُوَ فِے اِ۬لَاخِرَةِ مِنَ اَ۬لْخَٰسِرِينَۖ","۞ يَٰٓأَيُّهَا اَ۬لذِينَ ءَامَنُوٓاْ إِذَا قُمْتُمُۥٓ إِلَى اَ۬لصَّلَوٰةِ فَاغْسِلُواْ وُجُوهَكُمْ وَأَيْدِيَكُمُۥٓ إِلَى اَ۬لْمَرَافِقِ وَامْسَحُواْ بِرُءُوسِكُمْۖ وَأَرْجُلَكُمُۥٓ إِلَى اَ۬لْكَعْبَيْنِۖ وَإِن كُنتُمْ جُنُباٗ فَاطَّهَّرُواْۖ وَإِن كُنتُم مَّرْض۪ىٰٓ أَوْ عَلَىٰ سَفَرٍ اَوْ جَآءَ احَدٞ مِّنكُم مِّنَ اَ۬لْغَآئِطِ أَوْ لَٰمَسْتُمُ اُ۬لنِّسَآءَ فَلَمْ تَجِدُواْ مَآءٗ فَتَيَمَّمُواْ صَعِيداٗ طَيِّباٗ فَامْسَحُواْ بِوُجُوهِكُمْ وَأَيْدِيكُم مِّنْهُۖ مَا يُرِيدُ اُ۬للَّهُ لِيَجْعَلَ عَلَيْكُم مِّنْ حَرَجٖۖ وَلَٰكِنْ يُّرِيدُ لِيُطَهِّرَكُمْ وَلِيُتِمَّ نِعْمَتَهُۥ عَلَيْكُمْ لَعَلَّكُمْ تَشْكُرُونَۖ","وَاذْكُرُواْ نِعْمَةَ اَ۬للَّهِ عَلَيْكُمْ وَمِيثَٰقَهُ اُ۬لذِے وَاثَقَكُم بِهِۦٓ إِذْ قُلْتُمْ سَمِعْنَا وَأَطَعْنَاۖ وَاتَّقُواْ اُ۬للَّهَۖ إِنَّ اَ۬للَّهَ عَلِيمُۢ بِذَاتِ اِ۬لصُّدُورِۖ","يَٰٓأَيُّهَا اَ۬لذِينَ ءَامَنُواْ كُونُواْ قَوَّٰمِينَ لِلهِ شُهَدَآءَ بِالْقِسْطِۖ وَلَا يَجْرِمَنَّكُمْ شَنَـَٔانُ قَوْمٍ عَلَىٰٓ أَلَّا تَعْدِلُواْۖ اُ۪عْدِلُواْ هُوَ أَقْرَبُ لِلتَّقْو۪ىٰۖ وَاتَّقُواْ اُ۬للَّهَۖ إِنَّ اَ۬للَّهَ خَبِيرُۢ بِمَا تَعْمَلُونَۖ","وَعَدَ اَ۬للَّهُ اُ۬لذِينَ ءَامَنُواْ وَعَمِلُواْ اُ۬لصَّٰلِحَٰتِ لَهُم مَّغْفِرَةٞ وَأَجْرٌ عَظِيمٞۖ","وَالذِينَ كَفَرُواْ وَكَذَّبُواْ بِـَٔايَٰتِنَآ أُوْلَٰٓئِكَ أَصْحَٰبُ اُ۬لْجَحِيمِۖ","يَٰٓأَيُّهَا اَ۬لذِينَ ءَامَنُواْ اُ۟ذْكُرُواْ نِعْمَتَ اَ۬للَّهِ عَلَيْكُمُۥٓ إِذْ هَمَّ قَوْمٌ اَنْ يَّبْسُطُوٓاْ إِلَيْكُمُۥٓ أَيْدِيَهُمْ فَكَفَّ أَيْدِيَهُمْ عَنكُمْۖ وَاتَّقُواْ اُ۬للَّهَۖ وَعَلَى اَ۬للَّهِ فَلْيَتَوَكَّلِ اِ۬لْمُومِنُونَۖ","۞ وَلَقَدَ اَخَذَ اَ۬للَّهُ مِيثَٰقَ بَنِےٓ إِسْرَآءِيلَ وَبَعَثْنَا مِنْهُمُ اُ۪ثْنَےْ عَشَرَ نَقِيباٗۖ وَقَالَ اَ۬للَّهُ إِنِّے مَعَكُمْۖ لَئِنَ اَقَمْتُمُ اُ۬لصَّلَوٰةَ وَءَاتَيْتُمُ اُ۬لزَّكَوٰةَ وَءَامَنتُم بِرُسُلِے وَعَزَّرْتُمُوهُمْ وَأَقْرَضْتُمُ اُ۬للَّهَ قَرْضاً حَسَناٗ لَّأُكَفِّرَنَّ عَنكُمْ سَيِّـَٔاتِكُمْ وَلَأُدْخِلَنَّكُمْ جَنَّٰتٖ تَجْرِے مِن تَحْتِهَا اَ۬لَانْهَٰرُۖ فَمَن كَفَرَ بَعْدَ ذَٰلِكَ مِنكُمْ فَقَد ضَّلَّ سَوَآءَ اَ۬لسَّبِيلِۖ","فَبِمَا نَقْضِهِم مِّيثَٰقَهُمْ لَعَنَّٰهُمْ وَجَعَلْنَا قُلُوبَهُمْ قَٰسِيَةٗ يُحَرِّفُونَ اَ۬لْكَلِمَ عَن مَّوَاضِعِهِۦ وَنَسُواْ حَظّاٗ مِّمَّا ذُكِّرُواْ بِهِۦۖ وَلَا تَزَالُ تَطَّلِعُ عَلَىٰ خَآئِنَةٖ مِّنْهُمُۥٓ إِلَّا قَلِيلاٗ مِّنْهُمْۖ فَاعْفُ عَنْهُمْ وَاصْفَحِۖ اِنَّ اَ۬للَّهَ يُحِبُّ اُ۬لْمُحْسِنِينَۖ","وَمِنَ اَ۬لذِينَ قَالُوٓاْ إِنَّا نَصَٰر۪ىٰٓ أَخَذْنَا مِيثَٰقَهُمْ فَنَسُواْ حَظّاٗ مِّمَّا ذُكِّرُواْ بِهِۦ فَأَغْرَيْنَا بَيْنَهُمُ اُ۬لْعَدَٰوَةَ وَالْبَغْضَآءَ ا۪لَىٰ يَوْمِ اِ۬لْقِيَٰمَةِۖ وَسَوْفَ يُنَبِّئُهُمُ اُ۬للَّهُ بِمَا كَانُواْ يَصْنَعُونَۖ","يَٰٓأَهْلَ اَ۬لْكِتَٰبِ قَدْ جَآءَكُمْ رَسُولُنَا يُبَيِّنُ لَكُمْ كَثِيراٗ مِّمَّا كُنتُمْ تُخْفُونَ مِنَ اَ۬لْكِتَٰبِ وَيَعْفُواْ عَن كَثِيرٖۖ","قَدْ جَآءَكُم مِّنَ اَ۬للَّهِ نُورٞ وَكِتَٰبٞ مُّبِينٞ","يَهْدِے بِهِ اِ۬للَّهُ مَنِ اِ۪تَّبَعَ رِضْوَٰنَهُۥ سُبُلَ اَ۬لسَّلَٰمِۖ وَيُخْرِجُهُم مِّنَ اَ۬لظُّلُمَٰتِ إِلَى اَ۬لنُّورِ بِإِذْنِهِۦۖ وَيَهْدِيهِمُۥٓ إِلَىٰ صِرَٰطٖ مُّسْتَقِيمٖۖ","۞ لَّقَدْ كَفَرَ اَ۬لذِينَ قَالُوٓاْ إِنَّ اَ۬للَّهَ هُوَ اَ۬لْمَسِيحُ اُ۪بْنُ مَرْيَمَۖ قُلْ فَمَنْ يَّمْلِكُ مِنَ اَ۬للَّهِ شَئْاً اِنَ اَرَادَ أَنْ يُّهْلِكَ اَ۬لْمَسِيحَ اَ۪بْنَ مَرْيَمَ وَأُمَّهُۥ وَمَن فِے اِ۬لَارْضِ جَمِيعاٗۖ وَلِلهِ مُلْكُ اُ۬لسَّمَٰوَٰتِ وَالَارْضِ وَمَا بَيْنَهُمَاۖ يَخْلُقُ مَا يَشَآءُۖ وَاللَّهُ عَلَىٰ كُلِّ شَےْءٖ قَدِيرٞۖ","وَقَالَتِ اِ۬لْيَهُودُ وَالنَّصَٰر۪ىٰ نَحْنُ أَبْنَٰٓؤُاْ اُ۬للَّهِ وَأَحِبَّٰٓؤُهُۥۖ قُلْ فَلِمَ يُعَذِّبُكُم بِذُنُوبِكُمۖ بَلَ اَنتُم بَشَرٞ مِّمَّنْ خَلَقَۖ يَغْفِرُ لِمَنْ يَّشَآءُ وَيُعَذِّبُ مَنْ يَّشَآءُۖ وَلِلهِ مُلْكُ اُ۬لسَّمَٰوَٰتِ وَالَارْضِ وَمَا بَيْنَهُمَاۖ وَإِلَيْهِ اِ۬لْمَصِيرُۖ","يَٰٓأَهْلَ اَ۬لْكِتَٰبِ قَدْ جَآءَكُمْ رَسُولُنَا يُبَيِّنُ لَكُمْ عَلَىٰ فَتْرَةٖ مِّنَ اَ۬لرُّسُلِ أَن تَقُولُواْ مَا جَآءَنَا مِنۢ بَشِيرٖ وَلَا نَذِيرٖ فَقَدْ جَآءَكُم بَشِيرٞ وَنَذِيرٞۖ وَاللَّهُ عَلَىٰ كُلِّ شَےْءٖ قَدِيرٞۖ","وَإِذْ قَالَ مُوس۪ىٰ لِقَوْمِهِۦ يَٰقَوْمِ اِ۟ذْكُرُواْ نِعْمَةَ اَ۬للَّهِ عَلَيْكُمُۥٓ إِذْ جَعَلَ فِيكُمُۥٓ أَنۢبِئَآءَ وَجَعَلَكُم مُّلُوكاٗۖ وَءَات۪يٰكُم مَّا لَمْ يُوتِ أَحَداٗ مِّنَ اَ۬لْعَٰلَمِينَۖ","يَٰقَوْمِ اِ۟دْخُلُواْ اُ۬لَارْضَ اَ۬لْمُقَدَّسَةَ اَ۬لتِے كَتَبَ اَ۬للَّهُ لَكُمْۖ وَلَا تَرْتَدُّواْ عَلَىٰٓ أَدْبٰ۪رِكُمْ فَتَنقَلِبُواْ خَٰسِرِينَۖ","قَالُواْ يَٰمُوس۪ىٰٓ إِنَّ فِيهَا قَوْماٗ جَبّ۪ارِينَۖ وَإِنَّا لَن نَّدْخُلَهَا حَتَّىٰ يَخْرُجُواْ مِنْهَاۖ فَإِنْ يَّخْرُجُواْ مِنْهَا فَإِنَّا دَٰخِلُونَۖ","۞ قَالَ رَجُلَٰنِ مِنَ اَ۬لذِينَ يَخَافُونَ أَنْعَمَ اَ۬للَّهُ عَلَيْهِمَا اَ۟دْخُلُواْ عَلَيْهِمُ اُ۬لْبَابَۖ فَإِذَا دَخَلْتُمُوهُ فَإِنَّكُمْ غَٰلِبُونَۖ وَعَلَى اَ۬للَّهِ فَتَوَكَّلُوٓاْ إِن كُنتُم مُّومِنِينَۖ","قَالُواْ يَٰمُوس۪ىٰٓ إِنَّا لَن نَّدْخُلَهَآ أَبَداٗ مَّا دَامُواْ فِيهَا فَاذْهَبَ اَنتَ وَرَبُّكَ فَقَٰتِلَآ إِنَّا هَٰهُنَا قَٰعِدُونَۖ","قَالَ رَبِّ إِنِّے لَآ أَمْلِكُ إِلَّا نَفْسِےۖ وَأَخِےۖ فَافْرُقْ بَيْنَنَا وَبَيْنَ اَ۬لْقَوْمِ اِ۬لْفَٰسِقِينَۖ","قَالَ فَإِنَّهَا مُحَرَّمَةٌ عَلَيْهِمُۥٓۖ أَرْبَعِينَ سَنَةٗ يَتِيهُونَ فِے اِ۬لَارْضِۖ فَلَا تَاسَ عَلَى اَ۬لْقَوْمِ اِ۬لْفَٰسِقِينَۖ","وَاتْلُ عَلَيْهِمْ نَبَأَ اَ۪بْنَيَ اٰدَمَ بِالْحَقِّ إِذْ قَرَّبَا قُرْبَاناٗ فَتُقُبِّلَ مِنَ اَحَدِهِمَا وَلَمْ يُتَقَبَّلْ مِنَ اَ۬لَاخَرِۖ قَالَ لَأَقْتُلَنَّكَۖ قَالَ إِنَّمَا يَتَقَبَّلُ اُ۬للَّهُ مِنَ اَ۬لْمُتَّقِينَۖ","لَئِنۢ بَسَطْتَّ إِلَيَّ يَدَكَ لِتَقْتُلَنِے مَآ أَنَا بِبَاسِطٖ يَدِيَ إِلَيْكَ لِأَقْتُلَكَۖ إِنِّيَ أَخَافُ اُ۬للَّهَ رَبَّ اَ۬لْعَٰلَمِينَۖ","إِنِّيَ أُرِيدُ أَن تَبُوٓأَ بِإِثْمِے وَإِثْمِكَ فَتَكُونَ مِنَ اَصْحَٰبِ اِ۬لنّ۪ارِۖ وَذَٰلِكَ جَزَٰٓؤُاْ اُ۬لظَّٰلِمِينَۖ","فَطَوَّعَتْ لَهُۥ نَفْسُهُۥ قَتْلَ أَخِيهِ فَقَتَلَهُۥ فَأَصْبَحَ مِنَ اَ۬لْخَٰسِرِينَۖ","فَبَعَثَ اَ۬للَّهُ غُرَاباٗ يَبْحَثُ فِے اِ۬لَارْضِ لِيُرِيَهُۥ كَيْفَ يُوَٰرِے سَوْءَةَ أَخِيهِۖ قَالَ يَٰوَيْلَت۪ىٰٓ أَعَجَزْتُ أَنَ اَكُونَ مِثْلَ هَٰذَا اَ۬لْغُرَابِ فَأُوَٰرِيَ سَوْءَةَ أَخِے فَأَصْبَحَ مِنَ اَ۬لنَّٰدِمِينَ","مِنَ اَجْلِ ذَٰلِكَۖ كَتَبْنَا عَلَىٰ بَنِےٓ إِسْرَآءِيلَ أَنَّهُۥ مَن قَتَلَ نَفْساَۢ بِغَيْرِ نَفْسٍ اَوْ فَسَادٖ فِے اِ۬لَارْضِ فَكَأَنَّمَا قَتَلَ اَ۬لنَّاسَ جَمِيعاٗۖ وَمَنَ اَحْي۪اهَا فَكَأَنَّمَآ أَحْيَا اَ۬لنَّاسَ جَمِيعاٗۖ ۞ وَلَقَدْ جَآءَتْهُمْ رُسُلُنَا بِالْبَيِّنَٰتِ ثُمَّ إِنَّ كَثِيراٗ مِّنْهُم بَعْدَ ذَٰلِكَ فِے اِ۬لَارْضِ لَمُسْرِفُونَۖ","إِنَّمَا جَزَٰٓؤُاْ اُ۬لذِينَ يُحَارِبُونَ اَ۬للَّهَ وَرَسُولَهُۥ وَيَسْعَوْنَ فِے اِ۬لَارْضِ فَسَاداً اَنْ يُّقَتَّلُوٓاْ أَوْ يُصَلَّبُوٓاْ أَوْ تُقَطَّعَ أَيْدِيهِمْ وَأَرْجُلُهُم مِّنْ خِلَٰفٍ اَوْ يُنفَوْاْ مِنَ اَ۬لَارْضِۖ ذَٰلِكَ لَهُمْ خِزْيٞ فِے اِ۬لدُّنْي۪اۖ وَلَهُمْ فِے اِ۬لَاخِرَةِ عَذَابٌ عَظِيمٌ","اِلَّا اَ۬لذِينَ تَابُواْ مِن قَبْلِ أَن تَقْدِرُواْ عَلَيْهِمْ فَاعْلَمُوٓاْ أَنَّ اَ۬للَّهَ غَفُورٞ رَّحِيمٞۖ","يَٰٓأَيُّهَا اَ۬لذِينَ ءَامَنُواْ اُ۪تَّقُواْ اُ۬للَّهَ وَابْتَغُوٓاْ إِلَيْهِ اِ۬لْوَسِيلَةَ وَجَٰهِدُواْ فِے سَبِيلِهِۦ لَعَلَّكُمْ تُفْلِحُونَۖ","إِنَّ اَ۬لذِينَ كَفَرُواْ لَوَ اَنَّ لَهُم مَّا فِے اِ۬لَارْضِ جَمِيعاٗ وَمِثْلَهُۥ مَعَهُۥ لِيَفْتَدُواْ بِهِۦ مِنْ عَذَابِ يَوْمِ اِ۬لْقِيَٰمَةِ مَا تُقُبِّلَ مِنْهُمْۖ وَلَهُمْ عَذَابٌ اَلِيمٞۖ","يُرِيدُونَ أَنْ يَّخْرُجُواْ مِنَ اَ۬لنّ۪ارِ وَمَا هُم بِخَٰرِجِينَ مِنْهَاۖ وَلَهُمْ عَذَابٞ مُّقِيمٞۖ","وَالسَّارِقُ وَالسَّارِقَةُ فَاقْطَعُوٓاْ أَيْدِيَهُمَا جَزَآءَۢ بِمَا كَسَبَا نَكَٰلاٗ مِّنَ اَ۬للَّهِۖ وَاللَّهُ عَزِيزٌ حَكِيمٞۖ","فَمَن تَابَ مِنۢ بَعْدِ ظُلْمِهِۦ وَأَصْلَحَ فَإِنَّ اَ۬للَّهَ يَتُوبُ عَلَيْهِۖ إِنَّ اَ۬للَّهَ غَفُورٞ رَّحِيمٌۖ","اَلَمْ تَعْلَمَ اَنَّ اَ۬للَّهَ لَهُۥ مُلْكُ اُ۬لسَّمَٰوَٰتِ وَالَارْضِۖ يُعَذِّبُ مَنْ يَّشَآءُ وَيَغْفِرُ لِمَنْ يَّشَآءُۖ وَاللَّهُ عَلَىٰ كُلِّ شَےْءٖ قَدِيرٞۖ","۞ يَٰٓأَيُّهَا اَ۬لرَّسُولُ لَا يُحْزِنكَ اَ۬لذِينَ يُسَٰرِعُونَ فِے اِ۬لْكُفْرِ مِنَ اَ۬لذِينَ قَالُوٓاْ ءَامَنَّا بِأَفْوَٰهِهِمْ وَلَمْ تُومِن قُلُوبُهُمْۖ وَمِنَ اَ۬لذِينَ هَادُواْ سَمَّٰعُونَ لِلْكَذِبِ سَمَّٰعُونَ لِقَوْمٍ اٰخَرِينَ لَمْ يَاتُوكَۖ يُحَرِّفُونَ اَ۬لْكَلِمَ مِنۢ بَعْدِ مَوَاضِعِهِۦ يَقُولُونَ إِنُ اُوتِيتُمْ هَٰذَا فَخُذُوهُ وَإِن لَّمْ تُوتَوْهُ فَاحْذَرُواْۖ وَمَنْ يُّرِدِ اِ۬للَّهُ فِتْنَتَهُۥ فَلَن تَمْلِكَ لَهُۥ مِنَ اَ۬للَّهِ شَئْاًۖ ا۟وْلَٰٓئِكَ اَ۬لذِينَ لَمْ يُرِدِ اِ۬للَّهُ أَنْ يُّطَهِّرَ قُلُوبَهُمْۖ لَهُمْ فِے اِ۬لدُّنْي۪ا خِزْيٞۖ وَلَهُمْ فِے اِ۬لَاخِرَةِ عَذَابٌ عَظِيمٞۖ","سَمَّٰعُونَ لِلْكَذِبِ أَكَّٰلُونَ لِلسُّحْتِۖ فَإِن جَآءُوكَ فَاحْكُم بَيْنَهُمُۥٓ أَوَ اَعْرِضْ عَنْهُمْۖ وَإِن تُعْرِضْ عَنْهُمْ فَلَنْ يَّضُرُّوكَ شَئْاٗۖ وَإِنْ حَكَمْتَ فَاحْكُم بَيْنَهُم بِالْقِسْطِۖ إِنَّ اَ۬للَّهَ يُحِبُّ اُ۬لْمُقْسِطِينَۖ","وَكَيْفَ يُحَكِّمُونَكَ وَعِندَهُمُ اُ۬لتَّوْر۪يٰةُ فِيهَا حُكْمُ اُ۬للَّهِ ثُمَّ يَتَوَلَّوْنَ مِنۢ بَعْدِ ذَٰلِكَۖ وَمَآ أُوْلَٰٓئِكَ بِالْمُومِنِينَۖ","إِنَّآ أَنزَلْنَا اَ۬لتَّوْر۪يٰةَ فِيهَا هُدىٗ وَنُورٞ يَحْكُمُ بِهَا اَ۬لنَّبِيٓـُٔونَ اَ۬لذِينَ أَسْلَمُواْ لِلذِينَ هَادُواْ وَالرَّبَّٰنِيُّونَ وَالَاحْبَارُ بِمَا اَ۟سْتُحْفِظُواْ مِن كِتَٰبِ اِ۬للَّهِ وَكَانُواْ عَلَيْهِ شُهَدَآءَۖ فَلَا تَخْشَوُاْ اُ۬لنَّاسَ وَاخْشَوْنِۖ وَلَا تَشْتَرُواْ بِـَٔايَٰتِے ثَمَناٗ قَلِيلاٗۖ وَمَن لَّمْ يَحْكُم بِمَآ أَنزَلَ اَ۬للَّهُ فَأُوْلَٰٓئِكَ هُمُ اُ۬لْكَٰفِرُونَۖ","۞ وَكَتَبْنَا عَلَيْهِمْ فِيهَآ أَنَّ اَ۬لنَّفْسَ بِالنَّفْسِ وَالْعَيْنَ بِالْعَيْنِ وَالَانفَ بِالَانفِ وَالُاذْنَ بِالُاذْنِ وَالسِّنَّ بِالسِّنِّ وَالْجُرُوحَ قِصَاصٞۖ فَمَن تَصَدَّقَ بِهِۦ فَهُوَ كَفَّارَةٞ لَّهُۥۖ وَمَن لَّمْ يَحْكُم بِمَآ أَنزَلَ اَ۬للَّهُ فَأُوْلَٰٓئِكَ هُمُ اُ۬لظَّٰلِمُونَۖ","وَقَفَّيْنَا عَلَىٰٓ ءَاثٰ۪رِهِم بِعِيسَى اَ۪بْنِ مَرْيَمَ مُصَدِّقاٗ لِّمَا بَيْنَ يَدَيْهِ مِنَ اَ۬لتَّوْر۪يٰةِۖ وَءَاتَيْنَٰهُ اُ۬لِانجِيلَ فِيهِ هُدىٗ وَنُورٞ وَمُصَدِّقاٗ لِّمَا بَيْنَ يَدَيْهِ مِنَ اَ۬لتَّوْر۪يٰةِ وَهُدىٗ وَمَوْعِظَةٗ لِّلْمُتَّقِينَۖ","وَلْيَحْكُمَ اَهْلُ اُ۬لِانجِيلِ بِمَآ أَنزَلَ اَ۬للَّهُ فِيهِۖ وَمَن لَّمْ يَحْكُم بِمَآ أَنزَلَ اَ۬للَّهُ فَأُوْلَٰٓئِكَ هُمُ اُ۬لْفَٰسِقُونَۖ","وَأَنزَلْنَآ إِلَيْكَ اَ۬لْكِتَٰبَ بِالْحَقِّ مُصَدِّقاٗ لِّمَا بَيْنَ يَدَيْهِ مِنَ اَ۬لْكِتَٰبِ وَمُهَيْمِناً عَلَيْهِۖ فَاحْكُم بَيْنَهُم بِمَآ أَنزَلَ اَ۬للَّهُ وَلَا تَتَّبِعَ اَهْوَآءَهُمْ عَمَّا جَآءَكَ مِنَ اَ۬لْحَقِّۖ لِكُلّٖ جَعَلْنَا مِنكُمْ شِرْعَةٗ وَمِنْهَاجاٗۖ وَلَوْ شَآءَ اَ۬للَّهُ لَجَعَلَكُمُۥٓ أُمَّةٗ وَٰحِدَةٗۖ وَلَٰكِن لِّيَبْلُوَكُمْ فِے مَآ ءَات۪يٰكُمْۖ فَاسْتَبِقُواْ اُ۬لْخَيْرَٰتِۖ إِلَى اَ۬للَّهِ مَرْجِعُكُمْ جَمِيعاٗ فَيُنَبِّئُكُم بِمَا كُنتُمْ فِيهِ تَخْتَلِفُونَۖ","۞ وَأَنُ اُ۟حْكُم بَيْنَهُم بِمَآ أَنزَلَ اَ۬للَّهُۖ وَلَا تَتَّبِعَ اَهْوَآءَهُمْۖ وَاحْذَرْهُمُۥٓ أَنْ يَّفْتِنُوكَ عَنۢ بَعْضِ مَآ أَنزَلَ اَ۬للَّهُ إِلَيْكَۖ فَإِن تَوَلَّوْاْ فَاعْلَمَ اَنَّمَا يُرِيدُ اُ۬للَّهُ أَنْ يُّصِيبَهُم بِبَعْضِ ذُنُوبِهِمْۖ وَإِنَّ كَثِيراٗ مِّنَ اَ۬لنَّاسِ لَفَٰسِقُونَۖ","أَفَحُكْمَ اَ۬لْجَٰهِلِيَّةِ يَبْغُونَۖ وَمَنَ اَحْسَنُ مِنَ اَ۬للَّهِ حُكْماٗ لِّقَوْمٖ يُوقِنُونَۖ","يَٰٓأَيُّهَا اَ۬لذِينَ ءَامَنُواْ لَا تَتَّخِذُواْ اُ۬لْيَهُودَ وَالنَّصَٰر۪ىٰٓ أَوْلِيَآءَۖ بَعْضُهُمُۥٓ أَوْلِيَآءُ بَعْضٖۖ وَمَنْ يَّتَوَلَّهُم مِّنكُمْ فَإِنَّهُۥ مِنْهُمُۥٓۖ إِنَّ اَ۬للَّهَ لَا يَهْدِے اِ۬لْقَوْمَ اَ۬لظَّٰلِمِينَۖ","فَتَرَى اَ۬لذِينَ فِے قُلُوبِهِم مَّرَضٞ يُسَٰرِعُونَ فِيهِمْ يَقُولُونَ نَخْش۪ىٰٓ أَن تُصِيبَنَا دَآئِرَةٞۖ فَعَسَى اَ۬للَّهُ أَنْ يَّاتِيَ بِالْفَتْحِ أَوَ اَمْرٖ مِّنْ عِندِهِۦ فَيُصْبِحُواْ عَلَىٰ مَآ أَسَرُّواْ فِےٓ أَنفُسِهِمْ نَٰدِمِينَۖ","يَقُولُ اُ۬لذِينَ ءَامَنُوٓاْ أَهَٰٓؤُلَآءِ اِ۬لذِينَ أَقْسَمُواْ بِاللَّهِ جَهْدَ أَيْمَٰنِهِمُۥٓ إِنَّهُمْ لَمَعَكُمْ حَبِطَتَ اَعْمَٰلُهُمْ فَأَصْبَحُواْ خَٰسِرِينَۖ","يَٰٓأَيُّهَا اَ۬لذِينَ ءَامَنُواْ مَنْ يَّرْتَدِدْ مِنكُمْ عَن دِينِهِۦ فَسَوْفَ يَاتِے اِ۬للَّهُ بِقَوْمٖ يُحِبُّهُمْ وَيُحِبُّونَهُۥٓ أَذِلَّةٍ عَلَى اَ۬لْمُومِنِينَ أَعِزَّةٍ عَلَى اَ۬لْكٰ۪فِرِينَ يُجَٰهِدُونَ فِے سَبِيلِ اِ۬للَّهِ وَلَا يَخَافُونَ لَوْمَةَ لَٰٓئِمٖۖ ذَٰلِكَ فَضْلُ اُ۬للَّهِ يُوتِيهِ مَنْ يَّشَآءُۖ وَاللَّهُ وَٰسِعٌ عَلِيمٌۖ","اِنَّمَا وَلِيُّكُمُ اُ۬للَّهُ وَرَسُولُهُۥ وَالذِينَ ءَامَنُواْ اُ۬لذِينَ يُقِيمُونَ اَ۬لصَّلَوٰةَ وَيُوتُونَ اَ۬لزَّكَوٰةَ وَهُمْ رَٰكِعُونَۖ","وَمَنْ يَّتَوَلَّ اَ۬للَّهَ وَرَسُولَهُۥ وَالذِينَ ءَامَنُواْ فَإِنَّ حِزْبَ اَ۬للَّهِ هُمُ اُ۬لْغَٰلِبُونَۖ","يَٰٓأَيُّهَا اَ۬لذِينَ ءَامَنُواْ لَا تَتَّخِذُواْ اُ۬لذِينَ اَ۪تَّخَذُواْ دِينَكُمْ هُزُؤاٗ وَلَعِباٗ مِّنَ اَ۬لذِينَ أُوتُواْ اَ۬لْكِتَٰبَ مِن قَبْلِكُمْ وَالْكُفَّارَ أَوْلِيَآءَۖ وَاتَّقُواْ اُ۬للَّهَ إِن كُنتُم مُّومِنِينَۖ","۞ وَإِذَا نَادَيْتُمُۥٓ إِلَى اَ۬لصَّلَوٰةِ اِ۪تَّخَذُوهَا هُزُؤاٗ وَلَعِباٗۖ ذَٰلِكَ بِأَنَّهُمْ قَوْمٞ لَّا يَعْقِلُونَۖ","قُلْ يَٰٓأَهْلَ اَ۬لْكِتَٰبِ هَلْ تَنقِمُونَ مِنَّآ إِلَّآ أَنَ اٰمَنَّا بِاللَّهِ وَمَآ أُنزِلَ إِلَيْنَا وَمَآ أُنزِلَ مِن قَبْلُ وَأَنَّ أَكْثَرَكُمْ فَٰسِقُونَۖ","قُلْ هَلُ ا۟نَبِّئُكُم بِشَرّٖ مِّن ذَٰلِكَ مَثُوبَةً عِندَ اَ۬للَّهِ مَن لَّعَنَهُ اُ۬للَّهُ وَغَضِبَ عَلَيْهِ وَجَعَلَ مِنْهُمُ اُ۬لْقِرَدَةَ وَالْخَنَازِيرَ وَعَبَدَ اَ۬لطَّٰغُوتَۖ أُوْلَٰٓئِكَ شَرّٞ مَّكَاناٗ وَأَضَلُّ عَن سَوَآءِ اِ۬لسَّبِيلِۖ","وَإِذَا جَآءُوكُمْ قَالُوٓاْ ءَامَنَّا وَقَد دَّخَلُواْ بِالْكُفْرِ وَهُمْ قَدْ خَرَجُواْ بِهِۦۖ وَاللَّهُ أَعْلَمُ بِمَا كَانُواْ يَكْتُمُونَۖ","وَتَر۪ىٰ كَثِيراٗ مِّنْهُمْ يُسَٰرِعُونَ فِے اِ۬لِاثْمِ وَالْعُدْوَٰنِ وَأَكْلِهِمُ اُ۬لسُّحْتَۖ لَبِيسَ مَا كَانُواْ يَعْمَلُونَۖ","لَوْلَا يَنْه۪يٰهُمُ اُ۬لرَّبَّٰنِيُّونَ وَالَاحْبَارُ عَن قَوْلِهِمُ اُ۬لِاثْمَ وَأَكْلِهِمُ اُ۬لسُّحْتَۖ لَبِيسَ مَا كَانُواْ يَصْنَعُونَۖ","وَقَالَتِ اِ۬لْيَهُودُ يَدُ اُ۬للَّهِ مَغْلُولَةٌۖ غُلَّتَ اَيْدِيهِمْ وَلُعِنُواْ بِمَا قَالُواْۖ بَلْ يَدَٰهُ مَبْسُوطَتَٰنِ يُنفِقُ كَيْفَ يَشَآءُۖ وَلَيَزِيدَنَّ كَثِيراٗ مِّنْهُم مَّآ أُنزِلَ إِلَيْكَ مِن رَّبِّكَ طُغْيَٰناٗ وَكُفْراٗۖ وَأَلْقَيْنَا بَيْنَهُمُ اُ۬لْعَدَٰوَةَ وَالْبَغْضَآءَ ا۪لَىٰ يَوْمِ اِ۬لْقِيَٰمَةِۖ كُلَّمَآ أَوْقَدُواْ نَاراٗ لِّلْحَرْبِ أَطْفَأَهَا اَ۬للَّهُۖ وَيَسْعَوْنَ فِے اِ۬لَارْضِ فَسَاداٗۖ وَاللَّهُ لَا يُحِبُّ اُ۬لْمُفْسِدِينَۖ","وَلَوَ اَنَّ أَهْلَ اَ۬لْكِتَٰبِ ءَامَنُواْ وَاتَّقَوْاْ لَكَفَّرْنَا عَنْهُمْ سَيِّـَٔاتِهِمْ وَلَأَدْخَلْنَٰهُمْ جَنَّٰتِ اِ۬لنَّعِيمِۖ","وَلَوَ اَنَّهُمُۥٓ أَقَامُواْ اُ۬لتَّوْر۪يٰةَ وَالِانجِيلَ وَمَآ أُنزِلَ إِلَيْهِم مِّن رَّبِّهِمْ لَأَكَلُواْ مِن فَوْقِهِمْ وَمِن تَحْتِ أَرْجُلِهِمۖ مِّنْهُمُۥٓ أُمَّةٞ مُّقْتَصِدَةٞۖ وَكَثِيرٞ مِّنْهُمْ سَآءَ مَا يَعْمَلُونَۖ","۞ يَٰٓأَيُّهَا اَ۬لرَّسُولُ بَلِّغْ مَآ أُنزِلَ إِلَيْكَ مِن رَّبِّكَۖ وَإِن لَّمْ تَفْعَلْ فَمَا بَلَّغْتَ رِسَالَٰتِهِۦۖ وَاللَّهُ يَعْصِمُكَ مِنَ اَ۬لنَّاسِۖ إِنَّ اَ۬للَّهَ لَا يَهْدِے اِ۬لْقَوْمَ اَ۬لْكٰ۪فِرِينَۖ","قُلْ يَٰٓأَهْلَ اَ۬لْكِتَٰبِ لَسْتُمْ عَلَىٰ شَےْءٍ حَتَّىٰ تُقِيمُواْ اُ۬لتَّوْر۪يٰةَ وَالِانجِيلَ وَمَآ أُنزِلَ إِلَيْكُم مِّن رَّبِّكُمْۖ وَلَيَزِيدَنَّ كَثِيراٗ مِّنْهُم مَّآ أُنزِلَ إِلَيْكَ مِن رَّبِّكَ طُغْيَٰناٗ وَكُفْراٗۖ فَلَا تَاسَ عَلَى اَ۬لْقَوْمِ اِ۬لْكٰ۪فِرِينَۖ","إِنَّ اَ۬لذِينَ ءَامَنُواْ وَالذِينَ هَادُواْ وَالصَّٰبُونَ وَالنَّصَٰر۪ىٰ مَنَ اٰمَنَ بِاللَّهِ وَالْيَوْمِ اِ۬لَاخِرِ وَعَمِلَ صَٰلِحاٗ فَلَا خَوْفٌ عَلَيْهِمْ وَلَا هُمْ يَحْزَنُونَۖ","لَقَدَ اَخَذْنَا مِيثَٰقَ بَنِےٓ إِسْرَآءِيلَ وَأَرْسَلْنَآ إِلَيْهِمْ رُسُلاٗۖ كُلَّمَا جَآءَهُمْ رَسُولُۢ بِمَا لَا تَهْو۪ىٰٓ أَنفُسُهُمْ فَرِيقاٗ كَذَّبُواْ وَفَرِيقاٗ يَقْتُلُونَۖ","وَحَسِبُوٓاْ أَلَّا تَكُونَ فِتْنَةٞ فَعَمُواْ وَصَمُّواْ ثُمَّ تَابَ اَ۬للَّهُ عَلَيْهِمْ ثُمَّ عَمُواْ وَصَمُّواْۖ كَثِيرٞ مِّنْهُمْۖ وَاللَّهُ بَصِيرُۢ بِمَا يَعْمَلُونَۖ","لَقَدْ كَفَرَ اَ۬لذِينَ قَالُوٓاْ إِنَّ اَ۬للَّهَ هُوَ اَ۬لْمَسِيحُ اُ۪بْنُ مَرْيَمَۖ وَقَالَ اَ۬لْمَسِيحُ يَٰبَنِےٓ إِسْرَآءِيلَ اَ۟عْبُدُواْ اُ۬للَّهَ رَبِّے وَرَبَّكُمُۥٓۖ إِنَّهُۥ مَنْ يُّشْرِكْ بِاللَّهِ فَقَدْ حَرَّمَ اَ۬للَّهُ عَلَيْهِ اِ۬لْجَنَّةَ وَمَأْو۪يٰهُ اُ۬لنَّارُۖ وَمَا لِلظَّٰلِمِينَ مِنَ اَنص۪ارٖۖ","۞ لَّقَدْ كَفَرَ اَ۬لذِينَ قَالُوٓاْ إِنَّ اَ۬للَّهَ ثَالِثُ ثَلَٰثَةٖۖ وَمَا مِنِ اِلَٰهٍ اِلَّآ إِلَٰهٞ وَٰحِدٞۖ وَإِن لَّمْ يَنتَهُواْ عَمَّا يَقُولُونَ لَيَمَسَّنَّ اَ۬لذِينَ كَفَرُواْ مِنْهُمْ عَذَابٌ اَلِيمٌۖ","اَفَلَا يَتُوبُونَ إِلَى اَ۬للَّهِ وَيَسْتَغْفِرُونَهُۥۖ وَاللَّهُ غَفُورٞ رَّحِيمٞۖ","مَّا اَ۬لْمَسِيحُ اُ۪بْنُ مَرْيَمَ إِلَّا رَسُولٞ قَدْ خَلَتْ مِن قَبْلِهِ اِ۬لرُّسُلُۖ وَأُمُّهُۥ صِدِّيقَةٞۖ كَانَا يَاكُلَٰنِ اِ۬لطَّعَامَۖ اَ۟نظُرْ كَيْفَ نُبَيِّنُ لَهُمُ اُ۬لَايَٰتِ ثُمَّ اَ۟نظُرَ اَنّ۪ىٰ يُوفَكُونَۖ","قُلَ اَتَعْبُدُونَ مِن دُونِ اِ۬للَّهِ مَا لَا يَمْلِكُ لَكُمْ ضَرّاٗ وَلَا نَفْعاٗۖ وَاللَّهُ هُوَ اَ۬لسَّمِيعُ اُ۬لْعَلِيمُۖ","قُلْ يَٰٓأَهْلَ اَ۬لْكِتَٰبِ لَا تَغْلُواْ فِے دِينِكُمْ غَيْرَ اَ۬لْحَقِّۖ وَلَا تَتَّبِعُوٓاْ أَهْوَآءَ قَوْمٖ قَد ضَّلُّواْ مِن قَبْلُ وَأَضَلُّواْ كَثِيراٗ وَضَلُّواْ عَن سَوَآءِ اِ۬لسَّبِيلِۖ","لُعِنَ اَ۬لذِينَ كَفَرُواْ مِنۢ بَنِےٓ إِسْرَآءِيلَ عَلَىٰ لِسَانِ دَاوُۥدَ وَعِيسَى اَ۪بْنِ مَرْيَمَۖ ذَٰلِكَ بِمَا عَصَواْ وَّكَانُواْ يَعْتَدُونَۖ","كَانُواْ لَا يَتَنَاهَوْنَ عَن مُّنكَرٖ فَعَلُوهُۖ لَبِيسَ مَا كَانُواْ يَفْعَلُونَۖ","تَر۪ىٰ كَثِيراٗ مِّنْهُمْ يَتَوَلَّوْنَ اَ۬لذِينَ كَفَرُواْۖ لَبِيسَ مَا قَدَّمَتْ لَهُمُۥٓ أَنفُسُهُمُۥٓ أَن سَخِطَ اَ۬للَّهُ عَلَيْهِمْ وَفِے اِ۬لْعَذَابِ هُمْ خَٰلِدُونَۖ","وَلَوْ كَانُواْ يُومِنُونَ بِاللَّهِ وَالنَّبِےٓءِ وَمَآ أُنزِلَ إِلَيْهِ مَا اَ۪تَّخَذُوهُمُۥٓ أَوْلِيَآءَۖ وَلَٰكِنَّ كَثِيراٗ مِّنْهُمْ فَٰسِقُونَۖ","۞ لَتَجِدَنَّ أَشَدَّ اَ۬لنَّاسِ عَدَٰوَةٗ لِّلذِينَ ءَامَنُواْ اُ۬لْيَهُودَ وَالذِينَ أَشْرَكُواْۖ وَلَتَجِدَنَّ أَقْرَبَهُم مَّوَدَّةٗ لِّلذِينَ ءَامَنُواْ اُ۬لذِينَ قَالُوٓاْ إِنَّا نَصَٰر۪ىٰۖ ذَٰلِكَ بِأَنَّ مِنْهُمْ قِسِّيسِينَ وَرُهْبَاناٗ وَأَنَّهُمْ لَا يَسْتَكْبِرُونَۖ","وَإِذَا سَمِعُواْ مَآ أُنزِلَ إِلَى اَ۬لرَّسُولِ تَر۪ىٰٓ أَعْيُنَهُمْ تَفِيضُ مِنَ اَ۬لدَّمْعِ مِمَّا عَرَفُواْ مِنَ اَ۬لْحَقِّ يَقُولُونَ رَبَّنَآ ءَامَنَّا فَاكْتُبْنَا مَعَ اَ۬لشَّٰهِدِينَۖ","وَمَا لَنَا لَا نُومِنُ بِاللَّهِ وَمَا جَآءَنَا مِنَ اَ۬لْحَقِّ وَنَطْمَعُ
