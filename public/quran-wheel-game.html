 أَنْ يُّدْخِلَنَا رَبُّنَا مَعَ اَ۬لْقَوْمِ اِ۬لصَّٰلِحِينَۖ","فَأَثَٰبَهُمُ اُ۬للَّهُ بِمَا قَالُواْ جَنَّٰتٖ تَجْرِے مِن تَحْتِهَا اَ۬لَانْهَٰرُ خَٰلِدِينَ فِيهَاۖ وَذَٰلِكَ جَزَآءُ اُ۬لْمُحْسِنِينَۖ","وَالذِينَ كَفَرُواْ وَكَذَّبُواْ بِـَٔايَٰتِنَآ أُوْلَٰٓئِكَ أَصْحَٰبُ اُ۬لْجَحِيمِۖ","يَٰٓأَيُّهَا اَ۬لذِينَ ءَامَنُواْ لَا تُحَرِّمُواْ طَيِّبَٰتِ مَآ أَحَلَّ اَ۬للَّهُ لَكُمْ وَلَا تَعْتَدُوٓاْۖ إِنَّ اَ۬للَّهَ لَا يُحِبُّ اُ۬لْمُعْتَدِينَۖ","وَكُلُواْ مِمَّا رَزَقَكُمُ اُ۬للَّهُ حَلَٰلاٗ طَيِّباٗۖ وَاتَّقُواْ اُ۬للَّهَ اَ۬لذِےٓ أَنتُم بِهِۦ مُومِنُونَۖ","لَا يُوَ۬اخِذُكُمُ اُ۬للَّهُ بِاللَّغْوِ فِےٓ أَيْمَٰنِكُمْۖ وَلَٰكِنْ يُّوَ۬اخِذُكُم بِمَا عَقَّدتُّمُ اُ۬لَايْمَٰنَۖ فَكَفَّٰرَتُهُۥٓ إِطْعَامُ عَشَرَةِ مَسَٰكِينَ مِنَ اَوْسَطِ مَا تُطْعِمُونَ أَهْلِيكُمُۥٓ أَوْ كِسْوَتُهُمُۥٓ أَوْ تَحْرِيرُ رَقَبَةٖۖ فَمَن لَّمْ يَجِدْ فَصِيَامُ ثَلَٰثَةِ أَيَّامٖۖ ذَٰلِكَ كَفَّٰرَةُ أَيْمَٰنِكُمُۥٓ إِذَا حَلَفْتُمْۖ وَاحْفَظُوٓاْ أَيْمَٰنَكُمْۖ كَذَٰلِكَ يُبَيِّنُ اُ۬للَّهُ لَكُمُۥٓ ءَايَٰتِهِۦ لَعَلَّكُمْ تَشْكُرُونَۖ","۞ يَٰٓأَيُّهَا اَ۬لذِينَ ءَامَنُوٓاْ إِنَّمَا اَ۬لْخَمْرُ وَالْمَيْسِرُ وَالَانصَابُ وَالَازْلَٰمُ رِجْسٞ مِّنْ عَمَلِ اِ۬لشَّيْطَٰنِ فَاجْتَنِبُوهُ لَعَلَّكُمْ تُفْلِحُونَۖ","إِنَّمَا يُرِيدُ اُ۬لشَّيْطَٰنُ أَنْ يُّوقِعَ بَيْنَكُمُ اُ۬لْعَدَٰوَةَ وَالْبَغْضَآءَ فِے اِ۬لْخَمْرِ وَالْمَيْسِرِ وَيَصُدَّكُمْ عَن ذِكْرِ اِ۬للَّهِ وَعَنِ اِ۬لصَّلَوٰةِۖ فَهَلَ اَنتُم مُّنتَهُونَۖ","وَأَطِيعُواْ اُ۬للَّهَ وَأَطِيعُواْ اُ۬لرَّسُولَ وَاحْذَرُواْۖ فَإِن تَوَلَّيْتُمْ فَاعْلَمُوٓاْ أَنَّمَا عَلَىٰ رَسُولِنَا اَ۬لْبَلَٰغُ اُ۬لْمُبِينُۖ","لَيْسَ عَلَى اَ۬لذِينَ ءَامَنُواْ وَعَمِلُواْ اُ۬لصَّٰلِحَٰتِ جُنَاحٞ فِيمَا طَعِمُوٓاْ إِذَا مَا اَ۪تَّقَواْ وَّءَامَنُواْ وَعَمِلُواْ اُ۬لصَّٰلِحَٰتِ ثُمَّ اَ۪تَّقَواْ وَّءَامَنُواْ ثُمَّ اَ۪تَّقَواْ وَّأَحْسَنُواْۖ وَاللَّهُ يُحِبُّ اُ۬لْمُحْسِنِينَۖ","يَٰٓأَيُّهَا اَ۬لذِينَ ءَامَنُواْ لَيَبْلُوَنَّكُمُ اُ۬للَّهُ بِشَےْءٖ مِّنَ اَ۬لصَّيْدِ تَنَالُهُۥٓ أَيْدِيكُمْ وَرِمَاحُكُمْ لِيَعْلَمَ اَ۬للَّهُ مَنْ يَّخَافُهُۥ بِالْغَيْبِۖ فَمَنِ اِ۪عْتَد۪ىٰ بَعْدَ ذَٰلِكَ فَلَهُۥ عَذَابٌ اَلِيمٞۖ","يَٰٓأَيُّهَا اَ۬لذِينَ ءَامَنُواْ لَا تَقْتُلُواْ اُ۬لصَّيْدَ وَأَنتُمْ حُرُمٞۖ وَمَن قَتَلَهُۥ مِنكُم مُّتَعَمِّداٗ فَجَزَآءُ مِثْلِ مَا قَتَلَ مِنَ اَ۬لنَّعَمِ يَحْكُمُ بِهِۦ ذَوَا عَدْلٖ مِّنكُمْ هَدْياَۢ بَٰلِغَ اَ۬لْكَعْبَةِ أَوْ كَفَّٰرَةُ طَعَامِ مَسَٰكِينَ أَوْ عَدْلُ ذَٰلِكَ صِيَاماٗ لِّيَذُوقَ وَبَالَ أَمْرِهِۦۖ عَفَا اَ۬للَّهُ عَمَّا سَلَفَۖ وَمَنْ عَادَ فَيَنتَقِمُ اُ۬للَّهُ مِنْهُۖ وَاللَّهُ عَزِيزٞ ذُو اُ۪نتِقَامٍۖ","ا۟حِلَّ لَكُمْ صَيْدُ اُ۬لْبَحْرِ وَطَعَامُهُۖۥ مَتَٰعاٗ لَّكُمْ وَلِلسَّيَّارَةِۖ وَحُرِّمَ عَلَيْكُمْ صَيْدُ اُ۬لْبَرِّ مَا دُمْتُمْ حُرُماٗۖ وَاتَّقُواْ اُ۬للَّهَ اَ۬لذِےٓ إِلَيْهِ تُحْشَرُونَۖ","۞ جَعَلَ اَ۬للَّهُ اُ۬لْكَعْبَةَ اَ۬لْبَيْتَ اَ۬لْحَرَامَ قِيَٰماٗ لِّلنَّاسِ وَالشَّهْرَ اَ۬لْحَرَامَ وَالْهَدْيَ وَالْقَلَٰٓئِدَۖ ذَٰلِكَ لِتَعْلَمُوٓاْ أَنَّ اَ۬للَّهَ يَعْلَمُ مَا فِے اِ۬لسَّمَٰوَٰتِ وَمَا فِے اِ۬لَارْضِ وَأَنَّ اَ۬للَّهَ بِكُلِّ شَےْءٍ عَلِيمٌۖ","اِ۪عْلَمُوٓاْ أَنَّ اَ۬للَّهَ شَدِيدُ اُ۬لْعِقَابِ وَأَنَّ اَ۬للَّهَ غَفُورٞ رَّحِيمٞۖ","مَّا عَلَى اَ۬لرَّسُولِ إِلَّا اَ۬لْبَلَٰغُۖ وَاللَّهُ يَعْلَمُ مَا تُبْدُونَ وَمَا تَكْتُمُونَۖ","قُل لَّا يَسْتَوِے اِ۬لْخَبِيثُ وَالطَّيِّبُ وَلَوَ اَعْجَبَكَ كَثْرَةُ اُ۬لْخَبِيثِۖ فَاتَّقُواْ اُ۬للَّهَ يَٰٓأُوْلِے اِ۬لَالْبَٰبِ لَعَلَّكُمْ تُفْلِحُونَۖ","يَٰٓأَيُّهَا اَ۬لذِينَ ءَامَنُواْ لَا تَسْـَٔلُواْ عَنَ اَشْيَآءَ ا۪ن تُبْدَ لَكُمْ تَسُؤْكُمْۖ وَإِن تَسْـَٔلُواْ عَنْهَا حِينَ يُنَزَّلُ اُ۬لْقُرْءَانُ تُبْدَ لَكُمْ عَفَا اَ۬للَّهُ عَنْهَاۖ وَاللَّهُ غَفُورٌ حَلِيمٞۖ","قَدْ سَأَلَهَا قَوْمٞ مِّن قَبْلِكُمْ ثُمَّ أَصْبَحُواْ بِهَا كٰ۪فِرِينَۖ","مَا جَعَلَ اَ۬للَّهُ مِنۢ بَحِيرَةٖ وَلَا سَآئِبَةٖ وَلَا وَصِيلَةٖ وَلَا حَامٖۖ وَلَٰكِنَّ اَ۬لذِينَ كَفَرُواْ يَفْتَرُونَ عَلَى اَ۬للَّهِ اِ۬لْكَذِبَ وَأَكْثَرُهُمْ لَا يَعْقِلُونَۖ","وَإِذَا قِيلَ لَهُمْ تَعَالَوِاْ اِلَىٰ مَآ أَنزَلَ اَ۬للَّهُ وَإِلَى اَ۬لرَّسُولِ قَالُواْ حَسْبُنَا مَا وَجَدْنَا عَلَيْهِ ءَابَآءَنَآۖ أَوَلَوْ كَانَ ءَابَآؤُهُمْ لَا يَعْلَمُونَ شَئْاٗ وَلَا يَهْتَدُونَۖ","يَٰٓأَيُّهَا اَ۬لذِينَ ءَامَنُواْ عَلَيْكُمُۥٓ أَنفُسَكُمْۖ لَا يَضُرُّكُم مَّن ضَلَّ إِذَا اَ۪هْتَدَيْتُمُۥٓۖ إِلَى اَ۬للَّهِ مَرْجِعُكُمْ جَمِيعاٗ فَيُنَبِّئُكُم بِمَا كُنتُمْ تَعْمَلُونَۖ","۞ يَٰٓأَيُّهَا اَ۬لذِينَ ءَامَنُواْ شَهَٰدَةُ بَيْنِكُمُۥٓ إِذَا حَضَرَ أَحَدَكُمُ اُ۬لْمَوْتُ حِينَ اَ۬لْوَصِيَّةِ اِ۪ثْنَٰنِ ذَوَا عَدْلٖ مِّنكُمُۥٓ أَوَ اٰخَرَٰنِ مِنْ غَيْرِكُمُۥٓ إِنَ اَنتُمْ ضَرَبْتُمْ فِے اِ۬لَارْضِ فَأَصَٰبَتْكُم مُّصِيبَةُ اُ۬لْمَوْتِۖ تَحْبِسُونَهُمَا مِنۢ بَعْدِ اِ۬لصَّلَوٰةِ فَيُقْسِمَٰنِ بِاللَّهِ إِنِ اِ۪رْتَبْتُمْ لَا نَشْتَرِے بِهِۦ ثَمَناٗ وَلَوْ كَانَ ذَا قُرْب۪ىٰۖ وَلَا نَكْتُمُ شَهَٰدَةَ اَ۬للَّهِ إِنَّآ إِذاٗ لَّمِنَ اَ۬لَاثِمِينَۖ","فَإِنْ عُثِرَ عَلَىٰٓ أَنَّهُمَا اَ۪سْتَحَقَّآ إِثْماٗ فَـَٔاخَرَٰنِ يَقُومَٰنِ مَقَامَهُمَا مِنَ اَ۬لذِينَ اَ۟سْتُحِقَّ عَلَيْهِمُ اُ۬لَاوْلَيَٰنِ فَيُقْسِمَٰنِۖ بِاللَّهِ لَشَهَٰدَتُنَآ أَحَقُّ مِن شَهَٰدَتِهِمَا وَمَا اَ۪عْتَدَيْنَآۖ إِنَّآ إِذاٗ لَّمِنَ اَ۬لظَّٰلِمِينَۖ","ذَٰلِكَ أَدْن۪ىٰٓ أَنْ يَّاتُواْ بِالشَّهَٰدَةِ عَلَىٰ وَجْهِهَآ أَوْ يَخَافُوٓاْ أَن تُرَدَّ أَيْمَٰنُۢ بَعْدَ أَيْمَٰنِهِمْۖ وَاتَّقُواْ اُ۬للَّهَۖ وَاسْمَعُواْۖ وَاللَّهُ لَا يَهْدِے اِ۬لْقَوْمَ اَ۬لْفَٰسِقِينَۖ","يَوْمَ يَجْمَعُ اُ۬للَّهُ اُ۬لرُّسُلَ فَيَقُولُ مَاذَآ أُجِبْتُمْۖ قَالُواْ لَا عِلْمَ لَنَآ إِنَّكَ أَنتَ عَلَّٰمُ اُ۬لْغُيُوبِۖ","إِذْ قَالَ اَ۬للَّهُ يَٰعِيسَى اَ۪بْنَ مَرْيَمَ اَ۟ذْكُرْ نِعْمَتِے عَلَيْكَ وَعَلَىٰ وَٰلِدَتِكَ إِذَ اَيَّدتُّكَ بِرُوحِ اِ۬لْقُدُسِ تُكَلِّمُ اُ۬لنَّاسَ فِے اِ۬لْمَهْدِ وَكَهْلاٗۖ وَإِذْ عَلَّمْتُكَ اَ۬لْكِتَٰبَ وَالْحِكْمَةَ وَالتَّوْر۪يٰةَ وَالِانجِيلَۖ وَإِذْ تَخْلُقُ مِنَ اَ۬لطِّينِ كَهَيْـَٔةِ اِ۬لطَّيْرِ بِإِذْنِے فَتَنفُخُ فِيهَا فَتَكُونُ طَٰٓئِراَۢ بِإِذْنِےۖ وَتُبْرِۓُ اُ۬لَاكْمَهَ وَالَابْرَصَ بِإِذْنِےۖ وَإِذْ تُخْرِجُ اُ۬لْمَوْت۪ىٰ بِإِذْنِےۖ وَإِذْ كَفَفْتُ بَنِےٓ إِسْرَآءِيلَ عَنكَ إِذْ جِئْتَهُم بِالْبَيِّنَٰتِ فَقَالَ اَ۬لذِينَ كَفَرُواْ مِنْهُمُۥٓ إِنْ هَٰذَآ إِلَّا سِحْرٞ مُّبِينٞۖ","۞ وَإِذَ اَوْحَيْتُ إِلَى اَ۬لْحَوَارِيِّۧنَ أَنَ اٰمِنُواْ بِے وَبِرَسُولِےۖ قَالُوٓاْ ءَامَنَّا وَاشْهَدْ بِأَنَّنَا مُسْلِمُونَۖ","إِذْ قَالَ اَ۬لْحَوَارِيُّونَ يَٰعِيسَى اَ۪بْنَ مَرْيَمَ هَلْ يَسْتَطِيعُ رَبُّكَ أَنْ يُّنَزِّلَ عَلَيْنَا مَآئِدَةٗ مِّنَ اَ۬لسَّمَآءِۖ قَالَ اَ۪تَّقُواْ اُ۬للَّهَ إِن كُنتُم مُّومِنِينَۖ","قَالُواْ نُرِيدُ أَن نَّاكُلَ مِنْهَا وَتَطْمَئِنَّ قُلُوبُنَا وَنَعْلَمَ أَن قَدْ صَدَقْتَنَا وَنَكُونَ عَلَيْهَا مِنَ اَ۬لشَّٰهِدِينَۖ","قَالَ عِيسَى اَ۪بْنُ مَرْيَمَ اَ۬للَّهُمَّ رَبَّنَآ أَنزِلْ عَلَيْنَا مَآئِدَةٗ مِّنَ اَ۬لسَّمَآءِ تَكُونُ لَنَا عِيداٗ لِّأَوَّلِنَا وَءَاخِرِنَا وَءَايَةٗ مِّنكَۖ وَارْزُقْنَاۖ وَأَنتَ خَيْرُ اُ۬لرَّٰزِقِينَۖ","قَالَ اَ۬للَّهُ إِنِّے مُنَزِّلُهَا عَلَيْكُمْ فَمَنْ يَّكْفُرْ بَعْدُ مِنكُمْ فَإِنِّيَ أُعَذِّبُهُۥ عَذَاباٗ لَّآ أُعَذِّبُهُۥٓ أَحَداٗ مِّنَ اَ۬لْعَٰلَمِينَۖ","وَإِذْ قَالَ اَ۬للَّهُ يَٰعِيسَى اَ۪بْنَ مَرْيَمَ ءَآنتَ قُلْتَ لِلنَّاسِ اِ۪تَّخِذُونِے وَأُمِّيَ إِلَٰهَيْنِ مِن دُونِ اِ۬للَّهِۖ قَالَ سُبْحَٰنَكَ مَا يَكُونُ لِيَ أَنَ اَقُولَ مَا لَيْسَ لِے بِحَقٍّۖ اِن كُنتُ قُلْتُهُۥ فَقَدْ عَلِمْتَهُۥۖ تَعْلَمُ مَا فِے نَفْسِے وَلَآ أَعْلَمُ مَا فِے نَفْسِكَۖ إِنَّكَ أَنتَ عَلَّٰمُ اُ۬لْغُيُوبِۖ","مَا قُلْتُ لَهُمُۥٓ إِلَّا مَآ أَمَرْتَنِے بِهِۦٓ أَنُ اُ۟عْبُدُواْ اُ۬للَّهَ رَبِّے وَرَبَّكُمْۖ وَكُنتُ عَلَيْهِمْ شَهِيداٗ مَّا دُمْتُ فِيهِمْۖ فَلَمَّا تَوَفَّيْتَنِے كُنتَ أَنتَ اَ۬لرَّقِيبَ عَلَيْهِمْۖ وَأَنتَ عَلَىٰ كُلِّ شَےْءٖ شَهِيدٌۖ","اِن تُعَذِّبْهُمْ فَإِنَّهُمْ عِبَادُكَۖ وَإِن تَغْفِرْ لَهُمْ فَإِنَّكَ أَنتَ اَ۬لْعَزِيزُ اُ۬لْحَكِيمُۖ","قَالَ اَ۬للَّهُ هَٰذَا يَوْمَ يَنفَعُ اُ۬لصَّٰدِقِينَ صِدْقُهُمْۖ لَهُمْ جَنَّٰتٞ تَجْرِے مِن تَحْتِهَا اَ۬لَانْهَٰرُ خَٰلِدِينَ فِيهَآ أَبَداٗۖ رَّضِيَ اَ۬للَّهُ عَنْهُمْ وَرَضُواْ عَنْهُۖ ذَٰلِكَ اَ۬لْفَوْزُ اُ۬لْعَظِيمُۖ","لِلهِ مُلْكُ اُ۬لسَّمَٰوَٰتِ وَالَارْضِ وَمَا فِيهِنَّۖ وَهُوَ عَلَىٰ كُلِّ شَےْءٖ قَدِيرٌۖ"]],["الأنعام",["اِ۬لْحَمْدُ لِلهِ اِ۬لذِے خَلَقَ اَ۬لسَّمَٰوَٰتِ وَالَارْضَ وَجَعَلَ اَ۬لظُّلُمَٰتِ وَالنُّورَ","ثُمَّ اَ۬لذِينَ كَفَرُواْ بِرَبِّهِمْ يَعْدِلُونَۖ","هُوَ اَ۬لذِے خَلَقَكُم مِّن طِينٖ ثُمَّ قَض۪ىٰٓ أَجَلاٗۖ وَأَجَلٞ مُّسَمّىً عِندَهُۥۖ ثُمَّ أَنتُمْ تَمْتَرُونَۖ","وَهُوَ اَ۬للَّهُ فِے اِ۬لسَّمَٰوَٰتِ وَفِے اِ۬لَارْضِ يَعْلَمُ سِرَّكُمْ وَجَهْرَكُمْ وَيَعْلَمُ مَا تَكْسِبُونَۖ","وَمَا تَاتِيهِم مِّنَ اٰيَةٖ مِّنَ اٰيَٰتِ رَبِّهِمُۥٓ إِلَّا كَانُواْ عَنْهَا مُعْرِضِينَۖ","فَقَدْ كَذَّبُواْ بِالْحَقِّ لَمَّا جَآءَهُمْۖ فَسَوْفَ يَاتِيهِمُۥٓ أَنۢبَٰٓؤُاْ مَا كَانُواْ بِهِۦ يَسْتَهْزِءُونَۖ","أَلَمْ يَرَوْاْ كَمَ اَهْلَكْنَا مِن قَبْلِهِم مِّن قَرْنٖ مَّكَّنَّٰهُمْ فِے اِ۬لَارْضِ مَا لَمْ نُمَكِّن لَّكُمْۖ وَأَرْسَلْنَا اَ۬لسَّمَآءَ عَلَيْهِم مِّدْرَاراٗۖ وَجَعَلْنَا اَ۬لَانْهَٰرَ تَجْرِے مِن تَحْتِهِمْ فَأَهْلَكْنَٰهُم بِذُنُوبِهِمْۖ وَأَنشَأْنَا مِنۢ بَعْدِهِمْ قَرْناً اٰخَرِينَۖ","وَلَوْ نَزَّلْنَا عَلَيْكَ كِتَٰباٗ فِے قِرْطَاسٖ فَلَمَسُوهُ بِأَيْدِيهِمْ لَقَالَ اَ۬لذِينَ كَفَرُوٓاْ إِنْ هَٰذَآ إِلَّا سِحْرٞ مُّبِينٞۖ","وَقَالُواْ لَوْلَآ أُنزِلَ عَلَيْهِ مَلَكٞۖ وَلَوَ اَنزَلْنَا مَلَكاٗ لَّقُضِيَ اَ۬لَامْرُ ثُمَّ لَا يُنظَرُونَۖ","وَلَوْ جَعَلْنَٰهُ مَلَكاٗ لَّجَعَلْنَٰهُ رَجُلاٗ وَلَلَبَسْنَا عَلَيْهِم مَّا يَلْبِسُونَۖ","وَلَقَدُ اُ۟سْتُهْزِۓَ بِرُسُلٖ مِّن قَبْلِكَ فَحَاقَ بِالذِينَ سَخِرُواْ مِنْهُم مَّا كَانُواْ بِهِۦ يَسْتَهْزِءُونَۖ","قُلْ سِيرُواْ فِے اِ۬لَارْضِ ثُمَّ اَ۟نظُرُواْ كَيْفَ كَانَ عَٰقِبَةُ اُ۬لْمُكَذِّبِينَۖ","قُل لِّمَن مَّا فِے اِ۬لسَّمَٰوَٰتِ وَالَارْضِ قُل لِّلهِۖ كَتَبَ عَلَىٰ نَفْسِهِ اِ۬لرَّحْمَةَۖ لَيَجْمَعَنَّكُمُۥٓ إِلَىٰ يَوْمِ اِ۬لْقِيَٰمَةِ لَا رَيْبَ فِيهِۖ اِ۬لذِينَ خَسِرُوٓاْ أَنفُسَهُمْ فَهُمْ لَا يُومِنُونَۖ","۞ وَلَهُۥ مَا سَكَنَ فِے اِ۬ليْلِ وَالنَّه۪ارِۖ وَهُوَ اَ۬لسَّمِيعُ اُ۬لْعَلِيمُۖ","قُلَ اَغَيْرَ اَ۬للَّهِ أَتَّخِذُ وَلِيّاٗ فَاطِرِ اِ۬لسَّمَٰوَٰتِ وَالَارْضِۖ وَهُوَ يُطْعِمُ وَلَا يُطْعَمُۖ قُلِ اِنِّيَ أُمِرْتُ أَنَ اَكُونَ أَوَّلَ مَنَ اَسْلَمَۖ وَلَا تَكُونَنَّ مِنَ اَ۬لْمُشْرِكِينَۖ","قُلِ اِنِّيَ أَخَافُ إِنْ عَصَيْتُ رَبِّے عَذَابَ يَوْمٍ عَظِيمٖۖ","مَّنْ يُّصْرَفْ عَنْهُ يَوْمَئِذٖ فَقَدْ رَحِمَهُۥۖ وَذَٰلِكَ اَ۬لْفَوْزُ اُ۬لْمُبِينُۖ","وَإِنْ يَّمْسَسْكَ اَ۬للَّهُ بِضُرّٖ فَلَا كَاشِفَ لَهُۥٓ إِلَّا هُوَۖ وَإِنْ يَّمْسَسْكَ بِخَيْرٖ فَهُوَ عَلَىٰ كُلِّ شَےْءٖ قَدِيرٞۖ","وَهُوَ اَ۬لْقَاهِرُ فَوْقَ عِبَادِهِۦۖ وَهُوَ اَ۬لْحَكِيمُ اُ۬لْخَبِيرُۖ","قُلَ اَيُّ شَےْءٍ اَكْبَرُ شَهَٰدَةٗ قُلِ اِ۬للَّهُۖ شَهِيدُۢ بَيْنِے وَبَيْنَكُمْۖ وَأُوحِيَ إِلَيَّ هَٰذَا اَ۬لْقُرْءَانُ لِأُنذِرَكُم بِهِۦ وَمَنۢ بَلَغَۖ أَئِنَّكُمْ لَتَشْهَدُونَ أَنَّ مَعَ اَ۬للَّهِ ءَالِهَةً ا۟خْر۪ىٰ قُل لَّآ أَشْهَدُۖ قُلِ اِنَّمَا هُوَ إِلَٰهٞ وَٰحِدٞۖ وَإِنَّنِے بَرِےٓءٞ مِّمَّا تُشْرِكُونَۖ","اَ۬لذِينَ ءَاتَيْنَٰهُمُ اُ۬لْكِتَٰبَ يَعْرِفُونَهُۥ كَمَا يَعْرِفُونَ أَبْنَآءَهُمُۖ اُ۬لذِينَ خَسِرُوٓاْ أَنفُسَهُمْ فَهُمْ لَا يُومِنُونَۖ","وَمَنَ اَظْلَمُ مِمَّنِ اِ۪فْتَر۪ىٰ عَلَى اَ۬للَّهِ كَذِباً اَوْ كَذَّبَ بِـَٔايَٰتِهِۦٓۖ إِنَّهُۥ لَا يُفْلِحُ اُ۬لظَّٰلِمُونَۖ","وَيَوْمَ نَحْشُرُهُمْ جَمِيعاٗ ثُمَّ نَقُولُ لِلذِينَ أَشْرَكُوٓاْ أَيْنَ شُرَكَآؤُكُمُ اُ۬لذِينَ كُنتُمْ تَزْعُمُونَۖ","ثُمَّ لَمْ تَكُن فِتْنَتَهُمُۥٓ إِلَّآ أَن قَالُواْ وَاللَّهِ رَبِّنَا مَا كُنَّا مُشْرِكِينَۖ","اَ۟نظُرْ كَيْفَ كَذَبُواْ عَلَىٰٓ أَنفُسِهِمْ وَضَلَّ عَنْهُم مَّا كَانُواْ يَفْتَرُونَۖ","وَمِنْهُم مَّنْ يَّسْتَمِعُ إِلَيْكَۖ وَجَعَلْنَا عَلَىٰ قُلُوبِهِمُۥٓ أَكِنَّةً اَنْ يَّفْقَهُوهُ وَفِےٓ ءَاذَانِهِمْ وَقْراٗۖ وَإِنْ يَّرَوْاْ كُلَّ ءَايَةٖ لَّا يُومِنُواْ بِهَاۖ حَتَّىٰٓ إِذَا جَآءُوكَ يُجَٰدِلُونَكَ يَقُولُ اُ۬لذِينَ كَفَرُوٓاْ إِنْ هَٰذَآ إِلَّآ أَسَٰطِيرُ اُ۬لَاوَّلِينَۖ","۞ وَهُمْ يَنْهَوْنَ عَنْهُ وَيَنْـَٔوْنَ عَنْهُۖ وَإِنْ يُّهْلِكُونَ إِلَّآ أَنفُسَهُمْ وَمَا يَشْعُرُونَۖ","وَلَوْ تَر۪ىٰٓ إِذْ وُقِفُواْ عَلَى اَ۬لنّ۪ارِ فَقَالُواْ يَٰلَيْتَنَا نُرَدُّۖ وَلَا نُكَذِّبُ بِـَٔايَٰتِ رَبِّنَا وَنَكُونُ مِنَ اَ۬لْمُومِنِينَۖ","بَلْ بَدَا لَهُم مَّا كَانُواْ يُخْفُونَ مِن قَبْلُۖ وَلَوْ رُدُّواْ لَعَادُواْ لِمَا نُهُواْ عَنْهُۖ وَإِنَّهُمْ لَكَٰذِبُونَۖ","وَقَالُوٓاْ إِنْ هِيَ إِلَّا حَيَاتُنَا اَ۬لدُّنْي۪ا وَمَا نَحْنُ بِمَبْعُوثِينَۖ","وَلَوْ تَر۪ىٰٓ إِذْ وُقِفُواْ عَلَىٰ رَبِّهِمْ قَالَ أَلَيْسَ هَٰذَا بِالْحَقِّۖ قَالُواْ بَل۪ىٰ وَرَبِّنَاۖ قَالَ فَذُوقُواْ اُ۬لْعَذَابَ بِمَا كُنتُمْ تَكْفُرُونَۖ","قَدْ خَسِرَ اَ۬لذِينَ كَذَّبُواْ بِلِقَآءِ اِ۬للَّهِ حَتَّىٰٓ إِذَا جَآءَتْهُمُ اُ۬لسَّاعَةُ بَغْتَةٗ قَالُواْ يَٰحَسْرَتَنَا عَلَىٰ مَا فَرَّطْنَا فِيهَا وَهُمْ يَحْمِلُونَ أَوْزَارَهُمْ عَلَىٰ ظُهُورِهِمُۥٓۖ أَلَا سَآءَ مَا يَزِرُونَۖ","وَمَا اَ۬لْحَيَوٰةُ اُ۬لدُّنْي۪آ إِلَّا لَعِبٞ وَلَهْوٞۖ وَلَلدَّارُ اُ۬لَاخِرَةُ خَيْرٞ لِّلذِينَ يَتَّقُونَۖ أَفَلَا تَعْقِلُونَۖ","قَدْ نَعْلَمُ إِنَّهُۥ لَيُحْزِنُكَ اَ۬لذِے يَقُولُونَۖ فَإِنَّهُمْ لَا يُكْذِبُونَكَۖ وَلَٰكِنَّ اَ۬لظَّٰلِمِينَ بِـَٔايَٰتِ اِ۬للَّهِ يَجْحَدُونَۖ","وَلَقَدْ كُذِّبَتْ رُسُلٞ مِّن قَبْلِكَ فَصَبَرُواْ عَلَىٰ مَا كُذِّبُواْ وَأُوذُواْ حَتَّىٰٓ أَت۪يٰهُمْ نَصْرُنَاۖ وَلَا مُبَدِّلَ لِكَلِمَٰتِ اِ۬للَّهِۖ وَلَقَدْ جَآءَكَ مِن نَّبَإِےْ اِ۬لْمُرْسَلِينَۖ","وَإِن كَانَ كَبُرَ عَلَيْكَ إِعْرَاضُهُمْ فَإِنِ اِ۪سْتَطَعْتَ أَن تَبْتَغِيَ نَفَقاٗ فِے اِ۬لَارْضِ أَوْ سُلَّماٗ فِے اِ۬لسَّمَآءِ فَتَاتِيَهُم بِـَٔايَةٖۖ وَلَوْ شَآءَ اَ۬للَّهُ لَجَمَعَهُمْ عَلَى اَ۬لْهُد۪ىٰۖ فَلَا تَكُونَنَّ مِنَ اَ۬لْجَٰهِلِينَۖ","۞ إِنَّمَا يَسْتَجِيبُ اُ۬لذِينَ يَسْمَعُونَۖ وَالْمَوْت۪ىٰ يَبْعَثُهُمُ اُ۬للَّهُۖ ثُمَّ إِلَيْهِ يُرْجَعُونَۖ","وَقَالُواْ لَوْلَا نُزِّلَ عَلَيْهِ ءَايَةٞ مِّن رَّبِّهِۦۖ قُلِ اِنَّ اَ۬للَّهَ قَادِرٌ عَلَىٰٓ أَنْ يُّنَزِّلَ ءَايَةٗۖ وَلَٰكِنَّ أَكْثَرَهُمْ لَا يَعْلَمُونَۖ","وَمَا مِن دَآبَّةٖ فِے اِ۬لَارْضِ وَلَا طَٰٓئِرٖ يَطِيرُ بِجَنَاحَيْهِ إِلَّآ أُمَمٌ اَمْثَالُكُمۖ مَّا فَرَّطْنَا فِے اِ۬لْكِتَٰبِ مِن شَےْءٖۖ ثُمَّ إِلَىٰ رَبِّهِمْ يُحْشَرُونَۖ","وَالذِينَ كَذَّبُواْ بِـَٔايَٰتِنَا صُمّٞ وَبُكْمٞ فِے اِ۬لظُّلُمَٰتِۖ مَنْ يَّشَإِ اِ۬للَّهُ يُضْلِلْهُۖ وَمَنْ يَّشَأْ يَجْعَلْهُ عَلَىٰ صِرَٰطٖ مُّسْتَقِيمٖۖ","قُلَ اَرَٰٓيْتَكُمُۥٓ إِنَ اَت۪يٰكُمْ عَذَابُ اُ۬للَّهِ أَوَ اَتَتْكُمُ اُ۬لسَّاعَةُ أَغَيْرَ اَ۬للَّهِ تَدْعُونَ إِن كُنتُمْ صَٰدِقِينَۖ","بَلِ اِيَّاهُ تَدْعُونَ فَيَكْشِفُ مَا تَدْعُونَ إِلَيْهِ إِن شَآءَ وَتَنسَوْنَ مَا تُشْرِكُونَۖ","وَلَقَدَ اَرْسَلْنَآ إِلَىٰٓ أُمَمٖ مِّن قَبْلِكَ فَأَخَذْنَٰهُم بِالْبَأْسَآءِ وَالضَّرَّآءِ لَعَلَّهُمْ يَتَضَرَّعُونَۖ","فَلَوْلَآ إِذْ جَآءَهُم بَأْسُنَا تَضَرَّعُواْۖ وَلَٰكِن قَسَتْ قُلُوبُهُمْ وَزَيَّنَ لَهُمُ اُ۬لشَّيْطَٰنُ مَا كَانُواْ يَعْمَلُونَۖ","فَلَمَّا نَسُواْ مَا ذُكِّرُواْ بِهِۦ فَتَحْنَا عَلَيْهِمُۥٓ أَبْوَٰبَ كُلِّ شَےْءٍۖ حَتَّىٰٓ إِذَا فَرِحُواْ بِمَآ أُوتُوٓاْ أَخَذْنَٰهُم بَغْتَةٗ فَإِذَا هُم مُّبْلِسُونَۖ","فَقُطِعَ دَابِرُ اُ۬لْقَوْمِ اِ۬لذِينَ ظَلَمُواْۖ وَالْحَمْدُ لِلهِ رَبِّ اِ۬لْعَٰلَمِينَۖ","قُلَ اَرَٰٓيْتُمُۥٓ إِنَ اَخَذَ اَ۬للَّهُ سَمْعَكُمْ وَأَبْصَٰرَكُمْ وَخَتَمَ عَلَىٰ قُلُوبِكُم مَّنِ اِلَٰهٌ غَيْرُ اُ۬للَّهِ يَاتِيكُم بِهِۖ اِ۟نظُرْ كَيْفَ نُصَرِّفُ اُ۬لَايَٰتِ ثُمَّ هُمْ يَصْدِفُونَۖ","قُلَ اَرَٰٓيْتَكُمُۥٓ إِنَ اَت۪يٰكُمْ عَذَابُ اُ۬للَّهِ بَغْتَةً اَوْ جَهْرَةً هَلْ يُهْلَكُ إِلَّا اَ۬لْقَوْمُ اُ۬لظَّٰلِمُونَۖ","۞ وَمَا نُرْسِلُ اُ۬لْمُرْسَلِينَ إِلَّا مُبَشِّرِينَ وَمُنذِرِينَۖ فَمَنَ اٰمَنَ وَأَصْلَحَ فَلَا خَوْفٌ عَلَيْهِمْ وَلَا هُمْ يَحْزَنُونَۖ","وَالذِينَ كَذَّبُواْ بِـَٔايَٰتِنَا يَمَسُّهُمُ اُ۬لْعَذَابُ بِمَا كَانُواْ يَفْسُقُونَۖ","قُل لَّآ أَقُولُ لَكُمْ عِندِے خَزَآئِنُ اُ۬للَّهِ وَلَآ أَعْلَمُ اُ۬لْغَيْبَ وَلَآ أَقُولُ لَكُمُۥٓ إِنِّے مَلَكٌۖ اِنَ اَتَّبِعُ إِلَّا مَا يُوح۪ىٰٓ إِلَيَّۖ قُلْ هَلْ يَسْتَوِے اِ۬لَاعْم۪ىٰ وَالْبَصِيرُۖ أَفَلَا تَتَفَكَّرُونَۖ","وَأَنذِرْ بِهِ اِ۬لذِينَ يَخَافُونَ أَنْ يُّحْشَرُوٓاْ إِلَىٰ رَبِّهِمْ لَيْسَ لَهُم مِّن دُونِهِۦ وَلِيّٞ وَلَا شَفِيعٞ لَّعَلَّهُمْ يَتَّقُونَۖ","وَلَا تَطْرُدِ اِ۬لذِينَ يَدْعُونَ رَبَّهُم بِالْغَدَوٰةِ وَالْعَشِيِّ يُرِيدُونَ وَجْهَهُۥ مَا عَلَيْكَ مِنْ حِسَابِهِم مِّن شَےْءٖ وَمَا مِنْ حِسَابِكَ عَلَيْهِم مِّن شَےْءٖ فَتَطْرُدَهُمْ فَتَكُونَ مِنَ اَ۬لظَّٰلِمِينَۖ","وَكَذَٰلِكَ فَتَنَّا بَعْضَهُم بِبَعْضٖ لِّيَقُولُوٓاْ أَهَٰٓؤُلَآءِ مَنَّ اَ۬للَّهُ عَلَيْهِم مِّنۢ بَيْنِنَآۖ أَلَيْسَ اَ۬للَّهُ بِأَعْلَمَ بِالشَّٰكِرِينَۖ","وَإِذَا جَآءَكَ اَ۬لذِينَ يُومِنُونَ بِـَٔايَٰتِنَا فَقُلْ سَلَٰمٌ عَلَيْكُمْۖ كَتَبَ رَبُّكُمْ عَلَىٰ نَفْسِهِ اِ۬لرَّحْمَةَ أَنَّهُۥ مَنْ عَمِلَ مِنكُمْ سُوٓءاَۢ بِجَهَٰلَةٖ ثُمَّ تَابَ مِنۢ بَعْدِهِۦ وَأَصْلَحَ فَإِنَّهُۥ غَفُورٞ رَّحِيمٞۖ","وَكَذَٰلِكَ نُفَصِّلُ اُ۬لَايَٰتِ وَلِتَسْتَبِينَ سَبِيلَ اَ۬لْمُجْرِمِينَۖ","قُلِ اِنِّے نُهِيتُ أَنَ اَعْبُدَ اَ۬لذِينَ تَدْعُونَ مِن دُونِ اِ۬للَّهِۖ قُل لَّآ أَتَّبِعُ أَهْوَآءَكُمْۖ قَد ضَّلَلْتُ إِذاٗ وَمَآ أَنَا مِنَ اَ۬لْمُهْتَدِينَۖ","قُلِ اِنِّے عَلَىٰ بَيِّنَةٖ مِّن رَّبِّے وَكَذَّبْتُم بِهِۦۖ مَا عِندِے مَا تَسْتَعْجِلُونَ بِهِۦٓۖ إِنِ اِ۬لْحُكْمُ إِلَّا لِلهِۖ يَقُصُّ اُ۬لْحَقَّۖ وَهُوَ خَيْرُ اُ۬لْفَٰصِلِينَۖ","قُل لَّوَ اَنَّ عِندِے مَا تَسْتَعْجِلُونَ بِهِۦ لَقُضِيَ اَ۬لَامْرُ بَيْنِے وَبَيْنَكُمْۖ وَاللَّهُ أَعْلَمُ بِالظَّٰلِمِينَۖ","۞ وَعِندَهُۥ مَفَاتِحُ اُ۬لْغَيْبِ لَا يَعْلَمُهَآ إِلَّا هُوَۖ وَيَعْلَمُ مَا فِے اِ۬لْبَرِّ وَالْبَحْرِۖ وَمَا تَسْقُطُ مِنْ وَّرَقَةٍ اِلَّا يَعْلَمُهَا وَلَا حَبَّةٖ فِے ظُلُمَٰتِ اِ۬لَارْضِ وَلَا رَطْبٖ وَلَا يَابِسٍ اِلَّا فِے كِتَٰبٖ مُّبِينٖۖ","وَهُوَ اَ۬لذِے يَتَوَفّ۪يٰكُم بِاليْلِ وَيَعْلَمُ مَا جَرَحْتُم بِالنَّه۪ارِ ثُمَّ يَبْعَثُكُمْ فِيهِ لِيُقْض۪ىٰٓ أَجَلٞ مُّسَمّىٗۖ ثُمَّ إِلَيْهِ مَرْجِعُكُمْ ثُمَّ يُنَبِّئُكُم بِمَا كُنتُمْ تَعْمَلُونَۖ","وَهُوَ اَ۬لْقَاهِرُ فَوْقَ عِبَادِهِۦۖ وَيُرْسِلُ عَلَيْكُمْ حَفَظَةًۖ حَتَّىٰٓ إِذَا جَآءَ احَدَكُمُ اُ۬لْمَوْتُ تَوَفَّتْهُ رُسُلُنَا وَهُمْ لَا يُفَرِّطُونَۖ","ثُمَّ رُدُّوٓاْ إِلَى اَ۬للَّهِ مَوْل۪يٰهُمُ اُ۬لْحَقِّۖ أَلَا لَهُ اُ۬لْحُكْمُۖ وَهُوَ أَسْرَعُ اُ۬لْحَٰسِبِينَۖ","قُلْ مَنْ يُّنَجِّيكُم مِّن ظُلُمَٰتِ اِ۬لْبَرِّ وَالْبَحْرِ تَدْعُونَهُۥ تَضَرُّعاٗ وَخُفْيَةٗ لَّئِنَ اَنجَيْتَنَا مِنْ هَٰذِهِۦ لَنَكُونَنَّ مِنَ اَ۬لشَّٰكِرِينَۖ","قُلِ اِ۬للَّهُ يُنجِيكُم مِّنْهَا وَمِن كُلِّ كَرْبٖ ثُمَّ أَنتُمْ تُشْرِكُونَۖ","قُلْ هُوَ اَ۬لْقَادِرُ عَلَىٰٓ أَنْ يَّبْعَثَ عَلَيْكُمْ عَذَاباٗ مِّن فَوْقِكُمُۥٓ أَوْ مِن تَحْتِ أَرْجُلِكُمُۥٓ أَوْ يَلْبِسَكُمْ شِيَعاٗ وَيُذِيقَ بَعْضَكُم بَأْسَ بَعْضٍۖ اُ۟نظُرْ كَيْفَ نُصَرِّفُ اُ۬لَايَٰتِ لَعَلَّهُمْ يَفْقَهُونَۖ","وَكَذَّبَ بِهِۦ قَوْمُكَ وَهُوَ اَ۬لْحَقُّۖ قُل لَّسْتُ عَلَيْكُم بِوَكِيلٖۖ لِّكُلِّ نَبَإٖ مُّسْتَقَرّٞۖ وَسَوْفَ تَعْلَمُونَۖ","وَإِذَا رَأَيْتَ اَ۬لذِينَ يَخُوضُونَ فِےٓ ءَايَٰتِنَا فَأَعْرِضْ عَنْهُمْ حَتَّىٰ يَخُوضُواْ فِے حَدِيثٍ غَيْرِهِۦۖ وَإِمَّا يُنسِيَنَّكَ اَ۬لشَّيْطَٰنُ فَلَا تَقْعُدْ بَعْدَ اَ۬لذِّكْر۪ىٰ مَعَ اَ۬لْقَوْمِ اِ۬لظَّٰلِمِينَۖ","وَمَا عَلَى اَ۬لذِينَ يَتَّقُونَ مِنْ حِسَابِهِم مِّن شَےْءٖۖ وَلَٰكِن ذِكْر۪ىٰ لَعَلَّهُمْ يَتَّقُونَۖ","۞ وَذَرِ اِ۬لذِينَ اَ۪تَّخَذُواْ دِينَهُمْ لَعِباٗ وَلَهْواٗ وَغَرَّتْهُمُ اُ۬لْحَيَوٰةُ اُ۬لدُّنْي۪اۖ وَذَكِّرْ بِهِۦٓ أَن تُبْسَلَ نَفْسُۢ بِمَا كَسَبَتْ لَيْسَ لَهَا مِن دُونِ اِ۬للَّهِ وَلِيّٞ وَلَا شَفِيعٞۖ وَإِن تَعْدِلْ كُلَّ عَدْلٖ لَّا يُوخَذْ مِنْهَاۖ أُوْلَٰٓئِكَ اَ۬لذِينَ أُبْسِلُواْ بِمَا كَسَبُواْ لَهُمْ شَرَابٞ مِّنْ حَمِيمٖ وَعَذَابٌ اَلِيمُۢ بِمَا كَانُواْ يَكْفُرُونَۖ","قُلَ اَنَدْعُواْ مِن دُونِ اِ۬للَّهِ مَا لَا يَنفَعُنَا وَلَا يَضُرُّنَا وَنُرَدُّ عَلَىٰٓ أَعْقَابِنَا بَعْدَ إِذْ هَد۪يٰنَا اَ۬للَّهُ كَالذِے اِ۪سْتَهْوَتْهُ اُ۬لشَّيَٰطِينُ فِے اِ۬لَارْضِ حَيْرَانَۖ لَهُۥٓ أَصْحَٰبٞ يَدْعُونَهُۥٓ إِلَى اَ۬لْهُدَى اَ۪يتِنَاۖ قُلِ اِنَّ هُدَى اَ۬للَّهِ هُوَ اَ۬لْهُد۪ىٰ وَأُمِرْنَا لِنُسْلِمَ لِرَبِّ اِ۬لْعَٰلَمِينَ","وَأَنَ اَقِيمُواْ اُ۬لصَّلَوٰةَ وَاتَّقُوهُۖ وَهُوَ اَ۬لذِےٓ إِلَيْهِ تُحْشَرُونَۖ","وَهُوَ اَ۬لذِے خَلَقَ اَ۬لسَّمَٰوَٰتِ وَالَارْضَ بِالْحَقِّۖ وَيَوْمَ يَقُولُ كُنۖ فَيَكُونُۖ","قَوْلُهُ اُ۬لْحَقُّۖ وَلَهُ اُ۬لْمُلْكُۖ يَوْمَ يُنفَخُ فِے اِ۬لصُّورِۖ عَٰلِمُ اُ۬لْغَيْبِ وَالشَّهَٰدَةِۖ وَهُوَ اَ۬لْحَكِيمُ اُ۬لْخَبِيرُۖ","وَإِذْ قَالَ إِبْرَٰهِيمُ لِأَبِيهِ ءَازَرَ أَتَتَّخِذُ أَصْنَاماً اٰلِهَةًۖ اِنِّيَ أَر۪يٰكَ وَقَوْمَكَ فِے ضَلَٰلٖ مُّبِينٖۖ","وَكَذَٰلِكَ نُرِےٓ إِبْرَٰهِيمَ مَلَكُوتَ اَ۬لسَّمَٰوَٰتِ وَالَارْضِ وَلِيَكُونَ مِنَ اَ۬لْمُوقِنِينَۖ","فَلَمَّا جَنَّ عَلَيْهِ اِ۬ليْلُ ر۪ء۪ا كَوْكَباٗ قَالَ هَٰذَا رَبِّےۖ فَلَمَّآ أَفَلَ قَالَ لَآ أُحِبُّ اُ۬لَافِلِينَۖ","فَلَمَّا رَءَا اَ۬لْقَمَرَ بَازِغاٗ قَالَ هَٰذَا رَبِّےۖ فَلَمَّآ أَفَلَ قَالَ لَئِن لَّمْ يَهْدِنِے رَبِّے لَأَكُونَنَّ مِنَ اَ۬لْقَوْمِ اِ۬لضَّآلِّينَۖ","فَلَمَّا رَءَا اَ۬لشَّمْسَ بَازِغَةٗ قَالَ هَٰذَا رَبِّے هَٰذَآ أَكْبَرُۖ فَلَمَّآ أَفَلَتْ قَالَ يَٰقَوْمِ إِنِّے بَرِےٓءٞ مِّمَّا تُشْرِكُونَۖ","إِنِّے وَجَّهْتُ وَجْهِيَ لِلذِے فَطَرَ اَ۬لسَّمَٰوَٰتِ وَالَارْضَ حَنِيفاٗۖ وَمَآ أَنَا مِنَ اَ۬لْمُشْرِكِينَۖ","۞ وَحَآجَّهُۥ قَوْمُهُۥۖ قَالَ أَتُحَٰٓجُّونِے فِے اِ۬للَّهِ وَقَدْ هَد۪يٰنِۖ وَلَآ أَخَافُ مَا تُشْرِكُونَ بِهِۦٓ إِلَّآ أَنْ يَّشَآءَ رَبِّے شَئْاٗۖ وَسِعَ رَبِّے كُلَّ شَےْءٍ عِلْماًۖ اَفَلَا تَتَذَكَّرُونَۖ","وَكَيْفَ أَخَافُ مَآ أَشْرَكْتُمْۖ وَلَا تَخَافُونَ أَنَّكُمُۥٓ أَشْرَكْتُم بِاللَّهِ مَا لَمْ يُنَزِّلْ بِهِۦ عَلَيْكُمْ سُلْطَٰناٗۖ فَأَيُّ اُ۬لْفَرِيقَيْنِ أَحَقُّ بِالَامْنِ إِن كُنتُمْ تَعْلَمُونَۖ","اَ۬لذِينَ ءَامَنُواْ وَلَمْ يَلْبِسُوٓاْ إِيمَٰنَهُم بِظُلْمٍ ا۟وْلَٰٓئِكَ لَهُمُ اُ۬لَامْنُ وَهُم مُّهْتَدُونَۖ","وَتِلْكَ حُجَّتُنَآ ءَاتَيْنَٰهَآ إِبْرَٰهِيمَ عَلَىٰ قَوْمِهِۦۖ نَرْفَعُ دَرَجَٰتِ مَن نَّشَآءُۖ اِ۪نَّ رَبَّكَ حَكِيمٌ عَلِيمٞۖ","وَوَهَبْنَا لَهُۥٓ إِسْحَٰقَ وَيَعْقُوبَۖ كُلّاً هَدَيْنَاۖ وَنُوحاً هَدَيْنَا مِن قَبْلُۖ وَمِن ذُرِّيَّتِهِۦ دَاوُۥدَ وَسُلَيْمَٰنَ وَأَيُّوبَ وَيُوسُفَ وَمُوس۪ىٰ وَهَٰرُونَۖ وَكَذَٰلِكَ نَجْزِے اِ۬لْمُحْسِنِينَۖ","وَزَكَرِيَّآءَ وَيَحْي۪ىٰ وَعِيس۪ىٰ وَإِلْيَاسَۖ كُلّٞ مِّنَ اَ۬لصَّٰلِحِينَۖ","وَإِسْمَٰعِيلَ وَالْيَسَعَ وَيُونُسَ وَلُوطاٗۖ وَكُلّاٗ فَضَّلْنَا عَلَى اَ۬لْعَٰلَمِينَۖ","وَمِنَ اٰبَآئِهِمْ وَذُرِّيَّٰتِهِمْ وَإِخْوَٰنِهِمْۖ وَاجْتَبَيْنَٰهُمْ وَهَدَيْنَٰهُمُۥٓ إِلَىٰ صِرَٰطٖ مُّسْتَقِيمٖۖ","ذَٰلِكَ هُدَى اَ۬للَّهِ يَهْدِے بِهِۦ مَنْ يَّشَآءُ مِنْ عِبَادِهِۦۖ وَلَوَ اَشْرَكُواْ لَحَبِطَ عَنْهُم مَّا كَانُواْ يَعْمَلُونَۖ","أُوْلَٰٓئِكَ اَ۬لذِينَ ءَاتَيْنَٰهُمُ اُ۬لْكِتَٰبَ وَالْحُكْمَ وَالنُّبُوٓءَةَۖ فَإِنْ يَّكْفُرْ بِهَا هَٰٓؤُلَآءِ فَقَدْ وَكَّلْنَا بِهَا قَوْماٗ لَّيْسُواْ بِهَا بِكٰ۪فِرِينَۖ","أُوْلَٰٓئِكَ اَ۬لذِينَ هَدَى اَ۬للَّهُ فَبِهُد۪يٰهُمُ اُ۪قْتَدِهْۖ قُل لَّآ أَسْـَٔلُكُمْ عَلَيْهِ أَجْراًۖ اِنْ هُوَ إِلَّا ذِكْر۪ىٰ لِلْعَٰلَمِينَۖ","۞ وَمَا قَدَرُواْ اُ۬للَّهَ حَقَّ قَدْرِهِۦٓ إِذْ قَالُواْ مَآ أَنزَلَ اَ۬للَّهُ عَلَىٰ بَشَرٖ مِّن شَےْءٖۖ قُلْ مَنَ اَنزَلَ اَ۬لْكِتَٰبَ اَ۬لذِے جَآءَ بِهِۦ مُوس۪ىٰ نُوراٗ وَهُدىٗ لِّلنَّاسِۖ تَجْعَلُونَهُۥ قَرَاطِيسَ تُبْدُونَهَا وَتُخْفُونَ كَثِيراٗۖ وَعُلِّمْتُم مَّا لَمْ تَعْلَمُوٓاْ أَنتُمْ وَلَآ ءَابَآؤُكُمْ قُلِ اِ۬للَّهُۖ ثُمَّ ذَرْهُمْ فِے خَوْضِهِمْ يَلْعَبُونَۖ","وَهَٰذَا كِتَٰبٌ اَنزَلْنَٰهُ مُبَٰرَكٞ مُّصَدِّقُ اُ۬لذِے بَيْنَ يَدَيْهِ وَلِتُنذِرَ أُمَّ اَ۬لْقُر۪ىٰ وَمَنْ حَوْلَهَاۖ وَالذِينَ يُومِنُونَ بِالَاخِرَةِ يُومِنُونَ بِهِۦ وَهُمْ عَلَىٰ صَلَاتِهِمْ يُحَافِظُونَۖ","وَمَنَ اَظْلَمُ مِمَّنِ اِ۪فْتَر۪ىٰ عَلَى اَ۬للَّهِ كَذِباً اَوْ قَالَ أُوحِيَ إِلَيَّ وَلَمْ يُوحَ إِلَيْهِ شَےْءٞ وَمَن قَالَ سَأُنزِلُ مِثْلَ مَآ أَنزَلَ اَ۬للَّهُۖ وَلَوْ تَر۪ىٰٓ إِذِ اِ۬لظَّٰلِمُونَ فِے غَمَرَٰتِ اِ۬لْمَوْتِ وَالْمَلَٰٓئِكَةُ بَاسِطُوٓاْ أَيْدِيهِمُۥٓ أَخْرِجُوٓاْ أَنفُسَكُمُۖ اُ۬لْيَوْمَ تُجْزَوْنَ عَذَابَ اَ۬لْهُونِ بِمَا كُنتُمْ تَقُولُونَ عَلَى اَ۬للَّهِ غَيْرَ اَ۬لْحَقِّ وَكُنتُمْ عَنَ اٰيَٰتِهِۦ تَسْتَكْبِرُونَۖ","وَلَقَدْ جِئْتُمُونَا فُرَٰد۪ىٰ كَمَا خَلَقْنَٰكُمُۥٓ أَوَّلَ مَرَّةٖ وَتَرَكْتُم مَّا خَوَّلْنَٰكُمْ وَرَآءَ ظُهُورِكُمْۖ وَمَا نَر۪ىٰ مَعَكُمْ شُفَعَآءَكُمُ اُ۬لذِينَ زَعَمْتُمُۥٓ أَنَّهُمْ فِيكُمْ شُرَكَٰٓؤُاْۖ لَقَد تَّقَطَّعَ بَيْنَكُمْ وَضَلَّ عَنكُم مَّا كُنتُمْ تَزْعُمُونَۖ","۞ إِنَّ اَ۬للَّهَ فَٰلِقُ اُ۬لْحَبِّ وَالنَّو۪ىٰۖ يُخْرِجُ اُ۬لْحَيَّ مِنَ اَ۬لْمَيِّتِ وَمُخْرِجُ اُ۬لْمَيِّتِ مِنَ اَ۬لْحَيِّۖ ذَٰلِكُمُ اُ۬للَّهُۖ فَأَنّ۪ىٰ تُوفَكُونَۖ","فَالِقُ اُ۬لِاصْبَاحِ وَجَٰعِلُ اُ۬ليْلِ سَكَناٗۖ وَالشَّمْسَ وَالْقَمَرَ حُسْبَٰناٗۖ ذَٰلِكَ تَقْدِيرُ اُ۬لْعَزِيزِ اِ۬لْعَلِيمِۖ","وَهُوَ اَ۬لذِے جَعَلَ لَكُمُ اُ۬لنُّجُومَ لِتَهْتَدُواْ بِهَا فِے ظُلُمَٰتِ اِ۬لْبَرِّ وَالْبَحْرِۖ قَدْ فَصَّلْنَا اَ۬لَايَٰتِ لِقَوْمٖ يَعْلَمُونَۖ","وَهُوَ اَ۬لذِےٓ أَنشَأَكُم مِّن نَّفْسٖ وَٰحِدَةٖ فَمُسْتَقَرّٞ وَمُسْتَوْدَعٞۖ قَدْ فَصَّلْنَا اَ۬لَايَٰتِ لِقَوْمٖ يَفْقَهُونَۖ","وَهُوَ اَ۬لذِےٓ أَنزَلَ مِنَ اَ۬لسَّمَآءِ مَآءٗ فَأَخْرَجْنَا بِهِۦ نَبَاتَ كُلِّ شَےْءٖ فَأَخْرَجْنَا مِنْهُ خَضِراٗ نُّخْرِجُ مِنْهُ حَبّاٗ مُّتَرَاكِباٗ وَمِنَ اَ۬لنَّخْلِ مِن طَلْعِهَا قِنْوَانٞ دَانِيَةٞ وَجَنَّٰتٖ مِّنَ اَعْنَٰبٖ وَالزَّيْتُونَ وَالرُّمَّانَ مُشْتَبِهاٗ وَغَيْرَ مُتَشَٰبِهٍۖ اُ۟نظُرُوٓاْ إِلَىٰ ثَمَرِهِۦٓ إِذَآ أَثْمَرَ وَيَنْعِهِۦٓۖ إِنَّ فِے ذَٰلِكُمْ لَأٓيَٰتٖ لِّقَوْمٖ يُومِنُونَۖ","وَجَعَلُواْ لِلهِ شُرَكَآءَ اَ۬لْجِنَّ وَخَلَقَهُمْۖ وَخَرَّقُواْ لَهُۥ بَنِينَ وَبَنَٰتِۢ بِغَيْرِ عِلْمٖۖ سُبْحَٰنَهُۥ وَتَعَٰل۪ىٰ عَمَّا يَصِفُونَۖ","بَدِيعُ اُ۬لسَّمَٰوَٰتِ وَالَارْضِۖ أَنّ۪ىٰ يَكُونُ لَهُۥ وَلَدٞ وَلَمْ تَكُن لَّهُۥ صَٰحِبَةٞۖ وَخَلَقَ كُلَّ شَےْءٖۖ وَهُوَ بِكُلِّ شَےْءٍ عَلِيمٞۖ","ذَٰلِكُمُ اُ۬للَّهُ رَبُّكُمْۖ لَآ إِلَٰهَ إِلَّا هُوَۖ خَٰلِقُ كُلِّ شَےْءٖۖ فَاعْبُدُوهُۖ وَهُوَ عَلَىٰ كُلِّ شَےْءٖ وَكِيلٞۖ","۞ لَّا تُدْرِكُهُ اُ۬لَابْصَٰرُۖ وَهُوَ يُدْرِكُ اُ۬لَابْصَٰرَۖ وَهُوَ اَ۬للَّطِيفُ اُ۬لْخَبِيرُۖ","قَدْ جَآءَكُم بَصَآئِرُ مِن رَّبِّكُمْۖ فَمَنَ اَبْصَرَ فَلِنَفْسِهِۦ وَمَنْ عَمِيَ فَعَلَيْهَاۖ وَمَآ أَنَا عَلَيْكُم بِحَفِيظٖۖ","وَكَذَٰلِكَ نُصَرِّفُ اُ۬لَايَٰتِ وَلِيَقُولُواْ دَرَسْتَ وَلِنُبَيِّنَهُۥ لِقَوْمٖ يَعْلَمُونَۖ","اَ۪تَّبِعْ مَآ أُوحِيَ إِلَيْكَ مِن رَّبِّكَۖ لَآ إِلَٰهَ إِلَّا هُوَۖ وَأَعْرِضْ عَنِ اِ۬لْمُشْرِكِينَۖ","وَلَوْ شَآءَ اَ۬للَّهُ مَآ أَشْرَكُواْۖ وَمَا جَعَلْنَٰكَ عَلَيْهِمْ حَفِيظاٗۖ وَمَآ أَنتَ عَلَيْهِم بِوَكِيلٖۖ","وَلَا تَسُبُّواْ اُ۬لذِينَ يَدْعُونَ مِن دُونِ اِ۬للَّهِ فَيَسُبُّواْ اُ۬للَّهَ عَدْواَۢ بِغَيْرِ عِلْمٖۖ كَذَٰلِكَ زَيَّنَّا لِكُلِّ أُمَّةٍ عَمَلَهُمْۖ ثُمَّ إِلَىٰ رَبِّهِم مَّرْجِعُهُمْ فَيُنَبِّئُهُم بِمَا كَانُواْ يَعْمَلُونَۖ","وَأَقْسَمُواْ بِاللَّهِ جَهْدَ أَيْمَٰنِهِمْ لَئِن جَآءَتْهُمُۥٓ ءَايَةٞ لَّيُومِنُنَّ بِهَاۖ قُلِ اِنَّمَا اَ۬لَايَٰتُ عِندَ اَ۬للَّهِۖ وَمَا يُشْعِرُكُمُۥٓۖ أَنَّهَآ إِذَا جَآءَتْ لَا يُومِنُونَۖ","وَنُقَلِّبُ أَفْـِٕدَتَهُمْ وَأَبْصَٰرَهُمْ كَمَا لَمْ يُومِنُواْ بِهِۦٓ أَوَّلَ مَرَّةٖ وَنَذَرُهُمْ فِے طُغْيَٰنِهِمْ يَعْمَهُونَۖ","۞ وَلَوَ اَنَّنَا نَزَّلْنَآ إِلَيْهِمُ اُ۬لْمَلَٰٓئِكَةَ وَكَلَّمَهُمُ اُ۬لْمَوْت۪ىٰ وَحَشَرْنَا عَلَيْهِمْ كُلَّ شَےْءٖ قِبَلاٗ مَّا كَانُواْ لِيُومِنُوٓاْ إِلَّآ أَنْ يَّشَآءَ اَ۬للَّهُۖ وَلَٰكِنَّ أَكْثَرَهُمْ يَجْهَلُونَۖ","وَكَذَٰلِكَ جَعَلْنَا لِكُلِّ نَبِےٓءٍ عَدُوّاٗ شَيَٰطِينَ اَ۬لِانسِ وَالْجِنِّ يُوحِے بَعْضُهُمُۥٓ إِلَىٰ بَعْضٖ زُخْرُفَ اَ۬لْقَوْلِ غُرُوراٗۖ وَلَوْ شَآءَ رَبُّكَ مَا فَعَلُوهُۖ فَذَرْهُمْ وَمَا يَفْتَرُونَۖ","وَلِتَصْغ۪ىٰٓ إِلَيْهِ أَفْـِٕدَةُ اُ۬لذِينَ لَا يُومِنُونَ بِالَاخِرَةِ وَلِيَرْضَوْهُ وَلِيَقْتَرِفُواْ مَا هُم مُّقْتَرِفُونَۖ","أَفَغَيْرَ اَ۬للَّهِ أَبْتَغِے حَكَماٗ وَهُوَ اَ۬لذِےٓ أَنزَلَ إِلَيْكُمُ اُ۬لْكِتَٰبَ مُفَصَّلاٗۖ وَالذِينَ ءَاتَيْنَٰهُمُ اُ۬لْكِتَٰبَ يَعْلَمُونَ أَنَّهُۥ مُنزَلٞ مِّن رَّبِّكَ بِالْحَقِّۖ فَلَا تَكُونَنَّ مِنَ اَ۬لْمُمْتَرِينَۖ","وَتَمَّتْ كَلِمَٰتُ رَبِّكَ صِدْقاٗ وَعَدْلاٗۖ لَّا مُبَدِّلَ لِكَلِمَٰتِهِۦۖ وَهُوَ اَ۬لسَّمِيعُ اُ۬لْعَلِيمُۖ","وَإِن تُطِعَ اَكْثَرَ مَن فِے اِ۬لَارْضِ يُضِلُّوكَ عَن سَبِيلِ اِ۬للَّهِۖ إِنْ يَّتَّبِعُونَ إِلَّا اَ۬لظَّنَّۖ وَإِنْ هُمُۥٓ إِلَّا يَخْرُصُونَۖ","إِنَّ رَبَّكَ هُوَ أَعْلَمُ مَنْ يَّضِلُّ عَن سَبِيلِهِۦۖ وَهُوَ أَعْلَمُ بِالْمُهْتَدِينَۖ","فَكُلُواْ مِمَّا ذُكِرَ اَ۪سْمُ اُ۬للَّهِ عَلَيْهِ إِن كُنتُم بِـَٔايَٰتِهِۦ مُومِنِينَۖ","وَمَا لَكُمُۥٓ أَلَّا تَاكُلُواْ مِمَّا ذُكِرَ اَ۪سْمُ اُ۬للَّهِ عَلَيْهِ وَقَدْ فَصَّلَ لَكُم مَّا حَرَّمَ عَلَيْكُمُۥٓ إِلَّا مَا اَ۟ضْطُرِرْتُمُۥٓ إِلَيْهِۖ وَإِنَّ كَثِيراٗ لَّيَضِلُّونَ بِأَهْوَآئِهِم بِغَيْرِ عِلْمٍۖ اِنَّ رَبَّكَ هُوَ أَعْلَمُ بِالْمُعْتَدِينَۖ","۞ وَذَرُواْ ظَٰهِرَ اَ۬لِاثْمِ وَبَاطِنَهُۥٓۖ إِنَّ اَ۬لذِينَ يَكْسِبُونَ اَ۬لِاثْمَ سَيُجْزَوْنَ بِمَا كَانُواْ يَقْتَرِفُونَۖ","وَلَا تَاكُلُواْ مِمَّا لَمْ يُذْكَرِ اِ۪سْمُ اُ۬للَّهِ عَلَيْهِ وَإِنَّهُۥ لَفِسْقٞۖ وَإِنَّ اَ۬لشَّيَٰطِينَ لَيُوحُونَ إِلَىٰٓ أَوْلِيَآئِهِمْ لِيُجَٰدِلُوكُمْۖ وَإِنَ اَطَعْتُمُوهُمُۥٓ إِنَّكُمْ لَمُشْرِكُونَۖ","أَوَمَن كَانَ مَيِّتاٗ فَأَحْيَيْنَٰهُ وَجَعَلْنَا لَهُۥ نُوراٗ يَمْشِے بِهِۦ فِے اِ۬لنَّاسِ كَمَن مَّثَلُهُۥ فِے اِ۬لظُّلُمَٰتِ لَيْسَ بِخَارِجٖ مِّنْهَاۖ كَذَٰلِكَ زُيِّنَ لِلْكٰ۪فِرِينَ مَا كَانُواْ يَعْمَلُونَۖ","وَكَذَٰلِكَ جَعَلْنَا فِے كُلِّ قَرْيَةٍ اَكَٰبِرَ مُجْرِمِيهَا لِيَمْكُرُواْ فِيهَاۖ وَمَا يَمْكُرُونَ إِلَّا بِأَنفُسِهِمْ وَمَا يَشْعُرُونَۖ","وَإِذَا جَآءَتْهُمُۥٓ ءَايَةٞ قَالُواْ لَن نُّومِنَ حَتَّىٰ نُوت۪ىٰ مِثْلَ مَآ أُوتِيَ رُسُلُ اُ۬للَّهِۖ اِ۬للَّهُ أَعْلَمُ حَيْثُ يَجْعَلُ رِسَٰلَٰتِهِۦۖ سَيُصِيبُ اُ۬لذِينَ أَجْرَمُواْ صَغَارٌ عِندَ اَ۬للَّهِ وَعَذَابٞ شَدِيدُۢ بِمَا كَانُواْ يَمْكُرُونَۖ","فَمَنْ يُّرِدِ اِ۬للَّهُ أَنْ يَّهْدِيَهُۥ يَشْرَحْ صَدْرَهُۥ لِلِاسْلَٰمِۖ وَمَنْ يُّرِدَ اَنْ يُّضِلَّهُۥ يَجْعَلْ صَدْرَهُۥ ضَيِّقاً حَرِجاٗ كَأَنَّمَا يَصَّعَّدُ فِے اِ۬لسَّمَآءِۖ كَذَٰلِكَ يَجْعَلُ اُ۬للَّهُ اُ۬لرِّجْسَ عَلَى اَ۬لذِينَ لَا يُومِنُونَۖ","وَهَٰذَا صِرَٰطُ رَبِّكَ مُسْتَقِيماٗۖ قَدْ فَصَّلْنَا اَ۬لَايَٰتِ لِقَوْمٖ يَذَّكَّرُونَۖ","۞ لَهُمْ دَارُ اُ۬لسَّلَٰمِ عِندَ رَبِّهِمْۖ وَهُوَ وَلِيُّهُم بِمَا كَانُواْ يَعْمَلُونَۖ","وَيَوْمَ نَحْشُرُهُمْ جَمِيعاٗ يَٰمَعْشَرَ اَ۬لْجِنِّ قَدِ اِ۪سْتَكْثَرْتُم مِّنَ اَ۬لِانسِۖ وَقَالَ أَوْلِيَآؤُهُم مِّنَ اَ۬لِانسِ رَبَّنَا اَ۪سْتَمْتَعَ بَعْضُنَا بِبَعْضٖ وَبَلَغْنَآ أَجَلَنَا اَ۬لذِےٓ أَجَّلْتَ لَنَاۖ قَالَ اَ۬لنَّارُ مَثْو۪يٰكُمْ خَٰلِدِينَ فِيهَآ إِلَّا مَا شَآءَ اَ۬للَّهُۖ إِنَّ رَبَّكَ حَكِيمٌ عَلِيمٞۖ","وَكَذَٰلِكَ نُوَلِّے بَعْضَ اَ۬لظَّٰلِمِينَ بَعْضاَۢ بِمَا كَانُواْ يَكْسِبُونَۖ","يَٰمَعْشَرَ اَ۬لْجِنِّ وَالِانسِ أَلَمْ يَاتِكُمْ رُسُلٞ مِّنكُمْ يَقُصُّونَ عَلَيْكُمُۥٓ ءَايَٰتِے وَيُنذِرُونَكُمْ لِقَآءَ يَوْمِكُمْ هَٰذَاۖ قَالُواْ شَهِدْنَا عَلَىٰٓ أَنفُسِنَاۖ وَغَرَّتْهُمُ اُ۬لْحَيَوٰةُ اُ۬لدُّنْي۪ا وَشَهِدُواْ عَلَىٰٓ أَنفُسِهِمُۥٓ أَنَّهُمْ كَانُواْ كٰ۪فِرِينَۖ","ذَٰلِكَ أَن لَّمْ يَكُن رَّبُّكَ مُهْلِكَ اَ۬لْقُر۪ىٰ بِظُلْمٖ وَأَهْلُهَا غَٰفِلُونَۖ","وَلِكُلّٖ دَرَجَٰتٞ مِّمَّا عَمِلُواْۖ وَمَا رَبُّكَ بِغَٰفِلٍ عَمَّا يَعْمَلُونَۖ","وَرَبُّكَ اَ۬لْغَنِيُّ ذُو اُ۬لرَّحْمَةِۖ إِنْ يَّشَأْ يُذْهِبْكُمْ وَيَسْتَخْلِفْ مِنۢ بَعْدِكُم مَّا يَشَآءُ كَمَآ أَنشَأَكُم مِّن ذُرِّيَّةِ قَوْمٍ اٰخَرِينَۖ","إِنَّ مَا تُوعَدُونَ لَأٓتٖۖ وَمَآ أَنتُم بِمُعْجِزِينَۖ","۞ قُلْ يَٰقَوْمِ اِ۪عْمَلُواْ عَلَىٰ مَكَانَتِكُمُۥٓ إِنِّے عَامِلٞۖ فَسَوْفَ تَعْلَمُونَ مَن تَكُونُ لَهُۥ عَٰقِبَةُ اُ۬لدّ۪ارِۖ إِنَّهُۥ لَا يُفْلِحُ اُ۬لظَّٰلِمُونَۖ","وَجَعَلُواْ لِلهِ مِمَّا ذَرَأَ مِنَ اَ۬لْحَرْثِ وَالَانْعَٰمِ نَصِيباٗ فَقَالُواْ هَٰذَا لِلهِ بِزَعْمِهِمْ وَهَٰذَا لِشُرَكَآئِنَاۖ فَمَا كَانَ لِشُرَكَآئِهِمْ فَلَا يَصِلُ إِلَى اَ۬للَّهِۖ وَمَا كَانَ لِلهِ فَهُوَ يَصِلُ إِلَىٰ شُرَكَآئِهِمْۖ سَآءَ مَا يَحْكُمُونَۖ","وَكَذَٰلِكَ زَيَّنَ لِكَثِيرٖ مِّنَ اَ۬لْمُشْرِكِينَ قَتْلَ أَوْلَٰدِهِمْ شُرَكَآؤُهُمْ لِيُرْدُوهُمْ وَلِيَلْبِسُواْ عَلَيْهِمْ دِينَهُمْۖ وَلَوْ شَآءَ اَ۬للَّهُ مَا فَعَلُوهُۖ فَذَرْهُمْ وَمَا يَفْتَرُونَۖ","وَقَالُواْ هَٰذِهِۦٓ أَنْعَٰمٞ وَحَرْثٌ حِجْرٞ لَّا يَطْعَمُهَآ إِلَّا مَن نَّشَآءُ بِزَعْمِهِمْ وَأَنْعَٰمٌ حُرِّمَت ظُّهُورُهَا وَأَنْعَٰمٞ لَّا يَذْكُرُونَ اَ۪سْمَ اَ۬للَّهِ عَلَيْهَا اَ۪فْتِرَآءً عَلَيْهِۖ سَيَجْزِيهِم بِمَا كَانُواْ يَفْتَرُونَۖ","وَقَالُواْ مَا فِے بُطُونِ هَٰذِهِ اِ۬لَانْعَٰمِ خَالِصَةٞ لِّذُكُورِنَا وَمُحَرَّمٌ عَلَىٰٓ أَزْوَٰجِنَاۖ وَإِنْ يَّكُن مَّيْتَةٗ فَهُمْ فِيهِ شُرَكَآءُۖ سَيَجْزِيهِمْ وَصْفَهُمُۥٓۖ إِنَّهُۥ حَكِيمٌ عَلِيمٞۖ","۞ قَدْ خَسِرَ اَ۬لذِينَ قَتَلُوٓاْ أَوْلَٰدَهُمْ سَفَهاَۢ بِغَيْرِ عِلْمٖ وَحَرَّمُواْ مَا رَزَقَهُمُ اُ۬للَّهُ اُ۪فْتِرَآءً عَلَى اَ۬للَّهِۖ قَد ضَّلُّواْ وَمَا كَانُواْ مُهْتَدِينَۖ","وَهُوَ اَ۬لذِےٓ أَنشَأَ جَنَّٰتٖ مَّعْرُوشَٰتٖ وَغَيْرَ مَعْرُوشَٰتٖ وَالنَّخْلَ وَالزَّرْعَ مُخْتَلِفاً ا۟كْلُهُۥ وَالزَّيْتُونَ وَالرُّمَّانَ مُتَشَٰبِهاٗ وَغَيْرَ مُتَشَٰبِهٖۖ كُلُواْ مِن ثَمَرِهِۦٓ إِذَآ أَثْمَرَ وَءَاتُواْ حَقَّهُۥ يَوْمَ حِصَادِهِۦۖ وَلَا تُسْرِفُوٓاْۖ إِنَّهُۥ لَا يُحِبُّ اُ۬لْمُسْرِفِينَۖ","وَمِنَ اَ۬لَانْعَٰمِ حَمُولَةٗ وَفَرْشاٗۖ كُلُواْ مِمَّا رَزَقَكُمُ اُ۬للَّهُۖ وَلَا تَتَّبِعُواْ خُطْوَٰتِ اِ۬لشَّيْطَٰنِۖ إِنَّهُۥ لَكُمْ عَدُوّٞ مُّبِينٞۖ","ثَمَٰنِيَةَ أَزْوَٰجٖۖ مِّنَ اَ۬لضَّأْنِ اِ۪ثْنَيْنِ وَمِنَ اَ۬لْمَعْزِ اِ۪ثْنَيْنِۖ قُلَ آٰلذَّكَرَيْنِ حَرَّمَ أَمِ اِ۬لُانثَيَيْنِ أَمَّا اَ۪شْتَمَلَتْ عَلَيْهِ أَرْحَامُ اُ۬لُانثَيَيْنِۖ نَبِّـُٔونِے بِعِلْمٍ اِن كُنتُمْ صَٰدِقِينَۖ","وَمِنَ اَ۬لِابِلِ اِ۪ثْنَيْنِ وَمِنَ اَ۬لْبَقَرِ اِ۪ثْنَيْنِۖ قُلَ آٰلذَّكَرَيْنِ حَرَّمَ أَمِ اِ۬لُانثَيَيْنِ أَمَّا اَ۪شْتَمَلَتْ عَلَيْهِ أَرْحَامُ اُ۬لُانثَيَيْنِۖ أَمْ كُنتُمْ شُهَدَآءَ ا۪ذْ وَصّ۪يٰكُمُ اُ۬للَّهُ بِهَٰذَاۖ فَمَنَ اَظْلَمُ مِمَّنِ اِ۪فْتَر۪ىٰ عَلَى اَ۬للَّهِ كَذِباٗ لِّيُضِلَّ اَ۬لنَّاسَ بِغَيْرِ عِلْمٍۖ اِنَّ اَ۬للَّهَ لَا يَهْدِے اِ۬لْقَوْمَ اَ۬لظَّٰلِمِينَۖ","۞ قُل لَّآ أَجِدُ فِے مَآ أُوحِيَ إِلَيَّ مُحَرَّماً عَلَىٰ طَاعِمٖ يَطْعَمُهُۥٓ إِلَّآ أَنْ يَّكُونَ مَيْتَةً اَوْ دَماٗ مَّسْفُوحاً اَوْ لَحْمَ خِنزِيرٖ فَإِنَّهُۥ رِجْسٌۖ اَوْ فِسْقاً ا۟هِلَّ لِغَيْرِ اِ۬للَّهِ بِهِۦۖ فَمَنُ اُ۟ضْطُرَّ غَيْرَ بَاغٖ وَلَا عَادٖ فَإِنَّ رَبَّكَ غَفُورٞ رَّحِيمٞۖ","وَعَلَى اَ۬لذِينَ هَادُواْ حَرَّمْنَا كُلَّ ذِے ظُفُرٖ وَمِنَ اَ۬لْبَقَرِ وَالْغَنَمِۖ حَرَّمْنَا عَلَيْهِمْ شُحُومَهُمَآ إِلَّا مَا حَمَلَت ظُّهُورُهُمَآ أَوِ اِ۬لْحَوَاي۪آ أَوْ مَا اَ۪خْتَلَطَ بِعَظْمٖۖ ذَٰلِكَ جَزَيْنَٰهُم بِبَغْيِهِمْۖ وَإِنَّا لَصَٰدِقُونَۖ","فَإِن كَذَّبُوكَ فَقُل رَّبُّكُمْ ذُو رَحْمَةٖ وَٰسِعَةٖۖ وَلَا يُرَدُّ بَأْسُهُۥ عَنِ اِ۬لْقَوْمِ اِ۬لْمُجْرِمِينَۖ","سَيَقُولُ اُ۬لذِينَ أَشْرَكُواْ لَوْ شَآءَ اَ۬للَّهُ مَآ أَشْرَكْنَا وَلَآ ءَابَآؤُنَا وَلَا حَرَّمْنَا مِن شَےْءٖۖ كَذَٰلِكَ كَذَّبَ اَ۬لذِينَ مِن قَبْلِهِمْ حَتَّىٰ ذَاقُواْ بَأْسَنَاۖ قُلْ هَلْ عِندَكُم مِّنْ عِلْمٖ فَتُخْرِجُوهُ لَنَآۖ إِن تَتَّبِعُونَ إِلَّا اَ۬لظَّنَّۖ وَإِنَ اَنتُمُۥٓ إِلَّا تَخْرُصُونَۖ","قُلْ فَلِلهِ اِ۬لْحُجَّةُ اُ۬لْبَٰلِغَةُۖ فَلَوْ شَآءَ لَهَد۪يٰكُمُۥٓ أَجْمَعِينَۖ","قُلْ هَلُمَّ شُهَدَآءَكُمُ اُ۬لذِينَ يَشْهَدُونَ أَنَّ اَ۬للَّهَ حَرَّمَ هَٰذَاۖ فَإِن شَهِدُواْ فَلَا تَشْهَدْ مَعَهُمْۖ وَلَا تَتَّبِعَ اَهْوَآءَ اَ۬لذِينَ كَذَّبُواْ بِـَٔايَٰتِنَا وَالذِينَ لَا يُومِنُونَ بِالَاخِرَةِ وَهُم بِرَبِّهِمْ يَعْدِلُونَۖ","۞ قُلْ تَعَالَوَاْ اَتْلُ مَا حَرَّمَ رَبُّكُمْ عَلَيْكُمُۥٓ أَلَّا تُشْرِكُواْ بِهِۦ شَئْاٗۖ وَبِالْوَٰلِدَيْنِ إِحْسَٰناٗۖ وَلَا تَقْتُلُوٓاْ أَوْلَٰدَكُم مِّنِ اِمْلَٰقٖۖ نَّحْنُ نَرْزُقُكُمْ وَإِيَّاهُمْۖ وَلَا تَقْرَبُواْ اُ۬لْفَوَٰحِشَ مَا ظَهَرَ مِنْهَا وَمَا بَطَنَۖ وَلَا تَقْتُلُواْ اُ۬لنَّفْسَ اَ۬لتِے حَرَّمَ اَ۬للَّهُ إِلَّا بِالْحَقِّۖ ذَٰلِكُمْ وَصّ۪يٰكُم بِهِۦ لَعَلَّكُمْ تَعْقِلُونَۖ","وَلَا تَقْرَبُواْ مَالَ اَ۬لْيَتِيمِ إِلَّا بِالتِے هِيَ أَحْسَنُ حَتَّىٰ يَبْلُغَ أَشُدَّهُۥۖ وَأَوْفُواْ اُ۬لْكَيْلَ وَالْمِيزَانَ بِالْقِسْطِۖ لَا نُكَلِّفُ نَفْساً اِلَّا وُسْعَهَاۖ وَإِذَا قُلْتُمْ فَاعْدِلُواْ وَلَوْ كَانَ ذَا قُرْب۪ىٰۖ وَبِعَهْدِ اِ۬للَّهِ أَوْفُواْۖ ذَٰلِكُمْ وَصّ۪يٰكُم بِهِۦ لَعَلَّكُمْ تَذَّكَّرُونَۖ","وَأَنَّ هَٰذَا صِرَٰطِے مُسْتَقِيماٗ فَاتَّبِعُوهُۖ وَلَا تَتَّبِعُواْ اُ۬لسُّبُلَ فَتَفَرَّقَ بِكُمْ عَن سَبِيلِهِۦۖ ذَٰلِكُمْ وَصّ۪يٰكُم بِهِۦ لَعَلَّكُمْ تَتَّقُونَۖ","ثُمَّ ءَاتَيْنَا مُوسَى اَ۬لْكِتَٰبَ تَمَاماً عَلَى اَ۬لذِےٓ أَحْسَنَ وَتَفْصِيلاٗ لِّكُلِّ شَےْءٖ وَهُدىٗ وَرَحْمَةٗ لَّعَلَّهُم بِلِقَآءِ رَبِّهِمْ يُومِنُونَۖ","وَهَٰذَا كِتَٰبٌ اَنزَلْنَٰهُ مُبَٰرَكٞ فَاتَّبِعُوهُ وَاتَّقُواْ لَعَلَّكُمْ تُرْحَمُونَ","أَن تَقُولُوٓاْ إِنَّمَآ أُنزِلَ اَ۬لْكِتَٰبُ عَلَىٰ طَآئِفَتَيْنِ مِن قَبْلِنَا وَإِن كُنَّا عَن دِرَاسَتِهِمْ لَغَٰفِلِينَ","أَوْ تَقُولُواْ لَوَ اَنَّآ أُنزِلَ عَلَيْنَا اَ۬لْكِتَٰبُ لَكُنَّآ أَهْد۪ىٰ مِنْهُمْۖ فَقَدْ جَآءَكُم بَيِّنَةٞ مِّن رَّبِّكُمْ وَهُدىٗ وَرَحْمَةٞۖ فَمَنَ اَظْلَمُ مِمَّن كَذَّبَ بِـَٔايَٰتِ اِ۬للَّهِ وَصَدَفَ عَنْهَاۖ سَنَجْزِے اِ۬لذِينَ يَصْدِفُونَ عَنَ اٰيَٰتِنَا سُوٓءَ اَ۬لْعَذَابِ بِمَا كَانُواْ يَصْدِفُونَۖ","۞ هَلْ يَنظُرُونَ إِلَّآ أَن تَاتِيَهُمُ اُ۬لْمَلَٰٓئِكَةُ أَوْ يَاتِيَ رَبُّكَ أَوْ يَاتِيَ بَعْضُ ءَايَٰتِ رَبِّكَۖ يَوْمَ يَاتِے بَعْضُ ءَايَٰتِ رَبِّكَ لَا يَنفَعُ نَفْساً اِيمَٰنُهَا لَمْ تَكُنَ اٰمَنَتْ مِن قَبْلُ أَوْ كَسَبَتْ فِےٓ إِيمَٰنِهَا خَيْراٗۖ قُلِ اِ۪نتَظِرُوٓاْۖ إِنَّا مُنتَظِرُونَۖ","إِنَّ اَ۬لذِينَ فَرَّقُواْ دِينَهُمْ وَكَانُواْ شِيَعاٗ لَّسْتَ مِنْهُمْ فِے شَےْءٍۖ اِنَّمَآ أَمْرُهُمُۥٓ إِلَى اَ۬للَّهِۖ ثُمَّ يُنَبِّئُهُم بِمَا كَانُواْ يَفْعَلُونَۖ","مَن جَآءَ بِالْحَسَنَةِ فَلَهُۥ عَشْرُ أَمْثَالِهَاۖ وَمَن جَآءَ بِالسَّيِّئَةِ فَلَا يُجْز۪ىٰٓ إِلَّا مِثْلَهَا وَهُمْ لَا يُظْلَمُونَۖ","قُلِ اِنَّنِے هَد۪يٰنِے رَبِّيَ إِلَىٰ صِرَٰطٖ مُّسْتَقِيمٖۖ","دِيناٗ قَيِّماٗ مِّلَّةَ إِبْرَٰهِيمَ حَنِيفاٗۖ وَمَا كَانَ مِنَ اَ۬لْمُشْرِكِينَۖ","قُلِ اِنَّ صَلَاتِے وَنُسُكِے وَمَحْي۪آےْ وَمَمَاتِيَ لِلهِ رَبِّ اِ۬لْعَٰلَمِينَ","لَا شَرِيكَ لَهُۥۖ وَبِذَٰلِكَ أُمِرْتُۖ وَأَنَآ أَوَّلُ اُ۬لْمُسْلِمِينَۖ","قُلَ اَغَيْرَ اَ۬للَّهِ أَبْغِے رَبّاٗ وَهُوَ رَبُّ كُلِّ شَےْءٖۖ وَلَا تَكْسِبُ كُلُّ نَفْسٍ اِلَّا عَلَيْهَاۖ وَلَا تَزِرُ وَازِرَةٞ وِزْرَ أُخْر۪ىٰۖ ثُمَّ إِلَىٰ رَبِّكُم مَّرْجِعُكُمْ فَيُنَبِّئُكُم بِمَا كُنتُمْ فِيهِ تَخْتَلِفُونَۖ","وَهُوَ اَ۬لذِے جَعَلَكُمْ خَلَٰٓئِفَ اَ۬لَارْضِ وَرَفَعَ بَعْضَكُمْ فَوْقَ بَعْضٖ دَرَجَٰتٖ لِّيَبْلُوَكُمْ فِے مَآ ءَات۪يٰكُمُۥٓۖ إِنَّ رَبَّكَ سَرِيعُ اُ۬لْعِقَابِۖ وَإِنَّهُۥ لَغَفُورٞ رَّحِيمٌۖ"]],["الأعراف",["اَلَٓمِّٓصَٓۖ كِتَٰبٌ اُنزِلَ إِلَيْكَ فَلَا يَكُن فِے صَدْرِكَ حَرَجٞ مِّنْهُ لِتُنذِرَ بِهِۦ وَذِكْر۪ىٰ لِلْمُومِنِينَۖ","اَ۪تَّبِعُواْ مَآ أُنزِلَ إِلَيْكُم مِّن رَّبِّكُمْۖ وَلَا تَتَّبِعُواْ مِن دُونِهِۦٓ أَوْلِيَآءَۖ قَلِيلاٗ مَّا تَذَّكَّرُونَۖ","وَكَم مِّن قَرْيَةٍ اَهْلَكْنَٰهَا فَجَآءَهَا بَأْسُنَا بَيَٰتاً اَوْ هُمْ قَآئِلُونَۖ","۞ فَمَا كَانَ دَعْو۪يٰهُمُۥٓ إِذْ جَآءَهُم بَأْسُنَآ إِلَّآ أَن قَالُوٓاْ إِنَّا كُنَّا ظَٰلِمِينَۖ","فَلَنَسْـَٔلَنَّ اَ۬لذِينَ أُرْسِلَ إِلَيْهِمْ وَلَنَسْـَٔلَنَّ اَ۬لْمُرْسَلِينَۖ","فَلَنَقُصَّنَّ عَلَيْهِم بِعِلْمٖۖ وَمَا كُنَّا غَآئِبِينَۖ","وَالْوَزْنُ يَوْمَئِذٍ اِ۬لْحَقُّۖ فَمَن ثَقُلَتْ مَوَٰزِينُهُۥ فَأُوْلَٰٓئِكَ هُمُ اُ۬لْمُفْلِحُونَۖ","وَمَنْ خَفَّتْ مَوَٰزِينُهُۥ فَأُوْلَٰٓئِكَ اَ۬لذِينَ خَسِرُوٓاْ أَنفُسَهُم بِمَا كَانُواْ بِـَٔايَٰتِنَا يَظْلِمُونَۖ","وَلَقَدْ مَكَّنَّٰكُمْ فِے اِ۬لَارْضِ وَجَعَلْنَا لَكُمْ فِيهَا مَعَٰيِشَۖ قَلِيلاٗ مَّا تَشْكُرُونَۖ","وَلَقَدْ خَلَقْنَٰكُمْ ثُمَّ صَوَّرْنَٰكُمْ ثُمَّ قُلْنَا لِلْمَلَٰٓئِكَةِ اِ۟سْجُدُواْ لِأٓدَمَ فَسَجَدُوٓاْۖ إِلَّآ إِبْلِيسَ لَمْ يَكُن مِّنَ اَ۬لسَّٰجِدِينَۖ","قَالَ مَا مَنَعَكَ أَلَّا تَسْجُدَ إِذَ اَمَرْتُكَۖ قَالَ أَنَا خَيْرٞ مِّنْهُ خَلَقْتَنِے مِن نّ۪ارٖ وَخَلَقْتَهُۥ مِن طِينٖۖ","قَالَ فَاهْبِطْ مِنْهَا فَمَا يَكُونُ لَكَ أَن تَتَكَبَّرَ فِيهَا فَاخْرُجِ اِنَّكَ مِنَ اَ۬لصَّٰغِرِينَۖ","قَالَ أَنظِرْنِےٓ إِلَىٰ يَوْمِ يُبْعَثُونَۖ","قَالَ إِنَّكَ مِنَ اَ۬لْمُنظَرِينَۖ","قَالَ فَبِمَآ أَغْوَيْتَنِے لَأَقْعُدَنَّ لَهُمْ صِرَٰطَكَ اَ۬لْمُسْتَقِيمَ","ثُمَّ لَأٓتِيَنَّهُم مِّنۢ بَيْنِ أَيْدِيهِمْ وَمِنْ خَلْفِهِمْ وَعَنَ اَيْمَٰنِهِمْ وَعَن شَمَآئِلِهِمْۖ وَلَا تَجِدُ أَكْثَرَهُمْ شَٰكِرِينَۖ","قَالَ اَ۟خْرُجْ مِنْهَا مَذْءُوماٗ مَّدْحُوراٗۖ لَّمَن تَبِعَكَ مِنْهُمْ لَأَمْلَأَنَّ جَهَنَّمَ مِنكُمُۥٓ أَجْمَعِينَۖ","وَيَٰٓـَٔادَمُ اُ۟سْكُنَ اَنتَ وَزَوْجُكَ اَ۬لْجَنَّةَ فَكُلَا مِنْ حَيْثُ شِئْتُمَاۖ وَلَا تَقْرَبَا هَٰذِهِ اِ۬لشَّجَرَةَ فَتَكُونَا مِنَ اَ۬لظَّٰلِمِينَۖ","فَوَسْوَسَ لَهُمَا اَ۬لشَّيْطَٰنُ لِيُبْدِيَ لَهُمَا مَا وُۥرِيَ عَنْهُمَا مِن سَوْءَٰتِهِمَاۖ وَقَالَ مَا نَه۪يٰكُمَا رَبُّكُمَا عَنْ هَٰذِهِ اِ۬لشَّجَرَةِ إِلَّآ أَن تَكُونَا مَلَكَيْنِ أَوْ تَكُونَا مِنَ اَ۬لْخَٰلِدِينَۖ","۞ وَقَاسَمَهُمَآ إِنِّے لَكُمَا لَمِنَ اَ۬لنَّٰصِحِينَ","فَدَلّ۪يٰهُمَا بِغُرُورٖۖ فَلَمَّا ذَاقَا اَ۬لشَّجَرَةَ بَدَتْ لَهُمَا سَوْءَٰتُهُمَا وَطَفِقَا يَخْصِفَٰنِ عَلَيْهِمَا مِنْ وَّرَقِ اِ۬لْجَنَّةِۖ وَنَاد۪يٰهُمَا رَبُّهُمَآ أَلَمَ اَنْهَكُمَا عَن تِلْكُمَا اَ۬لشَّجَرَةِ وَأَقُل لَّكُمَآ إِنَّ اَ۬لشَّيْطَٰنَ لَكُمَا عَدُوّٞ مُّبِينٞۖ","قَالَا رَبَّنَا ظَلَمْنَآ أَنفُسَنَا وَإِن لَّمْ تَغْفِرْ لَنَا وَتَرْحَمْنَا لَنَكُونَنَّ مِنَ اَ۬لْخَٰسِرِينَۖ","قَالَ اَ۪هْبِطُواْۖ بَعْضُكُمْ لِبَعْضٍ عَدُوّٞۖ وَلَكُمْ فِے اِ۬لَارْضِ مُسْتَقَرّٞ وَمَتَٰعٌ اِلَىٰ حِينٖۖ","قَالَ فِيهَا تَحْيَوْنَ وَفِيهَا تَمُوتُونَ وَمِنْهَا تُخْرَجُونَۖ","يَٰبَنِےٓ ءَادَمَ قَدَ اَنزَلْنَا عَلَيْكُمْ لِبَاساٗ يُوَٰرِے سَوْءَٰتِكُمْ وَرِيشاٗ وَلِبَاسَ اَ۬لتَّقْو۪ىٰۖ ذَٰلِكَ خَيْرٞۖ ذَٰلِكَ مِنَ اٰيَٰتِ اِ۬للَّهِ لَعَلَّهُمْ يَذَّكَّرُونَۖ","يَٰبَنِےٓ ءَادَمَ لَا يَفْتِنَنَّكُمُ اُ۬لشَّيْطَٰنُ كَمَآ أَخْرَجَ أَبَوَيْكُم مِّنَ اَ۬لْجَنَّةِ يَنزِعُ عَنْهُمَا لِبَاسَهُمَا لِيُرِيَهُمَا سَوْءَٰتِهِمَآۖ إِنَّهُۥ يَر۪يٰكُمْ هُوَ وَقَبِيلُهُۥ مِنْ حَيْثُ لَا تَرَوْنَهُمُۥٓۖ إِنَّا جَعَلْنَا اَ۬لشَّيَٰطِينَ أَوْلِيَآءَ لِلذِينَ لَا يُومِنُونَۖ","وَإِذَا فَعَلُواْ فَٰحِشَةٗ قَالُواْ وَجَدْنَا عَلَيْهَآ ءَابَآءَنَا وَاللَّهُ أَمَرَنَا بِهَاۖ قُلِ اِنَّ اَ۬للَّهَ لَا يَامُرُ بِالْفَحْشَآءِۖ اَ۬تَقُولُونَ عَلَى اَ۬للَّهِ مَا لَا تَعْلَمُونَۖ","قُلَ اَمَرَ رَبِّے بِالْقِسْطِۖ وَأَقِيمُواْ وُجُوهَكُمْ عِندَ كُلِّ مَسْجِدٖۖ وَادْعُوهُ مُخْلِصِينَ لَهُ اُ۬لدِّينَۖ كَمَا بَدَأَكُمْ تَعُودُونَۖ فَرِيقاً هَد۪ىٰۖ وَفَرِيقاً حَقَّ عَلَيْهِمُ اُ۬لضَّلَٰلَةُۖ إِنَّهُمُ اُ۪تَّخَذُواْ اُ۬لشَّيَٰطِينَ أَوْلِيَآءَ مِن دُونِ اِ۬للَّهِ وَيَحْسِبُونَ أَنَّهُم مُّهْتَدُونَۖ","يَٰبَنِےٓ ءَادَمَ خُذُواْ زِينَتَكُمْ عِندَ كُلِّ مَسْجِدٖ وَكُلُواْ وَاشْرَبُواْۖ وَلَا تُسْرِفُوٓاْۖ إِنَّهُۥ لَا يُحِبُّ اُ۬لْمُسْرِفِينَۖ","۞ قُلْ مَنْ حَرَّمَ زِينَةَ اَ۬للَّهِ اِ۬لتِےٓ أَخْرَجَ لِعِبَادِهِۦ وَالطَّيِّبَٰتِ مِنَ اَ۬لرِّزْقِۖ قُلْ هِيَ لِلذِينَ ءَامَنُواْ فِے اِ۬لْحَيَوٰةِ اِ۬لدُّنْي۪ا خَالِصَةٞ يَوْمَ اَ۬لْقِيَٰمَةِۖ كَذَٰلِكَ نُفَصِّلُ اُ۬لَايَٰتِ لِقَوْمٖ يَعْلَمُونَۖ","قُلِ اِنَّمَا حَرَّمَ رَبِّيَ اَ۬لْفَوَٰحِشَ مَا ظَهَرَ مِنْهَا وَمَا بَطَنَ وَالِاثْمَ وَالْبَغْيَ بِغَيْرِ اِ۬لْحَقِّ وَأَن تُشْرِكُواْ بِاللَّهِ مَا لَمْ يُنَزِّلْ بِهِۦ سُلْطَٰناٗ وَأَن تَقُولُواْ عَلَى اَ۬للَّهِ مَا لَا تَعْلَمُونَۖ","وَلِكُلِّ أُمَّةٍ اَجَلٞۖ فَإِذَا جَآءَ اجَلُهُمْ لَا يَسْتَٰخِرُونَ سَاعَةٗۖ وَلَا يَسْتَقْدِمُونَۖ","يَٰبَنِےٓ ءَادَمَ إِمَّا يَاتِيَنَّكُمْ رُسُلٞ مِّنكُمْ يَقُصُّونَ عَلَيْكُمُۥٓ ءَايَٰتِے فَمَنِ اِ۪تَّق۪ىٰ وَأَصْلَحَ فَلَا خَوْفٌ عَلَيْهِمْ وَلَا هُمْ يَحْزَنُونَۖ","وَالذِينَ كَذَّبُواْ بِـَٔايَٰتِنَا وَاسْتَكْبَرُواْ عَنْهَآ أُوْلَٰٓئِكَ أَصْحَٰبُ اُ۬لنّ۪ارِ هُمْ فِيهَا خَٰلِدُونَۖ","فَمَنَ اَظْلَمُ مِمَّنِ اِ۪فْتَر۪ىٰ عَلَى اَ۬للَّهِ كَذِباً اَوْ كَذَّبَ بِـَٔايَٰتِهِۦٓۖ أُوْلَٰٓئِكَ يَنَالُهُمْ نَصِيبُهُم مِّنَ اَ۬لْكِتَٰبِۖ حَتَّىٰٓ إِذَا جَآءَتْهُمْ رُسُلُنَا يَتَوَفَّوْنَهُمْ قَالُوٓاْ أَيْنَ مَا كُنتُمْ تَدْعُونَ مِن دُونِ اِ۬للَّهِ قَالُواْ ضَلُّواْ عَنَّاۖ وَشَهِدُواْ عَلَىٰٓ أَنفُسِهِمُۥٓ أَنَّهُمْ كَانُواْ كٰ۪فِرِينَۖ","قَالَ اَ۟دْخُلُواْ فِےٓ أُمَمٖ قَدْ خَلَتْ مِن قَبْلِكُم مِّنَ اَ۬لْجِنِّ وَالِانسِ فِے اِ۬لنّ۪ارِۖ كُلَّمَا دَخَلَتُ ا۟مَّةٞ لَّعَنَتُ ا۟خْتَهَاۖ حَتَّىٰٓ إِذَا اَ۪دَّارَكُواْ فِيهَا جَمِيعاٗ قَالَتُ ا۟خْر۪يٰهُمْ لِأُول۪يٰهُمْ رَبَّنَا هَٰٓؤُلَآءِ اَ۬ضَلُّونَا فَـَٔاتِهِمْ عَذَاباٗ ضِعْفاٗ مِّنَ اَ۬لنّ۪ارِۖ","قَالَ لِكُلّٖ ضِعْفٞۖ وَلَٰكِن لَّا تَعْلَمُونَۖ","۞ وَقَالَتُ ا۟ول۪يٰهُمْ لِأُخْر۪يٰهُمْ فَمَا كَانَ لَكُمْ عَلَيْنَا مِن فَضْلٖ فَذُوقُواْ اُ۬لْعَذَابَ بِمَا كُنتُمْ تَكْسِبُونَۖ","إِنَّ اَ۬لذِينَ كَذَّبُواْ بِـَٔايَٰتِنَا وَاسْتَكْبَرُواْ عَنْهَا لَا تُفَتَّحُ لَهُمُۥٓ أَبْوَٰبُ اُ۬لسَّمَآءِ وَلَا يَدْخُلُونَ اَ۬لْجَنَّةَ حَتَّىٰ يَلِجَ اَ۬لْجَمَلُ فِے سَمِّ اِ۬لْخِيَاطِۖ وَكَذَٰلِكَ نَجْزِے اِ۬لْمُجْرِمِينَۖ","لَهُم مِّن جَهَنَّمَ مِهَادٞۖ وَمِن فَوْقِهِمْ غَوَاشٖۖ وَكَذَٰلِكَ نَجْزِے اِ۬لظَّٰلِمِينَۖ","وَالذِينَ ءَامَنُواْ وَعَمِلُواْ اُ۬لصَّٰلِحَٰتِ لَا نُكَلِّفُ نَفْساً اِلَّا وُسْعَهَآۖ أُوْلَٰٓئِكَ أَصْحَٰبُ اُ۬لْجَنَّةِ هُمْ فِيهَا خَٰلِدُونَۖ","وَنَزَعْنَا مَا فِے صُدُورِهِم مِّنْ غِلّٖ تَجْرِے مِن تَحْتِهِمُ اُ۬لَانْهَٰرُۖ وَقَالُواْ اُ۬لْحَمْدُ لِلهِ اِ۬لذِے هَد۪يٰنَا لِهَٰذَا وَمَا كُنَّا لِنَهْتَدِيَ لَوْلَآ أَنْ هَد۪يٰنَا اَ۬للَّهُۖ لَقَدْ جَآءَتْ رُسُلُ رَبِّنَا بِالْحَقِّۖ وَنُودُوٓاْ أَن تِلْكُمُ اُ۬لْجَنَّةُ أُورِثْتُمُوهَا بِمَا كُنتُمْ تَعْمَلُونَۖ","وَنَاد۪ىٰٓ أَصْحَٰبُ اُ۬لْجَنَّةِ أَصْحَٰبَ اَ۬لنّ۪ارِ أَن قَدْ وَجَدْنَا مَا وَعَدَنَا رَبُّنَا حَقّاٗ فَهَلْ وَجَدتُّم مَّا وَعَدَ رَبُّكُمْ حَقّاٗۖ قَالُواْ نَعَمْۖ فَأَذَّنَ مُوَ۬ذِّنُۢ بَيْنَهُمُۥٓ أَن لَّعْنَةُ اُ۬للَّهِ عَلَى اَ۬لظَّٰلِمِينَ","اَ۬لذِينَ يَصُدُّونَ عَن سَبِيلِ اِ۬للَّهِ وَيَبْغُونَهَا عِوَجاٗ وَهُم بِالَاخِرَةِ كَٰفِرُونَۖ","وَبَيْنَهُمَا حِجَابٞۖ وَعَلَى اَ۬لَاعْرَافِ رِجَالٞ يَعْرِفُونَ كُلّاَۢ بِسِيم۪يٰهُمْۖ وَنَادَوَاْ اَصْحَٰبَ اَ۬لْجَنَّةِ أَن سَلَٰمٌ عَلَيْكُمْۖ لَمْ يَدْخُلُوهَا وَهُمْ يَطْمَعُونَۖ","۞ وَإِذَا صُرِفَتَ اَبْصَٰرُهُمْ تِلْقَآءَ اصْحَٰبِ اِ۬لنّ۪ارِ قَالُواْ رَبَّنَا لَا تَجْعَلْنَا مَعَ اَ۬لْقَوْمِ اِ۬لظَّٰلِمِينَۖ","وَنَاد۪ىٰٓ أَصْحَٰبُ اُ۬لَاعْرَافِ رِجَالاٗ يَعْرِفُونَهُم بِسِيم۪يٰهُمْ قَالُواْ مَآ أَغْن۪ىٰ عَنكُمْ جَمْعُكُمْ وَمَا كُنتُمْ تَسْتَكْبِرُونَۖ","أَهَٰٓؤُلَآءِ اِ۬لذِينَ أَقْسَمْتُمْ لَا يَنَالُهُمُ اُ۬للَّهُ بِرَحْمَةٍۖ اُ۟دْخُلُواْ اُ۬لْجَنَّةَ لَا خَوْفٌ عَلَيْكُمْ وَلَآ أَنتُمْ تَحْزَنُونَۖ","وَنَاد۪ىٰٓ أَصْحَٰبُ اُ۬لنّ۪ارِ أَصْحَٰبَ اَ۬لْجَنَّةِ أَنَ اَفِيضُواْ عَلَيْنَا مِنَ اَ۬لْمَآءِ اَ۬وْ مِمَّا رَزَقَكُمُ اُ۬للَّهُۖ قَالُوٓاْ إِنَّ اَ۬للَّهَ حَرَّمَهُمَا عَلَى اَ۬لْكٰ۪فِرِينَ","اَ۬لذِينَ اَ۪تَّخَذُواْ دِينَهُمْ لَهْواٗ وَلَعِباٗ وَغَرَّتْهُمُ اُ۬لْحَيَوٰةُ اُ۬لدُّنْي۪اۖ فَالْيَوْمَ نَنس۪يٰهُمْ كَمَا نَسُواْ لِقَآءَ يَوْمِهِمْ هَٰذَا وَمَا كَانُواْ بِـَٔايَٰتِنَا يَجْحَدُونَۖ","وَلَقَدْ جِئْنَٰهُم بِكِتَٰبٖ فَصَّلْنَٰهُ عَلَىٰ عِلْمٍ هُدىٗ وَرَحْمَةٗ لِّقَوْمٖ يُومِنُونَۖ","هَلْ يَنظُرُونَ إِلَّا تَاوِيلَهُۥۖ يَوْمَ يَاتِے تَاوِيلُهُۥ يَقُولُ اُ۬لذِينَ نَسُوهُ مِن قَبْلُ قَدْ جَآءَتْ رُسُلُ رَبِّنَا بِالْحَقِّ فَهَل لَّنَا مِن شُفَعَآءَ فَيَشْفَعُواْ لَنَآ أَوْ نُرَدُّ فَنَعْمَلَ غَيْرَ اَ۬لذِے كُنَّا نَعْمَلُۖ قَدْ خَسِرُوٓاْ أَنفُسَهُمْ وَضَلَّ عَنْهُم مَّا كَانُواْ يَفْتَرُونَۖ","إِنَّ رَبَّكُمُ اُ۬للَّهُ اُ۬لذِے خَلَقَ اَ۬لسَّمَٰوَٰتِ وَالَارْضَ فِے سِتَّةِ أَيَّامٖ ثُمَّ اَ۪سْتَو۪ىٰ عَلَى اَ۬لْعَرْشِۖ يُغْشِے اِ۬ليْلَ اَ۬لنَّهَارَ يَطْلُبُهُۥ حَثِيثاٗ وَالشَّمْسَ وَالْقَمَرَ وَالنُّجُومَ مُسَخَّرَٰتِۢ بِأَمْرِهِۦٓۖ أَلَا لَهُ اُ۬لْخَلْقُ وَالَامْرُۖ تَبَٰرَكَ اَ۬للَّهُ رَبُّ اُ۬لْعَٰلَمِينَۖ","اَ۟دْعُواْ رَبَّكُمْ تَضَرُّعاٗ وَخُفْيَةًۖ اِنَّهُۥ لَا يُحِبُّ اُ۬لْمُعْتَدِينَۖ","وَلَا تُفْسِدُواْ فِے اِ۬لَارْضِ بَعْدَ إِصْلَٰحِهَاۖ وَادْعُوهُ خَوْفاٗ وَطَمَعاًۖ اِنَّ رَحْمَتَ اَ۬للَّهِ قَرِيبٞ مِّنَ اَ۬لْمُحْسِنِينَۖ","۞ وَهُوَ اَ۬لذِے يُرْسِلُ اُ۬لرِّيَٰحَ نُشُراَۢ بَيْنَ يَدَےْ رَحْمَتِهِۦۖ حَتَّىٰٓ إِذَآ أَقَلَّتْ سَحَاباٗ ثِقَالاٗ سُقْنَٰهُ لِبَلَدٖ مَّيِّتٖ فَأَنزَلْنَا بِهِ اِ۬لْمَآءَ فَأَخْرَجْنَا بِهِۦ مِن كُلِّ اِ۬لثَّمَرَٰتِۖ كَذَٰلِكَ نُخْرِجُ اُ۬لْمَوْت۪ىٰ لَعَلَّكُمْ تَذَّكَّرُونَۖ","وَالْبَلَدُ اُ۬لطَّيِّبُ يَخْرُجُ نَبَاتُهُۥ بِإِذْنِ رَبِّهِۦۖ وَالذِے خَبُثَ لَا يَخْرُجُ إِلَّا نَكِداٗۖ كَذَٰلِكَ نُصَرِّفُ اُ۬لَايَٰتِ لِقَوْمٖ يَشْكُرُونَۖ","لَقَدَ اَرْسَلْنَا نُوحاً اِلَىٰ قَوْمِهِۦ فَقَالَ يَٰقَوْمِ اِ۟عْبُدُواْ اُ۬للَّهَ مَا لَكُم مِّنِ اِلَٰهٍ غَيْرُهُۥٓۖ إِنِّيَ أَخَافُ عَلَيْكُمْ عَذَابَ يَوْمٍ عَظِيمٖۖ","قَالَ اَ۬لْمَلَأُ مِن قَوْمِهِۦٓ إِنَّا لَنَر۪يٰكَ فِے ضَلَٰلٖ مُّبِينٖۖ","قَالَ يَٰقَوْمِ لَيْسَ بِے ضَلَٰلَةٞ وَلَٰكِنِّے رَسُولٞ مِّن رَّبِّ اِ۬لْعَٰلَمِينَۖ","أُبَلِّغُكُمْ رِسَٰلَٰتِ رَبِّے وَأَنصَحُ لَكُمْ وَأَعْلَمُ مِنَ اَ۬للَّهِ مَا لَا تَعْلَمُونَۖ","أَوَعَجِبْتُمُۥٓ أَن جَآءَكُمْ ذِكْرٞ مِّن رَّبِّكُمْ عَلَىٰ رَجُلٖ مِّنكُمْ لِيُنذِرَكُمْ وَلِتَتَّقُواْ وَلَعَلَّكُمْ تُرْحَمُونَۖ","فَكَذَّبُوهُ فَأَنجَيْنَٰهُ وَالذِينَ مَعَهُۥ فِے اِ۬لْفُلْكِۖ وَأَغْرَقْنَا اَ۬لذِينَ كَذَّبُواْ بِـَٔايَٰتِنَآۖ إِنَّهُمْ كَانُواْ قَوْماً عَمِينَۖ","وَإِلَىٰ عَادٍ اَخَاهُمْ هُوداٗۖ قَالَ يَٰقَوْمِ اِ۟عْبُدُواْ اُ۬للَّهَ مَا لَكُم مِّنِ اِلَٰهٍ غَيْرُهُۥٓۖ أَفَلَا تَتَّقُونَۖ","قَالَ اَ۬لْمَلَأُ اُ۬لذِينَ كَفَرُواْ مِن قَوْمِهِۦٓ إِنَّا لَنَر۪يٰكَ فِے سَفَاهَةٖ وَإِنَّا لَنَظُنُّكَ مِنَ اَ۬لْكَٰذِبِينَۖ","قَالَ يَٰقَوْمِ لَيْسَ بِے سَفَاهَةٞ وَلَٰكِنِّے رَسُولٞ مِّن رَّبِّ اِ۬لْعَٰلَمِينَۖ","أُبَلِّغُكُمْ رِسَٰلَٰتِ رَبِّے وَأَنَا لَكُمْ نَاصِحٌ اَمِينٌۖ","۞ اَوَعَجِبْتُمُۥٓ أَن جَآءَكُمْ ذِكْرٞ مِّن رَّبِّكُمْ عَلَىٰ رَجُلٖ مِّنكُمْ لِيُنذِرَكُمْۖ وَاذْكُرُوٓاْ إِذْ جَعَلَكُمْ خُلَفَآءَ مِنۢ بَعْدِ قَوْمِ نُوحٖ وَزَادَكُمْ فِے اِ۬لْخَلْقِ بَصْطَةٗۖ فَاذْكُرُوٓاْ ءَالَآءَ اَ۬للَّهِ لَعَلَّكُمْ تُفْلِحُونَۖ","قَالُوٓاْ أَجِئْتَنَا لِنَعْبُدَ اَ۬للَّهَ وَحْدَهُۥ وَنَذَرَ مَا كَانَ يَعْبُدُ ءَابَآؤُنَا فَاتِنَا بِمَا تَعِدُنَآ إِن كُنتَ مِنَ اَ۬لصَّٰدِقِينَۖ","قَالَ قَدْ وَقَعَ عَلَيْكُم مِّن رَّبِّكُمْ رِجْسٞ وَغَضَبٌۖ اَتُجَٰدِلُونَنِے فِےٓ أَسْمَآءٖ سَمَّيْتُمُوهَآ أَنتُمْ وَءَابَآؤُكُم مَّا نَزَّلَ اَ۬للَّهُ بِهَا مِن سُلْطَٰنٖۖ فَانتَظِرُوٓاْۖ إِنِّے مَعَكُم مِّنَ اَ۬لْمُنتَظِرِينَۖ","فَأَنجَيْنَٰهُ وَالذِينَ مَعَهُۥ بِرَحْمَةٖ مِّنَّا وَقَطَعْنَا دَابِرَ اَ۬لذِينَ كَذَّبُواْ بِـَٔايَٰتِنَا وَمَا كَانُواْ مُومِنِينَۖ","وَإِلَىٰ ثَمُودَ أَخَاهُمْ صَٰلِحاٗۖ قَالَ يَٰقَوْمِ اِ۟عْبُدُواْ اُ۬للَّهَ مَا لَكُم مِّنِ اِلَٰهٍ غَيْرُهُۥۖ قَدْ جَآءَتْكُم بَيِّنَةٞ مِّن رَّبِّكُمْۖ هَٰذِهِۦ نَاقَةُ اُ۬للَّهِ لَكُمُۥٓ ءَايَةٗۖ فَذَرُوهَا تَاكُلْ فِےٓ أَرْضِ اِ۬للَّهِۖ وَلَا تَمَسُّوهَا بِسُوٓءٖ فَيَاخُذَكُمْ عَذَابٌ اَلِيمٞۖ","وَاذْكُرُوٓاْ إِذْ جَعَلَكُمْ خُلَفَآءَ مِنۢ بَعْدِ عَادٖ وَبَوَّأَكُمْ فِے اِ۬لَارْضِ تَتَّخِذُونَ مِن سُهُولِهَا قُصُوراٗ وَتَنْحِتُونَ اَ۬لْجِبَالَ بُيُوتاٗۖ فَاذْكُرُوٓاْ ءَالَآءَ اَ۬للَّهِۖ وَلَا تَعْثَوْاْ فِے اِ۬لَارْضِ مُفْسِدِينَۖ","قَالَ اَ۬لْمَلَأُ اُ۬لذِينَ اَ۪سْتَكْبَرُواْ مِن قَوْمِهِۦ لِلذِينَ اَ۟سْتُضْعِفُواْ لِمَنَ اٰمَنَ مِنْهُمُۥٓ أَتَعْلَمُونَ أَنَّ صَٰلِحاٗ مُّرْسَلٞ مِّن رَّبِّهِۦۖ قَالُوٓاْ إِنَّا بِمَآ أُرْسِلَ بِهِۦ مُومِنُونَۖ","قَالَ اَ۬لذِينَ اَ۪سْتَكْبَرُوٓاْ إِنَّا بِالذِےٓ ءَامَنتُم بِهِۦ كَٰفِرُونَۖ","۞ فَعَقَرُواْ اُ۬لنَّاقَةَ وَعَتَوْاْ عَنَ اَمْرِ رَبِّهِمْۖ وَقَالُواْ يَٰصَٰلِحُ اُ۪يتِنَا بِمَا تَعِدُنَآ إِن كُنتَ مِنَ اَ۬لْمُرْسَلِينَۖ","فَأَخَذَتْهُمُ اُ۬لرَّجْفَةُ فَأَصْبَحُواْ فِے د۪ارِهِمْ جَٰثِمِينَۖ","فَتَوَلّ۪ىٰ عَنْهُمْ وَقَالَ يَٰقَوْمِ لَقَدَ اَبْلَغْتُكُمْ رِسَالَةَ رَبِّے وَنَصَحْتُ لَكُمْۖ وَلَٰكِن لَّا تُحِبُّونَ اَ۬لنَّٰصِحِينَۖ","وَلُوطاً اِذْ قَالَ لِقَوْمِهِۦٓ أَتَاتُونَ اَ۬لْفَٰحِشَةَ مَا سَبَقَكُم بِهَا مِنَ اَحَدٖ مِّنَ اَ۬لْعَٰلَمِينَۖ","إِنَّكُمْ لَتَاتُونَ اَ۬لرِّجَالَ شَهْوَةٗ مِّن دُونِ اِ۬لنِّسَآءِۖ بَلَ اَنتُمْ قَوْمٞ مُّسْرِفُونَۖ","وَمَا كَانَ جَوَابَ قَوْمِهِۦٓ إِلَّآ أَن قَالُوٓاْ أَخْرِجُوهُم مِّن قَرْيَتِكُمُۥٓۖ إِنَّهُمُۥٓ أُنَاسٞ يَتَطَهَّرُونَۖ","فَأَنجَيْنَٰهُ وَأَهْلَهُۥٓ إِلَّا اَ۪مْرَأَتَهُۥ كَانَتْ مِنَ اَ۬لْغَٰبِرِينَۖ","وَأَمْطَرْنَا عَلَيْهِم مَّطَراٗۖ فَانظُرْ كَيْفَ كَانَ عَٰقِبَةُ اُ۬لْمُجْرِمِينَۖ","وَإِلَىٰ مَدْيَنَ أَخَاهُمْ شُعَيْباٗۖ قَالَ يَٰقَوْمِ اِ۟عْبُدُواْ اُ۬للَّهَ مَا لَكُم مِّنِ اِلَٰهٍ غَيْرُهُۥۖ قَدْ جَآءَتْكُم بَيِّنَةٞ مِّن رَّبِّكُمْۖ فَأَوْفُواْ اُ۬لْكَيْلَ وَالْمِيزَانَۖ وَلَا تَبْخَسُواْ اُ۬لنَّاسَ أَشْيَآءَهُمْۖ وَلَا تُفْسِدُواْ فِے اِ۬لَارْضِ بَعْدَ إِصْلَٰحِهَاۖ ذَٰلِكُمْ خَيْرٞ لَّكُمُۥٓ إِن كُنتُم مُّومِنِينَۖ","وَلَا تَقْعُدُواْ بِكُلِّ صِرَٰطٖ تُوعِدُونَ وَتَصُدُّونَ عَن سَبِيلِ اِ۬للَّهِ مَنَ اٰمَنَ بِهِۦ وَتَبْغُونَهَا عِوَجاٗۖ وَاذْكُرُوٓاْ إِذْ كُنتُمْ قَلِيلاٗ فَكَثَّرَكُمْۖ وَانظُرُواْ كَيْفَ كَانَ عَٰقِبَةُ اُ۬لْمُفْسِدِينَۖ","وَإِن كَانَ طَآئِفَةٞ مِّنكُمُۥٓ ءَامَنُواْ بِالذِےٓ أُرْسِلْتُ بِهِۦ وَطَآئِفَةٞ لَّمْ يُومِنُواْ فَاصْبِرُواْ حَتَّىٰ يَحْكُمَ اَ۬للَّهُ بَيْنَنَاۖ وَهُوَ خَيْرُ اُ۬لْحَٰكِمِينَۖ","۞ قَالَ اَ۬لْمَلَأُ اُ۬لذِينَ اَ۪سْتَكْبَرُواْ مِن قَوْمِهِۦ لَنُخْرِجَنَّكَ يَٰشُعَيْبُ وَالذِينَ ءَامَنُواْ مَعَكَ مِن قَرْيَتِنَآ أَوْ لَتَعُودُنَّ فِے مِلَّتِنَاۖ قَالَ أَوَلَوْ كُنَّا كَٰرِهِينَۖ","قَدِ اِ۪فْتَرَيْنَا عَلَى اَ۬للَّهِ كَذِباً اِنْ عُدْنَا فِے مِلَّتِكُم بَعْدَ إِذْ نَجّ۪يٰنَا اَ۬للَّهُ مِنْهَاۖ وَمَا يَكُونُ لَنَآ أَن نَّعُودَ فِيهَآ إِلَّآ أَنْ يَّشَآءَ اَ۬للَّهُ رَبُّنَاۖ وَسِعَ رَبُّنَا كُلَّ شَےْءٍ عِلْماًۖ عَلَى اَ۬للَّهِ تَوَكَّلْنَاۖ رَبَّنَا اَ۪فْتَحْ بَيْنَنَا وَبَيْنَ قَوْمِنَا بِالْحَقِّۖ وَأَنتَ خَيْرُ اُ۬لْفَٰتِحِينَۖ","وَقَالَ اَ۬لْمَلَأُ اُ۬لذِينَ كَفَرُواْ مِن قَوْمِهِۦ لَئِنِ اِ۪تَّبَعْتُمْ شُعَيْباً اِنَّكُمُۥٓ إِذاٗ لَّخَٰسِرُونَۖ","فَأَخَذَتْهُمُ اُ۬لرَّجْفَةُ فَأَصْبَحُواْ فِے د۪ارِهِمْ جَٰثِمِينَۖ","اَ۬لذِينَ كَذَّبُواْ شُعَيْباٗ كَأَن لَّمْ يَغْنَوْاْ فِيهَاۖ اَ۬لذِينَ كَذَّبُواْ شُعَيْباٗ كَانُواْ هُمُ اُ۬لْخَٰسِرِينَۖ","فَتَوَلّ۪ىٰ عَنْهُمْ وَقَالَ يَٰقَوْمِ لَقَدَ اَبْلَغْتُكُمْ رِسَٰلَٰتِ رَبِّے وَنَصَحْتُ لَكُمْۖ فَكَيْفَ ءَاس۪ىٰ عَلَىٰ قَوْمٖ كٰ۪فِرِينَۖ","وَمَآ أَرْسَلْنَا فِے قَرْيَةٖ مِّن نَّبِےٓءٍ اِلَّآ أَخَذْنَآ أَهْلَهَا بِالْبَأْسَآءِ وَالضَّرَّآءِ لَعَلَّهُمْ يَضَّرَّعُونَۖ","ثُمَّ بَدَّلْنَا مَكَانَ اَ۬لسَّيِّئَةِ اِ۬لْحَسَنَةَ حَتَّىٰ عَفَواْۖ وَّقَالُواْ قَدْ مَسَّ ءَابَآءَنَا اَ۬لضَّرَّآءُ وَالسَّرَّآءُ فَأَخَذْنَٰهُم بَغْتَةٗ وَهُمْ لَا يَشْعُرُونَۖ","وَلَوَ اَنَّ أَهْلَ اَ۬لْقُر۪ىٰٓ ءَامَنُواْ وَاتَّقَوْاْ لَفَتَحْنَا عَلَيْهِم بَرَكَٰتٖ مِّنَ اَ۬لسَّمَآءِ وَالَارْضِۖ وَلَٰكِن كَذَّبُواْ فَأَخَذْنَٰهُم بِمَا كَانُواْ يَكْسِبُونَۖ","أَفَأَمِنَ أَهْلُ اُ۬لْقُر۪ىٰٓ أَنْ يَّاتِيَهُم بَأْسُنَا بَيَٰتاٗ وَهُمْ نَآئِمُونَ","أَوَاَمِنَ أَهْلُ اُ۬لْقُر۪ىٰٓ أَنْ يَّاتِيَهُم بَأْسُنَا ضُحىٗ وَهُمْ يَلْعَبُونَۖ","أَفَأَمِنُواْ مَكْرَ اَ۬للَّهِۖ فَلَا يَامَنُ مَكْرَ اَ۬للَّهِ إِلَّا اَ۬لْقَوْمُ اُ۬لْخَٰسِرُونَۖ","۞ أَوَلَمْ يَهْدِ لِلذِينَ يَرِثُونَ اَ۬لَارْضَ مِنۢ بَعْدِ أَهْلِهَآ أَن لَّوْ نَشَآءُ اَ۬صَبْنَٰهُم بِذُنُوبِهِمْۖ وَنَطْبَعُ عَلَىٰ قُلُوبِهِمْ فَهُمْ لَا يَسْمَعُونَۖ","تِلْكَ اَ۬لْقُر۪ىٰ نَقُصُّ عَلَيْكَ مِنَ اَنۢبَآئِهَاۖ وَلَقَدْ جَآءَتْهُمْ رُسُلُهُم بِالْبَيِّنَٰتِ فَمَا كَانُواْ لِيُومِنُواْ بِمَا كَذَّبُواْ مِن قَبْلُۖ كَذَٰلِكَ يَطْبَعُ اُ۬للَّهُ عَلَىٰ قُلُوبِ اِ۬لْكٰ۪فِرِينَۖ","وَمَا وَجَدْنَا لِأَكْثَرِهِم مِّنْ عَهْدٖۖ وَإِنْ وَّجَدْنَآ أَكْثَرَهُمْ لَفَٰسِقِينَۖ","ثُمَّ بَعَثْنَا مِنۢ بَعْدِهِم مُّوس۪ىٰ بِـَٔايَٰتِنَآ إِلَىٰ فِرْعَوْنَ وَمَلَإِيْهِۦ فَظَلَمُواْ بِهَاۖ فَانظُرْ كَيْفَ كَانَ عَٰقِبَةُ اُ۬لْمُفْسِدِينَۖ","وَقَالَ مُوس۪ىٰ يَٰفِرْعَوْنُ إِنِّے رَسُولٞ مِّن رَّبِّ اِ۬لْعَٰلَمِينَ","حَقِيقٌۖ عَلَيَّ أَن لَّآ أَقُولَ عَلَى اَ۬للَّهِ إِلَّا اَ۬لْحَقَّۖ قَدْ جِئْتُكُم بِبَيِّنَةٖ مِّن رَّبِّكُمْۖ فَأَرْسِلْ مَعِے بَنِےٓ إِسْرَآءِيلَۖ","قَالَ إِن كُنتَ جِئْتَ بِـَٔايَةٖ فَاتِ بِهَآ إِن كُنتَ مِنَ اَ۬لصَّٰدِقِينَۖ","فَأَلْق۪ىٰ عَصَاهُ فَإِذَا هِيَ ثُعْبَانٞ مُّبِينٞ","وَنَزَعَ يَدَهُۥ فَإِذَا هِيَ بَيْضَآءُ لِلنَّٰظِرِينَۖ","قَالَ اَ۬لْمَلَأُ مِن قَوْمِ فِرْعَوْنَ إِنَّ هَٰذَا لَسَٰحِرٌ عَلِيمٞ","يُرِيدُ أَنْ يُّخْرِجَكُم مِّنَ اَرْضِكُمْۖ فَمَاذَا تَامُرُونَۖ","قَالُوٓاْ أَرْجِهِۦ وَأَخَاهُ وَأَرْسِلْ فِے اِ۬لْمَدَآئِنِ حَٰشِرِينَ","يَاتُوكَ بِكُلِّ سَٰحِرٍ عَلِيمٖۖ","وَجَآءَ اَ۬لسَّحَرَةُ فِرْعَوْنَ قَالُوٓاْ إِنَّ لَنَا لَأَجْراً اِن كُنَّا نَحْنُ اُ۬لْغَٰلِبِينَۖ","قَالَ نَعَمْ وَإِنَّكُمْ لَمِنَ اَ۬لْمُقَرَّبِينَۖ","قَالُواْ يَٰمُوس۪ىٰٓ إِمَّآ أَن تُلْقِيَ وَإِمَّآ أَن نَّكُونَ نَحْنُ اُ۬لْمُلْقِينَۖ","قَالَ أَلْقُواْۖ فَلَمَّآ أَلْقَوْاْ سَحَرُوٓاْ أَعْيُنَ اَ۬لنَّاسِ وَاسْتَرْهَبُوهُمْۖ وَجَآءُو بِسِحْرٍ عَظِيمٖۖ","۞ وَأَوْحَيْنَآ إِلَىٰ مُوس۪ىٰٓ أَنَ اَلْقِ عَصَاكَۖ فَإِذَا هِيَ تَلَقَّفُ مَا يَافِكُونَۖ","فَوَقَعَ اَ۬لْحَقُّ وَبَطَلَ مَا كَانُواْ يَعْمَلُونَۖ","فَغُلِبُواْ هُنَالِكَ وَانقَلَبُواْ صَٰغِرِينَۖ","وَأُلْقِيَ اَ۬لسَّحَرَةُ سَٰجِدِينَۖ","قَالُوٓاْ ءَامَنَّا بِرَبِّ اِ۬لْعَٰلَمِينَ","رَبِّ مُوس۪ىٰ وَهَٰرُونَۖ","قَالَ فِرْعَوْنُ ءَاٰ۬مَنتُم بِهِۦ قَبْلَ أَنَ اٰذَنَ لَكُمُۥٓ إِنَّ هَٰذَا لَمَكْرٞ مَّكَرْتُمُوهُ فِے اِ۬لْمَدِينَةِ لِتُخْرِجُواْ مِنْهَآ أَهْلَهَاۖ فَسَوْفَ تَعْلَمُونَۖ","لَأُقَطِّعَنَّ أَيْدِيَكُمْ وَأَرْجُلَكُم مِّنْ خِلَٰفٖ ثُمَّ لَأُصَلِّبَنَّكُمُۥٓ أَجْمَعِينَۖ","قَالُوٓاْ إِنَّآ إِلَىٰ رَبِّنَا مُنقَلِبُونَۖ","وَمَا تَنقِمُ مِنَّآ إِلَّآ أَنَ اٰمَنَّا بِـَٔايَٰتِ رَبِّنَا لَمَّا جَآءَتْنَاۖ رَبَّنَآ أَفْرِغْ عَلَيْنَا صَبْراٗ وَتَوَفَّنَا مُسْلِمِينَۖ","وَقَالَ اَ۬لْمَلَأُ مِن قَوْمِ فِرْعَوْنَ أَتَذَرُ مُوس۪ىٰ وَقَوْمَهُۥ لِيُفْسِدُواْ فِے اِ۬لَارْضِ وَيَذَرَكَ وَءَالِهَتَكَۖ قَالَ سَنَقْتُلُ أَبْنَآءَهُمْ وَنَسْتَحْيِۦ نِسَآءَهُمْ وَإِنَّا فَوْقَهُمْ قَٰهِرُونَۖ","قَالَ مُوس۪ىٰ لِقَوْمِهِ اِ۪سْتَعِينُواْ بِاللَّهِ وَاصْبِرُوٓاْۖ إِنَّ اَ۬لَارْضَ لِلهِ يُورِثُهَا مَنْ يَّشَآءُ مِنْ عِبَادِهِۦۖ وَالْعَٰقِبَةُ لِلْمُتَّقِينَۖ","قَالُوٓاْ أُوذِينَا مِن قَبْلِ أَن تَاتِيَنَا وَمِنۢ بَعْدِ مَا جِئْتَنَاۖ قَالَ عَس۪ىٰ رَبُّكُمُۥٓ أَنْ يُّهْلِكَ عَدُوَّكُمْ وَيَسْتَخْلِفَكُمْ فِے اِ۬لَارْضِ فَيَنظُرَ كَيْفَ تَعْمَلُونَۖ","وَلَقَدَ اَخَذْنَآ ءَالَ فِرْعَوْنَ بِالسِّنِينَ وَنَقْصٖ مِّنَ اَ۬لثَّمَرَٰتِ لَعَلَّهُمْ يَذَّكَّرُونَۖ","فَإِذَا جَآءَتْهُمُ اُ۬لْحَسَنَةُ قَالُواْ لَنَا هَٰذِهِۦۖ وَإِن تُصِبْهُمْ سَيِّئَةٞ يَطَّيَّرُواْ بِمُوس۪ىٰ وَمَن مَّعَهُۥٓۖ أَلَآ إِنَّمَا طَٰٓئِرُهُمْ عِندَ اَ۬للَّهِۖ وَلَٰكِنَّ أَكْثَرَهُمْ لَا يَعْلَمُونَۖ","۞ وَقَالُواْ مَهْمَا تَاتِنَا بِهِۦ مِنَ اٰيَةٖ لِّتَسْحَرَنَا بِهَا فَمَا نَحْنُ لَكَ بِمُومِنِينَۖ","فَأَرْسَلْنَا عَلَيْهِمُ اُ۬لطُّوفَانَ وَالْجَرَادَ وَالْقُمَّلَ وَالضَّفَادِعَ وَالدَّمَ ءَايَٰتٖ مُّفَصَّلَٰتٖ فَاسْتَكْبَرُواْ وَكَانُواْ قَوْماٗ مُّجْرِمِينَۖ","وَلَمَّا وَقَعَ عَلَيْهِمُ اُ۬لرِّجْزُ قَالُواْ يَٰمُوسَى اَ۟دْعُ لَنَا رَبَّكَ بِمَا عَهِدَ عِندَكَ لَئِن كَشَفْتَ عَنَّا اَ۬لرِّجْزَ لَنُومِنَنَّ لَكَ وَلَنُرْسِلَنَّ مَعَكَ بَنِےٓ إِسْرَآءِيلَۖ","فَلَمَّا كَشَفْنَا عَنْهُمُ اُ۬لرِّجْزَ إِلَىٰٓ أَجَلٍ هُم بَٰلِغُوهُ إِذَا هُمْ يَنكُثُونَۖ","فَانتَقَمْنَا مِنْهُمْ فَأَغْرَقْنَٰهُمْ فِے اِ۬لْيَمِّ بِأَنَّهُمْ كَذَّبُواْ بِـَٔايَٰتِنَا وَكَانُواْ عَنْهَا غَٰفِلِينَۖ","وَأَوْرَثْنَا اَ۬لْقَوْمَ اَ۬لذِينَ كَانُواْ يُسْتَضْعَفُونَ مَشَٰرِقَ اَ۬لَارْضِ وَمَغَٰرِبَهَا اَ۬لتِے بَٰرَكْنَا فِيهَاۖ وَتَمَّتْ كَلِمَةُ رَبِّكَ اَ۬لْحُسْن۪ىٰ عَلَىٰ بَنِےٓ إِسْرَآءِيلَ","بِمَا صَبَرُواْۖ وَدَمَّرْنَا مَا كَانَ يَصْنَعُ فِرْعَوْنُ وَقَوْمُهُۥ وَمَا كَانُواْ يَعْرِشُونَۖ","وَجَٰوَزْنَا بِبَنِےٓ إِسْرَآءِيلَ اَ۬لْبَحْرَ فَأَتَوْاْ عَلَىٰ قَوْمٖ يَعْكُفُونَ عَلَىٰٓ أَصْنَامٖ لَّهُمْۖ قَالُواْ يَٰمُوسَى اَ۪جْعَل لَّنَآ إِلَٰهاٗ كَمَا لَهُمُۥٓ ءَالِهَةٞۖ قَالَ إِنَّكُمْ قَوْمٞ تَجْهَلُونَۖ","إِنَّ هَٰٓؤُلَآءِ مُتَبَّرٞ مَّا هُمْ فِيهِۖ وَبَٰطِلٞ مَّا كَانُواْ يَعْمَلُونَۖ","قَالَ أَغَيْرَ اَ۬للَّهِ أَبْغِيكُمُۥٓ إِلَٰهاٗ وَهُوَ فَضَّلَكُمْ عَلَى اَ۬لْعَٰلَمِينَۖ","وَإِذَ اَنجَيْنَٰكُم مِّنَ اٰلِ فِرْعَوْنَ يَسُومُونَكُمْ سُوٓءَ اَ۬لْعَذَابِ يَقْتُلُونَ أَبْنَآءَكُمْ وَيَسْتَحْيُونَ نِسَآءَكُمْۖ وَفِے ذَٰلِكُم بَلَآءٞ مِّن رَّبِّكُمْ عَظِيمٞۖ","۞ وَوَٰعَدْنَا مُوس۪ىٰ ثَلَٰثِينَ لَيْلَةٗ وَأَتْمَمْنَٰهَا بِعَشْرٖ فَتَمَّ مِيقَٰتُ رَبِّهِۦٓ أَرْبَعِينَ لَيْلَةٗۖ وَقَالَ مُوس۪ىٰ لِأَخِيهِ هَٰرُونَ اَ۟خْلُفْنِے فِے قَوْمِے وَأَصْلِحْ وَلَا تَتَّبِعْ سَبِيلَ اَ۬لْمُفْسِدِينَۖ","وَلَمَّا جَآءَ مُوس۪ىٰ لِمِيقَٰتِنَا وَكَلَّمَهُۥ رَبُّهُۥ قَالَ رَبِّ أَرِنِےٓ أَنظُرِ اِلَيْكَۖ قَالَ لَن تَر۪يٰنِے وَلَٰكِنُ اُ۟نظُرِ اِلَى اَ۬لْجَبَلِ فَإِنِ اِ۪سْتَقَرَّ مَكَانَهُۥ فَسَوْفَ تَر۪يٰنِےۖ فَلَمَّا تَجَلّ۪ىٰ رَبُّهُۥ لِلْجَبَلِ جَعَلَهُۥ دَكّاٗ وَخَرَّ مُوس۪ىٰ صَعِقاٗۖ فَلَمَّآ أَفَاقَ قَالَ سُبْحَٰنَكَ تُبْتُ إِلَيْكَ وَأَنَآ أَوَّلُ اُ۬لْمُومِنِينَۖ","قَالَ يَٰمُوس۪ىٰٓ إِنِّے اِ۪صْطَفَيْتُكَ عَلَى اَ۬لنَّاسِ بِرِسَالَتِے وَبِكَلَٰمِے فَخُذْ مَآ ءَاتَيْتُكَ وَكُن مِّنَ اَ۬لشَّٰكِرِينَۖ","وَكَتَبْنَا لَهُۥ فِے اِ۬لَالْوَاحِ مِن كُلِّ شَےْءٖ مَّوْعِظَةٗ وَتَفْصِيلاٗ لِّكُلِّ شَےْءٖۖ فَخُذْهَا بِقُوَّةٖ وَامُرْ قَوْمَكَ يَاخُذُواْ بِأَحْسَنِهَاۖ سَأُوْرِيكُمْ دَارَ اَ۬لْفَٰسِقِينَۖ","سَأَصْرِفُ عَنَ اٰيَٰتِيَ اَ۬لذِينَ يَتَكَبَّرُونَ فِے اِ۬لَارْضِ بِغَيْرِ اِ۬لْحَقِّ وَإِنْ يَّرَوْاْ كُلَّ ءَايَةٖ لَّا يُومِنُواْ بِهَا وَإِنْ يَّرَوْاْ سَبِيلَ اَ۬لرُّشْدِ لَا يَتَّخِذُوهُ سَبِيلاٗ وَإِنْ يَّرَوْاْ سَبِيلَ اَ۬لْغَيِّ يَتَّخِذُوهُ سَبِيلاٗۖ ذَٰلِكَ بِأَنَّهُمْ كَذَّبُواْ بِـَٔايَٰتِنَا وَكَانُواْ عَنْهَا غَٰفِلِينَۖ","وَالذِينَ كَذَّبُواْ بِـَٔايَٰتِنَا وَلِقَآءِ اِ۬لَاخِرَةِ حَبِطَتَ اَعْمَٰلُهُمْ هَلْ يُجْزَوْنَ إِلَّا مَا كَانُواْ يَعْمَلُونَۖ","وَاتَّخَذَ قَوْمُ مُوس۪ىٰ مِنۢ بَعْدِهِۦ مِنْ حُلِيِّهِمْ عِجْلاٗ جَسَداٗ لَّهُۥ خُوَارٌۖ اَلَمْ يَرَوَاْ اَنَّهُۥ لَا يُكَلِّمُهُمْ وَلَا يَهْدِيهِمْ سَبِيلاًۖ اِ۪تَّخَذُوهُ وَكَانُواْ ظَٰلِمِينَۖ","۞ وَلَمَّا سُقِطَ فِےٓ أَيْدِيهِمْ وَرَأَوَاْ اَنَّهُمْ قَد ضَّلُّواْ قَالُواْ لَئِن لَّمْ يَرْحَمْنَا رَبُّنَا وَيَغْفِرْ لَنَا لَنَكُونَنَّ مِنَ اَ۬لْخَٰسِرِينَۖ","وَلَمَّا رَجَعَ مُوس۪ىٰٓ إِلَىٰ قَوْمِهِۦ غَضْبَٰنَ أَسِفاٗ قَالَ بِيسَمَا خَلَفْتُمُونِے مِنۢ بَعْدِيَۖ أَعَجِلْتُمُۥٓ أَمْرَ رَبِّكُمْۖ وَأَلْقَى اَ۬لَالْوَاحَ وَأَخَذَ بِرَأْسِ أَخِيهِ يَجُرُّهُۥٓ إِلَيْهِۖ قَالَ اَ۪بْنَ أُمَّ إِنَّ اَ۬لْقَوْمَ اَ۪سْتَضْعَفُونِے وَكَادُواْ يَقْتُلُونَنِے فَلَا تُشْمِتْ بِيَ اَ۬لَاعْدَآءَ وَلَا تَجْعَلْنِے مَعَ اَ۬لْقَوْمِ اِ۬لظَّٰلِمِينَۖ","قَالَ رَبِّ اِ۪غْفِرْ لِے وَلِأَخِے وَأَدْخِلْنَا فِے رَحْمَتِكَۖ وَأَنتَ أَرْحَمُ اُ۬لرَّٰحِمِينَۖ","إِنَّ اَ۬لذِينَ اَ۪تَّخَذُواْ اُ۬لْعِجْلَ سَيَنَالُهُمْ غَضَبٞ مِّن رَّبِّهِمْ وَذِلَّةٞ فِے اِ۬لْحَيَوٰةِ اِ۬لدُّنْي۪اۖ وَكَذَٰلِكَ نَجْزِے اِ۬لْمُفْتَرِينَۖ","وَالذِينَ عَمِلُواْ اُ۬لسَّيِّـَٔاتِ ثُمَّ تَابُواْ مِنۢ بَعْدِهَا وَءَامَنُوٓا إِنَّ رَبَّكَ مِنۢ بَعْدِهَا لَغَفُورٞ رَّحِيمٞۖ","وَلَمَّا سَكَتَ عَن مُّوسَى اَ۬لْغَضَبُ أَخَذَ اَ۬لَالْوَاحَ وَفِے نُسْخَتِهَا هُدىٗ وَرَحْمَةٞ لِّلذِينَ هُمْ لِرَبِّهِمْ يَرْهَبُونَۖ","وَاخْتَارَ مُوس۪ىٰ قَوْمَهُۥ سَبْعِينَ رَجُلاٗ لِّمِيقَٰتِنَاۖ فَلَمَّآ أَخَذَتْهُمُ اُ۬لرَّجْفَةُ قَالَ رَبِّ لَوْ شِئْتَ أَهْلَكْتَهُم مِّن قَبْلُ وَإِيَّٰيَۖ أَتُهْلِكُنَا بِمَا فَعَلَ اَ۬لسُّفَهَآءُ مِنَّآۖ إِنْ هِيَ إِلَّا فِتْنَتُكَ تُضِلُّ بِهَا مَن تَشَآءُ وَتَهْدِے مَن تَشَآءُۖ اَ۬نتَ وَلِيُّنَا فَاغْفِرْ لَنَا وَارْحَمْنَا وَأَنتَ خَيْرُ اُ۬لْغَٰفِرِينَۖ","۞ وَاكْتُبْ لَنَا فِے هَٰذِهِ اِ۬لدُّنْي۪ا حَسَنَةٗ وَفِے اِ۬لَاخِرَةِۖ إِنَّا هُدْنَآ إِلَيْكَۖ قَالَ عَذَابِيَ أُصِيبُ بِهِۦ مَنَ اَشَآءُۖ وَرَحْمَتِے وَسِعَتْ كُلَّ شَےْءٖۖ فَسَأَكْتُبُهَا لِلذِينَ يَتَّقُونَ وَيُوتُونَ اَ۬لزَّكَوٰةَ وَالذِينَ هُم بِـَٔايَٰتِنَا يُومِنُونَ","اَ۬لذِينَ يَتَّبِعُونَ اَ۬لرَّسُولَ اَ۬لنَّبِےٓءَ اَ۬لُامِّيَّ اَ۬لذِے يَجِدُونَهُۥ مَكْتُوباً عِندَهُمْ فِے اِ۬لتَّوْر۪يٰةِ وَالِانجِيلِ يَامُرُهُم بِالْمَعْرُوفِ وَيَنْه۪يٰهُمْ عَنِ اِ۬لْمُنكَرِ وَيُحِلُّ لَهُمُ اُ۬لطَّيِّبَٰتِ وَيُحَرِّمُ عَلَيْهِمُ اُ۬لْخَبَٰٓئِثَ وَيَضَعُ عَنْهُمُۥٓ إِصْرَهُمْ وَالَاغْلَٰلَ اَ۬لتِے كَانَتْ عَلَيْهِمْۖ فَالذِينَ ءَامَنُواْ بِهِۦ وَعَزَّرُوهُ وَنَصَرُوهُ وَاتَّبَعُواْ اُ۬لنُّورَ اَ۬لذِےٓ أُنزِلَ مَعَهُۥٓ أُوْلَٰٓئِكَ هُمُ اُ۬لْمُفْلِحُونَۖ","قُلْ يَٰٓأَيُّهَا اَ۬لنَّاسُ إِنِّے رَسُولُ اُ۬للَّهِ إِلَيْكُمْ جَمِيعاً اِ۬لذِے لَهُۥ مُلْكُ اُ۬لسَّمَٰوَٰتِ وَالَارْضِۖ لَآ إِلَٰهَ إِلَّا هُوَۖ يُحْيِۦ وَيُمِيتُۖ فَـَٔامِنُواْ بِاللَّهِ وَرَسُولِهِ اِ۬لنَّبِےٓءِ اِ۬لُامِّيِّ اِ۬لذِے يُومِنُ بِاللَّهِ وَكَلِمَٰتِهِۦۖ وَاتَّبِعُوهُ لَعَلَّكُمْ تَهْتَدُونَۖ","وَمِن قَوْمِ مُوس۪ىٰٓ أُمَّةٞ يَهْدُونَ بِالْحَقِّ وَبِهِۦ يَعْدِلُونَۖ","وَقَطَّعْنَٰهُمُ اُ۪ثْنَتَےْ عَشْرَةَ أَسْبَاطاً ا۟مَماٗۖ وَأَوْحَيْنَآ إِلَىٰ مُوس۪ىٰٓ إِذِ اِ۪سْتَسْق۪يٰهُ قَوْمُهُۥٓ أَنِ اِ۪ضْرِب بِّعَصَاكَ اَ۬لْحَجَرَۖ فَانۢبَجَسَتْ مِنْهُ اُ۪ثْنَتَا عَشْرَةَ عَيْناٗۖ قَدْ عَلِمَ كُلُّ أُنَاسٖ مَّشْرَبَهُمْۖ وَظَلَّلْنَا عَلَيْهِمُ اُ۬لْغَمَٰمَ وَأَنزَلْنَا عَلَيْهِمُ اُ۬لْمَنَّ وَالسَّلْو۪ىٰۖ كُلُواْ مِن طَيِّبَٰتِ مَا رَزَقْنَٰكُمْۖ وَمَا ظَلَمُونَاۖ وَلَٰكِن كَانُوٓاْ أَنفُسَهُمْ يَظْلِمُونَۖ","وَإِذْ قِيلَ لَهُمُ اُ۟سْكُنُواْ هَٰذِهِ اِ۬لْقَرْيَةَ وَكُلُواْ مِنْهَا حَيْثُ شِئْتُمْ وَقُولُواْ حِطَّةٞ وَادْخُلُواْ اُ۬لْبَابَ سُجَّداٗ تُغْفَرْ لَكُمْ خَطِيٓـَٰٔتُكُمْۖ سَنَزِيدُ اُ۬لْمُحْسِنِينَۖ","فَبَدَّلَ اَ۬لذِينَ ظَلَمُواْ مِنْهُمْ قَوْلاً غَيْرَ اَ۬لذِے قِيلَ لَهُمْ فَأَرْسَلْنَا عَلَيْهِمْ رِجْزاٗ مِّنَ اَ۬لسَّمَآءِ بِمَا كَانُواْ يَظْلِمُونَۖ","۞ وَسْـَٔلْهُمْ عَنِ اِ۬لْقَرْيَةِ اِ۬لتِے كَانَتْ حَاضِرَةَ اَ۬لْبَحْرِ إِذْ يَعْدُونَ فِے اِ۬لسَّبْتِ إِذْ تَاتِيهِمْ حِيتَانُهُمْ يَوْمَ سَبْتِهِمْ شُرَّعاٗ وَيَوْمَ لَا يَسْبِتُونَ لَا تَاتِيهِمْۖ كَذَٰلِكَ نَبْلُوهُم بِمَا كَانُواْ يَفْسُقُونَۖ","وَإِذْ قَالَتُ ا۟مَّةٞ مِّنْهُمْ لِمَ تَعِظُونَ قَوْماً اِ۬للَّهُ مُهْلِكُهُمُۥٓ أَوْ مُعَذِّبُهُمْ عَذَاباٗ شَدِيداٗۖ قَالُواْ مَعْذِرَةٌ اِلَىٰ رَبِّكُمْ وَلَعَلَّهُمْ يَتَّقُونَۖ","فَلَمَّا نَسُواْ مَا ذُكِّرُواْ بِهِۦٓ أَنجَيْنَا اَ۬لذِينَ يَنْهَوْنَ عَنِ اِ۬لسُّوٓءِ وَأَخَذْنَا اَ۬لذِينَ ظَلَمُواْ بِعَذَابِۢ بِيسِۢ بِمَا كَانُواْ يَفْسُقُونَۖ","فَلَمَّا عَتَوْاْ عَن مَّا نُهُواْ عَنْهُ قُلْنَا لَهُمْ كُونُواْ قِرَدَةً خَٰسِـِٕينَۖ","وَإِذْ تَأَذَّنَ رَبُّكَ لَيَبْعَثَنَّ عَلَيْهِمُۥٓ إِلَىٰ يَوْمِ اِ۬لْقِيَٰمَةِ مَنْ يَّسُومُهُمْ سُوٓءَ اَ۬لْعَذَابِۖ إِنَّ رَبَّكَ لَسَرِيعُ اُ۬لْعِقَابِۖ وَإِنَّهُۥ لَغَفُورٞ رَّحِيمٞۖ","وَقَطَّعْنَٰهُمْ فِے اِ۬لَارْضِ أُمَماٗۖ مِّنْهُمُ اُ۬لصَّٰلِحُونَۖ وَمِنْهُمْ دُونَ ذَٰلِكَۖ وَبَلَوْنَٰهُم بِالْحَسَنَٰتِ وَالسَّيِّـَٔاتِ لَعَلَّهُمْ يَرْجِعُونَۖ","فَخَلَفَ مِنۢ بَعْدِهِمْ خَلْفٞ وَرِثُواْ اُ۬لْكِتَٰبَ يَاخُذُونَ عَرَضَ هَٰذَا اَ۬لَادْن۪ىٰ وَيَقُولُونَ سَيُغْفَرُ لَنَا وَإِنْ يَّاتِهِمْ عَرَضٞ مِّثْلُهُۥ يَاخُذُوهُۖ أَلَمْ يُوخَذْ عَلَيْهِم مِّيثَٰقُ اُ۬لْكِتَٰبِ أَن لَّا يَقُولُواْ عَلَى اَ۬للَّهِ إِلَّا اَ۬لْحَقَّۖ وَدَرَسُواْ مَا فِيهِۖ وَالدَّارُ اُ۬لَاخِرَةُ خَيْرٞ لِّلذِينَ يَتَّقُونَۖ أَفَلَا تَعْقِلُونَۖ","وَالذِينَ يُمَسِّكُونَ بِالْكِتَٰبِ وَأَقَامُواْ اُ۬لصَّلَوٰةَ إِنَّا لَا نُضِيعُ أَجْرَ اَ۬لْمُصْلِحِينَۖ","۞ وَإِذْ نَتَقْنَا اَ۬لْجَبَلَ فَوْقَهُمْ كَأَنَّهُۥ ظُلَّةٞ وَظَنُّوٓاْ أَنَّهُۥ وَاقِعُۢ بِهِمْۖ خُذُواْ مَآ ءَاتَيْنَٰكُم بِقُوَّةٖ وَاذْكُرُواْ مَا فِيهِ لَعَلَّكُمْ تَتَّقُونَۖ","وَإِذَ اَخَذَ رَبُّكَ مِنۢ بَنِےٓ ءَادَمَ مِن ظُهُورِهِمْ ذُرِّيَّٰتِهِمْ وَأَشْهَدَهُمْ عَلَىٰٓ أَنفُسِهِمُۥٓ أَلَسْتُ بِرَبِّكُمْ قَالُواْ بَل۪ىٰۖ شَهِدْنَآ أَن تَقُولُواْ يَوْمَ اَ۬لْقِيَٰمَةِ إِنَّا كُنَّا عَنْ هَٰذَا غَٰفِلِينَ","أَوْ تَقُولُوٓاْ إِنَّمَآ أَشْرَكَ ءَابَآؤُنَا مِن قَبْلُ وَكُنَّا ذُرِّيَّةٗ مِّنۢ بَعْدِهِمُۥٓۖ أَفَتُهْلِكُنَا بِمَا فَعَلَ اَ۬لْمُبْطِلُونَۖ","وَكَذَٰلِكَ نُفَصِّلُ اُ۬لَايَٰتِ وَلَعَلَّهُمْ يَرْجِعُونَۖ","وَاتْلُ عَلَيْهِمْ نَبَأَ اَ۬لذِےٓ ءَاتَيْنَٰهُ ءَايَٰتِنَا فَانسَلَخَ مِنْهَا فَأَتْبَعَهُ اُ۬لشَّيْطَٰنُ فَكَانَ مِنَ اَ۬لْغَاوِينَۖ","وَلَوْ شِئْنَا لَرَفَعْنَٰهُ بِهَا وَلَٰكِنَّهُۥٓ أَخْلَدَ إِلَى اَ۬لَارْضِ وَاتَّبَعَ هَو۪يٰهُۖ فَمَثَلُهُۥ كَمَثَلِ اِ۬لْكَلْبِ إِن تَحْمِلْ عَلَيْهِ يَلْهَثَ اَوْ تَتْرُكْهُ يَلْهَثْۖ ذَٰلِكَ مَثَلُ اُ۬لْقَوْمِ اِ۬لذِينَ كَذَّبُواْ بِـَٔايَٰتِنَاۖ فَاقْصُصِ اِ۬لْقَصَصَ لَعَلَّهُمْ يَتَفَكَّرُونَۖ","سَآءَ مَثَلاً اِ۬لْقَوْمُ اُ۬لذِينَ كَذَّبُواْ بِـَٔايَٰتِنَا وَأَنفُسَهُمْ كَانُواْ يَظْلِمُونَۖ","مَنْ يَّهْدِ اِ۬للَّهُ فَهُوَ اَ۬لْمُهْتَدِےۖ وَمَنْ يُّضْلِلْ فَأُوْلَٰٓئِكَ هُمُ اُ۬لْخَٰسِرُونَۖ","۞ وَلَقَدْ ذَرَأْنَا لِجَهَنَّمَ كَثِيراٗ مِّنَ اَ۬لْجِنِّ وَالِانسِۖ لَهُمْ قُلُوبٞ لَّا يَفْقَهُونَ بِهَاۖ وَلَهُمُۥٓ أَعْيُنٞ لَّا يُبْصِرُونَ بِهَاۖ وَلَهُمُۥٓ ءَاذَانٞ لَّا يَسْمَعُونَ بِهَآۖ أُوْلَٰٓئِكَ كَالَانْعَٰمِ بَلْ هُمُۥٓ أَضَلُّۖ أُوْلَٰٓئِكَ هُمُ اُ۬لْغَٰفِلُونَۖ","وَلِلهِ اِ۬لَاسْمَآءُ اُ۬لْحُسْن۪ىٰ فَادْعُوهُ بِهَاۖ وَذَرُواْ اُ۬لذِينَ يُلْحِدُونَ فِےٓ أَسْمَٰٓئِهِۦۖ سَيُجْزَوْنَ مَا كَانُواْ يَعْمَلُونَۖ","وَمِمَّنْ خَلَقْنَآ أُمَّةٞ يَهْدُونَ بِالْحَقِّ وَبِهِۦ يَعْدِلُونَۖ","وَالذِينَ كَذَّبُواْ بِـَٔايَٰتِنَا سَنَسْتَدْرِجُهُم مِّنْ حَيْثُ لَا يَعْلَمُونَ","وَأُمْلِے لَهُمُۥٓۖ إِنَّ كَيْدِے مَتِينٌۖ","اَوَلَمْ يَتَفَكَّرُواْۖ مَا بِصَٰحِبِهِم مِّن جِنَّةٍۖ اِنْ هُوَ إِلَّا نَذِيرٞ مُّبِينٌۖ","اَوَلَمْ يَنظُرُواْ فِے مَلَكُوتِ اِ۬لسَّمَٰوَٰتِ وَالَارْضِ وَمَا خَلَقَ اَ۬للَّهُ مِن شَےْءٖ وَأَنْ عَس۪ىٰٓ أَنْ يَّكُونَ قَدِ اِ۪قْتَرَبَ أَجَلُهُمْۖ فَبِأَيِّ حَدِيثِۢ بَعْدَهُۥ يُومِنُونَۖ","مَنْ يُّضْلِلِ اِ۬للَّهُ فَلَا هَادِيَ لَهُۥۖ وَنَذَرُهُمْ فِے طُغْيَٰنِهِمْ يَعْمَهُونَۖ","يَسْـَٔلُونَكَ عَنِ اِ۬لسَّاعَةِ أَيَّانَ مُرْس۪يٰهَاۖ قُلِ اِنَّمَا عِلْمُهَا عِندَ رَبِّےۖ لَا يُجَلِّيهَا لِوَقْتِهَآ إِلَّا هُوَۖ ثَقُلَتْ فِے اِ۬لسَّمَٰوَٰتِ وَالَارْضِۖ لَا تَاتِيكُمُۥٓ إِلَّا بَغْتَةٗۖ يَسْـَٔلُونَكَ كَأَنَّكَ حَفِيٌّ عَنْهَاۖ قُلِ اِنَّمَا عِلْمُهَا عِندَ اَ۬للَّهِۖ وَلَٰكِنَّ أَكْثَرَ اَ۬لنَّاسِ لَا يَعْلَمُونَۖ","۞ قُل لَّآ أَمْلِكُ لِنَفْسِے نَفْعاٗ وَلَا ضَرّاً اِلَّا مَا شَآءَ اَ۬للَّهُۖ وَلَوْ كُنتُ أَعْلَمُ اُ۬لْغَيْبَ لَاسْتَكْثَرْتُ مِنَ اَ۬لْخَيْرِۖ وَمَا مَسَّنِيَ اَ۬لسُّوٓءُۖ اِ۪نَ اَنَا إِلَّا نَذِيرٞۖ وَبَشِيرٞ لِّقَوْمٖ يُومِنُونَۖ","هُوَ اَ۬لذِے خَلَقَكُم مِّن نَّفْسٖ وَٰحِدَةٖ وَجَعَلَ مِنْهَا زَوْجَهَا لِيَسْكُنَ إِلَيْهَاۖ فَلَمَّا تَغَشّ۪يٰهَا حَمَلَتْ حَمْلاً خَفِيفاٗ فَمَرَّتْ بِهِۦۖ فَلَمَّآ أَثْقَلَت دَّعَوَا اَ۬للَّهَ رَبَّهُمَا لَئِنَ اٰتَيْتَنَا صَٰلِحاٗ لَّنَكُونَنَّ مِنَ اَ۬لشَّٰكِرِينَۖ","فَلَمَّآ ءَات۪يٰهُمَا صَٰلِحاٗ جَعَلَا لَهُۥ شِرْكاٗ فِيمَآ ءَات۪يٰهُمَاۖ فَتَعَٰلَى اَ۬للَّهُ عَمَّا يُشْرِكُونَۖ","أَيُشْرِكُونَ مَا لَا يَخْلُقُ شَئْاٗ وَهُمْ يُخْلَقُونَۖ","وَلَا يَسْتَطِيعُونَ لَهُمْ نَصْراٗ وَلَآ أَنفُسَهُمْ يَنصُرُونَۖ","وَإِن تَدْعُوهُمُۥٓ إِلَى اَ۬لْهُد۪ىٰ لَا يَتْبَعُوكُمْۖ سَوَآءٌ عَلَيْكُمُۥٓ أَدَعَوْتُمُوهُمُۥٓ أَمَ اَنتُمْ صَٰمِتُونَۖ","إِنَّ اَ۬لذِينَ تَدْعُونَ مِن دُونِ اِ۬للَّهِ عِبَادٌ اَمْثَالُكُمْۖ فَادْعُوهُمْ فَلْيَسْتَجِيبُواْ لَكُمُۥٓ إِن كُنتُمْ صَٰدِقِينَۖ","أَلَهُمُۥٓ أَرْجُلٞ يَمْشُونَ بِهَآۖ أَمْ لَهُمُۥٓ أَيْدٖ يَبْطِشُونَ بِهَآۖ أَمْ لَهُمُۥٓ أَعْيُنٞ يُبْصِرُونَ بِهَآۖ أَمْ لَهُمُۥٓ ءَاذَانٞ يَسْمَعُونَ بِهَاۖ قُلُ اُ۟دْعُواْ شُرَكَآءَكُمْ ثُمَّ كِيدُونِ فَلَا تُنظِرُونِۖ","إِنَّ وَلِيِّيَ اَ۬للَّهُ اُ۬لذِے نَزَّلَ اَ۬لْكِتَٰبَۖ وَهُوَ يَتَوَلَّى اَ۬لصَّٰلِحِينَۖ","وَالذِينَ تَدْعُونَ مِن دُونِهِۦ لَا يَسْتَطِيعُونَ نَصْرَكُمْ وَلَآ أَنفُسَهُمْ يَنصُرُونَۖ","وَإِن تَدْعُوهُمُۥٓ إِلَى اَ۬لْهُد۪ىٰ لَا يَسْمَعُواْۖ وَتَر۪يٰهُمْ يَنظُرُونَ إِلَيْكَ وَهُمْ لَا يُبْصِرُونَۖ","خُذِ اِ۬لْعَفْوَۖ وَامُرْ بِالْعُرْفِۖ وَأَعْرِضْ عَنِ اِ۬لْجَٰهِلِينَۖ","۞ وَإِمَّا يَنزَغَنَّكَ مِنَ اَ۬لشَّيْطَٰنِ نَزْغٞ فَاسْتَعِذْ بِاللَّهِۖ إِنَّهُۥ سَمِيعٌ عَلِيمٌۖ","اِنَّ اَ۬لذِينَ اَ۪تَّقَوِاْ اِذَا مَسَّهُمْ طَٰٓئِفٞ مِّنَ اَ۬لشَّيْطَٰنِ تَذَكَّرُواْ فَإِذَا هُم مُّبْصِرُونَۖ","وَإِخْوَٰنُهُمْ يُمِدُّونَهُمْ فِے اِ۬لْغَيِّۖ ثُمَّ لَا يُقْصِرُونَۖ","وَإِذَا لَمْ تَاتِهِم بِـَٔايَةٖ قَالُواْ لَوْلَا اَ۪جْتَبَيْتَهَاۖ قُلِ اِنَّمَآ أَتَّبِعُ مَا يُوح۪ىٰٓ إِلَيَّ مِن رَّبِّےۖ هَٰذَا بَصَآئِرُ مِن رَّبِّكُمْ وَهُدىٗ وَرَحْمَةٞ لِّقَوْمٖ يُومِنُونَۖ","وَإِذَا قُرِۓَ اَ۬لْقُرْءَانُ فَاسْتَمِعُواْ لَهُۥ وَأَنصِتُواْ لَعَلَّكُمْ تُرْحَمُونَۖ","وَاذْكُر رَّبَّكَ فِے نَفْسِكَ تَضَرُّعاٗ وَخِيفَةٗ وَدُونَ اَ۬لْجَهْرِ مِنَ اَ۬لْقَوْلِ بِالْغُدُوِّ وَالَاصَالِ وَلَا تَكُن مِّنَ اَ۬لْغَٰفِلِينَۖ","إِنَّ اَ۬لذِينَ عِندَ رَبِّكَ لَا يَسْتَكْبِرُونَ عَنْ عِبَادَتِهِۦ وَيُسَبِّحُونَهُۥ وَلَهُۥ يَسْجُدُونَۖ۩"]],["الأنفال",["يَسْـَٔلُونَكَ عَنِ اِ۬لَانفَالِۖ قُلِ اِ۬لَانفَالُ لِلهِ وَالرَّسُولِۖ فَاتَّقُواْ اُ۬للَّهَ وَأَصْلِحُواْ ذَاتَ بَيْنِكُمْۖ وَأَطِيعُواْ اُ۬للَّهَ وَرَسُولَهُۥٓ إِن كُنتُم مُّومِنِينَۖ","إِنَّمَا اَ۬لْمُومِنُونَ اَ۬لذِينَ إِذَا ذُكِرَ اَ۬للَّهُ وَجِلَتْ قُلُوبُهُمْ وَإِذَا تُلِيَتْ عَلَيْهِمُۥٓ ءَايَٰتُهُۥ زَادَتْهُمُۥٓ إِيمَٰناٗ وَعَلَىٰ رَبِّهِمْ يَتَوَكَّلُونَۖ","اَ۬لذِينَ يُقِيمُونَ اَ۬لصَّلَوٰةَ وَمِمَّا رَزَقْنَٰهُمْ يُنفِقُونَ","أُوْلَٰٓئِكَ هُمُ اُ۬لْمُومِنُونَ حَقّاٗۖ لَّهُمْ دَرَجَٰتٌ عِندَ رَبِّهِمْ وَمَغْفِرَةٞ وَرِزْقٞ كَرِيمٞۖ","۞ كَمَآ أَخْرَجَكَ رَبُّكَ مِنۢ بَيْتِكَ بِالْحَقِّ وَإِنَّ فَرِيقاٗ مِّنَ اَ۬لْمُومِنِينَ لَكَٰرِهُونَ","يُجَٰدِلُونَكَ فِے اِ۬لْحَقِّ بَعْدَ مَا تَبَيَّنَ كَأَنَّمَا يُسَاقُونَ إِلَى اَ۬لْمَوْتِ وَهُمْ يَنظُرُونَۖ","وَإِذْ يَعِدُكُمُ اُ۬للَّهُ إِحْدَى اَ۬لطَّآئِفَتَيْنِ أَنَّهَا لَكُمْ وَتَوَدُّونَ أَنَّ غَيْرَ ذَاتِ اِ۬لشَّوْكَةِ تَكُونُ لَكُمْۖ وَيُرِيدُ اُ۬للَّهُ أَنْ يُّحِقَّ اَ۬لْحَقَّ بِكَلِمَٰتِهِۦ وَيَقْطَعَ دَابِرَ اَ۬لْكٰ۪فِرِينَ","لِيُحِقَّ اَ۬لْحَقَّ وَيُبْطِلَ اَ۬لْبَٰطِلَ وَلَوْ كَرِهَ اَ۬لْمُجْرِمُونَۖ","إِذْ تَسْتَغِيثُونَ رَبَّكُمْ فَاسْتَجَابَ لَكُمُۥٓ أَنِّے مُمِدُّكُم بِأَلْفٖ مِّنَ اَ۬لْمَلَٰٓئِكَةِ مُرْدَفِينَۖ","وَمَا جَعَلَهُ اُ۬للَّهُ إِلَّا بُشْر۪ىٰ وَلِتَطْمَئِنَّ بِهِۦ قُلُوبُكُمْۖ وَمَا اَ۬لنَّصْرُ إِلَّا مِنْ عِندِ اِ۬للَّهِۖ إِنَّ اَ۬للَّهَ عَزِيزٌ حَكِيمٌۖ","اِذْ يُغْشِيكُمُ اُ۬لنُّعَاسَ أَمَنَةٗ مِّنْهُ وَيُنَزِّلُ عَلَيْكُم مِّنَ اَ۬لسَّمَآءِ مَآءٗ لِّيُطَهِّرَكُم بِهِۦ وَيُذْهِبَ عَنكُمْ رِجْزَ اَ۬لشَّيْطَٰنِ وَلِيَرْبِطَ عَلَىٰ قُلُوبِكُمْ وَيُثَبِّتَ بِهِ اِ۬لَاقْدَامَۖ","إِذْ يُوحِے رَبُّكَ إِلَى اَ۬لْمَلَٰٓئِكَةِ أَنِّے مَعَكُمْ فَثَبِّتُواْ اُ۬لذِينَ ءَامَنُواْۖ سَأُلْقِے فِے قُلُوبِ اِ۬لذِينَ كَفَرُواْ اُ۬لرُّعْبَۖ فَاضْرِبُواْ فَوْقَ اَ۬لَاعْنَاقِ وَاضْرِبُواْ مِنْهُمْ كُلَّ بَنَانٖۖ","ذَٰلِكَ بِأَنَّهُمْ شَآقُّواْ اُ۬للَّهَ وَرَسُولَهُۥۖ وَمَنْ يُّشَاقِقِ اِ۬للَّهَ وَرَسُولَهُۥ فَإِنَّ اَ۬للَّهَ شَدِيدُ اُ۬لْعِقَابِۖ","ذَٰلِكُمْ فَذُوقُوهُۖ وَأَنَّ لِلْكٰ۪فِرِينَ عَذَابَ اَ۬لنّ۪ارِۖ","۞ يَٰٓأَيُّهَا اَ۬لذِينَ ءَامَنُوٓاْ إِذَا لَقِيتُمُ اُ۬لذِينَ كَفَرُواْ زَحْفاٗ فَلَا تُوَلُّوهُمُ اُ۬لَادْبَٰرَۖ","وَمَنْ يُّوَلِّهِمْ يَوْمَئِذٖ دُبُرَهُۥٓ إِلَّا مُتَحَرِّفاٗ لِّقِتَالٍ اَوْ مُتَحَيِّزاً اِلَىٰ فِئَةٖ فَقَدْ بَآءَ بِغَضَبٖ مِّنَ اَ۬للَّهِ وَمَأْو۪يٰهُ جَهَنَّمُۖ وَبِيسَ اَ۬لْمَصِيرُۖ","فَلَمْ تَقْتُلُوهُمْۖ وَلَٰكِنَّ اَ۬للَّهَ قَتَلَهُمْۖ وَمَا رَمَيْتَ إِذْ رَمَيْتَ وَلَٰكِنَّ اَ۬للَّهَ رَم۪ىٰۖ وَلِيُبْلِيَ اَ۬لْمُومِنِينَ مِنْهُ بَلَآءً حَسَناًۖ اِنَّ اَ۬للَّهَ سَمِيعٌ عَلِيمٞۖ","ذَٰلِكُمْ وَأَنَّ اَ۬للَّهَ مُوَهِّنٞ كَيْدَ اَ۬لْكٰ۪فِرِينَۖ","إِن تَسْتَفْتِحُواْ فَقَدْ جَآءَكُمُ اُ۬لْفَتْحُۖ وَإِن تَنتَهُواْ فَهُوَ خَيْرٞ لَّكُمْۖ وَإِن تَعُودُواْ نَعُدْۖ وَلَن تُغْنِيَ عَنكُمْ فِئَتُكُمْ شَئْاٗ وَلَوْ كَثُرَتْۖ وَأَنَّ اَ۬للَّهَ مَعَ اَ۬لْمُومِنِينَۖ","يَٰٓأَيُّهَا اَ۬لذِينَ ءَامَنُوٓاْ أَطِيعُواْ اُ۬للَّهَ وَرَسُولَهُۥۖ وَلَا تَوَلَّوْاْ عَنْهُ وَأَنتُمْ تَسْمَعُونَۖ","وَلَا تَكُونُواْ كَالذِينَ قَالُواْ سَمِعْنَا وَهُمْ لَا يَسْمَعُونَۖ","۞ إِنَّ شَرَّ اَ۬لدَّوَآبِّ عِندَ اَ۬للَّهِ اِ۬لصُّمُّ اُ۬لْبُكْمُ اُ۬لذِينَ لَا يَعْقِلُونَۖ","وَلَوْ عَلِمَ اَ۬للَّهُ فِيهِمْ خَيْراٗ لَّأَسْمَعَهُمْۖ وَلَوَ اَسْمَعَهُمْ لَتَوَلَّواْ وَّهُم مُّعْرِضُونَۖ","يَٰٓأَيُّهَا اَ۬لذِينَ ءَامَنُواْ اُ۪سْتَجِيبُواْ لِلهِ وَلِلرَّسُولِ إِذَا دَعَاكُمْ لِمَا يُحْيِيكُمْۖ وَاعْلَمُوٓاْ أَنَّ اَ۬للَّهَ يَحُولُ بَيْنَ اَ۬لْمَرْءِ وَقَلْبِهِۦ وَأَنَّهُۥٓ إِلَيْهِ تُحْشَرُونَۖ","وَاتَّقُواْ فِتْنَةٗ لَّا تُصِيبَنَّ اَ۬لذِينَ ظَلَمُواْ مِنكُمْ خَآصَّةٗۖ وَاعْلَمُوٓاْ أَنَّ اَ۬للَّهَ شَدِيدُ اُ۬لْعِقَابِۖ","وَاذْكُرُوٓاْ إِذَ اَنتُمْ قَلِيلٞ مُّسْتَضْعَفُونَ فِے اِ۬لَارْضِ تَخَافُونَ أَنْ يَّتَخَطَّفَكُمُ اُ۬لنَّاسُ فَـَٔاو۪يٰكُمْ وَأَيَّدَكُم بِنَصْرِهِۦ وَرَزَقَكُم مِّنَ اَ۬لطَّيِّبَٰتِ لَعَلَّكُمْ تَشْكُرُونَۖ","يَٰٓأَيُّهَا اَ۬لذِينَ ءَامَنُواْ لَا تَخُونُواْ اُ۬للَّهَ وَالرَّسُولَ وَتَخُونُوٓاْ أَمَٰنَٰتِكُمْ وَأَنتُمْ تَعْلَمُونَۖ","وَاعْلَمُوٓاْ أَنَّمَآ أَمْوَٰلُكُمْ وَأَوْلَٰدُكُمْ فِتْنَةٞ وَأَنَّ اَ۬للَّهَ عِندَهُۥٓ أَجْرٌ عَظِيمٞۖ","يَٰٓأَيُّهَا اَ۬لذِينَ ءَامَنُوٓاْ إِن تَتَّقُواْ اُ۬للَّهَ يَجْعَل لَّكُمْ فُرْقَاناٗ وَيُكَفِّرْ عَنكُمْ سَيِّـَٔاتِكُمْ وَيَغْفِرْ لَكُمْۖ وَاللَّهُ ذُو اُ۬لْفَضْلِ اِ۬لْعَظِيمِۖ","وَإِذْ يَمْكُرُ بِكَ اَ۬لذِينَ كَفَرُواْ لِيُثْبِتُوكَ أَوْ يَقْتُلُوكَ أَوْ يُخْرِجُوكَۖ وَيَمْكُرُونَ وَيَمْكُرُ اُ۬للَّهُۖ وَاللَّهُ خَيْرُ اُ۬لْمَٰكِرِينَۖ","۞ وَإِذَا تُتْل۪ىٰ عَلَيْهِمُۥٓ ءَايَٰتُنَا قَالُواْ قَدْ سَمِعْنَا لَوْ نَشَآءُ لَقُلْنَا مِثْلَ هَٰذَآ إِنْ هَٰذَآ إِلَّآ أَسَٰطِيرُ اُ۬لَاوَّلِينَۖ","وَإِذْ قَالُواْ اُ۬للَّهُمَّ إِن كَانَ هَٰذَا هُوَ اَ۬لْحَقَّ مِنْ عِنْدِكَ فَأَمْطِرْ عَلَيْنَا حِجَارَةٗ مِّنَ اَ۬لسَّمَآءِ اَ۬وِ اِ۪يتِنَا بِعَذَابٍ اَلِيمٖۖ","وَمَا كَانَ اَ۬للَّهُ لِيُعَذِّبَهُمْ وَأَنتَ فِيهِمْۖ وَمَا كَانَ اَ۬للَّهُ مُعَذِّبَهُمْ وَهُمْ يَسْتَغْفِرُونَۖ","وَمَا لَهُمُۥٓ أَلَّا يُعَذِّبَهُمُ اُ۬للَّهُ وَهُمْ يَصُدُّونَ عَنِ اِ۬لْمَسْجِدِ اِ۬لْحَرَامِ وَمَا كَانُوٓاْ أَوْلِيَآءَهُۥٓۖ إِنَ اَوْلِيَآؤُهُۥٓ إِلَّا اَ۬لْمُتَّقُونَۖ وَلَٰكِنَّ أَكْثَرَهُمْ لَا يَعْلَمُونَۖ","وَمَا كَانَ صَلَاتُهُمْ عِندَ اَ۬لْبَيْتِ إِلَّا مُكَآءٗ وَتَصْدِيَةٗۖ فَذُوقُواْ اُ۬لْعَذَابَ بِمَا كُنتُمْ تَكْفُرُونَۖ","إِنَّ اَ۬لذِينَ كَفَرُواْ يُنفِقُونَ أَمْوَٰلَهُمْ لِيَصُدُّواْ عَن سَبِيلِ اِ۬للَّهِۖ فَسَيُنفِقُونَهَا ثُمَّ تَكُونُ عَلَيْهِمْ حَسْرَةٗ ثُمَّ يُغْلَبُونَۖ وَالذِينَ كَفَرُوٓاْ إِلَىٰ جَهَنَّمَ يُحْشَرُونَ","لِيَمِيزَ اَ۬للَّهُ اُ۬لْخَبِيثَ مِنَ اَ۬لطَّيِّبِ وَيَجْعَلَ اَ۬لْخَبِيثَ بَعْضَهُۥ عَلَىٰ بَعْضٖ فَيَرْكُمَهُۥ جَمِيعاٗ فَيَجْعَلَهُۥ فِے جَهَنَّمَۖ أُوْلَٰٓئِكَ هُمُ اُ۬لْخَٰسِرُونَۖ","قُل لِّلذِينَ كَفَرُوٓاْ إِنْ يَّنتَهُواْ يُغْفَرْ لَهُم مَّا قَدْ سَلَفَۖ وَإِنْ يَّعُودُواْ فَقَدْ مَضَتْ سُنَّتُ اُ۬لَاوَّلِينَۖ","وَقَٰتِلُوهُمْ حَتَّىٰ لَا تَكُونَ فِتْنَةٞ وَيَكُونَ اَ۬لدِّينُ كُلُّهُۥ لِلهِۖ فَإِنِ اِ۪نتَهَوْاْ فَإِنَّ اَ۬للَّهَ بِمَا يَعْمَلُونَ بَصِيرٞۖ","وَإِن تَوَلَّوْاْ فَاعْلَمُوٓاْ أَنَّ اَ۬للَّهَ مَوْل۪يٰكُمْۖ نِعْمَ اَ۬لْمَوْل۪ىٰۖ وَنِعْمَ اَ۬لنَّصِيرُۖ","۞ وَاعْلَمُوٓاْ أَنَّمَا غَنِمْتُم مِّن شَےْءٖ فَأَنَّ لِلهِ خُمُسَهُۥ وَلِلرَّسُولِ وَلِذِے اِ۬لْقُرْب۪ىٰ وَالْيَتَٰم۪ىٰ وَالْمَسَٰكِينِ وَابْنِ اِ۬لسَّبِيلِ إِن كُنتُمُۥٓ ءَامَنتُم بِاللَّهِ وَمَآ أَنزَلْنَا عَلَىٰ عَبْدِنَا يَوْمَ اَ۬لْفُرْقَانِ يَوْمَ اَ۪لْتَقَى اَ۬لْجَمْعَٰنِۖ وَاللَّهُ عَلَىٰ كُلِّ شَےْءٖ قَدِيرٌۖ","اِذَ اَنتُم بِالْعُدْوَةِ اِ۬لدُّنْي۪ا وَهُم بِالْعُدْوَةِ اِ۬لْقُصْو۪ىٰ وَالرَّكْبُ أَسْفَلَ مِنكُمْۖ وَلَوْ تَوَاعَدتُّمْ لَاخْتَلَفْتُمْ فِے اِ۬لْمِيعَٰدِۖ وَلَٰكِن لِّيَقْضِيَ اَ۬للَّهُ أَمْراٗ كَانَ مَفْعُولاٗ","لِّيَهْلِكَ مَنْ هَلَكَ عَنۢ بَيِّنَةٖ وَيَحْي۪ىٰ مَنْ حَيِيَ عَنۢ بَيِّنَةٖۖ وَإِنَّ اَ۬للَّهَ لَسَمِيعٌ عَلِيمٌۖ","اِذْ يُرِيكَهُمُ اُ۬للَّهُ فِے مَنَامِكَ قَلِيلاٗۖ وَلَوَ اَر۪يٰكَهُمْ كَثِيراٗ لَّفَشِلْتُمْ وَلَتَنَٰزَعْتُمْ فِے اِ۬لَامْرِۖ وَلَٰكِنَّ اَ۬للَّهَ سَلَّمَۖ إِنَّهُۥ عَلِيمُۢ بِذَاتِ اِ۬لصُّدُورِۖ","وَإِذْ يُرِيكُمُوهُمُۥٓ إِذِ اِ۪لْتَقَيْتُمْ فِےٓ أَعْيُنِكُمْ قَلِيلاٗ وَيُقَلِّلُكُمْ فِےٓ أَعْيُنِهِمْ لِيَقْضِيَ اَ۬للَّهُ أَمْراٗ كَانَ مَفْعُولاٗۖ وَإِلَى اَ۬للَّهِ تُرْجَعُ اُ۬لُامُورُۖ","يَٰٓأَيُّهَا اَ۬لذِينَ ءَامَنُوٓاْ إِذَا لَقِيتُمْ فِئَةٗ فَاثْبُتُواْ وَاذْكُرُواْ اُ۬للَّهَ كَثِيراٗ لَّعَلَّكُمْ تُفْلِحُونَۖ","وَأَطِيعُواْ اُ۬للَّهَ وَرَسُولَهُۥۖ وَلَا تَنَٰزَعُواْ فَتَفْشَلُواْ وَتَذْهَبَ رِيحُكُمْۖ وَاصْبِرُوٓاْۖ إِنَّ اَ۬للَّهَ مَعَ اَ۬لصَّٰبِرِينَۖ","وَلَا تَكُونُواْ كَالذِينَ خَرَجُواْ مِن دِيٰ۪رِهِم بَطَراٗ وَرِئَآءَ اَ۬لنَّاسِ وَيَصُدُّونَ عَن سَبِيلِ اِ۬للَّهِۖ وَاللَّهُ بِمَا يَعْمَلُونَ مُحِيطٞۖ","۞ وَإِذْ زَيَّنَ لَهُمُ اُ۬لشَّيْطَٰنُ أَعْمَٰلَهُمْ وَقَالَ لَا غَالِبَ لَكُمُ اُ۬لْيَوْمَ مِنَ اَ۬لنَّاسِ وَإِنِّے جَارٞ لَّكُمْۖ فَلَمَّا تَرَآءَتِ اِ۬لْفِئَتَٰنِ نَكَصَ عَلَىٰ عَقِبَيْهِ وَقَالَ إِنِّے بَرِےٓءٞ مِّنكُمُۥٓ إِنِّيَ أَر۪ىٰ مَا لَا تَرَوْنَ إِنِّيَ أَخَافُ اُ۬للَّهَۖ وَاللَّهُ شَدِيدُ اُ۬لْعِقَابِۖ","إِذْ يَقُولُ اُ۬لْمُنَٰفِقُونَ وَالذِينَ فِے قُلُوبِهِم مَّرَضٌ غَرَّ هَٰٓؤُلَآءِ دِينُهُمْۖ وَمَنْ يَّتَوَكَّلْ عَلَى اَ۬للَّهِ فَإِنَّ اَ۬للَّهَ عَزِيزٌ حَكِيمٞۖ","وَلَوْ تَر۪ىٰٓ إِذْ يَتَوَفَّى اَ۬لذِينَ كَفَرُواْۖ اُ۬لْمَلَٰٓئِكَةُ يَضْرِبُونَ وُجُوهَهُمْ وَأَدْبَٰرَهُمْ وَذُوقُواْ عَذَابَ اَ۬لْحَرِيقِۖ","ذَٰلِكَ بِمَا قَدَّمَتَ اَيْدِيكُمْ وَأَنَّ اَ۬للَّهَ لَيْسَ بِظَلَّٰمٖ لِّلْعَبِيدِۖ","كَدَأْبِ ءَالِ فِرْعَوْنَۖ وَالذِينَ مِن قَبْلِهِمْ كَفَرُواْ بِـَٔايَٰتِ اِ۬للَّهِ فَأَخَذَهُمُ اُ۬للَّهُ بِذُنُوبِهِمُۥٓۖ إِنَّ اَ۬للَّهَ قَوِيّٞ شَدِيدُ اُ۬لْعِقَابِۖ","ذَٰلِكَ بِأَنَّ اَ۬للَّهَ لَمْ يَكُ مُغَيِّراٗ نِّعْمَةً اَنْعَمَهَا عَلَىٰ قَوْمٍ حَتَّىٰ يُغَيِّرُواْ مَا بِأَنفُسِهِمْ وَأَنَّ اَ۬للَّهَ سَمِيعٌ عَلِيمٞۖ","كَدَأْبِ ءَالِ فِرْعَوْنَۖ وَالذِينَ مِن قَبْلِهِمْ كَذَّبُواْ بِـَٔايَٰتِ رَبِّهِمْ فَأَهْلَكْنَٰهُم بِذُنُوبِهِمْۖ وأَغْرَقْنَآ ءَالَ فِرْعَوْنَۖ وَكُلّٞ كَانُواْ ظَٰلِمِينَۖ","إِنَّ شَرَّ اَ۬لدَّوَآبِّ عِندَ اَ۬للَّهِ اِ۬لذِينَ كَفَرُواْ فَهُمْ لَا يُومِنُونَ","اَ۬لذِينَ عَٰهَدتَّ مِنْهُمْ ثُمَّ يَنقُضُونَ عَهْدَهُمْ فِے كُلِّ مَرَّةٖ وَهُمْ لَا يَتَّقُونَۖ","فَإِمَّا تَثْقَفَنَّهُمْ فِے اِ۬لْحَرْبِ فَشَرِّدْ بِهِم مَّنْ خَلْفَهُمْ لَعَلَّهُمْ يَذَّكَّرُونَۖ","وَإِمَّا تَخَافَنَّ مِن قَوْمٍ خِيَانَةٗ فَانۢبِذِ اِلَيْهِمْ عَلَىٰ سَوَآءٍۖ اِنَّ اَ۬للَّهَ لَا يُحِبُّ اُ۬لْخَآئِنِينَۖ","وَلَا تَحْسِبَنَّ اَ۬لذِينَ كَفَرُواْ سَبَقُوٓاْۖ إِنَّهُمْ لَا يُعْجِزُونَۖ","۞ وَأَعِدُّواْ لَهُم مَّا اَ۪سْتَطَعْتُم مِّن قُوَّةٖ وَمِن رِّبَاطِ اِ۬لْخَيْلِۖ تُرْهِبُونَ بِهِۦ عَدُوَّ اَ۬للَّهِ وَعَدُوَّكُمْ وَءَاخَرِينَ مِن دُونِهِمْ لَا تَعْلَمُونَهُمُۖ اُ۬للَّهُ يَعْلَمُهُمْۖ وَمَا تُنفِقُواْ مِن شَےْءٖ فِے سَبِيلِ اِ۬للَّهِ يُوَفَّ إِلَيْكُمْ وَأَنتُمْ لَا تُظْلَمُونَۖ","وَإِن جَنَحُواْ لِلسَّلْمِ فَاجْنَحْ لَهَا وَتَوَكَّلْ عَلَى اَ۬للَّهِۖ إِنَّهُۥ هُوَ اَ۬لسَّمِيعُ اُ۬لْعَلِيمُۖ","وَإِنْ يُّرِيدُوٓاْ أَنْ يَّخْدَعُوكَ فَإِنَّ حَسْبَكَ اَ۬للَّهُۖ هُوَ اَ۬لذِےٓ أَيَّدَكَ بِنَصْرِهِۦ وَبِالْمُومِنِينَ","وَأَلَّفَ بَيْنَ قُلُوبِهِمْۖ لَوَ اَنفَقْتَ مَا فِے اِ۬لَارْضِ جَمِيعاٗ مَّآ أَلَّفْتَ بَيْنَ قُلُوبِهِمْۖ وَلَٰكِنَّ اَ۬للَّهَ أَلَّفَ بَيْنَهُمُۥٓۖ إِنَّهُۥ عَزِيزٌ حَكِيمٞۖ","يَٰٓأَيُّهَا‏ اَ۬لنَّبِےٓءُ حَسْبُكَ اَ۬للَّهُۖ وَمَنِ اِ۪تَّبَعَكَ مِنَ اَ۬لْمُومِنِينَۖ","يَٰٓأَيُّهَا‏ اَ۬لنَّبِےٓءُ حَرِّضِ اِ۬لْمُومِنِينَ عَلَى اَ۬لْقِتَالِۖ إِنْ يَّكُن مِّنكُمْ عِشْرُونَ صَٰبِرُونَ يَغْلِبُواْ مِاْئَتَيْنِۖ وَإِن تَكُن مِّنكُم مِّاْئَةٞ يَغْلِبُوٓاْ أَلْفاٗ مِّنَ اَ۬لذِينَ كَفَرُواْ بِأَنَّهُمْ قَوْمٞ لَّا يَفْقَهُونَۖ","اَ۬لَٰنَ خَفَّفَ اَ۬للَّهُ عَنكُمْ وَعَلِمَ أَنَّ فِيكُمْ ضُعْفاٗۖ فَإِن تَكُن مِّنكُم مِّاْئَةٞ صَابِرَةٞ يَغْلِبُواْ مِاْئَتَيْنِۖ وَإِنْ يَّكُن مِّنكُمُۥٓ أَلْفٞ يَغْلِبُوٓاْ أَلْفَيْنِ بِإِذْنِ اِ۬للَّهِۖ وَاللَّهُ مَعَ اَ۬لصَّٰبِرِينَۖ","مَا كَانَ لِنَبِےٓءٍ اَنْ يَّكُونَ لَهُۥٓ أَسْر۪ىٰ حَتَّىٰ يُثْخِنَ فِے اِ۬لَارْضِۖ تُرِيدُونَ عَرَضَ اَ۬لدُّنْي۪اۖ وَاللَّهُ يُرِيدُ اُ۬لَاخِرَةَۖ وَاللَّهُ عَزِيزٌ حَكِيمٞۖ","لَّوْلَا كِتَٰبٞ مِّنَ اَ۬للَّهِ سَبَقَ لَمَسَّكُمْ فِيمَآ أَخَذتُّمْ عَذَابٌ عَظِيمٞۖ","فَكُلُواْ مِمَّا غَنِمْتُمْ حَلَٰلاٗ طَيِّباٗۖ وَاتَّقُواْ اُ۬للَّهَۖ إِنَّ اَ۬للَّهَ غَفُورٞ رَّحِيمٞۖ","يَٰٓأَيُّهَا‏ اَ۬لنَّبِےٓءُ قُل لِّمَن فِےٓ أَيْدِيكُم مِّنَ اَ۬لَاسْر۪ىٰٓ إِنْ يَّعْلَمِ اِ۬للَّهُ فِے قُلُوبِكُمْ خَيْراٗ يُوتِكُمْ خَيْراٗ مِّمَّآ أُخِذَ مِنكُمْ وَيَغْفِرْ لَكُمْۖ وَاللَّهُ غَفُورٞ رَّحِيمٞۖ","۞ وَإِنْ يُّرِيدُواْ خِيَانَتَكَ فَقَدْ خَانُواْ اُ۬للَّهَ مِن قَبْلُ فَأَمْكَنَ مِنْهُمْۖ وَاللَّهُ عَلِيمٌ حَكِيمٌۖ","اِنَّ اَ۬لذِينَ ءَامَنُواْ وَهَاجَرُواْ وَجَٰهَدُواْ بِأَمْوَٰلِهِمْ وَأَنفُسِهِمْ فِے سَبِيلِ اِ۬للَّهِ وَالذِينَ ءَاوَواْ وَّنَصَرُوٓاْ أُوْلَٰٓئِكَ بَعْضُهُمُۥٓ أَوْلِيَآءُ بَعْضٖۖ وَالذ
