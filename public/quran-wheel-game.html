َ أُوتُواْ اُ۬لْكِتَٰبَ وَيَزْدَادَ اَ۬لذِينَ ءَامَنُوٓاْ إِيمَٰناٗ وَلَا يَرْتَابَ اَ۬لذِينَ أُوتُواْ اُ۬لْكِتَٰبَ وَالْمُومِنُونَ وَلِيَقُولَ اَ۬لذِينَ فِے قُلُوبِهِم مَّرَضٞ وَالْكَٰفِرُونَ مَاذَآ أَرَادَ اَ۬للَّهُ بِهَٰذَا مَثَلاٗۖ كَذَٰلِكَ يُضِلُّ اُ۬للَّهُ مَنْ يَّشَآءُ وَيَهْدِے مَنْ يَّشَآءُۖ وَمَا يَعْلَمُ جُنُودَ رَبِّكَ إِلَّا هُوَۖ وَمَا هِيَ إِلَّا ذِكْر۪ىٰ لِلْبَشَرِۖ","كَلَّا وَالْقَمَرِ","وَاليْلِ إِذَ اَدْبَرَ","وَالصُّبْحِ إِذَآ أَسْفَرَ","إِنَّهَا لَإِحْدَى اَ۬لْكُبَرِ","نَذِيراٗ لِّلْبَشَرِ","لِمَن شَآءَ مِنكُمُۥٓ أَنْ يَّتَقَدَّمَ أَوْ يَتَأَخَّرَۖ","كُلُّ نَفْسِۢ بِمَا كَسَبَتْ رَهِينَةٌ","اِلَّآ أَصْحَٰبَ اَ۬لْيَمِينِۖ","فِے جَنَّٰتٖ يَتَسَآءَلُونَ عَنِ اِ۬لْمُجْرِمِينَ","مَا سَلَكَكُمْ فِے سَقَرَۖ","قَالُواْ لَمْ نَكُ مِنَ اَ۬لْمُصَلِّينَ","وَلَمْ نَكُ نُطْعِمُ اُ۬لْمِسْكِينَ","وَكُنَّا نَخُوضُ مَعَ اَ۬لْخَآئِضِينَ","وَكُنَّا نُكَذِّبُ بِيَوْمِ اِ۬لدِّينِ","حَتَّىٰٓ أَت۪يٰنَا اَ۬لْيَقِينُۖ","فَمَا تَنفَعُهُمْ شَفَٰعَةُ اُ۬لشَّٰفِعِينَۖ","فَمَا لَهُمْ عَنِ اِ۬لتَّذْكِرَةِ مُعْرِضِينَ","كَأَنَّهُمْ حُمُرٞ مُّسْتَنفَرَةٞ","فَرَّتْ مِن قَسْوَرَةِۢۖ","بَلْ يُرِيدُ كُلُّ اُ۪مْرِےٕٖ مِّنْهُمُۥٓ أَنْ يُّوت۪ىٰ صُحُفاٗ مُّنَشَّرَةٗۖ","كَلَّا بَل لَّا يَخَافُونَ اَ۬لَاخِرَةَۖ","كَلَّآ إِنَّهُۥ تَذْكِرَةٞۖ","فَمَن شَآءَ ذَكَرَهُۥۖ","وَمَا تَذْكُرُونَ إِلَّآ أَنْ يَّشَآءَ اَ۬للَّهُۖ هُوَ أَهْلُ اُ۬لتَّقْو۪ىٰ وَأَهْلُ اُ۬لْمَغْفِرَةِۖ"]],["القيامة",["لَآ أُقْسِمُ بِيَوْمِ اِ۬لْقِيَٰمَةِ","وَلَآ أُقْسِمُ بِالنَّفْسِ اِ۬للَّوَّامَةِۖ","أَيَحْسِبُ اُ۬لِانسَٰنُ أَلَّن نَّجْمَعَ عِظَامَهُۥ","بَل۪ىٰۖ قَٰدِرِينَ عَلَىٰٓ أَن نُّسَوِّيَ بَنَانَهُۥۖ","بَلْ يُرِيدُ اُ۬لِانسَٰنُ لِيَفْجُرَ أَمَامَهُۥۖ","يَسْـَٔلُ أَيَّانَ يَوْمُ اُ۬لْقِيَٰمَةِۖ","فَإِذَا بَرَقَ اَ۬لْبَصَرُ","وَخَسَفَ اَ۬لْقَمَرُ","وَجُمِعَ اَ۬لشَّمْسُ وَالْقَمَرُ","يَقُولُ اُ۬لِانسَٰنُ يَوْمَئِذٍ اَيْنَ اَ۬لْمَفَرُّۖ","كَلَّا لَا وَزَرَۖ","إِلَىٰ رَبِّكَ يَوْمَئِذٍ اِ۬لْمُسْتَقَرُّۖ","يُنَبَّؤُاْ اُ۬لِانسَٰنُ يَوْمَئِذِۢ بِمَا قَدَّمَ وَأَخَّرَۖ","بَلِ اِ۬لِانسَٰنُ عَلَىٰ نَفْسِهِۦ بَصِيرَةٞ","وَلَوَ اَلْق۪ىٰ مَعَاذِيرَهُۥۖ","لَا تُحَرِّكْ بِهِۦ لِسَانَكَ لِتَعْجَلَ بِهِۦٓۖ إِنَّ عَلَيْنَا جَمْعَهُۥ وَقُرْءَانَهُۥۖ","فَإِذَا قَرَأْنَٰهُ فَاتَّبِعْ قُرْءَانَهُۥ","ثُمَّ إِنَّ عَلَيْنَا بَيَانَهُۥۖ","كَلَّا بَلْ تُحِبُّونَ اَ۬لْعَاجِلَةَ","وَتَذَرُونَ اَ۬لَاخِرَةَۖ","وُجُوهٞ يَوْمَئِذٖ نَّاضِرَةٌ","اِلَىٰ رَبِّهَا نَاظِرَةٞۖ","وَوُجُوهٞ يَوْمَئِذِۢ بَاسِرَةٞ","تَظُنُّ أَنْ يُّفْعَلَ بِهَا فَاقِرَةٞۖ","كَلَّآ إِذَا بَلَغَتِ اِ۬لتَّرَاقِيَ","وَقِيلَ مَن رَّاقٖ","وَظَنَّ أَنَّهُ اُ۬لْفِرَاقُ","وَالْتَفَّتِ اِ۬لسَّاقُ بِالسَّاقِ","إِلَىٰ رَبِّكَ يَوْمَئِذٍ اِ۬لْمَسَاقُۖ","فَلَا صَدَّقَ وَلَا صَلّ۪ىٰۖ","وَلَٰكِن كَذَّبَ وَتَوَلّ۪ىٰۖ","ثُمَّ ذَهَبَ إِلَىٰٓ أَهْلِهِۦ يَتَمَطّ۪ىٰٓۖ","أَوْل۪ىٰ لَكَ فَأَوْل۪ىٰ","ثُمَّ أَوْل۪ىٰ لَكَ فَأَوْل۪ىٰٓۖ","أَيَحْسِبُ اُ۬لِانسَٰنُ أَنْ يُّتْرَكَ سُدىًۖ","اَلَمْ يَكُ نُطْفَةٗ مِّن مَّنِيّٖ تُمْن۪ىٰ","ثُمَّ كَانَ عَلَقَةٗ فَخَلَقَ فَسَوّ۪ىٰ","فَجَعَلَ مِنْهُ اُ۬لزَّوْجَيْنِ اِ۬لذَّكَرَ وَالُانث۪ىٰٓۖ","أَلَيْسَ ذَٰلِكَ بِقَٰدِرٍ عَلَىٰٓ أَنْ يُّحْـِۧيَ اَ۬لْمَوْت۪ىٰۖ"]],["الإنسان",["هَلَ اَت۪ىٰ عَلَى اَ۬لِانسَٰنِ حِينٞ مِّنَ اَ۬لدَّهْرِ لَمْ يَكُن شَئْاٗ مَّذْكُوراًۖ","اِنَّا خَلَقْنَا اَ۬لِانسَٰنَ مِن نُّطْفَةٍ اَمْشَاجٖ نَّبْتَلِيهِ فَجَعَلْنَٰهُ سَمِيعاَۢ بَصِيراًۖ","اِنَّا هَدَيْنَٰهُ اُ۬لسَّبِيلَ إِمَّا شَاكِراٗ وَإِمَّا كَفُوراًۖ","اِنَّآ أَعْتَدْنَا لِلْكٰ۪فِرِينَ سَلَٰسِلاٗ وَأَغْلَٰلاٗ وَسَعِيراًۖ","اِنَّ اَ۬لَابْرَارَ يَشْرَبُونَ مِن كَأْسٖ كَانَ مِزَاجُهَا كَافُوراً","عَيْناٗ يَشْرَبُ بِهَا عِبَادُ اُ۬للَّهِ يُفَجِّرُونَهَا تَفْجِيراٗۖ","يُوفُونَ بِالنَّذْرِ وَيَخَافُونَ يَوْماٗ كَانَ شَرُّهُۥ مُسْتَطِيراٗۖ","وَيُطْعِمُونَ اَ۬لطَّعَامَ عَلَىٰ حُبِّهِۦ مِسْكِيناٗ وَيَتِيماٗ وَأَسِيراً","اِنَّمَا نُطْعِمُكُمْ لِوَجْهِ اِ۬للَّهِۖ لَا نُرِيدُ مِنكُمْ جَزَآءٗ وَلَا شُكُوراًۖ","اِنَّا نَخَافُ مِن رَّبِّنَا يَوْماً عَبُوساٗ قَمْطَرِيراٗۖ","فَوَق۪يٰهُمُ اُ۬للَّهُ شَرَّ ذَٰلِكَ اَ۬لْيَوْمِ وَلَقّ۪يٰهُمْ نَضْرَةٗ وَسُرُوراٗۖ","وَجَز۪يٰهُم بِمَا صَبَرُواْ جَنَّةٗ وَحَرِيراٗ","مُّتَّكِـِٕينَ فِيهَا عَلَى اَ۬لَارَآئِكِ لَا يَرَوْنَ فِيهَا شَمْساٗ وَلَا زَمْهَرِيراٗ","وَدَانِيَةً عَلَيْهِمْ ظِلَٰلُهَا وَذُلِّلَتْ قُطُوفُهَا تَذْلِيلاٗۖ","وَيُطَافُ عَلَيْهِم بِـَٔانِيَةٖ مِّن فِضَّةٖ وَأَكْوَابٖ كَانَتْ قَوَارِيراٗۖ","قَوَارِيراٗ مِّن فِضَّةٖ قَدَّرُوهَا تَقْدِيراٗۖ","وَيُسْقَوْنَ فِيهَا كَأْساٗ كَانَ مِزَاجُهَا زَنجَبِيلاً","عَيْناٗ فِيهَا تُسَمّ۪ىٰ سَلْسَبِيلاٗۖ","۞ وَيَطُوفُ عَلَيْهِمْ وِلْدَٰنٞ مُّخَلَّدُونَ إِذَا رَأَيْتَهُمْ حَسِبْتَهُمْ لُؤْلُؤاٗ مَّنثُوراٗۖ","وَإِذَا رَأَيْتَ ثَمَّ رَأَيْتَ نَعِيماٗ وَمُلْكاٗ كَبِيراً","عَٰلِيهِمْ ثِيَابُ سُندُسٍ خُضْرٞ وَإِسْتَبْرَقٞۖ وَحُلُّوٓاْ أَسَاوِرَ مِن فِضَّةٖۖ وَسَق۪يٰهُمْ رَبُّهُمْ شَرَاباٗ طَهُوراًۖ","اِنَّ هَٰذَا كَانَ لَكُمْ جَزَآءٗ وَكَانَ سَعْيُكُم مَّشْكُوراًۖ","اِنَّا نَحْنُ نَزَّلْنَا عَلَيْكَ اَ۬لْقُرْءَانَ تَنزِيلاٗۖ","فَاصْبِرْ لِحُكْمِ رَبِّكَ وَلَا تُطِعْ مِنْهُمُۥٓ ءَاثِماً اَوْ كَفُوراٗۖ","وَاذْكُرِ اِ۪سْمَ رَبِّكَ بُكْرَةٗ وَأَصِيلاٗۖ","وَمِنَ اَ۬ليْلِ فَاسْجُدْ لَهُۥ وَسَبِّحْهُ لَيْلاٗ طَوِيلاًۖ","اِنَّ هَٰٓؤُلَآءِ يُحِبُّونَ اَ۬لْعَاجِلَةَ وَيَذَرُونَ وَرَآءَهُمْ يَوْماٗ ثَقِيلاٗۖ","نَّحْنُ خَلَقْنَٰهُمْ وَشَدَدْنَآ أَسْرَهُمْ وَإِذَا شِئْنَا بَدَّلْنَآ أَمْثَٰلَهُمْ تَبْدِيلاًۖ","اِنَّ هَٰذِهِۦ تَذْكِرَةٞۖ فَمَن شَآءَ اَ۪تَّخَذَ إِلَىٰ رَبِّهِۦ سَبِيلاٗۖ","وَمَا تَشَآءُونَ إِلَّآ أَنْ يَّشَآءَ اَ۬للَّهُۖ إِنَّ اَ۬للَّهَ كَانَ عَلِيماً حَكِيماٗۖ","يُدْخِلُ مَنْ يَّشَآءُ فِے رَحْمَتِهِۦۖ وَالظَّٰلِمِينَ أَعَدَّ لَهُمْ عَذَاباً اَلِيماٗۖ"]],["المرسلات",["وَالْمُرْسَلَٰتِ عُرْفاٗ","فَالْعَٰصِفَٰتِ عَصْفاٗ","وَالنَّٰشِرَٰتِ نَشْراٗ","فَالْفَٰرِقَٰتِ فَرْقاٗ","فَالْمُلْقِيَٰتِ ذِكْراً","عُذْراً اَوْ نُذُراً","اِنَّمَا تُوعَدُونَ لَوَٰقِعٞۖ","فَإِذَا اَ۬لنُّجُومُ طُمِسَتْ","وَإِذَا اَ۬لسَّمَآءُ فُرِجَتْ","وَإِذَا اَ۬لْجِبَالُ نُسِفَتْ","وَإِذَا اَ۬لرُّسُلُ أُقِّتَتْ","لِأَيِّ يَوْمٍ ا۟جِّلَتْ","لِيَوْمِ اِ۬لْفَصْلِۖ","وَمَآ أَدْر۪يٰكَ مَا يَوْمُ اُ۬لْفَصْلِۖ","وَيْلٞ يَوْمَئِذٖ لِّلْمُكَذِّبِينَۖ","۞ أَلَمْ نُهْلِكِ اِ۬لَاوَّلِينَۖ","ثُمَّ نُتْبِعُهُمُ اُ۬لَاخِرِينَۖ","كَذَٰلِكَ نَفْعَلُ بِالْمُجْرِمِينَۖ","وَيْلٞ يَوْمَئِذٖ لِّلْمُكَذِّبِينَۖ","أَلَمْ نَخْلُقكُّم مِّن مَّآءٖ مَّهِينٖ","فَجَعَلْنَٰهُ فِے قَر۪ارٖ مَّكِينٍ","اِلَىٰ قَدَرٖ مَّعْلُومٖ","فَقَدَّرْنَاۖ فَنِعْمَ اَ۬لْقَٰدِرُونَۖ","وَيْلٞ يَوْمَئِذٖ لِّلْمُكَذِّبِينَۖ","أَلَمْ نَجْعَلِ اِ۬لَارْضَ كِفَاتاً","اَحْيَآءٗ وَأَمْوَٰتاٗ","وَجَعَلْنَا فِيهَا رَوَٰسِيَ شَٰمِخَٰتٖ وَأَسْقَيْنَٰكُم مَّآءٗ فُرَاتاٗۖ","وَيْلٞ يَوْمَئِذٖ لِّلْمُكَذِّبِينَۖ","اَ۪نطَلِقُوٓاْ إِلَىٰ مَا كُنتُم بِهِۦ تُكَذِّبُونَ","اَ۪نطَلِقُوٓاْ إِلَىٰ ظِلّٖ ذِے ثَلَٰثِ شُعَبٖ","لَّا ظَلِيلٖ وَلَا يُغْنِے مِنَ اَ۬للَّهَبِۖ","إِنَّهَا تَرْمِے بِشَرَرٖ كَالْقَصْرِ","كَأَنَّهُۥ جِمَٰلَٰتٞ صُفْرٞۖ","وَيْلٞ يَوْمَئِذٖ لِّلْمُكَذِّبِينَۖ","هَٰذَا يَوْمُ لَا يَنطِقُونَ","وَلَا يُوذَنُ لَهُمْ فَيَعْتَذِرُونَۖ","وَيْلٞ يَوْمَئِذٖ لِّلْمُكَذِّبِينَۖ","هَٰذَا يَوْمُ اُ۬لْفَصْلِ جَمَعْنَٰكُمْ وَالَاوَّلِينَ","فَإِن كَانَ لَكُمْ كَيْدٞ فَكِيدُونِۖ","وَيْلٞ يَوْمَئِذٖ لِّلْمُكَذِّبِينَۖ","إِنَّ اَ۬لْمُتَّقِينَ فِے ظِلَٰلٖ وَعُيُونٖ","وَفَوَٰكِهَ مِمَّا يَشْتَهُونَۖ","كُلُواْ وَاشْرَبُواْۖ هَنِيٓـٔاَۢ بِمَا كُنتُمْ تَعْمَلُونَۖ","إِنَّا كَذَٰلِكَ نَجْزِے اِ۬لْمُحْسِنِينَۖ","وَيْلٞ يَوْمَئِذٖ لِّلْمُكَذِّبِينَۖ","كُلُواْ وَتَمَتَّعُواْ قَلِيلاً اِنَّكُم مُّجْرِمُونَۖ","وَيْلٞ يَوْمَئِذٖ لِّلْمُكَذِّبِينَۖ","وَإِذَا قِيلَ لَهُمُ اُ۪رْكَعُواْ لَا يَرْكَعُونَۖ","وَيْلٞ يَوْمَئِذٖ لِّلْمُكَذِّبِينَۖ","فَبِأَيِّ حَدِيثِۢ بَعْدَهُۥ يُومِنُونَۖ"]],["النبأ",["عَمَّۖ يَتَسَآءَلُونَ","عَنِ اِ۬لنَّبَإِ اِ۬لْعَظِيمِ","اِ۬لذِے هُمْ فِيهِ مُخْتَلِفُونَۖ","كَلَّا سَيَعْلَمُونَ","ثُمَّ كَلَّا سَيَعْلَمُونَۖ","أَلَمْ نَجْعَلِ اِ۬لَارْضَ مِهَٰداٗ","وَالْجِبَالَ أَوْتَاداٗ","وَخَلَقْنَٰكُمُۥٓ أَزْوَٰجاٗ","وَجَعَلْنَا نَوْمَكُمْ سُبَاتاٗ","وَجَعَلْنَا اَ۬ليْلَ لِبَاساٗ","وَجَعَلْنَا اَ۬لنَّهَارَ مَعَاشاٗ","وَبَنَيْنَا فَوْقَكُمْ سَبْعاٗ شِدَاداٗ","وَجَعَلْنَا سِرَاجاٗ وَهَّاجاٗ","وَأَنزَلْنَا مِنَ اَ۬لْمُعْصِرَٰتِ مَآءٗ ثَجَّاجاٗ","لِّنُخْرِجَ بِهِۦ حَبّاٗ وَنَبَاتاٗ","وَجَنَّٰتٍ اَلْفَافاًۖ","اِنَّ يَوْمَ اَ۬لْفَصْلِ كَانَ مِيقَٰتاٗ","يَوْمَ يُنفَخُ فِے اِ۬لصُّورِ فَتَاتُونَ أَفْوَاجاٗ","وَفُتِّحَتِ اِ۬لسَّمَآءُ فَكَانَتَ اَبْوَٰباٗ","وَسُيِّرَتِ اِ۬لْجِبَالُ فَكَانَتْ سَرَاباًۖ","اِنَّ جَهَنَّمَ كَانَتْ مِرْصَاداٗ","لِّلطَّٰغِينَ مَـَٔاباٗ","لَّٰبِثِينَ فِيهَآ أَحْقَاباٗۖ","لَّا يَذُوقُونَ فِيهَا بَرْداٗ وَلَا شَرَاباً","اِلَّا حَمِيماٗ وَغَسَاقاٗ","جَزَآءٗ وِفَاقاًۖ","اِنَّهُمْ كَانُواْ لَا يَرْجُونَ حِسَاباٗ","وَكَذَّبُواْ بِـَٔايَٰتِنَا كِذَّاباٗۖ","وَكُلَّ شَےْءٍ اَحْصَيْنَٰهُ كِتَٰباٗۖ","فَذُوقُواْ فَلَن نَّزِيدَكُمُۥٓ إِلَّا عَذَاباًۖ","اِنَّ لِلْمُتَّقِينَ مَفَازاً","حَدَآئِقَ وَأَعْنَٰباٗ","وَكَوَاعِبَ أَتْرَاباٗ","وَكَأْساٗ دِهَاقاٗ","لَّا يَسْمَعُونَ فِيهَا لَغْواٗ وَلَا كِذَّاباٗۖ","جَزَآءٗ مِّن رَّبِّكَ عَطَآءً حِسَاباٗۖ","رَّبُّ اُ۬لسَّمَٰوَٰتِ وَالَارْضِ وَمَا بَيْنَهُمَاۖ اَ۬لرَّحْمَٰنُ لَا يَمْلِكُونَ مِنْهُ خِطَاباٗۖ","يَوْمَ يَقُومُ اُ۬لرُّوحُ وَالْمَلَٰٓئِكَةُ صَفّاٗ لَّا يَتَكَلَّمُونَ إِلَّا مَنَ اَذِنَ لَهُ اُ۬لرَّحْمَٰنُ وَقَالَ صَوَاباٗۖ","ذَٰلِكَ اَ۬لْيَوْمُ اُ۬لْحَقُّۖ فَمَن شَآءَ اَ۪تَّخَذَ إِلَىٰ رَبِّهِۦ مَـَٔاباًۖ","اِنَّآ أَنذَرْنَٰكُمْ عَذَاباٗ قَرِيباٗ يَوْمَ يَنظُرُ اُ۬لْمَرْءُ مَا قَدَّمَتْ يَدَٰهُ وَيَقُولُ اُ۬لْكَافِرُ يَٰلَيْتَنِے كُنتُ تُرَٰباٗۖ"]],["النازعات",["وَالنَّٰزِعَٰتِ غَرْقاٗ","وَالنَّٰشِطَٰتِ نَشْطاٗ","وَالسَّٰبِحَٰتِ سَبْحاٗ","فَالسَّٰبِقَٰتِ سَبْقاٗ","فَالْمُدَبِّرَٰتِ أَمْراٗ","يَوْمَ تَرْجُفُ اُ۬لرَّاجِفَةُ","تَتْبَعُهَا اَ۬لرَّادِفَةُۖ","قُلُوبٞ يَوْمَئِذٖ وَاجِفَةٌ","اَبْصَٰرُهَا خَٰشِعَةٞۖ","يَقُولُونَ أَ۟نَّا لَمَرْدُودُونَ فِے اِ۬لْحَافِرَةِ","إِذَا كُنَّا عِظَٰماٗ نَّخِرَةٗۖ","قَالُواْ تِلْكَ إِذاٗ كَرَّةٌ خَاسِرَةٞ","فَإِنَّمَا هِيَ زَجْرَةٞ وَٰحِدَةٞ","فَإِذَا هُم بِالسَّاهِرَةِۖ","هَلَ اَت۪يٰكَ حَدِيثُ مُوس۪ىٰٓ","إِذْ نَاد۪يٰهُ رَبُّهُۥ بِالْوَادِ اِ۬لْمُقَدَّسِ طُوَىۖ","اَ۪ذْهَبِ اِلَىٰ فِرْعَوْنَ إِنَّهُۥ طَغ۪ىٰ","فَقُلْ هَل لَّكَ إِلَىٰٓ أَن تَزَّكّ۪ىٰ","وَأَهْدِيَكَ إِلَىٰ رَبِّكَ فَتَخْش۪ىٰۖ","فَأَر۪يٰهُ اُ۬لَايَةَ اَ۬لْكُبْر۪ىٰ","فَكَذَّبَ وَعَص۪ىٰ","ثُمَّ أَدْبَرَ يَسْع۪ىٰ","فَحَشَرَ فَنَاد۪ىٰ","فَقَالَ أَنَا رَبُّكُمُ اُ۬لَاعْل۪ىٰ","فَأَخَذَهُ اُ۬للَّهُ نَكَالَ اَ۬لَاخِرَةِ وَالُاول۪ىٰٓۖ","إِنَّ فِے ذَٰلِكَ لَعِبْرَةٗ لِّمَنْ يَّخْش۪ىٰٓۖ","ءَآنتُمُۥٓ أَشَدُّ خَلْقاً اَمِ اِ۬لسَّمَآءُۖ بَنَيٰهَا","رَفَعَ سَمْكَهَا فَسَوَّيٰهَا","وَأَغْطَشَ لَيْلَهَا وَأَخْرَجَ ضُحَيٰهَاۖ","وَالَارْضَ بَعْدَ ذَٰلِكَ دَحَيٰهَآ","أَخْرَجَ مِنْهَا مَآءَهَا وَمَرْعَيٰهَا","وَالْجِبَالَ أَرْسَيٰهَا","مَتَٰعاٗ لَّكُمْ وَلِأَنْعَٰمِكُمْۖ","فَإِذَا جَآءَتِ اِ۬لطَّآمَّةُ اُ۬لْكُبْر۪ىٰ","يَوْمَ يَتَذَكَّرُ اُ۬لِانسَٰنُ مَا سَع۪ىٰ","وَبُرِّزَتِ اِ۬لْجَحِيمُ لِمَنْ يَّر۪ىٰۖ","فَأَمَّا مَن طَغ۪ىٰ وَءَاثَرَ اَ۬لْحَيَوٰةَ اَ۬لدُّنْي۪ا","فَإِنَّ اَ۬لْجَحِيمَ هِيَ اَ۬لْمَأْو۪ىٰۖ","وَأَمَّا مَنْ خَافَ مَقَامَ رَبِّهِۦ وَنَهَى اَ۬لنَّفْسَ عَنِ اِ۬لْهَو۪ىٰ","فَإِنَّ اَ۬لْجَنَّةَ هِيَ اَ۬لْمَأْو۪ىٰۖ","۞ يَسْـَٔلُونَكَ عَنِ اِ۬لسَّاعَةِ أَيَّانَ مُرْسَيٰهَاۖ","فِيمَ أَنتَ مِن ذِكْر۪يٰهَآۖ","إِلَىٰ رَبِّكَ مُنتَهَيٰهَآۖ","إِنَّمَآ أَنتَ مُنذِرُ مَنْ يَّخْشَيٰهَاۖ","كَأَنَّهُمْ يَوْمَ يَرَوْنَهَا لَمْ يَلْبَثُوٓاْ إِلَّا عَشِيَّةً اَوْ ضُحَيٰهَاۖ"]],["عبس",["عَبَسَ وَتَوَلّ۪ىٰٓ","أَن جَآءَهُ اُ۬لَاعْم۪ىٰۖ","وَمَا يُدْرِيكَ لَعَلَّهُۥ يَزَّكّ۪ىٰٓ","أَوْ يَذَّكَّرُ فَتَنفَعُهُ اُ۬لذِّكْر۪ىٰٓۖ","أَمَّا مَنِ اِ۪سْتَغْن۪ىٰ","فَأَنتَ لَهُۥ تَصَّدّ۪ىٰ","وَمَا عَلَيْكَ أَلَّا يَزَّكّ۪ىٰۖ","وَأَمَّا مَن جَآءَكَ يَسْع۪ىٰ","وَهُوَ يَخْش۪ىٰ","فَأَنتَ عَنْهُ تَلَهّ۪ىٰ","كَلَّآۖ إِنَّهَا تَذْكِرَةٞۖ","فَمَن شَآءَ ذَكَرَهُۥ","فِے صُحُفٖ مُّكَرَّمَةٖ","مَّرْفُوعَةٖ مُّطَهَّرَةِۢ","بِأَيْدِے سَفَرَةٖ","كِرَامِۢ بَرَرَةٖۖ","قُتِلَ اَ۬لِانسَٰنُ مَآ أَكْفَرَهُۥۖ","مِنَ اَيِّ شَےْءٍ خَلَقَهُۥۖ","مِن نُّطْفَةٍ خَلَقَهُۥ فَقَدَّرَهُۥ","ثُمَّ اَ۬لسَّبِيلَ يَسَّرَهُۥ","ثُمَّ أَمَاتَهُۥ فَأَقْبَرَهُۥۖ","ثُمَّ إِذَا شَآءَ انشَرَهُۥۖ","كَلَّا لَمَّا يَقْضِ مَآ أَمَرَهُۥۖ","فَلْيَنظُرِ اِ۬لِانسَٰنُ إِلَىٰ طَعَامِهِۦٓۖ","إِنَّا صَبَبْنَا اَ۬لْمَآءَ صَبّاٗ","ثُمَّ شَقَقْنَا اَ۬لَارْضَ شَقّاٗ","فَأَنۢبَتْنَا فِيهَا حَبّاٗ","وَعِنَباٗ وَقَضْباٗ","وَزَيْتُوناٗ وَنَخْلاٗ","وَحَدَآئِقَ غُلْباٗ","وَفَٰكِهَةٗ وَأَبّاٗ","مَّتَٰعاٗ لَّكُمْ وَلِأَنْعَٰمِكُمْۖ","فَإِذَا جَآءَتِ اِ۬لصَّآخَّةُ","يَوْمَ يَفِرُّ اُ۬لْمَرْءُ مِنَ اَخِيهِ","وَأُمِّهِۦ وَأَبِيهِ","وَصَٰحِبَتِهِۦ وَبَنِيهِۖ","لِكُلِّ اِ۪مْرِےٕٖ مِّنْهُمْ يَوْمَئِذٖ شَأْنٞ يُغْنِيهِۖ","وُجُوهٞ يَوْمَئِذٖ مُّسْفِرَةٞ","ضَاحِكَةٞ مُّسْتَبْشِرَةٞۖ","وَوُجُوهٞ يَوْمَئِذٍ عَلَيْهَا غَبَرَةٞ","تَرْهَقُهَا قَتَرَةٌۖ","ا۟وْلَٰٓئِكَ هُمُ اُ۬لْكَفَرَةُ اُ۬لْفَجَرَةُۖ"]],["التكوير",["إِذَا اَ۬لشَّمْسُ كُوِّرَتْ","وَإِذَا اَ۬لنُّجُومُ اُ۪نكَدَرَتْ","وَإِذَا اَ۬لْجِبَالُ سُيِّرَتْ","وَإِذَا اَ۬لْعِشَارُ عُطِّلَتْ","وَإِذَا اَ۬لْوُحُوشُ حُشِرَتْ","وَإِذَا اَ۬لْبِحَارُ سُجِّرَتْ","وَإِذَا اَ۬لنُّفُوسُ زُوِّجَتْ","وَإِذَا اَ۬لْمَوْءُۥدَةُ سُئِلَتْ","بِأَيِّ ذَنۢبٖ قُتِلَتْ","وَإِذَا اَ۬لصُّحُفُ نُشِرَتْ","وَإِذَا اَ۬لسَّمَآءُ كُشِطَتْ","وَإِذَا اَ۬لْجَحِيمُ سُعِّرَتْ","وَإِذَا اَ۬لْجَنَّةُ أُزْلِفَتْ","عَلِمَتْ نَفْسٞ مَّآ أَحْضَرَتْۖ","فَلَآ أُقْسِمُ بِالْخُنَّسِ","اِ۬لْجَوَارِ اِ۬لْكُنَّسِ","وَاليْلِ إِذَا عَسْعَسَ","وَالصُّبْحِ إِذَا تَنَفَّسَ","إِنَّهُۥ لَقَوْلُ رَسُولٖ كَرِيمٖ","ذِے قُوَّةٍ عِندَ ذِے اِ۬لْعَرْشِ مَكِينٖ","مُّطَاعٖ ثَمَّ أَمِينٖۖ","وَمَا صَٰحِبُكُم بِمَجْنُونٖۖ","وَلَقَدْ ر۪ء۪اهُ بِالُافُقِ اِ۬لْمُبِينِۖ","وَمَا هُوَ عَلَى اَ۬لْغَيْبِ بِضَنِينٖۖ","وَمَا هُوَ بِقَوْلِ شَيْطَٰنٖ رَّجِيمٖ","فَأَيْنَ تَذْهَبُونَۖ","إِنْ هُوَ إِلَّا ذِكْرٞ لِّلْعَٰلَمِينَ","لِمَن شَآءَ مِنكُمُۥٓ أَنْ يَّسْتَقِيمَۖ","وَمَا تَشَآءُونَ إِلَّآ أَنْ يَّشَآءَ اَ۬للَّهُ رَبُّ اُ۬لْعَٰلَمِينَۖ"]],["الانفطار",["إِذَا اَ۬لسَّمَآءُ اُ۪نفَطَرَتْ","وَإِذَا اَ۬لْكَوَاكِبُ اُ۪نتَثَرَتْ","وَإِذَا اَ۬لْبِحَارُ فُجِّرَتْ","وَإِذَا اَ۬لْقُبُورُ بُعْثِرَتْ","عَلِمَتْ نَفْسٞ مَّا قَدَّمَتْ وَأَخَّرَتْۖ","يَٰٓأَيُّهَا اَ۬لِانسَٰنُ مَا غَرَّكَ بِرَبِّكَ اَ۬لْكَرِيمِ","اِ۬لذِے خَلَقَكَ فَسَوّ۪يٰكَ فَعَدَّلَكَ","فِےٓ أَيِّ صُورَةٖ مَّا شَآءَ رَكَّبَكَۖ","كَلَّا بَلْ تُكَذِّبُونَ بِالدِّينِ","وَإِنَّ عَلَيْكُمْ لَحَٰفِظِينَ","كِرَاماٗ كَٰتِبِينَ","يَعْلَمُونَ مَا تَفْعَلُونَۖ","إِنَّ اَ۬لَابْرَارَ لَفِے نَعِيمٖۖ","وَإِنَّ اَ۬لْفُجَّارَ لَفِے جَحِيمٖ","يَصْلَوْنَهَا يَوْمَ اَ۬لدِّينِ","وَمَا هُمْ عَنْهَا بِغَآئِبِينَۖ","وَمَآ أَدْر۪يٰكَ مَا يَوْمُ اُ۬لدِّينِ","ثُمَّ مَآ أَدْر۪يٰكَ مَا يَوْمُ اُ۬لدِّينِۖ","يَوْمَ لَا تَمْلِكُ نَفْسٞ لِّنَفْسٖ شَئْاٗۖ وَالَامْرُ يَوْمَئِذٖ لِّلهِۖ"]],["المطففين",["وَيْلٞ لِّلْمُطَفِّفِينَ","اَ۬لذِينَ إِذَا اَ۪كْتَالُواْ عَلَى اَ۬لنَّاسِ يَسْتَوْفُونَ","وَإِذَا كَالُوهُمُۥٓ أَو وَّزَنُوهُمْ يُخْسِرُونَۖ","أَلَا يَظُنُّ أُوْلَٰٓئِكَ أَنَّهُم مَّبْعُوثُونَ","لِيَوْمٍ عَظِيمٖ","يَوْمَ يَقُومُ اُ۬لنَّاسُ لِرَبِّ اِ۬لْعَٰلَمِينَۖ","كَلَّآ إِنَّ كِتَٰبَ اَ۬لْفُجّ۪ارِ لَفِے سِجِّينٖۖ","وَمَآ أَدْر۪يٰكَ مَا سِجِّينٞ","كِتَٰبٞ مَّرْقُومٞۖ","وَيْلٞ يَوْمَئِذٖ لِّلْمُكَذِّبِينَ","اَ۬لذِينَ يُكَذِّبُونَ بِيَوْمِ اِ۬لدِّينِۖ","وَمَا يُكَذِّبُ بِهِۦٓ إِلَّا كُلُّ مُعْتَدٍ اَثِيمٍ","اِذَا تُتْل۪ىٰ عَلَيْهِ ءَايَٰتُنَا قَالَ أَسَٰطِيرُ اُ۬لَاوَّلِينَۖ","۞ كَلَّا بَل رَّانَ عَلَىٰ قُلُوبِهِم مَّا كَانُواْ يَكْسِبُونَۖ","كَلَّآ إِنَّهُمْ عَن رَّبِّهِمْ يَوْمَئِذٖ لَّمَحْجُوبُونَۖ","ثُمَّ إِنَّهُمْ لَصَالُواْ اُ۬لْجَحِيمِۖ","ثُمَّ يُقَالُ هَٰذَا اَ۬لذِے كُنتُم بِهِۦ تُكَذِّبُونَۖ","كَلَّآ إِنَّ كِتَٰبَ اَ۬لَابْر۪ارِ لَفِے عِلِّيِّينَۖ","وَمَآ أَدْر۪يٰكَ مَا عِلِّيُّونَ","كِتَٰبٞ مَّرْقُومٞ","يَشْهَدُهُ اُ۬لْمُقَرَّبُونَۖ","إِنَّ اَ۬لَابْرَارَ لَفِے نَعِيمٍ","عَلَى اَ۬لَارَآئِكِ يَنظُرُونَ","تَعْرِفُ فِے وُجُوهِهِمْ نَضْرَةَ اَ۬لنَّعِيمِ","يُسْقَوْنَ مِن رَّحِيقٖ مَّخْتُومٍ","خِتَٰمُهُۥ مِسْكٞۖ وَفِے ذَٰلِكَ فَلْيَتَنَافَسِ اِ۬لْمُتَنَٰفِسُونَۖ","وَمِزَاجُهُۥ مِن تَسْنِيمٍ","عَيْناٗ يَشْرَبُ بِهَا اَ۬لْمُقَرَّبُونَۖ","إِنَّ اَ۬لذِينَ أَجْرَمُواْ كَانُواْ مِنَ اَ۬لذِينَ ءَامَنُواْ يَضْحَكُونَ","وَإِذَا مَرُّواْ بِهِمْ يَتَغَامَزُونَ","وَإِذَا اَ۪نقَلَبُوٓاْ إِلَىٰٓ أَهْلِهِمُ اُ۪نقَلَبُواْ فَٰكِهِينَ","وَإِذَا رَأَوْهُمْ قَالُوٓاْ إِنَّ هَٰٓؤُلَآءِ لَضَآلُّونَ","وَمَآ أُرْسِلُواْ عَلَيْهِمْ حَٰفِظِينَۖ","فَالْيَوْمَ اَ۬لذِينَ ءَامَنُواْ مِنَ اَ۬لْكُفّ۪ارِ يَضْحَكُونَ","عَلَى اَ۬لَارَآئِكِۖ يَنظُرُونَ","هَلْ ثُوِّبَ اَ۬لْكُفَّارُ مَا كَانُواْ يَفْعَلُونَۖ"]],["الانشقاق",["إِذَا اَ۬لسَّمَآءُ اُ۪نشَقَّتْ","وَأَذِنَتْ لِرَبِّهَا وَحُقَّتْ","وَإِذَا اَ۬لَارْضُ مُدَّتْ","وَأَلْقَتْ مَا فِيهَا وَتَخَلَّتْ","وَأَذِنَتْ لِرَبِّهَا وَحُقَّتْۖ","يَٰٓأَيُّهَا اَ۬لِانسَٰنُ إِنَّكَ كَادِحٌ اِلَىٰ رَبِّكَ كَدْحاٗ فَمُلَٰقِيهِۖ","فَأَمَّا مَنُ ا۟وتِيَ كِتَٰبَهُۥ بِيَمِينِهِۦ","فَسَوْفَ يُحَاسَبُ حِسَاباٗ يَسِيراٗ","وَيَنقَلِبُ إِلَىٰٓ أَهْلِهِۦ مَسْرُوراٗۖ","وَأَمَّا مَنُ ا۟وتِيَ كِتَٰبَهُۥ وَرَآءَ ظَهْرِهِۦ","فَسَوْفَ يَدْعُواْ ثُبُوراٗ","وَيُصَلَّىٰ سَعِيراًۖ","اِنَّهُۥ كَانَ فِےٓ أَهْلِهِۦ مَسْرُوراًۖ","اِنَّهُۥ ظَنَّ أَن لَّنْ يَّحُورَ","بَل۪ىٰٓۖ إِنَّ رَبَّهُۥ كَانَ بِهِۦ بَصِيراٗۖ","۞ فَلَآ أُقْسِمُ بِالشَّفَقِ","وَاليْلِ وَمَا وَسَقَ","وَالْقَمَرِ إِذَا اَ۪تَّسَقَ","لَتَرْكَبُنَّ طَبَقاً عَن طَبَقٖۖ","فَمَا لَهُمْ لَا يُومِنُونَ","وَإِذَا قُرِۓَ عَلَيْهِمُ اُ۬لْقُرْءَانُ لَا يَسْجُدُونَۖ","بَلِ اِ۬لذِينَ كَفَرُواْ يُكَذِّبُونَ","وَاللَّهُ أَعْلَمُ بِمَا يُوعُونَۖ","فَبَشِّرْهُم بِعَذَابٍ اَلِيمٍۖ","اِلَّا اَ۬لذِينَ ءَامَنُواْ وَعَمِلُواْ اُ۬لصَّٰلِحَٰتِ لَهُمُۥٓ أَجْرٌ غَيْرُ مَمْنُونٖۖ"]],["البروج",["وَالسَّمَآءِ ذَاتِ اِ۬لْبُرُوجِ","وَالْيَوْمِ اِ۬لْمَوْعُودِ","وَشَاهِدٖ وَمَشْهُودٖ","قُتِلَ أَصْحَٰبُ اُ۬لُاخْدُودِ","اِ۬لنّ۪ارِ ذَاتِ اِ۬لْوَقُودِ","إِذْ هُمْ عَلَيْهَا قُعُودٞ","وَهُمْ عَلَىٰ مَا يَفْعَلُونَ بِالْمُومِنِينَ شُهُودٞۖ","وَمَا نَقَمُواْ مِنْهُمُۥٓ إِلَّآ أَنْ يُّومِنُواْ بِاللَّهِ اِ۬لْعَزِيزِ اِ۬لْحَمِيدِ","اِ۬لذِے لَهُۥ مُلْكُ اُ۬لسَّمَٰوَٰتِ وَالَارْضِۖ وَاللَّهُ عَلَىٰ كُلِّ شَےْءٖ شَهِيدٌۖ","اِنَّ اَ۬لذِينَ فَتَنُواْ اُ۬لْمُومِنِينَ وَالْمُومِنَٰتِ ثُمَّ لَمْ يَتُوبُواْ فَلَهُمْ عَذَابُ جَهَنَّمَ وَلَهُمْ عَذَابُ اُ۬لْحَرِيقِۖ","إِنَّ اَ۬لذِينَ ءَامَنُواْ وَعَمِلُواْ اُ۬لصَّٰلِحَٰتِ لَهُمْ جَنَّٰتٞ تَجْرِے مِن تَحْتِهَا اَ۬لَانْهَٰرُۖ ذَٰلِكَ اَ۬لْفَوْزُ اُ۬لْكَبِيرُۖ","۞ إِنَّ بَطْشَ رَبِّكَ لَشَدِيدٌۖ","اِنَّهُۥ هُوَ يُبْدِۓُ وَيُعِيدُۖ","وَهُوَ اَ۬لْغَفُورُ اُ۬لْوَدُودُ","ذُو اُ۬لْعَرْشِۖ اِ۬لْمَجِيدُ","فَعَّالٞ لِّمَا يُرِيدُۖ","هَلَ اَت۪يٰكَ حَدِيثُ اُ۬لْجُنُودِ","فِرْعَوْنَ وَثَمُودَۖ","بَلِ اِ۬لذِينَ كَفَرُواْ فِے تَكْذِيبٖ","وَاللَّهُ مِنْ وَّرَآئِهِم مُّحِيطُۢۖ","بَلْ هُوَ قُرْءَانٞ مَّجِيدٞ","فِے لَوْحٖ مَّحْفُوظٞۖ"]],["الطارق",["وَالسَّمَآءِ وَالطَّارِقِ","وَمَآ أَدْر۪يٰكَ مَا اَ۬لطَّارِقُ","اُ۬لنَّجْمُ اُ۬لثَّاقِبُ","إِن كُلُّ نَفْسٖ لَّمَا عَلَيْهَا حَافِظٞۖ","فَلْيَنظُرِ اِ۬لِانسَٰنُ مِمَّ خُلِقَۖ","خُلِقَ مِن مَّآءٖ دَافِقٖ","يَخْرُجُ مِنۢ بَيْنِ اِ۬لصُّلْبِ وَالتَّرَآئِبِۖ","إِنَّهُۥ عَلَىٰ رَجْعِهِۦ لَقَادِرٞ","يَوْمَ تُبْلَى اَ۬لسَّرَآئِرُ","فَمَا لَهُۥ مِن قُوَّةٖ وَلَا نَاصِرٖۖ","وَالسَّمَآءِ ذَاتِ اِ۬لرَّجْعِ","وَالَارْضِ ذَاتِ اِ۬لصَّدْعِ","إِنَّهُۥ لَقَوْلٞ فَصْلٞ","وَمَا هُوَ بِالْهَزْلِۖ","إِنَّهُمْ يَكِيدُونَ كَيْداٗ","وَأَكِيدُ كَيْداٗۖ","فَمَهِّلِ اِ۬لْكٰ۪فِرِينَ أَمْهِلْهُمْ رُوَيْداٗۖ"]],["الأعلى",["سَبِّحِ اِ۪سْمَ رَبِّكَ اَ۬لَاعْلَي","اَ۬لذِے خَلَقَ فَسَوّ۪ىٰ","وَالذِے قَدَّرَ فَهَد۪ىٰ","وَالذِےٓ أَخْرَجَ اَ۬لْمَرْع۪ىٰ","فَجَعَلَهُۥ غُثَآءً اَحْو۪ىٰۖ","سَنُقْرِئُكَ فَلَا تَنس۪ىٰٓ","إِلَّا مَا شَآءَ اَ۬للَّهُۖ إِنَّهُۥ يَعْلَمُ اُ۬لْجَهْرَ وَمَا يَخْف۪ىٰۖ","وَنُيَسِّرُكَ لِلْيُسْر۪ىٰۖ","فَذَكِّرِ اِن نَّفَعَتِ اِ۬لذِّكْر۪ىٰۖ","سَيَذَّكَّرُ مَنْ يَّخْش۪ىٰ","وَيَتَجَنَّبُهَا اَ۬لَاشْقَي","اَ۬لذِے يَصْلَى اَ۬لنَّارَ اَ۬لْكُبْر۪ىٰ","ثُمَّ لَا يَمُوتُ فِيهَا وَلَا يَحْي۪ىٰۖ","قَدَ اَفْلَحَ مَن تَزَكّ۪ىٰ","وَذَكَرَ اَ۪سْمَ رَبِّهِۦ فَصَلّ۪ىٰۖ","بَلْ تُوثِرُونَ اَ۬لْحَيَوٰةَ اَ۬لدُّنْي۪ا","وَالَاخِرَةُ خَيْرٞ وَأَبْق۪ىٰٓۖ","إِنَّ هَٰذَا لَفِے اِ۬لصُّحُفِ اِ۬لُاول۪ىٰ","صُحُفِ إِبْرَٰهِيمَ وَمُوس۪ىٰۖ"]],["الغاشية",["هَلَ اَت۪يٰكَ حَدِيثُ اُ۬لْغَٰشِيَةِۖ","وُجُوهٞ يَوْمَئِذٍ خَٰشِعَةٌ","عَامِلَةٞ نَّاصِبَةٞ","تَصْلَىٰ نَاراً حَامِيَةٗ","تُسْق۪ىٰ مِنْ عَيْنٍ اٰنِيَةٖۖ","لَّيْسَ لَهُمْ طَعَامٌ اِلَّا مِن ضَرِيعٖ","لَّا يُسْمِنُ وَلَا يُغْنِے مِن جُوعٖۖ","وُجُوهٞ يَوْمَئِذٖ نَّاعِمَةٞ","لِّسَعْيِهَا رَاضِيَةٞ","فِے جَنَّةٍ عَالِيَةٖ","لَّا تُسْمَعُ فِيهَا لَٰغِيَةٞۖ","فِيهَا عَيْنٞ جَارِيَةٞۖ","فِيهَا سُرُرٞ مَّرْفُوعَةٞ","وَأَكْوَابٞ مَّوْضُوعَةٞ","وَنَمَارِقُ مَصْفُوفَةٞ","وَزَرَابِيُّ مَبْثُوثَةٌۖ","۞ اَفَلَا يَنظُرُونَ إِلَى اَ۬لِابِلِ كَيْفَ خُلِقَتْ","وَإِلَى اَ۬لسَّمَآءِ كَيْفَ رُفِعَتْ","وَإِلَى اَ۬لْجِبَالِ كَيْفَ نُصِبَتْ","وَإِلَى اَ۬لَارْضِ كَيْفَ سُطِحَتْۖ","فَذَكِّرِ اِنَّمَآ أَنتَ مُذَكِّرٞۖ","لَّسْتَ عَلَيْهِم بِمُصَيْطِرٍۖ","اِلَّا مَن تَوَلّ۪ىٰ وَكَفَرَ","فَيُعَذِّبُهُ اُ۬للَّهُ اُ۬لْعَذَابَ اَ۬لَاكْبَرَۖ","إِنَّ إِلَيْنَآ إِيَابَهُمْ","ثُمَّ إِنَّ عَلَيْنَا حِسَابَهُمْۖ"]],["الفجر",["وَالْفَجْرِ","وَلَيَالٍ عَشْرٖ","وَالشَّفْعِ وَالْوَتْرِ","وَاليْلِ إِذَا يَسْرِۦ","هَلْ فِے ذَٰلِكَ قَسَمٞ لِّذِے حِجْرٍۖ","اَلَمْ تَرَ كَيْفَ فَعَلَ رَبُّكَ بِعَادٍ","اِرَمَ ذَاتِ اِ۬لْعِمَادِ","اِ۬لتِے لَمْ يُخْلَقْ مِثْلُهَا فِے اِ۬لْبِلَٰدِ","وَثَمُودَ اَ۬لذِينَ جَابُواْ اُ۬لصَّخْرَ بِالْوَادِۦ","وَفِرْعَوْنَ ذِے اِ۬لَاوْتَادِ","اِ۬لذِينَ طَغَوْاْ فِے اِ۬لْبِلَٰدِ","فَأَكْثَرُواْ فِيهَا اَ۬لْفَسَادَ","فَصَبَّ عَلَيْهِمْ رَبُّكَ سَوْطَ عَذَابٍۖ","اِنَّ رَبَّكَ لَبِالْمِرْصَادِۖ","فَأَمَّا اَ۬لِانسَٰنُ إِذَا مَا اَ۪بْتَل۪يٰهُ رَبُّهُۥ فَأَكْرَمَهُۥ وَنَعَّمَهُۥ","فَيَقُولُ رَبِّيَ أَكْرَمَنِۦۖ","وَأَمَّآ إِذَا مَا اَ۪بْتَل۪يٰهُ فَقَدَرَ عَلَيْهِ رِزْقَهُۥ","فَيَقُولُ رَبِّيَ أَهَٰنَنِۦ","كَلَّاۖ بَل لَّا تُكْرِمُونَ اَ۬لْيَتِيمَ","وَلَا تَحُضُّونَ عَلَىٰ طَعَامِ اِ۬لْمِسْكِينِ","وَتَاكُلُونَ اَ۬لتُّرَاثَ أَكْلاٗ لَّمّاٗ","وَتُحِبُّونَ اَ۬لْمَالَ حُبّاٗ جَمّاٗ","كَلَّآۖ إِذَا دُكَّتِ اِ۬لَارْضُ دَكّاٗ دَكّاٗ","وَجَآءَ رَبُّكَ وَالْمَلَكُ صَفّاٗ صَفّاٗ","وَجِےٓءَ يَوْمَئِذِۢ بِجَهَنَّمَ","يَوْمَئِذٖ يَتَذَكَّرُ اُ۬لِانسَٰنُ وَأَنّ۪ىٰ لَهُ اُ۬لذِّكْر۪ىٰۖ","يَقُولُ يَٰلَيْتَنِے قَدَّمْتُ لِحَيَاتِےۖ","فَيَوْمَئِذٖ لَّا يُعَذِّبُ عَذَابَهُۥٓ أَحَدٞ","وَلَا يُوثِقُ وَثَاقَهُۥٓ أَحَدٞۖ","يَٰٓأَيَّتُهَا اَ۬لنَّفْسُ اُ۬لْمُطْمَئِنَّةُ","اُ۪رْجِعِےٓ إِلَىٰ رَبِّكِ رَاضِيَةٗ مَّرْضِيَّةٗ","فَادْخُلِے فِے عِبَٰدِے وَادْخُلِے جَنَّتِےۖ"]],["البلد",["لَآ أُقْسِمُ بِهَٰذَا اَ۬لْبَلَدِ","وَأَنتَ حِلُّۢ بِهَٰذَا اَ۬لْبَلَدِ","وَوَالِدٖ وَمَا وَلَدَ","لَقَدْ خَلَقْنَا اَ۬لِانسَٰنَ فِے كَبَدٍۖ","اَيَحْسِبُ أَن لَّنْ يَّقْدِرَ عَلَيْهِ أَحَدٞ","يَقُولُ أَهْلَكْتُ مَالاٗ لُّبَداًۖ","اَيَحْسِبُ أَن لَّمْ يَرَهُۥٓ أَحَدٌۖ","اَلَمْ نَجْعَل لَّهُۥ عَيْنَيْنِ","وَلِسَاناٗ وَشَفَتَيْنِ","وَهَدَيْنَٰهُ اُ۬لنَّجْدَيْنِۖ","فَلَا اَ۪قْتَحَمَ اَ۬لْعَقَبَةَۖ","وَمَآ أَدْر۪يٰكَ مَا اَ۬لْعَقَبَةُۖ","فَكُّ رَقَبَةٍ","اَوِ اِطْعَامٞ فِے يَوْمٖ ذِے مَسْغَبَةٖ","يَتِيماٗ ذَا مَقْرَبَةٍ","اَوْ مِسْكِيناٗ ذَا مَتْرَبَةٖۖ","ثُمَّ كَانَ مِنَ اَ۬لذِينَ ءَامَنُواْ وَتَوَاصَوْاْ بِالصَّبْرِ وَتَوَاصَوْاْ بِالْمَرْحَمَةِۖ","أُوْلَٰٓئِكَ أَصْحَٰبُ اُ۬لْمَيْمَنَةِۖ","وَالذِينَ كَفَرُواْ بِـَٔايَٰتِنَا هُمُۥٓ أَصْحَٰبُ اُ۬لْمَشْـَٔمَةِۖ","عَلَيْهِمْ نَارٞ مُّوصَدَةٞۖ"]],["الشمس",["وَالشَّمْسِ وَضُحَيٰهَا","وَالْقَمَرِ إِذَا تَلَيٰهَا","وَالنَّه۪ارِ إِذَا جَلَّيٰهَا","وَاليْلِ إِذَا يَغْشَيٰهَا","وَالسَّمَآءِ وَمَا بَنَيٰهَا","وَالَارْضِ وَمَا طَحَيٰهَا","وَنَفْسٖ وَمَا سَوَّيٰهَا","فَأَلْهَمَهَا فُجُورَهَا وَتَقْوَيٰهَا","قَدَ اَفْلَحَ مَن زَكَّيٰهَا","وَقَدْ خَابَ مَن دَسَّيٰهَاۖ","كَذَّبَتْ ثَمُودُ بِطَغْوَيٰهَآ","إِذِ اِ۪نۢبَعَثَ أَشْقَيٰهَا","فَقَالَ لَهُمْ رَسُولُ اُ۬للَّهِ نَاقَةَ اَ۬للَّهِ وَسُقْيَاهَا","فَكَذَّبُوهُ فَعَقَرُوهَا فَدَمْدَمَ عَلَيْهِمْ رَبُّهُم بِذَنۢبِهِمْ فَسَوَّيٰهَاۖ","فَلَا يَخَافُ عُقْبَٰهَاۖ"]],["الليل",["وَاليْلِ إِذَا يَغْش۪ىٰ","وَالنَّه۪ارِ إِذَا تَجَلّ۪ىٰ","وَمَا خَلَقَ اَ۬لذَّكَرَ وَالُانث۪ىٰٓ","إِنَّ سَعْيَكُمْ لَشَتّ۪ىٰۖ","فَأَمَّا مَنَ اَعْط۪ىٰ وَاتَّق۪ىٰ","وَصَدَّقَ بِالْحُسْن۪ىٰ","فَسَنُيَسِّرُهُۥ لِلْيُسْر۪ىٰۖ","وَأَمَّا مَنۢ بَخِلَ وَاسْتَغْن۪ىٰ","وَكَذَّبَ بِالْحُسْن۪ىٰ","فَسَنُيَسِّرُهُۥ لِلْعُسْر۪ىٰۖ","وَمَا يُغْنِے عَنْهُ مَالُهُۥٓ إِذَا تَرَدّ۪ىٰٓۖ","إِنَّ عَلَيْنَا لَلْهُد۪ىٰ","وَإِنَّ لَنَا لَلَاخِرَةَ وَالُاول۪ىٰۖ","فَأَنذَرْتُكُمْ نَاراٗ تَلَظّ۪ىٰ","لَا يَصْلَيٰهَآ إِلَّا اَ۬لَاشْقَي","اَ۬لذِے كَذَّبَ وَتَوَلّ۪ىٰۖ","وَسَيُجَنَّبُهَا اَ۬لَاتْقَي","اَ۬لذِے يُوتِے مَالَهُۥ يَتَزَكّ۪ىٰۖ","وَمَا لِأَحَدٍ عِندَهُۥ مِن نِّعْمَةٖ تُجْز۪ىٰٓ","إِلَّا اَ۪بْتِغَآءَ وَجْهِ رَبِّهِ اِ۬لَاعْل۪ىٰۖ","وَلَسَوْفَ يَرْض۪ىٰۖ"]],["الضحى",["وَالضُّح۪ىٰ","وَاليْلِ إِذَا سَج۪ىٰ","مَا وَدَّعَكَ رَبُّكَ وَمَا قَل۪ىٰۖ","وَلَلَاخِرَةُ خَيْرٞ لَّكَ مِنَ اَ۬لُاول۪ىٰۖ","وَلَسَوْفَ يُعْطِيكَ رَبُّكَ فَتَرْض۪ىٰٓۖ","أَلَمْ يَجِدْكَ يَتِيماٗ فَـَٔاو۪ىٰ","وَوَجَدَكَ ضَآلّاٗ فَهَد۪ىٰ","وَوَجَدَكَ عَآئِلاٗ فَأَغْن۪ىٰۖ","فَأَمَّا اَ۬لْيَتِيمَ فَلَا تَقْهَرْۖ","وَأَمَّا اَ۬لسَّآئِلَ فَلَا تَنْهَرْۖ","وَأَمَّا بِنِعْمَةِ رَبِّكَ فَحَدِّثَۖ"]],["الشرح",["اَلَمْ نَشْرَحْ لَكَ صَدْرَكَ","وَوَضَعْنَا عَنكَ وِزْرَكَ","اَ۬لذِےٓ أَنقَضَ ظَهْرَكَ","وَرَفَعْنَا لَكَ ذِكْرَكَۖ","فَإِنَّ مَعَ اَ۬لْعُسْرِ يُسْراً","اِنَّ مَعَ اَ۬لْعُسْرِ يُسْراٗۖ","فَإِذَا فَرَغْتَ فَانصَبْ","وَإِلَىٰ رَبِّكَ فَارْغَبْۖ"]],["التين",["وَالتِّينِ وَالزَّيْتُونِ","وَطُورِ سِينِينَ","وَهَٰذَا اَ۬لْبَلَدِ اِ۬لَامِينِ","لَقَدْ خَلَقْنَا اَ۬لِانسَٰنَ فِےٓ أَحْسَنِ تَقْوِيمٖ","ثُمَّ رَدَدْنَٰهُ أَسْفَلَ سَٰفِلِينَ","إِلَّا اَ۬لذِينَ ءَامَنُواْ وَعَمِلُواْ اُ۬لصَّٰلِحَٰتِ فَلَهُمُۥٓ أَجْرٌ غَيْرُ مَمْنُونٖۖ","فَمَا يُكَذِّبُكَ بَعْدُ بِالدِّينِۖ","أَلَيْسَ اَ۬للَّهُ بِأَحْكَمِ اِ۬لْحَٰكِمِينَۖ"]],["العلق",["اَ۪قْرَأْ بِاسْمِ رَبِّكَ اَ۬لذِے خَلَقَۖ","خَلَقَ اَ۬لِانسَٰنَ مِنْ عَلَقٍۖ","اِ۪قْرَأْ وَرَبُّكَ اَ۬لَاكْرَمُ","اُ۬لذِے عَلَّمَ بِالْقَلَمِ","عَلَّمَ اَ۬لِانسَٰنَ مَا لَمْ يَعْلَمْۖ","كَلَّآ إِنَّ اَ۬لِانسَٰنَ لَيَطْغ۪ىٰٓ","أَن رّ۪ء۪اهُ اُ۪سْتَغْن۪ىٰٓۖ","إِنَّ إِلَىٰ رَبِّكَ اَ۬لرُّجْع۪ىٰٓۖ","أَرَٰٓيْتَ اَ۬لذِے يَنْه۪ىٰ","عَبْداً اِذَا صَلّ۪ىٰٓۖ","أَرَٰٓيْتَ إِن كَانَ عَلَى اَ۬لْهُد۪ىٰٓ","أَوَ اَمَرَ بِالتَّقْو۪ىٰٓۖ","أَرَٰٓيْتَ إِن كَذَّبَ وَتَوَلّ۪ىٰٓ","أَلَمْ يَعْلَم بِأَنَّ اَ۬للَّهَ يَر۪ىٰۖ","كَلَّا لَئِن لَّمْ يَنتَهِ","لَنَسْفَعاَۢ بِالنَّاصِيَةِ","نَاصِيَةٖ كَٰذِبَةٍ خَاطِئَةٖۖ","فَلْيَدْعُ نَادِيَهُۥ","سَنَدْعُ اُ۬لزَّبَانِيَةَۖ","كَلَّا لَا تُطِعْهُ وَاسْجُدْ وَاقْتَرِبِۖ"]],["القدر",["اِنَّآ أَنزَلْنَٰهُ فِے لَيْلَةِ اِ۬لْقَدْرِۖ","وَمَآ أَدْر۪يٰكَ مَا لَيْلَةُ اُ۬لْقَدْرِۖ","لَيْلَةُ اُ۬لْقَدْرِ خَيْرٞ مِّنَ اَلْفِ شَهْرٖۖ","تَنَزَّلُ اُ۬لْمَلَٰٓئِكَةُ وَالرُّوحُ فِيهَا بِإِذْنِ رَبِّهِم مِّن كُلِّ أَمْرٖۖ","سَلَٰمٌ هِيَ حَتَّىٰ مَطْلَعِ اِ۬لْفَجْرِۖ"]],["البينة",["لَمْ يَكُنِ اِ۬لذِينَ كَفَرُواْ مِنَ اَهْلِ اِ۬لْكِتَٰبِ وَالْمُشْرِكِينَ مُنفَكِّينَ حَتَّىٰ تَاتِيَهُمُ اُ۬لْبَيِّنَةُۖ","رَسُولٞ مِّنَ اَ۬للَّهِ يَتْلُواْ صُحُفاٗ مُّطَهَّرَةٗ","فِيهَا كُتُبٞ قَيِّمَةٞۖ","وَمَا تَفَرَّقَ اَ۬لذِينَ أُوتُواْ اُ۬لْكِتَٰبَ إِلَّا مِنۢ بَعْدِ مَا جَآءَتْهُمُ اُ۬لْبَيِّنَةُۖ","وَمَآ أُمِرُوٓاْ إِلَّا لِيَعْبُدُواْ اُ۬للَّهَ مُخْلِصِينَ لَهُ اُ۬لدِّينَ حُنَفَآءَ وَيُقِيمُواْ اُ۬لصَّلَوٰةَ وَيُوتُواْ اُ۬لزَّكَوٰةَۖ وَذَٰلِكَ دِينُ اُ۬لْقَيِّمَةِۖ","إِنَّ اَ۬لذِينَ كَفَرُواْ مِنَ اَهْلِ اِ۬لْكِتَٰبِ وَالْمُشْرِكِينَ فِے ن۪ارِ جَهَنَّمَ خَٰلِدِينَ فِيهَآۖ أُوْلَٰٓئِكَ هُمْ شَرُّ اُ۬لْبَرِيَٓٔةِۖ","إِنَّ اَ۬لذِينَ ءَامَنُواْ وَعَمِلُواْ اُ۬لصَّٰلِحَٰتِ أُوْلَٰٓئِكَ هُمْ خَيْرُ اُ۬لْبَرِيَٓٔةِۖ","جَزَآؤُهُمْ عِندَ رَبِّهِمْ جَنَّٰتُ عَدْنٖ تَجْرِے مِن تَحْتِهَا اَ۬لَانْهَٰرُ خَٰلِدِينَ فِيهَآ أَبَداٗۖ رَّضِيَ اَ۬للَّهُ عَنْهُمْ وَرَضُواْ عَنْهُۖ ذَٰلِكَ لِمَنْ خَشِيَ رَبَّهُۥٓۖ"]],["الزلزلة",["إِذَا زُلْزِلَتِ اِ۬لَارْضُ زِلْزَالَهَا","وَأَخْرَجَتِ اِ۬لَارْضُ أَثْقَالَهَا","وَقَالَ اَ۬لِانسَٰنُ مَا لَهَا","يَوْمَئِذٖ تُحَدِّثُ أَخْبَارَهَا","بِأَنَّ رَبَّكَ أَوْح۪ىٰ لَهَاۖ","يَوْمَئِذٖ يَصْدُرُ اُ۬لنَّاسُ أَشْتَاتاٗ","لِّيُرَوَاْ اَعْمَٰلَهُمْۖ","فَمَنْ يَّعْمَلْ مِثْقَالَ ذَرَّةٍ خَيْراٗ يَرَهُۥۖ","وَمَنْ يَّعْمَلْ مِثْقَالَ ذَرَّةٖ شَرّاٗ يَرَهُۥۖ"]],["العاديات",["وَالْعَٰدِيَٰتِ ضَبْحاٗ","فَالْمُورِيَٰتِ قَدْحاٗ","فَالْمُغِيرَٰتِ صُبْحاٗ","فَأَثَرْنَ بِهِۦ نَقْعاٗ","فَوَسَطْنَ بِهِۦ جَمْعاً","اِنَّ اَ۬لِانسَٰنَ لِرَبِّهِۦ لَكَنُودٞ","وَإِنَّهُۥ عَلَىٰ ذَٰلِكَ لَشَهِيدٞ","وَإِنَّهُۥ لِحُبِّ اِ۬لْخَيْرِ لَشَدِيدٌۖ","۞ اَفَلَا يَعْلَمُ إِذَا بُعْثِرَ مَا فِے اِ۬لْقُبُورِ","وَحُصِّلَ مَا فِے اِ۬لصُّدُورِ","إِنَّ رَبَّهُم بِهِمْ يَوْمَئِذٖ لَّخَبِيرٌۖ"]],["القارعة",["اِ۬لْقَارِعَةُ مَا اَ۬لْقَارِعَةُۖ","وَمَآ أَدْر۪يٰكَ مَا اَ۬لْقَارِعَةُۖ","يَوْمَ يَكُونُ اُ۬لنَّاسُ كَالْفَرَاشِ اِ۬لْمَبْثُوثِ","وَتَكُونُ اُ۬لْجِبَالُ كَالْعِهْنِ اِ۬لْمَنفُوشِۖ","فَأَمَّا مَن ثَقُلَتْ مَوَٰزِينُهُۥ","فَهُوَ فِے عِيشَةٖ رَّاضِيَةٖۖ","وَأَمَّا مَنْ خَفَّتْ مَوَٰزِينُهُۥ","فَأُمُّهُۥ هَاوِيَةٞۖ","وَمَآ أَدْر۪يٰكَ مَا هِيَهْۖ","نَارٌ حَامِيَةٌۖ"]],["التكاثر",["اَلْه۪يٰكُمُ اُ۬لتَّكَاثُرُ","حَتَّىٰ زُرْتُمُ اُ۬لْمَقَابِرَۖ","كَلَّا سَوْفَ تَعْلَمُونَ","ثُمَّ كَلَّا سَوْفَ تَعْلَمُونَۖ","كَلَّا لَوْ تَعْلَمُونَ عِلْمَ اَ۬لْيَقِينِۖ","لَتَرَوُنَّ اَ۬لْجَحِيمَ","ثُمَّ لَتَرَوُنَّهَا عَيْنَ اَ۬لْيَقِينِ","ثُمَّ لَتُسْـَٔلُنَّ يَوْمَئِذٍ عَنِ اِ۬لنَّعِيمِۖ"]],["العصر",["وَالْعَصْرِ إِنَّ اَ۬لِانسَٰنَ لَفِے خُسْرٍ","اِلَّا اَ۬لذِينَ ءَامَنُواْ وَعَمِلُواْ اُ۬لصَّٰلِحَٰتِ وَتَوَاصَوْاْ بِالْحَقِّ","وَتَوَاصَوْاْ بِالصَّبْرِۖ"]],["الهمزة",["وَيْلٞ لِّكُلِّ هُمَزَةٖ لُّمَزَةٍ","اِ۬لذِے جَمَعَ مَالاٗ وَعَدَّدَهُۥ","يَحْسِبُ أَنَّ مَالَهُۥٓ أَخْلَدَهُۥ","كَلَّاۖ لَيُنۢبَذَنَّ فِے اِ۬لْحُطَمَةِۖ","وَمَآ أَدْر۪يٰكَ مَا اَ۬لْحُطَمَةُۖ","نَارُ اُ۬للَّهِ اِ۬لْمُوقَدَةُ","اُ۬لتِے تَطَّلِعُ عَلَى اَ۬لَافْـِٕدَةِۖ","إِنَّهَا عَلَيْهِم مُّوصَدَةٞ","فِے عَمَدٖ مُّمَدَّدَةٍۖ"]],["الفيل",["اَلَمْ تَرَ كَيْفَ فَعَلَ رَبُّكَ بِأَصْحَٰبِ اِ۬لْفِيلِۖ","أَلَمْ يَجْعَلْ كَيْدَهُمْ فِے تَضْلِيلٖ","وَأَرْسَلَ عَلَيْهِمْ طَيْراً اَبَابِيلَ","تَرْمِيهِم بِحِجَارَةٖ مِّن سِجِّيلٖ","فَجَعَلَهُمْ كَعَصْفٖ مَّاكُولٖۖ"]],["قريش",["لِّإِيلَٰفِ قُرَيْشٍ","اِيلَٰفِهِمْ رِحْلَةَ اَ۬لشِّتَآءِ وَالصَّيْفِۖ","فَلْيَعْبُدُواْ رَبَّ هَٰذَا اَ۬لْبَيْتِ","اِ۬لذِےٓ أَطْعَمَهُم مِّن جُوعٖ","وَءَامَنَهُم مِّنْ خَوْفٍۖ"]],["الماعون",["اَرَٰٓيْتَ اَ۬لذِے يُكَذِّبُ بِالدِّينِ","فَذَٰلِكَ اَ۬لذِے يَدُعُّ اُ۬لْيَتِيمَ","وَلَا يَحُضُّ عَلَىٰ طَعَامِ اِ۬لْمِسْكِينِۖ","فَوَيْلٞ لِّلْمُصَلِّينَ","اَ۬لذِينَ هُمْ عَن صَلَاتِهِمْ سَاهُونَ","اَ۬لذِينَ هُمْ يُرَآءُونَ وَيَمْنَعُونَ اَ۬لْمَاعُونَۖ"]],["الكوثر",["إِنَّآ أَعْطَيْنَٰكَ اَ۬لْكَوْثَرَ","فَصَلِّ لِرَبِّكَ وَانْحَرِۖ","اِنَّ شَانِئَكَ هُوَ اَ۬لَابْتَرُۖ"]],["الكافرون",["قُلْ يَٰٓأَيُّهَا اَ۬لْكَٰفِرُونَ","لَآ أَعْبُدُ مَا تَعْبُدُونَ","وَلَآ أَنتُمْ عَٰبِدُونَ مَآ أَعْبُدُۖ","وَلَآ أَنَا عَابِدٞ مَّا عَبَدتُّمْ","وَلَآ أَنتُمْ عَٰبِدُونَ مَآ أَعْبُدُۖ","لَكُمْ دِينُكُمْ وَلِيَ دِينِۖ"]],["النصر",["إِذَا جَآءَ نَصْرُ اُ۬للَّهِ وَالْفَتْحُ","وَرَأَيْتَ اَ۬لنَّاسَ يَدْخُلُونَ فِے دِينِ اِ۬للَّهِ أَفْوَاجاٗ","فَسَبِّحْ بِحَمْدِ رَبِّكَ وَاسْتَغْفِرْهُۖ إِنَّهُۥ كَانَ تَوَّاباٗۖ"]],["المسد",["تَبَّتْ يَدَآ أَبِے لَهَبٖ وَتَبَّۖ","مَآ أَغْن۪ىٰ عَنْهُ مَالُهُۥ وَمَا كَسَبَۖ","سَيَصْلَىٰ نَاراٗ ذَاتَ لَهَبٖ","وَامْرَأَتُهُۥۖ حَمَّالَةُ اُ۬لْحَطَبِ","فِے جِيدِهَا حَبْلٞ مِّن مَّسَدٖۖ"]],["الإخلاص",["قُلْ هُوَ اَ۬للَّهُ أَحَدٌۖ","اِ۬للَّهُ اُ۬لصَّمَدُۖ","لَمْ يَلِدْ وَلَمْ يُولَدْۖ","وَلَمْ يَكُن لَّهُۥ كُفُؤاً اَحَدٞۖ"]],["الفلق",["قُلَ اَعُوذُ بِرَبِّ اِ۬لْفَلَقِ","مِن شَرِّ مَا خَلَقَ","وَمِن شَرِّ غَاسِقٍ اِذَا وَقَبَ","وَمِن شَرِّ اِ۬لنَّفَّٰثَٰتِ فِے اِ۬لْعُقَدِ","وَمِن شَرِّ حَاسِدٍ اِذَا حَسَدَۖ"]],["الناس",["قُلَ اَعُوذُ بِرَبِّ اِ۬لنَّاسِ","مَلِكِ اِ۬لنَّاسِ","إِلَٰهِ اِ۬لنَّاسِ","مِن شَرِّ اِ۬لْوَسْوَاسِ اِ۬لْخَنَّاسِ","اِ۬لذِے يُوَسْوِسُ فِے صُدُورِ اِ۬لنَّاسِ","مِنَ اَ۬لْجِنَّةِ وَالنَّاسِۖ"]]]</script>

/* ───── تقسيم الآية لسؤال «أكمل الآية» ───── */
function splitAyah(text) {
  const tk = tokensOf(text), n = tk.length;

  const L = tk.map(x => letterCount(x.w)), total = L.reduce((a, b) => a + b, 0);
  let best = 2, bd = 1e9, acc = L[0] + L[1];
  for (let k = 2; k <= n - 2; k++) {
    if (k > 2) acc += L[k - 1];
    const d = Math.abs(acc - total / 2);
    if (d < bd) { bd = d; best = k; }
  }
  return { stem: text.slice(tk[0].at, tk[best - 1].at + tk[best - 1].w.length), comp: text.slice(tk[best].at, tk[n - 1].at + tk[n - 1].w.length), k: best };
}

const C1 = { e: [4, 10, 70], m: [5, 14, 100], a: [6, 22, 140] };

      opts: opts.map(o => ({ h: `<span class="q">${esc(o)}</span>`, q: true })), correct: opts.indexOf(sp.comp),
      exp: `الآية رقم ${toAr(x.a)} من سورة ${esc(surahName(x.s))}:<div class="verse">${verseHTML(x.t)}</div>`,
      meta: { s: x.s, a: x.a, stem: sp.stem, comp: sp.comp, opts },

  $('rPts').textContent = toAr(G.pts); $('rOk').textContent = toAr(G.ok); $('rBad').textContent = toAr(G.bad);
  $('rTitle').textContent = pct >= .9 ? 'ما شاء الله! أداء مبهر' : pct >= .7 ? 'أحسنتِ! أداء رائع' : pct >= .5 ? 'جيد جداً، واصلي!' : 'بداية طيبة، والتكرار يُتقن';
  $('rMsg').textContent = pct >= .7 ? 'بارك الله فيكِ وزادكِ علماً ونوراً.' : 'كل جولة تزيدكِ معرفة، فأعيدي اللعب وستتحسنين بإذن الله.';
  $('results').classList.add('show'); sWin(); confetti(80);
}
function burst() { confetti(22); }
function confetti(n) {
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cols = ['#F0BDCB', '#A9D9C3', '#E7D193', '#C8BAE6', '#C9A24B', '#F9DDE5'], frag = document.createDocumentFragment(), list = [];
  for (let i = 0; i < n; i++) {
    const p = document.createElement('i'); p.className = 'confetti'; const w = 6 + Math.random() * 8;
    p.style.cssText = `left:${Math.random() * 100}vw;width:${w}px;height:${w * (Math.random() > .5 ? 1 : 1.8)}px;background:${cols[i % cols.length]};border-radius:${Math.random() > .5 ? '50%' : '2px'};--dx:${(Math.random() - .5) * 160}px;--rot:${Math.random() * 900 - 450}deg;animation-duration:${2.4 + Math.random() * 2.4}s;animation-delay:${Math.random() * .6}s`;
    list.push(p); frag.appendChild(p);
  }
  document.body.appendChild(frag); setTimeout(() => list.forEach(p => p.remove()), 6000);
}

/* ───── الإقلاع ───── */
function bind() {
  buildWheel();
  $('spinBtn').addEventListener('click', spin);
  $('qNext').addEventListener('click', next);
  $('again').addEventListener('click', startRound);
  $('toHome').addEventListener('click', () => { $('results').classList.remove('show'); $('game').hidden = true; $('welcome').hidden = false; G.phase = 'welcome'; });
  $('homeBtn').addEventListener('click', () => { if (G.phase === 'spin' || G.phase === 'asking') return; $('game').hidden = true; $('welcome').hidden = false; G.phase = 'welcome'; });
  $('startBtn').addEventListener('click', () => { tone(1, 0, .01); startRound(); });
  document.querySelectorAll('input[name=lvl]').forEach(r => r.addEventListener('change', () => { G.level = r.value; }));
  $('snd').addEventListener('click', () => { soundOn = !soundOn; $('snd').setAttribute('aria-pressed', soundOn); $('snd').textContent = soundOn ? '🔊' : '🔇'; $('snd').setAttribute('aria-label', soundOn ? 'كتم الصوت' : 'تشغيل الصوت'); });
}
(async function init() {
  bind();
  $('startBtn').disabled = true;
  try { await document.fonts.load('22px "UthmanicWarsh"'); } catch (e) { /* نتابع */ }
  if (!await loadData()) return;
  $('srcOk').textContent = srcNote;
  $('startBtn').disabled = false;
  window.__qw = { SECTIONS, BANK, AY, QURAN, UNIQ, G, W, fmt, makeQuestion, gen: (sec, lvl) => (DYN[sec] ? DYN[sec](lvl) : fromBank(sec, lvl)), fromBank, sectorAt, spin, startRound, DUPN, classify4, classify5, tierOfSurah, tokensOf };
})();

</script>
