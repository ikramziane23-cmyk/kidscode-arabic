ِينَ ءَامَنُواْ وَلَمْ يُهَاجِرُواْ مَا لَكُم مِّنْ وَّلَٰيَتِهِم مِّن شَےْءٍ حَتَّىٰ يُهَاجِرُواْۖ وَإِنِ اِ۪سْتَنصَرُوكُمْ فِے اِ۬لدِّينِ فَعَلَيْكُمُ اُ۬لنَّصْرُ إِلَّا عَلَىٰ قَوْمِۢ بَيْنَكُمْ وَبَيْنَهُم مِّيثَٰقٞۖ وَاللَّهُ بِمَا تَعْمَلُونَ بَصِيرٞۖ","وَالذِينَ كَفَرُواْ بَعْضُهُمُۥٓ أَوْلِيَآءُ بَعْضٍۖ اِلَّا تَفْعَلُوهُ تَكُن فِتْنَةٞ فِے اِ۬لَارْضِ وَفَسَادٞ كَبِيرٞۖ","وَالذِينَ ءَامَنُواْ وَهَاجَرُواْ وَجَٰهَدُواْ فِے سَبِيلِ اِ۬للَّهِ وَالذِينَ ءَاوَواْ وَّنَصَرُوٓاْ أُوْلَٰٓئِكَ هُمُ اُ۬لْمُومِنُونَ حَقّاٗۖ لَّهُم مَّغْفِرَةٞ وَرِزْقٞ كَرِيمٞۖ","وَالذِينَ ءَامَنُواْ مِنۢ بَعْدُ وَهَاجَرُواْ وَجَٰهَدُواْ مَعَكُمْ فَأُوْلَٰٓئِكَ مِنكُمْۖ وَأُوْلُواْ اُ۬لَارْحَامِ بَعْضُهُمُۥٓ أَوْل۪ىٰ بِبَعْضٖ فِے كِتَٰبِ اِ۬للَّهِۖ إِنَّ اَ۬للَّهَ بِكُلِّ شَےْءٍ عَلِيمُۢۖ"]],["التوبة",["بَرَآءَةٞ مِّنَ اَ۬للَّهِ وَرَسُولِهِۦٓ إِلَى اَ۬لذِينَ عَٰهَدتُّم مِّنَ اَ۬لْمُشْرِكِينَۖ","فَسِيحُواْ فِے اِ۬لَارْضِ أَرْبَعَةَ أَشْهُرٖۖ وَاعْلَمُوٓاْ أَنَّكُمْ غَيْرُ مُعْجِزِے اِ۬للَّهِ وَأَنَّ اَ۬للَّهَ مُخْزِے اِ۬لْكٰ۪فِرِينَۖ","وَأَذَٰنٞ مِّنَ اَ۬للَّهِ وَرَسُولِهِۦٓ إِلَى اَ۬لنَّاسِ يَوْمَ اَ۬لْحَجِّ اِ۬لَاكْبَرِ أَنَّ اَ۬للَّهَ بَرِےٓءٞ مِّنَ اَ۬لْمُشْرِكِينَ وَرَسُولُهُۥۖ فَإِن تُبْتُمْ فَهُوَ خَيْرٞ لَّكُمْۖ وَإِن تَوَلَّيْتُمْ فَاعْلَمُوٓاْ أَنَّكُمْ غَيْرُ مُعْجِزِے اِ۬للَّهِۖ وَبَشِّرِ اِ۬لذِينَ كَفَرُواْ بِعَذَابٍ اَلِيمٍ","اِلَّا اَ۬لذِينَ عَٰهَدتُّم مِّنَ اَ۬لْمُشْرِكِينَ ثُمَّ لَمْ يَنقُصُوكُمْ شَئْاٗ وَلَمْ يُظَٰهِرُواْ عَلَيْكُمُۥٓ أَحَداٗ فَأَتِمُّوٓاْ إِلَيْهِمْ عَهْدَهُمُۥٓ إِلَىٰ مُدَّتِهِمُۥٓۖ إِنَّ اَ۬للَّهَ يُحِبُّ اُ۬لْمُتَّقِينَۖ","۞ فَإِذَا اَ۪نسَلَخَ اَ۬لَاشْهُرُ اُ۬لْحُرُمُ فَاقْتُلُواْ اُ۬لْمُشْرِكِينَ حَيْثُ وَجَدتُّمُوهُمْ وَخُذُوهُمْ وَاحْصُرُوهُمْ وَاقْعُدُواْ لَهُمْ كُلَّ مَرْصَدٖۖ فَإِن تَابُواْ وَأَقَامُواْ اُ۬لصَّلَوٰةَ وَءَاتَوُاْ اُ۬لزَّكَوٰةَ فَخَلُّواْ سَبِيلَهُمُۥٓۖ إِنَّ اَ۬للَّهَ غَفُورٞ رَّحِيمٞۖ","وَإِنَ اَحَدٞ مِّنَ اَ۬لْمُشْرِكِينَ اَ۪سْتَجَارَكَ فَأَجِرْهُ حَتَّىٰ يَسْمَعَ كَلَٰمَ اَ۬للَّهِ ثُمَّ أَبْلِغْهُ مَامَنَهُۥۖ ذَٰلِكَ بِأَنَّهُمْ قَوْمٞ لَّا يَعْلَمُونَۖ","كَيْفَ يَكُونُ لِلْمُشْرِكِينَ عَهْدٌ عِندَ اَ۬للَّهِ وَعِندَ رَسُولِهِۦٓ إِلَّا اَ۬لذِينَ عَٰهَدتُّمْ عِندَ اَ۬لْمَسْجِدِ اِ۬لْحَرَامِ فَمَا اَ۪سْتَقَٰمُواْ لَكُمْ فَاسْتَقِيمُواْ لَهُمُۥٓۖ إِنَّ اَ۬للَّهَ يُحِبُّ اُ۬لْمُتَّقِينَۖ","كَيْفَ وَإِنْ يَّظْهَرُواْ عَلَيْكُمْ لَا يَرْقُبُواْ فِيكُمُۥٓ إِلّاٗ وَلَا ذِمَّةٗۖ يُرْضُونَكُم بِأَفْوَٰهِهِمْ وَتَاب۪ىٰ قُلُوبُهُمْ وَأَكْثَرُهُمْ فَٰسِقُونَۖ","اَ۪شْتَرَوْاْ بِـَٔايَٰتِ اِ۬للَّهِ ثَمَناٗ قَلِيلاٗ فَصَدُّواْ عَن سَبِيلِهِۦٓۖ إِنَّهُمْ سَآءَ مَا كَانُواْ يَعْمَلُونَۖ","لَا يَرْقُبُونَ فِے مُومِنٍ اِلّاٗ وَلَا ذِمَّةٗۖ وَأُوْلَٰٓئِكَ هُمُ اُ۬لْمُعْتَدُونَۖ","فَإِن تَابُواْ وَأَقَامُواْ اُ۬لصَّلَوٰةَ وَءَاتَوُاْ اُ۬لزَّكَوٰةَ فَإِخْوَٰنُكُمْ فِے اِ۬لدِّينِۖ وَنُفَصِّلُ اُ۬لَايَٰتِ لِقَوْمٖ يَعْلَمُونَۖ","۞ وَإِن نَّكَثُوٓاْ أَيْمَٰنَهُم مِّنۢ بَعْدِ عَهْدِهِمْ وَطَعَنُواْ فِے دِينِكُمْ فَقَٰتِلُوٓاْ أَي۪مَّةَ اَ۬لْكُفْرِۖ إِنَّهُمْ لَآ أَيْمَٰنَ لَهُمْ لَعَلَّهُمْ يَنتَهُونَۖ","أَلَا تُقَٰتِلُونَ قَوْماٗ نَّكَثُوٓاْ أَيْمَٰنَهُمْ وَهَمُّواْ بِإِخْرَاجِ اِ۬لرَّسُولِ وَهُم بَدَءُوكُمُۥٓ أَوَّلَ مَرَّةٍ اَتَخْشَوْنَهُمْۖ فَاللَّهُ أَحَقُّ أَن تَخْشَوْهُ إِن كُنتُم مُّومِنِينَۖ","قَٰتِلُوهُمْ يُعَذِّبْهُمُ اُ۬للَّهُ بِأَيْدِيكُمْ وَيُخْزِهِمْ وَيَنصُرْكُمْ عَلَيْهِمْ وَيَشْفِ صُدُورَ قَوْمٖ مُّومِنِينَ","وَيُذْهِبْ غَيْظَ قُلُوبِهِمْۖ وَيَتُوبُ اُ۬للَّهُ عَلَىٰ مَنْ يَّشَآءُۖ وَاللَّهُ عَلِيمٌ حَكِيمٌۖ","اَمْ حَسِبْتُمُۥٓ أَن تُتْرَكُواْ وَلَمَّا يَعْلَمِ اِ۬للَّهُ اُ۬لذِينَ جَٰهَدُواْ مِنكُمْ وَلَمْ يَتَّخِذُواْ مِن دُونِ اِ۬للَّهِ وَلَا رَسُولِهِۦ وَلَا اَ۬لْمُومِنِينَ وَلِيجَةٗۖ وَاللَّهُ خَبِيرُۢ بِمَا تَعْمَلُونَۖ","مَا كَانَ لِلْمُشْرِكِينَ أَنْ يَّعْمُرُواْ مَسَٰجِدَ اَ۬للَّهِ شَٰهِدِينَ عَلَىٰٓ أَنفُسِهِم بِالْكُفْرِۖ أُوْلَٰٓئِكَ حَبِطَتَ اَعْمَٰلُهُمْ وَفِے اِ۬لنّ۪ارِ هُمْ خَٰلِدُونَۖ","إِنَّمَا يَعْمُرُ مَسَٰجِدَ اَ۬للَّهِ مَنَ اٰمَنَ بِاللَّهِ وَالْيَوْمِ اِ۬لَاخِرِ وَأَقَامَ اَ۬لصَّلَوٰةَ وَءَاتَى اَ۬لزَّكَوٰةَ وَلَمْ يَخْشَ إِلَّا اَ۬للَّهَ فَعَس۪ىٰٓ أُوْلَٰٓئِكَ أَنْ يَّكُونُواْ مِنَ اَ۬لْمُهْتَدِينَۖ","۞ أَجَعَلْتُمْ سِقَايَةَ اَ۬لْحَآجِّ وَعِمَارَةَ اَ۬لْمَسْجِدِ اِ۬لْحَرَامِ كَمَنَ اٰمَنَ بِاللَّهِ وَالْيَوْمِ اِ۬لَاخِرِ وَجَٰهَدَ فِے سَبِيلِ اِ۬للَّهِۖ لَا يَسْتَوُۥنَ عِندَ اَ۬للَّهِۖ وَاللَّهُ لَا يَهْدِے اِ۬لْقَوْمَ اَ۬لظَّٰلِمِينَۖ","اَ۬لذِينَ ءَامَنُواْ وَهَاجَرُواْ وَجَٰهَدُواْ فِے سَبِيلِ اِ۬للَّهِ بِأَمْوَٰلِهِمْ وَأَنفُسِهِمُۥٓ أَعْظَمُ دَرَجَةً عِندَ اَ۬للَّهِۖ وَأُوْلَٰٓئِكَ هُمُ اُ۬لْفَآئِزُونَۖ","يُبَشِّرُهُمْ رَبُّهُم بِرَحْمَةٖ مِّنْهُ وَرِضْوَٰنٖ وَجَنَّٰتٖ لَّهُمْ فِيهَا نَعِيمٞ مُّقِيمٌ","خَٰلِدِينَ فِيهَآ أَبَداًۖ اِنَّ اَ۬للَّهَ عِندَهُۥٓ أَجْرٌ عَظِيمٞۖ","يَٰٓأَيُّهَا اَ۬لذِينَ ءَامَنُواْ لَا تَتَّخِذُوٓاْ ءَابَآءَكُمْ وَإِخْوَٰنَكُمُۥٓ أَوْلِيَآءَ ا۪نِ اِ۪سْتَحَبُّواْ اُ۬لْكُفْرَ عَلَى اَ۬لِايمَٰنِۖ وَمَنْ يَّتَوَلَّهُم مِّنكُمْ فَأُوْلَٰٓئِكَ هُمُ اُ۬لظَّٰلِمُونَۖ","قُلِ اِن كَانَ ءَابَآؤُكُمْ وَأَبْنَآؤُكُمْ وَإِخْوَٰنُكُمْ وَأَزْوَٰجُكُمْ وَعَشِيرَتُكُمْ وَأَمْوَٰلٌ اِ۪قْتَرَفْتُمُوهَا وَتِجَٰرَةٞ تَخْشَوْنَ كَسَادَهَا وَمَسَٰكِنُ تَرْضَوْنَهَآ أَحَبَّ إِلَيْكُم مِّنَ اَ۬للَّهِ وَرَسُولِهِۦ وَجِهَادٖ فِے سَبِيلِهِۦ فَتَرَبَّصُواْ حَتَّىٰ يَاتِيَ اَ۬للَّهُ بِأَمْرِهِۦۖ وَاللَّهُ لَا يَهْدِے اِ۬لْقَوْمَ اَ۬لْفَٰسِقِينَۖ","لَقَدْ نَصَرَكُمُ اُ۬للَّهُ فِے مَوَاطِنَ كَثِيرَةٖ وَيَوْمَ حُنَيْنٍ اِذَ اَعْجَبَتْكُمْ كَثْرَتُكُمْ فَلَمْ تُغْنِ عَنكُمْ شَئْاٗ وَضَاقَتْ عَلَيْكُمُ اُ۬لَارْضُ بِمَا رَحُبَتْ ثُمَّ وَلَّيْتُم مُّدْبِرِينَۖ","ثُمَّ أَنزَلَ اَ۬للَّهُ سَكِينَتَهُۥ عَلَىٰ رَسُولِهِۦ وَعَلَى اَ۬لْمُومِنِينَ وَأَنزَلَ جُنُوداٗ لَّمْ تَرَوْهَا وَعَذَّبَ اَ۬لذِينَ كَفَرُواْۖ وَذَٰلِكَ جَزَآءُ اُ۬لْكٰ۪فِرِينَۖ","ثُمَّ يَتُوبُ اُ۬للَّهُ مِنۢ بَعْدِ ذَٰلِكَ عَلَىٰ مَنْ يَّشَآءُۖ وَاللَّهُ غَفُورٞ رَّحِيمٞۖ","۞ يَٰٓأَيُّهَا اَ۬لذِينَ ءَامَنُوٓاْ إِنَّمَا اَ۬لْمُشْرِكُونَ نَجَسٞ فَلَا يَقْرَبُواْ اُ۬لْمَسْجِدَ اَ۬لْحَرَامَ بَعْدَ عَامِهِمْ هَٰذَاۖ وَإِنْ خِفْتُمْ عَيْلَةٗ فَسَوْفَ يُغْنِيكُمُ اُ۬للَّهُ مِن فَضْلِهِۦٓ إِن شَآءَۖ ا۪نَّ اَ۬للَّهَ عَلِيمٌ حَكِيمٞۖ","قَٰتِلُواْ اُ۬لذِينَ لَا يُومِنُونَ بِاللَّهِ وَلَا بِالْيَوْمِ اِ۬لَاخِرِ وَلَا يُحَرِّمُونَ مَا حَرَّمَ اَ۬للَّهُ وَرَسُولُهُۥ وَلَا يَدِينُونَ دِينَ اَ۬لْحَقِّ مِنَ اَ۬لذِينَ أُوتُواْ اُ۬لْكِتَٰبَ حَتَّىٰ يُعْطُواْ اُ۬لْجِزْيَةَ عَنْ يَّدٖ وَهُمْ صَٰغِرُونَۖ","وَقَالَتِ اِ۬لْيَهُودُ عُزَيْرُ اُ۪بْنُ اُ۬للَّهِۖ وَقَالَتِ اِ۬لنَّصَٰرَى اَ۬لْمَسِيحُ اُ۪بْنُ اُ۬للَّهِۖ ذَٰلِكَ قَوْلُهُم بِأَفْوَٰهِهِمْ يُضَٰهُونَ قَوْلَ اَ۬لذِينَ كَفَرُواْ مِن قَبْلُۖ قَٰتَلَهُمُ اُ۬للَّهُۖ أَنّ۪ىٰ يُوفَكُونَۖ","اَ۪تَّخَذُوٓاْ أَحْبَارَهُمْ وَرُهْبَٰنَهُمُۥٓ أَرْبَاباٗ مِّن دُونِ اِ۬للَّهِ وَالْمَسِيحَ اَ۪بْنَ مَرْيَمَۖ وَمَآ أُمِرُوٓاْ إِلَّا لِيَعْبُدُوٓاْ إِلَٰهاٗ وَٰحِداٗۖ لَّآ إِلَٰهَ إِلَّا هُوَۖ سُبْحَٰنَهُۥ عَمَّا يُشْرِكُونَۖ","يُرِيدُونَ أَنْ يُّطْفِـُٔواْ نُورَ اَ۬للَّهِ بِأَفْوَٰهِهِمْ وَيَابَى اَ۬للَّهُ إِلَّآ أَنْ يُّتِمَّ نُورَهُۥ وَلَوْ كَرِهَ اَ۬لْكَٰفِرُونَۖ","هُوَ اَ۬لذِےٓ أَرْسَلَ رَسُولَهُۥ بِالْهُد۪ىٰ وَدِينِ اِ۬لْحَقِّ لِيُظْهِرَهُۥ عَلَى اَ۬لدِّينِ كُلِّهِۦ وَلَوْ كَرِهَ اَ۬لْمُشْرِكُونَۖ","۞ يَٰٓأَيُّهَا اَ۬لذِينَ ءَامَنُوٓاْ إِنَّ كَثِيراٗ مِّنَ اَ۬لَاحْب۪ارِ وَالرُّهْبَانِ لَيَاكُلُونَ أَمْوَٰلَ اَ۬لنَّاسِ بِالْبَٰطِلِ وَيَصُدُّونَ عَن سَبِيلِ اِ۬للَّهِۖ وَالذِينَ يَكْنِزُونَ اَ۬لذَّهَبَ وَالْفِضَّةَ وَلَا يُنفِقُونَهَا فِے سَبِيلِ اِ۬للَّهِ فَبَشِّرْهُم بِعَذَابٍ اَلِيمٖۖ","يَوْمَ يُحْم۪ىٰ عَلَيْهَا فِے ن۪ارِ جَهَنَّمَ فَتُكْو۪ىٰ بِهَا جِبَاهُهُمْ وَجُنُوبُهُمْ وَظُهُورُهُمْ هَٰذَا مَا كَنَزْتُمْ لِأَنفُسِكُمْ فَذُوقُواْ مَا كُنتُمْ تَكْنِزُونَۖ","إِنَّ عِدَّةَ اَ۬لشُّهُورِ عِندَ اَ۬للَّهِ اِ۪ثْنَا عَشَرَ شَهْراٗ فِے كِتَٰبِ اِ۬للَّهِ يَوْمَ خَلَقَ اَ۬لسَّمَٰوَٰتِ وَالَارْضَۖ مِنْهَآ أَرْبَعَةٌ حُرُمٞۖ ذَٰلِكَ اَ۬لدِّينُ اُ۬لْقَيِّمُۖ فَلَا تَظْلِمُواْ فِيهِنَّ أَنفُسَكُمْۖ وَقَٰتِلُواْ اُ۬لْمُشْرِكِينَ كَآفَّةٗ كَمَا يُقَٰتِلُونَكُمْ كَآفَّةٗۖ وَاعْلَمُوٓاْ أَنَّ اَ۬للَّهَ مَعَ اَ۬لْمُتَّقِينَۖ","إِنَّمَا اَ۬لنَّسِيُّ زِيَادَةٞ فِے اِ۬لْكُفْرِ يَضِلُّ بِهِ اِ۬لذِينَ كَفَرُواْ يُحِلُّونَهُۥ عَاماٗ وَيُحَرِّمُونَهُۥ عَاماٗ لِّيُوَاطِـُٔواْ عِدَّةَ مَا حَرَّمَ اَ۬للَّهُ فَيُحِلُّواْ مَا حَرَّمَ اَ۬للَّهُۖ زُيِّنَ لَهُمْ سُوٓءُ اَ۬عْمَٰلِهِمْۖ وَاللَّهُ لَا يَهْدِے اِ۬لْقَوْمَ اَ۬لْكٰ۪فِرِينَۖ","يَٰٓأَيُّهَا اَ۬لذِينَ ءَامَنُواْ مَا لَكُمُۥٓ إِذَا قِيلَ لَكُمُ اُ۪نفِرُواْ فِے سَبِيلِ اِ۬للَّهِ اِ۪ثَّاقَلْتُمُۥٓ إِلَى اَ۬لَارْضِۖ أَرَضِيتُم بِالْحَيَوٰةِ اِ۬لدُّنْي۪ا مِنَ اَ۬لَاخِرَةِۖ فَمَا مَتَٰعُ اُ۬لْحَيَوٰةِ اِ۬لدُّنْي۪ا فِے اِ۬لَاخِرَةِ إِلَّا قَلِيلٌۖ","اِلَّا تَنفِرُواْ يُعَذِّبْكُمْ عَذَاباً اَلِيماٗ وَيَسْتَبْدِلْ قَوْماً غَيْرَكُمْ وَلَا تَضُرُّوهُ شَئْاٗۖ وَاللَّهُ عَلَىٰ كُلِّ شَےْءٖ قَدِيرٌۖ","۞ اِلَّا تَنصُرُوهُ فَقَدْ نَصَرَهُ اُ۬للَّهُ إِذَ اَخْرَجَهُ اُ۬لذِينَ كَفَرُواْ ثَانِيَ اَ۪ثْنَيْنِ إِذْ هُمَا فِے اِ۬لْغ۪ارِ إِذْ يَقُولُ لِصَٰحِبِهِۦ لَا تَحْزَنِ اِنَّ اَ۬للَّهَ مَعَنَاۖ فَأَنزَلَ اَ۬للَّهُ سَكِينَتَهُۥ عَلَيْهِۖ وَأَيَّدَهُۥ بِجُنُودٖ لَّمْ تَرَوْهَاۖ وَجَعَلَ كَلِمَةَ اَ۬لذِينَ كَفَرُواْ اُ۬لسُّفْل۪ىٰۖ وَكَلِمَةُ اُ۬للَّهِ هِيَ اَ۬لْعُلْي۪اۖ وَاللَّهُ عَزِيزٌ حَكِيمٌۖ","اِ۪نفِرُواْ خِفَافاٗ وَثِقَالاٗ وَجَٰهِدُواْ بِأَمْوَٰلِكُمْ وَأَنفُسِكُمْ فِے سَبِيلِ اِ۬للَّهِۖ ذَٰلِكُمْ خَيْرٞ لَّكُمُۥٓ إِن كُنتُمْ تَعْلَمُونَۖ","لَوْ كَانَ عَرَضاٗ قَرِيباٗ وَسَفَراٗ قَاصِداٗ لَّاتَّبَعُوكَ وَلَٰكِنۢ بَعُدَتْ عَلَيْهِمُ اُ۬لشُّقَّةُۖ وَسَيَحْلِفُونَ بِاللَّهِ لَوِ اِ۪سْتَطَعْنَا لَخَرَجْنَا مَعَكُمْۖ يُهْلِكُونَ أَنفُسَهُمْۖ وَاللَّهُ يَعْلَمُ إِنَّهُمْ لَكَٰذِبُونَۖ","عَفَا اَ۬للَّهُ عَنكَ لِمَ أَذِنتَ لَهُمْ حَتَّىٰ يَتَبَيَّنَ لَكَ اَ۬لذِينَ صَدَقُواْ وَتَعْلَمَ اَ۬لْكَٰذِبِينَۖ","لَا يَسْتَٰذِنُكَ اَ۬لذِينَ يُومِنُونَ بِاللَّهِ وَالْيَوْمِ اِ۬لَاخِرِ أَنْ يُّجَٰهِدُواْ بِأَمْوَٰلِهِمْ وَأَنفُسِهِمْۖ وَاللَّهُ عَلِيمُۢ بِالْمُتَّقِينَۖ","إِنَّمَا يَسْتَٰذِنُكَ اَ۬لذِينَ لَا يُومِنُونَ بِاللَّهِ وَالْيَوْمِ اِ۬لَاخِرِ وَارْتَابَتْ قُلُوبُهُمْ فَهُمْ فِے رَيْبِهِمْ يَتَرَدَّدُونَۖ","۞ وَلَوَ اَرَادُواْ اُ۬لْخُرُوجَ لَأَعَدُّواْ لَهُۥ عُدَّةٗۖ وَلَٰكِن كَرِهَ اَ۬للَّهُ اُ۪نۢبِعَاثَهُمْ فَثَبَّطَهُمْ وَقِيلَ اَ۟قْعُدُواْ مَعَ اَ۬لْقَٰعِدِينَۖ","لَوْ خَرَجُواْ فِيكُم مَّا زَادُوكُمُۥٓ إِلَّا خَبَالاٗ وَلَأَوْضَعُواْ خِلَٰلَكُمْ يَبْغُونَكُمُ اُ۬لْفِتْنَةَ وَفِيكُمْ سَمَّٰعُونَ لَهُمْۖ وَاللَّهُ عَلِيمُۢ بِالظَّٰلِمِينَۖ","لَقَدِ اِ۪بْتَغَوُاْ اُ۬لْفِتْنَةَ مِن قَبْلُ وَقَلَّبُواْ لَكَ اَ۬لُامُورَ حَتَّىٰ جَآءَ اَ۬لْحَقُّ وَظَهَرَ أَمْرُ اُ۬للَّهِ وَهُمْ كَٰرِهُونَۖ","وَمِنْهُم مَّنْ يَّقُولُ اُ۪يذَن لِّے وَلَا تَفْتِنِّےٓۖ أَلَا فِے اِ۬لْفِتْنَةِ سَقَطُواْۖ وَإِنَّ جَهَنَّمَ لَمُحِيطَةُۢ بِالْكٰ۪فِرِينَۖ","إِن تُصِبْكَ حَسَنَةٞ تَسُؤْهُمْۖ وَإِن تُصِبْكَ مُصِيبَةٞ يَقُولُواْ قَدَ اَخَذْنَآ أَمْرَنَا مِن قَبْلُ وَيَتَوَلَّواْ وَّهُمْ فَرِحُونَۖ","قُل لَّنْ يُّصِيبَنَآ إِلَّا مَا كَتَبَ اَ۬للَّهُ لَنَاۖ هُوَ مَوْل۪يٰنَاۖ وَعَلَى اَ۬للَّهِ فَلْيَتَوَكَّلِ اِ۬لْمُومِنُونَۖ","قُلْ هَلْ تَرَبَّصُونَ بِنَآ إِلَّآ إِحْدَى اَ۬لْحُسْنَيَيْنِۖ وَنَحْنُ نَتَرَبَّصُ بِكُمُۥٓ أَنْ يُّصِيبَكُمُ اُ۬للَّهُ بِعَذَابٖ مِّنْ عِندِهِۦٓ أَوْ بِأَيْدِينَاۖ فَتَرَبَّصُوٓاْۖ إِنَّا مَعَكُم مُّتَرَبِّصُونَۖ","قُلَ اَنفِقُواْ طَوْعاً اَوْ كَرْهاٗ لَّنْ يُّتَقَبَّلَ مِنكُمُۥٓۖ إِنَّكُمْ كُنتُمْ قَوْماٗ فَٰسِقِينَۖ","وَمَا مَنَعَهُمُۥٓ أَن تُقْبَلَ مِنْهُمْ نَفَقَٰتُهُمُۥٓ إِلَّآ أَنَّهُمْ كَفَرُواْ بِاللَّهِ وَبِرَسُولِهِۦ وَلَا يَاتُونَ اَ۬لصَّلَوٰةَ إِلَّا وَهُمْ كُسَال۪ىٰ وَلَا يُنفِقُونَ إِلَّا وَهُمْ كَٰرِهُونَۖ","۞ فَلَا تُعْجِبْكَ أَمْوَٰلُهُمْ وَلَآ أَوْلَٰدُهُمُۥٓۖ إِنَّمَا يُرِيدُ اُ۬للَّهُ لِيُعَذِّبَهُم بِهَا فِے اِ۬لْحَيَوٰةِ اِ۬لدُّنْي۪ا وَتَزْهَقَ أَنفُسُهُمْ وَهُمْ كَٰفِرُونَۖ","وَيَحْلِفُونَ بِاللَّهِ إِنَّهُمْ لَمِنكُمْ وَمَا هُم مِّنكُمْ وَلَٰكِنَّهُمْ قَوْمٞ يَفْرَقُونَۖ","لَوْ يَجِدُونَ مَلْجَـٔاً اَوْ مَغَٰرَٰتٍ اَوْ مُدَّخَلاٗ لَّوَلَّوِاْ اِلَيْهِ وَهُمْ يَجْمَحُونَۖ","وَمِنْهُم مَّنْ يَّلْمِزُكَ فِے اِ۬لصَّدَقَٰتِ فَإِنُ ا۟عْطُواْ مِنْهَا رَضُواْ وَإِن لَّمْ يُعْطَوْاْ مِنْهَآ إِذَا هُمْ يَسْخَطُونَۖ","وَلَوَ اَنَّهُمْ رَضُواْ مَآ ءَات۪يٰهُمُ اُ۬للَّهُ وَرَسُولُهُۥ وَقَالُواْ حَسْبُنَا اَ۬للَّهُ سَيُوتِينَا اَ۬للَّهُ مِن فَضْلِهِۦ وَرَسُولُهُۥٓۖ إِنَّآ إِلَى اَ۬للَّهِ رَٰغِبُونَۖ","إِنَّمَا اَ۬لصَّدَقَٰتُ لِلْفُقَرَآءِ وَالْمَسَٰكِينِ وَالْعَٰمِلِينَ عَلَيْهَا وَالْمُوَ۬لَّفَةِ قُلُوبُهُمْ وَفِے اِ۬لرِّقَابِ وَالْغَٰرِمِينَ وَفِے سَبِيلِ اِ۬للَّهِ وَابْنِ اِ۬لسَّبِيلِ فَرِيضَةٗ مِّنَ اَ۬للَّهِۖ وَاللَّهُ عَلِيمٌ حَكِيمٞۖ","۞ وَمِنْهُمُ اُ۬لذِينَ يُوذُونَ اَ۬لنَّبِےٓءَ وَيَقُولُونَ هُوَ أُذْنٞۖ قُلُ ا۟ذْنُ خَيْرٖ لَّكُمْ يُومِنُ بِاللَّهِ وَيُومِنُ لِلْمُومِنِينَ وَرَحْمَةٞ لِّلذِينَ ءَامَنُواْ مِنكُمْۖ وَالذِينَ يُوذُونَ رَسُولَ اَ۬للَّهِ لَهُمْ عَذَابٌ اَلِيمٞۖ","يَحْلِفُونَ بِاللَّهِ لَكُمْ لِيُرْضُوكُمْ وَاللَّهُ وَرَسُولُهُۥٓ أَحَقُّ أَنْ يُّرْضُوهُ إِن كَانُواْ مُومِنِينَۖ","أَلَمْ يَعْلَمُوٓاْ أَنَّهُۥ مَنْ يُّحَادِدِ اِ۬للَّهَ وَرَسُولَهُۥ فَأَنَّ لَهُۥ نَارَ جَهَنَّمَ خَٰلِداٗ فِيهَاۖ ذَٰلِكَ اَ۬لْخِزْيُ اُ۬لْعَظِيمُۖ","يَحْذَرُ اُ۬لْمُنَٰفِقُونَ أَن تُنَزَّلَ عَلَيْهِمْ سُورَةٞ تُنَبِّئُهُم بِمَا فِے قُلُوبِهِمْۖ قُلِ اِ۪سْتَهْزِءُوٓاْۖ إِنَّ اَ۬للَّهَ مُخْرِجٞ مَّا تَحْذَرُونَۖ","وَلَئِن سَأَلْتَهُمْ لَيَقُولُنَّ إِنَّمَا كُنَّا نَخُوضُ وَنَلْعَبُۖ قُلَ اَبِاللَّهِ وَءَايَٰتِهِۦ وَرَسُولِهِۦ كُنتُمْ تَسْتَهْزِءُونَۖ","لَا تَعْتَذِرُواْۖ قَدْ كَفَرْتُم بَعْدَ إِيمَٰنِكُمُۥٓۖ إِنْ يُّعْفَ عَن طَآئِفَةٖ مِّنكُمْ تُعَذَّبْ طَآئِفَةُۢ بِأَنَّهُمْ كَانُواْ مُجْرِمِينَۖ","اَ۬لْمُنَٰفِقُونَ وَالْمُنَٰفِقَٰتُ بَعْضُهُم مِّنۢ بَعْضٖ يَامُرُونَ بِالْمُنكَرِ وَيَنْهَوْنَ عَنِ اِ۬لْمَعْرُوفِ وَيَقْبِضُونَ أَيْدِيَهُمْ نَسُواْ اُ۬للَّهَ فَنَسِيَهُمُۥٓۖ إِنَّ اَ۬لْمُنَٰفِقِينَ هُمُ اُ۬لْفَٰسِقُونَۖ","وَعَدَ اَ۬للَّهُ اُ۬لْمُنَٰفِقِينَ وَالْمُنَٰفِقَٰتِ وَالْكُفَّارَ نَارَ جَهَنَّمَ خَٰلِدِينَ فِيهَاۖ هِيَ حَسْبُهُمْۖ وَلَعَنَهُمُ اُ۬للَّهُۖ وَلَهُمْ عَذَابٞ مُّقِيمٞۖ","كَالذِينَ مِن قَبْلِكُمْ كَانُوٓاْ أَشَدَّ مِنكُمْ قُوَّةٗ وَأَكْثَرَ أَمْوَٰلاٗ وَأَوْلَٰداٗ فَاسْتَمْتَعُواْ بِخَلَٰقِهِمْ فَاسْتَمْتَعْتُم بِخَلَٰقِكُمْ كَمَا اَ۪سْتَمْتَعَ اَ۬لذِينَ مِن قَبْلِكُم بِخَلَٰقِهِمْ وَخُضْتُمْ كَالذِے خَاضُوٓاْۖ أُوْلَٰٓئِكَ حَبِطَتَ اَعْمَٰلُهُمْ فِے اِ۬لدُّنْي۪ا وَالَاخِرَةِۖ وَأُوْلَٰٓئِكَ هُمُ اُ۬لْخَٰسِرُونَۖ","۞ أَلَمْ يَاتِهِمْ نَبَأُ اُ۬لذِينَ مِن قَبْلِهِمْ قَوْمِ نُوحٖ وَعَادٖ وَثَمُودَ","وَقَوْمِ إِبْرَٰهِيمَ وَأَصْحَٰبِ مَدْيَنَ وَالْمُوتَفِكَٰتِۖ أَتَتْهُمْ رُسُلُهُم بِالْبَيِّنَٰتِۖ فَمَا كَانَ اَ۬للَّهُ لِيَظْلِمَهُمْۖ وَلَٰكِن كَانُوٓاْ أَنفُسَهُمْ يَظْلِمُونَۖ","وَالْمُومِنُونَ وَالْمُومِنَٰتُ بَعْضُهُمُۥٓ أَوْلِيَآءُ بَعْضٖۖ يَامُرُونَ بِالْمَعْرُوفِ وَيَنْهَوْنَ عَنِ اِ۬لْمُنكَرِ وَيُقِيمُونَ اَ۬لصَّلَوٰةَ وَيُوتُونَ اَ۬لزَّكَوٰةَ وَيُطِيعُونَ اَ۬للَّهَ وَرَسُولَهُۥٓۖ أُوْلَٰٓئِكَ سَيَرْحَمُهُمُ اُ۬للَّهُۖ إِنَّ اَ۬للَّهَ عَزِيزٌ حَكِيمٞۖ","وَعَدَ اَ۬للَّهُ اُ۬لْمُومِنِينَ وَالْمُومِنَٰتِ جَنَّٰتٖ تَجْرِے مِن تَحْتِهَا اَ۬لَانْهَٰرُ خَٰلِدِينَ فِيهَا وَمَسَٰكِنَ طَيِّبَةٗ فِے جَنَّٰتِ عَدْنٖۖ وَرِضْوَٰنٞ مِّنَ اَ۬للَّهِ أَكْبَرُۖ ذَٰلِكَ هُوَ اَ۬لْفَوْزُ اُ۬لْعَظِيمُۖ","يَٰٓأَيُّهَا‏ اَ۬لنَّبِےٓءُ جَٰهِدِ اِ۬لْكُفَّارَ وَالْمُنَٰفِقِينَ وَاغْلُظْ عَلَيْهِمْۖ وَمَأْو۪يٰهُمْ جَهَنَّمُۖ وَبِيسَ اَ۬لْمَصِيرُۖ","يَحْلِفُونَ بِاللَّهِ مَا قَالُواْۖ وَلَقَدْ قَالُواْ كَلِمَةَ اَ۬لْكُفْرِ وَكَفَرُواْ بَعْدَ إِسْلَٰمِهِمْ وَهَمُّواْ بِمَا لَمْ يَنَالُواْۖ وَمَا نَقَمُوٓاْ إِلَّآ أَنَ اَغْن۪يٰهُمُ اُ۬للَّهُ وَرَسُولُهُۥ مِن فَضْلِهِۦۖ فَإِنْ يَّتُوبُواْ يَكُ خَيْراٗ لَّهُمْۖ وَإِنْ يَّتَوَلَّوْاْ يُعَذِّبْهُمُ اُ۬للَّهُ عَذَاباً اَلِيماٗ فِے اِ۬لدُّنْي۪ا وَالَاخِرَةِۖ وَمَا لَهُمْ فِے اِ۬لَارْضِ مِنْ وَّلِيّٖ وَلَا نَصِيرٖۖ","۞ وَمِنْهُم مَّنْ عَٰهَدَ اَ۬للَّهَ لَئِنَ اٰت۪يٰنَا مِن فَضْلِهِۦ لَنَصَّدَّقَنَّ وَلَنَكُونَنَّ مِنَ اَ۬لصَّٰلِحِينَۖ","فَلَمَّآ ءَات۪يٰهُم مِّن فَضْلِهِۦ بَخِلُواْ بِهِۦ وَتَوَلَّواْ وَّهُم مُّعْرِضُونَۖ","فَأَعْقَبَهُمْ نِفَاقاٗ فِے قُلُوبِهِمُۥٓ إِلَىٰ يَوْمِ يَلْقَوْنَهُۥ بِمَآ أَخْلَفُواْ اُ۬للَّهَ مَا وَعَدُوهُ وَبِمَا كَانُواْ يَكْذِبُونَۖ","أَلَمْ يَعْلَمُوٓاْ أَنَّ اَ۬للَّهَ يَعْلَمُ سِرَّهُمْ وَنَجْو۪يٰهُمْ وَأَنَّ اَ۬للَّهَ عَلَّٰمُ اُ۬لْغُيُوبِۖ","اِ۬لذِينَ يَلْمِزُونَ اَ۬لْمُطَّوِّعِينَ مِنَ اَ۬لْمُومِنِينَ فِے اِ۬لصَّدَقَٰتِ وَالذِينَ لَا يَجِدُونَ إِلَّا جُهْدَهُمْ فَيَسْخَرُونَ مِنْهُمْ سَخِرَ اَ۬للَّهُ مِنْهُمْۖ وَلَهُمْ عَذَابٌ اَلِيمٌۖ","اِ۪سْتَغْفِرْ لَهُمُۥٓ أَوْ لَا تَسْتَغْفِرْ لَهُمُۥٓۖ إِن تَسْتَغْفِرْ لَهُمْ سَبْعِينَ مَرَّةٗ فَلَنْ يَّغْفِرَ اَ۬للَّهُ لَهُمْۖ ذَٰلِكَ بِأَنَّهُمْ كَفَرُواْ بِاللَّهِ وَرَسُولِهِۦۖ وَاللَّهُ لَا يَهْدِے اِ۬لْقَوْمَ اَ۬لْفَٰسِقِينَۖ","فَرِحَ اَ۬لْمُخَلَّفُونَ بِمَقْعَدِهِمْ خِلَٰفَ رَسُولِ اِ۬للَّهِ وَكَرِهُوٓاْ أَنْ يُّجَٰهِدُواْ بِأَمْوَٰلِهِمْ وَأَنفُسِهِمْ فِے سَبِيلِ اِ۬للَّهِ وَقَالُواْ لَا تَنفِرُواْ فِے اِ۬لْحَرِّۖ قُلْ نَارُ جَهَنَّمَ أَشَدُّ حَرّاٗ لَّوْ كَانُواْ يَفْقَهُونَۖ","فَلْيَضْحَكُواْ قَلِيلاٗ وَلْيَبْكُواْ كَثِيراٗ جَزَآءَۢ بِمَا كَانُواْ يَكْسِبُونَۖ","فَإِن رَّجَعَكَ اَ۬للَّهُ إِلَىٰ طَآئِفَةٖ مِّنْهُمْ فَاسْتَٰذَنُوكَ لِلْخُرُوجِ فَقُل لَّن تَخْرُجُواْ مَعِيَ أَبَداٗ وَلَن تُقَٰتِلُواْ مَعِے عَدُوّاًۖ اِنَّكُمْ رَضِيتُم بِالْقُعُودِ أَوَّلَ مَرَّةٖۖ فَاقْعُدُواْ مَعَ اَ۬لْخَٰلِفِينَۖ","وَلَا تُصَلِّ عَلَىٰٓ أَحَدٖ مِّنْهُم مَّاتَ أَبَداٗ وَلَا تَقُمْ عَلَىٰ قَبْرِهِۦٓۖ إِنَّهُمْ كَفَرُواْ بِاللَّهِ وَرَسُولِهِۦ وَمَاتُواْ وَهُمْ فَٰسِقُونَۖ","۞ وَلَا تُعْجِبْكَ أَمْوَٰلُهُمْ وَأَوْلَٰدُهُمُۥٓۖ إِنَّمَا يُرِيدُ اُ۬للَّهُ أَنْ يُّعَذِّبَهُم بِهَا فِے اِ۬لدُّنْي۪ا وَتَزْهَقَ أَنفُسُهُمْ وَهُمْ كَٰفِرُونَۖ","وَإِذَآ أُنزِلَتْ سُورَةٌ اَنَ اٰمِنُواْ بِاللَّهِ وَجَٰهِدُواْ مَعَ رَسُولِهِ اِ۪سْتَٰذَنَكَ أُوْلُواْ اُ۬لطَّوْلِ مِنْهُمْ وَقَالُواْ ذَرْنَا نَكُن مَّعَ اَ۬لْقَٰعِدِينَۖ","رَضُواْ بِأَنْ يَّكُونُواْ مَعَ اَ۬لْخَوَالِفِۖ وَطُبِعَ عَلَىٰ قُلُوبِهِمْ فَهُمْ لَا يَفْقَهُونَۖ","لَٰكِنِ اِ۬لرَّسُولُ وَالذِينَ ءَامَنُواْ مَعَهُۥ جَٰهَدُواْ بِأَمْوَٰلِهِمْ وَأَنفُسِهِمْۖ وَأُوْلَٰٓئِكَ لَهُمُ اُ۬لْخَيْرَٰتُۖ وَأُوْلَٰٓئِكَ هُمُ اُ۬لْمُفْلِحُونَۖ","أَعَدَّ اَ۬للَّهُ لَهُمْ جَنَّٰتٖ تَجْرِے مِن تَحْتِهَا اَ۬لَانْهَٰرُ خَٰلِدِينَ فِيهَاۖ ذَٰلِكَ اَ۬لْفَوْزُ اُ۬لْعَظِيمُۖ","وَجَآءَ اَ۬لْمُعَذِّرُونَ مِنَ اَ۬لَاعْرَابِ لِيُوذَنَ لَهُمْ وَقَعَدَ اَ۬لذِينَ كَذَبُواْ اُ۬للَّهَ وَرَسُولَهُۥۖ سَيُصِيبُ اُ۬لذِينَ كَفَرُواْ مِنْهُمْ عَذَابٌ اَلِيمٞۖ","لَّيْسَ عَلَى اَ۬لضُّعَفَآءِ وَلَا عَلَى اَ۬لْمَرْض۪ىٰ وَلَا عَلَى اَ۬لذِينَ لَا يَجِدُونَ مَا يُنفِقُونَ حَرَجٌ اِذَا نَصَحُواْ لِلهِ وَرَسُولِهِۦۖ مَا عَلَى اَ۬لْمُحْسِنِينَ مِن سَبِيلٖۖ وَاللَّهُ غَفُورٞ رَّحِيمٞۖ","وَلَا عَلَى اَ۬لذِينَ إِذَا مَآ أَتَوْكَ لِتَحْمِلَهُمْ قُلْتَ لَآ أَجِدُ مَآ أَحْمِلُكُمْ عَلَيْهِۖ تَوَلَّواْ وَّأَعْيُنُهُمْ تَفِيضُ مِنَ اَ۬لدَّمْعِ حَزَناً اَلَّا يَجِدُواْ مَا يُنفِقُونَۖ","۞ إِنَّمَا اَ۬لسَّبِيلُ عَلَى اَ۬لذِينَ يَسْتَٰذِنُونَكَ وَهُمُۥٓ أَغْنِيَآءُۖ رَضُواْ بِأَنْ يَّكُونُواْ مَعَ اَ۬لْخَوَالِفِۖ وَطَبَعَ اَ۬للَّهُ عَلَىٰ قُلُوبِهِمْ فَهُمْ لَا يَعْلَمُونَۖ","يَعْتَذِرُونَ إِلَيْكُمُۥٓ إِذَا رَجَعْتُمُۥٓ إِلَيْهِمْۖ قُل لَّا تَعْتَذِرُواْ لَن نُّومِنَ لَكُمْۖ قَدْ نَبَّأَنَا اَ۬للَّهُ مِنَ اَخْب۪ارِكُمْۖ وَسَيَرَى اَ۬للَّهُ عَمَلَكُمْ وَرَسُولُهُۖۥ ثُمَّ تُرَدُّونَ إِلَىٰ عَٰلِمِ اِ۬لْغَيْبِ وَالشَّهَٰدَةِ فَيُنَبِّئُكُم بِمَا كُنتُمْ تَعْمَلُونَۖ","سَيَحْلِفُونَ بِاللَّهِ لَكُمُۥٓ إِذَا اَ۪نقَلَبْتُمُۥٓ إِلَيْهِمْ لِتُعْرِضُواْ عَنْهُمْۖ فَأَعْرِضُواْ عَنْهُمُۥٓۖ إِنَّهُمْ رِجْسٞۖ وَمَأْو۪يٰهُمْ جَهَنَّمُۖ جَزَآءَۢ بِمَا كَانُواْ يَكْسِبُونَۖ","يَحْلِفُونَ لَكُمْ لِتَرْضَوْاْ عَنْهُمْ فَإِن تَرْضَوْاْ عَنْهُمْ فَإِنَّ اَ۬للَّهَ لَا يَرْض۪ىٰ عَنِ اِ۬لْقَوْمِ اِ۬لْفَٰسِقِينَۖ","اَ۬لَاعْرَابُ أَشَدُّ كُفْراٗ وَنِفَاقاٗ وَأَجْدَرُ أَلَّا يَعْلَمُواْ حُدُودَ مَآ أَنزَلَ اَ۬للَّهُ عَلَىٰ رَسُولِهِۦۖ وَاللَّهُ عَلِيمٌ حَكِيمٞۖ","وَمِنَ اَ۬لَاعْرَابِ مَنْ يَّتَّخِذُ مَا يُنفِقُ مَغْرَماٗ وَيَتَرَبَّصُ بِكُمُ اُ۬لدَّوَآئِرَۖ عَلَيْهِمْ دَآئِرَةُ اُ۬لسَّوْءِۖ وَاللَّهُ سَمِيعٌ عَلِيمٞۖ","وَمِنَ اُ۬لَاعْرَابِ مَنْ يُّومِنُ بِاللَّهِ وَالْيَوْمِ اِ۬لَاخِرِ وَيَتَّخِذُ مَا يُنفِقُ قُرُبَٰتٍ عِندَ اَ۬للَّهِ وَصَلَوَٰتِ اِ۬لرَّسُولِۖ أَلَآ إِنَّهَا قُرُبَةٞ لَّهُمْۖ سَيُدْخِلُهُمُ اُ۬للَّهُ فِے رَحْمَتِهِۦٓۖ إِنَّ اَ۬للَّهَ غَفُورٞ رَّحِيمٞۖ","وَالسَّٰبِقُونَ اَ۬لَاوَّلُونَ مِنَ اَ۬لْمُهَٰجِرِينَ وَالَانص۪ارِ وَالذِينَ اَ۪تَّبَعُوهُم بِإِحْسَٰنٖ رَّضِيَ اَ۬للَّهُ عَنْهُمْ وَرَضُواْ عَنْهُۖ وَأَعَدَّ لَهُمْ جَنَّٰتٖ تَجْرِے تَحْتَهَا اَ۬لَانْهَٰرُ خَٰلِدِينَ فِيهَآ أَبَداٗۖ ذَٰلِكَ اَ۬لْفَوْزُ اُ۬لْعَظِيمُۖ","۞ وَمِمَّنْ حَوْلَكُم مِّنَ اَ۬لَاعْرَابِ مُنَٰفِقُونَۖ وَمِنَ اَهْلِ اِ۬لْمَدِينَةِ مَرَدُواْ عَلَى اَ۬لنِّفَاقِ لَا تَعْلَمُهُمْۖ نَحْنُ نَعْلَمُهُمْۖ سَنُعَذِّبُهُم مَّرَّتَيْنِ ثُمَّ يُرَدُّونَ إِلَىٰ عَذَابٍ عَظِيمٖۖ","وَءَاخَرُونَ اَ۪عْتَرَفُواْ بِذُنُوبِهِمْ خَلَطُواْ عَمَلاٗ صَٰلِحاٗ وَءَاخَرَ سَيِّئاً عَسَى اَ۬للَّهُ أَنْ يَّتُوبَ عَلَيْهِمُۥٓۖ إِنَّ اَ۬للَّهَ غَفُورٞ رَّحِيمٌۖ","خُذْ مِنَ اَمْوَٰلِهِمْ صَدَقَةٗ تُطَهِّرُهُمْ وَتُزَكِّيهِم بِهَا وَصَلِّ عَلَيْهِمُۥٓۖ إِنَّ صَلَوَٰتِكَ سَكَنٞ لَّهُمْۖ وَاللَّهُ سَمِيعٌ عَلِيمٌۖ","اَلَمْ يَعْلَمُوٓاْ أَنَّ اَ۬للَّهَ هُوَ يَقْبَلُ اُ۬لتَّوْبَةَ عَنْ عِبَادِهِۦ وَيَاخُذُ اُ۬لصَّدَقَٰتِ وَأَنَّ اَ۬للَّهَ هُوَ اَ۬لتَّوَّابُ اُ۬لرَّحِيمُۖ","وَقُلِ اِ۪عْمَلُواْ فَسَيَرَى اَ۬للَّهُ عَمَلَكُمْ وَرَسُولُهُۥ وَالْمُومِنُونَۖ وَسَتُرَدُّونَ إِلَىٰ عَٰلِمِ اِ۬لْغَيْبِ وَالشَّهَٰدَةِ فَيُنَبِّئُكُم بِمَا كُنتُمْ تَعْمَلُونَۖ","وَءَاخَرُونَ مُرْجَوْنَ لِأَمْرِ اِ۬للَّهِ إِمَّا يُعَذِّبُهُمْ وَإِمَّا يَتُوبُ عَلَيْهِمْۖ وَاللَّهُ عَلِيمٌ حَكِيمٌۖ","اِ۬لذِينَ اَ۪تَّخَذُواْ مَسْجِداٗ ضِرَاراٗ وَكُفْراٗ وَتَفْرِيقاَۢ بَيْنَ اَ۬لْمُومِنِينَ وَإِرْصَاداٗ لِّمَنْ حَارَبَ اَ۬للَّهَ وَرَسُولَهُۥ مِن قَبْلُۖ وَلَيَحْلِفُنَّ إِنَ اَرَدْنَآ إِلَّا اَ۬لْحُسْن۪ىٰۖ وَاللَّهُ يَشْهَدُ إِنَّهُمْ لَكَٰذِبُونَۖ","لَا تَقُمْ فِيهِ أَبَداٗۖ لَّمَسْجِدٌ ا۟سِّسَ عَلَى اَ۬لتَّقْو۪ىٰ مِنَ اَوَّلِ يَوْمٍ اَحَقُّ أَن تَقُومَ فِيهِۖ فِيهِ رِجَالٞ يُحِبُّونَ أَنْ يَّتَطَهَّرُواْۖ وَاللَّهُ يُحِبُّ اُ۬لْمُطَّهِّرِينَۖ","أَفَمَنُ ا۟سِّسَ بُنْيَٰنُهُۥ عَلَىٰ تَقْو۪ىٰ مِنَ اَ۬للَّهِ وَرِضْوَٰنٍ خَيْرٌ اَم مَّنُ ا۟سِّسَ بُنْيَٰنُهُۥ عَلَىٰ شَفَا جُرُفٍ ه۪ارٖ فَانْهَارَ بِهِۦ فِے ن۪ارِ جَهَنَّمَۖ وَاللَّهُ لَا يَهْدِے اِ۬لْقَوْمَ اَ۬لظَّٰلِمِينَۖ","لَا يَزَالُ بُنْيَٰنُهُمُ اُ۬لذِے بَنَوْاْ رِيبَةٗ فِے قُلُوبِهِمُۥٓ إِلَّآ أَن تُقَطَّعَ قُلُوبُهُمْۖ وَاللَّهُ عَلِيمٌ حَكِيمٌۖ","۞ اِنَّ اَ۬للَّهَ اَ۪شْتَر۪ىٰ مِنَ اَ۬لْمُومِنِينَ أَنفُسَهُمْ وَأَمْوَٰلَهُم بِأَنَّ لَهُمُ اُ۬لْجَنَّةَۖ يُقَٰتِلُونَ فِے سَبِيلِ اِ۬للَّهِ فَيَقْتُلُونَ وَيُقْتَلُونَ وَعْداً عَلَيْهِ حَقّاٗ فِے اِ۬لتَّوْر۪يٰةِ وَالِانجِيلِ وَالْقُرْءَانِۖ وَمَنَ اَوْف۪ىٰ بِعَهْدِهِۦ مِنَ اَ۬للَّهِۖ فَاسْتَبْشِرُواْ بِبَيْعِكُمُ اُ۬لذِے بَايَعْتُم بِهِۦۖ وَذَٰلِكَ هُوَ اَ۬لْفَوْزُ اُ۬لْعَظِيمُۖ","اُ۬لتَّٰٓئِبُونَ اَ۬لْعَٰبِدُونَ اَ۬لْحَٰمِدُونَ اَ۬لسَّٰٓئِحُونَ اَ۬لرَّٰكِعُونَ اَ۬لسَّٰجِدُونَ اَ۬لَامِرُونَ بِالْمَعْرُوفِ وَالنَّاهُونَ عَنِ اِ۬لْمُنكَرِ وَالْحَٰفِظُونَ لِحُدُودِ اِ۬للَّهِۖ وَبَشِّرِ اِ۬لْمُومِنِينَۖ","مَا كَانَ لِلنَّبِےٓءِ وَالذِينَ ءَامَنُوٓاْ أَنْ يَّسْتَغْفِرُواْ لِلْمُشْرِكِينَ وَلَوْ كَانُوٓاْ أُوْلِے قُرْب۪ىٰ مِنۢ بَعْدِ مَا تَبَيَّنَ لَهُمُۥٓ أَنَّهُمُۥٓ أَصْحَٰبُ اُ۬لْجَحِيمِۖ","وَمَا كَانَ اَ۪سْتِغْفَارُ إِبْرَٰهِيمَ لِأَبِيهِ إِلَّا عَن مَّوْعِدَةٖ وَعَدَهَآ إِيَّاهُۖ فَلَمَّا تَبَيَّنَ لَهُۥٓ أَنَّهُۥ عَدُوّٞ لِّلهِ تَبَرَّأَ مِنْهُۖ إِنَّ إِبْرَٰهِيمَ لَأَوَّٰهٌ حَلِيمٞۖ","وَمَا كَانَ اَ۬للَّهُ لِيُضِلَّ قَوْماَۢ بَعْدَ إِذْ هَد۪يٰهُمْ حَتَّىٰ يُبَيِّنَ لَهُم مَّا يَتَّقُونَۖ إِنَّ اَ۬للَّهَ بِكُلِّ شَےْءٍ عَلِيمٌۖ","اِنَّ اَ۬للَّهَ لَهُۥ مُلْكُ اُ۬لسَّمَٰوَٰتِ وَالَارْضِۖ يُحْيِۦ وَيُمِيتُۖ وَمَا لَكُم مِّن دُونِ اِ۬للَّهِ مِنْ وَّلِيّٖ وَلَا نَصِيرٖۖ","۞ لَّقَد تَّابَ اَ۬للَّهُ عَلَى اَ۬لنَّبِےٓءِ وَالْمُهَٰجِرِينَ وَالَانص۪ارِ اِ۬لذِينَ اَ۪تَّبَعُوهُ فِے سَاعَةِ اِ۬لْعُسْرَةِ مِنۢ بَعْدِ مَا كَادَ تَزِيغُ قُلُوبُ فَرِيقٖ مِّنْهُمْ ثُمَّ تَابَ عَلَيْهِمُۥٓۖ إِنَّهُۥ بِهِمْ رَءُوفٞ رَّحِيمٞ","وَعَلَى اَ۬لثَّلَٰثَةِ اِ۬لذِينَ خُلِّفُواْۖ حَتَّىٰٓ إِذَا ضَاقَتْ عَلَيْهِمُ اُ۬لَارْضُ بِمَا رَحُبَتْ وَضَاقَتْ عَلَيْهِمُۥٓ أَنفُسُهُمْ وَظَنُّوٓاْ أَن لَّا مَلْجَأَ مِنَ اَ۬للَّهِ إِلَّآ إِلَيْهِ ثُمَّ تَابَ عَلَيْهِمْ لِيَتُوبُوٓاْۖ إِنَّ اَ۬للَّهَ هُوَ اَ۬لتَّوَّابُ اُ۬لرَّحِيمُۖ","يَٰٓأَيُّهَا اَ۬لذِينَ ءَامَنُواْ اُ۪تَّقُواْ اُ۬للَّهَ وَكُونُواْ مَعَ اَ۬لصَّٰدِقِينَۖ","مَا كَانَ لِأَهْلِ اِ۬لْمَدِينَةِ وَمَنْ حَوْلَهُم مِّنَ اَ۬لَاعْرَابِ أَنْ يَّتَخَلَّفُواْ عَن رَّسُولِ اِ۬للَّهِ وَلَا يَرْغَبُواْ بِأَنفُسِهِمْ عَن نَّفْسِهِۦۖ ذَٰلِكَ بِأَنَّهُمْ لَا يُصِيبُهُمْ ظَمَأٞ وَلَا نَصَبٞ وَلَا مَخْمَصَةٞ فِے سَبِيلِ اِ۬للَّهِ وَلَا يَطَـُٔونَ مَوْطِئاٗ يَغِيظُ اُ۬لْكُفَّارَ وَلَا يَنَالُونَ مِنْ عَدُوّٖ نَّيْلاً اِلَّا كُتِبَ لَهُم بِهِۦ عَمَلٞ صَٰلِحٌۖ اِنَّ اَ۬للَّهَ لَا يُضِيعُ أَجْرَ اَ۬لْمُحْسِنِينَۖ","وَلَا يُنفِقُونَ نَفَقَةٗ صَغِيرَةٗ وَلَا كَبِيرَةٗ وَلَا يَقْطَعُونَ وَادِياً اِلَّا كُتِبَ لَهُمْۖ لِيَجْزِيَهُمُ اُ۬للَّهُ أَحْسَنَ مَا كَانُواْ يَعْمَلُونَۖ","وَمَا كَانَ اَ۬لْمُومِنُونَ لِيَنفِرُواْ كَآفَّةٗۖ فَلَوْلَا نَفَرَ مِن كُلِّ فِرْقَةٖ مِّنْهُمْ طَآئِفَةٞ لِّيَتَفَقَّهُواْ فِے اِ۬لدِّينِ وَلِيُنذِرُواْ قَوْمَهُمُۥٓ إِذَا رَجَعُوٓاْ إِلَيْهِمْ لَعَلَّهُمْ يَحْذَرُونَۖ","۞ يَٰٓأَيُّهَا اَ۬لذِينَ ءَامَنُواْ قَٰتِلُواْ اُ۬لذِينَ يَلُونَكُم مِّنَ اَ۬لْكُفّ۪ارِ وَلْيَجِدُواْ فِيكُمْ غِلْظَةٗۖ وَاعْلَمُوٓاْ أَنَّ اَ۬للَّهَ مَعَ اَ۬لْمُتَّقِينَۖ","وَإِذَا مَآ أُنزِلَتْ سُورَةٞ فَمِنْهُم مَّنْ يَّقُولُ أَيُّكُمْ زَادَتْهُ هَٰذِهِۦٓ إِيمَٰناٗۖ فَأَمَّا اَ۬لذِينَ ءَامَنُواْ فَزَادَتْهُمُۥٓ إِيمَٰناٗ وَهُمْ يَسْتَبْشِرُونَۖ","وَأَمَّا اَ۬لذِينَ فِے قُلُوبِهِم مَّرَضٞ فَزَادَتْهُمْ رِجْساً اِلَىٰ رِجْسِهِمْ وَمَاتُواْ وَهُمْ كَٰفِرُونَۖ","أَوَلَا يَرَوْنَ أَنَّهُمْ يُفْتَنُونَ فِے كُلِّ عَامٖ مَّرَّةً اَوْ مَرَّتَيْنِ ثُمَّ لَا يَتُوبُونَ وَلَا هُمْ يَذَّكَّرُونَۖ","وَإِذَا مَآ أُنزِلَتْ سُورَةٞ نَّظَرَ بَعْضُهُمُۥٓ إِلَىٰ بَعْضٍ هَلْ يَر۪يٰكُم مِّنَ اَحَدٖ ثُمَّ اَ۪نصَرَفُواْۖ صَرَفَ اَ۬للَّهُ قُلُوبَهُم بِأَنَّهُمْ قَوْمٞ لَّا يَفْقَهُونَۖ","لَقَدْ جَآءَكُمْ رَسُولٞ مِّنَ اَنفُسِكُمْ عَزِيزٌ عَلَيْهِ مَا عَنِتُّمْۖ حَرِيصٌ عَلَيْكُمۖ بِالْمُومِنِينَ رَءُوفٞ رَّحِيمٞۖ","فَإِن تَوَلَّوْاْ فَقُلْ حَسْبِيَ اَ۬للَّهُۖ لَآ إِلَٰهَ إِلَّا هُوَۖ عَلَيْهِ تَوَكَّلْتُۖ وَهُوَ رَبُّ اُ۬لْعَرْشِ اِ۬لْعَظِيمِۖ"]],["يونس",["أَلَٓر۪ۖ تِلْكَ ءَايَٰتُ اُ۬لْكِتَٰبِ اِ۬لْحَكِيمِۖ","أَكَانَ لِلنَّاسِ عَجَباً اَنَ اَوْحَيْنَآ إِلَىٰ رَجُلٖ مِّنْهُمُۥٓ أَنَ اَنذِرِ اِ۬لنَّاسَۖ وَبَشِّرِ اِ۬لذِينَ ءَامَنُوٓاْ أَنَّ لَهُمْ قَدَمَ صِدْقٍ عِندَ رَبِّهِمْۖ قَالَ اَ۬لْكَٰفِرُونَ إِنَّ هَٰذَا لَسِحْرٞ مُّبِينٌۖ","۞ اِنَّ رَبَّكُمُ اُ۬للَّهُ اُ۬لذِے خَلَقَ اَ۬لسَّمَٰوَٰتِ وَالَارْضَ فِے سِتَّةِ أَيَّامٖ ثُمَّ اَ۪سْتَو۪ىٰ عَلَى اَ۬لْعَرْشِۖ يُدَبِّرُ اُ۬لَامْرَۖ مَا مِن شَفِيعٍ اِلَّا مِنۢ بَعْدِ إِذْنِهِۦۖ ذَٰلِكُمُ اُ۬للَّهُ رَبُّكُمْۖ فَاعْبُدُوهُۖ أَفَلَا تَذَّكَّرُونَۖ","إِلَيْهِ مَرْجِعُكُمْ جَمِيعاٗۖ وَعْدَ اَ۬للَّهِ حَقّاًۖ اِنَّهُۥ يَبْدَؤُاْ اُ۬لْخَلْقَ ثُمَّ يُعِيدُهُۥ لِيَجْزِيَ اَ۬لذِينَ ءَامَنُواْ وَعَمِلُواْ اُ۬لصَّٰلِحَٰتِ بِالْقِسْطِۖ وَالذِينَ كَفَرُواْ لَهُمْ شَرَابٞ مِّنْ حَمِيمٖ وَعَذَابٌ اَلِيمُۢ بِمَا كَانُواْ يَكْفُرُونَۖ","هُوَ اَ۬لذِے جَعَلَ اَ۬لشَّمْسَ ضِيَآءٗ وَالْقَمَرَ نُوراٗ وَقَدَّرَهُۥ مَنَازِلَ لِتَعْلَمُواْ عَدَدَ اَ۬لسِّنِينَ وَالْحِسَابَۖ مَا خَلَقَ اَ۬للَّهُ ذَٰلِكَ إِلَّا بِالْحَقِّۖ نُفَصِّلُ اُ۬لَايَٰتِ لِقَوْمٖ يَعْلَمُونَۖ","إِنَّ فِے اِ۪خْتِلَٰفِ اِ۬ليْلِ وَالنَّه۪ارِ وَمَا خَلَقَ اَ۬للَّهُ فِے اِ۬لسَّمَٰوَٰتِ وَالَارْضِ لَأٓيَٰتٖ لِّقَوْمٖ يَتَّقُونَۖ","إِنَّ اَ۬لذِينَ لَا يَرْجُونَ لِقَآءَنَا وَرَضُواْ بِالْحَيَوٰةِ اِ۬لدُّنْي۪ا وَاطْمَأَنُّواْ بِهَا وَالذِينَ هُمْ عَنَ اٰيَٰتِنَا غَٰفِلُونَ","أُوْلَٰٓئِكَ مَأْو۪يٰهُمُ اُ۬لنَّارُ بِمَا كَانُواْ يَكْسِبُونَۖ","إِنَّ اَ۬لذِينَ ءَامَنُواْ وَعَمِلُواْ اُ۬لصَّٰلِحَٰتِ يَهْدِيهِمْ رَبُّهُم بِإِيمَٰنِهِمْۖ تَجْرِے مِن تَحْتِهِمُ اُ۬لَانْهَٰرُ فِے جَنَّٰتِ اِ۬لنَّعِيمِۖ","دَعْو۪يٰهُمْ فِيهَا سُبْحَٰنَكَ اَ۬للَّهُمَّۖ وَتَحِيَّتُهُمْ فِيهَا سَلَٰمٞۖ وَءَاخِرُ دَعْو۪يٰهُمُۥٓ أَنِ اِ۬لْحَمْدُ لِلهِ رَبِّ اِ۬لْعَٰلَمِينَۖ","۞ وَلَوْ يُعَجِّلُ اُ۬للَّهُ لِلنَّاسِ اِ۬لشَّرَّ اَ۪سْتِعْجَالَهُم بِالْخَيْرِ لَقُضِيَ إِلَيْهِمُۥٓ أَجَلُهُمْۖ فَنَذَرُ اُ۬لذِينَ لَا يَرْجُونَ لِقَآءَنَا فِے طُغْيَٰنِهِمْ يَعْمَهُونَۖ","وَإِذَا مَسَّ اَ۬لِانسَٰنَ اَ۬لضُّرُّ دَعَانَا لِجَنۢبِهِۦٓ أَوْ قَاعِداً اَوْ قَآئِماٗۖ فَلَمَّا كَشَفْنَا عَنْهُ ضُرَّهُۥ مَرَّ كَأَن لَّمْ يَدْعُنَآ إِلَىٰ ضُرّٖ مَّسَّهُۥۖ كَذَٰلِكَ زُيِّنَ لِلْمُسْرِفِينَ مَا كَانُواْ يَعْمَلُونَۖ","وَلَقَدَ اَهْلَكْنَا اَ۬لْقُرُونَ مِن قَبْلِكُمْ لَمَّا ظَلَمُواْ وَجَآءَتْهُمْ رُسُلُهُم بِالْبَيِّنَٰتِۖ وَمَا كَانُواْ لِيُومِنُواْۖ كَذَٰلِكَ نَجْزِے اِ۬لْقَوْمَ اَ۬لْمُجْرِمِينَۖ","ثُمَّ جَعَلْنَٰكُمْ خَلَٰٓئِفَ فِے اِ۬لَارْضِ مِنۢ بَعْدِهِمْ لِنَنظُرَ كَيْفَ تَعْمَلُونَۖ","وَإِذَا تُتْل۪ىٰ عَلَيْهِمُۥٓ ءَايَاتُنَا بَيِّنَٰتٖ قَالَ اَ۬لذِينَ لَا يَرْجُونَ لِقَآءَنَا اَ۪يتِ بِقُرْءَانٍ غَيْرِ هَٰذَآ أَوْ بَدِّلْهُۖ قُلْ مَا يَكُونُ لِيَ أَنُ ا۟بَدِّلَهُۥ مِن تِلْقَآءِےْ نَفْسِيَۖ إِنَ اَتَّبِعُ إِلَّا مَا يُوح۪ىٰٓ إِلَيَّۖ إِنِّيَ أَخَافُ إِنْ عَصَيْتُ رَبِّے عَذَابَ يَوْمٍ عَظِيمٖۖ","قُل لَّوْ شَآءَ اَ۬للَّهُ مَا تَلَوْتُهُۥ عَلَيْكُمْ وَلَآ أَدْر۪يٰكُم بِهِۦۖ فَقَدْ لَبِثْتُ فِيكُمْ عُمُراٗ مِّن قَبْلِهِۦٓۖ أَفَلَا تَعْقِلُونَۖ","فَمَنَ اَظْلَمُ مِمَّنِ اِ۪فْتَر۪ىٰ عَلَى اَ۬للَّهِ كَذِباً اَوْ كَذَّبَ بِـَٔايَٰتِهِۦٓۖ إِنَّهُۥ لَا يُفْلِحُ اُ۬لْمُجْرِمُونَۖ","وَيَعْبُدُونَ مِن دُونِ اِ۬للَّهِ مَا لَا يَضُرُّهُمْ وَلَا يَنفَعُهُمْ وَيَقُولُونَ هَٰٓؤُلَآءِ شُفَعَٰٓؤُنَا عِندَ اَ۬للَّهِۖ قُلَ اَتُنَبِّـُٔونَ اَ۬للَّهَ بِمَا لَا يَعْلَمُ فِے اِ۬لسَّمَٰوَٰتِ وَلَا فِے اِ۬لَارْضِۖ سُبْحَٰنَهُۥ وَتَعَٰل۪ىٰ عَمَّا يُشْرِكُونَۖ","۞ وَمَا كَانَ اَ۬لنَّاسُ إِلَّآ أُمَّةٗ وَٰحِدَةٗ فَاخْتَلَفُواْۖ وَلَوْلَا كَلِمَةٞ سَبَقَتْ مِن رَّبِّكَ لَقُضِيَ بَيْنَهُمْ فِيمَا فِيهِ يَخْتَلِفُونَۖ","وَيَقُولُونَ لَوْلَآ أُنزِلَ عَلَيْهِ ءَايَةٞ مِّن رَّبِّهِۦۖ فَقُلِ اِنَّمَا اَ۬لْغَيْبُ لِلهِۖ فَانتَظِرُوٓاْۖ إِنِّے مَعَكُم مِّنَ اَ۬لْمُنتَظِرِينَۖ","وَإِذَآ أَذَقْنَا اَ۬لنَّاسَ رَحْمَةٗ مِّنۢ بَعْدِ ضَرَّآءَ مَسَّتْهُمُۥٓ إِذَا لَهُم مَّكْرٞ فِےٓ ءَايَاتِنَاۖ قُلِ اِ۬للَّهُ أَسْرَعُ مَكْراًۖ اِنَّ رُسُلَنَا يَكْتُبُونَ مَا تَمْكُرُونَۖ","هُوَ اَ۬لذِے يُسَيِّرُكُمْ فِے اِ۬لْبَرِّ وَالْبَحْرِۖ حَتَّىٰٓ إِذَا كُنتُمْ فِے اِ۬لْفُلْكِ وَجَرَيْنَ بِهِم بِرِيحٖ طَيِّبَةٖ وَفَرِحُواْ بِهَا جَآءَتْهَا رِيحٌ عَاصِفٞ وَجَآءَهُمُ اُ۬لْمَوْجُ مِن كُلِّ مَكَانٖ وَظَنُّوٓاْ أَنَّهُمُۥٓ أُحِيطَ بِهِمْ دَعَوُاْ اُ۬للَّهَ مُخْلِصِينَ لَهُ اُ۬لدِّينَ لَئِنَ اَنجَيْتَنَا مِنْ هَٰذِهِۦ لَنَكُونَنَّ مِنَ اَ۬لشَّٰكِرِينَۖ","فَلَمَّآ أَنج۪يٰهُمُۥٓ إِذَا هُمْ يَبْغُونَ فِے اِ۬لَارْضِ بِغَيْرِ اِ۬لْحَقِّۖ يَٰٓأَيُّهَا اَ۬لنَّاسُ إِنَّمَا بَغْيُكُمْ عَلَىٰٓ أَنفُسِكُمۖ مَّتَٰعُ اَ۬لْحَيَوٰةِ اِ۬لدُّنْي۪اۖ ثُمَّ إِلَيْنَا مَرْجِعُكُمْ فَنُنَبِّئُكُم بِمَا كُنتُمْ تَعْمَلُونَۖ","إِنَّمَا مَثَلُ اُ۬لْحَيَوٰةِ اِ۬لدُّنْي۪ا كَمَآءٍ اَنزَلْنَٰهُ مِنَ اَ۬لسَّمَآءِ فَاخْتَلَطَۖ بِهِۦ نَبَاتُ اُ۬لَارْضِ مِمَّا يَاكُلُ اُ۬لنَّاسُ وَالَانْعَٰمُۖ حَتَّىٰٓ إِذَآ أَخَذَتِ اِ۬لَارْضُ زُخْرُفَهَا وَازَّيَّنَتْ وَظَنَّ أَهْلُهَآ أَنَّهُمْ قَٰدِرُونَ عَلَيْهَآ أَت۪يٰهَآ أَمْرُنَا لَيْلاً اَوْ نَهَاراٗ فَجَعَلْنَٰهَا حَصِيداٗ كَأَن لَّمْ تَغْنَ بِالَامْسِۖ كَذَٰلِكَ نُفَصِّلُ اُ۬لَايَٰتِ لِقَوْمٖ يَتَفَكَّرُونَۖ","وَاللَّهُ يَدْعُوٓاْ إِلَىٰ د۪ارِ اِ۬لسَّلَٰمِ وَيَهْدِے مَنْ يَّشَآءُ اِ۪لَىٰ صِرَٰطٖ مُّسْتَقِيمٖۖ","۞ لِّلذِينَ أَحْسَنُواْ اُ۬لْحُسْن۪ىٰ وَزِيَادَةٞۖ وَلَا يَرْهَقُ وُجُوهَهُمْ قَتَرٞ وَلَا ذِلَّةٌۖ ا۟وْلَٰٓئِكَ أَصْحَٰبُ اُ۬لْجَنَّةِۖ هُمْ فِيهَا خَٰلِدُونَۖ","وَالذِينَ كَسَبُواْ اُ۬لسَّيِّـَٔاتِ جَزَآءُ سَيِّئَةِۢ بِمِثْلِهَا وَتَرْهَقُهُمْ ذِلَّةٞ مَّا لَهُم مِّنَ اَ۬للَّهِ مِنْ عَاصِمٖ كَأَنَّمَآ أُغْشِيَتْ وُجُوهُهُمْ قِطَعاٗ مِّنَ اَ۬ليْلِ مُظْلِماًۖ ا۟وْلَٰٓئِكَ أَصْحَٰبُ اُ۬لنّ۪ارِ هُمْ فِيهَا خَٰلِدُونَۖ","وَيَوْمَ نَحْشُرُهُمْ جَمِيعاٗ ثُمَّ نَقُولُ لِلذِينَ أَشْرَكُواْ مَكَانَكُمُۥٓ أَنتُمْ وَشُرَكَآؤُكُمْ فَزَيَّلْنَا بَيْنَهُمْۖ وَقَالَ شُرَكَآؤُهُم مَّا كُنتُمُۥٓ إِيَّانَا تَعْبُدُونَۖ","فَكَف۪ىٰ بِاللَّهِ شَهِيداَۢ بَيْنَنَا وَبَيْنَكُمُۥٓ إِن كُنَّا عَنْ عِبَادَتِكُمْ لَغَٰفِلِينَۖ","هُنَالِكَ تَبْلُواْ كُلُّ نَفْسٖ مَّآ أَسْلَفَتْۖ وَرُدُّوٓاْ إِلَى اَ۬للَّهِ مَوْل۪يٰهُمُ اُ۬لْحَقِّۖ وَضَلَّ عَنْهُم مَّا كَانُواْ يَفْتَرُونَۖ","قُلْ مَنْ يَّرْزُقُكُم مِّنَ اَ۬لسَّمَآءِ وَالَارْضِۖ أَمَّنْ يَّمْلِكُ اُ۬لسَّمْعَ وَالَابْصَٰرَ وَمَنْ يُّخْرِجُ اُ۬لْحَيَّ مِنَ اَ۬لْمَيِّتِ وَيُخْرِجُ اُ۬لْمَيِّتَ مِنَ اَ۬لْحَيِّ وَمَنْ يُّدَبِّرُ اُ۬لَامْرَۖ فَسَيَقُولُونَ اَ۬للَّهُۖ فَقُلَ اَفَلَا تَتَّقُونَۖ","فَذَٰلِكُمُ اُ۬للَّهُ رَبُّكُمُ اُ۬لْحَقُّۖ فَمَاذَا بَعْدَ اَ۬لْحَقِّ إِلَّا اَ۬لضَّلَٰلُۖ فَأَنّ۪ىٰ تُصْرَفُونَۖ","كَذَٰلِكَ حَقَّتْ كَلِمَٰتُ رَبِّكَ عَلَى اَ۬لذِينَ فَسَقُوٓاْ أَنَّهُمْ لَا يُومِنُونَۖ","قُلْ هَلْ مِن شُرَكَآئِكُم مَّنْ يَّبْدَؤُاْ اُ۬لْخَلْقَ ثُمَّ يُعِيدُهُۥۖ قُلِ اِ۬للَّهُ يَبْدَؤُاْ اُ۬لْخَلْقَ ثُمَّ يُعِيدُهُۥۖ فَأَنّ۪ىٰ تُوفَكُونَۖ","قُلْ هَلْ مِن شُرَكَآئِكُم مَّنْ يَّهْدِےٓ إِلَى اَ۬لْحَقِّۖ قُلِ اِ۬للَّهُ يَهْدِے لِلْحَقِّۖ أَفَمَنْ يَّهْدِےٓ إِلَى اَ۬لْحَقِّ أَحَقُّ أَنْ يُّتَّبَعَ أَمَّن لَّا يَهَدِّےٓ إِلَّآ أَنْ يُّهْد۪ىٰۖ فَمَا لَكُمْۖ كَيْفَ تَحْكُمُونَۖ","وَمَا يَتَّبِعُ أَكْثَرُهُمُۥٓ إِلَّا ظَنّاًۖ اِنَّ اَ۬لظَّنَّ لَا يُغْنِے مِنَ اَ۬لْحَقِّ شَئْاًۖ اِنَّ اَ۬للَّهَ عَلِيمُۢ بِمَا يَفْعَلُونَۖ","۞ وَمَا كَانَ هَٰذَا اَ۬لْقُرْءَانُ أَنْ يُّفْتَر۪ىٰ مِن دُونِ اِ۬للَّهِۖ وَلَٰكِن تَصْدِيقَ اَ۬لذِے بَيْنَ يَدَيْهِ وَتَفْصِيلَ اَ۬لْكِتَٰبِ لَا رَيْبَ فِيهِ مِن رَّبِّ اِ۬لْعَٰلَمِينَۖ","أَمْ يَقُولُونَ اَ۪فْتَر۪يٰهُۖ قُلْ فَاتُواْ بِسُورَةٖ مِّثْلِهِۦۖ وَادْعُواْ مَنِ اِ۪سْتَطَعْتُم مِّن دُونِ اِ۬للَّهِ إِن كُنتُمْ صَٰدِقِينَۖ","بَلْ كَذَّبُواْ بِمَا لَمْ يُحِيطُواْ بِعِلْمِهِۦ وَلَمَّا يَاتِهِمْ تَاوِيلُهُۥۖ كَذَٰلِكَ كَذَّبَ اَ۬لذِينَ مِن قَبْلِهِمْۖ فَانظُرْ كَيْفَ كَانَ عَٰقِبَةُ اُ۬لظَّٰلِمِينَۖ","وَمِنْهُم مَّنْ يُّومِنُ بِهِۦ وَمِنْهُم مَّن لَّا يُومِنُ بِهِۦۖ وَرَبُّكَ أَعْلَمُ بِالْمُفْسِدِينَۖ","وَإِن كَذَّبُوكَ فَقُل لِّے عَمَلِے وَلَكُمْ عَمَلُكُمُۥٓ أَنتُم بَرِيٓـُٔونَ مِمَّآ أَعْمَلُ وَأَنَا بَرِےٓءٞ مِّمَّا تَعْمَلُونَۖ","وَمِنْهُم مَّنْ يَّسْتَمِعُونَ إِلَيْكَۖ أَفَأَنتَ تُسْمِعُ اُ۬لصُّمَّ وَلَوْ كَانُواْ لَا يَعْقِلُونَۖ","وَمِنْهُم مَّنْ يَّنظُرُ إِلَيْكَۖ أَفَأَنتَ تَهْدِے اِ۬لْعُمْيَ وَلَوْ كَانُواْ لَا يُبْصِرُونَۖ","إِنَّ اَ۬للَّهَ لَا يَظْلِمُ اُ۬لنَّاسَ شَئْاٗۖ وَلَٰكِنَّ اَ۬لنَّاسَ أَنفُسَهُمْ يَظْلِمُونَۖ","وَيَوْمَ نَحْشُرُهُمْ كَأَن لَّمْ يَلْبَثُوٓاْ إِلَّا سَاعَةٗ مِّنَ اَ۬لنَّه۪ارِ يَتَعَارَفُونَ بَيْنَهُمْۖ قَدْ خَسِرَ اَ۬لذِينَ كَذَّبُواْ بِلِقَآءِ اِ۬للَّهِ وَمَا كَانُواْ مُهْتَدِينَۖ","وَإِمَّا نُرِيَنَّكَ بَعْضَ اَ۬لذِے نَعِدُهُمُۥٓ أَوْ نَتَوَفَّيَنَّكَ فَإِلَيْنَا مَرْجِعُهُمْۖ ثُمَّ اَ۬للَّهُ شَهِيدٌ عَلَىٰ مَا يَفْعَلُونَۖ","وَلِكُلِّ أُمَّةٖ رَّسُولٞۖ فَإِذَا جَآءَ رَسُولُهُمْ قُضِيَ بَيْنَهُم بِالْقِسْطِ وَهُمْ لَا يُظْلَمُونَۖ","وَيَقُولُونَ مَت۪ىٰ هَٰذَا اَ۬لْوَعْدُ إِن كُنتُمْ صَٰدِقِينَۖ","۞ قُل لَّآ أَمْلِكُ لِنَفْسِے ضَرّاٗ وَلَا نَفْعاً اِلَّا مَا شَآءَ اَ۬للَّهُۖ لِكُلِّ أُمَّةٍ اَجَلٌۖ اِذَا جَآءَ اجَلُهُمْ فَلَا يَسْتَٰخِرُونَ سَاعَةٗۖ وَلَا يَسْتَقْدِمُونَۖ","قُلَ اَرَٰٓيْتُمُۥٓ إِنَ اَت۪يٰكُمْ عَذَابُهُۥ بَيَٰتاً اَوْ نَهَاراٗ مَّاذَا يَسْتَعْجِلُ مِنْهُ اُ۬لْمُجْرِمُونَۖ","أَثُمَّ إِذَا مَا وَقَعَ ءَامَنتُم بِهِۦٓۖ ءَالَٰنَ وَقَدْ كُنتُم بِهِۦ تَسْتَعْجِلُونَۖ","ثُمَّ قِيلَ لِلذِينَ ظَلَمُواْ ذُوقُواْ عَذَابَ اَ۬لْخُلْدِۖ هَلْ تُجْزَوْنَ إِلَّا بِمَا كُنتُمْ تَكْسِبُونَۖ","وَيَسْتَنۢبِـُٔونَكَ أَحَقٌّ هُوَۖ قُلِ اِے وَرَبِّيَ إِنَّهُۥ لَحَقّٞ وَمَآ أَنتُم بِمُعْجِزِينَۖ","وَلَوَ اَنَّ لِكُلِّ نَفْسٖ ظَلَمَتْ مَا فِے اِ۬لَارْضِ لَافْتَدَتْ بِهِۦۖ وَأَسَرُّواْ اُ۬لنَّدَامَةَ لَمَّا رَأَوُاْ اُ۬لْعَذَابَ وَقُضِيَ بَيْنَهُم بِالْقِسْطِ وَهُمْ لَا يُظْلَمُونَۖ","أَلَآ إِنَّ لِلهِ مَا فِے اِ۬لسَّمَٰوَٰتِ وَالَارْضِۖ أَلَآ إِنَّ وَعْدَ اَ۬للَّهِ حَقّٞۖ وَلَٰكِنَّ أَكْثَرَهُمْ لَا يَعْلَمُونَۖ","هُوَ يُحْيِۦ وَيُمِيتُۖ وَإِلَيْهِ تُرْجَعُونَۖ","يَٰٓأَيُّهَا اَ۬لنَّاسُ قَدْ جَآءَتْكُم مَّوْعِظَةٞ مِّن رَّبِّكُمْ وَشِفَآءٞ لِّمَا فِے اِ۬لصُّدُورِ وَهُدىٗ وَرَحْمَةٞ لِّلْمُومِنِينَۖ","قُلْ بِفَضْلِ اِ۬للَّهِ وَبِرَحْمَتِهِۦ فَبِذَٰلِكَ فَلْيَفْرَحُواْۖ هُوَ خَيْرٞ مِّمَّا يَجْمَعُونَۖ","قُلَ اَرَٰٓيْتُم مَّآ أَنزَلَ اَ۬للَّهُ لَكُم مِّن رِّزْقٖ فَجَعَلْتُم مِّنْهُ حَرَاماٗ وَحَلَٰلاٗۖ قُلَ آٰللَّهُ أَذِنَ لَكُمُۥٓ أَمْ عَلَى اَ۬للَّهِ تَفْتَرُونَۖ","وَمَا ظَنُّ اُ۬لذِينَ يَفْتَرُونَ عَلَى اَ۬للَّهِ اِ۬لْكَذِبَ يَوْمَ اَ۬لْقِيَٰمَةِۖ إِنَّ اَ۬للَّهَ لَذُو فَضْلٍ عَلَى اَ۬لنَّاسِۖ وَلَٰكِنَّ أَكْثَرَهُمْ لَا يَشْكُرُونَۖ","۞ وَمَا تَكُونُ فِے شَأْنٖ وَمَا تَتْلُواْ مِنْهُ مِن قُرْءَانٖ وَلَا تَعْمَلُونَ مِنْ عَمَلٍ اِلَّا كُنَّا عَلَيْكُمْ شُهُوداً اِذْ تُفِيضُونَ فِيهِۖ وَمَا يَعْزُبُ عَن رَّبِّكَ مِن مِّثْقَالِ ذَرَّةٖ فِے اِ۬لَارْضِ وَلَا فِے اِ۬لسَّمَآءِۖ وَلَآ أَصْغَرَ مِن ذَٰلِكَ وَلَآ أَكْبَرَ إِلَّا فِے كِتَٰبٖ مُّبِينٍۖ","اَلَآ إِنَّ أَوْلِيَآءَ اَ۬للَّهِ لَا خَوْفٌ عَلَيْهِمْ وَلَا هُمْ يَحْزَنُونَۖ","اَ۬لذِينَ ءَامَنُواْ وَكَانُواْ يَتَّقُونَ","لَهُمُ اُ۬لْبُشْر۪ىٰ فِے اِ۬لْحَيَوٰةِ اِ۬لدُّنْي۪ا وَفِے اِ۬لَاخِرَةِۖ لَا تَبْدِيلَ لِكَلِمَٰتِ اِ۬للَّهِۖ ذَٰلِكَ هُوَ اَ۬لْفَوْزُ اُ۬لْعَظِيمُۖ","وَلَا يُحْزِنكَ قَوْلُهُمُۥٓۖ إِنَّ اَ۬لْعِزَّةَ لِلهِ جَمِيعاًۖ هُوَ اَ۬لسَّمِيعُ اُ۬لْعَلِيمُۖ","أَلَآ إِنَّ لِلهِ مَن فِے اِ۬لسَّمَٰوَٰتِ وَمَن فِے اِ۬لَارْضِۖ وَمَا يَتَّبِعُ اُ۬لذِينَ يَدْعُونَ مِن دُونِ اِ۬للَّهِ شُرَكَآءَۖ ا۪نْ يَّتَّبِعُونَ إِلَّا اَ۬لظَّنَّۖ وَإِنْ هُمُۥٓ إِلَّا يَخْرُصُونَۖ","هُوَ اَ۬لذِے جَعَلَ لَكُمُ اُ۬ليْلَ لِتَسْكُنُواْ فِيهِ وَالنَّهَارَ مُبْصِراًۖ اِنَّ فِے ذَٰلِكَ لَأٓيَٰتٖ لِّقَوْمٖ يَسْمَعُونَۖ","قَالُواْ اُ۪تَّخَذَ اَ۬للَّهُ وَلَداٗۖ سُبْحَٰنَهُۥۖ هُوَ اَ۬لْغَنِيُّۖ لَهُۥ مَا فِے اِ۬لسَّمَٰوَٰتِ وَمَا فِے اِ۬لَارْضِۖ إِنْ عِندَكُم مِّن سُلْطَٰنِۢ بِهَٰذَآۖ أَتَقُولُونَ عَلَى اَ۬للَّهِ مَا لَا تَعْلَمُونَۖ","قُلِ اِنَّ اَ۬لذِينَ يَفْتَرُونَ عَلَى اَ۬للَّهِ اِ۬لْكَذِبَ لَا يُفْلِحُونَۖ","مَتَٰعٞ فِے اِ۬لدُّنْي۪اۖ ثُمَّ إِلَيْنَا مَرْجِعُهُمْ ثُمَّ نُذِيقُهُمُ اُ۬لْعَذَابَ اَ۬لشَّدِيدَ بِمَا كَانُواْ يَكْفُرُونَۖ","۞ وَاتْلُ عَلَيْهِمْ نَبَأَ نُوحٍ اِذْ قَالَ لِقَوْمِهِۦ يَٰقَوْمِ إِن كَانَ كَبُرَ عَلَيْكُم مَّقَامِے وَتَذْكِيرِے بِـَٔايَٰتِ اِ۬للَّهِ فَعَلَى اَ۬للَّهِ تَوَكَّلْتُۖ فَأَجْمِعُوٓاْ أَمْرَكُمْ وَشُرَكَآءَكُمْۖ ثُمَّ لَا يَكُنَ اَمْرُكُمْ عَلَيْكُمْ غُمَّةٗۖ ثُمَّ اَ۪قْضُوٓاْ إِلَيَّ وَلَا تُنظِرُونِ","فَإِن تَوَلَّيْتُمْ فَمَا سَأَلْتُكُم مِّنَ اَجْرٍۖ اِنَ اَجْرِيَ إِلَّا عَلَى اَ۬للَّهِۖ وَأُمِرْتُ أَنَ اَكُونَ مِنَ اَ۬لْمُسْلِمِينَۖ","فَكَذَّبُوهُ فَنَجَّيْنَٰهُ وَمَن مَّعَهُۥ فِے اِ۬لْفُلْكِ وَجَعَلْنَٰهُمْ خَلَٰٓئِفَۖ وَأَغْرَقْنَا اَ۬لذِينَ كَذَّبُواْ بِـَٔايَٰتِنَاۖ فَانظُرْ كَيْفَ كَانَ عَٰقِبَةُ اُ۬لْمُنذَرِينَۖ","ثُمَّ بَعَثْنَا مِنۢ بَعْدِهِۦ رُسُلاً اِلَىٰ قَوْمِهِمْ فَجَآءُوهُم بِالْبَيِّنَٰتِ فَمَا كَانُواْ لِيُومِنُواْ بِمَا كَذَّبُواْ بِهِۦ مِن قَبْلُۖ كَذَٰلِكَ نَطْبَعُ عَلَىٰ قُلُوبِ اِ۬لْمُعْتَدِينَۖ","ثُمَّ بَعَثْنَا مِنۢ بَعْدِهِم مُّوس۪ىٰ وَهَٰرُونَ إِلَىٰ فِرْعَوْنَ وَمَلَإِيْهِۦ بِـَٔايَٰتِنَا فَاسْتَكْبَرُواْ وَكَانُواْ قَوْماٗ مُّجْرِمِينَۖ","فَلَمَّا جَآءَهُمُ اُ۬لْحَقُّ مِنْ عِندِنَا قَالُوٓاْ إِنَّ هَٰذَا لَسِحْرٞ مُّبِينٞۖ","قَالَ مُوس۪ىٰٓ أَتَقُولُونَ لِلْحَقِّ لَمَّا جَآءَكُمُۥٓۖ أَسِحْرٌ هَٰذَاۖ وَلَا يُفْلِحُ اُ۬لسَّٰحِرُونَۖ","قَالُوٓاْ أَجِئْتَنَا لِتَلْفِتَنَا عَمَّا وَجَدْنَا عَلَيْهِ ءَابَآءَنَا وَتَكُونَ لَكُمَا اَ۬لْكِبْرِيَآءُ فِے اِ۬لَارْضِ وَمَا نَحْنُ لَكُمَا بِمُومِنِينَۖ","وَقَالَ فِرْعَوْنُ اُ۪يتُونِے بِكُلِّ سَٰحِرٍ عَلِيمٖۖ","فَلَمَّا جَآءَ اَ۬لسَّحَرَةُ قَالَ لَهُم مُّوس۪ىٰٓ أَلْقُواْ مَآ أَنتُم مُّلْقُونَۖ","فَلَمَّآ أَلْقَوْاْ قَالَ مُوس۪ىٰ مَا جِئْتُم بِهِ اِ۬لسِّحْرُۖ إِنَّ اَ۬للَّهَ سَيُبْطِلُهُۖۥٓ إِنَّ اَ۬للَّهَ لَا يُصْلِحُ عَمَلَ اَ۬لْمُفْسِدِينَۖ","وَيُحِقُّ اُ۬للَّهُ اُ۬لْحَقَّ بِكَلِمَٰتِهِۦ وَلَوْ كَرِهَ اَ۬لْمُجْرِمُونَۖ","۞ فَمَآ ءَامَنَ لِمُوس۪ىٰٓ إِلَّا ذُرِّيَّةٞ مِّن قَوْمِهِۦ عَلَىٰ خَوْفٖ مِّن فِرْعَوْنَ وَمَلَإِيْهِمُۥٓ أَنْ يَّفْتِنَهُمْۖ وَإِنَّ فِرْعَوْنَ لَعَالٖ فِے اِ۬لَارْضِۖ وَإِنَّهُۥ لَمِنَ اَ۬لْمُسْرِفِينَۖ","وَقَالَ مُوس۪ىٰ يَٰقَوْمِ إِن كُنتُمُۥٓ ءَامَنتُم بِاللَّهِ فَعَلَيْهِ تَوَكَّلُوٓاْ إِن كُنتُم مُّسْلِمِينَۖ","فَقَالُواْ عَلَى اَ۬للَّهِ تَوَكَّلْنَاۖ رَبَّنَا لَا تَجْعَلْنَا فِتْنَةٗ لِّلْقَوْمِ اِ۬لظَّٰلِمِينَۖ","وَنَجِّنَا بِرَحْمَتِكَ مِنَ اَ۬لْقَوْمِ اِ۬لْكٰ۪فِرِينَۖ","وَأَوْحَيْنَآ إِلَىٰ مُوس۪ىٰ وَأَخِيهِ أَن تَبَوَّءَا لِقَوْمِكُمَا بِمِصْرَ بُيُوتاٗ وَاجْعَلُواْ بُيُوتَكُمْ قِبْلَةٗ وَأَقِيمُواْ اُ۬لصَّلَوٰةَۖ وَبَشِّرِ اِ۬لْمُومِنِينَۖ","وَقَالَ مُوس۪ىٰ رَبَّنَآ إِنَّكَ ءَاتَيْتَ فِرْعَوْنَ وَمَلَأَهُۥ زِينَةٗ وَأَمْوَٰلاٗ فِے اِ۬لْحَيَوٰةِ اِ۬لدُّنْي۪اۖ رَبَّنَا لِيَضِلُّواْ عَن سَبِيلِكَۖ رَبَّنَا اَ۪طْمِسْ عَلَىٰٓ أَمْوَٰلِهِمْ وَاشْدُدْ عَلَىٰ قُلُوبِهِمْ فَلَا يُومِنُواْ حَتَّىٰ يَرَوُاْ اُ۬لْعَذَابَ اَ۬لَالِيمَۖ","قَالَ قَدُ ا۟جِيبَت دَّعْوَتُكُمَا فَاسْتَقِيمَاۖ وَلَا تَتَّبِعَٰٓنِّ سَبِيلَ اَ۬لذِينَ لَا يَعْلَمُونَۖ","وَجَٰوَزْنَا بِبَنِےٓ إِسْرَآءِيلَ اَ۬لْبَحْرَ فَأَتْبَعَهُمْ فِرْعَوْنُ وَجُنُودُهُۥ بَغْياٗ وَعَدْواًۖ حَتَّىٰٓ إِذَآ أَدْرَكَهُ اُ۬لْغَرَقُ قَالَ ءَامَنتُ أَنَّهُۥ لَآ إِلَٰهَ إِلَّا اَ۬لذِےٓ ءَامَنَتْ بِهِۦ بَنُوٓاْ إِسْرَآءِيلَ وَأَنَا مِنَ اَ۬لْمُسْلِمِينَۖ","ءَالَٰنَ وَقَدْ عَصَيْتَ قَبْلُ وَكُنتَ مِنَ اَ۬لْمُفْسِدِينَۖ","فَالْيَوْمَ نُنَجِّيكَ بِبَدَنِكَ لِتَكُونَ لِمَنْ خَلْفَكَ ءَايَةٗۖ وَإِنَّ كَثِيراٗ مِّنَ اَ۬لنَّاسِ عَنَ اٰيَٰتِنَا لَغَٰفِلُونَۖ","۞ وَلَقَدْ بَوَّأْنَا بَنِےٓ إِسْرَآءِيلَ مُبَوَّأَ صِدْقٖ وَرَزَقْنَٰهُم مِّنَ اَ۬لطَّيِّبَٰتِ فَمَا اَ۪خْتَلَفُواْ حَتَّىٰ جَآءَهُمُ اُ۬لْعِلْمُۖ إِنَّ رَبَّكَ يَقْضِے بَيْنَهُمْ يَوْمَ اَ۬لْقِيَٰمَةِ فِيمَا كَانُواْ فِيهِ يَخْتَلِفُونَۖ","فَإِن كُنتَ فِے شَكّٖ مِّمَّآ أَنزَلْنَآ إِلَيْكَ فَسْـَٔلِ اِ۬لذِينَ يَقْرَءُونَ اَ۬لْكِتَٰبَ مِن قَبْلِكَۖ لَقَدْ جَآءَكَ اَ۬لْحَقُّ مِن رَّبِّكَۖ فَلَا تَكُونَنَّ مِنَ اَ۬لْمُمْتَرِينَۖ","وَلَا تَكُونَنَّ مِنَ اَ۬لذِينَ كَذَّبُواْ بِـَٔايَٰتِ اِ۬للَّهِ فَتَكُونَ مِنَ اَ۬لْخَٰسِرِينَۖ","إِنَّ اَ۬لذِينَ حَقَّتْ عَلَيْهِمْ كَلِمَٰتُ رَبِّكَ لَا يُومِنُونَ","وَلَوْ جَآءَتْهُمْ كُلُّ ءَايَةٍ حَتَّىٰ يَرَوُاْ اُ۬لْعَذَابَ اَ۬لَالِيمَۖ","فَلَوْلَا كَانَتْ قَرْيَةٌ اٰمَنَتْ فَنَفَعَهَآ إِيمَٰنُهَآ إِلَّا قَوْمَ يُونُسَ لَمَّآ ءَامَنُواْ كَشَفْنَا عَنْهُمْ عَذَابَ اَ۬لْخِزْيِ فِے اِ۬لْحَيَوٰةِ اِ۬لدُّنْي۪ا وَمَتَّعْنَٰهُمُۥٓ إِلَىٰ حِينٖۖ","وَلَوْ شَآءَ رَبُّكَ لَأٓمَنَ مَن فِے اِ۬لَارْضِ كُلُّهُمْ جَمِيعاًۖ اَفَأَنتَ تُكْرِهُ اُ۬لنَّاسَ حَتَّىٰ يَكُونُواْ مُومِنِينَۖ","وَمَا كَانَ لِنَفْسٍ اَن تُومِنَ إِلَّا بِإِذْنِ اِ۬للَّهِۖ وَيَجْعَلُ اُ۬لرِّجْسَ عَلَى اَ۬لذِينَ لَا يَعْقِلُونَۖ","قُلُ اُ۟نظُرُواْ مَاذَا فِے اِ۬لسَّمَٰوَٰتِ وَالَارْضِ وَمَا تُغْنِے اِ۬لَايَٰتُ وَالنُّذُرُ عَن قَوْمٖ لَّا يُومِنُونَۖ","فَهَلْ يَنتَظِرُونَ إِلَّا مِثْلَ أَيَّامِ اِ۬لذِينَ خَلَوْاْ مِن قَبْلِهِمْۖ قُلْ فَانتَظِرُوٓاْۖ إِنِّے مَعَكُم مِّنَ اَ۬لْمُنتَظِرِينَۖ","ثُمَّ نُنَجِّے رُسُلَنَا وَالذِينَ ءَامَنُواْ كَذَٰلِكَۖ حَقّاً عَلَيْنَا نُنَجِّ اِ۬لْمُومِنِينَۖ","۞ قُلْ يَٰٓأَيُّهَا اَ۬لنَّاسُ إِن كُنتُمْ فِے شَكّٖ مِّن دِينِے فَلَآ أَعْبُدُ اُ۬لذِينَ تَعْبُدُونَ مِن دُونِ اِ۬للَّهِۖ وَلَٰكِنَ اَعْبُدُ اُ۬للَّهَ اَ۬لذِے يَتَوَفّ۪يٰكُمْۖ وَأُمِرْتُ أَنَ اَكُونَ مِنَ اَ۬لْمُومِنِينَ","وَأَنَ اَقِمْ وَجْهَكَ لِلدِّينِ حَنِيفاٗۖ وَلَا تَكُونَنَّ مِنَ اَ۬لْمُشْرِكِينَۖ","وَلَا تَدْعُ مِن دُونِ اِ۬للَّهِ مَا لَا يَنفَعُكَ وَلَا يَضُرُّكَۖ فَإِن فَعَلْتَ فَإِنَّكَ إِذاٗ مِّنَ اَ۬لظَّٰلِمِينَۖ","وَإِنْ يَّمْسَسْكَ اَ۬للَّهُ بِضُرّٖ فَلَا كَاشِفَ لَهُۥٓ إِلَّا هُوَۖ وَإِنْ يُّرِدْكَ بِخَيْرٖ فَلَا رَآدَّ لِفَضْلِهِۦۖ يُصِيبُ بِهِۦ مَنْ يَّشَآءُ مِنْ عِبَادِهِۦۖ وَهُوَ اَ۬لْغَفُورُ اُ۬لرَّحِيمُۖ","قُلْ يَٰٓأَيُّهَا اَ۬لنَّاسُ قَدْ جَآءَكُمُ اُ۬لْحَقُّ مِن رَّبِّكُمْۖ فَمَنِ اِ۪هْتَد۪ىٰ فَإِنَّمَا يَهْتَدِے لِنَفْسِهِۦۖ وَمَن ضَلَّ فَإِنَّمَا يَضِلُّ عَلَيْهَاۖ وَمَآ أَنَا عَلَيْكُم بِوَكِيلٖۖ","وَاتَّبِعْ مَا يُوح۪ىٰٓ إِلَيْكَ وَاصْبِرْ حَتَّىٰ يَحْكُمَ اَ۬للَّهُۖ وَهُوَ خَيْرُ اُ۬لْحَٰكِمِينَۖ"]],["هود",["أَلَٓر۪ۖ كِتَٰبٌ ا۟حْكِمَتَ اٰيَٰتُهُۥ ثُمَّ فُصِّلَتْ مِن لَّدُنْ حَكِيمٍ خَبِيرٍ","اَلَّا تَعْبُدُوٓاْ إِلَّا اَ۬للَّهَۖ إِنَّنِے لَكُم مِّنْهُ نَذِيرٞ وَبَشِيرٞ","وَأَنِ اِ۪سْتَغْفِرُواْ رَبَّكُمْ ثُمَّ تُوبُوٓاْ إِلَيْهِ يُمَتِّعْكُم مَّتَٰعاً حَسَناً اِلَىٰٓ أَجَلٖ مُّسَمّىٗ وَيُوتِ كُلَّ ذِے فَضْلٖ فَضْلَهُۥۖ وَإِن تَوَلَّوْاْ فَإِنِّيَ أَخَافُ عَلَيْكُمْ عَذَابَ يَوْمٖ كَبِيرٍۖ","اِلَى اَ۬للَّهِ مَرْجِعُكُمْۖ وَهُوَ عَلَىٰ كُلِّ شَےْءٖ قَدِيرٌۖ","اَلَآ إِنَّهُمْ يَثْنُونَ صُدُورَهُمْ لِيَسْتَخْفُواْ مِنْهُۖ أَلَا حِينَ يَسْتَغْشُونَ ثِيَابَهُمْ يَعْلَمُ مَا يُسِرُّونَ وَمَا يُعْلِنُونَۖ إِنَّهُۥ عَلِيمُۢ بِذَاتِ اِ۬لصُّدُورِۖ","۞ وَمَا مِن دَآبَّةٖ فِے اِ۬لَارْضِ إِلَّا عَلَى اَ۬للَّهِ رِزْقُهَا وَيَعْلَمُ مُسْتَقَرَّهَا وَمُسْتَوْدَعَهَاۖ كُلّٞ فِے كِتَٰبٖ مُّبِينٖۖ","وَهُوَ اَ۬لذِے خَلَقَ اَ۬لسَّمَٰوَٰتِ وَالَارْضَ فِے سِتَّةِ أَيَّامٖ وَكَانَ عَرْشُهُۥ عَلَى اَ۬لْمَآءِ لِيَبْلُوَكُمُۥٓ أَيُّكُمُۥٓ أَحْسَنُ عَمَلاٗۖ وَلَئِن قُلْتَ إِنَّكُم مَّبْعُوثُونَ مِنۢ بَعْدِ اِ۬لْمَوْتِ لَيَقُولَنَّ اَ۬لذِينَ كَفَرُوٓاْ إِنْ هَٰذَآ إِلَّا سِحْرٞ مُّبِينٞۖ","وَلَئِنَ اَخَّرْنَا عَنْهُمُ اُ۬لْعَذَابَ إِلَىٰٓ أُمَّةٖ مَّعْدُودَةٖ لَّيَقُولُنَّ مَا يَحْبِسُهُۥۖٓ أَلَا يَوْمَ يَاتِيهِمْ لَيْسَ مَصْرُوفاً عَنْهُمْۖ وَحَاقَ بِهِم مَّا كَانُواْ بِهِۦ يَسْتَهْزِءُونَۖ","وَلَئِنَ اَذَقْنَا اَ۬لِانسَٰنَ مِنَّا رَحْمَةٗ ثُمَّ نَزَعْنَٰهَا مِنْهُ إِنَّهُۥ لَيَـُٔوسٞ كَفُورٞۖ","وَلَئِنَ اَذَقْنَٰهُ نَعْمَآءَ بَعْدَ ضَرَّآءَ مَسَّتْهُ لَيَقُولَنَّ ذَهَبَ اَ۬لسَّيِّـَٔاتُ عَنِّيَۖ إِنَّهُۥ لَفَرِحٞ فَخُورٌۖ","اِلَّا اَ۬لذِينَ صَبَرُواْ وَعَمِلُواْ اُ۬لصَّٰلِحَٰتِ أُوْلَٰٓئِكَ لَهُم مَّغْفِرَةٞ وَأَجْرٞ كَبِيرٞۖ","فَلَعَلَّكَ تَارِكُۢ بَعْضَ مَا يُوح۪ىٰٓ إِلَيْكَ وَضَآئِقُۢ بِهِۦ صَدْرُكَ أَنْ يَّقُولُواْ لَوْلَآ أُنزِلَ عَلَيْهِ كَنزٌ اَوْ جَآءَ مَعَهُۥ مَلَكٌۖ اِنَّمَآ أَنتَ نَذِيرٞۖ وَاللَّهُ عَلَىٰ كُلِّ شَےْءٖ وَكِيلٌۖ","اَمْ يَقُولُونَ اَ۪فْتَر۪يٰهُۖ قُلْ فَاتُواْ بِعَشْرِ سُوَرٖ مِّثْلِهِۦ مُفْتَرَيَٰتٖ وَادْعُواْ مَنِ اِ۪سْتَطَعْتُم مِّن دُونِ اِ۬للَّهِ إِن كُنتُمْ صَٰدِقِينَۖ","فَإِلَّمْ يَسْتَجِيبُواْ لَكُمْ فَاعْلَمُوٓاْ أَنَّمَآ أُنزِلَ بِعِلْمِ اِ۬للَّهِ وَأَن لَّآ إِلَٰهَ إِلَّا هُوَۖ فَهَلَ اَنتُم مُّسْلِمُونَۖ","۞ مَن كَانَ يُرِيدُ اُ۬لْحَيَوٰةَ اَ۬لدُّنْي۪ا وَزِينَتَهَا نُوَفِّ إِلَيْهِمُۥٓ أَعْمَٰلَهُمْ فِيهَا وَهُمْ فِيهَا لَا يُبْخَسُونَۖ","أُوْلَٰٓئِكَ اَ۬لذِينَ لَيْسَ لَهُمْ فِے اِ۬لَاخِرَةِ إِلَّا اَ۬لنَّارُۖ وَحَبِطَ مَا صَنَعُواْ فِيهَاۖ وَبَٰطِلٞ مَّا كَانُواْ يَعْمَلُونَۖ","أَفَمَن كَانَ عَلَىٰ بَيِّنَةٖ مِّن رَّبِّهِۦ وَيَتْلُوهُ شَاهِدٞ مِّنْهُۖ وَمِن قَبْلِهِۦ كِتَٰبُ مُوس۪ىٰٓ إِمَاماٗ وَرَحْمَةًۖ ا۟وْلَٰٓئِكَ يُومِنُونَ بِهِۦۖ وَمَنْ يَّكْفُرْ بِهِۦ مِنَ اَ۬لَاحْزَابِ فَالنَّارُ مَوْعِدُهُۥۖ فَلَا تَكُ فِے مِرْيَةٖ مِّنْهُۖ إِنَّهُ اُ۬لْحَقُّ مِن رَّبِّكَۖ وَلَٰكِنَّ أَكْثَرَ اَ۬لنَّاسِ لَا يُومِنُونَۖ","وَمَنَ اَظْلَمُ مِمَّنِ اِ۪فْتَر۪ىٰ عَلَى اَ۬للَّهِ كَذِباًۖ ا۟وْلَٰٓئِكَ يُعْرَضُونَ عَلَىٰ رَبِّهِمْ وَيَقُولُ اُ۬لَاشْهَٰدُ هَٰٓؤُلَآءِ اِ۬لذِينَ كَذَبُواْ عَلَىٰ رَبِّهِمُۥٓۖ أَلَا لَعْنَةُ اُ۬للَّهِ عَلَى اَ۬لظَّٰلِمِينَ","اَ۬لذِينَ يَصُدُّونَ عَن سَبِيلِ اِ۬للَّهِ وَيَبْغُونَهَا عِوَجاٗ وَهُم بِالَاخِرَةِ هُمْ كَٰفِرُونَۖ","أُوْلَٰٓئِكَ لَمْ يَكُونُواْ مُعْجِزِينَ فِے اِ۬لَارْضِ وَمَا كَانَ لَهُم مِّن دُونِ اِ۬للَّهِ مِنَ اَوْلِيَآءَۖ يُضَٰعَفُ لَهُمُ اُ۬لْعَذَابُۖ مَا كَانُواْ يَسْتَطِيعُونَ اَ۬لسَّمْعَ وَمَا كَانُواْ يُبْصِرُونَۖ","أُوْلَٰٓئِكَ اَ۬لذِينَ خَسِرُوٓاْ أَنفُسَهُمْ وَضَلَّ عَنْهُم مَّا كَانُواْ يَفْتَرُونَۖ","لَا جَرَمَ أَنَّهُمْ فِے اِ۬لَاخِرَةِ هُمُ اُ۬لَاخْسَرُونَۖ","إِنَّ اَ۬لذِينَ ءَامَنُواْ وَعَمِلُواْ اُ۬لصَّٰلِحَٰتِ وَأَخْبَتُوٓاْ إِلَىٰ رَبِّهِمُۥٓ أُوْلَٰٓئِكَ أَصْحَٰبُ اُ۬لْجَنَّةِۖ هُمْ فِيهَا خَٰلِدُونَۖ","۞ مَثَلُ اُ۬لْفَرِيقَيْنِ كَالَاعْم۪ىٰ وَالَاصَمِّ وَالْبَصِيرِ وَالسَّمِيعِۖ هَلْ يَسْتَوِيَٰنِ مَثَلاًۖ اَفَلَا تَذَّكَّرُونَۖ","وَلَقَدَ اَرْسَلْنَا نُوحاً اِلَىٰ قَوْمِهِۦٓۖ إِنِّے لَكُمْ نَذِيرٞ مُّبِينٌ","اَن لَّا تَعْبُدُوٓاْ إِلَّا اَ۬للَّهَۖ إِنِّيَ أَخَافُ عَلَيْكُمْ عَذَابَ يَوْمٍ اَلِيمٖۖ","فَقَالَ اَ۬لْمَلَأُ اُ۬لذِينَ كَفَرُواْ مِن قَوْمِهِۦ مَا نَر۪يٰكَ إِلَّا بَشَراٗ مِّثْلَنَا وَمَا نَر۪يٰكَ اَ۪تَّبَعَكَ إِلَّا اَ۬لذِينَ هُمُۥٓ أَرَاذِلُنَا بَادِيَ اَ۬لرَّأْيِۖ وَمَا نَر۪ىٰ لَكُمْ عَلَيْنَا مِن فَضْلِۢ بَلْ نَظُنُّكُمْ كَٰذِبِينَۖ","قَالَ يَٰقَوْمِ أَرَٰٓيْتُمُۥٓ إِن كُنتُ عَلَىٰ بَيِّنَةٖ مِّن رَّبِّے وَءَات۪يٰنِے رَحْمَةٗ مِّنْ عِندِهِۦ فَعَمِيَتْ عَلَيْكُمُۥٓ أَنُلْزِمُكُمُوهَا وَأَنتُمْ لَهَا كَٰرِهُونَۖ","وَيَٰقَوْمِ لَآ أَسْـَٔلُكُمْ عَلَيْهِ مَالاًۖ اِنَ اَجْرِيَ إِلَّا عَلَى اَ۬للَّهِۖ وَمَآ أَنَا بِطَارِدِ اِ۬لذِينَ ءَامَنُوٓاْ إِنَّهُم مُّلَٰقُواْ رَبِّهِمْۖ وَلَٰكِنِّيَ أَر۪يٰكُمْ قَوْماٗ تَجْهَلُونَۖ","وَيَٰقَوْمِ مَنْ يَّنصُرُنِے مِنَ اَ۬للَّهِ إِن طَرَدتُّهُمُۥٓۖ أَفَلَا تَذَّكَّرُونَۖ","وَلَآ أَقُولُ لَكُمْ عِندِے خَزَآئِنُ اُ۬للَّهِ وَلَآ أَعْلَمُ اُ۬لْغَيْبَ وَلَآ أَقُولُ إِنِّے مَلَكٞۖ وَلَآ أَقُولُ لِلذِينَ تَزْدَرِےٓ أَعْيُنُكُمْ لَنْ يُّوتِيَهُمُ اُ۬للَّهُ خَيْراًۖ اِ۬للَّهُ أَعْلَمُ بِمَا فِےٓ أَنفُسِهِمُۥٓۖ إِنِّيَ إِذاٗ لَّمِنَ اَ۬لظَّٰلِمِينَۖ","۞ قَالُواْ يَٰنُوحُ قَدْ جَٰدَلْتَنَا فَأَكْثَرْتَ جِدَٰلَنَا فَاتِنَا بِمَا تَعِدُنَآ إِن كُنتَ مِنَ اَ۬لصَّٰدِقِينَۖ","قَالَ إِنَّمَا يَاتِيكُم بِهِ اِ۬للَّهُ إِن شَآءَ وَمَآ أَنتُم بِمُعْجِزِينَۖ","وَلَا يَنفَعُكُمْ نُصْحِيَ إِنَ اَرَدتُّ أَنَ اَنصَحَ لَكُمُۥٓ إِن كَانَ اَ۬للَّهُ يُرِيدُ أَنْ يُّغْوِيَكُمْۖ هُوَ رَبُّكُمْۖ وَإِلَيْهِ تُرْجَعُونَۖ","أَمْ يَقُولُونَ اَ۪فْتَر۪يٰهُۖ قُلِ اِنِ اِ۪فْتَرَيْتُهُۥ فَعَلَيَّ إِجْرَامِے وَأَنَا بَرِےٓءٞ مِّمَّا تُجْرِمُونَۖ","وَأُوحِيَ إِلَىٰ نُوحٍ اَنَّهُۥ لَنْ يُّومِنَ مِن قَوْمِكَ إِلَّا مَن قَدَ اٰمَنَۖ فَلَا تَبْتَئِسْ بِمَا كَانُواْ يَفْعَلُونَۖ","وَاصْنَعِ اِ۬لْفُلْكَ بِأَعْيُنِنَا وَوَحْيِنَاۖ وَلَا تُخَٰطِبْنِے فِے اِ۬لذِينَ ظَلَمُوٓاْ إِنَّهُم مُّغْرَقُونَۖ","وَيَصْنَعُ اُ۬لْفُلْكَ وَكُلَّمَا مَرَّ عَلَيْهِ مَلَأٞ مِّن قَوْمِهِۦ سَخِرُواْ مِنْهُۖ قَالَ إِن تَسْخَرُواْ مِنَّا فَإِنَّا نَسْخَرُ مِنكُمْ كَمَا تَسْخَرُونَۖ","فَسَوْفَ تَعْلَمُونَ مَنْ يَّاتِيهِ عَذَابٞ يُخْزِيهِ وَيَحِلُّ عَلَيْهِ عَذَابٞ مُّقِيمٌۖ","حَتَّىٰٓ إِذَا جَآءَ امْرُنَا وَفَارَ اَ۬لتَّنُّورُ قُلْنَا اَ۪حْمِلْ فِيهَا مِن كُلِّ زَوْجَيْنِ اِ۪ثْنَيْنِ وَأَهْلَكَ إِلَّا مَن سَبَقَ عَلَيْهِ اِ۬لْقَوْلُ وَمَنَ اٰمَنَۖ وَمَآ ءَامَنَ مَعَهُۥٓ إِلَّا قَلِيلٞۖ","۞ وَقَالَ اَ۪رْكَبُواْ فِيهَا بِسْمِ اِ۬للَّهِ مُجْر۪يٰهَا وَمُرْس۪يٰهَآۖ إِنَّ رَبِّے لَغَفُورٞ رَّحِيمٞۖ","وَهِيَ تَجْرِے بِهِمْ فِے مَوْجٖ كَالْجِبَالِۖ وَنَاد۪ىٰ نُوحٌ اِ۪بْنَهُۥ وَكَانَ فِے مَعْزِلٖ يَٰبُنَيِّ اِ۪رْكَبْ مَعَنَا وَلَا تَكُن مَّعَ اَ۬لْكٰ۪فِرِينَۖ","قَالَ سَـَٔاوِےٓ إِلَىٰ جَبَلٖ يَعْصِمُنِے مِنَ اَ۬لْمَآءِۖ قَالَ لَا عَٰصِمَ اَ۬لْيَوْمَ مِنَ اَمْرِ اِ۬للَّهِ إِلَّا مَن رَّحِمَۖ وَحَالَ بَيْنَهُمَا اَ۬لْمَوْجُ فَكَانَ مِنَ اَ۬لْمُغْرَقِينَۖ","وَقِيلَ يَٰٓأَرْضُ اُ۪بْلَعِے مَآءَكِ وَيَٰسَمَآءُ اَ۬قْلِعِےۖ وَغِيضَ اَ۬لْمَآءُ وَقُضِيَ اَ۬لَامْرُ وَاسْتَوَتْ عَلَى اَ۬لْجُودِيِّۖ وَقِيلَ بُعْداٗ لِّلْقَوْمِ اِ۬لظَّٰلِمِينَۖ","وَنَاد۪ىٰ نُوحٞ رَّبَّهُۥ فَقَالَ رَبِّ إِنَّ اَ۪بْنِے مِنَ اَهْلِے وَإِنَّ وَعْدَكَ اَ۬لْحَقُّۖ وَأَنتَ أَحْكَمُ اُ۬لْحَٰكِمِينَۖ","قَالَ يَٰنُوحُ إِنَّهُۥ لَيْسَ مِنَ اَهْلِكَۖ إِنَّهُۥ عَمَلٌ غَيْرُ صَٰلِحٖۖ فَلَا تَسْـَٔلَنِّۦ مَا لَيْسَ لَكَ بِهِۦ عِلْمٌۖ اِنِّيَ أَعِظُكَ أَن تَكُونَ مِنَ اَ۬لْجَٰهِلِينَۖ","قَالَ رَبِّ إِنِّيَ أَعُوذُ بِكَ أَنَ اَسْـَٔلَكَ مَا لَيْسَ لِے بِهِۦ عِلْمٞۖ وَإِلَّا تَغْفِرْ لِے وَتَرْحَمْنِےٓ أَكُن مِّنَ اَ۬لْخَٰسِرِينَۖ","قِيلَ يَٰنُوحُ اُ۪هْبِطْ بِسَلَٰمٖ مِّنَّا وَبَرَكَٰتٍ عَلَيْكَ وَعَلَىٰٓ أُمَمٖ مِّمَّن مَّعَكَۖ وَأُمَمٞ سَنُمَتِّعُهُمْ ثُمَّ يَمَسُّهُم مِّنَّا عَذَابٌ اَلِيمٞۖ","تِلْكَ مِنَ اَنۢبَآءِ اِ۬لْغَيْبِ نُوحِيهَآ إِلَيْكَۖ مَا كُنتَ تَعْلَمُهَآ أَنتَ وَلَا قَوْمُكَ مِن قَبْلِ هَٰذَاۖ فَاصْبِرِۖ اِنَّ اَ۬لْعَٰقِبَةَ لِلْمُتَّقِينَۖ","وَإِلَىٰ عَادٍ اَخَاهُمْ هُوداٗۖ قَالَ يَٰقَوْمِ اِ۟عْبُدُواْ اُ۬للَّهَ مَا لَكُم مِّنِ اِلَٰهٍ غَيْرُهُۥٓۖ إِنَ اَنتُمُۥٓ إِلَّا مُفْتَرُونَۖ","يَٰقَوْمِ لَآ أَسْـَٔلُكُمْ عَلَيْهِ أَجْراًۖ اِنَ اَجْرِيَ إِلَّا عَلَى اَ۬لذِے فَطَرَنِيَۖ أَفَلَا تَعْقِلُونَۖ","وَيَٰقَوْمِ اِ۪سْتَغْفِرُواْ رَبَّكُمْ ثُمَّ تُوبُوٓاْ إِلَيْهِ يُرْسِلِ اِ۬لسَّمَآءَ عَلَيْكُم مِّدْرَاراٗ وَيَزِدْكُمْ قُوَّةً اِلَىٰ قُوَّتِكُمْ وَلَا تَتَوَلَّوْاْ مُجْرِمِينَۖ","۞ قَالُواْ يَٰهُودُ مَا جِئْتَنَا بِبَيِّنَةٖ وَمَا نَحْنُ بِتَارِكِےٓ ءَالِهَتِنَا عَن قَوْلِكَ وَمَا نَحْنُ لَكَ بِمُومِنِينَۖ","إِن نَّقُولُ إِلَّا اَ۪عْتَر۪يٰكَ بَعْضُ ءَالِهَتِنَا بِسُوٓءٖۖ قَالَ إِنِّيَ أُشْهِدُ اُ۬للَّهَۖ وَاشْهَدُوٓاْ أَنِّے بَرِےٓءٞ مِّمَّا تُشْرِكُونَ مِن دُونِهِۦۖ فَكِيدُونِے جَمِيعاٗ ثُمَّ لَا تُنظِرُونِۖ","إِنِّے تَوَكَّلْتُ عَلَى اَ۬للَّهِ رَبِّے وَرَبِّكُمۖ مَّا مِن دَآبَّةٍ اِلَّا هُوَ ءَاخِذُۢ بِنَاصِيَتِهَآۖ إِنَّ رَبِّے عَلَىٰ صِرَٰطٖ مُّسْتَقِيمٖۖ","فَإِن تَوَلَّوْاْ فَقَدَ اَبْلَغْتُكُم مَّآ أُرْسِلْتُ بِهِۦٓ إِلَيْكُمْۖ وَيَسْتَخْلِفُ رَبِّے قَوْماً غَيْرَكُمْ وَلَا تَضُرُّونَهُۥ شَئْاًۖ اِنَّ رَبِّے عَلَىٰ كُلِّ شَےْءٍ حَفِيظٞۖ","وَلَمَّا جَآءَ امْرُنَا نَجَّيْنَا هُوداٗ وَالذِينَ ءَامَنُواْ مَعَهُۥ بِرَحْمَةٖ مِّنَّا وَنَجَّيْنَٰهُم مِّنْ عَذَابٍ غَلِيظٖۖ","وَتِلْكَ عَادٞ جَحَدُواْ بِـَٔايَٰتِ رَبِّهِمْ وَعَصَوْاْ رُسُلَهُۥ وَاتَّبَعُوٓاْ أَمْرَ كُلِّ جَبّ۪ارٍ عَنِيدٖۖ","وَأُتْبِعُواْ فِے هَٰذِهِ اِ۬لدُّنْي۪ا لَعْنَةٗ وَيَوْمَ اَ۬لْقِيَٰمَةِۖ أَلَآ إِنَّ عَاداٗ كَفَرُواْ رَبَّهُمُۥٓۖ أَلَا بُعْداٗ لِّعَادٖ قَوْمِ هُودٖۖ","وَإِلَىٰ ثَمُودَ أَخَاهُمْ صَٰلِحاٗۖ قَالَ يَٰقَوْمِ اِ۟عْبُدُواْ اُ۬للَّهَ مَا لَكُم مِّنِ اِلَٰهٍ غَيْرُهُۥۖ هُوَ أَنشَأَكُم مِّنَ اَ۬لَارْضِ وَاسْتَعْمَرَكُمْ فِيهَا فَاسْتَغْفِرُوهُ ثُمَّ تُوبُوٓاْ إِلَيْهِۖ إِنَّ رَبِّے قَرِيبٞ مُّجِيبٞۖ","۞ قَالُواْ يَٰصَٰلِحُ قَدْ كُنتَ فِينَا مَرْجُوّاٗ قَبْلَ هَٰذَآ أَتَنْه۪يٰنَآ أَن نَّعْبُدَ مَا يَعْبُدُ ءَابَآؤُنَا وَإِنَّنَا لَفِے شَكّٖ مِّمَّا تَدْعُونَآ إِلَيْهِ مُرِيبٖۖ","قَالَ يَٰقَوْمِ أَرَٰٓيْتُمُۥٓ إِن كُنتُ عَلَىٰ بَيِّنَةٖ مِّن رَّبِّے وَءَات۪يٰنِے مِنْهُ رَحْمَةٗ فَمَنْ يَّنصُرُنِے مِنَ اَ۬للَّهِ إِنْ عَصَيْتُهُۥۖ فَمَا تَزِيدُونَنِے غَيْرَ تَخْسِيرٖۖ","وَيَٰقَوْمِ هَٰذِهِۦ نَاقَةُ اُ۬للَّهِ لَكُمُۥٓ ءَايَةٗۖ فَذَرُوهَا تَاكُلْ فِےٓ أَرْضِ اِ۬للَّهِۖ وَلَا تَمَسُّوهَا بِسُوٓءٖ فَيَاخُذَكُمْ عَذَابٞ قَرِيبٞۖ","فَعَقَرُوهَا فَقَالَ تَمَتَّعُواْ فِے د۪ارِكُمْ ثَلَٰثَةَ أَيَّامٖۖ ذَٰلِكَ وَعْدٌ غَيْرُ مَكْذُوبٖۖ","فَلَمَّا جَآءَ امْرُنَا نَجَّيْنَا صَٰلِحاٗ وَالذِينَ ءَامَنُواْ مَعَهُۥ بِرَحْمَةٖ مِّنَّا وَمِنْ خِزْيِ يَوْمَئِذٍۖ اِنَّ رَبَّكَ هُوَ اَ۬لْقَوِيُّ اُ۬لْعَزِيزُۖ","وَأَخَذَ اَ۬لذِينَ ظَلَمُواْ اُ۬لصَّيْحَةُ فَأَصْبَحُواْ فِے دِيٰ۪رِهِمْ جَٰثِمِينَ","كَأَن لَّمْ يَغْنَوْاْ فِيهَآۖ أَلَآ إِنَّ ثَمُوداٗ كَفَرُواْ رَبَّهُمُۥٓۖ أَلَا بُعْداٗ لِّثَمُودَۖ","وَلَقَدْ جَآءَتْ رُسُلُنَآ إِبْرَٰهِيمَ بِالْبُشْر۪ىٰ قَالُواْ سَلَٰماٗۖ قَالَ سَلَٰمٞۖ فَمَا لَبِثَ أَن جَآءَ بِعِجْلٍ حَنِيذٖۖ","فَلَمَّا ر۪ء۪آ أَيْدِيَهُمْ لَا تَصِلُ إِلَيْهِ نَكِرَهُمْ وَأَوْجَسَ مِنْهُمْ خِيفَةٗۖ قَالُواْ لَا تَخَفِۖ اِنَّآ أُرْسِلْنَآ إِلَىٰ قَوْمِ لُوطٖۖ","وَامْرَأَتُهُۥ قَآئِمَةٞ فَضَحِكَتْۖ فَبَشَّرْنَٰهَا بِإِسْحَٰقَۖ وَمِنْ وَّرَآءِ اسْحَٰقَ يَعْقُوبُۖ","قَالَتْ يَٰوَيْلَت۪ىٰٓ ءَالِدُ وَأَنَا عَجُوزٞ وَهَٰذَا بَعْلِے شَيْخاًۖ اِنَّ هَٰذَا لَشَےْءٌ عَجِيبٞۖ","۞ قَالُوٓاْ أَتَعْجَبِينَ مِنَ اَمْرِ اِ۬للَّهِۖ رَحْمَتُ اُ۬للَّهِ وَبَرَكَٰتُهُۥ عَلَيْكُمُۥٓ أَهْلَ اَ۬لْبَيْتِۖ إِنَّهُۥ حَمِيدٞ مَّجِيدٞۖ","فَلَمَّا ذَهَبَ عَنِ اِبْرَٰهِيمَ اَ۬لرَّوْعُ وَجَآءَتْهُ اُ۬لْبُشْر۪ىٰ يُجَٰدِلُنَا فِے قَوْمِ لُوطٍۖ","اِنَّ إِبْرَٰهِيمَ لَحَلِيمٌ اَوَّٰهٞ مُّنِيبٞۖ","يَٰٓإِبْرَٰهِيمُ أَعْرِضْ عَنْ هَٰذَآۖ إِنَّهُۥ قَدْ جَآءَ امْرُ رَبِّكَۖ وَإِنَّهُمُۥٓ ءَاتِيهِمْ عَذَابٌ غَيْرُ مَرْدُودٖۖ","وَلَمَّا جَآءَتْ رُسُلُنَا لُوطاٗ س۬ےٓءَ بِهِمْ وَضَاقَ بِهِمْ ذَرْعاٗ وَقَالَ هَٰذَا يَوْمٌ عَصِيبٞۖ","وَجَآءَهُۥ قَوْمُهُۥ يُهْرَعُونَ إِلَيْهِ وَمِن قَبْلُ كَانُواْ يَعْمَلُونَ اَ۬لسَّيِّـَٔاتِۖ قَالَ يَٰقَوْمِ هَٰٓؤُلَآءِ بَنَاتِے هُنَّ أَطْهَرُ لَكُمْ فَاتَّقُواْ اُ۬للَّهَ وَلَا تُخْزُونِ فِے ضَيْفِيَۖ أَلَيْسَ مِنكُمْ رَجُلٞ رَّشِيدٞۖ","قَالُواْ لَقَدْ عَلِمْتَ مَا لَنَا فِے بَنَاتِكَ مِنْ حَقّٖ وَإِنَّكَ لَتَعْلَمُ مَا نُرِيدُۖ","قَالَ لَوَ اَنَّ لِے بِكُمْ قُوَّةً اَوَ اٰوِےٓ إِلَىٰ رُكْنٖ شَدِيدٖۖ","قَالُواْ يَٰلُوطُ إِنَّا رُسُلُ رَبِّكَ لَنْ يَّصِلُوٓاْ إِلَيْكَۖ فَاسْرِ بِأَهْلِكَ بِقِطْعٖ مِّنَ اَ۬ليْلِ وَلَا يَلْتَفِتْ مِنكُمُۥٓ أَحَدٌ اِلَّا اَ۪مْرَأَتَكَۖ إِنَّهُۥ مُصِيبُهَا مَآ أَصَابَهُمُۥٓۖ إِنَّ مَوْعِدَهُمُ اُ۬لصُّبْحُۖ أَلَيْسَ اَ۬لصُّبْحُ بِقَرِيبٖۖ","فَلَمَّا جَآءَ امْرُنَا جَعَلْنَا عَٰلِيَهَا سَافِلَهَا وَأَمْطَرْنَا عَلَيْهَا حِجَارَةٗ مِّن سِجِّيلٖ","مَّنضُودٖ مُّسَوَّمَةً عِندَ رَبِّكَۖ وَمَا هِيَ مِنَ اَ۬لظَّٰلِمِينَ بِبَعِيدٖۖ","۞ وَإِلَىٰ مَدْيَنَ أَخَاهُمْ شُعَيْباٗۖ قَالَ يَٰقَوْمِ اِ۟عْبُدُواْ اُ۬للَّهَ مَا لَكُم مِّنِ اِلَٰهٍ غَيْرُهُۥۖ وَلَا تَنقُصُواْ اُ۬لْمِكْيَالَ وَالْمِيزَانَۖ إِنِّيَ أَر۪يٰكُم بِخَيْرٖ وَإِنِّيَ أَخَافُ عَلَيْكُمْ عَذَابَ يَوْمٖ مُّحِيطٖۖ","وَيَٰقَوْمِ أَوْفُواْ اُ۬لْمِكْيَالَ وَالْمِيزَانَ بِالْقِسْطِۖ وَلَا تَبْخَسُواْ اُ۬لنَّاسَ أَشْيَآءَهُمْ وَلَا تَعْثَوْاْ فِے اِ۬لَارْضِ مُفْسِدِينَۖ","بَقِيَّتُ اُ۬للَّهِ خَيْرٞ لَّكُمُۥٓ إِن كُنتُم مُّومِنِينَۖ","وَمَآ أَنَا عَلَيْكُم بِحَفِيظٖۖ","قَالُواْ يَٰشُعَيْبُ أَصَلَوَٰتُكَ تَامُرُكَ أَن نَّتْرُكَ مَا يَعْبُدُ ءَابَآؤُنَآ أَوَ اَن نَّفْعَلَ فِےٓ أَمْوَٰلِنَا مَا نَشَٰٓؤُاْۖ اِ۪نَّكَ لَأَنتَ اَ۬لْحَلِيمُ اُ۬لرَّشِيدُۖ","قَالَ يَٰقَوْمِ أَرَٰٓيْتُمُۥٓ إِن كُنتُ عَلَىٰ بَيِّنَةٖ مِّن رَّبِّے وَرَزَقَنِے مِنْهُ رِزْقاً حَسَناٗۖ وَمَآ أُرِيدُ أَنُ ا۟خَالِفَكُمُۥٓ إِلَىٰ مَآ أَنْه۪يٰكُمْ عَنْهُۖ إِنُ ا۟رِيدُ إِلَّا اَ۬لِاصْلَٰحَ مَا اَ۪سْتَطَعْتُۖ وَمَا تَوْفِيقِيَ إِلَّا بِاللَّهِۖ عَلَيْهِ تَوَكَّلْتُۖ وَإِلَيْهِ أُنِيبُۖ","وَيَٰقَوْمِ لَا يَجْرِمَنَّكُمْ شِقَاقِيَ أَنْ يُّصِيبَكُم مِّثْلُ مَآ أَصَابَ قَوْمَ نُوحٍ اَوْ قَوْمَ هُودٍ اَوْ قَوْمَ صَٰلِحٖۖ وَمَا قَوْمُ لُوطٖ مِّنكُم بِبَعِيدٖۖ","وَاسْتَغْفِرُواْ رَبَّكُمْ ثُمَّ تُوبُوٓاْ إِلَيْهِۖ إِنَّ رَبِّے رَحِيمٞ وَدُودٞۖ","قَالُواْ يَٰشُعَيْبُ مَا نَفْقَهُ كَثِيراٗ مِّمَّا تَقُولُ وَإِنَّا لَنَر۪يٰكَ فِينَا ضَعِيفاٗ وَلَوْلَا رَهْطُكَ لَرَجَمْنَٰكَ وَمَآ أَنتَ عَلَيْنَا بِعَزِيزٖۖ","قَالَ يَٰقَوْمِ أَرَهْطِيَ أَعَزُّ عَلَيْكُم مِّنَ اَ۬للَّهِ وَاتَّخَذتُّمُوهُ وَرَآءَكُمْ ظِهْرِيّاًۖ اِنَّ رَبِّے بِمَا تَعْمَلُونَ مُحِيطٞۖ","۞ وَيَٰقَوْمِ اِ۪عْمَلُواْ عَلَىٰ مَكَانَتِكُمُۥٓ إِنِّے عَٰمِلٞۖ سَوْفَ تَعْلَمُونَ مَنْ يَّاتِيهِ عَذَابٞ يُخْزِيهِ وَمَنْ هُوَ كَٰذِبٞۖ وَارْتَقِبُوٓاْۖ إِنِّے مَعَكُمْ رَقِيبٞۖ","وَلَمَّا جَآءَ امْرُنَا نَجَّيْنَا شُعَيْباٗ وَالذِينَ ءَامَنُواْ مَعَهُۥ بِرَحْمَةٖ مِّنَّاۖ وَأَخَذَتِ اِ۬لذِينَ ظَلَمُواْ اُ۬لصَّيْحَةُ فَأَصْبَحُواْ فِے دِيٰ۪رِهِمْ جَٰثِمِينَ","كَأَن لَّمْ يَغْنَوْاْ فِيهَآۖ أَلَا بُعْداٗ لِّمَدْيَنَ كَمَا بَعِدَتْ ثَمُودُۖ","وَلَقَدَ اَرْسَلْنَا مُوس۪ىٰ بِـَٔايَٰتِنَا وَسُلْطَٰنٖ مُّبِينٍ","اِلَىٰ فِرْعَوْنَ وَمَلَإِيْهِۦ فَاتَّبَعُوٓاْ أَمْرَ فِرْعَوْنَۖ وَمَآ أَمْرُ فِرْعَوْنَ بِرَشِيدٖۖ","يَقْدُمُ قَوْمَهُۥ يَوْمَ اَ۬لْقِيَٰمَةِ فَأَوْرَدَهُمُ اُ۬لنَّارَۖ وَبِيسَ اَ۬لْوِرْدُ اُ۬لْمَوْرُودُۖ","وَأُتْبِعُواْ فِے هَٰذِهِۦ لَعْنَةٗ وَيَوْمَ اَ۬لْقِيَٰمَةِۖ بِيسَ اَ۬لرِّفْدُ اُ۬لْمَرْفُودُۖ","ذَٰلِكَ مِنَ اَنۢبَآءِ اِ۬لْقُر۪ىٰ نَقُصُّهُۥ عَلَيْكَ مِنْهَا قَآئِمٞ وَحَصِيدٞۖ","وَمَا ظَلَمْنَٰهُمْ وَلَٰكِن ظَلَمُوٓاْ أَنفُسَهُمْۖ فَمَآ أَغْنَتْ عَنْهُمُۥٓ ءَالِهَتُهُمُ اُ۬لتِے يَدْعُونَ مِن دُونِ اِ۬للَّهِ مِن شَےْءٖ لَّمَّا جَآءَ امْرُ رَبِّكَۖ وَمَا زَادُوهُمْ غَيْرَ تَتْبِيبٖۖ","وَكَذَٰلِكَ أَخْذُ رَبِّكَ إِذَآ أَخَذَ اَ۬لْقُر۪ىٰ وَهِيَ ظَالِمَةٌۖ اِنَّ أَخْذَهُۥٓ أَلِيمٞ شَدِيدٌۖ","اِنَّ فِے ذَٰلِكَ لَأٓيَةٗ لِّمَنْ خَافَ عَذَابَ اَ۬لَاخِرَةِۖ ذَٰلِكَ يَوْمٞ مَّجْمُوعٞ لَّهُ اُ۬لنَّاسُۖ وَذَٰلِكَ يَوْمٞ مَّشْهُودٞۖ","وَمَا نُوَ۬خِّرُهُۥٓ إِلَّا لِأَجَلٖ مَّعْدُودٖۖ","۞ يَوْمَ يَاتِۦ لَا تَكَلَّمُ نَفْسٌ اِلَّا بِإِذْنِهِۦۖ فَمِنْهُمْ شَقِيّٞ وَسَعِيدٞۖ","فَأَمَّا اَ۬لذِينَ شَقُواْ فَفِے اِ۬لنّ۪ارِ لَهُمْ فِيهَا زَفِيرٞ وَشَهِيقٌ","خَٰلِدِينَ فِيهَا مَا دَامَتِ اِ۬لسَّمَٰوَٰتُ وَالَارْضُ إِلَّا مَا شَآءَ رَبُّكَۖ إِنَّ رَبَّكَ فَعَّالٞ لِّمَا يُرِيدُۖ","وَأَمَّا اَ۬لذِينَ سَعِدُواْ فَفِے اِ۬لْجَنَّةِ خَٰلِدِينَ فِيهَا مَا دَامَتِ اِ۬لسَّمَٰوَٰتُ وَالَارْضُ إِلَّا مَا شَآءَ رَبُّكَۖ عَطَآءً غَيْرَ مَجْذُوذٖۖ","فَلَا تَكُ فِے مِرْيَةٖ مِّمَّا يَعْبُدُ هَٰٓؤُلَآءِۖ مَا يَعْبُدُونَ إِلَّا كَمَا يَعْبُدُ ءَابَآؤُهُم مِّن قَبْلُۖ وَإِنَّا لَمُوَفُّوهُمْ نَصِيبَهُمْ غَيْرَ مَنقُوصٖۖ","وَلَقَدَ اٰتَيْنَا مُوسَى اَ۬لْكِتَٰبَ فَاخْتُلِفَ فِيهِۖ وَلَوْلَا كَلِمَةٞ سَبَقَتْ مِن رَّبِّكَ لَقُضِيَ بَيْنَهُمْۖ وَإِنَّهُمْ لَفِے شَكّٖ مِّنْهُ مُرِيبٖۖ","وَإِن كُلّاٗ لَّمَا لَيُوَفِّيَنَّهُمْ رَبُّكَ أَعْمَٰلَهُمُۥٓۖ إِنَّهُۥ بِمَا يَعْمَلُونَ خَبِيرٞۖ","فَاسْتَقِمْ كَمَآ أُمِرْتَ وَمَن تَابَ مَعَكَ وَلَا تَطْغَوِاْۖ اِنَّهُۥ بِمَا تَعْمَلُونَ بَصِيرٞۖ","وَلَا تَرْكَنُوٓاْ إِلَى اَ۬لذِينَ ظَلَمُواْ فَتَمَسَّكُمُ اُ۬لنَّارُۖ وَمَا لَكُم مِّن دُونِ اِ۬للَّهِ مِنَ اَوْلِيَآءَۖ ثُمَّ لَا تُنصَرُونَۖ","وَأَقِمِ اِ۬لصَّلَوٰةَ طَرَفَيِ اِ۬لنَّه۪ارِ وَزُلَفاٗ مِّنَ اَ۬ليْلِۖ إِنَّ اَ۬لْحَسَنَٰتِ يُذْهِبْنَ اَ۬لسَّيِّـَٔاتِۖ ذَٰلِكَ ذِكْر۪ىٰ لِلذَّٰكِرِينَۖ","وَاصْبِرْۖ فَإِنَّ اَ۬للَّهَ لَا يُضِيعُ أَجْرَ اَ۬لْمُحْسِنِينَۖ","فَلَوْلَا كَانَ مِنَ اَ۬لْقُرُونِ مِن قَبْلِكُمُۥٓ أُوْلُواْ بَقِيَّةٖ يَنْهَوْنَ عَنِ اِ۬لْفَسَادِ فِے اِ۬لَارْضِ إِلَّا قَلِيلاٗ مِّمَّنَ اَنجَيْنَا مِنْهُمْۖ وَاتَّبَعَ اَ۬لذِينَ ظَلَمُواْ مَآ أُتْرِفُواْ فِيهِ وَكَانُواْ مُجْرِمِينَۖ","۞ وَمَا كَانَ رَبُّكَ لِيُهْلِكَ اَ۬لْقُر۪ىٰ بِظُلْمٖ وَأَهْلُهَا مُصْلِحُونَۖ","وَلَوْ شَآءَ رَبُّكَ لَجَعَلَ اَ۬لنَّاسَ أُمَّةٗ وَٰحِدَةٗۖ وَلَا يَزَالُونَ مُخْتَلِفِينَ إِلَّا مَن رَّحِمَ رَبُّكَۖ وَلِذَٰلِكَ خَلَقَهُمْۖ وَتَمَّتْ كَلِمَةُ رَبِّكَ لَأَمْلَأَنَّ جَهَنَّمَ مِنَ اَ۬لْجِنَّةِ وَالنَّاسِ أَجْمَعِينَۖ","وَكُلّاٗ نَّقُصُّ عَلَيْكَ مِنَ اَنۢبَآءِ اِ۬لرُّسُلِ مَا نُثَبِّتُ بِهِۦ فُؤَادَكَۖ وَجَآءَكَ فِے هَٰذِهِ اِ۬لْحَقُّ وَمَوْعِظَةٞ وَذِكْر۪ىٰ لِلْمُومِنِينَۖ","وَقُل لِّلذِينَ لَا يُومِنُونَ اَ۪عْمَلُواْ عَلَىٰ مَكَانَتِكُمُۥٓ إِنَّا عَٰمِلُونَ وَانتَظِرُوٓاْ إِنَّا مُنتَظِرُونَۖ","وَلِلهِ غَيْبُ اُ۬لسَّمَٰوَٰتِ وَالَارْضِۖ وَإِلَيْهِ يُرْجَعُ اُ۬لَامْرُ كُلُّهُۥۖ فَاعْبُدْهُ وَتَوَكَّلْ عَلَيْهِۖ وَمَا رَبُّكَ بِغَٰفِلٍ عَمَّا تَعْمَلُونَۖ"]],["يوسف",["أَلَٓر۪ۖ تِلْكَ ءَايَٰتُ اُ۬لْكِتَٰبِ اِ۬لْمُبِينِۖ","إِنَّآ أَنزَلْنَٰهُ قُرْءَٰناً عَرَبِيّاٗ لَّعَلَّكُمْ تَعْقِلُونَۖ","نَحْنُ نَقُصُّ عَلَيْكَ أَحْسَنَ اَ۬لْقَصَصِ بِمَآ أَوْحَيْنَآ إِلَيْكَ هَٰذَا اَ۬لْقُرْءَانَ وَإِن كُنتَ مِن قَبْلِهِۦ لَمِنَ اَ۬لْغَٰفِلِينَۖ","إِذْ قَالَ يُوسُفُ لِأَبِيهِ يَٰٓأَبَتِ إِنِّے رَأَيْتُ أَحَدَ عَشَرَ كَوْكَباٗ وَالشَّمْسَ وَالْقَمَرَۖ رَأَيْتُهُمْ لِے سَٰجِدِينَۖ","قَالَ يَٰبُنَيِّ لَا تَقْصُصْ رُءْي۪اكَ عَلَىٰٓ إِخْوَتِكَ فَيَكِيدُواْ لَكَ كَيْداًۖ اِنَّ اَ۬لشَّيْطَٰنَ لِلِانسَٰنِ عَدُوّٞ مُّبِينٞۖ","وَكَذَٰلِكَ يَجْتَبِيكَ رَبُّكَ وَيُعَلِّمُكَ مِن تَاوِيلِ اِ۬لَاحَادِيثِۖ وَيُتِمُّ نِعْمَتَهُۥ عَلَيْكَ وَعَلَىٰٓ ءَالِ يَعْقُوبَ كَمَآ أَتَمَّهَا عَلَىٰٓ أَبَوَيْكَ مِن قَبْلُ إِبْرَٰهِيمَ وَإِسْحَٰقَۖ إِنَّ رَبَّكَ عَلِيمٌ حَكِيمٞۖ","لَّقَدْ كَانَ فِے يُوسُفَ وَإِخْوَتِهِۦٓ ءَايَٰتٞ لِّلسَّآئِلِينَۖ","إِذْ قَالُواْ لَيُوسُفُ وَأَخُوهُ أَحَبُّ إِلَىٰٓ أَبِينَا مِنَّا وَنَحْنُ عُصْبَةٌۖ اِنَّ أَبَانَا لَفِے ضَلَٰلٖ مُّبِينٍۖ","اُ۟قْتُلُواْ يُوسُفَ أَوِ اِ۪طْرَحُوهُ أَرْضاٗ يَخْلُ لَكُمْ وَجْهُ أَبِيكُمْ وَتَكُونُواْ مِنۢ بَعْدِهِۦ قَوْماٗ صَٰلِحِينَۖ","۞ قَالَ قَآئِلٞ مِّنْهُمْ لَا تَقْتُلُواْ يُوسُفَ وَأَلْقُوهُ فِے غَيَٰبَٰتِ اِ۬لْجُبِّ يَلْتَقِطْهُ بَعْضُ اُ۬لسَّيَّارَةِ إِن كُنتُمْ فَٰعِلِينَۖ","قَالُواْ يَٰٓأَبَانَا مَا لَكَ لَا تَامَ۬نَّا عَلَىٰ يُوسُفَ وَإِنَّا لَهُۥ لَنَٰصِحُونَۖ","أَرْسِلْهُ مَعَنَا غَداٗ يَرْتَعِ وَيَلْعَبْ وَإِنَّا لَهُۥ لَحَٰفِظُونَۖ","قَالَ إِنِّے لَيُحْزِنُنِيَ أَن تَذْهَبُواْ بِهِۦ وَأَخَافُ أَنْ يَّاكُلَهُ اُ۬لذِّيبُ وَأَنتُمْ عَنْهُ غَٰفِلُونَۖ","قَالُواْ لَئِنَ اَكَلَهُ اُ۬لذِّيبُ وَنَحْنُ عُصْبَةٌ اِنَّآ إِذاٗ لَّخَٰسِرُونَۖ","فَلَمَّا ذَهَبُواْ بِهِۦ وَأَجْمَعُوٓاْ أَنْ يَّجْعَلُوهُ فِے غَيَٰبَٰتِ اِ۬لْجُبِّ وَأَوْحَيْنَآ إِلَيْهِ لَتُنَبِّئَنَّهُم بِأَمْرِهِمْ هَٰذَا وَهُمْ لَا يَشْعُرُونَۖ","وَجَآءُوٓ أَبَاهُمْ عِشَآءٗ يَبْكُونَ","قَالُواْ يَٰٓأَبَانَآ إِنَّا ذَهَبْنَا نَسْتَبِقُ وَتَرَكْنَا يُوسُفَ عِندَ مَتَٰعِنَا فَأَكَلَهُ اُ۬لذِّيبُۖ وَمَآ أَنتَ بِمُومِنٖ لَّنَا وَلَوْ كُنَّا صَٰدِقِينَۖ","وَجَآءُو عَلَىٰ قَمِيصِهِۦ بِدَمٖ كَذِبٖۖ قَالَ بَلْ سَوَّلَتْ لَكُمُۥٓ أَنفُسُكُمُۥٓ أَمْراٗۖ فَصَبْرٞ جَمِيلٞۖ وَاللَّهُ اُ۬لْمُسْتَعَانُ عَلَىٰ مَا تَصِفُونَۖ","وَجَآءَتْ سَيَّارَةٞ فَأَرْسَلُواْ وَارِدَهُمْ فَأَدْل۪ىٰ دَلْوَهُۥ قَالَ يَٰبُشْرٰ۪يَ هَٰذَا غُلَٰمٞۖ وَأَسَرُّوهُ بِضَٰعَةٗۖ وَاللَّهُ عَلِيمُۢ بِمَا يَعْمَلُونَۖ","وَشَرَوْهُ بِثَمَنِۢ بَخْسٖ دَرَٰهِمَ مَعْدُودَةٖ وَكَانُواْ فِيهِ مِنَ اَ۬لزَّٰهِدِينَۖ","وَقَالَ اَ۬لذِے اِ۪شْتَر۪يٰهُ مِن مِّصْرَ لِامْرَأَتِهِۦٓ أَكْرِمِے مَثْو۪يٰهُ عَس۪ىٰٓ أَنْ يَّنفَعَنَآ أَوْ نَتَّخِذَهُۥ وَلَداٗۖ وَكَذَٰلِكَ مَكَّنَّا لِيُوسُفَ فِے اِ۬لَارْضِ وَلِنُعَلِّمَهُۥ مِن تَاوِيلِ اِ۬لَاحَادِيثِۖ وَاللَّهُ غَالِبٌ عَلَىٰٓ أَمْرِهِۦۖ وَلَٰكِنَّ أَكْثَرَ اَ۬لنَّاسِ لَا يَعْلَمُونَۖ","وَلَمَّا بَلَغَ أَشُدَّهُۥٓ ءَاتَيْنَٰهُ حُكْماٗ وَعِلْماٗۖ وَكَذَٰلِكَ نَجْزِے اِ۬لْمُحْسِنِينَۖ","۞ وَرَٰوَدَتْهُ اُ۬لتِے هُوَ فِے بَيْتِهَا عَن نَّفْسِهِۦ وَغَلَّقَتِ اِ۬لَابْوَٰبَ وَقَالَتْ هِيتَ لَكَۖ قَالَ مَعَاذَ اَ۬للَّهِۖ إِنَّهُۥ رَبِّيَ أَحْسَنَ مَثْو۪ايَۖ إِنَّهُۥ لَا يُفْلِحُ اُ۬لظَّٰلِمُونَۖ","وَلَقَدْ هَمَّتْ بِهِۦۖ وَهَمَّ بِهَا لَوْلَآ أَن رّ۪ء۪ا بُرْهَٰنَ رَبِّهِۦۖ كَذَٰلِكَ لِنَصْرِفَ عَنْهُ اُ۬لسُّوٓءَ وَالْفَحْشَآءَۖ ا۪نَّهُۥ مِنْ عِبَادِنَا اَ۬لْمُخْلَصِينَۖ","وَاسْتَبَقَا اَ۬لْبَابَ وَقَدَّتْ قَمِيصَهُۥ مِن دُبُرٖ وَأَلْفَيَا سَيِّدَهَا لَدَا اَ۬لْبَابِۖ قَالَتْ مَا جَزَآءُ مَنَ اَرَادَ بِأَهْلِكَ سُوٓءاً اِلَّآ أَنْ يُّسْجَنَ أَوْ عَذَابٌ اَلِيمٞۖ","قَالَ هِيَ رَٰوَدَتْنِے عَن نَّفْسِےۖ وَشَهِدَ شَاهِدٞ مِّنَ اَهْلِهَآ إِن كَانَ قَمِيصُهُۥ قُدَّ مِن قُبُلٖ فَصَدَقَتْ وَهُوَ مِنَ اَ۬لْكَٰذِبِينَ","وَإِن كَانَ قَمِيصُهُۥ قُدَّ مِن دُبُرٖ فَكَذَبَتْۖ وَهُوَ مِنَ اَ۬لصَّٰدِقِينَۖ","فَلَمَّا ر۪ء۪ا قَمِيصَهُۥ قُدَّ مِن دُبُرٖ قَالَ إِنَّهُۥ مِن كَيْدِكُنَّ إِنَّ كَيْدَكُنَّ عَظِيمٞۖ","يُوسُفُ أَعْرِضْ عَنْ هَٰذَاۖ وَاسْتَغْفِرِے لِذَنۢبِكِ إِنَّكِ كُنتِ مِنَ اَ۬لْخَاطِـِٕينَۖ","وَقَالَ نِسْوَةٞ فِے اِ۬لْمَدِينَةِ اِ۪مْرَأَتُ اُ۬لْعَزِيزِ تُرَٰوِدُ فَت۪يٰهَا عَن نَّفْسِهِۦ قَدْ شَغَفَهَا حُبّاًۖ اِنَّا لَنَر۪يٰهَا فِے ضَلَٰلٖ مُّبِينٖۖ","فَلَمَّا سَمِعَتْ بِمَكْرِهِنَّ أَرْسَلَتِ اِلَيْهِنَّ وَأَعْتَدَتْ لَهُنَّ مُتَّكَـٔاٗ وَءَاتَتْ كُلَّ وَٰحِدَةٖ مِّنْهُنَّ سِكِّيناٗ وَقَالَتُ اُ۟خْرُجْ عَلَيْهِنَّۖ فَلَمَّا رَأَيْنَهُۥٓ أَكْبَرْنَهُۥ وَقَطَّعْنَ أَيْدِيَهُنَّ وَقُلْنَ حَٰشَ لِلهِ مَا هَٰذَا بَشَراًۖ اِنْ هَٰذَآ إِلَّا مَلَكٞ كَرِيمٞۖ","قَالَتْ فَذَٰلِكُنَّ اَ۬لذِے لُمْتُنَّنِے فِيهِۖ وَلَقَدْ رَٰوَدتُّهُۥ عَن نَّفْسِهِۦ فَاسْتَعْصَمَۖ وَلَئِن لَّمْ يَفْعَلْ مَآ ءَامُرُهُۥ لَيُسْجَنَنَّ وَلَيَكُوناٗ مِّنَ اَ۬لصَّٰغِرِينَۖ","۞ قَالَ رَبِّ اِ۬لسِّجْنُ أَحَبُّ إِلَيَّ مِمَّا يَدْعُونَنِےٓ إِلَيْهِ وَإِلَّا تَصْرِفْ عَنِّے كَيْدَهُنَّ أَصْبُ إِلَيْهِنَّ وَأَكُن مِّنَ اَ۬لْجَٰهِلِينَۖ","فَاسْتَجَابَ لَهُۥ رَبُّهُۥ فَصَرَفَ عَنْهُ كَيْدَهُنَّۖ إِنَّهُۥ هُوَ اَ۬لسَّمِيعُ اُ۬لْعَلِيمُۖ","ثُمَّ بَدَا لَهُم مِّنۢ بَعْدِ مَا رَأَوُاْ اُ۬لَايَٰتِ لَيَسْجُنُنَّهُۥ حَتَّىٰ حِينٖۖ","وَدَخَلَ مَعَهُ اُ۬لسِّجْنَ فَتَيَٰنِۖ قَالَ أَحَدُهُمَآ إِنِّيَ أَر۪يٰنِيَ أَعْصِرُ خَمْراٗۖ وَقَالَ اَ۬لَاخَرُ إِنِّيَ أَر۪يٰنِيَ أَحْمِلُ فَوْقَ رَأْسِے خُبْزاٗ تَاكُلُ اُ۬لطَّيْرُ مِنْهُۖ نَبِّئْنَا بِتَاوِيلِهِۦٓ إِنَّا نَر۪يٰكَ مِنَ اَ۬لْمُحْسِنِينَۖ","قَالَ لَا يَاتِيكُمَا طَعَامٞ تُرْزَقَٰنِهِۦٓ إِلَّا نَبَّأْتُكُمَا بِتَاوِيلِهِۦ قَبْلَ أَنْ يَّاتِيَكُمَاۖ ذَٰلِكُمَا مِمَّا عَلَّمَنِے رَبِّيَۖ إِنِّے تَرَكْتُ مِلَّةَ قَوْمٖ لَّا يُومِنُونَ بِاللَّهِ وَهُم بِالَاخِرَةِ هُمْ كَٰفِرُونَۖ","وَاتَّبَعْتُ مِلَّةَ ءَابَآءِيَ إِبْرَٰهِيمَ وَإِسْحَٰقَ وَيَعْقُوبَۖ مَا كَانَ لَنَآ أَن نُّشْرِكَ بِاللَّهِ مِن شَےْءٖۖ ذَٰلِكَ مِن فَضْلِ اِ۬للَّهِ عَلَيْنَا وَعَلَى اَ۬لنَّاسِۖ وَلَٰكِنَّ أَكْثَرَ اَ۬لنَّاسِ لَا يَشْكُرُونَۖ","يَٰصَٰحِبَيِ اِ۬لسِّجْنِ ءَآرْبَابٞ مُّتَفَرِّقُونَ خَيْرٌ اَمِ اِ۬للَّهُ اُ۬لْوَٰحِدُ اُ۬لْقَهَّارُۖ","مَا تَعْبُدُونَ مِن دُونِهِۦٓ إِلَّآ أَسْمَآءٗ سَمَّيْتُمُوهَآ أَنتُمْ وَءَابَآؤُكُم مَّآ أَنزَلَ اَ۬للَّهُ بِهَا مِن سُلْطَٰنٍۖ اِنِ اِ۬لْحُكْمُ إِلَّا لِلهِۖ أَمَرَ أَلَّا تَعْبُدُوٓاْ إِلَّآ إِيَّاهُۖ ذَٰلِكَ اَ۬لدِّينُ اُ۬لْقَيِّمُۖ وَلَٰكِنَّ أَكْثَرَ اَ۬لنَّاسِ لَا يَعْلَمُونَۖ","يَٰصَٰحِبَيِ اِ۬لسِّجْنِ أَمَّآ أَحَدُكُمَا فَيَسْقِے رَبَّهُۥ خَمْراٗۖ وَأَمَّا اَ۬لَاخَرُ فَيُصْلَبُ فَتَاكُلُ اُ۬لطَّيْرُ مِن رَّأْسِهِۦۖ قُضِيَ اَ۬لَامْرُ اُ۬لذِے فِيهِ تَسْتَفْتِيَٰنِۖ","۞ وَقَالَ لِلذِے ظَنَّ أَنَّهُۥ نَاجٖ مِّنْهُمَا اَ۟ذْكُرْنِے عِندَ رَبِّكَۖ فَأَنس۪يٰهُ اُ۬لشَّيْطَٰنُ ذِكْرَ رَبِّهِۦ فَلَبِثَ فِے اِ۬لسِّجْنِ بِضْعَ سِنِينَۖ","وَقَالَ اَ۬لْمَلِكُ إِنِّيَ أَر۪ىٰ سَبْعَ بَقَرَٰتٖ سِمَانٖ يَاكُلُهُنَّ سَبْعٌ عِجَافٞ وَسَبْعَ سُنۢبُلَٰتٍ خُضْرٖ وَأُخَرَ يَابِسَٰتٖۖ يَٰٓأَيُّهَا اَ۬لْمَلَأُ اَ۬فْتُونِے فِے رُءْيٰ۪يَ إِن كُنتُمْ لِلرُّءْي۪ا تَعْبُرُونَۖ","قَالُوٓاْ أَضْغَٰثُ أَحْلَٰمٖۖ وَمَا نَحْنُ بِتَاوِيلِ اِ۬لَاحْلَٰمِ بِعَٰلِمِينَۖ","وَقَالَ اَ۬لذِے نَجَا مِنْهُمَا وَادَّكَرَ بَعْدَ أُمَّةٍ اَنَآ أُنَبِّئُكُم بِتَاوِيلِهِۦ فَأَرْسِلُونِۖ","يُوسُفُ أَيُّهَا اَ۬لصِّدِّيقُ أَفْتِنَا فِے سَبْعِ بَقَرَٰتٖ سِمَانٖ يَاكُلُهُنَّ سَبْعٌ عِجَافٞ وَسَبْعِ سُنۢبُلَٰتٍ خُضْرٖ وَأُخَرَ يَابِسَٰتٖ لَّعَلِّيَ أَرْجِعُ إِلَى اَ۬لنَّاسِ لَعَلَّهُمْ يَعْلَمُونَۖ","قَالَ تَزْرَعُونَ سَبْعَ سِنِينَ دَأْباٗۖ فَمَا حَصَدتُّمْ فَذَرُوهُ فِے سُنۢبُلِهِۦٓ إِلَّا قَلِيلاٗ مِّمَّا تَاكُلُونَۖ","ثُمَّ يَاتِے مِنۢ بَعْدِ ذَٰلِكَ سَبْعٞ شِدَادٞ يَاكُلْنَ مَا قَدَّمْتُمْ لَهُنَّ إِلَّا قَلِيلاٗ مِّمَّا تُحْصِنُونَۖ","ثُمَّ يَاتِے مِنۢ بَعْدِ ذَٰلِكَ عَامٞ فِيهِ يُغَاثُ اُ۬لنَّاسُ وَفِيهِ يَعْصِرُونَۖ","وَقَالَ اَ۬لْمَلِكُ اُ۪يتُونِے بِهِۦۖ فَلَمَّا جَآءَهُ اُ۬لرَّسُولُ قَالَ اَ۪رْجِعِ اِلَىٰ رَبِّكَ فَسْـَٔلْهُ مَا بَالُ اُ۬لنِّسْوَةِ اِ۬لتِے قَطَّعْنَ أَيْدِيَهُنَّۖ إِنَّ رَبِّے بِكَيْدِهِنَّ عَلِيمٞۖ","قَالَ مَا خَطْبُكُنَّ إِذْ رَٰوَدتُّنَّ يُوسُفَ عَن نَّفْسِهِۦۖ قُلْنَ حَٰشَ لِلهِ مَا عَلِمْنَا عَلَيْهِ مِن سُوٓءٖۖ قَالَتِ اِ۪مْرَأَتُ اُ۬لْعَزِيزِ اِ۬لَٰنَ حَصْحَصَ اَ۬لْحَقُّ أَنَا رَٰوَدتُّهُۥ عَن نَّفْسِهِۦ وَإِنَّهُۥ لَمِنَ اَ۬لصَّٰدِقِينَۖ","ذَٰلِكَ لِيَعْلَمَ أَنِّے لَمَ اَخُنْهُ بِالْغَيْبِ وَأَنَّ اَ۬للَّهَ لَا يَهْدِے كَيْدَ اَ۬لْخَآئِنِينَۖ","۞ وَمَآ أُبَرِّۓُ نَفْسِيَۖ إِنَّ اَ۬لنَّفْسَ لَأَمَّارَةُۢ بِالسُّوٓءِ الَّا مَا رَحِمَ رَبِّيَۖ إِنَّ رَبِّے غَفُورٞ رَّحِيمٞۖ","وَقَالَ اَ۬لْمَلِكُ اُ۪يتُونِے بِهِۦٓ أَسْتَخْلِصْهُ لِنَفْسِےۖ فَلَمَّا كَلَّمَهُۥ قَالَ إِنَّكَ اَ۬لْيَوْمَ لَدَيْنَا مَكِينٌ اَمِينٞۖ","قَالَ اَ۪جْعَلْنِے عَلَىٰ خَزَآئِنِ اِ۬لَارْضِ إِنِّے حَفِيظٌ عَلِيمٞۖ","وَكَذَٰلِكَ مَكَّنَّا لِيُوسُفَ فِے اِ۬لَارْضِ يَتَبَوَّأُ مِنْهَا حَيْثُ يَشَآءُۖ نُصِيبُ بِرَحْمَتِنَا مَن نَّشَآءُ وَلَا نُضِيعُ أَجْرَ اَ۬لْمُحْسِنِينَۖ","وَلَأَجْرُ اُ۬لَاخِرَةِ خَيْرٞ لِّلذِينَ ءَامَنُواْ وَكَانُواْ يَتَّقُونَۖ","وَجَآءَ ا۪خْوَةُ يُوسُفَ فَدَخَلُواْ عَلَيْهِ فَعَرَفَهُمْ وَهُمْ لَهُۥ مُنكِرُونَۖ","وَلَمَّا جَهَّزَهُم بِجَهَازِهِمْ قَالَ اَ۪يتُونِے بِأَخٖ لَّكُم مِّنَ اَبِيكُمُۥٓۖ أَلَا تَرَوْنَ أَنِّيَ أُوفِے اِ۬لْكَيْلَ وَأَنَا خَيْرُ اُ۬لْمُنزِلِينَۖ","فَإِن لَّمْ تَاتُونِے بِهِۦ فَلَا كَيْلَ لَكُمْ عِندِے وَلَا تَقْرَبُونِۖ","قَالُواْ سَنُرَٰوِدُ عَنْهُ أَبَاهُ وَإِنَّا لَفَٰعِلُونَۖ","وَقَالَ لِفِتْيَتِهِ اِ۪جْعَلُواْ بِضَٰعَتَهُمْ فِے رِحَالِهِمْ لَعَلَّهُمْ يَعْرِفُونَهَآ إِذَا اَ۪نقَلَبُوٓاْ إِلَىٰٓ أَهْلِهِمْ لَعَلَّهُمْ يَرْجِعُونَۖ","فَلَمَّا رَجَعُوٓاْ إِلَىٰٓ أَبِيهِمْ قَالُواْ يَٰٓأَبَانَا مُنِعَ مِنَّا اَ۬لْكَيْلُ فَأَرْسِلْ مَعَنَآ أَخَانَا نَكْتَلْ وَإِنَّا لَهُۥ لَحَٰفِظُونَۖ","قَالَ هَلَ اٰمَنُكُمْ عَلَيْهِ إِلَّا كَمَآ أَمِنتُكُمْ عَلَىٰٓ أَخِيهِ مِن قَبْلُۖ فَاللَّهُ خَيْرٌ حِفْظاٗۖ وَهُوَ أَرْحَمُ اُ۬لرَّٰحِمِينَۖ","وَلَمَّا فَتَحُواْ مَتَٰعَهُمْ وَجَدُواْ بِضَٰعَتَهُمْ رُدَّتِ اِلَيْهِمْ قَالُواْ يَٰٓأَبَانَا مَا نَبْغِےۖ هَٰذِهِۦ بِضَٰعَتُنَا رُدَّتِ اِلَيْنَا وَنَمِيرُ أَهْلَنَا وَنَحْفَظُ أَخَانَا وَنَزْدَادُ كَيْلَ بَعِيرٖۖ ذَٰلِكَ كَيْلٞ يَسِيرٞۖ","۞ قَالَ لَنُ ا۟رْسِلَهُۥ مَعَكُمْ حَتَّىٰ تُوتُونِ مَوْثِقاٗ مِّنَ اَ۬للَّهِ لَتَاتُنَّنِے بِهِۦٓ إِلَّآ أَنْ يُّحَاطَ بِكُمْۖ فَلَمَّآ ءَاتَوْهُ مَوْثِقَهُمْ قَالَ اَ۬للَّهُ عَلَىٰ مَا نَقُولُ وَكِيلٞۖ","وَقَالَ يَٰبَنِيَّ لَا تَدْخُلُواْ مِنۢ بَابٖ وَٰحِدٖ وَادْخُلُواْ مِنَ اَبْوَٰبٖ مُّتَفَرِّقَةٖۖ وَمَآ أُغْنِے عَنكُم مِّنَ اَ۬للَّهِ مِن شَےْءٍۖ اِنِ اِ۬لْحُكْمُ إِلَّا لِلهِۖ عَلَيْهِ تَوَكَّلْتُۖ وَعَلَيْهِ فَلْيَتَوَكَّلِ اِ۬لْمُتَوَكِّلُونَۖ","وَلَمَّا دَخَلُواْ مِنْ حَيْثُ أَمَرَهُمُۥٓ أَبُوهُم مَّا كَانَ يُغْنِے عَنْهُم مِّنَ اَ۬للَّهِ مِن شَےْءٍ اِلَّا حَاجَةٗ فِے نَفْسِ يَعْقُوبَ قَض۪يٰهَاۖ وَإِنَّهُۥ لَذُو عِلْمٖ لِّمَا عَلَّمْنَٰهُۖ وَلَٰكِنَّ أَكْثَرَ اَ۬لنَّاسِ لَا يَعْلَمُونَۖ","وَلَمَّا دَخَلُواْ عَلَىٰ يُوسُفَ ءَاو۪ىٰٓ إِلَيْهِ أَخَاهُۖ قَالَ إِنِّيَ أَنَآ أَخُوكَ فَلَا تَبْتَئِسْ بِمَا كَانُواْ يَعْمَلُونَۖ","فَلَمَّا جَهَّزَهُم بِجَهَازِهِمْ جَعَلَ اَ۬لسِّقَايَةَ فِے رَحْلِ أَخِيهِ ثُمَّ أَذَّنَ مُوَ۬ذِّنٌ اَيَّتُهَا اَ۬لْعِيرُ إِنَّكُمْ لَسَٰرِقُونَۖ","قَالُواْ وَأَقْبَلُواْ عَلَيْهِم مَّاذَا تَفْقِدُونَۖ","قَالُواْ نَفْقِدُ صُوَاعَ اَ۬لْمَلِكِۖ وَلِمَن جَآءَ بِهِۦ حِمْلُ بَعِيرٖ وَأَنَا بِهِۦ زَعِيمٞۖ","قَالُواْ تَاللَّهِ لَقَدْ عَلِمْتُم مَّا جِئْنَا لِنُفْسِدَ فِے اِ۬لَارْضِ وَمَا كُنَّا سَٰرِقِينَۖ","قَالُواْ فَمَا جَزَٰٓؤُهُۥٓ إِن كُنتُمْ كَٰذِبِينَۖ","قَالُواْ جَزَٰٓؤُهُۥ مَنْ وُّجِدَ فِے رَحْلِهِۦ فَهُوَ جَزَٰٓؤُهُۥۖ كَذَٰلِكَ نَجْزِے اِ۬لظَّٰلِمِينَۖ","فَبَدَأَ بِأَوْعِيَتِهِمْ قَبْلَ وِعَآءِ اَ۬خِيهِ ثُمَّ اَ۪سْتَخْرَجَهَا مِنْ وِّعَآءِ اَ۬خِيهِۖ كَذَٰلِكَ كِدْنَا لِيُوسُفَۖ مَا كَانَ لِيَاخُذَ أَخَاهُ فِے دِينِ اِ۬لْمَلِكِ إِلَّآ أَنْ يَّشَآءَ اَ۬للَّهُۖ نَرْفَعُ دَرَجَٰتِ مَن نَّشَآءُۖ وَفَوْقَ كُلِّ ذِے عِلْمٍ عَلِيمٞۖ","۞ قَالُوٓاْ إِنْ يَّسْرِقْ فَقَدْ سَرَقَ أَخٞ لَّهُۥ مِن قَبْلُۖ فَأَسَرَّهَا يُوسُفُ فِے نَفْسِهِۦ وَلَمْ يُبْدِهَا لَهُمْۖ قَالَ أَنتُمْ شَرّٞ مَّكَاناٗۖ وَاللَّهُ أَعْلَمُ بِمَا تَصِفُونَۖ","قَالُواْ يَٰٓأَيُّهَا اَ۬لْعَزِيزُ إِنَّ لَهُۥٓ أَباٗ شَيْخاٗ كَبِيراٗ فَخُذَ اَحَدَنَا مَكَانَهُۥٓ إِنَّا نَر۪يٰكَ مِنَ اَ۬لْمُحْسِنِينَۖ","قَالَ مَعَاذَ اَ۬للَّهِ أَن نَّاخُذَ إِلَّا مَنْ وَّجَدْنَا مَتَٰعَنَا عِندَهُۥٓ إِنَّآ إِذاٗ لَّظَٰلِمُونَۖ","فَلَمَّا اَ۪سْتَيْـَٔسُواْ مِنْهُ خَلَصُواْ نَجِيّاٗۖ قَالَ كَبِيرُهُمُۥٓ أَلَمْ تَعْلَمُوٓاْ أَنَّ أَبَاكُمْ قَدَ اَخَذَ عَلَيْكُم مَّوْثِقاٗ مِّنَ اَ۬للَّهِۖ وَمِن قَبْلُ مَا فَرَّطْتُّمْ فِے يُوسُفَۖ فَلَنَ اَبْرَحَ اَ۬لَارْضَ حَتَّىٰ يَاذَنَ لِيَ أَبِيَ أَوْ يَحْكُمَ اَ۬للَّهُ لِےۖ وَهُوَ خَيْرُ اُ۬لْحَٰكِمِينَۖ","اَ۪رْجِعُوٓاْ إِلَىٰٓ أَبِيكُمْ فَقُولُواْ يَٰٓأَبَانَآ إِنَّ اَ۪بْنَكَ سَرَقَۖ وَمَا شَهِدْنَآ إِلَّا بِمَا عَلِمْنَا وَمَا كُنَّا لِلْغَيْبِ حَٰفِظِينَۖ","وَسْـَٔلِ اِ۬لْقَرْيَةَ اَ۬لتِے كُنَّا فِيهَا وَالْعِيرَ اَ۬لتِےٓ أَقْبَلْنَا فِيهَا وَإِنَّا لَصَٰدِقُونَۖ","قَالَ بَلْ سَوَّلَتْ لَكُمُۥٓ أَنفُسُكُمُۥٓ أَمْراٗۖ فَصَبْرٞ جَمِيلٌۖ عَسَى اَ۬للَّهُ أَنْ يَّاتِيَنِے بِهِمْ جَمِيعاًۖ اِنَّهُۥ هُوَ اَ۬لْعَلِيمُ اُ۬لْحَكِيمُۖ","وَتَوَلّ۪ىٰ عَنْهُمْ وَقَالَ يَٰٓأَسَف۪ىٰ عَلَىٰ يُوسُفَۖ وَابْيَضَّتْ عَيْنَٰهُ مِنَ اَ۬لْحُزْنِ فَهُوَ كَظِيمٞۖ","قَالُواْ تَاللَّهِ تَفْتَؤُاْ تَذْكُرُ يُوسُفَ حَتَّىٰ تَكُونَ حَرَضاً اَوْ تَكُونَ مِنَ اَ۬لْهَٰلِكِينَۖ","قَالَ إِنَّمَآ أَشْكُواْ بَثِّے وَحُزْنِيَ إِلَى اَ۬للَّهِۖ وَأَعْلَمُ مِنَ اَ۬للَّهِ مَا لَا تَعْلَمُونَۖ","يَٰبَنِيَّ اَ۪ذْهَبُواْ فَتَحَسَّسُواْ مِنْ يُّوسُفَ وَأَخِيهِ وَلَا تَاْيْـَٔسُواْ مِن رَّوْحِ اِ۬للَّهِۖ إِنَّهُۥ لَا يَاْيْـَٔسُ مِن رَّوْحِ اِ۬للَّهِ إِلَّا اَ۬لْقَوْمُ اُ۬لْكَٰفِرُونَۖ","۞ فَلَمَّا دَخَلُواْ عَلَيْهِ قَالُواْ يَٰٓأَيُّهَا اَ۬لْعَزِيزُ مَسَّنَا وَأَهْلَنَا اَ۬لضُّرُّ وَجِئْنَا بِبِضَٰعَةٖ مُّزْج۪يٰةٖۖ فَأَوْفِ لَنَا اَ۬لْكَيْلَ وَتَصَدَّقْ عَلَيْنَآۖ إِنَّ اَ۬للَّهَ يَجْزِے اِ۬لْمُتَصَدِّقِينَۖ","قَالَ هَلْ عَلِمْتُم مَّا فَعَلْتُم بِيُوسُفَ وَأَخِيهِ إِذَ اَنتُمْ جَٰهِلُونَۖ","قَالُوٓاْ أَ۟نَّكَ لَأَنتَ يُوسُفُۖ قَالَ أَنَا يُوسُفُ وَهَٰذَآ أَخِےۖ قَدْ مَنَّ اَ۬للَّهُ عَلَيْنَآۖ إِنَّهُۥ مَنْ يَّتَّقِ وَيَصْبِرْ فَإِنَّ اَ۬للَّهَ لَا يُضِيعُ أَجْرَ اَ۬لْمُحْسِنِينَۖ","قَالُواْ تَاللَّهِ لَقَدَ اٰثَرَكَ اَ۬للَّهُ عَلَيْنَا وَإِن كُنَّا لَخَٰطِـِٕينَۖ","قَالَ لَا تَثْرِيبَ عَلَيْكُمُۖ اُ۬لْيَوْمَ يَغْفِرُ اُ۬للَّهُ لَكُمْۖ وَهُوَ أَرْحَمُ اُ۬لرَّٰحِمِينَۖ","اَ۪ذْهَبُواْ بِقَمِيصِے هَٰذَا فَأَلْقُوهُ عَلَىٰ وَجْهِ أَبِے يَاتِ بَصِيراٗ وَاتُونِے بِأَهْلِكُمُۥٓ أَجْمَعِينَۖ","وَلَمَّا فَصَلَتِ اِ۬لْعِيرُ قَالَ أَبُوهُمُۥٓ إِنِّے لَأَجِدُ رِيحَ يُوسُفَ لَوْلَآ أَن تُفَنِّدُونِۖ","قَالُواْ تَاللَّهِ إِنَّكَ لَفِے ضَلَٰلِكَ اَ۬لْقَدِيمِۖ","فَلَمَّآ أَن جَآءَ اَ۬لْبَشِيرُ أَلْق۪يٰهُ عَلَىٰ وَجْهِهِۦ فَارْتَدَّ بَصِيراٗۖ قَالَ أَلَمَ اَقُل لَّكُمُۥٓ إِنِّيَ أَعْلَمُ مِنَ اَ۬للَّهِ مَا لَا تَعْلَمُونَۖ","قَالُواْ يَٰٓأَبَانَا اَ۪سْتَغْفِرْ لَنَا ذُنُوبَنَآ إِنَّا كُنَّا خَٰطِـِٕينَۖ","قَالَ سَوْفَ أَسْتَغْفِرُ لَكُمْ رَبِّيَۖ إِنَّهُۥ هُوَ اَ۬لْغَفُورُ اُ۬لرَّحِيمُۖ","فَلَمَّا دَخَلُواْ عَلَىٰ يُوسُفَ ءَاو۪ىٰٓ إِلَيْهِ أَبَوَيْهِ وَقَالَ اَ۟دْخُلُواْ مِصْرَ إِن شَآءَ اَ۬للَّهُ ءَامِنِينَۖ","وَرَفَعَ أَبَوَيْهِ عَلَى اَ۬لْعَرْشِ وَخَرُّواْ لَهُۥ سُجَّداٗۖ وَقَالَ يَٰٓأَبَتِ هَٰذَا تَاوِيلُ رُءْيٰ۪يَ مِن قَبْلُ قَدْ جَعَلَهَا رَبِّے حَقّاٗۖ وَقَدَ اَحْسَنَ بِيَ إِذَ اَخْرَجَنِے مِنَ اَ۬لسِّجْنِ وَجَآءَ بِكُم مِّنَ اَ۬لْبَدْوِ مِنۢ بَعْدِ أَن نَّزَغَ اَ۬لشَّيْطَٰنُ بَيْنِے وَبَيْنَ إِخْوَتِيَۖ إِنَّ رَبِّے لَطِيفٞ لِّمَا يَشَآءُۖ اِ۪نَّهُۥ هُوَ اَ۬لْعَلِيمُ اُ۬لْحَكِيمُۖ","۞ رَبِّ قَدَ اٰتَيْتَنِے مِنَ اَ۬لْمُلْكِ وَعَلَّمْتَنِے مِن تَاوِيلِ اِ۬لَاحَادِيثِۖ فَاطِرَ اَ۬لسَّمَٰوَٰتِ وَالَارْضِ أَنتَ وَلِيِّۦ فِے اِ۬لدُّنْي۪ا وَالَاخِرَةِ تَوَفَّنِے مُسْلِماٗ وَأَلْحِقْنِے بِالصَّٰلِحِينَۖ","ذَٰلِكَ مِنَ اَنۢبَآءِ اِ۬لْغَيْبِ نُوحِيهِ إِلَيْكَۖ وَمَا كُنتَ لَدَيْهِمُۥٓ إِذَ اَجْمَعُوٓاْ أَمْرَهُمْ وَهُمْ يَمْكُرُونَۖ","وَمَآ أَكْثَرُ اُ۬لنَّاسِ وَلَوْ حَرَصْتَ بِمُومِنِينَۖ","وَمَا تَسْـَٔلُهُمْ عَلَيْهِ مِنَ اَجْرٍۖ اِنْ هُوَ إِلَّا ذِكْرٞ لِّلْعَٰلَمِينَۖ","وَكَأَيِّن مِّنَ اٰيَةٖ فِے اِ۬لسَّمَٰوَٰتِ وَالَارْضِ يَمُرُّونَ عَلَيْهَا وَهُمْ عَنْهَا مُعْرِضُونَۖ","وَمَا يُومِنُ أَكْثَرُهُم بِاللَّهِ إِلَّا وَهُم مُّشْرِكُونَۖ","أَفَأَمِنُوٓاْ أَن تَاتِيَهُمْ غَٰشِيَةٞ مِّنْ عَذَابِ اِ۬للَّهِ أَوْ تَاتِيَهُمُ اُ۬لسَّاعَةُ بَغْتَةٗ وَهُمْ لَا يَشْعُرُونَۖ","قُلْ هَٰذِهِۦ سَبِيلِيَ أَدْعُوٓاْ إِلَى اَ۬للَّهِۖ عَلَىٰ بَصِيرَةٍ اَنَا وَمَنِ اِ۪تَّبَعَنِےۖ وَسُبْحَٰنَ اَ۬للَّهِۖ وَمَآ أَنَا مِنَ اَ۬لْمُشْرِكِينَۖ","وَمَآ أَرْسَلْنَا مِن قَبْلِكَ إِلَّا رِجَالاٗ يُوح۪ىٰٓ إِلَيْهِم مِّنَ اَهْلِ اِ۬لْقُر۪ىٰٓۖ أَفَلَمْ يَسِيرُواْ فِے اِ۬لَارْضِ فَيَنظُرُواْ كَيْفَ كَانَ عَٰقِبَةُ اُ۬لذِينَ مِن قَبْلِهِمْۖ وَلَدَارُ اُ۬لَاخِرَةِ خَيْرٞ لِّلذِينَ اَ۪تَّقَوَاْۖ اَفَلَا تَعْقِلُونَۖ","حَتَّىٰٓ إِذَا اَ۪سْتَيْـَٔسَ اَ۬لرُّسُلُ وَظَنُّوٓاْ أَنَّهُمْ قَدْ كُذِّبُواْ جَآءَهُمْ نَصْرُنَا فَنُۨجِے مَن نَّشَآءُۖ وَلَا يُرَدُّ بَأْسُنَا عَنِ اِ۬لْقَوْمِ اِ۬لْمُجْرِمِينَۖ","۞ لَقَدْ كَانَ فِے قَصَصِهِمْ عِبْرَةٞ لِّأُوْلِے اِ۬لَالْبَٰبِۖ مَا كَانَ حَدِيثاٗ يُفْتَر۪ىٰۖ وَلَٰكِن تَصْدِيقَ اَ۬لذِے بَيْنَ يَدَيْهِ وَتَفْصِيلَ كُلِّ شَےْءٖ وَهُدىٗ وَرَحْمَةٗ لِّقَوْمٖ يُومِنُونَۖ"]],["الرعد",["أَلَٓمِّٓر۪ۖ تِلْكَ ءَايَٰتُ اُ۬لْكِتَٰبِۖ وَالذِےٓ أُنزِلَ إِلَيْكَ مِن رَّبِّكَ اَ۬لْحَقُّۖ وَلَٰكِنَّ أَكْثَرَ اَ۬لنَّاسِ لَا يُومِنُونَۖ","اَ۬للَّهُ اُ۬لذِے رَفَعَ اَ۬لسَّمَٰوَٰتِ بِغَيْرِ عَمَدٖۖ تَرَوْنَهَاۖ ثُمَّ اَ۪سْتَو۪ىٰ عَلَى اَ۬لْعَرْشِۖ وَسَخَّرَ اَ۬لشَّمْسَ وَالْقَمَرَۖ كُلّٞ يَجْرِے لِأَجَلٖ مُّسَمّىٗۖ يُدَبِّرُ اُ۬لَامْرَۖ يُفَصِّلُ اُ۬لَايَٰتِ لَعَلَّكُم بِلِقَآءِ رَبِّكُمْ تُوقِنُونَۖ","وَهُوَ اَ۬لذِے مَدَّ اَ۬لَارْضَ وَجَعَلَ فِيهَا رَوَٰسِيَ وَأَنْهَٰراٗۖ وَمِن كُلِّ اِ۬لثَّمَرَٰتِ جَعَلَ فِيهَا زَوْجَيْنِ اِ۪ثْنَيْنِۖ يُغْشِے اِ۬ليْلَ اَ۬لنَّهَارَۖ إِنَّ فِے ذَٰلِكَ لَأٓيَٰتٖ لِّقَوْمٖ يَتَفَكَّرُونَۖ","وَفِے اِ۬لَارْضِ قِطَعٞ مُّتَجَٰوِرَٰتٞ وَجَنَّٰتٞ مِّنَ اَعْنَٰبٖ وَزَرْعٖ وَنَخِيلٖ صِنْوَانٖ وَغَيْرِ صِنْوَانٖ تُسْق۪ىٰ بِمَآءٖ وَٰحِدٖۖ وَنُفَضِّلُ بَعْضَهَا عَلَىٰ بَعْضٖ فِے اِ۬لُاكْلِۖ إِنَّ فِے ذَٰلِكَ لَأٓيَٰتٖ لِّقَوْمٖ يَعْقِلُونَۖ","۞ وَإِن تَعْجَبْ فَعَجَبٞ قَوْلُهُمُۥٓ أَ۟ذَا كُنَّا تُرَٰباً اِنَّا لَفِے خَلْقٖ جَدِيدٍۖ","ا۟وْلَٰٓئِكَ اَ۬لذِينَ كَفَرُواْ بِرَبِّهِمْۖ وَأُوْلَٰٓئِكَ اَ۬لَاغْلَٰلُ فِےٓ أَعْنَٰقِهِمْۖ وَأُوْلَٰٓئِكَ أَصْحَٰبُ اُ۬لنّ۪ارِ هُمْ فِيهَا خَٰلِدُونَۖ","وَيَسْتَعْجِلُونَكَ بِالسَّيِّئَةِ قَبْلَ اَ۬لْحَسَنَةِ وَقَدْ خَلَتْ مِن قَبْلِهِمُ اُ۬لْمَثُلَٰتُۖ وَإِنَّ رَبَّكَ لَذُو مَغْفِرَةٖ لِّلنَّاسِ عَلَىٰ ظُلْمِهِمْۖ وَإِنَّ رَبَّكَ لَشَدِيدُ اُ۬لْعِقَابِۖ","وَيَقُولُ اُ۬لذِينَ كَفَرُواْ لَوْلَآ أُنزِلَ عَلَيْهِ ءَايَةٞ مِّن رَّبِّهِۦٓۖ إِنَّمَآ أَنتَ مُنذِرٞۖ وَلِكُلِّ قَوْمٍ هَادٍۖ","اِ۬للَّهُ يَعْلَمُ مَا تَحْمِلُ كُلُّ أُنث۪ىٰ وَمَا تَغِيضُ اُ۬لَارْحَامُ وَمَا تَزْدَادُۖ وَكُلُّ شَےْءٍ عِندَهُۥ بِمِقْد۪ارٍۖ","عَٰلِمُ اُ۬لْغَيْبِ وَالشَّهَٰدَةِۖ اِ۬لْكَبِيرُ اُ۬لْمُتَعَالِۖ","سَوَآءٞ مِّنكُم مَّنَ اَسَرَّ اَ۬لْقَوْلَ وَمَن جَهَرَ بِهِۦ وَمَنْ هُوَ مُسْتَخْفِۢ بِاليْلِ وَسَارِبُۢ بِالنَّه۪ارِۖ","لَهُۥ مُعَقِّبَٰتٞ مِّنۢ بَيْنِ يَدَيْهِ وَمِنْ خَلْفِهِۦ يَحْفَظُونَهُۥ مِنَ اَمْرِ اِ۬للَّهِۖ إِنَّ اَ۬للَّهَ لَا يُغَيِّرُ مَا بِقَوْمٍ حَتَّىٰ يُغَيِّرُواْ مَا بِأَنفُسِهِمْۖ وَإِذَآ أَرَادَ اَ۬للَّهُ بِقَوْمٖ سُوٓءاٗ فَلَا مَرَدَّ لَهُۥۖ وَمَا لَهُم مِّن دُونِهِۦ مِنْ وَّالٍۖ","هُوَ اَ۬لذِے يُرِيكُمُ اُ۬لْبَرْقَ خَوْفاٗ وَطَمَعاٗ وَيُنشِۓُ اُ۬لسَّحَابَ اَ۬لثِّقَالَ","وَيُسَبِّحُ اُ۬لرَّعْدُ بِحَمْدِهِۦ وَالْمَلَٰٓئِكَةُ مِنْ خِيفَتِهِۦۖ وَيُرْسِلُ اُ۬لصَّوَٰعِقَ فَيُصِيبُ بِهَا مَنْ يَّشَآءُ وَهُمْ يُجَٰدِلُونَ فِے اِ۬للَّهِ وَهُوَ شَدِيدُ اُ۬لْمِحَالِۖ","۞ لَهُۥ دَعْوَةُ اُ۬لْحَقِّۖ وَالذِينَ يَدْعُونَ مِن دُونِهِۦ لَا يَسْتَجِيبُونَ لَهُم بِشَےْءٍ اِلَّا كَبَٰسِطِ كَفَّيْهِ إِلَى اَ۬لْمَآءِ لِيَبْلُغَ فَاهُ وَمَا هُوَ بِبَٰلِغِهِۦۖ وَمَا دُعَآءُ اُ۬لْكٰ۪فِرِينَ إِلَّا فِے ضَلَٰلٖۖ","وَلِلهِ يَسْجُدُ مَن فِے اِ۬لسَّمَٰوَٰتِ وَالَارْضِ طَوْعاٗ وَكَرْهاٗ وَظِلَٰلُهُم بِالْغُدُوِّ وَالَاصَالِۖ۩","قُلْ مَن رَّبُّ اُ۬لسَّمَٰوَٰتِ وَالَارْضِ قُلِ اِ۬للَّهُۖ قُلَ اَفَاتَّخَذتُّم مِّن دُونِهِۦٓ أَوْلِيَآءَ لَا يَمْلِكُونَ لِأَنفُسِهِمْ نَفْعاٗ وَلَا ضَرّاٗۖ قُلْ هَلْ يَسْتَوِے اِ۬لَاعْم۪ىٰ وَالْبَصِيرُۖ أَمْ هَلْ تَسْتَوِے اِ۬لظُّلُمَٰتُ وَالنُّورُۖ","أَمْ جَعَلُواْ لِلهِ شُرَكَآءَ خَلَقُواْ كَخَلْقِهِۦ فَتَشَٰبَهَ اَ۬لْخَلْقُ عَلَيْهِمْۖ قُلِ اِ۬للَّهُ خَٰلِقُ كُلِّ شَےْءٖۖ وَهُوَ اَ۬لْوَٰحِدُ اُ۬لْقَهَّٰرُۖ","أَنزَلَ مِنَ اَ۬لسَّمَآءِ مَآءٗ فَسَالَتَ اَوْدِيَةُۢ بِقَدَرِهَا فَاحْتَمَلَ اَ۬لسَّيْلُ زَبَداٗ رَّابِياٗۖ وَمِمَّا
