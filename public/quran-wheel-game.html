۬لْمَوْتِۖ فَأَوْل۪ىٰ لَهُمْۖ","طَاعَةٞ وَقَوْلٞ مَّعْرُوفٞۖ فَإِذَا عَزَمَ اَ۬لَامْرُ فَلَوْ صَدَقُواْ اُ۬للَّهَ لَكَانَ خَيْراٗ لَّهُمْۖ","فَهَلْ عَسِيتُمُۥٓ إِن تَوَلَّيْتُمُۥٓ أَن تُفْسِدُواْ فِے اِ۬لَارْضِ وَتُقَطِّعُوٓاْ أَرْحَامَكُمُۥٓۖ","أُوْلَٰٓئِكَ اَ۬لذِينَ لَعَنَهُمُ اُ۬للَّهُ فَأَصَمَّهُمْ وَأَعْم۪ىٰٓ أَبْصَٰرَهُمُۥٓۖ","أَفَلَا يَتَدَبَّرُونَ اَ۬لْقُرْءَانَ أَمْ عَلَىٰ قُلُوبٍ اَقْفَالُهَآۖ","إِنَّ اَ۬لذِينَ اَ۪رْتَدُّواْ عَلَىٰٓ أَدْبٰ۪رِهِم مِّنۢ بَعْدِ مَا تَبَيَّنَ لَهُمُ اُ۬لْهُدَى اَ۬لشَّيْطَٰنُ سَوَّلَ لَهُمْۖ وَأَمْل۪ىٰ لَهُمْۖ","ذَٰلِكَ بِأَنَّهُمْ قَالُواْ لِلذِينَ كَرِهُواْ مَا نَزَّلَ اَ۬للَّهُ سَنُطِيعُكُمْ فِے بَعْضِ اِ۬لَامْرِۖ وَاللَّهُ يَعْلَمُ أَسْرَارَهُمْۖ","فَكَيْفَ إِذَا تَوَفَّتْهُمُ اُ۬لْمَلَٰٓئِكَةُ يَضْرِبُونَ وُجُوهَهُمْ وَأَدْبَٰرَهُمْۖ","ذَٰلِكَ بِأَنَّهُمُ اُ۪تَّبَعُواْ مَآ أَسْخَطَ اَ۬للَّهَ وَكَرِهُواْ رِضْوَٰنَهُۥ فَأَحْبَطَ أَعْمَٰلَهُمُۥٓۖ","أَمْ حَسِبَ اَ۬لذِينَ فِے قُلُوبِهِم مَّرَضٌ اَن لَّنْ يُّخْرِجَ اَ۬للَّهُ أَضْغَٰنَهُمْۖ","وَلَوْ نَشَآءُ لَأَرَيْنَٰكَهُمْ فَلَعَرَفْتَهُم بِسِيمٰ۪هُمْۖ وَلَتَعْرِفَنَّهُمْ فِے لَحْنِ اِ۬لْقَوْلِۖ وَاللَّهُ يَعْلَمُ أَعْمَٰلَكُمْۖ","وَلَنَبْلُوَنَّكُمْ حَتَّىٰ نَعْلَمَ اَ۬لْمُجَٰهِدِينَ مِنكُمْ وَالصَّٰبِرِينَ وَنَبْلُوَاْ أَخْبَارَكُمُۥٓۖ","إِنَّ اَ۬لذِينَ كَفَرُواْ وَصَدُّواْ عَن سَبِيلِ اِ۬للَّهِ وَشَآقُّواْ اُ۬لرَّسُولَ مِنۢ بَعْدِ مَا تَبَيَّنَ لَهُمُ اُ۬لْهُد۪ىٰ لَنْ يَّضُرُّواْ اُ۬للَّهَ شَئْاٗۖ وَسَيُحْبِطُ أَعْمَٰلَهُمْۖ","۞ يَٰٓأَيُّهَا اَ۬لذِينَ ءَامَنُوٓاْ أَطِيعُواْ اُ۬للَّهَ وَأَطِيعُواْ اُ۬لرَّسُولَ وَلَا تُبْطِلُوٓاْ أَعْمَٰلَكُمُۥٓۖ","إِنَّ اَ۬لذِينَ كَفَرُواْ وَصَدُّواْ عَن سَبِيلِ اِ۬للَّهِ ثُمَّ مَاتُواْ وَهُمْ كُفَّارٞ فَلَنْ يَّغْفِرَ اَ۬للَّهُ لَهُمْۖ","فَلَا تَهِنُواْ وَتَدْعُوٓاْ إِلَى اَ۬لسَّلْمِ وَأَنتُمُ اُ۬لَاعْلَوْنَ وَاللَّهُ مَعَكُمْۖ وَلَنْ يَّتِرَكُمُۥٓ أَعْمَٰلَكُمُۥٓۖ","إِنَّمَا اَ۬لْحَيَوٰةُ اُ۬لدُّنْي۪ا لَعِبٞ وَلَهْوٞۖ وَإِن تُومِنُواْ وَتَتَّقُواْ يُوتِكُمُۥٓ أُجُورَكُمْ وَلَا يَسْـَٔلْكُمُۥٓ أَمْوَٰلَكُمُۥٓۖ","إِنْ يَّسْـَٔلْكُمُوهَا فَيُحْفِكُمْ تَبْخَلُواْ وَيُخْرِجَ اَضْغَٰنَكُمْۖ","هَآنتُمْ هَٰٓؤُلَآءِ تُدْعَوْنَ لِتُنفِقُواْ فِے سَبِيلِ اِ۬للَّهِ فَمِنكُم مَّنْ يَّبْخَلُۖ وَمَنْ يَّبْخَلْ فَإِنَّمَا يَبْخَلُ عَن نَّفْسِهِۦۖ وَاللَّهُ اُ۬لْغَنِيُّۖ وَأَنتُمُ اُ۬لْفُقَرَآءُۖ وَإِن تَتَوَلَّوْاْ يَسْتَبْدِلْ قَوْماً غَيْرَكُمْ ثُمَّ لَا يَكُونُوٓاْ أَمْثَٰلَكُمُۥٓۖ"]],["الفتح",["إِنَّا فَتَحْنَا لَكَ فَتْحاٗ مُّبِيناٗ","لِّيَغْفِرَ لَكَ اَ۬للَّهُ مَا تَقَدَّمَ مِن ذَنۢبِكَ وَمَا تَأَخَّرَ وَيُتِمَّ نِعْمَتَهُۥ عَلَيْكَ وَيَهْدِيَكَ صِرَٰطاٗ مُّسْتَقِيماٗ","وَيَنصُرَكَ اَ۬للَّهُ نَصْراً عَزِيزاًۖ","هُوَ اَ۬لذِےٓ أَنزَلَ اَ۬لسَّكِينَةَ فِے قُلُوبِ اِ۬لْمُومِنِينَ لِيَزْدَادُوٓاْ إِيمَٰناٗ مَّعَ إِيمَٰنِهِمْۖ وَلِلهِ جُنُودُ اُ۬لسَّمَٰوَٰتِ وَالَارْضِۖ وَكَانَ اَ۬للَّهُ عَلِيماً حَكِيماٗ","لِّيُدْخِلَ اَ۬لْمُومِنِينَ وَالْمُومِنَٰتِ جَنَّٰتٖ تَجْرِے مِن تَحْتِهَا اَ۬لَانْهَٰرُ خَٰلِدِينَ فِيهَا وَيُكَفِّرَ عَنْهُمْ سَيِّـَٔاتِهِمْ وَكَانَ ذَٰلِكَ عِندَ اَ۬للَّهِ فَوْزاً عَظِيماٗ","وَيُعَذِّبَ اَ۬لْمُنَٰفِقِينَ وَالْمُنَٰفِقَٰتِ وَالْمُشْرِكِينَ وَالْمُشْرِكَٰتِ اِ۬لظَّآنِّينَ بِاللَّهِ ظَنَّ اَ۬لسَّوْءِۖ عَلَيْهِمْ دَآئِرَةُ اُ۬لسَّوْءِۖ وَغَضِبَ اَ۬للَّهُ عَلَيْهِمْ وَلَعَنَهُمْ وَأَعَدَّ لَهُمْ جَهَنَّمَۖ وَسَآءَتْ مَصِيراٗۖ","وَلِلهِ جُنُودُ اُ۬لسَّمَٰوَٰتِ وَالَارْضِۖ وَكَانَ اَ۬للَّهُ عَزِيزاً حَكِيماًۖ","۞ اِنَّآ أَرْسَلْنَٰكَ شَٰهِداٗ وَمُبَشِّراٗ وَنَذِيراٗ","لِّتُومِنُواْ بِاللَّهِ وَرَسُولِهِۦ وَتُعَزِّرُوهُ وَتُوَقِّرُوهُ وَتُسَبِّحُوهُ بُكْرَةٗ وَأَصِيلاًۖ","اِنَّ اَ۬لذِينَ يُبَايِعُونَكَ إِنَّمَا يُبَايِعُونَ اَ۬للَّهَۖ يَدُ اُ۬للَّهِ فَوْقَ أَيْدِيهِمْۖ فَمَن نَّكَثَ فَإِنَّمَا يَنكُثُ عَلَىٰ نَفْسِهِۦۖ وَمَنَ اَوْف۪ىٰ بِمَا عَٰهَدَ عَلَيْهِ اِ۬للَّهَ فَسَنُوتِيهِ أَجْراً عَظِيماٗۖ","سَيَقُولُ لَكَ اَ۬لْمُخَلَّفُونَ مِنَ اَ۬لَاعْرَابِ شَغَلَتْنَآ أَمْوَٰلُنَا وَأَهْلُونَا فَاسْتَغْفِرْ لَنَاۖ يَقُولُونَ بِأَلْسِنَتِهِم مَّا لَيْسَ فِے قُلُوبِهِمْۖ قُلْ فَمَنْ يَّمْلِكُ لَكُم مِّنَ اَ۬للَّهِ شَئْاً اِنَ اَرَادَ بِكُمْ ضَرّاً اَوَ اَرَادَ بِكُمْ نَفْعاَۢۖ بَلْ كَانَ اَ۬للَّهُ بِمَا تَعْمَلُونَ خَبِيراَۢۖ","بَلْ ظَنَنتُمُۥٓ أَن لَّنْ يَّنقَلِبَ اَ۬لرَّسُولُ وَالْمُومِنُونَ إِلَىٰٓ أَهْلِيهِمُۥٓ أَبَداٗ وَزُيِّنَ ذَٰلِكَ فِے قُلُوبِكُمْ وَظَنَنتُمْ ظَنَّ اَ۬لسَّوْءِ وَكُنتُمْ قَوْماَۢ بُوراٗۖ","وَمَن لَّمْ يُومِنۢ بِاللَّهِ وَرَسُولِهِۦ فَإِنَّآ أَعْتَدْنَا لِلْكٰ۪فِرِينَ سَعِيراٗۖ","وَلِلهِ مُلْكُ اُ۬لسَّمَٰوَٰتِ وَالَارْضِۖ يَغْفِرُ لِمَنْ يَّشَآءُ وَيُعَذِّبُ مَنْ يَّشَآءُۖ وَكَانَ اَ۬للَّهُ غَفُوراٗ رَّحِيماٗۖ","سَيَقُولُ اُ۬لْمُخَلَّفُونَ إِذَا اَ۪نطَلَقْتُمُۥٓ إِلَىٰ مَغَانِمَ لِتَاخُذُوهَا ذَرُونَا نَتَّبِعْكُمْۖ يُرِيدُونَ أَنْ يُّبَدِّلُواْ كَلَٰمَ اَ۬للَّهِۖ قُل لَّن تَتَّبِعُونَاۖ كَذَٰلِكُمْ قَالَ اَ۬للَّهُ مِن قَبْلُۖ فَسَيَقُولُونَ بَلْ تَحْسُدُونَنَاۖ بَلْ كَانُواْ لَا يَفْقَهُونَ إِلَّا قَلِيلاٗۖ","قُل لِّلْمُخَلَّفِينَ مِنَ اَ۬لَاعْرَابِ سَتُدْعَوْنَ إِلَىٰ قَوْمٍ ا۟وْلِے بَأْسٖ شَدِيدٖ تُقَٰتِلُونَهُمُۥٓ أَوْ يُسْلِمُونَۖ فَإِن تُطِيعُواْ يُوتِكُمُ اُ۬للَّهُ أَجْراً حَسَناٗۖ وَإِن تَتَوَلَّوْاْ كَمَا تَوَلَّيْتُم مِّن قَبْلُ يُعَذِّبْكُمْ عَذَاباً اَلِيماٗۖ","لَّيْسَ عَلَى اَ۬لَاعْم۪ىٰ حَرَجٞ وَلَا عَلَى اَ۬لَاعْرَجِ حَرَجٞ وَلَا عَلَى اَ۬لْمَرِيضِ حَرَجٞۖ وَمَنْ يُّطِعِ اِ۬للَّهَ وَرَسُولَهُۥ نُدْخِلْهُ جَنَّٰتٖ تَجْرِے مِن تَحْتِهَا اَ۬لَانْهَٰرُۖ وَمَنْ يَّتَوَلَّ نُعَذِّبْهُ عَذَاباً اَلِيماٗۖ","۞ لَّقَدْ رَضِيَ اَ۬للَّهُ عَنِ اِ۬لْمُومِنِينَ إِذْ يُبَايِعُونَكَ تَحْتَ اَ۬لشَّجَرَةِ فَعَلِمَ مَا فِے قُلُوبِهِمْ فَأَنزَلَ اَ۬لسَّكِينَةَ عَلَيْهِمْ وَأَثَٰبَهُمْ فَتْحاٗ قَرِيباٗ","وَمَغَانِمَ كَثِيرَةٗ يَاخُذُونَهَاۖ وَكَانَ اَ۬للَّهُ عَزِيزاً حَكِيماٗۖ","وَعَدَكُمُ اُ۬للَّهُ مَغَانِمَ كَثِيرَةٗ تَاخُذُونَهَا فَعَجَّلَ لَكُمْ هَٰذِهِۦ وَكَفَّ أَيْدِيَ اَ۬لنَّاسِ عَنكُمْۖ وَلِتَكُونَ ءَايَةٗ لِّلْمُومِنِينَ وَيَهْدِيَكُمْ صِرَٰطاٗ مُّسْتَقِيماٗۖ","وَأُخْر۪ىٰ لَمْ تَقْدِرُواْ عَلَيْهَا قَدَ اَحَاطَ اَ۬للَّهُ بِهَاۖ وَكَانَ اَ۬للَّهُ عَلَىٰ كُلِّ شَےْءٖ قَدِيراٗۖ","وَلَوْ قَٰتَلَكُمُ اُ۬لذِينَ كَفَرُواْ لَوَلَّوُاْ اُ۬لَادْبَٰرَ ثُمَّ لَا يَجِدُونَ وَلِيّاٗ وَلَا نَصِيراٗۖ","سُنَّةَ اَ۬للَّهِ اِ۬لتِے قَدْ خَلَتْ مِن قَبْلُۖ وَلَن تَجِدَ لِسُنَّةِ اِ۬للَّهِ تَبْدِيلاٗۖ","وَهُوَ اَ۬لذِے كَفَّ أَيْدِيَهُمْ عَنكُمْ وَأَيْدِيَكُمْ عَنْهُم بِبَطْنِ مَكَّةَ مِنۢ بَعْدِ أَنَ اَظْفَرَكُمْ عَلَيْهِمْۖ وَكَانَ اَ۬للَّهُ بِمَا تَعْمَلُونَ بَصِيراًۖ","هُمُ اُ۬لذِينَ كَفَرُواْ وَصَدُّوكُمْ عَنِ اِ۬لْمَسْجِدِ اِ۬لْحَرَامِ وَالْهَدْيَ مَعْكُوفاً اَنْ يَّبْلُغَ مَحِلَّهُۥۖ وَلَوْلَا رِجَالٞ مُّومِنُونَ وَنِسَآءٞ مُّومِنَٰتٞ لَّمْ تَعْلَمُوهُمُۥٓ أَن تَطَـُٔوهُمْ فَتُصِيبَكُم مِّنْهُم مَّعَرَّةُۢ بِغَيْرِ عِلْمٖ لِّيُدْخِلَ اَ۬للَّهُ فِے رَحْمَتِهِۦ مَنْ يَّشَآءُۖ لَوْ تَزَيَّلُواْ لَعَذَّبْنَا اَ۬لذِينَ كَفَرُواْ مِنْهُمْ عَذَاباً اَلِيماًۖ","۞ اِذْ جَعَلَ اَ۬لذِينَ كَفَرُواْ فِے قُلُوبِهِمُ اُ۬لْحَمِيَّةَ حَمِيَّةَ اَ۬لْجَٰهِلِيَّةِۖ فَأَنزَلَ اَ۬للَّهُ سَكِينَتَهُۥ عَلَىٰ رَسُولِهِۦ وَعَلَى اَ۬لْمُومِنِينَ وَأَلْزَمَهُمْ كَلِمَةَ اَ۬لتَّقْو۪ىٰ وَكَانُوٓاْ أَحَقَّ بِهَا وَأَهْلَهَاۖ وَكَانَ اَ۬للَّهُ بِكُلِّ شَےْءٍ عَلِيماٗۖ","لَّقَدْ صَدَقَ اَ۬للَّهُ رَسُولَهُ اُ۬لرُّءْي۪ا بِالْحَقِّ لَتَدْخُلُنَّ اَ۬لْمَسْجِدَ اَ۬لْحَرَامَ إِن شَآءَ اَ۬للَّهُ ءَامِنِينَ مُحَلِّقِينَ رُءُوسَكُمْ وَمُقَصِّرِينَ لَا تَخَافُونَۖ فَعَلِمَ مَا لَمْ تَعْلَمُواْ فَجَعَلَ مِن دُونِ ذَٰلِكَ فَتْحاٗ قَرِيباًۖ","هُوَ اَ۬لذِےٓ أَرْسَلَ رَسُولَهُۥ بِالْهُد۪ىٰ وَدِينِ اِ۬لْحَقِّ لِيُظْهِرَهُۥ عَلَى اَ۬لدِّينِ كُلِّهِۦۖ وَكَف۪ىٰ بِاللَّهِ شَهِيداٗۖ","مُّحَمَّدٞ رَّسُولُ اُ۬للَّهِۖ وَالذِينَ مَعَهُۥٓ أَشِدَّآءُ عَلَى اَ۬لْكُفّ۪ارِ رُحَمَآءُ بَيْنَهُمْۖ تَر۪يٰهُمْ رُكَّعاٗ سُجَّداٗ يَبْتَغُونَ فَضْلاٗ مِّنَ اَ۬للَّهِ وَرِضْوَٰناٗۖ سِيم۪اهُمْ فِے وُجُوهِهِم مِّنَ اَثَرِ اِ۬لسُّجُودِۖ ذَٰلِكَ مَثَلُهُمْ فِے اِ۬لتَّوْر۪يٰةِۖ وَمَثَلُهُمْ فِے اِ۬لِانجِيلِ كَزَرْعٍ اَخْرَجَ شَطْـَٔهُۥ فَـَٔازَرَهُۥ فَاسْتَغْلَظَ فَاسْتَو۪ىٰ عَلَىٰ سُوقِهِۦ يُعْجِبُ اُ۬لزُّرَّاعَ لِيَغِيظَ بِهِمُ اُ۬لْكُفَّارَۖ وَعَدَ اَ۬للَّهُ اُ۬لذِينَ ءَامَنُواْ وَعَمِلُواْ اُ۬لصَّٰلِحَٰتِ مِنْهُم مَّغْفِرَةٗ وَأَجْراً عَظِيماٗۖ"]],["الحجرات",["يَٰٓأَيُّهَا اَ۬لذِينَ ءَامَنُواْ لَا تُقَدِّمُواْ بَيْنَ يَدَيِ اِ۬للَّهِ وَرَسُولِهِۦۖ وَاتَّقُواْ اُ۬للَّهَۖ إِنَّ اَ۬للَّهَ سَمِيعٌ عَلِيمٞۖ","يَٰٓأَيُّهَا اَ۬لذِينَ ءَامَنُواْ لَا تَرْفَعُوٓاْ أَصْوَٰتَكُمْ فَوْقَ صَوْتِ اِ۬لنَّبِےٓءِ وَلَا تَجْهَرُواْ لَهُۥ بِالْقَوْلِ كَجَهْرِ بَعْضِكُمْ لِبَعْضٍ اَن تَحْبَطَ أَعْمَٰلُكُمْ وَأَنتُمْ لَا تَشْعُرُونَۖ","إِنَّ اَ۬لذِينَ يَغُضُّونَ أَصْوَٰتَهُمْ عِندَ رَسُولِ اِ۬للَّهِ أُوْلَٰٓئِكَ اَ۬لذِينَ اَ۪مْتَحَنَ اَ۬للَّهُ قُلُوبَهُمْ لِلتَّقْو۪ىٰۖ لَهُم مَّغْفِرَةٞ وَأَجْرٌ عَظِيمٌۖ","اِنَّ اَ۬لذِينَ يُنَادُونَكَ مِنْ وَّرَآءِ اِ۬لْحُجُرَٰتِ أَكْثَرُهُمْ لَا يَعْقِلُونَۖ","وَلَوَ اَنَّهُمْ صَبَرُواْ حَتَّىٰ تَخْرُجَ إِلَيْهِمْ لَكَانَ خَيْراٗ لَّهُمْۖ وَاللَّهُ غَفُورٞ رَّحِيمٞۖ","يَٰٓأَيُّهَا اَ۬لذِينَ ءَامَنُوٓاْ إِن جَآءَكُمْ فَاسِقُۢ بِنَبَإٖ فَتَبَيَّنُوٓاْ أَن تُصِيبُواْ قَوْماَۢ بِجَهَٰلَةٖ فَتُصْبِحُواْ عَلَىٰ مَا فَعَلْتُمْ نَٰدِمِينَۖ","وَاعْلَمُوٓاْ أَنَّ فِيكُمْ رَسُولَ اَ۬للَّهِ لَوْ يُطِيعُكُمْ فِے كَثِيرٖ مِّنَ اَ۬لَامْرِ لَعَنِتُّمْۖ وَلَٰكِنَّ اَ۬للَّهَ حَبَّبَ إِلَيْكُمُ اُ۬لِايمَٰنَ وَزَيَّنَهُۥ فِے قُلُوبِكُمْ وَكَرَّهَ إِلَيْكُمُ اُ۬لْكُفْرَ وَالْفُسُوقَ وَالْعِصْيَانَۖ أُوْلَٰٓئِكَ هُمُ اُ۬لرَّٰشِدُونَ","فَضْلاٗ مِّنَ اَ۬للَّهِ وَنِعْمَةٗۖ وَاللَّهُ عَلِيمٌ حَكِيمٞۖ","۞ وَإِن طَآئِفَتَٰنِ مِنَ اَ۬لْمُومِنِينَ اَ۪قْتَتَلُواْ فَأَصْلِحُواْ بَيْنَهُمَاۖ فَإِنۢ بَغَتِ اِحْد۪يٰهُمَا عَلَى اَ۬لُاخْر۪ىٰ فَقَٰتِلُواْ اُ۬لتِے تَبْغِے حَتَّىٰ تَفِےٓءَ ا۪لَىٰٓ أَمْرِ اِ۬للَّهِۖ فَإِن فَآءَتْ فَأَصْلِحُواْ بَيْنَهُمَا بِالْعَدْلِ وَأَقْسِطُوٓاْۖ إِنَّ اَ۬للَّهَ يُحِبُّ اُ۬لْمُقْسِطِينَۖ","إِنَّمَا اَ۬لْمُومِنُونَ إِخْوَةٞ فَأَصْلِحُواْ بَيْنَ أَخَوَيْكُمْۖ وَاتَّقُواْ اُ۬للَّهَ لَعَلَّكُمْ تُرْحَمُونَۖ","يَٰٓأَيُّهَا اَ۬لذِينَ ءَامَنُواْ لَا يَسْخَرْ قَوْمٞ مِّن قَوْمٍ عَس۪ىٰٓ أَنْ يَّكُونُواْ خَيْراٗ مِّنْهُمْ وَلَا نِسَآءٞ مِّن نِّسَآءٍ عَس۪ىٰٓ أَنْ يَّكُنَّ خَيْراٗ مِّنْهُنَّۖ وَلَا تَلْمِزُوٓاْ أَنفُسَكُمْ وَلَا تَنَابَزُواْ بِالَالْقَٰبِۖ بِيسَ اَ۬لِاسْمُ اُ۬لْفُسُوقُ بَعْدَ اَ۬لِايمَٰنِۖ وَمَن لَّمْ يَتُبْ فَأُوْلَٰٓئِكَ هُمُ اُ۬لظَّٰلِمُونَۖ","يَٰٓأَيُّهَا اَ۬لذِينَ ءَامَنُواْ اُ۪جْتَنِبُواْ كَثِيراٗ مِّنَ اَ۬لظَّنِّۖ إِنَّ بَعْضَ اَ۬لظَّنِّ إِثْمٞۖ وَلَا تَجَسَّسُواْۖ وَلَا يَغْتَب بَّعْضُكُم بَعْضاًۖ اَيُحِبُّ أَحَدُكُمُۥٓ أَنْ يَّاكُلَ لَحْمَ أَخِيهِ مَيِّتاٗ فَكَرِهْتُمُوهُۖ وَاتَّقُواْ اُ۬للَّهَۖ إِنَّ اَ۬للَّهَ تَوَّابٞ رَّحِيمٞۖ","يَٰٓأَيُّهَا اَ۬لنَّاسُ إِنَّا خَلَقْنَٰكُم مِّن ذَكَرٖ وَأُنث۪ىٰ وَجَعَلْنَٰكُمْ شُعُوباٗ وَقَبَآئِلَ لِتَعَارَفُوٓاْۖ إِنَّ أَكْرَمَكُمْ عِندَ اَ۬للَّهِ أَتْق۪يٰكُمُۥٓۖ إِنَّ اَ۬للَّهَ عَلِيمٌ خَبِيرٞۖ","۞ قَالَتِ اِ۬لَاعْرَابُ ءَامَنَّا قُل لَّمْ تُومِنُواْ وَلَٰكِن قُولُوٓاْ أَسْلَمْنَا وَلَمَّا يَدْخُلِ اِ۬لِايمَٰنُ فِے قُلُوبِكُمْۖ وَإِن تُطِيعُواْ اُ۬للَّهَ وَرَسُولَهُۥ لَا يَلِتْكُم مِّنَ اَعْمَٰلِكُمْ شَئْاًۖ اِنَّ اَ۬للَّهَ غَفُورٞ رَّحِيمٌۖ","اِنَّمَا اَ۬لْمُومِنُونَ اَ۬لذِينَ ءَامَنُواْ بِاللَّهِ وَرَسُولِهِۦ ثُمَّ لَمْ يَرْتَابُواْ وَجَٰهَدُواْ بِأَمْوَٰلِهِمْ وَأَنفُسِهِمْ فِے سَبِيلِ اِ۬للَّهِۖ أُوْلَٰٓئِكَ هُمُ اُ۬لصَّٰدِقُونَۖ","قُلَ اَتُعَلِّمُونَ اَ۬للَّهَ بِدِينِكُمْ وَاللَّهُ يَعْلَمُ مَا فِے اِ۬لسَّمَٰوَٰتِ وَمَا فِے اِ۬لَارْضِۖ وَاللَّهُ بِكُلِّ شَےْءٍ عَلِيمٞۖ","يَمُنُّونَ عَلَيْكَ أَنَ اَسْلَمُواْۖ قُل لَّا تَمُنُّواْ عَلَيَّ إِسْلَٰمَكُمۖ بَلِ اِ۬للَّهُ يَمُنُّ عَلَيْكُمُۥٓ أَنْ هَد۪يٰكُمْ لِلِايمَٰنِ إِن كُنتُمْ صَٰدِقِينَۖ","إِنَّ اَ۬للَّهَ يَعْلَمُ غَيْبَ اَ۬لسَّمَٰوَٰتِ وَالَارْضِۖ وَاللَّهُ بَصِيرُۢ بِمَا تَعْمَلُونَۖ"]],["ق",["قَٓۖ وَالْقُرْءَانِ اِ۬لْمَجِيدِ","بَلْ عَجِبُوٓاْ أَن جَآءَهُم مُّنْذِرٞ مِّنْهُمْ فَقَالَ اَ۬لْكَٰفِرُونَ هَٰذَا شَےْءٌ عَجِيبٌ","اَ۟ذَا مِتْنَا وَكُنَّا تُرَاباٗ ذَٰلِكَ رَجْعُۢ بَعِيدٞۖ","قَدْ عَلِمْنَا مَا تَنقُصُ اُ۬لَارْضُ مِنْهُمْ وَعِندَنَا كِتَٰبٌ حَفِيظُۢۖ","بَلْ كَذَّبُواْ بِالْحَقِّ لَمَّا جَآءَهُمْ فَهُمْ فِےٓ أَمْرٖ مَّرِيجٍۖ","اَفَلَمْ يَنظُرُوٓاْ إِلَى اَ۬لسَّمَآءِ فَوْقَهُمْ كَيْفَ بَنَيْنَٰهَا وَزَيَّنَّٰهَا وَمَا لَهَا مِن فُرُوجٖۖ","وَالَارْضَ مَدَدْنَٰهَا وَأَلْقَيْنَا فِيهَا رَوَٰسِيَ وَأَنۢبَتْنَا فِيهَا مِن كُلِّ زَوْجِۢ بَهِيجٖ","تَبْصِرَةٗ وَذِكْر۪ىٰ لِكُلِّ عَبْدٖ مُّنِيبٖۖ","۞ وَنَزَّلْنَا مِنَ اَ۬لسَّمَآءِ مَآءٗ مُّبَٰرَكاٗ فَأَنۢبَتْنَا بِهِۦ جَنَّٰتٖ وَحَبَّ اَ۬لْحَصِيدِ","وَالنَّخْلَ بَاسِقَٰتٖ لَّهَا طَلْعٞ نَّضِيدٞ","رِّزْقاٗ لِّلْعِبَادِۖ وَأَحْيَيْنَا بِهِۦ بَلْدَةٗ مَّيْتاٗۖ كَذَٰلِكَ اَ۬لْخُرُوجُۖ","كَذَّبَتْ قَبْلَهُمْ قَوْمُ نُوحٖ وَأَصْحَٰبُ اُ۬لرَّسِّ وَثَمُودُ","وَعَادٞ وَفِرْعَوْنُ وَإِخْوَٰنُ لُوطٖ","وَأَصْحَٰبُ اُ۬لَايْكَةِ وَقَوْمُ تُبَّعٖۖ كُلّٞ كَذَّبَ اَ۬لرُّسُلَ فَحَقَّ وَعِيدِۦٓۖ","أَفَعَيِينَا بِالْخَلْقِ اِ۬لَاوَّلِۖ بَلْ هُمْ فِے لَبْسٖ مِّنْ خَلْقٖ جَدِيدٖۖ","وَلَقَدْ خَلَقْنَا اَ۬لِانسَٰنَ وَنَعْلَمُ مَا تُوَسْوِسُ بِهِۦ نَفْسُهُۥ وَنَحْنُ أَقْرَبُ إِلَيْهِ مِنْ حَبْلِ اِ۬لْوَرِيدِۖ","إِذْ يَتَلَقَّى اَ۬لْمُتَلَقِّيَٰنِ عَنِ اِ۬لْيَمِينِ وَعَنِ اِ۬لشِّمَالِ قَعِيدٞۖ","مَّا يَلْفِظُ مِن قَوْلٍ اِلَّا لَدَيْهِ رَقِيبٌ عَتِيدٞۖ","وَجَآءَتْ سَكْرَةُ اُ۬لْمَوْتِ بِالْحَقِّۖ ذَٰلِكَ مَا كُنتَ مِنْهُ تَحِيدُۖ","وَنُفِخَ فِے اِ۬لصُّورِۖ ذَٰلِكَ يَوْمُ اُ۬لْوَعِيدِۖ","وَجَآءَتْ كُلُّ نَفْسٖ مَّعَهَا سَآئِقٞ وَشَهِيدٞۖ","لَّقَدْ كُنتَ فِے غَفْلَةٖ مِّنْ هَٰذَا فَكَشَفْنَا عَنكَ غِطَآءَكَ فَبَصَرُكَ اَ۬لْيَوْمَ حَدِيدٞۖ","وَقَالَ قَرِينُهُۥ هَٰذَا مَا لَدَيَّ عَتِيدٌۖ","اَلْقِيَا فِے جَهَنَّمَ كُلَّ كَفّ۪ارٍ عَنِيدٖ","مَّنَّاعٖ لِّلْخَيْرِ مُعْتَدٖ مُّرِيبٍ","اِ۬لذِے جَعَلَ مَعَ اَ۬للَّهِ إِلَٰهاً اٰخَرَ فَأَلْقِيَٰهُ فِے اِ۬لْعَذَابِ اِ۬لشَّدِيدِۖ","۞ قَالَ قَرِينُهُۥ رَبَّنَا مَآ أَطْغَيْتُهُۥ وَلَٰكِن كَانَ فِے ضَلَٰلِۢ بَعِيدٖۖ","قَالَ لَا تَخْتَصِمُواْ لَدَيَّ وَقَدْ قَدَّمْتُ إِلَيْكُم بِالْوَعِيدِۖ","مَا يُبَدَّلُ اُ۬لْقَوْلُ لَدَيَّ وَمَآ أَنَا بِظَلَّٰمٖ لِّلْعَبِيدِۖ","يَوْمَ يَقُولُ لِجَهَنَّمَ هَلِ اِ۪مْتَلَأْتِ وَتَقُولُ هَلْ مِن مَّزِيدٖۖ","وَأُزْلِفَتِ اِ۬لْجَنَّةُ لِلْمُتَّقِينَ غَيْرَ بَعِيدٍۖ","هَٰذَا مَا تُوعَدُونَ لِكُلِّ أَوَّابٍ حَفِيظٖۖ","مَّنْ خَشِيَ اَ۬لرَّحْمَٰنَ بِالْغَيْبِ وَجَآءَ بِقَلْبٖ مُّنِيبٍ","اُ۟دْخُلُوهَا بِسَلَٰمٖۖ ذَٰلِكَ يَوْمُ اُ۬لْخُلُودِۖ","لَهُم مَّا يَشَآءُونَ فِيهَاۖ وَلَدَيْنَا مَزِيدٞۖ","وَكَمَ اَهْلَكْنَا قَبْلَهُم مِّن قَرْنٍ هُمُۥٓ أَشَدُّ مِنْهُم بَطْشاٗ فَنَقَّبُواْ فِے اِ۬لْبِلَٰدِۖ هَلْ مِن مَّحِيصٍۖ","اِنَّ فِے ذَٰلِكَ لَذِكْر۪ىٰ لِمَن كَانَ لَهُۥ قَلْبٌ اَوَ اَلْقَى اَ۬لسَّمْعَ وَهُوَ شَهِيدٞۖ","وَلَقَدْ خَلَقْنَا اَ۬لسَّمَٰوَٰتِ وَالَارْضَ وَمَا بَيْنَهُمَا فِے سِتَّةِ أَيَّامٖ وَمَا مَسَّنَا مِن لُّغُوبٖۖ","فَاصْبِرْ عَلَىٰ مَا يَقُولُونَۖ وَسَبِّحْ بِحَمْدِ رَبِّكَ قَبْلَ طُلُوعِ اِ۬لشَّمْسِ وَقَبْلَ اَ۬لْغُرُوبِۖ","وَمِنَ اَ۬ليْلِ فَسَبِّحْهُ وَإِدْبَٰرَ اَ۬لسُّجُودِۖ","وَاسْتَمِعْ يَوْمَ يُنَادِ اِ۬لْمُنَادِۦ مِن مَّكَانٖ قَرِيبٖ","يَوْمَ يَسْمَعُونَ اَ۬لصَّيْحَةَ بِالْحَقِّۖ ذَٰلِكَ يَوْمُ اُ۬لْخُرُوجِۖ","إِنَّا نَحْنُ نُحْيِۦ وَنُمِيتُ وَإِلَيْنَا اَ۬لْمَصِيرُۖ","يَوْمَ تَشَّقَّقُ اُ۬لَارْضُ عَنْهُمْ سِرَاعاٗۖ ذَٰلِكَ حَشْرٌ عَلَيْنَا يَسِيرٞۖ","نَّحْنُ أَعْلَمُ بِمَا يَقُولُونَۖ وَمَآ أَنتَ عَلَيْهِم بِجَبّ۪ارٖۖ فَذَكِّرْ بِالْقُرْءَانِ مَنْ يَّخَافُ وَعِيدِۦۖ"]],["الذاريات",["وَالذَّٰرِيَٰتِ ذَرْواٗ","فَالْحَٰمِلَٰتِ وِقْراٗ","فَالْجَٰرِيَٰتِ يُسْراٗ","فَالْمُقَسِّمَٰتِ أَمْراً","اِنَّمَا تُوعَدُونَ لَصَادِقٞ","وَإِنَّ اَ۬لدِّينَ لَوَٰقِعٞۖ","وَالسَّمَآءِ ذَاتِ اِ۬لْحُبُكِ","إِنَّكُمْ لَفِے قَوْلٖ مُّخْتَلِفٖ","يُوفَكُ عَنْهُ مَنُ ا۟فِكَۖ","قُتِلَ اَ۬لْخَرَّٰصُونَ","اَ۬لذِينَ هُمْ فِے غَمْرَةٖ سَاهُونَۖ","يَسْـَٔلُونَ أَيَّانَ يَوْمُ اُ۬لدِّينِ","يَوْمَ هُمْ عَلَى اَ۬لنّ۪ارِ يُفْتَنُونَۖ","ذُوقُواْ فِتْنَتَكُمْۖ هَٰذَا اَ۬لذِے كُنتُم بِهِۦ تَسْتَعْجِلُونَۖ","إِنَّ اَ۬لْمُتَّقِينَ فِے جَنَّٰتٖ وَعُيُونٍ","اٰخِذِينَ مَآ ءَات۪يٰهُمْ رَبُّهُمُۥٓۖ إِنَّهُمْ كَانُواْ قَبْلَ ذَٰلِكَ مُحْسِنِينَۖ","كَانُواْ قَلِيلاٗۖ مِّنَ اَ۬ليْلِ مَا يَهْجَعُونَۖ","وَبِالَاسْح۪ارِ هُمْ يَسْتَغْفِرُونَۖ","وَفِےٓ أَمْوَٰلِهِمْ حَقّٞ لِّلسَّآئِلِ وَالْمَحْرُومِۖ","وَفِے اِ۬لَارْضِ ءَايَٰتٞ لِّلْمُوقِنِينَۖ","وَفِےٓ أَنفُسِكُمُۥٓۖ أَفَلَا تُبْصِرُونَۖ","وَفِے اِ۬لسَّمَآءِ رِزْقُكُمْۖ وَمَا تُوعَدُونَ","فَوَرَبِّ اِ۬لسَّمَآءِ وَالَارْضِ إِنَّهُۥ لَحَقّٞ مِّثْلَ مَآ أَنَّكُمْ تَنطِقُونَۖ","هَلَ اَت۪يٰكَ حَدِيثُ ضَيْفِ إِبْرَٰهِيمَ اَ۬لْمُكْرَمِينَ","إِذْ دَخَلُواْ عَلَيْهِ فَقَالُواْ سَلَٰماٗۖ قَالَ سَلَٰمٞۖ قَوْمٞ مُّنكَرُونَۖ","فَرَاغَ إِلَىٰٓ أَهْلِهِۦ فَجَآءَ بِعِجْلٖ سَمِينٖ","فَقَرَّبَهُۥٓ إِلَيْهِمْ قَالَ أَلَا تَاكُلُونَۖ","فَأَوْجَسَ مِنْهُمْ خِيفَةٗۖ قَالُواْ لَا تَخَفْۖ وَبَشَّرُوهُ بِغُلَٰمٍ عَلِيمٖۖ","فَأَقْبَلَتِ اِ۪مْرَأَتُهُۥ فِے صَرَّةٖ فَصَكَّتْ وَجْهَهَا وَقَالَتْ عَجُوزٌ عَقِيمٞۖ","قَالُواْ كَذَٰلِكِ قَالَ رَبُّكِۖ إِنَّهُۥ هُوَ اَ۬لْحَكِيمُ اُ۬لْعَلِيمُۖ","۞ قَالَ فَمَا خَطْبُكُمُۥٓ أَيُّهَا اَ۬لْمُرْسَلُونَۖ","قَالُوٓاْ إِنَّآ أُرْسِلْنَآ إِلَىٰ قَوْمٖ مُّجْرِمِينَ","لِنُرْسِلَ عَلَيْهِمْ حِجَارَةٗ مِّن طِينٖ","مُّسَوَّمَةً عِندَ رَبِّكَ لِلْمُسْرِفِينَۖ","فَأَخْرَجْنَا مَن كَانَ فِيهَا مِنَ اَ۬لْمُومِنِينَ","فَمَا وَجَدْنَا فِيهَا غَيْرَ بَيْتٖ مِّنَ اَ۬لْمُسْلِمِينَ","وَتَرَكْنَا فِيهَآ ءَايَةٗ لِّلذِينَ يَخَافُونَ اَ۬لْعَذَابَ اَ۬لَالِيمَۖ","وَفِے مُوس۪ىٰٓ إِذَ اَرْسَلْنَٰهُ إِلَىٰ فِرْعَوْنَ بِسُلْطَٰنٖ مُّبِينٖ","فَتَوَلّ۪ىٰ بِرُكْنِهِۦ وَقَالَ سَٰحِرٌ اَوْ مَجْنُونٞۖ","فَأَخَذْنَٰهُ وَجُنُودَهُۥ فَنَبَذْنَٰهُمْ فِے اِ۬لْيَمِّ وَهُوَ مُلِيمٞۖ","وَفِے عَادٍ اِذَ اَرْسَلْنَا عَلَيْهِمُ اُ۬لرِّيحَ اَ۬لْعَقِيمَ","مَا تَذَرُ مِن شَےْءٍ اَتَتْ عَلَيْهِ إِلَّا جَعَلَتْهُ كَالرَّمِيمِۖ","وَفِے ثَمُودَ إِذْ قِيلَ لَهُمْ تَمَتَّعُواْ حَتَّىٰ حِينٖ","فَعَتَوْاْ عَنَ اَمْرِ رَبِّهِمْ فَأَخَذَتْهُمُ اُ۬لصَّٰعِقَةُ وَهُمْ يَنظُرُونَۖ","فَمَا اَ۪سْتَطَٰعُواْ مِن قِيَامٖ وَمَا كَانُواْ مُنتَصِرِينَۖ","وَقَوْمَ نُوحٖ مِّن قَبْلُۖ إِنَّهُمْ كَانُواْ قَوْماٗ فَٰسِقِينَۖ","وَالسَّمَآءَ بَنَيْنَٰهَا بِأَيَيْدٖۖ وَإِنَّا لَمُوسِعُونَۖ","وَالَارْضَ فَرَشْنَٰهَاۖ فَنِعْمَ اَ۬لْمَٰهِدُونَۖ","وَمِن كُلِّ شَےْءٍ خَلَقْنَا زَوْجَيْنِ لَعَلَّكُمْ تَذَّكَّرُونَۖ","فَفِرُّوٓاْ إِلَى اَ۬للَّهِ إِنِّے لَكُم مِّنْهُ نَذِيرٞ مُّبِينٞۖ","وَلَا تَجْعَلُواْ مَعَ اَ۬للَّهِ إِلَٰهاً اٰخَرَ إِنِّے لَكُم مِّنْهُ نَذِيرٞ مُّبِينٞۖ","كَذَٰلِكَۖ مَآ أَتَى اَ۬لذِينَ مِن قَبْلِهِم مِّن رَّسُولٍ اِلَّا قَالُواْ سَاحِرٌ اَوْ مَجْنُونٌۖ","اَتَوَاصَوْاْ بِهِۦۖ بَلْ هُمْ قَوْمٞ طَاغُونَۖ","فَتَوَلَّ عَنْهُمْ فَمَآ أَنتَ بِمَلُومٖ","وَذَكِّرْۖ فَإِنَّ اَ۬لذِّكْر۪ىٰ تَنفَعُ اُ۬لْمُومِنِينَۖ","۞ وَمَا خَلَقْتُ اُ۬لْجِنَّ وَالِانسَ إِلَّا لِيَعْبُدُونِۖ","مَآ أُرِيدُ مِنْهُم مِّن رِّزْقٖ وَمَآ أُرِيدُ أَنْ يُّطْعِمُونِۖ","إِنَّ اَ۬للَّهَ هُوَ اَ۬لرَّزَّاقُ ذُو اُ۬لْقُوَّةِ اِ۬لْمَتِينُۖ","فَإِنَّ لِلذِينَ ظَلَمُواْ ذَنُوباٗ مِّثْلَ ذَنُوبِ أَصْحَٰبِهِمْ فَلَا يَسْتَعْجِلُونِۖ","فَوَيْلٞ لِّلذِينَ كَفَرُواْ مِنْ يَّوْمِهِمُ اُ۬لذِے يُوعَدُونَۖ"]],["الطور",["وَالطُّورِ وَكِتَٰبٖ مَّسْطُورٖ","فِے رَقّٖ مَّنشُورٖ","وَالْبَيْتِ اِ۬لْمَعْمُورِ","وَالسَّقْفِ اِ۬لْمَرْفُوعِ","وَالْبَحْرِ اِ۬لْمَسْجُورِ","إِنَّ عَذَابَ رَبِّكَ لَوَٰقِعٞۖ","مَّا لَهُۥ مِن دَافِعٖۖ","يَوْمَ تَمُورُ اُ۬لسَّمَآءُ مَوْراٗ","وَتَسِيرُ اُ۬لْجِبَالُ سَيْراٗۖ","فَوَيْلٞ يَوْمَئِذٖ لِّلْمُكَذِّبِينَ","اَ۬لذِينَ هُمْ فِے خَوْضٖ يَلْعَبُونَۖ","يَوْمَ يُدَعُّونَ إِلَىٰ ن۪ارِ جَهَنَّمَ دَعّاًۖ هَٰذِهِ اِ۬لنَّارُ اُ۬لتِے كُنتُم بِهَا تُكَذِّبُونَۖ","أَفَسِحْرٌ هَٰذَآ أَمَ اَنتُمْ لَا تُبْصِرُونَۖ","اَ۪صْلَوْهَا فَاصْبِرُوٓاْ أَوْ لَا تَصْبِرُواْ سَوَآءٌ عَلَيْكُمُۥٓۖ إِنَّمَا تُجْزَوْنَ مَا كُنتُمْ تَعْمَلُونَۖ","إِنَّ اَ۬لْمُتَّقِينَ فِے جَنَّٰتٖ وَنَعِيمٖ","فَٰكِهِينَ بِمَآ ءَات۪يٰهُمْ رَبُّهُمْۖ وَوَق۪يٰهُمْ رَبُّهُمْ عَذَابَ اَ۬لْجَحِيمِۖ","كُلُواْ وَاشْرَبُواْ هَنِيٓـٔاَۢ بِمَا كُنتُمْ تَعْمَلُونَ","مُتَّكِـِٕينَ عَلَىٰ سُرُرٖ مَّصْفُوفَةٖ وَزَوَّجْنَٰهُم بِحُورٍ عِينٖۖ","وَالذِينَ ءَامَنُواْ وَاتَّبَعَتْهُمْ ذُرِّيَّتُهُم بِإِيمَٰنٍ اَلْحَقْنَا بِهِمْ ذُرِّيَّٰتِهِمْ وَمَآ أَلَتْنَٰهُم مِّنْ عَمَلِهِم مِّن شَےْءٖۖ كُلُّ اُ۪مْرِےِٕۢ بِمَا كَسَبَ رَهِينٞۖ","وَأَمْدَدْنَٰهُم بِفَٰكِهَةٖ وَلَحْمٖ مِّمَّا يَشْتَهُونَ","يَتَنَٰزَعُونَ فِيهَا كَأْساٗ لَّا لَغْوٞ فِيهَا وَلَا تَاثِيمٞۖ","۞ وَيَطُوفُ عَلَيْهِمْ غِلْمَانٞ لَّهُمْ كَأَنَّهُمْ لُؤْلُؤٞ مَّكْنُونٞۖ","وَأَقْبَلَ بَعْضُهُمْ عَلَىٰ بَعْضٖ يَتَسَآءَلُونَۖ","قَالُوٓاْ إِنَّا كُنَّا قَبْلُ فِےٓ أَهْلِنَا مُشْفِقِينَ","فَمَنَّ اَ۬للَّهُ عَلَيْنَا وَوَق۪يٰنَا عَذَابَ اَ۬لسَّمُومِۖ","إِنَّا كُنَّا مِن قَبْلُ نَدْعُوهُ أَنَّهُۥ هُوَ اَ۬لْبَرُّ اُ۬لرَّحِيمُۖ","فَذَكِّرْ فَمَآ أَنتَ بِنِعْمَتِ رَبِّكَ بِكَاهِنٖ وَلَا مَجْنُونٍۖ","اَمْ يَقُولُونَ شَاعِرٞ نَّتَرَبَّصُ بِهِۦ رَيْبَ اَ۬لْمَنُونِۖ","قُلْ تَرَبَّصُواْۖ فَإِنِّے مَعَكُم مِّنَ اَ۬لْمُتَرَبِّصِينَۖ","أَمْ تَامُرُهُمُۥٓ أَحْلَٰمُهُم بِهَٰذَآ أَمْ هُمْ قَوْمٞ طَاغُونَۖ","أَمْ يَقُولُونَ تَقَوَّلَهُۥۖ بَل لَّا يُومِنُونَۖ","فَلْيَاتُواْ بِحَدِيثٖ مِّثْلِهِۦٓ إِن كَانُواْ صَٰدِقِينَۖ","أَمْ خُلِقُواْ مِنْ غَيْرِ شَےْءٍ اَمْ هُمُ اُ۬لْخَٰلِقُونَۖ","أَمْ خَلَقُواْ اُ۬لسَّمَٰوَٰتِ وَالَارْضَۖ بَل لَّا يُوقِنُونَۖ","أَمْ عِندَهُمْ خَزَآئِنُ رَبِّكَ أَمْ هُمُ اُ۬لْمُصَيْطِرُونَۖ","أَمْ لَهُمْ سُلَّمٞ يَسْتَمِعُونَ فِيهِۖ فَلْيَاتِ مُسْتَمِعُهُم بِسُلْطَٰنٖ مُّبِينٍۖ","اَمْ لَهُ اُ۬لْبَنَٰتُ وَلَكُمُ اُ۬لْبَنُونَۖ","أَمْ تَسْـَٔلُهُمُۥٓ أَجْراٗ فَهُم مِّن مَّغْرَمٖ مُّثْقَلُونَۖ","أَمْ عِندَهُمُ اُ۬لْغَيْبُ فَهُمْ يَكْتُبُونَۖ","أَمْ يُرِيدُونَ كَيْداٗۖ فَالذِينَ كَفَرُواْ هُمُ اُ۬لْمَكِيدُونَۖ","أَمْ لَهُمُۥٓ إِلَٰهٌ غَيْرُ اُ۬للَّهِۖ سُبْحَٰنَ اَ۬للَّهِ عَمَّا يُشْرِكُونَۖ","۞ وَإِنْ يَّرَوْاْ كِسْفاٗ مِّنَ اَ۬لسَّمَآءِ سَاقِطاٗ يَقُولُواْ سَحَابٞ مَّرْكُومٞۖ","فَذَرْهُمْ حَتَّىٰ يُلَٰقُواْ يَوْمَهُمُ اُ۬لذِے فِيهِ يَصْعَقُونَ","يَوْمَ لَا يُغْنِے عَنْهُمْ كَيْدُهُمْ شَئْاٗ وَلَا هُمْ يُنصَرُونَۖ","وَإِنَّ لِلذِينَ ظَلَمُواْ عَذَاباٗ دُونَ ذَٰلِكَۖ وَلَٰكِنَّ أَكْثَرَهُمْ لَا يَعْلَمُونَۖ","وَاصْبِرْ لِحُكْمِ رَبِّكَ فَإِنَّكَ بِأَعْيُنِنَاۖ وَسَبِّحْ بِحَمْدِ رَبِّكَ حِينَ تَقُومُۖ","وَمِنَ اَ۬ليْلِ فَسَبِّحْهُ وَإِدْبَٰرَ اَ۬لنُّجُومِۖ"]],["النجم",["وَالنَّجْمِ إِذَا هَو۪ىٰ","مَا ضَلَّ صَٰحِبُكُمْ وَمَا غَو۪ىٰ","وَمَا يَنطِقُ عَنِ اِ۬لْهَو۪ىٰٓ","إِنْ هُوَ إِلَّا وَحْيٞ يُوح۪ىٰۖ","عَلَّمَهُۥ شَدِيدُ اُ۬لْقُو۪ىٰ","ذُو مِرَّةٖۖ فَاسْتَو۪ىٰ","وَهُوَ بِالُافُقِ اِ۬لَاعْل۪ىٰۖ","ثُمَّ دَنَا فَتَدَلّ۪ىٰ","فَكَانَ قَابَ قَوْسَيْنِ أَوَ اَدْن۪ىٰۖ","فَأَوْح۪ىٰٓ إِلَىٰ عَبْدِهِۦ مَآ أَوْح۪ىٰۖ","مَا كَذَبَ اَ۬لْفُؤَادُ مَا ر۪أ۪ىٰٓۖ","أَفَتُمَٰرُونَهُۥ عَلَىٰ مَا يَر۪ىٰۖ","وَلَقَدْ ر۪ء۪اهُ نَزْلَةً ا۟خْر۪ىٰ","عِندَ سِدْرَةِ اِ۬لْمُنتَه۪ىٰ","عِندَهَا جَنَّةُ اُ۬لْمَأْو۪ىٰٓ","إِذْ يَغْشَى اَ۬لسِّدْرَةَ مَا يَغْش۪ىٰۖ","مَا زَاغَ اَ۬لْبَصَرُ وَمَا طَغ۪ىٰۖ","لَقَدْ ر۪أ۪ىٰ مِنَ اٰيَٰتِ رَبِّهِ اِ۬لْكُبْر۪ىٰٓۖ","أَفَرَٰٓيْتُمُ اُ۬للَّٰتَ وَالْعُزّ۪ىٰ","وَمَنَوٰةَ اَ۬لثَّالِثَةَ اَ۬لُاخْر۪ىٰٓ","أَلَكُمُ اُ۬لذَّكَرُ وَلَهُ اُ۬لُانث۪ىٰۖ","تِلْكَ إِذاٗ قِسْمَةٞ ضِيز۪ىٰٓۖ","إِنْ هِيَ إِلَّآ أَسْمَآءٞ سَمَّيْتُمُوهَآ أَنتُمْ وَءَابَآؤُكُم مَّآ أَنزَلَ اَ۬للَّهُ بِهَا مِن سُلْطَٰنٍۖ اِنْ يَّتَّبِعُونَ إِلَّا اَ۬لظَّنَّ وَمَا تَهْوَى اَ۬لَانفُسُۖ وَلَقَدْ جَآءَهُم مِّن رَّبِّهِمُ اُ۬لْهُد۪ىٰٓۖ","أَمْ لِلِانسَٰنِ مَا تَمَنّ۪ىٰۖ","فَلِلهِ اِ۬لَاخِرَةُ وَالُاول۪ىٰۖ","۞ وَكَم مِّن مَّلَكٖ فِے اِ۬لسَّمَٰوَٰتِ لَا تُغْنِے شَفَٰعَتُهُمْ شَئْاً اِلَّا مِنۢ بَعْدِ أَنْ يَّاذَنَ اَ۬للَّهُ لِمَنْ يَّشَآءُ وَيَرْض۪ىٰٓۖ","إِنَّ اَ۬لذِينَ لَا يُومِنُونَ بِالَاخِرَةِ لَيُسَمُّونَ اَ۬لْمَلَٰٓئِكَةَ تَسْمِيَةَ اَ۬لُانث۪ىٰۖ","وَمَا لَهُم بِهِۦ مِنْ عِلْمٍۖ اِنْ يَّتَّبِعُونَ إِلَّا اَ۬لظَّنَّۖ وَإِنَّ اَ۬لظَّنَّ لَا يُغْنِے مِنَ اَ۬لْحَقِّ شَئْاٗۖ فَأَعْرِضْ عَن مَّن تَوَلّ۪ىٰ عَن ذِكْرِنَا وَلَمْ يُرِدِ اِلَّا اَ۬لْحَيَوٰةَ اَ۬لدُّنْي۪اۖ","ذَٰلِكَ مَبْلَغُهُم مِّنَ اَ۬لْعِلْمِۖ إِنَّ رَبَّكَ هُوَ أَعْلَمُ بِمَن ضَلَّ عَن سَبِيلِهِۦۖ وَهُوَ أَعْلَمُ بِمَنِ اِ۪هْتَد۪ىٰۖ","وَلِلهِ مَا فِے اِ۬لسَّمَٰوَٰتِ وَمَا فِے اِ۬لَارْضِ لِيَجْزِيَ اَ۬لذِينَ أَسَٰٓـُٔواْ بِمَا عَمِلُواْ وَيَجْزِيَ اَ۬لذِينَ أَحْسَنُواْ بِالْحُسْنَىۖ","اَ۬لذِينَ يَجْتَنِبُونَ كَبَٰٓئِرَ اَ۬لِاثْمِ وَالْفَوَٰحِشَ إِلَّا اَ۬للَّمَمَۖ إِنَّ رَبَّكَ وَٰسِعُ اُ۬لْمَغْفِرَةِۖ هُوَ أَعْلَمُ بِكُمُۥٓ إِذَ اَنشَأَكُم مِّنَ اَ۬لَارْضِ وَإِذَ اَنتُمُۥٓ أَجِنَّةٞ فِے بُطُونِ أُمَّهَٰتِكُمْۖ فَلَا تُزَكُّوٓاْ أَنفُسَكُمْۖ هُوَ أَعْلَمُ بِمَنِ اِ۪تَّق۪ىٰٓۖ","أَفَرَٰٓيْتَ اَ۬لذِے تَوَلّ۪ىٰ","وَأَعْط۪ىٰ قَلِيلاٗ وَأَكْد۪ىٰٓ","أَعِندَهُۥ عِلْمُ اُ۬لْغَيْبِ فَهُوَ يَر۪ىٰٓۖ","أَمْ لَمْ يُنَبَّأْ بِمَا فِے صُحُفِ مُوس۪ىٰ","وَإِبْرَٰهِيمَ اَ۬لذِے وَفّ۪ىٰٓ","أَلَّا تَزِرُ وَازِرَةٞ وِزْرَ أُخْر۪ىٰۖ","وَأَن لَّيْسَ لِلِانسَٰنِ إِلَّا مَا سَع۪ىٰۖ","وَأَنَّ سَعْيَهُۥ سَوْفَ يُر۪ىٰۖ","ثُمَّ يُجْز۪يٰهُ اُ۬لْجَزَآءَ اَ۬لَاوْف۪ىٰۖ","وَأَنَّ إِلَىٰ رَبِّكَ اَ۬لْمُنتَه۪ىٰۖ","وَأَنَّهُۥ هُوَ أَضْحَكَ وَأَبْك۪ىٰۖ","وَأَنَّهُۥ هُوَ أَمَاتَ وَأَحْي۪اۖ","وَأَنَّهُۥ خَلَقَ اَ۬لزَّوْجَيْنِ اِ۬لذَّكَرَ وَالُانث۪ىٰ","مِن نُّطْفَةٍ اِذَا تُمْن۪ىٰۖ","۞ وَأَنَّ عَلَيْهِ اِ۬لنَّشْأَةَ اَ۬لُاخْر۪ىٰۖ","وَأَنَّهُۥ هُوَ أَغْن۪ىٰ وَأَقْن۪ىٰۖ","وَأَنَّهُۥ هُوَ رَبُّ اُ۬لشِّعْر۪ىٰۖ","وَأَنَّهُۥٓ أَهْلَكَ عَاداٗ اَ۬لُّاول۪ىٰ","وَثَمُوداٗ فَمَآ أَبْق۪ىٰ","وَقَوْمَ نُوحٖ مِّن قَبْلُۖ إِنَّهُمْ كَانُواْ هُمُۥٓ أَظْلَمَ وَأَطْغ۪ىٰۖ","وَالْمُوتَفِكَةَ أَهْو۪ىٰۖ","فَغَشّ۪يٰهَا مَا غَشّ۪ىٰۖ","فَبِأَيِّ ءَالَآءِ رَبِّكَ تَتَمَار۪ىٰۖ","هَٰذَا نَذِيرٞ مِّنَ اَ۬لنُّذُرِ اِ۬لُاول۪ىٰٓۖ","أَزِفَتِ اِ۬لَازِفَةُۖ","لَيْسَ لَهَا مِن دُونِ اِ۬للَّهِ كَاشِفَةٌۖ","اَفَمِنْ هَٰذَا اَ۬لْحَدِيثِ تَعْجَبُونَ","وَتَضْحَكُونَ وَلَا تَبْكُونَ","وَأَنتُمْ سَٰمِدُونَۖ","فَاسْجُدُواْ لِلهِ وَاعْبُدُواْۖ"]],["القمر",["اُ۪قْتَرَبَتِ اِ۬لسَّاعَةُ وَانشَقَّ اَ۬لْقَمَرُۖ","وَإِنْ يَّرَوَاْ اٰيَةٗ يُعْرِضُواْ وَيَقُولُواْ سِحْرٞ مُّسْتَمِرّٞۖ","وَكَذَّبُواْ وَاتَّبَعُوٓاْ أَهْوَآءَهُمْۖ وَكُلُّ أَمْرٖ مُّسْتَقِرّٞۖ","وَلَقَدْ جَآءَهُم مِّنَ اَ۬لَانۢبَآءِ مَا فِيهِ مُزْدَجَرٌۖ","حِكْمَةُۢ بَٰلِغَةٞۖ فَمَا تُغْنِ اِ۬لنُّذُرُۖ","فَتَوَلَّ عَنْهُمْۖ يَوْمَ يَدْعُ اُ۬لدَّاعِۦٓ إِلَىٰ شَےْءٖ نُّكُرٍ","خُشَّعاً اَبْصَٰرُهُمْ يَخْرُجُونَ مِنَ اَ۬لَاجْدَاثِ كَأَنَّهُمْ جَرَادٞ مُّنتَشِرٞ","مُّهْطِعِينَ إِلَى اَ۬لدَّاعِۦۖ يَقُولُ اُ۬لْكَٰفِرُونَ هَٰذَا يَوْمٌ عَسِرٞۖ","كَذَّبَتْ قَبْلَهُمْ قَوْمُ نُوحٖ فَكَذَّبُواْ عَبْدَنَا وَقَالُواْ مَجْنُونٞ وَازْدُجِرَۖ","۞ فَدَعَا رَبَّهُۥٓ أَنِّے مَغْلُوبٞ فَانتَصِرْۖ","فَفَتَحْنَآ أَبْوَٰبَ اَ۬لسَّمَآءِ بِمَآءٖ مُّنْهَمِرٖۖ","وَفَجَّرْنَا اَ۬لَارْضَ عُيُوناٗ فَالْتَقَى اَ۬لْمَآءُ عَلَىٰٓ أَمْرٖ قَدْ قُدِرَۖ","وَحَمَلْنَٰهُ عَلَىٰ ذَاتِ أَلْوَٰحٖ وَدُسُرٖۖ","تَجْرِے بِأَعْيُنِنَا جَزَآءٗ لِّمَن كَانَ كُفِرَۖ","وَلَقَد تَّرَكْنَٰهَآ ءَايَةٗ فَهَلْ مِن مُّدَّكِرٖۖ","فَكَيْفَ كَانَ عَذَابِے وَنُذُرِۦۖ","وَلَقَدْ يَسَّرْنَا اَ۬لْقُرْءَانَ لِلذِّكْرِ فَهَلْ مِن مُّدَّكِرٖۖ","كَذَّبَتْ عَادٞ فَكَيْفَ كَانَ عَذَابِے وَنُذُرِۦٓۖ","إِنَّآ أَرْسَلْنَا عَلَيْهِمْ رِيحاٗ صَرْصَراٗ فِے يَوْمِ نَحْسٖ مُّسْتَمِرّٖ","تَنزِعُ اُ۬لنَّاسَ كَأَنَّهُمُۥٓ أَعْجَازُ نَخْلٖ مُّنقَعِرٖۖ","فَكَيْفَ كَانَ عَذَابِے وَنُذُرِۦۖ","وَلَقَدْ يَسَّرْنَا اَ۬لْقُرْءَانَ لِلذِّكْرِ فَهَلْ مِن مُّدَّكِرٖۖ","كَذَّبَتْ ثَمُودُ بِالنُّذُرِۖ","فَقَالُوٓاْ أَبَشَراٗ مِّنَّا وَٰحِداٗ نَّتَّبِعُهُۥٓ إِنَّآ إِذاٗ لَّفِے ضَلَٰلٖ وَسُعُرٍ","اَ۟لْقِيَ اَ۬لذِّكْرُ عَلَيْهِ مِنۢ بَيْنِنَا بَلْ هُوَ كَذَّابٌ اَشِرٞۖ","سَيَعْلَمُونَ غَداٗ مَّنِ اِ۬لْكَذَّابُ اُ۬لَاشِرُۖ","إِنَّا مُرْسِلُواْ اُ۬لنَّاقَةِ فِتْنَةٗ لَّهُمْ فَارْتَقِبْهُمْ وَاصْطَبِرْۖ","وَنَبِّئْهُمُۥٓ أَنَّ اَ۬لْمَآءَ قِسْمَةُۢ بَيْنَهُمْۖ كُلُّ شِرْبٖ مُّحْتَضَرٞۖ","فَنَادَوْاْ صَٰحِبَهُمْ فَتَعَاط۪ىٰ فَعَقَرَۖ","فَكَيْفَ كَانَ عَذَابِے وَنُذُرِۦٓۖ","إِنَّآ أَرْسَلْنَا عَلَيْهِمْ صَيْحَةٗ وَٰحِدَةٗ فَكَانُواْ كَهَشِيمِ اِ۬لْمُحْتَظِرِۖ","وَلَقَدْ يَسَّرْنَا اَ۬لْقُرْءَانَ لِلذِّكْرِ فَهَلْ مِن مُّدَّكِرٖۖ","كَذَّبَتْ قَوْمُ لُوطِۢ بِالنُّذُرِۖ","إِنَّآ أَرْسَلْنَا عَلَيْهِمْ حَاصِباً اِلَّآ ءَالَ لُوطٖ نَّجَّيْنَٰهُم بِسَحَرٖۖ","نِّعْمَةٗ مِّنْ عِندِنَاۖ كَذَٰلِكَ نَجْزِے مَن شَكَرَۖ","وَلَقَدَ اَنذَرَهُم بَطْشَتَنَا فَتَمَارَوْاْ بِالنُّذُرِۖ","۞ وَلَقَدْ رَٰوَدُوهُ عَن ضَيْفِهِۦ فَطَمَسْنَآ أَعْيُنَهُمْ فَذُوقُواْ عَذَابِے وَنُذُرِۦۖ","وَلَقَدْ صَبَّحَهُم بُكْرَةً عَذَابٞ مُّسْتَقِرّٞۖ","فَذُوقُواْ عَذَابِے وَنُذُرِۦۖ","وَلَقَدْ يَسَّرْنَا اَ۬لْقُرْءَانَ لِلذِّكْرِ فَهَلْ مِن مُّدَّكِرٖۖ","وَلَقَدْ جَآءَ ا۟لَ فِرْعَوْنَ اَ۬لنُّذُرُۖ","كَذَّبُواْ بِـَٔايَٰتِنَا كُلِّهَا فَأَخَذْنَٰهُمُۥٓ أَخْذَ عَزِيزٖ مُّقْتَدِرٍۖ","اَكُفَّارُكُمْ خَيْرٞ مِّنُ ا۟وْلَٰٓئِكُمُۥٓ أَمْ لَكُم بَرَآءَةٞ فِے اِ۬لزُّبُرِۖ","أَمْ يَقُولُونَ نَحْنُ جَمِيعٞ مُّنتَصِرٞۖ","سَيُهْزَمُ اُ۬لْجَمْعُ وَيُوَلُّونَ اَ۬لدُّبُرَۖ","بَلِ اِ۬لسَّاعَةُ مَوْعِدُهُمْۖ وَالسَّاعَةُ أَدْه۪ىٰ وَأَمَرُّۖ","إِنَّ اَ۬لْمُجْرِمِينَ فِے ضَلَٰلٖ وَسُعُرٖ","يَوْمَ يُسْحَبُونَ فِے اِ۬لنّ۪ارِ عَلَىٰ وُجُوهِهِمْ ذُوقُواْ مَسَّ سَقَرَۖ","إِنَّا كُلَّ شَےْءٍ خَلَقْنَٰهُ بِقَدَرٖۖ","وَمَآ أَمْرُنَآ إِلَّا وَٰحِدَةٞ كَلَمْحِۢ بِالْبَصَرِۖ","وَلَقَدَ اَهْلَكْنَآ أَشْيَاعَكُمْ فَهَلْ مِن مُّدَّكِرٖۖ","وَكُلُّ شَےْءٖ فَعَلُوهُ فِے اِ۬لزُّبُرِۖ","وَكُلُّ صَغِيرٖ وَك  مِنَ اَ۬لْحَمِيمِ","فَشَٰرِبُونَ شُرْبَ اَ۬لْهِيمِۖ","هَٰذَا نُزُلُهُمْ يَوْمَ اَ۬لدِّينِۖ","نَحْنُ خَلَقْنَٰكُمْۖ فَلَوْلَا تُصَدِّقُونَۖ","أَفَرَٰٓيْتُم مَّا تُمْنُونَ","ءَآنتُمْ تَخْلُقُونَهُۥٓ أَمْ نَحْنُ اُ۬لْخَٰلِقُونَۖ","نَحْنُ قَدَّرْنَا بَيْنَكُمُ اُ۬لْمَوْتَ وَمَا نَحْنُ بِمَسْبُوقِينَ","عَلَىٰٓ أَن نُّبَدِّلَ أَمْثَٰلَكُمْ وَنُنشِئَكُمْ فِے مَا لَا تَعْلَمُونَۖ","وَلَقَدْ عَلِمْتُمُ اُ۬لنَّشْأَةَ اَ۬لُاول۪ىٰۖ فَلَوْلَا تَذَّكَّرُونَۖ","أَفَرَٰٓيْتُم مَّا تَحْرُثُونَ","ءَآنتُمْ تَزْرَعُونَهُۥٓ أَمْ نَحْنُ اُ۬لزَّٰرِعُونَۖ","لَوْ نَشَآءُ لَجَعَلْنَٰهُ حُطَٰماٗ فَظَلْتُمْ تَفَكَّهُونَ","إِنَّا لَمُغْرَمُونَ","بَلْ نَحْنُ مَحْرُومُونَۖ","أَفَرَٰٓيْتُمُ اُ۬لْمَآءَ اَ۬لذِے تَشْرَبُونَ","ءَآنتُمُۥٓ أَنزَلْتُمُوهُ مِنَ اَ۬لْمُزْنِ أَمْ نَحْنُ اُ۬لْمُنزِلُونَۖ","لَوْ نَشَآءُ جَعَلْنَٰهُ أُجَاجاٗۖ فَلَوْلَا تَشْكُرُونَۖ","أَفَرَٰٓيْتُمُ اُ۬لنَّارَ اَ۬لتِے تُورُونَ","ءَآنتُمُۥٓ أَنشَأْتُمْ شَجَرَتَهَآ أَمْ نَحْنُ اُ۬لْمُنشِـُٔونَۖ","نَحْنُ جَعَلْنَٰهَا تَذْكِرَةٗ وَمَتَٰعاٗ لِّلْمُقْوِينَۖ","فَسَبِّحْ بِاسْمِ رَبِّكَ اَ۬لْعَظِيمِۖ","۞ فَلَآ أُقْسِمُ بِمَوَٰقِعِ اِ۬لنُّجُومِ","وَإِنَّهُۥ لَقَسَمٞ لَّوْ تَعْلَمُونَ عَظِيمٌ","اِنَّهُۥ لَقُرْءَانٞ كَرِيمٞ","فِے كِتَٰبٖ مَّكْنُونٖ","لَّا يَمَسُّهُۥٓ إِلَّا اَ۬لْمُطَهَّرُونَۖ","تَنزِيلٞ مِّن رَّبِّ اِ۬لْعَٰلَمِينَۖ","أَفَبِهَٰذَا اَ۬لْحَدِيثِ أَنتُم مُّدْهِنُونَ","وَتَجْعَلُونَ رِزْقَكُمُۥٓ أَنَّكُمْ تُكَذِّبُونَۖ","فَلَوْلَآ إِذَا بَلَغَتِ اِ۬لْحُلْقُومَ","وَأَنتُمْ حِينَئِذٖ تَنظُرُونَ","وَنَحْنُ أَقْرَبُ إِلَيْهِ مِنكُمْ وَلَٰكِن لَّا تُبْصِرُونَ","فَلَوْلَآ إِن كُنتُمْ غَيْرَ مَدِينِينَ","تَرْجِعُونَهَآ إِن كُنتُمْ صَٰدِقِينَۖ","فَأَمَّآ إِن كَانَ مِنَ اَ۬لْمُقَرَّبِينَ","فَرَوْحٞ وَرَيْحَانٞ وَجَنَّتُ نَعِيمٖۖ","وَأَمَّآ إِن كَانَ مِنَ اَصْحَٰبِ اِ۬لْيَمِينِ","فَسَلَٰمٞ لَّكَ مِنَ اَصْحَٰبِ اِ۬لْيَمِينِۖ","وَأَمَّآ إِن كَانَ مِنَ اَ۬لْمُكَذِّبِينَ اَ۬لضَّآلِّينَ","فَنُزُلٞ مِّنْ حَمِيمٖ","وَتَصْلِيَةُ جَحِيمٍۖ","اِنَّ هَٰذَا لَهُوَ حَقُّ اُ۬لْيَقِينِۖ","فَسَبِّحْ بِاسْمِ رَبِّكَ اَ۬لْعَظِيمِۖ"]],["الحديد",["سَبَّحَ لِلهِ مَا فِے اِ۬لسَّمَٰوَٰتِ وَالَارْضِۖ وَهُوَ اَ۬لْعَزِيزُ اُ۬لْحَكِيمُۖ","لَهُۥ مُلْكُ اُ۬لسَّمَٰوَٰتِ وَالَارْضِ يُحْيِۦ وَيُمِيتُۖ وَهُوَ عَلَىٰ كُلِّ شَےْءٖ قَدِيرٌۖ","هُوَ اَ۬لَاوَّلُ وَالَاخِرُ وَالظَّٰهِرُ وَالْبَاطِنُۖ وَهُوَ بِكُلِّ شَےْءٍ عَلِيمٌۖ","هُوَ اَ۬لذِے خَلَقَ اَ۬لسَّمَٰوَٰتِ وَالَارْضَ فِے سِتَّةِ أَيَّامٖ ثُمَّ اَ۪سْتَو۪ىٰ عَلَى اَ۬لْعَرْشِۖ يَعْلَمُ مَا يَلِجُ فِے اِ۬لَارْضِ وَمَا يَخْرُجُ مِنْهَا وَمَا يَنزِلُ مِنَ اَ۬لسَّمَآءِ وَمَا يَعْرُجُ فِيهَاۖ وَهُوَ مَعَكُمُۥٓ أَيْنَ مَا كُنتُمْۖ وَاللَّهُ بِمَا تَعْمَلُونَ بَصِيرٞۖ","لَّهُۥ مُلْكُ اُ۬لسَّمَٰوَٰتِ وَالَارْضِۖ وَإِلَى اَ۬للَّهِ تُرْجَعُ اُ۬لُامُورُۖ","يُولِجُ اُ۬ليْلَ فِے اِ۬لنَّه۪ارِ وَيُولِجُ اُ۬لنَّهَارَ فِے اِ۬ليْلِۖ وَهُوَ عَلِيمُۢ بِذَاتِ اِ۬لصُّدُورِۖ","۞ ءَامِنُواْ بِاللَّهِ وَرَسُولِهِۦ وَأَنفِقُواْ مِمَّا جَعَلَكُم مُّسْتَخْلَفِينَ فِيهِۖ فَالذِينَ ءَامَنُواْ مِنكُمْ وَأَنفَقُواْ لَهُمُۥٓ أَجْرٞ كَبِيرٞۖ","وَمَا لَكُمْ لَا تُومِنُونَ بِاللَّهِ وَالرَّسُولُ يَدْعُوكُمْ لِتُومِنُواْ بِرَبِّكُمْ وَقَدَ اَخَذَ مِيثَٰقَكُمُۥٓ إِن كُنتُم مُّومِنِينَۖ","هُوَ اَ۬لذِے يُنَزِّلُ عَلَىٰ عَبْدِهِۦٓ ءَايَٰتِۢ بَيِّنَٰتٖ لِّيُخْرِجَكُم مِّنَ اَ۬لظُّلُمَٰتِ إِلَى اَ۬لنُّورِۖ وَإِنَّ اَ۬للَّهَ بِكُمْ لَرَءُوفٞ رَّحِيمٞۖ","وَمَا لَكُمُۥٓ أَلَّا تُنفِقُواْ فِے سَبِيلِ اِ۬للَّهِ وَلِلهِ مِيرَٰثُ اُ۬لسَّمَٰوَٰتِ وَالَارْضِۖ لَا يَسْتَوِے مِنكُم مَّنَ اَنفَقَ مِن قَبْلِ اِ۬لْفَتْحِ وَقَٰتَلَۖ أُوْلَٰٓئِكَ أَعْظَمُ دَرَجَةٗ مِّنَ اَ۬لذِينَ أَنفَقُواْ مِنۢ بَعْدُ وَقَٰتَلُواْۖ وَكُلّاٗ وَعَدَ اَ۬للَّهُ اُ۬لْحُسْن۪ىٰۖ وَاللَّهُ بِمَا تَعْمَلُونَ خَبِيرٞۖ","مَّن ذَا اَ۬لذِے يُقْرِضُ اُ۬للَّهَ قَرْضاً حَسَناٗ فَيُضَٰعِفُهُۥ لَهُۥ وَلَهُۥٓ أَجْرٞ كَرِيمٞۖ","يَوْمَ تَرَى اَ۬لْمُومِنِينَ وَالْمُومِنَٰتِ يَسْع۪ىٰ نُورُهُم بَيْنَ أَيْدِيهِمْ وَبِأَيْمَٰنِهِمۖ بُشْر۪يٰكُمُ اُ۬لْيَوْمَ جَنَّٰتٞ تَجْرِے مِن تَحْتِهَا اَ۬لَانْهَٰرُ خَٰلِدِينَ فِيهَاۖ ذَٰلِكَ هُوَ اَ۬لْفَوْزُ اُ۬لْعَظِيمُۖ","يَوْمَ يَقُولُ اُ۬لْمُنَٰفِقُونَ وَالْمُنَٰفِقَٰتُ لِلذِينَ ءَامَنُواْ اُ۟نظُرُونَا نَقْتَبِسْ مِن نُّورِكُمْ قِيلَ اَ۪رْجِعُواْ وَرَآءَكُمْ فَالْتَمِسُواْ نُوراٗۖ فَضُرِبَ بَيْنَهُم بِسُورٖ لَّهُۥ بَابُۢ بَاطِنُهُۥ فِيهِ اِ۬لرَّحْمَةُ وَظَٰهِرُهُۥ مِن قِبَلِهِ اِ۬لْعَذَابُۖ يُنَادُونَهُمُۥٓ أَلَمْ نَكُن مَّعَكُمْۖ قَالُواْ بَل۪ىٰ وَلَٰكِنَّكُمْ فَتَنتُمُۥٓ أَنفُسَكُمْ وَتَرَبَّصْتُمْ وَارْتَبْتُمْ وَغَرَّتْكُمُ اُ۬لَامَانِيُّ حَتَّىٰ جَآءَ امْرُ اُ۬للَّهِ وَغَرَّكُم بِاللَّهِ اِ۬لْغَرُورُۖ","فَالْيَوْمَ لَا يُوخَذُ مِنكُمْ فِدْيَةٞ وَلَا مِنَ اَ۬لذِينَ كَفَرُواْ مَأْو۪يٰكُمُ اُ۬لنَّارُ هِيَ مَوْل۪يٰكُمْۖ وَبِيسَ اَ۬لْمَصِيرُۖ","۞ أَلَمْ يَانِ لِلذِينَ ءَامَنُوٓاْ أَن تَخْشَعَ قُلُوبُهُمْ لِذِكْرِ اِ۬للَّهِ وَمَا نَزَلَ مِنَ اَ۬لْحَقِّۖ وَلَا يَكُونُواْ كَالذِينَ أُوتُواْ اُ۬لْكِتَٰبَ مِن قَبْلُ فَطَالَ عَلَيْهِمُ اُ۬لَامَدُ فَقَسَتْ قُلُوبُهُمْۖ وَكَثِيرٞ مِّنْهُمْ فَٰسِقُونَۖ","اَ۪عْلَمُوٓاْ أَنَّ اَ۬للَّهَ يُحْيِ اِ۬لَارْضَ بَعْدَ مَوْتِهَاۖ قَدْ بَيَّنَّا لَكُمُ اُ۬لَايَٰتِ لَعَلَّكُمْ تَعْقِلُونَۖ","إِنَّ اَ۬لْمُصَّدِّقِينَ وَالْمُصَّدِّقَٰتِ وَأَقْرَضُواْ اُ۬للَّهَ قَرْضاً حَسَناٗ يُضَٰعَفُ لَهُمْ وَلَهُمُۥٓ أَجْرٞ كَرِيمٞۖ","وَالذِينَ ءَامَنُواْ بِاللَّهِ وَرُسُلِهِۦٓ أُوْلَٰٓئِكَ هُمُ اُ۬لصِّدِّيقُونَۖ وَالشُّهَدَآءُ عِندَ رَبِّهِمْۖ لَهُمُۥٓ أَجْرُهُمْ وَنُورُهُمْۖ وَالذِينَ كَفَرُواْ وَكَذَّبُواْ بِـَٔايَٰتِنَآ أُوْلَٰٓئِكَ أَصْحَٰبُ اُ۬لْجَحِيمِۖ","اِ۪عْلَمُوٓاْ أَنَّمَا اَ۬لْحَيَوٰةُ اُ۬لدُّنْي۪ا لَعِبٞ وَلَهْوٞ وَزِينَةٞ وَتَفَاخُرُۢ بَيْنَكُمْ وَتَكَاثُرٞ فِے اِ۬لَامْوَٰلِ وَالَاوْلَٰدِ كَمَثَلِ غَيْثٍ اَعْجَبَ اَ۬لْكُفَّارَ نَبَاتُهُۥ ثُمَّ يَهِيجُ فَتَر۪يٰهُ مُصْفَرّاٗ ثُمَّ يَكُونُ حُطَٰماٗۖ وَفِے اِ۬لَاخِرَةِ عَذَابٞ شَدِيدٞ وَمَغْفِرَةٞ مِّنَ اَ۬للَّهِ وَرِضْوَٰنٞۖ وَمَا اَ۬لْحَيَوٰةُ اُ۬لدُّنْي۪آ إِلَّا مَتَٰعُ اُ۬لْغُرُورِۖ","سَابِقُوٓاْ إِلَىٰ مَغْفِرَةٖ مِّن رَّبِّكُمْ وَجَنَّةٍ عَرْضُهَا كَعَرْضِ اِ۬لسَّمَآءِ وَالَارْضِ أُعِدَّتْ لِلذِينَ ءَامَنُواْ بِاللَّهِ وَرُسُلِهِۦۖ ذَٰلِكَ فَضْلُ اُ۬للَّهِ يُوتِيهِ مَنْ يَّشَآءُۖ وَاللَّهُ ذُو اُ۬لْفَضْلِ اِ۬لْعَظِيمِۖ","۞ مَآ أَصَابَ مِن مُّصِيبَةٖ فِے اِ۬لَارْضِ وَلَا فِےٓ أَنفُسِكُمُۥٓ إِلَّا فِے كِتَٰبٖ مِّن قَبْلِ أَن نَّبْرَأَهَآۖ إِنَّ ذَٰلِكَ عَلَى اَ۬للَّهِ يَسِيرٞ","لِّكَيْلَا تَاسَوْاْ عَلَىٰ مَا فَاتَكُمْ وَلَا تَفْرَحُواْ بِمَآ ءَات۪يٰكُمْۖ وَاللَّهُ لَا يُحِبُّ كُلَّ مُخْتَالٖ فَخُورٍۖ","اِ۬لذِينَ يَبْخَلُونَ وَيَامُرُونَ اَ۬لنَّاسَ بِالْبُخْلِۖ وَمَنْ يَّتَوَلَّ فَإِنَّ اَ۬للَّهَ اَ۬لْغَنِيُّ اُ۬لْحَمِيدُۖ","لَقَدَ اَرْسَلْنَا رُسُلَنَا بِالْبَيِّنَٰتِ وَأَنزَلْنَا مَعَهُمُ اُ۬لْكِتَٰبَ وَالْمِيزَانَ لِيَقُومَ اَ۬لنَّاسُ بِالْقِسْطِۖ وَأَنزَلْنَا اَ۬لْحَدِيدَ فِيهِ بَأْسٞ شَدِيدٞ وَمَنَٰفِعُ لِلنَّاسِۖ وَلِيَعْلَمَ اَ۬للَّهُ مَنْ يَّنصُرُهُۥ وَرُسُلَهُۥ بِالْغَيْبِۖ إِنَّ اَ۬للَّهَ قَوِيٌّ عَزِيزٞۖ","وَلَقَدَ اَرْسَلْنَا نُوحاٗ وَإِبْرَٰهِيمَ وَجَعَلْنَا فِے ذُرِّيَّتِهِمَا اَ۬لنُّبُوٓءَةَ وَالْكِتَٰبَۖ فَمِنْهُم مُّهْتَدٖۖ وَكَثِيرٞ مِّنْهُمْ فَٰسِقُونَۖ","ثُمَّ قَفَّيْنَا عَلَىٰٓ ءَاثٰ۪رِهِم بِرُسُلِنَا وَقَفَّيْنَا بِعِيسَى اَ۪بْنِ مَرْيَمَ وَءَاتَيْنَٰهُ اُ۬لِانجِيلَۖ وَجَعَلْنَا فِے قُلُوبِ اِ۬لذِينَ اَ۪تَّبَعُوهُ رَأْفَةٗ وَرَحْمَةٗ وَرَهْبَانِيَّةً اِ۪بْتَدَعُوهَا مَا كَتَبْنَٰهَا عَلَيْهِمُۥٓ إِلَّا اَ۪بْتِغَآءَ رِضْوَٰنِ اِ۬للَّهِۖ فَمَا رَعَوْهَا حَقَّ رِعَايَتِهَاۖ فَـَٔاتَيْنَا اَ۬لذِينَ ءَامَنُواْ مِنْهُمُۥٓ أَجْرَهُمْۖ وَكَثِيرٞ مِّنْهُمْ فَٰسِقُونَۖ","يَٰٓأَيُّهَا اَ۬لذِينَ ءَامَنُواْ اُ۪تَّقُواْ اُ۬للَّهَ وَءَامِنُواْ بِرَسُولِهِۦ يُوتِكُمْ كِفْلَيْنِ مِن رَّحْمَتِهِۦ وَيَجْعَل لَّكُمْ نُوراٗ تَمْشُونَ بِهِۦ وَيَغْفِرْ لَكُمْۖ وَاللَّهُ غَفُورٞ رَّحِيمٞ","لِّيَ۬لَّا يَعْلَمَ أَهْلُ اُ۬لْكِتَٰبِ أَلَّا يَقْدِرُونَ عَلَىٰ شَےْءٖ مِّن فَضْلِ اِ۬للَّهِ وَأَنَّ اَ۬لْفَضْلَ بِيَدِ اِ۬للَّهِ يُوتِيهِ مَنْ يَّشَآءُۖ وَاللَّهُ ذُو اُ۬لْفَضْلِ اِ۬لْعَظِيمِۖ"]],["المجادلة",["قَدْ سَمِعَ اَ۬للَّهُ قَوْلَ اَ۬لتِے تُجَٰدِلُكَ فِے زَوْجِهَا وَتَشْتَكِےٓ إِلَى اَ۬للَّهِ وَاللَّهُ يَسْمَعُ تَحَاوُرَكُمَآۖ إِنَّ اَ۬للَّهَ سَمِيعُۢ بَصِيرٌۖ","اِ۬لذِينَ يَظَّهَّرُونَ مِنكُم مِّن نِّسَآئِهِم مَّا هُنَّ أُمَّهَٰتِهِمُۥٓۖ إِنُ ا۟مَّهَٰتُهُمُۥٓ إِلَّا اَ۬ل۪ےْ وَلَدْنَهُمْۖ وَإِنَّهُمْ لَيَقُولُونَ مُنكَراٗ مِّنَ اَ۬لْقَوْلِ وَزُوراٗۖ وَإِنَّ اَ۬للَّهَ لَعَفُوٌّ غَفُورٞۖ","وَالذِينَ يَظَّهَّرُونَ مِن نِّسَآئِهِمْ ثُمَّ يَعُودُونَ لِمَا قَالُواْ فَتَحْرِيرُ رَقَبَةٖ مِّن قَبْلِ أَنْ يَّتَمَآسَّاۖ ذَٰلِكُمْ تُوعَظُونَ بِهِۦۖ وَاللَّهُ بِمَا تَعْمَلُونَ خَبِيرٞۖ","فَمَن لَّمْ يَجِدْ فَصِيَامُ شَهْرَيْنِ مُتَتَابِعَيْنِ مِن قَبْلِ أَنْ يَّتَمَآسَّاۖ فَمَن لَّمْ يَسْتَطِعْ فَإِطْعَامُ سِتِّينَ مِسْكِيناٗۖ ذَٰلِكَ لِتُومِنُواْ بِاللَّهِ وَرَسُولِهِۦۖ وَتِلْكَ حُدُودُ اُ۬للَّهِۖ وَلِلْكٰ۪فِرِينَ عَذَابٌ اَلِيمٌۖ","اِنَّ اَ۬لذِينَ يُحَآدُّونَ اَ۬للَّهَ وَرَسُولَهُۥ كُبِتُواْ كَمَا كُبِتَ اَ۬لذِينَ مِن قَبْلِهِمْۖ وَقَدَ اَنزَلْنَآ ءَايَٰتِۢ بَيِّنَٰتٖۖ وَلِلْكٰ۪فِرِينَ عَذَابٞ مُّهِينٞۖ","يَوْمَ يَبْعَثُهُمُ اُ۬للَّهُ جَمِيعاٗ فَيُنَبِّئُهُم بِمَا عَمِلُوٓاْۖ أَحْص۪يٰهُ اُ۬للَّهُ وَنَسُوهُۖ وَاللَّهُ عَلَىٰ كُلِّ شَےْءٖ شَهِيدٌۖ","اَلَمْ تَرَ أَنَّ اَ۬للَّهَ يَعْلَمُ مَا فِے اِ۬لسَّمَٰوَٰتِ وَمَا فِے اِ۬لَارْضِۖ مَا يَكُونُ مِن نَّجْو۪ىٰ ثَلَٰثَةٍ اِلَّا هُوَ رَابِعُهُمْ وَلَا خَمْسَةٍ اِلَّا هُوَ سَادِسُهُمْ وَلَآ أَدْن۪ىٰ مِن ذَٰلِكَ وَلَآ أَكْثَرَ إِلَّا هُوَ مَعَهُمُۥٓ أَيْنَ مَا كَانُواْۖ ثُمَّ يُنَبِّئُهُم بِمَا عَمِلُواْ يَوْمَ اَ۬لْقِيَٰمَةِۖ إِنَّ اَ۬للَّهَ بِكُلِّ شَےْءٍ عَلِيمٌۖ","۞ اَلَمْ تَرَ إِلَى اَ۬لذِينَ نُهُواْ عَنِ اِ۬لنَّجْو۪ىٰ ثُمَّ يَعُودُونَ لِمَا نُهُواْ عَنْهُ وَيَتَنَٰجَوْنَ بِالِاثْمِ وَالْعُدْوَٰنِ وَمَعْصِيَتِ اِ۬لرَّسُولِۖ وَإِذَا جَآءُوكَ حَيَّوْكَ بِمَا لَمْ يُحَيِّكَ بِهِ اِ۬للَّهُ وَيَقُولُونَ فِےٓ أَنفُسِهِمْ لَوْلَا يُعَذِّبُنَا اَ۬للَّهُ بِمَا نَقُولُۖ حَسْبُهُمْ جَهَنَّمُۖ يَصْلَوْنَهَاۖ فَبِيسَ اَ۬لْمَصِيرُۖ","يَٰٓأَيُّهَا اَ۬لذِينَ ءَامَنُوٓاْ إِذَا تَنَٰجَيْتُمْ فَلَا تَتَنَٰجَوْاْ بِالِاثْمِ وَالْعُدْوَٰنِ وَمَعْصِيَتِ اِ۬لرَّسُولِۖ وَتَنَٰجَوْاْ بِالْبِرِّ وَالتَّقْو۪ىٰۖ وَاتَّقُواْ اُ۬للَّهَ اَ۬لذِےٓ إِلَيْهِ تُحْشَرُونَۖ","إِنَّمَا اَ۬لنَّجْو۪ىٰ مِنَ اَ۬لشَّيْطَٰنِ لِيُحْزِنَ اَ۬لذِينَ ءَامَنُواْ وَلَيْسَ بِضَآرِّهِمْ شَئْاً اِلَّا بِإِذْنِ اِ۬للَّهِۖ وعَلَى اَ۬للَّهِ فَلْيَتَوَكَّلِ اِ۬لْمُومِنُونَۖ","يَٰٓأَيُّهَا اَ۬لذِينَ ءَامَنُوٓاْ إِذَا قِيلَ لَكُمْ تَفَسَّحُواْ فِے اِ۬لْمَجْلِسِ فَافْسَحُواْ يَفْسَحِ اِ۬للَّهُ لَكُمْۖ وَإِذَا قِيلَ اَ۟نشُزُواْ فَانشُزُواْ يَرْفَعِ اِ۬للَّهُ اُ۬لذِينَ ءَامَنُواْ مِنكُمْ وَالذِينَ أُوتُواْ اُ۬لْعِلْمَ دَرَجَٰتٖۖ وَاللَّهُ بِمَا تَعْمَلُونَ خَبِيرٞۖ","يَٰٓأَيُّهَا اَ۬لذِينَ ءَامَنُوٓاْ إِذَا نَٰجَيْتُمُ اُ۬لرَّسُولَ فَقَدِّمُواْ بَيْنَ يَدَےْ نَجْو۪يٰكُمْ صَدَقَةٗۖ ذَٰلِكَ خَيْرٞ لَّكُمْ وَأَطْهَرُۖ فَإِن لَّمْ تَجِدُواْ فَإِنَّ اَ۬للَّهَ غَفُورٞ رَّحِيمٌۖ","آٰشْفَقْتُمُۥٓ أَن تُقَدِّمُواْ بَيْنَ يَدَےْ نَجْو۪يٰكُمْ صَدَقَٰتٖۖ فَإِذْ لَمْ تَفْعَلُواْ وَتَابَ اَ۬للَّهُ عَلَيْكُمْ فَأَقِيمُواْ اُ۬لصَّلَوٰةَ وَءَاتُواْ اُ۬لزَّكَوٰةَۖ وَأَطِيعُواْ اُ۬للَّهَ وَرَسُولَهُۥۖ وَاللَّهُ خَبِيرُۢ بِمَا تَعْمَلُونَۖ","۞ أَلَمْ تَرَ إِلَى اَ۬لذِينَ تَوَلَّوْاْ قَوْماً غَضِبَ اَ۬للَّهُ عَلَيْهِم مَّا هُم مِّنكُمْ وَلَا مِنْهُمْ وَيَحْلِفُونَ عَلَى اَ۬لْكَذِبِ وَهُمْ يَعْلَمُونَۖ","أَعَدَّ اَ۬للَّهُ لَهُمْ عَذَاباٗ شَدِيداًۖ اِنَّهُمْ سَآءَ مَا كَانُواْ يَعْمَلُونَۖ","اَ۪تَّخَذُوٓاْ أَيْمَٰنَهُمْ جُنَّةٗ فَصَدُّواْ عَن سَبِيلِ اِ۬للَّهِ فَلَهُمْ عَذَابٞ مُّهِينٞۖ","لَّن تُغْنِيَ عَنْهُمُۥٓ أَمْوَٰلُهُمْ وَلَآ أَوْلَٰدُهُم مِّنَ اَ۬للَّهِ شَئْاًۖ ا۟وْلَٰٓئِكَ أَصْحَٰبُ اُ۬لنّ۪ارِ هُمْ فِيهَا خَٰلِدُونَۖ","يَوْمَ يَبْعَثُهُمُ اُ۬للَّهُ جَمِيعاٗ فَيَحْلِفُونَ لَهُۥ كَمَا يَحْلِفُونَ لَكُمْ وَيَحْسِبُونَ أَنَّهُمْ عَلَىٰ شَےْءٍۖ اَلَآ إِنَّهُمْ هُمُ اُ۬لْكَٰذِبُونَۖ","اَ۪سْتَحْوَذَ عَلَيْهِمُ اُ۬لشَّيْطَٰنُ فَأَنس۪يٰهُمْ ذِكْرَ اَ۬للَّهِۖ أُوْلَٰٓئِكَ حِزْبُ اُ۬لشَّيْطَٰنِۖ أَلَآ إِنَّ حِزْبَ اَ۬لشَّيْطَٰنِ هُمُ اُ۬لْخَٰسِرُونَۖ","إِنَّ اَ۬لذِينَ يُحَآدُّونَ اَ۬للَّهَ وَرَسُولَهُۥٓ أُوْلَٰٓئِكَ فِے اِ۬لَاذَلِّينَۖ كَتَبَ اَ۬للَّهُ لَأَغْلِبَنَّ أَنَا وَرُسُلِيَۖ إِنَّ اَ۬للَّهَ قَوِيٌّ عَزِيزٞۖ","لَّا تَجِدُ قَوْماٗ يُومِنُونَ بِاللَّهِ وَالْيَوْمِ اِ۬لَاخِرِ يُوَآدُّونَ مَنْ حَآدَّ اَ۬للَّهَ وَرَسُولَهُۥ وَلَوْ كَانُوٓاْ ءَابَآءَهُمُۥٓ أَوَ اَبْنَآءَهُمُۥٓ أَوِ اِخْوَٰنَهُمُۥٓ أَوْ عَشِيرَتَهُمُۥٓۖ أُوْلَٰٓئِكَ كَتَبَ فِے قُلُوبِهِمُ اُ۬لِايمَٰنَ وَأَيَّدَهُم بِرُوحٖ مِّنْهُ وَيُدْخِلُهُمْ جَنَّٰتٖ تَجْرِے مِن تَحْتِهَا اَ۬لَانْهَٰرُ خَٰلِدِينَ فِيهَاۖ رَضِيَ اَ۬للَّهُ عَنْهُمْ وَرَضُواْ عَنْهُۖ أُوْلَٰٓئِكَ حِزْبُ اُ۬للَّهِۖ أَلَآ إِنَّ حِزْبَ اَ۬للَّهِ هُمُ اُ۬لْمُفْلِحُونَۖ"]],["الحشر",["سَبَّحَ لِلهِ مَا فِے اِ۬لسَّمَٰوَٰتِ وَمَا فِے اِ۬لَارْضِۖ وَهُوَ اَ۬لْعَزِيزُ اُ۬لْحَكِيمُۖ","هُوَ اَ۬لذِےٓ أَخْرَجَ اَ۬لذِينَ كَفَرُواْ مِنَ اَهْلِ اِ۬لْكِتَٰبِ مِن دِيٰ۪رِهِمْ لِأَوَّلِ اِ۬لْحَشْرِۖ مَا ظَنَنتُمُۥٓ أَنْ يَّخْرُجُواْۖ وَظَنُّوٓاْ أَنَّهُم مَّانِعَتُهُمْ حُصُونُهُم مِّنَ اَ۬للَّهِۖ فَأَت۪يٰهُمُ اُ۬للَّهُ مِنْ حَيْثُ لَمْ يَحْتَسِبُواْۖ ۞ وَقَذَفَ فِے قُلُوبِهِمُ اُ۬لرُّعْبَۖ يُخْرِبُونَ بُيُوتَهُم بِأَيْدِيهِمْ وَأَيْدِے اِ۬لْمُومِنِينَۖ فَاعْتَبِرُواْ يَٰٓأُوْلِے اِ۬لَابْصٰ۪رِۖ","وَلَوْلَآ أَن كَتَبَ اَ۬للَّهُ عَلَيْهِمُ اُ۬لْجَلَآءَ لَعَذَّبَهُمْ فِے اِ۬لدُّنْي۪اۖ وَلَهُمْ فِے اِ۬لَاخِرَةِ عَذَابُ اُ۬لنّ۪ارِۖ","ذَٰلِكَ بِأَنَّهُمْ شَآقُّواْ اُ۬للَّهَ وَرَسُولَهُۥۖ وَمَنْ يُّشَآقِّ اِ۬للَّهَ فَإِنَّ اَ۬للَّهَ شَدِيدُ اُ۬لْعِقَابِۖ","مَا قَطَعْتُم مِّن لِّينَةٍ اَوْ تَرَكْتُمُوهَا قَآئِمَةً عَلَىٰٓ أُصُولِهَا فَبِإِذْنِ اِ۬للَّهِ وَلِيُخْزِيَ اَ۬لْفَٰسِقِينَۖ","وَمَآ أَفَآءَ اَ۬للَّهُ عَلَىٰ رَسُولِهِۦ مِنْهُمْ فَمَآ أَوْجَفْتُمْ عَلَيْهِ مِنْ خَيْلٖ وَلَا رِكَابٖۖ وَلَٰكِنَّ اَ۬للَّهَ يُسَلِّطُ رُسُلَهُۥ عَلَىٰ مَنْ يَّشَآءُۖ وَاللَّهُ عَلَىٰ كُلِّ شَےْءٖ قَدِيرٞۖ","مَّآ أَفَآءَ اَ۬للَّهُ عَلَىٰ رَسُولِهِۦ مِنَ اَهْلِ اِ۬لْقُر۪ىٰ فَلِلهِ وَلِلرَّسُولِ وَلِذِے اِ۬لْقُرْب۪ىٰ وَالْيَتَٰم۪ىٰ وَالْمَسَٰكِينِ وَابْنِ اِ۬لسَّبِيلِ كَےْ لَا يَكُونَ دُولَةَۢ بَيْنَ اَ۬لَاغْنِيَآءِ مِنكُمْۖ وَمَآ ءَات۪يٰكُمُ اُ۬لرَّسُولُ فَخُذُوهُۖ وَمَا نَه۪يٰكُمْ عَنْهُ فَانتَهُواْۖ وَاتَّقُواْ اُ۬للَّهَۖ إِنَّ اَ۬للَّهَ شَدِيدُ اُ۬لْعِقَابِۖ","لِلْفُقَرَآءِ اِ۬لْمُهَٰجِرِينَ اَ۬لذِينَ أُخْرِجُواْ مِن دِيٰ۪رِهِمْ وَأَمْوَٰلِهِمْ يَبْتَغُونَ فَضْلاٗ مِّنَ اَ۬للَّهِ وَرِضْوَٰناٗ وَيَنصُرُونَ اَ۬للَّهَ وَرَسُولَهُۥٓۖ أُوْلَٰٓئِكَ هُمُ اُ۬لصَّٰدِقُونَۖ","وَالذِينَ تَبَوَّءُو اُ۬لدَّارَ وَالِايمَٰنَ مِن قَبْلِهِمْ يُحِبُّونَ مَنْ هَاجَرَ إِلَيْهِمْ وَلَا يَجِدُونَ فِے صُدُورِهِمْ حَاجَةٗ مِّمَّآ أُوتُواْ وَيُوثِرُونَ عَلَىٰٓ أَنفُسِهِمْ وَلَوْ كَانَ بِهِمْ خَصَاصَةٞۖ وَمَنْ يُّوقَ شُحَّ نَفْسِهِۦ فَأُوْلَٰٓئِكَ هُمُ اُ۬لْمُفْلِحُونَۖ","وَالذِينَ جَآءُو مِنۢ بَعْدِهِمْ يَقُولُونَ رَبَّنَا اَ۪غْفِرْ لَنَا وَلِإِخْوَٰنِنَا اَ۬لذِينَ سَبَقُونَا بِالِايمَٰنِ وَلَا تَجْعَلْ فِے قُلُوبِنَا غِلّاٗ لِّلذِينَ ءَامَنُواْۖ رَبَّنَآ إِنَّكَ رَءُوفٞ رَّحِيمٌۖ","۞ اَلَمْ تَرَ إِلَى اَ۬لذِينَ نَافَقُواْ يَقُولُونَ لِإِخْوَٰنِهِمُ اُ۬لذِينَ كَفَرُواْ مِنَ اَهْلِ اِ۬لْكِتَٰبِ لَئِنُ ا۟خْرِجْتُمْ لَنَخْرُجَنَّ مَعَكُمْ وَلَا نُطِيعُ فِيكُمُۥٓ أَحَداً اَبَداٗ وَإِن قُوتِلْتُمْ لَنَنصُرَنَّكُمْۖ وَاللَّهُ يَشْهَدُ إِنَّهُمْ لَكَٰذِبُونَۖ","لَئِنُ ا۟خْرِجُواْ لَا يَخْرُجُونَ مَعَهُمْۖ وَلَئِن قُوتِلُواْ لَا يَنصُرُونَهُمْۖ وَلَئِن نَّصَرُوهُمْ لَيُوَلُّنَّ اَ۬لَادْبَٰرَ ثُمَّ لَا يُنصَرُونَۖ","لَأَنتُمُۥٓ أَشَدُّ رَهْبَةٗ فِے صُدُورِهِم مِّنَ اَ۬للَّهِۖ ذَٰلِكَ بِأَنَّهُمْ قَوْمٞ لَّا يَفْقَهُونَۖ","لَا يُقَٰتِلُونَكُمْ جَمِيعاً اِلَّا فِے قُرىٗ مُّحَصَّنَةٍ اَوْ مِنْ وَّرَآءِ جُدُرِۢۖ بَأْسُهُم بَيْنَهُمْ شَدِيدٞۖ تَحْسِبُهُمْ جَمِيعاٗ وَقُلُوبُهُمْ شَتّ۪ىٰۖ ذَٰلِكَ بِأَنَّهُمْ قَوْمٞ لَّا يَعْقِلُونَۖ","كَمَثَلِ اِ۬لذِينَ مِن قَبْلِهِمْ قَرِيباٗۖ ذَاقُواْ وَبَالَ أَمْرِهِمْۖ وَلَهُمْ عَذَابٌ اَلِيمٞۖ","كَمَثَلِ اِ۬لشَّيْطَٰنِ إِذْ قَالَ لِلِانسَٰنِ اِ۟كْفُرْ فَلَمَّا كَفَرَ قَالَ إِنِّے بَرِےٓءٞ مِّنكَ إِنِّيَ أَخَافُ اُ۬للَّهَ رَبَّ اَ۬لْعَٰلَمِينَۖ","فَكَانَ عَٰقِبَتَهُمَآ أَنَّهُمَا فِے اِ۬لنّ۪ارِ خَالِدَيْنِ فِيهَاۖ وَذَٰلِكَ جَزَٰٓؤُاْ اُ۬لظَّٰلِمِينَۖ","يَٰٓأَيُّهَا اَ۬لذِينَ ءَامَنُواْ اُ۪تَّقُواْ اُ۬للَّهَ وَلْتَنظُرْ نَفْسٞ مَّا قَدَّمَتْ لِغَدٖۖ وَاتَّقُواْ اُ۬للَّهَۖ إِنَّ اَ۬للَّهَ خَبِيرُۢ بِمَا تَعْمَلُونَۖ","وَلَا تَكُونُواْ كَالذِينَ نَسُواْ اُ۬للَّهَ فَأَنس۪يٰهُمُۥٓ أَنفُسَهُمُۥٓۖ أُوْلَٰٓئِكَ هُمُ اُ۬لْفَٰسِقُونَۖ","لَا يَسْتَوِےٓ أَصْحَٰبُ اُ۬لنّ۪ارِ وَأَصْحَٰبُ اُ۬لْجَنَّةِۖ أَصْحَٰبُ اُ۬لْجَنَّةِ هُمُ اُ۬لْفَآئِزُونَۖ","لَوَ اَنزَلْنَا هَٰذَا اَ۬لْقُرْءَانَ عَلَىٰ جَبَلٖ لَّرَأَيْتَهُۥ خَٰشِعاٗ مُّتَصَدِّعاٗ مِّنْ خَشْيَةِ اِ۬للَّهِۖ وَتِلْكَ اَ۬لَامْثَٰلُ نَضْرِبُهَا لِلنَّاسِ لَعَلَّهُمْ يَتَفَكَّرُونَۖ","هُوَ اَ۬للَّهُ اُ۬لذِے لَآ إِلَٰهَ إِلَّا هُوَۖ عَٰلِمُ اُ۬لْغَيْبِ وَالشَّهَٰدَةِۖ هُوَ اَ۬لرَّحْمَٰنُ اُ۬لرَّحِيمُۖ","هُوَ اَ۬للَّهُ اُ۬لذِے لَآ إِلَٰهَ إِلَّا هُوَ اَ۬لْمَلِكُ اُ۬لْقُدُّوسُ اُ۬لسَّلَٰمُ اُ۬لْمُومِنُ اُ۬لْمُهَيْمِنُ اُ۬لْعَزِيزُ اُ۬لْجَبَّارُ اُ۬لْمُتَكَبِّرُۖ سُبْحَٰنَ اَ۬للَّهِ عَمَّا يُشْرِكُونَۖ","هُوَ اَ۬للَّهُ اُ۬لْخَٰلِقُ اُ۬لْبَارِۓُ اُ۬لْمُصَوِّرُۖ لَهُ اُ۬لَاسْمَآءُ اُ۬لْحُسْن۪ىٰۖ يُسَبِّحُ لَهُۥ مَا فِے اِ۬لسَّمَٰوَٰتِ وَالَارْضِۖ وَهُوَ اَ۬لْعَزِيزُ اُ۬لْحَكِيمُۖ"]],["الممتحنة",["يَٰٓأَيُّهَا اَ۬لذِينَ ءَامَنُواْ لَا تَتَّخِذُواْ عَدُوِّے وَعَدُوَّكُمُۥٓ أَوْلِيَآءَۖ تُلْقُونَ إِلَيْهِم بِالْمَوَدَّةِ وَقَدْ كَفَرُواْ بِمَا جَآءَكُم مِّنَ اَ۬لْحَقِّۖ يُخْرِجُونَ اَ۬لرَّسُولَ وَإِيَّاكُمُۥٓ أَن تُومِنُواْ بِاللَّهِ رَبِّكُمُۥٓۖ إِن كُنتُمْ خَرَجْتُمْ جِهَٰداٗ فِے سَبِيلِے وَابْتِغَآءَ مَرْضَاتِے تُسِرُّونَ إِلَيْهِم بِالْمَوَدَّةِ وَأَنَآ أَعْلَمُ بِمَآ أَخْفَيْتُمْ وَمَآ أَعْلَنتُمْۖ وَمَنْ يَّفْعَلْهُ مِنكُمْ فَقَد ضَّلَّ سَوَآءَ اَ۬لسَّبِيلِۖ","إِنْ يَّثْقَفُوكُمْ يَكُونُواْ لَكُمُۥٓ أَعْدَآءٗ وَيَبْسُطُوٓاْ إِلَيْكُمُۥٓ أَيْدِيَهُمْ وَأَلْسِنَتَهُم بِالسُّوٓءِۖ وَوَدُّواْ لَوْ تَكْفُرُونَۖ","لَن تَنفَعَكُمُۥٓ أَرْحَامُكُمْ وَلَآ أَوْلَٰدُكُمْۖ يَوْمَ اَ۬لْقِيَٰمَةِ يُفْصَلُ بَيْنَكُمْۖ وَاللَّهُ بِمَا تَعْمَلُونَ بَصِيرٞۖ","قَدْ كَانَتْ لَكُمُۥٓ إِسْوَةٌ حَسَنَةٞ فِےٓ إِبْرَٰهِيمَ وَالذِينَ مَعَهُۥٓ إِذْ قَالُواْ لِقَوْمِهِمُۥٓ إِنَّا بُرَءَٰٓؤُاْ مِنكُمْ وَمِمَّا تَعْبُدُونَ مِن دُونِ اِ۬للَّهِ كَفَرْنَا بِكُمْ وَبَدَا بَيْنَنَا وَبَيْنَكُمُ اُ۬لْعَدَٰوَةُ وَالْبَغْضَآءُ اَ۬بَداً حَتَّىٰ تُومِنُواْ بِاللَّهِ وَحْدَهُۥٓ إِلَّا قَوْلَ إِبْرَٰهِيمَ لِأَبِيهِ لَأَسْتَغْفِرَنَّ لَكَ وَمَآ أَمْلِكُ لَكَ مِنَ اَ۬للَّهِ مِن شَےْءٖۖ رَّبَّنَا عَلَيْكَ تَوَكَّلْنَا وَإِلَيْكَ أَنَبْنَا وَإِلَيْكَ اَ۬لْمَصِيرُۖ","رَبَّنَا لَا تَجْعَلْنَا فِتْنَةٗ لِّلذِينَ كَفَرُواْۖ وَاغْفِرْ لَنَا رَبَّنَآۖ إِنَّكَ أَنتَ اَ۬لْعَزِيزُ اُ۬لْحَكِيمُۖ","لَقَدْ كَانَ لَكُمْ فِيهِمُۥٓ إِسْوَةٌ حَسَنَةٞ لِّمَن كَانَ يَرْجُواْ اُ۬للَّهَ وَالْيَوْمَ اَ۬لَاخِرَۖ وَمَنْ يَّتَوَلَّ فَإِنَّ اَ۬للَّهَ هُوَ اَ۬لْغَنِيُّ اُ۬لْحَمِيدُۖ","۞ عَسَى اَ۬للَّهُ أَنْ يَّجْعَلَ بَيْنَكُمْ وَبَيْنَ اَ۬لذِينَ عَادَيْتُم مِّنْهُم مَّوَدَّةٗۖ وَاللَّهُ قَدِيرٞۖ وَاللَّهُ غَفُورٞ رَّحِيمٞۖ","لَّا يَنْه۪يٰكُمُ اُ۬للَّهُ عَنِ اِ۬لذِينَ لَمْ يُقَٰتِلُوكُمْ فِے اِ۬لدِّينِ وَلَمْ يُخْرِجُوكُم مِّن دِيٰ۪رِكُمُۥٓ أَن تَبَرُّوهُمْ وَتُقْسِطُوٓاْ إِلَيْهِمُۥٓۖ إِنَّ اَ۬للَّهَ يُحِبُّ اُ۬لْمُقْسِطِينَۖ","إِنَّمَا يَنْه۪يٰكُمُ اُ۬للَّهُ عَنِ اِ۬لذِينَ قَٰتَلُوكُمْ فِے اِ۬لدِّينِ وَأَخْرَجُوكُم مِّن دِيٰ۪رِكُمْ وَظَٰهَرُواْ عَلَىٰٓ إِخْرَاجِكُمُۥٓ أَن تَوَلَّوْهُمْۖ وَمَنْ يَّتَوَلَّهُمْ فَأُوْلَٰٓئِكَ هُمُ اُ۬لظَّٰلِمُونَۖ","يَٰٓأَيُّهَا اَ۬لذِينَ ءَامَنُوٓاْ إِذَا جَآءَكُمُ اُ۬لْمُومِنَٰتُ مُهَٰجِرَٰتٖ فَامْتَحِنُوهُنَّۖ اَ۬للَّهُ أَعْلَمُ بِإِيمَٰنِهِنَّۖ فَإِنْ عَلِمْتُمُوهُنَّ مُومِنَٰتٖ فَلَا تَرْجِعُوهُنَّ إِلَى اَ۬لْكُفّ۪ارِۖ لَا هُنَّ حِلّٞ لَّهُمْ وَلَا هُمْ يَحِلُّونَ لَهُنَّۖ وَءَاتُوهُم مَّآ أَنفَقُواْۖ وَلَا جُنَاحَ عَلَيْكُمُۥٓ أَن تَنكِحُوهُنَّ إِذَآ ءَاتَيْتُمُوهُنَّ أُجُورَهُنَّۖ وَلَا تُمْسِكُواْ بِعِصَمِ اِ۬لْكَوَافِرِۖ وَسْـَٔلُواْ مَآ أَنفَقْتُمْ وَلْيَسْـَٔلُواْ مَآ أَنفَقُواْۖ ذَٰلِكُمْ حُكْمُ اُ۬للَّهِ يَحْكُمُ بَيْنَكُمْۖ وَاللَّهُ عَلِيمٌ حَكِيمٞۖ","وَإِن فَاتَكُمْ شَےْءٞ مِّنَ اَزْوَٰجِكُمُۥٓ إِلَى اَ۬لْكُفّ۪ارِ فَعَاقَبْتُمْ فَـَٔاتُواْ اُ۬لذِينَ ذَهَبَتَ اَزْوَٰجُهُم مِّثْلَ مَآ أَنفَقُواْۖ وَاتَّقُواْ اُ۬للَّهَ اَ۬لذِےٓ أَنتُم بِهِۦ مُومِنُونَۖ","يَٰٓأَيُّهَا‏ اَ۬لنَّبِےٓءُ اِ۪ذَا جَآءَكَ اَ۬لْمُومِنَٰتُ يُبَايِعْنَكَ عَلَىٰٓ أَن لَّا يُشْرِكْنَ بِاللَّهِ شَئْاٗ وَلَا يَسْرِقْنَ وَلَا يَزْنِينَ وَلَا يَقْتُلْنَ أَوْلَٰدَهُنَّ وَلَا يَاتِينَ بِبُهْتَٰنٖ يَفْتَرِينَهُۥ بَيْنَ أَيْدِيهِنَّ وَأَرْجُلِهِنَّ وَلَا يَعْصِينَكَ فِے مَعْرُوفٖ فَبَايِعْهُنَّ وَاسْتَغْفِرْ لَهُنَّ اَ۬للَّهَۖ إِنَّ اَ۬للَّهَ غَفُورٞ رَّحِيمٞۖ","يَٰٓأَيُّهَا اَ۬لذِينَ ءَامَنُواْ لَا تَتَوَلَّوْاْ قَوْماً غَضِبَ اَ۬للَّهُ عَلَيْهِمْ قَدْ يَئِسُواْ مِنَ اَ۬لَاخِرَةِ كَمَا يَئِسَ اَ۬لْكُفَّارُ مِنَ اَصْحَٰبِ اِ۬لْقُبُورِۖ"]],["الصف",["سَبَّحَ لِلهِ مَا فِے اِ۬لسَّمَٰوَٰتِ وَمَا فِے اِ۬لَارْضِۖ وَهُوَ اَ۬لْعَزِيزُ اُ۬لْحَكِيمُۖ","يَٰٓأَيُّهَا اَ۬لذِينَ ءَامَنُواْ لِمَ تَقُولُونَ مَا لَا تَفْعَلُونَۖ","كَبُرَ مَقْتاً عِندَ اَ۬للَّهِ أَن تَقُولُواْ مَا لَا تَفْعَلُونَۖ","إِنَّ اَ۬للَّهَ يُحِبُّ اُ۬لذِينَ يُقَٰتِلُونَ فِے سَبِيلِهِۦ صَفّاٗ كَأَنَّهُم بُنْيَٰنٞ مَّرْصُوصٞۖ","وَإِذْ قَالَ مُوس۪ىٰ لِقَوْمِهِۦ يَٰقَوْمِ لِمَ تُوذُونَنِے وَقَد تَّعْلَمُونَ أَنِّے رَسُولُ اُ۬للَّهِ إِلَيْكُمْۖ فَلَمَّا زَاغُوٓاْ أَزَاغَ اَ۬للَّهُ قُلُوبَهُمْۖ وَاللَّهُ لَا يَهْدِے اِ۬لْقَوْمَ اَ۬لْفَٰسِقِينَۖ","وَإِذْ قَالَ عِيسَى اَ۪بْنُ مَرْيَمَ يَٰبَنِےٓ إِسْرَآءِيلَ إِنِّے رَسُولُ اُ۬للَّهِ إِلَيْكُم مُّصَدِّقاٗ لِّمَا بَيْنَ يَدَيَّ مِنَ اَ۬لتَّوْر۪يٰةِ وَمُبَشِّراَۢ بِرَسُولٖ يَاتِے مِنۢ بَعْدِيَ اَ۪سْمُهُۥٓ أَحْمَدُۖ فَلَمَّا جَآءَهُم بِالْبَيِّنَٰتِ قَالُواْ هَٰذَا سِحْرٞ مُّبِينٞۖ","وَمَنَ اَظْلَمُ مِمَّنِ اِ۪فْتَر۪ىٰ عَلَى اَ۬للَّهِ اِ۬لْكَذِبَ وَهُوَ يُدْع۪ىٰٓ إِلَى اَ۬لِاسْلَٰمِۖ وَاللَّهُ لَا يَهْدِے اِ۬لْقَوْمَ اَ۬لظَّٰلِمِينَۖ","يُرِيدُونَ لِيُطْفِـُٔواْ نُورَ اَ۬للَّهِ بِأَفْوَٰهِهِمْ وَاللَّهُ مُتِمّٞ نُّورَهُۥ وَلَوْ كَرِهَ اَ۬لْكَٰفِرُونَۖ","هُوَ اَ۬لذِےٓ أَرْسَلَ رَسُولَهُۥ بِالْهُد۪ىٰ وَدِينِ اِ۬لْحَقِّ لِيُظْهِرَهُۥ عَلَى اَ۬لدِّينِ كُلِّهِۦ وَلَوْ كَرِهَ اَ۬لْمُشْرِكُونَۖ","يَٰٓأَيُّهَا اَ۬لذِينَ ءَامَنُواْ هَلَ اَدُلُّكُمْ عَلَىٰ تِجَٰرَةٖ تُنجِيكُم مِّنْ عَذَابٍ اَلِيمٖ","تُومِنُونَ بِاللَّهِ وَرَسُولِهِۦ وَتُجَٰهِدُونَ فِے سَبِيلِ اِ۬للَّهِ بِأَمْوَٰلِكُمْ وَأَنفُسِكُمْ ذَٰلِكُمْ خَيْرٞ لَّكُمُۥٓ إِن كُنتُمْ تَعْلَمُونَ","يَغْفِرْ لَكُمْ ذُنُوبَكُمْ وَيُدْخِلْكُمْ جَنَّٰتٖ تَجْرِے مِن تَحْتِهَا اَ۬لَانْهَٰرُ وَمَسَٰكِنَ طَيِّبَةٗ فِے جَنَّٰتِ عَدْنٖۖ ذَٰلِكَ اَ۬لْفَوْزُ اُ۬لْعَظِيمُۖ","وَأُخْر۪ىٰ تُحِبُّونَهَا نَصْرٞ مِّنَ اَ۬للَّهِ وَفَتْحٞ قَرِيبٞۖ وَبَشِّرِ اِ۬لْمُومِنِينَۖ","يَٰٓأَيُّهَا اَ۬لذِينَ ءَامَنُواْ كُونُوٓاْ أَنصَاراٗ لِّلهِ كَمَا قَالَ عِيسَى اَ۪بْنُ مَرْيَمَ لِلْحَوَارِيِّـۧنَ مَنَ اَنصَارِيَ إِلَى اَ۬للَّهِۖ قَالَ اَ۬لْحَوَارِيُّونَ نَحْنُ أَنصَارُ اُ۬للَّهِۖ فَـَٔامَنَت طَّآئِفَةٞ مِّنۢ بَنِےٓ إِسْرَآءِيلَ وَكَفَرَت طَّآئِفَةٞۖ فَأَيَّدْنَا اَ۬لذِينَ ءَامَنُواْ عَلَىٰ عَدُوِّهِمْ فَأَصْبَحُواْ ظَٰهِرِينَۖ"]],["الجمعة",["يُسَبِّحُ لِلهِ مَا فِے اِ۬لسَّمَٰوَٰتِ وَمَا فِے اِ۬لَارْضِ اِ۬لْمَلِكِ اِ۬لْقُدُّوسِ اِ۬لْعَزِيزِ اِ۬لْحَكِيمِۖ","هُوَ اَ۬لذِے بَعَثَ فِے اِ۬لُامِّيِّـۧنَ رَسُولاٗ مِّنْهُمْ يَتْلُواْ عَلَيْهِمُۥٓ ءَايَٰتِهِۦ وَيُزَكِّيهِمْ وَيُعَلِّمُهُمُ اُ۬لْكِتَٰبَ وَالْحِكْمَةَ وَإِن كَانُواْ مِن قَبْلُ لَفِے ضَلَٰلٖ مُّبِينٖ","وَءَاخَرِينَ مِنْهُمْ لَمَّا يَلْحَقُواْ بِهِمْۖ وَهُوَ اَ۬لْعَزِيزُ اُ۬لْحَكِيمُۖ","ذَٰلِكَ فَضْلُ اُ۬للَّهِ يُوتِيهِ مَنْ يَّشَآءُۖ وَاللَّهُ ذُو اُ۬لْفَضْلِ اِ۬لْعَظِيمِۖ","مَثَلُ اُ۬لذِينَ حُمِّلُواْ اُ۬لتَّوْر۪يٰةَ ثُمَّ لَمْ يَحْمِلُوهَا كَمَثَلِ اِ۬لْحِم۪ارِ يَحْمِلُ أَسْفَاراَۢۖ بِيسَ مَثَلُ اُ۬لْقَوْمِ اِ۬لذِينَ كَذَّبُواْ بِـَٔايَٰتِ اِ۬للَّهِۖ وَاللَّهُ لَا يَهْدِے اِ۬لْقَوْمَ اَ۬لظَّٰلِمِينَۖ","قُلْ يَٰٓأَيُّهَا اَ۬لذِينَ هَادُوٓاْ إِن زَعَمْتُمُۥٓ أَنَّكُمُۥٓ أَوْلِيَآءُ لِلهِ مِن دُونِ اِ۬لنَّاسِ فَتَمَنَّوُاْ اُ۬لْمَوْتَ إِن كُنتُمْ صَٰدِقِينَۖ","وَلَا يَتَمَنَّوْنَهُۥٓ أَبَداَۢ بِمَا قَدَّمَتَ اَيْدِيهِمْۖ وَاللَّهُ عَلِيمُۢ بِالظَّٰلِمِينَۖ","قُلِ اِنَّ اَ۬لْمَوْتَ اَ۬لذِے تَفِرُّونَ مِنْهُ فَإِنَّهُۥ مُلَٰقِيكُمْ ثُمَّ تُرَدُّونَ إِلَىٰ عَٰلِمِ اِ۬لْغَيْبِ وَالشَّهَٰدَةِ فَيُنَبِّئُكُم بِمَا كُنتُمْ تَعْمَلُونَۖ","يَٰٓأَيُّهَا اَ۬لذِينَ ءَامَنُوٓاْ إِذَا نُودِيَ لِلصَّلَوٰةِ مِنْ يَّوْمِ اِ۬لْجُمُعَةِ فَاسْعَوِاْ اِلَىٰ ذِكْرِ اِ۬للَّهِ وَذَرُواْ اُ۬لْبَيْعَۖ ذَٰلِكُمْ خَيْرٞ لَّكُمُۥٓ إِن كُنتُمْ تَعْلَمُونَۖ","فَإِذَا قُضِيَتِ اِ۬لصَّلَوٰةُ فَانتَشِرُواْ فِے اِ۬لَارْضِ وَابْتَغُواْ مِن فَضْلِ اِ۬للَّهِ وَاذْكُرُواْ اُ۬للَّهَ كَثِيراٗ لَّعَلَّكُمْ تُفْلِحُونَۖ","وَإِذَا رَأَوْاْ تِجَٰرَةً اَوْ لَهْواً اِ۪نفَضُّوٓاْ إِلَيْهَا وَتَرَكُوكَ قَآئِماٗۖ قُلْ مَا عِندَ اَ۬للَّهِ خَيْرٞ مِّنَ اَ۬للَّهْوِ وَمِنَ اَ۬لتِّجَٰرَةِۖ وَاللَّهُ خَيْرُ اُ۬لرَّٰزِقِينَۖ"]],["المنافقون",["إِذَا جَآءَكَ اَ۬لْمُنَٰفِقُونَ قَالُواْ نَشْهَدُ إِنَّكَ لَرَسُولُ اُ۬للَّهِۖ وَاللَّهُ يَعْلَمُ إِنَّكَ لَرَسُولُهُۥۖ وَاللَّهُ يَشْهَدُ إِنَّ اَ۬لْمُنَٰفِقِينَ لَكَٰذِبُونَۖ","اَ۪تَّخَذُوٓاْ أَيْمَٰنَهُمْ جُنَّةٗ فَصَدُّواْ عَن سَبِيلِ اِ۬للَّهِۖ إِنَّهُمْ سَآءَ مَا كَانُواْ يَعْمَلُونَۖ","ذَٰلِكَ بِأَنَّهُمُۥٓ ءَامَنُواْ ثُمَّ كَفَرُواْ فَطُبِعَ عَلَىٰ قُلُوبِهِمْ فَهُمْ لَا يَفْقَهُونَۖ","وَإِذَا رَأَيْتَهُمْ تُعْجِبُكَ أَجْسَامُهُمْۖ وَإِنْ يَّقُولُواْ تَسْمَعْ لِقَوْلِهِمْ كَأَنَّهُمْ خُشُبٞ مُّسَنَّدَةٞۖ يَحْسِبُونَ كُلَّ صَيْحَةٍ عَلَيْهِمْۖ هُمُ اُ۬لْعَدُوُّۖ فَاحْذَرْهُمْۖ قَٰتَلَهُمُ اُ۬للَّهُۖ أَنّ۪ىٰ يُوفَكُونَۖ","وَإِذَا قِيلَ لَهُمْ تَعَالَوْاْ يَسْتَغْفِرْ لَكُمْ رَسُولُ اُ۬للَّهِ لَوَوْاْ رُءُوسَهُمْ وَرَأَيْتَهُمْ يَصُدُّونَ وَهُم مُّسْتَكْبِرُونَۖ","سَوَآءٌ عَلَيْهِمُۥٓ أَسْتَغْفَرْتَ لَهُمُۥٓ أَمْ لَمْ تَسْتَغْفِرْ لَهُمْۖ لَنْ يَّغْفِرَ اَ۬للَّهُ لَهُمُۥٓۖ إِنَّ اَ۬للَّهَ لَا يَهْدِے اِ۬لْقَوْمَ اَ۬لْفَٰسِقِينَۖ","هُمُ اُ۬لذِينَ يَقُولُونَ لَا تُنفِقُواْ عَلَىٰ مَنْ عِندَ رَسُولِ اِ۬للَّهِ حَتَّىٰ يَنفَضُّواْۖ وَلِلهِ خَزَآئِنُ اُ۬لسَّمَٰوَٰتِ وَالَارْضِۖ وَلَٰكِنَّ اَ۬لْمُنَٰفِقِينَ لَا يَفْقَهُونَۖ","يَقُولُونَ لَئِن رَّجَعْنَآ إِلَى اَ۬لْمَدِينَةِ لَيُخْرِجَنَّ اَ۬لَاعَزُّ مِنْهَا اَ۬لَاذَلَّۖ وَلِلهِ اِ۬لْعِزَّةُ وَلِرَسُولِهِۦ وَلِلْمُومِنِينَۖ وَلَٰكِنَّ اَ۬لْمُنَٰفِقِينَ لَا يَعْلَمُونَۖ","۞ يَٰٓأَيُّهَا اَ۬لذِينَ ءَامَنُواْ لَا تُلْهِكُمُۥٓ أَمْوَٰلُكُمْ وَلَآ أَوْلَٰدُكُمْ عَن ذِكْرِ اِ۬للَّهِۖ وَمَنْ يَّفْعَلْ ذَٰلِكَ فَأُوْلَٰٓئِكَ هُمُ اُ۬لْخَٰسِرُونَۖ","وَأَنفِقُواْ مِن مَّا رَزَقْنَٰكُم مِّن قَبْلِ أَنْ يَّاتِيَ أَحَدَكُمُ اُ۬لْمَوْتُ فَيَقُولَ رَبِّ لَوْلَآ أَخَّرْتَنِےٓ إِلَىٰٓ أَجَلٖ قَرِيبٖ فَأَصَّدَّقَ وَأَكُن مِّنَ اَ۬لصَّٰلِحِينَۖ","وَلَنْ يُّوَ۬خِّرَ اَ۬للَّهُ نَفْساً اِذَا جَآءَ اجَلُهَاۖ وَاللَّهُ خَبِيرُۢ بِمَا تَعْمَلُونَۖ"]],["التغابن",["يُسَبِّحُ لِلهِ مَا فِے اِ۬لسَّمَٰوَٰتِ وَمَا فِے اِ۬لَارْضِۖ لَهُ اُ۬لْمُلْكُ وَلَهُ اُ۬لْحَمْدُۖ وَهُوَ عَلَىٰ كُلِّ شَےْءٖ قَدِيرٌۖ","هُوَ اَ۬لذِے خَلَقَكُمْ فَمِنكُمْ كَافِرٞ وَمِنكُم مُّومِنٞۖ وَاللَّهُ بِمَا تَعْمَلُونَ بَصِيرٌۖ","خَلَقَ اَ۬لسَّمَٰوَٰتِ وَالَارْضَ بِالْحَقِّ وَصَوَّرَكُمْ فَأَحْسَنَ صُوَرَكُمْۖ وَإِلَيْهِ اِ۬لْمَصِيرُۖ","يَعْلَمُ مَا فِے اِ۬لسَّمَٰوَٰتِ وَالَارْضِ وَيَعْلَمُ مَا تُسِرُّونَ وَمَا تُعْلِنُونَۖ وَاللَّهُ عَلِيمُۢ بِذَاتِ اِ۬لصُّدُورِۖ","أَلَمْ يَاتِكُمْ نَبَؤُاْ اُ۬لذِينَ كَفَرُواْ مِن قَبْلُ فَذَاقُواْ وَبَالَ أَمْرِهِمْ وَلَهُمْ عَذَابٌ اَلِيمٞۖ","ذَٰلِكَ بِأَنَّهُۥ كَانَت تَّاتِيهِمْ رُسُلُهُم بِالْبَيِّنَٰتِ فَقَالُوٓاْ أَبَشَرٞ يَهْدُونَنَاۖ فَكَفَرُواْ وَتَوَلَّواْ وَّاسْتَغْنَى اَ۬للَّهُۖ وَاللَّهُ غَنِيٌّ حَمِيدٞۖ","۞ زَعَمَ اَ۬لذِينَ كَفَرُوٓاْ أَن لَّنْ يُّبْعَثُواْۖ قُلْ بَل۪ىٰ وَرَبِّے لَتُبْعَثُنَّ ثُمَّ لَتُنَبَّؤُنَّ بِمَا عَمِلْتُمْۖ وَذَٰلِكَ عَلَى اَ۬للَّهِ يَسِيرٞۖ","فَـَٔامِنُواْ بِاللَّهِ وَرَسُولِهِۦ وَالنُّورِ اِ۬لذِےٓ أَنزَلْنَاۖ وَاللَّهُ بِمَا تَعْمَلُونَ خَبِيرٞۖ","يَوْمَ يَجْمَعُكُمْ لِيَوْمِ اِ۬لْجَمْعِ ذَٰلِكَ يَوْمُ اُ۬لتَّغَابُنِۖ وَمَنْ يُّومِنۢ بِاللَّهِ وَيَعْمَلْ صَٰلِحاٗ نُّكَفِّرْ عَنْهُ سَيِّـَٔاتِهِۦ وَنُدْخِلْهُ جَنَّٰتٖ تَجْرِے مِن تَحْتِهَا اَ۬لَانْهَٰرُ خَٰلِدِينَ فِيهَآ أَبَداٗۖ ذَٰلِكَ اَ۬لْفَوْزُ اُ۬لْعَظِيمُۖ","وَالذِينَ كَفَرُواْ وَكَذَّبُواْ بِـَٔايَٰتِنَآ أُوْلَٰٓئِكَ أَصْحَٰبُ اُ۬لنّ۪ارِ خَٰلِدِينَ فِيهَاۖ وَبِيسَ اَ۬لْمَصِيرُۖ","مَآ أَصَابَ مِن مُّصِيبَةٍ اِلَّا بِإِذْنِ اِ۬للَّهِۖ وَمَنْ يُّومِنۢ بِاللَّهِ يَهْدِ قَلْبَهُۥۖ وَاللَّهُ بِكُلِّ شَےْءٍ عَلِيمٞۖ","وَأَطِيعُواْ اُ۬للَّهَ وَأَطِيعُواْ اُ۬لرَّسُولَۖ فَإِن تَوَلَّيْتُمْ فَإِنَّمَا عَلَىٰ رَسُولِنَا اَ۬لْبَلَٰغُ اُ۬لْمُبِينُۖ","اُ۬للَّهُ لَآ إِلَٰهَ إِلَّا هُوَۖ وَعَلَى اَ۬للَّهِ فَلْيَتَوَكَّلِ اِ۬لْمُومِنُونَۖ","يَٰٓأَيُّهَا اَ۬لذِينَ ءَامَنُوٓاْ إِنَّ مِنَ اَزْوَٰجِكُمْ وَأَوْلَٰدِكُمْ عَدُوّاٗ لَّكُمْ فَاحْذَرُوهُمْۖ وَإِن تَعْفُواْ وَتَصْفَحُواْ وَتَغْفِرُواْ فَإِنَّ اَ۬للَّهَ غَفُورٞ رَّحِيمٌۖ","اِنَّمَآ أَمْوَٰلُكُمْ وَأَوْلَٰدُكُمْ فِتْنَةٞۖ وَاللَّهُ عِندَهُۥٓ أَجْرٌ عَظِيمٞۖ","فَاتَّقُواْ اُ۬للَّهَ مَا اَ۪سْتَطَعْتُمْ وَاسْمَعُواْ وَأَطِيعُواْ وَأَنفِقُواْ خَيْراٗ لِّأَنفُسِكُمْۖ وَمَنْ يُّوقَ شُحَّ نَفْسِهِۦ فَأُوْلَٰٓئِكَ هُمُ اُ۬لْمُفْلِحُونَۖ","إِن تُقْرِضُواْ اُ۬للَّهَ قَرْضاً حَسَناٗ يُضَٰعِفْهُ لَكُمْ وَيَغْفِرْ لَكُمْۖ وَاللَّهُ شَكُورٌ حَلِيمٌۖ","عَٰلِمُ اُ۬لْغَيْبِ وَالشَّهَٰدَةِۖ اِ۬لْعَزِيزُ اُ۬لْحَكِيمُۖ"]],["الطلاق",["يَٰٓأَيُّهَا‏ اَ۬لنَّبِےٓءُ اِ۪ذَا طَلَّقْتُمُ اُ۬لنِّسَآءَ فَطَلِّقُوهُنَّ لِعِدَّتِهِنَّ وَأَحْصُواْ اُ۬لْعِدَّةَۖ وَاتَّقُواْ اُ۬للَّهَ رَبَّكُمْۖ لَا تُخْرِجُوهُنَّ مِنۢ بُيُوتِهِنَّۖ وَلَا يَخْرُجْنَ إِلَّآ أَنْ يَّاتِينَ بِفَٰحِشَةٖ مُّبَيِّنَةٖۖ وَتِلْكَ حُدُودُ اُ۬للَّهِۖ وَمَنْ يَّتَعَدَّ حُدُودَ اَ۬للَّهِ فَقَد ظَّلَمَ نَفْسَهُۥۖ لَا تَدْرِے لَعَلَّ اَ۬للَّهَ يُحْدِثُ بَعْدَ ذَٰلِكَ أَمْراٗۖ","فَإِذَا بَلَغْنَ أَجَلَهُنَّ فَأَمْسِكُوهُنَّ بِمَعْرُوفٍ اَوْ فَارِقُوهُنَّ بِمَعْرُوفٖۖ وَأَشْهِدُواْ ذَوَےْ عَدْلٖ مِّنكُمْۖ وَأَقِيمُواْ اُ۬لشَّهَٰدَةَ لِلهِۖ ذَٰلِكُمْ يُوعَظُ بِهِۦ مَن كَانَ يُومِنُ بِاللَّهِ وَالْيَوْمِ اِ۬لَاخِرِۖ وَمَنْ يَّتَّقِ اِ۬للَّهَ يَجْعَل لَّهُۥ مَخْرَجاٗ","وَيَرْزُقْهُ مِنْ حَيْثُ لَا يَحْتَسِبُۖ وَمَنْ يَّتَوَكَّلْ عَلَى اَ۬للَّهِ فَهُوَ حَسْبُهُۥٓۖ إِنَّ اَ۬للَّهَ بَٰلِغٌ اَمْرَهُۥۖ قَدْ جَعَلَ اَ۬للَّهُ لِكُلِّ شَےْءٖ قَدْراٗۖ","وَال۪ےْ يَئِسْنَ مِنَ اَ۬لْمَحِيضِ مِن نِّسَآئِكُمُۥٓ إِنِ اِ۪رْتَبْتُمْ فَعِدَّتُهُنَّ ثَلَٰثَةُ أَشْهُرٖ وَال۪ےْ لَمْ يَحِضْنَۖ وَأُوْلَٰتُ اُ۬لَاحْمَالِ أَجَلُهُنَّ أَنْ يَّضَعْنَ حَمْلَهُنَّۖ وَمَنْ يَّتَّقِ اِ۬للَّهَ يَجْعَل لَّهُۥ مِنَ اَمْرِهِۦ يُسْراٗۖ","ذَٰلِكَ أَمْرُ اُ۬للَّهِ أَنزَلَهُۥٓ إِلَيْكُمْۖ وَمَنْ يَّتَّقِ اِ۬للَّهَ يُكَفِّرْ عَنْهُ سَيِّـَٔاتِهِۦ وَيُعْظِمْ لَهُۥٓ أَجْراًۖ","اَسْكِنُوهُنَّ مِنْ حَيْثُ سَكَنتُم مِّنْ وُّجْدِكُمْۖ وَلَا تُضَآرُّوهُنَّ لِتُضَيِّقُواْ عَلَيْهِنَّۖ وَإِن كُنَّ أُوْلَٰتِ حَمْلٖ فَأَنفِقُواْ عَلَيْهِنَّ حَتَّىٰ يَضَعْنَ حَمْلَهُنَّۖ فَإِنَ اَرْضَعْنَ لَكُمْ فَـَٔاتُوهُنَّ أُجُورَهُنَّ وَاتَمِرُواْ بَيْنَكُم بِمَعْرُوفٖۖ ۞ وَإِن تَعَاسَرْتُمْ فَسَتُرْضِعُ لَهُۥٓ أُخْر۪ىٰۖ","لِيُنفِقْ ذُو سَعَةٖ مِّن سَعَتِهِۦۖ وَمَن قُدِرَ عَلَيْهِ رِزْقُهُۥ فَلْيُنفِقْ مِمَّآ ءَات۪يٰهُ اُ۬للَّهُۖ لَا يُكَلِّفُ اُ۬للَّهُ نَفْساً اِلَّا مَآ ءَات۪يٰهَاۖ سَيَجْعَلُ اُ۬للَّهُ بَعْدَ عُسْرٖ يُسْراٗۖ","وَكَأَيِّن مِّن قَرْيَةٍ عَتَتْ عَنَ اَمْرِ رَبِّهَا وَرُسُلِهِۦ فَحَاسَبْنَٰهَا حِسَاباٗ شَدِيداٗ وَعَذَّبْنَٰهَا عَذَاباٗ نُّكُراٗ","فَذَاقَتْ وَبَالَ أَمْرِهَاۖ وَكَانَ عَٰقِبَةُ أَمْرِهَا خُسْراًۖ","اَعَدَّ اَ۬للَّهُ لَهُمْ عَذَاباٗ شَدِيداٗۖ فَاتَّقُواْ اُ۬للَّهَ يَٰٓأُوْلِے اِ۬لَالْبَٰبِۖ اِ۬لذِينَ ءَامَنُواْ قَدَ اَنزَلَ اَ۬للَّهُ إِلَيْكُمْ ذِكْراٗۖ","رَّسُولاٗ يَتْلُواْ عَلَيْكُمُۥٓ ءَايَٰتِ اِ۬للَّهِ مُبَيَّنَٰتٖ لِّيُخْرِجَ اَ۬لذِينَ ءَامَنُواْ وَعَمِلُواْ اُ۬لصَّٰلِحَٰتِ مِنَ اَ۬لظُّلُمَٰتِ إِلَى اَ۬لنُّورِۖ وَمَنْ يُّومِنۢ بِاللَّهِ وَيَعْمَلْ صَٰلِحاٗ نُّدْخِلْهُ جَنَّٰتٖ تَجْرِے مِن تَحْتِهَا اَ۬لَانْهَٰرُ خَٰلِدِينَ فِيهَآ أَبَداٗ قَدَ اَحْسَنَ اَ۬للَّهُ لَهُۥ رِزْقاًۖ","اِ۬للَّهُ اُ۬لذِے خَلَقَ سَبْعَ سَمَٰوَٰتٖ وَمِنَ اَ۬لَارْضِ مِثْلَهُنَّۖ يَتَنَزَّلُ اُ۬لَامْرُ بَيْنَهُنَّ لِتَعْلَمُوٓاْ أَنَّ اَ۬للَّهَ عَلَىٰ كُلِّ شَےْءٖ قَدِيرٞ وَأَنَّ اَ۬للَّهَ قَدَ اَحَاطَ بِكُلِّ شَےْءٍ عِلْماٗۖ"]],["التحريم",["يَٰٓأَيُّهَا‏ اَ۬لنَّبِےٓءُ لِمَ تُحَرِّمُ مَآ أَحَلَّ اَ۬للَّهُ لَكَ تَبْتَغِے مَرْضَاتَ أَزْوَٰجِكَۖ وَاللَّهُ غَفُورٞ رَّحِيمٞۖ","قَدْ فَرَضَ اَ۬للَّهُ لَكُمْ تَحِلَّةَ أَيْمَٰنِكُمْۖ وَاللَّهُ مَوْل۪يٰكُمْۖ وَهُوَ اَ۬لْعَلِيمُ اُ۬لْحَكِيمُۖ","وَإِذَ اَسَرَّ‏ اَ۬لنَّبِےٓءُ اِ۪لَىٰ بَعْضِ أَزْوَٰجِهِۦ حَدِيثاٗۖ فَلَمَّا نَبَّأَتْ بِهِۦ وَأَظْهَرَهُ اُ۬للَّهُ عَلَيْهِ عَرَّفَ بَعْضَهُۥ وَأَعْرَضَ عَنۢ بَعْضٖۖ فَلَمَّا نَبَّأَهَا بِهِۦ قَالَتْ مَنَ اَنۢبَأَكَ هَٰذَا قَالَ نَبَّأَنِيَ اَ۬لْعَلِيمُ اُ۬لْخَبِيرُۖ","إِن تَتُوبَآ إِلَى اَ۬للَّهِ فَقَدْ صَغَتْ قُلُوبُكُمَاۖ وَإِن تَظَّٰهَرَا عَلَيْهِ فَإِنَّ اَ۬للَّهَ هُوَ مَوْل۪يٰهُ وَجِبْرِيلُ وَصَٰلِحُ اُ۬لْمُومِنِينَۖ وَالْمَلَٰٓئِكَةُ بَعْدَ ذَٰلِكَ ظَهِيرٌۖ","عَس۪ىٰ رَبُّهُۥٓ إِن طَلَّقَكُنَّ أَنْ يُّبَدِّلَهُۥٓ أَزْوَٰجاً خَيْراٗ مِّنكُنَّ مُسْلِمَٰتٖ مُّومِنَٰتٖ قَٰنِتَٰتٖ تَٰٓئِبَٰتٍ عَٰبِدَٰتٖ سَٰٓئِحَٰتٖ ثَيِّبَٰتٖ وَأَبْكَاراٗۖ","يَٰٓأَيُّهَا اَ۬لذِينَ ءَامَنُواْ قُوٓاْ أَنفُسَكُمْ وَأَهْلِيكُمْ نَاراٗ وَقُودُهَا اَ۬لنَّاسُ وَالْحِجَارَةُ عَلَيْهَا مَلَٰٓئِكَةٌ غِلَٰظٞ شِدَادٞ لَّا يَعْصُونَ اَ۬للَّهَ مَآ أَمَرَهُمْ وَيَفْعَلُونَ مَا يُومَرُونَۖ","يَٰٓأَيُّهَا اَ۬لذِينَ كَفَرُواْ لَا تَعْتَذِرُواْ اُ۬لْيَوْمَ إِنَّمَا تُجْزَوْنَ مَا كُنتُمْ تَعْمَلُونَۖ","۞ يَٰٓأَيُّهَا اَ۬لذِينَ ءَامَنُواْ تُوبُوٓاْ إِلَى اَ۬للَّهِ تَوْبَةٗ نَّصُوحاً عَس۪ىٰ رَبُّكُمُۥٓ أَنْ يُّكَفِّرَ عَنكُمْ سَيِّـَٔاتِكُمْ وَيُدْخِلَكُمْ جَنَّٰتٖ تَجْرِے مِن تَحْتِهَا اَ۬لَانْهَٰرُ يَوْمَ لَا يُخْزِے اِ۬للَّهُ اُ۬لنَّبِےٓءَ وَالذِينَ ءَامَنُواْ مَعَهُۥ نُورُهُمْ يَسْع۪ىٰ بَيْنَ أَيْدِيهِمْ وَبِأَيْمَٰنِهِمْۖ يَقُولُونَ رَبَّنَآ أَتْمِمْ لَنَا نُورَنَا وَاغْفِرْ لَنَآۖ إِنَّكَ عَلَىٰ كُلِّ شَےْءٖ قَدِيرٞۖ","يَٰٓأَيُّهَا‏ اَ۬لنَّبِےٓءُ جَٰهِدِ اِ۬لْكُفَّارَ وَالْمُنَٰفِقِينَ وَاغْلُظْ عَلَيْهِمْۖ وَمَأْو۪يٰهُمْ جَهَنَّمُۖ وَبِيسَ اَ۬لْمَصِيرُۖ","ضَرَبَ اَ۬للَّهُ مَثَلاٗ لِّلذِينَ كَفَرُواْ اُ۪مْرَأَتَ نُوحٖ وَامْرَأَتَ لُوطٖۖ كَانَتَا تَحْتَ عَبْدَيْنِ مِنْ عِبَادِنَا صَالِحَيْنِ فَخَانَتَٰهُمَا فَلَمْ يُغْنِيَا عَنْهُمَا مِنَ اَ۬للَّهِ شَئْاٗۖ وَقِيلَ اَ۟دْخُلَا اَ۬لنَّارَ مَعَ اَ۬لدَّٰخِلِينَۖ","وَضَرَبَ اَ۬للَّهُ مَثَلاٗ لِّلذِينَ ءَامَنُواْ اُ۪مْرَأَتَ فِرْعَوْنَ إِذْ قَالَتْ رَبِّ اِ۪بْنِ لِے عِندَكَ بَيْتاٗ فِے اِ۬لْجَنَّةِ وَنَجِّنِے مِن فِرْعَوْنَ وَعَمَلِهِۦ وَنَجِّنِے مِنَ اَ۬لْقَوْمِ اِ۬لظَّٰلِمِينَۖ","وَمَرْيَمَ اَ۪بْنَتَ عِمْرَٰنَ اَ۬لتِےٓ أَحْصَنَتْ فَرْجَهَا فَنَفَخْنَا فِيهِ مِن رُّوحِنَا وَصَدَّقَتْ بِكَلِمَٰتِ رَبِّهَا وَكِتَٰبِهِۦ وَكَانَتْ مِنَ اَ۬لْقَٰنِتِينَۖ"]],["الملك",["تَبَٰرَكَ اَ۬لذِے بِيَدِهِ اِ۬لْمُلْكُ وَهُوَ عَلَىٰ كُلِّ شَےْءٖ قَدِيرٌۖ","اِ۬لذِے خَلَقَ اَ۬لْمَوْتَ وَالْحَيَوٰةَ لِيَبْلُوَكُمُۥٓ أَيُّكُمُۥٓ أَحْسَنُ عَمَلاٗۖ وَهُوَ اَ۬لْعَزِيزُ اُ۬لْغَفُورُۖ","اُ۬لذِے خَلَقَ سَبْعَ سَمَٰوَٰتٖ طِبَاقاٗۖ مَّا تَر۪ىٰ فِے خَلْقِ اِ۬لرَّحْمَٰنِ مِن تَفَٰوُتٖۖ فَارْجِعِ اِ۬لْبَصَرَ هَلْ تَر۪ىٰ مِن فُطُورٖۖ","ثُمَّ اَ۪رْجِعِ اِ۬لْبَصَرَ كَرَّتَيْنِ يَنقَلِبِ اِلَيْكَ اَ۬لْبَصَرُ خَاسِئاٗ وَهُوَ حَسِيرٞۖ","وَلَقَدْ زَيَّنَّا اَ۬لسَّمَآءَ اَ۬لدُّنْي۪ا بِمَصَٰبِيحَ وَجَعَلْنَٰهَا رُجُوماٗ لِّلشَّيَٰطِينِ وَأَعْتَدْنَا لَهُمْ عَذَابَ اَ۬لسَّعِيرِۖ","وَلِلذِينَ كَفَرُواْ بِرَبِّهِمْ عَذَابُ جَهَنَّمَۖ وَبِيسَ اَ۬لْمَصِيرُۖ","إِذَآ أُلْقُواْ فِيهَا سَمِعُواْ لَهَا شَهِيقاٗ وَهِيَ تَفُورُ","تَكَادُ تَمَيَّزُ مِنَ اَ۬لْغَيْظِۖ كُلَّمَآ أُلْقِيَ فِيهَا فَوْجٞ سَأَلَهُمْ خَزَنَتُهَآ أَلَمْ يَاتِكُمْ نَذِيرٞۖ","قَالُواْ بَل۪ىٰ قَدْ جَآءَنَا نَذِيرٞ","فَكَذَّبْنَا وَقُلْنَا مَا نَزَّلَ اَ۬للَّهُ مِن شَےْءٍ اِنَ اَنتُمُۥٓ إِلَّا فِے ضَلَٰلٖ كَبِيرٖۖ","وَقَالُواْ لَوْ كُنَّا نَسْمَعُ أَوْ نَعْقِلُ مَا كُنَّا فِےٓ أَصْحَٰبِ اِ۬لسَّعِيرِۖ","فَاعْتَرَفُواْ بِذَنۢبِهِمْۖ فَسُحْقاٗ لِّأَصْحَٰبِ اِ۬لسَّعِيرِۖ","إِنَّ اَ۬لذِينَ يَخْشَوْنَ رَبَّهُم بِالْغَيْبِ لَهُم مَّغْفِرَةٞ وَأَجْرٞ كَبِيرٞۖ","وَأَسِرُّواْ قَوْلَكُمُۥٓ أَوِ اِ۪جْهَرُواْ بِهِۦٓۖ إِنَّهُۥ عَلِيمُۢ بِذَاتِ اِ۬لصُّدُورِۖ","أَلَا يَعْلَمُ مَنْ خَلَقَ وَهُوَ اَ۬للَّطِيفُ اُ۬لْخَبِيرُۖ","هُوَ اَ۬لذِے جَعَلَ لَكُمُ اُ۬لَارْضَ ذَلُولاٗ فَامْشُواْ فِے مَنَاكِبِهَا وَكُلُواْ مِن رِّزْقِهِۦۖ وَإِلَيْهِ اِ۬لنُّشُورُۖ","ءَامِنتُم مَّن فِے اِ۬لسَّمَآءِ اَ۬نْ يَّخْسِفَ بِكُمُ اُ۬لَارْضَ فَإِذَا هِيَ تَمُورُۖ","أَمَ اَمِنتُم مَّن فِے اِ۬لسَّمَآءِ اَ۬نْ يُّرْسِلَ عَلَيْكُمْ حَاصِباٗۖ فَسَتَعْلَمُونَ كَيْفَ نَذِيرِۦۖ","وَلَقَدْ كَذَّبَ اَ۬لذِينَ مِن قَبْلِهِمْۖ فَكَيْفَ كَانَ نَكِيرِۦٓۖ","۞ أَوَلَمْ يَرَوِاْ اِلَى اَ۬لطَّيْرِ فَوْقَهُمْ صَٰٓفَّٰتٖ وَيَقْبِضْنَۖ مَا يُمْسِكُهُنَّ إِلَّا اَ۬لرَّحْمَٰنُۖ إِنَّهُۥ بِكُلِّ شَےْءِۢ بَصِيرٌۖ","اَمَّنْ هَٰذَا اَ۬لذِے هُوَ جُندٞ لَّكُمْ يَنصُرُكُم مِّن دُونِ اِ۬لرَّحْمَٰنِۖ إِنِ اِ۬لْكَٰفِرُونَ إِلَّا فِے غُرُورٍۖ","اَمَّنْ هَٰذَا اَ۬لذِے يَرْزُقُكُمُۥٓ إِنَ اَمْسَكَ رِزْقَهُۥۖ بَل لَّجُّواْ فِے عُتُوّٖ وَنُفُورٍۖ","اَفَمَنْ يَّمْشِے مُكِبّاً عَلَىٰ وَجْهِهِۦٓ أَهْد۪ىٰٓ أَمَّنْ يَّمْشِے سَوِيّاً عَلَىٰ صِرَٰطٖ مُّسْتَقِيمٖۖ","قُلْ هُوَ اَ۬لذِےٓ أَنشَأَكُمْ وَجَعَلَ لَكُمُ اُ۬لسَّمْعَ وَالَابْصَٰرَ وَالَافْـِٕدَةَۖ قَلِيلاٗ مَّا تَشْكُرُونَۖ","قُلْ هُوَ اَ۬لذِے ذَرَأَكُمْ فِے اِ۬لَارْضِ وَإِلَيْهِ تُحْشَرُونَۖ","وَيَقُولُونَ مَت۪ىٰ هَٰذَا اَ۬لْوَعْدُ إِن كُنتُمْ صَٰدِقِينَۖ","قُلِ اِنَّمَا اَ۬لْعِلْمُ عِندَ اَ۬للَّهِ وَإِنَّمَآ أَنَا نَذِيرٞ مُّبِينٞۖ","فَلَمَّا رَأَوْهُ زُلْفَةٗ س۬يَٓٔتْ وُجُوهُ اُ۬لذِينَ كَفَرُواْ وَقِيلَ هَٰذَا اَ۬لذِے كُنتُم بِهِۦ تَدَّعُونَۖ","قُلَ اَرَٰٓيْتُمُۥٓ إِنَ اَهْلَكَنِيَ اَ۬للَّهُ وَمَن مَّعِيَ أَوْ رَحِمَنَا فَمَنْ يُّجِيرُ اُ۬لْكٰ۪فِرِينَ مِنْ عَذَابٍ اَلِيمٖۖ","قُلْ هُوَ اَ۬لرَّحْمَٰنُ ءَامَنَّا بِهِۦ وَعَلَيْهِ تَوَكَّلْنَاۖ فَسَتَعْلَمُونَ مَنْ هُوَ فِے ضَلَٰلٖ مُّبِينٖۖ","قُلَ اَرَٰٓيْتُمُۥٓ إِنَ اَصْبَحَ مَآؤُكُمْ غَوْراٗ فَمَنْ يَّاتِيكُم بِمَآءٖ مَّعِينٖۖ"]],["القلم",["نُّٓۖ وَالْقَلَمِ وَمَا يَسْطُرُونَ","مَآ أَنتَ بِنِعْمَةِ رَبِّكَ بِمَجْنُونٖ","وَإِنَّ لَكَ لَأَجْراً غَيْرَ مَمْنُونٖ","وَإِنَّكَ لَعَلَىٰ خُلُقٍ عَظِيمٖۖ","فَسَتُبْصِرُ وَيُبْصِرُونَ","بِأَييِّكُمُ اُ۬لْمَفْتُونُۖ","إِنَّ رَبَّكَ هُوَ أَعْلَمُ بِمَن ضَلَّ عَن سَبِيلِهِۦۖ وَهُوَ أَعْلَمُ بِالْمُهْتَدِينَۖ","فَلَا تُطِعِ اِ۬لْمُكَذِّبِينَۖ","وَدُّواْ لَوْ تُدْهِنُ فَيُدْهِنُونَۖ","وَلَا تُطِعْ كُلَّ حَلَّٰفٖ مَّهِينٍ","هَمَّازٖ مَّشَّآءِۢ بِنَمِيمٖ","مَّنَّاعٖ لِّلْخَيْرِ مُعْتَدٍ اَثِيمٍ","عُتُلِّۢ بَعْدَ ذَٰلِكَ زَنِيمٍ","اَن كَانَ ذَا مَالٖ وَبَنِينَ","إِذَا تُتْل۪ىٰ عَلَيْهِ ءَايَٰتُنَا قَالَ أَسَٰطِيرُ اُ۬لَاوَّلِينَۖ","سَنَسِمُهُۥ عَلَى اَ۬لْخُرْطُومِۖ","إِنَّا بَلَوْنَٰهُمْ كَمَا بَلَوْنَآ أَصْحَٰبَ اَ۬لْجَنَّةِ إِذَ اَقْسَمُواْ لَيَصْرِمُنَّهَا مُصْبِحِينَ","وَلَا يَسْتَثْنُونَۖ","۞ فَطَافَ عَلَيْهَا طَآئِفٞ مِّن رَّبِّكَ وَهُمْ نَآئِمُونَ","فَأَصْبَحَتْ كَالصَّرِيمِۖ","فَتَنَادَوْاْ مُصْبِحِينَ","أَنُ اُ۟غْدُواْ عَلَىٰ حَرْثِكُمُۥٓ إِن كُنتُمْ صَٰرِمِينَۖ","فَانطَلَقُواْ وَهُمْ يَتَخَٰفَتُونَ","أَن لَّا يَدْخُلَنَّهَا اَ۬لْيَوْمَ عَلَيْكُم مِّسْكِينٞۖ","وَغَدَوْاْ عَلَىٰ حَرْدٖ قَٰدِرِينَۖ","فَلَمَّا رَأَوْهَا قَالُوٓاْ إِنَّا لَضَآلُّونَ","بَلْ نَحْنُ مَحْرُومُونَۖ","قَالَ أَوْسَطُهُمُۥٓ أَلَمَ اَقُل لَّكُمْ لَوْلَا تُسَبِّحُونَۖ","قَالُواْ سُبْحَٰنَ رَبِّنَآ إِنَّا كُنَّا ظَٰلِمِينَۖ","فَأَقْبَلَ بَعْضُهُمْ عَلَىٰ بَعْضٖ يَتَلَٰوَمُونَۖ","قَالُواْ يَٰوَيْلَنَآ إِنَّا كُنَّا طَٰغِينَ","عَس۪ىٰ رَبُّنَآ أَنْ يُّبَدِّلَنَا خَيْراٗ مِّنْهَآ إِنَّآ إِلَىٰ رَبِّنَا رَٰغِبُونَۖ","كَذَٰلِكَ اَ۬لْعَذَابُۖ وَلَعَذَابُ اُ۬لَاخِرَةِ أَكْبَرُ لَوْ كَانُواْ يَعْلَمُونَۖ","إِنَّ لِلْمُتَّقِينَ عِندَ رَبِّهِمْ جَنَّٰتِ اِ۬لنَّعِيمِۖ","أَفَنَجْعَلُ اُ۬لْمُسْلِمِينَ كَالْمُجْرِمِينَۖ","مَا لَكُمْۖ كَيْفَ تَحْكُمُونَۖ","أَمْ لَكُمْ كِتَٰبٞ فِيهِ تَدْرُسُونَ","إِنَّ لَكُمْ فِيهِ لَمَا تَخَيَّرُونَۖ","أَمْ لَكُمُۥٓ أَيْمَٰنٌ عَلَيْنَا بَٰلِغَةٌ اِلَىٰ يَوْمِ اِ۬لْقِيَٰمَةِ إِنَّ لَكُمْ لَمَا تَحْكُمُونَۖ","سَلْهُمُۥٓ أَيُّهُم بِذَٰلِكَ زَعِيمٌۖ","اَمْ لَهُمْ شُرَكَآءُ فَلْيَاتُواْ بِشُرَكَآئِهِمُۥٓ إِن كَانُواْ صَٰدِقِينَۖ","يَوْمَ يُكْشَفُ عَن سَاقٖ وَيُدْعَوْنَ إِلَى اَ۬لسُّجُودِ فَلَا يَسْتَطِيعُونَۖ","خَٰشِعَةً اَبْصَٰرُهُمْ تَرْهَقُهُمْ ذِلَّةٞۖ وَقَدْ كَانُواْ يُدْعَوْنَ إِلَى اَ۬لسُّجُودِ وَهُمْ سَٰلِمُونَۖ","فَذَرْنِے وَمَنْ يُّكَذِّبُ بِهَٰذَا اَ۬لْحَدِيثِۖ سَنَسْتَدْرِجُهُم مِّنْ حَيْثُ لَا يَعْلَمُونَ","وَأُمْلِے لَهُمُۥٓۖ إِنَّ كَيْدِے مَتِينٌۖ","اَمْ تَسْـَٔلُهُمُۥٓ أَجْراٗ فَهُم مِّن مَّغْرَمٖ مُّثْقَلُونَۖ","أَمْ عِندَهُمُ اُ۬لْغَيْبُ فَهُمْ يَكْتُبُونَۖ","۞ فَاصْبِرْ لِحُكْمِ رَبِّكَ وَلَا تَكُن كَصَٰحِبِ اِ۬لْحُوتِ إِذْ نَاد۪ىٰ وَهُوَ مَكْظُومٞۖ","لَّوْلَآ أَن تَدَٰرَكَهُۥ نِعْمَةٞ مِّن رَّبِّهِۦ لَنُبِذَ بِالْعَرَآءِ وَهُوَ مَذْمُومٞۖ","فَاجْتَبٰ۪هُ رَبُّهُۥ فَجَعَلَهُۥ مِنَ اَ۬لصَّٰلِحِينَۖ","وَإِنْ يَّكَادُ اُ۬لذِينَ كَفَرُواْ لَيَزْلِقُونَكَ بِأَبْصٰ۪رِهِمْ لَمَّا سَمِعُواْ اُ۬لذِّكْرَ وَيَقُولُونَ إِنَّهُۥ لَمَجْنُونٞۖ","وَمَا هُوَ إِلَّا ذِكْرٞ لِّلْعَٰلَمِينَۖ"]],["الحاقة",["اَ۬لْحَآقَّةُ مَا اَ۬لْحَآقَّةُۖ","وَمَآ أَدْر۪يٰكَ مَا اَ۬لْحَآقَّةُۖ","كَذَّبَتْ ثَمُودُ وَعَادُۢ بِالْقَارِعَةِۖ","فَأَمَّا ثَمُودُ فَأُهْلِكُواْ بِالطَّاغِيَةِۖ","وَأَمَّا عَادٞ فَأُهْلِكُواْ بِرِيحٖ صَرْصَرٍ عَاتِيَةٖ","سَخَّرَهَا عَلَيْهِمْ سَبْعَ لَيَالٖ وَثَمَٰنِيَةَ أَيَّامٍ حُسُوماٗۖ فَتَرَى اَ۬لْقَوْمَ فِيهَا صَرْع۪ىٰ كَأَنَّهُمُۥٓ أَعْجَازُ نَخْلٍ خَاوِيَةٖۖ","فَهَلْ تَر۪ىٰ لَهُم مِّنۢ بَاقِيَةٖۖ","وَجَآءَ فِرْعَوْنُ وَمَن قَبْلَهُۥ وَالْمُوتَفِكَٰتُ بِالْخَاطِئَةِ","فَعَصَوْاْ رَسُولَ رَبِّهِمْ فَأَخَذَهُمُۥٓ أَخْذَةٗ رَّابِيَةًۖ","اِنَّا لَمَّا طَغَا اَ۬لْمَآءُ حَمَلْنَٰكُمْ فِے اِ۬لْجَارِيَةِ","لِنَجْعَلَهَا لَكُمْ تَذْكِرَةٗ وَتَعِيَهَآ أُذْنٞ وَٰعِيَةٞۖ","فَإِذَا نُفِخَ فِے اِ۬لصُّورِ نَفْخَةٞ وَٰحِدَةٞ","وَحُمِلَتِ اِ۬لَارْضُ وَالْجِبَالُ فَدُكَّتَا دَكَّةٗ وَٰحِدَةٗ","فَيَوْمَئِذٖ وَقَعَتِ اِ۬لْوَاقِعَةُ","وَانشَقَّتِ اِ۬لسَّمَآءُ فَهِيَ يَوْمَئِذٖ وَاهِيَةٞ","وَالْمَلَكُ عَلَىٰٓ أَرْجَآئِهَاۖ وَيَحْمِلُ عَرْشَ رَبِّكَ فَوْقَهُمْ يَوْمَئِذٖ ثَمَٰنِيَةٞ","يَوْمَئِذٖ تُعْرَضُونَ لَا تَخْف۪ىٰ مِنكُمْ خَافِيَةٞۖ","۞ فَأَمَّا مَنُ ا۟وتِيَ كِتَٰبَهُۥ بِيَمِينِهِۦ فَيَقُولُ هَآؤُمُ اُ۪قْرَءُواْ كِتَٰبِيَهْۖ","إِنِّے ظَنَنتُ أَنِّے مُلَٰقٍ حِسَابِيَهْۖ","فَهُوَ فِے عِيشَةٖ رَّاضِيَةٖ","فِے جَنَّةٍ عَالِيَةٖ","قُطُوفُهَا دَانِيَةٞۖ","كُلُواْ وَاشْرَبُواْۖ هَنِيٓـٔاَۢ بِمَآ أَسْلَفْتُمْ فِے اِ۬لَايَّامِ اِ۬لْخَالِيَةِۖ","وَأَمَّا مَنُ ا۟وتِيَ كِتَٰبَهُۥ بِشِمَالِهِۦ","فَيَقُولُ يَٰلَيْتَنِے لَمُ ا۟وتَ كِتَٰبِيَهْۖ","وَلَمَ اَدْرِ مَا حِسَابِيَهْۖ","يَٰلَيْتَهَا كَانَتِ اِ۬لْقَاضِيَةَ","مَآ أَغْن۪ىٰ عَنِّے مَالِيَهۖ","هَّلَكَ عَنِّے سُلْطَٰنِيَهْۖ","خُذُوهُ فَغُلُّوهُ","ثُمَّ اَ۬لْجَحِيمَ صَلُّوهُ","ثُمَّ فِے سِلْسِلَةٖ ذَرْعُهَا سَبْعُونَ ذِرَاعاٗ فَاسْلُكُوهُۖ","إِنَّهُۥ كَانَ لَا يُومِنُ بِاللَّهِ اِ۬لْعَظِيمِ","وَلَا يَحُضُّ عَلَىٰ طَعَامِ اِ۬لْمِسْكِينِۖ","فَلَيْسَ لَهُ اُ۬لْيَوْمَ هَٰهُنَا حَمِيمٞ","وَلَا طَعَامٌ اِلَّا مِنْ غِسْلِينٖ","لَّا يَاكُلُهُۥٓ إِلَّا اَ۬لْخَٰطِـُٔونَۖ","فَلَآ أُقْسِمُ بِمَا تُبْصِرُونَ","وَمَا لَا تُبْصِرُونَ","إِنَّهُۥ لَقَوْلُ رَسُولٖ كَرِيمٖ","وَمَا هُوَ بِقَوْلِ شَاعِرٖ قَلِيلاٗ مَّا تُومِنُونَ","وَلَا بِقَوْلِ كَاهِنٖۖ قَلِيلاٗ مَّا تَذَّكَّرُونَۖ","تَنزِيلٞ مِّن رَّبِّ اِ۬لْعَٰلَمِينَۖ","وَلَوْ تَقَوَّلَ عَلَيْنَا بَعْضَ اَ۬لَاقَاوِيلِ","لَأَخَذْنَا مِنْهُ بِالْيَمِينِ","ثُمَّ لَقَطَعْنَا مِنْهُ اُ۬لْوَتِينَ","فَمَا مِنكُم مِّنَ اَحَدٍ عَنْهُ حَٰجِزِينَۖ","وَإِنَّهُۥ لَتَذْكِرَةٞ لِّلْمُتَّقِينَۖ","وَإِنَّا لَنَعْلَمُ أَنَّ مِنكُم مُّكَذِّبِينَۖ","وَإِنَّهُۥ لَحَسْرَةٌ عَلَى اَ۬لْكٰ۪فِرِينَۖ","وَإِنَّهُۥ لَحَقُّ اُ۬لْيَقِينِۖ","فَسَبِّحْ بِاسْمِ رَبِّكَ اَ۬لْعَظِيمِۖ"]],["المعارج",["سَالَ سَآئِلُۢ بِعَذَابٖ وَاقِعٖ","لِّلْكٰ۪فِرِينَ لَيْسَ لَهُۥ دَافِعٞ","مِّنَ اَ۬للَّهِ ذِے اِ۬لْمَعَارِجِۖ","تَعْرُجُ اُ۬لْمَلَٰٓئِكَةُ وَالرُّوحُ إِلَيْهِ فِے يَوْمٖ كَانَ مِقْدَارُهُۥ خَمْسِينَ أَلْفَ سَنَةٖۖ","فَاصْبِرْ صَبْراٗ جَمِيلاًۖ","اِنَّهُمْ يَرَوْنَهُۥ بَعِيداٗ","وَنَر۪يٰهُ قَرِيباٗۖ","يَوْمَ تَكُونُ اُ۬لسَّمَآءُ كَالْمُهْلِ","وَتَكُونُ اُ۬لْجِبَالُ كَالْعِهْنِ","وَلَا يَسْـَٔلُ حَمِيمٌ حَمِيماٗ","يُبَصَّرُونَهُمْۖ يَوَدُّ اُ۬لْمُجْرِمُ لَوْ يَفْتَدِے مِنْ عَذَابِ يَوْمَئِذِۢ بِبَنِيهِ","وَصَٰحِبَتِهِۦ وَأَخِيهِ","وَفَصِيلَتِهِ اِ۬لتِے تُـْٔوِيهِ","وَمَن فِے اِ۬لَارْضِ جَمِيعاٗ ثُمَّ يُنجِيهِ","كَلَّآۖ إِنَّهَا لَظ۪ىٰ","نَزَّاعَةٞ لِّلشَّو۪ىٰ","تَدْعُواْ مَنَ اَدْبَرَ وَتَوَلّ۪ىٰ","وَجَمَعَ فَأَوْع۪ىٰٓۖ","إِنَّ اَ۬لِانسَٰنَ خُلِقَ هَلُوعاً","اِذَا مَسَّهُ اُ۬لشَّرُّ جَزُوعاٗ","وَإِذَا مَسَّهُ اُ۬لْخَيْرُ مَنُوعاً","اِلَّا اَ۬لْمُصَلِّينَ","اَ۬لذِينَ هُمْ عَلَىٰ صَلَاتِهِمْ دَآئِمُونَۖ","وَالذِينَ فِےٓ أَمْوَٰلِهِمْ حَقّٞ مَّعْلُومٞ","لِّلسَّآئِلِ وَالْمَحْرُومِۖ","وَالذِينَ يُصَدِّقُونَ بِيَوْمِ اِ۬لدِّينِۖ","وَالذِينَ هُم مِّنْ عَذَابِ رَبِّهِم مُّشْفِقُونَ","إِنَّ عَذَابَ رَبِّهِمْ غَيْرُ مَامُونٖۖ","وَالذِينَ هُمْ لِفُرُوجِهِمْ حَٰفِظُونَ","إِلَّا عَلَىٰٓ أَزْوَٰجِهِمُۥٓ أَوْ مَا مَلَكَتَ اَيْمَٰنُهُمْ فَإِنَّهُمْ غَيْرُ مَلُومِينَۖ","فَمَنِ اِ۪بْتَغ۪ىٰ وَرَآءَ ذَٰلِكَ فَأُوْلَٰٓئِكَ هُمُ اُ۬لْعَادُونَۖ","وَالذِينَ هُمْ لِأَمَٰنَٰتِهِمْ وَعَهْدِهِمْ رَٰعُونَۖ","وَالذِينَ هُم بِشَهَٰدَتِهِمْ قَآئِمُونَۖ","وَالذِينَ هُمْ عَلَىٰ صَلَاتِهِمْ يُحَافِظُونَ","أُوْلَٰٓئِكَ فِے جَنَّٰتٖ مُّكْرَمُونَۖ","فَمَالِ اِ۬لذِينَ كَفَرُواْ قِبَلَكَ مُهْطِعِينَ","عَنِ اِ۬لْيَمِينِ وَعَنِ اِ۬لشِّمَالِ عِزِينَۖ","أَيَطْمَعُ كُلُّ اُ۪مْرِےٕٖ مِّنْهُمُۥٓ أَنْ يُّدْخَلَ جَنَّةَ نَعِيمٖ","كَلَّآۖ إِنَّا خَلَقْنَٰهُم مِّمَّا يَعْلَمُونَۖ","۞ فَلَآ أُقْسِمُ بِرَبِّ اِ۬لْمَشَٰرِقِ وَالْمَغَٰرِبِ إِنَّا لَقَٰدِرُونَ","عَلَىٰٓ أَن نُّبَدِّلَ خَيْراٗ مِّنْهُمْ وَمَا نَحْنُ بِمَسْبُوقِينَۖ","فَذَرْهُمْ يَخُوضُواْ وَيَلْعَبُواْ حَتَّىٰ يُلَٰقُواْ يَوْمَهُمُ اُ۬لذِے يُوعَدُونَ","يَوْمَ يَخْرُجُونَ مِنَ اَ۬لَاجْدَاثِ سِرَاعاٗ كَأَنَّهُمُۥٓ إِلَىٰ نَصْبٖ يُوفِضُونَ","خَٰشِعَةً اَبْصَٰرُهُمْ تَرْهَقُهُمْ ذِلَّةٞۖ ذَٰلِكَ اَ۬لْيَوْمُ اُ۬لذِے كَانُواْ يُوعَدُونَۖ"]],["نوح",["إِنَّآ أَرْسَلْنَا نُوحاً اِلَىٰ قَوْمِهِۦٓ أَنَ اَنذِرْ قَوْمَكَ مِن قَبْلِ أَنْ يَّاتِيَهُمْ عَذَابٌ اَلِيمٞۖ","قَالَ يَٰقَوْمِ إِنِّے لَكُمْ نَذِيرٞ مُّبِينٌ","اَنُ اُ۟عْبُدُواْ اُ۬للَّهَ وَاتَّقُوهُ وَأَطِيعُونِ","يَغْفِرْ لَكُم مِّن ذُنُوبِكُمْ وَيُوَ۬خِّرْكُمُۥٓ إِلَىٰٓ أَجَلٖ مُّسَمّىًۖ اِنَّ أَجَلَ اَ۬للَّهِ إِذَا جَآءَ لَا يُوَ۬خَّرُ لَوْ كُنتُمْ تَعْلَمُونَۖ","قَالَ رَبِّ إِنِّے دَعَوْتُ قَوْمِے لَيْلاٗ وَنَهَاراٗ","فَلَمْ يَزِدْهُمْ دُعَآءِيَ إِلَّا فِرَاراٗۖ","وَإِنِّے كُلَّمَا دَعَوْتُهُمْ لِتَغْفِرَ لَهُمْ جَعَلُوٓاْ أَصَٰبِعَهُمْ فِےٓ ءَاذَانِهِمْ وَاسْتَغْشَوْاْ ثِيَابَهُمْ وَأَصَرُّواْ وَاسْتَكْبَرُواْ اُ۪سْتِكْبَاراٗۖ","ثُمَّ إِنِّے دَعَوْتُهُمْ جِهَاراٗۖ","ثُمَّ إِنِّيَ أَعْلَنتُ لَهُمْ وَأَسْرَرْتُ لَهُمُۥٓ إِسْرَاراٗ","فَقُلْتُ اُ۪سْتَغْفِرُواْ رَبَّكُمُۥٓ إِنَّهُۥ كَانَ غَفَّاراٗ","يُرْسِلِ اِ۬لسَّمَآءَ عَلَيْكُم مِّدْرَاراٗ","وَيُمْدِدْكُم بِأَمْوَٰلٖ وَبَنِينَ وَيَجْعَل لَّكُمْ جَنَّٰتٖ وَيَجْعَل لَّكُمُۥٓ أَنْهَٰراٗۖ","مَّا لَكُمْ لَا تَرْجُونَ لِلهِ وَقَاراٗ","وَقَدْ خَلَقَكُمُۥٓ أَطْوَاراًۖ","۞ اَلَمْ تَرَوْاْ كَيْفَ خَلَقَ اَ۬للَّهُ سَبْعَ سَمَٰوَٰتٖ طِبَاقاٗ","وَجَعَلَ اَ۬لْقَمَرَ فِيهِنَّ نُوراٗ وَجَعَلَ اَ۬لشَّمْسَ سِرَاجاٗۖ","وَاللَّهُ أَنۢبَتَكُم مِّنَ اَ۬لَارْضِ نَبَاتاٗ","ثُمَّ يُعِيدُكُمْ فِيهَا وَيُخْرِجُكُمُۥٓ إِخْرَاجاٗۖ","وَاللَّهُ جَعَلَ لَكُمُ اُ۬لَارْضَ بِسَاطاٗ","لِّتَسْلُكُواْ مِنْهَا سُبُلاٗ فِجَاجاٗۖ","قَالَ نُوحٞ رَّبِّ إِنَّهُمْ عَصَوْنِے وَاتَّبَعُواْ مَن لَّمْ يَزِدْهُ مَالُهُۥ وَوَلَدُهُۥٓ إِلَّا خَسَاراٗ","وَمَكَرُواْ مَكْراٗ كُبَّاراٗۖ","وَقَالُواْ لَا تَذَرُنَّ ءَالِهَتَكُمْ وَلَا تَذَرُنَّ وُدّاٗ وَلَا سُوَاعاٗ","وَلَا يَغُوثَ وَيَعُوقَ وَنَسْراٗۖ","وَقَدَ اَضَلُّواْ كَثِيراٗۖ وَلَا تَزِدِ اِ۬لظَّٰلِمِينَ إِلَّا ضَلَٰلاٗۖ","مِّمَّا خَطِيٓـَٰٔتِهِمُۥٓ أُغْرِقُواْ فَأُدْخِلُواْ نَاراٗ","فَلَمْ يَجِدُواْ لَهُم مِّن دُونِ اِ۬للَّهِ أَنصَاراٗۖ","وَقَالَ نُوحٞ رَّبِّ لَا تَذَرْ عَلَى اَ۬لَارْضِ مِنَ اَ۬لْكٰ۪فِرِينَ دَيَّاراًۖ","اِنَّكَ إِن تَذَرْهُمْ يُضِلُّواْ عِبَادَكَ وَلَا يَلِدُوٓاْ إِلَّا فَاجِراٗ كَفَّاراٗۖ","رَّبِّ اِ۪غْفِرْ لِے وَلِوَٰلِدَيَّ وَلِمَن دَخَلَ بَيْتِے مُومِناٗ وَلِلْمُومِنِينَ وَالْمُومِنَٰتِۖ وَلَا تَزِدِ اِ۬لظَّٰلِمِينَ إِلَّا تَبَاراٗۖ"]],["الجن",["قُلُ ا۟وحِيَ إِلَيَّ أَنَّهُ اُ۪سْتَمَعَ نَفَرٞ مِّنَ اَ۬لْجِنِّ فَقَالُوٓاْ إِنَّا سَمِعْنَا قُرْءَاناً عَجَباٗ","يَهْدِےٓ إِلَى اَ۬لرُّشْدِ فَـَٔامَنَّا بِهِۦ وَلَن نُّشْرِكَ بِرَبِّنَآ أَحَداٗۖ","وَإِنَّهُۥ تَعَٰل۪ىٰ جَدُّ رَبِّنَا مَا اَ۪تَّخَذَ صَٰحِبَةٗ وَلَا وَلَداٗۖ","وَإِنَّهُۥ كَانَ يَقُولُ سَفِيهُنَا عَلَى اَ۬للَّهِ شَطَطاٗۖ","وَإِنَّا ظَنَنَّآ أَن لَّن تَقُولَ اَ۬لِانسُ وَالْجِنُّ عَلَى اَ۬للَّهِ كَذِباٗۖ","وَإِنَّهُۥ كَانَ رِجَالٞ مِّنَ اَ۬لِانسِ يَعُوذُونَ بِرِجَالٖ مِّنَ اَ۬لْجِنِّ فَزَادُوهُمْ رَهَقاٗۖ","وَإِنَّهُمْ ظَنُّواْ كَمَا ظَنَنتُمُۥٓ أَن لَّنْ يَّبْعَثَ اَ۬للَّهُ أَحَداٗۖ","وَإِنَّا لَمَسْنَا اَ۬لسَّمَآءَ فَوَجَدْنَٰهَا مُلِئَتْ حَرَساٗ شَدِيداٗ وَشُهُباٗۖ","وَإِنَّا كُنَّا نَقْعُدُ مِنْهَا مَقَٰعِدَ لِلسَّمْعِ فَمَنْ يَّسْتَمِعِ اِ۬لَانَ يَجِدْ لَهُۥ شِهَاباٗ رَّصَداٗۖ","وَإِنَّا لَا نَدْرِےٓ أَشَرٌّ ا۟رِيدَ بِمَن فِے اِ۬لَارْضِ أَمَ اَرَادَ بِهِمْ رَبُّهُمْ رَشَداٗۖ","وَإِنَّا مِنَّا اَ۬لصَّٰلِحُونَ وَمِنَّا دُونَ ذَٰلِكَۖ كُنَّا طَرَآئِقَ قِدَداٗۖ","وَإِنَّا ظَنَنَّآ أَن لَّن نُّعْجِزَ اَ۬للَّهَ فِے اِ۬لَارْضِ وَلَن نُّعْجِزَهُۥ هَرَباٗۖ","وَإِنَّا لَمَّا سَمِعْنَا اَ۬لْهُد۪ىٰٓ ءَامَنَّا بِهِۦۖ فَمَنْ يُّومِنۢ بِرَبِّهِۦ فَلَا يَخَافُ بَخْساٗ وَلَا رَهَقاٗۖ","وَإِنَّا مِنَّا اَ۬لْمُسْلِمُونَ وَمِنَّا اَ۬لْقَٰسِطُونَۖ فَمَنَ اَسْلَمَ فَأُوْلَٰٓئِكَ تَحَرَّوْاْ رَشَداٗۖ","وَأَمَّا اَ۬لْقَٰسِطُونَ فَكَانُواْ لِجَهَنَّمَ حَطَباٗۖ","وَأَن لَّوِ اِ۪سْتَقَٰمُواْ عَلَى اَ۬لطَّرِيقَةِ لَأَسْقَيْنَٰهُم مَّآءً غَدَقاٗ","لِّنَفْتِنَهُمْ فِيهِۖ وَمَنْ يُّعْرِضْ عَن ذِكْرِ رَبِّهِۦ نَسْلُكْهُ عَذَاباٗ صَعَداٗۖ","وَأَنَّ اَ۬لْمَسَٰجِدَ لِلهِ فَلَا تَدْعُواْ مَعَ اَ۬للَّهِ أَحَداٗۖ","وَإِنَّهُۥ لَمَّا قَامَ عَبْدُ اُ۬للَّهِ يَدْعُوهُ كَادُواْ يَكُونُونَ عَلَيْهِ لِبَداٗۖ","قَالَ إِنَّمَآ أَدْعُواْ رَبِّے وَلَآ أُشْرِكُ بِهِۦٓ أَحَداٗۖ","قُلِ اِنِّے لَآ أَمْلِكُ لَكُمْ ضَرّاٗ وَلَا رَشَداٗۖ","قُلِ اِنِّے لَنْ يُّجِيرَنِے مِنَ اَ۬للَّهِ أَحَدٞ وَلَنَ اَجِدَ مِن دُونِهِۦ مُلْتَحَداً","اِلَّا بَلَٰغاٗ مِّنَ اَ۬للَّهِ وَرِسَٰلَٰتِهِۦۖ ۞ وَمَنْ يَّعْصِ اِ۬للَّهَ وَرَسُولَهُۥ فَإِنَّ لَهُۥ نَارَ جَهَنَّمَ خَٰلِدِينَ فِيهَآ أَبَداًۖ","حَتَّىٰٓ إِذَا رَأَوْاْ مَا يُوعَدُونَ فَسَيَعْلَمُونَ مَنَ اَضْعَفُ نَاصِراٗ وَأَقَلُّ عَدَداٗۖ","قُلِ اِنَ اَدْرِےٓ أَقَرِيبٞ مَّا تُوعَدُونَ أَمْ يَجْعَلُ لَهُۥ رَبِّيَ أَمَداًۖ","عَٰلِمُ اُ۬لْغَيْبِ فَلَا يُظْهِرُ عَلَىٰ غَيْبِهِۦٓ أَحَداً","اِلَّا مَنِ اِ۪رْتَض۪ىٰ مِن رَّسُولٖ فَإِنَّهُۥ يَسْلُكُ مِنۢ بَيْنِ يَدَيْهِ وَمِنْ خَلْفِهِۦ رَصَداٗ","لِّيَعْلَمَ أَن قَدَ اَبْلَغُواْ رِسَٰلَٰتِ رَبِّهِمْ وَأَحَاطَ بِمَا لَدَيْهِمْ وَأَحْص۪ىٰ كُلَّ شَےْءٍ عَدَداٗۖ"]],["المزمل",["يَٰٓأَيُّهَا اَ۬لْمُزَّمِّلُ قُمِ اِ۬ليْلَ إِلَّا قَلِيلاٗ","نِّصْفَهُۥٓ أَوُ اُ۟نقُصْ مِنْهُ قَلِيلاً","اَوْ زِدْ عَلَيْهِ وَرَتِّلِ اِ۬لْقُرْءَانَ تَرْتِيلاًۖ","اِنَّا سَنُلْقِے عَلَيْكَ قَوْلاٗ ثَقِيلاًۖ","اِنَّ نَاشِئَةَ اَ۬ليْلِ هِيَ أَشَدُّ وَطْـٔاٗ وَأَقْوَمُ قِيلاًۖ","اِنَّ لَكَ فِے اِ۬لنَّه۪ارِ سَبْحاٗ طَوِيلاٗۖ","وَاذْكُرِ اِ۪سْمَ رَبِّكَ وَتَبَتَّلِ اِلَيْهِ تَبْتِيلاٗۖ","رَّبُّ اُ۬لْمَشْرِقِ وَالْمَغْرِبِۖ لَآ إِلَٰهَ إِلَّا هُوَۖ فَاتَّخِذْهُ وَكِيلاٗۖ","وَاصْبِرْ عَلَىٰ مَا يَقُولُونَۖ وَاهْجُرْهُمْ هَجْراٗ جَمِيلاٗۖ","وَذَرْنِے وَالْمُكَذِّبِينَ أُوْلِے اِ۬لنَّعْمَةِ وَمَهِّلْهُمْ قَلِيلاًۖ","اِنَّ لَدَيْنَآ أَنكَالاٗ وَجَحِيماٗ","وَطَعَاماٗ ذَا غُصَّةٖ وَعَذَاباً اَلِيماٗ","يَوْمَ تَرْجُفُ اُ۬لَارْضُ وَالْجِبَالُ وَكَانَتِ اِ۬لْجِبَالُ كَثِيباٗ مَّهِيلاًۖ","اِنَّآ أَرْسَلْنَآ إِلَيْكُمْ رَسُولاٗ شَٰهِداً عَلَيْكُمْ كَمَآ أَرْسَلْنَآ إِلَىٰ فِرْعَوْنَ رَسُولاٗ","فَعَص۪ىٰ فِرْعَوْنُ اُ۬لرَّسُولَ فَأَخَذْنَٰهُ أَخْذاٗ وَبِيلاٗۖ","فَكَيْفَ تَتَّقُونَ إِن كَفَرْتُمْ يَوْماٗ يَجْعَلُ اُ۬لْوِلْدَٰنَ شِيباًۖ اِ۬لسَّمَآءُ مُنفَطِرُۢ بِهِۦۖ كَانَ وَعْدُهُۥ مَفْعُولاًۖ","اِنَّ هَٰذِهِۦ تَذْكِرَةٞۖ فَمَن شَآءَ اَ۪تَّخَذَ إِلَىٰ رَبِّهِۦ سَبِيلاًۖ","۞ اِنَّ رَبَّكَ يَعْلَمُ أَنَّكَ تَقُومُ أَدْن۪ىٰ مِن ثُلُثَيِ اِ۬ليْلِ وَنِصْفِهِۦ وَثُلُثِهِۦ وَطَآئِفَةٞ مِّنَ اَ۬لذِينَ مَعَكَۖ وَاللَّهُ يُقَدِّرُ اُ۬ليْلَ وَالنَّهَارَۖ عَلِمَ أَن لَّن تُحْصُوهُ فَتَابَ عَلَيْكُمْۖ فَاقْرَءُواْ مَا تَيَسَّرَ مِنَ اَ۬لْقُرْءَانِۖ عَلِمَ أَن سَيَكُونُ مِنكُم مَّرْض۪ىٰ وَءَاخَرُونَ يَضْرِبُونَ فِے اِ۬لَارْضِ يَبْتَغُونَ مِن فَضْلِ اِ۬للَّهِ وَءَاخَرُونَ يُقَٰتِلُونَ فِے سَبِيلِ اِ۬للَّهِۖ فَاقْرَءُواْ مَا تَيَسَّرَ مِنْهُۖ وَأَقِيمُواْ اُ۬لصَّلَوٰةَ وَءَاتُواْ اُ۬لزَّكَوٰةَۖ وَأَقْرِضُواْ اُ۬للَّهَ قَرْضاً حَسَناٗۖ وَمَا تُقَدِّمُواْ لِأَنفُسِكُم مِّنْ خَيْرٖ تَجِدُوهُ عِندَ اَ۬للَّهِ هُوَ خَيْراٗ وَأَعْظَمَ أَجْراٗۖ وَاسْتَغْفِرُواْ اُ۬للَّهَۖ إِنَّ اَ۬للَّهَ غَفُورٞ رَّحِيمٞۖ"]],["المدثر",["يَٰٓأَيُّهَا اَ۬لْمُدَّثِّرُ","قُمْ فَأَنذِرْۖ","وَرَبَّكَ فَكَبِّرْۖ","وَثِيَابَكَ فَطَهِّرْۖ","وَالرِّجْزَ فَاهْجُرْۖ","وَلَا تَمْنُن تَسْتَكْثِرُۖ","وَلِرَبِّكَ فَاصْبِرْۖ","فَإِذَا نُقِرَ فِے اِ۬لنَّاقُورِ","فَذَٰلِكَ يَوْمَئِذٖ يَوْمٌ عَسِيرٌ","عَلَى اَ۬لْكٰ۪فِرِينَ غَيْرُ يَسِيرٖۖ","ذَرْنِے وَمَنْ خَلَقْتُ وَحِيداٗ","وَجَعَلْتُ لَهُۥ مَالاٗ مَّمْدُوداٗ","وَبَنِينَ شُهُوداٗ","وَمَهَّدتُّ لَهُۥ تَمْهِيداٗ","ثُمَّ يَطْمَعُ أَنَ اَزِيدَ","كَلَّآۖ إِنَّهُۥ كَانَ لِأٓيَٰتِنَا عَنِيداٗۖ","سَأُرْهِقُهُۥ صَعُوداًۖ","اِنَّهُۥ فَكَّرَ وَقَدَّرَ","فَقُتِلَ كَيْفَ قَدَّرَ","ثُمَّ قُتِلَ كَيْفَ قَدَّرَ","ثُمَّ نَظَرَ","ثُمَّ عَبَسَ وَبَسَرَ","ثُمَّ أَدْبَرَ وَاسْتَكْبَرَ","فَقَالَ إِنْ هَٰذَآ إِلَّا سِحْرٞ يُوثَرُ","إِنْ هَٰذَآ إِلَّا قَوْلُ اُ۬لْبَشَرِۖ","سَأُصْلِيهِ سَقَرَۖ","وَمَآ أَدْر۪يٰكَ مَا سَقَرُۖ","لَا تُبْقِے وَلَا تَذَرُۖ","لَوَّاحَةٞ لِّلْبَشَرِۖ","عَلَيْهَا تِسْعَةَ عَشَرَۖ","۞ وَمَا جَعَلْنَآ أَصْحَٰبَ اَ۬لنّ۪ارِ إِلَّا مَلَٰٓئِكَةٗۖ وَمَا جَعَلْنَا عِدَّتَهُمُۥٓ إِلَّا فِتْنَةٗ لِّلذِينَ كَفَرُواْ لِيَسْتَيْقِنَ اَ۬لذِين
