<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>الطائر وحافظ القرآن</title>
<style>
@font-face{font-family:UW;src:url(data:font/woff2;base64,/*FONT_B64*/) format('woff2');font-display:swap}
:root{--sky:#5ec8ff;--yel:#ffd23f;--grn:#4cd97b;--org:#ff9f3f;--pur:#a06bff;--ink:#17335a;--card:#fffdf4}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;background:#9fd8ff;color:var(--ink);font-family:'Noto Naskh Arabic','Segoe UI',Tahoma,sans-serif;overflow:hidden;touch-action:none;user-select:none}
#c{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none}
.q{font-family:UW,serif}.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:10px;z-index:20;background:rgba(20,50,100,.35)}.overlay.on{display:flex}
.kcard{background:var(--card);border:4px solid var(--yel);border-radius:28px;padding:18px;max-width:720px;width:100%;max-height:94vh;overflow:auto;box-shadow:0 12px 40px #0004;text-align:center}
.kcard h1{margin:4px 0;color:#ff7a3d;font-size:2.1rem}.kcard h2{color:var(--ink)}.bigbird{font-size:4.5rem;animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-10px)}}
.kcard input,.tbody input[type=text],select,input{width:100%;padding:12px;border-radius:14px;border:2px solid #bcd9f5;font:inherit;font-size:1.05rem;background:#fff;color:var(--ink);user-select:text}
.kbtn{background:linear-gradient(#ffd23f,#ffae1f);color:#4a2b00;border:0;border-bottom:5px solid #d9860a;border-radius:20px;padding:12px 20px;font:inherit;font-weight:800;font-size:1.15rem;cursor:pointer;margin:6px;min-height:56px}.kbtn:active{transform:translateY(3px);border-bottom-width:2px}
.kbtn.big{font-size:1.4rem;padding:14px 30px;background:linear-gradient(#5be38a,#2fb85f);color:#05381a;border-bottom-color:#1d8c46}.kbtn.alt{background:linear-gradient(#9fd8ff,#5eb4ef);color:#06304f;border-bottom-color:#3b8bc4}.kbtn.good{background:linear-gradient(#5be38a,#2fb85f);border-bottom-color:#1d8c46;color:#05381a}.kbtn.bad{background:linear-gradient(#ff9c9c,#f26b6b);border-bottom-color:#c24444;color:#400}
.kbtn.opt{font-family:UW,serif}.kbtn.listen.off{opacity:.5}.kbtn.opt{flex:1;font-size:1.5rem;line-height:2;background:#fff;border:3px solid #bcd9f5;border-bottom-width:6px;color:var(--ink);font-weight:400;min-height:70px;margin:0}.kopt.good .kbtn.opt{background:#c9f7d8;border-color:#3dc972}.kopt.bad .kbtn.opt{background:#ffd7d7;border-color:#f26b6b}
.kopts{display:grid;gap:10px;margin-top:10px}.kopt{display:flex;gap:6px;align-items:stretch}.kopt>.kbtn.listen{margin:0;min-width:60px}
.khead{display:flex;justify-content:space-between;align-items:center;gap:8px;color:#e0671a;margin-bottom:6px}.khead span{color:#5a7aa3;font-size:.95rem}.x{background:none;border:0;font-size:1.5rem;cursor:pointer;color:#5a7aa3}
.say{font-size:1.2rem;font-weight:700;margin:6px}.ayah{font-family:UW,serif;font-size:2.3rem;line-height:2.3;margin:8px 0;padding:10px;background:#fff;border-radius:18px;border:2px dashed #cfe5fa}.ayah.small{font-size:1.7rem}.ayah.hid{visibility:hidden}.pc{opacity:.12;transition:opacity .4s}.pc.on{opacity:1}.pc.cur{color:#e0671a}
.krow{display:flex;flex-wrap:wrap;justify-content:center}.kfb{margin-top:10px;padding:12px;border-radius:18px;font-weight:800;font-size:1.3rem}.kfb.good{background:#d6f9e2}.kfb.bad{background:#ffe3d6}
.hint{color:#5a7aa3;font-size:.85rem}.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
#loading{position:fixed;inset:0;background:linear-gradient(#8fd5ff,#e8f7ff);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}#loading.off{display:none}#lbarw{width:min(320px,70vw);height:12px;border-radius:8px;background:#fff;overflow:hidden}#lbar{height:100%;width:0;background:linear-gradient(90deg,#ffd23f,#ff9f3f);transition:width .3s}
#hud{position:fixed;inset:0;pointer-events:none;display:none;z-index:5}#hud.on{display:block}
#top{position:absolute;top:calc(8px + env(safe-area-inset-top));left:8px;right:8px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.pill{background:#fffdf4ee;border:3px solid var(--yel);border-radius:22px;padding:5px 14px;font-weight:800;font-size:1.05rem;box-shadow:0 3px 8px #0003}#stats{display:flex;gap:6px;flex-wrap:wrap}
#seg{position:absolute;top:calc(58px + env(safe-area-inset-top));right:8px;max-width:70vw;font-size:.95rem}
#bTeach{pointer-events:auto;background:#fffdf4ee;border:3px solid var(--sky);border-radius:16px;font-size:1.3rem;padding:2px 12px;touch-action:none}
#prog{position:absolute;top:calc(100px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;gap:4px;flex-wrap:wrap;justify-content:center;max-width:90vw}#prog i{font-style:normal;background:#fffdf4cc;border:2px solid #cfe5fa;border-radius:12px;padding:0 7px;font-size:.8rem;font-weight:800}#prog i.done{background:#5be38a;border-color:#2fb85f}#prog i.cur{background:var(--yel);border-color:var(--org)}#dist{position:absolute;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);white-space:nowrap}
#compass{position:absolute;top:calc(100px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);text-align:center}#arrow{font-size:2.6rem;display:inline-block;filter:drop-shadow(0 2px 3px #0006)}#arrowt{font-size:.85rem;background:#fffdf4cc;border-radius:10px;padding:2px 8px;display:block}
#prompt{position:absolute;bottom:150px;left:50%;transform:translateX(-50%);background:#fffdf4;border:3px solid var(--org);border-radius:16px;padding:8px 16px;display:none;font-weight:800;max-width:92vw;text-align:center}#prompt.on{display:block}
#touchui{display:none}body.touch #touchui{display:block}.tb{position:absolute;pointer-events:auto;width:84px;height:84px;border-radius:50%;background:#fffdf4dd;border:4px solid var(--sky);font-size:2rem;display:flex;align-items:center;justify-content:center;touch-action:none;box-shadow:0 4px 10px #0004}
#bUp{right:calc(16px + env(safe-area-inset-right));bottom:calc(120px + env(safe-area-inset-bottom));background:#c9f7d8;border-color:var(--grn)}#bDown{right:calc(16px + env(safe-area-inset-right));bottom:calc(20px + env(safe-area-inset-bottom));background:#ffe0c2;border-color:var(--org)}#bBoost{right:112px;bottom:calc(20px + env(safe-area-inset-bottom));width:70px;height:70px}#bBoost.on{background:var(--yel)}#bAct{right:112px;bottom:calc(100px + env(safe-area-inset-bottom));width:70px;height:70px}#bAct.hot{background:var(--yel)}
#joy{position:absolute;width:120px;height:120px;border-radius:50%;border:4px solid #fffd;background:#ffffff40;display:none}#joy.on{display:block}#knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:#fffffff0;border:3px solid var(--sky)}
#hintkeys{position:absolute;bottom:8px;left:8px;font-size:.78rem;color:#14406b;background:#fffc;border-radius:8px;padding:2px 8px}body.touch #hintkeys{display:none}
#toast{position:fixed;top:24%;left:50%;transform:translateX(-50%);background:#fffdf4;border:3px solid var(--org);padding:10px 20px;border-radius:18px;z-index:40;opacity:0;pointer-events:none;transition:opacity .3s;max-width:90vw;text-align:center;font-weight:800}#toast.on{opacity:1}
#teacher{position:fixed;top:0;bottom:0;left:0;width:min(360px,92vw);background:#f4faffee;border-right:4px solid var(--sky);z-index:25;display:none;flex-direction:column;overflow:hidden}#teacher.on{display:flex}
.thead{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:var(--sky);color:#06304f}.ttabs{display:flex}.ttab{flex:1;padding:9px;border:0;background:#dff1ff;font:inherit;font-weight:700;cursor:pointer}.ttab.on{background:#fff;border-bottom:4px solid var(--org)}.tbody{padding:10px;overflow:auto;flex:1}.tbody label{display:block;margin:10px 0 4px;font-weight:700;font-size:.9rem}.tbody label.chk{display:flex;gap:8px;align-items:center;font-weight:400}.tbody label.chk input{width:auto}
.tbtn{background:var(--sky);border:0;border-radius:12px;padding:10px;font:inherit;font-weight:800;color:#06304f;cursor:pointer;width:100%;margin-top:6px}.tbtn.alt{background:#dff1ff}.tcur{font-size:1.5rem;line-height:2.1;background:#fff;border-radius:12px;padding:6px;text-align:center}
.stat{font-size:1.2rem;font-weight:800;text-align:center;margin:8px}.tr{display:flex;justify-content:space-between;gap:6px;padding:6px 4px;border-bottom:1px solid #d5e8f7;font-size:.9rem}.tr.good b{color:#1d9b4c}.tr.bad b{color:#d33}
body.tmode #hintkeys{left:370px}pre{white-space:pre-wrap;font-size:.75rem;direction:ltr;text-align:left;color:#555}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud"><div id="top"><div id="stats"><span class="pill">⭐ <span id="hs">0</span></span><span class="pill">💎 <span id="hg">0</span></span><span class="pill">📦 <span id="hc">0/5</span></span></div><button id="bTeach" title="اضغط مطولًا (أو T) لوضع المعلمة">👩‍🏫</button></div>
<div id="seg" class="pill"></div><div id="prog"></div><div id="dist" class="pill"></div>
<div id="hintkeys">الأسهم: يمين/يسار/أعلى/أسفل لتوجيه الطائر · T: المعلمة</div>
<div id="touchui"><div id="joy"><div id="knob"></div></div><div id="bUp" class="tb">⬆</div><div id="bDown" class="tb">⬇</div></div></div>
<div id="ov" class="overlay"></div><div id="title" class="overlay"></div><div id="err" class="overlay"></div><div id="teacher"></div><div id="toast"></div>
<div id="loading"><div class="bigbird" style="font-size:4rem">🐦</div><h1 style="color:#ff7a3d">الطائر وحافظ القرآن</h1><div id="lbarw"><div id="lbar"></div></div><div id="ltxt" class="hint">جارٍ التحميل…</div></div>
<script type="application/json" id="seg-data">/*SEG_JSON*/</script><script type="application/json" id="quran-data">/*DATA_JSON*/</script><script type="text/plain" id="quran-sha">/*DATA_SHA*/</script>
<script>/*MAIN_JS*/</script></body></html>
